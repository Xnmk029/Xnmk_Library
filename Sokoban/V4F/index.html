<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>风格化草地 · Stylized Grass Field (Dylearn-style Shader in Three.js)</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0e1410; height: 100%; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

  #ui {
    position: fixed; top: 14px; left: 14px; z-index: 10;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: #e8f2e4; user-select: none; pointer-events: none;
  }
  #title {
    font-size: 15px; font-weight: 700; letter-spacing: 1px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6);
  }
  #subtitle { font-size: 11px; opacity: .75; margin-top: 3px; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  #hint { font-size: 11px; opacity: .6; margin-top: 8px; line-height: 1.7; }

  #panel {
    position: fixed; right: 14px; top: 14px; z-index: 10;
    width: 210px; padding: 12px 14px;
    background: rgba(12, 22, 16, .68);
    border: 1px solid rgba(180, 220, 170, .18);
    border-radius: 10px; backdrop-filter: blur(6px);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: #dcead6; font-size: 12px; pointer-events: auto;
  }
  #panel h3 { margin: 0 0 10px; font-size: 12px; font-weight: 600; letter-spacing: .5px; color: #b6e39a; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 7px 0; gap: 8px; }
  .row label { opacity: .85; white-space: nowrap; }
  .row input[type=range] { flex: 1; accent-color: #8ecf6a; }
  .row .val { width: 30px; text-align: right; opacity: .7; font-variant-numeric: tabular-nums; }
  .btn {
    width: 100%; margin-top: 4px; padding: 6px 0; border-radius: 7px;
    border: 1px solid rgba(160, 210, 140, .35); background: rgba(80, 140, 70, .25);
    color: #ddf2d2; font-size: 12px; cursor: pointer; letter-spacing: .5px;
  }
  .btn:hover { background: rgba(100, 170, 85, .35); }
  .btn.on { background: rgba(120, 200, 90, .45); border-color: rgba(180, 240, 150, .6); }

  #loading {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: #10180f; color: #cfe8bf; font: 13px "Segoe UI", "Microsoft YaHei", sans-serif;
    letter-spacing: 2px;
  }
  #loading.hide { display: none; }
</style>
</head>
<body>
<div id="app"></div>

<div id="ui">
  <div id="title">风格化草地 · Stylized Grass Field</div>
  <div id="subtitle">Dylearn「Stylized Grass 3D Pixel Art」方案 · Three.js 移植</div>
  <div id="hint">
    WASD / 方向键 — 移动角色穿过草海<br>
    鼠标拖拽 — 环绕视角 &nbsp; 滚轮 — 缩放<br>
    P — 切换像素风渲染 &nbsp; R — 重置视角
  </div>
</div>

<div id="panel">
  <h3>Shader 参数面板</h3>
  <div class="row"><label>风力强度</label><input type="range" id="wind" min="0" max="2" step="0.01" value="1"><span class="val" id="windV">1.00</span></div>
  <div class="row"><label>定格动画 FPS</label><input type="range" id="fps" min="4" max="30" step="1" value="12"><span class="val" id="fpsV">12</span></div>
  <div class="row"><label>伪透视强度</label><input type="range" id="persp" min="0" max="1" step="0.01" value="0.3"><span class="val" id="perspV">0.30</span></div>
  <div class="row"><label>云影</label><input type="checkbox" id="clouds" checked></div>
  <button class="btn on" id="pixelBtn">像素风模式：开 (P)</button>
  <button class="btn" id="resetBtn">重置视角 (R)</button>
</div>

<div id="loading">正在加载 HDRI 环境贴图…</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
