<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>巴贝奇差分机 — 3D 机械结构演示 (Fable)</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --brass: #c9a227;
    --brass-bright: #e8c96a;
    --iron: #2b2b30;
    --panel-bg: rgba(16, 14, 11, 0.82);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0b09; }
  body { font-family: "Georgia", "Times New Roman", serif; color: #e8dcc0; }
  #scene-container { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---------- HUD (top-right) ---------- */
  #hud {
    position: fixed; top: 18px; right: 18px; z-index: 10;
    width: 264px;
    background: var(--panel-bg);
    border: 1px solid rgba(201, 162, 39, 0.55);
    border-radius: 10px;
    padding: 14px 16px 16px;
    backdrop-filter: blur(6px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(0,0,0,0.4);
    user-select: none;
  }
  #hud h1 {
    font-size: 13px; letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--brass-bright); text-align: center;
    border-bottom: 1px solid rgba(201,162,39,0.35);
    padding-bottom: 8px; margin-bottom: 4px;
    text-shadow: 0 0 12px rgba(232,201,106,0.35);
  }
  #hud .subtitle {
    font-size: 10px; font-style: italic; text-align: center;
    color: #9d8f6c; margin-bottom: 12px; letter-spacing: 0.5px;
  }
  .hud-section { margin-bottom: 12px; }
  .hud-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px;
    color: #9d8f6c; margin-bottom: 6px; display: flex; justify-content: space-between;
  }
  .hud-label span:last-child { color: var(--brass-bright); }

  button {
    font-family: inherit; cursor: pointer; width: 100%;
    background: linear-gradient(180deg, #3a3325 0%, #241f15 100%);
    color: #e8dcc0; border: 1px solid rgba(201,162,39,0.5);
    border-radius: 6px; padding: 8px 10px; font-size: 12px;
    letter-spacing: 1px; transition: all 0.18s ease;
  }
  button:hover {
    background: linear-gradient(180deg, #55492e 0%, #33291a 100%);
    border-color: var(--brass-bright);
    box-shadow: 0 0 12px rgba(201,162,39,0.35);
    color: #fff3d6;
  }
  button:active { transform: translateY(1px); }
  #btn-motor.running { border-color: #7fb069; color: #cfe8bf; }
  #btn-motor.running:hover { box-shadow: 0 0 12px rgba(127,176,105,0.4); }

  .preset-group { display: flex; flex-direction: column; gap: 6px; }
  .preset-group button { font-size: 11px; padding: 6px 8px; text-align: left; padding-left: 12px; }
  .preset-group button::before { content: "❖ "; color: var(--brass); }

  input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 4px;
    background: linear-gradient(90deg, #4a3d1f, var(--brass));
    border-radius: 2px; outline: none; margin-top: 2px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #f4e3a1, #a07d1c 70%, #6b520f);
    border: 1px solid #3a2e0a; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #f4e3a1, #a07d1c 70%, #6b520f);
    border: 1px solid #3a2e0a; cursor: pointer;

  #footer-hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 1px; color: rgba(232,220,192,0.45);
    z-index: 10; font-style: italic; pointer-events: none;
    text-align: center;
  }
  #loading {
    position: fixed; inset: 0; z-index: 20; display: flex;
    align-items: center; justify-content: center; flex-direction: column;
    background: #0d0b09; transition: opacity 0.6s ease; gap: 14px;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading .gear-spin {
    width: 46px; height: 46px; border: 4px dashed var(--brass);
    border-radius: 50%; animation: spin 2.4s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { font-size: 12px; letter-spacing: 3px; color: #9d8f6c; text-transform: uppercase; }
</style>

<body>
<div id="loading"><div class="gear-spin"></div><p>正在组装机械结构…</p></div>
<div id="scene-container"></div>

<div id="hud">
  <h1>巴贝奇差分机 (Difference Engine)</h1>

<script>
  // Watchdog: if the Three.js CDN import hasn't completed in 15 s, tell the user.
  setTimeout(() => {
    if (!window.__engineReady) {
      const p = document.querySelector('#loading p');
      if (p) p.textContent = 'Could not reach the Three.js CDN — check your network connection.';
      const spin = document.querySelector('#loading .gear-spin');
      if (spin) spin.style.animationPlayState = 'paused';
    }
  }, 15000);
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================================================================
   BABBAGE'S DIFFERENCE ENGINE — fully procedural Three.js model
   ================================================================ */

// ---------- Renderer / Scene / Camera ----------
const container = document.getElementById('scene-container');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0b09);
scene.fog = new THREE.Fog(0x0d0b09, 55, 130);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(24, 16, 30);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 8, 0);
controls.minDistance = 4;
controls.maxDistance = 90;
controls.maxPolarAngle = Math.PI * 0.52;

// ---------- Lighting: warm key / cool fill studio rig ----------
const keyLight = new THREE.DirectionalLight(0xffd9a0, 3.2);          // warm key
keyLight.position.set(18, 26, 14);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 2;
keyLight.shadow.camera.far = 80;
const sc = 26;
keyLight.shadow.camera.left = -sc; keyLight.shadow.camera.right = sc;
keyLight.shadow.camera.top = sc;   keyLight.shadow.camera.bottom = -sc;
keyLight.shadow.bias = -0.0006;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x7fa8d0, 0.85);        // cool fill
fillLight.position.set(-20, 12, -12);
scene.add(fillLight);

const rimLight = new THREE.SpotLight(0xffe8c0, 220, 70, Math.PI / 5, 0.45, 1.6);
rimLight.position.set(-8, 30, 22);
rimLight.target.position.set(0, 8, 0);
scene.add(rimLight, rimLight.target);

scene.add(new THREE.HemisphereLight(0x4a5a70, 0x1a1208, 0.55));
scene.add(new THREE.AmbientLight(0x33291f, 0.5));

const gearGlow = new THREE.PointLight(0xffb35c, 26, 22, 1.8);        // warm lantern glow inside mechanism
gearGlow.position.set(0, 9, 2.5);
scene.add(gearGlow);

// ---------- Floor: dark polished slab + glowing grid ----------
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x14100c, metalness: 0.35, roughness: 0.55,
});
const floor = new THREE.Mesh(new THREE.CircleGeometry(70, 72), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.02;
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.GridHelper(140, 70, 0xc9a227, 0x3a2f14);
grid.material.transparent = true;
grid.material.opacity = 0.32;
grid.material.blending = THREE.AdditiveBlending;
grid.material.depthWrite = false;
grid.position.y = 0.0;
scene.add(grid);

const gridGlow = new THREE.Mesh(
  new THREE.CircleGeometry(34, 64),
  new THREE.MeshBasicMaterial({
    color: 0xc9a227, transparent: true, opacity: 0.05,
    blending: THREE.AdditiveBlending, depthWrite: false,
  })
);
gridGlow.rotation.x = -Math.PI / 2;
gridGlow.position.y = 0.01;
scene.add(gridGlow);

// ---------- Procedural textures ----------
function makeWoodTexture() {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 512;
  const g = cv.getContext('2d');
  g.fillStyle = '#3b1f12';
  g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 140; i++) {                       // mahogany grain streaks
    const y = Math.random() * 512;
    const w = 0.6 + Math.random() * 2.4;
    const shade = Math.random();
    g.strokeStyle = shade > 0.5
      ? `rgba(${90 + Math.random() * 40 | 0}, ${42 + Math.random() * 18 | 0}, ${20 + Math.random() * 10 | 0}, 0.35)`
      : `rgba(20, 8, 4, 0.30)`;
    g.lineWidth = w;
    g.beginPath();
    g.moveTo(0, y);
    for (let x = 0; x <= 512; x += 32) {
      g.lineTo(x, y + Math.sin(x * 0.02 + i) * 4 + (Math.random() - 0.5) * 3);
    }
    g.stroke();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

function makeDigitStripTexture() {                      // engraved digits 0–9 around each drum
  const cv = document.createElement('canvas');
  cv.width = 1024; cv.height = 128;
  const g = cv.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 128);
  grad.addColorStop(0, '#151310');
  grad.addColorStop(0.5, '#26211a');
  grad.addColorStop(1, '#151310');
  g.fillStyle = grad;
  g.fillRect(0, 0, 1024, 128);
  g.strokeStyle = 'rgba(201,162,39,0.55)';
  g.lineWidth = 3;
  for (let i = 0; i < 10; i++) {                        // divider grooves between digit cells
    g.beginPath();
    g.moveTo(i * 102.4, 0); g.lineTo(i * 102.4, 128);
    g.stroke();
  }
  g.font = 'bold 74px Georgia, serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let i = 0; i < 10; i++) {
    const x = i * 102.4 + 51.2;
    g.fillStyle = 'rgba(0,0,0,0.85)';                   // engraved shadow pass
    g.fillText(String(i), x + 2, 68);
    g.fillStyle = '#e8c96a';                            // brass-inlay face
    g.fillText(String(i), x, 64);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

// ---------- Materials ----------
const M = {
  brass: new THREE.MeshStandardMaterial({ color: 0xc9a227, metalness: 0.85, roughness: 0.25 }),
  brassBright: new THREE.MeshStandardMaterial({ color: 0xe0b940, metalness: 0.9, roughness: 0.18 }),
  brassDark: new THREE.MeshStandardMaterial({ color: 0x8a6d1c, metalness: 0.85, roughness: 0.32 }),
  steel: new THREE.MeshStandardMaterial({ color: 0x4a4d52, metalness: 0.9, roughness: 0.4 }),
  iron: new THREE.MeshStandardMaterial({ color: 0x26262b, metalness: 0.9, roughness: 0.42 }),
  wood: new THREE.MeshStandardMaterial({ map: makeWoodTexture(), color: 0xa06a45, metalness: 0.08, roughness: 0.62 }),
  drumFace: new THREE.MeshStandardMaterial({ map: makeDigitStripTexture(), color: 0xffffff, metalness: 0.55, roughness: 0.45 }),
};

/* ================================================================
   PROCEDURAL COMPONENT BUILDERS
   ================================================================ */

const geoCache = new Map();

// Spur gear: toothed outer profile extruded, with open spokes (real holes)
function makeSpurGearGeometry(radius, teeth, thickness, opts = {}) {
  const key = `gear|${radius}|${teeth}|${thickness}|${JSON.stringify(opts)}`;
  if (geoCache.has(key)) return geoCache.get(key);

  const toothDepth = opts.toothDepth ?? radius * 0.16;
  const hubR = opts.hubR ?? radius * 0.22;
  const rimR = opts.rimR ?? radius * 0.62;          // inner edge of toothed rim
  const spokes = opts.spokes ?? 5;
  const spokeW = opts.spokeW ?? radius * 0.13;

  const shape = new THREE.Shape();
  const stepsPerTooth = 4;
  const total = teeth * stepsPerTooth;
  for (let i = 0; i <= total; i++) {
    const a = (i / total) * Math.PI * 2;
    const phase = i % stepsPerTooth;
    // trapezoidal tooth profile: root, flank, tip, flank
    const r = (phase === 1 || phase === 2) ? radius + toothDepth : radius;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    if (i === 0) shape.moveTo(x, y); else shape.lineTo(x, y);
  }

  // open windows between hub and rim → spoked wheel
  for (let s = 0; s < spokes; s++) {
    const a0 = (s / spokes) * Math.PI * 2;
    const a1 = ((s + 1) / spokes) * Math.PI * 2;
    const halfGap = (spokeW / 2) / rimR + 0.03;
    const start = a0 + (spokeW / 2) / hubR + 0.10;
    const end = a1 - (spokeW / 2) / hubR - 0.10;
    if (end - start < 0.15) continue;
    const hole = new THREE.Path();
    const seg = 10;
    for (let i = 0; i <= seg; i++) {                 // outer arc (inside rim)
      const a = start + ((end - start) * i) / seg;
      const rr = rimR - halfGap * 0;
      if (i === 0) hole.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
      else hole.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    for (let i = seg; i >= 0; i--) {                 // back along hub circle
      const a = start + ((end - start) * i) / seg;
      hole.lineTo(Math.cos(a) * (hubR + 0.05), Math.sin(a) * (hubR + 0.05));
    }
    hole.closePath();
    shape.holes.push(hole);
  }

  const axle = new THREE.Path();                     // center axle bore
  axle.absarc(0, 0, hubR * 0.45, 0, Math.PI * 2, true);
  shape.holes.push(axle);

  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: thickness, bevelEnabled: true,
    bevelThickness: thickness * 0.08, bevelSize: thickness * 0.06, bevelSegments: 1,
  });
  geo.translate(0, 0, -thickness / 2);
  geo.rotateX(Math.PI / 2);                          // lie flat: axis = Y
  geoCache.set(key, geo);
  return geo;
}

// Bevel gear: cone frustum with tilted teeth around the slope
function makeBevelGear(radius, teeth, mat) {
  const grp = new THREE.Group();
  const h = radius * 0.55;
  const body = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.55, radius, h, 28), mat);
  body.castShadow = true;
  grp.add(body);
  const toothGeo = new THREE.BoxGeometry(radius * 0.22, h * 0.9, radius * 0.28);
  for (let i = 0; i < teeth; i++) {
    const a = (i / teeth) * Math.PI * 2;
    const t = new THREE.Mesh(toothGeo, mat);
    const rr = radius * 0.82;
    t.position.set(Math.cos(a) * rr, 0, Math.sin(a) * rr);
    t.rotation.y = -a;
    t.rotation.z = 0.42;                             // tilt along cone slope
    t.castShadow = true;
    grp.add(t);
  }
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.3, radius * 0.3, h * 1.5, 20), M.steel);
  hub.castShadow = true;
  grp.add(hub);
  return grp;
}

// Number drum: digit-band cylinder + brass border rings + radial notches
function makeNumberDrum(radius, height) {
  const grp = new THREE.Group();
  const band = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, height * 0.66, 40, 1, true), M.drumFace);
  band.castShadow = true;
  grp.add(band);

  const capGeo = new THREE.CylinderGeometry(radius * 1.06, radius * 1.06, height * 0.14, 40);
  const capT = new THREE.Mesh(capGeo, M.brass);
  capT.position.y = height * 0.40;
  const capB = capT.clone();
  capB.position.y = -height * 0.40;
  capT.castShadow = capB.castShadow = true;
  grp.add(capT, capB);

  const grooveGeo = new THREE.TorusGeometry(radius * 1.062, height * 0.018, 8, 48);
  for (const y of [height * 0.33, -height * 0.33]) {  // engraved indicator grooves
    const groove = new THREE.Mesh(grooveGeo, M.brassDark);
    groove.rotation.x = Math.PI / 2;
    groove.position.y = y;
    grp.add(groove);
  }

  const notchGeo = new THREE.BoxGeometry(0.055, height * 0.15, 0.09);
  for (let i = 0; i < 10; i++) {                      // 10 index notches on top cap
    const a = (i / 10) * Math.PI * 2;
    const n = new THREE.Mesh(notchGeo, M.brassBright);
    n.position.set(Math.cos(a) * radius * 1.06, height * 0.40, Math.sin(a) * radius * 1.06);
    n.rotation.y = -a;
    grp.add(n);
  }
  const core = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.94, radius * 0.94, height * 0.7, 24), M.iron);
  grp.add(core);
  return grp;
}

// Ratchet wheel: sawtooth profile disc + sprung pawl resting on it
function makeRatchet(radius, teeth, thickness) {
  const key = `ratchet|${radius}|${teeth}|${thickness}`;
  let geo = geoCache.get(key);
  if (!geo) {
    const shape = new THREE.Shape();
    for (let i = 0; i < teeth; i++) {
      const a0 = (i / teeth) * Math.PI * 2;
      const a1 = ((i + 1) / teeth) * Math.PI * 2;
      const rOut = radius, rIn = radius * 0.78;
      if (i === 0) shape.moveTo(Math.cos(a0) * rOut, Math.sin(a0) * rOut);
      shape.lineTo(Math.cos(a1) * rIn, Math.sin(a1) * rIn);   // long sloped face
      shape.lineTo(Math.cos(a1) * rOut, Math.sin(a1) * rOut); // sharp radial face
    }
    shape.closePath();
    const bore = new THREE.Path();
    bore.absarc(0, 0, radius * 0.2, 0, Math.PI * 2, true);
    shape.holes.push(bore);
    geo = new THREE.ExtrudeGeometry(shape, { depth: thickness, bevelEnabled: false });
    geo.translate(0, 0, -thickness / 2);
    geo.rotateX(Math.PI / 2);
    geoCache.set(key, geo);
  }
  const wheel = new THREE.Mesh(geo, M.brassBright);
  wheel.castShadow = true;
  return wheel;
}

// Rivet stud (instanced later where needed)
const rivetGeo = new THREE.SphereGeometry(0.09, 10, 8, 0, Math.PI * 2, 0, Math.PI / 2);

function addRivetRow(parent, from, to, count, mat = M.steel) {
  for (let i = 0; i < count; i++) {
    const t = count === 1 ? 0.5 : i / (count - 1);
    const r = new THREE.Mesh(rivetGeo, mat);
    r.position.lerpVectors(from, to, t);
    parent.add(r);
  }
}

/* ================================================================
   ENGINE ASSEMBLY
   ================================================================ */

const engine = new THREE.Group();
scene.add(engine);

const spinners = [];   // { obj, rate }  — continuous rotation about local Y
const steppers = [];   // { obj, level, dir, phase } — indexed drum motion
const pawls = [];      // rocking ratchet pawls

const COLS = 4;
const COL_SPACING = 4.2;
const colX = i => (i - (COLS - 1) / 2) * COL_SPACING;

// ---- Mahogany base platform (two stacked slabs + brass trim) ----
const baseW = COLS * COL_SPACING + 7, baseD = 9, baseH = 1.1;
const slab1 = new THREE.Mesh(new THREE.BoxGeometry(baseW, baseH, baseD), M.wood);
slab1.position.y = baseH / 2;
const slab2 = new THREE.Mesh(new THREE.BoxGeometry(baseW - 1.6, baseH * 0.75, baseD - 1.4), M.wood);
slab2.position.y = baseH + (baseH * 0.75) / 2;
slab1.receiveShadow = slab2.receiveShadow = true;
slab1.castShadow = slab2.castShadow = true;
engine.add(slab1, slab2);

const trim = new THREE.Mesh(new THREE.BoxGeometry(baseW + 0.25, 0.16, baseD + 0.25), M.brass);
trim.position.y = baseH;
trim.castShadow = true;
engine.add(trim);

const baseTop = baseH * 1.75;

// ---- Cast-iron support pillars (6) with plinth, flutes and capital ----
function makePillar(height) {
  const g = new THREE.Group();
  const plinth = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.35, 1.3), M.iron);
  plinth.position.y = 0.175;
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.44, height - 1.0, 18), M.iron);
  shaft.position.y = height / 2;
  const cap = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.32, 1.15), M.iron);
  cap.position.y = height - 0.16;
  const collarGeo = new THREE.TorusGeometry(0.42, 0.07, 10, 24);
  g.add(plinth, shaft, cap);
  for (const yy of [0.55, height - 0.55]) {
    const c = new THREE.Mesh(collarGeo, M.brass);
    c.rotation.x = Math.PI / 2;
    c.position.y = yy;
    g.add(c);
  }
  g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return g;
}

const PILLAR_H = 13.5;
const pillarPos = [];
for (const px of [-baseW / 2 + 1.5, 0, baseW / 2 - 1.5])
  for (const pz of [-baseD / 2 + 1.4, baseD / 2 - 1.4]) pillarPos.push([px, pz]);
for (const [px, pz] of pillarPos) {
  const p = makePillar(PILLAR_H);
  p.position.set(px, baseTop, pz);
  engine.add(p);
  addRivetRow(engine,
    new THREE.Vector3(px - 0.5, baseTop + 0.37, pz - 0.5),
    new THREE.Vector3(px + 0.5, baseTop + 0.37, pz - 0.5), 3, M.steel);
}

// ---- Horizontal brass crossbars tying the pillars together ----
function crossbar(x1, z1, x2, z2, y, thick = 0.3) {
  const len = Math.hypot(x2 - x1, z2 - z1);
  const bar = new THREE.Mesh(new THREE.BoxGeometry(len, thick, thick * 1.4), M.brass);
  bar.position.set((x1 + x2) / 2, y, (z1 + z2) / 2);
  bar.rotation.y = -Math.atan2(z2 - z1, x2 - x1);
  bar.castShadow = true;
  engine.add(bar);
}
for (const zz of [-baseD / 2 + 1.4, baseD / 2 - 1.4]) {
  crossbar(-baseW / 2 + 1.5, zz, baseW / 2 - 1.5, zz, baseTop + PILLAR_H - 0.16, 0.34); // top rails
  crossbar(-baseW / 2 + 1.5, zz, baseW / 2 - 1.5, zz, baseTop + 5.5, 0.26);             // mid rails (between drum rows)
}
for (const xx of [-baseW / 2 + 1.5, 0, baseW / 2 - 1.5]) {
  crossbar(xx, -baseD / 2 + 1.4, xx, baseD / 2 - 1.4, baseTop + PILLAR_H - 0.16, 0.3);  // end ties
}

// ---- Vertical calculation columns ----
const LINK_LEVELS = [3.1, 8.6];          // heights (rel. to baseTop) of big meshing gears
const bigR = 2.06;                        // meshes with neighbour: 2×outer ≥ spacing
const smallR = 1.35;
const drumR = 1.28;

for (let c = 0; c < COLS; c++) {
  const colGroup = new THREE.Group();
  colGroup.position.set(colX(c), baseTop, 0);
  engine.add(colGroup);

  const dir = (c % 2 === 0) ? 1 : -1;    // alternating rotation direction

  // main vertical shaft
  const shaftH = PILLAR_H - 0.6;
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, shaftH, 14), M.steel);
  shaft.position.y = shaftH / 2 + 0.2;
  shaft.castShadow = true;

  const rotor = new THREE.Group();       // everything locked to the shaft
  rotor.add(shaft);
  rotor.rotation.y = dir === 1 ? 0 : Math.PI / 22;   // half-tooth offset so meshes interleave
  colGroup.add(rotor);
  spinners.push({ obj: rotor, rate: 0.5 * dir });

  // bearing blocks tying shaft to mid/top rails (static)
  for (const yy of [5.5, PILLAR_H - 0.16]) {
    const brg = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.4, 0.8), M.iron);
    brg.position.y = yy;
    brg.castShadow = true;
    colGroup.add(brg);
  }

  // big linking spur gears (mesh with neighbouring column)
  for (const ly of LINK_LEVELS) {
    const gear = new THREE.Mesh(
      makeSpurGearGeometry(bigR - 0.32, 22, 0.42, { toothDepth: 0.34, spokes: 6 }),
      M.brass);
    gear.position.y = ly;
    gear.castShadow = true;
    rotor.add(gear);
  }

  // small auxiliary gears
  for (const sy of [1.35, 6.0, 11.2]) {
    const gear = new THREE.Mesh(
      makeSpurGearGeometry(smallR, 16, 0.34, { toothDepth: 0.24, spokes: 4 }),
      M.brassDark);
    gear.position.y = sy;
    gear.castShadow = true;
    rotor.add(gear);
  }

  // ratchet wheel + pawl near the top
  const ratchet = makeRatchet(1.05, 18, 0.28);
  ratchet.position.y = 12.1;
  rotor.add(ratchet);
  const pawl = new THREE.Group();
  const arm = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.14, 0.2), M.steel);
  arm.position.x = -0.55;
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.3, 8), M.brassBright);
  tip.rotation.z = Math.PI / 2;
  tip.position.x = -1.12;
  pawl.add(arm, tip);
  pawl.position.set(1.85, 12.1, 0.55);
  pawl.rotation.y = 0.5;
  colGroup.add(pawl);
  pawls.push({ obj: pawl, phase: c * 0.13 });

  // stacked number drums (independent stepped indexing)
  const drumYs = [2.1, 4.35, 7.3, 9.85];
  drumYs.forEach((dy, level) => {
    const drum = makeNumberDrum(drumR, 1.7);
    drum.position.y = dy;
    colGroup.add(drum);
    steppers.push({ obj: drum, level, dir, phase: c * 0.25 + level * 0.11 });
  });
}

// ---- Main drive: horizontal crank shaft + bevel couplings + hand crank ----
const DRIVE_Y = baseTop + 0.95;
const DRIVE_Z = 2.9;                                   // runs along the front
const driveGroup = new THREE.Group();
engine.add(driveGroup);

const driveLen = baseW - 1.4;
const driveRotor = new THREE.Group();                  // spins about X
driveRotor.position.set(0, DRIVE_Y, DRIVE_Z);
driveGroup.add(driveRotor);

const driveShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, driveLen, 14), M.steel);
driveShaft.rotation.z = Math.PI / 2;                   // axis → X
driveShaft.castShadow = true;
driveRotor.add(driveShaft);

// pillow-block bearings holding the drive shaft (static)
for (const bx of [-driveLen / 2 + 0.7, -COL_SPACING, COL_SPACING, driveLen / 2 - 0.7]) {
  const blk = new THREE.Group();
  const seat = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.55, 0.9), M.iron);
  seat.position.y = -0.45;
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.1, 10, 20), M.brassDark);
  ring.rotation.y = Math.PI / 2;
  blk.add(seat, ring);
  blk.position.set(bx, DRIVE_Y, DRIVE_Z);
  blk.traverse(o => { if (o.isMesh) o.castShadow = true; });
  driveGroup.add(blk);
}

// spoked flywheel on the drive shaft
const flywheel = new THREE.Mesh(
  makeSpurGearGeometry(1.5, 26, 0.3, { toothDepth: 0.14, spokes: 6, hubR: 0.32 }),
  M.brass);
flywheel.rotation.z = Math.PI / 2;                     // gear axis → X
flywheel.position.x = -driveLen / 2 + 1.7;
flywheel.castShadow = true;
driveRotor.add(flywheel);

// bevel gear pairs: one on the drive shaft + one at each column foot
for (let c = 0; c < COLS; c++) {
  const bevH = makeBevelGear(0.85, 14, M.brass);       // on horizontal shaft
  bevH.rotation.z = Math.PI / 2;                       // cone axis → X
  bevH.position.x = colX(c);
  driveRotor.add(bevH);

  const bevV = makeBevelGear(0.85, 14, M.brassDark);   // on vertical column stub
  bevV.rotation.x = Math.PI;                           // cone points down, meets bevH
  bevV.position.set(colX(c), DRIVE_Y + 0.78, DRIVE_Z);
  driveGroup.add(bevV);
  spinners.push({ obj: bevV, rate: (c % 2 === 0 ? 1 : -1) * 1.0 });

  // slim transfer shaft from bevel up into the column stack
  const link = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 2.2, 10), M.steel);
  link.position.set(colX(c), DRIVE_Y + 1.85, DRIVE_Z);
  link.castShadow = true;
  driveGroup.add(link);
}

// hand crank on the right-hand end
const crank = new THREE.Group();
const crankArm = new THREE.Mesh(new THREE.BoxGeometry(0.32, 1.9, 0.24), M.iron);
crankArm.position.y = -0.8;
const crankBoss = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.4, 16), M.brass);
crankBoss.rotation.z = Math.PI / 2;
const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 1.1, 12), M.wood);
handle.rotation.z = Math.PI / 2;
handle.position.set(0.62, -1.62, 0);
const handleCap = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 10), M.brassBright);
handleCap.position.set(1.18, -1.62, 0);
crank.add(crankArm, crankBoss, handle, handleCap);
crank.position.x = driveLen / 2 + 0.25;
crank.traverse(o => { if (o.isMesh) o.castShadow = true; });
driveRotor.add(crank);

// decorative brass finials on the column tops
for (let c = 0; c < COLS; c++) {
  const fin = new THREE.Mesh(new THREE.SphereGeometry(0.34, 16, 12), M.brassBright);
  fin.position.set(colX(c), baseTop + PILLAR_H + 0.25, 0);
  fin.castShadow = true;
  engine.add(fin);
}

// nameplate on the base front
const plate = new THREE.Mesh(new THREE.BoxGeometry(6.4, 0.9, 0.1), M.brass);
plate.position.set(0, baseH * 1.05, baseD / 2 + 0.06);
engine.add(plate);

/* ================================================================
   ANIMATION, UI & RENDER LOOP
   ================================================================ */

const sim = { running: true, speed: 1.0, time: 0 };    // simulation clock (pausable)
const clock = new THREE.Clock();

// Stepped indexing: dwell, then a quick snap with slight mechanical overshoot
function steppedRevs(u) {
  const n = Math.floor(u);
  const f = u - n;
  const SNAP_START = 0.72;
  if (f < SNAP_START) return n;
  let t = (f - SNAP_START) / (1 - SNAP_START);
  const s = 1.7;                                       // easeOutBack → ratchet overshoot & settle
  t -= 1;
  return n + (t * t * ((s + 1) * t + s) + 1);
}

const DRIVE_RATE = 1.15;                               // rad/s at speed 1×

function updateMechanism(dt) {
  sim.time += dt;
  const angle = sim.time * DRIVE_RATE;

  driveRotor.rotation.x = angle;                       // main horizontal crank shaft

  for (const s of spinners) s.obj.rotation.y = angle * s.rate;

  // drums: each level indexes in tenth-turns, cascading phase like a carry ripple
  for (const st of steppers) {
    const u = angle * 0.18 / (1 + st.level * 0.5) + st.phase;
    st.obj.rotation.y = st.dir * steppedRevs(u) * (Math.PI * 2 / 10);
  }

  // pawls rock as ratchet teeth slide beneath them
  for (const p of pawls) {
    const f = (angle * 0.9 + p.phase * Math.PI * 2) % (Math.PI * 2 / 18);
    p.obj.rotation.z = 0.06 * Math.abs(Math.sin(f * 9)) + 0.02;
  }

  gearGlow.intensity = 24 + Math.sin(sim.time * 2.3) * 3;   // subtle lantern flicker
}

// ---------- Camera preset tweens ----------
const camTween = { active: false, t: 0, dur: 1.6,
  fromPos: new THREE.Vector3(), toPos: new THREE.Vector3(),
  fromTgt: new THREE.Vector3(), toTgt: new THREE.Vector3() };

function flyTo(pos, tgt) {
  camTween.fromPos.copy(camera.position);
  camTween.toPos.set(...pos);
  camTween.fromTgt.copy(controls.target);
  camTween.toTgt.set(...tgt);
  camTween.t = 0;
  camTween.active = true;
}
const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function updateCamTween(dt) {
  if (!camTween.active) return;
  camTween.t = Math.min(1, camTween.t + dt / camTween.dur);
  const k = easeInOut(camTween.t);
  camera.position.lerpVectors(camTween.fromPos, camTween.toPos, k);
  controls.target.lerpVectors(camTween.fromTgt, camTween.toTgt, k);
  if (camTween.t >= 1) camTween.active = false;
}
controls.addEventListener('start', () => { camTween.active = false; });

// ---------- HUD wiring ----------
const btnMotor = document.getElementById('btn-motor');
btnMotor.addEventListener('click', () => {
  sim.running = !sim.running;
  btnMotor.classList.toggle('running', sim.running);
  btnMotor.innerHTML = sim.running ? '⏸ &nbsp;Pause Motor' : '▶ &nbsp;启动电机';
});

const slider = document.getElementById('speed-slider');
const readout = document.getElementById('speed-readout');
slider.addEventListener('input', () => {
  sim.speed = parseFloat(slider.value);
  readout.textContent = sim.speed.toFixed(2).replace(/0$/, '') + '×';
});

document.getElementById('preset-full').addEventListener('click',
  () => flyTo([24, 16, 30], [0, 8, 0]));
document.getElementById('preset-gears').addEventListener('click',
  () => flyTo([colX(1) + 4.2, baseTop + 3.4, 7.2], [colX(1) + 1.0, baseTop + 3.1, 0]));
document.getElementById('preset-top').addEventListener('click',
  () => flyTo([0.001, 46, 6], [0, 6, 0]));

// ---------- Resize ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- Main loop ----------
function animate() {
  requestAnimationFrame(animate);
  const rawDt = clock.getDelta();
  const simDt = Math.min(rawDt, 0.05);                 // clamp tab-switch spikes for physics
  if (sim.running) updateMechanism(simDt * sim.speed);
  updateCamTween(Math.min(rawDt, 0.25));               // tween tracks wall-clock even at low FPS
  controls.update();
  renderer.render(scene, camera);
}

window.__engineReady = true;
document.getElementById('loading').classList.add('hidden');
animate();
</script>
</body>
