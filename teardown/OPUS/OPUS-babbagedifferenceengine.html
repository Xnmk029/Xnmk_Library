<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>巴贝奇差分机 — 3D 机械计算引擎 (OPUS)</title>
<style>
  :root{
    --brass:#d9a944;
    --brass-lo:#8a6620;
    --brass-hi:#f2d79a;
    --ink:#0a0b0e;
    --panel:rgba(20,16,12,.82);
    --line:rgba(217,169,68,.38);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#050608;}
  body{
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    color:#e8d7b5;-webkit-font-smoothing:antialiased;
  }
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;}

  /* ── cinematic vignette + film warmth ───────────────────────────── */
  #vignette{
    position:fixed;inset:0;pointer-events:none;z-index:2;
    background:
      radial-gradient(120% 90% at 50% 42%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%),
      radial-gradient(60% 45% at 74% 16%,rgba(255,186,110,.09),rgba(0,0,0,0) 70%);
    mix-blend-mode:normal;
  }

  /* ── brass plate chrome, shared ─────────────────────────────────── */
  .plate{
    background:var(--panel);
    -webkit-backdrop-filter:blur(9px) saturate(120%);
    backdrop-filter:blur(9px) saturate(120%);
    border:1px solid var(--line);
    border-radius:3px;
    box-shadow:
      0 0 0 1px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,214,150,.16),
      inset 0 -1px 0 rgba(0,0,0,.5),
      0 18px 44px rgba(0,0,0,.6);
    background-image:
      radial-gradient(circle at 9px 9px,rgba(240,214,160,.5) 0 1.6px,rgba(0,0,0,.35) 1.6px 3px,transparent 3.2px),
      radial-gradient(circle at calc(100% - 9px) 9px,rgba(240,214,160,.5) 0 1.6px,rgba(0,0,0,.35) 1.6px 3px,transparent 3.2px),
      radial-gradient(circle at 9px calc(100% - 9px),rgba(240,214,160,.5) 0 1.6px,rgba(0,0,0,.35) 1.6px 3px,transparent 3.2px),
      radial-gradient(circle at calc(100% - 9px) calc(100% - 9px),rgba(240,214,160,.5) 0 1.6px,rgba(0,0,0,.35) 1.6px 3px,transparent 3.2px);
    background-repeat:no-repeat;
  }

  /* ── title block ────────────────────────────────────────────────── */
  #brand{
    position:fixed;top:18px;left:20px;z-index:5;padding:12px 20px 11px;
    pointer-events:none;
  }
  #brand h1{
    font-size:15px;font-weight:600;letter-spacing:.30em;text-transform:uppercase;
    color:var(--brass-hi);text-shadow:0 1px 0 rgba(0,0,0,.8);
  }
  #brand .rule{
    height:1px;margin:7px 0 6px;
    background:linear-gradient(90deg,transparent,var(--line) 12%,var(--line) 88%,transparent);
  }
  #brand p{font-size:10.5px;letter-spacing:.20em;text-transform:uppercase;color:#9d8560;}

  /* ── HUD ────────────────────────────────────────────────────────── */
  #hud{
    position:fixed;top:18px;right:20px;z-index:6;width:252px;padding:15px 16px 14px;
  }
  #hud h2{
    font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:#b99c66;
    margin-bottom:11px;padding-bottom:8px;border-bottom:1px solid rgba(217,169,68,.2);
  }
  .grp{margin-bottom:13px}
  .grp:last-child{margin-bottom:0}
  .lbl{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;color:#93805e;margin-bottom:7px;
  }
  .lbl b{font-variant-numeric:tabular-nums;font-weight:600;color:var(--brass);letter-spacing:.08em}

  button{
    font:inherit;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:#2a1d09;cursor:pointer;width:100%;padding:9px 8px;border:1px solid #6b4f18;
    border-radius:2px;
    background:linear-gradient(180deg,#efd292 0%,#d3a84c 44%,#a97f2c 100%);
    box-shadow:inset 0 1px 0 rgba(255,247,225,.75),inset 0 -2px 4px rgba(90,62,14,.5),0 2px 6px rgba(0,0,0,.45);
    transition:filter .16s,transform .08s;
  }
  button:hover{filter:brightness(1.11)}
  button:active{transform:translateY(1px)}
  button.ghost{
    color:#cbb37f;background:linear-gradient(180deg,rgba(70,56,34,.55),rgba(38,30,18,.65));
    border-color:rgba(217,169,68,.3);box-shadow:inset 0 1px 0 rgba(255,214,150,.1),0 2px 6px rgba(0,0,0,.4);
    text-align:left;padding-left:11px;
  }
  button.ghost:hover{color:#f0dcae;border-color:rgba(217,169,68,.6)}
  button.ghost.on{
    color:#2a1d09;background:linear-gradient(180deg,#e7c37d,#b98e35);border-color:#6b4f18;
  }
  .stack button{margin-bottom:6px}
  .stack button:last-child{margin-bottom:0}
  .key{float:right;opacity:.55;font-size:9px;letter-spacing:.1em}

  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:5px;border-radius:3px;border:1px solid rgba(0,0,0,.6);
    background:linear-gradient(180deg,#14100a,#2b2115);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.8);
  }
  input[type=range]::-moz-range-track{
    height:5px;border-radius:3px;border:1px solid rgba(0,0,0,.6);
    background:linear-gradient(180deg,#14100a,#2b2115);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:15px;height:15px;margin-top:-6px;border-radius:50%;
    border:1px solid #5c4312;
    background:radial-gradient(circle at 34% 30%,#fbeec4,#d0a447 55%,#8d6a24);
    box-shadow:0 1px 4px rgba(0,0,0,.7);
  }
  input[type=range]::-moz-range-thumb{
    width:15px;height:15px;border-radius:50%;border:1px solid #5c4312;
    background:radial-gradient(circle at 34% 30%,#fbeec4,#d0a447 55%,#8d6a24);
  }

  /* ── register readout ───────────────────────────────────────────── */
  #regs{
    border-top:1px solid rgba(217,169,68,.2);margin-top:13px;padding-top:11px;
  }
  .reg{
    display:flex;justify-content:space-between;align-items:center;
    font-size:11px;letter-spacing:.05em;padding:2.5px 0;
  }
  .reg span{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#8d7a58}
  .reg b{
    font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12px;font-weight:600;
    font-variant-numeric:tabular-nums;color:var(--brass-hi);letter-spacing:.11em;
    text-shadow:0 0 9px rgba(217,169,68,.35);
  }
  #fps{
    margin-top:10px;padding-top:9px;border-top:1px solid rgba(217,169,68,.14);
    font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:#6f6047;
    display:flex;justify-content:space-between;
  }

  /* ── footer hint ────────────────────────────────────────────────── */
  #hint{
    position:fixed;left:20px;bottom:16px;z-index:5;padding:9px 15px;
    font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:#8b7752;
    pointer-events:none;
  }
  #hint em{font-style:normal;color:var(--brass)}

  /* ── boot / error ───────────────────────────────────────────────── */
  #boot{
    position:fixed;inset:0;z-index:20;display:grid;place-content:center;justify-items:center;gap:14px;
    background:#050608;transition:opacity .8s ease;text-align:center;padding:24px;
  }
  #boot.gone{opacity:0;pointer-events:none}
  #boot .ring{
    width:46px;height:46px;border-radius:50%;
    border:2px solid rgba(217,169,68,.18);border-top-color:var(--brass);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #boot p{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:#8b7752}
  #boot .err{color:#d98a6a;max-width:460px;line-height:1.7;letter-spacing:.06em;text-transform:none;font-size:12.5px}

  @media (max-width:760px){
    #hud{width:206px;top:12px;right:12px;padding:12px 12px 11px}
    #brand{top:12px;left:12px;padding:9px 14px}
    #brand h1{font-size:12px;letter-spacing:.22em}
    #brand p{display:none}
    #hint{display:none}
    #regs .reg b{font-size:11px}
  }
  @media (max-height:620px){
    #regs,#fps{display:none}
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>
<div id="vignette"></div>

<header id="brand" class="plate">
  <h1>Difference Engine 巴贝奇差分机</h1>
  <div class="rule"></div>
  <p>查尔斯·巴贝奇设计 &middot; 伦敦 &middot; 1822年</p>
</header>

<section id="hud" class="plate">
  <h2>Engine Control 引擎控制面板</h2>

  <div class="grp">
    <button id="motor">暂停电机</button>
  </div>

  <div class="grp">
    <div class="lbl">模拟运转速度 <b id="spdVal">1.00&times;</b></div>
    <input id="speed" type="range" min="0.05" max="3" step="0.05" value="1">
  </div>

  <div class="grp stack">
    <div class="lbl">预设视角</div>
    <button class="ghost on" data-view="0">全景视图 (Full View)<span class="key">1</span></button>
    <button class="ghost" data-view="1">齿轮细节特写 (Gear Detail)<span class="key">2</span></button>
    <button class="ghost" data-view="2">俯视结构架构 (Top-down)<span class="key">3</span></button>
  </div>

  <div id="regs">
    <div class="reg"><span>结果寄存器 Σ</span><b id="r0">000000</b></div>
    <div class="reg"><span>一阶差分 Δ1</span><b id="r1">000000</b></div>
    <div class="reg"><span>二阶差分 Δ2</span><b id="r2">000000</b></div>
    <div class="reg"><span>三阶差分 Δ3</span><b id="r3">000000</b></div>
  </div>

  <div id="fps"><span>Render</span><span id="fpsv">— fps</span></div>
</section>

<footer id="hint" class="plate">
  左键拖拽 <em>旋转视角</em> &nbsp;·&nbsp; 滚轮 <em>缩放</em> &nbsp;·&nbsp; 右键拖拽 <em>平移</em> &nbsp;·&nbsp; 空格键 <em>暂停/启动</em>
</footer>

<div id="boot">
  <div class="ring"></div>
  <p id="bootmsg">正在组装差分机机械结构…</p>
</div>

<script>
  /* If the ES-module bundle never arrives (offline, blocked CDN, no import-map
     support) say so plainly instead of spinning forever. */
  window.__engineBooted = false;
  setTimeout(function () {
    if (window.__engineBooted) return;
    var b = document.getElementById('boot');
    if (!b) return;
    b.querySelector('.ring').style.display = 'none';
    b.querySelector('#bootmsg').outerHTML =
      '<p class="err">The Three.js module could not be loaded from the CDN.<br>' +
      'This page needs network access to <b>cdn.jsdelivr.net</b>, or a browser that ' +
      'supports import maps (Chrome/Edge 89+, Firefox 108+, Safari 16.4+).</p>';
  }, 15000);
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ═══════════════════════════════════════════════════════════════════════════
   BABBAGE'S DIFFERENCE ENGINE — fully procedural, single file.
   No external meshes: every tooth, drum, rivet and flute is generated in code.

   Mechanical honesty note: the gear train is phase-solved, not faked. Meshing
   pairs share a circular pitch and their angular phases satisfy the conjugate
   condition  N_a(θ_a − d) + N_b(θ_b − d − π) ≡ π (mod 2π), so teeth interleave
   exactly and stay interleaved for every frame of the animation.
   ═══════════════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smootherstep = t => t * t * t * (t * (t * 6 - 15) + 10);
const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

/* ── machine dimensions (1 unit ≈ 10 cm) ─────────────────────────────────── */
const COLS = 4, LEVELS = 6;
const COL_SPACING = 2.8;
const COL_X  = i => -((COLS - 1) / 2) * COL_SPACING + i * COL_SPACING;   // −4.2 … +4.2

const GEAR_TEETH = 24, GEAR_PITCH = 1.40, GEAR_ADD = 0.16, GEAR_DED = 0.20, GEAR_THICK = 0.17;
const STUB_TEETH = 12, STUB_PITCH = 0.70, STUB_ADD = 0.12, STUB_DED = 0.18;
const CROWN_TEETH = 36, CROWN_PITCH = 1.40;
const PIN_TEETH = 12, PIN_PITCH = CROWN_PITCH * PIN_TEETH / CROWN_TEETH;  // 0.4667
const RATIO = PIN_TEETH / CROWN_TEETH;                                    // column : crank = 1 : 3

const SHAFT_Y  = 1.75;                       // horizontal crank shaft
const CROWN_Y  = 2.55;                       // crown wheels (teeth face downward)
const BED_TOP  = 0.55;                       // cast-iron bed plate
const LEVEL_Y  = L => 4.00 + L * 1.55;       // spur-gear plane of each figure wheel
const DRUM_R   = 0.95, DRUM_H = 0.68;
const COL_TOP  = LEVEL_Y(LEVELS - 1) + 1.65; // 13.40
const RATCHET_Y = LEVEL_Y(LEVELS - 1) + 1.15;
const PILLAR_X = [-6.70, 0, 6.70], PILLAR_Z = [-3.20, 3.20];
/* Five cast-iron standards. The front bay is deliberately left without a
   centre post so the figure wheels stay readable head-on. */
const PILLARS = [[-6.70, 3.20], [6.70, 3.20], [-6.70, -3.20], [0, -3.20], [6.70, -3.20]];
const PILLAR_TOP = 14.30;

/* Column rate signs: crown-and-pinion handedness (pinion beneath the crown,
   engaging the −X rim on column 0 and the +X rim on column 3) yields
   −,+,−,+ which is exactly the alternation the spur chain demands. */
const COL_RATE = i => (i % 2 === 0 ? -1 : 1) * RATIO;

/* ═══════════════ 1 · RENDERER, SCENE, CAMERA ═══════════════ */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.16;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06070a);
scene.fog = new THREE.FogExp2(0x06070a, 0.0125);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 400);
camera.position.set(16.5, 12.0, 25.0);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.rotateSpeed = 0.75;
controls.zoomSpeed = 0.9;
controls.panSpeed = 0.75;
controls.minDistance = 4.5;
controls.maxDistance = 78;
controls.maxPolarAngle = Math.PI * 0.502;
controls.target.set(0, 7.4, 0);
controls.update();

/* ═══════════════ 2 · PROCEDURAL TEXTURES ═══════════════ */
const maxAniso = renderer.capabilities.getMaxAnisotropy();

function canvas2d(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return [c, c.getContext('2d')];
}
function texFrom(c, { srgb = true, repeat = null, wrap = THREE.RepeatWrapping } = {}) {
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = wrap;
  t.anisotropy = maxAniso;
  if (repeat) t.repeat.set(repeat[0], repeat[1]);
  return t;
}

/* value noise — used for the mahogany grain */
const hash2 = (x, y) => { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123; return n - Math.floor(n); };
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
}
function fbm(x, y, oct = 4) {
  let s = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= 0.5; }
  return s;
}

/* — dark mahogany with cathedral grain — */
function makeWoodTexture() {
  const W = 512, H = 512, [c, g] = canvas2d(W, H);
  const img = g.createImageData(W, H), d = img.data;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const warp = fbm(x * 0.006, y * 0.05, 5) * 7.0;
      const rings = Math.sin(x * 0.055 + warp) * 0.5 + 0.5;
      const fine = fbm(x * 0.9, y * 0.05, 3);
      const pore = vnoise(x * 0.55, y * 1.7) > 0.83 ? 0.82 : 1.0;
      const t = (0.55 + 0.45 * Math.pow(rings, 2.1)) * (0.86 + 0.24 * fine) * pore;
      const i = (y * W + x) * 4;
      d[i]     = clamp(88 * t + 20, 0, 255);
      d[i + 1] = clamp(38 * t + 8, 0, 255);
      d[i + 2] = clamp(24 * t + 5, 0, 255);
      d[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}

/* — figure-wheel drum band: ten engraved numerals + index grooves —
   `ascending` false mirrors the digit order for counter-rotating columns. */
function makeDigitTexture(ascending) {
  const CELL = 168, W = CELL * 10, H = 236, [c, g] = canvas2d(W, H);
  const grad = g.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0.00, '#6f6f6f');
  grad.addColorStop(0.14, '#d7d7d7');
  grad.addColorStop(0.50, '#f2f2f2');
  grad.addColorStop(0.86, '#cfcfcf');
  grad.addColorStop(1.00, '#666666');
  g.fillStyle = grad; g.fillRect(0, 0, W, H);

  /* engraved index grooves top & bottom */
  g.fillStyle = 'rgba(30,26,20,.55)';
  g.fillRect(0, 26, W, 5); g.fillRect(0, H - 31, W, 5);

  for (let i = 0; i < 10; i++) {
    const x0 = i * CELL, cx = x0 + CELL / 2;
    /* cell divider notch */
    g.fillStyle = 'rgba(24,20,14,.72)'; g.fillRect(x0 - 2.5, 0, 5, H);
    g.fillStyle = 'rgba(255,255,255,.30)'; g.fillRect(x0 + 2.5, 0, 2, H);
    /* numeral */
    const digit = ascending ? i : (9 - i) % 10;
    g.save();
    g.translate(cx, H / 2 + 4);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '600 138px "Times New Roman", Georgia, serif';
    g.fillStyle = 'rgba(255,255,255,.34)'; g.fillText(String(digit), 2.5, 3);
    g.fillStyle = '#191510'; g.fillText(String(digit), 0, 0);
    g.restore();
    /* tick marks flanking each numeral */
    g.fillStyle = 'rgba(30,26,20,.42)';
    g.fillRect(x0 + 14, H / 2 - 6, 12, 12);
    g.fillRect(x0 + CELL - 26, H / 2 - 6, 12, 12);
  }
  return c;
}

/* — engraved brass maker's plate — */
function makePlateTexture() {
  const W = 1024, H = 236, [c, g] = canvas2d(W, H);
  g.fillStyle = '#cfcfcf'; g.fillRect(0, 0, W, H);
  const v = g.createLinearGradient(0, 0, 0, H);
  v.addColorStop(0, 'rgba(255,255,255,.35)');
  v.addColorStop(.5, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,.30)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(28,22,14,.75)'; g.lineWidth = 4;
  g.strokeRect(16, 16, W - 32, H - 32);
  g.lineWidth = 1.6; g.strokeRect(28, 28, W - 56, H - 56);
  const engrave = (txt, y, size, sp) => {
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `600 ${size}px "Times New Roman", Georgia, serif`;
    let total = 0; for (const ch of txt) total += g.measureText(ch).width + sp;
    let x = W / 2 - total / 2;
    for (const ch of txt) {
      const w = g.measureText(ch).width;
      g.fillStyle = 'rgba(255,255,255,.42)'; g.fillText(ch, x + w / 2 + 2, y + 2.5);
      g.fillStyle = '#1a150e'; g.fillText(ch, x + w / 2, y);
      x += w + sp;
    }
  };
  engrave('DIFFERENCE ENGINE', 92, 62, 9);
  engrave('C. BABBAGE · LONDON · MDCCCXXII', 168, 30, 5);
  return c;
}

/* — studio environment (equirectangular): warm key, cool fill, dark floor — */
function makeEnvTexture() {
  const W = 1024, H = 512, [c, g] = canvas2d(W, H);
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0.00, '#2d333c');
  sky.addColorStop(0.42, '#171a20');
  sky.addColorStop(0.52, '#0c0e12');
  sky.addColorStop(1.00, '#050607');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);

  };
  blob(W * 0.72, H * 0.17, W * 0.27, 'rgba(255,196,126,1.0)');   // warm key
  blob(W * 0.76, H * 0.20, W * 0.10, 'rgba(255,240,215,1.0)');   // hot core

  blob(W * 0.98, H * 0.40, W * 0.13, 'rgba(255,150,80,0.35)');   // rim
  return c;
}

function mesh(geo, mat, { cast = true, receive = true, parent = engine } = {}) {

/* — straight-flank (Victorian cycloidal-looking) spur gear outline — */
function gearShape(teeth, pitchR, add, ded, { halfBot = 0.29, halfTop = 0.15 } = {}) {
  const s = new THREE.Shape();
  const rTip = pitchR + add, rRoot = pitchR - ded;
  const step = TAU / teeth, hb = step * halfBot, ht = step * halfTop;
  const P = (r, a) => [Math.cos(a) * r, Math.sin(a) * r];
  for (let i = 0; i < teeth; i++) {
    const c = i * step;
    if (i === 0) s.moveTo(...P(rRoot, c - hb)); else s.lineTo(...P(rRoot, c - hb));
    s.lineTo(...P(rTip, c - ht));
    s.lineTo(...P(rTip, c + ht));
    s.lineTo(...P(rRoot, c + hb));
    s.absarc(0, 0, rRoot, c + hb, c + step - hb, false);
  }
  s.closePath();
  return s;
}

/* — open spokes + centre bore, punched into any shape — */
function punchSpokes(shape, { bore, spokes, rIn, rOut, gap = 0.34 }) {
  if (bore > 0) {
    const h = new THREE.Path();
    h.absarc(0, 0, bore, 0, TAU, true);
    shape.holes.push(h);
  }
  if (!spokes) return shape;
  const seg = TAU / spokes;
  for (let k = 0; k < spokes; k++) {
    const a0 = k * seg + gap * 0.5, a1 = (k + 1) * seg - gap * 0.5;
    const h = new THREE.Path();
    h.absarc(0, 0, rOut, a0, a1, false);
    h.absarc(0, 0, rIn, a1, a0, true);
    h.closePath();
    shape.holes.push(h);
  }
  return shape;
}

const EXTRUDE = (thick, curveSeg = 5, bev = 0.018) => ({
  depth: thick, bevelEnabled: true, bevelThickness: bev, bevelSize: bev,
  bevelOffset: 0, bevelSegments: 1, curveSegments: curveSeg, steps: 1
});

/* Extrude in the shape plane, then lay flat so shape-(x,y) → world-(x,z).
   Azimuth in world (atan2(z,x)) therefore equals the shape angle exactly —
   which is what the phase solver assumes. */
function flatExtrude(shape, thick, curveSeg = 5) {
  const g = new THREE.ExtrudeGeometry(shape, EXTRUDE(thick, curveSeg));
  g.translate(0, 0, -thick / 2);
  g.computeVertexNormals();
  return g;
}

/* — sawtooth ratchet wheel — */
function ratchetShape(teeth, rRoot, rTip, rise = 0.80, seg = 4) {
  const s = new THREE.Shape();
  const step = TAU / teeth;
  const P = (r, a) => [Math.cos(a) * r, Math.sin(a) * r];
  s.moveTo(...P(rRoot, 0));
  for (let i = 0; i < teeth; i++) {
    const a0 = i * step;
    for (let k = 1; k <= seg; k++) {
      const t = (k / seg) * rise;
      s.lineTo(...P(rRoot + (rTip - rRoot) * (t / rise), a0 + t * step));
    }
    s.lineTo(...P(rRoot, a0 + rise * step));   // vertical drop face — the pawl catch
    s.lineTo(...P(rRoot, a0 + step));
  }
  s.closePath();
  return s;
}

/* — crown-wheel axial teeth: N radial pegs extruded as one geometry — */
function crownTeethGeometry(teeth, pitchR, tangW, radL, height) {
  const shapes = [];
  for (let i = 0; i < teeth; i++) {
    const a = i * TAU / teeth, ca = Math.cos(a), sa = Math.sin(a);
    const s = new THREE.Shape();
    const pts = [[-radL / 2, -tangW / 2], [radL / 2, -tangW / 2], [radL / 2, tangW / 2], [-radL / 2, tangW / 2]];
    pts.forEach(([u, v], k) => {
      const x = (pitchR + u) * ca - v * sa;
      const y = (pitchR + u) * sa + v * ca;
      k === 0 ? s.moveTo(x, y) : s.lineTo(x, y);
    });
    s.closePath();
    shapes.push(s);
  }
  const g = new THREE.ExtrudeGeometry(shapes, {
    depth: height, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.012,
    bevelOffset: 0, bevelSegments: 1, curveSegments: 1, steps: 1
  });
  g.computeVertexNormals();
  return g;
}

/* — helical tension spring (pawl return) — */
function springGeometry(len, r, turns, wire) {
  const pts = [];
  const N = turns * 14;
  for (let i = 0; i <= N; i++) {
    const t = i / N, a = t * TAU * turns;
    pts.push(new THREE.Vector3(Math.cos(a) * r, t * len, Math.sin(a) * r));
  }
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), N, wire, 5, false);
}

function buildPillar(x, z) {

    [0.27, 0.74], [0.245, h * 0.45], [0.225, h - 1.30], [0.265, h - 1.12],
    [0.245, h - 0.95], [0.245, h - 0.62], [0.34, h - 0.44], [0.34, h - 0.22],
    [0.44, h - 0.14], [0.44, h]

  for (const t of [0.30, 0.62]) {

    r.rotation.x = Math.PI / 2; r.position.y = h * t;

/* brass crossbar with turned collars at each end */
function crossbar(x1, z1, x2, z2, y, r = 0.115, matl = MAT.brass) {
  const dx = x2 - x1, dz = z2 - z1, len = Math.hypot(dx, dz);
  const bar = mesh(cyl(r, len, 14), matl);
  bar.position.set((x1 + x2) / 2, y, (z1 + z2) / 2);
  bar.rotation.z = Math.PI / 2;
  bar.rotation.y = -Math.atan2(dz, dx);
  const t = 0.06 / len;
  for (const u of [t * 3, 1 - t * 3]) {
    const c = mesh(new THREE.CylinderGeometry(r * 1.75, r * 1.75, 0.16, 16), MAT.brassBright);
    c.position.set(x1 + dx * u, y, z1 + dz * u);
    c.rotation.z = Math.PI / 2;
    c.rotation.y = -Math.atan2(dz, dx);
  }
  return bar;
}

function buildFrame() {
  for (const [x, z] of PILLARS) buildPillar(x, z);

  /* horizontal brass crossbars — clear span across the front, two bays behind */
  for (const y of [6.05, 9.85]) {
    crossbar(PILLAR_X[0], PILLAR_Z[1], PILLAR_X[2], PILLAR_Z[1], y);
    crossbar(PILLAR_X[0], PILLAR_Z[0], PILLAR_X[1], PILLAR_Z[0], y);
    crossbar(PILLAR_X[1], PILLAR_Z[0], PILLAR_X[2], PILLAR_Z[0], y);
    for (const x of [PILLAR_X[0], PILLAR_X[2]]) {
      crossbar(x, PILLAR_Z[0], x, PILLAR_Z[1], y, 0.10, MAT.brassAged);
    }
  }
  /* diagonal tension braces on the end bays */
  for (const x of [PILLAR_X[0], PILLAR_X[2]]) {
    for (const z of PILLAR_Z) {
      const d = mesh(cyl(0.075, 4.4, 10), MAT.steel);
      d.position.set(x + (x < 0 ? 1.45 : -1.45), 7.95, z);
      d.rotation.z = (x < 0 ? -1 : 1) * 0.72;
    }
  }

  /* lower bearing beam — carries the foot of every calculating column */
  const lb = mesh(box(14.6, 0.30, 1.20), MAT.steel);
  lb.position.set(0, 3.30, 0);
  const ub = mesh(box(14.6, 0.26, 1.20), MAT.steel);
  ub.position.set(0, 13.15, 0);
  for (const [y, beam] of [[3.30, 0], [13.15, 1]]) {
    for (let i = 0; i < COLS; i++) {
      const bushing = mesh(GEO.bushing, MAT.brassBright);
      bushing.position.set(COL_X(i), y, 0);
      rivet(COL_X(i) + 0.60, y + (beam ? 0.13 : 0.15), 0.42, [0, 1, 0], 1.1);
      rivet(COL_X(i) - 0.60, y + (beam ? 0.13 : 0.15), -0.42, [0, 1, 0], 1.1);
    }
  }
  /* beam end brackets tying into the pillars */
  for (const sx of [-1, 1]) for (const y of [3.30, 13.15]) {
    const br = mesh(box(1.5, 0.5, 0.9), MAT.iron);
    br.position.set(sx * 7.0, y, 0);
  }

  /* entablature: brass architrave + mahogany cap + maker's plate */
  for (const z of PILLAR_Z) {
    crossbar(PILLAR_X[0] - 0.5, z, PILLAR_X[2] + 0.5, z, PILLAR_TOP - 0.02, 0.13, MAT.brassBright);
  }
  const capBeam = mesh(box(15.6, 0.42, 8.0), MAT.wood);
  capBeam.position.y = PILLAR_TOP + 0.21;
  const capTrim = mesh(box(16.0, 0.11, 8.4), MAT.brassAged, { cast: false });
  capTrim.position.y = PILLAR_TOP + 0.07;
  const cornice = mesh(box(14.6, 0.20, 7.2), MAT.brassAged, { cast: false });
  cornice.position.y = PILLAR_TOP + 0.46;

  const plateBack = mesh(box(6.6, 1.62, 0.10), MAT.brassAged);
  plateBack.position.set(0, PILLAR_TOP - 0.85, 4.02);
  const plateFace = mesh(new THREE.PlaneGeometry(6.4, 1.48), MAT.plate);
  plateFace.position.set(0, PILLAR_TOP - 0.85, 4.075);
  plateFace.castShadow = false;
  for (const dx of [-3.05, 3.05]) rivet(dx, PILLAR_TOP - 0.85, 4.08, [0, 0, 1], 1.25);
}

/* ═══════════════ 9 · KINEMATIC REGISTRY & PHASE SOLVER ═══════════════ */
/* Everything animated registers here; the render loop is a pure function of
   the single scalar `drive` (the crank angle in radians).                   */
const ANIM = { spinY: [], spinX: [], drums: [], pawls: [] };

const spinY = (obj, phase, rate) => { ANIM.spinY.push({ obj, phase, rate }); return obj; };
const spinX = (obj, phase, rate) => { ANIM.spinX.push({ obj, phase, rate }); return obj; };

/* Conjugate-action phase: given a parent gear (teeth, phase) and the azimuth
   `d` of the child's centre as seen from the parent, return the child phase
   that puts a valley of one against a tooth of the other — permanently. */
const conjugatePhase = (parentTeeth, parentPhase, childTeeth, d) =>
  d + Math.PI + (Math.PI + parentTeeth * (d - parentPhase)) / childTeeth;

/* orientation helpers */
const LAY_FLAT = m => { m.rotation.x = Math.PI / 2; return m; };            // gear plane → XZ, axis +Y
const LAY_AXIS_X = m => { m.rotation.set(0, Math.PI / 2, Math.PI / 2); return m; }; // gear plane → YZ, axis +X

/* ═══════════════ 10 · MAIN DRIVE — crank shaft, flywheel, pinions ═══════════════ */
function discShape(r) {
  const s = new THREE.Shape();
  s.absarc(0, 0, r, 0, TAU, false);
  return s;
}

function buildDrive() {
  const crank = new THREE.Group();
  crank.position.set(0, SHAFT_Y, 0);
  engine.add(crank);
  spinX(crank, 0, 1);

  /* the shaft itself, with turned collars so the spin reads */
  const shaft = mesh(cyl(0.17, 18.9, 18), MAT.steelBright, { parent: crank });
  shaft.rotation.z = Math.PI / 2;
  shaft.position.x = 0.05;
  for (const x of [-8.0, -6.4, -3.4, 3.4, 6.4, 8.1]) {
    const c = mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.20, 6), MAT.brassAged, { parent: crank });
    c.rotation.z = Math.PI / 2; c.position.x = x;
  }

  /* flywheel — six spokes, weighted rim */
  const fwGeo = flatExtrude(punchSpokes(discShape(1.62),
    { bore: 0.19, spokes: 6, rIn: 0.36, rOut: 1.30, gap: 0.30 }), 0.24, 24);
  const fw = LAY_AXIS_X(mesh(fwGeo, MAT.brass, { parent: crank }));
  fw.position.x = -8.62;
  const fwRim = mesh(new THREE.TorusGeometry(1.60, 0.15, 10, 44), MAT.brassBright, { parent: crank });
  fwRim.rotation.y = Math.PI / 2; fwRim.position.x = -8.62;
  const fwHub = mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.52, 18), MAT.steel, { parent: crank });
  fwHub.rotation.z = Math.PI / 2; fwHub.position.x = -8.62;

  /* mechanical hand crank: web, pin, free-running turned grip */
  const web = mesh(box(0.30, 2.05, 0.42), MAT.steel, { parent: crank });
  web.position.set(9.02, 0.58, 0);
  const webEye = mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.42, 18), MAT.steel, { parent: crank });
  webEye.rotation.z = Math.PI / 2; webEye.position.set(9.02, 1.18, 0);
  const webBoss = mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.42, 18), MAT.steel, { parent: crank });
  webBoss.rotation.z = Math.PI / 2; webBoss.position.set(9.02, 0, 0);
  const pin = mesh(cyl(0.125, 1.05, 14), MAT.steelBright, { parent: crank });
  pin.rotation.z = Math.PI / 2; pin.position.set(9.60, 1.18, 0);

  const gripPivot = new THREE.Group();
  gripPivot.position.set(10.18, 1.18, 0);
  crank.add(gripPivot);
  spinX(gripPivot, 0, -1);                       // grip stays upright in the hand
  const gripProf = [[0.06, 0], [0.15, 0.06], [0.17, 0.16], [0.145, 0.62], [0.175, 0.72],
  [0.155, 0.80], [0.06, 0.86], [0, 0.88]].map(([r, y]) => new THREE.Vector2(r, y));
  const grip = mesh(new THREE.LatheGeometry(gripProf, 18), MAT.wood, { parent: gripPivot });
  grip.rotation.z = -Math.PI / 2; grip.position.x = -0.10;

  /* bevel pinions engaging the crown wheels of columns 0 and 3 */
  const drives = [{ col: 0, sigma: -1 }, { col: 3, sigma: 1 }];
  for (const { col, sigma } of drives) {
    const p = LAY_AXIS_X(mesh(GEO.pinion, MAT.brassBright, { parent: crank }));
    p.position.x = COL_X(col) + sigma * CROWN_PITCH;
    const hub = mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.42, 16), MAT.brass, { parent: crank });
    hub.rotation.z = Math.PI / 2; hub.position.x = p.position.x;
  }

  /* bearing pedestals */
  for (const x of [-7.05, -2.15, 2.15, 7.05]) {
    const g = new THREE.Group();
    g.position.set(x, 0, 0);
    engine.add(g);
    const h = SHAFT_Y - BED_TOP;
    const body = mesh(box(0.95, h, 1.05), MAT.iron, { parent: g });
    body.position.y = BED_TOP + h / 2;
    const foot = mesh(box(1.55, 0.16, 1.5), MAT.iron, { parent: g });
    foot.position.y = BED_TOP + 0.08;
    const capB = mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.62, 20), MAT.brassBright, { parent: g });
    capB.rotation.z = Math.PI / 2; capB.position.y = SHAFT_Y;
    const strap = mesh(box(0.72, 0.5, 0.16), MAT.steel, { parent: g });
    strap.position.set(0, SHAFT_Y + 0.22, 0);
    rivet(x + 0.62, BED_TOP + 0.17, 0.5, [0, 1, 0], 1.1);
    rivet(x - 0.62, BED_TOP + 0.17, -0.5, [0, 1, 0], 1.1);
  }
  return crank;
}

/* ═══════════════ 11 · CALCULATING COLUMNS ═══════════════ */
/* The engine tabulates a cubic by repeated addition of differences:
   Σ += Δ¹, Δ¹ += Δ², Δ² += Δ³  — one full turn of the crank per cycle.  */
const MODULUS = Math.pow(10, LEVELS);
const REG = [7, 1, 6, 6];
const digitOf = (v, d) => Math.floor(v / Math.pow(10, d)) % 10;
function stepRegisters() {
  const old = REG.slice();
  for (let i = 0; i < COLS - 1; i++) REG[i] = (old[i] + old[i + 1]) % MODULUS;
}

const colGearPhase = [];   // [column][level]

function buildColumns() {
  /* --- solve every spur-gear phase so the whole row interlocks exactly --- */
  for (let i = 0; i < COLS; i++) colGearPhase.push(new Array(LEVELS));
  for (let L = 0; L < LEVELS; L++) {
    colGearPhase[0][L] = 0.37 + L * 0.23;                       // free keying angle
    for (let i = 1; i < COLS; i++) {
      colGearPhase[i][L] = conjugatePhase(GEAR_TEETH, colGearPhase[i - 1][L], GEAR_TEETH, 0);
    }
  }

  const STUB_AT = [[0, 1], [1, 3], [2, 0], [3, 4]];             // [column, level]

  for (let i = 0; i < COLS; i++) {
    const x = COL_X(i), rate = COL_RATE(i), sgn = Math.sign(rate);
    const hasCrown = (i === 0 || i === COLS - 1);
    const sigma = i === 0 ? -1 : 1;

    /* ── vertical shaft (rotates with the column) ── */
    const shaftTop = COL_TOP, shaftBot = hasCrown ? CROWN_Y + 0.07 : 2.90;
    const sg = new THREE.Group();
    sg.position.set(x, 0, 0);
    engine.add(sg);
    spinY(sg, 0, rate);
    const sh = mesh(GEO.shaft, MAT.steelBright, { parent: sg });
    sh.scale.y = shaftTop - shaftBot;
    sh.position.y = (shaftTop + shaftBot) / 2;
    /* hex key collars — make the rotation legible on a bare cylinder */
    for (const y of [shaftBot + 0.25, 3.72, 12.55, shaftTop - 0.12]) {
      const c = mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.18, 6), MAT.brassAged, { parent: sg });
      c.position.y = y;
    }

    /* ── crown wheel + its phase, locked to the driving pinion ── */
    if (hasCrown) {
      const phi0 = sigma > 0 ? 0 : Math.PI;
      const crownPhase = phi0 - sigma * Math.PI / CROWN_TEETH;
      const cg = new THREE.Group();
      cg.position.set(x, CROWN_Y, 0);
      engine.add(cg);
      spinY(cg, crownPhase, rate);
      mesh(GEO.crownDisc, MAT.brass, { parent: cg });
      const teeth = LAY_FLAT(mesh(GEO.crownTeeth, MAT.brassBright, { parent: cg }));
      teeth.position.y = -0.07;
      const hub = mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.44, 20), MAT.brassAged, { parent: cg });
      const ring = mesh(new THREE.TorusGeometry(1.53, 0.055, 8, 48), MAT.brassBright, { parent: cg });
      ring.rotation.x = Math.PI / 2; ring.position.y = 0.075;
    }

    /* ── six figure-wheel levels: spur gear + counter drum ── */
    for (let L = 0; L < LEVELS; L++) {
      const gy = LEVEL_Y(L);

      const gg = new THREE.Group();
      gg.position.set(x, gy, 0);
      engine.add(gg);
      spinY(gg, colGearPhase[i][L], rate);
      LAY_FLAT(mesh(GEO.columnGear, MAT.brass, { parent: gg }));
      const hub = mesh(new THREE.CylinderGeometry(0.30, 0.30, 0.34, 18), MAT.brassAged, { parent: gg });

      /* counter drum — indexes in discrete steps, on its own sleeve */
      const dg = new THREE.Group();
      dg.position.set(x, gy + 0.72, 0);
      engine.add(dg);
      mesh(GEO.drumBand, DRUM_MAT[sgn > 0 ? 1 : 0], { parent: dg });
      for (const s of [1, -1]) {
        const rimM = LAY_FLAT(mesh(GEO.drumRim, MAT.brassBright, { parent: dg }));
        rimM.position.y = s * (DRUM_H / 2 - 0.03);
      }
      const sleeve = mesh(cyl(0.235, DRUM_H + 0.16, 16), MAT.brassAged, { parent: dg });

      const dIdx = LEVELS - 1 - L;                       // top level = most significant
      const start = digitOf(REG[i], dIdx);
      ANIM.drums.push({ g: dg, col: i, d: dIdx, sgn, cur: start, prev: start, pos: start, from: start });
    }

    /* ── ratchet + spring pawl at the head of the column ── */
    const rg = new THREE.Group();
    rg.position.set(x, RATCHET_Y, 0);
    engine.add(rg);
    spinY(rg, 0.2 + i * 0.4, rate);
    LAY_FLAT(mesh(GEO.ratchet, MAT.brassBright, { parent: rg }));
    const rhub = mesh(new THREE.CylinderGeometry(0.27, 0.27, 0.30, 16), MAT.brassAged, { parent: rg });

    const pawlPivot = new THREE.Group();
    pawlPivot.position.set(x + 1.45, RATCHET_Y, 1.05);
    engine.add(pawlPivot);
    const arm = mesh(box(1.16, 0.10, 0.20), MAT.steelBright, { parent: pawlPivot });
    arm.position.x = -0.55;
    const nose = mesh(box(0.20, 0.10, 0.30), MAT.steelBright, { parent: pawlPivot });
    nose.position.set(-1.10, 0, -0.06);
    const boss = mesh(cyl(0.13, 0.34, 14), MAT.brass, { parent: pawlPivot });
    ANIM.pawls.push({ g: pawlPivot, base: -0.15, amp: 0.085, rate, teeth: 24, phase: 0.2 + i * 0.4 });

    /* pawl standard hanging from the upper bearing beam */
    const strapH = mesh(box(1.30, 0.13, 0.24), MAT.steel);
    strapH.position.set(x + 0.90, 13.02, 1.05);
    const strapV = mesh(cyl(0.075, 13.02 - RATCHET_Y + 0.1, 10), MAT.steel);
    strapV.position.set(x + 1.45, (13.02 + RATCHET_Y) / 2, 1.05);
    const spr = mesh(GEO.spring, MAT.steelBright, { cast: false });
    spr.position.set(x + 1.45, RATCHET_Y + 0.22, 1.05);

    /* ── rear transfer pinion, geared to one figure wheel ── */
    const stub = STUB_AT.find(s => s[0] === i);
    if (stub) {
      const L = stub[1], gy = LEVEL_Y(L), sz = -(GEAR_PITCH + STUB_PITCH);
      const d = -Math.PI / 2;                                    // azimuth column → stub
      const ph = conjugatePhase(GEAR_TEETH, colGearPhase[i][L], STUB_TEETH, d);
      const pg = new THREE.Group();
      pg.position.set(x, gy, sz);
      engine.add(pg);
      spinY(pg, ph, -rate * GEAR_TEETH / STUB_TEETH);
      LAY_FLAT(mesh(GEO.stubGear, MAT.brassBright, { parent: pg }));
      const axle = mesh(cyl(0.10, 1.5, 12), MAT.steelBright, { parent: pg });
      const cl = mesh(new THREE.CylinderGeometry(0.19, 0.19, 0.12, 14), MAT.brassAged, { parent: pg });
      cl.position.y = 0.28;

      const bracket = mesh(box(0.20, 0.26, 1.30), MAT.steel);
      bracket.position.set(x, gy + 0.62, sz - 0.62);
      const yoke = mesh(box(0.24, 0.90, 0.22), MAT.steel);
      yoke.position.set(x, gy + 0.30, sz - 1.20);
    }

    /* rear outrigger standard carrying the transfer gear brackets */
    const post = mesh(cyl(0.13, 13.15 - 3.30, 14), MAT.iron);
    post.position.set(x, (13.15 + 3.30) / 2, -3.32);
    for (const y of [4.6, 8.2, 11.8]) rivet(x, y, -3.19, [0, 0, -1], 1.0);
  }
}

/* ═══════════════ 12 · ASSEMBLE ═══════════════ */
buildBase();
buildFrame();
buildDrive();
buildColumns();

/* every rivet in one instanced draw call */
(function placeRivets() {
  const im = new THREE.InstancedMesh(GEO.rivet, MAT.steelBright, RIVETS.length);
  im.castShadow = false; im.receiveShadow = true;
  const dummy = new THREE.Object3D(), up = new THREE.Vector3(0, 1, 0), n = new THREE.Vector3();
  RIVETS.forEach((r, i) => {
    dummy.position.set(r.p[0], r.p[1], r.p[2]);
    n.set(r.n[0], r.n[1], r.n[2]).normalize();
    dummy.quaternion.setFromUnitVectors(up, n);
    dummy.scale.setScalar(r.s || 1);
    dummy.updateMatrix();
    im.setMatrixAt(i, dummy.matrix);
  });
  im.instanceMatrix.needsUpdate = true;
  engine.add(im);
})();

/* ═══════════════ 13 · SIMULATION STATE ═══════════════ */
const SIM = {
  running: true,
  speed: 1.0,
  drive: 0,            // crank angle, radians — the single source of truth
  cycle: -1,           // completed calculation cycles
  omega: 1.55          // rad/s at 1.00×
};

const readout = [0, 1, 2, 3].map(i => document.getElementById('r' + i));
function paintRegisters() {
  for (let i = 0; i < COLS; i++) readout[i].textContent = String(REG[i]).padStart(LEVELS, '0');
}
paintRegisters();

/* advance the difference engine one addition cycle and hand the drums
   the number of forward detents each must index through */
function advanceCycle() {
  stepRegisters();
  for (const d of ANIM.drums) {
    const next = digitOf(REG[d.col], d.d);
    const fwd = (next - d.cur + 10) % 10;      // counter wheels only ever count up
    d.from = d.pos;
    d.pos += fwd;
    d.cur = next;
  }
  paintRegisters();
}

/* ═══════════════ 14 · CAMERA PRESETS ═══════════════ */
const VIEWS = [
  { p: new THREE.Vector3(16.5, 12.0, 25.0), t: new THREE.Vector3(0, 7.4, 0) },   // full engine
  { p: new THREE.Vector3(3.10, 6.45, 6.35), t: new THREE.Vector3(0.0, 5.5, 0) }, // gear detail
  { p: new THREE.Vector3(0.60, 30.0, 0.90), t: new THREE.Vector3(0, 4.0, 0) }    // top-down
];
let tween = null;
function goToView(k) {
  const v = VIEWS[k];
  tween = {
    t: 0, dur: 1.15,
    p0: camera.position.clone(), p1: v.p.clone(),
    t0: controls.target.clone(), t1: v.t.clone()
  };
  document.querySelectorAll('[data-view]').forEach(b =>
    b.classList.toggle('on', +b.dataset.view === k));
}

/* ═══════════════ 15 · UI ═══════════════ */
const motorBtn = document.getElementById('motor');
const speedEl = document.getElementById('speed');
const spdVal = document.getElementById('spdVal');

motorBtn.addEventListener('click', () => {
  SIM.running = !SIM.running;
  motorBtn.textContent = SIM.running ? 'Pause Motor' : 'Start Motor';
});
speedEl.addEventListener('input', () => {
  SIM.speed = parseFloat(speedEl.value);
  spdVal.textContent = SIM.speed.toFixed(2) + '×';
});
document.querySelectorAll('[data-view]').forEach(b =>
  b.addEventListener('click', () => goToView(+b.dataset.view)));

addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); motorBtn.click(); }
  else if (e.key === '1') goToView(0);
  else if (e.key === '2') goToView(1);
  else if (e.key === '3') goToView(2);
  else if (e.key.toLowerCase() === 'h') {
    for (const el of ['hud', 'brand', 'hint']) {
      const n = document.getElementById(el);
      n.style.display = n.style.display === 'none' ? '' : 'none';
    }
  }
});

/* ═══════════════ 16 · RESIZE ═══════════════ */
let dprCap = Math.min(devicePixelRatio, 2);
function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(dprCap);
  renderer.setSize(w, h, false);
}
addEventListener('resize', resize);
resize();

/* ═══════════════ 17 · RENDER LOOP ═══════════════ */
const clock = new THREE.Clock();
let fpsT = 0, fpsN = 0, adapted = false;
const fpsEl = document.getElementById('fpsv');

function frame() {
  const raw = clock.getDelta();          // true frame time — meter & camera use this
  const dt = Math.min(raw, 0.05);        // clamped — keeps the mechanism stable on hitches

  /* — motor — */
  if (SIM.running) SIM.drive += dt * SIM.speed * SIM.omega;

  /* — one addition cycle per revolution of the crank — */
  const turn = SIM.drive / TAU;
  const idx = Math.floor(turn);
  if (SIM.cycle < 0) SIM.cycle = idx;
  while (SIM.cycle < idx) { advanceCycle(); SIM.cycle++; }
  const frac = turn - idx;

  /* — synchronised gear train (opposing rotations fall out of the ratios) — */
  for (const s of ANIM.spinY) s.obj.rotation.y = -(s.phase + SIM.drive * s.rate);
  for (const s of ANIM.spinX) s.obj.rotation.x = s.phase + SIM.drive * s.rate;

  /* — ratchet indexing of the counter drums, staggered column by column — */
  for (const d of ANIM.drums) {
    const t0 = 0.05 + d.col * 0.05;
    let e = smootherstep(clamp((frac - t0) / 0.46, 0, 1));
    let p = d.from + (d.pos - d.from) * e;
    /* detent settle: a short damped shiver as each wheel drops into its notch */
    const after = frac - (t0 + 0.46);
    if (after > 0 && d.pos !== d.from) p += 0.035 * Math.exp(-after * 26) * Math.sin(after * 78);
    d.g.rotation.y = -d.sgn * TAU * (p + 0.5) / 10;
  }

  /* — spring pawls riding the ratchet teeth — */
  for (const w of ANIM.pawls) {
    const a = w.phase + SIM.drive * w.rate;
    let t = (a * w.teeth / TAU) % 1; if (t < 0) t += 1;
    const lift = t < 0.82 ? t / 0.82 : (1 - t) / 0.18;
    w.g.rotation.y = w.base + w.amp * lift * Math.sign(w.rate);
  }

  /* — camera preset tween — */
  if (tween) {
    tween.t += Math.min(raw, 0.1);
    const k = easeInOutCubic(clamp(tween.t / tween.dur, 0, 1));
    camera.position.lerpVectors(tween.p0, tween.p1, k);
    controls.target.lerpVectors(tween.t0, tween.t1, k);
    if (tween.t >= tween.dur) tween = null;
  }

  controls.update();
  renderer.render(scene, camera);

  /* — fps meter + one-shot resolution guard so we hold 60 — */
  fpsT += raw; fpsN++;
  if (fpsT > 0.5) {
    const fps = fpsN / fpsT;
    fpsEl.textContent = Math.round(fps) + ' fps';
    if (!adapted && fps < 45 && dprCap > 1) { dprCap = 1; adapted = true; resize(); }
    fpsT = 0; fpsN = 0;
  }
}
renderer.setAnimationLoop(frame);

/* ═══════════════ 18 · BOOT ═══════════════ */
renderer.compile(scene, camera);
window.__engineBooted = true;
/* console handle — poke at the mechanism live: DIFFERENCE_ENGINE.SIM.speed = 4 */
window.DIFFERENCE_ENGINE = { SIM, REG, ANIM, scene, camera, controls, renderer, MAT, GEO, goToView };
requestAnimationFrame(() => {
  const boot = document.getElementById('boot');
  boot.classList.add('gone');
  setTimeout(() => boot.remove(), 900);
});
</script>
</body>
</html>
