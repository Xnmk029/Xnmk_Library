<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>微体素城市沙盘 — Tilt-Shift Diorama</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0c; }
canvas { display: block; }
#hud {
  position: fixed; top: 0; left: 0; z-index: 10;
  padding: 12px 16px;
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 12px; line-height: 1.7;
  color: #a0a0a0; background: rgba(10,10,10,0.88);
  border-right: 1px solid #333; border-bottom: 1px solid #333;
  pointer-events: none; user-select: none;
}
#hud .title { color: #e0e0e0; font-size: 13px; font-weight: bold; letter-spacing: 1px; }
#hud .sep { color: #444; }
#hud .val { color: #70b0e0; }
#hud .dim { color: #606060; }
#panelToggle {
  position: fixed; top: 10px; right: 10px; z-index: 100;
  width: 32px; height: 32px;
  background: #1a1a1a; border: 1px solid #444;
  color: #a0a0a0; font-family: 'Consolas', monospace; font-size: 16px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
#panelToggle:hover { background: #252525; color: #e0e0e0; border-color: #666; }
#settingsPanel {
  position: fixed; top: 0; right: 0; z-index: 90;
  width: 320px; height: 100%; overflow-y: auto;
  background: rgba(12,12,14,0.95); border-left: 1px solid #333;
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 11px; color: #b0b0b0;
  transform: translateX(100%); transition: transform 0.2s ease;
  padding: 48px 14px 20px 14px;
}
#settingsPanel.open { transform: translateX(0); }
#settingsPanel::-webkit-scrollbar { width: 4px; }
#settingsPanel::-webkit-scrollbar-track { background: #111; }
#settingsPanel::-webkit-scrollbar-thumb { background: #444; }
.grp { margin-bottom: 16px; border: 1px solid #2a2a2a; background: #141416; }
.grp-hdr {
  padding: 7px 10px; background: #1c1c1f; border-bottom: 1px solid #2a2a2a;
  color: #8ab4d8; font-size: 11px; font-weight: bold; letter-spacing: 1px;
  cursor: pointer; user-select: none; display: flex; justify-content: space-between;
}
.grp-hdr:hover { background: #222226; }
.grp-hdr .arrow { color: #555; font-size: 10px; }
.grp-body { padding: 8px 10px; }
.grp-body.collapsed { display: none; }
.ctrl { margin-bottom: 8px; }
.ctrl label { display: flex; justify-content: space-between; margin-bottom: 3px; color: #888; }
.ctrl label .cv { color: #70b0e0; min-width: 48px; text-align: right; }
.ctrl input[type="range"] {
  width: 100%; height: 3px; -webkit-appearance: none; appearance: none;
  background: #333; outline: none; cursor: pointer;
}
.ctrl input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 10px; height: 14px;
  background: #5a8ab5; border: 1px solid #7ab0d8; cursor: pointer;
}
.ctrl input[type="range"]::-moz-range-thumb {
  width: 10px; height: 14px; background: #5a8ab5; border: 1px solid #7ab0d8;
  border-radius: 0; cursor: pointer;
}
.ctrl-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.ctrl-row label { flex: 1; color: #888; }
.ctrl-row input[type="checkbox"] { accent-color: #5a8ab5; }
.btn-reset {
  width: 100%; padding: 6px; margin-top: 4px;
  background: #1a1a1a; border: 1px solid #444; color: #a0a0a0;
  font-family: 'Consolas', monospace; font-size: 11px; cursor: pointer;
}
.btn-reset:hover { background: #252525; color: #e0e0e0; }
</style>
</head>
<body>
<div id="hud">
  <div class="title">微体素城市沙盘</div>
  <div class="sep">────────────────────────────</div>
  <div>体素数: <span class="val" id="voxCount">—</span></div>
  <div>帧率: <span class="val" id="fpsVal">—</span></div>
  <div class="sep">────────────────────────────</div>
  <div class="dim">左键: 旋转 | 右键: 平移 | 滚轮: 缩放</div>
</div>
<button id="panelToggle" title="设置">S</button>
<div id="settingsPanel">
  <div class="grp">
    <div class="grp-hdr" data-target="grpAO">SSAO / 环境光遮蔽 <span class="arrow">[-]</span></div>
    <div class="grp-body" id="grpAO">
      <div class="ctrl-row"><label>启用</label><input type="checkbox" id="aoEnable" checked></div>
      <div class="ctrl"><label>采样半径 <span class="cv" id="v_aoRadius">0.50</span></label>
        <input type="range" id="aoRadius" min="0.05" max="2.0" step="0.01" value="0.50"></div>
      <div class="ctrl"><label>最小距离 <span class="cv" id="v_aoMin">0.0010</span></label>
        <input type="range" id="aoMin" min="0.0001" max="0.02" step="0.0001" value="0.001"></div>
      <div class="ctrl"><label>最大距离 <span class="cv" id="v_aoMax">0.120</span></label>
        <input type="range" id="aoMax" min="0.01" max="0.5" step="0.005" value="0.12"></div>
    </div>
  </div>
  <div class="grp">
    <div class="grp-hdr" data-target="grpDOF">移轴 / 景深 <span class="arrow">[-]</span></div>
    <div class="grp-body" id="grpDOF">
      <div class="ctrl-row"><label>启用</label><input type="checkbox" id="dofEnable" checked></div>
      <div class="ctrl-row"><label>自动对焦</label><input type="checkbox" id="dofAutoFocus" checked></div>
      <div class="ctrl"><label>对焦距离 <span class="cv" id="v_dofFocus">22.0</span></label>
        <input type="range" id="dofFocus" min="2.0" max="60.0" step="0.5" value="22.0" disabled></div>
      <div class="ctrl"><label>光圈(移轴强度) <span class="cv" id="v_dofAperture">0.0025</span></label>
        <input type="range" id="dofAperture" min="0.0" max="0.008" step="0.0001" value="0.0025"></div>
      <div class="ctrl"><label>最大模糊 <span class="cv" id="v_dofMaxblur">0.0120</span></label>
        <input type="range" id="dofMaxblur" min="0.0" max="0.04" step="0.001" value="0.012"></div>
      <div class="ctrl"><label>视场角 <span class="cv" id="v_camFov">28</span></label>
        <input type="range" id="camFov" min="12" max="60" step="1" value="28"></div>
    </div>
  </div>
  <div class="grp">
    <div class="grp-hdr" data-target="grpLight">光照 / 环境 <span class="arrow">[-]</span></div>
    <div class="grp-body" id="grpLight">
      <div class="ctrl"><label>主光强度 <span class="cv" id="v_sunInt">5.00</span></label>
        <input type="range" id="sunInt" min="0.0" max="12.0" step="0.1" value="5.0"></div>
      <div class="ctrl"><label>天光强度 <span class="cv" id="v_hemiInt">0.90</span></label>
        <input type="range" id="hemiInt" min="0.0" max="3.0" step="0.05" value="0.9"></div>
      <div class="ctrl"><label>曝光 <span class="cv" id="v_exposure">1.15</span></label>
        <input type="range" id="exposure" min="0.2" max="3.0" step="0.05" value="1.15"></div>
      <div class="ctrl"><label>天空亮度 <span class="cv" id="v_skyBright">1.00</span></label>
        <input type="range" id="skyBright" min="0.2" max="3.0" step="0.05" value="1.0"></div>
    </div>
  </div>
  <div class="grp">
    <div class="grp-hdr" data-target="grpRiver">河流 / 动画 <span class="arrow">[-]</span></div>
    <div class="grp-body" id="grpRiver">
      <div class="ctrl-row"><label>河流动画</label><input type="checkbox" id="riverAnim" checked></div>
      <div class="ctrl"><label>流速 <span class="cv" id="v_riverSpeed">1.00</span></label>
        <input type="range" id="riverSpeed" min="0.1" max="4.0" step="0.1" value="1.0"></div>
    </div>
  </div>
  <div class="grp">
    <div class="grp-hdr" data-target="grpScene">场景 <span class="arrow">[-]</span></div>
    <div class="grp-body" id="grpScene">
      <div class="ctrl-row"><label>锁定帧率</label><input type="checkbox" id="fpsLock" checked></div>
      <div class="ctrl"><label>目标帧率 <span class="cv" id="v_fpsTarget">60</span></label>
        <input type="range" id="fpsTarget" min="15" max="144" step="1" value="60"></div>
    </div>
  </div>
  <button class="btn-reset" id="btnReset">恢复默认设置</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ═══════════════════════════════════════════
// RENDERER
// ═══════════════════════════════════════════
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

// ═══════════════════════════════════════════
// PIXEL-ART SKYBOX (procedural canvas)
// ═══════════════════════════════════════════
function createPixelSky() {
  const size = 64;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  // Gradient sky with pixel bands
  const bands = [
    { y: 0, h: 8, c: '#1a2a4a' },
    { y: 8, h: 8, c: '#2a4a7a' },
    { y: 16, h: 8, c: '#4a7ab0' },
    { y: 24, h: 8, c: '#6a9ad0' },
    { y: 32, h: 8, c: '#8abae8' },
    { y: 40, h: 8, c: '#aad4f8' },
    { y: 48, h: 8, c: '#cce8ff' },
    { y: 56, h: 8, c: '#e8f4ff' }
  ];
  bands.forEach(b => { ctx.fillStyle = b.c; ctx.fillRect(0, b.y, size, b.h); });
  // Pixel clouds
  ctx.fillStyle = '#ffffff';
  const clouds = [[8,20,6,2],[20,16,8,3],[40,22,5,2],[52,14,7,3],[14,26,4,2],[36,12,6,2],[50,28,4,2]];
  clouds.forEach(([cx,cy,w,h]) => { ctx.globalAlpha = 0.7; ctx.fillRect(cx,cy,w,h); });
  ctx.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(canvas);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.mapping = THREE.EquirectangularReflectionMapping;
  return tex;
}
const skyTex = createPixelSky();
scene.background = skyTex;
scene.environment = skyTex;

// ═══════════════════════════════════════════
// CAMERA — 移轴视角
// ═══════════════════════════════════════════
const camera = new THREE.PerspectiveCamera(28, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(18, 16, 18);
camera.lookAt(0, 0, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 8;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI * 0.46;
controls.update();

// ═══════════════════════════════════════════
// MATERIALS
// ═══════════════════════════════════════════
const matBuilding = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.82, metalness: 0, envMapIntensity: 0.3 });
const matRoad = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.95, metalness: 0, envMapIntensity: 0.1 });
const matGlass = new THREE.MeshPhysicalMaterial({
  color: 0xaaddff, roughness: 0.05, metalness: 0, transmission: 0.88, ior: 1.5,
  thickness: 0.3, clearcoat: 1, clearcoatRoughness: 0.02, envMapIntensity: 1.5, transparent: true
});
const matMetal = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.92, clearcoat: 0.3, envMapIntensity: 1.0 });
const matWood = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.88, metalness: 0, envMapIntensity: 0.15 });
const matWater = new THREE.MeshPhysicalMaterial({
  color: 0x2288cc, roughness: 0.1, metalness: 0, transmission: 0.6, ior: 1.33,
  thickness: 1.0, transparent: true, envMapIntensity: 0.8
});
const matVegetation = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.9, metalness: 0, envMapIntensity: 0.2 });
const matTable = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.75, metalness: 0, envMapIntensity: 0.2 });
const matConcrete = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.9, metalness: 0, envMapIntensity: 0.2 });

// ═══════════════════════════════════════════
// VOXEL SYSTEM
// ═══════════════════════════════════════════
const VS = 0.4;
const voxels = { building: [], road: [], glass: [], metal: [], wood: [], water: [], vegetation: [], table: [], concrete: [] };
let seed = 777;
function rand() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
function addV(cat, x, y, z, color) {
  voxels[cat].push({ x: x * VS, y: y * VS + VS * 0.5, z: z * VS, color });
}

// ═══════════════════════════════════════════
// CITY LAYOUT — 40x40 grid
// ═══════════════════════════════════════════
const CITY = 40;
const HALF = CITY / 2;

// --- TABLE BASE (实心桌台) ---
const TABLE_W = CITY + 6, TABLE_H = 4;
for (let ty = -TABLE_H; ty < 0; ty++) {
  for (let tx = -TABLE_W/2; tx < TABLE_W/2; tx++) {
    for (let tz = -TABLE_W/2; tz < TABLE_W/2; tz++) {
      const isEdge = Math.abs(tx) >= TABLE_W/2 - 1 || Math.abs(tz) >= TABLE_W/2 - 1;
      let c;
      if (ty === -1) {
        c = new THREE.Color(0.35 + rand()*0.05, 0.32 + rand()*0.05, 0.28);
      } else if (isEdge) {
        c = new THREE.Color(0.28 + rand()*0.04, 0.22 + rand()*0.03, 0.16);
      } else {
        c = new THREE.Color(0.32 + rand()*0.06, 0.26 + rand()*0.04, 0.18);
      }
      addV('table', tx, ty, tz, c);
    }
  }
}

// --- GROUND / ROADS ---
// Road grid: roads at every 8 cells
const ROAD_W = 2;
function isRoad(x, z) {
  const mx = ((x + HALF) % 10);
  const mz = ((z + HALF) % 10);
  return mx < ROAD_W || mz < ROAD_W;
}
// River: diagonal band
function isRiver(x, z) {
  const riverCenter = x * 0.4 + 2;
  return Math.abs(z - riverCenter) < 2.5;
}

for (let gx = -HALF; gx < HALF; gx++) {
  for (let gz = -HALF; gz < HALF; gz++) {
    if (isRiver(gx, gz)) continue;
    if (isRoad(gx, gz)) {
      const g = 0.18 + rand() * 0.04;
      addV('road', gx, 0, gz, new THREE.Color(g, g, g + 0.01));
      // Lane markings
      const mx = ((gx + HALF) % 10);
      const mz = ((gz + HALF) % 10);
      if ((mx === 0 && gz % 3 === 0) || (mz === 0 && gx % 3 === 0)) {
        addV('road', gx, 1, gz, new THREE.Color(0.85, 0.75, 0.2));
      }
    } else {
      // Sidewalk / ground
      const g = 0.5 + rand() * 0.1;
      addV('concrete', gx, 0, gz, new THREE.Color(g, g * 0.98, g * 0.95));
    }
  }
}

// --- RIVER (体素河流) ---
const riverVoxels = [];
for (let gx = -HALF; gx < HALF; gx++) {
  for (let gz = -HALF; gz < HALF; gz++) {
    if (isRiver(gx, gz)) {
      const depth = -1 - Math.floor(rand() * 2);
      const b = 0.15 + rand() * 0.15;
      const c = new THREE.Color(b * 0.4, b * 0.7, b + 0.3);
      addV('water', gx, depth, gz, c);
      riverVoxels.push({ x: gx, z: gz, y: depth });
      // River bed
      addV('concrete', gx, depth - 1, gz, new THREE.Color(0.25 + rand()*0.05, 0.22, 0.18));
    }
  }
}

// --- BRIDGE over river ---
const bridgeZ = 0;
for (let bx = -HALF; bx < HALF; bx++) {
  if (isRiver(bx, bridgeZ) || isRiver(bx, bridgeZ+1) || isRiver(bx, bridgeZ-1)) {
    for (let bz = bridgeZ - 2; bz <= bridgeZ + 2; bz++) {
      const g = 0.4 + rand() * 0.08;
      addV('concrete', bx, 1, bz, new THREE.Color(g, g*0.95, g*0.9));
      // Railings
      if (bz === bridgeZ - 2 || bz === bridgeZ + 2) {
        addV('metal', bx, 2, bz, new THREE.Color(0.5, 0.5, 0.52));
      }
    }
  }
}

// --- BUILDINGS ---
function addBuilding(bx, bz, w, d, h, style) {
  for (let fy = 1; fy <= h; fy++) {
    for (let fx = 0; fx < w; fx++) {
      for (let fz = 0; fz < d; fz++) {
        const isWall = fx === 0 || fx === w-1 || fz === 0 || fz === d-1;
        if (!isWall && fy < h) continue; // hollow interior
        let c;
        if (style === 'office') {
          // Glass curtain wall
          if (fy > 1 && fy < h && isWall && (fx + fz + fy) % 2 === 0) {
            const t = 0.7 + rand() * 0.3;
            addV('glass', bx+fx, fy, bz+fz, new THREE.Color(t*0.7, t*0.85, t));
            continue;
          }
          const g = 0.55 + rand() * 0.1;
          c = new THREE.Color(g*0.9, g*0.92, g);
        } else if (style === 'residential') {
          if (fy > 1 && isWall && fy % 3 === 2 && (fx + fz) % 2 === 0) {
            addV('glass', bx+fx, fy, bz+fz, new THREE.Color(0.6, 0.75, 0.9));
            continue;
          }
          const r = 0.6 + rand() * 0.15;
          c = new THREE.Color(r, r*0.85, r*0.7);
        } else {
          const g = 0.45 + rand() * 0.15;
          c = new THREE.Color(g, g*0.95, g*0.88);
        }
        addV('building', bx+fx, fy, bz+fz, c);
      }
    }
  }
  // Roof detail
  if (rand() > 0.5) {
    addV('metal', bx + Math.floor(w/2), h+1, bz + Math.floor(d/2), new THREE.Color(0.4, 0.4, 0.42));
  }
}

// Place buildings in blocks
const styles = ['office', 'residential', 'commercial'];
for (let blockX = 0; blockX < 4; blockX++) {
  for (let blockZ = 0; blockZ < 4; blockZ++) {
    const startX = -HALF + 2 + blockX * 10;
    const startZ = -HALF + 2 + blockZ * 10;
    // 2-3 buildings per block
    const numB = 2 + Math.floor(rand() * 2);
    for (let i = 0; i < numB; i++) {
      const bw = 2 + Math.floor(rand() * 3);
      const bd = 2 + Math.floor(rand() * 3);
      const bh = 3 + Math.floor(rand() * 10);
      const ox = startX + Math.floor(rand() * (7 - bw));
      const oz = startZ + Math.floor(rand() * (7 - bd));
      // Skip if on river
      if (isRiver(ox, oz) || isRiver(ox+bw, oz+bd)) continue;
      const style = bh > 8 ? 'office' : styles[Math.floor(rand() * 3)];
      addBuilding(ox, oz, bw, bd, bh, style);
    }
  }
}

// --- TREES ---
function addTree(tx, tz) {
  const th = 2 + Math.floor(rand() * 2);
  for (let y = 1; y <= th; y++) {
    addV('wood', tx, y, tz, new THREE.Color(0.35 + rand()*0.1, 0.22, 0.1));
  }
  // Canopy
  for (let dx = -1; dx <= 1; dx++) {
    for (let dz = -1; dz <= 1; dz++) {
      for (let dy = 0; dy <= 1; dy++) {
        if (dx === 0 && dz === 0 && dy === 0) continue;
        if (Math.abs(dx) + Math.abs(dz) + dy > 2) continue;
        const g = 0.2 + rand() * 0.2;
        addV('vegetation', tx+dx, th+1+dy, tz+dz, new THREE.Color(g*0.4, g, g*0.3));
      }
    }
  }
}
for (let i = 0; i < 30; i++) {
  const tx = -HALF + 2 + Math.floor(rand() * (CITY - 4));
  const tz = -HALF + 2 + Math.floor(rand() * (CITY - 4));
  if (!isRoad(tx, tz) && !isRiver(tx, tz)) addTree(tx, tz);
}

// --- VEHICLES ---
function addCar(cx, cz, dirX, dirZ) {
  const colors = [new THREE.Color(0.8,0.15,0.1), new THREE.Color(0.1,0.3,0.7),
                  new THREE.Color(0.9,0.85,0.2), new THREE.Color(0.2,0.2,0.2), new THREE.Color(0.9,0.9,0.9)];
  const c = colors[Math.floor(rand() * colors.length)];
  addV('metal', cx, 1, cz, c);
  addV('metal', cx+dirX, 1, cz+dirZ, c);
  addV('glass', cx, 2, cz, new THREE.Color(0.5, 0.7, 0.9));
}
for (let i = 0; i < 12; i++) {
  const rx = -HALF + Math.floor(rand() * CITY);
  const rz = -HALF + Math.floor(rand() * CITY);
  const mx = ((rx + HALF) % 10);
  if (mx < ROAD_W && !isRiver(rx, rz)) addCar(rx, rz, 0, 1);
  else if (((rz + HALF) % 10) < ROAD_W && !isRiver(rx, rz)) addCar(rx, rz, 1, 0);
}

// --- STREET LAMPS ---
for (let lx = -HALF; lx < HALF; lx += 5) {
  for (let lz of [-HALF, HALF - 1]) {
    if (isRiver(lx, lz)) continue;
    addV('metal', lx, 1, lz, new THREE.Color(0.3, 0.3, 0.32));
    addV('metal', lx, 2, lz, new THREE.Color(0.3, 0.3, 0.32));
    addV('metal', lx, 3, lz, new THREE.Color(0.9, 0.85, 0.5));
  }
}

// ═══════════════════════════════════════════
// INSTANCED MESHES
// ═══════════════════════════════════════════
const boxGeo = new THREE.BoxGeometry(VS * 0.94, VS * 0.94, VS * 0.94);
const dummy = new THREE.Object3D();
const matMap = { building: matBuilding, road: matRoad, glass: matGlass, metal: matMetal, wood: matWood, water: matWater, vegetation: matVegetation, table: matTable, concrete: matConcrete };
const meshes = [];
let totalVoxels = 0;
let waterMesh = null;

for (const [cat, items] of Object.entries(voxels)) {
  if (!items.length) continue;
  const mesh = new THREE.InstancedMesh(boxGeo, matMap[cat], items.length);
  mesh.castShadow = cat !== 'water';
  mesh.receiveShadow = true;
  for (let i = 0; i < items.length; i++) {
    const v = items[i];
    dummy.position.set(v.x, v.y, v.z);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
    mesh.setColorAt(i, v.color);
  }
  mesh.instanceMatrix.needsUpdate = true;
  mesh.instanceColor.needsUpdate = true;
  scene.add(mesh);
  meshes.push(mesh);
  if (cat === 'water') waterMesh = mesh;
  totalVoxels += items.length;
}
document.getElementById('voxCount').textContent = totalVoxels.toLocaleString();

// ═══════════════════════════════════════════
// LIGHTING
// ═══════════════════════════════════════════
const sunLight = new THREE.DirectionalLight(0xfff8e8, 5.0);
sunLight.position.set(12, 20, 8);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(4096, 4096);
sunLight.shadow.camera.left = -16;
sunLight.shadow.camera.right = 16;
sunLight.shadow.camera.top = 16;
sunLight.shadow.camera.bottom = -16;
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 50;
sunLight.shadow.bias = -0.0003;
sunLight.shadow.normalBias = 0.02;
sunLight.shadow.radius = 2.5;
scene.add(sunLight);

const hemiLight = new THREE.HemisphereLight(0x88aacc, 0x443322, 0.9);
scene.add(hemiLight);

const fillLight = new THREE.DirectionalLight(0xc0d0e8, 1.0);
fillLight.position.set(-8, 6, -6);
scene.add(fillLight);

// ═══════════════════════════════════════════
// POST-PROCESSING — 强化移轴
// ═══════════════════════════════════════════
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const ssaoPass = new SSAOPass(scene, camera, window.innerWidth, window.innerHeight);
ssaoPass.kernelRadius = 0.5;
ssaoPass.minDistance = 0.001;
ssaoPass.maxDistance = 0.12;
composer.addPass(ssaoPass);

const bokehPass = new BokehPass(scene, camera, {
  focus: 22.0, aperture: 0.0025, maxblur: 0.012
});
composer.addPass(bokehPass);
composer.addPass(new OutputPass());

// ═══════════════════════════════════════════
// SETTINGS PANEL
// ═══════════════════════════════════════════
const panel = document.getElementById('settingsPanel');
document.getElementById('panelToggle').addEventListener('click', () => panel.classList.toggle('open'));
document.querySelectorAll('.grp-hdr').forEach(hdr => {
  hdr.addEventListener('click', () => {
    const body = document.getElementById(hdr.dataset.target);
    const arrow = hdr.querySelector('.arrow');
    body.classList.toggle('collapsed');
    arrow.textContent = body.classList.contains('collapsed') ? '[+]' : '[-]';
  });
});
function bind(id, dispId, cb, fmt) {
  const el = document.getElementById(id), d = document.getElementById(dispId);
  el.addEventListener('input', () => { const v = parseFloat(el.value); if (d) d.textContent = fmt ? fmt(v) : v.toFixed(4); cb(v); });
}
document.getElementById('aoEnable').addEventListener('change', e => { ssaoPass.enabled = e.target.checked; });
bind('aoRadius', 'v_aoRadius', v => { ssaoPass.kernelRadius = v; }, v => v.toFixed(2));
bind('aoMin', 'v_aoMin', v => { ssaoPass.minDistance = v; }, v => v.toFixed(4));
bind('aoMax', 'v_aoMax', v => { ssaoPass.maxDistance = v; }, v => v.toFixed(3));

const dofAutoFocusEl = document.getElementById('dofAutoFocus');
const dofFocusSlider = document.getElementById('dofFocus');
document.getElementById('dofEnable').addEventListener('change', e => { bokehPass.enabled = e.target.checked; });
dofAutoFocusEl.addEventListener('change', e => { dofFocusSlider.disabled = e.target.checked; });
bind('dofFocus', 'v_dofFocus', v => { bokehPass.uniforms['focus'].value = v; }, v => v.toFixed(1));
bind('dofAperture', 'v_dofAperture', v => { bokehPass.uniforms['aperture'].value = v; }, v => v.toFixed(4));
bind('dofMaxblur', 'v_dofMaxblur', v => { bokehPass.uniforms['maxblur'].value = v; }, v => v.toFixed(4));
bind('camFov', 'v_camFov', v => { camera.fov = v; camera.updateProjectionMatrix(); }, v => v.toFixed(0));

bind('sunInt', 'v_sunInt', v => { sunLight.intensity = v; }, v => v.toFixed(2));
bind('hemiInt', 'v_hemiInt', v => { hemiLight.intensity = v; }, v => v.toFixed(2));
bind('exposure', 'v_exposure', v => { renderer.toneMappingExposure = v; }, v => v.toFixed(2));
bind('skyBright', 'v_skyBright', v => { skyTex.repeat.set(1,1); scene.backgroundIntensity = v; scene.environmentIntensity = v; }, v => v.toFixed(2));

const riverAnimEl = document.getElementById('riverAnim');
const riverSpeedEl = document.getElementById('riverSpeed');
bind('riverSpeed', 'v_riverSpeed', v => {}, v => v.toFixed(2));

const fpsLockEl = document.getElementById('fpsLock');
const fpsTargetEl = document.getElementById('fpsTarget');
bind('fpsTarget', 'v_fpsTarget', v => {}, v => v.toFixed(0));
document.getElementById('btnReset').addEventListener('click', () => location.reload());

// ═══════════════════════════════════════════
// ANIMATION
// ═══════════════════════════════════════════
let frameCount = 0, lastFpsTime = performance.now(), lastRenderTime = 0;
const fpsEl = document.getElementById('fpsVal');
const waterColor = new THREE.Color();

function animate(timestamp) {
  requestAnimationFrame(animate);
  if (fpsLockEl.checked) {
    const interval = 1000 / parseFloat(fpsTargetEl.value);
    const elapsed = timestamp - lastRenderTime;
    if (elapsed < interval) return;
    lastRenderTime = timestamp - (elapsed % interval);
  }
  controls.update();

  // 自动对焦
  if (dofAutoFocusEl.checked && bokehPass.enabled) {
    const dist = camera.position.distanceTo(controls.target);
    bokehPass.uniforms['focus'].value = dist;
    dofFocusSlider.value = dist;
    document.getElementById('v_dofFocus').textContent = dist.toFixed(1);
  }

  // 河流颜色动画
  if (riverAnimEl.checked && waterMesh) {
    const t = performance.now() * 0.001 * parseFloat(riverSpeedEl.value);
    const count = waterMesh.count;
    for (let i = 0; i < count; i += 3) {
      const phase = (i * 0.1 + t) % (Math.PI * 2);
      const b = 0.35 + Math.sin(phase) * 0.12;
      waterColor.setRGB(b * 0.3, b * 0.6, b + 0.25);
      waterMesh.setColorAt(i, waterColor);
      if (i+1 < count) waterMesh.setColorAt(i+1, waterColor);
      if (i+2 < count) waterMesh.setColorAt(i+2, waterColor);
    }
    waterMesh.instanceColor.needsUpdate = true;
  }

  composer.render();
  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime >= 1000) { fpsEl.textContent = frameCount; frameCount = 0; lastFpsTime = now; }
}
requestAnimationFrame(animate);

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  ssaoPass.setSize(w, h);
});
</script>
</body>
</html>
