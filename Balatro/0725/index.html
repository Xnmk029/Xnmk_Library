<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balatro - 小丑牌</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- 背景粒子层 -->
        <canvas id="bg-canvas"></canvas>
        <div id="crt-overlay"></div>

        <!-- 顶部信息栏 -->
        <header id="top-bar">
            <div id="ante-info">
                <span class="label">底注</span>
                <span id="ante-num" class="value">1</span>
                <span class="separator">/</span>
                <span class="label">轮次</span>
                <span id="round-num" class="value">1</span>
            </div>
            <div id="blind-info">
                <div id="blind-badge" class="blind-small">
                    <span id="blind-name">小盲注</span>
                </div>
                <div id="score-target">
                    <span class="label">目标分数</span>
                    <span id="target-score" class="value">300</span>
                </div>
            </div>
            <div id="money-info">
                <span class="money-icon">$</span>
                <span id="money-value" class="value">4</span>
            </div>
        </header>

        <!-- 计分区 -->
        <section id="score-section">
            <div id="hand-name-display">
                <span id="hand-type-name">高牌</span>
                <span id="hand-level">Lv.1</span>
            </div>
            <div id="score-display">
                <div id="chip-display" class="score-box chip-box">
                    <span class="score-label">筹码</span>
                    <span id="chip-value" class="score-value">0</span>
                </div>
                <div id="mult-display" class="score-box mult-box">
                    <span class="score-label">倍率</span>
                    <span id="mult-value" class="score-value">×1</span>
                </div>
                <div id="total-score-box" class="score-box total-box">
                    <span class="score-label">得分</span>
                    <span id="total-score" class="score-value">0</span>
                </div>
            </div>
            <div id="round-score">
                <span class="label">本轮得分</span>
                <span id="round-score-value">0</span>
                <span class="separator">/</span>
                <span id="round-target">300</span>
            </div>
        </section>

        <!-- 小丑牌区 -->
        <section id="joker-section">
            <div id="joker-slots"></div>
        </section>

        <!-- 主游戏区 -->
        <main id="play-area">
            <!-- 打出的牌展示区 -->
            <div id="played-cards-area"></div>
            <!-- 手牌区 -->
            <div id="hand-area"></div>
        </main>

        <!-- 底部操作栏 -->
        <footer id="bottom-bar">
            <div id="hand-actions">
                <button id="btn-sort-rank" class="action-btn sort-btn" title="按点数排序">点数</button>
                <button id="btn-sort-suit" class="action-btn sort-btn" title="按花色排序">花色</button>
            </div>
            <div id="main-actions">
                <button id="btn-play" class="action-btn play-btn">出牌</button>
                <button id="btn-discard" class="action-btn discard-btn">弃牌</button>
            </div>
            <div id="action-counts">
                <div class="count-item">
                    <span class="count-label">出牌次数</span>
                    <span id="hands-left" class="count-value">4</span>
                </div>
                <div class="count-item">
                    <span class="count-label">弃牌次数</span>
                    <span id="discards-left" class="count-value">3</span>
                </div>
            </div>
        </footer>

        <!-- 商店界面 -->
        <div id="shop-overlay" class="overlay hidden">
            <div id="shop-panel">
                <h2 class="shop-title">商 店</h2>
                <div id="shop-items"></div>
                <div id="shop-actions">
                    <button id="btn-reroll" class="shop-btn">刷新 ($5)</button>
                    <button id="btn-next-round" class="shop-btn next-btn">下一轮</button>
                </div>
            </div>
        </div>

        <!-- 盲注选择界面 -->
        <div id="blind-select-overlay" class="overlay hidden">
            <div id="blind-select-panel">
                <h2>选择盲注</h2>
                <div id="blind-options"></div>
            </div>
        </div>

        <!-- 游戏结束界面 -->
        <div id="gameover-overlay" class="overlay hidden">
            <div id="gameover-panel">
                <h2 id="gameover-title">游戏结束</h2>
                <p id="gameover-info"></p>
                <button id="btn-restart" class="shop-btn next-btn">重新开始</button>
            </div>
        </div>

        <!-- 计分动画层 -->
        <div id="scoring-fx-layer"></div>
        <!-- 粒子特效层 -->
        <canvas id="fx-canvas"></canvas>
    </div>

    <script src="js/cards.js"></script>
    <script src="js/poker.js"></script>
    <script src="js/jokers.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
