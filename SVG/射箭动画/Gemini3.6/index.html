<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>复合弓开弓放箭高精度动画与机械原理特写 (Compound Bow Animation)</title>
  <style>
    :root {
      --bg-color: #080b10;
      --panel-bg: rgba(18, 24, 36, 0.75);
      --panel-border: rgba(214, 175, 55, 0.3);
      --accent-gold: #d4af37;
      --accent-cyan: #00ffcc;
      --accent-red: #ff3344;
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
    }

    /* HEADER HUD */
    header {
      width: 100%;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(12, 16, 24, 0.95) 0%, rgba(12, 16, 24, 0) 100%);
      position: absolute;
      top: 0;
      left: 0;
      z-index: 100;
      pointer-events: none;
    }

    .title-box {
      pointer-events: auto;
    }

    .title-box h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-box h1 span {
      background: linear-gradient(135deg, var(--accent-gold), #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .hud-badge {
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* MAIN VIEWPORT */
    .viewport-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #svg-wrapper {
      width: 100%;
      height: 100%;
      max-width: 1920px;
      max-height: 1080px;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: 50% 50%;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* CAMERA ZOOM MODES */
    .viewport-container[data-cam="closeup"] #svg-wrapper {
      transform: scale(1.75) translate(80px, -20px);
    }
    .viewport-container[data-cam="cam-focus"] #svg-wrapper {
      transform: scale(2.2) translate(160px, -180px);
    }
    .viewport-container[data-cam="wide"] #svg-wrapper {
      transform: scale(1) translate(0, 0);
    }

    /* HUD OVERLAY TELEMETRY */
    .telemetry-overlay {
      position: absolute;
      top: 90px;
      right: 30px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 16px;
      width: 240px;
      pointer-events: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .telemetry-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.8rem;
    }

    .telemetry-label {
      color: var(--text-muted);
    }

    .telemetry-val {
      font-family: monospace;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    .force-curve-bar {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }

    .force-curve-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00ffcc, #d4af37, #ff3344);
      transition: width 0.05s linear;
    }

    /* CONTROLS BAR AT BOTTOM */
    .controls-panel {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      z-index: 100;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(212, 175, 55, 0.2);
      border-color: var(--accent-gold);
      transform: translateY(-2px);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-gold), #aa8011);
      border: none;
      color: #000;
      font-weight: 700;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #ffe066, var(--accent-gold));
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.7);
    }

    .btn-danger {
      background: linear-gradient(135deg, #ff3344, #990011);
      border: none;
      color: #fff;
    }

    .btn-danger:hover {
      background: linear-gradient(135deg, #ff6677, #ff3344);
      box-shadow: 0 0 20px rgba(255, 51, 68, 0.6);
    }

    /* SLIDER CONTROL */
    .scrub-container {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 220px;
    }

    .scrub-slider {
      flex: 1;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    /* SPEED SELECTOR */
    .speed-selector {
      display: flex;
      background: rgba(0,0,0,0.3);
      border-radius: 6px;
      padding: 3px;
    }

    .speed-opt {
      padding: 5px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .speed-opt.active {
      background: var(--accent-gold);
      color: #000;
    }

    /* CAM SELECTOR */
    .cam-btn {
      padding: 6px 12px;
      font-size: 0.75rem;
      border-radius: 6px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-muted);
      cursor: pointer;
    }
    .cam-btn.active {
      background: rgba(0, 255, 204, 0.15);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    /* KEYFRAME CAPTION ANNOTATION */
    .action-caption {
      position: absolute;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      padding: 8px 24px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 0.95rem;
      letter-spacing: 1px;
      color: var(--accent-cyan);
      text-transform: uppercase;
      font-weight: 600;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      .controls-panel {
        flex-direction: column;
        width: 90%;
        bottom: 15px;
      }
      .scrub-container {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER HUD -->
  <header>
    <div class="title-box">
      <h1><span>COMPOUND BOW</span> 复合弓开弓与放箭特写</h1>
      <div class="subtitle">Real-Time Kinematic Simulation & Motion Study</div>
    </div>
    <div class="hud-badge">60 LBS / 80% LET-OFF</div>
  </header>

  <!-- CAPTION -->
  <div class="action-caption" id="action-status">准备就绪 (RESTING)</div>

  <!-- TELEMETRY OVERLAY PANEL -->
  <div class="telemetry-overlay">
    <div class="telemetry-row">
      <span class="telemetry-label">拉距离 (Draw Length):</span>
      <span class="telemetry-val" id="val-draw-len">0.0 in</span>
    </div>
    <div class="telemetry-row">
      <span class="telemetry-label">持弓拉力 (Holding Weight):</span>
      <span class="telemetry-val" id="val-draw-weight">0.0 lbs</span>
    </div>
    <div class="telemetry-row">
      <span class="telemetry-label">偏心轮旋转角 (Cam Angle):</span>
      <span class="telemetry-val" id="val-cam-angle">0°</span>
    </div>
    <div class="telemetry-row">
      <span class="telemetry-label">箭矢初速 (Arrow Velocity):</span>
      <span class="telemetry-val" id="val-arrow-fps">0 FPS</span>
    </div>
    <div style="margin-top: 8px;">
      <div class="telemetry-row" style="margin-bottom: 2px;">
        <span class="telemetry-label">拉力墙峰值 (Force Profile):</span>
        <span class="telemetry-val" id="val-let-off">0%</span>
      </div>
      <div class="force-curve-bar">
        <div class="force-curve-fill" id="force-bar"></div>
      </div>
    </div>
  </div>

  <!-- SVG SCENE CONTAINER -->
  <div class="viewport-container" id="viewport" data-cam="closeup">
    <div id="svg-wrapper">
      <!-- Embedded SVG -->
      <svg id="compound-svg" viewBox="0 0 1600 900" width="100%" height="100%">
        <defs>
          <!-- Background Gradients & Filters -->
          <radialGradient id="sky-grad" cx="50%" cy="30%" r="80%">
            <stop offset="0%" stop-color="#1c2636"/>
            <stop offset="50%" stop-color="#0e141f"/>
            <stop offset="100%" stop-color="#05080d"/>
          </radialGradient>

          <radialGradient id="sun-flare" cx="85%" cy="25%" r="50%">
            <stop offset="0%" stop-color="#ffaa44" stop-opacity="0.45"/>
            <stop offset="30%" stop-color="#ff6600" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
          </radialGradient>

          <linearGradient id="metal-riser" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4a4e59"/>
            <stop offset="25%" stop-color="#22252c"/>
            <stop offset="50%" stop-color="#606778"/>
            <stop offset="75%" stop-color="#181a1f"/>
            <stop offset="100%" stop-color="#32363f"/>
          </linearGradient>

          <linearGradient id="carbon-pattern-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#111317"/>
            <stop offset="50%" stop-color="#282c36"/>
            <stop offset="100%" stop-color="#0d0e12"/>
          </linearGradient>

          <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffe066"/>
            <stop offset="50%" stop-color="#d4af37"/>
            <stop offset="100%" stop-color="#aa8011"/>
          </linearGradient>

          <linearGradient id="cam-metal" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a0aab8"/>
            <stop offset="30%" stop-color="#3e434d"/>
            <stop offset="70%" stop-color="#1f2228"/>
            <stop offset="100%" stop-color="#666f7d"/>
          </linearGradient>

          <linearGradient id="limb-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2b303a"/>
            <stop offset="20%" stop-color="#474f5e"/>
            <stop offset="80%" stop-color="#1e2128"/>
            <stop offset="100%" stop-color="#121418"/>
          </linearGradient>

          <linearGradient id="arrow-shaft" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#555b6b"/>
            <stop offset="50%" stop-color="#22252e"/>
            <stop offset="100%" stop-color="#12141a"/>
          </linearGradient>

          <linearGradient id="arrow-tip" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#dddddd"/>
            <stop offset="40%" stop-color="#ffffff"/>
            <stop offset="70%" stop-color="#888888"/>
            <stop offset="100%" stop-color="#333333"/>
          </linearGradient>

          <linearGradient id="string-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ff6600"/>
            <stop offset="50%" stop-color="#ffaa33"/>
            <stop offset="100%" stop-color="#dd4400"/>
          </linearGradient>

          <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>

          <filter id="glow-red" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>

          <filter id="blur-bg" x="0" y="0" width="1600" height="900" filterUnits="userSpaceOnUse">
            <feGaussianBlur stdDeviation="7"/>
          </filter>

          <pattern id="carbon-pattern" width="6" height="6" patternUnits="userSpaceOnUse">
            <rect width="6" height="6" fill="#15171c"/>
            <polygon points="0,0 3,0 0,3" fill="#292e3a"/>
            <polygon points="3,3 6,3 3,6" fill="#292e3a"/>
            <polygon points="3,0 6,3 6,0" fill="#1c1f26"/>
            <polygon points="0,3 3,6 0,6" fill="#1c1f26"/>
          </pattern>
        </defs>

        <!-- BACKGROUND SCENE -->
        <g id="scene-background">
          <rect width="1600" height="900" fill="url(#sky-grad)"/>

          <!-- Distant Target Range Forest -->
          <g filter="url(#blur-bg)" opacity="0.65">
            <path d="M 0 650 Q 200 580 400 620 T 800 590 T 1200 640 T 1600 600 L 1600 900 L 0 900 Z" fill="#0e1a28"/>
            <polygon points="100,620 130,500 160,620" fill="#0c1622"/>
            <polygon points="140,630 170,480 200,630" fill="#08101a"/>
            <polygon points="250,640 290,460 330,640" fill="#0c1622"/>
            <polygon points="850,610 890,440 930,610" fill="#08101a"/>
            <polygon points="1250,630 1290,470 1330,630" fill="#0c1622"/>

            <!-- Distant Target (Bokeh Circle Glow) -->
            <g transform="translate(1380, 420)">
              <circle cx="0" cy="0" r="90" fill="#ffffff" opacity="0.15"/>
              <circle cx="0" cy="0" r="72" fill="#000000" opacity="0.2"/>
              <circle cx="0" cy="0" r="54" fill="#0088cc" opacity="0.25"/>
              <circle cx="0" cy="0" r="36" fill="#cc0000" opacity="0.3"/>
              <circle cx="0" cy="0" r="18" fill="#ffcc00" opacity="0.45"/>
            </g>
          </g>

          <rect width="1600" height="900" fill="url(#sun-flare)" style="mix-blend-mode: screen;"/>
        </g>

        <!-- ARCHER & RELEASE HAND LAYER -->
        <g id="archer-layer">
          <!-- Archer Face (Background Bokeh Depth) -->
          <g id="archer-head" opacity="0.8" filter="url(#blur-bg)">
            <path d="M 220 310 C 230 260 270 230 320 240 C 360 250 380 280 380 320 C 370 360 350 390 320 400 C 290 410 250 400 230 360 Z" fill="#362823"/>
            <path d="M 230 300 C 240 240 310 220 370 240 L 410 270 L 350 280 Z" fill="#141820"/>
          </g>

          <!-- Archer Left Arm (Extending to Bow Grip) -->
          <g id="left-arm">
            <path d="M 120 540 Q 250 510 500 480 Q 560 475 620 475 L 610 535 Q 540 540 240 580 Z" fill="#1a202c"/>
            <rect x="350" y="500" width="140" height="45" rx="8" fill="#111317" stroke="#d4af37" stroke-width="1.5" transform="rotate(-6, 420, 520)"/>
            <g id="left-hand" transform="translate(605, 440)">
              <path d="M 10 25 C 20 20 35 25 40 35 C 42 45 30 55 15 50 Z" fill="#8c624d"/>
              <path d="M 15 35 Q 35 30 45 55 Q 35 75 10 70 Z" fill="#6e4a39"/>
              <path d="M -10 20 L 25 15 L 30 75 L -15 80 Z" fill="#252a34" stroke="#404856" stroke-width="1"/>
            </g>
          </g>

          <!-- Archer Right Arm & Caliper Release Aid -->
          <g id="right-arm-group">
            <path id="right-forearm" d="M 40 470 Q 150 460 260 460 L 270 515 Q 150 520 30 530 Z" fill="#1a202c"/>
            <g id="release-aid-group" transform="translate(0,0)">
              <rect id="release-strap" x="230" y="460" width="45" height="55" rx="6" fill="#4a3525" stroke="#2a1c12" stroke-width="2"/>
              <circle cx="252" cy="487" r="5" fill="#d4af37"/>
              <path d="M 270 487 L 310 487" stroke="#a0a8b8" stroke-width="7" stroke-linecap="round"/>
              <path d="M 270 487 L 310 487" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

              <g id="caliper-jaw-group" transform="translate(310, 472)">
                <rect x="0" y="5" width="28" height="20" rx="4" fill="url(#cam-metal)" stroke="#111" stroke-width="1"/>
                <path id="trigger-lever" d="M 10 25 C 8 35 15 42 12 48" stroke="#d4af37" stroke-width="4" stroke-linecap="round" fill="none"/>
                <path id="jaw-upper" d="M 28 8 L 40 8 C 44 8 45 12 40 14 L 28 14 Z" fill="#d0d5dd" stroke="#333" stroke-width="1"/>
                <path id="jaw-lower" d="M 28 16 L 40 16 C 44 16 45 20 40 22 L 28 22 Z" fill="#a0a8b8" stroke="#333" stroke-width="1"/>
              </g>
            </g>
          </g>
        </g>

        <!-- COMPOUND BOW LAYER -->
        <g id="compound-bow">
          <!-- Stabilizer Rod -->
          <g id="stabilizer" transform="translate(635, 510)">
            <rect x="0" y="-8" width="320" height="16" rx="3" fill="url(#carbon-pattern)" stroke="#333" stroke-width="1"/>
            <line x1="0" y1="-3" x2="320" y2="-3" stroke="#525866" stroke-width="1.5" opacity="0.6"/>
            <rect x="240" y="-14" width="18" height="28" rx="4" fill="#111" stroke="#444" stroke-width="1"/>
            <rect x="262" y="-14" width="18" height="28" rx="4" fill="#111" stroke="#444" stroke-width="1"/>
            <rect x="285" y="-16" width="15" height="32" rx="2" fill="url(#gold-accent)"/>
            <rect x="303" y="-16" width="15" height="32" rx="2" fill="url(#gold-accent)"/>
            <circle cx="322" cy="0" r="6" fill="#222"/>
          </g>

          <!-- Bow Riser -->
          <g id="riser">
            <path id="riser-body" d="M 640 220 Q 625 280 620 340 Q 615 400 610 440 L 600 480 Q 615 540 620 600 Q 628 660 640 700 L 670 690 Q 655 640 650 580 Q 645 520 645 480 L 655 440 Q 655 380 658 320 Q 662 260 670 230 Z" fill="url(#metal-riser)" stroke="#111317" stroke-width="2"/>
            <g fill="#0c0e12" stroke="#454b57" stroke-width="1.5">
              <polygon points="638,250 655,255 650,290 634,285"/>
              <polygon points="632,305 650,310 646,355 628,350"/>
              <polygon points="626,370 645,375 642,415 623,410"/>
              <polygon points="623,510 642,505 645,550 626,555"/>
              <polygon points="628,570 647,565 651,615 632,620"/>
              <polygon points="635,635 654,630 659,670 640,675"/>
            </g>
            <path d="M 665 235 L 670 230 L 658 320 L 653 323 Z" fill="url(#gold-accent)"/>
            <path d="M 665 685 L 670 690 L 658 600 L 653 597 Z" fill="url(#gold-accent)"/>

            <path d="M 605 440 C 600 455 600 475 607 490 L 625 485 C 620 470 620 455 623 442 Z" fill="#5c3a21" stroke="#2b1a0e" stroke-width="1.5"/>

            <g id="cable-guard">
              <line x1="635" y1="430" x2="550" y2="435" stroke="#a0a8b8" stroke-width="6" stroke-linecap="round"/>
              <rect x="560" y="426" width="18" height="18" rx="3" fill="#111" stroke="#d4af37" stroke-width="1.5"/>
            </g>

            <g id="sight-assembly" transform="translate(635, 360)">
              <rect x="0" y="-6" width="110" height="12" rx="2" fill="url(#carbon-pattern-grad)" stroke="#444" stroke-width="1"/>
              <circle cx="20" cy="0" r="4" fill="url(#gold-accent)"/>
              <circle cx="50" cy="0" r="4" fill="url(#gold-accent)"/>
              <g transform="translate(110, 0)">
                <circle cx="0" cy="0" r="28" fill="none" stroke="#222" stroke-width="7"/>
                <circle cx="0" cy="0" r="28" fill="none" stroke="url(#gold-accent)" stroke-width="2"/>
                <circle cx="0" cy="0" r="24" fill="#05101a" opacity="0.7"/>
                <rect x="-12" y="15" width="24" height="7" rx="3" fill="#00ff66" stroke="#111" stroke-width="1" opacity="0.9"/>
                <circle cx="-2" cy="18.5" r="2.5" fill="#ffffff"/>
                <line x1="-22" y1="-10" x2="-4" y2="-10" stroke="#00ff44" stroke-width="2"/>
                <circle cx="-4" cy="-10" r="2.5" fill="#66ff88" filter="url(#glow-green)"/>
                <line x1="-22" y1="0" x2="-4" y2="0" stroke="#ff2200" stroke-width="2"/>
                <circle cx="-4" cy="0" r="2.5" fill="#ff6655" filter="url(#glow-red)"/>
                <line x1="-22" y1="10" x2="-4" y2="10" stroke="#ffcc00" stroke-width="2"/>
                <circle cx="-4" cy="10" r="2.5" fill="#ffee66"/>
              </g>
            </g>

            <!-- Drop-Away Arrow Rest -->
            <g id="arrow-rest" transform="translate(625, 455)">
              <rect x="0" y="-8" width="20" height="16" rx="2" fill="#222" stroke="#555" stroke-width="1"/>
              <path id="rest-launcher" d="M 15 0 L 35 -12 L 40 -10 L 22 4 Z" fill="url(#gold-accent)"/>
            </g>
          </g>

          <!-- UPPER LIMB ASSEMBLY -->
          <g id="upper-limb-group">
            <rect x="635" y="200" width="35" height="30" rx="4" fill="#181a20" stroke="#555" stroke-width="1.5" transform="rotate(-15, 650, 215)"/>
            <circle cx="648" cy="215" r="5" fill="url(#gold-accent)"/>
            <path id="upper-limb-back" d="M 645 205 Q 640 140 655 75" fill="none" stroke="url(#limb-grad)" stroke-width="14" stroke-linecap="round"/>
            <path id="upper-limb-front" d="M 655 210 Q 650 145 665 80" fill="none" stroke="url(#limb-grad)" stroke-width="14" stroke-linecap="round"/>

            <g id="upper-cam-pivot" transform="translate(660, 77)">
              <g id="upper-cam" transform="rotate(0)">
                <path d="M 0 0 C 35 -40 55 10 25 45 C -10 60 -45 30 -30 -10 Z" fill="url(#cam-metal)" stroke="#111" stroke-width="2"/>
                <circle cx="12" cy="5" r="10" fill="#0c0e12" stroke="#444" stroke-width="1"/>
                <circle cx="-12" cy="18" r="8" fill="#0c0e12" stroke="#444" stroke-width="1"/>
                <path d="M -5 -15 C 10 -25 25 -15 15 -5 Z" fill="#0c0e12" stroke="#444" stroke-width="1"/>
                <path d="M 0 0 C 35 -40 55 10 25 45 C -10 60 -45 30 -30 -10 Z" fill="none" stroke="url(#gold-accent)" stroke-width="1.5"/>
              </g>
              <circle cx="0" cy="0" r="5" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
            </g>
          </g>

          <!-- LOWER LIMB ASSEMBLY -->
          <g id="lower-limb-group">
            <rect x="635" y="670" width="35" height="30" rx="4" fill="#181a20" stroke="#555" stroke-width="1.5" transform="rotate(15, 650, 685)"/>
            <circle cx="648" cy="685" r="5" fill="url(#gold-accent)"/>
            <path id="lower-limb-back" d="M 645 695 Q 640 760 655 825" fill="none" stroke="url(#limb-grad)" stroke-width="14" stroke-linecap="round"/>
            <path id="lower-limb-front" d="M 655 690 Q 650 755 665 820" fill="none" stroke="url(#limb-grad)" stroke-width="14" stroke-linecap="round"/>

            <g id="lower-cam-pivot" transform="translate(660, 823)">
              <g id="lower-cam" transform="rotate(0)">
                <path d="M 0 0 C 35 40 55 -10 25 -45 C -10 -60 -45 -30 -30 10 Z" fill="url(#cam-metal)" stroke="#111" stroke-width="2"/>
                <circle cx="12" cy="-5" r="10" fill="#0c0e12" stroke="#444" stroke-width="1"/>
                <circle cx="-12" cy="-18" r="8" fill="#0c0e12" stroke="#444" stroke-width="1"/>
                <path d="M -5 15 C 10 25 25 15 15 5 Z" fill="#0c0e12" stroke="#444" stroke-width="1"/>
                <path d="M 0 0 C 35 40 55 -10 25 -45 C -10 -60 -45 -30 -30 10 Z" fill="none" stroke="url(#gold-accent)" stroke-width="1.5"/>
              </g>
              <circle cx="0" cy="0" r="5" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
            </g>
          </g>

          <!-- CABLES AND STRING SYSTEM -->
          <g id="cables-and-strings">
            <line id="cable-1" x1="650" y1="85" x2="665" y2="810" stroke="#778899" stroke-width="2.5" stroke-dasharray="8,3"/>
            <line id="cable-2" x1="650" y1="815" x2="665" y2="90" stroke="#778899" stroke-width="2.5" stroke-dasharray="8,3"/>

            <path id="main-string-top" d="M 670 95 L 670 487" stroke="url(#string-grad)" stroke-width="3" stroke-linecap="round"/>
            <path id="main-string-bottom" d="M 670 487 L 670 805" stroke="url(#string-grad)" stroke-width="3" stroke-linecap="round"/>

            <g id="peep-sight" transform="translate(670, 390) rotate(50)">
              <ellipse cx="0" cy="0" rx="8" ry="5" fill="#111" stroke="url(#gold-accent)" stroke-width="2"/>
              <ellipse cx="0" cy="0" rx="4" ry="2" fill="none" stroke="#fff" stroke-width="1"/>
            </g>

            <g id="d-loop-group" transform="translate(670, 487)">
              <path id="d-loop-path" d="M 0 -8 C -15 -8 -20 -2 -20 0 C -20 2 -15 8 0 8" fill="none" stroke="#00ffcc" stroke-width="3" stroke-linecap="round"/>
            </g>
          </g>

          <!-- ARROW ASSEMBLY -->
          <g id="arrow-group">
            <line id="arrow-streak" x1="0" y1="472" x2="0" y2="472" stroke="#ffaa00" stroke-width="8" opacity="0" stroke-linecap="round"/>
            <!-- Flexing arrow path (dynamic path during paradox launch) -->
            <path id="arrow-flex-path" d="M 665 472 L 995 472" fill="none" stroke="none"/>

            <g id="arrow-body" transform="translate(665, 472)">
              <line id="arrow-shaft-line" x1="0" y1="0" x2="330" y2="0" stroke="url(#arrow-shaft)" stroke-width="6.5" stroke-linecap="square"/>
              <line id="arrow-highlight" x1="0" y1="-1.5" x2="330" y2="-1.5" stroke="#60687b" stroke-width="1"/>
              <path id="arrow-nock" d="M -8 -3 L 0 -3 L 0 3 L -8 3 C -11 3 -11 -3 -8 -3 Z" fill="#00ffcc" stroke="#00b386" stroke-width="1"/>
              <g id="fletching" transform="translate(15, 0)">
                <path d="M 0 -3 L 15 -18 Q 45 -20 55 -3 Z" fill="#ff5500" stroke="#cc3300" stroke-width="1"/>
                <path d="M 0 3 L 15 18 Q 45 20 55 3 Z" fill="#ffaa00" stroke="#cc8800" stroke-width="1"/>
                <path d="M 5 -1 L 20 -8 Q 48 -9 55 -1 Z" fill="#ccff00" stroke="#99cc00" stroke-width="1" opacity="0.9"/>
              </g>
              <path id="arrow-tip-head" d="M 330 -3.5 L 350 0 L 330 3.5 Z" fill="url(#arrow-tip)" stroke="#111" stroke-width="0.8"/>
            </g>
          </g>

          <!-- SHOCKWAVE & SPARKS FX -->
          <g id="fx-layer">
            <circle id="fx-shockwave" cx="670" cy="487" r="10" fill="none" stroke="#ffffff" stroke-width="4" opacity="0"/>
            <g id="fx-particles" opacity="0">
              <circle cx="690" cy="470" r="3" fill="#ffea00"/>
              <circle cx="680" cy="510" r="2" fill="#ff6600"/>
              <circle cx="710" cy="480" r="4" fill="#ffffff"/>
              <circle cx="660" cy="450" r="2.5" fill="#ffaa00"/>
            </g>
          </g>
        </g>
      </svg>
    </div>
  </div>

  <!-- BOTTOM CONTROLS PANEL -->
  <div class="controls-panel">
    <!-- ACTION BUTTONS -->
    <div class="btn-group">
      <button class="btn btn-primary" id="btn-draw">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L4 10h5v12h6V10h5L12 2z" transform="rotate(-90 12 12)"/></svg>
        拉弓开弓 (DRAW)
      </button>
      <button class="btn btn-danger" id="btn-release" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
        扣动放箭 (RELEASE)
      </button>
      <button class="btn" id="btn-replay">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
        重置 (RESET)
      </button>
    </div>

    <!-- SCRUBBER SLIDER -->
    <div class="scrub-container">
      <span style="font-size:0.75rem; color:var(--text-muted);">进度</span>
      <input type="range" class="scrub-slider" id="scrubber" min="0" max="100" value="0">
    </div>

    <!-- SPEED MODES -->
    <div class="speed-selector">
      <div class="speed-opt" data-speed="0.25">0.25x 慢放</div>
      <div class="speed-opt" data-speed="0.5">0.5x</div>
      <div class="speed-opt active" data-speed="1.0">1.0x 正常</div>
    </div>

    <!-- CAMERA ANGLES -->
    <div class="btn-group">
      <button class="cam-btn active" data-cam="closeup">特写镜头</button>
      <button class="cam-btn" data-cam="cam-focus">轮轴结构</button>
      <button class="cam-btn" data-cam="wide">全景视角</button>
    </div>
  </div>

  <!-- JAVASCRIPT KINEMATICS ENGINE -->
  <script>
    // --- KINEMATIC PARAMETERS & SVG ELEMENT REFS ---
    const drawBtn = document.getElementById('btn-draw');
    const releaseBtn = document.getElementById('btn-release');
    const replayBtn = document.getElementById('btn-replay');
    const scrubber = document.getElementById('scrubber');
    const actionStatus = document.getElementById('action-status');
    const viewport = document.getElementById('viewport');

    // Telemetry display elements
    const valDrawLen = document.getElementById('val-draw-len');
    const valDrawWeight = document.getElementById('val-draw-weight');
    const valCamAngle = document.getElementById('val-cam-angle');
    const valArrowFps = document.getElementById('val-arrow-fps');
    const valLetOff = document.getElementById('val-let-off');
    const forceBar = document.getElementById('force-bar');

    // Dynamic SVG elements
    const upperLimbBack = document.getElementById('upper-limb-back');
    const upperLimbFront = document.getElementById('upper-limb-front');
    const lowerLimbBack = document.getElementById('lower-limb-back');
    const lowerLimbFront = document.getElementById('lower-limb-front');
    const upperCamPivot = document.getElementById('upper-cam-pivot');
    const lowerCamPivot = document.getElementById('lower-cam-pivot');
    const upperCam = document.getElementById('upper-cam');
    const lowerCam = document.getElementById('lower-cam');
    const mainStringTop = document.getElementById('main-string-top');
    const mainStringBottom = document.getElementById('main-string-bottom');
    const cable1 = document.getElementById('cable-1');
    const cable2 = document.getElementById('cable-2');
    const peepSight = document.getElementById('peep-sight');
    const dLoopGroup = document.getElementById('d-loop-group');
    const arrowGroup = document.getElementById('arrow-group');
    const arrowBody = document.getElementById('arrow-body');
    const arrowStreak = document.getElementById('arrow-streak');
    const rightArmGroup = document.getElementById('right-arm-group');
    const rightForearm = document.getElementById('right-forearm');
    const triggerLever = document.getElementById('trigger-lever');
    const jawUpper = document.getElementById('jaw-upper');
    const jawLower = document.getElementById('jaw-lower');
    const restLauncher = document.getElementById('rest-launcher');
    const stabilizer = document.getElementById('stabilizer');
    const fxShockwave = document.getElementById('fx-shockwave');
    const fxParticles = document.getElementById('fx-particles');

    // Kinematic Constants
    const STRING_REST_X = 670;
    const STRING_DRAWN_X = 350;
    const MAX_DRAW_INCHES = 29.5;
    const PEAK_WEIGHT_LBS = 60.0;
    const HOLDING_WEIGHT_LBS = 12.0; // 80% Let-Off

    // State Variables
    let drawProgress = 0.0; // 0.0 (rest) to 1.0 (full draw)
    let animState = 'REST'; // REST, DRAWING, FULL_DRAW, RELEASING, LAUNCHED
    let playSpeed = 1.0;
    let animId = null;
    let releaseStartTime = 0;
    let arrowFlightX = 0;
    let vibrationTime = 0;

    // --- KINEMATIC UPDATE FUNCTION ---
    function updateKinematics(progress, flexOffset = 0, vibrationOffset = 0) {
      drawProgress = Math.max(0, Math.min(1, progress));

      // 1. Calculate Nock / Draw Position
      const stringX = STRING_REST_X - (STRING_REST_X - STRING_DRAWN_X) * drawProgress;
      const stringY = 487;

      // 2. Limb Flexing Parametric Curves
      // Limbs bend inward: Top tip moves right & down, Bottom tip moves right & up
      const topTipX = 660 + drawProgress * 15 + vibrationOffset * 0.5;
      const topTipY = 77 + drawProgress * 28 + vibrationOffset * 0.8;

      const botTipX = 660 + drawProgress * 15 + vibrationOffset * 0.5;
      const botTipY = 823 - drawProgress * 28 - vibrationOffset * 0.8;

      // Update Limb Paths (Bezier Curves)
      upperLimbBack.setAttribute('d', `M 645 205 Q 640 140 ${topTipX - 5} ${topTipY - 2}`);
      upperLimbFront.setAttribute('d', `M 655 210 Q 650 145 ${topTipX + 5} ${topTipY + 3}`);

      lowerLimbBack.setAttribute('d', `M 645 695 Q 640 760 ${botTipX - 5} ${botTipY + 2}`);
      lowerLimbFront.setAttribute('d', `M 655 690 Q 650 755 ${botTipX + 5} ${botTipY - 3}`);

      // 3. Move Cams to Limb Tips & Rotate Cams
      upperCamPivot.setAttribute('transform', `translate(${topTipX}, ${topTipY})`);
      lowerCamPivot.setAttribute('transform', `translate(${botTipX}, ${botTipY})`);

      const camRotationDeg = drawProgress * 230; // 230 degrees cam rotation at full draw
      upperCam.setAttribute('transform', `rotate(${camRotationDeg})`);
      lowerCam.setAttribute('transform', `rotate(${-camRotationDeg})`);

      // 4. Update Main Bowstring & D-Loop
      const topStringAttachX = topTipX + 10;
      const topStringAttachY = topTipY + 18;
      const botStringAttachX = botTipX + 10;
      const botStringAttachY = botTipY - 18;

      mainStringTop.setAttribute('d', `M ${topStringAttachX} ${topStringAttachY} L ${stringX} ${stringY}`);
      mainStringBottom.setAttribute('d', `M ${stringX} ${stringY} L ${botStringAttachX} ${botStringAttachY}`);

      // Cable Slide Crossings
      cable1.setAttribute('x1', topTipX - 10);
      cable1.setAttribute('y1', topTipY + 8);
      cable1.setAttribute('x2', botTipX + 5);
      cable1.setAttribute('y2', botTipY - 15);

      cable2.setAttribute('x1', botTipX - 10);
      cable2.setAttribute('y1', botTipY - 8);
      cable2.setAttribute('x2', topTipX + 5);
      cable2.setAttribute('y2', topTipY + 15);

      // Peep Sight Position (Interpolated along top string segment)
      const peepRatio = 0.35;
      const peepX = topStringAttachX + (stringX - topStringAttachX) * peepRatio;
      const peepY = topStringAttachY + (stringY - topStringAttachY) * peepRatio;
      const peepAngle = Math.atan2(stringY - topStringAttachY, stringX - topStringAttachX) * 180 / Math.PI;
      peepSight.setAttribute('transform', `translate(${peepX}, ${peepY}) rotate(${peepAngle})`);

      // D-Loop Group
      dLoopGroup.setAttribute('transform', `translate(${stringX}, ${stringY})`);

      // 5. Right Arm & Mechanical Release Aid Position
      const rightArmX = stringX - 350;
      rightArmGroup.setAttribute('transform', `translate(${rightArmX}, 0)`);

      // Drop-Away Arrow Rest Movement (Rises at full draw, drops on release)
      const restAngle = Math.min(1.0, drawProgress * 1.5) * -25;
      restLauncher.setAttribute('transform', `rotate(${restAngle}, 15, 0)`);

      // Stabilizer micro-vibration
      stabilizer.setAttribute('transform', `translate(635, 510) rotate(${vibrationOffset * 0.4})`);

      // 6. Arrow Position (Follows string until release)
      if (animState !== 'LAUNCHED') {
        const arrowX = stringX - 5;
        const arrowY = 472 + flexOffset;
        arrowBody.setAttribute('transform', `translate(${arrowX}, ${arrowY})`);
      }

      // 7. Telemetry & Force Curve Calculations
      const currLength = (drawProgress * MAX_DRAW_INCHES).toFixed(1);
      valDrawLen.innerText = `${currLength} in`;

      // Non-linear Force Curve (Let-Off Wall at 80% draw)
      let currWeight = 0;
      let letOffPct = 0;
      if (drawProgress < 0.65) {
        currWeight = (drawProgress / 0.65) * PEAK_WEIGHT_LBS;
        letOffPct = 0;
      } else if (drawProgress <= 1.0) {
        const letOffFactor = (drawProgress - 0.65) / 0.35;
        currWeight = PEAK_WEIGHT_LBS - letOffFactor * (PEAK_WEIGHT_LBS - HOLDING_WEIGHT_LBS);
        letOffPct = Math.round(letOffFactor * 80);
      }
      valDrawWeight.innerText = `${currWeight.toFixed(1)} lbs`;
      valCamAngle.innerText = `${Math.round(camRotationDeg)}°`;
      valLetOff.innerText = `${letOffPct}%`;
      forceBar.style.width = `${(currWeight / PEAK_WEIGHT_LBS) * 100}%`;

      // Scrubber sync
      if (animState !== 'DRAWING' && animState !== 'RELEASING') {
        scrubber.value = Math.round(drawProgress * 100);
      }
    }

    // --- ANIMATION CONTROLLER ---
    function animateDraw() {
      if (animState !== 'DRAWING') return;

      drawProgress += 0.012 * playSpeed;
      if (drawProgress >= 1.0) {
        drawProgress = 1.0;
        animState = 'FULL_DRAW';
        actionStatus.innerText = '满弓瞄准 (FULL DRAW - AIMING)';
        actionStatus.style.color = 'var(--accent-gold)';
        drawBtn.disabled = true;
        releaseBtn.disabled = false;
        updateKinematics(1.0);
        return;
      }

      updateKinematics(drawProgress);
      actionStatus.innerText = `正在拉弓开弓 (${Math.round(drawProgress * 100)}%)`;
      actionStatus.style.color = 'var(--accent-cyan)';
      animId = requestAnimationFrame(animateDraw);
    }

    function triggerRelease() {
      if (animState !== 'FULL_DRAW') return;

      animState = 'RELEASING';
      releaseBtn.disabled = true;
      actionStatus.innerText = '扣动扳机放箭！(RELEASE TRIGGERED)';
      actionStatus.style.color = 'var(--accent-red)';

      // Trigger Lever & Jaw Opening Animation
      triggerLever.setAttribute('transform', 'rotate(-20, 10, 25)');
      jawUpper.setAttribute('transform', 'rotate(-30, 28, 8)');
      jawLower.setAttribute('transform', 'rotate(30, 28, 16)');

      // Shockwave FX Flash
      fxShockwave.setAttribute('opacity', '0.9');
      fxShockwave.setAttribute('r', '15');
      fxParticles.setAttribute('opacity', '1');

      releaseStartTime = performance.now();
      arrowFlightX = STRING_REST_X - 5;
      valArrowFps.innerText = '335 FPS';

      requestAnimationFrame(animateReleasePhysics);
    }

    function animateReleasePhysics(now) {
      const elapsed = (now - releaseStartTime) * 0.001 * playSpeed;

      // Fast Spring Snap-back (String returns in ~0.04s)
      const snapDuration = 0.04;
      if (elapsed < snapDuration) {
        const snapProgress = 1.0 - (elapsed / snapDuration);
        drawProgress = snapProgress;

        // Shockwave expansion
        fxShockwave.setAttribute('r', `${15 + elapsed * 650}`);
        fxShockwave.setAttribute('opacity', `${1.0 - elapsed / snapDuration}`);

        updateKinematics(drawProgress);
        animId = requestAnimationFrame(animateReleasePhysics);
      } else {
        // String has hit rest position! Arrow detaches and launches with Archer's Paradox flex
        drawProgress = 0;
        animState = 'LAUNCHED';

        fxShockwave.setAttribute('opacity', '0');
        fxParticles.setAttribute('opacity', '0');

        // Launch Arrow + Limb Harmonic Oscillation Vibration
        vibrationTime = elapsed - snapDuration;
        const flexAmp = 12 * Math.exp(-vibrationTime * 15) * Math.sin(vibrationTime * 120);
        const vibOffset = 8 * Math.exp(-vibrationTime * 10) * Math.sin(vibrationTime * 90);

        // Advance Arrow along screen
        arrowFlightX += 80 * playSpeed;
        arrowBody.setAttribute('transform', `translate(${arrowFlightX}, ${472 + flexAmp})`);

        // Streak Tail
        arrowStreak.setAttribute('x1', `${arrowFlightX - 180}`);
        arrowStreak.setAttribute('x2', `${arrowFlightX + 100}`);
        arrowStreak.setAttribute('opacity', '0.7');

        updateKinematics(0, flexAmp, vibOffset);

        if (arrowFlightX < 1800) {
          animId = requestAnimationFrame(animateReleasePhysics);
        } else {
          actionStatus.innerText = '箭矢击中目标 (TARGET HIT)';
          actionStatus.style.color = 'var(--accent-gold)';
          arrowStreak.setAttribute('opacity', '0');
          drawBtn.disabled = false;
        }
      }
    }

    function resetScene() {
      cancelAnimationFrame(animId);
      animState = 'REST';
      drawProgress = 0;

      // Reset Triggers
      triggerLever.setAttribute('transform', 'rotate(0)');
      jawUpper.setAttribute('transform', 'rotate(0)');
      jawLower.setAttribute('transform', 'rotate(0)');
      fxShockwave.setAttribute('opacity', '0');
      fxParticles.setAttribute('opacity', '0');
      arrowStreak.setAttribute('opacity', '0');

      drawBtn.disabled = false;
      releaseBtn.disabled = true;
      actionStatus.innerText = '准备就绪 (RESTING)';
      actionStatus.style.color = 'var(--text-main)';
      valArrowFps.innerText = '0 FPS';

      updateKinematics(0);
    }

    // --- EVENT LISTENERS ---
    drawBtn.addEventListener('click', () => {
      if (animState === 'REST') {
        animState = 'DRAWING';
        drawBtn.disabled = true;
        animateDraw();
      }
    });

    releaseBtn.addEventListener('click', triggerRelease);
    replayBtn.addEventListener('click', resetScene);

    scrubber.addEventListener('input', (e) => {
      if (animState === 'DRAWING' || animState === 'RELEASING') return;
      animState = 'SCRUBBING';
      const pct = e.target.value / 100;
      drawProgress = pct;
      if (pct >= 0.98) {
        releaseBtn.disabled = false;
        actionStatus.innerText = '满弓瞄准 (FULL DRAW)';
      } else {
        releaseBtn.disabled = true;
        actionStatus.innerText = `手动拉弓 (${Math.round(pct * 100)}%)`;
      }
      updateKinematics(pct);
    });

    // Speed options
    document.querySelectorAll('.speed-opt').forEach(opt => {
      opt.addEventListener('click', () => {
        document.querySelectorAll('.speed-opt').forEach(o => o.classList.remove('active'));
        opt.classList.add('active');
        playSpeed = parseFloat(opt.getAttribute('data-speed'));
      });
    });

    // Camera mode switching
    document.querySelectorAll('.cam-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        viewport.setAttribute('data-cam', btn.getAttribute('data-cam'));
      });
    });

    // Init Scene
    updateKinematics(0);
  </script>
</body>
