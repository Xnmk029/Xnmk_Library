<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>复合弓射箭动画 - 特写镜头</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d1117;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
}
svg { width: 100vw; height: 100vh; display: block; }
.phase-label {
  position: fixed;
  top: 28px;
  left: 50%;
  transform: translateX(-50%);
  color: #f0c040;
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 4px;
  text-shadow: 0 0 15px rgba(240,192,64,0.6);
  z-index: 10;
  pointer-events: none;
}
.progress-bar {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  width: 300px;
  height: 4px;
  background: rgba(255,255,255,0.1);
  border-radius: 2px;
  z-index: 10;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #f0c040, #ff6633);
  border-radius: 2px;
  width: 0%;
  transition: width 0.1s linear;
}
</style>
</head>
<body>
<div class="phase-label" id="phaseLabel">准备开弓</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" id="mainSvg">
  <defs>
    <radialGradient id="bgGrad" cx="45%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a3545"/>
      <stop offset="50%" stop-color="#1a2535"/>
      <stop offset="100%" stop-color="#0a0f18"/>
    </radialGradient>
    <linearGradient id="riserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="25%" stop-color="#4a4a4a"/>
      <stop offset="50%" stop-color="#707070"/>
      <stop offset="75%" stop-color="#4a4a4a"/>
      <stop offset="100%" stop-color="#1e1e1e"/>
    </linearGradient>
    <linearGradient id="limbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111"/>
      <stop offset="30%" stop-color="#3a3a3a"/>
      <stop offset="70%" stop-color="#555"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <radialGradient id="camGrad" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#aaa"/>
      <stop offset="40%" stop-color="#666"/>
      <stop offset="100%" stop-color="#222"/>
    </radialGradient>
    <linearGradient id="stabGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="50%" stop-color="#333"/>
      <stop offset="100%" stop-color="#555"/>
    </linearGradient>
    <linearGradient id="arrowShaftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#888"/>
      <stop offset="30%" stop-color="#ccc"/>
      <stop offset="70%" stop-color="#999"/>
      <stop offset="100%" stop-color="#555"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#b8896a"/>
    </linearGradient>
    <linearGradient id="clothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3545"/>
      <stop offset="100%" stop-color="#1a2530"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity="0.5"/>
    </filter>
    <filter id="motionBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8,0"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1400" height="900" fill="url(#bgGrad)"/>
  <!-- 地面 -->
  <ellipse cx="700" cy="850" rx="800" ry="130" fill="#111a22"/>
  <!-- 背景网格线(室内靶场) -->
  <g opacity="0.08" stroke="#4a90d9" stroke-width="0.5">
    <line x1="0" y1="200" x2="1400" y2="200"/>
    <line x1="0" y1="400" x2="1400" y2="400"/>
    <line x1="0" y1="600" x2="1400" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1100" y1="0" x2="1100" y2="900"/>
  </g>
  <!-- 远处靶 -->
  <g transform="translate(1150, 350)" opacity="0.4">
    <rect x="-5" y="60" width="10" height="200" fill="#3a3020"/>
    <circle r="70" fill="#f5f5dc" stroke="#999" stroke-width="2"/>
    <circle r="56" fill="#111"/>
    <circle r="42" fill="#3a7bd5"/>
    <circle r="28" fill="#d53a3a"/>
    <circle r="14" fill="#f0c040"/>
    <circle r="4" fill="#111"/>
  </g>

  <!-- ===== 射手 ===== -->
  <g id="archerBody" filter="url(#shadow)">
    <!-- 后脚 -->
    <path d="M 380,780 L 420,780 L 425,800 L 375,800 Z" fill="#1a1a1a"/>
    <!-- 前脚 -->
    <path d="M 460,775 L 500,775 L 505,795 L 455,795 Z" fill="#222"/>
    <!-- 后腿 -->
    <path d="M 390,620 Q 385,680 383,740 Q 382,760 385,780 L 415,780 Q 413,750 415,720 Q 418,670 420,620 Z" fill="#252a35"/>
    <!-- 前腿 -->
    <path d="M 430,620 Q 445,680 455,740 Q 458,760 462,775 L 495,775 Q 490,750 485,720 Q 478,670 465,620 Z" fill="#2a3040"/>
    <!-- 躯干 -->
    <path d="M 400,380 Q 395,420 398,480 Q 400,540 410,600 Q 415,620 440,625 Q 460,620 465,600 Q 470,540 468,480 Q 465,420 460,380 Z" fill="url(#clothGrad)"/>
    <!-- 胸部护具 -->
    <path d="M 410,400 Q 408,440 412,480 L 455,480 Q 458,440 455,400 Z" fill="#1e2832" stroke="#333" stroke-width="0.5" opacity="0.8"/>
    <!-- 箭壶(背后) -->
    <g transform="translate(395, 420) rotate(-10)">
      <rect x="-8" y="-40" width="16" height="80" rx="5" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
      <line x1="-3" y1="-55" x2="-3" y2="-40" stroke="#888" stroke-width="2"/>
      <line x1="2" y1="-58" x2="2" y2="-40" stroke="#888" stroke-width="2"/>
      <line x1="6" y1="-53" x2="6" y2="-40" stroke="#888" stroke-width="2"/>
      <!-- 箭羽露出 -->
      <path d="M -5,-55 Q -8,-62 -3,-65 Q 0,-62 -2,-55" fill="#ff3333" opacity="0.8"/>
      <path d="M 1,-58 Q -1,-65 4,-68 Q 7,-64 5,-58" fill="#ffcc00" opacity="0.8"/>
    </g>
    <!-- 头部 -->
    <ellipse cx="435" cy="345" rx="26" ry="30" fill="url(#skinGrad)"/>
    <!-- 头发 -->
    <path d="M 410,335 Q 415,310 435,308 Q 455,310 460,335 Q 455,320 435,318 Q 415,320 410,335 Z" fill="#1a0f05"/>
    <!-- 耳朵 -->
    <ellipse cx="460" cy="345" rx="6" ry="9" fill="#c4956a"/>
    <!-- 眼睛(瞄准状态-眯眼) -->
    <line x1="445" y1="340" x2="455" y2="339" stroke="#2a1a0a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 下颌线 -->
    <path d="M 420,365 Q 435,375 450,365" stroke="#b8896a" stroke-width="1" fill="none" opacity="0.5"/>
  </g>

  <!-- ===== 复合弓 (特写主体) ===== -->
  <g id="bowAssembly" transform="translate(530, 450)">
    
    <!-- 弓把 Riser -  CNC切削铝合金 -->
    <g id="riser">
      <path d="M 0,-150 
               C 10,-145 14,-130 15,-110
               L 16,-70 C 17,-50 16,-30 15,-10
               L 14,10 C 15,30 16,50 16,70
               L 15,110 C 14,130 10,145 0,150
               C -8,145 -12,130 -13,110
               L -14,70 C -15,50 -14,30 -13,10
               L -12,-10 C -13,-30 -14,-50 -14,-70
               L -13,-110 C -12,-130 -8,-145 0,-150 Z" 
            fill="url(#riserGrad)" stroke="#0a0a0a" stroke-width="1.5"/>
      <!-- CNC减重槽 -->
      <ellipse cx="1" cy="-80" rx="5" ry="25" fill="#0d1117" stroke="#333" stroke-width="0.8"/>
      <ellipse cx="1" cy="-20" rx="5" ry="22" fill="#0d1117" stroke="#333" stroke-width="0.8"/>
      <ellipse cx="1" cy="40" rx="5" ry="22" fill="#0d1117" stroke="#333" stroke-width="0.8"/>
      <ellipse cx="1" cy="95" rx="4" ry="18" fill="#0d1117" stroke="#333" stroke-width="0.8"/>
      <!-- 品牌标识区 -->
      <rect x="-6" y="-55" width="14" height="8" rx="2" fill="none" stroke="#555" stroke-width="0.5" opacity="0.5"/>
      <!-- 握把 -->
      <path d="M -13,-15 C -20,-10 -22,0 -20,10 C -18,20 -14,25 -10,22 
               C -14,15 -15,5 -14,-5 C -13,-10 -12,-13 -13,-15 Z" 
            fill="#5a3d25" stroke="#3a2515" stroke-width="1"/>
      <!-- 握把纹理 -->
      <path d="M -17,-5 L -13,-5 M -18,2 L -14,2 M -17,9 L -13,9 M -16,16 L -12,16" stroke="#4a2d15" stroke-width="1" opacity="0.6"/>
    </g>

    <!-- 上弓片组 (双片式) -->
    <g id="upperLimbs">
      <path d="M -4,-150 C -2,-160 2,-170 6,-185 L 14,-220 C 16,-232 16,-240 15,-248
               L 10,-248 C 10,-240 9,-232 7,-220 L 1,-185 C -2,-170 -5,-160 -7,-150 Z" 
            fill="url(#limbGrad)" stroke="#0a0a0a" stroke-width="1"/>
      <!-- 第二片(分裂弓片) -->
      <path d="M 4,-150 C 6,-160 9,-170 12,-185 L 19,-220 C 21,-232 21,-240 20,-248
               L 16,-248 C 16,-240 15,-232 13,-220 L 7,-185 C 5,-170 3,-160 2,-150 Z" 
            fill="url(#limbGrad)" stroke="#0a0a0a" stroke-width="0.8" opacity="0.9"/>
      <!-- 碳纤维纹理 -->
      <path d="M 2,-160 L 10,-210 M 5,-160 L 13,-210 M 8,-160 L 16,-210" stroke="#444" stroke-width="0.3" opacity="0.4"/>
    </g>

    <!-- 下弓片组 -->
    <g id="lowerLimbs">
      <path d="M -4,150 C -2,160 2,170 6,185 L 14,220 C 16,232 16,240 15,248
               L 10,248 C 10,240 9,232 7,220 L 1,185 C -2,170 -5,160 -7,150 Z" 
            fill="url(#limbGrad)" stroke="#0a0a0a" stroke-width="1"/>
      <path d="M 4,150 C 6,160 9,170 12,185 L 19,220 C 21,232 21,240 20,248
               L 16,248 C 16,240 15,232 13,220 L 7,185 C 5,170 3,160 2,150 Z" 
            fill="url(#limbGrad)" stroke="#0a0a0a" stroke-width="0.8" opacity="0.9"/>
      <path d="M 2,160 L 10,210 M 5,160 L 13,210 M 8,160 L 16,210" stroke="#444" stroke-width="0.3" opacity="0.4"/>
    </g>

    <!-- 上凸轮组 (Binary Cam) -->
    <g id="upperCamGroup" transform="translate(14,-252)">
      <ellipse cx="0" cy="0" rx="20" ry="22" fill="url(#camGrad)" stroke="#111" stroke-width="2"/>
      <!-- 凸轮轨道槽 -->
      <ellipse cx="0" cy="0" rx="14" ry="16" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="3,2"/>
      <ellipse cx="0" cy="0" rx="8" ry="9" fill="none" stroke="#666" stroke-width="1"/>
      <!-- 轴心 -->
      <circle cx="0" cy="0" r="4" fill="#222" stroke="#666" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="1.5" fill="#888"/>
      <!-- 弦孔 -->
      <circle cx="-16" cy="-10" r="2.5" fill="#111" stroke="#555" stroke-width="0.8"/>
      <circle cx="16" cy="10" r="2.5" fill="#111" stroke="#555" stroke-width="0.8"/>
      <!-- 缆绳孔 -->
      <circle cx="14" cy="-12" r="2" fill="#111" stroke="#555" stroke-width="0.8"/>
      <circle cx="-14" cy="12" r="2" fill="#111" stroke="#555" stroke-width="0.8"/>
      <!-- 模块调节螺丝 -->
      <circle cx="8" cy="-16" r="2" fill="#999" stroke="#444" stroke-width="0.8"/>
      <line x1="7" y1="-16" x2="9" y2="-16" stroke="#333" stroke-width="0.8"/>
      <circle cx="-8" cy="16" r="2" fill="#999" stroke="#444" stroke-width="0.8"/>
      <line x1="-9" y1="16" x2="-7" y2="16" stroke="#333" stroke-width="0.8"/>
      <!-- 限位钉 -->
      <circle cx="0" cy="-20" r="1.5" fill="#d44" stroke="#800" stroke-width="0.5"/>
    </g>

    <!-- 下凸轮组 -->
    <g id="lowerCamGroup" transform="translate(14,252)">
      <ellipse cx="0" cy="0" rx="20" ry="22" fill="url(#camGrad)" stroke="#111" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="14" ry="16" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="3,2"/>
      <ellipse cx="0" cy="0" rx="8" ry="9" fill="none" stroke="#666" stroke-width="1"/>
      <circle cx="0" cy="0" r="4" fill="#222" stroke="#666" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="1.5" fill="#888"/>
      <circle cx="-16" cy="10" r="2.5" fill="#111" stroke="#555" stroke-width="0.8"/>
      <circle cx="16" cy="-10" r="2.5" fill="#111" stroke="#555" stroke-width="0.8"/>
      <circle cx="14" cy="12" r="2" fill="#111" stroke="#555" stroke-width="0.8"/>
      <circle cx="-14" cy="-12" r="2" fill="#111" stroke="#555" stroke-width="0.8"/>
      <circle cx="8" cy="16" r="2" fill="#999" stroke="#444" stroke-width="0.8"/>
      <line x1="7" y1="16" x2="9" y2="16" stroke="#333" stroke-width="0.8"/>
      <circle cx="-8" cy="-16" r="2" fill="#999" stroke="#444" stroke-width="0.8"/>
      <line x1="-9" y1="-16" x2="-7" y2="-16" stroke="#333" stroke-width="0.8"/>
      <circle cx="0" cy="20" r="1.5" fill="#d44" stroke="#800" stroke-width="0.5"/>
    </g>

    <!-- 弓弦 (主弦) -->
    <path id="mainString" d="M 14,-252 L 14,252" stroke="#e8d8a0" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- 缆绳 (Cables) -->
    <path id="cable1" d="M 28,-240 L 0,240" stroke="#b0b0b0" stroke-width="1.8" fill="none"/>
    <path id="cable2" d="M 0,-240 L 28,240" stroke="#b0b0b0" stroke-width="1.8" fill="none"/>
    <!-- 缆绳护杆 (Cable Guard) -->
    <line x1="8" y1="5" x2="45" y2="5" stroke="#3a3a3a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="45" cy="5" r="4" fill="#2a2a2a" stroke="#555" stroke-width="1"/>
    <!-- 缆绳滑块 -->
    <rect id="cableSlide" x="20" y="-2" width="8" height="14" rx="3" fill="#444" stroke="#666" stroke-width="0.8"/>

    <!-- D环 (D-Loop) -->
    <g id="dLoopGroup">
      <path id="dLoop" d="M 14,-8 C 28,-8 28,8 14,8" stroke="#ff5522" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <!-- 窥视孔 (Peep Sight) -->
    <g id="peepGroup">
      <circle id="peepOuter" cx="14" cy="-100" r="5" fill="none" stroke="#222" stroke-width="2.5"/>
      <circle id="peepInner" cx="14" cy="-100" r="2" fill="#0d1117"/>
      <!-- 窥视孔橡皮筋 -->
      <line id="peepRubber" x1="14" y1="-105" x2="14" y2="-115" stroke="#333" stroke-width="1"/>
    </g>

    <!-- 弓弦减震器 (String Dampener) -->
    <g id="stringDampener" transform="translate(14, 180)">
      <circle r="6" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
      <circle r="3" fill="#2a2a2a"/>
    </g>

    <!-- 瞄准器 (Multi-pin Sight) -->
    <g id="sightGroup" transform="translate(-18, -80)">
      <!-- 安装座 -->
      <rect x="-3" y="-5" width="8" height="10" rx="2" fill="#333" stroke="#555" stroke-width="0.8"/>
      <!-- 延伸杆 -->
      <line x1="-3" y1="0" x2="-35" y2="0" stroke="#3a3a3a" stroke-width="3"/>
      <!-- 瞄准环 -->
      <circle cx="-40" cy="0" r="12" fill="none" stroke="#444" stroke-width="2"/>
      <circle cx="-40" cy="0" r="10" fill="rgba(0,0,0,0.3)" stroke="#555" stroke-width="0.5"/>
      <!-- 多针 -->
      <circle cx="-40" cy="-6" r="1.2" fill="#00ff66" filter="url(#glow)"/>
      <circle cx="-40" cy="-2" r="1.2" fill="#00ff66" filter="url(#glow)"/>
      <circle cx="-40" cy="2" r="1.2" fill="#00ff66" filter="url(#glow)"/>
      <circle cx="-40" cy="6" r="1.2" fill="#ffaa00" filter="url(#glow)"/>
      <!-- 水平泡 -->
      <rect x="-48" y="10" width="16" height="5" rx="2.5" fill="#222" stroke="#444" stroke-width="0.5"/>
      <circle cx="-40" cy="12.5" r="2" fill="#44ff88" opacity="0.7"/>
    </g>

    <!-- 箭台 (Drop-away Arrow Rest) -->
    <g id="arrowRest" transform="translate(-8, -8)">
      <path d="M 0,0 L -15,-4 L -16,0 L -15,4 Z" fill="#444" stroke="#333" stroke-width="0.8"/>
      <!-- 支撑臂 -->
      <line x1="-16" y1="-4" x2="-16" y2="4" stroke="#666" stroke-width="2"/>
      <!-- 弹簧 -->
      <path d="M -14,4 Q -12,7 -10,4 Q -8,1 -6,4" stroke="#888" stroke-width="0.8" fill="none"/>
    </g>

    <!-- 稳定器系统 -->
    <g id="stabilizerGroup">
      <!-- 主稳定器 -->
      <rect x="-90" y="-4" width="85" height="8" rx="4" fill="url(#stabGrad)" stroke="#1a1a1a" stroke-width="1"/>
      <!-- 配重块 -->
      <circle cx="-95" cy="0" r="10" fill="#2a2a2a" stroke="#555" stroke-width="1.5"/>
      <circle cx="-95" cy="0" r="6" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
      <circle cx="-95" cy="0" r="2" fill="#333"/>
      <!-- 减震节 -->
      <rect x="-75" y="-5" width="6" height="10" rx="3" fill="#111"/>
      <rect x="-55" y="-5" width="6" height="10" rx="3" fill="#111"/>
      <!-- 侧稳定器 -->
      <rect x="-50" y="10" width="40" height="5" rx="2.5" fill="#3a3a3a" transform="rotate(25, -10, 12)"/>
      <circle cx="-55" cy="28" r="6" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
    </g>

    <!-- 箭 (Carbon Arrow) -->
    <g id="arrowGroup">
      <!-- 箭杆 (碳纤维) -->
      <rect id="arrowShaft" x="14" y="-3.5" width="350" height="7" rx="3.5" fill="url(#arrowShaftGrad)" stroke="#444" stroke-width="0.3"/>
      <!-- 箭杆标识 -->
      <rect x="80" y="-3" width="60" height="6" rx="3" fill="none" stroke="#666" stroke-width="0.3" opacity="0.5"/>
      <!-- 箭头 (Field Point 100gr) -->
      <g id="arrowHead">
        <path d="M 364,-5 L 385,-1.5 L 390,0 L 385,1.5 L 364,5 Z" fill="#999" stroke="#666" stroke-width="0.5"/>
        <path d="M 385,-1.5 L 395,0 L 385,1.5 Z" fill="#bbb"/>
        <!-- 箭头螺纹 -->
        <line x1="364" y1="-3" x2="364" y2="3" stroke="#777" stroke-width="0.5"/>
      </g>
      <!-- 箭尾 (Nock) -->
      <g id="arrowNock">
        <path d="M 14,-3 L 6,-4 L 4,-2 L 4,2 L 6,4 L 14,3 Z" fill="#ff3333" stroke="#cc0000" stroke-width="0.5"/>
        <path d="M 6,-2 L 4,0 L 6,2" stroke="#aa0000" stroke-width="1" fill="none"/>
      </g>
      <!-- 箭羽 (3片式 Blazer Vanes) -->
      <g id="fletching">
        <path d="M 30,-3.5 C 40,-14 55,-14 65,-3.5" fill="#ff2222" stroke="#cc0000" stroke-width="0.3" opacity="0.95"/>
        <path d="M 30,3.5 C 40,14 55,14 65,3.5" fill="#ff2222" stroke="#cc0000" stroke-width="0.3" opacity="0.95"/>
        <path d="M 35,-3.5 C 45,-11 58,-11 68,-3.5" fill="#ffcc00" stroke="#cc9900" stroke-width="0.3" opacity="0.9"/>
      </g>
    </g>

    <!-- 前手(推弓手) -->
    <g id="bowHand">
      <path d="M -18,-20 C -25,-15 -27,-5 -26,5 C -25,15 -22,22 -16,25 
               C -12,22 -14,12 -15,0 C -15,-10 -14,-16 -18,-20 Z" 
            fill="url(#skinGrad)" stroke="#a87d5a" stroke-width="0.8"/>
      <!-- 拇指 -->
      <path d="M -18,-20 C -22,-24 -20,-28 -16,-26 C -14,-24 -15,-20 -18,-20 Z" fill="url(#skinGrad)"/>
      <!-- 手指环绕 -->
      <path d="M -22,-10 C -28,-12 -30,-8 -27,-5 C -25,-4 -22,-6 -22,-10 Z" fill="url(#skinGrad)"/>
      <path d="M -23,0 C -30,-1 -31,3 -28,5 C -26,6 -23,4 -23,0 Z" fill="url(#skinGrad)"/>
      <path d="M -22,10 C -28,9 -30,13 -27,15 C -25,16 -22,13 -22,10 Z" fill="url(#skinGrad)"/>
      <!-- 护手 -->
      <path d="M -16,-18 C -12,-20 -10,-15 -12,-10 L -14,10 C -12,15 -14,20 -16,22" 
            stroke="#2a2a2a" stroke-width="3" fill="none" opacity="0.6"/>
    </g>
  </g>

  <!-- 后手+撒放器 -->
  <g id="releaseHand" transform="translate(544, 450)">
    <!-- 撒放器主体 -->
    <rect x="-5" y="-6" width="18" height="12" rx="4" fill="#2a2a2a" stroke="#555" stroke-width="1"/>
    <!-- 撒放器 jaws -->
    <path d="M -5,-3 C -10,-3 -10,3 -5,3" stroke="#666" stroke-width="2" fill="none"/>
    <!-- 触发器 -->
    <line x1="8" y1="6" x2="8" y2="14" stroke="#888" stroke-width="2"/>
    <circle cx="8" cy="15" r="3" fill="#444" stroke="#666" stroke-width="0.8"/>
    <!-- 手腕带 -->
    <path d="M 13,-6 C 20,-8 25,-4 25,0 C 25,4 20,8 13,6" stroke="#3a2a1a" stroke-width="4" fill="none"/>
    <!-- 手 -->
    <path d="M 13,-10 C 20,-12 28,-8 30,0 C 28,8 20,12 13,10 C 16,6 17,0 16,-6 Z" fill="url(#skinGrad)" stroke="#a87d5a" stroke-width="0.8"/>
    <!-- 手指 -->
    <path d="M 25,-8 C 30,-10 33,-6 30,-4 C 28,-3 25,-5 25,-8 Z" fill="url(#skinGrad)"/>
    <path d="M 28,-3 C 33,-4 35,0 32,2 C 30,3 28,0 28,-3 Z" fill="url(#skinGrad)"/>
    <path d="M 28,3 C 33,2 35,6 32,8 C 30,9 28,6 28,3 Z" fill="url(#skinGrad)"/>
  </g>

  <!-- 后臂 -->
  <g id="drawArm">
    <path id="drawArmPath" d="M 460,395 C 490,410 520,430 544,448" 
          stroke="url(#skinGrad)" stroke-width="16" fill="none" stroke-linecap="round"/>
    <!-- 护臂 -->
    <path id="armGuard" d="M 480,405 C 500,415 515,425 530,435" 
          stroke="#1a1a1a" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- 前臂 -->
  <g id="bowArm">
    <path d="M 445,400 C 470,415 500,435 525,448" 
          stroke="url(#skinGrad)" stroke-width="15" fill="none" stroke-linecap="round"/>
    <!-- 袖子 -->
    <path d="M 445,400 C 455,406 465,412 475,418" 
          stroke="#2a3545" stroke-width="18" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 箭飞行特效 -->
  <g id="arrowTrail" opacity="0">
    <line x1="600" y1="442" x2="900" y2="442" stroke="#f0c040" stroke-width="1" opacity="0.3"/>
    <line x1="620" y1="445" x2="880" y2="445" stroke="#ff6633" stroke-width="0.5" opacity="0.2"/>
  </g>

  <!-- 命中特效 -->
  <g id="hitEffect" opacity="0" transform="translate(1150, 350)">
    <circle r="5" fill="#f0c040"/>
    <circle r="15" fill="none" stroke="#f0c040" stroke-width="2" opacity="0.5"/>
    <circle r="25" fill="none" stroke="#f0c040" stroke-width="1" opacity="0.3"/>
  </g>
</svg>

<script>
const $ = id => document.getElementById(id);
const phaseLabel = $('phaseLabel');
const progressFill = $('progressFill');

// 动画状态
const state = {
  phase: 0,
  timer: 0,
  drawAmount: 0,    // 0-1 拉距
  arrowOffset: 0,   // 箭飞行偏移
  camAngle: 0,
  stringDeflect: 0, // 弓弦回弹
};

const PHASES = [
  { name: '◈ 准备开弓', dur: 1800 },
  { name: '◈ 开弓拉弦', dur: 2800 },
  { name: '◈ 满弓瞄准', dur: 2500 },
  { name: '◈ 撒放！', dur: 200 },
  { name: '◈ 箭矢离弦', dur: 1200 },
  { name: '◈ 命中靶心！', dur: 2000 },
];

let lastT = performance.now();

function ease(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }
function easeOut(t) { return 1 - Math.pow(1-t, 4); }
function easeIn(t) { return t * t * t; }

function update(dt) {
  state.timer += dt;
  const ph = PHASES[state.phase];
  let t = Math.min(state.timer / ph.dur, 1);

  switch(state.phase) {
    case 0: // 准备
      state.drawAmount = 0;
      state.arrowOffset = 0;
      state.stringDeflect = 0;
      break;
    case 1: // 开弓
      state.drawAmount = ease(t);
      break;
    case 2: // 满弓 - 微晃
      state.drawAmount = 1;
      break;
    case 3: // 撒放瞬间
      state.drawAmount = 1;
      state.stringDeflect = easeOut(t);
      break;
    case 4: // 箭飞行
      state.drawAmount = Math.max(0, 1 - easeOut(t) * 1.2);
      state.stringDeflect = Math.max(0, 1 - t * 2);
      state.arrowOffset = easeIn(t) * 650;
      break;
    case 5: // 命中
      state.drawAmount = 0;
      state.stringDeflect = 0;
      state.arrowOffset = 650;
      break;
  }

  // 进度条
  const totalDur = PHASES.reduce((s,p) => s + p.dur, 0);
  let elapsed = 0;
  for (let i = 0; i < state.phase; i++) elapsed += PHASES[i].dur;
  elapsed += state.timer;
  progressFill.style.width = (elapsed / totalDur * 100) + '%';

  // 阶段切换
  if (state.timer >= ph.dur) {
    state.timer = 0;
    state.phase = (state.phase + 1) % PHASES.length;
    phaseLabel.textContent = PHASES[state.phase].name;
    if (state.phase === 0) {
      state.arrowOffset = 0;
      $('arrowTrail').setAttribute('opacity', '0');
      $('hitEffect').setAttribute('opacity', '0');
    }
  }
}

function render(now) {
  const pull = state.drawAmount * 70; // 最大拉距像素
  const deflect = state.stringDeflect;

  // 弓弦形变
  const stringMid = 14 + pull * (1 - deflect * 0.8);
  const stringOvershoot = deflect * 12; // 回弹过冲
  const sx = 14 - stringOvershoot;
  $('mainString').setAttribute('d', 
    `M 14,-252 Q ${stringMid + stringOvershoot},0 14,252`);

  // 缆绳
  const c1x = 28 - pull * 0.15;
  $('cable1').setAttribute('d', `M ${c1x},-240 Q ${14 + pull*0.3},0 0,240`);
  $('cable2').setAttribute('d', `M 0,-240 Q ${14 + pull*0.3},0 ${c1x},240`);

  // D环位置
  const dX = stringMid - 14;
  $('dLoopGroup').setAttribute('transform', `translate(${dX}, 0)`);

  // 窥视孔
  const peepX = 14 + (stringMid - 14) * 0.55;
  $('peepOuter').setAttribute('cx', peepX);
  $('peepInner').setAttribute('cx', peepX);
  $('peepRubber').setAttribute('x1', peepX);
  $('peepRubber').setAttribute('x2', peepX);

  // 凸轮旋转
  const camRot = state.drawAmount * 40 - deflect * 15;
  $('upperCamGroup').setAttribute('transform', `translate(14,-252) rotate(${camRot})`);
  $('lowerCamGroup').setAttribute('transform', `translate(14,252) rotate(${-camRot})`);

  // 弓片弯曲
  const limbFlex = state.drawAmount * 4;
  $('upperLimbs').setAttribute('transform', `rotate(${-limbFlex}, 0, -150)`);
  $('lowerLimbs').setAttribute('transform', `rotate(${limbFlex}, 0, 150)`);

  // 箭位置
  if (state.phase >= 4 && state.arrowOffset > 0) {
    $('arrowGroup').setAttribute('transform', `translate(${state.arrowOffset}, 0)`);
    // 飞行中的箭有轻微振动
    const vib = Math.sin(state.timer * 0.05) * 2 * Math.max(0, 1 - state.timer/800);
    $('arrowGroup').setAttribute('transform', `translate(${state.arrowOffset}, ${vib})`);
    $('arrowTrail').setAttribute('opacity', String(Math.max(0, 0.6 - state.arrowOffset/800)));
  } else {
    const arrowPull = pull * 0.92;
    $('arrowGroup').setAttribute('transform', `translate(${arrowPull}, 0)`);
  }

  // 后手位置
  const handX = 544 + pull * 0.92;
  $('releaseHand').setAttribute('transform', `translate(${handX}, 450)`);

  // 后臂
  const elbowX = 490 + pull * 0.4;
  const elbowY = 420 + pull * 0.1;
  $('drawArmPath').setAttribute('d', 
    `M 460,395 C ${elbowX},${elbowY} ${handX - 30},${440} ${handX - 5},448`);
  $('armGuard').setAttribute('d',
    `M ${475 + pull*0.2},${405 + pull*0.05} C ${elbowX},${elbowY} ${handX-40},435 ${handX-20},443`);

  // 满弓时的瞄准晃动
  if (state.phase === 2) {
    const sway = Math.sin(now * 0.002) * 2;
    const sway2 = Math.cos(now * 0.0015) * 1.5;
    $('bowAssembly').setAttribute('transform', `translate(${530 + sway2}, ${450 + sway})`);
  } else {
    $('bowAssembly').setAttribute('transform', 'translate(530, 450)');
  }

  // 命中特效
  if (state.phase === 5) {
    const ht = state.timer / PHASES[5].dur;
    $('hitEffect').setAttribute('opacity', String(Math.max(0, 1 - ht * 1.5)));
    const scale = 1 + ht * 2;
    $('hitEffect').setAttribute('transform', `translate(1150, 350) scale(${scale})`);
  }
}

function loop(now) {
  const dt = Math.min(now - lastT, 50);
  lastT = now;
  update(dt);
  render(now);
  requestAnimationFrame(loop);
}

phaseLabel.textContent = PHASES[0].name;
requestAnimationFrame(loop);
</script>
</body>
</html>
