<script>
"use strict";
const $ = id => document.getElementById(id);
const RX = 640, RY = 432;                 // 弓把中心(握把处)世界坐标
const BRACE_NOCK = -34;                   // 静止(上弦)时箭尾局部x
const PULL = 118;                         // 满弓拉距 px
const ARROW_Y = -20;                      // 箭轴局部高度
const TIP_HIT = 1350;                     // 命中点x(靶面)
// 凸轮: 弦孔局部坐标(上轮), 半径24/角度143°
const POST_U = [-19.2, 14.4], CPOST_U = [16, 5.8];
const POST_L = [-19.2, -14.4], CPOST_L = [16, -5.8];

function rot(px, py, deg){ const r = deg*Math.PI/180, c = Math.cos(r), s = Math.sin(r); return [px*c - py*s, px*s + py*c]; }
function lerp(a, b, t){ return a + (b-a)*t; }
function clamp(v, a, b){ return v<a?a:(v>b?b:v); }
const easeInOutCubic = t => t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
const easeOutQuad = t => 1-(1-t)*(1-t);
const easeOutCubic = t => 1-Math.pow(1-t,3);

const PHASES = [
  { name:'PHASE 0 · 待机呼吸', dur:1500 },
  { name:'PHASE 1 · 开弓拉弦', dur:2600 },
  { name:'PHASE 2 · 满弓瞄准', dur:2300 },
  { name:'PHASE 3 · 撒放',     dur:150  },
  { name:'PHASE 4 · 箭矢飞行', dur:750  },
  { name:'PHASE 5 · 命中靶心', dur:1900 },
];
const TOTAL = PHASES.reduce((s,p)=>s+p.dur,0);

const S = {
  phase:0, t:0, d:0, dOsc:0,
  mode:'nocked',           // nocked | fly | hit
  jawOpen:0, restDrop:0,
  jumpX:0, jumpR:0,
  swayX:0, swayY:0,
  flyT:0, hitT:0,
};

function update(dt){
  S.t += dt;
  const ph = PHASES[S.phase];
  const t = S.t, p = Math.min(t/ph.dur, 1);
  switch(S.phase){
    case 0: // 待机呼吸
      S.d = 0; S.dOsc = 0; S.mode = 'nocked';
      S.swayX = 0.8*Math.sin(t/900); S.swayY = 1.3*Math.sin(t/760);
      S.jawOpen = 0; S.restDrop = 0; S.jumpX = 0; S.jumpR = 0;
      break;
    case 1: // 开弓拉弦
      S.d = easeInOutCubic(p);
      S.swayX = 0.5*Math.sin(t/900)*(1-p*0.6);
      S.swayY = 0.8*Math.sin(t/760)*(1-p);
      break;
    case 2: // 满弓瞄准 (呼吸微晃 + 瞄准漂移)
      S.d = 1 + 0.004*Math.sin(t/140);
      S.swayX = 2.4*Math.sin(2*Math.PI*t/1700);
      S.swayY = 1.9*Math.cos(2*Math.PI*t/2300);
      break;
    case 3: { // 撒放 + 做功冲程
      const rt = easeOutQuad(p);
      S.d = 1 - rt;
      S.jawOpen = Math.min(p*2.2, 1);
      S.restDrop = easeOutQuad(p);
      S.jumpX = 4*easeOutQuad(p);
      S.jumpR = -0.8*easeOutQuad(p);
      S.swayX *= 0.82; S.swayY *= 0.82;
      S.mode = 'nocked';
      break; }
    case 4: { // 箭矢飞行
      if (S.mode !== 'fly'){ S.mode = 'fly'; S.flyT = 0; }
      S.flyT += dt;
      const ft = S.flyT;
      S.d = 0;
      S.dOsc = 0.055*Math.exp(-ft/210)*Math.sin(2*Math.PI*ft/140); // 弓弦阻尼振荡
      S.jawOpen = 1; S.restDrop = 1;
      S.jumpX = 7*(1-Math.exp(-ft/90))*Math.exp(-ft/520) + 4*Math.exp(-ft/300);
      S.jumpR = -1.6*(1-Math.exp(-ft/70))*Math.exp(-ft/480) - 0.8*Math.exp(-ft/300);
      S.swayX = 0; S.swayY = 0;
      break; }
    case 5: { // 命中
      if (S.mode !== 'hit'){ S.mode = 'hit'; S.hitT = 0; }
      S.hitT += dt;
      S.d = 0;
      S.dOsc = 0.02*Math.exp(-S.hitT/400)*Math.sin(2*Math.PI*S.hitT/260);
      S.jumpX = 0; S.jumpR = 0;
      break; }
  }
  if (S.t >= ph.dur){
    S.t = 0;
    S.phase = (S.phase + 1) % PHASES.length;
    $('phaseLabel').textContent = PHASES[S.phase].name;
    if (S.phase === 0){ S.mode = 'nocked'; S.dOsc = 0; S.flyT = 0; S.hitT = 0; }
  }
}
function setServ(id, a, b, len){
  let dx = b[0]-a[0], dy = b[1]-a[1];
  const L = Math.hypot(dx,dy) || 1; dx/=L; dy/=L;
  const el = $(id);
  el.setAttribute('x1', a[0]-dx*len);      el.setAttribute('y1', a[1]-dy*len);
  el.setAttribute('x2', a[0]+dx*len*0.45); el.setAttribute('y2', a[1]+dy*len*0.45);
  el.setAttribute('opacity', '1');
}
function setTrail(id, x, y, back){
  const el = $(id);
  el.setAttribute('x1', x-back); el.setAttribute('y1', y);
  el.setAttribute('x2', x+130);  el.setAttribute('y2', y);
}
function drawWeight(d){ // 力-拉距曲线: 峰值70lb @72%, 满弓14lb (80%省力)
  if (d <= 0) return 0;
  if (d <= 0.72) return 70*Math.pow(d/0.72, 0.9);
  return 70 - 56*((d-0.72)/0.28);
}

function render(){
  const dE = clamp(S.d + S.dOsc, -0.08, 1.02);
  // --- 弓片挠曲 + 凸轮转角 ---
  const tipX = 12 - 12.2*dE;
  const tipYm = 264 + 0.6*dE;
  const th = 74*dE;
  $('camU').setAttribute('transform', `translate(${tipX},${-tipYm}) rotate(${th})`);
  $('camL').setAttribute('transform', `translate(${tipX},${tipYm}) rotate(${-th})`);
  $('limbU').setAttribute('transform', `rotate(${-6*dE} 0 -148)`);
  $('limbL').setAttribute('transform', `rotate(${6*dE} 0 148)`);
  // --- 弦孔/缆孔 随凸轮旋转 (rig局部坐标) ---
  const pU = rot(POST_U[0], POST_U[1], th);
  const pL = rot(POST_L[0], POST_L[1], -th);
  const postU = [tipX + pU[0], -tipYm + pU[1]];
  const postL = [tipX + pL[0],  tipYm + pL[1]];
  const nockX = BRACE_NOCK - PULL*dE;
  const nock = [nockX, ARROW_Y];
  // --- 弓弦 (双段折线过箭尾) ---
  $('stringPath').setAttribute('d',
    `M ${postU[0]},${postU[1]} L ${nock[0]},${nock[1]} L ${postL[0]},${postL[1]}`);
  $('loopU').setAttribute('cx', postU[0]); $('loopU').setAttribute('cy', postU[1]);
  $('loopL').setAttribute('cx', postL[0]); $('loopL').setAttribute('cy', postL[1]);
  setServ('servU', nock, postU, 16);
  setServ('servL', nock, postL, 16);
  // --- 弦上附件 ---
  $('dloopG').setAttribute('transform', `translate(${nock[0]},${nock[1]})`);
  const peep = [lerp(nock[0], postU[0], 0.30), lerp(nock[1], postU[1], 0.30)];
  $('peepG').setAttribute('transform', `translate(${peep[0]},${peep[1]})`);
  const damp = [lerp(nock[0], postL[0], 0.30), lerp(nock[1], postL[1], 0.30)];
  $('dampG').setAttribute('transform', `translate(${damp[0]},${damp[1]})`);
  // --- 缆绳 (经滑块折转) ---
  const cU = rot(CPOST_U[0], CPOST_U[1], th);
  const cL = rot(CPOST_L[0], CPOST_L[1], -th);
  const cpU = [tipX + cU[0], -tipYm + cU[1]];
  const cpL = [tipX + cL[0],  tipYm + cL[1]];
  const slx = -41 + 3*dE;
  $('cableA').setAttribute('d', `M ${cpU[0]},${cpU[1]} L ${slx},27 L ${cpL[0]},${cpL[1]}`);
  $('cableB').setAttribute('d', `M ${cpU[0]},${cpU[1]+3} L ${slx},24 L ${cpL[0]},${cpL[1]-3}`);
  // --- 箭台跌落 ---
  $('restArm').setAttribute('transform', `rotate(${62*S.restDrop} -6 -27.5)`);

  // --- 箭矢三态 ---
  if (S.mode === 'nocked'){
    $('arrowNocked').setAttribute('opacity', '1');
    $('arrowNocked').setAttribute('transform', `translate(${nock[0]},${nock[1]})`);
    $('arrowFlyG').setAttribute('opacity', '0');
    $('arrowHitG').setAttribute('opacity', '0');
    $('trailG').setAttribute('opacity', '0');
  } else if (S.mode === 'fly'){
    $('arrowNocked').setAttribute('opacity', '0');
    $('arrowHitG').setAttribute('opacity', '0');
    const ft = S.flyT, p = Math.min(ft/680, 1);
    const pe = 1 - Math.pow(1-p, 1.7);
    const startX = RX + BRACE_NOCK, startY = RY + ARROW_Y;
    const fx = lerp(startX, TIP_HIT - 394, pe);
    const fy = lerp(startY, 430, pe) - 5*Math.sin(Math.PI*p);
    const wob = 3.0*Math.exp(-ft/130)*Math.sin(2*Math.PI*ft/55);   // 射手悖论: 箭杆摆动
    const dy = 2.2*Math.exp(-ft/150)*Math.sin(2*Math.PI*ft/48);
    $('arrowFlyG').setAttribute('opacity', '1');
    $('arrowFlyG').setAttribute('transform', `translate(${fx},${fy+dy}) rotate(${wob} 190 0)`);
    $('trailG').setAttribute('opacity', String(Math.max(0, 0.55*(1-p))));
    setTrail('trail1', fx, fy+dy, 250);
    setTrail('trail2', fx, fy+dy+3, 205);
    setTrail('trail3', fx, fy+dy-3, 170);
  } else { // hit
    $('arrowNocked').setAttribute('opacity', '0');
    $('arrowFlyG').setAttribute('opacity', '0');
    $('trailG').setAttribute('opacity', '0');
    $('arrowHitG').setAttribute('opacity', '1');
    const ht = S.hitT;
    const wob = 5*Math.exp(-ht/240)*Math.sin(2*Math.PI*ht/110);    // 中靶颤动
    $('arrowHitG').setAttribute('transform', `translate(${TIP_HIT-396},430) rotate(${wob} 396 0)`);
    const hp = Math.min(ht/520, 1);
    $('hitFx').setAttribute('opacity', String(Math.max(0, 1 - ht/700)));
    $('hitRing1').setAttribute('r', String(8 + 92*easeOutCubic(hp)));
    $('hitRing2').setAttribute('r', String(5 + 60*easeOutCubic(hp)));
    $('hitFlash').setAttribute('r', String(Math.max(0.01, 6*(1-ht/180))));
    const squish = 1 - 0.035*Math.exp(-ht/110)*Math.cos(2*Math.PI*ht/160);
    $('targetFace').setAttribute('transform', `translate(1352,430) scale(${squish}) translate(-1352,-430)`);
  }
  if (S.mode !== 'hit') $('targetFace').setAttribute('transform', '');

  // --- 拉弦臂 IK (肩→肘→手); 撒放后手随惯性后摆 (follow-through) ---
  let Hx, Hy, followD;
  if (S.mode === 'nocked'){
    Hx = RX + nock[0] + 18; Hy = RY + nock[1] + 6;
    followD = clamp(S.d, 0, 1);
  } else {
    const tt = S.mode === 'fly' ? S.flyT : 350;
    const fo = easeOutCubic(Math.min(tt/350, 1));
    Hx = RX + BRACE_NOCK - PULL + 18 - 30*fo;
    Hy = RY + ARROW_Y + 6 + 5*fo;
    followD = 1 - 0.25*fo;
  }
  const Sx = 452, Sy = 402;
  let ux = Hx-Sx, uy = Hy-Sy;
  const L = Math.hypot(ux,uy) || 1; ux/=L; uy/=L;
  const bend = 30 - 22*followD;
  const Ex = (Sx+Hx)/2 - uy*bend, Ey = (Sy+Hy)/2 + ux*bend;
  $('drawUpper').setAttribute('d', `M ${Sx},${Sy} L ${Ex},${Ey}`);
  $('drawFore').setAttribute('d', `M ${Ex},${Ey} L ${Hx},${Hy}`);
  $('drawElbow').setAttribute('cx', Ex); $('drawElbow').setAttribute('cy', Ey);
  $('drawSleeve').setAttribute('d', `M ${Sx},${Sy} L ${Sx+(Ex-Sx)*0.42},${Sy+(Ey-Sy)*0.42}`);
  const ang = Math.atan2(Hy-Ey, Hx-Ex)*180/Math.PI;
  $('releaseG').setAttribute('transform', `translate(${Hx},${Hy}) rotate(${ang})`);
  $('jawU').setAttribute('transform', `rotate(${-26*S.jawOpen} -4 -2)`);
  $('jawL').setAttribute('transform', `rotate(${26*S.jawOpen} -4 2)`);

  // --- 整体: 瞄准晃动 + 弓体反冲 ---
  $('aimG').setAttribute('transform', `translate(${S.swayX},${S.swayY})`);
  $('rigG').setAttribute('transform', `translate(${RX+S.jumpX},${RY}) rotate(${S.jumpR})`);

  // --- HUD ---
  const dDisp = clamp(S.d, 0, 1);
  const w = drawWeight(dDisp);
  $('hudDraw').textContent = (29*dDisp).toFixed(1) + ' in';
  $('hudWeight').textContent = w.toFixed(1) + ' lb';
  $('hudLetoff').textContent = dDisp > 0.72 ? ((1 - w/70)*100).toFixed(0) + ' %' : '-- %';
  let el = 0;
  for (let i=0; i<S.phase; i++) el += PHASES[i].dur;
  el += S.t;
  $('progressFill').style.width = (el/TOTAL*100) + '%';
}

// 进度条刻度
(function(){ const tk = $('ticks'); let acc = 0;
  for (let i=1;i<PHASES.length;i++){ acc += PHASES[i-1].dur;
    const el = document.createElement('i'); el.style.left = (acc/TOTAL*100)+'%'; tk.appendChild(el); }
})();
$('phaseLabel').textContent = PHASES[0].name;
let lastT = performance.now();
function loop(now){
  const dt = Math.min(now-lastT, 50); lastT = now;
  update(dt); render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
