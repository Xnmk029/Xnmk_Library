<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EngineSIM — 音频实验室</title>
<style>
  body { background: #10141c; color: #dfe6f0; font-family: system-ui; margin: 0; padding: 24px; }
  h1 { color: #ffb347; font-size: 22px; letter-spacing: .06em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 20px; }
  .card { background: #171e2c; border: 1px solid #263048; border-radius: 12px; padding: 16px; }
  .card h3 { margin: 0 0 10px; font-size: 15px; color: #8fb4ff; }
  .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
  button { background: #2a3550; color: #dfe6f0; border: 1px solid #3a4a6e; border-radius: 8px;
    padding: 8px 16px; cursor: pointer; font-size: 13px; }
  button:hover { background: #36466e; }
  button.primary { background: #ffb347; color: #221100; font-weight: 700; border: none; }
  input[type=range] { width: 160px; }
  select { background: #1a2233; color: #dfe6f0; border: 1px solid #3a4a6e; border-radius: 6px; padding: 6px; }
  .note { color: #7c8aa0; font-size: 12px; margin-top: 10px; line-height: 1.8; }
  #status { color: #7ee08a; font-size: 13px; margin-top: 14px; }
  .big { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; color: #ffb347; }
</style>
</head>
<body>
<h1>EngineSIM · 音频实验室</h1>
<p>驾驶场景：<a href="sim.html" style="color:#ffb347">→ sim.html</a></p>

<div class="grid">
  <div class="card">
    <h3>发动机试音</h3>
    <div class="row"><button id="btn-start" class="primary">启动引擎</button>
      <button id="btn-backfire">回火</button>
      <button id="btn-crank">十字 ⇄ 平轴</button></div>
    <div class="row">转速 <span id="rpm-val" class="big">800</span> rpm</div>
    <div class="row"><input type="range" id="rpm" min="700" max="6800" step="10" value="800"></div>
    <div class="row">油门 <span id="thr-val">0.20</span>
      <input type="range" id="throttle" min="0" max="1" step="0.01" value="0.2"></div>
    <div id="status">未启动</div>
  </div>
  <div class="card">
    <h3>混响预设</h3>
    <div class="row">
      <button id="preset-prev">◀</button>
      <select id="preset"></select>
      <button id="preset-next">▶</button>
    </div>
    <div class="note">8×8 FDN 混响（Hadamard 正交反馈 + 互质延迟线）<br>
      8 组空间预设：录音棚 / 开阔地 / 车库 / 隧道 / 大厅 / 峡谷 / 维修区 / 座舱<br>
      切换参数全一阶平滑 → 零点击。</div>
  </div>
  <div class="card">
    <h3>阶次结构（离线验证）</h3>
    <div class="row"><button id="btn-analyze">渲染 6s 稳态并分析</button></div>
    <div id="analysis" class="note">点击后输出 2 阶/4 阶幅度比（十字 ≈0.09，平轴 ≈0.006）。</div>
  </div>
</div>

<script type="module">
  import { AudioEngineDriver, renderEngine } from './src/engine-driver.mjs';
  import { REVERB_PRESETS, presetNames } from './src/engine-dsp.mjs';

  const $ = (id) => document.getElementById(id);
  const audio = new AudioEngineDriver({});
  let started = false;

  $('btn-start').addEventListener('click', async () => {
    const ok = await audio.start();
    $('status').textContent = ok ? '运行中：' + audio.lastStatus : audio.lastStatus;
    started = ok;
    if (ok) {
      audio.setPreset($('preset').value);
      audio.setRpm(800); audio.setThrottle(0.2);
    }
  });
  $('rpm').addEventListener('input', (e) => { $('rpm-val').textContent = e.target.value; audio.setRpm(+e.target.value); });
  $('throttle').addEventListener('input', (e) => { $('thr-val').textContent = (+e.target.value).toFixed(2); audio.setThrottle(+e.target.value); });
  $('btn-backfire').addEventListener('click', () => audio.backfire());
  $('btn-crank').addEventListener('click', () => audio.setCrankKind(audio._crank = (audio._crank === 'flat' ? 'cross' : 'flat')));

  // 预设
  const names = presetNames();
  const sel = $('preset');
  for (const n of names) sel.add(new Option(REVERB_PRESETS[n].label, n));
  sel.value = 'garage';
  sel.addEventListener('change', () => audio.setPreset(sel.value));
  $('preset-prev').addEventListener('click', () => { sel.value = names[(names.indexOf(sel.value) + names.length - 1) % names.length]; audio.setPreset(sel.value); });
  $('preset-next').addEventListener('click', () => { sel.value = names[(names.indexOf(sel.value) + 1) % names.length]; audio.setPreset(sel.value); });

  // 离线阶次分析
  $('btn-analyze').addEventListener('click', async () => {
    const out = [];
    for (const kind of ['cross', 'flat']) {
      const dsp = new (await import('./src/engine-dsp.mjs')).EngineDSP(48000, null, 'high');
      if (kind === 'flat') dsp.setCrankKind('flat');
      dsp.setRpm(3600); dsp.setThrottle(0.8); dsp.setLoad(0.7);
      dsp.render(1.5, null);
      const buf = dsp.render(6, null);
      const sig = buf.left.slice(buf.left.length - 96000);
      const gz = (f) => { const N = sig.length, coef = 2 * Math.cos(2 * Math.PI * f / 48000); let s1 = 0, s2 = 0; for (let i = 0; i < N; i++) { const s = sig[i] + coef * s1 - s2; s2 = s1; s1 = s; } return 2 * Math.sqrt(Math.max(0, s1 * s1 + s2 * s2 - coef * s1 * s2)) / N; };
      const f0 = 60;
      out.push(`${kind}: 2阶/4阶 = ${(gz(2 * f0) / gz(4 * f0)).toFixed(4)}`);
    }
    $('analysis').textContent = out.join('　');
  });
</script>
</body>
</html>
