<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V4f Engine Sound Lab</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101216;
      color: #dfe5ec;
      font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lab {
      width: min(920px, 94vw);
      background: #181c22;
      border: 1px solid #2a3140;
      border-radius: 14px;
      padding: 22px 26px;
      box-shadow: 0 18px 60px rgba(0,0,0,.45);
    }
    h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: .5px; }
    .sub { color: #8b95a5; margin: 0 0 18px; font-size: 12.5px; }
    .row { display: flex; gap: 18px; flex-wrap: wrap; }
    .panel {
      flex: 1 1 280px;
      background: #20262e;
      border: 1px solid #2c3542;
      border-radius: 10px;
      padding: 14px 16px;
    }
    .panel h2 { margin: 0 0 10px; font-size: 13px; color: #9fb2c8; text-transform: uppercase; letter-spacing: 1px; }
    .ctl { margin: 9px 0; display: grid; grid-template-columns: 72px 1fr 76px; align-items: center; gap: 8px; }
    .ctl label { color: #aeb8c5; font-size: 12.5px; }
    .ctl output { text-align: right; font-variant-numeric: tabular-nums; color: #e8eef5; font-size: 12.5px; }
    input[type=range] { width: 100%; accent-color: #e0582e; }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    button {
      background: #2a323d;
      color: #dfe5ec;
      border: 1px solid #3a4555;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12.5px;
      cursor: pointer;
    }
    button:hover { background: #35404e; }
    button.active { background: #b4491f; border-color: #e0683a; }
    button.primary { background: #c95524; border-color: #e07a3f; font-weight: 600; }
    #spectrum { width: 100%; height: 132px; display: block; background: #14181e; border-radius: 8px; margin-top: 8px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; font-size: 12px; color: #8b95a5; }
    .stats b { color: #e8eef5; font-variant-numeric: tabular-nums; }
    .hint { margin-top: 12px; color: #6f7a8a; font-size: 12px; }
    .hint code { color: #a9b7c6; }
  </style>
</head>
<body>
  <div class="lab">
    <h1>V4f ENGINE SOUND LAB</h1>
    <p class="sub">6.4L Cross-Plane V8 · 前中置 · 等长芭蕉 · 真双出 + X-pipe · 8×8 FDN 混响</p>

    <div class="row">
      <div class="panel">
        <h2>驾驶输入</h2>
        <div class="ctl"><label>转速 RPM</label><input type="range" id="rpm" min="300" max="7000" step="10" value="1200"><output id="rpmOut">1200</output></div>
        <div class="ctl"><label>油门</label><input type="range" id="throttle" min="0" max="100" step="1" value="0"><output id="throttleOut">0%</output></div>
        <div class="ctl"><label>负载</label><input type="range" id="load" min="0" max="140" step="1" value="10"><output id="loadOut">0.1</output></div>
        <div class="ctl"><label>视角</label><input type="range" id="cabin" min="0" max="100" step="1" value="100"><output id="cabinOut">内</output></div>
        <div class="btns">
          <button id="start" class="primary">启动引擎</button>
          <button id="sweep">扫频 800→6500</button>
          <button id="limiter">断油测试</button>
          <button id="pop">松油回火</button>
          <button id="ignition">熄火</button>
          <button id="crank">平轴曲轴（A/B）</button>
        </div>
      </div>

      <div class="panel">
        <h2>声学</h2>
        <div class="ctl"><label>质量</label><span></span><span id="qualityOut">lite（精简）</span></div>
        <div class="ctl"><label>混响</label><select id="preset" style="grid-column:2/4"></select></div>
        <div class="ctl"><label>湿声</label><input type="range" id="wet" min="0" max="100" step="1" value="34"><output id="wetOut">0.34</output></div>
        <div class="ctl"><label>衰减</label><input type="range" id="decay" min="0" max="94" step="1" value="72"><output id="decayOut">0.72</output></div>
        <div class="ctl"><label>音量</label><input type="range" id="gain" min="0" max="100" step="1" value="85"><output id="gainOut">0.85</output></div>
        <button id="quality" style="margin-top:12px">切换 high（完整管道）</button>
        <canvas id="spectrum" width="820" height="132"></canvas>
      </div>
    </div>

    <div class="stats">
      <div>DSP 占用 <b id="statCpu">—</b></div>
      <div>峰值电平 <b id="statPeak">0.00</b></div>
      <div>采样率 <b id="statSr">—</b></div>
    </div>
    <p class="hint">提示：<code>R</code> 重置混响 · 预设切换即时生效 · 扫频结束后自动松油产生回火。</p>
  </div>

  <!-- The DSP core as a classic script: engine-driver.mjs falls back to it
       when AudioWorklet.addModule() is unavailable in this browser. -->
  <script src="./src/engine-dsp.js"></script>
  <script type="module" src="./src/audio-lab.mjs"></script>
</body>
</html>
