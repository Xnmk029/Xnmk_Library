<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
/* ============================================================
   USP MATCH / AR-15 — PS1 low-poly procedural mechanical breakdown
   Everything generated in code. No external assets.
   ============================================================ */

const CFG = {
  pixelScale: 3.2,
  bg: 0xb4b4b4,
  cycle: 7.2,
  arCycle: 15.0
};

const COLOR = {
  slideDark:   0x23262b,
  slideDarkHi: 0x2e3238,
  barrel:      0xd6dae0,
  frame:       0x2b2f36,
  frameHi:     0x383e47,
  grip:        0x1d2026,
  comp:        0x3a3f47,
  compHi:      0x4a505a,
  mag:         0x1a1c21,
  magHi:       0x262a31,
  spring:      0x8d949e,
  brass:       0xb98b3c,
  fiberGreen:  0x39ff6a,
  fiberRed:    0xff2b34,
  arUpper:     0x1e2024,
  arLower:     0x23262b,
  arSteel:     0x3c424b,
  arSteelHi:   0x5a616b,
  arRed:       0xff2b34,
  arGold:      0xd8a63c
};

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const easeInOut = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
function seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }

const PS1Wobble = { value: 0 };
const PS1Texel  = { value: new THREE.Vector2(0.0016, 0.0016) };

function mat(hex, opts = {}) {
  return new THREE.MeshLambertMaterial({
    color: hex,
    flatShading: true,
    emissive: opts.emissive !== undefined ? opts.emissive : 0x000000,
    emissiveIntensity: opts.emissiveIntensity !== undefined ? opts.emissiveIntensity : 1,
    transparent: !!opts.transparent,
    opacity: opts.opacity !== undefined ? opts.opacity : 1,
    side: opts.side || THREE.FrontSide
  });
}

/* PS1 vertex shader: screen-space vertex snapping + wobble */
function applyPS1Shader(m) {
  m.onBeforeCompile = (shader) => {
    shader.uniforms.uWobble = PS1Wobble;
    shader.uniforms.uTexel  = PS1Texel;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>
        uniform float uWobble;
        uniform vec2 uTexel;`)
      .replace('#include <project_vertex>', `
        vec4 mvPosition = vec4( transformed, 1.0 );
        #ifdef USE_INSTANCING
          mvPosition = instanceMatrix * mvPosition;
        #endif
        mvPosition = modelViewMatrix * mvPosition;
        vec4 clip = projectionMatrix * mvPosition;
        vec2 ndc = clip.xy / max(abs(clip.w), 1e-4);
        ndc = floor(ndc / uTexel) * uTexel;
        ndc.x += sin(ndc.y * 11.0 + uWobble) * uTexel.x * 0.06;
        clip.xy = ndc * clip.w;
        gl_Position = clip;
      `);
  };
  m.customProgramCacheKey = () => 'ps1vert';
}

/* ---------- low-poly geometry builders ---------- */

function taperedBox(w, h, d, opts = {}) {
  const {
    top = 1, bottom = 1,
    topOff = [0, 0], bottomOff = [0, 0],
    chamfer = 0, segs = 1
  } = opts;
  const hw = w / 2, hh = h / 2, hd = d / 2;
  const g = new THREE.BufferGeometry();
  const c = chamfer;
  const ringBase = [[-1,-1],[1,-1],[1,1],[-1,1]];
  const cols = [];
  const n = ringBase.length;
  for (let i = 0; i < n; i++) {
    const a = ringBase[i];
    cols.push([a[0], a[1]]);
    if (c > 0) {
      const b = ringBase[(i + 1) % n];
      cols.push([lerp(a[0], b[0], 0.5), lerp(a[1], b[1], 0.5)]);
    }
  }
  const verts = [], idx = [];
  const m = cols.length;
  const pt = (cx, cz, up, scale, off) => [
    cx * hw * scale + off[0], up * hh, cz * hd * scale + off[1]
  ];
  for (let i = 0; i < m; i++) {
    const [cx, cz] = cols[i];
    for (let s = 0; s <= segs; s++) {
      const t = s / segs;
      const sc = lerp(bottom, top, t);
      const of = [lerp(bottomOff[0], topOff[0], t), lerp(bottomOff[1], topOff[1], t)];
      verts.push(...pt(cx, cz, lerp(-1, 1, t), sc, of));
    }
  }
  const V = (i, s) => i * (segs + 1) + s;
  for (let i = 0; i < m; i++) {
    const j = (i + 1) % m;
    for (let s = 0; s < segs; s++) {
      idx.push(V(i, s), V(j, s), V(j, s + 1));
      idx.push(V(i, s), V(j, s + 1), V(i, s + 1));
    }
  }
  for (let i = 1; i < m - 1; i++) {
    idx.push(V(0,0), V(i+1,0), V(i,0));
    idx.push(V(0,segs), V(i,segs), V(i+1,segs));
  }
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function polyCyl(rt, rb, h, sides, axis = 'y', opts = {}) {
  const { capA = true, capB = true, twist = 0 } = opts;
  const g = new THREE.BufferGeometry();
  const verts = [], idx = [];
  const hh = h / 2;
  for (let s = 0; s <= 1; s++) {
    const r = s === 0 ? rb : rt;
    for (let i = 0; i < sides; i++) {
      const a = (i / sides) * Math.PI * 2 + twist * s;
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      const y = s === 0 ? -hh : hh;
      if (axis === 'y') verts.push(x, y, z);
      else if (axis === 'x') verts.push(y, x, z);
      else verts.push(x, z, y);
    }
  }
  for (let i = 0; i < sides; i++) {
    const j = (i + 1) % sides;
    idx.push(i, j, sides + j);
    idx.push(i, sides + j, sides + i);
  }
  if (capA) for (let i = 1; i < sides - 1; i++) idx.push(0, i + 1, i);
  if (capB) for (let i = 1; i < sides - 1; i++) idx.push(sides, sides + i, sides + i + 1);
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function polySphere(r, wSeg = 8, hSeg = 5) {
  return new THREE.SphereGeometry(r, wSeg, hSeg);
}

function mesh(geo, material, parent) {
  const m = new THREE.Mesh(geo, material);
  m.castShadow = true; m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

/* ---------- procedural PS1 pixel textures ---------- */

function noiseTexture(size, baseHex, opts = {}) {
  const { contrast = 26, speck = 0.10, streak = 0, seed = 1 } = opts;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const col = new THREE.Color(baseHex);
  const r0 = Math.round(col.r * 255), g0 = Math.round(col.g * 255), b0 = Math.round(col.b * 255);
  ctx.fillStyle = `rgb(${r0},${g0},${b0})`;
  ctx.fillRect(0, 0, size, size);

  let s = seed * 9301 + 49297;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };

  const img = ctx.getImageData(0, 0, size, size);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rnd() - 0.5) * contrast;
    const sp = rnd() < speck ? (rnd() - 0.5) * contrast * 2.4 : 0;
    d[i]     = clamp(d[i] + n + sp, 0, 255);
    d[i + 1] = clamp(d[i + 1] + n + sp, 0, 255);
    d[i + 2] = clamp(d[i + 2] + n + sp, 0, 255);
  }
  ctx.putImageData(img, 0, 0);

  if (streak > 0) {
    ctx.globalAlpha = 0.16;
    for (let i = 0; i < streak; i++) {
      ctx.fillStyle = rnd() > 0.5 ? '#ffffff' : '#000000';
      const y = Math.floor(rnd() * size), h = 1 + Math.floor(rnd() * 2);
      ctx.fillRect(0, y, size, h);
    }
    ctx.globalAlpha = 1;
  }

  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestMipmapNearestFilter;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 1;
  return t;
}

const TEX = {};
function buildTextures() {
  TEX.metalDark = noiseTexture(64, COLOR.slideDark, { contrast: 30, speck: .10, streak: 10, seed: 3 });
  TEX.polymer   = noiseTexture(64, COLOR.frame,     { contrast: 18, speck: .18, seed: 7 });
  TEX.steel     = noiseTexture(64, COLOR.barrel,    { contrast: 22, speck: .06, streak: 14, seed: 11 });
  TEX.steelDark = noiseTexture(64, COLOR.comp,      { contrast: 26, speck: .10, streak: 8,  seed: 17 });
  TEX.magTex    = noiseTexture(64, COLOR.mag,       { contrast: 20, speck: .12, seed: 23 });
  TEX.brass     = noiseTexture(32, COLOR.brass,     { contrast: 24, speck: .08, seed: 29 });
  TEX.aluMatte  = noiseTexture(64, COLOR.arUpper,   { contrast: 16, speck: .16, seed: 31 });
  TEX.steelGrey = noiseTexture(64, COLOR.arSteel,   { contrast: 26, speck: .08, streak: 12, seed: 37 });
}

function texMat(tex, hex, opts = {}) {
  const m = mat(hex, opts);
  m.map = tex;
  return m;
}

/* ============================================================
   SCENE / RENDERER / CAMERAS
   ============================================================ */

const stage = document.getElementById('stage');
let renderer, scene, camera, perspCam, orthoCam, composer, crtPass;

function initRenderer() {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(1);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.BasicShadowMap;
  renderer.setClearColor(CFG.bg, 1);
  stage.appendChild(renderer.domElement);
}

function initScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(CFG.bg);

  const key = new THREE.DirectionalLight(0xffffff, 1.15);
  key.position.set(4.2, 6.4, 5.0);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  const sc = key.shadow.camera;
  sc.left = -7; sc.right = 7; sc.top = 7; sc.bottom = -7; sc.near = 0.5; sc.far = 40;
  key.shadow.bias = -0.002;
  scene.add(key);

  const fill = new THREE.DirectionalLight(0xc9d6e8, 0.42);
  fill.position.set(-5.5, 1.6, 3.2);
  scene.add(fill);

  const rim = new THREE.DirectionalLight(0xffffff, 0.5);
  rim.position.set(-2.2, 3.0, -6.0);
  scene.add(rim);

  scene.add(new THREE.HemisphereLight(0xdfe6ef, 0x6a6a6a, 0.55));
  scene.add(new THREE.AmbientLight(0xffffff, 0.20));

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 40, 1, 1),
    new THREE.MeshLambertMaterial({ color: 0xa9a9a9, flatShading: true })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -1.62;
  ground.receiveShadow = true;
  scene.add(ground);

  const grid = new THREE.GridHelper(24, 24, 0x8d8d8d, 0x9c9c9c);
  grid.position.y = -1.615;
  grid.material.transparent = true;
  grid.material.opacity = 0.35;
  scene.add(grid);
}

function initCameras() {
  const aspect = window.innerWidth / window.innerHeight;
  perspCam = new THREE.PerspectiveCamera(18, aspect, 0.1, 200);
  perspCam.position.set(0, 0.4, 15.5);
  const frustum = 3.5;
  orthoCam = new THREE.OrthographicCamera(
    -frustum * aspect, frustum * aspect, frustum, -frustum, 0.1, 120
  );
  orthoCam.position.set(0, 0.4, 15.5);
  camera = perspCam;
}

/* ============================================================
   POST: PS1 pixelation + ordered dither + CRT scanlines
   ============================================================ */

const QUAD_VERT = `
varying vec2 vUv;
void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;

const CRT_FRAG = `
uniform sampler2D tDiffuse;
uniform vec2  uRes;
uniform float uAmount;
uniform float uTime;
uniform float uScan;
varying vec2 vUv;

float bayer(vec2 p){
  int x = int(mod(p.x, 4.0));
  int y = int(mod(p.y, 4.0));
  int i = y * 4 + x;
  float m[16];
  m[0]=0.0;  m[1]=8.0;  m[2]=2.0;  m[3]=10.0;
  m[4]=12.0; m[5]=4.0;  m[6]=14.0; m[7]=6.0;
  m[8]=3.0;  m[9]=11.0; m[10]=1.0; m[11]=9.0;
  m[12]=15.0;m[13]=7.0; m[14]=13.0;m[15]=5.0;
  for(int k=0;k<16;k++){ if(k==i) return m[k]/16.0; }
  return 0.0;
}

void main(){
  vec2 uv = vUv;
  vec2 c = uv - 0.5;
  float r2 = dot(c, c);
  uv = 0.5 + c * (1.0 + uAmount * 0.045 * r2);

  float ca = uAmount * 0.0016 * (0.35 + r2 * 2.2);
  vec3 col;
  col.r = texture2D(tDiffuse, uv + vec2(ca, 0.0)).r;
  col.g = texture2D(tDiffuse, uv).g;
  col.b = texture2D(tDiffuse, uv - vec2(ca, 0.0)).b;

  float d = (bayer(gl_FragCoord.xy) - 0.5) * uAmount * 0.055;
  col += d;

  float sl = sin(uv.y * uRes.y) * 0.5 + 0.5;
  col *= mix(1.0, 0.86 + 0.14 * sl, uScan * uAmount);

  col *= 1.0 - r2 * 0.28 * uAmount;

  gl_FragColor = vec4(col, 1.0);
}`;

let POST;
function initPost() {
  composer = new POST.EffectComposer(renderer);
  composer.addPass(new POST.RenderPass(scene, camera));

  crtPass = new POST.ShaderPass({
    uniforms: {
      tDiffuse: { value: null },
      uRes:     { value: new THREE.Vector2(1, 1) },
      uAmount:  { value: 1.0 },
      uTime:    { value: 0 },
      uScan:    { value: 1.0 }
    },
    vertexShader: QUAD_VERT,
    fragmentShader: CRT_FRAG
  });
  composer.addPass(crtPass);

  const copy = new POST.ShaderPass({
    uniforms: { tDiffuse: { value: null } },
    vertexShader: QUAD_VERT,
    fragmentShader: `
      uniform sampler2D tDiffuse; varying vec2 vUv;
      void main(){ gl_FragColor = texture2D(tDiffuse, vUv); }`
  });
  composer.addPass(copy);
}

/* ============================================================
   PART REGISTRY
   ============================================================ */

const PARTS = [];
function part(name, obj, group, label, color) {
  const rec = {
    name, obj, group, label,
    color: color !== undefined ? color : 0x888888,
    home: obj.position.clone(),
    homeRot: obj.rotation.clone(),
    exploded: obj.position.clone(),
    explodedRot: obj.rotation.clone()
  };
  PARTS.push(rec);
  return rec;
}

/* ============================================================
   BUILD: USP MATCH
   ============================================================ */

const USP = {};
const MAT = {};

function buildUSPMaterials() {
  MAT.slide    = texMat(TEX.metalDark, COLOR.slideDark);
  MAT.slideHi  = texMat(TEX.metalDark, COLOR.slideDarkHi);
  MAT.barrel   = texMat(TEX.steel,     COLOR.barrel);
  MAT.barrelDk = texMat(TEX.steel,     0x9aa0a8);
  MAT.frame    = texMat(TEX.polymer,   COLOR.frame);
  MAT.frameHi  = texMat(TEX.polymer,   COLOR.frameHi);
  MAT.grip     = texMat(TEX.polymer,   COLOR.grip);
  MAT.comp     = texMat(TEX.steelDark, COLOR.comp);
  MAT.compHi   = texMat(TEX.steelDark, COLOR.compHi);
  MAT.mag      = texMat(TEX.magTex,    COLOR.mag);
  MAT.magHi    = texMat(TEX.magTex,    COLOR.magHi);
  MAT.brass    = texMat(TEX.brass,     COLOR.brass);
  MAT.green    = mat(0x0d2a12, { emissive: COLOR.fiberGreen, emissiveIntensity: 1.0 });
  MAT.red      = mat(0x2a0a0c, { emissive: COLOR.fiberRed,   emissiveIntensity: 1.0 });
  MAT.trigger  = mat(0x15171b);
  MAT.small    = mat(0x6d747e);
  MAT.dark     = mat(0x101216);
  Object.values(MAT).forEach(applyPS1Shader);
}

function buildUSP() {
  const root = new THREE.Group();
  root.name = 'USP_Match';
  USP.root = root;
  scene.add(root);

  /* +X = muzzle forward, +Y = up, +Z = right */

  // ---- BARREL (bright silver, exposed) ----
  const barrel = new THREE.Group(); barrel.name = 'barrel';
  root.add(barrel);

  const tube = mesh(polyCyl(0.115, 0.115, 2.62, 10, 'x'), MAT.barrel, barrel);
  tube.position.set(1.02, 0.30, 0);

  const chamber = mesh(taperedBox(0.86, 0.34, 0.34, { chamfer: 0.10 }), MAT.barrel, barrel);
  chamber.position.set(0.16, 0.30, 0);

  const hood = mesh(taperedBox(0.62, 0.10, 0.30, { chamfer: 0.12 }), MAT.barrelDk, barrel);
  hood.position.set(0.20, 0.50, 0);

  const collar = mesh(polyCyl(0.145, 0.145, 0.14, 10, 'x'), MAT.barrelDk, barrel);
  collar.position.set(2.28, 0.30, 0);

  const spring = new THREE.Group(); spring.name = 'recoilSpring';
  const coil = new THREE.Mesh(
    polyCyl(0.165, 0.165, 1.72, 8, 'x', { capA: false, capB: false }),
    new THREE.MeshLambertMaterial({ color: COLOR.spring, flatShading: true, wireframe: true })
  );
  coil.position.set(1.05, 0.30, 0);
  spring.add(coil);
  spring.visible = false;
  barrel.add(spring);
  USP.spring = spring;

  // ---- SLIDE (dark metal, locked rear) ----
  const slide = new THREE.Group(); slide.name = 'slide';
  root.add(slide);

  const slideMain = mesh(taperedBox(2.46, 0.52, 0.62, { chamfer: 0.06 }), MAT.slide, slide);
  slideMain.position.set(0.82, 0.30, 0);

  const slideNose = mesh(taperedBox(0.46, 0.50, 0.60, { top: 0.98, chamfer: 0.10 }), MAT.slide, slide);
  slideNose.position.set(2.24, 0.30, 0);

  const slideRear = mesh(taperedBox(0.62, 0.60, 0.62, { chamfer: 0.05 }), MAT.slide, slide);
  slideRear.position.set(-0.50, 0.34, 0);

  const breech = mesh(taperedBox(0.08, 0.50, 0.56, { chamfer: 0.08 }), MAT.slideHi, slide);
  breech.position.set(-0.44, 0.30, 0);

  const port = mesh(taperedBox(0.80, 0.20, 0.50, { chamfer: 0.10 }), MAT.dark, slide);

    const v = mesh(taperedBox(0.20, 0.22, 0.42, { chamfer: 0.1 }), MAT.trigger, comp);

  const grip = mesh(taperedBox(0.78, 2.00, 0.58, {

  const trig = mesh(taperedBox(0.14, 0.30, 0.12, { chamfer: 0.16 }), MAT.trigger, frame);

  const hammer = new THREE.Group(); hammer.name = 'hammer';
  const hamBody = mesh(taperedBox(0.30, 0.34, 0.14, { chamfer: 0.12, topOff: [-0.10, 0] }), MAT.trigger, hammer);

  hamSpur.position.set(-0.16, 0.20, 0);

  const magRel = mesh(polyCyl(0.085, 0.085, 0.09, 8, 'z'), MAT.small, frame);

  const magRelR = mesh(polyCyl(0.085, 0.085, 0.09, 8, 'z'), MAT.small, frame);
  magRelR.rotation.x = Math.PI / 2; magRelR.position.set(0.30, -0.34, -0.29);

  const railL = mesh(taperedBox(1.90, 0.10, 0.10, { chamfer: 0.2 }), MAT.small, frame);
  railL.position.set(0.90, 0.06, 0.26);
  const railR = mesh(taperedBox(1.90, 0.10, 0.10, { chamfer: 0.2 }), MAT.small, frame);
  railR.position.set(0.90, 0.06, -0.26);

  // ---- MAGAZINE ----
  const mag = new THREE.Group(); mag.name = 'magazine';
  root.add(mag);
  const magBody = mesh(taperedBox(0.62, 1.62, 0.48, {
    top: 1.0, bottom: 0.96, bottomOff: [-0.16, 0], chamfer: 0.08

  magBody.position.set(0, -0.62, 0);
  const magFloor = mesh(taperedBox(0.70, 0.14, 0.54, { chamfer: 0.12 }), MAT.magHi, mag);
  magFloor.position.set(-0.09, -1.44, 0);

  }
  const follower = mesh(taperedBox(0.50, 0.10, 0.40, { chamfer: 0.1 }), MAT.small, mag);
  follower.position.set(0, 0.20, 0);
  for (let i = 0; i < 3; i++) {
    const cse = mesh(polyCyl(0.085, 0.085, 0.30, 8, 'y'), MAT.brass, mag);
    cse.position.set(0.02 - i * 0.02, 0.32 + i * 0.13, 0);
    cse.rotation.z = 0.10;
    const tip = mesh(polyCyl(0.05, 0.085, 0.10, 8, 'y'), MAT.brass, mag);
    tip.position.set(0.02 - i * 0.02, 0.50 + i * 0.13, 0);
    tip.rotation.z = 0.10;

  // ---- register parts ----
  part('compensator', comp,   root, 'MATCH COMPENSATOR',      COLOR.comp);
  part('barrel',      barrel, root, 'MATCH BARREL',           COLOR.barrel);
  part('slide',       slide,  root, 'SLIDE / LOCKED REAR',    COLOR.slideDark);
  part('frame',       frame,  root, 'POLYMER FRAME',          COLOR.frame);
  part('magazine',    mag,    root, 'MAGAZINE',               COLOR.mag);

  const E = {
    magazine:    [0.02, -1.72, 0.0],
    slide:       [-1.05, 0.62, 0.0],
    barrel:      [-0.28, 1.62, 0.0],
    compensator: [0.92, 1.62, 0.0],
    frame:       [0.0, 0.0, 0.0]
  };
  for (const p of PARTS) {
    const e = E[p.name];
    if (e) p.exploded = new THREE.Vector3(p.home.x + e[0], p.home.y + e[1], p.home.z + e[2]);
  }
  PARTS.find(p => p.name === 'barrel').explodedRot = new THREE.Euler(0, 0, -0.10);
  PARTS.find(p => p.name === 'compensator').explodedRot = new THREE.Euler(0, 0, 0.06);

  buildCalloutLines();
}

/* ============================================================
   CAD-STYLE CALLOUT LEADER LINES + LABELS
   ============================================================ */

function makeLabel(text, hex) {
  const pad = 10, fs = 26;
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  ctx.font = `bold ${fs}px "Courier New", monospace`;
  const w = Math.ceil(ctx.measureText(text).width) + pad * 2 + 20;
  const h = fs + pad * 2;
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.font = `bold ${fs}px "Courier New", monospace`;
  g.fillStyle = 'rgba(255,255,255,0.88)';
  g.fillRect(0, 0, w, h);
  g.strokeStyle = '#111'; g.lineWidth = 4;
  g.strokeRect(2, 2, w - 4, h - 4);
  g.fillStyle = '#111';
  g.textBaseline = 'middle';
  g.fillText(text, pad + 18, h / 2 + 1);
  g.fillStyle = '#' + new THREE.Color(hex).getHexString();
  g.fillRect(8, 8, 12, h - 16);
  g.strokeStyle = '#111'; g.lineWidth = 2;
  g.strokeRect(8, 8, 12, h - 16);

  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.LinearFilter;
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthTest: false }));
  spr.scale.set(w / 168, h / 168, 1);
  spr.renderOrder = 999;
  return spr;
}

const CALLOUTS = [];
function buildCalloutLines() {
  const defs = [
    { part: 'compensator', dir: [0.90,  0.55, 0], len: 1.05, text: 'MATCH COMPENSATOR',   color: COLOR.comp },
    { part: 'barrel',      dir: [-0.20, 0.98, 0], len: 1.15, text: 'MATCH BARREL',        color: COLOR.barrel },
    { part: 'slide',       dir: [-0.95, 0.32, 0], len: 1.30, text: 'SLIDE / LOCKED REAR', color: COLOR.slideDark },
    { part: 'frame',       dir: [0.55, -0.84, 0], len: 1.15, text: 'POLYMER FRAME',       color: COLOR.frame },
    { part: 'magazine',    dir: [0.35, -0.94, 0], len: 1.00, text: 'MAGAZINE',            color: COLOR.mag }
  ];
  for (const d of defs) {
    const p = PARTS.find(x => x.name === d.part);
    if (!p) continue;
    const g = new THREE.Group();
    const lineMat = new THREE.LineBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.85 });
    const dir = new THREE.Vector3(...d.dir).normalize();
    const a = new THREE.Vector3(0, 0, 0);
    const b = dir.clone().multiplyScalar(d.len);
    const c = b.clone(); c.x += Math.sign(dir.x || 1) * 0.34;
    const geo = new THREE.BufferGeometry().setFromPoints([a, b, c]);
    g.add(new THREE.Line(geo, lineMat));
    const dot = new THREE.Mesh(polySphere(0.035, 6, 4), new THREE.MeshBasicMaterial({ color: 0x111111 }));
    dot.position.copy(a);
    g.add(dot);

    const label = makeLabel(d.text, d.color);
    label.position.copy(c);
    label.position.x += Math.sign(c.x || 1) * (label.scale.x / 2 + 0.06);
    label.position.y += 0.10;
    g.add(label);

    p.group.add(g);
    CALLOUTS.push({ group: g, part: p, lineMat, label });
  }
}

const AR = { parts: {}, small: [] };

function buildAR() {
  const root = new THREE.Group();
  root.name = 'AR15';
  root.visible = false;
  AR.root = root;
  scene.add(root);

  const M = {};
  M.upper   = texMat(TEX.aluMatte,  COLOR.arUpper);
  M.lower   = texMat(TEX.aluMatte,  COLOR.arLower);

  M.brass   = texMat(TEX.brass,     COLOR.brass);
  M.dark    = mat(0x14161a);
  M.gold    = mat(COLOR.arGold);
  M.red     = mat(0x2a0a0c, { emissive: COLOR.arRed, emissiveIntensity: 0.9 });
  Object.values(M).forEach(applyPS1Shader);

  /* ---- LOWER RECEIVER (fixed reference) ---- */

  const tg = mesh(taperedBox(0.66, 0.30, 0.50, { chamfer: 0.14 }), M.lower, lower);
  tg.position.set(0.30, -0.60, 0);
  const tgHole = mesh(taperedBox(0.48, 0.34, 0.30, { chamfer: 0.14 }),
    new THREE.MeshBasicMaterial({ color: CFG.bg }), lower);
  tgHole.position.set(0.30, -0.64, 0); tgHole.castShadow = false; tgHole.receiveShadow = false;
  const pg = mesh(taperedBox(0.62, 1.55, 0.52, { top: 1, bottom: 0.92, bottomOff: [-0.42, 0], chamfer: 0.10 }), M.lower, lower);
  pg.position.set(-0.62, -1.06, 0);
  const buf = mesh(polyCyl(0.16, 0.16, 1.85, 8, 'x'), M.lower, lower);
  buf.position.set(-1.60, 0.02, 0);
  const stock = mesh(taperedBox(1.15, 0.66, 0.46, { top: 0.86, bottom: 1.0, chamfer: 0.12 }), M.lower, lower);
  stock.position.set(-2.72, 0.02, 0);

  const trigger = mesh(taperedBox(0.12, 0.30, 0.10, { chamfer: 0.2 }), M.steel, lower);
  trigger.position.set(0.30, -0.32, 0);
  AR.small.push({ o: trigger, n: 'TRIGGER' });

  const hammerAR = new THREE.Group();
  const hb = mesh(taperedBox(0.26, 0.40, 0.12, { chamfer: 0.12, topOff: [-0.12, 0] }), M.dark, hammerAR);
  hb.position.set(0, 0, 0);
  hammerAR.position.set(-0.02, -0.10, 0);
  lower.add(hammerAR);
  AR.parts.hammer = hammerAR;
  AR.small.push({ o: hammerAR, n: 'HAMMER' });

  const sear = mesh(taperedBox(0.16, 0.16, 0.08, { chamfer: 0.2 }), M.steelHi, lower);
  sear.position.set(0.14, -0.20, 0.14);
  AR.small.push({ o: sear, n: 'SEAR' });

  const disc = mesh(taperedBox(0.10, 0.22, 0.07, { chamfer: 0.2 }), M.steelHi, lower);
  disc.position.set(0.02, -0.22, -0.14);
  AR.small.push({ o: disc, n: 'DISCONNECTOR' });

  const magCatch = mesh(taperedBox(0.20, 0.22, 0.10, { chamfer: 0.15 }), M.steel, lower);
  magCatch.position.set(1.18, -0.44, 0.30);
  AR.small.push({ o: magCatch, n: 'MAG CATCH' });

  const boltCatch = mesh(taperedBox(0.22, 0.30, 0.10, { chamfer: 0.15 }), M.steel, lower);
  boltCatch.position.set(0.96, -0.06, 0.30);

  const safety = mesh(polyCyl(0.09, 0.09, 0.34, 8, 'z'), M.steel, lower);

  const upper = new THREE.Group();

  const hg = mesh(taperedBox(1.90, 0.62, 0.62, { chamfer: 0.14 }), M.upper, upper);
  hg.position.set(2.42, 0, 0);
  for (let i = 0; i < 12; i++) {

  const barr = mesh(polyCyl(0.10, 0.105, 2.60, 8, 'x'), M.steel, upper);

  const fsb = mesh(taperedBox(0.30, 0.44, 0.30, { chamfer: 0.12 }), M.steel, upper);

  const ch = new THREE.Group();

  ch.position.set(-0.62, 0.28, 0);
  upper.add(ch);
  AR.parts.chargingHandle = ch;
  AR.small.push({ o: ch, n: 'CHARGING HANDLE' });

  /* ---- BCG ---- */
  const bcg = new THREE.Group(); bcg.name = 'bcg';

  const carrier = mesh(taperedBox(1.42, 0.56, 0.48, { chamfer: 0.08 }), M.steel, bcg);

  gasKey.position.set(0.44, 0.36, 0);

  const boltBody = mesh(polyCyl(0.21, 0.21, 0.92, 8, 'x'), M.steelHi, bolt);

  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;

    lug.position.set(0.36, Math.cos(a) * 0.21, Math.sin(a) * 0.21);
    lug.rotation.x = -a;
  }
  const claw = mesh(taperedBox(0.26, 0.08, 0.10, { chamfer: 0.2 }), M.steelHi, bolt);
  claw.position.set(0.34, 0.22, 0.10);
  AR.small.push({ o: claw, n: 'EXTRACTOR' });
  const fp = mesh(polyCyl(0.05, 0.05, 0.70, 6, 'x'), M.steelHi, bolt);
  fp.position.set(-0.20, 0, 0);
  AR.small.push({ o: fp, n: 'FIRING PIN' });

  const ejector = mesh(taperedBox(0.10, 0.24, 0.08, { chamfer: 0.2 }), M.steelHi, lower);
  ejector.position.set(0.02, 0.06, -0.10);
  AR.small.push({ o: ejector, n: 'EJECTOR' });

  /* ---- recoil spring + buffer ---- */
  const springGrp = new THREE.Group();
  springGrp.position.set(-1.05, 0.02, 0);
  const buffer = mesh(polyCyl(0.15, 0.15, 0.60, 8, 'x'), M.steel, springGrp);
  buffer.position.set(-0.30, 0, 0);
  AR.small.push({ o: buffer, n: 'BUFFER' });
  const coilAR = new THREE.Mesh(
    polyCyl(0.14, 0.14, 1.0, 7, 'x', { capA: false, capB: false }),
    new THREE.MeshLambertMaterial({ color: COLOR.spring, flatShading: true, wireframe: true })
  );
  coilAR.position.set(0.50, 0, 0);
  springGrp.add(coilAR);
  AR.parts.coil = coilAR;
  lower.add(springGrp);
  AR.parts.springGrp = springGrp;
  AR.small.push({ o: springGrp, n: 'RECOIL SPRING / BUFFER' });

  /* ---- magazine ---- */
  const mag = new THREE.Group();
  const magB = mesh(taperedBox(0.60, 1.30, 0.46, { top: 1, bottom: 0.95, bottomOff: [-0.10, 0], chamfer: 0.08 }), M.dark, mag);
  magB.position.set(0, -0.55, 0);
  for (let i = 0; i < 3; i++) {
    const rd = mesh(polyCyl(0.07, 0.07, 0.34, 6, 'y'), M.brass, mag);
    rd.position.set(0, 0.12 + i * 0.14, 0);
    rd.rotation.z = 0.12;
  }
  mag.position.set(0.86, -0.62, 0);
  root.add(mag);
  AR.parts.mag = mag;
  AR.small.push({ o: mag, n: 'MAGAZINE' });
}

/* ============================================================
   ANIMATION
   ============================================================ */

const ANIM = {
  t: 0,
  playing: true,
  orbit: true,
  crt: true,
  wire: false,
  view: 'usp'
};

function setUSPPose(t) {
  const cyc = t < 0.5 ? t * 2 : (1 - t) * 2;
  const s = easeInOut(clamp(cyc, 0, 1));

  const get = n => PARTS.find(p => p.name === n);
  const mag = get('magazine'), slide = get('slide'),
        barrel = get('barrel'), comp = get('compensator');

  const magT   = smooth(seg(s, 0.00, 0.26));
  const slideT = smooth(seg(s, 0.18, 0.58));
  const barT   = smooth(seg(s, 0.50, 0.80));
  const compT  = smooth(seg(s, 0.66, 0.94));

  mag.obj.position.lerpVectors(mag.home, mag.exploded, magT);
  slide.obj.position.lerpVectors(slide.home, slide.exploded, slideT);
  barrel.obj.position.lerpVectors(barrel.home, barrel.exploded, barT);
  comp.obj.position.lerpVectors(comp.home, comp.exploded, compT);

  barrel.obj.rotation.z = lerp(barrel.homeRot.z, barrel.explodedRot.z, barT);
  comp.obj.rotation.z   = lerp(comp.homeRot.z, comp.explodedRot.z, compT);

  const slideOff = seg(slideT, 0.35, 1.0);
  if (USP.spring) {
    USP.spring.visible = slideOff > 0.04;
    USP.spring.scale.x = lerp(0.5, 1.0, slideOff);
  }
  if (USP.hammer) USP.hammer.rotation.z = lerp(0, -0.62, smooth(slideT));

  const pulse = 0.72 + 0.28 * Math.sin(performance.now() * 0.004);
  if (MAT.green) MAT.green.emissiveIntensity = pulse;
  if (MAT.red)   MAT.red.emissiveIntensity   = 0.72 + 0.28 * Math.sin(performance.now() * 0.004 + 1.6);

  for (const c of CALLOUTS) {
    const o = 0.12 + 0.88 * smooth(seg(s, 0.10, 0.62));
    c.group.visible = o > 0.16;
    c.lineMat.opacity = o;
    c.label.material.opacity = o;
  }

  const phase =
    s < 0.02 ? 'ASSEMBLED / READY' :
    s > 0.97 ? 'FULLY EXPLODED'    :
    (t < 0.5 ? 'DISASSEMBLY' : 'REASSEMBLY');
  document.getElementById('phaseLabel').textContent = 'PHASE: ' + phase;
}

function setARPose(t) {
  const cyc = t < 0.5 ? t * 2 : (1 - t) * 2;
  const s = easeInOut(clamp(cyc, 0, 1));

  const magT  = smooth(seg(s, 0.00, 0.14));
  const chT   = smooth(seg(s, 0.10, 0.30));
  const pinT  = smooth(seg(s, 0.28, 0.40));
  const pivT  = smooth(seg(s, 0.38, 0.62));
  const bcgT  = smooth(seg(s, 0.58, 0.78));
  const boltT = smooth(seg(s, 0.76, 0.90));

  AR.parts.mag.position.set(0.86, -0.62 - magT * 1.35, 0);

  const bcgPos = chT * 0.55 + bcgT * 1.55;
  AR.parts.bcg.position.set(-0.10 - bcgPos, 0.02, 0);

  AR.parts.chargingHandle.position.x = -0.62 - chT * 0.55;

  AR.parts.rearPin.position.z = pinT * 0.95;
  AR.parts.rearPin.rotation.y = pinT * 2.0;

  const canOpen = smooth(seg(pinT, 0.85, 1.0));
  AR.pivot.rotation.z = pivT * canOpen * 0.62;

  AR.parts.bolt.rotation.x = -boltT * (Math.PI / 8);

  const cmp = 1 - (bcgPos / 2.10) * 0.55;
  if (AR.parts.coil) AR.parts.coil.scale.x = clamp(cmp, 0.45, 1);
  if (AR.parts.springGrp) AR.parts.springGrp.position.x = -1.05 - bcgPos * 0.35;

  AR.parts.hammer.rotation.z = lerp(0.35, -0.55, smooth(bcgT));
  AR.parts.safety.rotation.x = lerp(0, Math.PI / 2, smooth(seg(s, 0.05, 0.18)));

  const phase =
    s < 0.02 ? 'IN BATTERY / READY' :
    s > 0.97 ? 'FIELD STRIPPED'     :
    (t < 0.5 ? 'STRIPPING' : 'REASSEMBLING');
  document.getElementById('phaseLabel').textContent = 'PHASE: ' + phase;
}

/* ============================================================
   LOOP
   ============================================================ */

let orbitAngle = 0.55;
let lastTime = performance.now();

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  if (ANIM.playing) ANIM.t += dt;

  const cyc = ANIM.view === 'usp' ? CFG.cycle : CFG.arCycle;
  const t = (ANIM.t % cyc) / cyc;
  PS1Wobble.value = now * 0.0016;

  if (ANIM.view === 'usp') setUSPPose(t);
  else setARPose(t);

  const rad = ANIM.view === 'usp' ? 15.5 : 19.5;
  const cy  = ANIM.view === 'usp' ? 0.42 : 0.30;
  if (ANIM.orbit) orbitAngle += dt * 0.075;
  const camX = Math.sin(orbitAngle) * rad;
  const camZ = Math.cos(orbitAngle) * rad;
  const camY = cy + Math.sin(ANIM.t * 0.25) * 0.16;

  for (const c of [perspCam, orthoCam]) {
    c.position.set(camX, camY, camZ);
    c.lookAt(0, ANIM.view === 'usp' ? 0.05 : 0.0, ANIM.view === 'usp' ? 0.55 : 0.9);
  }

  if (crtPass) {
    crtPass.uniforms.uTime.value = now * 0.001;
    crtPass.uniforms.uAmount.value = ANIM.crt ? 1 : 0;
    crtPass.uniforms.uScan.value = ANIM.crt ? 1 : 0;
  }

  document.getElementById('fill').style.width = (t * 100).toFixed(1) + '%';
  composer.render();
}

/* ============================================================
   RESIZE
   ============================================================ */

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  const aspect = w / h;
  renderer.setSize(w, h);
  perspCam.aspect = aspect;
  perspCam.updateProjectionMatrix();
  const f = ANIM.view === 'usp' ? 3.5 : 4.4;
  orthoCam.left = -f * aspect; orthoCam.right = f * aspect;
  orthoCam.top = f; orthoCam.bottom = -f;
  orthoCam.updateProjectionMatrix();

  const rw = Math.max(2, Math.floor(w / CFG.pixelScale));
  const rh = Math.max(2, Math.floor(h / CFG.pixelScale));
  composer.setSize(rw, rh);
  if (crtPass) crtPass.uniforms.uRes.value.set(rw, rh);
  PS1Texel.value.set(2 / rw, 2 / rh);

  const cvs = renderer.domElement;
  cvs.style.width = '100%';
  cvs.style.height = '100%';
}
window.addEventListener('resize', onResize);

/* ============================================================
   UI
   ============================================================ */

function wireUI() {
  const bView = document.getElementById('btnView');
  const bPlay = document.getElementById('btnPlay');
  const bSpin = document.getElementById('btnSpin');
  const bCrt  = document.getElementById('btnCrt');
  const bWire = document.getElementById('btnWire');

  bView.onclick = () => {
    ANIM.view = ANIM.view === 'usp' ? 'ar' : 'usp';
    const isAR = ANIM.view === 'ar';
    USP.root.visible = !isAR;
    AR.root.visible = isAR;
    bView.textContent = 'VIEW: ' + (isAR ? 'AR-15' : 'USP');
    bView.classList.toggle('on', isAR);
    document.getElementById('hTitle').textContent = isAR ? 'AR-15' : 'USP MATCH';
    document.getElementById('hSub').textContent = isAR
      ? 'AR-15 FIELD STRIP — MECHANICAL LINKAGE'
      : 'HK USP MATCH — LOW-POLY / PSX';
    document.getElementById('tlName').textContent = isAR
      ? 'PIVOT OPEN / BCG / BOLT UNLOCK'
      : 'MAGAZINE / SLIDE CYCLE';
    document.getElementById('modeLabel').textContent = isAR
      ? 'MODE: MECHANICAL BREAKDOWN'
      : 'MODE: EXPLODED VIEW';
    onResize();
  };

  bPlay.onclick = () => {
    ANIM.playing = !ANIM.playing;
    bPlay.textContent = ANIM.playing ? 'PAUSE' : 'PLAY';
    bPlay.classList.toggle('on', !ANIM.playing);
  };

  bSpin.onclick = () => {
    ANIM.orbit = !ANIM.orbit;
    bSpin.textContent = 'ORBIT: ' + (ANIM.orbit ? 'ON' : 'OFF');
    bSpin.classList.toggle('on', !ANIM.orbit);
  };

  bCrt.onclick = () => {
    ANIM.crt = !ANIM.crt;
    bCrt.textContent = 'CRT: ' + (ANIM.crt ? 'ON' : 'OFF');
    bCrt.classList.toggle('on', !ANIM.crt);
  };

  bWire.onclick = () => {
    ANIM.wire = !ANIM.wire;
    bWire.textContent = 'WIRE: ' + (ANIM.wire ? 'ON' : 'OFF');
    bWire.classList.toggle('on', ANIM.wire);
    scene.traverse(o => {
      if (o.isMesh && o.material && 'wireframe' in o.material) {
        if (o.userData.wireLocked) return;
        o.material.wireframe = ANIM.wire;
      }
    });
  };

  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); bPlay.click(); }
    if (e.key === 'v' || e.key === 'V') bView.click();
    if (e.key === 'w' || e.key === 'W') bWire.click();
    if (e.key === 'c' || e.key === 'C') bCrt.click();
  });
}

/* ============================================================
   BOOT
   ============================================================ */

async function boot() {
  const [ec, rp, sp] = await Promise.all([
    import('three/addons/postprocessing/EffectComposer.js'),
    import('three/addons/postprocessing/RenderPass.js'),
    import('three/addons/postprocessing/ShaderPass.js')
  ]);
  POST = {
    EffectComposer: ec.EffectComposer,
    RenderPass: rp.RenderPass,
    ShaderPass: sp.ShaderPass
  };

  buildTextures();
  initRenderer();
  initScene();
  initCameras();
  buildUSPMaterials();
  buildUSP();
  buildAR();
  initPost();

  // the recoil-spring wireframes must keep wireframe on regardless of the toggle
  scene.traverse(o => {
    if (o.isMesh && o.material && o.material.wireframe) o.userData.wireLocked = true;
  });

  wireUI();
  onResize();
  document.getElementById('loader').classList.add('gone');
  animate();
}

boot().catch(err => {
  const e = document.getElementById('err');
  e.style.display = 'flex';
  e.textContent = 'INIT ERROR\n\n' + (err && err.stack ? err.stack : String(err));
  document.getElementById('loader').classList.add('gone');
});

</script>
