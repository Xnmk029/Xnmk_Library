<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>USP Match - Low-Poly PS1 Style</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #d4d4d4; }
canvas { display: block; image-rendering: pixelated; }
#info {
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
  font-family: 'Courier New', monospace; font-size: 12px; color: #555;
  background: rgba(255,255,255,0.6); padding: 4px 12px; border-radius: 2px;
}
</style>
</head>
<body>
<div id="info">USP MATCH // PS1 LOW-POLY // EXPLODE-ASSEMBLE LOOP</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
// === SCENE SETUP ===
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd4d4d4);

const aspect = window.innerWidth / window.innerHeight;
const frustum = 5.5;
const camera = new THREE.OrthographicCamera(
  -frustum*aspect, frustum*aspect, frustum, -frustum, 0.1, 100
);
camera.position.set(6, 4, 8);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(0.75); // PS1 low-res feel
document.body.appendChild(renderer.domElement);

// === LIGHTING (flat retro) ===
const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(3, 5, 4);
scene.add(dirLight);
const dirLight2 = new THREE.DirectionalLight(0x8899aa, 0.4);
dirLight2.position.set(-3, 2, -2);
scene.add(dirLight2);
scene.add(new THREE.AmbientLight(0x404040, 0.6));

// === MATERIALS (flat shading PS1) ===
function mat(color) {
  return new THREE.MeshPhongMaterial({ color, flatShading: true, shininess: 10 });
}
const matSlide = mat(0x2a2a2e);      // dark metal slide
const matBarrel = mat(0xc8c8d0);     // bright silver barrel
const matFrame = mat(0x1a1a1e);      // polymer frame
const matComp = mat(0x333338);       // compensator
const matMag = mat(0x222226);        // magazine
const matGrip = mat(0x181818);       // grip texture
const matGreen = new THREE.MeshPhongMaterial({ color: 0x00ff44, emissive: 0x00cc33, emissiveIntensity: 0.8, flatShading: true });
const matRed = new THREE.MeshPhongMaterial({ color: 0xff2200, emissive: 0xcc1100, emissiveIntensity: 0.8, flatShading: true });
const matTrigger = mat(0x3a3a3e);

// === HELPER: merge boxes into group ===
function box(w,h,d,material,x,y,z) {
  const g = new THREE.BoxGeometry(w,h,d);
  const m = new THREE.Mesh(g, material);
  m.position.set(x||0, y||0, z||0);
  return m;
}

// === BUILD PARTS ===
// -- SLIDE (dark metal, with serrations) --
const slideGroup = new THREE.Group();
slideGroup.add(box(3.6, 0.42, 0.52, matSlide, 0, 0, 0)); // main body
slideGroup.add(box(3.6, 0.1, 0.56, matSlide, 0, 0.22, 0)); // top rail
// serrations (rear)
for(let i=0;i<5;i++){
  slideGroup.add(box(0.06, 0.38, 0.54, mat(0x3d3d42), -1.4+i*0.14, 0, 0));
}
// ejection port
slideGroup.add(box(0.5, 0.2, 0.1, mat(0x111114), 0.3, 0.15, 0.27));
// front sight base
slideGroup.add(box(0.12, 0.18, 0.14, matSlide, 1.6, 0.35, 0));
// GREEN front sight fiber
slideGroup.add(box(0.06, 0.12, 0.06, matGreen, 1.6, 0.46, 0));
// rear sight base
slideGroup.add(box(0.2, 0.16, 0.3, matSlide, -1.5, 0.33, 0));
// RED rear sight fibers
slideGroup.add(box(0.05, 0.1, 0.05, matRed, -1.5, 0.43, 0.08));
slideGroup.add(box(0.05, 0.1, 0.05, matRed, -1.5, 0.43, -0.08));
// breech face
slideGroup.add(box(0.1, 0.36, 0.44, mat(0x1f1f22), -1.78, 0, 0));

// -- BARREL (bright silver) --
const barrelGroup = new THREE.Group();
const barrelGeo = new THREE.CylinderGeometry(0.13, 0.13, 3.2, 6);
const barrelMesh = new THREE.Mesh(barrelGeo, matBarrel);
barrelMesh.rotation.z = Math.PI/2;
barrelGroup.add(barrelMesh);
// barrel lug
barrelGroup.add(box(0.3, 0.2, 0.22, matBarrel, -0.6, -0.14, 0));
// chamber area (thicker)
const chamberGeo = new THREE.CylinderGeometry(0.17, 0.15, 0.7, 6);
const chamberMesh = new THREE.Mesh(chamberGeo, matBarrel);
chamberMesh.rotation.z = Math.PI/2;
chamberMesh.position.x = -0.9;
barrelGroup.add(chamberMesh);

// -- COMPENSATOR (front match weight) --
const compGroup = new THREE.Group();
compGroup.add(box(0.9, 0.5, 0.56, matComp, 0, 0, 0));
compGroup.add(box(0.9, 0.12, 0.6, matComp, 0, 0.28, 0));
// ports
compGroup.add(box(0.15, 0.3, 0.58, mat(0x111114), -0.2, 0.05, 0));
compGroup.add(box(0.15, 0.3, 0.58, mat(0x111114), 0.2, 0.05, 0));
// barrel hole
const compHole = new THREE.CylinderGeometry(0.14, 0.14, 0.92, 6);
const compHoleM = new THREE.Mesh(compHole, mat(0x0a0a0a));
compHoleM.rotation.z = Math.PI/2;
compGroup.add(compHoleM);

// -- FRAME (lower polymer) --
const frameGroup = new THREE.Group();
// main rail section
frameGroup.add(box(3.2, 0.18, 0.48, matFrame, 0.1, 0, 0));
// dust cover / accessory rail
frameGroup.add(box(1.4, 0.12, 0.44, matFrame, 0.9, -0.12, 0));
// trigger guard
frameGroup.add(box(0.08, 0.5, 0.1, matFrame, 0.2, -0.32, 0));
frameGroup.add(box(0.7, 0.08, 0.1, matFrame, -0.1, -0.55, 0));
frameGroup.add(box(0.08, 0.35, 0.1, matFrame, -0.45, -0.38, 0));
// trigger
frameGroup.add(box(0.06, 0.32, 0.08, matTrigger, -0.05, -0.32, 0));
// grip
const gripGeo = new THREE.BoxGeometry(0.55, 1.1, 0.48);
const gripMesh = new THREE.Mesh(gripGeo, matGrip);
gripMesh.position.set(-0.85, -0.85, 0);
gripMesh.rotation.z = 0.18;
frameGroup.add(gripMesh);
// grip texture panels
for(let i=0;i<4;i++){
  const dot = box(0.4, 0.04, 0.5, mat(0x252525), -0.85, -0.5-i*0.22, 0);
  dot.rotation.z = 0.18;
  frameGroup.add(dot);
}
// beavertail
frameGroup.add(box(0.3, 0.2, 0.46, matFrame, -1.5, -0.05, 0));
// hammer
frameGroup.add(box(0.12, 0.25, 0.1, matTrigger, -1.6, 0.15, 0));
// mag well
frameGroup.add(box(0.5, 0.15, 0.42, matFrame, -0.85, -1.38, 0));
// slide rails
frameGroup.add(box(2.8, 0.06, 0.06, mat(0x444448), 0.1, 0.1, 0.22));
frameGroup.add(box(2.8, 0.06, 0.06, mat(0x444448), 0.1, 0.1, -0.22));

// -- MAGAZINE (detached) --
const magGroup = new THREE.Group();
magGroup.add(box(0.4, 1.0, 0.36, matMag, 0, 0, 0));
// magazine base plate
magGroup.add(box(0.42, 0.12, 0.38, mat(0x333336), 0, -0.55, 0));
// feed lips
magGroup.add(box(0.36, 0.08, 0.3, mat(0x555558), 0, 0.52, 0));
// witness holes
for(let i=0;i<3;i++){
  magGroup.add(box(0.05, 0.08, 0.38, mat(0x111114), 0, -0.1+i*0.25, 0));
}
// rounds visible
magGroup.add(box(0.3, 0.06, 0.2, mat(0xb8860b), 0, 0.44, 0));

// === ASSEMBLE ALL PARTS ===
const parts = [
  { group: slideGroup, assembled: new THREE.Vector3(0, 0.35, 0), exploded: new THREE.Vector3(0, 2.2, 0) },
  { group: barrelGroup, assembled: new THREE.Vector3(0, 0.12, 0), exploded: new THREE.Vector3(0.5, 0.9, 0) },
  { group: compGroup, assembled: new THREE.Vector3(2.1, 0.35, 0), exploded: new THREE.Vector3(3.8, 1.6, 0) },
  { group: frameGroup, assembled: new THREE.Vector3(0, -0.1, 0), exploded: new THREE.Vector3(0, -0.6, 0) },
  { group: magGroup, assembled: new THREE.Vector3(-0.85, -1.05, 0), exploded: new THREE.Vector3(-1.2, -3.0, 0) },
];

parts.forEach(p => {
  p.group.position.copy(p.exploded);
  scene.add(p.group);
});

// slight rotation for 3/4 view
const gunParent = new THREE.Group();
parts.forEach(p => gunParent.add(p.group));
scene.add(gunParent);
gunParent.rotation.y = -0.3;

// === ANIMATION ===
const clock = new THREE.Clock();
const CYCLE = 6.0; // seconds per full cycle
const HOLD = 0.15; // hold fraction at each end

function easeInOutCubic(t) {
  return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
}

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  const t = (elapsed % CYCLE) / CYCLE; // 0..1

  let progress;
  if (t < HOLD) {
    progress = 0; // hold exploded
  } else if (t < 0.5 - HOLD) {
    progress = easeInOutCubic((t - HOLD) / (0.5 - 2*HOLD)); // assemble
  } else if (t < 0.5 + HOLD) {
    progress = 1; // hold assembled
  } else if (t < 1.0 - HOLD) {
    progress = 1 - easeInOutCubic((t - 0.5 - HOLD) / (0.5 - 2*HOLD)); // disassemble
  } else {
    progress = 0; // hold exploded
  }

  parts.forEach(p => {
    p.group.position.lerpVectors(p.exploded, p.assembled, progress);
  });

  // subtle rotation during animation
  gunParent.rotation.y = -0.3 + Math.sin(elapsed * 0.4) * 0.08;

  renderer.render(scene, camera);
}
animate();

// === RESIZE ===
window.addEventListener('resize', () => {
  const a = window.innerWidth / window.innerHeight;
  camera.left = -frustum * a;
  camera.right = frustum * a;
  camera.top = frustum;
  camera.bottom = -frustum;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
})();
</script>
</body>
</html>
