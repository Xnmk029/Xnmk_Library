<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USP MATCH — Low-Poly Field Strip</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#c7c7c7;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #c{image-rendering:pixelated;image-rendering:crisp-edges;
     width:min(100vw,133.34vh);height:min(75vw,100vh);
     background:#c7c7c7;display:block;}
  .scan{position:fixed;inset:0;pointer-events:none;
     background:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 1px,transparent 1px 3px);}
  .vig{position:fixed;inset:0;pointer-events:none;
     background:radial-gradient(ellipse at 50% 50%,transparent 58%,rgba(0,0,0,.15) 100%);}
  .hud{position:fixed;pointer-events:none;font-family:'Courier New',monospace;
     color:#26262c;letter-spacing:.18em;text-transform:uppercase;user-select:none;}
  #t1{top:16px;left:22px;font-size:15px;font-weight:700;}
  #t2{bottom:15px;left:22px;font-size:11px;}
  #t3{bottom:15px;right:22px;font-size:11px;text-align:right;}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div class="scan"></div><div class="vig"></div>
<div class="hud" id="t1">USP MATCH // LOW-POLY FIELD STRIP</div>
<div class="hud" id="t2">EXPLODE -&gt; ASSEMBLE LOOP &middot; 60 FPS</div>
<div class="hud" id="t3">HK MATCH &middot; PS1 EDITION</div>

<script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
<script>
(function(){
"use strict";
var W=480,H=360;
var canvas=document.getElementById('c');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:false});
renderer.setPixelRatio(1);
renderer.setSize(W,H,false);
renderer.setClearColor(0xc7c7c7,1);

var scene=new THREE.Scene();
var cam=new THREE.OrthographicCamera(-12,12,6.65,-11.35,0.1,200);
cam.position.set(12,4,14);
cam.lookAt(0,-2.25,0);

scene.add(new THREE.AmbientLight(0xffffff,0.55));
var key=new THREE.DirectionalLight(0xffffff,0.95); key.position.set(9,15,11); scene.add(key);
var fill=new THREE.DirectionalLight(0xdde3ff,0.45); fill.position.set(-9,4,-7); scene.add(fill);
var rim=new THREE.DirectionalLight(0xffffff,0.30); rim.position.set(-4,9,-12); scene.add(rim);

function makeNoise(){
  var cv=document.createElement('canvas'); cv.width=cv.height=64;
  var g=cv.getContext('2d'); var id=g.createImageData(64,64);
  for(var i=0;i<4096;i++){
    var v=198+Math.random()*52;
    if(Math.random()<0.3) v*=0.72;
    var o=i*4; id.data[o]=id.data[o+1]=id.data[o+2]=v; id.data[o+3]=255;
  }
  g.putImageData(id,0,0);
  var t=new THREE.Texture(cv);
  t.magFilter=THREE.NearestFilter; t.minFilter=THREE.NearestFilter;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  return t;
}
var baseTex=makeNoise();
function mat(color,rep){
  var t=baseTex.clone(); t.repeat.set(rep,rep);
  return new THREE.MeshLambertMaterial({color:color,map:t,flatShading:true});
}
function box(p,w,h,d,x,y,z,m){
  var mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  mesh.position.set(x,y,z); p.add(mesh); return mesh;
}
function cyl(p,r,len,x,y,z,c,seg){
  var m=new THREE.MeshLambertMaterial({color:c,map:baseTex.clone(),flatShading:true});
  var mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,seg||10),m);
  mesh.rotation.z=Math.PI/2; mesh.position.set(x,y,z); p.add(mesh); return mesh;
}

/* ---------------- gun model ---------------- */
var gun=new THREE.Group();
gun.scale.setScalar(0.72);
gun.position.set(1.5,0,0);
scene.add(gun);

var frame=new THREE.Group(); gun.add(frame);
var frameM=mat(0x1e1e22,2), gripM=mat(0x17171b,2), panelM=mat(0x141418,3), darkM=mat(0x141417,2);
box(frame,16,1.5,2.4,0,0.75,0,frameM);
var grip=box(frame,2.4,6.6,2.0,-2.6,-2.8,0,gripM); grip.rotation.z=0.09;
var gp1=box(frame,2.6,6.6,0.15,-2.6,-2.8,-1.05,panelM); gp1.rotation.z=0.09;
var gp2=box(frame,2.6,6.6,0.15,-2.6,-2.8,1.05,panelM); gp2.rotation.z=0.09;
box(frame,0.55,2.1,0.85,-5.0,-1.15,0,frameM);
box(frame,0.55,1.7,0.85,-2.4,-0.85,0,frameM);
box(frame,3.1,0.55,0.85,-3.7,-2.0,0,frameM);
box(frame,0.32,0.9,0.3,-3.7,-0.8,0,mat(0x2a2a30,2));
box(frame,5.5,0.45,1.9,4.3,0.22,0,frameM);
box(frame,2.6,0.9,2.15,-2.6,-0.45,0,mat(0x101013,2));
box(frame,0.5,0.4,1.2,3.2,1.35,1.35,mat(0x3c3c42,2));
box(frame,0.4,0.5,0.4,-4.2,0.8,1.4,mat(0x3c3c42,2));
box(frame,0.3,0.5,0.3,-4.5,-6.0,0,mat(0x3c3c42,2));

/* barrel fixed to frame, revealed when slide racks back */
cyl(frame,0.5,7.0,6.8,1.5,0,0xdcdce0);
cyl(frame,0.6,0.4,10.3,1.5,0,0xe8e8ec);
box(frame,2.6,1.3,1.3,4.6,1.5,0,mat(0xb8b8be,1.5));

/* slide group */
var slide=new THREE.Group(); gun.add(slide);
var slideM=mat(0x303036,2), roofM=mat(0x3a3a40,2), serrM=mat(0x1e1e23,2), ctlM=mat(0x242429,2);
box(slide,16,1.55,2.9,0,1.5,0,slideM);
box(slide,16,0.6,2.1,0,2.02,0,roofM);
for(var i=0;i<6;i++){
  box(slide,0.16,1.1,0.22,-7.3+i*0.5,1.5,-1.5,serrM);
  box(slide,0.16,1.1,0.22,-7.3+i*0.5,1.5,1.5,serrM);
}
box(slide,2.2,0.55,0.35,2.6,1.85,1.3,serrM);
box(slide,0.45,0.4,0.9,-7.3,2.3,-1.15,ctlM);
box(slide,0.8,0.9,1.1,-8.2,2.0,0,ctlM);

var rearS=new THREE.Group(); slide.add(rearS);
box(rearS,1.6,0.5,0.8,-7.0,2.57,0,serrM);
var redMat=new THREE.MeshBasicMaterial({color:0xff3030});
var rdot1=box(rearS,0.15,0.15,0.4,-7.0,2.95,-0.25,redMat);
var rdot2=box(rearS,0.15,0.15,0.4,-7.0,2.95,0.25,redMat);

var frontS=new THREE.Group(); slide.add(frontS);
box(frontS,0.32,0.55,0.5,6.6,2.6,0,serrM);
var greenMat=new THREE.MeshBasicMaterial({color:0x39ff14});
var gdot=box(frontS,0.18,0.18,0.42,6.6,2.98,0,greenMat);

var glowF=new THREE.PointLight(0x39ff14,0.35,5); glowF.position.set(6.6,3.4,-0.6); slide.add(glowF);
var glowR=new THREE.PointLight(0xff3030,0.30,5); glowR.position.set(-7.0,3.4,0); slide.add(glowR);

/* compensator group */
var comp=new THREE.Group(); gun.add(comp);
var compM=mat(0x40404a,2), compSlot=mat(0x26262c,2), compConn=mat(0x35353d,2);
box(comp,3.5,1.7,2.6,12.25,0.65,0,compM);
box(comp,3.0,0.35,0.2,12.25,1.55,-0.55,compSlot);
box(comp,3.0,0.35,0.2,12.25,1.55,0.55,compSlot);
box(comp,1.5,0.7,2.0,12.25,-0.35,0,compConn);

/* magazine group */
var mag=new THREE.Group(); gun.add(mag);
mag.position.set(-2.6,-3.0,0); mag.rotation.z=0.09;
box(mag,2.0,5.6,1.6,0,-2.3,0,mat(0x26262b,2));
box(mag,2.2,0.5,1.9,0,-5.35,0,mat(0x1c1c20,2));
box(mag,1.6,0.5,1.2,0,0.25,0,mat(0x151518,2));

/* soft contact shadow */
var shadow=new THREE.Mesh(
  new THREE.PlaneGeometry(24,8),
  new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.16})
);
shadow.rotation.x=-Math.PI/2;
shadow.position.set(1.5,-9.9,0);
scene.add(shadow);

/* ---------------- animation ---------------- */
var SLIDE_BACK=new THREE.Vector3(-5.4,0.35,0);
var MAG_OUT=new THREE.Vector3(0.15,-3.6,0.2);
var COMP_OUT=new THREE.Vector3(0,-2.2,0);
var ZERO=new THREE.Vector3(0,0,0);
var LOOP=9.0;
var clock=new THREE.Clock();
var dots=[gdot,rdot1,rdot2];

function easeIO(x){ return x<0.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2; }
function seg(x,a,b){ return Math.min(1,Math.max(0,(x-a)/(b-a))); }

function animate(){
  requestAnimationFrame(animate);
  var dt=Math.min(clock.getDelta(),0.05);
  var time=clock.elapsedTime;
  var t=(time%LOOP)/LOOP;

  var s=ZERO,m=ZERO,c=ZERO,k;

  if(t<0.16){ s=SLIDE_BACK; m=MAG_OUT; c=COMP_OUT; }
  else if(t<0.30){ k=easeIO(seg(t,0.16,0.30)); s=SLIDE_BACK; m=MAG_OUT.clone().multiplyScalar(1-k); c=COMP_OUT; }
  else if(t<0.52){ k=easeIO(seg(t,0.30,0.52)); s=SLIDE_BACK.clone().multiplyScalar(1-k); c=COMP_OUT; }
  else if(t<0.62){ k=easeIO(seg(t,0.52,0.62)); c=COMP_OUT.clone().multiplyScalar(1-k); }
  else if(t<0.74){ }
  else if(t<0.84){ k=easeIO(seg(t,0.74,0.84)); c=COMP_OUT.clone().multiplyScalar(k); }
  else { k=easeIO(seg(t,0.84,1.0)); s=SLIDE_BACK.clone().multiplyScalar(k); m=MAG_OUT.clone().multiplyScalar(k); c=COMP_OUT; }

  slide.position.set(s.x,s.y,s.z);
  mag.position.set(-2.6+m.x,-3.0+m.y,m.z);
  comp.position.set(c.x,c.y,c.z);

  gun.rotation.y=Math.sin(time*0.5)*0.07;
  gun.position.y=Math.sin(time*0.7)*0.05;

  var p=0.5+0.5*Math.sin(time*3.2);
  for(var i=0;i<dots.length;i++){
    var sc=1+0.15*p;
    dots[i].scale.set(sc,sc,sc);
  }

  renderer.render(scene,cam);
}
animate();
})();
</script>
</body>
</html>
