<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="app">
(function () {
"use strict";

/* ================================================================
   0. UTILITIES — seeded noise, easing, tiny mesh factories
   ================================================================ */
var seed = 20260922;
function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }

function clamp01(p) { return p < 0 ? 0 : (p > 1 ? 1 : p); }
function span(t, a, b) { return clamp01((t - a) / (b - a)); }
function smooth(p) { return p * p * (3 - 2 * p); }
function smoother(p) { return p * p * p * (p * (p * 6 - 15) + 10); }
function backOut(p) { var c = 1.35, q = p - 1; return 1 + (c + 1) * q * q * q + c * q * q; }
function lerp(a, b, p) { return a + (b - a) * p; }
function mixV(v, a, b, p) { v.x = lerp(a.x, b.x, p); v.y = lerp(a.y, b.y, p); v.z = lerp(a.z, b.z, p); }

function pixelTexture(hex, amp) {
  var size = 32;
  var c = document.createElement("canvas");
  c.width = c.height = size;
  var g = c.getContext("2d");
  var base = new THREE.Color(hex);
  for (var y = 0; y < size; y += 2) {
    for (var x = 0; x < size; x += 2) {
      var n = (rnd() * 2 - 1) * amp;
      var r = Math.max(0, Math.min(255, (base.r + n) * 255));
      var gg = Math.max(0, Math.min(255, (base.g + n) * 255));
      var b = Math.max(0, Math.min(255, (base.b + n) * 255));
      g.fillStyle = "rgb(" + (r | 0) + "," + (gg | 0) + "," + (b | 0) + ")";
      g.fillRect(x, y, 2, 2);
    }
  }
  var tex = new THREE.CanvasTexture(c);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  return tex;
}

function glowTexture(hex) {
  var size = 64;
  var c = document.createElement("canvas");
  c.width = c.height = size;
  var g = c.getContext("2d");
  var grad = g.createRadialGradient(size / 2, size / 2, 1, size / 2, size / 2, size / 2);
  grad.addColorStop(0.0, hex);
  grad.addColorStop(0.35, hex);
  grad.addColorStop(1.0, "rgba(0,0,0,0)");
  g.fillStyle = grad;
  g.fillRect(0, 0, size, size);
  var tex = new THREE.CanvasTexture(c);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  return tex;
}

function box(w, h, d, mat, x, y, z) {
  var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x || 0, y || 0, z || 0);
  return m;
}
function cylY(rTop, rBot, h, seg, mat, x, y, z) {
  var m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, seg), mat);
  m.position.set(x || 0, y || 0, z || 0);
  return m;
}
function cylX(len, rFront, rBack, seg, mat, x, y, z) {
  var g = new THREE.CylinderGeometry(rFront, rBack, len, seg);
  g.rotateZ(Math.PI / 2);
  var m = new THREE.Mesh(g, mat);
  m.position.set(x || 0, y || 0, z || 0);
  return m;
}
function cylZ(r, h, seg, mat, x, y, z) {
  var g = new THREE.CylinderGeometry(r, r, h, seg);
  g.rotateX(Math.PI / 2);
  var m = new THREE.Mesh(g, mat);
  m.position.set(x || 0, y || 0, z || 0);
  return m;
}
function extrude(pts, depth, mat) {
  var s = new THREE.Shape();
  s.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) s.lineTo(pts[i][0], pts[i][1]);
  s.closePath();
  var g = new THREE.ExtrudeGeometry(s, { depth: depth, bevelEnabled: false, curveSegments: 1 });
  g.translate(0, 0, -depth / 2);
  g.computeVertexNormals();
  return new THREE.Mesh(g, mat);
}

/* ================================================================
   1. RENDERER / SCENE / CAMERA / LIGHTS
   ================================================================ */
var PIXEL = 3;                       /* PS1 downscale factor */
var canvas = document.getElementById("gl");
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false, alpha: false });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = false;

var scene = new THREE.Scene();
var BG_USP = new THREE.Color(0xc7cacf);
var BG_AR  = new THREE.Color(0x171a1e);
scene.background = BG_USP.clone();

var camera = new THREE.PerspectiveCamera(17, 1, 1, 500);

var hemi = new THREE.HemisphereLight(0xffffff, 0x8a8f96, 0.85);
scene.add(hemi);
var key = new THREE.DirectionalLight(0xffffff, 0.95);
key.position.set(-28, 36, 42);
scene.add(key);
var fill = new THREE.DirectionalLight(0xbfd0e0, 0.4);
fill.position.set(36, 6, 28);
scene.add(fill);
var rim = new THREE.DirectionalLight(0xffffff, 0.5);
rim.position.set(10, -18, -46);
scene.add(rim);

/* orbit state (drag + wheel) */
var orb = { yaw: 0, pitch: 0, zoom: 1 };

/* ================================================================
   2. MATERIAL LIBRARY (flat-shaded, pixel-noise maps)
   ================================================================ */
var matSlide = new THREE.MeshPhongMaterial({
  color: 0x6a7076, specular: 0x9aa4ac, shininess: 34,
  map: pixelTexture(0x5d646b, 0.05), flatShading: true
});
var matSlideDark = new THREE.MeshPhongMaterial({
  color: 0x3c4248, specular: 0x60686e, shininess: 22, flatShading: true
});
var matSilver = new THREE.MeshPhongMaterial({
  color: 0xbfc6cd, specular: 0xcdd6dd, shininess: 55,
  map: pixelTexture(0xb8bfc6, 0.04), flatShading: true
});
var matPolymer = new THREE.MeshPhongMaterial({
  color: 0x5a6167, specular: 0x2a2e33, shininess: 8,
  map: pixelTexture(0x535a60, 0.06), flatShading: true
});
var matPolymerDark = new THREE.MeshPhongMaterial({
  color: 0x42484e, specular: 0x20242a, shininess: 6, flatShading: true
});
var matComp = new THREE.MeshPhongMaterial({
  color: 0x767d84, specular: 0xb8c2ca, shininess: 46,
  map: pixelTexture(0x6d747b, 0.05), flatShading: true
});
var matMag = new THREE.MeshPhongMaterial({
  color: 0x33383d, specular: 0x4a5057, shininess: 18, flatShading: true
});
matMag.map = pixelTexture(0x303539, 0.05);
var matBlack = new THREE.MeshPhongMaterial({
  color: 0x14171a, specular: 0x30363c, shininess: 14, flatShading: true
});

/* AR-15 palette : matte black anodized aluminium + dark steel */
var matAlu = new THREE.MeshPhongMaterial({
  color: 0x2b3035, specular: 0x4c545c, shininess: 16,
  map: pixelTexture(0x272c31, 0.035), flatShading: true
});
var matAlu2 = new THREE.MeshPhongMaterial({
  color: 0x22272b, specular: 0x3c434a, shininess: 12, flatShading: true
});
var matSteel = new THREE.MeshPhongMaterial({
  color: 0x4a5157, specular: 0xaeb8c0, shininess: 55, flatShading: true
});
var matSteelDark = new THREE.MeshPhongMaterial({
  color: 0x33383d, specular: 0x6a7278, shininess: 40, flatShading: true
});
var matSpring = new THREE.MeshPhongMaterial({
  color: 0x8a9298, specular: 0xdde4ea, shininess: 70, flatShading: true
});

var glowGreenTex = glowTexture("rgba(80,255,120,0.95)");
var glowRedTex   = glowTexture("rgba(255,60,60,0.95)");
function makeGlow(tex, scale) {
  var sm = new THREE.SpriteMaterial({
    map: tex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true
  });
  var sp = new THREE.Sprite(sm);
  sp.scale.set(scale, scale, 1);
  return sp;
}

/* ================================================================
   3. SCENE 01 — USP MATCH (PS1 LOW-POLY)
   Coordinate convention : muzzle +X, up +Y, right side +Z, bore y = 0
   ================================================================ */
var uspRoot = new THREE.Group();
scene.add(uspRoot);

/* ---- 3.1 slide (dark metal, locks back) ---- */
var slideG = new THREE.Group();
uspRoot.add(slideG);
(function buildSlide() {
  var prof = [
    [-11.0, -0.55], [8.2, -0.55], [10.2, 0.10], [10.2, 1.12],
    [8.6, 1.55], [-10.1, 1.55], [-11.0, 1.00]
  ];
  slideG.add(extrude(prof, 2.05, matSlide));
  /* ejection port (right side) */
  slideG.add(box(3.4, 1.05, 0.08, matSlideDark, 2.4, 0.35, 1.03));
  slideG.add(box(3.4, 1.05, 0.08, matSlideDark, 2.4, 0.35, -1.03));
  /* top flat rib */
  slideG.add(box(17.0, 0.14, 1.5, matSlideDark, -1.2, 1.6, 0));
  /* rear cocking serrations */
  for (var i = 0; i < 7; i++) {
    var sx = -10.4 + i * 0.34;
    slideG.add(box(0.13, 1.5, 0.1, matSlideDark, sx, 0.4, 1.05));
    slideG.add(box(0.13, 1.5, 0.1, matSlideDark, sx, 0.4, -1.05));
  }
  /* front serrations */
  for (var j = 0; j < 4; j++) {
    var fx = 7.4 + j * 0.34;
    slideG.add(box(0.13, 1.2, 0.1, matSlideDark, fx, 0.4, 1.05));
    slideG.add(box(0.13, 1.2, 0.1, matSlideDark, fx, 0.4, -1.05));
  }
  /* rear sight block with red fiber optics */
  slideG.add(box(1.5, 0.5, 1.7, matBlack, -9.55, 1.85, 0));
  slideG.add(box(0.5, 0.42, 0.55, matBlack, -9.55, 2.1, 0.52));
  slideG.add(box(0.5, 0.42, 0.55, matBlack, -9.55, 2.1, -0.52));
  var redDot = new THREE.MeshPhongMaterial({
    color: 0xff3a3a, emissive: 0xff2020, emissiveIntensity: 1.4,
    specular: 0xffffff, shininess: 80, flatShading: true
  });
  slideG.add(cylZ(0.14, 0.3, 6, redDot, -9.55, 2.1, 0.52));
  slideG.add(cylZ(0.14, 0.3, 6, redDot, -9.55, 2.1, -0.52));
  var gR1 = makeGlow(glowRedTex, 0.85); gR1.position.set(-9.55, 2.1, 0.62); slideG.add(gR1);
  var gR2 = makeGlow(glowRedTex, 0.85); gR2.position.set(-9.55, 2.1, -0.62); slideG.add(gR2);
  slideG.userData.glow = [gR1, gR2];
})();

/* ---- 3.2 barrel (bare bright silver) ---- */
var barrelG = new THREE.Group();
uspRoot.add(barrelG);
(function buildBarrel() {
  barrelG.add(cylX(24.7, 0.5, 0.5, 8, matSilver, 2.95, 0, 0));     /* tube : -9.4 .. 15.3 */
  barrelG.add(cylX(3.6, 0.78, 0.78, 8, matSilver, -6.4, 0.25, 0)); /* chamber */
  barrelG.add(cylX(0.7, 0.6, 0.6, 8, matSilver, -3.6, 0.1, 0));    /* lug ring */
  barrelG.add(cylX(0.5, 0.6, 0.6, 8, matSilver, -2.6, 0.1, 0));
  barrelG.add(cylX(1.4, 0.44, 0.5, 8, matSilver, 13.9, 0, 0));     /* threaded muzzle */
  barrelG.add(cylX(0.55, 0.58, 0.58, 8, matSilver, 15.05, 0, 0));  /* crown */
})();

/* ---- 3.3 polymer frame / lower receiver ---- */
var frameG = new THREE.Group();
uspRoot.add(frameG);
var trigG = new THREE.Group();
var hamG = new THREE.Group();
(function buildFrame() {
  /* dust cover + accessory rail */
  frameG.add(box(16.6, 1.05, 1.9, matPolymer, 0.5, -1.05, 0));
  frameG.add(box(16.6, 0.3, 2.1, matPolymerDark, 0.5, -1.7, 0));
  for (var i = 0; i < 4; i++) {
    frameG.add(box(0.3, 0.34, 2.2, matBlack, 3.2 + i * 1.4, -1.85, 0));
  }
  /* grip (angled) */
  var grip = box(3.1, 7.4, 1.75, matPolymer, -5.3, -5.1, 0);
  grip.rotation.z = -0.26;
  frameG.add(grip);
  var flare = box(3.5, 0.6, 1.95, matPolymerDark, -6.25, -8.75, 0);
  flare.rotation.z = -0.26;
  frameG.add(flare);
  /* grip texture panels */
  for (var p = 0; p < 5; p++) {
    var pan = box(0.16, 5.6, 1.8, matPolymerDark, -3.72 - p * 0.62, -5.0 + p * 0.16, 0);
    pan.rotation.z = -0.26;
    frameG.add(pan);
  }
  /* trigger guard */
  frameG.add(box(4.8, 0.5, 1.5, matPolymer, -1.5, -4.35, 0));
  var guardF = box(0.5, 2.7, 1.5, matPolymer, 0.75, -3.05, 0);
  guardF.rotation.z = 0.18;
  frameG.add(guardF);
  frameG.add(box(0.55, 2.3, 1.5, matPolymerDark, -3.75, -3.2, 0));
  /* beavertail tang (houses the hammer behind the slide) */
  frameG.add(box(2.4, 1.8, 1.7, matPolymer, -8.4, -1.8, 0));
  /* trigger (pivots on trigger pin) */
  trigG.position.set(-2.4, -2.2, 0);
  var blade = box(0.38, 1.35, 0.55, matSteel, 0.05, -0.7, 0);
  blade.rotation.z = 0.12;
  trigG.add(blade);
  trigG.add(cylZ(0.2, 1.9, 6, matSteelDark, 0, 0, 0));
  frameG.add(trigG);
  /* hammer (pivots at the tang, stays clear of the slide underside) */
  hamG.position.set(-8.4, -2.2, 0);
  hamG.add(box(0.5, 1.5, 0.7, matSteel, 0.1, 0.6, 0));
  hamG.add(box(0.8, 0.35, 0.75, matSteel, 0.45, 1.3, 0));
  hamG.add(cylZ(0.22, 1.9, 6, matSteelDark, 0, 0, 0));
  hamG.rotation.z = -0.3;
  frameG.add(hamG);
  /* magazine release */
  frameG.add(cylZ(0.3, 0.5, 6, matSteel, -3.3, -1.75, 1.0));
  /* slide stop lever */
  frameG.add(box(1.6, 0.3, 0.16, matSteel, -1.2, -0.7, 1.0));
})();

/* ---- 3.4 magazine (slides up the grip axis) ---- */
var magSlot = new THREE.Group();
magSlot.position.set(-4.55, -1.5, 0);
magSlot.rotation.z = -0.26;
uspRoot.add(magSlot);
var magG = new THREE.Group();
magSlot.add(magG);
(function buildMag() {
  magG.add(box(2.35, 6.3, 1.3, matMag, 0, -2.9, 0));
  magG.add(box(2.75, 0.5, 1.55, matBlack, 0, -6.1, 0));
  magG.add(box(2.5, 0.3, 1.4, matBlack, 0, 0.1, 0));
  for (var i = 0; i < 3; i++) magG.add(box(0.5, 0.16, 1.36, matBlack, 0.4, -1.6 - i * 1.5, 0));
})();

/* ---- 3.5 match weight / compensator (front, with green fiber sight) ---- */
var compG = new THREE.Group();
uspRoot.add(compG);
(function buildComp() {
  /* match weight slab : clamps under the muzzle, silver barrel stays visible on top */
  var prof = [
    [-0.15, -1.55], [4.55, -1.55], [4.9, -0.9], [4.9, -0.05],
    [0.3, -0.05], [-0.15, -0.45]
  ];
  compG.add(extrude(prof, 2.6, matComp));
  /* top gas ports */
  for (var i = 0; i < 3; i++) compG.add(box(0.5, 0.3, 1.6, matBlack, 0.8 + i * 1.1, 0.05, 0));
  /* side flats */
  compG.add(box(4.6, 0.2, 2.7, matComp, 2.35, -1.6, 0));
  /* clamp bolts */
  compG.add(cylZ(0.22, 2.8, 6, matSteel, 0.4, -0.8, 0));
  compG.add(cylZ(0.22, 2.8, 6, matSteel, 3.9, -0.8, 0));
  /* front sight : high-contrast green fiber optic */
  compG.add(box(0.55, 1.0, 0.5, matBlack, 3.7, 0.3, 0));
  var greenDot = new THREE.MeshPhongMaterial({
    color: 0x54ff7a, emissive: 0x2bff5c, emissiveIntensity: 1.6,
    specular: 0xffffff, shininess: 80, flatShading: true
  });
  compG.add(cylZ(0.16, 0.4, 6, greenDot, 3.7, 0.85, 0));
  var gG = makeGlow(glowGreenTex, 1.15);
  gG.position.set(3.7, 0.85, 0.15);
  compG.add(gG);
  compG.userData.glow = [gG];
})();

/* assembled / exploded keyframe offsets for scene 01 */
var SLIDE_LOCK = -4.8, SLIDE_RACK = -6.4;
var MAG_OUT = -8.5;
var BARREL_EX = new THREE.Vector3(3.0, 2.3, 0);
var BARREL_HM = new THREE.Vector3(0, 0, 0);
var COMP_EX = 7.2;

var uspPhaseEn = [
  [0.00, 0.05, "EXPLODED VIEW", "SLIDE LOCKED BACK · BARREL BARE"],
  [0.05, 0.14, "BARREL SEATED", "CHAMBER INTO FRAME"],
  [0.14, 0.28, "MAGAZINE SEATING", "SLIDES UP THE GRIP AXIS"],
  [0.28, 0.33, "SLIDE PULLED BACK", "RACK OVER BARE BARREL"],
  [0.33, 0.45, "SLIDE RETURN", "GOES TO BATTERY"],
  [0.45, 0.58, "MATCH WEIGHT LOCKING", "COMPENSATOR ON RAIL"],
  [0.58, 0.74, "READY STATE", "FIBER SIGHTS ARMED"],
  [0.74, 0.82, "MATCH WEIGHT OFF", "COMPENSATOR SEPARATES"],
  [0.82, 0.92, "SLIDE LOCKED BACK", "BARREL BARE AGAIN"],
  [0.92, 1.00, "MAGAZINE RELEASED", "DROPS FROM GRIP"]
];

function updateUSP(t) {
  /* slide : locked back -> rack -> battery -> rack -> locked back */
  var sx;
  if (t < 0.28) sx = SLIDE_LOCK;
  else if (t < 0.33) sx = lerp(SLIDE_LOCK, SLIDE_RACK, smooth(span(t, 0.28, 0.33)));
  else if (t < 0.45) sx = lerp(SLIDE_RACK, 0, backOut(span(t, 0.33, 0.45)));
  else if (t < 0.74) sx = 0;
  else if (t < 0.82) sx = lerp(0, SLIDE_RACK, smooth(span(t, 0.74, 0.82)));
  else if (t < 0.92) sx = lerp(SLIDE_RACK, SLIDE_LOCK, smooth(span(t, 0.82, 0.92)));
  else sx = SLIDE_LOCK;
  slideG.position.x = sx;

  /* magazine : up the grip axis, later drops clear (with lateral separation) */
  var magP;
  if (t < 0.14) magP = 1;
  else if (t < 0.28) magP = 1 - smoother(span(t, 0.14, 0.28));
  else if (t < 0.92) magP = 0;
  else magP = smoother(span(t, 0.92, 1.0));
  magG.position.set(-2.6 * magP, MAG_OUT * magP, 2.4 * magP);
  magG.rotation.z = 0.3 * magP;

  /* barrel : floats free in exploded view, seats into the frame */
  var bp;
  if (t < 0.05) bp = 0;
  else if (t < 0.14) bp = smooth(span(t, 0.05, 0.14));
  else if (t < 0.88) bp = 1;
  else if (t < 0.98) bp = 1 - smooth(span(t, 0.88, 0.98));
  else bp = 0;
  mixV(barrelG.position, BARREL_EX, BARREL_HM, bp);

  /* match weight : slides along the frame rail */
  var cx;
  if (t < 0.45) cx = COMP_EX;
  else if (t < 0.58) cx = lerp(COMP_EX, 0, smoother(span(t, 0.45, 0.58)));
  else if (t < 0.74) cx = 0;
  else if (t < 0.82) cx = lerp(0, COMP_EX, smoother(span(t, 0.74, 0.82)));
  else cx = COMP_EX;
  compG.position.x = 10.35 + cx;   /* home : clears the slide nose at x = 10.2 */

  /* fiber optic glow : pulse strongest in the ready state */
  var pulse = 0.75 + 0.25 * Math.sin(performance.now() * 0.006);
  var ready = (t > 0.58 && t < 0.74) ? 1.0 : 0.55;
  var glows = slideG.userData.glow.concat(compG.userData.glow);
  for (var i = 0; i < glows.length; i++) {
    var s = 0.8 * ready * pulse;
    glows[i].scale.set(s * 1.2, s * 1.2, 1);
    glows[i].material.opacity = 0.55 + 0.45 * ready;
  }

  /* gentle presentation sway (seamless : full sine period per loop) */
  uspRoot.rotation.y = Math.sin(t * Math.PI * 2) * 0.38;
  uspRoot.rotation.x = Math.sin(t * Math.PI * 4) * 0.05;
  uspRoot.rotation.z = 0;
}

function updateAR(t) {
  /* fire control demo : trigger pull -> sear -> hammer fall -> re-cock */
  var trigRot = 0;
  if (t < 0.04) trigRot = 0;
  else if (t < 0.08) trigRot = lerp(0, 0.4, smooth(span(t, 0.04, 0.08)));
  else if (t < 0.10) trigRot = 0.4;
  else if (t < 0.16) trigRot = lerp(0.4, 0, smooth(span(t, 0.10, 0.16)));
  trigArG.rotation.z = -trigRot;
  searG.rotation.z = trigRot * 0.5;

  var hamRot = 0;
  if (t < 0.08) hamRot = 0;
  else if (t < 0.11) hamRot = lerp(0, 1.25, smooth(span(t, 0.08, 0.11)));
  else if (t < 0.16) hamRot = 1.25;
  else if (t < 0.22) hamRot = lerp(1.25, 0, smooth(span(t, 0.16, 0.22)));
  hamArG.rotation.z = -hamRot;

  /* safety selector : 90 deg swing on its own axis */
  var sRot = 0;
  if (t < 0.03) sRot = 0;
  else if (t < 0.06) sRot = lerp(0, 1.57, smooth(span(t, 0.03, 0.06)));
  else if (t < 0.22) sRot = 1.57;
  else if (t < 0.26) sRot = lerp(1.57, 0, smooth(span(t, 0.22, 0.26)));
  safetyG.rotation.z = sRot;

  /* magazine release button (presses inboard along Z) + magazine (drops on its axis) */
  var press = 0;
  if (t < 0.16) press = 0;
  else if (t < 0.19) press = smooth(span(t, 0.16, 0.19));
  else if (t < 0.24) press = 1;
  else if (t < 0.28) press = 1 - smooth(span(t, 0.24, 0.28));
  magRelG.children[0].position.z = 0.9 - press * 0.28;

  var magDrop = 0;
  if (t < 0.18) magDrop = 0;
  else if (t < 0.28) magDrop = smoother(span(t, 0.18, 0.28));
  else if (t < 0.95) magDrop = 1;
  else magDrop = 1 - smoother(span(t, 0.95, 1.0));
  arMagG.position.y = -3.4 - magDrop * 5.2;
  arMagG.rotation.z = -magDrop * 0.1;

  /* rear takedown pin : straight out along Z */
  var pin = 0;
  if (t < 0.26) pin = 0;
  else if (t < 0.34) pin = smooth(span(t, 0.26, 0.34));
  else if (t < 0.92) pin = 1;
  else pin = 1 - smooth(span(t, 0.92, 0.95));
  pinRear.position.z = pin * 2.6;

  /* upper receiver : rotates open around the front pivot pin */
  var openP = 0;
  if (t < 0.34) openP = 0;
  else if (t < 0.48) openP = smoother(span(t, 0.34, 0.48));
  else if (t < 0.86) openP = 1;
  else openP = 1 - smoother(span(t, 0.86, 0.92));
  hinge.rotation.z = -0.62 * openP;

  /* bolt head : rotary unlock on the bore axis, then carrier travels the rail */
  var boltRot = 0;
  if (t < 0.48) boltRot = 0;
  else if (t < 0.54) boltRot = smooth(span(t, 0.48, 0.54));
  else if (t < 0.80) boltRot = 1;
  else boltRot = 1 - smooth(span(t, 0.80, 0.85));
  boltG.rotation.x = -0.55 * boltRot;

  var bcgP = 0;
  if (t < 0.54) bcgP = 0;
  else if (t < 0.70) bcgP = smoother(span(t, 0.54, 0.70));
  else if (t < 0.76) bcgP = 1;
  else bcgP = 1 - smoother(span(t, 0.76, 0.86));
  bcgG.position.x = -6.6 * bcgP;
  chargeG.position.x = -6.6 * bcgP;

  /* recoil spring : front end follows the buffer rearward, rear end stays put */
  springG.scale.x = 1 - 0.26 * bcgP;
  springG.position.x = -3.38 * bcgP;
  bufferG.position.x = -1.9 * bcgP;
}

/* ================================================================
   5. MODE SWITCHING
   ================================================================ */
var MODE = "usp";
var T_LOOP = { usp: 18, ar: 26 };
var clockT = 0;
var playing = true;

var elTitle = document.getElementById("ttl");
var elSub = document.getElementById("sub");
var elPhase = document.getElementById("phase");
var elPhaseEn = document.getElementById("phaseEn");
var elTag = document.getElementById("modeTag");
var elFill = document.getElementById("clockfill");
var btnUsp = document.getElementById("btnUsp");
var btnAr = document.getElementById("btnAr");
var btnPlay = document.getElementById("btnPlay");
var btnRestart = document.getElementById("btnRestart");

function setMode(m, t0) {
  MODE = m;
  clockT = (t0 || 0) * T_LOOP[m];
  var isUsp = (m === "usp");
  uspRoot.visible = isUsp;
  arRoot.visible = !isUsp;
  document.body.className = isUsp ? "mode-usp" : "mode-ar";
  scene.background = (isUsp ? BG_USP : BG_AR).clone();
  hemi.intensity = isUsp ? 0.85 : 0.32;
  key.intensity = isUsp ? 0.9 : 0.85;
  fill.intensity = isUsp ? 0.4 : 0.28;
  rim.intensity = isUsp ? 0.5 : 0.55;
  for (var i = 0; i < cadEls.length; i++) cadEls[i].g.style.display = isUsp ? "none" : "";
  cadEls.deco.style.display = isUsp ? "none" : "";
  btnUsp.className = isUsp ? "on" : "";
  btnAr.className = isUsp ? "" : "on";
  elTag.textContent = isUsp ? "SCENE 01 / 02 · PS1 LOW-POLY" : "SCENE 02 / 02 · TECHNICAL CAD";
  elTitle.textContent = isUsp ? "USP MATCH · COMPETITION" : "AR-15 · MECHANICAL SEQUENCE";
  elSub.innerHTML = isUsp
    ? "RETRO LOW-POLY / PS1 RENDER · PROCEDURAL GEOMETRY<br>EXPLODED ⇄ ASSEMBLED MECHANICAL LOOP · FLAT SHADING"
    : "MATTE BLACK ANODIZED ALU + DARK STEEL · STUDIO LIGHT<br>SLOW-MO DISASSEMBLY ON TRUE PIVOTS · CAD OVERLAY";
  orb.yaw = 0; orb.pitch = 0; orb.zoom = 1;
  resize();
}

btnUsp.addEventListener("click", function () { setMode("usp"); });
btnAr.addEventListener("click", function () { setMode("ar"); });
btnPlay.addEventListener("click", function () {
  playing = !playing;
  btnPlay.textContent = playing ? "PAUSE" : "PLAY";
});
btnRestart.addEventListener("click", function () { clockT = 0; });

/* drag orbit + wheel zoom */
var drag = null;
canvas.addEventListener("pointerdown", function (e) {
  drag = { x: e.clientX, y: e.clientY };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", function (e) {
  if (!drag) return;
  orb.yaw += (e.clientX - drag.x) * 0.005;
  orb.pitch += (e.clientY - drag.y) * 0.004;
  orb.pitch = Math.max(-0.7, Math.min(0.7, orb.pitch));
  drag.x = e.clientX; drag.y = e.clientY;
});
canvas.addEventListener("pointerup", function () { drag = null; });
canvas.addEventListener("wheel", function (e) {
  e.preventDefault();
  orb.zoom *= (e.deltaY > 0 ? 1.08 : 0.93);
  orb.zoom = Math.max(0.45, Math.min(2.2, orb.zoom));
}, { passive: false });

/* ================================================================
   6. RESIZE + MAIN LOOP
   ================================================================ */
var W = 0, H = 0;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  renderer.setSize(Math.max(2, Math.round(W / PIXEL)), Math.max(2, Math.round(H / PIXEL)), false);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  buildDeco(W, H);
}
window.addEventListener("resize", resize);
resize();

function phaseText(list, t) {
  for (var i = 0; i < list.length; i++) {
    if (t >= list[i][0] && t < list[i][1]) return [list[i][2], list[i][3]];
  }
  return [list[list.length - 1][2], list[list.length - 1][3]];
}

var camTarget = new THREE.Vector3();
var last = performance.now();
function frame(now) {
  var dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (playing) clockT += dt;
  var loop = T_LOOP[MODE];
  var t = (clockT % loop) / loop;

  if (MODE === "usp") {
    updateUSP(t);
    camTarget.set(1, -3, 0);
  } else {
    updateAR(t);
    camTarget.set(3, -2.5, 0);
  }

  /* near-ortho presentation camera (fov 17) on a slow orbit */
  var baseDist = (MODE === "usp" ? 112 : 120) * orb.zoom;
  var yaw = orb.yaw + (MODE === "usp" ? 0 : 0.22);
  var pitch = orb.pitch + (MODE === "usp" ? 0.06 : 0.12);
  camera.position.set(
    camTarget.x + baseDist * Math.sin(yaw) * Math.cos(pitch),
    camTarget.y + baseDist * Math.sin(pitch),
    camTarget.z + baseDist * Math.cos(yaw) * Math.cos(pitch)
  );
  camera.lookAt(camTarget);

  var ph = phaseText(MODE === "usp" ? uspPhaseEn : arPhaseEn, t);
  elPhase.childNodes[0].nodeValue = ph[0];
  elPhaseEn.textContent = ph[1];
  elFill.style.width = (t * 100).toFixed(1) + "%";

  renderer.render(scene, camera);
  if (MODE === "ar") updateCadOverlay(W, H);
  requestAnimationFrame(frame);
}

/* hash deep-link : "#usp" / "#ar" with optional seek "#ar=0.75" */
function parseHash() {
  var h = location.hash.replace(/^#/, "");
  var m = (h.indexOf("ar") === 0) ? "ar" : "usp";
  var t0 = 0;
  var eq = h.indexOf("=");
  if (eq >= 0) t0 = clamp01(parseFloat(h.slice(eq + 1)) || 0);
  return { mode: m, t0: t0 };
}
var ph0 = parseHash();
setMode(ph0.mode, ph0.t0);
window.addEventListener("hashchange", function () {
  var p = parseHash();
  setMode(p.mode, p.t0);
});
requestAnimationFrame(frame);
})();
</script>
