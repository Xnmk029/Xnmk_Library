<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USP Match · Low-Poly / PS1</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #3a3a3a;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  canvas { display: block; }
  #overlay {
    position: fixed;
    bottom: 16px;
    left: 16px;
    color: #888;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
  }
  #title {
    position: fixed;
    top: 16px;
    right: 16px;
    color: #aaa;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="title">USP MATCH · LOW-POLY</div>
<div id="overlay">PS1 STYLE · 60 FPS · EXPLODED VIEW</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Scene ──────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3a3a3a);

const camera = new THREE.OrthographicCamera(-4, 4, 3, -3, 0.1, 100);
camera.position.set(0, 2.5, 6);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ── Lights ─────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0x404040, 0.6);
scene.add(ambient);

const key = new THREE.DirectionalLight(0xffffff, 1.2);
key.position.set(5, 8, 5);
key.castShadow = true;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8899aa, 0.4);
fill.position.set(-3, 2, -3);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffeedd, 0.3);
rim.position.set(0, -1, 4);
scene.add(rim);

// ── Ground plane (subtle) ──────────────────────────────
const groundGeo = new THREE.PlaneGeometry(20, 20);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x2e2e2e, roughness: 0.9 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.2;
ground.receiveShadow = true;
scene.add(ground);

// ── Materials ──────────────────────────────────────────
const matSlide = new THREE.MeshStandardMaterial({
  color: 0x2a2a2e, roughness: 0.35, metalness: 0.85, flatShading: true
});
const matBarrel = new THREE.MeshStandardMaterial({
  color: 0xd0d8e0, roughness: 0.2, metalness: 0.95, flatShading: true
});
const matFrame = new THREE.MeshStandardMaterial({
  color: 0x4a3828, roughness: 0.75, metalness: 0.1, flatShading: true
});
const matCompensator = new THREE.MeshStandardMaterial({
  color: 0x3a3a3a, roughness: 0.3, metalness: 0.7, flatShading: true
});
const matMag = new THREE.MeshStandardMaterial({
  color: 0x3a3a3a, roughness: 0.4, metalness: 0.5, flatShading: true
});
const matMagBase = new THREE.MeshStandardMaterial({
  color: 0x2a2a2a, roughness: 0.5, metalness: 0.6, flatShading: true
});
const matFiberFront = new THREE.MeshStandardMaterial({
  color: 0x00ff66, roughness: 0.1, metalness: 0.0, emissive: 0x003300, emissiveIntensity: 0.6, flatShading: true
});
const matFiberRear = new THREE.MeshStandardMaterial({
  color: 0xff2200, roughness: 0.1, metalness: 0.0, emissive: 0x330000, emissiveIntensity: 0.6, flatShading: true
});
const matTrigger = new THREE.MeshStandardMaterial({
  color: 0x1a1a1a, roughness: 0.4, metalness: 0.7, flatShading: true
});
const matHammer = new THREE.MeshStandardMaterial({
  color: 0x333333, roughness: 0.3, metalness: 0.75, flatShading: true
});
const matRecoilSpring = new THREE.MeshStandardMaterial({
  color: 0x8899aa, roughness: 0.2, metalness: 0.8, flatShading: true
});

// ── Helper: box with flat shading ──────────────────────
function box(w, h, d, mat) {
  const g = new THREE.BoxGeometry(w, h, d);
  return new THREE.Mesh(g, mat);
}

function cylinder(rTop, rBot, h, seg, mat) {
  const g = new THREE.CylinderGeometry(rTop, rBot, h, seg, 1, false);
  return new THREE.Mesh(g, mat);
}

// ── USP Match Group ────────────────────────────────────
const usp = new THREE.Group();
scene.add(usp);

// ── Slide (dark metal, locked back position) ───────────
const slide = new THREE.Group();
// Slide body - low poly block
const slideBody = box(1.15, 0.55, 0.35, matSlide);
slideBody.position.set(0, 0.05, 0);
slide.add(slideBody);
// Slide serrations (front & back ridges)
const serration = box(0.08, 0.55, 0.35, matSlide);
serration.position.set(-0.53, 0.05, 0);
slide.add(serration);
const serration2 = serration.clone();
serration2.position.set(0.53, 0.05, 0);
slide.add(serration2);
// Slide top rail
const rail = box(0.9, 0.06, 0.32, matSlide);
rail.position.set(0, 0.34, 0);
slide.add(rail);
// Rear sight housing
const rearSight = box(0.18, 0.12, 0.32, new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.3, metalness: 0.8, flatShading: true }));
rearSight.position.set(0.42, 0.34, 0);
slide.add(rearSight);
// Fiber rear sight (red dot)
const fiberRear = box(0.04, 0.04, 0.04, matFiberRear);
fiberRear.position.set(0.42, 0.40, 0);
slide.add(fiberRear);

usp.add(slide);

// ── Barrel (bright silver, exposed) ────────────────────
const barrel = new THREE.Group();
// Barrel cylinder
const barrelCyl = cylinder(0.06, 0.06, 0.9, 6, matBarrel);
barrelCyl.rotation.z = Math.PI / 2;
barrelCyl.position.set(-0.15, 0.05, 0);
barrel.add(barrelCyl);
// Barrel hood / front sight base
const barrelHood = box(0.12, 0.12, 0.32, matBarrel);
barrelHood.position.set(0.05, 0.12, 0);
barrel.add(barrelHood);
// Fiber front sight (green)
const fiberFront = box(0.05, 0.05, 0.05, matFiberFront);
fiberFront.position.set(0.05, 0.18, 0);
barrel.add(fiberFront);

usp.add(barrel);

// ── Lower frame (polymer) ──────────────────────────────
const frame = new THREE.Group();
// Frame body
const frameBody = box(0.95, 0.5, 0.32, matFrame);
frameBody.position.set(0, -0.05, 0);
frame.add(frameBody);
// Grip (lower portion)
const grip = box(0.45, 0.7, 0.32, matFrame);
grip.position.set(-0.05, -0.55, 0);
frame.add(grip);
// Trigger guard
const triggerGuard = box(0.22, 0.12, 0.32, matFrame);
triggerGuard.position.set(0.25, -0.15, 0);
frame.add(triggerGuard);
// Trigger
const trigger = box(0.06, 0.12, 0.08, matTrigger);
trigger.position.set(0.32, -0.22, 0);
frame.add(trigger);
// Hammer
const hammer = new THREE.Group();
const hammerBody = box(0.12, 0.18, 0.28, matHammer);
hammerBody.position.set(0.15, 0.22, 0);
hammer.add(hammerBody);
// Hammer spur
const hammerSpur = box(0.06, 0.08, 0.28, matHammer);
hammerSpur.position.set(0.22, 0.30, 0);
hammer.add(hammerSpur);
frame.add(hammer);
// Magazine release button
const magRelease = box(0.06, 0.06, 0.22, matTrigger);
magRelease.position.set(0.12, -0.55, 0);
frame.add(magRelease);

usp.add(frame);

// ── Compensator / Match weight (front) ─────────────────
const comp = new THREE.Group();
// Compensator body
const compBody = box(0.22, 0.32, 0.32, matCompensator);
compBody.position.set(-0.65, -0.05, 0);
comp.add(compBody);
// Top vent holes (low poly slots)
const vent1 = box(0.22, 0.04, 0.08, matCompensator);
vent1.position.set(-0.65, 0.14, 0);
comp.add(vent1);
const vent2 = vent1.clone();
vent2.position.set(-0.65, 0.14, -0.12);
comp.add(vent2);
// Side vents
const sideVent = box(0.04, 0.22, 0.28, matCompensator);
sideVent.position.set(-0.76, -0.05, 0);
comp.add(sideVent);

usp.add(comp);

// ── Magazine ───────────────────────────────────────────
const magazine = new THREE.Group();
// Mag body
const magBody = box(0.22, 0.55, 0.28, matMag);
magBody.position.set(0.05, -0.85, 0);
magazine.add(magBody);
// Mag base plate
const magBase = box(0.22, 0.06, 0.28, matMagBase);
magBase.position.set(0.05, -1.14, 0);
magazine.add(magBase);
// Mag floor plate (slightly wider)
const magFloor = box(0.24, 0.04, 0.30, matMagBase);
magFloor.position.set(0.05, -1.17, 0);
magazine.add(magFloor);
// Mag catch notch
const magCatch = box(0.04, 0.08, 0.26, matMag);
magCatch.position.set(0.16, -0.65, 0);
magazine.add(magCatch);

usp.add(magazine);

// ── Recoil spring guide (visible in slide) ─────────────
const recoilSpring = cylinder(0.02, 0.02, 0.35, 6, matRecoilSpring);
recoilSpring.rotation.z = Math.PI / 2;
recoilSpring.position.set(0.25, 0.05, 0);
slide.add(recoilSpring);

// ── Animation state ────────────────────────────────────
const animState = {
  t: 0,
  phase: 'assemble', // 'assemble' | 'explode' | 'cycle'
  cycleProgress: 0
};

// Base positions (assembled state)
const basePositions = {
  slide: { x: 0, y: 0.05, z: 0 },
  barrel: { x: -0.15, y: 0.05, z: 0 },
  frame: { x: 0, y: -0.05, z: 0 },
  comp: { x: -0.65, y: -0.05, z: 0 },
  magazine: { x: 0.05, y: -0.85, z: 0 }
};

// Exploded view offsets
const explodeOffsets = {
  slide: { x: 0, y: 0.8, z: 0.3 },
  barrel: { x: -0.15, y: 0.35, z: -0.3 },
  frame: { x: 0, y: -0.35, z: 0 },
  comp: { x: -0.65, y: -0.35, z: 0.3 },
  magazine: { x: 0.05, y: -1.6, z: 0.4 }
};

// Slide recoil positions (during cycle)
const slideRecoilBack = { x: 0.35, y: 0.05, z: 0 };
const slideRecoilForward = { x: 0, y: 0.05, z: 0 };

// Magazine insert positions
const magazineIn = { x: 0.05, y: -0.85, z: 0 };
const magazineOut = { x: 0.05, y: -1.6, z: 0.4 };

// ── Animation loop ─────────────────────────────────────
const clock = new THREE.Clock();

function lerp(a, b, t) { return a + (b - a) * t; }
function smoothStep(t) { return t * t * (3 - 2 * t); }
function easeInOut(t) { return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.1);
  animState.t += dt;

  // 8-second cycle: 0-2s magazine in, 2-4s slide recoil, 4-6s explode, 6-8s reassemble
  const cycleT = (animState.t % 8) / 8;

  let magT, slideT, compT;

  if (cycleT < 0.25) {
    // Phase 1: Magazine slides up into grip (0-2s)
    const p = smoothStep(cycleT / 0.25);
    magT = p;
    slideT = 0;
    compT = 0;
  } else if (cycleT < 0.5) {
    // Phase 2: Slide pulls back and resets (2-4s)
    const p = (cycleT - 0.25) / 0.25;
    magT = 1;
    // Slide goes back then forward
    if (p < 0.5) {
      slideT = smoothStep(p * 2);
    } else {
      slideT = 1 - smoothStep((p - 0.5) * 2);
    }
    compT = 0;
  } else if (cycleT < 0.75) {
    // Phase 3: Explode view (4-6s)
    const p = smoothStep((cycleT - 0.5) / 0.25);
    magT = 1;
    slideT = 0;
    compT = p;
  } else {
    // Phase 4: Reassemble (6-8s)
    const p = smoothStep((cycleT - 0.75) / 0.25);
    magT = 1 - p;
    slideT = 0;
    compT = 1 - p;
  }

  // Apply magazine position
  const magX = lerp(magazineOut.x, magazineIn.x, magT);
  const magY = lerp(magazineOut.y, magazineIn.y, magT);
  const magZ = lerp(magazineOut.z, magazineIn.z, magT);
  magazine.position.set(magX, magY, magZ);

  // Apply slide position (recoil)
  const slideX = lerp(slideRecoilForward.x, slideRecoilBack.x, slideT);
  slide.position.set(slideX, basePositions.slide.y, basePositions.slide.z);

  // Apply compensator explode
  const compX = lerp(basePositions.comp.x, explodeOffsets.comp.x, compT);
  const compY = lerp(basePositions.comp.y, explodeOffsets.comp.y, compT);
  const compZ = lerp(basePositions.comp.z, explodeOffsets.comp.z, compT);
  comp.position.set(compX, compY, compZ);

  // Apply barrel explode
  const barrelX = lerp(basePositions.barrel.x, explodeOffsets.barrel.x, compT);
  const barrelY = lerp(basePositions.barrel.y, explodeOffsets.barrel.y, compT);
  const barrelZ = lerp(basePositions.barrel.z, explodeOffsets.barrel.z, compT);
  barrel.position.set(barrelX, barrelY, barrelZ);

  // Apply slide explode
  const slideExpX = lerp(slide.position.x, explodeOffsets.slide.x, compT);
  const slideExpY = lerp(slide.position.y, explodeOffsets.slide.y, compT);
  const slideExpZ = lerp(slide.position.z, explodeOffsets.slide.z, compT);
  slide.position.set(slideExpX, slideExpY, slideExpZ);

  // Apply frame explode
  const frameX = lerp(basePositions.frame.x, explodeOffsets.frame.x, compT);
  const frameY = lerp(basePositions.frame.y, explodeOffsets.frame.y, compT);
  const frameZ = lerp(basePositions.frame.z, explodeOffsets.frame.z, compT);
  frame.position.set(frameX, frameY, frameZ);

  // Subtle idle bob
  const bob = Math.sin(animState.t * 3) * 0.02;
  usp.position.y = bob;

  renderer.render(scene, camera);
}

// ── Resize ─────────────────────────────────────────────
window.addEventListener('resize', () => {
  const aspect = window.innerWidth / window.innerHeight;
  const frustumSize = 6;
  camera.left = -frustumSize * aspect / 2;
  camera.right = frustumSize * aspect / 2;
  camera.top = frustumSize / 2;
  camera.bottom = -frustumSize / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── Start ──────────────────────────────────────────────
animate();

console.log('USP Match · Low-Poly / PS1 · Ready');
console.log('Cycle: magazine-in → slide-recoil → explode → reassemble (8s loop)');
</script>
</body>
</html>
