<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>USP Match · 低多边形机械分解 / LOW-POLY FIELD STRIP</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#101214;
    font-family:"Courier New",ui-monospace,Consolas,monospace;}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;
    image-rendering:pixelated;image-rendering:crisp-edges;}
  #gl:active{cursor:grabbing;}
  /* CRT 扫描线（PS1 滤镜开启时显示） */
  #scan{position:fixed;inset:0;pointer-events:none;display:none;z-index:6;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);
    mix-blend-mode:multiply;opacity:.55;}
  body.ps1 #scan{display:block;}
  /* AR 模式影棚暗角 */
  body.mode-ar::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at center,transparent 62%,rgba(255,255,255,.28));}
  /* CAD 风格标签引线层 */
  #hud{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:7;}
  #hud line{stroke-width:1;}
  body.mode-usp #hud line{stroke:#2f3a43;}
  body.mode-usp #hud circle{fill:#222a31;}
  body.mode-ar #hud line{stroke:#0f6ea8;}
  body.mode-ar #hud circle{fill:#0f6ea8;}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:8;}
  .lbl{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;
    background:rgba(8,10,12,.8);border:1px solid #55606a;color:#dfe7ec;
    font-size:10px;line-height:1.6;padding:0 5px;letter-spacing:.5px;opacity:0;display:none;}
  body.mode-ar .lbl{border-color:#2e6b82;color:#c9ecfa;}
  /* 四角 CAD 括号 */
  .corner{position:fixed;width:26px;height:26px;pointer-events:none;z-index:9;
    border:0 solid #6a7680;}
  body.mode-ar .corner{border-color:#0f6ea8;}
  .tl{top:10px;left:10px;border-top-width:2px;border-left-width:2px;}
  .tr{top:10px;right:10px;border-top-width:2px;border-right-width:2px;}
  .bl{bottom:10px;left:10px;border-bottom-width:2px;border-left-width:2px;}
  .br{bottom:10px;right:10px;border-bottom-width:2px;border-right-width:2px;}
  /* 左上信息面板 */
  #panel{position:fixed;top:20px;left:22px;z-index:10;pointer-events:none;color:#1d2429;
    background:rgba(214,217,220,.72);border:1px solid #8b9299;padding:8px 12px;max-width:520px;}
  body.mode-ar #panel{color:#d7e6ef;background:rgba(10,13,16,.72);border-color:#2e4a58;}
  #title{font-size:14px;font-weight:bold;letter-spacing:1.5px;}
  #subtitle{font-size:9px;letter-spacing:1px;opacity:.75;margin-top:2px;}
  #phase{font-size:12px;letter-spacing:1px;margin-top:8px;color:#a8321f;font-weight:bold;}
  body.mode-ar #phase{color:#4ec7f1;}
  #tcode{font-size:10px;margin-top:3px;opacity:.8;}
  #pbar{width:300px;height:5px;border:1px solid #6a7680;margin-top:6px;}
  #pfill{height:100%;width:0;background:#a8321f;}
  body.mode-ar #pbar{border-color:#2e4a58;}
  body.mode-ar #pfill{background:#4ec7f1;}
  /* 右上控制面板 */
  #ctrl{position:fixed;top:20px;right:22px;z-index:10;text-align:right;}
  #ctrl .row{margin-bottom:6px;}
  #ctrl button{pointer-events:auto;background:rgba(10,13,16,.85);border:1px solid #3b444c;
    color:#cfd6da;font:bold 11px/1.2 "Courier New",monospace;letter-spacing:1px;
    padding:6px 10px;margin-left:6px;cursor:pointer;}
  #ctrl button:hover{border-color:#8fa2b0;}
  #ctrl button.on{border-color:#a8321f;color:#ff7a5c;}
  body.mode-ar #ctrl button.on{border-color:#4ec7f1;color:#4ec7f1;}
  /* 底部提示与 FPS */
  #hint{position:fixed;bottom:16px;left:22px;z-index:10;pointer-events:none;
    font-size:10px;letter-spacing:1px;color:#3a434b;}
  body.mode-ar #hint{color:#5f7d8d;}
  #fps{position:fixed;bottom:16px;right:22px;z-index:10;pointer-events:none;
    font-size:10px;letter-spacing:1px;color:#3a434b;}
  body.mode-ar #fps{color:#5f7d8d;}
  /* 载入 / 错误提示 */
  #load{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:#14171a;color:#9fb3c0;font-size:13px;letter-spacing:3px;}
  #err[hidden]{display:none;}
  #err{position:fixed;inset:0;z-index:21;display:flex;align-items:center;justify-content:center;
    background:#14171a;color:#ff7a5c;font-size:13px;letter-spacing:2px;text-align:center;
    padding:0 30px;}
</style>
</head>
<body class="mode-usp ps1">
<canvas id="gl"></canvas>
<div id="scan"></div>
<svg id="hud" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="labels"></div>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>

<div id="panel">
  <div id="title">USP MATCH · FIELD STRIP</div>
  <div id="subtitle">PROCEDURAL LOW-POLY / PS1 AESTHETIC · FLAT SHADED · VERTEX-SNAPPED</div>
  <div id="phase">--</div>
  <div id="tcode">T+0.0s</div>
  <div id="pbar"><div id="pfill"></div></div>
</div>

<div id="ctrl">
  <div class="row">
    <button id="b-usp" class="on">USP MATCH</button>
    <button id="b-ar">AR-15</button>
  </div>
  <div class="row">
    <button id="b-play">暂停</button>
    <button id="b-speed">速度 ×1</button>
    <button id="b-ps1" class="on">PS1 滤镜 ON</button>
  </div>
</div>

<div id="hint">拖拽 旋转 · 滚轮 缩放 · 空格 暂停 · 1/2 切换武器 · P 像素滤镜</div>
<div id="fps">-- FPS</div>
<div id="load">正在载入 THREE.JS (CDN) ...</div>
<div id="err" hidden></div>

<script>
/* ---- Three.js CDN 加载（多源回退） ---- */
(function () {
  var SRCS = [
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
    'https://unpkg.com/three@0.128.0/build/three.min.js'
  ];
  var i = 0;
  function done() {
    document.getElementById('load').style.display = 'none';
    if (window.THREE && window.main) { try { window.main(); } catch (e) { showErr(e); } }
    else { fail(); }
  }
  function fail() {
    document.getElementById('load').style.display = 'none';
    var el = document.getElementById('err');
    el.hidden = false;
    el.textContent = '无法从 CDN 载入 Three.js，请检查网络连接后刷新重试。';
  }
  function showErr(e) {
    var el = document.getElementById('err');
    el.hidden = false;
    el.textContent = '初始化失败: ' + (e && e.message ? e.message : e);
  }
  function tryNext() {
    if (window.THREE) { done(); return; }
    if (i >= SRCS.length) { fail(); return; }
    var s = document.createElement('script');
    s.src = SRCS[i++];
    s.onload = tryNext;
    s.onerror = tryNext;
    document.head.appendChild(s);
  }
  tryNext();
})();
</script>

<script>
/* ============================================================
   USP Match 低多边形机械分解 + AR-15 高阶机械演示
   全部几何程序化生成 · 平直着色 · 顶点捕捉 · 像素纹理
   ============================================================ */
window.main = function () {

  /* ---------- 通用工具 ---------- */
  var _seed = 90210;
  function rnd() { _seed = (_seed * 1664525 + 1013904223) >>> 0; return _seed / 4294967296; }

  var EASE = {
    smooth: function (u) { return u * u * u * (u * (u * 6 - 15) + 10); },
    in:     function (u) { return u * u * u; },
    out:    function (u) { return 1 - Math.pow(1 - u, 3); },
    lin:    function (u) { return u; },
    inout:  function (u) { return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; }
  };

  /* 关键帧采样：key = [t, x, y, z, ease?] 或 [t, v, ease?] */
  function sample(keys, t) {
    var n = keys.length;
    if (t <= keys[0][0]) return keys[0];
    if (t >= keys[n - 1][0]) return keys[n - 1];
    for (var i = 1; i < n; i++) {
      if (t < keys[i][0]) {
        var a = keys[i - 1], b = keys[i];
        var hasEase = (typeof b[b.length - 1] === 'string');
        var dim = hasEase ? b.length - 1 : b.length;
        var e = hasEase ? EASE[b[b.length - 1]] : EASE.smooth;
        var u = e((t - a[0]) / (b[0] - a[0]));
        var out = new Array(dim);
        out[0] = t;
        for (var j = 1; j < dim; j++) out[j] = a[j] + (b[j] - a[j]) * u;
        return out;
      }
    }
    return keys[n - 1];
  }

  function applyItems(items, t) {
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var v = sample(it.keys, t);
      if (it.prop === 'pos') {
        it.obj.position.set(it.h[0] + v[1], it.h[1] + v[2], it.h[2] + v[3]);
      } else if (it.prop === 'rotz') {
        it.obj.rotation.z = it.h + v[1];
      } else if (it.prop === 'rotx') {
        it.obj.rotation.x = it.h + v[1];
      }
    }
  }

  /* ---------- 渲染器与 PS1 管线 ---------- */
  var canvas = document.getElementById('gl');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false });
  renderer.setPixelRatio(1);

  var SNAP = { value: new THREE.Vector2(240, 135) };

  /* 平直着色 + 顶点捕捉（PS1 抖动质感） */
  function retro(m) {
    m.flatShading = true;
    m.onBeforeCompile = function (sh) {
      sh.uniforms.uSnap = SNAP;
      sh.vertexShader = 'uniform vec2 uSnap;\n' + sh.vertexShader.replace(
        'gl_Position = projectionMatrix * mvPosition;',
        ['gl_Position = projectionMatrix * mvPosition;',
         'gl_Position.xyz /= gl_Position.w;',
         'gl_Position.xy = floor(gl_Position.xy * uSnap + 0.5) / uSnap;',
         'gl_Position.xyz *= gl_Position.w;'].join('\n'));
    };
    return m;
  }
  function std(opt) { return retro(new THREE.MeshStandardMaterial(opt)); }
  function bas(opt) { return retro(new THREE.MeshBasicMaterial(opt)); }

  /* ---------- 程序化像素纹理（90 年代质感） ---------- */
  function pixTex(paint) {
    var s = 64, c = document.createElement('canvas');
    c.width = c.height = s;
    var g = c.getContext('2d');
    paint(g, s);
    var t = new THREE.CanvasTexture(c);
    t.magFilter = THREE.NearestFilter;
    t.minFilter = THREE.NearestFilter;
    t.generateMipmaps = false;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
  }
  function speck(g, s, base, n, d, l) {
    g.fillStyle = base; g.fillRect(0, 0, s, s);
    for (var i = 0; i < n; i++) {
      g.fillStyle = rnd() < 0.55 ? d : l;
      g.globalAlpha = 0.15 + rnd() * 0.4;
      g.fillRect((rnd() * s) | 0, (rnd() * s) | 0, 1 + ((rnd() * 2) | 0), 1 + ((rnd() * 2) | 0));
    }
    g.globalAlpha = 1;
  }
  function brush(g, s, base, d, l) {
    g.fillStyle = base; g.fillRect(0, 0, s, s);
    for (var x = 0; x < s; x++) {
      var v = rnd();
      if (v < 0.28) { g.fillStyle = d; g.globalAlpha = rnd() * 0.3; g.fillRect(x, 0, 1, s); }
      else if (v > 0.86) { g.fillStyle = l; g.globalAlpha = rnd() * 0.35; g.fillRect(x, 0, 1, s); }
    }
    g.globalAlpha = 1;
  }
  function stipple(g, s) {
    g.fillStyle = '#191c20'; g.fillRect(0, 0, s, s);
    for (var y = 2; y < s; y += 4) {
      for (var x = 2; x < s; x += 4) {
        g.fillStyle = ((x + y) % 8 < 4) ? '#2c3138' : '#21252b';
        if (rnd() < 0.85) g.fillRect(x, y, 2, 2);
      }
    }
  }
  function coilTex(g, s) {
    g.fillStyle = '#262b32'; g.fillRect(0, 0, s, s);
    g.strokeStyle = '#525c68'; g.lineWidth = 5;
    for (var i = -s; i < s * 2; i += 8) {
      g.beginPath(); g.moveTo(i, 0); g.lineTo(i + s, s); g.stroke();
    }
  }

  var texSlide = pixTex(function (g, s) { speck(g, s, '#242830', 430, '#14161a', '#3b4452'); });
  var texPoly  = pixTex(function (g, s) { speck(g, s, '#202327', 260, '#15171a', '#2c3138'); });
  var texStip  = pixTex(stipple);
  var texSilver= pixTex(function (g, s) { brush(g, s, '#c9ced6', '#8d939c', '#eceff3'); });
  var texRec   = pixTex(function (g, s) { speck(g, s, '#181a1e', 380, '#0e1013', '#262a30'); });
  var texCoil  = pixTex(coilTex);

  /* ---------- 共享材质 ---------- */
  var matSlide   = std({ map: texSlide, roughness: 0.55, metalness: 0.72 });            // 套筒 深色金属
  var matSlideD  = std({ color: 0x15171b, roughness: 0.5, metalness: 0.75 });
  var matPoly    = std({ map: texPoly, roughness: 0.9, metalness: 0.08 });              // 聚合物下机匣
  var matGripP   = std({ map: texStip, roughness: 0.95, metalness: 0.05 });             // 握把防滑板
  var matSilver  = std({ map: texSilver, roughness: 0.28, metalness: 0.95 });           // 亮银枪管
  var matSilverD = std({ color: 0x9aa2ab, roughness: 0.35, metalness: 0.9 });
  var matComp    = std({ map: texSlide, color: 0x8f9bad, roughness: 0.5, metalness: 0.8 }); // Match 配重
  var matCompD   = std({ color: 0x191c22, roughness: 0.55, metalness: 0.7 });
  var matSteel   = std({ color: 0x43484f, roughness: 0.45, metalness: 0.85 });
  var matMag     = std({ map: texSlide, color: 0xb0b6bf, roughness: 0.6, metalness: 0.7 });
  var matMagD    = std({ color: 0x1b1e23, roughness: 0.6, metalness: 0.6 });
  var matBrass   = std({ color: 0xc9963a, roughness: 0.35, metalness: 0.85 });
  var matBrassD  = std({ color: 0x9c6a22, roughness: 0.4, metalness: 0.8 });
  var matAlloyD  = std({ color: 0x121418, roughness: 0.6, metalness: 0.6 });
  var matFiberG  = bas({ color: 0x2bff74 });                                            // 前准星 光纤绿
  var matFiberR  = bas({ color: 0xff2740 });                                            // 后准星 光纤红

  var matRec     = std({ map: texRec, roughness: 0.85, metalness: 0.35 });              // AR 阳极氧化铝
  var matRecD    = std({ color: 0x101216, roughness: 0.85, metalness: 0.35 });
  var matSteelD  = std({ color: 0x262b31, roughness: 0.5, metalness: 0.85 });           // AR 深色钢
  var matPolyAr  = std({ map: texPoly, roughness: 0.92, metalness: 0.1 });
  var matSilver2 = std({ color: 0xb9c0c7, roughness: 0.3, metalness: 0.95 });
  var matSpring  = std({ map: texCoil, roughness: 0.5, metalness: 0.8 });

  /* ---------- 几何辅助 ---------- */
  function bx(m, w, h, d, x, y, z, rz, rx, ry) {
    var o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
    o.position.set(x, y, z);
    if (rz) o.rotation.z = rz; if (rx) o.rotation.x = rx; if (ry) o.rotation.y = ry;
    return o;
  }
  function cyl(m, rt, rb, l, seg, ax, x, y, z, rz) {
    var o = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, l, seg), m);
    if (ax === 'x') o.rotation.z = Math.PI / 2;
    else if (ax === 'z') o.rotation.x = Math.PI / 2;
    if (rz) o.rotation.z = rz;
    o.position.set(x, y, z);
    return o;
  }

  /* ============================================================
     USP MATCH（枪口朝 +X，侧视相机位于 +Z）
     ============================================================ */
  function buildUSP() {
    var S = new THREE.Scene();
    S.background = new THREE.Color(0xd3d5d7);                       // 浅灰 / 中性灰背景
    S.add(new THREE.HemisphereLight(0xffffff, 0x9a9da0, 0.95));
    var key = new THREE.DirectionalLight(0xffffff, 0.8); key.position.set(18, 28, 22); S.add(key);
    var fil = new THREE.DirectionalLight(0xdfe6ee, 0.28); fil.position.set(-16, 8, -20); S.add(fil);
    var rim = new THREE.DirectionalLight(0xffffff, 0.15); rim.position.set(-6, -14, 10); S.add(rim);

    var root = new THREE.Group(); root.position.set(-2.5, 3, 0); S.add(root);

    /* ---- 聚合物下机匣（静态） ---- */
    var frame = new THREE.Group(); root.add(frame);
    frame.add(bx(matPoly, 9, 1.6, 2.8, 5.5, 1.4, 0));               // 防尘盖/导轨座
    frame.add(bx(matPoly, 4, 1.7, 2.8, -1, 1.35, 0));               // 扳机护圈上方块
    frame.add(bx(matPoly, 0.7, 0.4, 2.3, 6.4, 0.35, 0));            // 附件导轨齿
    frame.add(bx(matPoly, 0.7, 0.4, 2.3, 7.9, 0.35, 0));
    frame.add(bx(matPoly, 0.7, 0.4, 2.3, 9.3, 0.35, 0));
    frame.add(bx(matPoly, 0.9, 3.4, 1.8, -0.95, -1.1, 0));          // 护圈前梁
    frame.add(bx(matPoly, 5.6, 0.8, 1.8, -3.3, -2.7, 0));           // 护圈底梁
    frame.add(bx(matPoly, 1.6, 0.9, 2.3, -6.4, 0.75, 0));           // 尾部挡板
    frame.add(bx(matSteel, 0.7, 1.9, 0.7, -2.9, -1.5, 0, 0.12));    // 扳机
    frame.add(bx(matSteel, 2.6, 0.5, 0.3, -2.6, 2.35, -1.5));       // 空仓挂机杆
    frame.add(bx(matSteel, 1.2, 0.6, 0.3, -4.6, 1.5, -1.45));       // 待击解脱杆
    frame.add(cyl(matSteel, 0.55, 0.55, 0.5, 8, 'z', -4.2, 0.7, -1.45)); // 弹匣卡笋
    frame.add(bx(matSteel, 0.9, 1.0, 1.2, -6.8, 2.3, 0, 0.5));      // 击锤
    frame.add(cyl(matSilver, 0.28, 0.28, 7, 6, 'x', 3.0, 2.45, 0)); // 复进簧杆
    frame.add(cyl(matSteel, 0.5, 0.5, 0.6, 6, 'x', 6.8, 2.45, 0));  // 导杆头

    var grip = new THREE.Group();
    grip.position.set(-5.0, -4.6, 0); grip.rotation.z = -0.26;
    frame.add(grip);
    grip.add(bx(matPoly, 3.5, 9.6, 2.4, 0, 0, 0));                  // 握把主体
    grip.add(bx(matPoly, 0.8, 9.4, 2.2, -1.8, -0.2, 0));            // 背板
    grip.add(bx(matGripP, 2.5, 6.8, 0.34, -0.1, 0, 1.36));          // 防滑面板
    grip.add(bx(matGripP, 2.5, 6.8, 0.34, -0.1, 0, -1.36));

    /* ---- 深色金属套筒（可后锁 / 分离） ---- */
    var slide = new THREE.Group(); root.add(slide);
    slide.add(bx(matSlide, 17, 3.4, 2.9, 1.5, 3.7, 0));             // 套筒主体
    slide.add(bx(matSlide, 15.5, 0.4, 2.3, 1.2, 5.5, 0));           // 顶带
    slide.add(bx(matSlideD, 1.1, 1.1, 2.85, 9.65, 5.0, 0, -0.785)); // 前上倒角
    slide.add(bx(matSlideD, 1.1, 1.1, 2.85, 9.65, 2.4, 0, 0.785));  // 前下倒角
    slide.add(bx(matSlideD, 0.5, 3.1, 2.6, -7.15, 3.7, 0));         // 尾板
    for (var k = 0; k < 8; k++)                                     // 后部防滑齿
      slide.add(bx(matSlideD, 0.34, 2.7, 3.05, -6.2 + k * 0.62, 3.7, 0));
    slide.add(bx(matSlideD, 3.2, 1.1, 0.35, 0.3, 4.55, 1.42));      // 抛壳窗盖板
    slide.add(bx(matSlideD, 0.5, 0.75, 0.95, 9.3, 5.78, 0));        // 前准星座
    slide.add(bx(matFiberG, 0.55, 0.34, 1.0, 9.3, 5.98, 0));        // 前光纤 准星●绿
    slide.add(bx(matSlideD, 1.7, 0.75, 1.7, -6.3, 5.78, 0));        // 后准星座
    slide.add(bx(matFiberR, 0.4, 0.34, 0.4, -6.62, 5.98, 0.5));     // 后光纤●红
    slide.add(bx(matFiberR, 0.4, 0.34, 0.4, -6.62, 5.98, -0.5));

    /* ---- 亮银色枪管 ---- */
    var barrel = new THREE.Group(); root.add(barrel);
    barrel.add(cyl(matSilver, 0.95, 0.95, 11, 8, 'x', 6.5, 3.7, 0));   // 枪管
    barrel.add(cyl(matSilverD, 1.08, 1.08, 0.8, 8, 'x', 11.7, 3.7, 0));// 枪口环

      { p: bcg,    a: [-2, 7.4, 0],  n: '枪机框 BCG · 深色钢', w: W1 },
      { p: ch,     a: [-1, 1.6, 0],  n: '拉机柄 CHARGING HANDLE', w: W1 },
      { p: spring, a: [-14, 3.2, 0], n: '复进簧 / 缓冲管 RECOIL SPRING · BUFFER', w: W1 },
      { p: hammer, a: [-1, 1.9, 0],  n: '击锤 HAMMER', w: W1 },
      { p: lower,  a: [-2.2, -2.6, 0], n: '扳机 TRIGGER', w: W1 },
      { p: lower,  a: [-1.9, 0.9, 0], n: '阻铁 SEAR', w: W1 },
      { p: lower,  a: [-0.2, -0.6, 2.6], n: '弹匣释放 MAG RELEASE', w: W1 },
      { p: lower,  a: [-3.7, 1.35, 2.6], n: '保险 SELECTOR', w: W1 },
      { p: upper,  a: [23.5, 10.2, 0], n: '导气系统 GAS SYSTEM', w: W1 },
      { p: upper,  a: [-8.9, 6.6, 1.6], n: '抛壳挺 EJECTOR', w: W1 },
      { p: lower,  a: [5.5, -2.6, 0], n: '前枢轴 FRONT PIVOT', w: W1 },
      { p: pin,    a: [0, 1.4, 0],  n: '后分解销 REAR TAKEDOWN PIN', w: [[3.6, 4.0], [12.6, 14.2]] },
      { p: lower,  a: [-24, 7.2, 0], n: '缓冲管 / 枪托 BUFFER TUBE · STOCK', w: W1 },
      { p: bolt,   a: [2.4, 2.2, 0], n: '枪机头·闭锁凸笋 BOLT LUGS', w: [[10.2, 12.8]] },
      { p: upper,  a: [-4, 10.4, 0], n: '上机匣组 UPPER', w: W2 },
      { p: lower,  a: [1.8, -7.0, 0], n: '下机匣 + 弹匣井 MAGWELL', w: W2 },
      { p: upper,  a: [16, 7.4, 0],  n: '枪管 BARREL', w: W2 }
    ];

    return { scene: S, root: root, items: items, phases: phases, extra: extra,
             labels: labels, T: 24, title: 'AR-15 · MECHANICAL DEMO',
             sub: 'TECHNICAL CUTAWAY · SLOW-MOTION FIELD STRIP · MATTE BLACK ANODIZED' };
  }

  /* ---------- 相机（USP 正交 / AR 近正交透视） ---------- */
  var camU = new THREE.OrthographicCamera(-16, 16, 26, -26, 0.1, 500);
  var camA = new THREE.PerspectiveCamera(30, 1, 0.5, 900);
  var orbits = {
    usp: { cam: camU, th: 0.45, ph: 1.30, dist: 120, zoom: 1, tgt: new THREE.Vector3(0, 0, 0) },
    ar:  { cam: camA, th: 0.50, ph: 1.22, dist: 150, zoom: 1, tgt: new THREE.Vector3(2, 1, 0) }
  };
  function updateCam() {
    var o = orbits[cur];
    var cp = Math.cos(o.ph), sp = Math.sin(o.ph);
    o.cam.position.set(
      o.tgt.x + o.dist * sp * Math.sin(o.th),
      o.tgt.y + o.dist * cp,
      o.tgt.z + o.dist * sp * Math.cos(o.th));
    o.cam.lookAt(o.tgt);
    if (o.cam === camU) { camU.zoom = o.zoom; camU.updateProjectionMatrix(); }
  }

  /* ---------- 交互：拖拽旋转 / 滚轮缩放 ---------- */
  var drag = null;
  canvas.addEventListener('pointerdown', function (e) {
    drag = { x: e.clientX, y: e.clientY, id: e.pointerId };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var o = orbits[cur];
    o.th -= (e.clientX - drag.x) * 0.006;
    o.ph -= (e.clientY - drag.y) * 0.006;
    if (o.ph < 0.25) o.ph = 0.25;
    if (o.ph > 1.5) o.ph = 1.5;
    drag.x = e.clientX; drag.y = e.clientY;
  });
  function endDrag() { drag = null; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    var o = orbits[cur];
    var f = e.deltaY > 0 ? 0.9 : 1.11;
    if (o.cam === camU) {
      o.zoom *= f; if (o.zoom < 0.3) o.zoom = 0.3; if (o.zoom > 4) o.zoom = 4;
    } else {
      o.dist *= f; if (o.dist < 60) o.dist = 60; if (o.dist > 320) o.dist = 320;
    }
  }, { passive: false });

  /* ---------- CAD 标签层 ---------- */
  var svg = document.getElementById('hud');
  var lblLayer = document.getElementById('labels');
  var SVGNS = 'http://www.w3.org/2000/svg';

  function makeLabels(defs) {
    var arr = [];
    for (var i = 0; i < defs.length; i++) {
      var d = defs[i];
      var o = new THREE.Object3D();
      o.position.set(d.a[0], d.a[1], d.a[2]);
      d.p.add(o);
      var el = document.createElement('div');
      el.className = 'lbl';
      el.textContent = d.n;
      lblLayer.appendChild(el);
      var ln = document.createElementNS(SVGNS, 'line');
      var ci = document.createElementNS(SVGNS, 'circle');
      ci.setAttribute('r', '2.5');
      svg.appendChild(ln); svg.appendChild(ci);
      arr.push({ o: o, el: el, ln: ln, ci: ci, w: d.w, op: 0 });
    }
    return arr;
  }

  var vTmp = new THREE.Vector3();
  function inWindow(w, tm) {
    for (var i = 0; i < w.length; i++) if (tm >= w[i][0] && tm <= w[i][1]) return true;
    return false;
  }
  function updateLabels(arr, cam, tm, W, H) {
    for (var i = 0; i < arr.length; i++) {
      var Lb = arr[i];
      var target = inWindow(Lb.w, tm) ? 1 : 0;
      Lb.op += (target - Lb.op) * 0.18;
      if (Lb.op < 0.02) {
        Lb.el.style.display = 'none';
        Lb.ln.setAttribute('stroke-opacity', '0');
        Lb.ci.setAttribute('fill-opacity', '0');
        continue;
      }
      Lb.o.getWorldPosition(vTmp);
      vTmp.project(cam);
      if (vTmp.z > 1) {
        Lb.el.style.display = 'none';
        Lb.ln.setAttribute('stroke-opacity', '0');
        Lb.ci.setAttribute('fill-opacity', '0');
        continue;
      }
      var ax = (vTmp.x * 0.5 + 0.5) * W;
      var ay = (-vTmp.y * 0.5 + 0.5) * H;
      var side = ax < W * 0.5 ? -1 : 1;
      var lx = ax + side * 84;
      if (lx < 90) lx = 90;
      if (lx > W - 90) lx = W - 90;
      var ly = ay - 42;
      if (ly < 34) ly = 34;
      if (ly > H - 16) ly = H - 16;
      Lb.el.style.display = 'block';
      Lb.el.style.left = lx + 'px';
      Lb.el.style.top = ly + 'px';
      Lb.el.style.opacity = Lb.op.toFixed(2);
      Lb.ln.setAttribute('x1', ax.toFixed(1)); Lb.ln.setAttribute('y1', ay.toFixed(1));
      Lb.ln.setAttribute('x2', lx.toFixed(1)); Lb.ln.setAttribute('y2', ly.toFixed(1));
      Lb.ln.setAttribute('stroke-opacity', (Lb.op * 0.9).toFixed(2));
      Lb.ci.setAttribute('cx', ax.toFixed(1)); Lb.ci.setAttribute('cy', ay.toFixed(1));
      Lb.ci.setAttribute('fill-opacity', Lb.op.toFixed(2));
    }
  }
  function hideLabels(arr) {
    for (var i = 0; i < arr.length; i++) {
      arr[i].op = 0;
      arr[i].el.style.display = 'none';
      arr[i].ln.setAttribute('stroke-opacity', '0');
      arr[i].ci.setAttribute('fill-opacity', '0');
    }
  }

  /* ---------- 组装场景 ---------- */
  var usp = buildUSP();
  var ar = buildAR();
  usp.labelObjs = makeLabels(usp.labels);
  ar.labelObjs = makeLabels(ar.labels);

  var modes = { usp: usp, ar: ar };
  var cur = 'usp';

  /* ---------- UI ---------- */
  var elTitle = document.getElementById('title');
  var elSub = document.getElementById('subtitle');
  var elPhase = document.getElementById('phase');
  var elT = document.getElementById('tcode');
  var elFill = document.getElementById('pfill');
  var elFps = document.getElementById('fps');
  var bUsp = document.getElementById('b-usp');
  var bAr = document.getElementById('b-ar');
  var bPlay = document.getElementById('b-play');
  var bSpeed = document.getElementById('b-speed');
  var bPs1 = document.getElementById('b-ps1');

  var paused = false, speed = 1, ps1 = true;

  function setMode(m) {
    if (m === cur) return;
    hideLabels(modes[cur].labelObjs);
    cur = m;
    document.body.className = (m === 'ar' ? 'mode-ar' : 'mode-usp') + (ps1 ? ' ps1' : '');
    bUsp.className = m === 'usp' ? 'on' : '';
    bAr.className = m === 'ar' ? 'on' : '';
    elTitle.textContent = modes[m].title;
    elSub.textContent = modes[m].sub;
  }
  bUsp.addEventListener('click', function () { setMode('usp'); });
  bAr.addEventListener('click', function () { setMode('ar'); });
  bPlay.addEventListener('click', function () {
    paused = !paused;
    bPlay.textContent = paused ? '播放' : '暂停';
    bPlay.className = paused ? 'on' : '';
  });
  bSpeed.addEventListener('click', function () {
    speed = speed === 1 ? 2 : speed === 2 ? 0.5 : 1;
    bSpeed.textContent = '速度 ×' + speed;
  });
  bPs1.addEventListener('click', function () {
    ps1 = !ps1;
    bPs1.textContent = ps1 ? 'PS1 滤镜 ON' : 'PS1 滤镜 OFF';
    bPs1.className = ps1 ? 'on' : '';
    document.body.className = (cur === 'ar' ? 'mode-ar' : 'mode-usp') + (ps1 ? ' ps1' : '');
    applySize();
  });
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space') { e.preventDefault(); bPlay.click(); }
    else if (e.key === '1') setMode('usp');
    else if (e.key === '2') setMode('ar');
    else if (e.key === 'p' || e.key === 'P') bPs1.click();
  });

  /* ---------- 尺寸 ---------- */
  var W = 2, H = 2;
  function applySize() {
    W = window.innerWidth; H = window.innerHeight;
    var rw = W, rh = H;
    if (ps1) { rw = Math.max(256, Math.floor(W / 3)); rh = Math.max(144, Math.floor(H / 3)); }
    renderer.setSize(rw, rh, false);
    SNAP.value.set(Math.max(96, rw * 0.75), Math.max(54, rh * 0.75));
    var asp = W / H;
    camU.left = -26 * asp; camU.right = 26 * asp; camU.top = 26; camU.bottom = -26;
    camU.updateProjectionMatrix();
    camA.aspect = asp; camA.updateProjectionMatrix();
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  }
  window.addEventListener('resize', applySize);
  applySize();

  /* ---------- 主循环 ---------- */
  var t = 0, last = performance.now();
  var fpsN = 0, fpsT = 0;

  function phaseName(M, tm) {
    var name = M.phases[0][1];
    for (var i = 0; i < M.phases.length; i++) if (tm >= M.phases[i][0]) name = M.phases[i][1];
    return name;
  }

  function loop(now) {
    requestAnimationFrame(loop);
    var dt = (now - last) / 1000; last = now;
    if (dt > 0.1) dt = 0.1;
    if (!paused) t += dt * speed;

    var M = modes[cur];
    var tm = t % M.T;

    applyItems(M.items, tm);
    M.extra(tm, t);
    updateCam();
    renderer.render(M.scene, orbits[cur].cam);
    updateLabels(M.labelObjs, orbits[cur].cam, tm, W, H);

    elPhase.textContent = phaseName(M, tm);
    elT.textContent = 'T+' + tm.toFixed(1) + 's / ' + M.T.toFixed(0) + '.0s' + (paused ? ' · 已暂停' : '');
    elFill.style.width = (tm / M.T * 100).toFixed(1) + '%';

    fpsN++; fpsT += dt;
    if (fpsT >= 0.5) {
      elFps.textContent = Math.round(fpsN / fpsT) + ' FPS';
      fpsN = 0; fpsT = 0;
    }
  }
  requestAnimationFrame(loop);
};
</script>
</body>
