<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USP Match · Low-Poly PS1 Style</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    background: #1a1a2e; 
    overflow: hidden; 
    font-family: 'Courier New', monospace;
  }
  #info {
    position: fixed;
    top: 12px;
    left: 12px;
    color: #00ff88;
    font-size: 11px;
    letter-spacing: 1px;
    z-index: 10;
    text-shadow: 0 0 8px rgba(0,255,136,0.5);
  }
  #info .title { 
    font-size: 14px; 
    color: #00ffcc; 
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  #info .sub { color: #66ccaa; font-size: 10px; }
  #hud {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    color: #00ff88;
    font-size: 10px;
    letter-spacing: 2px;
    z-index: 10;
    text-align: center;
  }
  #hud .cycle { 
    color: #ffcc00; 
    font-size: 12px;
    margin-bottom: 2px;
  }
  canvas { display: block; }
</style>
</head>
<body>
<div id="info">
  <div class="title">USP Match 竞技手枪</div>
  <div class="sub">Low-Poly · PS1 Aesthetic · Procedural</div>
</div>
<div id="hud">
  <div class="cycle">▶ 分解/组装循环</div>
  <div>60 FPS · 机械动画 · 平直着色</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// === 场景初始化 ===
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x888888);
scene.fog = new THREE.Fog(0x888888, 12, 25);

const camera = new THREE.OrthographicCamera(-6, 6, 4.5, -4.5, 0.1, 100);
camera.position.set(5, 3, 7);
camera.lookAt(0, 0.5, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
enableControls(false);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

function enableControls(enabled) {
  controls.enabled = enabled;
  if (!enabled) {
    controls.target.set(0, 0.5, 0);
    camera.position.set(5, 3, 7);
    camera.lookAt(0, 0.5, 0);
  }
}

// 点击切换控制
let controlsEnabled = false;
renderer.domElement.addEventListener('dblclick', () => {
  controlsEnabled = !controlsEnabled;
  enableControls(controlsEnabled);
});

// === 灯光（PS1 风格：顶点光，无 PBR） ===
const ambientLight = new THREE.AmbientLight(0x404040, 0.8);
scene.add(ambientLight);

const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight1.position.set(5, 8, 5);
scene.add(dirLight1);

const dirLight2 = new THREE.DirectionalLight(0x6688cc, 0.4);
dirLight2.position.set(-3, 2, -4);
scene.add(dirLight2);

const dirLight3 = new THREE.DirectionalLight(0x444444, 0.3);
dirLight3.position.set(0, -2, 3);
scene.add(dirLight3);

// === 地面（浅灰） ===
const groundGeo = new THREE.BoxGeometry(20, 0.1, 20);
const groundMat = new THREE.MeshLambertMaterial({ color: 0x999999, flatShading: true });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.position.y = -0.5;
scene.add(ground);

// === 像素化纹理生成器 ===
function createPixelTexture(color, size = 64, pixelSize = 4) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  
  // 基础颜色
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, size, size);
  
  // 添加噪点
  const imageData = ctx.getImageData(0, 0, size, size);
  for (let y = 0; y < size; y += pixelSize) {
    for (let x = 0; x < size; x += pixelSize) {
      const noise = (Math.random() - 0.5) * 12;
      for (let dy = 0; dy < pixelSize; dy++) {
        for (let dx = 0; dx < pixelSize; dx++) {
          const idx = ((y + dy) * size + (x + dx)) * 4;
          imageData.data[idx] = Math.max(0, Math.min(255, imageData.data[idx] + noise));
          imageData.data[idx+1] = Math.max(0, Math.min(255, imageData.data[idx+1] + noise));
          imageData.data[idx+2] = Math.max(0, Math.min(255, imageData.data[idx+2] + noise));
        }
      }
    }
  }
  ctx.putImageData(imageData, 0, 0);
  
  // 添加高光像素点（模拟 PS1 顶点高光）
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  for (let i = 0; i < 8; i++) {
    const px = Math.floor(Math.random() * (size - 8));
    const py = Math.floor(Math.random() * (size - 8));
    ctx.fillRect(px, py, 2, 2);
  }
  
  const texture = new THREE.CanvasTexture(canvas);
  texture.magFilter = THREE.NearestFilter;
  texture.minFilter = THREE.NearestFilter;
  return texture;
}

// === 材质（平直着色 + 像素纹理） ===
const matSlide = new THREE.MeshLambertMaterial({ 
  color: 0x2a2a2a, 
  flatShading: true,
  map: createPixelTexture('#1a1a1a')
});
const matBarrel = new THREE.MeshLambertMaterial({ 
  color: 0xb0b0b0, 
  flatShading: true,
  map: createPixelTexture('#909090')
});
const matFrame = new THREE.MeshLambertMaterial({ 
  color: 0x3a5a3a, 
  flatShading: true,
  map: createPixelTexture('#2a4a2a')
});
const matCompensator = new THREE.MeshLambertMaterial({ 
  color: 0x444444, 
  flatShading: true,
  map: createPixelTexture('#333333')
});
const matMag = new THREE.MeshLambertMaterial({ 
  color: 0x333333, 
  flatShading: true,
  map: createPixelTexture('#222222')
});
const matSightFront = new THREE.MeshLambertMaterial({ 
  color: 0x00ff44, 
  flatShading: true,
  emissive: 0x003311,
  emissiveIntensity: 0.5
});
const matSightRear = new THREE.MeshLambertMaterial({ 
  color: 0xff3333, 
  flatShading: true,
  emissive: 0x330000,
  emissiveIntensity: 0.5
});
const matSmallPart = new THREE.MeshLambertMaterial({ 
  color: 0x555555, 
  flatShading: true,
  map: createPixelTexture('#404040')
});
const matTrigger = new THREE.MeshLambertMaterial({ 
  color: 0x1a1a1a, 
  flatShading: true,
  map: createPixelTexture('#0a0a0a')
});
const matGrip = new THREE.MeshLambertMaterial({ 
  color: 0x2a3a2a, 
  flatShading: true,
  map: createPixelTexture('#1a2a1a', 32, 2)
});

// === USP Match 程序化建模 ===
const pistolGroup = new THREE.Group();

// --- 套筒 (Slide) ---
const slideGroup = new THREE.Group();
slideGroup.name = 'slide';

// 套筒主体
const slideBodyGeo = new THREE.BoxGeometry(1.8, 0.4, 0.8);
const slideBody = new THREE.Mesh(slideBodyGeo, matSlide);
slideBody.position.set(0, 0.2, 0);
slideGroup.add(slideBody);

// 套筒前端（略窄）
const slideFrontGeo = new THREE.BoxGeometry(0.6, 0.35, 0.8);
const slideFront = new THREE.Mesh(slideFrontGeo, matSlide);
slideFront.position.set(-1.1, 0.225, 0);
slideGroup.add(slideFront);

// 套筒后部（略高，包含照门座）
const slideRearGeo = new THREE.BoxGeometry(0.4, 0.5, 0.8);
const slideRear = new THREE.Mesh(slideRearGeo, matSlide);
slideRear.position.set(0.9, 0.25, 0);
slideGroup.add(slideRear);

// 套筒防滑纹（简化几何）
for (let i = 0; i < 3; i++) {
  const serrationGeo = new THREE.BoxGeometry(0.05, 0.3, 0.7);
  const serration = new THREE.Mesh(serrationGeo, matSmallPart);
  serration.position.set(-0.3 + i * 0.15, 0.4, 0);
  slideGroup.add(serration);
}

// 前准星（亮绿色光纤）
const frontSightGeo = new THREE.BoxGeometry(0.08, 0.25, 0.08);
const frontSight = new THREE.Mesh(frontSightGeo, matSightFront);
frontSight.position.set(-0.9, 0.55, 0);
frontSight.name = 'frontSight';
slideGroup.add(frontSight);

// 后准星（红色光纤）
const rearSightGeo = new THREE.BoxGeometry(0.12, 0.2, 0.08);
const rearSight = new THREE.Mesh(rearSightGeo, matSightRear);
rearSight.position.set(0.85, 0.55, 0);
rearSight.name = 'rearSight';
slideGroup.add(rearSight);

// 抛壳窗
const ejectionPortGeo = new THREE.BoxGeometry(0.3, 0.15, 0.02);
const ejectionPort = new THREE.Mesh(ejectionPortGeo, matSmallPart);
ejectionPort.position.set(0.2, 0.45, 0.41);
slideGroup.add(ejectionPort);

slideGroup.position.set(0, 0, 0);
pistolGroup.add(slideGroup);

// --- 枪管 (Barrel) ---
const barrelGroup = new THREE.Group();
barrelGroup.name = 'barrel';

// 枪管主体
const barrelBodyGeo = new THREE.CylinderGeometry(0.12, 0.12, 1.2, 8);
const barrelBody = new THREE.Mesh(barrelBodyGeo, matBarrel);
barrelBody.rotation.z = Math.PI / 2;
barrelBody.position.set(-0.5, 0.15, 0);
barrelGroup.add(barrelBody);

// 枪管前部（略细）
const barrelTipGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.2, 6);
const barrelTip = new THREE.Mesh(barrelTipGeo, matBarrel);
barrelTip.rotation.z = Math.PI / 2;
barrelTip.position.set(-1.15, 0.15, 0);
barrelGroup.add(barrelTip);

barrelGroup.position.set(0, 0, 0);
pistolGroup.add(barrelGroup);

// --- Match 补偿器/配重 (Compensator) ---
const compGroup = new THREE.Group();
compGroup.name = 'compensator';

// 补偿器主体
const compBodyGeo = new THREE.BoxGeometry(0.5, 0.25, 0.5);
const compBody = new THREE.Mesh(compBodyGeo, matCompensator);
compBody.position.set(0, 0, 0);
compGroup.add(compBody);

// 补偿器开孔（前部）
const compHoleGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.1, 6);
const compHole1 = new THREE.Mesh(compHoleGeo, matSmallPart);
compHole1.rotation.z = Math.PI / 2;
compHole1.position.set(0.15, 0.1, 0);
compGroup.add(compHole1);

const compHole2 = new THREE.Mesh(compHoleGeo, matSmallPart);
compHole2.rotation.z = Math.PI / 2;
compHole2.position.set(-0.15, 0.1, 0);
compGroup.add(compHole2);

// 补偿器顶部脊线
const compRidgeGeo = new THREE.BoxGeometry(0.4, 0.05, 0.5);
const compRidge = new THREE.Mesh(compRidgeGeo, matCompensator);
compRidge.position.set(0, 0.15, 0);
compGroup.add(compRidge);

compGroup.position.set(-1.15, 0.1, 0);
pistolGroup.add(compGroup);

// --- 下机匣/握把 (Frame/Grip) ---
const frameGroup = new THREE.Group();
frameGroup.name = 'frame';

// 下机匣主体
const frameBodyGeo = new THREE.BoxGeometry(0.8, 0.5, 0.6);
const frameBody = new THREE.Mesh(frameBodyGeo, matFrame);
frameBody.position.set(0.2, -0.1, 0);
frameGroup.add(frameBody);

// 握把
const gripGeo = new THREE.BoxGeometry(0.35, 0.8, 0.5);
const grip = new THREE.Mesh(gripGeo, matGrip);
grip.position.set(0.4, -0.65, 0);
frameGroup.add(grip);

// 握把防滑纹（简化）
for (let i = 0; i < 4; i++) {
  const gripSerrGeo = new THREE.BoxGeometry(0.3, 0.02, 0.02);
  const gripSerr = new THREE.Mesh(gripSerrGeo, matSmallPart);
  gripSerr.position.set(0.4, -0.3 + i * 0.15, 0.26);
  frameGroup.add(gripSerr);
}

// 扳机护圈
const triggerGuardGeo = new THREE.TorusGeometry(0.15, 0.04, 4, 6, Math.PI * 1.5);
const triggerGuard = new THREE.Mesh(triggerGuardGeo, matFrame);
triggerGuard.rotation.x = Math.PI / 2;
triggerGuard.position.set(0.1, -0.25, 0.25);
frameGroup.add(triggerGuard);

// 扳机
const triggerGeo = new THREE.BoxGeometry(0.08, 0.15, 0.04);
const trigger = new THREE.Mesh(triggerGeo, matTrigger);
trigger.position.set(0.1, -0.25, 0.3);
frameGroup.add(trigger);

// 弹匣释放按钮
const magReleaseGeo = new THREE.BoxGeometry(0.1, 0.08, 0.08);
const magRelease = new THREE.Mesh(magReleaseGeo, matSmallPart);
magRelease.position.set(0.3, -0.15, 0.25);
frameGroup.add(magRelease);

// 空仓挂机解脱杆
const slideStopGeo = new THREE.BoxGeometry(0.3, 0.04, 0.06);
const slideStop = new THREE.Mesh(slideStopGeo, matSmallPart);
slideStop.position.set(0.3, 0.05, 0.3);
frameGroup.add(slideStop);

// 分解杠杆（左右）
const takedownLeverGeo = new THREE.BoxGeometry(0.4, 0.06, 0.08);
const takedownLever = new THREE.Mesh(takedownLeverGeo, matSmallPart);
takedownLever.position.set(0.0, 0.15, 0.31);
frameGroup.add(takedownLever);

frameGroup.position.set(0, 0, 0);
pistolGroup.add(frameGroup);

// --- 弹匣 (Magazine) ---
const magGroup = new THREE.Group();
magGroup.name = 'magazine';

// 弹匣主体
const magBodyGeo = new THREE.BoxGeometry(0.25, 0.7, 0.4);
const magBody = new THREE.Mesh(magBodyGeo, matMag);
magBody.position.set(0, 0, 0);
magGroup.add(magBody);

// 弹匣底板
const magFloorGeo = new THREE.BoxGeometry(0.28, 0.05, 0.42);
const magFloor = new THREE.Mesh(magFloorGeo, matSmallPart);
magFloor.position.set(0, -0.35, 0);
magGroup.add(magFloor);

// 弹匣口（略窄）
const magLipsGeo = new THREE.BoxGeometry(0.2, 0.08, 0.35);
const magLips = new THREE.Mesh(magLipsGeo, matMag);
magLips.position.set(0, 0.32, 0);
magGroup.add(magLips);

// 子弹（可见顶部）
const bulletGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.15, 5);
for (let i = 0; i < 3; i++) {
  const bullet = new THREE.Mesh(bulletGeo, matBarrel);
  bullet.rotation.z = Math.PI / 2;
  bullet.position.set(0, 0.38 + i * 0.05, 0);
  magGroup.add(bullet);
}

magGroup.position.set(0.4, -0.75, 0);
pistolGroup.add(magGroup);

// 整体位置调整
pistolGroup.position.set(0, 0.3, 0);
scene.add(pistolGroup);

// === 动画系统 ===
const ANIMATION_DURATION = 240; // 帧（4秒 @ 60fps）
let frameCount = 0;
let animationPhase = 0; // 0-1

// 初始状态：分解视图
const explodedPositions = {
  slide: { x: 0, y: 1.2, z: 0.5 },
  barrel: { x: 0, y: 0.6, z: -0.3 },
  compensator: { x: -1.8, y: 0.1, z: 0.8 },
  frame: { x: 0, y: -0.5, z: -0.2 },
  magazine: { x: 0.8, y: -1.5, z: 0.3 }
};

const assembledPositions = {
  slide: { x: 0, y: 0, z: 0 },
  barrel: { x: 0, y: 0, z: 0 },
  compensator: { x: 0, y: 0, z: 0 },
  frame: { x: 0, y: 0, z: 0 },
  magazine: { x: 0, y: 0, z: 0 }
};

// 动画关键帧：
// 0-0.25: 弹匣上移入握把
// 0.25-0.5: 套筒后拉
// 0.5-0.75: 套筒复位
// 0.75-1.0: 整体微调，完成

function lerp(a, b, t) { return a + (b - a) * t; }

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function getPartPosition(name, phase) {
  const exploded = explodedPositions[name];
  const assembled = assembledPositions[name];
  
  let t = 0;
  
  if (name === 'magazine') {
    // 弹匣：0-0.25 阶段
    if (phase < 0.25) {
      t = easeInOutCubic(phase / 0.25);
    } else {
      t = 1;
    }
  } else if (name === 'slide') {
    // 套筒：0.25-0.75 阶段（后拉+复位）
    if (phase < 0.25) {
      t = 0;
    } else if (phase < 0.5) {
      // 后拉
      const subT = (phase - 0.25) / 0.25;
      t = easeInOutCubic(subT) * 0.3; // 后拉30%
    } else if (phase < 0.75) {
      // 复位
      const subT = (phase - 0.5) / 0.25;
      t = 0.3 * (1 - easeInOutCubic(subT));
    } else {
      t = 0;
    }
  } else if (name === 'barrel') {
    // 枪管：微弱跟随
    if (phase < 0.25) {
      t = 0;
    } else if (phase < 0.5) {
      t = 0.05;
    } else {
      t = 0;
    }
  } else if (name === 'compensator') {
    // 补偿器：保持位置，微动
    t = 0;
  } else if (name === 'frame') {
    // 下机匣：保持位置
    t = 0;
  }
  
  return {
    x: lerp(exploded.x, assembled.x, t),
    y: lerp(exploded.y, assembled.y, t),
    z: lerp(exploded.z, assembled.z, t)
  };
}

// === 高亮准星发光效果 ===
function updateGlow(time) {
  const frontSight = slideGroup.getObjectByName('frontSight');
  const rearSight = slideGroup.getObjectByName('rearSight');
  
  if (frontSight) {
    const intensity = 0.3 + Math.sin(time * 3) * 0.2;
    frontSight.material.emissiveIntensity = intensity;
  }
  if (rearSight) {
    const intensity = 0.2 + Math.sin(time * 2.5 + 1) * 0.15;
    rearSight.material.emissiveIntensity = intensity;
  }
}

// === 机械细节动画 ===
function updateMechanicalDetails(phase) {
  // 套筒后拉时，枪管也微动
  if (phase > 0.25 && phase < 0.5) {
    const subT = (phase - 0.25) / 0.25;
    barrelGroup.position.x = -0.15 * easeInOutCubic(subT);
  } else if (phase > 0.5 && phase < 0.75) {
    const subT = (phase - 0.5) / 0.25;
    barrelGroup.position.x = -0.15 * (1 - easeInOutCubic(subT));
  } else {
    barrelGroup.position.x = 0;
  }
  
  // 弹匣释放后，弹匣上移
  if (phase < 0.25) {
    const t = easeInOutCubic(phase / 0.25);
    magGroup.position.y = lerp(explodedPositions.magazine.y, assembledPositions.magazine.y, t);
    magGroup.position.x = lerp(explodedPositions.magazine.x, assembledPositions.magazine.x, t);
    magGroup.position.z = lerp(explodedPositions.magazine.z, assembledPositions.magazine.z, t);
  } else {
    magGroup.position.y = assembledPositions.magazine.y;
    magGroup.position.x = assembledPositions.magazine.x;
    magGroup.position.z = assembledPositions.magazine.z;
  }
  
  // 套筒后拉复位
  if (phase > 0.25 && phase < 0.75) {
    const subT = (phase - 0.25) / 0.5;
    if (subT < 0.5) {
      // 后拉
      const pullT = easeInOutCubic(subT * 2);
      slideGroup.position.x = lerp(0, 0.4, pullT);
      slideGroup.position.y = lerp(0, 0.1, pullT);
    } else {
      // 复位
      const resetT = easeInOutCubic((subT - 0.5) * 2);
      slideGroup.position.x = lerp(0.4, 0, resetT);
      slideGroup.position.y = lerp(0.1, 0, resetT);
    }
  } else {
    slideGroup.position.x = 0;
    slideGroup.position.y = 0;
  }
  
  // 补偿器微动（跟随套筒）
  if (phase > 0.25 && phase < 0.75) {
    compGroup.position.x = lerp(explodedPositions.compensator.x, assembledPositions.compensator.x, 
      phase < 0.5 ? 0 : 1);
  } else {
    compGroup.position.x = assembledPositions.compensator.x;
  }
}

// === 初始状态：分解视图 ===
function setExplodedView() {
  Object.keys(explodedPositions).forEach(name => {
    const part = pistolGroup.getObjectByName(name, true);
    if (part) {
      const pos = explodedPositions[name];
      part.position.set(pos.x, pos.y, pos.z);
    }
  });
  // 确保子组位置正确
  slideGroup.position.set(0, 0, 0);
  barrelGroup.position.set(0, 0, 0);
  compGroup.position.set(explodedPositions.compensator.x, explodedPositions.compensator.y, explodedPositions.compensator.z);
  frameGroup.position.set(0, 0, 0);
  magGroup.position.set(explodedPositions.magazine.x, explodedPositions.magazine.y, explodedPositions.magazine.z);
}

setExplodedView();

// === 动画循环 ===
const clock = new THREE.Clock();
let time = 0;

function animate() {
  requestAnimationFrame(animate);
  
  const delta = clock.getDelta();
  time += delta;
  
  // 更新动画相位
  frameCount++;
  animationPhase = (frameCount % ANIMATION_DURATION) / ANIMATION_DURATION;
  
  // 更新机械细节
  updateMechanicalDetails(animationPhase);
  
  // 更新准星发光
  updateGlow(time);
  
  // 微弱整体呼吸效果
  pistolGroup.position.y = 0.3 + Math.sin(time * 0.5) * 0.02;
  
  controls.update();
  renderer.render(scene, camera);
}

// === 窗口调整 ===
window.addEventListener('resize', () => {
  const aspect = window.innerWidth / window.innerHeight;
  const frustumSize = 6;
  camera.left = -frustumSize * aspect / 2;
  camera.right = frustumSize * aspect / 2;
  camera.top = frustumSize / 2;
  camera.bottom = -frustumSize / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// 启动
animate();

console.log('USP Match · Low-Poly PS1 Style 已就绪');
console.log('双击切换视角控制 · 自动循环分解/组装动画');
</script>
