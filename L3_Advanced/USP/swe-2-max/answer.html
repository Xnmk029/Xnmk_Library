<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>USP MATCH — RETRO FIELD-STRIP</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#b4b4b4;font-family:Consolas,'Courier New',monospace;}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:grab;}
#c:active{cursor:grabbing;}
#cad{position:fixed;inset:0;pointer-events:none;}
.panel{position:fixed;z-index:5;background:rgba(10,14,16,.78);border:1px solid rgba(110,190,210,.28);color:#cfe6ee;padding:10px 14px;}
#title{top:14px;left:16px;}
#title h1{margin:0;font-size:15px;letter-spacing:3px;color:#eef7fa;font-weight:700;}
#title .sub{margin-top:4px;font-size:10px;letter-spacing:2px;color:#7fb2bf;}
#phase{top:14px;right:16px;font-size:11px;letter-spacing:2px;color:#9fd4e0;text-align:right;}
#phase b{color:#fff;}
#bar{bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:8px 10px;flex-wrap:wrap;justify-content:center;max-width:94vw;}
button{background:#0f161a;border:1px solid #27424c;color:#9fd4e0;font:inherit;font-size:11px;letter-spacing:1px;padding:6px 10px;cursor:pointer;text-transform:uppercase;}
button:hover{border-color:#5fd6ea;}
button.on{background:#155166;color:#fff;border-color:#5fd6ea;box-shadow:0 0 8px rgba(95,214,234,.35) inset;}
.sep{width:1px;height:18px;background:#27424c;margin:0 4px;}
input[type=range]{width:150px;accent-color:#5fd6ea;}
#hint{bottom:16px;right:16px;font-size:10px;letter-spacing:1px;color:#6d8a94;text-align:right;line-height:1.6;}
.crt{position:fixed;inset:0;pointer-events:none;z-index:4;background:repeating-linear-gradient(0deg,rgba(0,0,0,.055) 0 1px,transparent 1px 3px);}
.vig{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.30) 100%);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<svg id="cad" preserveAspectRatio="none"></svg>
<div class="crt"></div><div class="vig"></div>
<div class="panel" id="title"><h1>USP MATCH</h1><div class="sub">PROCEDURAL LOW-POLY &middot; PS1 FIELD-STRIP</div></div>
<div class="panel" id="phase"><b id="mdl">USP MATCH</b><br/><span id="phs">ASSEMBLED</span></div>
<div class="panel" id="bar">
<button id="bUsp" class="on">USP Match</button><button id="bAr">AR-15 &#9656;</button><div class="sep"></div>
<button id="bAuto" class="on">Auto Loop</button><button id="bAsm">Assembled</button><button id="bExp">Exploded</button>
<input id="scrub" type="range" min="0" max="1000" value="0"/><div class="sep"></div>
<button id="bSpin" class="on">Spin</button>
</div>
<div class="panel" id="hint">DRAG rotate &middot; WHEEL zoom<br/>SLIDER scrubs strip sequence</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE||document.write('<script src="https:\/\/cdn.jsdelivr.net\/npm\/three@0.128.0\/build\/three.min.js"><\/script>');</script>
<script>
(function(){
'use strict';
if(!window.THREE){document.getElementById('phs').textContent='THREE.JS CDN OFFLINE';return;}

/* ================= helpers ================= */
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const ss=t=>{t=clamp(t,0,1);return t*t*t*(t*(t*6-15)+10);};
const win=(s,a,b)=>ss((s-a)/(b-a));
function mat(c,r,m,x){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:r,metalness:m,flatShading:true},x||{}));}
const MAT={
 slide:  mat(0x2c3038,.5 ,.35),
 slide2: mat(0x3a4048,.55,.35),
 poly:   mat(0x212428,.95,.05),
 poly2:  mat(0x2f3337,.9 ,.08),
 silver: mat(0xe4e9ef,.28,.5 ),
 silver2:mat(0xb8c0c9,.4 ,.5 ),
 steel:  mat(0x474d55,.5 ,.45),
 dark:   mat(0x0b0c0d,.9 ,.15),
 spr:    mat(0xacb4bc,.35,.5 ),
 green:  mat(0x0e4018,.4 ,0 ,{emissive:0x35ff5e,emissiveIntensity:1.7}),
 red:    mat(0x400e0e,.4 ,0 ,{emissive:0xff3030,emissiveIntensity:1.6}),
};
function box(w,h,d,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.castShadow=true;return o;}
function cyl(r,h,m,s){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,s||10),m);o.castShadow=true;return o;}
function xc(r,h,m,s){const o=cyl(r,h,m,s);o.rotation.z=-Math.PI/2;return o;}
function zc(r,h,m,s){const o=cyl(r,h,m,s);o.rotation.x= Math.PI/2;return o;}
function torX(r,t,m){const o=new THREE.Mesh(new THREE.TorusGeometry(r,t,5,10),m);o.rotation.y=Math.PI/2;o.castShadow=true;return o;}
function edge(o,c,op){const e=new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry,25),new THREE.LineBasicMaterial({color:c===undefined?0x0a0b0c:c,transparent:true,opacity:op===undefined?0.85:op}));o.add(e);return o;}
function put(p,o,x,y,z){o.position.set(x||0,y||0,z||0);p.add(o);return o;}
function profile(pts,dep,m,holes){
 const sh=new THREE.Shape();sh.moveTo(pts[0][0],pts[0][1]);
 for(let i=1;i<pts.length;i++)sh.lineTo(pts[i][0],pts[i][1]);
 sh.closePath();
 if(holes)for(const h of holes){const p=new THREE.Path();p.moveTo(h[0][0],h[0][1]);
  for(let i=1;i<h.length;i++)p.lineTo(h[i][0],h[i][1]);p.closePath();sh.holes.push(p);}
 const g=new THREE.ExtrudeGeometry(sh,{depth:dep,bevelEnabled:false,curveSegments:4});
 g.translate(0,0,-dep/2);
 const o=new THREE.Mesh(g,m);o.castShadow=true;return o;
}
function springX(r,len,m,coils){const g=new THREE.Group();
 for(let i=0;i<coils;i++){const t=torX(r,0.013,m);t.position.x=-len/2+len*(i+0.5)/coils;g.add(t);}
 return g;}

/* ================= renderer / scene ================= */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:false});
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;
renderer.setClearColor(0xb4b4b4);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xb4b4b4,15,28);
const camera=new THREE.OrthographicCamera(-1,1,1,-1,0.1,80);

scene.add(new THREE.HemisphereLight(0xffffff,0x585e64,1.15));
const key=new THREE.DirectionalLight(0xfff2df,1.15);
key.position.set(4,6,5);key.castShadow=true;
key.shadow.mapSize.set(1024,1024);
key.shadow.camera.left=-3;key.shadow.camera.right=3;key.shadow.camera.top=3;key.shadow.camera.bottom=-3;
key.shadow.camera.near=0.5;key.shadow.camera.far=22;key.shadow.bias=-0.002;
scene.add(key);
const fill=new THREE.DirectionalLight(0xbdd0ff,0.5);fill.position.set(-4,3,6);scene.add(fill);
const rim=new THREE.DirectionalLight(0xffffff,0.22);rim.position.set(-3,5,-5);scene.add(rim);

const gnd=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.ShadowMaterial({opacity:0.30}));
gnd.rotation.x=-Math.PI/2;gnd.position.y=-1.45;gnd.receiveShadow=true;scene.add(gnd);

const world=new THREE.Group();scene.add(world);

/* ================= USP MATCH ================= */
const usp=new THREE.Group();world.add(usp);
const U={};

/* --- polymer frame (extruded side profile, trigger-guard hole) --- */
const frame=new THREE.Group();usp.add(frame);U.frame=frame;
const fPts=[[0.80,0.20],[0.80,0.02],[0.72,-0.03],[0.06,-0.03],[0.02,-0.10],[-0.01,-0.16],
 [-0.50,-0.16],[-0.55,-0.24],[-0.60,-0.50],[-0.66,-0.80],[-0.72,-0.87],[-1.14,-0.80],
 [-1.12,-0.40],[-1.08,-0.10],[-1.05,0.14],[-1.05,0.20]];
put(frame,edge(profile(fPts,0.24,MAT.poly,
 [[[-0.44,-0.05],[-0.44,-0.12],[-0.10,-0.12],[-0.10,-0.05]]])));
put(frame,edge(box(0.05,0.15,0.05,MAT.steel)),-0.27,-0.03,0).rotation.z=-0.18;      // trigger
put(frame,edge(box(0.05,0.20,0.17,MAT.poly2)),-0.45,-0.07,0).rotation.z=0.5;        // mag-release paddle
put(frame,zc(0.03,0.30,MAT.steel),-0.42,0.12,0);                                  // slide-stop pin
put(frame,edge(box(0.12,0.035,0.025,MAT.poly2)),-0.40,0.155,0.135).rotation.z=0.15;
put(frame,edge(box(0.12,0.035,0.025,MAT.poly2)),-0.40,0.155,-0.135).rotation.z=0.15;
put(frame,zc(0.032,0.30,MAT.steel),-0.78,0.10,0);                                 // control-lever pin
put(frame,edge(box(0.12,0.04,0.03,MAT.poly2)),-0.80,0.14,-0.135).rotation.z=0.5;  // decocker lever
put(frame,box(0.5,0.03,0.02,MAT.dark),0.30,0.075,0.126);                          // rail groove R
put(frame,box(0.5,0.03,0.02,MAT.dark),0.30,0.075,-0.126);                         // rail groove L
const ham=new THREE.Group();ham.position.set(-1.02,0.06,0);frame.add(ham);U.ham=ham;
put(ham,edge(box(0.07,0.16,0.09,MAT.steel)),0,0.05,0);
put(ham,edge(box(0.14,0.05,0.07,MAT.steel)),-0.045,0.13,0);

/* --- slide (extruded profile w/ ejection scallop) --- */
const slide=new THREE.Group();usp.add(slide);U.slide=slide;
const sPts=[[-1.10,0.21],[-1.10,0.52],[-0.60,0.52],[-0.52,0.44],[-0.08,0.44],
 [0.0,0.52],[0.74,0.52],[0.84,0.42],[0.80,0.21]];
put(slide,edge(profile(sPts,0.26,MAT.slide)));
put(slide,box(0.36,0.016,0.20,MAT.dark),-0.30,0.44,0);                            // port floor
for(let i=0;i<5;i++){                                                           // rear serrations
 put(slide,box(0.024,0.20,0.014,MAT.dark),-1.03+i*0.045,0.36, 0.134).rotation.z=0.28;
 put(slide,box(0.024,0.20,0.014,MAT.dark),-1.03+i*0.045,0.36,-0.134).rotation.z=0.28;}
for(let i=0;i<4;i++){                                                           // front serrations
 put(slide,box(0.024,0.20,0.014,MAT.dark),0.44+i*0.045,0.36, 0.134).rotation.z=0.28;
 put(slide,box(0.024,0.20,0.014,MAT.dark),0.44+i*0.045,0.36,-0.134).rotation.z=0.28;}
put(slide,edge(box(0.14,0.05,0.02,MAT.slide2)),0.56,0.30,0.133);                  // extractor
put(slide,xc(0.045,0.02,MAT.dark),0.815,0.36,0);                                  // breech ring
const fs=new THREE.Group();fs.position.set(0.56,0.52,0);slide.add(fs);            // front sight
put(fs,edge(box(0.06,0.05,0.06,MAT.slide2)),0,0.025,0);
put(fs,cyl(0.02,0.06,MAT.green,8),0,0.075,0);                                     // green fiber
const rs=new THREE.Group();rs.position.set(-0.97,0.52,0);slide.add(rs);           // rear sight
put(rs,box(0.15,0.02,0.17,MAT.dark),0,0.008,0);
put(rs,edge(box(0.12,0.07,0.05,MAT.slide2)),0,0.04,0.06);
put(rs,edge(box(0.12,0.07,0.05,MAT.slide2)),0,0.04,-0.06);
put(rs,xc(0.016,0.03,MAT.red,8),-0.07,0.05,0.06);                                 // red fibers
put(rs,xc(0.016,0.03,MAT.red,8),-0.07,0.05,-0.06);
put(rs,cyl(0.014,0.025,MAT.red,6),0.0,0.082,0.06);                                // top dots
put(rs,cyl(0.014,0.025,MAT.red,6),0.0,0.082,-0.06);

/* --- barrel + recoil assembly (pivots at link lug) --- */
const bar=new THREE.Group();bar.position.set(-0.62,0.20,0);usp.add(bar);U.bar=bar;
put(bar,edge(box(0.34,0.22,0.21,MAT.silver)),0.03,0.19,0);                        // chamber/hood
put(bar,edge(xc(0.075,1.62,MAT.silver,12)),1.02,0.16,0);                          // tube
put(bar,edge(xc(0.088,0.09,MAT.silver2,12)),1.79,0.16,0);                         // crown
put(bar,xc(0.05,0.02,MAT.dark,10),1.84,0.16,0);                                   // bore
put(bar,edge(box(0.12,0.10,0.12,MAT.silver2)),-0.02,0.02,0);                      // link lug
put(bar,xc(0.028,0.75,MAT.silver2,8),0.95,0.015,0);                               // guide rod
const spr=springX(0.052,0.62,MAT.spr,9);spr.position.set(0.95,0.015,0);bar.add(spr);U.spr=spr;
put(bar,xc(0.055,0.05,MAT.steel,8),1.30,0.015,0);                                 // spring cap

/* --- magazine --- */
const mag=new THREE.Group();mag.position.set(-0.85,-0.42,0);mag.rotation.z=-0.18;
usp.add(mag);U.mag=mag;
put(mag,edge(box(0.16,0.62,0.11,MAT.poly2)),0,0,0);
put(mag,edge(box(0.17,0.06,0.115,MAT.dark)),0,0.32,0);
put(mag,edge(box(0.23,0.08,0.16,MAT.poly)),0.02,-0.36,0);
const magDir=V3(Math.sin(-0.18),-Math.cos(-0.18),0);

/* --- Match compensator / barrel weight --- */
const comp=new THREE.Group();usp.add(comp);U.comp=comp;
put(comp,edge(box(0.55,0.36,0.30,MAT.slide)),1.135,0.33,0);
put(comp,edge(box(0.04,0.40,0.34,MAT.slide2)),1.435,0.33,0);
put(comp,xc(0.055,0.02,MAT.dark,10),1.46,0.36,0);
put(comp,box(0.30,0.05,0.016,MAT.dark),1.10,0.41, 0.156);
put(comp,box(0.30,0.05,0.016,MAT.dark),1.10,0.25, 0.156);
put(comp,box(0.30,0.05,0.016,MAT.dark),1.10,0.41,-0.156);
put(comp,box(0.30,0.05,0.016,MAT.dark),1.10,0.25,-0.156);
put(comp,edge(box(0.5,0.035,0.12,MAT.slide2)),1.10,0.525,0);
put(comp,edge(box(0.22,0.10,0.16,MAT.slide)),0.95,0.12,0);

function uspApply(s,rack,cock){
 const wS=win(s,0,.45),wB=win(s,.03,.42),wH=win(s,.3,.7),wM=win(s,.45,.85),wC=win(s,.55,.95);
 U.slide.position.x=-0.62*wS-0.5*rack;
 U.bar.rotation.z=0.10*wB+0.045*rack;
 U.bar.position.x=-0.62-0.05*wB;
 U.spr.scale.x=1-0.32*Math.max(wB,rack*0.8);
 U.ham.rotation.z=-0.35+0.9*Math.max(wH,cock);
 U.mag.position.set(-0.85+magDir.x*1.0*wM,-0.42+magDir.y*1.0*wM,0);
 U.comp.position.x=0.85*wC;
}
uspApply(0,0,0);

/* ================= AR-15 ================= */
const ar=new THREE.Group();ar.visible=false;world.add(ar);
const A={};

/* --- lower receiver --- */
const lower=new THREE.Group();ar.add(lower);A.lower=lower;
put(lower,edge(box(0.62,0.28,0.20,MAT.slide)),-0.24,-0.09,0);
put(lower,box(0.42,0.012,0.17,MAT.dark),-0.30,0.052,0);                           // cavity insert
put(lower,edge(box(0.27,0.55,0.19,MAT.slide)),-0.03,-0.46,0).rotation.z=0.25;     // magwell
put(lower,edge(box(0.15,0.44,0.13,MAT.poly)),-0.47,-0.42,0).rotation.z=0.5;       // grip
put(lower,edge(box(0.28,0.03,0.06,MAT.slide)),-0.13,-0.29,0);                     // guard bottom
put(lower,edge(box(0.03,0.11,0.06,MAT.slide)),0.02,-0.25,0).rotation.z=-0.35;
put(lower,edge(box(0.03,0.09,0.06,MAT.slide)),-0.28,-0.26,0).rotation.z=0.3;
put(lower,edge(box(0.035,0.14,0.05,MAT.steel)),-0.15,-0.17,0).rotation.z=0.15;    // trigger
put(lower,xc(0.085,1.02,MAT.steel,10),-1.05,0.14,0);                              // buffer tube
put(lower,xc(0.10,0.05,MAT.dark,8),-0.55,0.14,0);                                 // castle nut
put(lower,edge(box(0.5,0.24,0.16,MAT.poly)),-1.32,0.12,0);                        // stock body
put(lower,edge(box(0.52,0.20,0.14,MAT.poly)),-1.35,-0.10,0).rotation.z=0.06;      // stock toe
put(lower,edge(box(0.07,0.56,0.18,MAT.poly)),-1.62,-0.03,0).rotation.z=-0.06;     // buttplate
const frontPin=put(lower,zc(0.035,0.26,MAT.silver2,8),0.03,0.02,0);A.frontPin=frontPin;
const rearPin =put(lower,zc(0.035,0.26,MAT.silver2,8),-0.50,0.02,0);A.rearPin=rearPin;
const safety=new THREE.Group();safety.position.set(-0.33,-0.02,0);lower.add(safety);A.safety=safety;
put(safety,zc(0.028,0.26,MAT.steel,8),0,0,0);
put(safety,edge(box(0.11,0.035,0.025,MAT.steel)),-0.03,-0.035,0.125);
put(lower,zc(0.03,0.24,MAT.steel,8),-0.10,-0.15,0);                               // mag release
put(lower,edge(box(0.06,0.06,0.03,MAT.dark)),-0.10,-0.15,0.125);
put(lower,edge(box(0.10,0.05,0.03,MAT.slide2)),-0.05,-0.10,-0.115);               // bolt catch
const ahm=new THREE.Group();ahm.position.set(-0.38,0.0,0);lower.add(ahm);A.ham=ahm;
put(ahm,edge(box(0.06,0.15,0.08,MAT.steel)),0.0,0.06,0);                          // hammer
put(ahm,edge(box(0.10,0.05,0.08,MAT.steel)),0.035,0.14,0);
put(lower,box(0.05,0.08,0.05,MAT.steel),-0.22,-0.02,0);                           // sear/disconnector
put(lower,box(0.04,0.10,0.04,MAT.steel),-0.15,-0.04,0);

/* --- upper receiver (rotates around front pivot pin) --- */
const upper=new THREE.Group();upper.position.set(0.03,0.02,0);ar.add(upper);A.upper=upper;
put(upper,edge(box(0.78,0.24,0.20,MAT.slide)),-0.16,0.17,0);
put(upper,edge(box(0.78,0.045,0.17,MAT.slide2)),-0.16,0.315,0);                   // flat-top base
for(let i=0;i<7;i++)put(upper,box(0.055,0.045,0.19,MAT.dark),-0.50+i*0.11,0.345,0);
put(upper,box(0.22,0.10,0.015,MAT.dark),-0.05,0.14,0.105);                        // ejection port
put(upper,edge(box(0.05,0.09,0.035,MAT.slide2)),0.09,0.135,0.105);                // deflector
put(upper,zc(0.035,0.06,MAT.slide2,8),-0.40,0.10,0.11);                           // fwd assist
put(upper,edge(box(0.10,0.06,0.02,MAT.slide2)),0.20,0.10,0.105);
const chg=new THREE.Group();upper.add(chg);A.chg=chg;                             // charging handle
put(chg,edge(box(0.30,0.045,0.07,MAT.steel)),-0.33,0.225,0);
put(chg,edge(box(0.05,0.05,0.25,MAT.steel)),-0.50,0.225,0);
const ring1=torX(0.16,0.022,MAT.slide2);ring1.position.set(0.29,0.17,0);upper.add(ring1);
const ring2=torX(0.16,0.022,MAT.slide2);ring2.position.set(1.60,0.17,0);upper.add(ring2);
put(upper,edge(box(1.31,0.05,0.20,MAT.slide)),0.95,0.325,0);                      // quad-rail T
put(upper,edge(box(1.31,0.05,0.20,MAT.slide)),0.95,0.015,0);                      // quad-rail B
put(upper,edge(box(1.31,0.20,0.05,MAT.slide)),0.95,0.17, 0.13);                   // quad-rail R
put(upper,edge(box(1.31,0.20,0.05,MAT.slide)),0.95,0.17,-0.13);                   // quad-rail L
for(let i=0;i<9;i++)put(upper,box(0.02,0.055,0.21,MAT.dark),0.38+i*0.14,0.325,0);
put(upper,edge(xc(0.055,1.9,MAT.steel,10)),0.85,0.17,0);                          // barrel
put(upper,edge(box(0.12,0.12,0.10,MAT.slide2)),1.32,0.245,0);                     // gas block
put(upper,xc(0.016,1.02,MAT.silver,6),0.79,0.285,0);                              // gas tube
put(upper,edge(xc(0.075,0.20,MAT.dark,8)),1.83,0.17,0);                           // muzzle device
put(upper,xc(0.08,0.035,MAT.slide2,8),1.90,0.17,0);
put(upper,xc(0.08,0.035,MAT.slide2,8),1.75,0.17,0);

/* --- bolt carrier group --- */
const bcg=new THREE.Group();ar.add(bcg);A.bcg=bcg;
put(bcg,edge(box(0.45,0.12,0.13,MAT.steel)),-0.28,0.16,0);
put(bcg,edge(box(0.14,0.07,0.06,MAT.steel)),-0.28,0.25,0);                        // gas key
put(bcg,edge(xc(0.05,0.22,MAT.steel,8)),-0.58,0.16,0);                            // tail
const boltG=new THREE.Group();boltG.position.set(0.03,0.16,0);bcg.add(boltG);A.bolt=boltG;
put(boltG,edge(xc(0.055,0.16,MAT.silver2,8)),0,0,0);
for(let i=0;i<6;i++){const a=i*Math.PI/3;
 put(boltG,box(0.05,0.03,0.03,MAT.steel),0.06,0.068*Math.cos(a),0.068*Math.sin(a)).rotation.x=a;}
put(boltG,edge(box(0.035,0.09,0.03,MAT.dark)),-0.06,0.05,0);                      // cam pin
put(boltG,xc(0.02,0.10,MAT.dark,6),-0.10,0,0);                                    // firing pin

/* --- buffer + spring --- */
const buf=new THREE.Group();ar.add(buf);A.buf=buf;
put(buf,edge(xc(0.07,0.30,MAT.silver2,10)),-0.62,0.14,0);
put(buf,edge(xc(0.078,0.06,MAT.dark,8)),-0.45,0.14,0);
const bspr=springX(0.072,0.6,MAT.spr,10);bspr.position.set(-1.0,0.14,0);buf.add(bspr);

/* --- AR magazine --- */
const amag=new THREE.Group();amag.position.set(-0.02,-0.55,0);ar.add(amag);A.amag=amag;
put(amag,edge(box(0.16,0.30,0.11,MAT.poly)),0,0.10,0).rotation.z=0.12;
put(amag,edge(box(0.16,0.30,0.11,MAT.poly)),-0.045,-0.16,0).rotation.z=-0.22;
put(amag,edge(box(0.19,0.05,0.13,MAT.dark)),-0.10,-0.33,0).rotation.z=-0.28;

function arApply(s){
 A.amag.position.y=-0.55-1.05*win(s,0,.22);
 A.rearPin.position.z=0.35*win(s,.12,.30);
 A.frontPin.position.z=0.20*win(s,.12,.30);
 A.upper.rotation.z=-0.58*win(s,.30,.60);
 A.chg.position.x=-0.55*win(s,.55,.78);
 A.bcg.position.x=-0.60*win(s,.60,.85);
 A.bcg.position.y=0.42*win(s,.78,.95);
 A.bolt.position.x=0.03+0.12*win(s,.68,.90);
 A.bolt.rotation.x=0.6*win(s,.68,.90);
 A.buf.position.x=-1.05*win(s,.62,.88);
 A.safety.rotation.z=-0.9*win(s,.05,.20);
 A.ham.rotation.z=-0.5*win(s,.50,.70);
}
arApply(0);

/* --- CAD guide lines (recorded travel axes) --- */
const guides=new THREE.Group();ar.add(guides);
(function buildGuides(){
 const anchors=[
  {o:A.amag,   p:V3(-0.05,-0.20,0)},
  {o:A.rearPin,p:V3(0,0,0)},
  {o:A.frontPin,p:V3(0,0,0)},
  {o:A.bcg,    p:V3(-0.28,0.16,0)},
  {o:A.bolt,   p:V3(0.05,0,0)},
  {o:A.buf,    p:V3(-1.0,0.14,0)},
  {o:A.chg,    p:V3(-0.45,0.22,0)}];
 const lm=new THREE.LineDashedMaterial({color:0x2b6f7c,dashSize:0.05,gapSize:0.035,transparent:true,opacity:0.8});
 world.updateMatrixWorld(true);
 const inv=new THREE.Matrix4().copy(ar.matrixWorld).invert();
 const snap=()=>anchors.map(a=>a.p.clone().applyMatrix4(a.o.matrixWorld).applyMatrix4(inv));
 arApply(1);world.updateMatrixWorld(true);const p1=snap();
 arApply(0);world.updateMatrixWorld(true);const p0=snap();
 for(let i=0;i<anchors.length;i++){
  const g=new THREE.BufferGeometry().setFromPoints([p0[i],p1[i]]);
  const l=new THREE.Line(g,lm);l.computeLineDistances();guides.add(l);
  const mk=new THREE.Mesh(new THREE.OctahedronGeometry(0.022),new THREE.MeshBasicMaterial({color:0x2b6f7c}));
  mk.position.copy(p1[i]);guides.add(mk);}
})();

/* ================= CAD labels ================= */
const svg=document.getElementById('cad'),SVGNS='http://www.w3.org/2000/svg';
let labels=[];
function setLabels(defs){
 for(const l of labels)l.g.remove();labels=[];
 for(const d of defs){
  const g=document.createElementNS(SVGNS,'g');
  const ln=document.createElementNS(SVGNS,'line');
  const sq=document.createElementNS(SVGNS,'rect');
  const tx=document.createElementNS(SVGNS,'text');
  ln.setAttribute('stroke','#12434f');ln.setAttribute('stroke-width','1');ln.setAttribute('opacity','.8');
  sq.setAttribute('width','5');sq.setAttribute('height','5');sq.setAttribute('fill','#12434f');
  tx.setAttribute('font-size','10');tx.setAttribute('font-family','Consolas,monospace');
  tx.setAttribute('letter-spacing','1');tx.setAttribute('fill','#0e3944');
  tx.setAttribute('paint-order','stroke');tx.setAttribute('stroke','#c9c9c9');
  tx.setAttribute('stroke-width','3');tx.setAttribute('stroke-linejoin','round');
  tx.textContent=d.t;g.appendChild(ln);g.appendChild(sq);g.appendChild(tx);svg.appendChild(g);
  labels.push({d:d,ln:ln,sq:sq,tx:tx,g:g});
 }}
const uspLabels=[
 {o:U.slide,p:V3(-0.35,0.56,0),t:'SLIDE - LOCKED'},
 {o:U.bar,  p:V3(0.90,0.38,0),t:'MATCH BARREL'},
 {o:U.comp, p:V3(1.15,0.56,0),t:'COMPENSATOR'},
 {o:U.frame,p:V3(-0.45,-0.40,0),t:'POLYMER FRAME'},
 {o:U.mag,  p:V3(0,-0.18,0),t:'MAGAZINE'},
 {o:U.slide,p:V3(-0.97,0.66,0),t:'REAR SIGHT'},
 {o:U.slide,p:V3(0.56,0.66,0),t:'FIBER FRONT'},
 {o:U.bar,  p:V3(0.95,-0.06,0),t:'RECOIL SPRING'}];
const arLabels=[
 {o:A.upper,p:V3(0.60,0.42,0),t:'UPPER RECEIVER'},
 {o:A.lower,p:V3(-0.50,-0.30,0),t:'LOWER RECEIVER'},
 {o:A.bcg,  p:V3(-0.30,0.38,0),t:'BOLT CARRIER'},
 {o:A.bolt, p:V3(0.05,0.14,0),t:'BOLT HEAD'},
 {o:A.chg,  p:V3(-0.50,0.34,0),t:'CHARGING HANDLE'},
 {o:A.buf,  p:V3(-1.00,0.36,0),t:'BUFFER + SPRING'},
 {o:A.amag, p:V3(-0.05,-0.35,0),t:'MAGAZINE'},
 {o:A.rearPin,p:V3(0,0.16,0),t:'TAKEDOWN PIN'},
 {o:A.upper,p:V3(0.79,0.42,0),t:'GAS TUBE'},
 {o:A.safety,p:V3(0,0.14,0),t:'SELECTOR'},
 {o:A.ham,  p:V3(0,0.22,0),t:'HAMMER'},
 {o:A.lower,p:V3(-0.15,-0.40,0),t:'TRIGGER'}];

/* ================= state / camera ================= */
let W=2,H=2;
const PIX=3;
let mode='usp',pose='auto',scrubVal=0;
let s=0,spinOn=true,dragging=false,rotX=0,zoom=1;
const camDir=V3(0.62,0.40,1.02).normalize();
const goals={
 usp:{g0:{t:V3(0.19,-0.13,0),hw:1.45,hh:0.85},g1:{t:V3(0.30,-0.55,0),hw:2.15,hh:1.35}},
 ar: {g0:{t:V3(0.05,-0.15,0),hw:1.95,hh:1.15},g1:{t:V3(-0.15,-0.60,0),hw:2.10,hh:1.40}}};
const curT=V3(0.19,-0.13,0);let curH=1.0;
const tv=V3();

function resize(){
 W=window.innerWidth;H=window.innerHeight;
 renderer.setSize(Math.max(2,Math.floor(W/PIX)),Math.max(2,Math.floor(H/PIX)),false);
 svg.setAttribute('viewBox','0 0 '+W+' '+H);
}
window.addEventListener('resize',resize);resize();

function updateLabels(){
 const cc=tv.copy(curT).project(camera);
 const cx=(cc.x+1)/2*W,cy=(1-cc.y)/2*H,wp=V3(),pr=V3();
 for(const L of labels){
  wp.copy(L.d.p).applyMatrix4(L.d.o.matrixWorld);
  pr.copy(wp).project(camera);
  if(pr.z>1||pr.z<-1){L.g.setAttribute('display','none');continue;}
  L.g.removeAttribute('display');
  const sx=(pr.x+1)/2*W,sy=(1-pr.y)/2*H;
  let dx=sx-cx,dy=sy-cy;const len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;
  const lx=clamp(sx+dx*64,10,W-10),ly=clamp(sy+dy*64,14,H-10);
  L.ln.setAttribute('x1',sx+dx*5);L.ln.setAttribute('y1',sy+dy*5);
  L.ln.setAttribute('x2',lx-dx*10);L.ln.setAttribute('y2',ly-dy*10);
  L.sq.setAttribute('x',sx-2.5);L.sq.setAttribute('y',sy-2.5);
  L.tx.setAttribute('x',lx);L.tx.setAttribute('y',ly+3);
  L.tx.setAttribute('text-anchor',dx>0.15?'start':(dx<-0.15?'end':'middle'));
 }}

/* ================= UI ================= */
const bUsp=document.getElementById('bUsp'),bAr=document.getElementById('bAr'),
 bAuto=document.getElementById('bAuto'),bAsm=document.getElementById('bAsm'),
 bExp=document.getElementById('bExp'),bSpin=document.getElementById('bSpin'),
 scrub=document.getElementById('scrub'),phs=document.getElementById('phs'),
 mdl=document.getElementById('mdl');
function setMode(m){mode=m;usp.visible=(m==='usp');ar.visible=(m==='ar');
 bUsp.classList.toggle('on',m==='usp');bAr.classList.toggle('on',m==='ar');
 mdl.textContent=m==='usp'?'USP MATCH':'AR-15';
 setLabels(m==='usp'?uspLabels:arLabels);}
function setPose(p){pose=p;
 bAuto.classList.toggle('on',p==='auto');bAsm.classList.toggle('on',p==='asm');
 bExp.classList.toggle('on',p==='exp');}
bUsp.onclick=()=>setMode('usp');
bAr.onclick=()=>setMode('ar');
bAuto.onclick=()=>setPose('auto');
bAsm.onclick=()=>setPose('asm');
bExp.onclick=()=>setPose('exp');
bSpin.onclick=()=>{spinOn=!spinOn;bSpin.classList.toggle('on',spinOn);};
scrub.addEventListener('input',e=>{scrubVal=e.target.value/1000;setPose('manual');});

let px=0,py=0;
canvas.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;
 world.rotation.y+=(e.clientX-px)*0.009;
 rotX=clamp(rotX+(e.clientY-py)*0.008,-0.45,0.55);world.rotation.x=rotX;
 px=e.clientX;py=e.clientY;});
canvas.addEventListener('pointerup',()=>dragging=false);
canvas.addEventListener('pointercancel',()=>dragging=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();
 zoom=clamp(zoom*Math.exp(-e.deltaY*0.001),0.5,2.6);camera.zoom=zoom;camera.updateProjectionMatrix();},{passive:false});

/* ================= main loop ================= */
const hash=(location.hash||'').toLowerCase();
if(hash.indexOf('ar')>=0)setMode('ar');else setMode('usp');
if(hash.indexOf('exp')>=0)setPose('exp');
else if(hash.indexOf('asm')>=0)setPose('asm');
if(hash.indexOf('nospin')>=0){spinOn=false;bSpin.classList.remove('on');}
const t0=performance.now();let lastT=0;
function tick(){
 requestAnimationFrame(tick);
 const now=(performance.now()-t0)/1000;
 const dt=Math.min(0.05,now-lastT);lastT=now;
 let target,rack=0,cock=0,ph='';
 if(pose==='auto'){
  const T=9.6,u=(now%T)/T;
  if(u<0.13){target=0;ph=(mode==='usp'?'ASSEMBLED - SLIDE RACK':'ASSEMBLED');
   rack=Math.sin(Math.PI*clamp((u-0.015)/0.09,0,1));
   cock=ss(clamp((u-0.055)/0.025,0,1));}
  else if(u<0.45){target=ss((u-0.13)/0.32);ph='FIELD-STRIP >>';cock=1;}
  else if(u<0.62){target=1;ph='EXPLODED VIEW';cock=1;}
  else if(u<0.94){target=1-ss((u-0.62)/0.32);ph='<< ASSEMBLING';cock=1;}
  else{target=0;ph='ASSEMBLED';cock=1-ss((u-0.94)/0.04);}
 }else if(pose==='asm'){target=0;ph='ASSEMBLED';}
 else if(pose==='exp'){target=1;ph='EXPLODED VIEW';}
 else{target=scrubVal;ph='SCRUB '+Math.round(scrubVal*100)+'%';}
 s+=(target-s)*Math.min(1,dt*7);
 if(mode==='usp')uspApply(s,rack,cock);else arApply(s);
 phs.textContent=ph;
 if(spinOn&&!dragging)world.rotation.y+=dt*0.16;
 /* camera breathing between assembled / exploded framing */
 const G=goals[mode];
 tv.lerpVectors(G.g0.t,G.g1.t,s);curT.lerp(tv,Math.min(1,dt*4));
 const gh=Math.max(G.g0.hh+(G.g1.hh-G.g0.hh)*s,(G.g0.hw+(G.g1.hw-G.g0.hw)*s)/(W/H));
 curH+=(gh-curH)*Math.min(1,dt*4);
 camera.left=-curH*W/H;camera.right=curH*W/H;camera.top=curH;camera.bottom=-curH;
 camera.position.copy(curT).addScaledVector(camDir,14);
 camera.lookAt(curT);camera.updateProjectionMatrix();camera.updateMatrixWorld(true);
 world.updateMatrixWorld(true);
 updateLabels();
 renderer.render(scene,camera);
}
tick();
})();
</script>
