<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USP Match · 低多边形分解</title>
<style>
  :root {

  body.ar {
    --bg: #c5c8cc;
    --accent: #0c6d84;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;

  #ui button, #ui input, #ui .legend button { pointer-events: auto; }
  header, footer, .legend {
    position: absolute;
  }
  header {
    top: 0; left: 0; right: 0;
    padding: 16px 20px 10px;
    background: linear-gradient(to bottom, var(--panel), rgba(210,211,214,0));
  }
  .kicker {
    display: flex; align-items: center; gap: 10px;
    color: var(--muted); font-size: 11px; letter-spacing: 0.18em;
  }
  .kicker i {
    display: inline-block; width: 18px; height: 3px; background: var(--accent);
  }
  h1 {
    margin: 4px 0 0; font-size: 22px; font-weight: 700; letter-spacing: 0.14em;
  }
  #phase {
    margin-top: 6px; font-size: 13px; letter-spacing: 0.04em;
  }
  #phase b { font-weight: 700; }
  #blurb { color: var(--muted); font-size: 12px; margin-top: 2px; max-width: 46rem; }
  .legend {
    top: 18px; right: 16px; width: 196px;
    border: 1px solid var(--line); background: var(--panel);
    padding: 8px; max-height: calc(100% - 168px); overflow: auto;
  }
  .legend h2 {
    margin: 0 0 6px; font-size: 10px; letter-spacing: 0.16em; color: var(--muted); font-weight: 600;
  }
  .legend button {
    display: flex; gap: 8px; align-items: center;
    width: 100%; text-align: left; background: transparent; color: inherit;
    border: 0; border-top: 1px solid var(--line);
    font: inherit; font-size: 12px; padding: 5px 2px; cursor: pointer;
  }
  .legend button:hover { color: var(--accent); }
  .legend button.on { color: var(--accent); }
  .swatch { width: 10px; height: 10px; flex: none; border: 1px solid rgba(0,0,0,.35); }
  footer {
    left: 0; right: 0; bottom: 0;
    padding: 8px 16px 12px;
    background: linear-gradient(to top, var(--panel) 55%, rgba(210,211,214,0));
  }
  #readout { color: var(--muted); font-size: 11px; letter-spacing: 0.04em; min-height: 1.2em; }
  .track { position: relative; height: 22px; margin: 6px 0; }
  .track .marks { position: absolute; left: 0; right: 0; top: 8px; height: 3px; background: rgba(0,0,0,.12); }
  .track .marks span {
    position: absolute; top: -3px; width: 1px; height: 9px; background: rgba(0,0,0,.35);
  }
  #seek {
    position: relative; width: 100%; margin: 0; background: transparent;
    -webkit-appearance: none; appearance: none; height: 22px; cursor: pointer;
  }
  #seek::-webkit-slider-runnable-track { height: 3px; background: transparent; }
  #seek::-webkit-slider-thumb {
    -webkit-appearance: none; width: 11px; height: 16px; margin-top: -6px;
    background: var(--ink); border: 0;
  }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  button, .modes button {
    font: inherit; font-size: 12px; letter-spacing: 0.04em;
    background: transparent; color: var(--ink);
    border: 1px solid var(--line); padding: 6px 9px; cursor: pointer;
  }
  button:hover { border-color: var(--ink); }
  button.on, .modes button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .spacer { flex: 1; }
  .hint { color: var(--muted); font-size: 11px; }
  #boot-error {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: #d2d3d6; z-index: 5;
  }
  #boot-error[hidden] { display: none; }
  #leaders { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  #leaders .tag {
    position: absolute; font-size: 11px; letter-spacing: 0.06em;
    color: #08323c; background: rgba(197,200,204,.88);
    border: 1px solid rgba(12,109,132,.55); padding: 2px 6px; white-space: nowrap;
  }
  svg.leaders { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  @media (max-width: 820px) {
    h1 { font-size: 16px; letter-spacing: 0.08em; }
    .legend {
      top: auto; bottom: 118px; left: 8px; right: 8px; width: auto;
      max-height: 22vh; display: flex; flex-wrap: wrap; gap: 0 8px;
    }
    .legend h2 { width: 100%; }
    .legend button { width: auto; border: 0; padding: 3px 0; }
    .hint { display: none; }
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="leaders"></div>
<div id="ui">
  <header>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
<script>
'use strict';
if (!window.THREE) {
  document.getElementById('boot-error').hidden = false;
  throw new Error('THREE missing');
}
window.onerror = function (msg, src, line, col) {
  const el = document.getElementById('boot-error');
  el.hidden = false;
  el.textContent = String(msg) + ' @' + line + ':' + col;
};

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function smoother01(t) {
  const x = t < 0 ? 0 : t > 1 ? 1 : t;
  return x * x * x * (x * (x * 6 - 15) + 10);
}
function sample(keys, u) {
  let x = u % 1;
  if (x < 0) x += 1;
  let i = 0;
  const n = keys.length - 1;
  while (i < n - 1 && x >= keys[i + 1][0]) i++;
  const a = keys[i], b = keys[i + 1];
  const span = b[0] - a[0];
  const t = span > 0 ? (x - a[0]) / span : 0;
  return a[1] + (b[1] - a[1]) * smoother01(t);
}
function validateKeys(name, keys) {
  if (Math.abs(keys[0][0]) > 1e-6) throw new Error(name + ' must start at 0');
  if (Math.abs(keys[keys.length - 1][0] - 1) > 1e-6) throw new Error(name + ' must end at 1');
  if (Math.abs(keys[0][1] - keys[keys.length - 1][1]) > 1e-4) throw new Error(name + ' loop mismatch');
  for (let i = 1; i < keys.length; i++) {
    if (keys[i][0] <= keys[i - 1][0]) throw new Error(name + ' times must increase');
  }
}

// Firearm frame: +X muzzle, +Y up, +Z camera/left side.
// USP slide keys are rearward travel in cm. Magazine keys are drop along the grip in cm.
// Comp keys are forward separation along the barrel in cm. Loop endpoints match.
const SLIDE_K = [[0,5.15],[0.10,5.15],[0.16,4.85],[0.36,4.85],[0.43,6.05],[0.56,0],[0.70,0],[0.84,4.85],[0.93,5.15],[1,5.15]];
const MAG_K   = [[0,12.4],[0.12,12.4],[0.34,0],[0.80,0],[0.95,12.4],[1,12.4]];
const COMP_K  = [[0,2.8],[0.15,0],[0.86,0],[0.98,2.8],[1,2.8]];
// AR: pin 0 in / 1 out. Upper opens in degrees. BCG travel in cm.
const PIN_K   = [[0,0],[0.07,0],[0.15,1],[0.90,1],[0.97,0],[1,0]];
const UPPER_K = [[0,0],[0.15,0],[0.34,34],[0.76,34],[0.90,0],[1,0]];
const BCG_K   = [[0,0],[0.34,0],[0.54,9.2],[0.68,9.2],[0.78,0],[1,0]];
[SLIDE_K, MAG_K, COMP_K, PIN_K, UPPER_K, BCG_K].forEach((k, i) => validateKeys('k' + i, k));

function sampleUSP(u) {
  return { slide: sample(SLIDE_K, u), mag: sample(MAG_K, u), comp: sample(COMP_K, u) };
}
function sampleAR(u) {
  return { pin: sample(PIN_K, u), upper: sample(UPPER_K, u), bcg: sample(BCG_K, u) };
}

const USP_PHASES = [
  [0.00, 0.10, '分解视图', '套筒锁定于后，亮银色枪管外露，Match 配重与弹匣沿轴线分离'],
  [0.10, 0.16, '配重回装', '前部配重沿枪管轴线滑回，光纤准星保持可见'],
  [0.16, 0.34, '弹匣入位', '弹匣沿握把轴线向上滑入弹匣井'],
  [0.34, 0.40, '锁定待拉', '套筒仍在后方，银色枪管与 O 型圈外露'],
  [0.40, 0.46, '套筒后拉', '套筒在裸露枪管上继续后拉，击锤被压下'],
  [0.46, 0.58, '套筒复位', '套筒回到闭锁，补偿配重与前后光纤准星始终可见'],
  [0.58, 0.74, '闭合待击', '整枪闭合。前准星绿色，后准星红色'],
  [0.74, 0.86, '再次锁定', '套筒后拉并停在锁定位置，枪管重新露出'],
  [0.86, 1.00, '回到分解', '弹匣脱出，配重沿枪管前移，循环闭合']
];
const AR_PHASES = [
  [0.00, 0.07, '闭合', '上下机匣扣合，后分解销在位'],
  [0.07, 0.15, '后销退出', '后分解销沿销轴向右退出，前枢轴保持不动'],
  [0.15, 0.34, '上机匣打开', '上机匣绕前枢轴抬起，枪管随之一起俯仰'],
  [0.34, 0.54, '枪机框后移', '拉机柄与枪机框沿上机匣导轨后移，枪机头旋转解锁'],
  [0.54, 0.70, '打开保持', '抛壳挺、阻铁、击锤、保险、导气结构与复进簧可见'],
  [0.70, 0.80, '枪机回位', '枪机头转回闭锁，枪机框沿导轨回到前方'],
  [0.80, 0.90, '上机匣闭合', '上机匣绕前枢轴落回下机匣'],
  [0.90, 1.00, '后销回装', '后分解销推回，循环闭合']
];
function phaseAt(list, u) {
  let x = u % 1; if (x < 0) x += 1;
  for (let i = 0; i < list.length; i++) {
    if (x < list[i][1] || i === list.length - 1) return list[i];
  }
  return list[0];
}

const geos = new Map();
function boxGeo(w, h, d) {
  const k = 'b' + w.toFixed(3) + 'x' + h.toFixed(3) + 'x' + d.toFixed(3);
  let g = geos.get(k);
  if (!g) { g = new THREE.BoxGeometry(w, h, d); geos.set(k, g); }
  return g;
}
function cylGeo(r, len, seg, open) {
  const k = 'c' + r.toFixed(3) + 'x' + len.toFixed(3) + 's' + seg + (open ? 'o' : '');
  let g = geos.get(k);
  if (!g) { g = new THREE.CylinderGeometry(r, r, len, seg, 1, !!open); geos.set(k, g); }
  return g;
}
function add(parent, mesh) { parent.add(mesh); return mesh; }
function box(parent, mat, w, h, d, x, y, z) {
  const m = new THREE.Mesh(boxGeo(w, h, d), mat);
  m.position.set(x, y, z);
  return add(parent, m);
}
function cylX(parent, mat, r, len, seg, x, y, z) {
  const m = new THREE.Mesh(cylGeo(r, len, seg), mat);
  m.rotation.z = Math.PI / 2;
  m.position.set(x, y, z);
  return add(parent, m);
}
function cylZ(parent, mat, r, len, seg, x, y, z) {
  const m = new THREE.Mesh(cylGeo(r, len, seg), mat);
  m.rotation.x = Math.PI / 2;
  m.position.set(x, y, z);
  return add(parent, m);
}
function cylY(parent, mat, r, len, seg, x, y, z) {
  const m = new THREE.Mesh(cylGeo(r, len, seg), mat);
  m.position.set(x, y, z);
  return add(parent, m);
}
function group(parent, x, y, z) {
  const g = new THREE.Group();
  g.position.set(x || 0, y || 0, z || 0);
  return add(parent, g);
}
function wedge(parent, mat, len, h, d, x, y, z) {
  const s = new THREE.Shape();
  s.moveTo(0, 0); s.lineTo(len, 0); s.lineTo(0, h); s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: false, steps: 1 });
  geo.translate(0, 0, -d / 2);
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  return add(parent, m);
}

function pixelTex(size, paint, repeatX, repeatY) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  paint(g, size);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestFilter;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeatX || 1, repeatY || 1);
  t.colorSpace = THREE.SRGBColorSpace;
  t.needsUpdate = true;
  return t;
}
function grain(g, size, lo, hi, bands) {
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const n = ((x * 17 + y * 13) * 9 + (x ^ y)) & 255;
      let v = lo + ((n * (hi - lo)) >> 8);
      if (bands && (y & 3) === 0) v = Math.max(0, v - 28);
      if ((n & 15) === 0) v = Math.min(255, v + 36);
      g.fillStyle = 'rgb(' + v + ',' + v + ',' + v + ')';
      g.fillRect(x, y, 1, 1);
    }
  }
}
const texPolymer = pixelTex(16, (g, s) => grain(g, s, 168, 236, false), 2, 2);
const texSlide = pixelTex(16, (g, s) => grain(g, s, 150, 230, true), 3, 2);
const texSilver = pixelTex(16, (g, s) => grain(g, s, 214, 255, true), 4, 1);
const texDark = pixelTex(16, (g, s) => grain(g, s, 140, 210, true), 2, 3);

function phong(color, opts) {
  opts = opts || {};
  return new THREE.MeshPhongMaterial({
    color: color,
    map: opts.map || null,
    flatShading: opts.flat !== false,
    shininess: opts.shininess == null ? 14 : opts.shininess,
    specular: new THREE.Color(opts.specular == null ? 0x333333 : opts.specular),
    emissive: new THREE.Color(opts.emissive || 0x000000),
    emissiveIntensity: opts.emissiveIntensity || 1
  });
}

const MAT = {
  poly: phong(0x4a5058, { map: texPolymer, shininess: 6, specular: 0x222222 }),
  polyDeep: phong(0x2e3338, { map: texPolymer, shininess: 4, specular: 0x151515 }),
  slide: phong(0x5a616a, { map: texSlide, shininess: 36, specular: 0x9aa0a8 }),
  weight: phong(0x6d747e, { map: texSlide, shininess: 30, specular: 0x8a9098 }),
  silver: phong(0xe7eef6, { map: texSilver, shininess: 90, specular: 0xffffff }),
  steel: phong(0xb4bcc6, { shininess: 50, specular: 0xe8e8e8, flat: true }),
  mag: phong(0x3a4048, { map: texDark, shininess: 20, specular: 0x666666 }),
  follower: phong(0xff8a32, { shininess: 10, specular: 0x331800 }),
  hammer: phong(0x8e969f, { map: texSlide, shininess: 24, specular: 0x777777 }),
  ridge: phong(0x3e444c, { shininess: 18, specular: 0x333333 }),
  fiberG: phong(0x39f06a, { flat: false, shininess: 20, specular: 0xffffff, emissive: 0x39f06a, emissiveIntensity: 0.95 }),
  fiberR: phong(0xff3344, { flat: false, shininess: 20, specular: 0xffffff, emissive: 0xff2233, emissiveIntensity: 0.9 }),
  glowG: new THREE.MeshBasicMaterial({ color: 0x39ff6a, transparent: true, opacity: 0.28, blending: THREE.AdditiveBlending, depthWrite: false }),
  glowR: new THREE.MeshBasicMaterial({ color: 0xff3344, transparent: true, opacity: 0.28, blending: THREE.AdditiveBlending, depthWrite: false }),
  bore: phong(0x070809, { shininess: 2, specular: 0x000000 }),
  oring: phong(0x141414, { shininess: 6, specular: 0x111111, flat: false }),
  ano: phong(0x1b1d21, { shininess: 10, specular: 0x181818, flat: false }),
  ano2: phong(0x24272c, { shininess: 12, specular: 0x222222, flat: false }),
  steelD: phong(0x3e444c, { shininess: 36, specular: 0x888888, flat: false }),
  steelM: phong(0x5a616a, { shininess: 48, specular: 0xaaaaaa, flat: false }),
  steelB: phong(0x6c747e, { shininess: 60, specular: 0xdddddd, flat: false }),
  polyAR: phong(0x141618, { shininess: 6, specular: 0x101010, flat: false }),
  brass: phong(0xb08a45, { shininess: 40, specular: 0xffe0a0, flat: false })
};

const GLYPH = {
  A: [14,17,17,31,17,17,17], C: [14,17,16,16,16,17,14], H: [17,17,17,31,17,17,17],
  M: [17,27,21,21,17,17,17], P: [30,17,17,30,16,16,16], S: [15,16,16,14,1,1,30],
  T: [31,4,4,4,4,4,4], U: [17,17,17,17,17,17,14]
};
function engrave(text) {
  const scale = 6, gap = 2;
  const w = text.length * (5 * scale + gap * scale) + scale * 2;
  const h = 9 * scale;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = '#1a1d22';
  g.fillRect(0, 0, w, h);
  g.fillStyle = '#9aa2ab';
  let cx = scale;
  for (const ch of text) {
    const rows = GLYPH[ch];
    if (!rows) { cx += 4 * scale; continue; }
    for (let y = 0; y < 7; y++) {
      for (let x = 0; x < 5; x++) {
        if ((rows[y] >> (4 - x)) & 1) g.fillRect(cx + x * scale, scale + y * scale, scale - 1, scale - 1);
      }
    }
    cx += 5 * scale + gap * scale;
  }
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestFilter;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const labelUSP = phong(0xffffff, { map: engrave('USP'), shininess: 8, specular: 0x222222, flat: true });
const labelMATCH = phong(0xffffff, { map: engrave('MATCH'), shininess: 8, specular: 0x222222, flat: true });

function buildUSP() {
  const root = new THREE.Group();
  root.name = 'usp';
  const edges = [];
  function cad(mesh) {
    const line = new THREE.LineSegments(
      new THREE.EdgesGeometry(mesh.geometry, 18),
      new THREE.LineBasicMaterial({ color: 0x14161a, transparent: true, opacity: 0.45 })
    );
    line.scale.setScalar(1.004);
    mesh.add(line);
    line.visible = false;
    edges.push(line);
  }

  const SLIDE_REAR = 0.15, SLIDE_FRONT = 17.25;
  const S_BOT = 1.42, S_TOP = 3.92, S_HALF = 1.36, WALL = 0.24;
  const BORE_Y = 2.64, BUSH_X = 17.05;

  const slideG = group(root, 0, 0, 0);
  slideG.name = 'slide';
  // Left wall (camera side) is continuous. Right wall and roof leave an ejection port.
  const left = box(slideG, MAT.slide, SLIDE_FRONT - SLIDE_REAR, S_TOP - S_BOT, WALL,
    (SLIDE_REAR + SLIDE_FRONT) / 2, (S_BOT + S_TOP) / 2, S_HALF - WALL / 2);
  cad(left);
  const rightRear = box(slideG, MAT.slide, 4.7, S_TOP - S_BOT, WALL, SLIDE_REAR + 2.35, (S_BOT + S_TOP) / 2, -S_HALF + WALL / 2);
  const rightFront = box(slideG, MAT.slide, 7.55, S_TOP - S_BOT, WALL, 13.45, (S_BOT + S_TOP) / 2, -S_HALF + WALL / 2);
  box(slideG, MAT.slide, 4.7, 0.55, WALL, 7.2, S_BOT + 0.28, -S_HALF + WALL / 2);
  box(slideG, MAT.slide, SLIDE_FRONT - SLIDE_REAR, 0.26, S_HALF * 2,
    (SLIDE_REAR + SLIDE_FRONT) / 2, S_TOP - 0.13, 0);
  box(slideG, MAT.bore, 4.4, 1.2, 0.1, 7.15, 2.85, -S_HALF + 0.06);
  // Rear face and a shallow hood nose.
  box(slideG, MAT.slide, 0.22, S_TOP - S_BOT - 0.08, S_HALF * 2 - 0.08, SLIDE_REAR + 0.08, (S_BOT + S_TOP) / 2, 0);
  cad(rightRear); cad(rightFront);

  function ridges(x0, x1, n) {
    const step = (x1 - x0) / n;
    for (let i = 0; i < n; i++) {
      const x = x0 + step * (i + 0.5);
      box(slideG, MAT.ridge, step * 0.46, 1.45, 0.22, x, 2.5, S_HALF + 0.08);
      box(slideG, MAT.ridge, step * 0.46, 1.45, 0.22, x, 2.5, -S_HALF - 0.08);
    }
  }
  ridges(0.6, 3.5, 6);
  ridges(13.2, 15.4, 5);

  const plate = box(slideG, labelUSP, 2.15, 0.62, 0.04, 5.4, 2.15, S_HALF + 0.03);
  plate.name = 'usp-mark';

  // Adjustable rear sight, red fiber in the notch ears.
  const sightR = group(slideG, 1.15, S_TOP, 0);
  box(sightR, MAT.slide, 1.45, 0.7, 1.35, 0, 0.36, 0);
  box(sightR, MAT.slide, 0.95, 0.85, 0.32, 0, 0.95, 0.5);
  box(sightR, MAT.slide, 0.95, 0.85, 0.32, 0, 0.95, -0.5);
  cylY(sightR, MAT.steel, 0.18, 0.22, 8, 0.2, 1.4, 0);
  box(sightR, MAT.fiberR, 0.36, 0.5, 1.15, -0.7, 0.9, 0);
  cylX(sightR, MAT.fiberR, 0.2, 0.55, 8, -0.25, 1.05, 0.52);
  cylX(sightR, MAT.fiberR, 0.2, 0.55, 8, -0.25, 1.05, -0.52);
  box(sightR, MAT.glowR, 0.45, 0.7, 1.35, -0.85, 0.9, 0);

  // High front sight, green fiber rod facing the shooter.
  const sightF = group(slideG, 16.15, S_TOP, 0);
  box(sightF, MAT.slide, 0.62, 0.38, 0.62, 0, 0.19, 0);
  box(sightF, MAT.slide, 0.4, 1.35, 0.46, 0, 0.95, 0);
  cylX(sightF, MAT.fiberG, 0.26, 0.72, 8, 0, 1.42, 0);
  box(sightF, MAT.glowG, 0.55, 0.7, 0.7, -0.28, 1.42, 0);

  // Barrel assembly pivots at the front bushing. +rotation.z drops the chamber (rear is -X).
  const barrelAsm = group(root, BUSH_X, BORE_Y, 0);
  barrelAsm.name = 'barrel';
  cylX(barrelAsm, MAT.silver, 0.60, 10.2, 10, -5.35, 0, 0);
  cylX(barrelAsm, MAT.silver, 0.84, 2.5, 10, -9.55, 0, 0);
  box(barrelAsm, MAT.silver, 2.15, 0.55, 0.95, -9.7, 0.55, 0);
  cylX(barrelAsm, MAT.bore, 0.34, 0.2, 8, -10.75, 0, 0);
  // Match barrel continues through the weight.
  cylX(barrelAsm, MAT.silver, 0.58, 6.3, 10, 2.55, 0, 0);
  cylX(barrelAsm, MAT.bore, 0.28, 0.12, 8, 5.72, 0, 0);
  const oring = new THREE.Mesh(new THREE.TorusGeometry(0.66, 0.075, 4, 10), MAT.oring);
  oring.rotation.y = Math.PI / 2;
  oring.position.set(0.22, 0, 0);
  barrelAsm.add(oring);

  // Recoil spring and guide rod, hidden by the slide when it is in battery.
  cylX(barrelAsm, MAT.steel, 0.12, 8.4, 6, -4.5, -0.95, 0);
  for (let i = 0; i < 11; i++) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.055, 4, 8), MAT.steel);
    ring.rotation.y = Math.PI / 2;
    ring.position.set(-1.1 - i * 0.62, -0.95, 0);
    barrelAsm.add(ring);
  }

  const weight = group(barrelAsm, 0.55, 0, 0);
  weight.name = 'weight';
  // Solid Match weight. Narrow side flutes show the barrel; two slots on top are the ports.
  const seg = 0.72, slot = 0.2, fins = 6;
  for (let i = 0; i < fins; i++) {
    const x = 0.2 + i * (seg + slot) + seg / 2;
    box(weight, MAT.weight, seg, 2.05, 0.38, x, 0.02, 1.12);
    box(weight, MAT.weight, seg, 2.05, 0.38, x, 0.02, -1.12);
    const topH = (i === 2 || i === 4) ? 0.16 : 0.34;
    box(weight, MAT.weight, seg, topH, 2.15, x, 1.02, 0);
    box(weight, MAT.weight, seg, 0.32, 2.15, x, -1.0, 0);
  }
  box(weight, MAT.weight, 0.28, 2.35, 2.62, 0.12, 0.02, 0);
  box(weight, MAT.weight, 0.34, 0.55, 0.5, 5.15, 0.62, 0.62);
  box(weight, MAT.weight, 0.34, 0.55, 0.5, 5.15, 0.62, -0.62);
  box(weight, MAT.weight, 0.34, 0.55, 0.5, 5.15, -0.62, 0.62);
  box(weight, MAT.weight, 0.34, 0.55, 0.5, 5.15, -0.62, -0.62);
  const matchPlate = box(weight, labelMATCH, 1.55, 0.42, 0.05, 2.4, 0.15, 1.34);
  matchPlate.name = 'match-mark';
  cad(box(weight, MAT.weight, 0.16, 2.2, 0.16, 2.6, 0.05, 1.28));

  // Frame, rails, dust cover, trigger guard.
  const frame = group(root, 0, 0, 0);
  frame.name = 'frame';
  const upper = box(frame, MAT.poly, 7.4, 1.55, 2.55, 3.35, 0.78, 0);
  cad(upper);
  box(frame, MAT.poly, 1.7, 1.25, 2.15, -0.85, 0.95, 0);
  wedge(frame, MAT.poly, 1.5, 0.85, 2.0, -1.7, 0.55, 0);
  const dust = box(frame, MAT.poly, 10.2, 1.05, 2.25, 10.55, 0.78, 0);
  cad(dust);
  // Steel rails the slide rides on. Exposed when the slide is back.
  box(frame, MAT.silver, 12.6, 0.28, 0.28, 8.2, 1.62, 0.78);
  box(frame, MAT.silver, 12.6, 0.28, 0.28, 8.2, 1.62, -0.78);
  box(frame, MAT.steel, 2.4, 0.55, 1.3, 7.4, 1.85, 0);

  // Squared trigger guard with the USP front hook.
  box(frame, MAT.poly, 0.42, 2.15, 0.48, 6.15, -0.55, 0);
  box(frame, MAT.poly, 4.3, 0.4, 0.48, 4.15, -1.5, 0);
  box(frame, MAT.poly, 0.42, 1.7, 0.48, 2.15, -0.7, 0);
  wedge(frame, MAT.polyDeep, 0.7, 0.55, 0.48, 6.2, -1.7, 0);

  const triggerP = group(frame, 4.15, 0.15, 0);
  const trig = new THREE.Mesh(new THREE.TorusGeometry(0.78, 0.1, 4, 8, Math.PI * 0.85), MAT.hammer);
  trig.rotation.y = Math.PI / 2;
  trig.rotation.z = Math.PI * 0.15;
  trig.position.set(0.15, -0.7, 0);
  triggerP.add(trig);
  cylZ(triggerP, MAT.steel, 0.12, 0.55, 8, 0.55, -0.35, 0);

  // Magazine release is a lever, not a button.
  const magRel = group(frame, 2.25, -0.35, 1.72);
  box(magRel, MAT.hammer, 0.85, 0.18, 0.55, 0.2, 0, 0.15);
  box(magRel, MAT.steel, 0.7, 0.12, 0.28, 0.15, -0.12, 0.35);

  // Slide stop on the left, pivots on its pin.
  const slideStop = group(frame, 5.35, 1.15, 1.68);
  cylZ(slideStop, MAT.steel, 0.16, 0.35, 8, 0, 0, 0);
  box(slideStop, MAT.hammer, 1.15, 0.2, 0.16, 0.45, 0.05, 0.12);
  box(slideStop, MAT.hammer, 0.55, 0.38, 0.16, 0.95, 0.12, 0.12);

  // Decock / safety paddle.
  const safety = group(frame, 0.45, 0.55, 1.78);
  cylZ(safety, MAT.steel, 0.28, 0.28, 8, 0, 0, 0);
  box(safety, MAT.hammer, 0.28, 1.25, 0.16, 0.05, -0.7, 0.12);
  box(safety, MAT.hammer, 0.7, 0.42, 0.16, 0.28, -1.15, 0.12);

  // Hammer. rotation 0 = spur up behind the slide. Negative Z rotation ducks it under the slide.
  const hammer = group(frame, -0.15, 0.85, 0);
  cylZ(hammer, MAT.steel, 0.22, 0.7, 8, 0, 0, 0);
  box(hammer, MAT.hammer, 0.55, 0.85, 0.62, -0.05, 0.2, 0);
  box(hammer, MAT.hammer, 1.25, 0.36, 0.5, -0.7, 0.72, 0);
  box(hammer, MAT.hammer, 0.42, 0.85, 0.55, -1.25, 1.15, 0);

  // Grip is rotated so the magazine well axis is the grip axis, not world Y.
  // rotation.z = -0.20: local -Y runs down and toward -X (rear).
  const magTrack = group(root, 1.55, 0.05, 0);
  magTrack.rotation.z = -0.20;
  magTrack.name = 'grip';
  const GW = 1.52, GI = 1.18;
  box(magTrack, MAT.poly, 0.32, 9.6, GW * 2, 1.42, -4.5, 0);
  box(magTrack, MAT.poly, 0.34, 9.6, GW * 2, -1.48, -4.5, 0);
  box(magTrack, MAT.poly, 2.55, 9.6, 0.28, 0.0, -4.5, GW - 0.14);
  box(magTrack, MAT.poly, 2.55, 9.6, 0.28, 0.0, -4.5, -GW + 0.14);
  // Finger grooves on the front strap.
  for (let i = 0; i < 3; i++) {
    box(magTrack, MAT.polyDeep, 0.18, 0.55, 1.5, 1.62, -3.1 - i * 1.45, 0);
  }
  // Heel and a short tang buried into the frame.
  box(magTrack, MAT.poly, 3.3, 0.45, GW * 2 - 0.1, 0.05, 0.15, 0);

  const mag = group(magTrack, 0, 0, 0);
  mag.name = 'magazine';
  box(mag, MAT.mag, 2.05, 9.5, 1.85, 0, -4.15, 0);
  // Feed lips.
  box(mag, MAT.steel, 0.28, 0.7, 1.7, 0.55, 0.55, 0);
  box(mag, MAT.steel, 0.28, 0.7, 1.7, -0.45, 0.55, 0);
  box(mag, MAT.follower, 1.35, 0.28, 1.55, 0.05, 0.15, 0);
  // Extended Match floorplate.
  const base = box(mag, MAT.polyDeep, 2.7, 1.15, 2.25, 0.15, -9.35, 0);
  cad(base);
  box(mag, MAT.polyDeep, 0.8, 0.45, 1.3, 1.15, -8.85, 0);
  for (let i = 0; i < 6; i++) {
    box(mag, MAT.bore, 0.16, 0.36, 0.08, 0.15, -1.2 - i * 1.15, 0.95);
  }

  const anchors = {
    slide: slideG,
    barrel: barrelAsm,
    weight: weight,
    mag: mag,
    frame: frame,
    front: sightF,
    rear: sightR
  };

  function update(p) {
    slideG.position.x = -p.slide;
    mag.position.y = -p.mag;
    weight.position.x = 0.55 + p.comp;
    // Tilt eases in only once the slide is well back, so the chamber drops clear of the hood.
    const tilt = smoother01(clamp((p.slide - 3.1) / 2.1, 0, 1)) * 0.04;
    barrelAsm.rotation.z = tilt;
    const expose = 1 - smoother01(clamp(p.slide / 2.4, 0, 1));
    hammer.rotation.z = -0.55 * (1 - expose);
    const locked = smoother01(clamp((p.slide - 3.8) / 1.1, 0, 1));
    slideStop.rotation.z = 0.42 * locked;
    const transit = Math.sin(clamp(p.mag / 12.4, 0, 1) * Math.PI);
    magRel.rotation.x = 0.35 * transit;
  }

  update(sampleUSP(0));
  return { root, edges, update, anchors };
}

function buildAR() {
  const root = new THREE.Group();
  root.name = 'ar';
  const edges = [];
  const edgeMat = new THREE.LineBasicMaterial({ color: 0x0c4a58, transparent: true, opacity: 0.8 });
  function cad(mesh) {
    const line = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, 28), edgeMat);
    line.scale.setScalar(1.003);
    mesh.add(line);
    edges.push(line);
  }
  function axis(parent, a, b, color) {
    const g = new THREE.BufferGeometry().setFromPoints([a, b]);
    const line = new THREE.Line(g, new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.85 }));
    parent.add(line);
    return line;
  }

  const BORE = 4.05;
  const lower = group(root, 0, 0, 0);
  lower.name = 'lower';

  // Lower shell. Left side (+Z) is a section so the fire-control group is visible.
  const lWallR = box(lower, MAT.ano, 16.2, 2.85, 0.18, -6.4, 1.55, -1.42);
  cad(lWallR);
  box(lower, MAT.ano, 5.4, 2.85, 0.18, -12.5, 1.55, 1.42);
  box(lower, MAT.ano, 4.6, 2.85, 0.18, -1.3, 1.55, 1.42);
  box(lower, MAT.ano, 5.8, 0.55, 0.18, -6.9, 2.7, 1.42);
  box(lower, MAT.ano, 5.8, 0.45, 0.18, -6.9, 0.4, 1.42);
  // Section rim
  box(lower, MAT.ano2, 0.12, 2.3, 0.12, -9.85, 1.55, 1.42);
  box(lower, MAT.ano2, 0.12, 2.3, 0.12, -3.95, 1.55, 1.42);
  const floor = box(lower, MAT.ano, 15.6, 0.28, 2.7, -6.5, 0.22, 0);
  cad(floor);
  // Mag well
  box(lower, MAT.ano, 2.6, 2.4, 0.16, -5.2, -0.85, 1.15);
  box(lower, MAT.ano, 2.6, 2.4, 0.16, -5.2, -0.85, -1.15);
  box(lower, MAT.ano, 0.16, 2.4, 2.15, -3.85, -0.85, 0);
  box(lower, MAT.ano, 0.16, 2.4, 2.15, -6.55, -0.85, 0);
  // Buffer tower
  const tower = box(lower, MAT.ano, 2.4, 2.4, 2.5, -14.6, 2.3, 0);
  cad(tower);
  box(lower, MAT.ano2, 1.4, 1.6, 2.2, -15.6, 2.5, 0);

  // Front pivot ears (outer) and rear takedown ears (outer). Upper lug sits between them.
  box(lower, MAT.ano2, 0.7, 0.85, 0.38, 0, 0.55, 1.05);
  box(lower, MAT.ano2, 0.7, 0.85, 0.38, 0, 0.55, -1.05);
  box(lower, MAT.ano2, 0.7, 0.85, 0.38, -13.6, 0.7, 1.05);
  box(lower, MAT.ano2, 0.7, 0.85, 0.38, -13.6, 0.7, -1.05);
  const frontPin = cylZ(lower, MAT.steelM, 0.22, 2.7, 10, 0, 0.45, 0);
  cad(frontPin);
  const rearPin = group(lower, -13.6, 0.62, 0);
  const rearPinMesh = cylZ(rearPin, MAT.steelM, 0.22, 3.3, 10, 0, 0, 0);
  cad(rearPinMesh);
  axis(lower, new THREE.Vector3(0, 0.45, -2.4), new THREE.Vector3(0, 0.45, 2.4), 0xc47b18);

  // Fire control, visible through the left section.
  const hammer = group(lower, -8.7, 1.25, 0);
  cylZ(hammer, MAT.steelD, 0.28, 0.55, 8, 0, 0, 0);
  box(hammer, MAT.steelD, 0.7, 1.15, 0.4, 0.15, 0.45, 0);
  box(hammer, MAT.steelB, 0.35, 0.28, 0.46, 0.45, 0.95, 0);
  const trigger = group(lower, -6.3, 0.85, 0);
  cylZ(trigger, MAT.steelD, 0.2, 0.5, 8, 0, 0, 0);
  box(trigger, MAT.steelD, 0.22, 1.35, 0.28, 0.15, -0.45, 0);
  box(trigger, MAT.steelD, 0.7, 0.18, 0.32, 0.4, -1.05, 0);
  const sear = group(lower, -7.55, 1.55, 0);
  box(sear, MAT.brass, 0.7, 0.16, 0.28, 0.1, 0, 0);
  box(sear, MAT.brass, 0.18, 0.4, 0.28, -0.22, 0.12, 0);
  const safety = group(lower, -7.15, 2.15, 0);
  cylZ(safety, MAT.steelM, 0.32, 2.55, 10, 0, 0, 0);
  box(safety, MAT.ano2, 0.7, 0.16, 0.28, -0.15, 0.05, 1.25);
  // Mag release catch crosses the well; button is on the right.
  box(lower, MAT.steelM, 0.35, 0.55, 1.6, -4.55, 1.15, -0.35);
  cylZ(lower, MAT.steelB, 0.28, 0.25, 8, -4.55, 1.15, -1.45);
  // Bolt catch
  box(lower, MAT.steelD, 0.55, 0.7, 0.2, -3.3, 1.7, 1.35);

  // Trigger guard bow
  box(lower, MAT.ano, 0.16, 1.5, 0.4, -4.15, -0.15, 0);
  box(lower, MAT.ano, 0.16, 1.5, 0.4, -8.35, -0.15, 0);
  box(lower, MAT.ano, 4.3, 0.16, 0.4, -6.25, -0.85, 0);

  // Grip hangs down-rear. Same sign convention as the USP grip.
  const grip = group(lower, -10.2, 0.2, 0);
  grip.rotation.z = -0.32;
  box(grip, MAT.polyAR, 1.7, 7.2, 1.7, 0.1, -3.5, 0);
  box(grip, MAT.polyAR, 0.35, 6.4, 1.35, 0.85, -3.6, 0);

  // Magazine, slight curve from stacked segments.
  const mag = group(lower, -5.2, -1.7, 0);
  box(mag, MAT.polyAR, 2.15, 3.2, 1.7, 0, -1.4, 0);
  const magBend = group(mag, 0, -2.9, 0);
  magBend.rotation.z = 0.08;
  box(magBend, MAT.polyAR, 2.05, 5.5, 1.6, 0.15, -2.6, 0);
  box(magBend, MAT.ano2, 2.3, 0.4, 1.85, 0.2, -5.2, 0);

  // Buffer tube, spring (rear anchored), stock.
  const tubeRear = -31.2;
  const tubeMouth = -16.2;
  cylX(lower, MAT.ano2, 1.05, tubeMouth - tubeRear, 16, (tubeMouth + tubeRear) / 2, 2.15, 0);
  // ridges
  for (let i = 0; i < 6; i++) {
    cylX(lower, MAT.ano, 1.18, 0.28, 12, tubeMouth - 1.2 - i * 2.15, 2.15, 0);
  }
  const springRoot = group(lower, tubeRear + 0.4, 2.15, 0);
  const turns = 12, springLen = 20, coils = turns * 8;
  const spts = [];
  for (let i = 0; i <= coils; i++) {
    const t = i / coils;
    const a = t * turns * TAU;
    spts.push(new THREE.Vector3(t * springLen, Math.cos(a) * 0.72, Math.sin(a) * 0.72));
  }
  const spring = new THREE.Mesh(
    new THREE.TubeGeometry(new THREE.CatmullRomCurve3(spts), coils, 0.11, 5, false),
    MAT.steelB
  );
  springRoot.add(spring);
  const buffer = cylX(lower, MAT.steelD, 0.78, 2.2, 12, tubeRear, 2.15, 0);

  const stock = group(lower, -27.5, 2.15, 0);
  box(stock, MAT.polyAR, 7.5, 2.3, 1.5, -2.2, 0.15, 0);
  box(stock, MAT.polyAR, 1.3, 4.2, 1.7, -5.5, -0.4, 0);
  box(stock, MAT.polyAR, 0.45, 3.4, 2.3, -6.3, -0.2, 0);

  // Upper pivots on the front pin. Negative Z rotation lifts the rear and drops the muzzle.
  const upper = group(root, 0, 0, 0);
  upper.name = 'upper';
  const uBodyL = box(upper, MAT.ano2, 16.8, 0.2, 2.55, -7.6, 5.45, 0);
  cad(uBodyL);
  // Rail teeth
  for (let i = 0; i < 18; i++) {
    box(upper, MAT.ano, 0.22, 0.22, 1.35, -15.4 + i * 0.85, 5.68, 0);
  }
  box(upper, MAT.ano, 16.6, 2.2, 0.18, -7.5, 4.25, -1.32);
  box(upper, MAT.ano, 16.6, 0.28, 0.18, -7.5, 5.22, 1.22);
  box(upper, MAT.ano, 16.6, 0.28, 0.18, -7.5, 3.32, 1.22);
  box(upper, MAT.ano, 3.4, 1.75, 0.18, -14.15, 4.25, 1.22);
  box(upper, MAT.ano, 2.6, 1.75, 0.18, -2.15, 4.25, 1.22);
  // Rear lug (between the lower ears) and front lug.
  const rearLug = box(upper, MAT.ano2, 0.85, 0.7, 0.85, -13.6, 3.35, 0);
  cad(rearLug);
  box(upper, MAT.ano2, 0.85, 0.7, 0.85, 0, 3.4, 0);
  // Barrel nut / front
  cylX(upper, MAT.steelD, 1.15, 1.3, 12, 1.15, BORE, 0);
  const barrel = cylX(upper, MAT.steelD, 0.72, 16.5, 16, 10.2, BORE, 0);
  cad(barrel);
  cylX(upper, MAT.bore, 0.38, 0.15, 10, 18.5, BORE, 0);
  // A2-style flash hider, low poly.
  cylX(upper, MAT.steelD, 0.95, 2.3, 8, 19.3, BORE, 0);
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2 + 0.4;
    box(upper, MAT.bore, 1.4, 0.16, 0.5, 19.5, BORE + Math.cos(a) * 0.55, Math.sin(a) * 0.55);
  }
  // Gas block / front sight
  box(upper, MAT.ano, 1.5, 1.35, 1.25, 12.4, BORE + 0.7, 0);
  box(upper, MAT.ano, 0.28, 1.1, 0.28, 12.4, BORE + 1.7, 0);
  cylY(upper, MAT.steelB, 0.1, 0.35, 6, 12.4, BORE + 2.3, 0);
  // Gas tube into the upper
  cylX(upper, MAT.steelD, 0.14, 12.4, 6, 6.3, BORE + 1.15, 0);
  // Handguard halves
  box(upper, MAT.polyAR, 8.2, 0.28, 1.7, 6.6, BORE - 1.05, 0);
  box(upper, MAT.polyAR, 8.2, 0.28, 1.7, 6.6, BORE + 0.85, 0);
  box(upper, MAT.polyAR, 8.2, 1.5, 0.18, 6.6, BORE - 0.1, 0.85);
  box(upper, MAT.polyAR, 8.2, 1.5, 0.18, 6.6, BORE - 0.1, -0.85);
  axis(upper, new THREE.Vector3(-2, BORE, 0), new THREE.Vector3(20.5, BORE, 0), 0x0c6d84);

  // Charging handle: T-latch behind the upper, body in the top channel.
  const handle = group(upper, 0, 0, 0);
  handle.name = 'handle';
  box(handle, MAT.steelD, 12.5, 0.28, 0.85, -9.6, 5.05, 0);
  box(handle, MAT.ano2, 0.45, 1.15, 1.7, -16.05, 4.7, 0);
  box(handle, MAT.ano2, 0.7, 0.45, 1.9, -16.35, 5.15, 0);

  // BCG
  const carrier = group(upper, 0, 0, 0);
  carrier.name = 'bcg';
  const carrierBody = box(carrier, MAT.steelB, 9.4, 1.55, 1.55, -10.6, BORE, 0);
  cad(carrierBody);
  box(carrier, MAT.steelD, 1.3, 0.45, 0.7, -6.3, BORE + 0.85, 0); // gas key
  cylX(carrier, MAT.bore, 0.16, 0.8, 6, -5.5, BORE + 1.05, 0);
  // Cam slot hint
  box(carrier, MAT.bore, 1.4, 0.12, 0.55, -7.4, BORE + 0.72, 0.15);

  const bolt = group(carrier, -6.15, BORE, 0);
  bolt.name = 'bolt';
  cylX(bolt, MAT.steelB, 0.48, 2.3, 12, 0.85, 0, 0);
  // Seven lugs. The top lug is brighter so the 22.5° unlock reads.
  for (let i = 0; i < 7; i++) {
    const a = i * TAU / 7;
    const lug = box(bolt, i === 0 ? MAT.brass : MAT.steelB, 0.55, 0.28, 0.22,
      1.85, Math.cos(a) * 0.62, Math.sin(a) * 0.62);
    if (i === 0) cad(lug);
  }
  // Extractor claw and ejector pin — ejector is the small brass pin on the face.
  box(bolt, MAT.steelB, 1.1, 0.2, 0.16, 1.3, 0.15, 0.48);
  cylX(bolt, MAT.brass, 0.14, 0.55, 6, 2.2, -0.28, -0.32);
  // Cam pin, child of the bolt so it swings through the unlock.
  const cam = box(bolt, MAT.brass, 0.22, 0.7, 0.22, 0.15, 0.55, 0.15);
  cad(cam);

  // Rotation callout arc in the carrier, not parented to the bolt.
  const arcPts = [];
  const arcR = 1.55, arcA = Math.PI / 8;
  for (let i = 0; i <= 10; i++) {
    const a = -arcA * (i / 10);
    arcPts.push(new THREE.Vector3(-4.15, BORE + Math.cos(a) * arcR, Math.sin(a) * arcR));
  }
  const arc = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(arcPts),
    new THREE.LineBasicMaterial({ color: 0xc47b18, transparent: true, opacity: 0.0, depthTest: false })
  );
  upper.add(arc);

  const anchors = {
    pin: rearPin, upper, carrier, bolt, handle, hammer, trigger, sear, safety,
    spring: springRoot, gas: barrel, magRelease: lower
  };

  const UNLOCK = 1.35;
  function update(p) {
    // Pin slides out along its own axis toward the shooter's right (-Z) before the upper moves.
    rearPin.position.z = -2.55 * p.pin;
    upper.rotation.z = -THREE.MathUtils.degToRad(p.upper);
    carrier.position.x = -p.bcg;
    handle.position.x = -p.bcg;
    const spin = smoother01(clamp(p.bcg / UNLOCK, 0, 1));
    bolt.rotation.x = -arcA * spin;
    arc.material.opacity = spin > 0.02 && spin < 0.98 ? 0.95 : (p.bcg > UNLOCK ? 0.35 : 0);
    const open = clamp(p.upper / 34, 0, 1);
    const out = clamp(p.bcg / 9.2, 0, 1);
    const extend = open * out;
    const scale = 0.52 + 0.48 * extend;
    springRoot.scale.x = scale;
    buffer.position.x = (tubeRear + 0.4) + springLen * scale + 1.15;
    // Hammer is held cocked; the carrier keeps it down when home.
    hammer.rotation.z = -0.15 * (1 - out);
  }
  update(sampleAR(0));
  return { root, edges, update, anchors, arc };
}

const canvas = document.getElementById('c');

const scene = new THREE.Scene();

const uspL = new THREE.Group();

const shadowTex = pixelTex(128, (g) => {
  const grd = g.createRadialGradient(64, 64, 8, 64, 64, 64);
  grd.addColorStop(0, 'rgba(0,0,0,0.38)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');

}, 1, 1);
shadowTex.colorSpace = THREE.NoColorSpace;
const shadow = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1),

);

  new THREE.PlaneGeometry(160, 160),

floor.rotation.x = -Math.PI / 2;

grid.position.y = -12.55;
scene.add(grid);

const camera = new THREE.OrthographicCamera(-10, 10, 10, -10, 0.1, 400);
const target = new THREE.Vector3();
const cam = {
  usp: { target: [11.2, -5.4, 0], theta: 0.52, phi: 1.1, radius: 62, view: 15.2, zoom: 1 },
  ar: { target: [-5.2, 2.6, 0], theta: 0.96, phi: 1.18, radius: 72, view: 15.8, zoom: 1 }
};
let mode = 'usp';
let theta = cam.usp.theta, phi = cam.usp.phi, radius = cam.usp.radius, viewSize = cam.usp.view;
target.set(cam.usp.target[0], cam.usp.target[1], cam.usp.target[2]);
camera.zoom = 1;

const bbox = new THREE.Box3();
const tmp = new THREE.Vector3();

function applyMode(next) {
  mode = next;
  document.body.classList.toggle('ar', mode === 'ar');
  usp.root.visible = mode === 'usp';
  ar.root.visible = mode === 'ar';
  uspL.visible = mode === 'usp';
  arL.visible = mode === 'ar';
  floor.visible = mode === 'ar';
  grid.visible = mode === 'ar';
  shadow.visible = mode === 'usp';
  const bg = mode === 'usp' ? 0xd2d3d6 : 0xc5c8cc;
  renderer.setClearColor(bg, 1);
  scene.background.setHex(bg);
  document.getElementById('title').textContent = mode === 'usp' ? 'USP MATCH' : 'AR-15';
  document.getElementById('kicker').textContent = mode === 'usp'
    ? 'LOW-POLY / PS1 · HALF-LIFE'
    : '剖视 · 影棚布光 · CAD';
  document.getElementById('legend-title').textContent = mode === 'usp' ? '部件 · 点击定位' : '机构 · 点击定位';
  document.getElementById('btn-shut').textContent = mode === 'usp' ? '闭锁姿态' : '闭合姿态';
  document.getElementById('btn-usp').classList.toggle('on', mode === 'usp');
  document.getElementById('btn-ar').classList.toggle('on', mode === 'ar');
  const preset = cam[mode];
  target.set(preset.target[0], preset.target[1], preset.target[2]);
  theta = preset.theta; phi = preset.phi; radius = preset.radius;
  viewSize = preset.view; camera.zoom = preset.zoom;
  buildLegend();
  buildMarks();
  resize();
}

function buildLegend() {
  const host = document.getElementById('legend');
  host.innerHTML = '';
  const items = mode === 'usp' ? USP_LEGEND : AR_LEGEND;
  items.forEach((item) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = '<i class="swatch" style="background:' + item[1] + '"></i><span>' + item[0] + '</span>';
    b.addEventListener('click', () => {
      seekTo = item[2];
      playing = true;
    });
    host.appendChild(b);
  });
}
function buildMarks() {
  const host = document.getElementById('marks');
  host.innerHTML = '';
  const list = mode === 'usp' ? USP_PHASES : AR_PHASES;
  list.forEach((p) => {
    const s = document.createElement('span');
    s.style.left = (p[0] * 100) + '%';
    host.appendChild(s);
  });
}

let playing = true;
let speed = 1;
let u = 0;
let seekTo = null;
let uspEdgesOn = false;
const speeds = [0.5, 1, 1.5, 2];
const uiOn = true;

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.setSize(w, h, false);
  const aspect = w / Math.max(1, h);
  const base = cam[mode].view;
  // base is the half-height tuned for a 16:9 frame. Narrow windows grow the
  // vertical span so the same horizontal extent still fits.
  viewSize = Math.max(base, (base * 16 / 9) / Math.max(aspect, 0.28));
  camera.left = -viewSize * aspect;
  camera.right = viewSize * aspect;
  camera.top = viewSize;
  camera.bottom = -viewSize;
  camera.updateProjectionMatrix();
}

function updateCamera() {
  const sp = Math.sin(phi);
  camera.position.set(
    target.x + radius * sp * Math.sin(theta),
    target.y + radius * Math.cos(phi),
    target.z + radius * sp * Math.cos(theta)
  );
  camera.up.set(0, 1, 0);
  camera.lookAt(target);
  camera.updateMatrixWorld();
}

const leaderSvg = document.getElementById('leader-svg');
const leaderHost = document.getElementById('leaders');
function clearLeaders() {
  leaderSvg.innerHTML = '';
  leaderHost.innerHTML = '';
}
function leader(obj, text, ox, oy) {
  obj.getWorldPosition(tmp);
  tmp.project(camera);
  if (tmp.z < -1 || tmp.z > 1) return;
  const x = (tmp.x * 0.5 + 0.5) * canvas.clientWidth;
  const y = (-tmp.y * 0.5 + 0.5) * canvas.clientHeight;
  const lx = x + ox, ly = y + oy;
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', x); line.setAttribute('y1', y);
  line.setAttribute('x2', lx); line.setAttribute('y2', ly);
  line.setAttribute('stroke', '#0c6d84');
  line.setAttribute('stroke-width', '1');
  leaderSvg.appendChild(line);
  const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.setAttribute('r', '2.5');
  dot.setAttribute('fill', '#c47b18');
  leaderSvg.appendChild(dot);
  const tag = document.createElement('div');
  tag.className = 'tag';
  tag.textContent = text;
  tag.style.left = lx + 'px';
  tag.style.top = ly + 'px';
  leaderHost.appendChild(tag);
}

let syncing = false;
const seek = document.getElementById('seek');
function setSeek(value) {
  syncing = true;
  seek.value = String(Math.round(clamp(value, 0, 0.999) * 1000));
  syncing = false;
}

function refreshLabels() {
  const list = mode === 'usp' ? USP_PHASES : AR_PHASES;
  const ph = phaseAt(list, u);
  document.getElementById('phase').innerHTML = '<b>' + ph[2] + '</b>';
  document.getElementById('blurb').textContent = ph[3];
  if (mode === 'usp') {
    const p = sampleUSP(u);
    const tilt = smoother01(clamp((p.slide - 3.1) / 2.1, 0, 1)) * 0.04 * 180 / Math.PI;
    document.getElementById('readout').textContent =
      't ' + u.toFixed(2) +
      '   套筒后移 ' + p.slide.toFixed(1) + ' cm' +
      '   弹匣抽出 ' + p.mag.toFixed(1) + ' cm' +
      '   配重分离 ' + p.comp.toFixed(1) + ' cm' +
      '   枪管俯角 ' + tilt.toFixed(1) + '°';
  } else {
    const p = sampleAR(u);
    const spin = smoother01(clamp(p.bcg / 1.35, 0, 1)) * 22.5;
    document.getElementById('readout').textContent =
      't ' + u.toFixed(2) +
      '   上机匣 ' + p.upper.toFixed(1) + '°' +
      '   后销 ' + (p.pin > 0.85 ? '已退出' : p.pin < 0.05 ? '在位' : '移动中') +
      '   枪机框 ' + (p.bcg * 10).toFixed(0) + ' mm' +
      '   枪机头 ' + spin.toFixed(1) + '°';
  }
}

function frame(dt) {
  if (seekTo != null) {
    let ahead = seekTo - u;
    if (ahead < -1e-4) ahead += 1;
    if (ahead < 0.004) { u = seekTo; seekTo = null; playing = false; }
    else u = (u + Math.min(ahead, dt * 0.42)) % 1;
  } else if (playing) {
    const dur = mode === 'usp' ? 12 : 16;
    u = (u + (dt * speed) / dur) % 1;
  }
  if (mode === 'usp') usp.update(sampleUSP(u));
  else ar.update(sampleAR(u));
  updateCamera();
  if (mode === 'usp') {
    bbox.setFromObject(usp.root);
    shadow.position.set((bbox.min.x + bbox.max.x) / 2, bbox.min.y - 0.12, 0);
    const w = Math.max(8, bbox.max.x - bbox.min.x);
    shadow.scale.set(w * 0.72, w * 0.42, 1);
  }
  clearLeaders();
  if (uiOn && mode === 'ar') {
    const p = sampleAR(u);
    if (p.pin > 0.15 && p.upper < 8) leader(ar.anchors.pin, '后分解销', -130, -28);
    if (p.upper > 8 && p.bcg < 1) leader(ar.anchors.upper, '绕前枢轴', 40, -56);
    if (p.bcg > 0.4) leader(ar.anchors.bolt, '枪机头旋转解锁', 90, -36);
    if (p.bcg > 6 && p.upper > 20) leader(ar.anchors.spring, '复进簧', -20, 36);
  }
  refreshLabels();
  setSeek(u);
  renderer.render(scene, camera);
}

applyMode('usp');
usp.edges.forEach((e) => { e.visible = false; });

const params = new URLSearchParams(location.hash.replace(/^#/, ''));
if (params.get('mode') === 'ar') applyMode('ar');
if (params.get('t')) u = clamp(parseFloat(params.get('t')) || 0, 0, 0.999);
if (params.get('play') === '0') playing = false;
if (params.get('ui') === '0') document.getElementById('ui').style.display = 'none';
if (matchMedia('(prefers-reduced-motion: reduce)').matches && !params.get('play')) playing = false;
document.getElementById('btn-play').textContent = playing ? '暂停' : '播放';

document.getElementById('btn-play').addEventListener('click', () => {
  playing = !playing; seekTo = null;
  document.getElementById('btn-play').textContent = playing ? '暂停' : '播放';
});
document.getElementById('btn-explode').addEventListener('click', () => { seekTo = 0; playing = true; });
document.getElementById('btn-shut').addEventListener('click', () => { seekTo = mode === 'usp' ? 0.64 : 0.02; playing = true; });
document.getElementById('btn-speed').addEventListener('click', () => {
  const i = speeds.indexOf(speed);
  speed = speeds[(i + 1) % speeds.length];
  document.getElementById('btn-speed').textContent = speed + '×';
});
document.getElementById('btn-edges').addEventListener('click', () => {
  if (mode === 'usp') {
    uspEdgesOn = !uspEdgesOn;
    usp.edges.forEach((e) => { e.visible = uspEdgesOn; });
  } else {
    const on = !ar.edges[0].visible;
    ar.edges.forEach((e) => { e.visible = on; });
  }
  document.getElementById('btn-edges').classList.toggle('on', mode === 'usp' ? uspEdgesOn : ar.edges[0].visible);
});
function resetCam() {
  const preset = cam[mode];
  target.set(preset.target[0], preset.target[1], preset.target[2]);
  theta = preset.theta; phi = preset.phi; radius = preset.radius;
  viewSize = preset.view; camera.zoom = preset.zoom;
  resize();
}
document.getElementById('btn-cam').addEventListener('click', resetCam);
document.getElementById('btn-usp').addEventListener('click', () => { applyMode('usp'); u = 0; seekTo = null; });
document.getElementById('btn-ar').addEventListener('click', () => { applyMode('ar'); u = 0; seekTo = null; });
seek.addEventListener('input', () => {
  if (syncing) return;
  u = Number(seek.value) / 1000;
  playing = false;
  seekTo = null;
  document.getElementById('btn-play').textContent = '播放';
});

canvas.addEventListener('contextmenu', (e) => e.preventDefault());
let drag = null, lx = 0, ly = 0;
canvas.addEventListener('pointerdown', (e) => {
  drag = e.button;
  lx = e.clientX; ly = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('pointermove', (e) => {
  if (drag == null) return;
  const dx = e.clientX - lx, dy = e.clientY - ly;
  lx = e.clientX; ly = e.clientY;
  if (drag === 2 || e.shiftKey) {
    const scale = (2 * viewSize / camera.zoom) / canvas.clientHeight;
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
    const up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
    target.addScaledVector(right, -dx * scale);
    target.addScaledVector(up, dy * scale);
  } else {
    theta -= dx * 0.005;
    phi = clamp(phi - dy * 0.005, 0.28, 1.45);
  }
});
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  camera.zoom = clamp(camera.zoom * Math.exp(-e.deltaY * 0.001), 0.35, 5);
  camera.updateProjectionMatrix();
}, { passive: false });
canvas.addEventListener('dblclick', resetCam);
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    playing = !playing; seekTo = null;
    document.getElementById('btn-play').textContent = playing ? '暂停' : '播放';
  } else if (e.key === '1') { applyMode('usp'); u = 0; }
  else if (e.key === '2') { applyMode('ar'); u = 0; }
  else if (e.key === 'f' || e.key === 'F') resetCam();
});
window.addEventListener('resize', resize);

let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const playingBefore = playing;
  frame(dt || 0);
  if (playingBefore !== playing) document.getElementById('btn-play').textContent = playing ? '暂停' : '播放';
  requestAnimationFrame(tick);
}
resize();
frame(0);
requestAnimationFrame(tick);

window.addEventListener('error', (e) => {
  const el = document.getElementById('boot-error');
  el.hidden = false;
  el.textContent = String(e.message || e.error || 'error');
});
</script>
