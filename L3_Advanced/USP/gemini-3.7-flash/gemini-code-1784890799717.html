<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USP Match - Retro 3D Exploded View & Mechanical Animation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #d8dcd0;
            color: #111;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Retro WebGL Canvas Container */
        #viewport-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #e2e6dd 0%, #c4cbbe 100%);
        }

        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* 90s FPS HUD Overlay UI */
        .hud-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }

        .hud-title {
            background: rgba(20, 25, 20, 0.85);
            color: #39ff14;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1.5px;
            border: 1px solid #39ff14;
            box-shadow: 3px 3px 0px #000;
            text-transform: uppercase;
        }

        .hud-status {
            margin-top: 6px;
            background: rgba(0, 0, 0, 0.7);
            color: #00e5ff;
            padding: 4px 10px;
            font-size: 11px;
            display: inline-block;
            border-left: 3px solid #00e5ff;
        }

        /* Interactive Controls Bar */
        .controls-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(25, 28, 26, 0.92);
            border: 2px solid #556052;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.4);
            padding: 12px 20px;
            display: flex;
            gap: 18px;
            align-items: center;
            z-index: 20;
            border-radius: 2px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #d0d5ce;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: bold;
        }

        button {
            background: #3a4238;
            color: #39ff14;
            border: 1px solid #39ff14;
            padding: 6px 12px;
            font-family: inherit;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 2px 2px 0px #000;
            transition: all 0.1s ease;
        }

        button:hover {
            background: #39ff14;
            color: #000;
        }

        button:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #000;
        }

        input[type="range"] {
            appearance: none;
            width: 130px;
            height: 6px;
            background: #111;
            border: 1px solid #555;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            background: #39ff14;
            cursor: pointer;
            border: 1px solid #000;
        }

        /* Floating Component Labels */
        .part-label {
            position: absolute;
            color: #000;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #000;
            padding: 2px 6px;
            font-size: 10px;
            font-weight: bold;
            pointer-events: none;
            transform: translate(-50%, -100%);
            white-space: nowrap;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.3);
            display: none;
            z-index: 15;
        }

        .part-label::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px 5px 0;
            border-style: solid;
            border-color: #000 transparent;
            display: block;
            width: 0;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="viewport-container">
        <div class="hud-overlay">
            <div class="hud-title">USP MATCH // 9mm x 19</div>
            <div class="hud-status" id="hud-mode">MODE: LOOP ANIMATION [60 FPS]</div>
        </div>

        <div id="lbl-slide" class="part-label">SLIDE (LOCKED BACK)</div>
        <div id="lbl-barrel" class="part-label">SILVER BARREL & CHAMBER</div>
        <div id="lbl-comp" class="part-label">MATCH COMPENSATOR WEIGHT</div>
        <div id="lbl-frame" class="part-label">POLYMER LOWER FRAME</div>
        <div id="lbl-mag" class="part-label">DETACHED MAGAZINE</div>
        <div id="lbl-sights" class="part-label">FIBER OPTIC SIGHTS (RED/GREEN)</div>

        <div class="controls-bar">
            <button id="btn-play">PAUSE LOOP</button>

            <div class="control-group">
                <label for="slider-explode">EXPLODE:</label>
                <input type="range" id="slider-explode" min="0" max="1" step="0.001" value="0">
            </div>

            <div class="control-group">
                <button id="btn-cam">VIEW: ORTHO ISOMETRIC</button>
            </div>

            <div class="control-group">
                <button id="btn-pixel">RETRO PIXELS: ON</button>
            </div>

            <div class="control-group">
                <button id="btn-labels">LABELS: ON</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. SCENE & RETRO RENDERER SETUP ---
        const container = document.getElementById('viewport-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xd2d7ce); // Neutral light grey background

        // Retro Lighting - Crisp High-Contrast Facets
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.85);
        dirLight1.position.set(5, 10, 7);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0x88aacc, 0.4);
        dirLight2.position.set(-5, -5, -5);
        scene.add(dirLight2);

        // Dual Camera Setup (Orthographic & Perspective)
        const aspect = window.innerWidth / window.innerHeight;
        const frustumSize = 7.5;
        
        const orthoCam = new THREE.OrthographicCamera(
            (frustumSize * aspect) / -2, (frustumSize * aspect) / 2,
            frustumSize / 2, frustumSize / -2,
            0.1, 1000
        );
        orthoCam.position.set(5, 3.5, 6);

        const persCam = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);
        persCam.position.set(5, 3.5, 6);

        let activeCam = orthoCam;

        // Renderer with Low-Res Retro Pixelation Option
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setPixelRatio(1);
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(activeCam, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.15;
        controls.target.set(0, 0, 0);

        // --- 2. MATERIALS (FLAT SHADED 90s FPS PALETTE) ---
        const matPolymer = new THREE.MeshLambertMaterial({ color: 0x1c1e20, flatShading: true }); // Dark frame
        const matSteel = new THREE.MeshStandardMaterial({ color: 0x33373b, roughness: 0.5, metalness: 0.6, flatShading: true }); // Dark slide
        const matSilver = new THREE.MeshStandardMaterial({ color: 0xe0e6ed, roughness: 0.2, metalness: 0.9, flatShading: true }); // Bright silver barrel
        const matComp = new THREE.MeshLambertMaterial({ color: 0x222528, flatShading: true }); // Front Match weight
        const matMag = new THREE.MeshStandardMaterial({ color: 0x282c30, roughness: 0.4, metalness: 0.7, flatShading: true }); // Mag body
        const matBrass = new THREE.MeshStandardMaterial({ color: 0xd4af37, roughness: 0.3, metalness: 0.8, flatShading: true }); // 9mm round top
        
        // High-Contrast Glowing Fiber Optic Sights
        const matFiberRed = new THREE.MeshBasicMaterial({ color: 0xff0033 });
        const matFiberGreen = new THREE.MeshBasicMaterial({ color: 0x00ff44 });

        // --- 3. PROCEDURAL LOW-POLY USP MATCH MODEL BUILDER ---
        const pistolGroup = new THREE.Group();
        scene.add(pistolGroup);

        // A. LOWER POLYMER FRAME
        const frameGroup = new THREE.Group();
        
        // Main Frame Body
        const frameBaseGeo = new THREE.BoxGeometry(0.7, 0.7, 3.0);
        const frameBase = new THREE.Mesh(frameBaseGeo, matPolymer);
        frameBase.position.set(0, -0.15, 0.1);
        frameGroup.add(frameBase);

        // Angled Pistol Grip
        const gripGeo = new THREE.BoxGeometry(0.65, 2.0, 1.1);
        const grip = new THREE.Mesh(gripGeo, matPolymer);
        grip.rotation.x = -0.22;
        grip.position.set(0, -1.0, -0.5);
        frameGroup.add(grip);

        // Trigger Guard & Trigger
        const guardGeo = new THREE.BoxGeometry(0.2, 0.5, 0.8);
        const guard = new THREE.Mesh(guardGeo, matPolymer);
        guard.position.set(0, -0.5, 0.35);
        frameGroup.add(guard);

        const trigGeo = new THREE.BoxGeometry(0.1, 0.3, 0.15);
        const trigger = new THREE.Mesh(trigGeo, matSteel);
        trigger.rotation.x = -0.3;
        trigger.position.set(0, -0.45, 0.3);
        frameGroup.add(trigger);

        // Mag Release Button & Slide Stop
        const stopGeo = new THREE.BoxGeometry(0.76, 0.12, 0.5);
        const slideStop = new THREE.Mesh(stopGeo, matSteel);
        slideStop.position.set(0, 0.15, -0.1);
        frameGroup.add(slideStop);

        pistolGroup.add(frameGroup);

        // B. EXPOSED SILVER BARREL & CHAMBER BLOCK
        const barrelGroup = new THREE.Group();
        
        // Chamber Block (Square Rear)
        const chamberGeo = new THREE.BoxGeometry(0.62, 0.55, 0.8);
        const chamber = new THREE.Mesh(chamberGeo, matSilver);
        chamber.position.set(0, 0.32, -0.1);
        barrelGroup.add(chamber);

        // Round Barrel Tube
        const tubeGeo = new THREE.CylinderGeometry(0.22, 0.22, 2.8, 8);
        const tube = new THREE.Mesh(tubeGeo, matSilver);
        tube.rotation.x = Math.PI / 2;
        tube.position.set(0, 0.35, 1.1);
        barrelGroup.add(tube);

        pistolGroup.add(barrelGroup);

        // C. DARK METAL SLIDE (LOCKED BACK POSITION ENABLED)
        const slideGroup = new THREE.Group();
        
        // Main Slide Body
        const slideGeo = new THREE.BoxGeometry(0.68, 0.75, 3.4);
        const slideBody = new THREE.Mesh(slideGeo, matSteel);
        slideBody.position.set(0, 0.42, 0.1);
        slideGroup.add(slideBody);

        // Ejection Port Cutout Area
        const ejectCut = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.4, 0.75), matPolymer);
        ejectCut.position.set(0.2, 0.5, -0.1);
        // (Visual detail cut out simulated via overlap)

        // Rear Slide Serrations
        for(let i = 0; i < 5; i++) {
            const serration = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.5, 0.05), matPolymer);
            serration.position.set(0, 0.42, -1.1 + (i * 0.1));
            slideGroup.add(serration);
        }

        // Sights Group Attached to Slide
        const sightsGroup = new THREE.Group();
        
        // Rear Sight Block
        const rearSightBlock = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.25), matComp);
        rearSightBlock.position.set(0, 0.85, -1.4);
        sightsGroup.add(rearSightBlock);

        // Dual Red Fiber Optic Rods (Rear)
        const redDot1 = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.26, 6), matFiberRed);
        redDot1.rotation.x = Math.PI / 2;
        redDot1.position.set(-0.12, 0.88, -1.4);
        const redDot2 = redDot1.clone();
        redDot2.position.x = 0.12;
        sightsGroup.add(redDot1);
        sightsGroup.add(redDot2);

        // Front Sight Blade
        const frontSightBlock = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.22, 0.2), matComp);
        frontSightBlock.position.set(0, 0.85, 1.6);
        sightsGroup.add(frontSightBlock);

        // Bright Green Fiber Optic Rod (Front)
        const greenDot = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.22, 6), matFiberGreen);
        greenDot.rotation.x = Math.PI / 2;
        greenDot.position.set(0, 0.88, 1.6);
        sightsGroup.add(greenDot);

        slideGroup.add(sightsGroup);
        pistolGroup.add(slideGroup);

        // D. ATTACHED FRONT MATCH COMPENSATOR WEIGHT
        const compGroup = new THREE.Group();
        
        // Match Weight Block Extension
        const compBodyGeo = new THREE.BoxGeometry(0.72, 0.95, 1.1);
        const compBody = new THREE.Mesh(compBodyGeo, matComp);
        compBody.position.set(0, 0.22, 2.2);
        compGroup.add(compBody);

        // Front Vent Cuts
        const ventGeo = new THREE.BoxGeometry(0.76, 0.15, 0.25);
        const vent1 = new THREE.Mesh(ventGeo, matPolymer);
        vent1.position.set(0, 0.45, 2.0);
        const vent2 = vent1.clone();
        vent2.position.z = 2.4;
        compGroup.add(vent1);
        compGroup.add(vent2);

        pistolGroup.add(compGroup);

        // E. DETACHED MAGAZINE
        const magGroup = new THREE.Group();
        
        // Steel Magazine Tube
        const magBodyGeo = new THREE.BoxGeometry(0.5, 1.9, 0.9);
        const magBody = new THREE.Mesh(magBodyGeo, matMag);
        magBody.rotation.x = -0.22;
        magBody.position.set(0, -1.0, -0.5);
        magGroup.add(magBody);

        // Extended Polymer Base Pad
        const basePadGeo = new THREE.BoxGeometry(0.65, 0.25, 1.1);
        const basePad = new THREE.Mesh(basePadGeo, matPolymer);
        basePad.rotation.x = -0.22;
        basePad.position.set(0, -1.9, -0.7);
        magGroup.add(basePad);

        // Top 9mm Round (Brass Top visible when detached)
        const roundGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.5, 8);
        const round = new THREE.Mesh(roundGeo, matBrass);
        round.rotation.x = Math.PI / 2 - 0.22;
        round.position.set(0, -0.05, -0.3);
        magGroup.add(round);

        pistolGroup.add(magGroup);

        // Center pistol scene offset
        pistolGroup.position.set(0, 0.2, 0);

        // --- 4. EXPLODED VIEW & ASSEMBLY ANIMATION ENGINE ---
        let isPlaying = true;
        let animProgress = 0.0; // 0 = Assembled, 1 = Full Exploded View
        let animDirection = 1;
        const cycleSpeed = 0.006;

        // Base/Exploded Coordinate Maps
        const transforms = {
            frame: { basePos: new THREE.Vector3(0, -0.1, 0), expPos: new THREE.Vector3(0, -0.8, 0) },
            slide: { basePos: new THREE.Vector3(0, 0, 0), expPos: new THREE.Vector3(0, 1.6, -0.6) },
            barrel: { basePos: new THREE.Vector3(0, 0, 0), expPos: new THREE.Vector3(0, 2.7, 0.6) },
            comp: { basePos: new THREE.Vector3(0, 0, 0), expPos: new THREE.Vector3(0, 0.2, 3.8) },
            mag: { basePos: new THREE.Vector3(0, 0, 0), expPos: new THREE.Vector3(0, -2.9, -0.7) },
            sights: { basePos: new THREE.Vector3(0, 0, 0), expPos: new THREE.Vector3(0, 0.6, 0) }
        };

        function updateAssembly(progress) {
            // Smooth cubic easing for realistic mechanical movement
            const t = progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;

            // 1. Frame Pos
            frameGroup.position.lerpVectors(transforms.frame.basePos, transforms.frame.expPos, t);
            
            // 2. Slide Lerp + Locked Back Racking Effect
            slideGroup.position.lerpVectors(transforms.slide.basePos, transforms.slide.expPos, t);
            // Simulate Slide Lock-back offset during partial assemble
            const rackOffset = Math.sin(t * Math.PI) * -0.6;
            slideGroup.position.z += rackOffset * (1 - t);

            // 3. Barrel Lerp
            barrelGroup.position.lerpVectors(transforms.barrel.basePos, transforms.barrel.expPos, t);

            // 4. Compensator Lerp
            compGroup.position.lerpVectors(transforms.comp.basePos, transforms.comp.expPos, t);

            // 5. Magazine Lerp
            magGroup.position.lerpVectors(transforms.mag.basePos, transforms.mag.expPos, t);

            // 6. Sights slight lift off slide in full explode
            sightsGroup.position.lerpVectors(transforms.sights.basePos, transforms.sights.expPos, t);

            // Update UI Slider
            document.getElementById('slider-explode').value = progress;
        }

        // --- 5. FLOATING HUD LABELS POSITIONING ---
        const labelMap = [
            { el: document.getElementById('lbl-slide'), obj: slideGroup },
            { el: document.getElementById('lbl-barrel'), obj: barrelGroup },
            { el: document.getElementById('lbl-comp'), obj: compGroup },
            { el: document.getElementById('lbl-frame'), obj: frameGroup },
            { el: document.getElementById('lbl-mag'), obj: magGroup },
            { el: document.getElementById('lbl-sights'), obj: sightsGroup }
        ];

        let showLabels = true;

        function updateLabels() {
            if (!showLabels) {
                labelMap.forEach(item => item.el.style.display = 'none');
                return;
            }

            const tempV = new THREE.Vector3();
            labelMap.forEach(item => {
                item.obj.getWorldPosition(tempV);
                tempV.project(activeCam);

                // Convert to screen pixels
                const x = (tempV.x * .5 + .5) * window.innerWidth;
                const y = (tempV.y * -.5 + .5) * window.innerHeight;

                // Hide if behind camera clip plane
                if (tempV.z > 1.0) {
                    item.el.style.display = 'none';
                } else {
                    item.el.style.display = 'block';
                    item.el.style.left = `${x}px`;
                    item.el.style.top = `${y}px`;
                }
            });
        }

        // --- 6. MAIN ANIMATION LOOP (60 FPS) ---
        function animate() {
            requestAnimationFrame(animate);

            // Auto-Cycle Assembly/Disassembly
            if (isPlaying) {
                animProgress += cycleSpeed * animDirection;
                if (animProgress >= 1.0) {
                    animProgress = 1.0;
                    animDirection = -1; // Reverse to assemble
                } else if (animProgress <= 0.0) {
                    animProgress = 0.0;
                    animDirection = 1; // Reverse to disassemble
                }
                updateAssembly(animProgress);
            }

            // Smooth Slow Turntable Rotation when user isn't dragging
            if (!controls.state == -1) {
                pistolGroup.rotation.y += 0.003;
            }

            controls.update();
            updateLabels();
            renderer.render(scene, activeCam);
        }

        // --- 7. EVENT LISTENERS & UI CONTROLS ---
        // Play / Pause Toggle
        const btnPlay = document.getElementById('btn-play');
        btnPlay.addEventListener('click', () => {
            isPlaying = !isPlaying;
            btnPlay.innerText = isPlaying ? 'PAUSE LOOP' : 'PLAY LOOP';
            document.getElementById('hud-mode').innerText = isPlaying 
                ? 'MODE: LOOP ANIMATION [60 FPS]' 
                : 'MODE: MANUAL EXPLODED INSPECTION';
        });

        // Explode Slider Manual Control
        const sliderExplode = document.getElementById('slider-explode');
        sliderExplode.addEventListener('input', (e) => {
            isPlaying = false;
            btnPlay.innerText = 'PLAY LOOP';
            document.getElementById('hud-mode').innerText = 'MODE: MANUAL EXPLODED INSPECTION';
            animProgress = parseFloat(e.target.value);
            updateAssembly(animProgress);
        });

        // Camera View Switcher (Ortho Isometric vs Perspective)
        const btnCam = document.getElementById('btn-cam');
        btnCam.addEventListener('click', () => {
            if (activeCam === orthoCam) {
                activeCam = persCam;
                btnCam.innerText = 'VIEW: PERSPECTIVE 3D';
            } else {
                activeCam = orthoCam;
                btnCam.innerText = 'VIEW: ORTHO ISOMETRIC';
            }
            controls.object = activeCam;
            activeCam.position.set(5, 3.5, 6);
            controls.update();
        });

        // Retro Pixelation Switcher (384x216 Low-Res Scaling vs HD Native)
        let isPixelated = true;
        const btnPixel = document.getElementById('btn-pixel');
        btnPixel.addEventListener('click', () => {
            isPixelated = !isPixelated;
            btnPixel.innerText = isPixelated ? 'RETRO PIXELS: ON' : 'RETRO PIXELS: OFF';
            
            if (isPixelated) {
                renderer.setPixelRatio(0.35); // Crunchy PS1/HL1 low resolution
            } else {
                renderer.setPixelRatio(window.devicePixelRatio); // Crisp modern rendering
            }
        });

        // Labels Toggle
        const btnLabels = document.getElementById('btn-labels');
        btnLabels.addEventListener('click', () => {
            showLabels = !showLabels;
            btnLabels.innerText = showLabels ? 'LABELS: ON' : 'LABELS: OFF';
        });

        // Window Resize Handler
        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;

            orthoCam.left = (frustumSize * aspect) / -2;
            orthoCam.right = (frustumSize * aspect) / 2;
            orthoCam.top = frustumSize / 2;
            orthoCam.bottom = frustumSize / -2;
            orthoCam.updateProjectionMatrix();

            persCam.aspect = aspect;
            persCam.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize Default State
        renderer.setPixelRatio(0.35); // Start in authentic pixelated retro mode
        animate();

    </script>
</body>
</html>
