<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>USP MATCH · Low-Poly Mechanical Disassembly</title>
<style>
  :root{
    --panel: rgba(13,15,19,0.82);
    --panel2: rgba(20,23,28,0.92);
    --line: #454c57;
    --line2: #2b313a;
    --txt: #d5d9de;
    --dim: #8d949d;
    --accent: #ffb000;
    --green: #00ff66;
    --red: #ff2b2b;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; background:#0e0f12;
    font-family:"Courier New", ui-monospace, "SFMono-Regular", Consolas, monospace;
    color:var(--txt);
    -webkit-user-select:none; user-select:none;
  }
  #scene{
    position:fixed; inset:0; width:100%; height:100%;
    display:block; cursor:grab; image-rendering:pixelated; image-rendering:crisp-edges;
  }
  #scene.dragging{ cursor:grabbing; }
  #scene.panning{ cursor:move; }
  #scanlines{
    position:fixed; inset:0; pointer-events:none; z-index:2; opacity:0.10;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0.55) 0px, rgba(0,0,0,0.55) 1px,
                transparent 1px, transparent 3px);
    mix-blend-mode:multiply;
  }
  #vignette{
    position:fixed; inset:0; pointer-events:none; z-index:2;
    background:radial-gradient(ellipse at center, transparent 52%, rgba(8,9,12,0.42) 100%);
  }
  #labels{
    position:fixed; inset:0; pointer-events:none; z-index:3;
  }
  #labelCanvas{
    position:absolute; inset:0; width:100%; height:100%; pointer-events:none;
  }
  .callout{
    position:absolute; left:0; top:0; white-space:nowrap;
    transform:translate(-50%,-50%);
    font-size:10px; letter-spacing:0.14em; line-height:1.35;
    color:var(--txt); pointer-events:none; opacity:0.92;
    text-shadow:0 1px 2px rgba(0,0,0,0.85);
  }
  .callout b{
    display:block; font-weight:700; font-size:12px;
  }
  .callout i{
    display:block; font-style:normal; font-size:9px; color:var(--dim);
    letter-spacing:0.08em;
  }
  .callout .dot{
    display:inline-block; width:5px; height:5px; margin-right:5px;
    vertical-align:1px; background:currentColor;
  }
  #hud{
    position:fixed; inset:0; z-index:4; pointer-events:none;
  }
  #header{
    position:absolute; top:18px; left:20px; pointer-events:none;
  }
  #header h1{
    margin:0; font-size:20px; letter-spacing:0.22em; font-weight:700;
    color:#f0f2f4; text-shadow:0 2px 0 #000, 0 0 14px rgba(255,176,0,0.25);
  }
  #header h1 span{ color:var(--accent); }
  #header .sub{
    margin-top:5px; font-size:10px; letter-spacing:0.28em; color:var(--dim);
  }
  #header .sub b{ color:var(--accent); font-weight:700; }
  #modeBadge{
    position:absolute; top:18px; right:20px; text-align:right; pointer-events:none;
    font-size:10px; letter-spacing:0.2em; color:var(--dim);
  }
  #modeBadge .m1{
    display:block; font-size:15px; font-weight:700; letter-spacing:0.18em; color:var(--txt);
  }
  #modeBadge .m2{ margin-top:4px; }
  #modeBadge .m2 b{ color:var(--green); font-weight:700; }
  #phaseRead{
    position:absolute; top:74px; left:20px; font-size:11px; letter-spacing:0.1em;
    color:var(--dim); pointer-events:none;
  }
  #phaseRead b{ color:var(--accent); font-weight:700; }
  #hint{
    position:absolute; bottom:96px; right:20px; font-size:10px; letter-spacing:0.12em;
    color:var(--dim); pointer-events:none; text-align:right; line-height:1.8;
  }
  #hint b{ color:var(--txt); }
  #controls{
    position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
    display:flex; align-items:center; gap:8px; pointer-events:auto;
    padding:10px 12px; background:var(--panel); border:1px solid var(--line);
    box-shadow:0 8px 30px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.03);
  }
  .seg{ display:flex; gap:2px; padding:2px; background:var(--panel2); border:1px solid var(--line2); }
  button{
    pointer-events:auto; cursor:pointer; border:1px solid var(--line);
    background:linear-gradient(180deg,#1b1f25,#121519); color:var(--txt);
    font-family:inherit; font-size:11px; letter-spacing:0.12em;
    padding:7px 11px; min-width:42px; text-align:center;
  }
  button:hover{ border-color:var(--accent); color:#fff; }
  button.active{
    background:linear-gradient(180deg,#2c2510,#191307); border-color:var(--accent);
    color:var(--accent); text-shadow:0 0 8px rgba(255,176,0,0.55);
  }
  button.warn.active{
    background:linear-gradient(180deg,#20140f,#140d08); border-color:#ff8a3d; color:#ffb066;
  }
  #timelineWrap{
    display:flex; align-items:center; gap:9px; min-width:280px;
    border:1px solid var(--line2); background:var(--panel2); padding:5px 9px;
  }
  #timelineWrap label{ font-size:10px; letter-spacing:0.18em; color:var(--dim); }
  input[type=range]{
    -webkit-appearance:none; appearance:none; flex:1; height:4px; cursor:pointer;
    background:linear-gradient(90deg, var(--accent), #4b5563); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:12px; height:18px;
    background:var(--accent); border:1px solid #000; box-shadow:0 0 6px rgba(255,176,0,0.7);
  }
  #timeCode{ font-size:10px; color:var(--accent); min-width:52px; text-align:right; letter-spacing:0.1em; }
  #loading{
    position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; background:#101216;
    font-size:12px; letter-spacing:0.3em; color:var(--dim);
  }
  #loading .bar{
    width:220px; height:2px; margin-top:16px; background:#1d2127; overflow:hidden;
  }
  #loading .bar i{
    display:block; width:45%; height:100%; background:var(--accent);
    animation:load 0.9s linear infinite;
  }
  @keyframes load{ from{ transform:translateX(-110%);} to{ transform:translateX(320%);} }
  #loading.hide{ opacity:0; visibility:hidden; transition:opacity .4s, visibility .4s; }
  #loadErr{
    display:none; position:fixed; inset:0; z-index:20; align-items:center; justify-content:center;
    background:rgba(8,9,12,0.94); text-align:center; padding:30px; font-size:13px; line-height:1.9;
  }
  @media (max-width: 860px){
    #controls{ flex-wrap:wrap; width:calc(100% - 20px); justify-content:center; }
    #timelineWrap{ order:9; width:100%; min-width:0; }
    #header h1{ font-size:16px; }
    #hint{ display:none; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="scanlines"></div>
<div id="vignette"></div>
<div id="labels"><canvas id="labelCanvas"></canvas></div>

<div id="hud">
  <div id="header">
    <h1>USP <span>MATCH</span> // 机械分解</h1>
    <div class="sub">LOW-POLY <b>PS1</b> PROCEDURAL MECHANICAL DEMO &nbsp;·&nbsp; FLAT SHADED / PIXEL TEX</div>
  </div>
  <div id="modeBadge">
    <span class="m1" id="modeName">USP MATCH PISTOL</span>
    <span class="m2" id="modeState">RENDER: <b>60 FPS LOOP</b></span>
  </div>
  <div id="phaseRead">PHASE: <b id="phaseText">ASSEMBLED</b></div>
  <div id="hint">
    <b>LMB</b> 旋转视图 &nbsp; <b>WHEEL</b> 缩放 &nbsp; <b>RMB</b> 平移<br>
    <b>1 / 2</b> USP / AR-15 &nbsp; <b>SPACE</b> 播放/暂停 &nbsp; <b>E / A</b> 分解 / 组装
  </div>
  <div id="controls">
    <div class="seg" id="modeSeg">
      <button id="btnPistol" class="active" title="USP Match 手枪">USP MATCH</button>
      <button id="btnAR" class="warn" title="AR-15 可选高阶演示">AR-15</button>
    </div>
    <button id="btnPlay" class="active" title="自动循环动画">▶ 循环</button>
    <button id="btnExploded" title="停在分解视图">分解视图</button>
    <button id="btnAssembled" title="停在组装视图">组装视图</button>
    <button id="btnReset" title="复位视角">视角复位</button>
    <div id="timelineWrap">
      <label>TIME</label>
      <input id="timeline" type="range" min="0" max="1000" step="1" value="455">
      <span id="timeCode">0.00s</span>
    </div>
  </div>
</div>

<div id="loading"><span>INITIALIZING LOW-POLY WORKBENCH</span><div class="bar"><i></i></div></div>
<div id="loadErr">
  THREE.JS CDN LOAD FAILED.<br>请检查网络连接后重新打开本文件。
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function(){
'use strict';

/* ============================================================
   Single-file procedural USP Match + optional AR-15 demo.
   Three.js classic build (r128) is loaded from a reliable CDN
   above; a second CDN is used automatically as a fallback.
   ============================================================ */

function ensureThree(cb){
  if (window.THREE){ cb(); return; }
  var s = document.createElement('script');
  s.src = 'https://unpkg.com/three@0.128.0/build/three.min.js';
  s.onload = function(){ if (window.THREE){ cb(); } else { showLoadError(); } };
  s.onerror = showLoadError;
  document.head.appendChild(s);
}
function showLoadError(){
  var bar = document.getElementById('loading');
  if (bar){ bar.classList.add('hide'); }
  var err = document.getElementById('loadErr');
  if (err){ err.style.display = 'flex'; }
}
function hideLoading(){
  var bar = document.getElementById('loading');
  if (bar){ bar.classList.add('hide'); }
}

ensureThree(startApp);

/* ------------------------------------------------------------ */

function startApp(){
  var canvas = document.getElementById('scene');
  var renderer;
  try{
    renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:false, powerPreference:'high-performance'});
  }catch(e){
    showLoadError(); return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xa9adb4);

  var camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -120, 220);
  camera.position.set(6, 5, 30);

  /* ---------------- lighting ---------------- */
  var hemi = new THREE.HemisphereLight(0xffffff, 0x6f747d, 0.95);
  scene.add(hemi);

  var key = new THREE.DirectionalLight(0xfff1dc, 1.15);
  key.position.set(12, 18, 16);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.near = 2;
  key.shadow.camera.far = 90;
  key.shadow.camera.left = -34;
  key.shadow.camera.right = 34;
  key.shadow.camera.top = 34;
  key.shadow.camera.bottom = -34;
  key.shadow.bias = -0.0004;
  key.shadow.normalBias = 0.02;
  scene.add(key);

  var rim = new THREE.DirectionalLight(0xbdd2ff, 0.42);
  rim.position.set(-14, 5, -10);
  scene.add(rim);

  var fill = new THREE.DirectionalLight(0xffffff, 0.30);
  fill.position.set(0, -4, 12);
  scene.add(fill);

  var shadowCatcher = new THREE.Mesh(
    new THREE.PlaneGeometry(170, 170),
    new THREE.ShadowMaterial({opacity:0.13})
  );
  shadowCatcher.rotation.x = -Math.PI / 2;
  shadowCatcher.position.y = -8.8;
  shadowCatcher.receiveShadow = true;
  scene.add(shadowCatcher);

  /* ---------------- PS1 pixel textures ---------------- */
  function makeTexture(size, base, painter){
    var c = document.createElement('canvas');
    c.width = size; c.height = size;
    var g = c.getContext('2d');
    g.fillStyle = base;
    g.fillRect(0, 0, size, size);
    if (painter){ painter(g, size); }
    var t = new THREE.CanvasTexture(c);
    t.magFilter = THREE.NearestFilter;
    t.minFilter = THREE.NearestFilter;
    t.generateMipmaps = false;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.encoding = THREE.sRGBEncoding;
    return t;
  }
  function speckle(g, s, count, alpha, dark){
    for (var i = 0; i < count; i++){
      var x = Math.floor(Math.random() * s);
      var y = Math.floor(Math.random() * s);
      var v = dark ? Math.floor(Math.random() * 40) : Math.floor(Math.random() * 70);
      g.fillStyle = 'rgba(' + v + ',' + v + ',' + (v + 4) + ',' + alpha + ')';
      g.fillRect(x, y, Math.random() > 0.6 ? 2 : 1, 1);
    }
  }
  function scratch(g, s){
    g.fillStyle = 'rgba(255,255,255,0.16)';
    for (var i = 0; i < 3; i++){
      g.fillRect(Math.floor(Math.random() * s * 0.8), Math.floor(Math.random() * s), 8 + Math.floor(Math.random() * 10), 1);
    }
    g.fillStyle = 'rgba(0,0,0,0.25)';
    for (var j = 0; j < 3; j++){
      g.fillRect(Math.floor(Math.random() * s), Math.floor(Math.random() * s), 5, 1);
    }
  }
  var texDarkMetal = makeTexture(32, '#26292e', function(g, s){
    speckle(g, s, 260, 0.55, true); scratch(g, s);
  });
  var texSlide = makeTexture(32, '#2c3037', function(g, s){
    speckle(g, s, 240, 0.5, true);
    g.fillStyle = 'rgba(255,255,255,0.08)';
    for (var i = 0; i < 8; i++){
      g.fillRect(0, i * 4, s, 1);
    }
    scratch(g, s);
  });
  var texPolymer = makeTexture(32, '#2a2e34', function(g, s){
    speckle(g, s, 300, 0.5, true);
    g.fillStyle = 'rgba(255,255,255,0.05)';
    for (var i = 0; i < 8; i++){
      g.fillRect(0, i * 4, s, 1);
    }
  });
  var texGrip = makeTexture(32, '#21252b', function(g, s){
    g.fillStyle = 'rgba(0,0,0,0.35)';
    for (var i = -s; i < s; i += 5){
      g.beginPath(); g.moveTo(i, 0); g.lineTo(i + s, s); g.lineTo(i + s + 2, s); g.lineTo(i + 2, 0); g.closePath(); g.fill();
    }
    speckle(g, s, 180, 0.4, true);
  });
  var texSteel = makeTexture(32, '#a7adb5', function(g, s){
    speckle(g, s, 200, 0.5, false);
    g.fillStyle = 'rgba(255,255,255,0.22)';
    for (var i = 0; i < 7; i++){ g.fillRect(2, i * 4 + 1, s - 4, 1); }
    g.fillStyle = 'rgba(20,22,26,0.18)';
    for (var j = 0; j < 5; j++){ g.fillRect(0, j * 6 + 3, s, 1); }
  });
  var texComp = makeTexture(32, '#1e2126', function(g, s){
    speckle(g, s, 280, 0.6, true);
    g.fillStyle = 'rgba(90,180,120,0.05)';
    for (var i = 0; i < 6; i++){ g.fillRect(0, i * 6, s, 1); }
  });
  var texMag = makeTexture(32, '#262a30', function(g, s){
    speckle(g, s, 220, 0.5, true);
    g.fillStyle = 'rgba(255,255,255,0.05)';
    for (var i = 0; i < 6; i++){ g.fillRect(0, i * 6 + 2, s, 1); }
  });
  var texBrass = makeTexture(16, '#b48a3f', function(g, s){
    speckle(g, s, 80, 0.5, false);
  });
  var texRail = makeTexture(32, '#171a1e', function(g, s){
    speckle(g, s, 160, 0.4, true);
  });

  function textTexture(text, fg, sizeW, sizeH){
    var c = document.createElement('canvas');
    c.width = sizeW; c.height = sizeH;
    var g = c.getContext('2d');
    g.clearRect(0, 0, sizeW, sizeH);
    g.font = 'bold ' + Math.floor(sizeH * 0.62) + 'px "Courier New", monospace';
    g.textBaseline = 'middle';
    g.fillStyle = fg;
    g.fillText(text, 3, sizeH / 2 + 1);
    var t = new THREE.CanvasTexture(c);
    t.magFilter = THREE.NearestFilter;
    t.minFilter = THREE.NearestFilter;
    t.generateMipmaps = false;
    return t;
  }

  function mat(opts){
    var o = Object.assign({
      color: 0xffffff, roughness: 0.72, metalness: 0.12,
      flatShading: true, map: null
    }, opts || {});
    return new THREE.MeshStandardMaterial(o);
  }
  var matFrame   = mat({map:texPolymer, roughness:0.86, metalness:0.04});
  var matGrip    = mat({map:texGrip, roughness:0.94, metalness:0.02});
  var matSlide   = mat({map:texSlide, roughness:0.55, metalness:0.68});
  var matDark    = mat({map:texDarkMetal, roughness:0.6, metalness:0.6});
  var matBarrel  = mat({color:0xffffff, map:texSteel, roughness:0.26, metalness:0.92});
  var matSteel   = mat({color:0xffffff, map:texSteel, roughness:0.38, metalness:0.85});
  var matComp    = mat({map:texComp, roughness:0.5, metalness:0.66});
  var matMag     = mat({map:texMag, roughness:0.72, metalness:0.35});
  var matBrass   = mat({map:texBrass, roughness:0.5, metalness:0.85});
  var matRail    = mat({map:texRail, roughness:0.78, metalness:0.28});
  var matBlack   = mat({color:0x16181c, roughness:0.7, metalness:0.25});
  var matRubber  = mat({color:0x24262a, roughness:0.95, metalness:0.02});
  var matGreen   = mat({color:0x00ff66, emissive:0x00ff66, emissiveIntensity:1.7, roughness:0.35, metalness:0});
  var matRed     = mat({color:0xff2b2b, emissive:0xff2b2b, emissiveIntensity:1.7, roughness:0.35, metalness:0});
  var matOrange  = mat({color:0xff7a26, emissive:0xff7a26, emissiveIntensity:0.55, roughness:0.5, metalness:0});
  var matARBlack = mat({map:texRail, roughness:0.62, metalness:0.58});
  var matARDark  = mat({map:texDarkMetal, roughness:0.7, metalness:0.4});
  var matTan     = mat({color:0x6b5c46, roughness:0.9, metalness:0.02});

  /* ---------------- mesh helpers ---------------- */
  function put(parent, geo, material, x, y, z, rx, ry, rz, cast){
    var m = new THREE.Mesh(geo, material);
    m.position.set(x || 0, y || 0, z || 0);
    if (rx || ry || rz){ m.rotation.set(rx || 0, ry || 0, rz || 0); }
    m.castShadow = !!cast;
    m.receiveShadow = !!cast;
    parent.add(m);
    return m;
  }
  function box(parent, w, h, d, material, x, y, z, rx, ry, rz, cast){
    return put(parent, new THREE.BoxGeometry(w, h, d), material, x, y, z, rx, ry, rz, cast);
  }
  function cylX(parent, r, len, seg, material, x, y, z, cast){
    var m = put(parent, new THREE.CylinderGeometry(r, r, len, seg || 8), material, x, y, z, 0, 0, Math.PI / 2, cast);
    return m;
  }
  function cylZ(parent, r, len, seg, material, x, y, z, cast){
    var m = put(parent, new THREE.CylinderGeometry(r, r, len, seg || 8), material, x, y, z, Math.PI / 2, 0, 0, cast);
    return m;
  }
  function profile(points, depth, material, holePoints, cast){
    var shape = new THREE.Shape();
    shape.moveTo(points[0][0], points[0][1]);
    for (var i = 1; i < points.length; i++){
      shape.lineTo(points[i][0], points[i][1]);
    }
    shape.closePath();
    if (holePoints){
      var hole = new THREE.Path();
      hole.moveTo(holePoints[0][0], holePoints[0][1]);
      for (var j = 1; j < holePoints.length; j++){
        hole.lineTo(holePoints[j][0], holePoints[j][1]);
      }
      hole.closePath();
      shape.holes.push(hole);
    }
    var geo = new THREE.ExtrudeGeometry(shape, {depth:depth, bevelEnabled:false});
    var m = new THREE.Mesh(geo, material);
    m.position.z = -depth / 2;
    m.castShadow = !!cast;
    m.receiveShadow = !!cast;
    return m;
  }
  function decal(parent, text, fg, w, h, x, y, z){
    var t = textTexture(text, fg, 128, 32);
    var m = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({map:t, transparent:true, depthWrite:false, side:THREE.DoubleSide})
    );
    m.position.set(x, y, z);
    parent.add(m);
    return m;
  }
  function anchor(parent, x, y, z){
    var o = new THREE.Object3D();
    o.position.set(x, y, z);
    parent.add(o);
    return o;
  }

  /* ============================================================
     USP MATCH PISTOL — procedural low-poly build
     ============================================================ */
  function buildPistol(){
    var root = new THREE.Group();

    /* -------- polymer lower frame -------- */
    var frame = new THREE.Group();
    root.add(frame);

    var framePoints = [
      [-8.70,  0.14], [-8.70, -1.02], [-6.55, -1.02], [-6.15, -1.82],
      [-7.25, -6.35], [-3.60, -5.72], [-2.20, -2.52], [-1.18, -3.32],
      [ 0.72, -2.46], [ 2.55, -1.78], [ 7.55, -1.78], [ 7.55,  0.14]
    ];
    var guardHole = [
      [-2.02, -2.46], [-1.24, -3.14], [ 0.34, -2.62], [ 0.08, -2.04]
    ];
    frame.add(profile(framePoints, 2.35, matFrame, guardHole, true));

    var gripL = box(frame, 0.30, 3.6, 1.55, matGrip, -6.25, -4.05, -1.18, 0, 0, -0.18, true);
    var gripR = box(frame, 0.30, 3.6, 1.55, matGrip, -6.25, -4.05,  1.18, 0, 0,  0.18, true);
    box(frame, 4.30, 0.42, 1.55, matRail, 2.55, -1.52, 0, 0, 0, 0, true);
    for (var ri = 0; ri < 4; ri++){

  /* ============================================================
     Animation timelines — every phase returns to the same state
     at t=0 and t=duration, so the loop is perfectly seamless.
     ============================================================ */
  var PISTOL_DUR = 10.0;
  var AR_DUR = 14.0;

  function clamp01(v){ return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function seg(t, a, b){ return clamp01((t - a) / Math.max(0.0001, b - a)); }
  function easeInOut(u){
    u = clamp01(u);
    return u * u * (3 - 2 * u);
  }
  function pulse(t, a, b){
    if (t <= a || t >= b){ return 0; }
    return Math.sin(((t - a) / (b - a)) * Math.PI);
  }

  function pistolAnim(t){
    var slideOut = 0, magOut = 0, compOut = 0, pull = 0;

    if (t < 2.3){
      slideOut = easeInOut(seg(t, 1.1, 2.3));
    } else if (t < 7.45){
      slideOut = 1;
    } else if (t < 7.8){
      slideOut = 1;
      pull = pulse(t, 7.45, 7.8);
    } else {
      slideOut = 1 - easeInOut(seg(t, 7.8, 8.85));
    }

    if (t < 2.3){
      magOut = 0;
    } else if (t < 3.1){
      magOut = easeInOut(seg(t, 2.3, 3.1));
    } else if (t < 6.2){
      magOut = 1;
    } else if (t < 7.0){
      magOut = 1 - easeInOut(seg(t, 6.2, 7.0));
    } else {
      magOut = 0;
    }

    if (t < 3.1){
      compOut = 0;
    } else if (t < 3.9){
      compOut = easeInOut(seg(t, 3.1, 3.9));
    } else if (t < 5.4){
      compOut = 1;
    } else if (t < 6.2){
      compOut = 1 - easeInOut(seg(t, 5.4, 6.2));
    } else {
      compOut = 0;
    }

    return {slideOut:slideOut, magOut:magOut, compOut:compOut, pull:pull};
  }

  function arAnim(t){
    var pinOut = 0, upperOpen = 0, bcgOut = 0;

    if (t < 1.0){
      pinOut = 0;
    } else if (t < 2.1){
      pinOut = easeInOut(seg(t, 1.0, 2.1));
    } else if (t < 11.6){
      pinOut = 1;
    } else if (t < 12.7){
      pinOut = 1 - easeInOut(seg(t, 11.6, 12.7));
    } else {
      pinOut = 0;
    }

    if (t < 2.1){
      upperOpen = 0;
    } else if (t < 3.7){
      upperOpen = easeInOut(seg(t, 2.1, 3.7));
    } else if (t < 10.0){
      upperOpen = 1;
    } else if (t < 11.6){
      upperOpen = 1 - easeInOut(seg(t, 10.0, 11.6));
    } else {
      upperOpen = 0;
    }

    if (t < 3.7){
      bcgOut = 0;
    } else if (t < 5.5){
      bcgOut = easeInOut(seg(t, 3.7, 5.5));
    } else if (t < 8.3){
      bcgOut = 1;
    } else if (t < 10.0){
      bcgOut = 1 - easeInOut(seg(t, 8.3, 10.0));
    } else {
      bcgOut = 0;
    }

    return {pinOut:pinOut, upperOpen:upperOpen, bcgOut:bcgOut};
  }

  /* ============================================================
     Camera rig — orbit / zoom / pan on an orthographic camera
     ============================================================ */
  var cam = {
    yaw: 0.18, pitch: 0.22, zoom: 1.05, view: 21.5,
    target: new THREE.Vector3(0.2, 0.3, 0)
  };
  var camGoal = {
    yaw: 0.18, pitch: 0.22, zoom: 1.05, view: 21.5,
    target: new THREE.Vector3(0.2, 0.3, 0)
  };
  var camSmooth = {
    yaw: 0.18, pitch: 0.22, zoom: 1.05, view: 21.5,
    target: new THREE.Vector3(0.2, 0.3, 0)
  };

  function applyCameraPreset(mode){
    if (mode === 'pistol'){
      camGoal.yaw = 0.16; camGoal.pitch = 0.24; camGoal.zoom = 1.12; camGoal.view = 21.0;
      camGoal.target.set(0.2, 0.35, 0);
    } else {
      camGoal.yaw = 0.52; camGoal.pitch = 0.92; camGoal.zoom = 0.92; camGoal.view = 33.0;
      camGoal.target.set(-1.2, 0.35, 0);
    }
  }
  applyCameraPreset('pistol');

  function updateCamera(aspect, dt){
    var k = 1 - Math.pow(0.0001, Math.min(1, dt * 4.5));
    camSmooth.yaw   += (camGoal.yaw   - camSmooth.yaw)   * k;
    camSmooth.pitch += (camGoal.pitch - camSmooth.pitch) * k;
    camSmooth.zoom  += (camGoal.zoom  - camSmooth.zoom)  * k;
    camSmooth.view  += (camGoal.view  - camSmooth.view)  * k;
    camSmooth.target.lerp(camGoal.target, k);

    cam.yaw = camSmooth.yaw; cam.pitch = camSmooth.pitch;
    cam.zoom = camSmooth.zoom; cam.view = camSmooth.view;
    cam.target.copy(camSmooth.target);

    var cp = Math.cos(cam.pitch);
    var off = new THREE.Vector3(
      cp * Math.sin(cam.yaw),
      Math.sin(cam.pitch),
      cp * Math.cos(cam.yaw)
    ).multiplyScalar(42);
    camera.position.copy(cam.target).add(off);
    camera.lookAt(cam.target);

    var view = cam.view / cam.zoom;
    camera.left = -aspect * view / 2;
    camera.right = aspect * view / 2;
    camera.top = view / 2;
    camera.bottom = -view / 2;
    camera.updateProjectionMatrix();
  }

  /* ---------------- input ---------------- */
  var dragMode = 0;
  var lastX = 0, lastY = 0;
  canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  canvas.addEventListener('pointerdown', function(e){
    dragMode = (e.button === 2) ? 2 : (e.button === 0 ? 1 : 0);
    lastX = e.clientX; lastY = e.clientY;
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    canvas.classList.add(dragMode === 2 ? 'panning' : 'dragging');
  });
  canvas.addEventListener('pointermove', function(e){
    if (!dragMode){ return; }
    var dx = e.clientX - lastX;
    var dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    if (dragMode === 1){
      camGoal.yaw -= dx * 0.0052;
      camGoal.pitch += dy * 0.0042;
      camGoal.pitch = Math.max(-0.12, Math.min(1.32, camGoal.pitch));
    } else {
      camera.updateMatrixWorld();
      var right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
      var up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
      var worldPerPixel = cam.view / cam.zoom / Math.max(1, window.innerHeight);
      camGoal.target.addScaledVector(right, -dx * worldPerPixel * 1.15);
      camGoal.target.addScaledVector(up, dy * worldPerPixel * 1.15);
      camGoal.target.y = Math.max(-7, Math.min(7, camGoal.target.y));
    }
  });
  window.addEventListener('pointerup', function(){
    dragMode = 0;
    canvas.classList.remove('dragging', 'panning');
  });
  canvas.addEventListener('wheel', function(e){
    e.preventDefault();
    camGoal.zoom *= (e.deltaY > 0 ? 0.92 : 1.085);
    camGoal.zoom = Math.max(0.45, Math.min(2.4, camGoal.zoom));
  }, {passive:false});
  canvas.addEventListener('dblclick', function(){
    applyCameraPreset(ui.mode);
  });

  /* ============================================================
     UI state
     ============================================================ */
  var ui = {mode:'pistol', playing:true, pistolTime:4.55, arTime:0.25, targetTime:null, frame:0};
  var clock = new THREE.Clock();
  var timeSlider = document.getElementById('timeline');
  var timeCode = document.getElementById('timeCode');
  var phaseText = document.getElementById('phaseText');
  var modeName = document.getElementById('modeName');
  var modeState = document.getElementById('modeState');

  var btnPistol = document.getElementById('btnPistol');
  var btnAR = document.getElementById('btnAR');
  var btnPlay = document.getElementById('btnPlay');
  var btnExploded = document.getElementById('btnExploded');
  var btnAssembled = document.getElementById('btnAssembled');
  var btnReset = document.getElementById('btnReset');

  function setMode(mode){
    if (ui.mode === mode){ return; }
    ui.mode = mode;
    pistol.root.visible = (mode === 'pistol');
    ar.root.visible = (mode === 'ar');
    btnPistol.classList.toggle('active', mode === 'pistol');
    btnAR.classList.toggle('active', mode === 'ar');
    modeName.textContent = mode === 'pistol' ? 'USP MATCH PISTOL' : 'AR-15 PLATFORM';
    applyCameraPreset(mode);
    syncSlider();
  }
  btnPistol.addEventListener('click', function(){ setMode('pistol'); });
  btnAR.addEventListener('click', function(){ setMode('ar'); });

  function setPlaying(on){
    ui.playing = !!on;
    ui.targetTime = null;
    btnPlay.textContent = ui.playing ? '▶ 循环' : '❚❚ 暂停';
    btnPlay.classList.toggle('active', ui.playing);
    modeState.innerHTML = ui.playing ? 'RENDER: <b>60 FPS LOOP</b>' : 'RENDER: <b>HOLD FRAME</b>';
  }
  btnPlay.addEventListener('click', function(){ setPlaying(!ui.playing); });

  function holdAt(time){
    ui.targetTime = time;
    ui.playing = false;
    btnPlay.textContent = '❚❚ 暂停';
    btnPlay.classList.remove('active');
    modeState.innerHTML = 'RENDER: <b>HOLD FRAME</b>';
  }
  btnExploded.addEventListener('click', function(){
    holdAt(ui.mode === 'pistol' ? 4.55 : 6.85);
  });
  btnAssembled.addEventListener('click', function(){
    holdAt(ui.mode === 'pistol' ? 0.25 : 0.25);
  });
  btnReset.addEventListener('click', function(){
    applyCameraPreset(ui.mode);
  });

  timeSlider.addEventListener('input', function(){
    var f = Number(timeSlider.value) / 1000;
    var dur = ui.mode === 'pistol' ? PISTOL_DUR : AR_DUR;
    if (ui.mode === 'pistol'){
      ui.pistolTime = f * dur;
    } else {
      ui.arTime = f * dur;
    }
    holdAt(ui.mode === 'pistol' ? ui.pistolTime : ui.arTime);
  });

  function syncSlider(){
    var dur = ui.mode === 'pistol' ? PISTOL_DUR : AR_DUR;
    var t = ui.mode === 'pistol' ? ui.pistolTime : ui.arTime;
    timeSlider.value = String(Math.round(1000 * t / dur));
    timeCode.textContent = t.toFixed(2) + 's';
  }

  window.addEventListener('keydown', function(e){
    if (e.code === 'Space'){ e.preventDefault(); setPlaying(!ui.playing); }
    else if (e.code === 'Digit1'){ setMode('pistol'); }
    else if (e.code === 'Digit2'){ setMode('ar'); }
    else if (e.code === 'KeyE'){ holdAt(ui.mode === 'pistol' ? 4.55 : 6.85); }
    else if (e.code === 'KeyA'){ holdAt(ui.mode === 'pistol' ? 0.25 : 0.25); }
  });

  /* ============================================================
     CAD callout overlay
     ============================================================ */
  var labelLayer = document.getElementById('labels');
  var labelCanvas = document.getElementById('labelCanvas');
  var labelCtx = labelCanvas.getContext('2d');
  var labelEls = [];
  var allLabels = [];
  function registerLabels(list, mode){
    for (var i = 0; i < list.length; i++){
      var def = list[i];
      def.mode = mode;
      var el = document.createElement('div');
      el.className = 'callout';
      el.style.color = def.color;
      var b = document.createElement('b');
      b.innerHTML = '<span class="dot"></span>' + def.text;
      var s = document.createElement('i');
      s.textContent = def.sub;
      el.appendChild(b);
      el.appendChild(s);
      labelLayer.appendChild(el);
      def.el = el;
      allLabels.push(def);
    }
  }
  registerLabels(pistol.labels, 'pistol');
  registerLabels(ar.labels, 'ar');

  function updateLabels(){
    var w = window.innerWidth, h = window.innerHeight;
    if (labelCanvas.width !== w || labelCanvas.height !== h){
      labelCanvas.width = w;
      labelCanvas.height = h;
    }
    labelCtx.clearRect(0, 0, w, h);
    var active = allLabels.filter(function(d){ return d.mode === ui.mode; });
    var tmp = new THREE.Vector3();
    var shown = [];

    for (var i = 0; i < allLabels.length; i++){
      allLabels[i].el.style.display = 'none';
    }

    for (var j = 0; j < active.length; j++){
      var def = active[j];
      def.obj.updateWorldMatrix(true, false);
      tmp.set(0, 0, 0);
      tmp.applyMatrix4(def.obj.matrixWorld);
      var v = tmp.project(camera);
      if (v.z < -1 || v.z > 1){ continue; }
      var sx = (v.x * 0.5 + 0.5) * w;
      var sy = (-v.y * 0.5 + 0.5) * h;
      if (sx < -80 || sx > w + 80 || sy < -60 || sy > h + 60){ continue; }

      var side = j % 2 === 0 ? 1 : -1;
      var lx = Math.max(70, Math.min(w - 70, sx + side * 74));
      var ly = Math.max(30, Math.min(h - 60, sy + (j < 3 ? -26 : 24)));
      labelCtx.strokeStyle = def.color;
      labelCtx.globalAlpha = 0.55;
      labelCtx.lineWidth = 1;
      labelCtx.setLineDash([3, 3]);
      labelCtx.beginPath();
      labelCtx.moveTo(sx, sy);
      labelCtx.lineTo(lx, ly);
      labelCtx.stroke();
      labelCtx.setLineDash([]);
      labelCtx.globalAlpha = 0.9;
      labelCtx.fillStyle = def.color;
      labelCtx.beginPath();
      labelCtx.arc(sx, sy, 2.2, 0, Math.PI * 2);
      labelCtx.fill();

      var el = def.el;
      el.style.display = 'block';
      el.style.left = lx + 'px';
      el.style.top = ly + 'px';
      shown.push(def);
    }
    /* keep the callout layer uncluttered in AR top view */
    labelLayer.style.opacity = shown.length ? '1' : '0';
  }

  /* ============================================================
     Frame loop
     ============================================================ */
  function phaseNamePistol(t){
    var a = pistolAnim(t);
    if (a.slideOut < 0.02 && a.magOut < 0.02 && a.compOut < 0.02){
      return t > 8.5 ? 'ASSEMBLED · 复位' : 'ASSEMBLED · 待机';
    }
    if (a.compOut > 0.02 && a.compOut < 0.98){ return 'COMP 补偿器滑出'; }
    if (a.magOut > 0.02 && a.magOut < 0.98){ return 'MAGAZINE 弹匣滑移'; }
    if (a.slideOut > 0.02 && a.slideOut < 0.98){ return a.slideOut > 0.5 && t > 6 ? 'SLIDE 套筒复位' : 'SLIDE 套筒后拉锁定'; }
    if (a.slideOut >= 0.98 && a.magOut >= 0.98 && a.compOut >= 0.98){ return 'EXPLODED · 分解视图'; }
    if (a.slideOut >= 0.98 && a.magOut <= 0.02 && a.compOut >= 0.98){ return 'MAG UP · 弹匣入握把'; }
    if (a.slideOut >= 0.98 && a.magOut <= 0.02 && a.compOut <= 0.02){ return 'SLIDE CYCLE · 套筒后拉/复位'; }
    return 'SEQUENCE · 循环';
  }
  function phaseNameAR(t){
    var a = arAnim(t);
    if (a.pinOut > 0.02 && a.pinOut < 0.98){ return 'TAKEDOWN PIN 退出/复位'; }
    if (a.upperOpen > 0.02 && a.upperOpen < 0.98){ return 'UPPER PIVOTS · 上机匣开合'; }
    if (a.bcgOut > 0.02 && a.bcgOut < 0.98){ return a.bcgOut > 0.5 ? 'BCG REAR / BOLT UNLOCK' : 'BCG RETURNS / BOLT LOCK'; }
    if (a.pinOut >= 0.98 && a.upperOpen >= 0.98 && a.bcgOut >= 0.98){ return 'AR EXPLODED · 慢动作分解'; }
    return 'AR-15 ASSEMBLED · 待机';
  }

  function applyPistolAnim(a){
    pistol.slide.position.x = -6.40 * a.slideOut - 0.85 * a.pull;
    pistol.mag.position.y = -4.35 * a.magOut;
    pistol.comp.position.x = 9.15 + 5.10 * a.compOut;
    pistol.hammerPivot.rotation.z = -0.55 * a.slideOut;
    pistol.trigger.rotation.z = 0.06 * a.slideOut + 0.08;
    pistol.follower.rotation.z = Math.sin(ui.pistolTime * 12) * 0.03;
  }
  function applyARAnim(a){
    ar.upperPivot.rotation.z = -0.62 * a.upperOpen;
    ar.rearPin.position.z = 2.15 * a.pinOut;
    ar.bcg.position.x = -4.55 - 6.35 * a.bcgOut;
    ar.charging.position.x = -8.95 - 1.55 * a.bcgOut;
    ar.boltPivot.rotation.x = -0.42 * a.bcgOut;
    ar.hammerG.rotation.z = -0.34 * a.upperOpen - 0.18 * a.bcgOut;
    ar.triggerG.rotation.z = 0.10 + 0.05 * a.bcgOut;
  }

  function resize(){
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    labelCanvas.width = w;
    labelCanvas.height = h;
  }
  window.addEventListener('resize', resize);
  resize();

  var renderedOnce = false;
  function tick(){
    requestAnimationFrame(tick);
    var dt = Math.min(clock.getDelta(), 0.05);
    var target = ui.targetTime;
    var activeTime = ui.mode === 'pistol' ? ui.pistolTime : ui.arTime;
    var dur = ui.mode === 'pistol' ? PISTOL_DUR : AR_DUR;

    if (ui.playing){
      activeTime = (activeTime + dt) % dur;
    } else if (target !== null && target !== undefined){
      var diff = target - activeTime;
      var step = diff * Math.min(1, dt * 3.2);
      if (Math.abs(diff) < 0.0004){
        activeTime = target;
        ui.targetTime = null;
      } else {
        activeTime += step;
      }
    }
    if (ui.mode === 'pistol'){ ui.pistolTime = activeTime; }
    else { ui.arTime = activeTime; }

    applyPistolAnim(pistolAnim(ui.pistolTime));
    applyARAnim(arAnim(ui.arTime));

    updateCamera(window.innerWidth / Math.max(1, window.innerHeight), dt);
    updateLabels();

    phaseText.textContent = ui.mode === 'pistol' ? phaseNamePistol(ui.pistolTime) : phaseNameAR(ui.arTime);
    if (ui.frame % 3 === 0){ syncSlider(); }
    ui.frame++;

    renderer.render(scene, camera);
    if (!renderedOnce){
      renderedOnce = true;
      hideLoading();
    }
  }

  tick();
}
})();
</script>
</body>
</html>
