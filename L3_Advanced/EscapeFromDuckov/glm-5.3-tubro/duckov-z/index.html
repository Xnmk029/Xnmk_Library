<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUCKOV Z · 鸭科夫：末日求生</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- 全屏后期 DOM 层 -->
  <div id="vig"></div>
  <div id="flash"></div>
  <div id="tint"></div>
  <div id="grain"></div>

  <!-- HUD -->
  <div id="hud">
    <div id="topline"></div>
    <div id="minimapBox"><canvas id="minimap"></canvas><label>鸭鸣镇 · M 放大</label></div>
    <div id="moodles"></div>
    <div id="bodyPanel">
      <h5>身体状况</h5>
      <div id="bodyCells"></div>
      <div id="statBars"></div>
    </div>
    <div id="promptWrap">
      <div id="actbarWrap"><span id="actbarLabel"></span><div class="tr"><i id="actbarFill"></i></div></div>
      <div id="prompt"></div>
    </div>
    <div id="weaponCard"></div>
    <div id="radioBanner"></div>
    <div id="toasts"></div>
    <div id="fpsTag"></div>
  </div>

  <!-- 面板层 -->
  <div id="panels">
    <div id="invPanel" class="panel hidden"></div>
    <div id="bigMap" class="panel hidden"></div>
    <div id="pauseMenu" class="panel hidden"></div>
    <div id="helpOverlay" class="panel hidden"></div>
    <div id="modal" class="modal hidden"></div>
    <div id="titleScreen" class="screen hidden"></div>
    <div id="deathScreen" class="screen hidden"></div>
    <div id="winScreen" class="screen hidden"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/audio.js"></script>
<script src="js/items.js"></script>
<script src="js/world.js"></script>
<script src="js/fov.js"></script>
<script src="js/player.js"></script>
<script src="js/zombie.js"></script>
<script src="js/combat.js"></script>
<script src="js/fx.js"></script>
<script src="js/render_map.js"></script>
<script src="js/render_dyn.js"></script>
<script src="js/ui_hud.js"></script>
<script src="js/ui_panels.js"></script>
<script src="js/save.js"></script>
<script src="js/main.js"></script>
</body>
</html>
