<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>逃离鸭科夫 × 僵尸毁灭工程 · PROJECT DUCKBOID 3D</title>
<style>
:root{
  --ink:#0b0e12; --panel:#141a21; --panel2:#1b232c; --line:#2c3844;
  --txt:#c8d4de; --dim:#7d8b98; --hot:#ffd23f; --blood:#d1443a;
  --ok:#5fb35f; --warn:#e0a03a; --blue:#4aa3d6; --purple:#a56ad6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#05070a;color:var(--txt);
  font:12px/1.5 "Consolas","SF Mono","DejaVu Sans Mono",ui-monospace,monospace;
  -webkit-font-smoothing:antialiased;user-select:none;cursor:default}
canvas{display:block;position:absolute;inset:0}
#app{position:fixed;inset:0}

/* ---------- 通用面板 ---------- */
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:3px;
  box-shadow:0 6px 24px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04)}
.panel h3{font-size:11px;letter-spacing:.14em;color:var(--dim);font-weight:600;
  padding:6px 9px;border-bottom:1px solid var(--line);text-transform:uppercase}
.btn{display:inline-block;padding:5px 12px;border:1px solid var(--line);border-radius:2px;
  background:#1e2731;color:var(--txt);cursor:pointer;font:inherit;letter-spacing:.05em}
.btn:hover{background:#27333f;border-color:#3d4d5c;color:#fff}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#3f6b3a,#2c4c28);border-color:#52854a;color:#e8f5e6}
.btn.primary:hover{background:linear-gradient(180deg,#4d8146,#35602f)}
.btn.danger{background:linear-gradient(180deg,#7a2b26,#521d1a);border-color:#a03a33}
.btn[disabled]{opacity:.38;cursor:not-allowed;filter:grayscale(.7)}
.btn.on{background:linear-gradient(180deg,#2f5f7d,#1d3f55);border-color:#4aa3d6;color:#dff0fb}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud .panel{pointer-events:auto}
#moodleCol{position:absolute;left:8px;top:8px;width:212px}
#moodleRow{display:flex;flex-wrap:wrap;gap:3px;padding:5px}
.moodle{width:26px;height:26px;border-radius:2px;border:1px solid var(--line);
  display:grid;place-items:center;font-size:14px;background:#11171d;position:relative}
.moodle[data-lv="1"]{border-color:#4d6b3f;background:#182215}
.moodle[data-lv="2"]{border-color:#8a7a2e;background:#221f10}
.moodle[data-lv="3"]{border-color:#a55c2a;background:#2a1a0e}
.moodle[data-lv="4"]{border-color:#a5332a;background:#2e1210;animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.moodle .tip{display:none;position:absolute;left:0;top:28px;width:180px;padding:5px 7px;
  background:#0d1218;border:1px solid var(--line);color:var(--txt);font-size:11px;z-index:60;pointer-events:none}
.moodle:hover .tip{display:block}

#healthPanel{position:absolute;left:8px;bottom:8px;width:212px}
#bodyFig{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:6px}
.bp{height:19px;border:1px solid var(--line);border-radius:2px;display:grid;place-items:center;
  font-size:10px;color:var(--dim);position:relative;overflow:hidden;background:#0f141a}
.bp i{position:absolute;left:0;bottom:0;width:100%;background:#2f7a3a;opacity:.55;transition:height .2s}
.bp span{position:relative;z-index:1}
.bp.dead i{background:#5a1f1a}
.bp.bleed{border-color:var(--blood);animation:pulse .8s infinite}
.bp.frac{border-color:#b9a13c}
.bp.infect i{background:#4a7a2a}
#vitals{padding:5px 8px;border-top:1px solid var(--line);font-size:11px;color:var(--dim)}
#vitals b{color:var(--txt);font-weight:600}

#clockPanel{position:absolute;right:8px;top:8px;width:186px}
#clockBody{padding:6px 9px;font-size:11px;line-height:1.7}
#clockBody .k{color:var(--dim)}
#clockBody .v{float:right;color:var(--txt)}

#ammoPanel{position:absolute;right:8px;bottom:8px;min-width:186px}
#ammoBody{padding:6px 9px;font-size:11px;line-height:1.7}
#ammoBody .mag{font-size:19px;color:var(--hot);letter-spacing:.06em}
#ammoBody .rsrv{color:var(--dim)}

#compass{position:absolute;left:50%;top:6px;transform:translateX(-50%);
  padding:3px 12px;font-size:11px;letter-spacing:.1em;color:var(--dim);
  background:rgba(10,14,18,.62);border:1px solid var(--line);border-radius:2px}

#crosshair{position:absolute;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;
  pointer-events:none;display:none}
#crosshair.on{display:block}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#e8f0f6;opacity:.85;
  box-shadow:0 0 3px rgba(0,0,0,.9)}
#crosshair:before{left:12px;top:0;width:2px;height:26px}
#crosshair:after{top:12px;left:0;height:2px;width:26px}

#bossBar{position:absolute;left:50%;top:38px;transform:translateX(-50%);width:340px;display:none}
#bossBar.on{display:block}
#bossFill{height:9px;background:linear-gradient(90deg,#8e2b23,#d1443a);width:100%;transition:width .15s}
#bossName{padding:3px 8px;font-size:11px;letter-spacing:.1em;color:#f0c8c4}

#prompt{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);
  padding:5px 14px;background:rgba(10,14,18,.82);border:1px solid var(--line);border-radius:2px;
  font-size:12px;display:none}
#prompt.on{display:block}
#prompt kbd{background:#26313c;border:1px solid #3a4753;border-radius:2px;padding:0 5px;color:var(--hot)}

#castBar{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);width:230px;display:none}
#castBar.on{display:block}
#castFill{height:7px;background:var(--blue);width:0%}
#castTxt{padding:3px 8px;font-size:11px;text-align:center}

#toast{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);
  display:flex;flex-direction:column;gap:4px;align-items:center}
.toast{padding:4px 12px;background:rgba(12,17,22,.9);border-left:2px solid var(--hot);
  font-size:11px;animation:tin .25s ease-out;max-width:460px}
.toast.bad{border-left-color:var(--blood)}
.toast.good{border-left-color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

#dmgNum{position:absolute;inset:0;overflow:hidden}
.dnum{position:absolute;font-size:13px;font-weight:700;color:#ffdca8;text-shadow:0 1px 3px #000;
  animation:dfloat .9s ease-out forwards}
@keyframes dfloat{to{opacity:0;transform:translateY(-26px)}}

/* ---------- 覆盖层 / 菜单 ---------- */
#overlay{position:fixed;inset:0;z-index:40;display:none;
  background:radial-gradient(ellipse at 50% 30%,rgba(18,24,30,.86),rgba(4,6,9,.96));
  backdrop-filter:blur(2px)}
#overlay.on{display:flex;align-items:center;justify-content:center}
.win{background:linear-gradient(180deg,#161d25,#10151b);border:1px solid var(--line);
  border-radius:4px;box-shadow:0 18px 60px rgba(0,0,0,.7);max-height:88vh;display:flex;flex-direction:column}
.win>h3{padding:9px 14px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.16em;
  color:var(--hot);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.win>h3 .x{cursor:pointer;color:var(--dim);font-size:15px;line-height:1}
.win>h3 .x:hover{color:#fff}
.win>.body{padding:12px 14px;overflow:auto}
.win>.foot{padding:9px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}

#screen{position:fixed;inset:0;z-index:50;display:none;overflow:auto}
#screen.on{display:block}

/* 主菜单 */
#menuWrap{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 25%,#1b2530,#05070a 70%)}
#menuWrap.off{display:none}
#menuTitle{text-align:center;margin-bottom:26px}
#menuTitle h1{font-size:34px;letter-spacing:.16em;color:var(--hot);
  text-shadow:0 0 26px rgba(255,210,63,.28);font-weight:700}
#menuTitle p{color:var(--dim);letter-spacing:.22em;font-size:11px;margin-top:6px}
#menuBtns{display:flex;flex-direction:column;gap:8px;width:250px}
#menuBtns .btn{text-align:center;padding:9px}
#menuTip{margin-top:22px;color:#5d6a76;font-size:11px;text-align:center;line-height:1.8;max-width:520px}

/* 加载 / 错误 */
#loading{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:#05070a}
#loading.off{display:none}
#loading .l{text-align:center;color:var(--dim);letter-spacing:.2em;font-size:11px}
#loadBar{width:220px;height:3px;background:#1a222b;margin-top:12px;overflow:hidden}
#loadBar i{display:block;height:100%;width:0%;background:var(--hot);transition:width .2s}
#fatal{position:fixed;inset:0;z-index:90;display:none;padding:28px;background:#0a0d11;overflow:auto}
#fatal.on{display:block}
#fatal h2{color:var(--blood);font-size:15px;margin-bottom:10px}
#fatal pre{white-space:pre-wrap;color:#9fb0be;font-size:11px;line-height:1.7}
/* ---------- 背包 / 搜刮 ---------- */
.invItem{position:absolute;border:1px solid #3d4d5c;border-radius:2px;background:linear-gradient(180deg,#2b3742,#1d262f);
  cursor:pointer;overflow:hidden;padding:2px 3px;font-size:10px;line-height:1.15;color:var(--txt)}
.invItem:hover{border-color:var(--hot);background:linear-gradient(180deg,#3a4a58,#26313b)}
.invItem b{display:block;font-weight:600;font-size:10px;word-break:break-all}
.invItem i{position:absolute;right:3px;bottom:1px;color:var(--hot);font-style:normal;font-size:10px}
.eqSlot{border:1px solid var(--line);border-radius:2px;padding:5px 7px;background:#141a21;cursor:pointer}
.eqSlot:hover{border-color:var(--hot)}
.eqSlot .lbl{display:block;color:var(--dim);font-size:10px}
.eqSlot .val{font-size:11px;color:var(--txt)}
.lootRow{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:5px 8px;border-bottom:1px solid #1e2730;cursor:pointer;font-size:11px}
.lootRow:hover{background:#1b232c;color:#fff}
.lootList{max-height:46vh;overflow:auto}
.btn.holo{border-style:dashed;border-color:#4aa3d6;color:#9fd4f0}
.win .body .k{color:var(--dim)}
.win .body b{color:var(--txt);float:right}

/* ---------- 藏身处 ---------- */
.facGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fac{border:1px solid var(--line);border-radius:3px;padding:8px 9px;background:#141a21}
.fac .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.fac .hd b{font-size:12px}
.fac .lv{color:var(--hot);font-size:10px}
.fac .ds{color:var(--dim);font-size:10px;margin-bottom:4px}
.fac .ef{font-size:10px;color:var(--txt);margin-bottom:6px}
.fac .ct{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.cv{border:1px solid var(--line);border-radius:2px;padding:1px 5px;font-size:9px;font-family:ui-monospace,monospace}
.cv.ok{color:var(--ok);border-color:#2c4a33}
.cv.no{color:var(--blood);border-color:#4a2c2c}
.fac .up{width:100%;padding:3px 0;font-size:10px}
.fac .up:disabled{opacity:.42;cursor:not-allowed}
.quest{border-bottom:1px solid #1e2730;padding:7px 0;font-size:11px}
.quest b{margin-right:8px}
.quest.done b{color:var(--ok)}
.quest .qs{color:var(--dim);font-size:10px;margin-top:2px}
.stash{max-height:38vh;overflow:auto;font-size:11px}
.stash div{display:flex;justify-content:space-between;gap:12px;padding:2px 0;border-bottom:1px solid #1e2730}
.holoCanvas{display:block;border-radius:2px}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#0c1116}
::-webkit-scrollbar-thumb{background:#2b3742;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#3a4a58}
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <div id="moodleCol" class="panel"><h3>状态 / MOODLES</h3><div id="moodleRow"></div></div>
  <div id="healthPanel" class="panel"><h3>身体状况</h3><div id="bodyFig"></div><div id="vitals"></div></div>
  <div id="clockPanel" class="panel"><h3>环境</h3><div id="clockBody"></div></div>
  <div id="ammoPanel" class="panel"><h3>武器</h3><div id="ammoBody"></div></div>
  <div id="compass">零号区 · ZONE 0</div>
  <div id="bossBar" class="panel"><div id="bossName"></div><div id="bossFill"></div></div>
  <div id="castBar" class="panel"><div id="castTxt"></div><div id="castFill"></div></div>
  <div id="prompt"></div>
  <div id="crosshair"></div>
  <div id="toast"></div>
  <div id="dmgNum"></div>
</div>

<div id="overlay"><div id="overlayHost"></div></div>
<div id="screen"></div>

<div id="menuWrap">
  <div style="display:flex;flex-direction:column;align-items:center">
    <div id="menuTitle">
      <h1>PROJECT DUCKBOID</h1>
      <p>逃离鸭科夫 × 僵尸毁灭工程 · 3D 硬核生存撤离</p>
    </div>
    <div id="menuBtns"></div>
    <div id="menuTip"></div>
  </div>
</div>

<div id="loading"><div class="l">正在装配战术萌鸭 / COMPILING SHADERS<div id="loadBar"><i></i></div></div></div>
<div id="fatal"><h2>启动失败 / FATAL</h2><pre id="fatalMsg"></pre></div>

<script>
// 全局错误兜底：任何未捕获异常都要让玩家看见，而不是白屏
window.__FATAL = [];
function showFatal(msg){
  var f=document.getElementById('fatal');var m=document.getElementById('fatalMsg');
  if(f&&m){f.classList.add('on');m.textContent=(m.textContent?m.textContent+'\n\n':'')+msg;}
}
window.addEventListener('error',function(e){
  var s=(e.message||'error')+' @ '+(e.filename||'?')+':'+(e.lineno||0);
  window.__FATAL.push(s);showFatal(s);
});
window.addEventListener('unhandledrejection',function(e){
  var s='promise: '+((e.reason&&(e.reason.stack||e.reason.message))||e.reason);
  window.__FATAL.push(s);showFatal(s);
});
</script>
<script src="/*GAME_JS*/"></script>
</body>
</html>
