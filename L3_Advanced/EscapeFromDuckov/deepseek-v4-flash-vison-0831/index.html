<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>鸭科夫·毁灭工程 — Project Zomduck</title>
<link rel="stylesheet" href="./styles/ui.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#129414;</text></svg>" />
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/webgpu": "./vendor/three.module.js" } }
</script>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>

  <!-- ============ 游戏内 HUD ============ -->
  <div id="hud" class="hidden">
    <div id="crosshair"><div class="ch-dot"></div><div class="ch-ring"></div></div>

    <!-- 左上：状态与部位 -->
    <div id="hud-left">
      <div id="clockbox" class="panel-lite">
        <div class="clock-row"><span id="clock-day">第 1 天</span><span id="clock-time">09:00</span></div>
        <div class="clock-row sub"><span id="clock-weather">晴</span><span id="clock-temp">18°C</span></div>
        <div id="clock-power" class="clock-row sub"><span class="ok" id="power-state">⚡供电</span><span class="ok" id="water-state">💧供水</span></div>
      </div>
      <div id="moodles"></div>
    </div>

    <!-- 右上：小地图 -->
    <div id="hud-right">
      <div id="minimap-wrap" class="panel-lite">
        <canvas id="minimap" width="200" height="200"></canvas>
        <div id="minimap-label">MULDRAUGH · 鸭科夫郡</div>
      </div>
      <div id="objective-box" class="panel-lite">
        <div class="obj-title">当前目标</div>
        <div id="objective-text">活下去。</div>
      </div>
    </div>

    <!-- 底部：生命/体力/装备 -->
    <div id="hud-bottom">
      <div id="vitals">
        <div class="vital"><span class="vk">健康</span><div class="bar"><i id="bar-health"></i></div></div>
        <div class="vital"><span class="vk">耐力</span><div class="bar"><i id="bar-endur"></i></div></div>
        <div class="vital"><span class="vk">负重</span><div class="bar"><i id="bar-weight"></i><b id="weight-text">0.0/8.0</b></div></div>
      </div>
      <div id="handbox">
        <div class="hand" id="hand-primary"><div class="hand-icon">✋</div><div class="hand-info"><div class="hand-name">空手</div><div class="hand-sub"></div></div></div>
        <div id="ammobox"><span id="ammo-mag">--</span><span id="ammo-reserve">/--</span></div>
      </div>
      <div id="hotbar"></div>
    </div>

    <!-- 交互提示 -->
    <div id="interact-prompt" class="hidden"></div>
    <div id="action-progress" class="hidden"><div class="ap-label">动作中…</div><div class="ap-bar"><i></i></div></div>
    <div id="toasts"></div>
    <div id="damage-flash"></div>
    <div id="dbg" class="hidden"></div>
  </div>

  <!-- ============ 面板容器 ============ -->
  <div id="overlay" class="hidden">
    <div id="panel-tabs">
      <button data-tab="inv" class="tab active">背包 <kbd>I</kbd></button>
      <button data-tab="craft" class="tab">制作 <kbd>C</kbd></button>
      <button data-tab="health" class="tab">健康 <kbd>H</kbd></button>
      <button data-tab="skill" class="tab">技能 <kbd>K</kbd></button>
      <button data-tab="map" class="tab">地图 <kbd>M</kbd></button>
      <button data-tab="journal" class="tab">日志 <kbd>J</kbd></button>
      <button id="panel-close" class="tab close">✕</button>
    </div>
    <div id="panel-body"></div>
  </div>

  <!-- ============ 菜单层 ============ -->
  <div id="screen" class="screen"></div>

  <div id="ctxmenu" class="hidden"></div>
  <div id="tooltip" class="hidden"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
