<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>僵尸毁灭鸭程 PROJECT DUCKBOID × 逃离鸭科夫</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦆</text></svg>">
<style>
/* ============ 全局基调：低饱和废土 + 高饱和鸭 ============ */
:root{
  --bg:#0b0f13; --panel:#141b22; --panel2:#0f151b; --line:#2b3a46; --line2:#3d5263;
  --ink:#cfd8de; --ink-dim:#7f8f9b; --amber:#f0b429; --amber-d:#b07f14;
  --red:#e5484d; --green:#46c07a; --blue:#4fa3e3; --purple:#b07ce8;
  --duck:#ffd23f; --duck-deep:#e89a1d;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
  font-family:"Microsoft YaHei","PingFang SC",Consolas,sans-serif;color:var(--ink);font-size:14px}
#gameRoot{position:fixed;inset:0}
canvas{position:absolute;inset:0;display:block}
#cv{z-index:1} #hud{z-index:2;pointer-events:none}
#vig{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at center, transparent 42%, rgba(190,20,20,.55) 82%, rgba(120,0,0,.8) 100%);
  transition:opacity .25s}
#uiLayer{position:absolute;inset:0;z-index:10;pointer-events:none}
#uiLayer>*{pointer-events:auto}

/* ============ 战术面板 ============ */
.win{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:linear-gradient(180deg,rgba(22,30,38,.97),rgba(13,18,23,.98));
  border:1px solid var(--line);box-shadow:0 0 0 1px #000,0 18px 60px rgba(0,0,0,.7);
  min-width:520px;max-width:92vw;max-height:88vh;display:none;flex-direction:column;
  pointer-events:auto}
.win.show{display:flex}
.win::before,.win::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--amber)}
.win::before{left:-4px;top:-4px;border-right:none;border-bottom:none}
.win::after{right:-4px;bottom:-4px;border-left:none;border-top:none}
.win-h{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#1b2530,#141c24)}
.win-h .tt{font-size:16px;font-weight:700;letter-spacing:4px;color:var(--amber)}
.win-h .sub{font-size:11px;color:var(--ink-dim);letter-spacing:2px}
.win-h .x{margin-left:auto;cursor:pointer;color:var(--ink-dim);font-size:18px;padding:2px 8px;
  border:1px solid transparent}
.win-h .x:hover{color:var(--red);border-color:var(--red)}
.win-b{padding:14px 16px;overflow-y:auto}
.win-b::-webkit-scrollbar{width:8px}
.win-b::-webkit-scrollbar-thumb{background:var(--line2)}
.win-b::-webkit-scrollbar-track{background:#0c1116}

/* ============ 通用控件 ============ */
.btn{display:inline-block;padding:7px 18px;background:#1c2833;border:1px solid var(--line2);color:var(--ink);
  cursor:pointer;letter-spacing:2px;font-size:13px;transition:all .12s;text-align:center}
.btn:hover{border-color:var(--amber);color:var(--amber);background:#232f3c}
.btn.warn{border-color:#5a3030} .btn.warn:hover{border-color:var(--red);color:var(--red)}
.btn.pri{background:linear-gradient(180deg,#f0b429,#c78d14);color:#1a1206;font-weight:700;border-color:#f6c84f}
.btn.pri:hover{filter:brightness(1.12);color:#1a1206}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.35;pointer-events:none}
.tag{display:inline-block;padding:1px 7px;font-size:10px;border:1px solid var(--line2);color:var(--ink-dim);
  letter-spacing:1px;margin-right:4px}
.tag.amber{border-color:var(--amber-d);color:var(--amber)}
.tag.red{border-color:#6b2b2b;color:#e58084}
.tag.blue{border-color:#2b4c6b;color:#7fb8e8}
.tag.purple{border-color:#4d2b6b;color:#c39bef}
.tag.green{border-color:#2b5b40;color:#7fd0a6}
.hr{height:1px;background:var(--line);margin:10px 0}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
small.dim{color:var(--ink-dim)}
b.am{color:var(--amber)} b.rd{color:var(--red)} b.gn{color:var(--green)} b.bl{color:var(--blue)}

/* ============ 物品格子 ============ */
.invgrid{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
.slot{width:52px;height:52px;background:#10161d;border:1px solid var(--line);position:relative;
  cursor:pointer;transition:border-color .1s}
.slot:hover{border-color:var(--amber)}
.slot.sel{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.slot .ic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.slot .qt{position:absolute;right:2px;bottom:1px;font-size:10px;color:var(--ink);text-shadow:0 0 3px #000;font-weight:700}
.slot .dur{position:absolute;left:2px;right:2px;bottom:2px;height:2px;background:#000}
.slot .dur i{display:block;height:100%;background:var(--green)}
.slot.empty{opacity:.45}
.slot .key{position:absolute;left:2px;top:1px;font-size:9px;color:var(--amber)}
.equipSlot{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.equipSlot .lbl{width:64px;font-size:11px;color:var(--ink-dim);letter-spacing:1px;text-align:right}
.equipSlot .slot{outline:1px dashed #2b3a46;outline-offset:2px}

/* ============ 提示 / 通知 ============ */
#toasts{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);z-index:60;
  display:flex;flex-direction:column-reverse;gap:6px;pointer-events:none;align-items:center}
.toast{background:rgba(12,17,22,.92);border:1px solid var(--line2);border-left:3px solid var(--amber);
  padding:6px 16px;font-size:12px;letter-spacing:1px;animation:tin .2s;max-width:520px;text-align:center}
.toast.bad{border-left-color:var(--red)} .toast.good{border-left-color:var(--green)}
.toast.info{border-left-color:var(--blue)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
#tipBox{position:absolute;z-index:70;background:rgba(10,14,18,.96);border:1px solid var(--line2);
  padding:8px 12px;font-size:12px;max-width:280px;display:none;pointer-events:none;line-height:1.7;
  box-shadow:0 8px 30px rgba(0,0,0,.6)}
#tipBox .nm{color:var(--amber);font-weight:700;font-size:13px}
#tipBox .st{color:var(--ink-dim);font-size:11px}

/* ============ 全屏流程页 ============ */
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  z-index:40;background:radial-gradient(ellipse at 50% 30%,#182430 0%,#0a0e12 70%);pointer-events:auto}
.scr.show{display:flex}
.scr .logo{text-align:center;margin-bottom:26px}
.scr .logo h1{font-size:44px;letter-spacing:14px;color:var(--duck);font-weight:900;
  text-shadow:0 0 24px rgba(240,180,41,.25),0 3px 0 #7a5a10}
.scr .logo h2{font-size:15px;letter-spacing:6px;color:var(--ink-dim);margin-top:8px;font-weight:400}
.scr .logo .en{font-size:11px;letter-spacing:8px;color:#4d6377;margin-top:4px}
.menuCol{display:flex;flex-direction:column;gap:10px;width:300px}
.menuCol .btn{padding:11px}
.foot{position:absolute;bottom:18px;width:100%;text-align:center;font-size:11px;color:#3d5263;letter-spacing:2px}

/* ============ 角色创建 ============ */
#createWrap{width:880px;max-width:94vw;max-height:86vh;background:linear-gradient(180deg,#161f28,#0e141a);
  border:1px solid var(--line);display:flex;flex-direction:column;box-shadow:0 20px 80px #000}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs .tab{padding:9px 22px;cursor:pointer;color:var(--ink-dim);letter-spacing:2px;font-size:13px;
  border-bottom:2px solid transparent}
.tabs .tab.on{color:var(--amber);border-bottom-color:var(--amber);background:#1a2530}
.traitGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.traitCard{border:1px solid var(--line);padding:8px 10px;cursor:pointer;background:#111820;transition:all .1s}
.traitCard:hover{border-color:var(--line2)}
.traitCard.on{border-color:var(--amber);background:#20292f}
.traitCard .nm{font-size:13px;font-weight:700}
.traitCard .ds{font-size:11px;color:var(--ink-dim);margin-top:3px;line-height:1.5}
.traitCard .pt{float:right;font-weight:700}
.traitCard .pt.pos{color:var(--green)} .traitCard .pt.neg{color:var(--red)}

/* ============ 藏身处 ============ */
#hideWrap{width:1200px;max-width:97vw;height:88vh;background:linear-gradient(180deg,#161f28,#0d1319);
  border:1px solid var(--line);display:flex;flex-direction:column;box-shadow:0 20px 80px #000}
.facGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.facCard{border:1px solid var(--line);padding:10px 12px;background:#111820}
.facCard .nm{font-weight:700;color:var(--amber);letter-spacing:2px}
.facCard .lv{float:right;font-size:12px}
.facCard .ds{font-size:11px;color:var(--ink-dim);margin:6px 0;line-height:1.6}
.mapCard{border:1px solid var(--line);padding:12px;cursor:pointer;background:#111820;transition:all .12s;position:relative}
.mapCard:hover{border-color:var(--amber)}
.mapCard.lock{opacity:.5;cursor:not-allowed}
.mapCard .nm{font-size:15px;font-weight:700;letter-spacing:2px;color:var(--ink)}
.mapCard:hover:not(.lock) .nm{color:var(--amber)}
.mapCard .ds{font-size:11px;color:var(--ink-dim);margin-top:6px;line-height:1.7}
.mapCard .risk{position:absolute;top:10px;right:12px;font-size:11px;letter-spacing:1px}
.shopRow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);padding:7px 10px;margin-bottom:6px;background:#111820}
.shopRow .pr{margin-left:auto;color:var(--amber);font-weight:700;white-space:nowrap}

/* ============ 死亡 / 撤离 结算 ============ */
.deadTitle{font-size:40px;letter-spacing:10px;color:var(--red);font-weight:900;
  text-shadow:0 0 30px rgba(229,72,77,.4);margin-bottom:6px}
.extTitle{font-size:40px;letter-spacing:10px;color:var(--green);font-weight:900;margin-bottom:6px}
.obit{max-width:560px;text-align:center;line-height:2;color:var(--ink);font-size:14px}
.statGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0;width:640px}
.statBox{border:1px solid var(--line);padding:10px;text-align:center;background:#111820}
.statBox .v{font-size:22px;font-weight:700;color:var(--amber)}
.statBox .k{font-size:11px;color:var(--ink-dim);letter-spacing:1px;margin-top:3px}

/* ============ 健康/技能 窗口专用 ============ */
.bodyGrid{display:grid;grid-template-columns:150px 1fr;gap:16px}
.bodyMap{position:relative;width:150px;height:200px}
.bodyPart{position:absolute;cursor:pointer;border:1px solid var(--line);background:#16202a;transition:all .1s}
.bodyPart:hover{border-color:var(--amber)}
.bodyPart .nm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-dim)}
.partDetail{border:1px solid var(--line);padding:8px 10px;margin-bottom:6px;font-size:12px;background:#111820;line-height:1.8}
.skillRow{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.skillRow .nm{width:90px;font-size:12px}
.skillRow .bar{flex:1;height:10px;background:#0c1116;border:1px solid var(--line);position:relative}
.skillRow .bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2c5d8a,#4fa3e3)}
.skillRow .lv{width:60px;text-align:right;font-size:12px;color:var(--blue)}
.recipeRow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);padding:8px 10px;margin-bottom:6px;background:#111820}
.recipeRow .ings{font-size:11px;color:var(--ink-dim);line-height:1.6}
.kbd{display:inline-block;border:1px solid var(--line2);border-bottom-width:2px;padding:0 6px;font-size:11px;
  font-family:Consolas;background:#1a232c;color:var(--amber);margin:0 2px}
.helpRow{display:flex;margin-bottom:8px;font-size:13px;align-items:center}
.helpRow .act{width:220px;color:var(--amber)}
#contList .cl-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border:1px solid var(--line);
  margin-bottom:4px;cursor:pointer;font-size:12px;background:#111820}
#contList .cl-item:hover{border-color:var(--amber)}
.hb-num{color:var(--amber);font-family:Consolas}
.blink{animation:bl 1s infinite}@keyframes bl{50%{opacity:.35}}
</style>
</head>
<body>
<div id="gameRoot">
  <canvas id="cv"></canvas>
  <canvas id="hud"></canvas>
  <div id="vig"></div>
  <div id="uiLayer">    <!-- 战局内窗口 -->
    <div class="win" id="winInv"><div class="win-h"><span class="tt">装备与背包</span><span class="sub" id="invWt"></span><span class="x" data-close="winInv">✕</span></div><div class="win-b" id="invBody"></div></div>
    <div class="win" id="winCraft"><div class="win-h"><span class="tt">制作 & 搜集</span><span class="sub">CRAFT / FORAGE</span><span class="x" data-close="winCraft">✕</span></div><div class="win-b" id="craftBody"></div></div>
    <div class="win" id="winSkills"><div class="win-h"><span class="tt">技能</span><span class="sub">SKILLS · XP</span><span class="x" data-close="winSkills">✕</span></div><div class="win-b" id="skillsBody"></div></div>
    <div class="win" id="winHealth"><div class="win-h"><span class="tt">健康 · 急救</span><span class="sub">HEALTH / FIRST AID</span><span class="x" data-close="winHealth">✕</span></div><div class="win-b" id="healthBody"></div></div>
    <div class="win" id="winMap"><div class="win-h"><span class="tt">战术地图</span><span class="sub" id="mapSub"></span><span class="x" data-close="winMap">✕</span></div><div class="win-b" id="mapBody" style="text-align:center"></div></div>
    <div class="win" id="winPause"><div class="win-h"><span class="tt">暂停</span><span class="sub">PAUSED — 单机随时暂停</span><span class="x" data-close="winPause">✕</span></div><div class="win-b" id="pauseBody"></div></div>
    <div class="win" id="winHelp"><div class="win-h"><span class="tt">操作手册</span><span class="sub">FIELD MANUAL</span><span class="x" data-close="winHelp">✕</span></div><div class="win-b" id="helpBody"></div></div>

    <!-- 全屏流程页 -->
    <div class="scr" id="scrMenu"></div>
    <div class="scr" id="scrCreate"></div>
    <div class="scr" id="scrHideout"></div>
    <div class="scr" id="scrDeath"></div>
    <div class="scr" id="scrExtract"></div>
    <div class="scr" id="scrEnding"></div>

    <div id="toasts"></div>
    <div id="tipBox"></div>
  </div>
</div>
<script>
// 运行时错误收集（调试证据用）
window.__errors = [];
window.addEventListener('error', e => {
  window.__errors.push(e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno);
  try {
    const t = document.createElement('div');
    t.className = 'toast bad'; t.textContent = '⚠ ' + e.message;
    (document.getElementById('toasts') || document.body).appendChild(t);
    setTimeout(() => t.remove(), 8000);
  } catch (_) { }
});
window.addEventListener('unhandledrejection', e => { window.__errors.push('Promise: ' + e.reason); });
</script>
<script src="game/js/core/util.js"></script>
<script src="game/js/core/input.js"></script>
<script src="game/js/data/items.js"></script>
<script src="game/js/data/enemies.js"></script>
<script src="game/js/data/traits.js"></script>
<script src="game/js/data/world.js"></script>
<script src="game/js/world/gen.js"></script>
<script src="game/js/world/fov.js"></script>
<script src="game/js/entities.js"></script>
<script src="game/js/systems.js"></script>
<script src="game/js/render.js"></script>
<script src="game/js/hud.js"></script>
<script src="game/js/ui.js"></script>
<script src="game/js/game.js"></script>
<script src="game/js/main.js"></script>
</body>
</html>
