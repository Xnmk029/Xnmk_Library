<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>续写 · 人工审读工作台</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div><span class="eyebrow">STYLE CONTINUATION / EDITORIAL REVIEW</span><h1>续写 · 人工审读</h1></div><div class="header-actions"><span id="progress"></span><button id="summaryButton">结果汇总</button><button id="exportButton">导出汇总 JSON</button></div></header>
<main id="workspace">
<aside class="library"><div class="section-label">文章目录 <span>29 篇</span></div><select id="filter" aria-label="文章筛选"><option value="all">全部文章</option><option value="pending">待审</option><option value="draft">草稿</option><option value="complete">已完成</option></select><nav id="articles"></nav><p class="muted">基准 60 分 + 人工 40 分<br>提交前默认隐藏模型及基准分。</p></aside>
<section class="reader"><div class="reader-top"><div><span class="eyebrow" id="articleId"></span><h2 id="articleTitle">加载中</h2></div><button id="revealButton">揭示模型与基准</button></div><div class="reading-controls"><div class="tabs"><button data-ref="candidate" class="active">候选正文</button><button data-ref="prompt">原文与要求</button><button data-ref="gold">第二章金标</button></div><label>字号 <input id="fontSize" type="range" min="16" max="26" value="19" aria-label="正文字号"></label></div><div id="baseline" hidden></div><article id="text"></article><div class="pager"><button id="previous">← 上一篇</button><button id="next">下一篇 →</button></div></section>
<aside class="score-panel"><div class="section-label">人工审读 <span>40 分</span></div><label class="reviewer">审核人（选填）<input id="reviewer" placeholder="姓名或代号"></label><p class="anchors" id="anchors"></p><div id="criteria"></div><label class="overall">总体意见 <span>提交必填</span><textarea id="comment" rows="3" placeholder="记录你的整体阅读感受与主要判断依据"></textarea></label><div class="totals"><div>人工合计<strong id="manualTotal">— / 40</strong></div><div>最终总分<strong id="finalTotal">待完成</strong></div></div><div class="save-actions"><button id="saveButton">保存草稿</button><button class="primary" id="submitButton">提交审核</button></div><p id="saveState" role="status" aria-live="polite">尚未修改</p></aside>
</main>
<section id="summary" hidden><div class="summary-head"><div><span class="eyebrow">REVIEW RESULTS</span><h2>审核结果</h2><p class="muted">仅已提交文章参与排名；未揭示文章继续隐藏模型及基准。</p></div><button id="backButton">返回审读</button></div><div class="table-wrap"><table><thead><tr><th>排名</th><th>文章</th><th>模型</th><th>第二轮 / 100</th><th>基准 / 60</th><th>人工 / 40</th><th>总分 / 100</th><th>审核状态</th><th>原审稿结论</th></tr></thead><tbody id="results"></tbody></table></div></section>
<div id="notice" role="status" aria-live="polite"></div><script src="/app.js"></script></body></html>
