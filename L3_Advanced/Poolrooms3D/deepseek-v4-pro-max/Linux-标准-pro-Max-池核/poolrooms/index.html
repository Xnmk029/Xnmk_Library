<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Poolrooms</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b1417'/%3E%3Cpath d='M0 22c6-4 10 2 16-1s10 1 16-2v13H0z' fill='%2357c8d8'/%3E%3C/svg%3E" />
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #05080a; }
      body { font-family: "Inter", "Helvetica Neue", "PingFang SC", system-ui, sans-serif; }
      #view { display: block; width: 100%; height: 100%; }

      /* The only screen furniture: a boot veil that fades out for good. */
      #veil {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 22px; background: #05080a; color: #cfe8ef;
        transition: opacity 1.1s ease; cursor: pointer;
      }
      #veil.gone { opacity: 0; pointer-events: none; }
      #title {
        font-size: 12px; letter-spacing: 0.62em; text-transform: uppercase;
        font-weight: 300; opacity: 0.62;
      }
      #bar { width: 190px; height: 1px; background: rgba(207, 232, 239, 0.14); overflow: hidden; }
      #bar > i { display: block; height: 100%; width: 0%; background: rgba(174, 236, 249, 0.85); transition: width 0.3s ease; }
      #hint { font-size: 10.5px; letter-spacing: 0.3em; opacity: 0; transition: opacity 0.8s ease; text-transform: uppercase; font-weight: 300; }
      #hint.on { opacity: 0.4; }
      #fatal {
        position: fixed; inset: 0; z-index: 20; display: none; padding: 40px;
        background: #07080a; color: #9fb4bb; font: 12px/1.7 ui-monospace, monospace; white-space: pre-wrap;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/": "./vendor/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="veil">
      <div id="title">Poolrooms</div>
      <div id="bar"><i></i></div>
      <div id="hint">click to enter</div>
    </div>
    <pre id="fatal"></pre>

    <script type="module">
      const fatal = (err) => {
        const el = document.getElementById('fatal');
        el.style.display = 'block';
        el.textContent = 'Poolrooms failed to start.\n\n' + (err && (err.stack || err.message || err));
        console.error(err);
      };
      window.addEventListener('error', (e) => { if (!e.filename?.includes('chrome-extension')) fatal(e.error || e.message); });
      window.addEventListener('unhandledrejection', (e) => fatal(e.reason));
      import('./src/main.js').catch(fatal);
    </script>
  </body>
</html>
