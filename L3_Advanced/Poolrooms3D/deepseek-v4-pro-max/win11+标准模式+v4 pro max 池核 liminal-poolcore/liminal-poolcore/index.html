<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Infinite Liminal Poolcore — 无限边缘空间池核</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0d1417; }
  #scene { display: block; width: 100vw; height: 100vh; }
  /* 诊断输出：给无头冒烟测试（--dump-dom）读取，人眼几乎看不见 */
  #diag {
    position: fixed; left: 0; bottom: 0; max-width: 1px; max-height: 1px;
    overflow: hidden; opacity: 0.01; pointer-events: none; font-size: 1px; color: #000;
  }
  #fatal {
    display: none; position: fixed; inset: 0; z-index: 99;
    background: #08171c; color: #ff9c8a; font: 13px/1.6 ui-monospace, Consolas, monospace;
    padding: 28px; white-space: pre-wrap; overflow: auto;
  }
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center; z-index: 5;
    background: radial-gradient(circle at 50% 45%, #dff1f5 0%, #a8d7e2 60%, #6fb3c4 100%);
    color: #0d3a47; font: 300 15px/1.8 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    letter-spacing: .22em; text-transform: uppercase; transition: opacity .8s ease;
  }
  #boot.hidden { opacity: 0; pointer-events: none; }
</style>

<!--
  依赖解析：默认使用**本地** node_modules（离线可用、版本锁定在 three@0.165.0）。
  若想改用 CDN，把下面 importmap 换成：
  {
    "imports": {
      "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
    }
  }
-->
<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
  }
}
</script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="boot">Infinite Liminal Poolcore · 正在生成</div>
  <pre id="fatal"></pre>
  <div id="diag">{}</div>

  <script type="module">
    // 主模块加载失败时也要能看到原因（例如 importmap 路径错误）
    window.addEventListener('error', (e) => {
      const el = document.getElementById('fatal');
      if (el && !el.textContent) {
        el.style.display = 'block';
        el.textContent = '脚本错误：' + (e.message || '') + '\n' + (e.filename || '');
      }
      const d = document.getElementById('diag');
      if (d) { try { const j = JSON.parse(d.textContent || '{}'); (j.errors ||= []).push(String(e.message)); d.textContent = JSON.stringify(j); } catch {} }
    });
    import('./src/main.js').then(() => {
      const b = document.getElementById('boot');
      if (b) setTimeout(() => b.classList.add('hidden'), 400);
    }).catch((err) => {
      const el = document.getElementById('fatal');
      el.style.display = 'block';
      el.textContent = '模块加载失败：\n' + (err?.stack || err);
      document.title = 'ERR: ' + (err?.message || err);
      const d = document.getElementById('diag');
      d.textContent = JSON.stringify({ stage: 'import-failed', errors: [String(err?.message || err)] });
    });
  </script>
</body>
</html>
