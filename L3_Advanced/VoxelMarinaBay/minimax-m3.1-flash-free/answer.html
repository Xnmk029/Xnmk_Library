<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>cap</title>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.1/build/three.module.js" } }</script>
</head><body><div id="log"></div>
<script type="module">
const THREE = await import('three');
const log = s => { document.getElementById('log').textContent += s + '\n'; };
const cv = document.createElement('canvas');
const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
r.setSize(640, 360);
const gl = r.getContext();
const dbg = gl.getExtension('WEBGL_debug_renderer_info');
log('VENDOR   : ' + (dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : '?'));
log('RENDERER : ' + (dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : '?'));
log('VERSION  : ' + gl.getParameter(gl.VERSION));
log('MAX_TEX  : ' + gl.getParameter(gl.MAX_TEXTURE_SIZE));
log('float RT : ' + !!gl.getExtension('EXT_color_buffer_float'));
log('half RT  : ' + !!gl.getExtension('EXT_color_buffer_half_float'));
log('aniso    : ' + !!gl.getExtension('EXT_texture_filter_anisotropic'));
log('deriv    : ' + !!gl.getExtension('OES_standard_derivatives'));
const pm = new THREE.PMREMGenerator(r);
const sc = new THREE.Scene();
sc.add(new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshBasicMaterial({color:0x88aaff})));
const t = pm.fromScene(sc, 0.1);
log('pmrem    : ' + (t && t.texture ? 'OK' : 'FAIL'));
// instancing + vertex colors
const g = new THREE.BoxGeometry(1,1,1);
const inst = new THREE.InstancedMesh(g, new THREE.MeshStandardMaterial({vertexColors:true}), 100);
const m4 = new THREE.Matrix4();
for (let i=0;i<100;i++){ m4.makeTranslation(i,0,0); inst.setMatrixAt(i,m4); inst.setColorAt(i, new THREE.Color(1,0,0)); }
const sc2 = new THREE.Scene(); sc2.add(inst);
const cam = new THREE.PerspectiveCamera(50,1.7,0.1,100); cam.position.set(50,5,50); cam.lookAt(50,0,0);
r.render(sc2, cam);
log('instanced: OK');
// shadow test
r.shadowMap.enabled = true;
const dl = new THREE.DirectionalLight(0xffffff, 1); dl.castShadow = true;
dl.shadow.mapSize.set(2048,2048);
const o = new THREE.Mesh(new THREE.PlaneGeometry(10,10), new THREE.MeshStandardMaterial());
o.rotation.x = -Math.PI/2; o.receiveShadow = true;
const c = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshStandardMaterial());
c.position.y = 2; c.castShadow = true;
sc2.add(o, c, dl);
r.render(sc2, cam);
log('shadows  : OK');
const px = new Uint8Array(4);
gl.readPixels(320,180,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
log('readback : ' + px.join(','));
log('ALLDONE');
document.title = 'ALLDONE';
</script></body></html>
