<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>boot</title>
<script src="https://unpkg.com/three@0.147.0/build/three.min.js" onerror="window.__umdErr='script error'"></script>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.1/build/three.module.js" } }
</script>
</head>
<body>
<div id="log"></div>
<script>
  const log = s => { document.getElementById('log').textContent += s + '\n'; };
  log('UMD global THREE: ' + (typeof THREE) + ' rev=' + (window.THREE && THREE.REVISION));
  window.__umd = (typeof THREE !== 'undefined');
</script>
<script type="module">
  const t0 = performance.now();
  try {
    const m = await import('three');
    log('ESM import ok rev=' + m.REVISION + ' in ' + Math.round(performance.now() - t0) + 'ms');
    window.__esm = true;
  } catch (e) {
    log('ESM import FAILED: ' + e.name + ' ' + e.message);
    window.__esm = false;
  }
  document.title = 'umd=' + window.__umd + ' esm=' + window.__esm;
</script>
</body>
</html>
