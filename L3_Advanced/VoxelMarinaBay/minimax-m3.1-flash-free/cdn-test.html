<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>loading</title>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.1/build/three.module.js" } }
</script>
<style>body{margin:0;background:#111;color:#0f0;font:14px monospace}#log{position:fixed;top:0;left:0;padding:8px;white-space:pre-wrap}</style>
</head>
<body>
<div id="log">booting…</div>
<script type="module">
const log = (s) => { document.getElementById('log').textContent += '\n' + s; console.log(s); };
try {
  const THREE = await import('three');
  log('three version: ' + THREE.REVISION);
  const canvas = document.createElement('canvas');
  document.body.appendChild(canvas);
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(400, 300);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x123456);
  const cam = new THREE.PerspectiveCamera(50, 4 / 3, 0.1, 100);
  cam.position.set(2, 2, 3); cam.lookAt(0, 0, 0);
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0xff8844 }));
  scene.add(mesh, new THREE.DirectionalLight(0xffffff, 2), new THREE.AmbientLight(0x404040));
  renderer.render(scene, cam);
  const gl = renderer.getContext();
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  log('GL: ' + (dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)));
  log('shadowMap: ' + renderer.shadowMap.enabled);
  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = pmrem.fromScene(new THREE.Scene(), 0.04);
  log('pmrem ok: ' + (!!env.texture));
  log('RESULT=OK');
  document.title = 'RESULT=OK three=' + THREE.REVISION;
} catch (e) {
  log('ERROR ' + e.message);
  document.title = 'RESULT=FAIL ' + e.message;
}
</script>
</body>
</html>
