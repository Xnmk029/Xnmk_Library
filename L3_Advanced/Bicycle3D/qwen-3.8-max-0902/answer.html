<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>交互式 3D 自行车工作室与装配模拟器 · Custom Bicycle Builder</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --panel-bg: rgba(20,23,29,0.82);
    --panel-br: rgba(255,255,255,0.10);
    --ink:#eef2f7; --ink-dim:#a9b3c1; --accent:#ffc247; --accent2:#57c7ff;
    --row-h:26px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0e1116;
    font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);}
  #viewport{position:fixed;inset:0;}
  #viewport canvas{display:block;}

  /* ---------- top bar ---------- */
  #topbar{position:fixed;top:0;left:0;right:0;height:46px;z-index:20;
    display:flex;align-items:center;gap:12px;padding:0 14px;
    background:linear-gradient(180deg,rgba(12,15,20,.88),rgba(12,15,20,.35));
    backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,.06);
    pointer-events:none;}
  #topbar .brand{font-weight:700;letter-spacing:.4px;font-size:14px;pointer-events:auto;}
  #topbar .brand b{color:var(--accent);}
  #topbar .sub{font-size:11px;color:var(--ink-dim);pointer-events:auto;}
  #topbar .spacer{flex:1;}
  .tbtn{pointer-events:auto;cursor:pointer;border:1px solid var(--panel-br);
    background:rgba(255,255,255,.06);color:var(--ink);font-size:11.5px;
    padding:5px 9px;border-radius:7px;transition:.15s;white-space:nowrap;}
  .tbtn:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);}
  .tbtn.on{background:var(--accent);color:#1a1a1a;border-color:var(--accent);font-weight:600;}

  /* ---------- side panel ---------- */
  #panel{position:fixed;top:52px;right:8px;bottom:8px;width:322px;z-index:18;
    background:var(--panel-bg);border:1px solid var(--panel-br);border-radius:12px;
    backdrop-filter:blur(9px);display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.45);transition:transform .25s ease,opacity .2s;}
  #panel.hidden{transform:translateX(360px);opacity:0;pointer-events:none;}
  #panelHead{padding:9px 12px;border-bottom:1px solid var(--panel-br);
    display:flex;align-items:center;gap:8px;flex:0 0 auto;}
  #panelHead .t{font-size:12.5px;font-weight:700;letter-spacing:.3px;}
  #panelHead .spacer{flex:1;}
  #panelBody{overflow-y:auto;overflow-x:hidden;padding:6px 8px 14px;flex:1 1 auto;}
  #panelBody::-webkit-scrollbar{width:9px;}
  #panelBody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:6px;border:2px solid transparent;background-clip:padding-box;}
  #panelBody::-webkit-scrollbar-track{background:transparent;}

  .group{border:1px solid rgba(255,255,255,.07);border-radius:9px;margin:7px 0;overflow:hidden;background:rgba(255,255,255,.025);}
  .ghead{display:flex;align-items:center;gap:7px;padding:8px 10px;cursor:pointer;user-select:none;
    background:rgba(255,255,255,.04);}
  .ghead:hover{background:rgba(255,255,255,.08);}
  .ghead .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto;}
  .ghead .gt{font-size:12px;font-weight:600;letter-spacing:.2px;flex:1;}
  .ghead .chev{font-size:10px;color:var(--ink-dim);transition:transform .2s;}
  .group.collapsed .chev{transform:rotate(-90deg);}
  .gbody{padding:6px 10px 10px;display:flex;flex-direction:column;gap:7px;}
  .group.collapsed .gbody{display:none;}

  .row{display:flex;flex-direction:column;gap:3px;}
  .row .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--ink-dim);}
  .row .lab .val{color:var(--accent2);font-variant-numeric:tabular-nums;font-weight:600;font-size:11px;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer;}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:3px;background:rgba(255,255,255,.18);}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:var(--accent);margin-top:-4.5px;border:2px solid #1b1e24;box-shadow:0 0 0 1px rgba(255,255,255,.25);}
  input[type=range]::-moz-range-track{height:4px;border-radius:3px;background:rgba(255,255,255,.18);}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:2px solid #1b1e24;border-radius:50%;background:var(--accent);}
  .seg{display:flex;gap:4px;flex-wrap:wrap;}
  .seg button{flex:1;min-width:34px;cursor:pointer;border:1px solid var(--panel-br);background:rgba(255,255,255,.05);
    color:var(--ink-dim);font-size:11px;padding:5px 4px;border-radius:6px;transition:.12s;}
  .seg button:hover{background:rgba(255,255,255,.12);color:var(--ink);}
  .seg button.on{background:var(--accent2);color:#10141a;border-color:var(--accent2);font-weight:700;}
  .swatches{display:flex;gap:6px;flex-wrap:wrap;}
  .swatch{width:26px;height:26px;border-radius:6px;cursor:pointer;border:2px solid rgba(255,255,255,.15);position:relative;}
  .swatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent);}
  .colorline{display:flex;align-items:center;gap:8px;}
  .colorline input[type=color]{width:34px;height:24px;border:none;background:transparent;cursor:pointer;padding:0;}
  .colorline .nm{font-size:11px;color:var(--ink-dim);flex:1;}

  /* specs */
  .specs{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;}
  .spec{display:flex;justify-content:space-between;font-size:11px;border-bottom:1px dashed rgba(255,255,255,.08);padding:2px 0;}
  .spec .k{color:var(--ink-dim);}
  .spec .v{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600;}
  .weight{margin-top:8px;padding:8px 10px;border-radius:8px;background:linear-gradient(135deg,rgba(255,194,71,.16),rgba(87,199,255,.12));
    border:1px solid rgba(255,194,71,.28);display:flex;justify-content:space-between;align-items:center;}
  .weight .k{font-size:11px;color:var(--ink-dim);}
  .weight .v{font-size:19px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;}
  .cfgline{font-size:12px;font-weight:700;color:var(--accent2);letter-spacing:.5px;text-align:center;margin:2px 0 4px;}

  /* labels overlay */
  #labels{position:fixed;inset:0;z-index:15;pointer-events:none;}
  .lbl{position:absolute;transform:translate(-50%,-140%);font-size:10px;white-space:nowrap;
    background:rgba(14,17,22,.72);border:1px solid rgba(255,255,255,.16);color:var(--ink);
    padding:1px 6px;border-radius:20px;letter-spacing:.2px;opacity:0;transition:opacity .2s;}
  .lbl.show{opacity:1;}
  .lbl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:9px;background:rgba(255,255,255,.35);transform:translateX(-50%);}

  /* loader */
  #loader{position:fixed;inset:0;z-index:50;background:#0e1116;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;transition:opacity .5s;}
  #loader.gone{opacity:0;pointer-events:none;}
  #loader .ring{width:44px;height:44px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent);
    border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #loader .lt{font-size:12px;color:var(--ink-dim);letter-spacing:.4px;}
  #err{position:fixed;left:12px;bottom:12px;z-index:60;max-width:60vw;font-size:11.5px;
    background:rgba(120,20,20,.9);border:1px solid rgba(255,120,120,.5);color:#ffe;padding:8px 11px;border-radius:8px;display:none;}

  #hint{position:fixed;left:12px;bottom:12px;z-index:14;font-size:11px;color:var(--ink-dim);
    background:rgba(14,17,22,.6);border:1px solid var(--panel-br);padding:6px 10px;border-radius:8px;max-width:280px;line-height:1.5;}
  #hint b{color:var(--ink);}
  @media (max-width:760px){ #panel{width:270px;} #hint{display:none;} }
</style>
</head>
<body>
  <div id="viewport"></div>
  <div id="labels"></div>

  <div id="topbar">
    <div class="brand">🚲 <b>VELO</b>STUDIO · 装配模拟器</div>
    <div class="sub">Custom Bicycle Builder &amp; Assembly Simulator</div>
    <div class="spacer"></div>
    <button class="tbtn" id="btnExplode">分解视图</button>
    <button class="tbtn" id="btnSpin">轮组转动</button>
    <button class="tbtn" id="btnLabels">组件标签</button>
    <button class="tbtn" id="btnPanel">隐藏面板</button>
  </div>

  <div id="panel">
    <div id="panelHead">
      <span class="t">参数控制台 / Build Console</span>
      <span class="spacer"></span>
      <button class="tbtn" id="btnReset">重置</button>
    </div>
    <div id="panelBody"><!-- groups injected here --></div>
  </div>

  <div id="hint">
    <b>操作：</b>左键旋转 · 右键平移 · 滚轮缩放 · 顶部按钮切换分解/标签。
    所有几何均为程序化生成，参数变化时部件自动重新对齐。
  </div>

  <div id="loader"><div class="ring"></div><div class="lt">正在初始化工作室 / Building the workshop…</div></div>
  <div id="err"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   VELOSTUDIO — 单文件交互式 3D 自行车工作室与装配模拟器
   场景图 / 依赖更新架构 / NPR 赛璐璐渲染管线 均在文末说明
   ============================================================ */
const CDN_VERSION = '0.160.0';
const DEG = Math.PI / 180;
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const lerp  = (a,b,t)=>a+(b-a)*t;
const V = (x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);

/* 传动侧约定：+Z =  drive side（牙盘/飞轮/后拨/链条），-Z = 非传动侧（碟片/夹器） */
const DRIVE = 1;

/* ---------------- 默认参数 ---------------- */
const DEFAULTS = {
  // Frame Geometry
  stack:0.545, reach:0.385, headAngle:73.0, seatAngle:73.5,
  seatTube:0.540, chainstay:0.408, bbDrop:0.070, compact:0.35,
  seatstayMode:'traditional', forkRake:0.045,
  // Wheels / tires
  wheelRadius:0.336, tireWidth:0.028, rimDepth:0.024, rimWidth:0.021,
  spokeCount:24, discBrake:true,
  // Drivetrain
  chainrings:2, cassetteSpeeds:11, cassetteLarge:30, chainringBig:50, chainringSmall:34,
  crankLength:0.1725,
  // Fit & Cockpit
  seatHeight:0.720, saddleForeAft:0.000, stemLength:0.110, stemAngle:6.0,
  barWidth:0.420, barRise:0.012, barFlare:8.0, barDrop:0.128, barReach:0.075,
  // Assembly
  explode:0.0, spin:false, autoRotate:false,
  // Colors & finishes
  colFrame:'#e8503a', colFork:'#2a2d34', colRim:'#d8dbe0', colDrive:'#b9bec7',
  colCockpit:'#22252b', colSaddle:'#3a2b2b', colAccent:'#ffc247', colTire:'#202226',
  finish:'gloss',
  // Render style
  outline:true, outlineWidth:1.25, celSteps:4, saturate:1.06, posterize:0,
  pixelate:1, bgStyle:'studio', showEnv:true, showLabels:false,
};
let P = { ...DEFAULTS };

/* ---------------- UI schema (drives panel generation) ---------------- */
const GROUPS = [
  { id:'geo', title:'Frame Geometry · 车架几何', dot:'#ff6b5a', items:[
    {k:'stack',   lab:'Stack 立管高', type:'range', min:0.500,max:0.620,step:0.001, fmt:v=>(v*1000|0)+' mm'},
    {k:'reach',   lab:'Reach 前伸',   type:'range', min:0.350,max:0.430,step:0.001, fmt:v=>(v*1000|0)+' mm'},
    {k:'headAngle',lab:'头管角度',     type:'range', min:70.0,max:75.0,step:0.1, fmt:v=>v.toFixed(1)+'°'},
    {k:'seatAngle',lab:'座管角度',     type:'range', min:71.0,max:76.0,step:0.1, fmt:v=>v.toFixed(1)+'°'},
    {k:'seatTube',lab:'座管长度',      type:'range', min:0.420,max:0.620,step:0.002, fmt:v=>(v*1000|0)+' mm'},
    {k:'chainstay',lab:'后下叉长',     type:'range', min:0.395,max:0.435,step:0.001, fmt:v=>(v*1000|0)+' mm'},
    {k:'bbDrop',  lab:'五通落差',      type:'range', min:0.055,max:0.085,step:0.001, fmt:v=>(v*1000|0)+' mm'},
    {k:'forkRake',lab:'前叉偏移',      type:'range', min:0.030,max:0.060,step:0.001, fmt:v=>(v*1000|0)+' mm'},
    {k:'compact', lab:'紧凑度 / 压缩度', type:'range', min:0.0,max:1.0,step:0.01, fmt:v=>(v*100).toFixed(0)+'%'},
    {k:'seatstayMode', lab:'后上叉样式', type:'seg', opts:[['traditional','传统'],['dropped','下沉式']]},
  ]},
  { id:'wheel', title:'Wheels & Tires · 轮组轮胎', dot:'#57c7ff', items:[
    {k:'wheelRadius',lab:'轮径半径',   type:'range', min:0.300,max:0.360,step:0.001, fmt:v=>(v*1000|0)+' mm'},
    {k:'tireWidth',lab:'胎宽',        type:'range', min:0.023,max:0.050,step:0.001, fmt:v=>(v*1000|0)+' mm'},
    {k:'rimDepth', lab:'圈高',        type:'range', min:0.014,max:0.060,step:0.001, fmt:v=>(v*1000|0)+' mm'},
    {k:'spokeCount',lab:'辐条数',      type:'seg', opts:[[16,'16'],[20,'20'],[24,'24'],[28,'28'],[32,'32']]},
    {k:'discBrake',lab:'刹车',         type:'seg', opts:[[true,'碟刹'],[false,'圈刹']]},
  ]},
  { id:'drive', title:'Drivetrain · 传动系统', dot:'#ffc247', items:[
    {k:'chainrings', lab:'牙盘片数',   type:'seg', opts:[[1,'1×'],[2,'2×'],[3,'3×']]},
    {k:'cassetteSpeeds', lab:'飞轮速别', type:'seg', opts:[[7,'7'],[8,'8'],[9,'9'],[10,'10'],[11,'11'],[12,'12']]},
    {k:'cassetteLarge',lab:'最大齿',   type:'range', min:25,max:46,step:1, fmt:v=>v.toFixed(0)+'T'},
    {k:'chainringBig', lab:'大盘齿数', type:'range', min:38,max:56,step:1, fmt:v=>v.toFixed(0)+'T'},
    {k:'chainringSmall',lab:'小盘齿数',type:'range', min:24,max:44,step:1, fmt:v=>v.toFixed(0)+'T'},
    {k:'crankLength',lab:'曲柄长',     type:'range', min:0.160,max:0.180,step:0.0025, fmt:v=>(v*1000).toFixed(1)+' mm'},
  ]},
  { id:'fit', title:'Fit & Cockpit · 座舱适配', dot:'#8ee06a', items:[
    {k:'seatHeight', lab:'坐垫高度',   type:'range', min:0.620,max:0.820,step:0.002, fmt:v=>(v*1000|0)+' mm'},
    {k:'saddleForeAft',lab:'坐垫前后', type:'range', min:-0.030,max:0.030,step:0.001, fmt:v=>((v*1000)|0)+' mm'},
    {k:'stemLength', lab:'把立长度',   type:'range', min:0.080,max:0.140,step:0.002, fmt:v=>(v*1000|0)+' mm'},
    {k:'stemAngle',  lab:'把立角度',   type:'range', min:-12,max:24,step:1, fmt:v=>v.toFixed(0)+'°'},
    {k:'barWidth',   lab:'车把宽度',   type:'range', min:0.380,max:0.480,step:0.002, fmt:v=>(v*1000|0)+' mm'},
    {k:'barRise',    lab:'抬升 Rise',  type:'range', min:0.000,max:0.060,step:0.001, fmt:v=>(v*1000|0)+' mm'},
    {k:'barFlare',   lab:'外撇 Flare', type:'range', min:0,max:24,step:1, fmt:v=>v.toFixed(0)+'°'},
    {k:'barDrop',    lab:'弯把落差',   type:'range', min:0.090,max:0.160,step:0.002, fmt:v=>(v*1000|0)+' mm'},
  ]},
  { id:'asm', title:'Assembly · 装配状态', dot:'#c792ea', items:[
    {k:'explode', lab:'分解程度', type:'range', min:0,max:1,step:0.01, fmt:v=>(v*100).toFixed(0)+'%'},
    {k:'spin',    lab:'轮组/曲柄转动', type:'toggle'},
    {k:'autoRotate', lab:'相机自动环绕', type:'toggle'},
    {type:'camPresets'},
  ]},
  { id:'color', title:'Colors & Finishes · 配色表面', dot:'#ff9ecd', items:[
    {k:'colFrame',  lab:'车架',   type:'color'},
    {k:'colFork',   lab:'前叉',   type:'color'},
    {k:'colRim',    lab:'轮圈',   type:'color'},
    {k:'colDrive',  lab:'传动',   type:'color'},
    {k:'colCockpit',lab:'座舱',   type:'color'},
    {k:'colSaddle', lab:'坐垫',   type:'color'},
    {k:'colAccent', lab:'点缀',   type:'color'},
    {k:'colTire',   lab:'轮胎',   type:'color'},
    {type:'presets'},
    {k:'finish', lab:'表面预设', type:'seg', opts:[['gloss','亮光'],['matte','哑光'],['metallic','金属'],['carbon','碳纤维']]},
  ]},
  { id:'render', title:'Render Style · 渲染风格', dot:'#7fd6c2', items:[
    {k:'outline',    lab:'墨线轮廓',   type:'toggle'},
    {k:'outlineWidth',lab:'轮廓粗细',  type:'range', min:0.4,max:2.6,step:0.05, fmt:v=>v.toFixed(2)},
    {k:'celSteps',   lab:'色阶分离',   type:'seg', opts:[[3,'3'],[4,'4'],[5,'5'],[6,'6']]},
    {k:'saturate',   lab:'饱和度',     type:'range', min:0.6,max:1.5,step:0.01, fmt:v=>v.toFixed(2)},
    {k:'posterize',  lab:'海报化',     type:'range', min:0,max:1,step:0.01, fmt:v=>(v*100|0)+'%'},
    {k:'pixelate',   lab:'像素化',     type:'seg', opts:[[1,'关'],[2,'2×'],[3,'3×']]},
    {k:'bgStyle',    lab:'背景',       type:'seg', opts:[['studio','工作室'],['void','纯色'],['dusk','暮色']]},
    {k:'showEnv',    lab:'场景道具',   type:'toggle'},
  ]},
  { id:'specs', title:'Specifications · 实时规格', dot:'#ffd479', items:[ {type:'specs'} ]},
];

/* ---------------- 颜色预设 ---------------- */
const COLOR_PRESETS = [
  {name:'Racing Red', c:{colFrame:'#e8503a',colFork:'#2a2d34',colRim:'#d8dbe0',colDrive:'#b9bec7',colCockpit:'#22252b',colSaddle:'#3a2b2b',colAccent:'#ffc247',colTire:'#202226'}},
  {name:'Ocean Teal', c:{colFrame:'#1f9c9c',colFork:'#123137',colRim:'#cfd6da',colDrive:'#aab4bb',colCockpit:'#1a2426',colSaddle:'#20323a',colAccent:'#7fe3d0',colTire:'#1c1f22'}},
  {name:'Sunset Gold',c:{colFrame:'#f0a92e',colFork:'#3a2a12',colRim:'#e6dcc8',colDrive:'#c9b48a',colCockpit:'#2b2418',colSaddle:'#4a3418',colAccent:'#ff7a45',colTire:'#22201c'}},
  {name:'Stealth',    c:{colFrame:'#2b2f36',colFork:'#1b1e23',colRim:'#3a3f47',colDrive:'#585f69',colCockpit:'#15171b',colSaddle:'#1e2126',colAccent:'#7a828c',colTire:'#15171a'}},
  {name:'Sakura',     c:{colFrame:'#f2a0bd',colFork:'#5a3742',colRim:'#f7e7ee',colDrive:'#d8b7c4',colCockpit:'#4a2f39',colSaddle:'#6b4150',colAccent:'#ff6f9c',colTire:'#2a2126'}},
  {name:'Team Green', c:{colFrame:'#37b24d',colFork:'#12351b',colRim:'#dbe6d9',colDrive:'#a9bda4',colCockpit:'#16241a',colSaddle:'#1e3a24',colAccent:'#d3f26a',colTire:'#1b1f1b'}},
];

/* ---------------- renderer / scene / camera ---------------- */
const viewport = document.getElementById('viewport');
const renderer = new THREE.WebGLRenderer({ antialias:false, alpha:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = false;
viewport.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#cfd8e3');

const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.05, 200);
camera.position.set(1.55, 0.85, 1.95);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.target.set(0, 0.52, 0);
controls.minDistance = 0.6;
controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI*0.495;
controls.update();

/* ---------------- lights（明亮可读基线） ---------------- */
const hemi = new THREE.HemisphereLight(0xffffff, 0x9aa6b4, 1.15);
scene.add(hemi);
const keyLight = new THREE.DirectionalLight(0xffffff, 1.55);
keyLight.position.set(2.4, 3.6, 2.2);
scene.add(keyLight);

/* ---------------- toon gradient maps（色阶分离） ---------------- */
function makeGradient(steps){
  const data = new Uint8Array(steps);
  for(let i=0;i<steps;i++){
    // 非线性分布：保留高光，压出清晰明暗分区
    const t = i/(steps-1);
    const v = Math.round(255*Math.pow(t, 0.82));
    data[i] = clamp(Math.round(lerp(46, 255, Math.pow(t,0.72))), 0, 255);
    void v;
  }
  const tex = new THREE.DataTexture(data, steps, 1, THREE.RedFormat);
  tex.minFilter = tex.magFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}
const GRADS = { 3:makeGradient(3), 4:makeGradient(4), 5:makeGradient(5), 6:makeGradient(6) };

/* ---------------- finish presets ---------------- */
const FINISH = {
  gloss:    {steps:5, sat:1.10, sheen:0.16, rough:0.35, metal:0.05},
  matte:    {steps:3, sat:0.90, sheen:0.00, rough:0.95, metal:0.00},
  metallic: {steps:5, sat:1.02, sheen:0.42, rough:0.22, metal:0.55},
  carbon:   {steps:4, sat:0.95, sheen:0.24, rough:0.42, metal:0.20},
};

/* ---------------- material system（按分组着色 + 表面预设） ---------------- */
const MAT_GROUPS = {
  frame:'colFrame', fork:'colFork', rim:'colRim', drive:'colDrive',
  cockpit:'colCockpit', saddle:'colSaddle', accent:'colAccent', tire:'colTire',
  rubber:'colTire', steel:'#9aa1ab', dark:'#20242a', chrome:'#c7ccd4',
  tape:'colCockpit', plastic:'#2b2f36',
  // 环境（工作室）固定色，不受配色预设影响
  floor:'#8b96a3', wall:'#c2ccd8', wall2:'#aeb9c6', wood:'#c08a4e', metal:'#98a2ad',
  crate:'#cf9a54', cloth:'#4a5765', rubberMat:'#3b4149', tool:'#d8dee6', paper:'#e7e2d6',
};
const materials = {};   // group -> MeshToonMaterial
function ensureMaterial(group){
  if(materials[group]) return materials[group];
  const src = MAT_GROUPS[group];
  const isHex = typeof src === 'string' && src.startsWith('#');
  const color = new THREE.Color(isHex ? src : '#cccccc');
  const m = new THREE.MeshToonMaterial({ color, gradientMap: GRADS[4] });
  m.userData.group = group;
  m.userData.isHex = isHex;
  materials[group] = m;
  return m;
}
function applyMaterials(){
  const fin = FINISH[P.finish] || FINISH.gloss;
  const grad = GRADS[clamp(P.celSteps|0,3,6)] || GRADS[4];
  for(const g in materials){
    const m = materials[g];
    const src = MAT_GROUPS[g];
    const isColorGroup = (typeof src === 'string' && src.startsWith('col'));
    // 每次都从基准色重置，避免多次调用累积漂移
    const base = isColorGroup ? P[src] : (typeof src === 'string' ? src : '#cccccc');
    m.color.set(base);
    if(isColorGroup){
      const hsl = {}; m.color.getHSL(hsl);
      m.color.setHSL(hsl.h, clamp(hsl.s*fin.sat*P.saturate,0,1), clamp(hsl.l+fin.sheen*0.05,0.04,0.96));
    }
    m.gradientMap = grad;
    m.needsUpdate = true;
  }
}

/* ---------------- geometry helpers + cache ---------------- */
const geoCache = new Map();
function cachedGeo(key, factory){
  let g = geoCache.get(key);
  if(!g){ g = factory(); geoCache.set(key, g); }
  return g;
}
const UP = new THREE.Vector3(0,1,0);
const _q = new THREE.Quaternion();
const _dir = new THREE.Vector3();
const _mid = new THREE.Vector3();

// 单位高度锥管（height=1，沿+Y），按半径键缓存；用时以 scale.y 拉伸长度
function unitTubeGeo(rA, rB, seg=14){
  const key = `tube|${rA.toFixed(4)}|${rB.toFixed(4)}|${seg}`;
  return cachedGeo(key, ()=> new THREE.CylinderGeometry(rB, rA, 1, seg, 1, false));
}
// 在 A→B 之间放置一根锥形管（rA 在 A 端，rB 在 B 端）
function tubeBetween(A, B, rA, rB, mat, seg=14){
  const mesh = new THREE.Mesh(unitTubeGeo(rA, rB, seg), mat);
  orientTube(mesh, A, B);
  return mesh;
}
function orientTube(mesh, A, B){
  _dir.subVectors(B, A);
  const len = _dir.length();
  _dir.normalize();
  _q.setFromUnitVectors(UP, _dir);
  mesh.quaternion.copy(_q);
  mesh.position.copy(_mid.addVectors(A,B).multiplyScalar(0.5));
  mesh.scale.set(1, Math.max(len,1e-5), 1);
  mesh.userData.len = len;
  return mesh;
}
function boxMesh(w,h,d,mat){
  const key = `box|1|1|1`;
  const g = cachedGeo(key, ()=> new THREE.BoxGeometry(1,1,1));
  const m = new THREE.Mesh(g, mat);
  m.scale.set(w,h,d);
  return m;
}
function cylMesh(rTop,rBot,h,mat,seg=16,openEnded=false){
  const key = `cyl|${rTop.toFixed(4)}|${rBot.toFixed(4)}|${seg}|${openEnded}`;
  const g = cachedGeo(key, ()=> new THREE.CylinderGeometry(rTop,rBot,1,seg,1,openEnded));
  const m = new THREE.Mesh(g, mat);
  m.scale.y = h;
  return m;
}

/* ---------------- 车架骨架解算（依赖锚点，供所有部件对齐） ---------------- */
function computeSkeleton(p){
  const ha = p.headAngle*DEG, sa = p.seatAngle*DEG;
  const cosH=Math.cos(ha), sinH=Math.sin(ha), cosS=Math.cos(sa), sinS=Math.sin(sa);

  const BB = V(0,0,0);
  const HT_top = V(p.reach, p.stack, 0);

  // 头管长度受紧凑度影响（非整体缩放，而是组合变化）
  const htLen = lerp(0.176, 0.118, clamp(p.compact,0,1));
  // 转向轴：向上向后 u_up，向下向前 = -u_up
  const uUp = V(-cosH, sinH, 0);            // 沿头管向上（向后倾）
  const uDown = V(cosH, -sinH, 0);           // 沿前叉向下（向前）
  const HT_bot = HT_top.clone().addScaledVector(uUp, -htLen); // = HT_top - htLen*uUp

  // 后轴：五通落差使轴线高于 BB；后下叉为 BB→后轴的直线距离
  const csHoriz = Math.sqrt(Math.max(p.chainstay*p.chainstay - p.bbDrop*p.bbDrop, 1e-6));
  const rearAxle = V(-csHoriz, p.bbDrop, 0);

  // 前轴：沿转向轴下探 t，使前轴与后轴同高（双轮着地），并含前叉偏移 rake
  const perpF = V(sinH, cosH, 0);            // 垂直转向轴、指向前方（rake 方向）
  const Ay = HT_bot.y;
  const t = (Ay - p.bbDrop + p.forkRake*cosH) / sinH;  // 前叉轴向后长（axle-to-crown），使前轴与后轴同高着地
  const forkLen = Math.max(t, 0.10);
  const frontAxle = HT_bot.clone().addScaledVector(uDown, forkLen).addScaledVector(perpF, p.forkRake);

  // 座管簇（上管/座撑交汇）：紧凑度缩短座管 → 上管下斜、座管延伸变长
  const effSeat = p.seatTube * (1 - 0.30*clamp(p.compact,0,1));
  const uSeat = V(-cosS, sinS, 0);           // 沿座管向上（向后倾）
  const seatCluster = BB.clone().addScaledVector(uSeat, effSeat);

  // 坐垫位置（Fit：座高沿座管轴量取 + 前后偏移）
  const saddlePos = BB.clone().addScaledVector(uSeat, p.seatHeight);
  // 座管夹/座管顶：座管簇上方一点
  const seatTop = seatCluster.clone().addScaledVector(uSeat, 0.02);

  // 把立/车把：转向轴顶端 + 垫圈，把立沿前向并含角度
  const steererTop = HT_top.clone().addScaledVector(uUp, 0.028); // 碗组顶盖 + 垫圈
  const stemDir = V(cosH, sinH, 0).normalize();                  // 大致前向上（垂直转向轴的水平前向）
  // 把立沿"前向"，并绕 Z 抬升 stemAngle
  const sa2 = p.stemAngle*DEG;
  const stemAxis = V(Math.cos(sa2), Math.sin(sa2), 0);           // 在 XY 平面内，前+上
  const barCenter = steererTop.clone().addScaledVector(stemAxis, p.stemLength);
  barCenter.addScaledVector(uUp, 0.0); // 保持
  barCenter.x += 0.0; 

  const wheelbase = frontAxle.x - rearAxle.x;
  const groundY = p.bbDrop - p.wheelRadius; // BB 原点坐标系下的地面高度
  const effTopTube = HT_top.distanceTo(seatCluster); // 近似有效上管（水平投影见 specs）
  const effTTproj = Math.abs(HT_top.x - seatCluster.x);

  return {
    BB, HT_top, HT_bot, rearAxle, frontAxle, seatCluster, seatTop, saddlePos,
    steererTop, barCenter, stemAxis, uUp, uDown, uSeat, perpF,
    htLen, forkLen, wheelbase, groundY, effTopTube, effTTproj, csHoriz,
    ha, sa, cosH, sinH, cosS, sinS,
    bikeLiftY: -groundY,   // 抬升整车使车轮落在世界 Y=0
    centerX: -(rearAxle.x + frontAxle.x)/2, // 水平居中偏移
  };
}

/* ================= 部件构建系统 =================
   依赖更新架构：computeSkeleton() 先解算全部安装锚点，
   各 build* 函数只消费锚点，故任一参数变化都会让相关部件重新对齐。 */
const bikeGroup = new THREE.Group();
scene.add(bikeGroup);
function M(g){ return ensureMaterial(g); }
let exploders = [];            // {obj, base, axis, dist}
function addExploder(obj, axis, dist){
  exploders.push({ obj, base:obj.position.clone(), axis:axis.clone().normalize(), dist });
}
function both(fn){ fn(1); fn(-1); }   // 左右镜像

/* ---------- 车架 ---------- */
function buildFrame(grp, S){
  const f = M('frame'), acc = M('accent'), steel = M('steel'), dark = M('dark');
  const { BB, HT_top, HT_bot, seatCluster, rearAxle, uSeat, uDown } = S;

  // 头管
  grp.add(tubeBetween(HT_bot, HT_top, 0.0255, 0.0235, f, 18));
  // 下管（五通→头管下口），BB 端略粗
  grp.add(tubeBetween(BB, HT_bot, 0.0265, 0.0225, f, 18));
  // 上管（座簇→头管上口）
  const ttHead = HT_top.clone().addScaledVector(uDown, 0.016);
  grp.add(tubeBetween(seatCluster, ttHead, 0.0175, 0.0185, f, 16));
  // 座管
  grp.add(tubeBetween(BB, seatCluster.clone().addScaledVector(uSeat,0.02), 0.0205, 0.0170, f, 16));

  // 五通外壳
  const bbShell = cylMesh(0.0275, 0.0275, 0.072, f, 20);
  bbShell.rotation.x = Math.PI/2; bbShell.position.copy(BB);
  grp.add(bbShell);
  // 五通加固片
  const bbGusset = tubeBetween(BB, HT_bot.clone().multiplyScalar(0.22), 0.026, 0.012, f, 12);
  grp.add(bbGusset);

  // 后下叉 chainstay（含轻微下弓，避开牙盘）
  both((s)=>{
    const a = V(0.005, -0.006, s*0.026);
    const mid = V(lerp(a.x, rearAxle.x, 0.5), lerp(a.y, rearAxle.y, 0.5)-0.014, s*0.044);
    const b = V(rearAxle.x, rearAxle.y, s*0.058);
    grp.add(tubeBetween(a, mid, 0.0125, 0.0110, f, 12));
    grp.add(tubeBetween(mid, b, 0.0110, 0.0095, f, 12));
  });

  // 后上叉 seatstay（传统 / 下沉式 真实改变几何）
  const dropped = (P.seatstayMode==='dropped');
  const dropAmt = dropped ? 0.155 : 0.035;
  const ssTopC = seatCluster.clone().addScaledVector(uSeat, -dropAmt);
  both((s)=>{
    const a = V(ssTopC.x, ssTopC.y, s*0.016);
    const b = V(rearAxle.x, rearAxle.y, s*0.057);
    if(dropped){
      const mid = V(lerp(a.x,b.x,0.5), lerp(a.y,b.y,0.5)+0.010, s*0.040);
      grp.add(tubeBetween(a, mid, 0.0100, 0.0092, f, 12));
      grp.add(tubeBetween(mid, b, 0.0092, 0.0085, f, 12));
      // 下沉式立柱：从座簇下垂连接到下沉点
      grp.add(tubeBetween(seatCluster.clone().addScaledVector(uSeat,0.01), a, 0.0135, 0.0105, f, 12));
    } else {
      grp.add(tubeBetween(a, b, 0.0098, 0.0082, f, 12));
    }
  });
  // 座撑桥 / 刹桥
  const bridgeY = dropped ? ssTopC : seatCluster.clone().addScaledVector(uSeat,-0.06);
  grp.add(tubeBetween(V(bridgeY.x,bridgeY.y,-0.030), V(bridgeY.x,bridgeY.y,0.030), 0.007,0.007, f, 10));

  // 后勾爪 dropout + 尾钩
  both((s)=>{
    const plate = boxMesh(0.036,0.046,0.010, f);
    plate.position.set(rearAxle.x-0.004, rearAxle.y, s*0.062);
    grp.add(plate);
    const axleNut = cylMesh(0.008,0.008,0.012,steel,10);
    axleNut.rotation.x=Math.PI/2; axleNut.position.set(rearAxle.x, rearAxle.y, s*0.066);
    grp.add(axleNut);
  });
  // 尾钩（传动侧）
  const hanger = boxMesh(0.022,0.042,0.008, dark);
  hanger.position.set(rearAxle.x-0.002, rearAxle.y-0.028, DRIVE*0.055);
  grp.add(hanger);

  // 点缀环（头管上下、座簇）
  grp.add(accentRing(HT_top, S.uUp, 0.0245, acc));
  grp.add(accentRing(HT_bot, S.uUp, 0.0262, acc));
  grp.add(accentRing(seatCluster.clone().addScaledVector(uSeat,0.015), uSeat, 0.0185, acc));
  return grp;
}
function accentRing(pos, axis, r, mat){
  const m = cylMesh(r+0.0015, r+0.0015, 0.008, mat, 18);
  const q = new THREE.Quaternion().setFromUnitVectors(UP, axis.clone().normalize());
  m.quaternion.copy(q); m.position.copy(pos);
  return m;
}

/* ---------- 前叉（沿转向轴分解） ---------- */
function buildFork(grp, S){
  const fk = M('fork'), steel = M('steel'), dark = M('dark');
  const { HT_bot, HT_top, frontAxle, steererTop, uUp, uDown, perpF } = S;
  // 舵管
  grp.add(tubeBetween(HT_bot.clone().addScaledVector(uUp,-0.01), steererTop, 0.0128, 0.0122, steel, 14));
  // 叉冠
  const crown = cylMesh(0.021,0.017,0.026, fk, 16);
  crown.quaternion.copy(new THREE.Quaternion().setFromUnitVectors(UP, uDown));
  crown.position.copy(HT_bot).addScaledVector(uDown, 0.012);
  grp.add(crown);
  // 叉肩盖板
  const crownCap = boxMesh(0.05,0.018,0.05, fk);
  crownCap.position.copy(HT_bot).addScaledVector(uDown,0.026);
  grp.add(crownCap);
  // 叉腿（两段带前弓的曲线）
  both((s)=>{
    const a = HT_bot.clone().addScaledVector(uDown,0.03); a.z = s*0.019;
    const b = V(frontAxle.x, frontAxle.y, s*0.050);
    const mid = V(lerp(a.x,b.x,0.42), lerp(a.y,b.y,0.42), s*0.030);
    mid.addScaledVector(perpF, 0.020); // 前弓
    grp.add(tubeBetween(a, mid, 0.0155, 0.0135, fk, 12));
    grp.add(tubeBetween(mid, b, 0.0135, 0.0105, fk, 12));
    // 前勾爪
    const drop = boxMesh(0.030,0.040,0.009, fk);
    drop.position.set(frontAxle.x-0.002, frontAxle.y, s*0.054);
    grp.add(drop);
    const nut = cylMesh(0.007,0.007,0.010,steel,10);
    nut.rotation.x=Math.PI/2; nut.position.set(frontAxle.x, frontAxle.y, s*0.058);
    grp.add(nut);
  });
  return grp;
}

/* ---------- 碗组（沿头管/转向轴分解） ---------- */
function buildHeadset(grp, S){
  const steel = M('chrome'), acc = M('accent');
  const { HT_top, HT_bot, uUp } = S;
  const cupTop = cylMesh(0.0275,0.0245,0.014, steel, 20);
  cupTop.quaternion.copy(new THREE.Quaternion().setFromUnitVectors(UP,uUp));
  cupTop.position.copy(HT_top).addScaledVector(uUp,-0.004);
  grp.add(cupTop);
  const cupBot = cylMesh(0.0245,0.0275,0.014, steel, 20);
  cupBot.quaternion.copy(new THREE.Quaternion().setFromUnitVectors(UP,uUp));
  cupBot.position.copy(HT_bot).addScaledVector(uUp,0.004);
  grp.add(cupBot);
  // 垫圈 + 顶盖
  const sp = 0.008;
  for(let i=0;i<2;i++){
    const ring = cylMesh(0.0175,0.0175,sp, i===0?steel:acc, 16);
    ring.quaternion.copy(new THREE.Quaternion().setFromUnitVectors(UP,uUp));
    ring.position.copy(HT_top).addScaledVector(uUp, 0.008 + i*(sp+0.001));
    grp.add(ring);
  }
  const cap = cylMesh(0.014,0.017,0.010, acc, 16);
  cap.quaternion.copy(new THREE.Quaternion().setFromUnitVectors(UP,uUp));
  cap.position.copy(HT_top).addScaledVector(uUp, 0.030);
  grp.add(cap);
  return grp;
}

/* ---------- 座舱：把立 / 弯把 / 把带 / 手变 / 线管 ---------- */
function buildCockpit(grp, S){
  const ck = M('cockpit'), acc = M('accent'), dark = M('dark'), steel=M('steel'), tape=M('tape');
  const { steererTop, barCenter, stemAxis, uUp, HT_top } = S;

  // 把立本体
  const stem = tubeBetween(steererTop, barCenter, 0.0165, 0.0155, ck, 14);
  grp.add(stem);
  // 把立前盖 + 舵管夹
  const clamp = cylMesh(0.019,0.019,0.030, ck, 16);
  clamp.quaternion.copy(new THREE.Quaternion().setFromUnitVectors(UP,uUp));
  clamp.position.copy(steererTop).addScaledVector(uUp,-0.004);
  grp.add(clamp);
  const face = boxMesh(0.030,0.030,0.016, ck);
  face.position.copy(barCenter);
  grp.add(face);
  for(let i=0;i<4;i++){
    const b = cylMesh(0.0022,0.0022,0.010, acc, 6);
    const ang = (i/4)*Math.PI*2 + Math.PI/4;
    b.position.copy(barCenter).add(V(Math.cos(ang)*0.010, Math.sin(ang)*0.010, 0.010));
    b.rotation.x = Math.PI/2;
    grp.add(b);
  }

  // 弯把（左右各一条 TubeGeometry 路径，含 rise / flare / drop / reach）
  const halfW = P.barWidth/2, flare = P.barFlare*DEG;
  const rise = P.barRise, drop = P.barDrop, reach = P.barReach;
  for(const s of [1,-1]){
    const zE = s*halfW;
    const zF = s*(halfW + Math.sin(flare)*(drop+0.03));
    const pts = [
      barCenter.clone().add(V(0,0,s*0.018)),
      barCenter.clone().add(V(0.000, rise*0.55, s*halfW*0.42)),
      barCenter.clone().add(V(-0.006, rise, s*halfW*0.80)),
      barCenter.clone().add(V(reach*0.34, rise*0.66, zE*0.94)),
      barCenter.clone().add(V(reach*0.92, rise*0.16, zF*0.985)),   // 手变/兜帽位
      barCenter.clone().add(V(reach*1.00, -drop*0.52, zF)),
      barCenter.clone().add(V(reach*0.60, -drop*1.00, zF*1.015)),
      barCenter.clone().add(V(reach*0.14, -drop*0.94, zF*1.02)),   // 下把尾端
    ];
    const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.4);
    const barGeo = new THREE.TubeGeometry(curve, 60, 0.0108, 9, false);
    const bar = new THREE.Mesh(barGeo, ck);
    grp.add(bar);
    // 把带：覆盖兜帽以下区段
    const tapePts = pts.slice(3);
    const tapeCurve = new THREE.CatmullRomCurve3(tapePts, false, 'catmullrom', 0.4);
    const tapeGeo = new THREE.TubeGeometry(tapeCurve, 44, 0.0142, 9, false);
    grp.add(new THREE.Mesh(tapeGeo, tape));
    // 把带尾塞
    const plug = cylMesh(0.0125,0.0125,0.008, acc, 12);
    plug.position.copy(pts[pts.length-1]);
    plug.quaternion.copy(new THREE.Quaternion().setFromUnitVectors(UP, V(0.1,0.02,s).normalize()));
    grp.add(plug);

    // 手变/刹把（hood + lever blade）
    const hoodPos = pts[4].clone();
    const hood = new THREE.Group();
    hood.position.copy(hoodPos);
    const body = boxMesh(0.052,0.030,0.032, ck);
    body.position.set(0.012,-0.004, s*0.004);
    body.rotation.z = -0.18*s*0; 
    hood.add(body);
    const rubber = boxMesh(0.040,0.026,0.030, dark);
    rubber.position.set(0.026,-0.016, s*0.004); hood.add(rubber);
    // 刹把片
    const leverCurve = new THREE.CatmullRomCurve3([
      V(0.030,-0.018, s*0.006), V(0.058,-0.052, s*0.012), V(0.050,-0.088, s*0.014)
    ]);
    const lever = new THREE.Mesh(new THREE.TubeGeometry(leverCurve, 18, 0.0055, 7, false), steel);
    hood.add(lever);
    grp.add(hood);

    // 线管（从手变绕回头管上沿）
    const cableEnd = HT_top.clone().addScaledVector(uUp,0.030).add(V(-0.01,0,s*0.01));
    const cCurve = new THREE.CatmullRomCurve3([
      hoodPos.clone().add(V(0.03,-0.01,s*0.006)),
      hoodPos.clone().add(V(-0.02,0.03,s*0.05)),
      barCenter.clone().add(V(-0.04,0.05,s*0.03)),
      cableEnd
    ], false, 'catmullrom', 0.5);
    grp.add(new THREE.Mesh(new THREE.TubeGeometry(cCurve, 30, 0.0032, 6, false), dark));
  }
  return grp;
}

/* ---------- 座管 / 坐垫 ---------- */
function buildSeat(grp, S){
  const ck=M('cockpit'), sd=M('saddle'), steel=M('steel'), acc=M('accent');
  const { seatCluster, seatTop, saddlePos, uSeat } = S;
  // 座管夹环
  const collar = cylMesh(0.0215,0.0215,0.014, acc, 16);
  collar.quaternion.copy(new THREE.Quaternion().setFromUnitVectors(UP,uSeat));
  collar.position.copy(seatTop); grp.add(collar);
  // 座管柱
  const postTop = saddlePos.clone().addScaledVector(uSeat,-0.035);
  grp.add(tubeBetween(seatTop, postTop, 0.0138, 0.0132, steel, 14));
  // 座管夹头
  const head = boxMesh(0.030,0.022,0.028, ck);
  head.position.copy(postTop); grp.add(head);

  // 坐垫组（含前后偏移，绕 Z 微倾保持水平）
  const saddle = new THREE.Group();
  const tilt = -(73.5 - P.seatAngle)*DEG*0.4;
  saddle.position.copy(saddlePos).add(V(P.saddleForeAft,0,0));
  saddle.rotation.z = tilt;
  // 主垫体（后宽前窄，两片压扁球）
  const rearGeo = cachedGeo('sph|1', ()=> new THREE.SphereGeometry(1, 20, 14));
  const rear = new THREE.Mesh(rearGeo, sd);
  rear.scale.set(0.085,0.026,0.062); rear.position.set(-0.03,0.012,0);
  saddle.add(rear);
  const nose = new THREE.Mesh(rearGeo, sd);
  nose.scale.set(0.088,0.019,0.030); nose.position.set(0.055,0.006,0);
  saddle.add(nose);
  // 座垫底板
  const plate = boxMesh(0.20,0.012,0.055, ck);
  plate.position.set(0.005,-0.008,0); saddle.add(plate);
  // 导轨
  both((s)=>{
    const railCurve = new THREE.CatmullRomCurve3([
      V(-0.06,-0.020, s*0.022), V(0.0,-0.028, s*0.020), V(0.06,-0.022, s*0.016)
    ]);
    saddle.add(new THREE.Mesh(new THREE.TubeGeometry(railCurve, 18, 0.0026, 6, false), steel));
  });
  grp.add(saddle);
  return grp;
}

/* ---------- 齿轮/齿盘 Shape（齿数变化可见） ---------- */
function gearShape(teeth, rootR, tipR, holeR){
  const key = `gear|${teeth}|${rootR.toFixed(4)}|${tipR.toFixed(4)}|${holeR.toFixed(4)}`;
  return cachedGeo(key, ()=>{
    const s = new THREE.Shape();
    const step = Math.PI*2/teeth;
    for(let i=0;i<teeth;i++){
      const a=i*step;
      const p=(ang,r)=>[Math.cos(ang)*r, Math.sin(ang)*r];
      const p0=p(a,rootR), p1=p(a+step*0.28,tipR), p2=p(a+step*0.52,tipR), p3=p(a+step*0.82,rootR);
      if(i===0) s.moveTo(p0[0],p0[1]); else s.lineTo(p0[0],p0[1]);
      s.lineTo(p1[0],p1[1]); s.lineTo(p2[0],p2[1]); s.lineTo(p3[0],p3[1]);
    }
    s.closePath();
    if(holeR>0){ const h=new THREE.Path(); h.absarc(0,0,holeR,0,Math.PI*2,true); s.holes.push(h); }
    const g = new THREE.ExtrudeGeometry(s, {depth:0.0035, bevelEnabled:false, curveSegments:2});
    g.translate(0,0,-0.00175);
    return g;
  });
}
function rotorGeo(outerR, innerR){
  const key=`rotor|${outerR.toFixed(4)}|${innerR.toFixed(4)}`;
  return cachedGeo(key, ()=>{
    const s=new THREE.Shape(); s.absarc(0,0,outerR,0,Math.PI*2,false);
    const hub=new THREE.Path(); hub.absarc(0,0,innerR,0,Math.PI*2,true); s.holes.push(hub);
    // 镜空散热孔：两圈交错圆孔
    const ringDefs=[[ (outerR+innerR)*0.5, (outerR-innerR)*0.20, 18 ],[ outerR*0.86, (outerR-innerR)*0.11, 24 ]];
    for(const [rr,hr,n] of ringDefs){
      for(let i=0;i<n;i++){
        const a=(i/n)*Math.PI*2;
        const h=new THREE.Path(); h.absarc(Math.cos(a)*rr, Math.sin(a)*rr, hr, 0, Math.PI*2, true);
        s.holes.push(h);
      }
    }
    // 中心镜空（蜘蛛臂）
    const g=new THREE.ExtrudeGeometry(s,{depth:0.0016,bevelEnabled:false,curveSegments:16});
    g.translate(0,0,-0.0008);
    return g;
  });
}

/* ---------- 车轮 ---------- */
function buildWheel(S, which){
  const rim=M('rim'), tire=M('tire'), steel=M('steel'), chrome=M('chrome'), acc=M('accent'), dark=M('dark');
  const axle = (which==='front') ? S.frontAxle : S.rearAxle;
  const grp = new THREE.Group();
  grp.position.copy(axle);

  const tireTubeR = clamp(P.tireWidth*0.55, 0.011, 0.032);
  const rimOuterR = P.wheelRadius - tireTubeR;
  const rimInnerR = rimOuterR - P.rimDepth;
  const rimW = P.rimWidth;

  // 外胎（环面）
  const tireGeo = cachedGeo(`tire|${(rimOuterR).toFixed(4)}|${tireTubeR.toFixed(4)}`,
    ()=> new THREE.TorusGeometry(rimOuterR, tireTubeR, 12, 44));
  grp.add(new THREE.Mesh(tireGeo, tire));
  // 胎面中心线（细微）
  const tread = new THREE.Mesh(cachedGeo(`tread|${rimOuterR.toFixed(4)}|${tireTubeR.toFixed(4)}`,
    ()=> new THREE.TorusGeometry(rimOuterR+tireTubeR*0.72, tireTubeR*0.28, 6, 40)), tire);
  grp.add(tread);

  // 轮圈（旋转体矩形截面 = 框高/框宽）
  const rimGeo = cachedGeo(`rim|${rimInnerR.toFixed(4)}|${rimOuterR.toFixed(4)}|${rimW.toFixed(4)}`,
    ()=>{
      const pts=[ new THREE.Vector2(rimInnerR,-rimW/2), new THREE.Vector2(rimOuterR,-rimW/2),
                  new THREE.Vector2(rimOuterR, rimW/2), new THREE.Vector2(rimInnerR, rimW/2),
                  new THREE.Vector2(rimInnerR,-rimW/2) ];
      const g=new THREE.LatheGeometry(pts, 46);
      g.rotateX(Math.PI/2); // 轴 Y→Z
      return g;
    });
  grp.add(new THREE.Mesh(rimGeo, rim));
  // 轮圈刹车边（圈刹时高亮）
  if(!P.discBrake){
    const bs = new THREE.Mesh(cachedGeo(`bside|${rimOuterR.toFixed(4)}|${rimW.toFixed(4)}`,
      ()=>{ const pts=[new THREE.Vector2(rimOuterR-0.004,-rimW/2),new THREE.Vector2(rimOuterR,-rimW/2),
        new THREE.Vector2(rimOuterR,rimW/2),new THREE.Vector2(rimOuterR-0.004,rimW/2)];
        const g=new THREE.LatheGeometry(pts,40); g.rotateX(Math.PI/2); return g;}), chrome);
    grp.add(bs);
  }

  // 花鼓 + 法兰 + 轴
  const hubW = which==='front'?0.048:0.056;
  const hub = cylMesh(0.017,0.017,hubW, chrome, 16); hub.rotation.x=Math.PI/2; grp.add(hub);
  const fz = which==='front'?0.024:0.022;
  both((s)=>{
    const fl = cylMesh(0.030,0.030,0.004, steel, 18); fl.rotation.x=Math.PI/2; fl.position.z=s*fz; grp.add(fl);
  });
  const axleRod = cylMesh(0.006,0.006,hubW+0.05, dark, 10); axleRod.rotation.x=Math.PI/2; grp.add(axleRod);

  // 辐条（实例化，cross-2）
  const count = clamp(P.spokeCount|0, 12, 40);
  const spokeGeo = cachedGeo('spoke', ()=> new THREE.CylinderGeometry(0.0011,0.0011,1,5));
  const inst = new THREE.InstancedMesh(spokeGeo, steel, count);
  const dummy = new THREE.Object3D();
  const per = Math.ceil(count/2);
  for(let i=0;i<count;i++){
    const side = (i%2===0)?1:-1;
    const idx = Math.floor(i/2);
    const ah = (idx/per)*Math.PI*2 + (side>0?0:Math.PI/per);
    const ar = ah + side*2*(Math.PI*2/count)*1.15;
    const A = V(Math.cos(ah)*0.030, Math.sin(ah)*0.030, side*fz);
    const B = V(Math.cos(ar)*(rimInnerR-0.002), Math.sin(ar)*(rimInnerR-0.002), side*rimW*0.22);
    _dir.subVectors(B,A); const len=_dir.length(); _dir.normalize();
    dummy.position.copy(A).addScaledVector(_dir, len/2);
    dummy.quaternion.setFromUnitVectors(UP,_dir);
    dummy.scale.set(1,len,1);
    dummy.updateMatrix();
    inst.setMatrixAt(i, dummy.matrix);
  }
  inst.instanceMatrix.needsUpdate = true;
  grp.add(inst);

  // 内胎气嘴（Presta，径向朝内）
  const va = 205*DEG;
  const vdir = V(Math.cos(va), Math.sin(va), 0);
  const valve = cylMesh(0.0028,0.0028,0.026, chrome, 8);
  valve.quaternion.setFromUnitVectors(UP, vdir);
  valve.position.copy(vdir.clone().multiplyScalar(rimInnerR-0.012)); grp.add(valve);
  const vcap = cylMesh(0.0042,0.0042,0.006, dark, 8);
  vcap.quaternion.setFromUnitVectors(UP, vdir);
  vcap.position.copy(vdir.clone().multiplyScalar(rimInnerR-0.026)); grp.add(vcap);

  // 磟片（非传动侧）
  if(P.discBrake){
    const rotorR = P.wheelRadius*0.52, rotor = new THREE.Mesh(rotorGeo(rotorR, 0.022), chrome);
    rotor.material.side = THREE.DoubleSide;
    rotor.position.z = -DRIVE*0.030;
    grp.add(rotor);
    // 磟片座（蜘蛛）
    const carrier = cylMesh(0.030,0.030,0.006, dark, 14); carrier.rotation.x=Math.PI/2;
    carrier.position.z=-DRIVE*0.028; grp.add(carrier);
  }

  addExploder(grp, V(0,0, which==='front'? 1 : -1), 0.30);
  spinners.push(grp);
  return grp;
}

/* ---------- 飞轮（7–12 速锥形塔基） ---------- */
function buildCassette(S){
  const st=M('drive'), chrome=M('chrome'), dark=M('dark');
  const grp = new THREE.Group();
  grp.position.copy(S.rearAxle);
  const n = clamp(P.cassetteSpeeds|0,7,12);
  const smallT = 11, largeT = clamp(P.cassetteLarge|0, smallT+6, 46);
  const pitch = 0.0127/2;              // 齿节圆半径系数
  const zIn = 0.020, zOut = 0.020 + (n-1)*(0.0046 - (n-7)*0.00012); // 速别越高间距越窄
  const spacing = (zOut - zIn)/(n-1);
  // 塔基（锥形体）
  const body = cylMesh(0.016, 0.021, (zOut-zIn)+0.022, chrome, 16);
  body.rotation.x=Math.PI/2; body.position.z=(zIn+zOut)/2 - 0.002; grp.add(body);
  for(let i=0;i<n;i++){
    const t = Math.round(lerp(smallT, largeT, n===1?0:i/(n-1)));
    const r = t*0.002021*2.0;          // 齿数→半径
    const rootR=r*0.90, tipR=r;
    const cog = new THREE.Mesh(gearShape(t, rootR, tipR, 0.017), i%2? st: chrome);
    cog.position.z = zIn + i*spacing;
    grp.add(cog);
  }
  // 锁环
  const lock = cylMesh(0.019,0.019,0.005, dark, 16); lock.rotation.x=Math.PI/2;
  lock.position.z = zOut+0.004; grp.add(lock);
  grp.userData.cogR = largeT*0.002021*2.0;
  grp.userData.midR = Math.round(lerp(smallT,largeT,0.5))*0.002021*2.0;
  addExploder(grp, V(0,0,DRIVE), 0.20);
  spinners.push(grp);
  return grp;
}

/* ---------- 传动：中轴/曲柄/牙盘/脚踏/前拨/后拨/链条 ---------- */
let chainlineZ = 0.048;
function buildDrivetrain(S){
  const st=M('drive'), dark=M('dark'), chrome=M('chrome'), acc=M('accent'), steel=M('steel');
  const root = new THREE.Group();
  const BB=S.BB;
  // 中轴
  const bbAxis = cylMesh(0.016,0.016,0.070, chrome, 16); bbAxis.rotation.x=Math.PI/2;
  bbAxis.position.copy(BB); root.add(bbAxis);

  // 牙盘组（随曲柄旋转）
  const crank = new THREE.Group(); crank.position.copy(BB);
  const rings = P.chainrings|0;
  const bigT = clamp(P.chainringBig|0, 34, 58);
  const smallT = clamp(P.chainringSmall|0, 24, bigT-4);
  const midT = Math.round((bigT+smallT)/2);
  const ringTeeth = rings===3? [bigT,midT,smallT] : rings===2? [bigT,smallT] : [Math.round((bigT+smallT)/2)];
  const ringZ = rings===3? [0.060,0.048,0.036] : rings===2? [0.055,0.041] : [0.050];
  ringTeeth.forEach((t,i)=>{
    const r=t*0.002021*2.0;
    const g = new THREE.Mesh(gearShape(t, r*0.90, r, 0.055), st);
    g.position.z = ringZ[i]; crank.add(g);
    // 蜘蛛臂
    for(let k=0;k<5;k++){
      const a=(k/5)*Math.PI*2 + 0.3;
      const arm = boxMesh(r*0.86, 0.014, 0.006, st);
      arm.position.set(Math.cos(a)*r*0.44, Math.sin(a)*r*0.44, ringZ[i]-0.004);
      arm.rotation.z = a; crank.add(arm);
    }
  });
  chainlineZ = ringZ[0]-0.004;
  // 曲柄臂 + 脚踏
  const crankR = P.crankLength;
  const baseAng = -35*DEG;
  both((s)=>{
    const ang = baseAng + (s>0?0:Math.PI);
    const zc = s*(rings===1?0.062:0.075);
    const end = V(Math.cos(ang)*crankR, Math.sin(ang)*crankR, zc);
    const a0 = V(0,0,zc*0.7);
    crank.add(tubeBetween(a0, end, 0.016, 0.013, s>0? st: dark, 12));
    // 脚踏轴 + 体
    const ps = cylMesh(0.005,0.005,0.028, chrome, 8); ps.rotation.x=Math.PI/2; ps.position.copy(end).add(V(0,0,s*0.012)); crank.add(ps);
    const pedal = boxMesh(0.085,0.016,0.020, dark); pedal.position.copy(end).add(V(0,0,s*0.030)); crank.add(pedal);
    const pcage = boxMesh(0.075,0.006,0.026, acc); pcage.position.copy(end).add(V(0,0.008,s*0.030)); crank.add(pcage);
  });
  // 曲柄中心盖
  const cap = cylMesh(0.014,0.014,0.012, acc, 12); cap.rotation.x=Math.PI/2; cap.position.z=0.078; crank.add(cap);
  root.add(crank);
  spinners.push(crank);
  addExploder(crank, V(0,0,DRIVE), 0.14);

  // 后拨（导轮架）
  const largeR = largeT=>largeT*0.002021*2.0;
  const cogR = clamp(P.cassetteLarge|0,20,46)*0.002021*2.0;
  const rd = new THREE.Group();
  const hanger = S.rearAxle.clone().add(V(-0.010,-0.030,DRIVE*0.052));
  const gp = S.rearAxle.clone().add(V(-0.016, -(cogR+0.026), DRIVE*0.045)); // 导轮
  const tp = S.rearAxle.clone().add(V(-0.052, -(cogR+0.082), DRIVE*0.045)); // 张力轮
  const knuckle = cylMesh(0.017,0.014,0.026, dark, 14);
  knuckle.quaternion.setFromUnitVectors(UP, gp.clone().sub(hanger).normalize());
  knuckle.position.copy(hanger).lerp(gp,0.4); rd.add(knuckle);
  // 导板（内外两片）
  both((s)=>{
    const plate = tubeBetween(gp.clone().add(V(0,0,s*0.006)), tp.clone().add(V(0,0,s*0.006)), 0.006,0.005, st, 8);
    rd.add(plate);
  });
  [[gp,0.017],[tp,0.016]].forEach(([c,pr])=>{
    const pulley = new THREE.Mesh(gearShape(11, pr*0.82, pr, pr*0.35), st);
    pulley.position.copy(c); rd.add(pulley);
    const pb = cylMesh(0.004,0.004,0.010, dark, 8); pb.rotation.x=Math.PI/2; pb.position.copy(c); rd.add(pb);
  });
  root.add(rd);
  addExploder(rd, V(-0.3,-0.2,DRIVE), 0.16);
  rd.userData.gp = gp; rd.userData.tp = tp; rd.userData.cogR = cogR;

  // 前拨（仅 2/3 片时可见）
  if(rings>=2){
    const fd = new THREE.Group();
    const bigR = bigT*0.002021*2.0;
    const clampP = S.BB.clone().add(V(0.02, 0.055, 0));
    // 座管夹环
    const bandGeo = cachedGeo('fdband', ()=> new THREE.TorusGeometry(0.020,0.005,8,20,Math.PI*1.5));
    const band = new THREE.Mesh(bandGeo, dark);
    band.position.copy(S.seatCluster).addScaledVector(S.uSeat,-0.10);
    band.quaternion.setFromUnitVectors(V(0,0,1), S.uSeat);
    fd.add(band);
    // 导板笼（跨在大盘上方）
    const cagePos = V(0.02, bigR*0.9+0.012, chainlineZ+0.008);
    const cage = boxMesh(0.085,0.020,0.010, chrome);
    cage.position.copy(cagePos); cage.rotation.z=-0.12; fd.add(cage);
    const link = tubeBetween(band.position.clone(), cagePos.clone().add(V(-0.02,0,0)), 0.007,0.006, dark, 8);
    fd.add(link);
    root.add(fd);
    addExploder(fd, V(0.1,0.2,DRIVE), 0.14);
  }

  // 链条（实例化链节，沿大牙盘/飞轮/导轮闭环）
  root.add(buildChain(S, ringTeeth[0], cogR, gp, tp));
  root.userData.crank = crank; root.userData.rd = rd;
  return root;
}

function buildChain(S, ringT, cogR, gp, tp){
  const st=M('drive'), dark=M('dark');
  const grp = new THREE.Group();
  const Rc = ringT*0.002021*2.0;
  const O = S.BB, C = S.rearAxle, rp=0.017;
  const P2=[]; // 闭环采样点（XY），统一 z=chainlineZ
  const arc=(cx,cy,r,a0,a1,n)=>{ for(let i=0;i<=n;i++){ const a=lerp(a0,a1,i/n); P2.push(V(cx+Math.cos(a)*r, cy+Math.sin(a)*r, 0)); } };
  // 1) 牙盘前侧包角 90°→-90°（经 0°）
  arc(O.x,O.y,Rc, 90*DEG, -90*DEG, 16);
  // 2) 下边：牙盘底 → 张力轮
  arc(tp.x,tp.y,rp, -20*DEG, 200*DEG, 8);
  // 3) 张力轮 → 导轮
  arc(gp.x,gp.y,rp, 200*DEG, 20*DEG, 8);
  // 4) 导轮 → 飞轮后下，飞轮后侧包角 -95°→-265°（经 180° 后方，避免与上边重叠）
  arc(C.x,C.y,cogR, -95*DEG, -265*DEG, 16);
  // 链节：沿多边形均匀放置
  const pts=P2.map(p=>V(p.x,p.y,chainlineZ));
  // 计算总长
  let total=0; const seg=[];
  for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; const d=a.distanceTo(b); seg.push(d); total+=d; }
  const pitchLen=0.0127; const links=Math.max(20, Math.round(total/pitchLen));
  const linkGeo = cachedGeo('chainlink', ()=> new THREE.BoxGeometry(1,0.006,0.0055));
  const inst = new THREE.InstancedMesh(linkGeo, st, links);
  const dummy=new THREE.Object3D();
  for(let i=0;i<links;i++){
    const target=(i/links)*total; let acc=0, si=0;
    while(si<seg.length-1 && acc+seg[si]<target){ acc+=seg[si]; si++; }
    const a=pts[si], b=pts[(si+1)%pts.length];
    const f=seg[si]>0?(target-acc)/seg[si]:0;
    const pos=a.clone().lerp(b,f);
    _dir.subVectors(b,a).normalize();
    dummy.position.copy(pos);
    dummy.quaternion.setFromUnitVectors(V(1,0,0),_dir);
    const sc = seg[si]>0?seg[si]:0.01;
    dummy.scale.set(Math.min(sc, total/links)*1.02, 1, 1);
    dummy.updateMatrix();
    inst.setMatrixAt(i,dummy.matrix);
  }
  inst.instanceMatrix.needsUpdate=true;
  grp.add(inst);
  return grp;
}

/* ---------- 刷车（磟刷/圈刷）与小五金 ---------- */
function buildBrakes(S){
  const dark=M('dark'), chrome=M('chrome'), acc=M('accent');
  const grp=new THREE.Group();
  if(P.discBrake){
    // 前夹器（叉腿上，非传动侧）
    const fc = boxMesh(0.030,0.046,0.026, dark);
    fc.position.copy(S.frontAxle).add(V(-0.006,0.020,-DRIVE*0.046)); grp.add(fc);
    // 后夹器（链上叉/座撑安装点）
    const rc = boxMesh(0.030,0.044,0.026, dark);
    rc.position.copy(S.rearAxle).add(V(-0.028,0.028,-DRIVE*0.050)); grp.add(rc);
    [fc,rc].forEach(c=>{ const b=cylMesh(0.004,0.004,0.012,acc,8); b.rotation.x=Math.PI/2; b.position.copy(c.position).add(V(0,0,-DRIVE*0.016)); grp.add(b); });
  } else {

function applyExplode(t){
  t=clamp(t,0,1);
  const e = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; // easeInOutQuad，平滑可逆
  for(const ex of exploders){
    ex.obj.position.copy(ex.base).addScaledVector(ex.axis, ex.dist*e);
  }
}

/* ================= NPR 渲染管线：深度+亮度边缘检测墨线 ================= */
let sceneRT=null, postOK=true;
const postScene=new THREE.Scene();
const postCamera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const postUniforms={
  tDiffuse:{value:null}, tDepth:{value:null},
  resolution:{value:new THREE.Vector2(1,1)},
  cameraNear:{value:camera.near}, cameraFar:{value:camera.far},
  inkColor:{value:new THREE.Color('#1b1f27')},
  outlineEnabled:{value:1.0}, outlineWidth:{value:1.25},
  depthThresh:{value:0.026}, lumaLo:{value:0.045}, lumaHi:{value:0.15},
  posterize:{value:0.0},
};
const POST_VS=`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`;
const POST_FS=`
precision highp float;
varying vec2 vUv;
uniform sampler2D tDiffuse; uniform sampler2D tDepth;
uniform vec2 resolution; uniform float cameraNear, cameraFar;
uniform vec3 inkColor; uniform float outlineEnabled, outlineWidth;
uniform float depthThresh, lumaLo, lumaHi, posterize;
float lum(vec3 c){ return dot(c, vec3(0.2126,0.7152,0.0722)); }
float linZ(vec2 uv){
  float z=texture2D(tDepth,uv).x; float zn=z*2.0-1.0;
  return (2.0*cameraNear*cameraFar)/(cameraFar+cameraNear - zn*(cameraFar-cameraNear));
}
void main(){
  vec2 tx=outlineWidth/resolution;
  vec4 base=texture2D(tDiffuse,vUv);
  float dC=linZ(vUv);
  float dR=linZ(vUv+vec2(tx.x,0.0)), dL=linZ(vUv-vec2(tx.x,0.0));
  float dU=linZ(vUv+vec2(0.0,tx.y)), dD=linZ(vUv-vec2(0.0,tx.y));
  float depthDiff=max(abs(dR-dL),abs(dU-dD));
  float slope=depthDiff/max(dC,0.08);
  float depthEdge=smoothstep(depthThresh*0.45, depthThresh, slope);
  float lC=lum(base.rgb);
  float lR=lum(texture2D(tDiffuse,vUv+vec2(tx.x,0.0)).rgb);
  float lL=lum(texture2D(tDiffuse,vUv-vec2(tx.x,0.0)).rgb);
  float lU=lum(texture2D(tDiffuse,vUv+vec2(0.0,tx.y)).rgb);
  float lD=lum(texture2D(tDiffuse,vUv-vec2(0.0,tx.y)).rgb);
  float lumaDiff=max(max(abs(lR-lL),abs(lU-lD)), max(abs(lR-lC),abs(lU-lC)));
  float lumaEdge=smoothstep(lumaLo,lumaHi,lumaDiff);
  float edge=clamp(max(depthEdge, lumaEdge*0.9),0.0,1.0)*outlineEnabled;
  vec3 col=mix(base.rgb, inkColor, edge);
  if(posterize>0.001){ float lv=mix(64.0,5.0,posterize); col=floor(col*lv+0.5)/lv; }
  gl_FragColor=vec4(col,1.0);
  #include <colorspace_fragment>
}`;
const postMat=new THREE.ShaderMaterial({uniforms:postUniforms,vertexShader:POST_VS,fragmentShader:POST_FS,depthTest:false,depthWrite:false});
const postQuad=new THREE.Mesh(new THREE.PlaneGeometry(2,2), postMat);
postQuad.frustumCulled=false; postScene.add(postQuad);

function makeRT(w,h){
  const rt=new THREE.WebGLRenderTarget(Math.max(2,w),Math.max(2,h),{
    minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter,
    type:THREE.HalfFloatType, format:THREE.RGBAFormat, depthBuffer:true, stencilBuffer:false,
  });
  rt.texture.colorSpace=THREE.LinearSRGBColorSpace;
  try{
    rt.depthTexture=new THREE.DepthTexture(Math.max(2,w),Math.max(2,h));
    rt.depthTexture.format=THREE.DepthFormat;
    rt.depthTexture.type=THREE.UnsignedIntType;
  }catch(e){ postOK=false; }
  return rt;
}
function updateRT(){
  const pr=renderer.getPixelRatio();
  const w=Math.max(2,Math.floor(window.innerWidth*pr));
  const h=Math.max(2,Math.floor(window.innerHeight*pr));
  const pf=clamp(P.pixelate|0,1,3);
  const rw=Math.max(2,Math.floor(w/pf)), rh=Math.max(2,Math.floor(h/pf));
  if(sceneRT){ sceneRT.dispose(); sceneRT=null; }
  sceneRT=makeRT(rw,rh);
  const f = pf>1 ? THREE.NearestFilter : THREE.LinearFilter;
  sceneRT.texture.magFilter=f; sceneRT.texture.minFilter=f;
  postUniforms.resolution.value.set(rw,rh);
}
function renderFrame(){
  if(postOK && sceneRT){
    renderer.setRenderTarget(sceneRT);
    renderer.render(scene,camera);
    renderer.setRenderTarget(null);
    postUniforms.tDiffuse.value=sceneRT.texture;
    postUniforms.tDepth.value=sceneRT.depthTexture;
    renderer.render(postScene,postCamera);
  } else {
    renderer.setRenderTarget(null);
    renderer.render(scene,camera);
  }
}
function applyRenderStyle(){
  if(P.bgStyle==='void') scene.background.set('#eef1f5');

/* ================= 规格与估算重量 ================= */
let lastSpecs={};
function computeWeight(){
  const carbon = P.finish==='carbon', metal = P.finish==='metallic';
  const frameMatAdj = carbon?-0.34 : metal?0.16 : 0;
  const S=SK||computeSkeleton(P);
  const frame = 1.18 + 1.05*(P.seatTube-0.50) + 0.6*(P.stack-0.545) + frameMatAdj;
  const fork  = 0.46 + (carbon?-0.12:0) + P.forkRake*0.4;
  const rimE  = 0.40 + P.rimDepth*3.2 + (P.spokeCount-24)*0.006 + (P.discBrake?0.02:0);
  const tireE = 0.21 + P.tireWidth*3.4;
  const wheel = 2*(rimE + tireE + 0.13 + 0.10 + (P.discBrake?0.18:0));
  const cass  = 0.19 + (P.cassetteSpeeds-7)*0.020 + P.cassetteLarge*0.0045;
  const rings = (P.chainrings)*0.10 + (P.chainringBig+ (P.chainrings>1?P.chainringSmall:0))*0.0022;
  const crank = 0.62 + (P.crankLength-0.170)*1.2;
  const chain = 0.24;
  const derail= 0.21 + (P.chainrings>=2?0.11:0);
  const brake = (P.discBrake?0.36:0.22) + 0.18;
  const cockpit = 0.30 + (P.barWidth-0.42)*0.9 + P.stemLength*0.5 + 0.10;
  const seat  = 0.34 + Math.max(0,(P.seatHeight-P.seatTube))*0.35;
  const pedals= 0.30;
  const hard  = 0.32 + (P.discBrake?0.04:0);
  const total = frame+fork+wheel+cass+rings+crank+chain+derail+brake+cockpit+seat+pedals+hard;
  return Math.max(4.5, total);
}
function computeSpecs(S){
  const diaInch = (2*P.wheelRadius)/0.0254;
  const bigRing = P.chainrings>=2? P.chainringBig : Math.round((P.chainringBig+P.chainringSmall)/2);
  const smallRing = P.chainrings>=2? P.chainringSmall : bigRing;
  const trail = (P.wheelRadius*Math.cos(S.ha) - P.forkRake)/Math.sin(S.ha);
  const standover = ((S.seatCluster.y+S.HT_top.y)/2 + S.bikeLiftY);
  const hiGear = (bigRing/11)*diaInch;
  const loGear = (smallRing/clamp(P.cassetteLarge,20,46))*diaInch;
  return {
    '配置 Config': `${P.chainrings}\u00d7${P.cassetteSpeeds}`,
    '轴距 Wheelbase': (S.wheelbase*1000).toFixed(0)+' mm',
    'Stack': (P.stack*1000).toFixed(0)+' mm',
    'Reach': (P.reach*1000).toFixed(0)+' mm',
    '头管角 H.A.': P.headAngle.toFixed(1)+'\u00b0',
    '座管角 S.A.': P.seatAngle.toFixed(1)+'\u00b0',
    '有效上管 ETT': (S.effTTproj*1000).toFixed(0)+' mm',
    '座管长 S.T.': (P.seatTube*1000).toFixed(0)+' mm',
    '后下叉 C.S.': (P.chainstay*1000).toFixed(0)+' mm',
    '五通落差 BB': (P.bbDrop*1000).toFixed(0)+' mm',
    '前叉偏移 Rake': (P.forkRake*1000).toFixed(0)+' mm',
    '拖曳距 Trail': (trail*1000).toFixed(0)+' mm',
    '跨高 Standover': (standover*1000).toFixed(0)+' mm',
    '前中心 F.C.': (S.frontAxle.x*1000).toFixed(0)+' mm',
    '曲柄 Crank': (P.crankLength*1000).toFixed(0)+' mm',
    '飞轮范围': `11-${clamp(P.cassetteLarge,20,46)}T`,
    '牙盘 Rings': P.chainrings>=2? `${bigRing}/${smallRing}T` : `${bigRing}T`,
    '最大齿比': hiGear.toFixed(0)+' gi',
    '最小齿比': loGear.toFixed(0)+' gi',
  };
}
function updateSpecs(S){
  const specs=computeSpecs(S);
  lastSpecs=specs;
  const w=computeWeight();
  const box=document.getElementById('specBox');
  if(box){
    let html='';
    for(const k in specs){ html+=`<div class="spec"><span class="k">${k}</span><span class="v">${specs[k]}</span></div>`; }
    box.innerHTML=html;
  }
  const wl=document.getElementById('weightVal'); if(wl) wl.textContent=w.toFixed(2)+' kg';
  const cfg=document.getElementById('cfgLine'); if(cfg) cfg.textContent=`${P.chainrings}\u00d7${P.cassetteSpeeds} 传动系统`;
}

/* ================= 组件标签 ================= */
const labelLayer=document.getElementById('labels');
const LABEL_DEFS=[
  {n:'头管 Head Tube', f:S=>S.HT_top.clone().lerp(S.HT_bot,0.5)},
  {n:'上管 Top Tube',  f:S=>S.seatCluster.clone().lerp(S.HT_top,0.5)},
  {n:'下管 Down Tube', f:S=>S.BB.clone().lerp(S.HT_bot,0.5)},
  {n:'座管 Seat Tube', f:S=>S.BB.clone().lerp(S.seatCluster,0.55)},
  {n:'五通 BB',        f:S=>S.BB.clone()},
  {n:'前叉 Fork',      f:S=>S.HT_bot.clone().lerp(S.frontAxle,0.55)},
  {n:'把立 Stem',      f:S=>S.steererTop.clone().lerp(S.barCenter,0.5)},
  {n:'弯把 Bar',       f:S=>S.barCenter.clone()},
  {n:'手变 Lever',     f:S=>S.barCenter.clone().add(V(P.barReach*0.9,0.0,P.barWidth/2))},
  {n:'坐垫 Saddle',    f:S=>S.saddlePos.clone().add(V(P.saddleForeAft,0.03,0))},
  {n:'座管柱 Post',    f:S=>S.seatTop.clone().lerp(S.saddlePos,0.5)},
  {n:'后上叉 Seatstay',f:S=>S.seatCluster.clone().lerp(S.rearAxle,0.5).add(V(0,0,0.04))},
  {n:'后下叉 Chainstay',f:S=>S.BB.clone().lerp(S.rearAxle,0.5).add(V(0,-0.02,0.04))},
  {n:'牙盘 Chainring', f:S=>S.BB.clone().add(V(0,P.chainringBig*0.0020,0.06))},
  {n:'曲柄 Crank',     f:S=>S.BB.clone().add(V(Math.cos(-35*DEG)*P.crankLength,Math.sin(-35*DEG)*P.crankLength,0.08))},
  {n:'飞轮 Cassette',  f:S=>S.rearAxle.clone().add(V(0,P.cassetteLarge*0.0018,0.04))},
  {n:'后拨 R.Derail',  f:S=>S.rearAxle.clone().add(V(-0.05,-(P.cassetteLarge*0.002+0.08),0.05))},
  {n:'前轮 Front',     f:S=>S.frontAxle.clone().add(V(0,P.wheelRadius*0.7,0))},
  {n:'后轮 Rear',      f:S=>S.rearAxle.clone().add(V(0,P.wheelRadius*0.7,0))},
];
let labelItems=[];
function updateLabelAnchors(S){
  if(labelItems.length===0 && labelLayer){
    labelItems=LABEL_DEFS.map(d=>{ const el=document.createElement('div'); el.className='lbl'; el.textContent=d.n; labelLayer.appendChild(el); return {el, local:new THREE.Vector3()}; });
  }
  LABEL_DEFS.forEach((d,i)=>{ if(labelItems[i]) labelItems[i].local.copy(d.f(S)); });
}
const _v=new THREE.Vector3();
function updateLabels(){
  if(!labelItems.length) return;
  const show=!!P.showLabels;
  bikeGroup.updateMatrixWorld();
  const w=window.innerWidth,h=window.innerHeight;
  for(const it of labelItems){
    if(!show){ it.el.classList.remove('show'); continue; }
    _v.copy(it.local).applyMatrix4(bikeGroup.matrixWorld).project(camera);
    if(_v.z<1 && _v.z>-1){
      it.el.style.left=((_v.x*0.5+0.5)*w)+'px';
      it.el.style.top=((-_v.y*0.5+0.5)*h)+'px';
      it.el.classList.add('show');
    } else it.el.classList.remove('show');
  }
}

/* ================= 相机预设 + 平滑过渡 ================= */
const CAM_PRESETS=[
  {name:'3/4 视图', pos:[1.62,0.86,1.98], tgt:[0,0.50,0]},
  {name:'传动侧', pos:[0.15,0.55,2.75], tgt:[0,0.50,0]},
  {name:'非传动侧', pos:[0.15,0.55,-2.75], tgt:[0,0.50,0]},
  {name:'正面', pos:[2.85,0.62,0.06], tgt:[0.05,0.52,0]},
  {name:'俯视', pos:[0.25,3.05,0.55], tgt:[0,0.40,0]},
  {name:'座舱', pos:[1.02,1.06,0.92], tgt:[0.36,0.74,0]},
  {name:'传动细节', pos:[-0.55,0.30,1.05], tgt:[-0.24,0.24,0]},
];
let camTween=null;
function gotoCam(pos,tgt,dur=0.65){
  camTween={fp:camera.position.clone(),tp:V(pos[0],pos[1],pos[2]),
            ft:controls.target.clone(),tt:V(tgt[0],tgt[1],tgt[2]),t:0,dur};
}

/* ================= 运行状态 ================= */
const uiRefs={};
let needRebuild=false, spinAngle=0, explodeTarget=0, last=performance.now();
const span=(cls,txt)=>{ const s=document.createElement('span'); if(cls)s.className=cls; if(txt!=null)s.textContent=txt; return s; };

/* ---------- 控件工厂 ---------- */
function makeRange(it){
  const k=it.k, row=document.createElement('div'); row.className='row';
  const l=document.createElement('div'); l.className='lab';
  const val=span('val'); l.append(span('',it.lab),val);
  const inp=document.createElement('input'); inp.type='range'; inp.min=it.min; inp.max=it.max; inp.step=it.step;
  const setV=v=>{ inp.value=v; val.textContent=it.fmt?it.fmt(parseFloat(v)):v; };
  setV(P[k]);
  inp.addEventListener('input',()=>{ P[k]=parseFloat(inp.value); val.textContent=it.fmt?it.fmt(P[k]):P[k]; if(k==='explode')explodeTarget=P[k]; onParam(k); });
  row.append(l,inp); uiRefs[k]={update:v=>setV(v)}; return row;
}
function makeSeg(k,lab,opts){
  const row=document.createElement('div'); row.className='row';
  if(lab){ const l=document.createElement('div'); l.className='lab'; l.append(span('',lab)); row.append(l); }
  const seg=document.createElement('div'); seg.className='seg'; const btns=[];
  opts.forEach(([v,label])=>{ const b=document.createElement('button'); b.textContent=label; b._v=v;
    b.addEventListener('click',()=>{ P[k]=v; refresh(); onParam(k); }); seg.append(b); btns.push(b); });
  function refresh(){ btns.forEach(b=>b.classList.toggle('on', String(b._v)===String(P[k]))); }
  refresh(); row.append(seg); uiRefs[k]={update:()=>refresh()}; return row;
}
function makeColor(it){
  const k=it.k, line=document.createElement('div'); line.className='colorline';
  const inp=document.createElement('input'); inp.type='color'; inp.value=P[k];
  inp.addEventListener('input',()=>{ P[k]=inp.value; onParam(k); });
  line.append(inp, span('nm',it.lab)); uiRefs[k]={update:v=>{inp.value=v;}}; return line;
}
function makePresets(){
  const row=document.createElement('div'); row.className='row';
  const l=document.createElement('div'); l.className='lab'; l.append(span('','配色预设 Presets')); row.append(l);
  const sw=document.createElement('div'); sw.className='swatches';
  COLOR_PRESETS.forEach(pr=>{ const b=document.createElement('div'); b.className='swatch'; b.title=pr.name;
    b.style.background=`linear-gradient(135deg, ${pr.c.colFrame} 0 55%, ${pr.c.colAccent} 55% 100%)`;
    b.addEventListener('click',()=>{ Object.assign(P,pr.c); syncUI(); applyMaterials(); });
    sw.append(b); });
  row.append(sw); return row;
}
function makeCam(){
  const row=document.createElement('div'); row.className='row';
  const l=document.createElement('div'); l.className='lab'; l.append(span('','相机预设 Camera')); row.append(l);
  const seg=document.createElement('div'); seg.className='seg'; seg.style.flexWrap='wrap';
  CAM_PRESETS.forEach(c=>{ const b=document.createElement('button'); b.textContent=c.name; b.style.minWidth='66px';
    b.addEventListener('click',()=>gotoCam(c.pos,c.tgt)); seg.append(b); });
  row.append(seg); return row;
}
function makeSpecs(){
  const wrap=document.createElement('div');
  wrap.innerHTML='<div class="cfgline" id="cfgLine"></div><div class="specs" id="specBox"></div>'+
    '<div class="weight"><span class="k">估算总重量<br>Estimated Weight</span><span class="v" id="weightVal">–</span></div>';
  return wrap;
}
function makeItem(it){
  switch(it.type){
    case 'range': return makeRange(it);
    case 'seg': return makeSeg(it.k,it.lab,it.opts);
    case 'toggle': return makeSeg(it.k,it.lab,[[true,'开'],[false,'关']]);
    case 'color': return makeColor(it);
    case 'presets': return makePresets();
    case 'camPresets': return makeCam();
    case 'specs': return makeSpecs();
    default: return document.createElement('div');
  }
}
function buildUI(){
  const body=document.getElementById('panelBody'); body.innerHTML='';
  GROUPS.forEach(g=>{
    const gd=document.createElement('div'); gd.className='group'+(g.id==='render'?' collapsed':'');
    const head=document.createElement('div'); head.className='ghead';
    head.append(span('dot'), span('gt',g.title), span('chev','▼'));
    head.querySelector('.dot').style.background=g.dot;
    head.addEventListener('click',()=>gd.classList.toggle('collapsed'));
    const gb=document.createElement('div'); gb.className='gbody';
    g.items.forEach(it=>gb.appendChild(makeItem(it)));
    gd.append(head,gb); body.append(gd);
  });
}

/* ---------- 参数分发：区分几何/材质/渲染/分解/标志 ---------- */
function onParam(k){
  if(/^col/.test(k)||k==='finish'||k==='celSteps'||k==='saturate'){ applyMaterials(); return; }
  if(k==='outline'||k==='outlineWidth'||k==='posterize'||k==='pixelate'||k==='bgStyle'||k==='showEnv'){ applyRenderStyle(); return; }
  if(k==='explode'){ explodeTarget=P.explode; applyExplode(P.explode); return; }
  if(k==='spin'||k==='autoRotate'||k==='showLabels'){ syncTop(); return; }
  needRebuild=true; // 几何相关 → 下一帧重建（节流）
}
function syncUI(){ for(const k in uiRefs){ try{uiRefs[k].update(P[k]);}catch(e){} } syncTop(); if(SK) updateSpecs(SK); }
function syncTop(){
  const be=document.getElementById('btnExplode'), bs=document.getElementById('btnSpin'), bl=document.getElementById('btnLabels');
  if(be) be.classList.toggle('on', explodeTarget>0.5);
  if(bs) bs.classList.toggle('on', !!P.spin);
  if(bl) bl.classList.toggle('on', !!P.showLabels);
}
function wireTop(){
  document.getElementById('btnExplode').onclick=()=>{ explodeTarget=explodeTarget>0.5?0:1; syncTop(); };
  document.getElementById('btnSpin').onclick=()=>{ P.spin=!P.spin; syncTop(); };
  document.getElementById('btnLabels').onclick=()=>{ P.showLabels=!P.showLabels; syncTop(); };
  document.getElementById('btnPanel').onclick=()=>{ document.getElementById('panel').classList.toggle('hidden'); };
  document.getElementById('btnReset').onclick=()=>doReset();
}
function doReset(){
  P={...DEFAULTS}; explodeTarget=0; spinAngle=0; camTween=null; needRebuild=false;
  buildBike(); applyRenderStyle(); applyExplode(0); syncUI();
  gotoCam(CAM_PRESETS[0].pos, CAM_PRESETS[0].tgt);
}

/* ---------- 主动画循环 ---------- */
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(needRebuild){ needRebuild=false; try{ buildBike(); }catch(e){ console.error('rebuild error',e); } }
  // 分解平滑可逆
  if(Math.abs(P.explode-explodeTarget)>0.0008){
    P.explode=lerp(P.explode,explodeTarget,Math.min(1,dt*6.5)); applyExplode(P.explode);
    if(uiRefs.explode) uiRefs.explode.update(P.explode);
  }
  if(P.spin) spinAngle+=dt*2.4;
  for(const o of spinners) o.rotation.z=spinAngle;
  controls.autoRotate=(!!P.autoRotate)&&!camTween; controls.autoRotateSpeed=0.9;
  if(camTween){
    camTween.t+=dt/camTween.dur;
    const k=camTween.t>=1?1:(camTween.t<0.5?2*camTween.t*camTween.t:1-Math.pow(-2*camTween.t+2,2)/2);
    camera.position.lerpVectors(camTween.fp,camTween.tp,k);
    controls.target.lerpVectors(camTween.ft,camTween.tt,k);
    if(camTween.t>=1) camTween=null;
  }
  controls.update();
  updateLabels();
  renderFrame();
}
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight); updateRT();
});

/* ---------- 自测接口（供无头回归验证，不影响正常使用） ---------- */
window.__BIKE__={
  version:'1.0.0', cdn:CDN_VERSION, ready:false,
  get params(){ return P; }, defaults:DEFAULTS,
  setParam(k,v){ P[k]=v; if(uiRefs[k])uiRefs[k].update(v); onParam(k); if(needRebuild){ needRebuild=false; buildBike(); } },
  rebuild(){ buildBike(); },
  skeleton(){ const S=computeSkeleton(P); return {wheelbase:+S.wheelbase.toFixed(4),forkLen:+S.forkLen.toFixed(4),
    htLen:+S.htLen.toFixed(4),frontAxle:S.frontAxle.toArray().map(n=>+n.toFixed(4)),rearAxle:S.rearAxle.toArray().map(n=>+n.toFixed(4)),
    seatCluster:S.seatCluster.toArray().map(n=>+n.toFixed(4)),groundLift:+S.bikeLiftY.toFixed(4)}; },
  specs(){ return lastSpecs; },
  state(){
    let meshes=0,inst=0,nan=0;
    scene.traverse(o=>{ if(o.isInstancedMesh)inst++; else if(o.isMesh)meshes++;
      if((o.isMesh||o.isInstancedMesh)&&(!isFinite(o.position.x)||!isFinite(o.position.y)||!isFinite(o.position.z)))nan++; });
    return {ok:nan===0, meshes, inst, nan, exploders:exploders.length, spinners:spinners.length,
      weight:+computeWeight().toFixed(3), postOK, geoCache:geoCache.size};
  }
};
function showError(e){ const el=document.getElementById('err'); if(el){ el.style.display='block'; el.textContent='初始化错误: '+(e&&e.message?e.message:e); } }
window.addEventListener('error',ev=>{ showError((ev&&(ev.error||ev.message))||'unknown'); });

/* ---------- 初始化 ---------- */
function init(){
  buildEnvironment();
  buildUI();
  buildBike();
  applyRenderStyle();
  syncUI();
  wireTop();
  renderFrame();
  window.__BIKE__.ready=true;
  requestAnimationFrame(t=>{ last=t; animate(t); });
  setTimeout(()=>{ const l=document.getElementById('loader'); if(l) l.classList.add('gone'); },150);
}
try{ init(); }catch(e){ showError(e); console.error(e); }
</script>
