<style>
  :root{
    --panel-bg: rgba(15,20,30,0.86);
    --panel-line: rgba(255,255,255,0.09);

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:#dde5ee;

  /* ---------- 顶部工具条 ---------- */

  .cfgtext{ font-size:12px; background:#12203a; border:1px solid #24406e; border-radius:8px; padding:7px 9px; color:#9fd0ff; text-align:center; margin:6px 0; font-variant-numeric:tabular-nums; letter-spacing:.4px; }

    #panel{ width:min(352px, 100vw - 24px); }

{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =====================================================================
 *  常量 / 工具
 * ===================================================================== */
const T = THREE;
const D2R = Math.PI / 180;
const WHEEL_R = 340;      // 轮圈外半径(mm)，700c 含胎
const RAKE = 45;          // 前叉偏置(mm)
const BB_DROP = 70;       // 五通下沉(mm)
const CHAIN_X = 34;       // 链条平面 x(mm)
const PITCH = 12.7;       // 链条节距(mm)
const pitchR = (teeth) => teeth * PITCH / (2 * Math.PI);
const mm = (x, y, z) => new T.Vector3(x, y, z);
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const smooth = (x) => x * x * (3 - 2 * x);
const lerp = (a, b, t) => a + (b - a) * t;

function roundedRect(w, h, r) {
  const s = new T.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

/* =====================================================================
 *  NPR 赛璐璐着色器
 * ===================================================================== */
const TOON_VERT = `
varying vec3 vN; varying vec3 vV; varying float vLen; varying vec3 vW;
void main(){
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vW = wp.xyz;
  vN = normalize(mat3(modelMatrix) * normal);
  vV = cameraPosition - wp.xyz;
  vLen = length(vV);
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;
const TOON_FRAG = `
varying vec3 vN; varying vec3 vV; varying float vLen; varying vec3 vW;
uniform vec3 uColor; uniform vec3 uDir; uniform vec3 uDirCol;
uniform vec3 uSky; uniform vec3 uGround; uniform vec3 uFogCol;
uniform float uSteps; uniform float uSpec; uniform float uRim;
uniform float uWeave; uniform float uQuant; uniform float uAmb;
uniform float uFogNear; uniform float uFogFar; uniform float uOpacity;
void main(){
  vec3 n = normalize(vN);
  vec3 v = normalize(vV);
  vec3 l = normalize(uDir);
  float ndl = max(dot(n, l), 0.0);
  float b = floor(ndl * uSteps + 0.5) / uSteps;      // 明暗分区（色调分离）
  vec3 hemi = mix(uGround, uSky, n.y * 0.5 + 0.5);
  vec3 light = uAmb * hemi * (0.50 + 0.22 * b) + uDirCol * b * 0.95;
  vec3 col = uColor * light;
  vec3 h = normalize(l + v);
  float sp = pow(max(dot(n, h), 0.0), 55.0) * uSpec;
  float rim = pow(1.0 - max(dot(n, v), 0.0), 2.8) * uRim;
  if (uWeave > 0.5) {                                  // carbon 细纹
    float wv = (step(0.5, fract(vW.y * 52.0)) + step(0.5, fract(vW.z * 52.0))) * 0.5;
    col *= (1.0 - 0.16 * wv);
  }
  col += (sp * 0.9 + rim * 0.55) * vec3(1.0);          // 高光 + 边缘光
  col = floor(col * uQuant + 0.5) / uQuant;            // 输出色调分离
  float fd = clamp((vLen - uFogNear) / (uFogFar - uFogNear), 0.0, 1.0);
  col = mix(col, uFogCol, fd * 0.8);
  col = pow(max(col, 0.0), vec3(0.4545));              // 线形 → sRGB
  gl_FragColor = vec4(col, uOpacity);
}`;

/* 外部切向切线求解：返回圆1/圆2 上同角度 α 的切点 */
function extTangent(c1, r1, c2, r2, side) {
  const dz = c2.z - c1.z, dy = c2.y - c1.y;
  const L = Math.hypot(dz, dy) || 1e-6;
  const C = Math.max(-1, Math.min(1, (r1 - r2) / L));
  const phi = Math.atan2(dy, dz);
  const th = Math.acos(C);
  let a;
  if (side === 'top') a = (Math.sin(phi + th) >= Math.sin(phi - th)) ? phi + th : phi - th;
  else a = (Math.sin(phi + th) <= Math.sin(phi - th)) ? phi + th : phi - th;
  const pt = (c, r) => ({ z: c.z + r * Math.cos(a), y: c.y + r * Math.sin(a) });
  return { a, p1: pt(c1, r1), p2: pt(c2, r2) };
}
/* 从 a0 扫到 a1，经过 through 角（弧线方向选择） */
function sweepTo(a0, a1, through) {
  const TAU = Math.PI * 2;
  const normA = (v) => ((v % TAU) + TAU) % TAU;
  const d1 = normA(a1 - a0);            // 正向增量 (0..2π)
  const d2 = d1 - TAU;
  const mid1 = normA(a0 + d1 * 0.5), mid2 = normA(a0 + d2 * 0.5);
  const thr = normA(through);
  const ok1 = Math.min(Math.abs(mid1 - thr), TAU - Math.abs(mid1 - thr));
  const ok2 = Math.min(Math.abs(mid2 - thr), TAU - Math.abs(mid2 - thr));
  return ok1 <= ok2 ? { d: d1 } : { d: d2 };
}
function arcPts(c, r, a0, d, n) {
  const out = [];
  for (let i = 0; i <= n; i++) {
    const a = a0 + d * (i / n);
    out.push({ z: c.z + r * Math.cos(a), y: c.y + r * Math.sin(a) });
  }
  return out;
}

/* =====================================================================
 *  车架几何求解（全部参数 → 关键点/度量）
 * ===================================================================== */
function solveGeo(g) {
  const bb = { x: 0, y: WHEEL_R - BB_DROP, z: -g.chainstay };
  const ts = g.seatAngle * D2R;
  const dirS = { x: 0, y: Math.sin(ts), z: Math.cos(ts) };          // 座管方向（上、后）
  const seatTop = { x: 0, y: bb.y + g.seatTubeLen * dirS.y, z: bb.z + g.seatTubeLen * dirS.z };
  const htTop = { x: 0, y: bb.y + g.stack, z: bb.z - g.reach };     // Stack/Reach
  const th = g.headAngle * D2R;
  const dirH = { x: 0, y: -Math.sin(th), z: -Math.cos(th) };        // 头管方向（下、前）
  const dirHup = { x: 0, y: Math.sin(th), z: Math.cos(th) };
  const htLen = 125 - 25 * g.compactness;                           // 紧凑度 → 头管长
  const htBot = { x: 0, y: htTop.y + htLen * dirH.y, z: htTop.z + htLen * dirH.z };
  const J = { x: 0, y: seatTop.y - g.compactness * 143 * dirS.y,    // 上管交汇点（紧凑度 → 上管斜率）
              z: seatTop.z - g.compactness * 143 * dirS.z };
  const attJ = { x: 0, y: J.y - (g.dropped ? 92 : 0) * dirS.y,      // 座撑交汇点（传统/下沉式）
                 z: J.z - (g.dropped ? 92 : 0) * dirS.z };
  const crown = htBot;
  const tR = (crown.y - WHEEL_R) / Math.sin(th);
  const axisAtR = { x: 0, y: WHEEL_R, z: crown.z + tR * dirH.z };
  const frontAxle = { x: 0, y: WHEEL_R, z: axisAtR.z - RAKE };      // 轴距根部
  const tG = crown.y / Math.sin(th);
  const Gz = crown.z + tG * dirH.z;
  const steerTop = { x: 0, y: crown.y + (htLen + 48) * dirHup.y, z: crown.z + (htLen + 48) * dirHup.z };
  const topTubeLen = Math.hypot(htTop.x - J.x, htTop.y - J.y, htTop.z - J.z);
  const topTubeRise = htTop.y - J.y;
  const downTubeLen = Math.hypot(htBot.x - bb.x, htBot.y - bb.y, htBot.z - bb.z);
  const wheelbase = Math.abs(frontAxle.z - 0);
  const trail = frontAxle.z - Gz;                                   // 前叉拖距(正)
  const seatStayLen = Math.hypot(attJ.x - 0, attJ.y - 340, attJ.z - 0);
  const fdT = 127;                                                  // 前拨安装高度
  const fdMount = { x: 0, y: bb.y + fdT * dirS.y, z: bb.z + fdT * dirS.z };
  return { bb, dirS, seatTop, htTop, htBot, htLen, dirH, dirHup, J, attJ, crown, frontAxle,
           steerTop, topTubeLen, topTubeRise, downTubeLen, wheelbase, trail, seatStayLen, fdMount };
}

/* =====================================================================
 *  应用工厂：createApp() —— 完全 DOM 无关（可在 Node 中自测）
 * ===================================================================== */
function createApp() {
  const A = {};
  A.scene = new T.Scene();
  A.camera = new T.PerspectiveCamera(44, 2, 0.05, 80);
  A.camera.position.set(1.75, 1.15, 1.05);
  const CAM_T = new T.Vector3(0, 0.45, -0.45);
  A.camTarget = CAM_T.clone();

  A.state = {
    geo: { stack: 545, reach: 385, headAngle: 73, seatAngle: 73, seatTubeLen: 520, chainstay: 410, compactness: 0.35, dropped: false },
    drv: { rings: 2, cassetteN: 11 },
    fit: { saddleF: -6, postH: 85, barWidth: 420, barRise: 12, barFlare: 4 },
    ast: { explode: 0, anim: 0 },
    col: { frame: '#3a86ff', fork: '#2b3038', rims: '#22262c', drv: '#5d6670', cockpit: '#23272e', saddle: '#1d2024', tires: '#191c21' },
    fin: { preset: 'gloss', steps: 3, outline: true, labels: false, env: true, bg: 'day' },
  };
  A.defaults = JSON.parse(JSON.stringify(A.state));

  /* ---------------- 材质系统 ---------------- */
  const toonMats = {};
  const outlineMat = new T.MeshBasicMaterial({ color: 0x14171c, side: T.BackSide });
  function mkToon(role, hex, opts) {
    const m = new T.ShaderMaterial({
      vertexShader: TOON_VERT, fragmentShader: TOON_FRAG,
      side: (opts && opts.double) ? T.DoubleSide : T.FrontSide,
      uniforms: {
        uColor: { value: new T.Color(hex) },
        uSteps: { value: A.state.fin.steps },
        uSpec: { value: opts && opts.spec !== undefined ? opts.spec : 0.45 },
        uRim: { value: opts && opts.rim !== undefined ? opts.rim : 0.30 },
        uWeave: { value: 0 }, uQuant: { value: 22 }, uAmb: { value: 1.30 },
        uDir: { value: new T.Vector3(0.42, 0.78, 0.36).normalize() },
        uDirCol: { value: new T.Color('#fff4e2') },
        uSky: { value: new T.Color('#eaf2ff') },
        uGround: { value: new T.Color('#8b8377') },
        uFogCol: { value: new T.Color('#d8e2ee') },
        uFogNear: { value: 4.2 }, uFogFar: { value: 15 }, uOpacity: { value: 1 },
      },
    });
    m.userData.role = role; m.userData.base = new T.Color(hex);
    m.userData.specBase = opts && opts.spec !== undefined ? opts.spec : 0.45;
    m.userData.rimBase = opts && opts.rim !== undefined ? opts.rim : 0.30;
    toonMats[role] = m;
    return m;
  }
  mkToon('frame', A.state.col.frame, { spec: .8, rim: .34 });
  mkToon('fork',  A.state.col.fork,  { spec: .35, rim: .3, double: true });
  mkToon('rims',  A.state.col.rims,  { spec: .6, rim: .3 });
  mkToon('spokes', '#c9d2dd', { spec: .8, rim: .25 });
  mkToon('drv',   A.state.col.drv,   { spec: .85, rim: .30 });
  mkToon('cockpit', A.state.col.cockpit, { spec: .5, rim: .3, double: true });
  mkToon('saddle', A.state.col.saddle, { spec: .25, rim: .28 });
  mkToon('tires', A.state.col.tires, { spec: .1, rim: .2 });
  mkToon('hw', '#3a4048', { spec: .7, rim: .3 });
  const envRoles = {
    floor: '#d8d2c4', wall: '#e7e2d6', wood: '#b98a5a', woodDark: '#8f6a44',
    metal: '#5c6470', acc1: '#e4574f', acc2: '#3f7fbf', acc3: '#e0a83c',
    acc4: '#4ca874', dark: '#2b3138', white: '#e8e4da', lamp: '#ffe9ac',
  };
  for (const k in envRoles) mkToon('env_' + k, envRoles[k], { spec: .15, rim: .18, double: true });
  const lampMat = new T.MeshBasicMaterial({ color: 0xfff0c4 });

  /* ---------------- 几何构建助手（单位 mm） ---------------- */
  const disposables = [];
  function trackGeo(g) { disposables.push(g); return g; }
  function dispoAll() { for (const g of disposables) if (g.dispose) g.dispose(); disposables.length = 0; }
  const VA = (a) => (a && a.isVector3 ? a : new T.Vector3(a.x, a.y, a.z));
  function cylBetween(a, b, r, mat, seg = 16) {
    const A2 = VA(a), B2 = VA(b);
    const d = new T.Vector3().subVectors(B2, A2); const len = d.length();
    const geo = trackGeo(new T.CylinderGeometry(r, r, len, seg));
    const m = new T.Mesh(geo, mat);
    m.position.copy(A2).addScaledVector(d, 0.5);
    m.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), d.normalize());
    return m;
  }
  function cylTaperBetween(a, b, r1, r2, mat, seg = 16) {
    const A2 = VA(a), B2 = VA(b);
    const d = new T.Vector3().subVectors(B2, A2); const len = d.length();
    const geo = trackGeo(new T.CylinderGeometry(r2, r1, len, seg));
    const m = new T.Mesh(geo, mat);
    m.position.copy(A2).addScaledVector(d, 0.5);
    m.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), d.normalize());
    return m;
  }
  function tubeCurve(ptsArr, r, mat, seg = 40, radial = 12) {
    const pts = ptsArr.map(p => p.isVector3 ? p.clone() : new T.Vector3(p.x, p.y, p.z));
    const curve = new T.CatmullRomCurve3(pts, false, 'catmullrom', 0.5);
    const geo = trackGeo(new T.TubeGeometry(curve, seg, r, radial, false));
    return new T.Mesh(geo, mat);
  }
  function box(w, h, d, mat) { const geo = trackGeo(new T.BoxGeometry(w, h, d)); return new T.Mesh(geo, mat); }
  function boxAt(w, h, d, x, y, z, mat, rx = 0, ry = 0, rz = 0) {
    const m = box(w, h, d, mat); m.position.set(x, y, z);
    m.rotation.set(rx, ry, rz); return m;
  }
  function sphereAt(r, x, y, z, mat, sx = 1, sy = 1, sz = 1) {
    const m = new T.Mesh(trackGeo(new T.SphereGeometry(r, 18, 12)), mat);
    m.position.set(x, y, z); m.scale.set(sx, sy, sz); return m;
  }

    const capc = cylAlongDir(g.steerTop, g.dirHup, 11, 13.5, mHw); capc.position.addScaledVector(g.dirHup, 21); G.headsetSpacersG.add(capc);
    const boltP = new T.Mesh(new T.CylinderGeometry(4.5, 4.5, 6, 12), toonMats['env_acc3']);
    boltP.position.set(g.steerTop.x, g.steerTop.y, g.steerTop.z).addScaledVector(g.dirHup, 28);

    // 底杯 + 下轴承

    const bearB = new T.Mesh(new T.TorusGeometry(14, 3.2, 8, 24), mHw);
    bearB.position.set(g.htBot.x, g.htBot.y, g.htBot.z).addScaledVector(g.dirHup, 14);

    // 叉肩碗（随前叉滑出）

    // —— 把立 / 座舱锚点 ——（内容使用世界坐标绘制，组基点保持原点，爆炸时整体平移）
    clearGroup(G.cockpitG);

    const clampH = 30;
    const stemClamp = cylAlongDir(g.steerTop, g.dirHup, 13, 13, mCk); stemClamp.position.addScaledVector(g.dirHup, -12);
    G.cockpitG.__add(stemClamp);
    const facePlate = boxAt(30, 26, 5, 0, g.steerTop.y - 8, g.steerTop.z - 12, mCk);
    G.cockpitG.__add(facePlate);
    // 把立螺栓 ×2

    const barCtr = mm(0, g.steerTop.y + 10, g.steerTop.z - 84);

    G.cockpitG.__add(stemBody);

    G.cockpitG.__add(boxAt(36, 16, 22, 0, barCtr.y, barCtr.z, mCk));

    // —— 座管座组 ——
    rebuildSeatPost(g, A.state.fit);
    // —— 前拨 / 后拨 ——
    G.fdG.position.set(g.fdMount.x, g.fdMount.y, g.fdMount.z);
    G.rdG.position.set(30, 322, 6);
    rebuildFD(); rebuildRD();
    // —— 曲柄 & 中轴 ——
    G.crankG.position.set(g.bb.x, g.bb.y, g.bb.z);
    G.crankLG.position.set(g.bb.x, g.bb.y, g.bb.z);
    G.axleG.position.set(g.bb.x, g.bb.y, g.bb.z);
    G.cupLG.position.set(g.bb.x, g.bb.y, g.bb.z);
    G.cupRG.position.set(g.bb.x, g.bb.y, g.bb.z);
    rebuildCrank();
    // —— 脚踏 ——

    // —— 轮组 / 碟片 ——
    G.frontWheelG.position.set(0, WHEEL_R, g.frontAxle.z);
    G.rearWheelG.position.set(0, WHEEL_R, 0);
    G.frontRotorG.position.set(-16, WHEEL_R, g.frontAxle.z);
    G.rearRotorG.position.set(-16, WHEEL_R, 0);
    // —— 线管 ——
    rebuildCables(g);
    // —— 链条 ——
    rebuildChain(g);
    // —— 度量 ——
    A.metrics = {
      wheelbase: g.wheelbase, trail: g.trail, topTubeLen: g.topTubeLen, topTubeRise: g.topTubeRise,
      topTubeSlope: Math.atan2(g.topTubeRise, Math.hypot(g.htTop.z - g.J.z, 0)) / D2R,
      htLen: g.htLen, bbDrop: BB_DROP, seatStayType: g.attJ.y !== g.J.y ? 'dropped' : 'traditional',
      seatStayY: g.attJ.y, fdMountY: g.fdMount.y,
      barWidth: A.state.fit.barWidth, saddleF: A.state.fit.saddleF, postH: A.state.fit.postH,
      dropped: g.attJ.y !== g.J.y,
    };
  }

  /* 带孔勾爪小环（勾爪轴孔视觉） */
  function holedRing(x, y, z) {
    const r = new T.Mesh(trackGeo(new T.TorusGeometry(7, 2.6, 6, 16)), toonMats.hw);
    r.position.set(x, y, z); r.rotation.y = Math.PI / 2; return r;
  }
  function cylinderAlong(a, b, r, mat, seg) {
    const A2 = VA(a), B2 = VA(b);
    const d = new T.Vector3().subVectors(B2, A2);
    const g2 = trackGeo(new T.CylinderGeometry(r, r, d.length(), seg));
    const m = new T.Mesh(g2, mat);
    m.position.copy(A2).addScaledVector(d, 0.5);
    m.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), d.normalize());
    return m;
  }
  function cylAlongDir(origin, dir, r, rEnd, mat) {
    const d = new T.Vector3(dir.x, dir.y, dir.z);
    const g2 = trackGeo(new T.CylinderGeometry(r, rEnd, 18, 16));
    const m = new T.Mesh(g2, mat);
    m.position.copy(new T.Vector3(origin.x, origin.y, origin.z));
    m.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), d.normalize());
    return m;
  }

  /* 后拨（含双导轮） */
  function rebuildRD() {
    clearGroup(G.rdG);
    const m = toonMats.drv;
    const body = boxAt(13, 30, 22, 2, -18, 10, m); G.rdG.__add(body);
    const arm1 = boxAt(5, 18, 5, 6, -34, 16, m); G.rdG.__add(arm1);
    const arm2 = boxAt(5, 26, 5, 6, -44, 24, m, 0.5, 0, 0); G.rdG.__add(arm2);
    // 导轮（jockey）instanced: 2 × 10 齿
    const pulleys = [mm(4, -60, 32), mm(4, -107, 49)];
    const jg = new T.Group(); G.rdG.add(jg);
    const pulleyTeeth = new T.InstancedMesh(trackGeo(new T.BoxGeometry(3.2, 5, 5)), m, 20);
    const mtx = new T.Matrix4();
    let ti = 0;
    for (const p of pulleys) {
      const cyl = new T.Mesh(trackGeo(new T.CylinderGeometry(11, 11, 8, 16)), m);
      cyl.rotation.z = Math.PI / 2; cyl.position.copy(p); jg.add(cyl);
      for (let k = 0; k < 10; k++) {
        const a = k / 10 * Math.PI * 2;
        const pos = new T.Vector3(p.x, p.y + 8 * Math.sin(a + 0.2), p.z + 8 * Math.cos(a + 0.2));
        const q = new T.Quaternion().setFromAxisAngle(new T.Vector3(1, 0, 0), Math.PI / 2 - a);
        mtx.compose(pos, q, new T.Vector3(1, 1, 1));
        pulleyTeeth.setMatrixAt(ti++, mtx);
      }
    }
    pulleyTeeth.instanceMatrix.needsUpdate = true;
    jg.add(pulleyTeeth);
  }

  /* 座管 + 坐垫（坐垫前后 / 座管高度） */
  function rebuildSeatPost(g, fit) {
    clearGroup(G.seatPostG); clearGroup(G.saddleG);
    const m = toonMats.hw;
    const postLen = 70 + fit.postH;
    const top = { x: g.seatTop.x, y: g.seatTop.y + postLen * g.dirS.y, z: g.seatTop.z + postLen * g.dirS.z };
    G.seatPostG.position.set(g.seatTop.x, g.seatTop.y, g.seatTop.z);
    // 座管（本地 +Y 沿座管向斜上）
    const pg = trackGeo(new T.CylinderGeometry(13, 13, postLen + 18, 16));
    const postMesh = new T.Mesh(pg, m);
    postMesh.position.set(0, (postLen - 18) / 2, 0);
    G.seatPostG.add(postMesh);
    // 坐管夹环 + 螺栓 + 弓夹
    const clampRing = new T.Mesh(trackGeo(new T.TorusGeometry(14.5, 3, 8, 20)), m);
    clampRing.rotation.x = Math.PI / 2; clampRing.position.y = -6; G.seatPostG.add(clampRing);
    const clampBolt = boxAt(6, 6, 6, 16, -6, 0, toonMats.hw, 0, 0, Math.PI / 4); G.seatPostG.add(clampBolt);
    G.seatPostG.add(boxAt(26, 8, 20, 0, postLen - 2, 0, m));
    for (const sx of [-8, 8]) G.seatPostG.add(boxAt(4, 4, 18, sx, postLen - 5, 0, toonMats.hw));
    // 坐垫组（座面水平补偿，坐垫前后 = 世界 Z 平移）
    const beta = Math.atan2(g.dirS.z, g.dirS.y);
    const f = fit.saddleF;
    G.saddleG.position.set(0, postLen + 30 + f * Math.sin(beta), f * Math.cos(beta));
    G.saddleG.rotation.x = -beta;
    const mS = toonMats.saddle;
    const body = new T.Mesh(trackGeo(new T.SphereGeometry(60, 22, 14)), mS);
    body.scale.set(1.06, 0.40, 1.85); body.position.set(0, 0, 30); G.saddleG.add(body);
    const nose = new T.Mesh(trackGeo(new T.SphereGeometry(34, 16, 10)), mS);
    nose.scale.set(0.72, 0.34, 1.6); nose.position.set(0, -3, -105); G.saddleG.add(nose);
    const mid = new T.Mesh(trackGeo(new T.SphereGeometry(50, 18, 12)), mS);
    mid.scale.set(0.95, 0.38, 1.2); mid.position.set(0, -1, -35); G.saddleG.add(mid);
    const sr1 = new T.Mesh(trackGeo(new T.TorusGeometry(52, 4.2, 8, 20, Math.PI * 0.85)), m);
    sr1.position.set(-17, -16, -6); sr1.rotation.set(Math.PI / 2 + 0.12, 0, 0.1);

  /* 牙盘（1/2/3 片）+ 曲柄 + 中轴 */
  function rebuildCrank() {
    clearGroup(G.crankG); clearGroup(G.crankLG); clearGroup(G.ringG);
    clearGroup(G.axleG); clearGroup(G.cupLG); clearGroup(G.cupRG);
    const mDrv = toonMats.drv, mHw = toonMats.hw;
    const rings = A.state.drv.rings === 1 ? [42] : (A.state.drv.rings === 2 ? [50, 34] : [50, 39, 30]);
    const ringX = rings.length === 1 ? [33.5] : (rings.length === 2 ? [34.5, 27.5] : [35, 29.5, 24]);
    // —— 曲柄臂（挤出剪影）——
    const shape = new T.Shape();
    const armLen = 172;
    shape.moveTo(0, -12.5);
    shape.lineTo(128, -9); shape.quadraticCurveTo(170, -9.4, armLen, 0);
    shape.quadraticCurveTo(170, 9.4, 128, 9); shape.lineTo(0, 12.5);
    shape.quadraticCurveTo(-16, 10, -16, 0); shape.quadraticCurveTo(-16, -10, 0, -12.5);
    const hole1 = new T.Path(); hole1.absarc(armLen - 14, 0, 6.5, 0, Math.PI * 2, true); shape.holes.push(hole1);
    const hole2 = new T.Path(); hole2.absarc(0, 0, 8, 0, Math.PI * 2, true); shape.holes.push(hole2);
    const armGeo = trackGeo(new T.ExtrudeGeometry(shape, { depth: 12, bevelEnabled: false }));
    armGeo.rotateY(Math.PI / 2); // 剪影 → (z,y) 面，厚度 → X
    const armR = new T.Mesh(armGeo, mDrv);
    armR.position.set(46, 0, 0); armR.rotation.x = (90 + 150) * D2R;   // 右曲柄朝下后
    G.crankG.add(armR);
    const armL = new T.Mesh(armGeo, mDrv);
    armL.position.set(-46, 0, 0); armL.rotation.x = (90 - 30) * D2R;   // 左曲柄朝上前
    G.crankLG.add(armL);
    // 曲柄轴心盖
    for (const [grp, sx] of [[G.crankG, 58], [G.crankLG, -58]]) {
      const cap = cylX(5, 6, sx, 0, 0, mHw, 10); grp.add(cap);
    }
    // —— 中轴轴心 ——
    const axle = cylX(8.5, 108, 0, 0, 0, mHw, 16); G.axleG.add(axle);
    G.axleG.add(holeRingX(55, 12, mHw));
    // —— 五通杯 ——
    const cupL = cylX2(19, 19, 14, -44, 0, 0, mHw); G.cupLG.add(cupL);
    const cupR = cylX2(19, 19, 14, 44, 0, 0, mHw); G.cupRG.add(cupR);
    for (const [grp, sx] of [[G.cupLG, -44], [G.cupRG, 44]]) {
      const ring = new T.Mesh(trackGeo(new T.TorusGeometry(19, 2.6, 6, 24)), mHw);
      ring.rotation.y = Math.PI / 2; ring.position.x = sx + (sx > 0 ? 7 : -7); grp.add(ring);
    }
    // —— 牙盘片 ——
    let totalTeeth = 0;
    for (let i = 0; i < rings.length; i++) {
      totalTeeth += rings[i];
      const pr = pitchR(rings[i]);
      // 盘身（环形挤出）
      const shape2 = new T.Shape();
      shape2.absarc(0, 0, pr - 1.2, 0, Math.PI * 2, false);
      const holeP = new T.Path(); holeP.absarc(0, 0, pr - 12, 0, Math.PI * 2, true);
      shape2.holes.push(holeP);
      const ringGeo = trackGeo(new T.ExtrudeGeometry(shape2, { depth: 2.6, bevelEnabled: false, curveSegments: 48 }));
      ringGeo.rotateY(Math.PI / 2);
      const rm = new T.Mesh(ringGeo, mDrv);
      rm.position.x = ringX[i];
      G.ringG.add(rm);
      // 蜘蛛臂 ×4
      for (let k = 0; k < 4; k++) {
        const a = k * Math.PI / 2 + Math.PI / 4;
        const armB = boxAt(6, pr - 24, 8, 0, 0, 0, mDrv);
        armB.position.set(ringX[i], (24 + pr - 10) / 2 * Math.sin(a), (24 + pr - 10) / 2 * Math.cos(a));
        armB.rotation.x = Math.PI / 2 - a;
        G.ringG.add(armB);
      }
      // 盘片螺栓 ×4
      for (let k = 0; k < 4; k++) {
        const a = k * Math.PI / 2 + Math.PI / 4 + 0.2;
        const bolt = cylX(2.2, 7, ringX[i], (pr - 14) * Math.sin(a), (pr - 14) * Math.cos(a), mHw, 8);
        G.ringG.add(bolt);
      }
      // 盘爪中心毂
      const hub = cylX(20, 8, ringX[i], 0, 0, mDrv, 20); G.ringG.add(hub);
    }
    // 牙盘齿（实例化）
    const teethInst = new T.InstancedMesh(trackGeo(new T.BoxGeometry(2.2, 5.6, 2.6)), mDrv, totalTeeth);
    const mtx = new T.Matrix4(); let ti = 0;
    for (let i = 0; i < rings.length; i++) {
      const pr = pitchR(rings[i]);
      for (let k = 0; k < rings[i]; k++) {
        const a = k / rings[i] * Math.PI * 2;
        const pos = new T.Vector3(ringX[i], (pr + 0.6) * Math.sin(a), (pr + 0.6) * Math.cos(a));
        const q = new T.Quaternion().setFromAxisAngle(new T.Vector3(1, 0, 0), Math.PI / 2 - a);
        mtx.compose(pos, q, new T.Vector3(1, 1, 1));
        teethInst.setMatrixAt(ti++, mtx);
      }
    }
    teethInst.instanceMatrix.needsUpdate = true;
    G.ringG.add(teethInst);
    A.ringTeeth = rings.slice();
    // 前拨可见性随牙盘片数联动（1× 隐藏、2/3× 显示）
    G.fdG.visible = rings.length >= 2;
  }
  function holeRingX(x, r, mat) {
    const m = new T.Mesh(trackGeo(new T.TorusGeometry(r, 3.6, 8, 20)), mat);
    m.position.x = x; m.rotation.y = Math.PI / 2; return m;
  }

  /* 脚踏 */
  function rebuildPedals(g) {
    clearGroup(G.pedalRG); clearGroup(G.pedalLG);
    const m = toonMats.drv;
    buildOnePedal(G.pedalRG, 60, g);
    buildOnePedal(G.pedalLG, -60, g);

  function buildOnePedal(grp, sx, g) {
    const m = toonMats.drv;
    const betaR = 150 * D2R, betaL = (150 - 180) * D2R;
    const beta = sx > 0 ? betaR : betaL;
    const tip = { y: g.bb.y + 172 * Math.cos(beta), z: g.bb.z - 172 * Math.sin(beta + Math.PI) };
    // tip: dir = (0, cosβ, ...) 用简化的固定演示角度
    const dirY = Math.cos(beta), dirZ = -Math.sin(beta);
    tip.y = g.bb.y + 172 * dirY; tip.z = g.bb.z + 172 * dirZ;
    grp.position.set(sx, tip.y, tip.z);
    const spindle = cylX(5, 26, sx > 0 ? 10 : -10, 0, 0, toonMats.hw, 10); grp.add(spindle);
    const sh = roundedRect(92, 22, 7);
    const pg = trackGeo(new T.ExtrudeGeometry(sh, { depth: 46, bevelEnabled: false }));
    pg.rotateY(Math.PI / 2);
    const platform = new T.Mesh(pg, m);
    platform.position.set(sx > 0 ? 24 : -24, 8, 0); platform.rotation.x = 0;
    grp.add(platform);
    const strap = boxAt(30, 16, 6, sx > 0 ? 14 : -14, 16, 22, toonMats.hw, 0.5); grp.add(strap);
  }

  /* 卡钳（前后共用几何，薄板 + 刹车皮 + 桥 + 螺栓） */

  /* 轮组（圈/花鼓/辐条实例化/胎/气嘴）+ 飞轮 + 碟片 */
  function buildWheels() {
    const mRim = toonMats.rims, mSpokes = toonMats.spokes, mTire = toonMats.tires;
    function buildWheel(Gw, opts) {
      clearGroup(Gw);
      const rimGeo = trackGeo(new T.TorusGeometry(305, 8.5, 10, 56));
      rimGeo.rotateY(Math.PI / 2);
      Gw.add(new T.Mesh(rimGeo, mRim));
      // 圈内壁（刹车边）
      const br = new T.Mesh(trackGeo(new T.TorusGeometry(300, 6.4, 8, 48)), mRim);
      br.geometry.rotateY(Math.PI / 2); br.position.x = 0; Gw.add(br);
      // 辐条（实例化）
      const nS = opts.spokes;
      const spokes = new T.InstancedMesh(trackGeo(new T.CylinderGeometry(1.0, 1.0, 1, 5)), mSpokes, nS);
      const mtx = new T.Matrix4(); const q = new T.Quaternion(); const scl = new T.Vector3();
      const hubHalf = opts.hubLen / 2 - 10;
      for (let i = 0; i < nS; i++) {
        const a = i / nS * Math.PI * 2;
        const side = (i % 2 === 0) ? -1 : 1;
        const hx = side * hubHalf;
        const hr = 19;
        const hp = new T.Vector3(hx, hr * Math.sin(a), hr * Math.cos(a));
        const rimA = a + (i % 3 - 1) * 0.09;
        const rp = new T.Vector3(0, 298 * Math.sin(rimA), 298 * Math.cos(rimA));
        const d = new T.Vector3().subVectors(rp, hp);
        const len = d.length();
        const pos = new T.Vector3().addVectors(hp, rp).multiplyScalar(0.5);
        q.setFromUnitVectors(new T.Vector3(0, 1, 0), d.normalize());
        scl.set(1, len, 1);
        mtx.compose(pos, q, scl);
        spokes.setMatrixAt(i, mtx);
      }
      spokes.instanceMatrix.needsUpdate = true;
      Gw.add(spokes);
      A.spokesFront = opts.spokes;
      // 花鼓
      const hub = new T.Mesh(trackGeo(new T.CylinderGeometry(17, 17, opts.hubLen, 18)), mRim);
      hub.geometry.rotateZ(Math.PI / 2); Gw.add(hub);
      for (const fxp of [-hubHalf, hubHalf]) {
        const flg = new T.Mesh(trackGeo(new T.CylinderGeometry(20.5, 20.5, 6, 16)), mRim);
        flg.geometry.rotateZ(Math.PI / 2); flg.position.x = fxp; Gw.add(flg);
      }
      // 快拆轴
      const qr = new T.Mesh(trackGeo(new T.CylinderGeometry(3.6, 3.6, opts.hubLen + 46, 8)), toonMats.hw);
      qr.geometry.rotateZ(Math.PI / 2); Gw.add(qr);
      const lever1 = new T.Mesh(trackGeo(new T.CylinderGeometry(2.6, 2.6, 30, 6)), toonMats.hw);
      lever1.position.set(opts.hubLen / 2 + 24, 6, 0); lever1.rotation.x = Math.PI / 2.6; Gw.add(lever1);
      const lever2 = new T.Mesh(trackGeo(new T.CylinderGeometry(2.6, 2.6, 18, 6)), toonMats.hw);
      lever2.position.set(opts.hubLen / 2 + 36, 16, 0); lever2.rotation.x = Math.PI / 2.6; Gw.add(lever2);
      // 气嘴（内胎气嘴）
      const va = 0.42;
      const vdir = new T.Vector3(0, Math.cos(va), Math.sin(va));
      const vpos = new T.Vector3(0, 322 * Math.cos(va), 322 * Math.sin(va));
      const vv = new T.Mesh(trackGeo(new T.CylinderGeometry(2.6, 2.6, 13, 8)), toonMats.hw);
      vv.position.copy(vpos); vv.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), vdir);
      Gw.add(vv);
      const vcap = new T.Mesh(trackGeo(new T.CylinderGeometry(3.4, 3.4, 5, 8)), toonMats['env_acc3']);
      vcap.position.copy(vpos).addScaledVector(vdir, 8.5);
      vcap.quaternion.copy(vv.quaternion);
      Gw.add(vcap);
    }
    buildWheel(G.frontWheelG, { spokes: 24, hubLen: 100 });
    buildWheel(G.rearWheelG, { spokes: 32, hubLen: 135 });
    // 后花鼓锥形塔基（自由体）
    const N = A.state.drv.cassetteN;
    const s = cassetteSpacing(N);
    const freehub = new T.Mesh(trackGeo(new T.CylinderGeometry(15.2, 18.6, N * s + 24, 20)), toonMats['env_dark']);
    freehub.geometry.rotateZ(Math.PI / 2);
    freehub.position.x = 26 + (N * s + 24) / 2;   // 塔基内端在 x≈26
    G.rearWheelG.add(freehub);
  }
  function cassetteSpacing(N) { return 4.7 - 0.15 * (N - 7); }
  function cassetteTeeth(N) {
    const big = 28 + (N - 7);
    const out = [];
    for (let i = 0; i < N; i++) out.push(Math.round(11 + (big - 11) * i / (N - 1)));
    return out; // 0 = 最小齿
  }

  /* 飞轮（7–12 速，锥形塔基，齿/宽度/间距/锥度随配置变化，teeth 实例化） */
  function rebuildCassette() {
    clearGroup(G.cassetteG);
    const m = toonMats.drv;
    const N = A.state.drv.cassetteN;
    const s = cassetteSpacing(N);
    const teeth = cassetteTeeth(N);
    let total = 0; for (const t of teeth) total += t;
    const innerX = 31;
    // 各片
    for (let i = 0; i < N; i++) {
      const x = innerX + (N - 1 - i) * s;              // 最大齿在内侧
      const pr = pitchR(teeth[i]);
      const disc = cylX(pr - 2.4, 3.0, x, 340, 0, m, 24);
      G.cassetteG.add(disc);
    }
    // 锥形隔套（塔基锥度）
    const coneShape = cylX2(15.5, 19, N * s - 2, innerX + (N * s - 2) / 2 - 4, 340, 0, toonMats['env_dark'], 24);
    coneShape.scale.y = 1; // 保持
    G.cassetteG.add(coneShape);
    // 锁环
    const lock = cylX(20, 5, innerX + (N - 1) * s + 5, 340, 0, m, 20);
    G.cassetteG.add(lock);
    const lockBolt = cylX(5, 6, innerX + (N - 1) * s + 9, 340, 0, toonMats.hw, 8);
    G.cassetteG.add(lockBolt);
    // 齿（实例化）
    const teethInst = new T.InstancedMesh(trackGeo(new T.BoxGeometry(2.0, 5.4, 2.5)), m, total);
    const mtx = new T.Matrix4();
    let ti = 0;
    for (let i = 0; i < N; i++) {
      const x = innerX + (N - 1 - i) * s;
      const pr = pitchR(teeth[i]);
      const zOff = 0;
      for (let k = 0; k < teeth[i]; k++) {
        const a = k / teeth[i] * Math.PI * 2;
        const pos = new T.Vector3(x, 340 + (pr + 0.4) * Math.sin(a), 0 + (pr + 0.4) * Math.cos(a) + zOff);
        const q = new T.Quaternion().setFromAxisAngle(new T.Vector3(1, 0, 0), Math.PI / 2 - a);
        mtx.compose(pos, q, new T.Vector3(1, 1, 1));
        teethInst.setMatrixAt(ti++, mtx);
      }
    }
    teethInst.instanceMatrix.needsUpdate = true;
    G.cassetteG.add(teethInst);
    A.cassetteTeethList = teeth.slice();
  }

  /* 碟片（镂空：外环 + 6 臂 + 内毂 + 螺栓，真实间隙） */
  function rebuildRotors() {
    clearGroup(G.frontRotorG); clearGroup(G.rearRotorG);
    const m = toonMats.drv;
    function buildRotor(grp) {
      const sh = new T.Shape();
      sh.absarc(0, 0, 78, 0, Math.PI * 2, false);
      const hole = new T.Path(); hole.absarc(0, 0, 62, 0, Math.PI * 2, true);
      sh.holes.push(hole);
      const geo = trackGeo(new T.ExtrudeGeometry(sh, { depth: 1.7, bevelEnabled: false, curveSegments: 48 }));
      geo.rotateY(Math.PI / 2);
      grp.add(new T.Mesh(geo, m));
      // 6 臂
      for (let k = 0; k < 6; k++) {
        const a = k / 6 * Math.PI * 2;
        const armB = boxAt(1.7, 40, 8, 0, 0, 0, m);
        armB.position.set(0, 42 * Math.sin(a), 42 * Math.cos(a));
        armB.rotation.x = Math.PI / 2 - a;
        grp.add(armB);
      }
      // 内毂
      const hubGeo = trackGeo(new T.CylinderGeometry(26, 26, 3.2, 24));
      hubGeo.rotateZ(Math.PI / 2);
      grp.add(new T.Mesh(hubGeo, m));
      // 6 螺栓
      for (let k = 0; k < 6; k++) {
        const a = k / 6 * Math.PI * 2 + 0.3;
        const bolt = cylX(2.3, 5, 0, 23 * Math.sin(a), 23 * Math.cos(a), toonMats.hw, 8);
        grp.add(bolt);
      }
    }
    buildRotor(G.frontRotorG);
    buildRotor(G.rearRotorG);
  }

  /* 链条（实例化链节，沿真实多边形：盘→飞盘→后拨导轮→闭合） */
  function rebuildChain(g) {
    clearGroup(G.chainG);
    const m = toonMats.drv;
    const rings = A.ringTeeth || [50];
    const ringR = pitchR(rings[0]);
    const bigTeeth = A.cassetteTeethList ? A.cassetteTeethList[A.cassetteTeethList.length - 1] : 28;
    const cassR = pitchR(bigTeeth);
    const rc = { z: g.bb.z, y: g.bb.y };
    const cc = { z: 0, y: WHEEL_R };
    const j1 = { z: 40, y: 262 }, j2 = { z: 57, y: 214 };
    const rj = 11;
    const tTop = extTangent(rc, ringR + 1.2, cc, cassR + 1.2, 'top');
    const tCj1 = extTangent(cc, cassR + 1.2, j1, rj, 'bottom');
    const tJ1J2 = extTangent(j1, rj, j2, rj, 'bottom');
    const tJ2R = extTangent(j2, rj, rc, ringR + 1.2, 'bottom');
    let pts = [];
    // 盘片前弧（经 180° 前侧）→ 下切点
    const s1 = sweepTo(tTop.a, tJ2R.a, Math.PI);
    pts = pts.concat(arcPts(rc, ringR + 1.2, tTop.a, s1.d, 30));
    // 后拨下导轮弧（外后侧）
    const s2 = sweepTo(tJ2R.a, tJ1J2.a, 0);
    pts = pts.concat(arcPts(j2, rj, tJ2R.a, s2.d, 14));
    // 上导轮弧
    const s3 = sweepTo(tJ1J2.a, tCj1.a, 0);
    pts = pts.concat(arcPts(j1, rj, tJ1J2.a, s3.d, 14));
    // 飞轮弧（后侧）
    const s4 = sweepTo(tCj1.a, tTop.a, 0);
    pts = pts.concat(arcPts(cc, cassR + 1.2, tCj1.a, s4.d, 30));
    // 上直线（回到起点）
    pts.push(tTop.p1);
    // 转换为向量并按弧长 12.7 布置链节
    const vecs = pts.map(p => new T.Vector3(CHAIN_X, p.y, p.z));
    const totalLen = (() => { let L = 0; for (let i = 1; i < vecs.length; i++) L += vecs[i].distanceTo(vecs[i - 1]); return L; })();
    const nLink = Math.max(24, Math.round(totalLen / PITCH));
    A.chainLen = totalLen;
    const chainInst = new T.InstancedMesh(trackGeo(new T.BoxGeometry(4.4, 11.6, 2.2)), m, nLink);
    const mtx = new T.Matrix4(); const q = new T.Quaternion();
    let linkIdx = 0, acc = 0;
    for (let i = 1; i < vecs.length && linkIdx < nLink; i++) {
      const a = vecs[i - 1], b = vecs[i];
      const seg = b.clone().sub(a); const segLen = seg.length();
      if (segLen < 1e-6) continue;
      const dir = seg.clone().normalize();
      let travelled = PITCH - acc;
      while (travelled < segLen && linkIdx < nLink) {
        const pos = a.clone().addScaledVector(dir, travelled);
        q.setFromUnitVectors(new T.Vector3(0, 1, 0), dir);
        mtx.compose(pos, q, new T.Vector3(1, 1, 1));
        chainInst.setMatrixAt(linkIdx++, mtx);
        travelled += PITCH;
      }
      acc = segLen - (travelled - PITCH) - (PITCH - acc);
      acc = ((acc % PITCH) + PITCH) % PITCH;
    }
    // 补足（闭环包住端点）
    while (linkIdx < nLink) {
      mtx.compose(vecs[vecs.length - 1], new T.Quaternion(), new T.Vector3(0.001, 0.001, 0.001));
      chainInst.setMatrixAt(linkIdx++, mtx);
    }
    chainInst.instanceMatrix.needsUpdate = true;
    G.chainG.add(chainInst);
    A.chainLinks = nLink;
  }

  /* 中控线管（杠杆→夹器；沿车架布线的程式化管） */
  function rebuildCables(g) {
    clearGroup(G.cablesG);
    A.bikeRoot.updateMatrixWorld(true);   // 确保 0.001 缩放与把立矩阵就绪
    const m = toonMats.hw;
    const st = g.steerTop;
    G.barG.updateMatrixWorld(true);
    if (!A.hoodRWorld) A.hoodRWorld = new T.Vector3();
    if (!A.hoodLWorld) A.hoodLWorld = new T.Vector3();
    // 手变位置（从把横本地坐标）
    const hoodR = new T.Vector3(112, 5, -24).applyMatrix4(G.barG.matrixWorld).multiplyScalar(1000);
    const hoodL = new T.Vector3(-112, 5, -24).applyMatrix4(G.barG.matrixWorld).multiplyScalar(1000);
    A.hoodRWorld.copy(hoodR); A.hoodLWorld.copy(hoodL);
    const barCtrW = new T.Vector3(0, 0, 0).applyMatrix4(G.barG.matrixWorld).multiplyScalar(1000);
    // 前刹线：左手变 → 头管 → 前夹器
    const fc = { x: -16, y: 418, z: g.frontAxle.z + 12 };
    const pF = [
      hoodL.clone(),

    G.cablesG.add(tubeCurve(pF, 3.1, m, 40, 8));
    // 后刹线：右手变 → 上管 → 座管 → 后叉 → 后夹器
    const rc = { x: -16, y: 416, z: 6 };
    const pR = [
      hoodR.clone(),

      new T.Vector3(-12, g.J.y - 170, g.J.z + 130),
      new T.Vector3(-16, g.bb.y + 30, g.bb.z + 8),
      new T.Vector3(-26, 345, -60),
      new T.Vector3(rc.x, rc.y + 12, rc.z - 8),
    ];
    G.cablesG.add(tubeCurve(pR, 3.1, m, 44, 8));
    // 前拨线：左手变 → 下管 → 前拨
    const pFD = [
      hoodL.clone(),
      new T.Vector3(hoodL.x - 6, hoodL.y + 20, hoodL.z + 46),
      new T.Vector3(-14, 640, g.htTop.z + 200),
      new T.Vector3(-14, 480, g.htBot.z - 60),
      new T.Vector3(-8, g.fdMount.y + 40, g.fdMount.z + 30),
    ];
    G.cablesG.add(tubeCurve(pFD, 2.8, m, 40, 8));
    // 后拨线：右手变 → 上管 → 座撑 → 后拨
    const pRD = [
      hoodR.clone(),
      new T.Vector3(hoodR.x + 4, hoodR.y + 22, hoodR.z + 44),
      new T.Vector3(16, 660, -470),
      new T.Vector3(18, g.J.y - 60, g.J.z - 10),
      new T.Vector3(24, 250, 90),
      new T.Vector3(32, 300, 4),
    ];
    G.cablesG.add(tubeCurve(pRD, 2.8, m, 40, 8));
  }

  /* 弯把（宽度 / 抬升 / 外撇）+ 把带 + 手变 + 刹把 */
  function rebuildBar() {
    clearGroup(G.barG);
    const fit = A.state.fit;
    const W = fit.barWidth, rise = fit.barRise, flare = fit.barFlare * D2R;
    const wf = W / 420;   // 宽度缩放（420mm 基准）
    const m = toonMats.cockpit;
    // 中心线点集（右半；本地：X 横向，Y 上，Z 后）
    const basePts = [
      [58, 0, 0], [104, rise * 0.35, -8], [118, rise * 0.5, -22],
      [130, rise * 0.62 - 46, -42], [130, rise * 0.78 - 86, -58],
      [124, rise * 0.9 - 72, -32], [119, rise * 1.0 - 54, -6],
    ];
    const PIVOT = { x: 116, z: -20 };
    function toPoints(sign) {
      const out = [];
      for (const [x0raw, y0, z0] of basePts) {
        const x0 = x0raw * wf;
        let x = x0, z = z0;
        if (x0raw > PIVOT.x) {
          const px = PIVOT.x * wf;
          const dx = x0 - px, dz = z0 - PIVOT.z;
          const a = sign * flare;
          const nx = Math.cos(a) * (sign * dx) + Math.sin(a) * dz;
          const nz = -Math.sin(a) * (sign * dx) + Math.cos(a) * dz;
          x = px + sign * nx; z = PIVOT.z + nz;
        }
        out.push(mm(sign * x, y0, z));
      }
      return out;
    }
    const rightPts = toPoints(1), leftPts = toPoints(-1);
    // 中段
    const mid = [mm(-58, 0, 0), mm(58, 0, 0)];
    // 栏杆主体
    const fullPts = [...leftPts.slice().reverse(), mm(-58, 0, 0), mm(58, 0, 0), ...rightPts.slice(2)];
    const barCurve = tubeCurve(fullPts, 11.2, m, 48, 10);
    G.barG.add(barCurve);
    // 把带（肩部→末端，略粗）
    const tapeCurveR = toPoints(1).slice(1);
    const tapeCurveL = toPoints(-1).slice(1);
    for (const pts of [tapeCurveR, tapeCurveL]) {
      const tp = tubeCurve(pts, 12.7, m, 22, 10);
      G.barG.add(tp);
    }
    // 手变 + 刹把
    function buildHood(sign) {
      const hoodPos = new T.Vector3(sign * 118, rise * 0.5, -24);
      const hood = new T.Group();
      const body = new T.Mesh(trackGeo(new T.CapsuleGeometry(11, 24, 4, 10)), m);
      body.rotation.x = Math.PI / 2 + 0.5;
      body.position.set(0, 0, 0); hood.add(body);
      const topBit = new T.Mesh(trackGeo(new T.SphereGeometry(13, 12, 8)), m);
      topBit.scale.set(1, 0.7, 1.35); topBit.position.set(0, 6, 2); hood.add(topBit);
      const lever = new T.Mesh(trackGeo(new T.BoxGeometry(9, 78, 12)), m);
      lever.position.set(0, -36, -18); lever.rotation.x = 0.42; hood.add(lever);
      const leverTip = new T.Mesh(trackGeo(new T.SphereGeometry(6, 8, 6)), m);
      leverTip.position.set(0, -72, -30); hood.add(leverTip);
      hood.position.copy(hoodPos);
      G.barG.add(hood);
    }
    buildHood(1); buildHood(-1);
    // 把带末端锁环
    for (const sign of [1, -1]) {
      const end = new T.Mesh(trackGeo(new T.TorusGeometry(11.4, 2.6, 6, 14)), toonMats.hw);
      const p = toPoints(sign)[toPoints(sign).length - 1];
      end.position.copy(p);
      // 朝末端方向近似摆放
      const d = toPoints(sign)[toPoints(sign).length - 1].clone().sub(toPoints(sign)[toPoints(sign).length - 2]).normalize();
      end.quaternion.setFromUnitVectors(new T.Vector3(0, 0, 1), d);
      G.barG.add(end);
    }
  }

  /* 轮组重建（含锥形塔基随速数变化） */
  function rebuildWheelsWithCassette() {
    buildWheels();
    rebuildCassette();
    rebuildRotors();
  }

  /* ---------------- 重量估算（随所有配置实时变化） ---------------- */
  function computeWeight(g) {
    const preset = A.state.fin.preset;
    const fMat = preset === 'carbon' ? 0.80 : 1.0;
    const rings = A.ringTeeth || [50];
    const N = A.state.drv.cassetteN;
    const w = {};
    const tubeSum = A.metrics.topTubeLen + g.downTubeLen + A.state.geo.seatTubeLen + A.state.geo.chainstay + g.seatStayLen + A.metrics.htLen;
    w.frame = tubeSum / 1000 * 0.62 * fMat;
    w.fork = 0.44 * fMat;
    w.frontWheel = (0.85 * fMat + 0.31);
    w.rearWheel = (0.88 * fMat + 0.33);
    w.rotors = 0.14 * 2;
    w.cassette = 0.08 + N * 0.032;
    let tT = 0; for (const t of rings) tT += t;
    w.chainrings = 0.03 + tT * 0.0026;
    w.crank = 0.52;
    w.bb = 0.08;
    w.pedals = 0.31;
    w.fd = rings.length >= 2 ? 0.10 : 0;
    w.rd = 0.22;
    w.cockpit = 0.30 + A.state.fit.barWidth * 0.00024 + 0.16 + 0.22 + 0.06;
    w.saddle = 0.30 + A.state.fit.postH * 0.00025;
    w.brakes = 0.30 * 2;
    w.headset = 0.09;
    w.chain = A.chainLinks * 0.0029;
    w.misc = 0.26;
    let total = 0; for (const k in w) total += w[k];
    return { w, total };
  }

  /* ---------------- 爆炸装配位移（真实安装轴） ---------------- */
  A.explodeTargets = [];
  function setExplodeTargets(g) {
    A.explodeTargets = [
      [G.frontWheelG, mm(230, 0, 0)],
      [G.rearWheelG, mm(230, 0, 0)],
      [G.frontRotorG, mm(-150, 0, 0)],
      [G.rearRotorG, mm(-150, 0, 0)],
      [G.cassetteG, mm(330, 0, 0)],
      [G.crankG, mm(190, 0, 0)],
      [G.crankLG, mm(-170, 0, 0)],
      [G.axleG, mm(255, 0, 0)],
      [G.cupLG, mm(-85, 0, 0)],
      [G.cupRG, mm(85, 0, 0)],
      [G.pedalRG, mm(330, 0, 0)],
      [G.pedalLG, mm(-330, 0, 0)],
      [G.forkG, mm(g.dirH.x, g.dirH.y, g.dirH.z).multiplyScalar(235)],
      [G.cockpitG, mm(g.dirHup.x, g.dirHup.y, g.dirHup.z).multiplyScalar(145)],
      [G.seatPostG, mm(g.dirS.x, g.dirS.y, g.dirS.z).multiplyScalar(300)],
      [G.headsetTopG, mm(g.dirHup.x, g.dirHup.y, g.dirHup.z).multiplyScalar(60)],
      [G.headsetSpacersG, mm(g.dirHup.x, g.dirHup.y, g.dirHup.z).multiplyScalar(170)],
      [G.headsetBottomG, mm(g.dirH.x, g.dirH.y, g.dirH.z).multiplyScalar(55)],
      [G.fdG, mm(g.dirS.x, g.dirS.y, g.dirS.z).multiplyScalar(95)],
      [G.rdG, mm(0, -40, 70)],
      [G.rearCaliperG, mm(0, 0, 95)],
      [G.frontCaliperG, mm(g.dirH.x, g.dirH.y, g.dirH.z).multiplyScalar(235)],
    ];
    A.explodeBase = new Map();
    for (const [grp] of A.explodeTargets) {
      A.explodeBase.set(grp, grp.position.clone());
    }
  }
  function applyExplode() {
    const e = smooth(clamp01(A.state.ast.explode));
    for (const [grp, off] of A.explodeTargets) {
      grp.position.copy(A.explodeBase.get(grp)).addScaledVector(off, e);
    }
  }

  /* ---------------- 应用状态（依赖更新调度） ---------------- */
  A.setExplode = function (v) {
    A.state.ast.explode = clamp01(v);
    applyExplode();
  };
  A.setState = function (patch) {
    const P = patch || {};
    const merge = (t, p) => { for (const k in p) { if (p[k] && typeof p[k] === 'object' && !Array.isArray(p[k]) && !p[k].isVector3) merge(t[k], p[k]); else t[k] = p[k]; } };
    merge(A.state, P);
    const geoChanged = !!P.geo, drvChanged = !!P.drv, fitChanged = !!P.fit;
    const colChanged = !!P.col, finChanged = !!P.fin, astChanged = !!P.ast;

    barWidth: ['barWidth', (v) => v + ' mm'],
    barRise: ['barRise', (v) => v + ' mm'],
    barFlare: ['barFlare', (v) => v + '°'],
  };
  for (const id in fitBinds) {
    const [key, fmt] = fitBinds[id];
    const el = $('s-' + id), val = $('v-' + id);
    val.textContent = fmt(app.state.fit[key]);
    el.value = app.state.fit[key];
    el.addEventListener('input', () => {
      val.textContent = fmt(parseFloat(el.value));
      app.setState({ fit: { [key]: parseFloat(el.value) } });
    });
  }
  // Geo sliders（全部值域已由 bindSlider 处理，这里重新定义以直达 geo）
  const geoBinds2 = {
    stack: [460, 640, (v) => v + ' mm'], reach: [330, 470, (v) => v + ' mm'],
    headAngle: [70, 76, (v) => v + '°'], seatAngle: [68, 78, (v) => v + '°'],
    seatTubeLen: [420, 620, (v) => v + ' mm'], chainstay: [395, 435, (v) => v + ' mm'],
  };
  for (const id in geoBinds2) {
    const el = $('s-' + id), val = $('v-' + id);
    const [mi, ma, fmt] = geoBinds2[id];
    val.textContent = fmt(app.state.geo[id]);
    el.addEventListener('input', () => {
      val.textContent = fmt(parseFloat(el.value));
      app.setState({ geo: { [id]: parseFloat(el.value) } });
      refreshCfgText();
    });
  }
  {
    const el = $('s-compactness'), val = $('v-compactness');
    val.textContent = Math.round(app.state.geo.compactness * 100) + '%';
    el.value = app.state.geo.compactness;
    el.addEventListener('input', () => {
      val.textContent = Math.round(parseFloat(el.value) * 100) + '%';
      app.setState({ geo: { compactness: parseFloat(el.value) } });
      refreshCfgText();
    });
  }
  // 分解滑杆
  {
    const el = $('s-explode'), val = $('v-explode');
    el.value = Math.round(app.state.ast.explode * 100);
    val.textContent = Math.round(el.value) + '%';
    el.addEventListener('input', () => {
      const v = parseFloat(el.value);
      app.state.ast.anim = 0;
      app.setExplode(v / 100);
      val.textContent = Math.round(v) + '%';
      refreshCfgText();
    });
  }
  $('btn-explode-anim').addEventListener('click', () => {
    app.state.ast.anim = 1;
    $('btn-explode-anim').textContent = '分解中…';
  });
  $('btn-explode-reverse').addEventListener('click', () => {
    app.state.ast.anim = -1;
    $('btn-explode-reverse').textContent = '还原中…';
  });
  // selects
  $('c-rings').addEventListener('change', () => {
    app.setState({ drv: { rings: parseInt($('c-rings').value) } });
    refreshCfgText();
  });
  $('c-cassetteN').addEventListener('change', () => {
    app.setState({ drv: { cassetteN: parseInt($('c-cassetteN').value) } });
    refreshCfgText();
  });
  $('c-seatstay').addEventListener('change', () => {
    app.setState({ geo: { dropped: $('c-seatstay').value === 'dropped' } });
    refreshCfgText();
  });
  $('c-preset').addEventListener('change', () => {
    app.setState({ fin: { preset: $('c-preset').value } });
  });
  $('c-steps').addEventListener('change', () => {
    app.setState({ fin: { steps: parseInt($('c-steps').value) } });
  });
  $('c-bg').addEventListener('change', () => {
    app.setState({ fin: { bg: $('c-bg').value } });
  });
  // colors
  const colIds = ['frame', 'fork', 'rims', 'drv', 'cockpit', 'saddle', 'tires'];
  for (const id of colIds) {
    const el = $('col-' + id);
    el.value = app.state.col[id];
    el.addEventListener('input', () => {
      app.setState({ col: { [id]: el.value } });
    });
  }
  // checkboxes
  $('chk-outline').checked = app.state.fin.outline;
  $('chk-outline').addEventListener('change', () => app.setState({ fin: { outline: $('chk-outline').checked } }));
  $('chk-labels').checked = app.state.fin.labels;
  $('chk-labels').addEventListener('change', () => app.setLabels($('chk-labels').checked));
  $('chk-env').checked = app.state.fin.env;
  $('chk-env').addEventListener('change', () => app.setState({ fin: { env: $('chk-env').checked } }));
  // 相机预设 & 重置
  document.querySelectorAll('[data-cam]').forEach(btn => {
    btn.addEventListener('click', () => app.setCamPreset(btn.dataset.cam));
  });
  $('btn-reset').addEventListener('click', () => {
    app.resetAll();
    for (const el of document.querySelectorAll('.cambtn')) el.classList.remove('on');
    $('chk-labels').checked = false; $('chk-outline').checked = true;
    $('chk-env').checked = true;
    // 重填 UI 值
    syncUI();
    refreshCfgText();
  });
  function syncUI() {
    const s = app.state;
    for (const id in geoBinds2) { const el = $('s-' + id); if (el) { el.value = s.geo[id]; $('v-' + id).textContent = geoBinds2[id][2](s.geo[id]); } }
    $('s-compactness').value = s.geo.compactness; $('v-compactness').textContent = Math.round(s.geo.compactness * 100) + '%';
    $('c-seatstay').value = s.geo.dropped ? 'dropped' : 'traditional';
    $('c-rings').value = String(s.drv.rings); $('c-cassetteN').value = String(s.drv.cassetteN);
    for (const id in fitBinds) { $('s-' + id).value = s.fit[id]; $('v-' + id).textContent = fitBinds[id][1](s.fit[id]); }
    $('s-explode').value = 0; $('v-explode').textContent = '0%';
    for (const id of colIds) $('col-' + id).value = s.col[id];
    $('c-preset').value = s.fin.preset; $('c-steps').value = String(s.fin.steps); $('c-bg').value = s.fin.bg;
    $('btn-explode-anim').textContent = '▶ 分解动画';
    $('btn-explode-reverse').textContent = '◀ 还原动画';
  }
  // 折叠切换
  $('btn-fold-all').addEventListener('click', () => document.querySelectorAll('details.sec').forEach(d => d.open = false));
  $('btn-open-all').addEventListener('click', () => document.querySelectorAll('details.sec').forEach(d => d.open = true));
  refreshCfgText();

  /* ---------- 渲染器 / 控制器 / 循环 ---------- */
  let renderer = null, controls = null;
  try {
    renderer = new T.WebGLRenderer({ canvas: $('gl'), antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = T.SRGBColorSpace;
    renderer.setClearColor(0xffffff, 1);
  } catch (err) {
    console.warn('WebGL 初始化跳过（无上下文）', err);
  }
  if (renderer) {
    try {
      controls = new OrbitControls(app.camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.minDistance = 0.25;
      controls.maxDistance = 9;
      controls.target.copy(app.camTarget);
      app.controls = controls;
    } catch (err) { console.warn('OrbitControls 初始化跳过', err); }
    function resize() {
      app.camera.aspect = window.innerWidth / window.innerHeight;
      app.camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', resize);
    let last = performance.now();
    function loop(t) {
      requestAnimationFrame(loop);
      const dt = Math.min(0.05, (t - last) / 1000); last = t;
      app.tick(dt);
      if (controls) {
        controls.target.lerp(app.camTarget, 0.12);
        controls.update();
      }
      renderer.render(app.scene, app.camera);
    }
    requestAnimationFrame(loop);
  } else {
    // 兜底：无 WebGL 时仍然运行逻辑 tick 以保证 UI 数值联动
    setInterval(() => app.tick(0.016), 16);
  }
}
</script>
</body>
</html>
