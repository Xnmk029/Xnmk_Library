<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>Bicycle Builder — 参数化 3D 自行车工作室与装配模拟器</title>
<style>
  :root{
    --bg:#14171c; --panel:#1c2027; --panel2:#232933; --line:#2e3540;
    --txt:#e8ecf2; --dim:#9aa4b2; --accent:#57c3ff; --accent2:#ffb454;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',monospace;
    --sans:'Segoe UI',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden; background:var(--bg); color:var(--txt); font-family:var(--sans);}
  #app{display:flex; height:100vh;}
  #viewport{flex:1; position:relative; min-width:0;}
  #viewport canvas{display:block;}
  #hud{position:absolute; top:12px; left:12px; pointer-events:none; font-family:var(--mono); font-size:11px; color:var(--dim); line-height:1.5;}
  #hud b{color:var(--txt);}
  #panel{width:344px; min-width:344px; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column;}
  #panelHead{padding:14px 16px 12px; border-bottom:1px solid var(--line);}
  #panelHead h1{font-size:15px; font-weight:600; letter-spacing:.3px;}
  #panelHead .sub{font-size:11px; color:var(--dim); margin-top:3px; font-family:var(--mono);}
  #scroll{flex:1; overflow-y:auto; padding:4px 0 16px;}
  .grp{border-bottom:1px solid var(--line);}
  .grp > .gt{display:flex; align-items:center; gap:8px; padding:11px 16px; cursor:pointer; user-select:none; font-size:13px; font-weight:600;}
  .grp > .gt:hover{background:var(--panel2);}
  .grp > .gt .chev{transition:transform .15s; color:var(--dim); font-size:11px;}
  .grp.collapsed > .gt .chev{transform:rotate(-90deg);}
  .grp > .gb{overflow:hidden; max-height:1200px; transition:max-height .25s ease;}
  .grp.collapsed > .gb{max-height:0;}
  .row{display:flex; align-items:center; gap:8px; padding:5px 16px;}
  .row label{flex:0 0 112px; font-size:12px; color:var(--dim);}
  .row input[type=range]{flex:1; accent-color:var(--accent); height:4px;}
  .row .val{flex:0 0 52px; text-align:right; font-family:var(--mono); font-size:12px; color:var(--txt);}
  .row select{flex:1; background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:4px 6px; font-size:12px;}
  .seg{display:flex; flex:1; gap:4px;}
  .seg button{flex:1; padding:5px 0; font-size:11px; background:var(--panel2); color:var(--dim); border:1px solid var(--line); border-radius:4px; cursor:pointer;}
  .seg button.on{color:#0b0e12; background:var(--accent); border-color:var(--accent); font-weight:700;}
  .color{flex:0 0 34px; height:24px; padding:0; border:1px solid var(--line); border-radius:4px; background:transparent; cursor:pointer;}
  .row input[type=checkbox]{accent-color:var(--accent); width:16px; height:16px;}
  #specs{padding:8px 16px 14px;}
  #specs .kv{display:flex; justify-content:space-between; padding:3px 0; font-family:var(--mono); font-size:12px; border-bottom:1px dashed #2a3038;}
  #specs .kv:last-child{border-bottom:none;}
  #specs .kv span:first-child{color:var(--dim);}
  #specs .kv span:last-child{color:var(--accent2);}
  #foot{padding:10px 16px; border-top:1px solid var(--line); display:flex; gap:6px; flex-wrap:wrap;}
  #foot button{flex:1; min-width:70px; padding:6px 0; font-size:12px; background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:5px; cursor:pointer;}
  #foot button.primary{background:var(--accent); color:#0b0e12; border-color:var(--accent); font-weight:700;}
  #foot button:hover{filter:brightness(1.12);}
</style>

  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<body>
<div id="app">
  <div id="viewport">
    <div id="hud">BIKE STUDIO — <b>DEEPSEEK-V4-PRO</b><br><span id="hudSpec"></span></div>
  </div>
  <div id="panel">
    <div id="panelHead">
      <h1>自行车工作室与装配模拟器</h1>
      <div class="sub">PARAMETRIC BIKE BUILDER · NPR CEL SHADING</div>
    </div>
    <div id="scroll"></div>
    <div id="foot">
      <button id="btnReset" class="primary">重置</button>
      <button data-cam="front">前视</button>
      <button data-cam="side">侧视</button>
      <button data-cam="top">俯视</button>
      <button data-cam="iso">等轴</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutlinePass } from 'three/addons/postprocessing/OutlinePass.js';

/* ============================= 参数定义 ============================= */
const DEFAULTS = {
  stack: 540, reach: 390, headTubeAngle: 72.5, seatTubeAngle: 73.5,
  seatTubeLength: 520, chainstay: 410, compact: 0.35, droppedSeatstay: false,
  chainrings: 2, cassetteSpeed: 11,
  saddleForeAft: 0, seatpostHeight: 160, handlebarWidth: 420, handlebarRise: 0, handlebarFlare: 0,
  assembly: 0,
  frameColor: '#e23b3b', forkColor: '#23262b', rimColor: '#101114', drivetrainColor: '#8a9099', cockpitColor: '#15171a',
  finish: 'matte',
  celSteps: 4, outline: true, pixelate: 0, showLabels: false, bg: 'dark'
};
const p = Object.assign({}, DEFAULTS);
const d2r = Math.PI / 180;
const MM = (mm) => mm / 1000;                 // 毫米 -> 米
const V = (x, y, z) => new THREE.Vector3(x, y, z);

/* ============================= 几何计算（毫米，Y 向上，车头朝 -X） ============================= */
function computeGeo() {
  const HTA = p.headTubeAngle * d2r, STA = p.seatTubeAngle * d2r;
  const wheelR = 337, bbDrop = 68, rake = 45;
  const rearAxle = V(0, wheelR, 0);
  const bb = V(-p.chainstay, wheelR - bbDrop, 0);
  const headTop = V(bb.x - p.reach, bb.y + p.stack, 0);
  const dirUp = V(-Math.cos(HTA), Math.sin(HTA), 0);          // 头管轴 底->顶
  const headTubeLen = 130 + p.compact * 60;
  const headBottom = headTop.clone().sub(dirUp.clone().multiplyScalar(headTubeLen));
  const forkLen = (headBottom.y - wheelR - rake * Math.cos(HTA)) / dirUp.y;
  const forkEnd = headBottom.clone().sub(dirUp.clone().multiplyScalar(forkLen));
  const frontAxle = forkEnd.clone().add(V(-rake * Math.sin(HTA), -rake * Math.cos(HTA), 0));
  const seatTop = bb.clone().add(V(p.seatTubeLength * Math.cos(STA), p.seatTubeLength * Math.sin(STA), 0));
  const topTubeFront = headTop.clone().sub(V(0, p.compact * 18, 0));
  const topTubeRear = seatTop.clone().sub(V(0, p.compact * (p.stack * 0.30), 0));
  const seatstayDrop = p.droppedSeatstay ? 62 : 0;
  const seatstayTop = topTubeRear.clone().sub(V(0, seatstayDrop, 0));
  return { HTA, STA, wheelR, bbDrop, rearAxle, bb, headTop, headBottom, dirUp, headTubeLen,
           forkEnd, frontAxle, seatTop, topTubeFront, topTubeRear, seatstayTop };
}

/* ============================= 材质（cel shading 色调分离） ============================= */
let gradientMap = makeGradientMap(p.celSteps);
function makeGradientMap(steps) {
  const data = new Uint8Array(Math.max(2, steps));
  for (let i = 0; i < data.length; i++) data[i] = Math.round(255 * i / (data.length - 1));
  const t = new THREE.DataTexture(data, data.length, 1, THREE.RedFormat);
  t.minFilter = THREE.NearestFilter; t.magFilter = THREE.NearestFilter; t.needsUpdate = true;
  return t;
}
function toon(color, opts = {}) {
  const m = new THREE.MeshToonMaterial({ color: new THREE.Color(color), gradientMap });
  if (opts.emissive) { m.emissive = new THREE.Color(opts.emissive); m.emissiveIntensity = opts.ei ?? 0.25; }
  if (opts.opacity != null) { m.transparent = true; m.opacity = opts.opacity; }
  return m;
}
const MAT = {
  frame: () => toon(p.frameColor),
  fork: () => toon(p.forkColor),
  rim: () => toon(p.rimColor, p.finish === 'metallic' || p.finish === 'gloss' ? { emissive: '#5a6572', ei: 0.18 } : {}),
  drivetrain: () => toon(p.drivetrainColor, p.finish === 'metallic' ? { emissive: '#6b7480', ei: 0.20 } : {}),
  cockpit: () => toon(p.cockpitColor),
  tire: () => toon('#191a1d'),
  accent: () => toon('#c9ced6'),
  carbon: () => toon(p.finish === 'carbon' ? '#14171c' : '#1b1e23')
};

/* ============================= 几何基元工具 ============================= */
function tube(pts, radius, mat, seg = 12) {
  const curve = new THREE.CatmullRomCurve3(pts.map(p => p.clone().multiplyScalar(MM)));
  const geo = new THREE.TubeGeometry(curve, Math.max(6, pts.length * 8), radius * MM, seg, false);
  return new THREE.Mesh(geo, mat);
}
function cyl(from, to, radius, mat, seg = 14) {
  const a = from.clone().multiplyScalar(MM), b = to.clone().multiplyScalar(MM);
  const dir = b.clone().sub(a); const len = dir.length();
  const geo = new THREE.CylinderGeometry(radius * MM, radius * MM, len, seg);
  const m = new THREE.Mesh(geo, mat);
  m.position.copy(a.clone().add(b).multiplyScalar(0.5));
  m.quaternion.setFromUnitVectors(V(0, 1, 0), dir.normalize());
  return m;
}
function torusAt(pos, radius, tubeRadius, mat, axis = V(0, 0, 1)) {
  const g = new THREE.TorusGeometry(radius * MM, tubeRadius * MM, 10, 48);
  const m = new THREE.Mesh(g, mat);
  m.position.copy(pos.clone().multiplyScalar(MM));
  m.quaternion.setFromUnitVectors(V(0, 0, 1), axis);
  return m;
}
function discAt(pos, radius, thick, mat, axis = V(0, 0, 1)) {
  const g = new THREE.CylinderGeometry(radius * MM, radius * MM, thick * MM, 32);
  const m = new THREE.Mesh(g, mat);
  m.position.copy(pos.clone().multiplyScalar(MM));
  m.quaternion.setFromUnitVectors(V(0, 1, 0), axis);
  return m;
}
function sphereAt(pos, radius, mat) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(radius * MM, 20, 16), mat);
  m.position.copy(pos.clone().multiplyScalar(MM));
  return m;
}
function boxAt(pos, sx, sy, sz, mat, ry = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx * MM, sy * MM, sz * MM), mat);
  m.position.copy(pos.clone().multiplyScalar(MM));
  m.rotation.y = ry;
  return m;
}

/* ============================= 组件构建 ============================= */
function buildFrame(g) {
  const grp = new THREE.Group();
  const mf = MAT.frame(), mc = MAT.carbon();
  // 头管
  grp.add(cyl(g.headTop, g.headBottom, 19, mf));
  // 上管
  grp.add(tube([g.topTubeFront, g.topTubeRear], 16, mf));
  // 下管
  grp.add(tube([g.headBottom, g.bb], 18, mf));
  // 座管（车架部分）
  grp.add(cyl(g.bb, g.topTubeRear, 16, mf));
  // 五通外壳（横向）
  grp.add(cyl(V(g.bb.x, g.bb.y, -42), V(g.bb.x, g.bb.y, 42), 20, mf, 20));
  // 后下叉（链支）×2
  for (const s of [-1, 1]) {
    const start = V(g.bb.x, g.bb.y, s * 20), end = V(g.rearAxle.x, g.rearAxle.y, s * 14);
    grp.add(cyl(start, end, 8, mf, 10));
  }
  // 后上叉（座支）×2 —— 下沉式走折线
  for (const s of [-1, 1]) {
    const top = V(g.seatstayTop.x, g.seatstayTop.y, s * 12);
    const bot = V(g.rearAxle.x, g.rearAxle.y, s * 10);
    if (p.droppedSeatstay) {
      const mid = V(g.seatstayTop.x - 45, g.seatstayTop.y - 14, s * 14);
      grp.add(tube([top, mid, bot], 8, mf, 10));
    } else {
      grp.add(cyl(top, bot, 8, mf, 10));
    }
  }
  // 勾爪（前后）
  grp.add(boxAt(V(g.rearAxle.x, g.rearAxle.y, 0), 18, 14, 26, mc));
  grp.add(boxAt(V(g.frontAxle.x, g.frontAxle.y, 0), 18, 14, 26, mc));
  return grp;
}

function buildFork(g) {
  const grp = new THREE.Group();
  const mf = MAT.fork();
  const crown = g.headBottom.clone().sub(g.dirUp.clone().multiplyScalar(18));
  // 叉腿（两条，左右）
  for (const s of [-1, 1]) {
    const top = V(crown.x, crown.y, s * 14), bot = V(g.forkEnd.x, g.forkEnd.y, s * 8);
    grp.add(cyl(top, bot, 9, mf, 10));
  }
  grp.add(cyl(crown, g.headBottom, 17, mf));
  return grp;
}

function buildWheel(axle, rimColor, sideSign) {
  const grp = new THREE.Group();
  const mt = MAT.tire(), mr = MAT.rim(), ms = MAT.accent();
  const axleM = axle.clone().multiplyScalar(MM);
  grp.position.copy(axleM);
  // 轮胎 + 轮圈
  grp.add(torusAt(V(0, 0, 0), 337, 24, mt, V(0, 0, 1)));
  grp.add(torusAt(V(0, 0, 0), 316, 8, mr, V(0, 0, 1)));
  // 花鼓
  grp.add(cyl(V(0, 0, -40), V(0, 0, 40), 14, mr, 16));
  grp.add(cyl(V(0, 0, -46), V(0, 0, -40), 22, mr, 16));
  grp.add(cyl(V(0, 0, 40), V(0, 0, 46), 22, mr, 16));
  // 辐条（InstancedMesh）
  const N = 28;
  const spokes = new THREE.InstancedMesh(
    new THREE.CylinderGeometry(0.6 * MM, 0.6 * MM, 1, 4),
    ms, N * 2);
  const m4 = new THREE.Matrix4(), up = V(0, 1, 0);
  let k = 0;
  for (let i = 0; i < N; i++) {
    const ang = (i / N) * Math.PI * 2;
    const rimPt = V(Math.cos(ang) * 316, Math.sin(ang) * 316, 0);
    const hubZ = (i % 2 === 0 ? 1 : -1) * 18;
    const hubPt = V(0, 0, hubZ);
    const dir = rimPt.clone().sub(hubPt);
    const len = dir.length();
    m4.compose(rimPt.clone().add(hubPt).multiplyScalar(0.5).multiplyScalar(MM),
      new THREE.Quaternion().setFromUnitVectors(up, dir.normalize()),
      V(1, len * MM, 1));
    spokes.setMatrixAt(k++, m4);
  }
  for (let i = 0; i < N; i++) {
    const ang = ((i + 0.5) / N) * Math.PI * 2;
    const rimPt = V(Math.cos(ang) * 316, Math.sin(ang) * 316, 0);
    const hubZ = (i % 2 === 0 ? -1 : 1) * 18;
    const hubPt = V(0, 0, hubZ);
    const dir = rimPt.clone().sub(hubPt);
    const len = dir.length();
    m4.compose(rimPt.clone().add(hubPt).multiplyScalar(0.5).multiplyScalar(MM),
      new THREE.Quaternion().setFromUnitVectors(up, dir.normalize()),
      V(1, len * MM, 1));
    spokes.setMatrixAt(k++, m4);
  }
  spokes.count = k;
  grp.add(spokes);
  // 气嘴
  grp.add(cyl(V(0, 330, 0), V(0, 350, 0), 2.4, ms, 8));
  return grp;
}

function buildDrivetrain(g) {
  const grp = new THREE.Group();
  const md = MAT.drivetrain(), ms = MAT.accent();
  const n = p.chainrings, spd = p.cassetteSpeed;
  // 中轴 + 曲柄（左右）
  grp.add(cyl(V(g.bb.x, g.bb.y, -70), V(g.bb.x, g.bb.y, 70), 9, ms, 12));
  for (const s of [-1, 1]) {
    const crankEnd = V(g.bb.x, g.bb.y - 170, s * 30);
    grp.add(cyl(V(g.bb.x, g.bb.y, s * 20), crankEnd, 11, md, 12));
    // 脚踏
    grp.add(boxAt(V(crankEnd.x, crankEnd.y - 6, s * 46), 30, 8, 34, ms));
  }
  // 牙盘（链环 1/2/3）
  const ringRadii = [78, 62, 46];
  for (let i = 0; i < n; i++) {
    const z = -8 - i * 7;
    grp.add(discAt(V(g.bb.x, g.bb.y, z), ringRadii[i], 4, md, V(0, 0, 1)));
    grp.add(torusAt(V(g.bb.x, g.bb.y, z), ringRadii[i] + 3, 2.2, ms, V(0, 0, 1)));
  }
  // 飞轮（锥形塔基 7-12 速）
  const cs = V(g.rearAxle.x, g.rearAxle.y, 16);
  for (let i = 0; i < spd; i++) {
    const r = 62 - i * (34 / Math.max(1, spd - 1));
    grp.add(discAt(V(cs.x, cs.y, cs.z + i * 4.4), r, 3.4, md, V(0, 0, 1)));
  }
  grp.add(cyl(V(g.rearAxle.x, g.rearAxle.y, 14), V(g.rearAxle.x, g.rearAxle.y, 14 + spd * 4.6), 10, ms, 10));
  // 前拨（多片牙盘时可见）
  if (n > 1) {
    const fd = V(g.bb.x + 40, g.bb.y + 120, 6);
    grp.add(cyl(V(fd.x, g.bb.y + 60, fd.z), V(fd.x, fd.y, fd.z), 5, md, 8));
    grp.add(boxAt(V(fd.x, fd.y + 18, fd.z), 12, 34, 30, md));
  }
  // 后拨
  const rd = V(g.rearAxle.x + 20, g.rearAxle.y - 90, 12);
  grp.add(cyl(V(rd.x - 8, g.rearAxle.y, 12), rd, 6, md, 8));
  grp.add(boxAt(V(rd.x, rd.y - 20, 12), 14, 40, 18, md));
  grp.add(cyl(V(rd.x, rd.y - 40, 12), V(rd.x, rd.y - 78, 12), 6, md, 8));
  for (const s of [-1, 1]) grp.add(torusAt(V(rd.x, rd.y - 80, 12), 15, 3, ms, V(0, 0, 1)));
  return grp;
}

function buildCockpit(g) {
  const grp = new THREE.Group();
  const mc = MAT.cockpit(), ms = MAT.accent();
  // 座管（插入件）+ 坐垫
  const dirSeat = V(Math.cos(g.STA), Math.sin(g.STA), 0);
  const seatpostTop = g.seatTop.clone().add(dirSeat.clone().multiplyScalar(p.seatpostHeight));
  grp.add(cyl(g.seatTop, seatpostTop, 13, mc));
  const saddleC = seatpostTop.clone().add(V(-p.saddleForeAft, 8, 0));
  grp.add(boxAt(V(saddleC.x + 40, saddleC.y, 0), 180, 20, 66, mc));
  grp.add(boxAt(V(saddleC.x + 55, saddleC.y + 4, 0), 130, 12, 56, ms));
  grp.add(cyl(V(seatpostTop.x + 20, seatpostTop.y - 6, 0), V(saddleC.x + 60, saddleC.y - 4, 0), 6, ms, 8));
  // 把立（stem）
  const stemDir = V(-Math.cos(g.HTA), Math.sin(g.HTA), 0);
  const clamp = g.headTop.clone().add(stemDir.clone().multiplyScalar(30));
  grp.add(cyl(g.headTop, clamp, 16, mc));
  // 弯把（drop bar）—— 一条曲线贯穿左右
  const w = p.handlebarWidth / 2, rise = p.handlebarRise, flare = p.handlebarFlare;
  const fz = Math.sin(flare * d2r) * 60, fx = (1 - Math.cos(flare * d2r)) * 60;
  const pts = [
    V(clamp.x - 40 - fx, clamp.y - 120 + rise, -(w + fz)),   // 左 drop 末端
    V(clamp.x - 20, clamp.y - 60 + rise, -(w + fz * 0.4)),    // 左 hood
    V(clamp.x - 10, clamp.y + 8 + rise, -w * 0.55),           // 左上把
    V(clamp.x - 10, clamp.y + 8 + rise, 0),                   // 中心
    V(clamp.x - 10, clamp.y + 8 + rise, w * 0.55),            // 右上把
    V(clamp.x - 20, clamp.y - 60 + rise, w + fz * 0.4),       // 右 hood
    V(clamp.x - 40 - fx, clamp.y - 120 + rise, w + fz)        // 右 drop 末端
  ];
  grp.add(tube(pts, 11, mc, 10));
  // 手变（brake hood）
  for (const s of [-1, 1]) {
    const hp = V(clamp.x - 30, clamp.y - 70 + rise, s * (w + fz * 0.5));
    grp.add(cyl(hp, V(hp.x - 26, hp.y - 2, hp.z), 13, ms, 12));
  }
  return grp;
}

function buildBrakesAndCables(g) {
  const grp = new THREE.Group();
  const md = MAT.drivetrain(), ms = MAT.accent(), mk = MAT.tire();
  // 碟片（带镂空孔）
  for (const [axle, sgn] of [[g.frontAxle, -1], [g.rearAxle, 1]]) {
    const dz = sgn * 24;
    grp.add(discAt(V(axle.x, axle.y, dz), 66, 3, ms, V(0, 0, 1)));
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      grp.add(discAt(V(axle.x + Math.cos(a) * 44, axle.y + Math.sin(a) * 44, dz), 3.5, 4.5, mk, V(0, 0, 1)));
    }
  }
  // 刹车夹器（前叉冠 / 座支）
  const fc = g.headBottom.clone().sub(g.dirUp.clone().multiplyScalar(20));
  grp.add(boxAt(V(fc.x, fc.y - 26, 4), 16, 50, 14, md));
  const rc = g.seatstayTop.clone().add(V(0, -20, 0));
  grp.add(boxAt(V(rc.x, rc.y, 4), 16, 50, 14, md));
  // 线管（几条弯曲的 TubeGeometry）
  const clampTop = g.headTop.clone().add(V(-30, 20, 0));
  grp.add(tube([clampTop, V(fc.x - 10, fc.y - 10, 8)], 3.5, mk, 8));
  grp.add(tube([clampTop, V(g.seatstayTop.x + 20, g.seatstayTop.y - 30, 8)], 3.5, mk, 8));
  grp.add(tube([clampTop, V(g.bb.x + 40, g.bb.y + 120, 6)], 3.5, mk, 8));
  grp.add(tube([clampTop, V(g.rearAxle.x + 20, g.rearAxle.y - 90, 10)], 3.5, mk, 8));
  return grp;
}

function buildStudio() {
  const grp = new THREE.Group();
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30),
    new THREE.MeshToonMaterial({ color: p.bg === 'dark' ? 0x20242b : 0xd7dbe2, gradientMap }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -0.01;
  grp.add(floor);
  const mw = new THREE.MeshToonMaterial({ color: 0x2b313a, gradientMap });
  const mw2 = new THREE.MeshToonMaterial({ color: 0x363e49, gradientMap });
  // 工作台
  grp.add(boxAt(V(0, 0, 3.4), 3.6, 0.08, 1.2, mw));
  for (const s of [-1, 1]) grp.add(boxAt(V(s * 1.5, 0, 3.4), 0.12, 1.7, 1.1, mw2));
  // 货架（两侧）
  for (const s of [-1, 1]) {
    grp.add(boxAt(V(s * 4.2, 0, 2.0), 0.1, 4.6, 2.6, mw2));
    for (let i = 1; i <= 3; i++) grp.add(boxAt(V(s * 4.2, 1.15 * i, 2.0), 0.55, 0.06, 2.4, mw));
  }
  // 后墙 + 挂工具板
  grp.add(boxAt(V(-0.5, 2.2, 4.6), 9, 4.6, 0.08, mw2));
  for (let i = 0; i < 5; i++) grp.add(boxAt(V(-3.4 + i * 1.4, 2.6, 4.45), 0.5, 0.5, 0.04, mw));
  return grp;
}

/* ============================= 场景初始化 ============================= */
const container = document.getElementById('viewport');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(p.bg === 'dark' ? 0x14171c : 0xdde2ea);
scene.fog = new THREE.Fog(scene.background, 12, 40);

const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 100);
camera.position.set(2.4, 1.7, 3.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.35, 0.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.6; controls.maxDistance = 12;

const hemi = new THREE.HemisphereLight(0xbcd2ff, 0x2a2e35, 0.85);
const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(4, 6, 3);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -4; key.shadow.camera.right = 4;
key.shadow.camera.top = 4; key.shadow.camera.bottom = -4;
const rim = new THREE.DirectionalLight(0x9fc4ff, 0.9);
rim.position.set(-3, 2, -2);
scene.add(hemi, key, rim);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const outlinePass = new OutlinePass(
  new THREE.Vector2(container.clientWidth, container.clientHeight), scene, camera);
outlinePass.edgeStrength = 3.5; outlinePass.edgeGlow = 0;
outlinePass.edgeThickness = 1; outlinePass.pulsePeriod = 0;
outlinePass.visibleEdgeColor.set('#14100e');
outlinePass.hiddenEdgeColor.set('#14100e');
composer.addPass(outlinePass);

/* ============================= 组件注册 + 重建 ============================= */
const bike = new THREE.Group();
const studio = buildStudio();
scene.add(studio, bike);
const labelGroup = new THREE.Group();
scene.add(labelGroup);

const componentGroups = { frame: null, fork: null, frontWheel: null, rearWheel: null,
  drivetrain: null, cockpit: null, brakes: null };
const EXPLODE = {
  frame:      V(0, 0, 0),
  fork:       V(0, 0.55, 0),
  frontWheel: V(0, 0, -0.55),
  rearWheel:  V(0, 0, 0.55),
  drivetrain: V(0, -0.25, 0),
  cockpit:    V(0, 0.5, 0),
  brakes:     V(0, 0.18, 0)
};
const LABELS = { frame: '车架', fork: '前叉', frontWheel: '前轮', rearWheel: '后轮',
  drivetrain: '传动', cockpit: '座舱', brakes: '刹车' };

function makeLabel(text) {
  const cv = document.createElement('canvas'); cv.width = 128; cv.height = 48;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = 'rgba(20,23,28,0.88)'; ctx.fillRect(0, 0, 128, 48);
  ctx.strokeStyle = '#57c3ff'; ctx.lineWidth = 2; ctx.strokeRect(2, 2, 124, 44);
  ctx.fillStyle = '#e8ecf2'; ctx.font = '600 20px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 64, 25);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(cv), transparent: true, depthTest: false }));
  spr.scale.set(0.5, 0.19, 1);
  return spr;
}
function refreshLabels() {
  labelGroup.clear();
  if (!p.showLabels) return;
  for (const name of Object.keys(componentGroups)) {
    const cg = componentGroups[name];
    if (!cg) continue;
    const box = new THREE.Box3().setFromObject(cg);
    if (box.isEmpty()) continue;
    const c = box.getCenter(new THREE.Vector3());
    const spr = makeLabel(LABELS[name]);
    spr.position.copy(c); spr.position.y = box.max.y + 0.14;
    labelGroup.add(spr);
  }
}

function rebuild() {
  const g = computeGeo();
  for (const name of Object.keys(componentGroups)) {
    if (componentGroups[name]) { bike.remove(componentGroups[name]); componentGroups[name] = null; }
  }
  componentGroups.frame = buildFrame(g);
  componentGroups.fork = buildFork(g);
  componentGroups.frontWheel = buildWheel(g.frontAxle);
  componentGroups.rearWheel = buildWheel(g.rearAxle);
  componentGroups.drivetrain = buildDrivetrain(g);
  componentGroups.cockpit = buildCockpit(g);
  componentGroups.brakes = buildBrakesAndCables(g);
  for (const name of Object.keys(componentGroups)) {
    const cg = componentGroups[name];
    cg.userData.home = new THREE.Vector3();
    cg.userData.explode = EXPLODE[name] || V(0, 0, 0);
    cg.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    bike.add(cg);
  }
  refreshOutline();
  refreshLabels();
  updateSpecs(g);
  return g;
}

function refreshOutline() {
  outlinePass.selectedObjects = [];
  if (!p.outline) return;
  bike.traverse(o => {
    if (o.isMesh) outlinePass.selectedObjects.push(o);
  });
}

let lastGeo = null;
function updateSpecs(g) {
  const wb = Math.abs(g.frontAxle.x - g.rearAxle.x);
  const frontC = Math.abs(g.frontAxle.x - g.bb.x);
  const rearC = Math.abs(g.bb.x - g.rearAxle.x);
  const cfg = `${p.chainrings}×${p.cassetteSpeed}`;
  // 重量估算（kg，随配置变化）
  let w = 6.4;
  w += p.chainrings * 0.18 + (p.cassetteSpeed - 7) * 0.06;
  w += (p.finish === 'carbon' ? -0.7 : p.finish === 'metallic' ? 0.15 : 0);
  w += (p.handlebarWidth - 420) / 40 * 0.1;
  w += (p.seatpostHeight - 160) / 20 * 0.06;
  const spec = {
    'Stack': p.stack + ' mm', 'Reach': p.reach + ' mm',
    '头管角': p.headTubeAngle.toFixed(1) + '°', '座管角': p.seatTubeAngle.toFixed(1) + '°',
    '座管长度': p.seatTubeLength + ' mm', '后下叉': p.chainstay + ' mm',
    '轮距': wb.toFixed(0) + ' mm', '前中心': frontC.toFixed(0) + ' mm', '后中心': rearC.toFixed(0) + ' mm',
    '传动配置': cfg, '估算重量': w.toFixed(1) + ' kg'
  };
  const el = document.getElementById('specBox');
  if (el) {
    el.innerHTML = Object.entries(spec)
      .map(([k, v]) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`).join('');
  }
  const hud = document.getElementById('hudSpec');
  if (hud) hud.textContent = `传动 ${cfg} · 轮距 ${wb.toFixed(0)}mm · 重量 ${w.toFixed(1)}kg · 分解 ${(p.assembly * 100).toFixed(0)}%`;
}

/* ============================= 分解动画（沿真实安装轴） ============================= */
function applyAssembly() {
  const t = p.assembly;
  for (const name of Object.keys(componentGroups)) {
    const cg = componentGroups[name];
    if (!cg) continue;
    cg.position.copy(cg.userData.home).addScaledVector(cg.userData.explode, t);
  }
  if (p.showLabels) refreshLabels();
}

/* ============================= UI 构建 ============================= */
const UI_DEF = [
  { group: '车架几何 Frame Geometry', controls: [
    { k: 'stack', label: 'Stack 堆高', min: 480, max: 620, step: 5, unit: ' mm' },
    { k: 'reach', label: 'Reach 前伸', min: 360, max: 440, step: 5, unit: ' mm' },
    { k: 'headTubeAngle', label: '头管角', min: 70, max: 75, step: 0.1, unit: '°', fmt: v => v.toFixed(1) },
    { k: 'seatTubeAngle', label: '座管角', min: 72, max: 76, step: 0.1, unit: '°', fmt: v => v.toFixed(1) },
    { k: 'seatTubeLength', label: '座管长度', min: 480, max: 580, step: 5, unit: ' mm' },
    { k: 'chainstay', label: '后下叉长度', min: 400, max: 440, step: 5, unit: ' mm' },
    { k: 'compact', label: '紧凑度', min: 0, max: 1, step: 0.01, fmt: v => (v * 100).toFixed(0) + '%' },
  ]},
  { group: '传动 Drivetrain', controls: [
    { k: 'chainrings', label: '牙盘片数', type: 'seg', options: [1, 2, 3] },
    { k: 'cassetteSpeed', label: '飞轮速数', min: 7, max: 12, step: 1, unit: ' 速' },
  ]},
  { group: '适配与座舱 Fit & Cockpit', controls: [
    { k: 'saddleForeAft', label: '坐垫前后', min: -30, max: 30, step: 1, unit: ' mm' },
    { k: 'seatpostHeight', label: '座管高度', min: 100, max: 220, step: 5, unit: ' mm' },
    { k: 'handlebarWidth', label: '车把宽度', min: 380, max: 460, step: 5, unit: ' mm' },
    { k: 'handlebarRise', label: '抬升 Rise', min: -10, max: 30, step: 1, unit: ' mm' },
    { k: 'handlebarFlare', label: '外撇 Flare', min: 0, max: 20, step: 1, unit: '°' },
  ]},
  { group: '装配 Assembly', controls: [
    { k: 'assembly', label: '分解程度', min: 0, max: 1, step: 0.01, fmt: v => (v * 100).toFixed(0) + '%' },
  ]},
  { group: '配色与表面 Colors & Finishes', controls: [
    { k: 'frameColor', label: '车架', type: 'color' },
    { k: 'forkColor', label: '前叉', type: 'color' },
    { k: 'rimColor', label: '轮圈', type: 'color' },
    { k: 'drivetrainColor', label: '传动', type: 'color' },
    { k: 'cockpitColor', label: '座舱', type: 'color' },
    { k: 'finish', label: '表面预设', type: 'seg', options: ['matte', 'gloss', 'metallic', 'carbon'],
      fmt: v => ({ matte: '哑光', gloss: '亮光', metallic: '金属', carbon: '碳纤维' })[v] },
  ]},
  { group: '渲染风格 Render Style', controls: [
    { k: 'celSteps', label: '色阶档数', min: 2, max: 6, step: 1, unit: ' 档' },
    { k: 'pixelate', label: '像素化', min: 0, max: 3, step: 1, fmt: v => ['无', '低', '中', '高'][v] },
    { k: 'outline', label: '轮廓墨线', type: 'check' },
    { k: 'showLabels', label: '组件标签', type: 'check' },
    { k: 'bg', label: '背景', type: 'seg', options: ['dark', 'light'], fmt: v => v === 'dark' ? '深色' : '浅色' },
  ]},
];

const scrollEl = document.getElementById('scroll');
function fmtVal(c, v) { return c.fmt ? c.fmt(v) : v + (c.unit || ''); }
function buildUI() {
  scrollEl.innerHTML = '';
  for (const grp of UI_DEF) {
    const gEl = document.createElement('div'); gEl.className = 'grp';
    const gt = document.createElement('div'); gt.className = 'gt';
    gt.innerHTML = `<span class="chev">▼</span><span>${grp.group}</span>`;
    gt.onclick = () => gEl.classList.toggle('collapsed');
    const gb = document.createElement('div'); gb.className = 'gb';
    for (const c of grp.controls) {
      const row = document.createElement('div'); row.className = 'row';
      const lab = document.createElement('label'); lab.textContent = c.label; row.appendChild(lab);
      if (c.type === 'color') {
        const inp = document.createElement('input'); inp.type = 'color'; inp.className = 'color';
        inp.value = p[c.k];
        inp.oninput = () => { p[c.k] = inp.value; onParamChanged(c.k); };
        row.appendChild(inp);
      } else if (c.type === 'check') {
        const inp = document.createElement('input'); inp.type = 'checkbox'; inp.checked = !!p[c.k];
        inp.onchange = () => { p[c.k] = inp.checked; onParamChanged(c.k); };
        row.appendChild(inp);
      } else if (c.type === 'seg') {
        const seg = document.createElement('div'); seg.className = 'seg';
        const mk = () => seg.querySelectorAll('button').forEach(b =>
          b.classList.toggle('on', String(b.dataset.v) === String(p[c.k])));
        for (const opt of c.options) {
          const b = document.createElement('button'); b.textContent = fmtVal(c, opt);
          b.dataset.v = opt;
          b.onclick = () => { p[c.k] = (c.k === 'finish' ? opt : Number(opt)); mk(); onParamChanged(c.k); };
          seg.appendChild(b);
        }
        mk(); row.appendChild(seg);
      } else {
        const inp = document.createElement('input'); inp.type = 'range';
        inp.min = c.min; inp.max = c.max; inp.step = c.step; inp.value = p[c.k];
        const val = document.createElement('span'); val.className = 'val'; val.textContent = fmtVal(c, p[c.k]);
        inp.oninput = () => { p[c.k] = Number(inp.value); val.textContent = fmtVal(c, p[c.k]); onParamChanged(c.k); };
        row.appendChild(inp); row.appendChild(val);
      }
      gb.appendChild(row);
    }
    gEl.appendChild(gt); gEl.appendChild(gb);
    scrollEl.appendChild(gEl);
  }
  // 规格面板
  const sp = document.createElement('div'); sp.className = 'grp';
  sp.innerHTML = `<div class="gt"><span class="chev">▼</span><span>规格 Specifications</span></div>`;
  const sb = document.createElement('div'); sb.className = 'gb'; sb.id = 'specBox'; sb.style.padding = '0';
  sp.appendChild(sb);
  scrollEl.appendChild(sp);
}

let dirty = true;
function onParamChanged(k) {
  if (k === 'assembly') { applyAssembly(); updateSpecs(lastGeo || computeGeo()); return; }
  if (k === 'celSteps') { gradientMap = makeGradientMap(p.celSteps); }
  if (k === 'pixelate') { composer.setPixelRatio(Math.max(0.25, 1 - p.pixelate * 0.25)); }
  if (k === 'outline') { refreshOutline(); return; }
  if (k === 'showLabels') { refreshLabels(); return; }
  if (k === 'bg') {
    scene.background = new THREE.Color(p.bg === 'dark' ? 0x14171c : 0xdde2ea);
    scene.fog = new THREE.Fog(scene.background, 12, 40);
    rebuildStudio();
  }
  dirty = true;
}
function rebuildStudio() {
  scene.remove(studio);
  studio.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
  const ns = buildStudio();
  studio.children.length = 0; ns.children.forEach(c => studio.add(c));
  scene.add(studio);
}

buildUI();
lastGeo = rebuild();

document.getElementById('btnReset').onclick = () => {
  Object.assign(p, DEFAULTS);
  buildUI();
  gradientMap = makeGradientMap(p.celSteps);
  composer.setPixelRatio(1);
  dirty = true;
  lastGeo = rebuild();
};
document.querySelectorAll('#foot button[data-cam]').forEach(b => {
  b.onclick = () => {
    const presets = {
      front: { pos: V(-0.35, 0.55, 4.2), tgt: V(-0.35, 0.5, 0) },
      side: { pos: V(3.6, 0.8, -0.1), tgt: V(-0.35, 0.5, 0) },
      top: { pos: V(-0.35, 4.4, 0.01), tgt: V(-0.35, 0.4, 0) },
      iso: { pos: V(2.4, 1.7, 3.4), tgt: V(-0.35, 0.5, 0) }
    }[b.dataset.cam];
    camera.position.copy(presets.pos); controls.target.copy(presets.tgt); controls.update();
  };
});

window.addEventListener('resize', () => {
  const w = container.clientWidth, h = container.clientHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h); composer.setSize(w, h);
});

/* ============================= 渲染循环 ============================= */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  if (dirty) {
    dirty = false;
    // 重建时保留分解状态
    const t = p.assembly;
    lastGeo = rebuild();
    p.assembly = t;
    applyAssembly();
  }
  // 组件标签（简易 sprite 方案省略，仅用 HUD 显示）
  composer.render();
}
animate();
</script>
</body>
</html>
