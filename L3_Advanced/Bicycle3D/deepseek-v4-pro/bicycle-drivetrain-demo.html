<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>低多边形动态自行车传动展示台 · Drivetrain Display Stand</title>
<style>
  :root {
    --ink: #1a1a2e;
    --paper: #f4f1e8;
    --accent: #ff7a3c;
    --cyan: #2ec4b6;
    --panel: rgba(255, 252, 245, 0.92);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: var(--paper);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---- HUD 顶部 ---- */
  #hud {
    position: absolute; top: 18px; left: 18px; z-index: 10;
    pointer-events: none;
  }
  .hud-title {
    font-size: 20px; font-weight: 800; letter-spacing: 1px;
    padding: 8px 14px;
    background: var(--ink); color: #fff;
    border: 3px solid var(--ink);
    box-shadow: 6px 6px 0 var(--accent);
    display: inline-block;
  }
  .hud-title .en { font-weight: 500; font-size: 12px; letter-spacing: 2px; color: #ffd166; }
  #gearBox {
    margin-top: 14px; display: inline-block;
    background: var(--accent); color: var(--ink);
    border: 3px solid var(--ink);
    box-shadow: 5px 5px 0 rgba(26,26,46,.25);
    padding: 8px 16px;
    font-size: 30px; font-weight: 900; letter-spacing: 2px;
  }
  #gearBox small { font-size: 14px; font-weight: 700; letter-spacing: 1px; }

  /* ---- 规格面板 右下 ---- */
  #specs {
    position: absolute; right: 18px; bottom: 18px; z-index: 10;
    background: var(--panel); border: 3px solid var(--ink);
    box-shadow: 6px 6px 0 rgba(26,26,46,.18);
    padding: 14px 16px; min-width: 190px;
  }
  #specs h3 { font-size: 13px; letter-spacing: 2px; margin-bottom: 8px; color: #6b6b82; }
  #specs .row {
    display: flex; justify-content: space-between;
    font-size: 15px; font-weight: 700;
    padding: 3px 0; border-bottom: 1px dashed #d8d4c8;
  }
  #specs .row:last-child { border-bottom: none; }
  #specs .row .val { color: var(--accent); font-variant-numeric: tabular-nums; }

  /* ---- 控制面板 左下 ---- */
  #controls {
    position: absolute; left: 18px; bottom: 18px; z-index: 10;
    display: flex; flex-direction: column; gap: 8px;
  }
  .btn-row { display: flex; gap: 8px; }
  button {
    font-family: inherit; font-weight: 800; font-size: 14px; letter-spacing: 1px;
    color: var(--ink); background: var(--panel);
    border: 3px solid var(--ink); cursor: pointer;
    padding: 9px 14px; box-shadow: 4px 4px 0 rgba(26,26,46,.25);
    transition: transform .08s ease, box-shadow .08s ease, background .12s ease;
    user-select: none;
  }
  button:hover { background: #ffe8d6; }
  button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 rgba(26,26,46,.25); }
  button.primary { background: var(--accent); color: #fff; text-shadow: 1px 1px 0 rgba(0,0,0,.25); }
  button.primary.on { background: var(--cyan); }
  button.small { padding: 7px 10px; font-size: 12px; }

  #hint {
    position: absolute; top: 18px; right: 18px; z-index: 10;
    font-size: 12px; color: #7a7a92; background: var(--panel);
    border: 2px solid #d8d4c8; padding: 6px 10px;
  }
</style>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div class="hud-title">自行车传动展示台 <span class="en">DRIVETRAIN DISPLAY STAND</span></div>
    <div id="gearBox">Gear <span id="gearVal">3</span> / <small>7</small></div>
  </div>

  <div id="hint">拖动旋转 · 滚轮缩放 · 右键平移</div>

  <div id="specs">
    <h3>TRANSMISSION SPEC</h3>
    <div class="row"><span>牙盘 Chainring</span><span class="val"><span id="specCrank">32</span>T</span></div>
    <div class="row"><span>飞轮 Cog</span><span class="val"><span id="specCog">21</span>T</span></div>
    <div class="row"><span>齿比 Ratio</span><span class="val" id="specRatio">1.52</span></div>
    <div class="row"><span>曲柄转速 RPM</span><span class="val" id="specRpm">0</span></div>
  </div>

  <div id="controls">
    <button id="btnPower" class="primary">▶ 启动电机</button>
    <div class="btn-row">
      <button id="btnUp">升挡 ▲</button>
      <button id="btnDown">降挡 ▼</button>
      <button id="btnReset">重置</button>
    </div>
    <div class="btn-row">
      <button id="btnCamFront" class="small">前视</button>
      <button id="btnCamSide" class="small">侧视</button>
      <button id="btnCamTop" class="small">俯视</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
(function () {
  'use strict';

  // ==================== 常量与状态 ====================
  var CRANK_TEETH = 32;
  var COG_TEETH = [28, 24, 21, 18, 15, 13, 11]; // 7 速飞轮（1..7 挡，大→小）
  var GEAR_COUNT = 7;
  var RA = 1.1;                         // 牙盘半径
  var BY = -0.72, BZ = -2.42;           // 飞轮中心 (y, z)
  var CRANK_OMEGA = 2.1;                // 牙盘角速度 rad/s（电机开）
  var LINK_COUNT = 64;                  // 链节数量

  // 飞轮半径 / 轴向位置（挡位 1..7）
  function cogR(g) { return 0.585 - (g - 1) / (GEAR_COUNT - 1) * 0.345; }
  function cogX(g) { return -0.27 + (g - 1) * 0.09; }
  // 后拨导轮在下切线上的参数位置（挡位越大越靠后张紧）
  function derU(g) { return 0.52 - (g - 1) * 0.026; }

  var state = {
    targetGear: 3,
    gear: 3,            // 平滑显示挡位（浮点）
    motorOn: false,
    crankAngle: 0,
    arcPhase: 0,        // 链节沿路径滚动的弧长
    guideAngle: 0,      // 导轮自转
  };

  // ==================== 渲染器 / 场景 / 相机 ====================
  var app = document.getElementById('app');
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0xf4f1e8);
  app.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xf4f1e8, 9, 24);

  var camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(2.6, 1.5, 4.2);

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, -0.55, -1.2);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 2;
  controls.maxDistance = 12;
  controls.maxPolarAngle = Math.PI * 0.85;
  controls.update();

  // ==================== 灯光 ====================
  scene.add(new THREE.HemisphereLight(0xfff6e6, 0x9fb4c7, 0.85));
  var key = new THREE.DirectionalLight(0xffffff, 0.95);
  key.position.set(4, 6, 3);
  scene.add(key);
  var rim = new THREE.DirectionalLight(0xcfe6ff, 0.5);
  rim.position.set(-3, 2, -4);
  scene.add(rim);

  // ==================== NPR cel 色阶贴图 ====================
  function makeToonGradient(steps) {
    var cols = ['#5a4a7a', '#8a78b0', '#cbb9f0', '#f2ecff'];
    var n = cols.length;
    var data = new Uint8Array(n * 4);
    for (var i = 0; i < n; i++) {
      var c = new THREE.Color(cols[i]);
      data[i * 4 + 0] = c.r * 255;
      data[i * 4 + 1] = c.g * 255;
      data[i * 4 + 2] = c.b * 255;
      data[i * 4 + 3] = 255;
    }
    var tex = new THREE.DataTexture(data, n, 1, THREE.RGBAFormat);
    tex.minFilter = THREE.NearestFilter;
    tex.magFilter = THREE.NearestFilter;
    tex.needsUpdate = true;
    return tex;
  }
  var toonTex = makeToonGradient(4);

  function toonMat(hex, opts) {
    var m = new THREE.MeshToonMaterial({ color: hex, gradientMap: toonTex });
    if (opts) for (var k in opts) m[k] = opts[k];
    return m;
  }
  function outline(mesh, color, threshold) {
    var edges = new THREE.EdgesGeometry(mesh.geometry, threshold || 18);
    var line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: color || 0x1a1a2e }));
    mesh.add(line);
    return line;
  }

  // ==================== 链路径几何（2D yz 平面） ====================
  // 两圆：A=牙盘中心(0,0) ra；B=飞轮中心(BY,BZ) rb。
  // 返回上切线 tA->tB、下切线 tB2->tA2 及两段圆弧参数。
  function computePath(rb) {
    // 两圆：A=牙盘中心(0,0) ra；B=飞轮中心(BY,BZ) rb。
    // 2D 坐标统一为 [y, z]（y 上、z 前）。用标准外切线公式求上下两条切线的切点。
    var A = [0, 0], B = [BY, BZ], ra = RA;
    var dy = B[0] - A[0], dz = B[1] - A[1];
    var d = Math.hypot(dy, dz);
    var dr = ra - rb;
    var L = Math.sqrt(Math.max(0, d * d - dr * dr));
    var d2 = d * d;

    // 上切线（切点在两圆上方）：tA -> tB
    var tA = [A[0] + ra * (dr * dy - L * dz) / d2, A[1] + ra * (dr * dz + L * dy) / d2];
    var tB = [B[0] + rb * (dr * dy - L * dz) / d2, B[1] + rb * (dr * dz + L * dy) / d2];
    // 下切线（切点在两圆下方）：tB2 -> tA2
    var tA2 = [A[0] + ra * (dr * dy + L * dz) / d2, A[1] + ra * (dr * dz - L * dy) / d2];
    var tB2 = [B[0] + rb * (dr * dy + L * dz) / d2, B[1] + rb * (dr * dz - L * dy) / d2];

    var lenTop = Math.hypot(tB[0] - tA[0], tB[1] - tA[1]);
    var lenBot = Math.hypot(tA2[0] - tB2[0], tA2[1] - tB2[1]);

    // 圆弧：给定圆心(cY,cZ)、起止点，选使弧中点最接近 via 角度的扫描方向。
    function arc(cY, cZ, p1, p2, via) {
      var a1 = Math.atan2(p1[0] - cY, p1[1] - cZ);
      var a2 = Math.atan2(p2[0] - cY, p2[1] - cZ);
      var full = Math.PI * 2;
      var dAng = (a2 - a1) % full;
      if (dAng < 0) dAng += full;
      var cand1 = dAng, cand2 = dAng - full;
      var mid1 = a1 + cand1 / 2, mid2 = a1 + cand2 / 2;
      function angDist(x) { var dd = x - via; return Math.atan2(Math.sin(dd), Math.cos(dd)); }
      var sweep = Math.abs(angDist(mid1)) <= Math.abs(angDist(mid2)) ? cand1 : cand2;
      return { c: [cY, cZ], start: a1, sweep: sweep };
    }
    var arcB = arc(B[0], B[1], tB, tB2, Math.PI);          // 飞轮走后侧
    var arcA = arc(A[0], A[1], tA2, tA, -Math.PI * 0.25);  // 牙盘走前下侧
    arcB.r = rb; arcA.r = ra;
    var lenArcB = Math.abs(arcB.sweep) * rb;
    var lenArcA = Math.abs(arcA.sweep) * ra;

    var total = lenTop + lenArcB + lenBot + lenArcA;
    return { tA: tA, tB: tB, tB2: tB2, tA2: tA2, arcB: arcB, arcA: arcA,
             lenTop: lenTop, lenArcB: lenArcB, lenBot: lenBot, lenArcA: lenArcA,
             total: total, ra: ra, rb: rb };
  }

  // 沿闭合路径采样（段顺序：上切线 → 飞轮弧 → 下切线 → 牙盘弧）
  function pointAt(path, arcLen) {
    var s = ((arcLen % path.total) + path.total) % path.total;
    var a = path.lenTop, b = a + path.lenArcB, c = b + path.lenBot, dd = path.total;
    if (s < a) {
      var t = s / path.lenTop;
      return { p: [path.tA[0] + (path.tB[0] - path.tA[0]) * t,
                   path.tA[1] + (path.tB[1] - path.tA[1]) * t],
               tan: [path.tB[0] - path.tA[0], path.tB[1] - path.tA[1]] };
    } else if (s < b) {
      var ang = path.arcB.start + path.arcB.sweep * ((s - a) / path.lenArcB);
      var cY = path.arcB.c[0], cZ = path.arcB.c[1];
      return { p: [cY + Math.sin(ang) * path.arcB.r, cZ + Math.cos(ang) * path.arcB.r],
               tan: [Math.cos(ang) * path.arcB.sweep, -Math.sin(ang) * path.arcB.sweep] };
    } else if (s < c) {
      var t2 = (s - b) / path.lenBot;
      return { p: [path.tB2[0] + (path.tA2[0] - path.tB2[0]) * t2,
                   path.tB2[1] + (path.tA2[1] - path.tB2[1]) * t2],
               tan: [path.tA2[0] - path.tB2[0], path.tA2[1] - path.tB2[1]] };
    } else {
      var ang2 = path.arcA.start + path.arcA.sweep * ((s - c) / path.lenArcA);
      var aY = path.arcA.c[0], aZ = path.arcA.c[1];
      return { p: [aY + Math.sin(ang2) * path.arcA.r, aZ + Math.cos(ang2) * path.arcA.r],
               tan: [Math.cos(ang2) * path.arcA.sweep, -Math.sin(ang2) * path.arcA.sweep] };
    }
  }

  // ==================== 材质 ====================
  var matFrame = toonMat(0x2ec4b6);
  var matCrank = toonMat(0x2a2a3e);
  var matCrankRing = toonMat(0xff7a3c);
  var matCog = toonMat(0xd8d8e6);
  var matCogActive = toonMat(0xffd166);
  var matChain = toonMat(0x7d8597);
  var matGuide = toonMat(0x2a2a3e);
  var matPedal = toonMat(0x11111f);
  var matMotor = toonMat(0x3d3d52);
  var acrylic = new THREE.MeshPhysicalMaterial({
    color: 0xdff2ff, transparent: true, opacity: 0.38,
    roughness: 0.08, metalness: 0.0, clearcoat: 1.0, clearcoatRoughness: 0.1
  });

  // ==================== 牙盘 + 曲柄 ====================
  var crankGroup = new THREE.Group();
  crankGroup.position.set(0, 0, 0);
  scene.add(crankGroup);

  function starShape(radius, teeth, toothDepth) {
    var shape = new THREE.Shape();
    var rIn = Math.max(0.2, radius - toothDepth);
    var step = Math.PI * 2 / teeth;
    for (var i = 0; i < teeth; i++) {
      var a0 = i * step, a1 = a0 + step * 0.5, a2 = (i + 1) * step;
      var x1 = Math.cos(a0) * rIn, y1 = Math.sin(a0) * rIn;
      var xt = Math.cos(a1) * radius, yt = Math.sin(a1) * radius;
      var x2 = Math.cos(a2) * rIn, y2 = Math.sin(a2) * rIn;
      if (i === 0) shape.moveTo(x1, y1); else shape.lineTo(x1, y1);
      shape.lineTo(xt, yt);
      shape.lineTo(x2, y2);
    }
    shape.closePath();
    return shape;
  }
  function extrudeOnX(shape, thickness) {
    var g = new THREE.ExtrudeGeometry(shape, { depth: thickness, bevelEnabled: false, curveSegments: 1 });
    g.rotateY(Math.PI / 2);
    return g;
  }

  // 牙盘
  var ringGeo = extrudeOnX(starShape(RA, CRANK_TEETH, 0.16), 0.07);
  var ring = new THREE.Mesh(ringGeo, matCrankRing);
  crankGroup.add(ring);
  outline(ring, 0x1a1a2e, 22);

  // 曲柄臂（两侧，沿 x 轴）
  var armGeo = new THREE.CylinderGeometry(0.045, 0.045, 0.72, 10);
  armGeo.rotateZ(Math.PI / 2);
  for (var side = -1; side <= 1; side += 2) {
    var arm = new THREE.Mesh(armGeo, matCrank);
    arm.position.set(side * 0.30, 0, 0);
    crankGroup.add(arm);
    var pedal = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.06, 0.12), matPedal);
    pedal.position.set(side * 0.72, 0, 0);
    crankGroup.add(pedal);
  }
  // 中轴
  var bbGeo = new THREE.CylinderGeometry(0.10, 0.10, 0.16, 16);
  bbGeo.rotateZ(Math.PI / 2);
  var bb = new THREE.Mesh(bbGeo, matCrank);
  crankGroup.add(bb);

  // ==================== 飞轮组（7 片，沿 x 轴堆叠） ====================
  var cogGroup = new THREE.Group();
  cogGroup.position.set(0, BY, BZ);
  scene.add(cogGroup);

  var cogMeshes = [];
  for (var g = 1; g <= GEAR_COUNT; g++) {
    var cr = cogR(g);
    var cgeo = extrudeOnX(starShape(cr, COG_TEETH[g - 1], 0.14), 0.06);
    var cog = new THREE.Mesh(cgeo, g === 3 ? matCogActive : matCog);
    cog.position.x = cogX(g);
    cogGroup.add(cog);
    outline(cog, 0x1a1a2e, 22);
    cogMeshes.push({ mesh: cog, base: g === 3 ? matCogActive : matCog, g: g });
  }
  // 飞轮轴
  var axleGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.9, 12);
  axleGeo.rotateZ(Math.PI / 2);
  var axle = new THREE.Mesh(axleGeo, matCrank);
  cogGroup.add(axle);

  // ==================== 后拨（导板 cage + 两个导轮） ====================
  var derGroup = new THREE.Group();
  scene.add(derGroup);

  var cagePlateGeo = new THREE.BoxGeometry(0.02, 0.42, 0.16);
  var cagePlateA = new THREE.Mesh(cagePlateGeo, matGuide);
  var cagePlateB = new THREE.Mesh(cagePlateGeo, matGuide);
  derGroup.add(cagePlateA); derGroup.add(cagePlateB);

  function guideWheel(radius) {
    var geo = new THREE.CylinderGeometry(radius, radius, 0.05, 18);
    geo.rotateZ(Math.PI / 2);
    var w = new THREE.Mesh(geo, matGuide);
    return w;
  }
  var guideTop = guideWheel(0.13);
  var guideBot = guideWheel(0.11);
  derGroup.add(guideTop); derGroup.add(guideBot);

  // 后拨悬挂点（从飞轮轴中心垂下）
  var derArmGeo = new THREE.CylinderGeometry(0.025, 0.025, 0.3, 8);
  var derArm = new THREE.Mesh(derArmGeo, matGuide);
  derGroup.add(derArm);

  // ==================== 链条（InstancedMesh） ====================
  var linkGeo = new THREE.BoxGeometry(0.11, 0.24, 0.15); // x厚, y长, z宽
  var chain = new THREE.InstancedMesh(linkGeo, matChain, LINK_COUNT);
  chain.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  scene.add(chain);
  var dummy = new THREE.Object3D();
  // 链节交替明暗（内/外片）
  var colA = new THREE.Color(0x9aa2b5), colB = new THREE.Color(0x6d758a);
  for (var li = 0; li < LINK_COUNT; li++) {
    chain.setColorAt(li, li % 2 === 0 ? colA : colB);
  }
  if (chain.instanceColor) chain.instanceColor.needsUpdate = true;

  // ==================== 透明亚克力展示支架 ====================
  function acrylicBox(w, h, d, x, y, z) {
    var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), acrylic);
    m.position.set(x, y, z);
    scene.add(m);
    var e = new THREE.EdgesGeometry(m.geometry);
    var l = new THREE.LineSegments(e, new THREE.LineBasicMaterial({ color: 0x9fd8ee, transparent: true, opacity: 0.7 }));
    m.add(l);
    return m;
  }
  acrylicBox(4.6, 0.16, 2.4, 0, -1.62, -1.2);   // 底座
  acrylicBox(0.22, 1.7, 0.22, 0, -0.72, 0);      // 前支柱（牙盘）
  acrylicBox(0.18, 1.1, 0.18, 0, -1.12, BZ);     // 后支柱（飞轮）
  acrylicBox(0.7, 0.1, 0.5, 0.9, -1.45, 0.15);   // 电机底座

  // ==================== 电机 ====================
  var motorGroup = new THREE.Group();
  motorGroup.position.set(0.9, -1.30, 0.15);
  scene.add(motorGroup);
  var motorBody = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.34, 0.4), matMotor);
  motorGroup.add(motorBody);
  outline(motorBody, 0x1a1a2e);
  var motorShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.9, 12), matCrank);
  motorShaft.rotation.z = Math.PI / 2;
  motorShaft.position.set(-0.5, 0, 0);
  motorGroup.add(motorShaft);
  var motorLamp = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 10),
    new THREE.MeshBasicMaterial({ color: 0x3f6b3f }));
  motorLamp.position.set(0, 0.2, 0.2);
  motorGroup.add(motorLamp);

  // ==================== 工作台道具（简约） ====================
  var floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30),
    new THREE.MeshToonMaterial({ color: 0xe8e3d5, gradientMap: toonTex }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -1.7;
  scene.add(floor);

  // ==================== UI 交互 ====================
  var gearVal = document.getElementById('gearVal');
  var specCrank = document.getElementById('specCrank');
  var specCog = document.getElementById('specCog');
  var specRatio = document.getElementById('specRatio');
  var specRpm = document.getElementById('specRpm');
  var btnPower = document.getElementById('btnPower');

  function setGear(g) {
    state.targetGear = Math.max(1, Math.min(GEAR_COUNT, g));
    refreshHUD();
  }
  function refreshHUD() {
    var g = Math.round(state.gear);
    gearVal.textContent = g;
    specCrank.textContent = CRANK_TEETH;
    specCog.textContent = COG_TEETH[g - 1];
    specRatio.textContent = (CRANK_TEETH / COG_TEETH[g - 1]).toFixed(2);
    specRpm.textContent = state.motorOn ? Math.round(CRANK_OMEGA / (Math.PI * 2) * 60) : 0;
    // 高亮当前飞轮片
    for (var i = 0; i < cogMeshes.length; i++) {
      cogMeshes[i].mesh.material = (cogMeshes[i].g === g) ? matCogActive : matCog;
    }
  }

  btnPower.addEventListener('click', function () {
    state.motorOn = !state.motorOn;
    btnPower.textContent = state.motorOn ? '⏸ 停止电机' : '▶ 启动电机';
    btnPower.classList.toggle('on', state.motorOn);
    motorLamp.material.color.set(state.motorOn ? 0x3fe08a : 0x3f6b3f);
    refreshHUD();
  });
  document.getElementById('btnUp').addEventListener('click', function () { setGear(state.targetGear + 1); });
  document.getElementById('btnDown').addEventListener('click', function () { setGear(state.targetGear - 1); });
  document.getElementById('btnReset').addEventListener('click', function () {
    setGear(3);
    state.gear = 3;
    state.crankAngle = 0;
    state.arcPhase = 0;
    state.guideAngle = 0;
    refreshHUD();
  });
  document.getElementById('btnCamFront').addEventListener('click', function () {
    camera.position.set(0, -0.4, 4.6); controls.target.set(0, -0.55, -1.2); controls.update();
  });
  document.getElementById('btnCamSide').addEventListener('click', function () {
    camera.position.set(4.8, -0.2, -1.0); controls.target.set(0, -0.55, -1.2); controls.update();
  });
  document.getElementById('btnCamTop').addEventListener('click', function () {
    camera.position.set(0, 5.2, -1.0); controls.target.set(0, -0.6, -1.2); controls.update();
  });

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ==================== 动画循环 ====================
  var clock = new THREE.Clock();
  var curPath = computePath(cogR(3));

  function animate() {
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05);

    // 挡位平滑过渡
    state.gear += (state.targetGear - state.gear) * (1 - Math.exp(-dt * 7));
    if (Math.abs(state.targetGear - state.gear) < 0.001) state.gear = state.targetGear;

    var rb = cogR(state.gear);
    var chainX = cogX(state.gear);
    var u = derU(state.gear);

    // 电机驱动
    var omega = state.motorOn ? CRANK_OMEGA : 0;
    state.crankAngle += omega * dt;
    var chainSpeed = omega * RA;               // 链条线速度
    state.arcPhase += chainSpeed * dt;
    state.guideAngle += chainSpeed / 0.12 * dt;

    // 更新链路径（随 rb 平滑变化）
    curPath = computePath(rb);

    // 牙盘 + 曲柄旋转
    crankGroup.rotation.x = state.crankAngle;

    // 飞轮组旋转（齿比 = RA/rb）
    cogGroup.rotation.x = state.crankAngle * (RA / rb);

    // 链节摆放
    var L = curPath.total;
    for (var k = 0; k < LINK_COUNT; k++) {
      var s = (k / LINK_COUNT) * L + state.arcPhase;
      var res = pointAt(curPath, s);
      var py = res.p[0], pz = res.p[1];
      var ty = res.tan[0], tz = res.tan[1];
      var tl = Math.hypot(ty, tz) || 1;
      var ang = Math.atan2(tz / tl, ty / tl); // 绕 x 轴，使链节长轴(y)对齐切线
      var xw = Math.min(1, Math.max(0, pz / BZ)); // 0=牙盘端 x≈0，1=飞轮端 x=chainX
      dummy.position.set(chainX * xw, py, pz);
      dummy.rotation.set(ang, 0, 0);
      dummy.updateMatrix();
      chain.setMatrixAt(k, dummy.matrix);
    }
    chain.instanceMatrix.needsUpdate = true;

    // 后拨 cage + 导轮
    // 下切线上导轮位置（松边，靠飞轮侧）
    var tB2 = curPath.tB2, tA2 = curPath.tA2;
    var gy = tB2[0] + (tA2[0] - tB2[0]) * u;
    var gz = tB2[1] + (tA2[1] - tB2[1]) * u;
    // 导轮向下偏移（压在链条松边下方）
    var dty = tA2[0] - tB2[0], dtz = tA2[1] - tB2[1];
    var dl = Math.hypot(dty, dtz) || 1;
    var nty = -dtz / dl, ntz = dty / dl; // 下切线法向（向下）
    guideTop.position.set(chainX, gy + nty * 0.06, gz + ntz * 0.06);
    guideBot.position.set(chainX, gy + nty * 0.30, gz + ntz * 0.30);
    guideTop.rotation.x = state.guideAngle;
    guideBot.rotation.x = -state.guideAngle;

    // 导板（两片，夹住链条）
    cagePlateA.position.set(chainX - 0.06, gy + nty * 0.15, gz + ntz * 0.15);
    cagePlateB.position.set(chainX + 0.06, gy + nty * 0.15, gz + ntz * 0.15);
    cagePlateA.rotation.x = Math.atan2(dtz, dty);
    cagePlateB.rotation.x = Math.atan2(dtz, dty);

    // 后拨臂（从飞轮轴到 cage）
    derArm.position.set(chainX, (BY + gy) / 2, (BZ + gz) / 2);

    // 挡位 HUD + 飞轮片高亮（每帧跟随平滑挡位）
    var curGear = Math.round(state.gear);
    gearVal.textContent = curGear;
    specCog.textContent = COG_TEETH[curGear - 1];
    specRatio.textContent = (CRANK_TEETH / COG_TEETH[curGear - 1]).toFixed(2);
    specRpm.textContent = state.motorOn ? Math.round(CRANK_OMEGA / (Math.PI * 2) * 60) : 0;
    for (var ci = 0; ci < cogMeshes.length; ci++) {
      cogMeshes[ci].mesh.material = (cogMeshes[ci].g === curGear) ? matCogActive : matCog;
    }

    controls.update();
    renderer.render(scene, camera);
  }

  refreshHUD();
  animate();
})();
</script>
</body>
</html>
