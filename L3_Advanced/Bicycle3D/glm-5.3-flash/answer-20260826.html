const FinalFX={

  uRes:{value:new THREE.Vector2(innerWidth,innerHeight)},
  uPx:{value:1},uLv:{value:0}},
 vertexShader:`varying vec2 vUv;
  void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`uniform sampler2D tDiffuse;uniform vec2 uRes;uniform float uPx;uniform float uLv;
  varying vec2 vUv;
  void main(){
   vec2 uv=vUv;
   if(uPx>1.5){
    vec2 grid=uPx/uRes;
    uv=(floor(uv/grid)+.5)*grid;
   }
   vec4 c=texture2D(tDiffuse,uv);
   if(uLv>2.5){
    c.rgb=floor(c.rgb*uLv+.5)/uLv;
    float g=dot(c.rgb,vec3(.299,.587,.114));
    c.rgb=mix(c.rgb,vec3(g),-.06);

  }`

   c.textContent=labelFn(it[0]);
   c.classList.toggle('on',get()===it[0]);
   c.onclick=()=>{set(it[0]);build();};
   box.appendChild(c);
  });
 };
 build();
 wrap.append(lb,box);p.appendChild(wrap);
 REFRESH.push(build);
 return build;
}
/* 动态项列表：items 为函数（如 牙盘环位 随片数变化），返回重建器 */
function rowChipsDyn(p,label,itemsFn,get,set){
 const wrap=document.createElement('div');wrap.className='row';
 const lb=document.createElement('label');lb.textContent=label;
 const box=document.createElement('div');box.style.cssText='flex:1;display:flex;gap:5px;flex-wrap:wrap;';
 const build=()=>{
  box.innerHTML='';
  itemsFn().forEach(o=>{
   const c=document.createElement('button');c.type='button';c.className='chip';
   c.textContent=o.t;c.classList.toggle('on',get()===o.v);
   c.onclick=()=>{set(o.v);build();};
   box.appendChild(c);
  });
 };
 build();
 wrap.append(lb,box);p.appendChild(wrap);
 return build;
}
function rowToggle(p,label,key,onchg){
 const l=document.createElement('label');l.className='tgl';
 const i=document.createElement('input');i.type='checkbox';
 const read=()=>key==='spin'?P.spin:P.RS[key];
 const write=v=>{if(key==='spin')P.spin=v;else P.RS[key]=v;};
 TGLREG[key]=i;
 i.checked=read();
 i.onchange=()=>{write(i.checked);l.classList.toggle('on',i.checked);onchg&&onchg(i.checked);};
 l.append(i,document.createTextNode(label));
 p.appendChild(l);
 REFRESH.push(()=>{i.checked=read();l.classList.toggle('on',read());});
}
function rowSelect(p,label,opts,get,set){

/* ================= 交互 / 主循环 / 启动 ================= */
let TURN=false;
const ANIM={active:false,to:1};
const PHASE={crank:0};
function setTurn(on){
 TURN=on;$('btnTurn').classList.toggle('on',on);
}
function animateEx(to){
 ANIM.active=true;ANIM.to=to;
 if(!P.RS.labels){/* noop */}
}
function applySpinPhase(ph){
 for(const ck of [CKA.R,CKA.L]){
  const a=ck.g.userData.armAng;
  ck.g.rotation.z=a+ph;
  ck.g.userData.pedal.rotation.z=-(a+ph);
 }
}
function wireToolbar(){
 document.querySelectorAll('#camSeg button').forEach(b=>{
  b.onclick=()=>flyTo(b.dataset.cam);
 });
 $('btnTurn').onclick=()=>setTurn(!TURN);
 renderer.domElement.addEventListener('pointerdown',()=>setTurn(false));
 $('btnLabels').onclick=()=>{
  const i=TGLREG['labels'];
  if(i){i.checked=!i.checked;i.dispatchEvent(new Event('change'));}
 };
 $('btnViewReset').onclick=()=>{bikeRoot.rotation.y=0;setTurn(false);flyTo('iso');};
 $('btnShot').onclick=shot;
 $('panelHead').onclick=()=>$('panel').classList.toggle('hiddenP');
}
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 if(composer){
  composer.setSize(innerWidth,innerHeight);
  fxPass.uniforms.uRes.value.set(innerWidth,innerHeight);
 }
});
let last=performance.now();
let __QA_FRAMES=0;
let fpsAcc=0,fpsN=0,bootHidden=false;
function fpsTick(dt){
 fpsAcc+=dt;fpsN++;
 if(fpsAcc>=.5){
  $('fpsChip').textContent=fN(fpsN/fpsAcc,0)+' fps';
  fpsAcc=0;fpsN=0;
 }
}
function tick(now){
 requestAnimationFrame(tick);
 __QA_FRAMES++;
 const dt=Math.min(.05,(now-last)/1000);
 last=now;
 /* 相机预设插值 */
 if(CAMT.on){
  CAMT.t=Math.min(1,CAMT.t+dt/CAMT.dur);
  const e=easeIO(CAMT.t);
  camera.position.lerpVectors(CAMT.p0,CAMT.p1,e);
  controls.target.lerpVectors(CAMT.t0,CAMT.t1,e);
  if(CAMT.t>=1)CAMT.on=false;
 }
 /* 分解缓动（指数趋近目标，平滑可逆） */
 if(ANIM.active){
  const d=ANIM.to-P.exT;
  P.exT+=d*Math.min(1,dt*5.5);
  if(Math.abs(d)<.002){P.exT=ANIM.to;ANIM.active=false;}
 }
 explodeApply(P.exT);
 /* 转台 */
 if(TURN)bikeRoot.rotation.y+=dt*.42;
 /* 演示空转：曲柄相位驱动轮组（当前档位传动比） */
 applySpinPhase(P.spin?(PHASE.crank+=dt*2.3):0);
 if(P.spin){
  const gi=gearInfo();
  const wRatio=clamp(gi.cur/3.2,.35,1.9);
  WHF.spin.rotation.z-=dt*6.5;
  WHR.spin.rotation.z-=dt*6.5*wRatio;
  ROTORS.mf.rotation.z=WHF.spin.rotation.z;
  ROTORS.mr.rotation.z=WHR.spin.rotation.z;
 }
 controls.update();
 renderOnce();
 updLabels();
 fpsTick(dt);
 if(!bootHidden){
  bootHidden=true;
  setTimeout(()=>{const l=$('loading');l.style.opacity='0';
   setTimeout(()=>l.remove(),600);},350);
 }
}
/* ================= 启动序列 ================= */
buildCockpit();
buildUI();
initExplode();
applyAll();
paintAll();
buildLabels();
initPostFX();
wireToolbar();
syncPostFX();
refreshAllUI();
/* —— 自动化验证用只读钩子（不影响产品行为） —— */
window.__QA={
 frames:()=>__QA_FRAMES,
 stats(){let n=0,m=0;(function w(o){n++;if(o.isMesh)m++;o.children.forEach(w);})(bikeRoot);
        return{nodes:n,meshes:m};},
 pos(name){const t=(name==='WF')?WF:(name==='WR')?WR:null;return t?t.position.toArray():null;},
 wheelLocal(name){const o={CAS,RTR_F,RTR_R,WHL_F:WHF.root,WHL_R:WHR.root}[name];
        if(!o)return null;const b=o.userData.__base;return b?+o.position.z.toFixed(4):null;},
 camera:()=>camera.position.toArray(),
 target:()=>controls.target.toArray(),
 errs:()=>window.__errs.length,
 gearText:()=>$('gearTxt').textContent,
 weight:()=>$('wKG').textContent,
 specsRow:()=>$('specGeo').children.length,
 ctx:()=>renderer.getContext()?('ctx'):null
};
requestAnimationFrame(tick);
