<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link rel="icon" href="data:,">
<title>BikeForge 3D · 自行车工作室与装配模拟器</title>
<style>
:root{
  --bg:#0f1218; --glass:rgba(17,21,28,.82); --line:rgba(255,255,255,.09);
  --tx:#e8ecf2; --dim:#9aa4b2; --acc:#ff7a3c; --acc2:#ffd166;
  --good:#7ee081; --mono:'JetBrains Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#dfe4ea;color:var(--tx);
  font:13px/1.45 'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0}
canvas{display:block;outline:none}

/* ── 左上品牌条 ── */
#brand{position:fixed;left:16px;top:14px;z-index:20;user-select:none;pointer-events:none}
#brand .logo{display:flex;align-items:center;gap:9px}
#brand .dot{width:12px;height:12px;border-radius:3px;background:var(--acc);
  box-shadow:0 0 0 3px rgba(255,122,60,.22);transform:rotate(45deg)}
#brand b{font-size:16px;letter-spacing:.5px}
#brand span{color:var(--dim);font-size:11px;margin-left:2px}
#brand .tag{margin-top:5px;font-size:10.5px;color:var(--dim)}
#hint{position:fixed;left:16px;bottom:14px;z-index:20;font-size:11px;color:#5c6672;
  background:rgba(240,244,248,.66);padding:5px 10px;border-radius:8px;backdrop-filter:blur(4px);user-select:none}

/* ── 工具条 ── */
#tools{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:6px;
  background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:6px;
  backdrop-filter:blur(10px);box-shadow:0 6px 22px rgba(10,14,20,.28);flex-wrap:wrap;justify-content:center;max-width:min(94vw,760px)}
#tools button{border:1px solid transparent;background:rgba(255,255,255,.055);color:var(--tx);
  padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px;white-space:nowrap;transition:.15s}
#tools button:hover{background:rgba(255,255,255,.13)}
#tools button.on{background:var(--acc);color:#181006;font-weight:600}
#tools .sep{width:1px;background:var(--line);margin:2px 3px}

/* ── 右侧面板 ── */
#panel{position:fixed;top:12px;right:12px;bottom:12px;width:308px;z-index:30;display:flex;flex-direction:column;
  background:var(--glass);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  backdrop-filter:blur(12px);box-shadow:0 10px 34px rgba(10,14,20,.35);transition:transform .3s cubic-bezier(.6,0,.3,1),opacity .3s}
#panel.hide{transform:translateX(calc(100% + 22px));opacity:.2;pointer-events:none}
#panelHead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
#panelHead b{font-size:13.5px;letter-spacing:.4px}
#panelHead .mini{display:flex;gap:4px}
#panelHead .mini button{background:none;border:none;color:var(--dim);cursor:pointer;font-size:13px;padding:3px 6px;border-radius:6px}
#panelHead .mini button:hover{background:rgba(255,255,255,.1);color:#fff}
#body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 0 14px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
#body::-webkit-scrollbar{width:8px}
#body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px;border:2px solid transparent;background-clip:content-box}

details.sec{border-bottom:1px solid rgba(255,255,255,.055)}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:11px 14px;
  font-weight:600;font-size:12.5px;letter-spacing:.4px;color:#fff;user-select:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .ico{font-size:14px;width:18px;text-align:center;opacity:.9}
details.sec>summary .chev{margin-left:auto;color:var(--dim);transition:transform .2s;font-size:10px}
details.sec[open]>summary .chev{transform:rotate(180deg)}
details.sec>.secBody{padding:2px 14px 14px}

.row{display:grid;grid-template-columns:96px 1fr 52px;align-items:center;gap:8px;margin:7px 0}
.row label{color:var(--dim);font-size:11.5px;line-height:1.25}
.row .val{font-family:var(--mono);font-size:11px;color:var(--acc2);text-align:right;white-space:nowrap}
.row input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--acc) var(--fill,50%),rgba(255,255,255,.13) var(--fill,50%));cursor:pointer}
.row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:#fff;border:3px solid var(--acc);box-shadow:0 1px 5px rgba(0,0,0,.4);transition:transform .12s}
.row input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.18)}
.row.full{grid-template-columns:1fr auto;margin:8px 0 4px}

.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 2px}
.chips button{flex:0 0 auto;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--tx);
  font-size:11px;padding:5px 9px;border-radius:7px;cursor:pointer;transition:.15s}
.chips button:hover{background:rgba(255,255,255,.14)}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#1c1206;font-weight:600}
.chips.wide button{flex:1 1 auto;text-align:center}

.swatches{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:6px 8px;margin:4px 0}
.swatches .zl{font-size:11.5px;color:var(--dim)}
.swatches .sw{display:flex;gap:4px;flex-wrap:wrap}
.swatches input[type=color]{-webkit-appearance:none;width:22px;height:22px;border:none;border-radius:6px;background:none;cursor:pointer;padding:0}
.swatches input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.swatches input[type=color]::-webkit-color-swatch{border-radius:6px;border:2px solid rgba(255,255,255,.25)}
.swatches .chip{width:22px;height:22px;border-radius:6px;border:2px solid rgba(255,255,255,.2);cursor:pointer;transition:.12s}
.swatches .chip:hover{transform:scale(1.14)}

select.sel{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--tx);
  border-radius:8px;padding:6px 8px;font-size:12px;outline:none;cursor:pointer;margin:5px 0}
select.sel:focus{border-color:var(--acc)}

.btnRow{display:flex;gap:6px;margin-top:8px}
.btnRow button{flex:1;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--tx);
  padding:7px 4px;border-radius:8px;cursor:pointer;font-size:11.5px;transition:.15s}
.btnRow button:hover{background:rgba(255,255,255,.15)}
.btnRow button.act{background:var(--acc);border-color:var(--acc);color:#1c1206;font-weight:600}

/* 规格表 */
.kv{display:grid;grid-template-columns:88px 1fr;row-gap:3px;column-gap:8px;font-size:11.5px;margin:4px 0}
.kv .k{color:var(--dim)}
.kv .v{font-family:var(--mono);color:#fff;text-align:right}
.gearBox{margin:8px 0;padding:9px 11px;border-radius:10px;background:linear-gradient(135deg,rgba(255,122,60,.16),rgba(255,209,102,.09));
  border:1px solid rgba(255,168,90,.28);text-align:center}
.gearBox .big{font-size:21px;font-weight:700;font-family:var(--mono);letter-spacing:1px;color:#ffb877}
.gearBox .sub{font-size:10.5px;color:var(--dim);margin-top:2px}
.wBox{margin:8px 0 2px;padding:8px 11px;border-radius:10px;background:rgba(126,224,129,.09);border:1px solid rgba(126,224,129,.24)}
.wBox .tot{display:flex;justify-content:space-between;align-items:baseline}
.wBox .tot b{font-family:var(--mono);font-size:17px;color:var(--good)}
.wBox .tot span{font-size:11px;color:var(--dim)}
.wBox .sub{font-size:10px;color:var(--dim);font-family:var(--mono);margin-top:3px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 10px}

.note{font-size:10.5px;color:var(--dim);margin:6px 0 0;line-height:1.5}
.divider{height:1px;background:var(--line);margin:9px 0}
.badge{display:inline-block;font-size:9.5px;padding:1px 6px;border-radius:99px;background:rgba(255,255,255,.1);color:var(--dim);vertical-align:1px}

@media (max-width:720px){
  #panel{width:min(92vw,308px)}
  #brand .tag,#hint{display:none}
}
</style>

<body>
<div id="app"></div>

<div id="brand">
  <div class="logo"><div class="dot"></div><b>BikeForge&nbsp;3D</b><span>studio</span></div>
  <div class="tag">参数化车架 · 传动配置 · 装配分解模拟</div>
</div>

<div id="tools">
  <button data-cam="hero" class="on" title="四分之三视角">⬗ 全景</button>
  <button data-cam="side" title="正侧视图">▤ 侧视</button>
  <button data-cam="front" title="正面视角">⊛ 正面</button>
  <button data-cam="cockpit" title="把持系统特写">✛ 座舱</button>
  <button data-cam="drive" title="传动特写">⚙ 传动</button>
  <button data-cam="top" title="俯视图">⊙ 顶视</button>
  <div class="sep"></div>
  <button id="btnLabels" title="切换组件标签">🏷 标签</button>
  <button id="btnReset" title="恢复全部默认参数">⟲ 重置参数</button>
  <button id="btnPanel" title="收起/展开控制面板">▸ 面板</button>
</div>

<div id="hint">左键拖拽旋转 · 滚轮缩放 · 右键平移</div>

<aside id="panel">
  <div id="panelHead">
    <b>工作台控制台</b>
    <div class="mini">
      <button id="btnExpand" title="展开全部分组">⇕</button>
      <button id="btnCollapse" title="折叠全部分组">≡</button>
    </div>
  </div>
  <div id="body"></div>
</aside>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RenderPixelatedPass } from 'three/addons/postprocessing/RenderPixelatedPass.js';

/* ══════════════════════════ 工具 ══════════════════════════ */
const V3 = (x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const D2R = THREE.MathUtils.degToRad;
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const easeIO = t=>t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/** 生成两端半径不同的圆柱管道 mesh，位于 p0→p1 */
function tubeBetween(p0,p1,r0,r1,mat,seg=14){
  const len = p0.distanceTo(p1);
  const g = new THREE.CylinderGeometry(r1,r0,len,seg,1,false);
  const m = new THREE.Mesh(g,mat);
  orientBetween(m,p0,p1);
  return m;
}
function orientBetween(o,p0,p1){
  const d = p1.clone().sub(p0);
  o.position.copy(p0).add(p1).multiplyScalar(.5);
  o.quaternion.setFromUnitVectors(V3(0,1,0), d.normalize());
  return o;
}
/** 极坐标齿轮环形轮廓（波浪齿）→ 用于牙盘/飞轮/塔基造型 */
function gearShape(rOuter,rInner,teeth,thick=.22){
  const shape=new THREE.Shape(); const n=Math.max(teeth*2,10);
  for(let i=0;i<=n;i++){
    const a=i/n*Math.PI*2, wob=(i%2===0?thick:-thick*0.7);
    const r=lerp(rInner,rOuter,(i%2===0?1:0))+wob*rOuter*0.0;
    const rr=i%2===0? rOuter : rInner-wob*rOuter*.12;
    const x=Math.cos(a)*rr,y=Math.sin(a)*rr;
    i===0?shape.moveTo(x,y):shape.lineTo(x,y);
  }
  shape.closePath();
  const hole=new THREE.Path(); hole.absarc(0,0,rInner*.34,0,Math.PI*2,true); shape.holes.push(hole);
  if(rInner>rOuter*.5){
    for(let b=0;b<5;b++){const ba=b/5*Math.PI*2+.4;
      const hb=new THREE.Path(); hb.absarc(Math.cos(ba)*rInner*.62,Math.sin(ba)*rInner*.62,rInner*.13,0,Math.PI*2,true);
      shape.holes.push(hb);}
  }
  return shape;
}
function extrudeFlat(shape,depth){
  return new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:false,curveSegments:24});
}
/* ══════════════════════════ 参数状态 ══════════════════════════ */
const DEFAULTS = {
  stack:.585, reach:.400, headAngle:73, seatTubeLen:.470, seatAngle:73.5, chainstay:.425,
  compact:.45, droppedStay:0,
  ringSet:1, speed:12, rotorSize:160,
  saddleH:.185, saddleFB:-.008, barW:.42, rise:18, flare:6, stemLen:100,
  explode:0, cycle:false, ride:false,
  cFrame:'#e8502e', cAccent:'#16294a', cFork:'#20262e', cRim:'#22262c', cDrive:'#ccd3dd',
  cCockpit:'#1d2129', cSaddle:'#171a1f', cTire:'#23262b', finish:'gloss',
  outline:true, pixel:false, pixSize:7, posterize:true, pLevels:8
};
let P = JSON.parse(JSON.stringify(DEFAULTS));
let LABELS_ON = true;

/* ══════════════════════════ 材质工厂（赛璐璐 NPR） ══════════════════════════ */
const PERSIST_TEX = new Set();
function gradSteps(n){
  const tones = {3:[74,158,238], 4:[92,146,192,236], 5:[100,140,176,208,240]}[n];
  const data = new Uint8Array(n*4);
  tones.forEach((t,i)=>{data[i*4]=t;data[i*4+1]=t;data[i*4+2]=Math.min(255,t+6);data[i*4+3]=255});
  const tex = new THREE.DataTexture(data,n,1,THREE.RGBAFormat);
  tex.minFilter=tex.magFilter=THREE.NearestFilter; tex.needsUpdate=true;
  PERSIST_TEX.add(tex); return tex;
}
let _grads=null;
function grads(){ if(!_grads)_grads={3:gradSteps(3),4:gradSteps(4),5:gradSteps(5)}; return _grads; }

let _weave=null;
function weaveTex(){
  if(_weave)return _weave;
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  g.fillStyle='#b9bec6';g.fillRect(0,0,256,256);
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    const k=(x+y)%2===0; g.fillStyle=k?'#565c66':'#8e959f';
    g.beginPath();
    for(let j=0;j<4;j++){const yy=y*16+j*4; g.fillRect(x*16+k?j*4:0,yy+(k?0:j*0),k?16:4,k?4:16);}
  }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2.2,2.2);
  t.colorSpace=THREE.SRGBColorSpace; PERSIST_TEX.add(t);_weave=t;return t;
}

const ZONE_SETS={};
const MAT_CACHE=new Map();
function zmat(zone,kind,color){
  const key=zone+'|'+kind+'|'+color+'|'+P.finish;
  if(MAT_CACHE.has(key))return MAT_CACHE.get(key);
  const c=new THREE.Color(color); let m;
  const carbon=['frame','fork','seatunit','cockpit'].includes(zone)&&P.finish==='carbon';
  if(kind==='body'){
    if(P.finish==='metallic'){
      m=new THREE.MeshStandardMaterial({color:c,metalness:.8,roughness:.34,envMapIntensity:.8});
      if(carbon)m.map=weaveTex();
    }else{
      m=new THREE.MeshToonMaterial({color:c,gradientMap:grads()[P.finish==='matte'?4:3]});
      if(carbon)m.map=weaveTex();
    }
  }else if(kind==='metal'){
    m=new THREE.MeshStandardMaterial({color:c,metalness:.92,roughness:P.finish==='matte'?.5:.26,envMapIntensity:.72});
  }else if(kind==='chrome'){
    m=new THREE.MeshStandardMaterial({color:c,metalness:1,roughness:.14,envMapIntensity:.95});
  }else if(kind==='dark'){
    m=new THREE.MeshStandardMaterial({color:new THREE.Color('#262a30'),metalness:.6,roughness:.5,envMapIntensity:.4});
  }else if(kind==='rubber'){
    m=new THREE.MeshStandardMaterial({color:c,metalness:0,roughness:.95,envMapIntensity:.12});
  }else if(kind==='soft'){
    m=new THREE.MeshToonMaterial({color:c,gradientMap:grads()[3]});
  }else{
    m=new THREE.MeshStandardMaterial({color:c,metalness:.2,roughness:.7,envMapIntensity:.3});
  }
  m.userData.zone=zone; MAT_CACHE.set(key,m);
  (ZONE_SETS[zone]=ZONE_SETS[zone]||new Set()).add(m);
  return m;
}
function repaintZone(zone,color){
  (ZONE_SETS[zone]||new Set()).forEach(m=>{
    if(!m.userData.locked){ m.color.set(color); }
  });
}

/* ── 轮廓墨线（反壳体）── */
const OUT_VERT=`uniform float uT;void main(){
  vec3 n=normalize(normalMatrix*normal);
  vec4 mv=modelViewMatrix*vec4(position,1.0);
  mv.xyz+=n*uT; gl_Position=projectionMatrix*mv;}`;
const OUT_FRAG=`uniform vec3 uColor;void main(){gl_FragColor=vec4(uColor,1.0);}`;
function mkOutlineMat(t){
  return new THREE.ShaderMaterial({
    uniforms:{uT:{value:t},uColor:{value:new THREE.Color('#181c24')}},
    vertexShader:OUT_VERT,fragmentShader:OUT_FRAG,side:THREE.BackSide});
}
let _outBucket=null;
function outlineMat(){
  if(!_outBucket){_outBucket={
    s:mkOutlineMat(.0026), m:mkOutlineMat(.005), l:mkOutlineMat(.009)};}
  return _outBucket;
}
function refreshOutlineWidths(){ if(_outBucket){_outBucket.s.uniforms.uT.value=.0026;
  _outBucket.m.uniforms.uT.value=.005; _outBucket.l.uniforms.uT.value=.009;} }
function outlineFor(mesh,bucket='m'){
  if(!P.outline)return;
  const mats=outlineMat(); const o=new THREE.Mesh(mesh.geometry,mats[bucket]||mats.m);
  o.userData._outlineChild=true; o.userData.noShadow=true; o.castShadow=false;
  mesh.add(o);
}

/* ══════════════════════════ 渲染基础 ══════════════════════════ */
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color('#e2e8ef');
scene.fog=new THREE.Fog('#dfe5ec',7.5,24);

const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.01,80);
camera.position.set(2.15,1.18,2.65);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=.08;
controls.minDistance=.5; controls.maxDistance=9; controls.maxPolarAngle=Math.PI*.53;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;

/* 灯光 —— 明亮可读基线 */
const hemi=new THREE.HemisphereLight('#ffffff','#aeb8c4',.85); scene.add(hemi);
const sun=new THREE.DirectionalLight('#fff4e2',2.3);
sun.position.set(3.4,5.4,2.2); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-3;sun.shadow.camera.right=3;sun.shadow.camera.top=3;sun.shadow.camera.bottom=-3;
sun.shadow.camera.near=.5;sun.shadow.camera.far=14;
sun.shadow.bias=-.0004; sun.shadow.normalBias=.02;
scene.add(sun);
const fill=new THREE.DirectionalLight('#dfe8ff',.55); fill.position.set(-2.6,2.4,-2.2); scene.add(fill);

/* 分解注册表 */
const EXPLODE=[];
function reg(obj,axis,dist){ obj.userData.basePos=obj.position.clone(); EXPLODE.push({obj,axis:axis.clone().normalize(),dist}); }

/* ══════════════════════════ 几何求解 ══════════════════════════ */
function solveGeo(p){
  const bbDrop=.070, R=.355, axleY=R;
  const BB=V3(-.14,R-bbDrop,0);
  const ha=D2R(p.headAngle);
  const vDown=V3(Math.cos(ha),-Math.sin(ha),0).normalize();
  const uUp=vDown.clone().negate();
  const nPerp=V3(Math.sin(ha),Math.cos(ha),0);
  const HTtop=BB.clone().add(V3(p.reach,p.stack,0));
  const htLen=lerp(.118,.188,p.compact);
  const HTbot=HTtop.clone().addScaledVector(vDown,htLen);
  const rake=.045;
  const kSeg=(axleY-(HTbot.y+rake*nPerp.y))/vDown.y;
  const FAxle=HTbot.clone().addScaledVector(vDown,kSeg).addScaledVector(nPerp,rake);
  const sa=D2R(p.seatAngle);
  const stDir=V3(-Math.cos(sa),Math.sin(sa),0).normalize();
  const STtop=BB.clone().addScaledVector(stDir,p.seatTubeLen);
  const ttY=lerp(HTtop.y,STtop.y,lerp(.62,.24,p.compact));
  const sTT=(ttY-BB.y)/stDir.y;
  const TTseat=BB.clone().addScaledVector(stDir,sTT);
  const TThead=HTtop.clone().addScaledVector(vDown,.02);
  const dy=axleY-BB.y, cs=p.chainstay;
  const rax=-Math.sqrt(Math.max(cs*cs-dy*dy,1e-6));
  const RAxle=V3(BB.x+rax,axleY,0);
  const dropFac=p.droppedStay>0.5?1:0;
  const sLow=Math.max(lerp(sTT,.16,dropFac===1?.78:0),.12);
  const STlow=BB.clone().addScaledVector(stDir,sLow);
  return {BB,R,axleY,vDown,uUp,nPerp,HTtop,HTbot,htLen,FAxle,stDir,STtop,sTT,TTseat,TThead,
          RAxle,STlow,wheelbase:FAxle.x-RAxle.x,dropped:dropFac===1};
}

/* 齿数生成 */
function cogList(sp){
  let mn,mx;
  if(sp===12){mn=10;mx=52}else if(sp===11){mn=11;mx=50}else if(sp===10){mn=11;mx=36}
  else if(sp===9){mn=11;mx=34}else if(sp===8){mn=12;mx=32}else{mn=12;mx=28}
  if(P.ringSet>1) mx=Math.min(mx,P.ringSet===2?34:30);
  const arr=[];
  for(let i=0;i<sp;i++){const t=mn*Math.pow(mx/mn,i/(sp-1));arr.push(Math.round(t));}
  arr[arr.length-1]=mx; 
  for(let i=arr.length-1;i>0;i--) if(arr[i]<=arr[i-1]) arr[i-1]=arr[i]-2;
  while(arr[0]<mn-2){/*noop*/}
  return arr.filter(x=>x>=9);
}
function chainRingSet(){
  if(P.ringSet===1)return[{t:P.speed>=11?44:46}];
  if(P.ringSet===2)return[{t:52},{t:36}];
  return[{t:50},{t:39},{t:30}];
}

  [-1,1].forEach(s=>{

    cl.add(tp2);

function makeGear(rOut,teeth,thickDepth,gapRatio=.72){
  const g=extrudeFlat(gearShape(rOut,rOut-gapRatio*(teeth*0.002+0.006),teeth),thickDepth);
  g.translate(0,0,-thickDepth/2); return g;
}
function makeRotor(rOut){
  const shape=new THREE.Shape();
  const lobes=36, amp=rOut*.02;
  for(let i=0;i<=lobes;i++){
    const a=i/lobes*Math.PI*2;
    const rr=rOut+(i%2===0?amp:-amp)+(i%6===0?-rOut*.012:0);
    const x=Math.cos(a)*rr,y=Math.sin(a)*rr;
    i===0?shape.moveTo(x,y):shape.lineTo(x,y);
  } shape.closePath();
  for(let ring=0;ring<2;ring++){
    const cnt=ring===0?12:9, rad=rOut*(ring===0?.60:.38), hr=ring===0?rOut*.028:rOut*.020;
    for(let k=0;k<cnt;k++){
      const b=k/cnt*Math.PI*2+ring*.3;
      const h=new THREE.Path(); h.absarc(Math.cos(b)*rad,Math.sin(b)*rad,hr,0,Math.PI*2,true);
      shape.holes.push(h);
    }
  }
  const hub=new THREE.Path(); hub.absarc(0,0,rOut*.14,0,Math.PI*2,true); shape.holes.push(hub);
  const geo=extrudeFlat(shape,.0016); geo.translate(0,0,-.0008);
  return geo;
}

  const crank=new THREE.Group(); crank.position.copy(G.BB);
  const armLen=.1725;
  [-1,1].forEach(s=>{
    const arm=new THREE.Group();
    arm.userData.isArm=true;
    const ang=s>0?D2R(-32):D2R(148);
    arm.rotation.z=ang;
    const shaft=new THREE.Mesh(new THREE.BoxGeometry(armLen,.024,.013),zmat('drive','metal',shadeMix(P.cDrive,'#20242a',.55)));
    shaft.position.set(armLen/2+.012,0,0); shaft.castShadow=true; arm.add(shaft); outlineFor(shaft,'m');
    const knuckle=new THREE.Mesh(new THREE.CylinderGeometry(.017,.017,.02,12),mDark);
    knuckle.geometry.rotateX(Math.PI/2); knuckle.position.set(.012,0,s*.012); arm.add(knuckle);
    // 脚踏（父臂旋转时反向补偿保持水平）
    const pedG=new THREE.Group(); pedG.userData.isPedal=true; pedG.position.set(armLen+.012,0,0);
    const axl=new THREE.Mesh(new THREE.CylinderGeometry(.005,.005,.055,10),mSteel);
    axl.geometry.rotateX(Math.PI/2); axl.position.z=s*.018; pedG.add(axl);
    const body=new THREE.Mesh(new THREE.BoxGeometry(.098,.014,.070),zmat('drive','body',shadeMix(P.cCockpit,'#0d0f12',.35)));
    body.position.set(0,-.006,s*.030); pedG.add(body); outlineFor(body,'s');
    for(let px=0;px<3;px++)[-1,1].forEach(py=>{
      const pin=new THREE.Mesh(new THREE.CylinderGeometry(.0016,.0016,.004,6),mSteel);
      pin.geometry.rotateX(Math.PI/2); pin.position.set(-.035+px*.035,-.012,s*(.030+py*.024)); pedG.add(pin);
    });
    arm.add(pedG);
    crank.add(arm);
  });
  // 右侧 spiders + 牙盘
  const rings=chainRingSet();
  const spider=new THREE.Mesh(new THREE.CylinderGeometry(.045,.05,.007,20),mDark);
  spider.geometry.rotateX(Math.PI/2); spider.position.set(0,0,DZ-.006); crank.add(spider);
  for(let b=0;b<5;b++){const ba=b/5*Math.PI*2+.63;
    const bolt=new THREE.Mesh(new THREE.CylinderGeometry(.006,.006,.004,10),mSteel);
    bolt.geometry.rotateX(Math.PI/2); bolt.position.set(Math.cos(ba)*.024,Math.sin(ba)*.024,DZ+.001); crank.add(bolt);}
  rings.forEach((ring,idx)=>{
    const rr=ring.t*.00202, rOut=rr+.006;
    const zm=DZ+(rings.length-idx)*.008-(rings.length>1?.012:0)+ (rings.length===1?.010:0);
    const gear=new THREE.Mesh(makeGear(rOut,Math.round(ring.t*.7),.0032,.68),zmat('drive','metal',idx===0&&rings.length===3?'#8f97a3':P.cDrive));
    gear.position.set(0,0,zm+(rings.length===1?.004:0)); gear.castShadow=true;
    crank.add(gear); outlineFor(gear,'m');
    if(idx===0)res.bigRing={r:rOut,z:zm};
  });
  crank.traverse(o=>{if(o.isMesh)o.castShadow=true});
  res.groups.crank=crank;
  // ── 中轴碗（左右分离件）
  const bbCups=[];
  [-1,1].forEach(s=>{
    const cup=new THREE.Mesh(new THREE.CylinderGeometry(.0205,.018,.014,14),mSteel);
    cup.geometry.rotateX(Math.PI/2);
    cup.position.copy(G.BB).add(V3(-.006,0,s*.048)); res.groups['bb'+(s>0?'R':'L')]=cup;
  });
  // ── 前拨（≥2 盘可见；绝对坐标摆放）
  if(P.ringSet>=2){
    const fd=new THREE.Group();
    const s_fd=res.bigRing.r*.94/G.stDir.y;
    const axisPt=G.BB.clone().addScaledVector(G.stDir,s_fd);
    const fwd=V3(Math.sin(D2R(P.seatAngle)),Math.cos(D2R(P.seatAngle)),0);
    // 夹环：套在座管上（z=0 平面；半径须大于座管外壁）
    const band=new THREE.Mesh(new THREE.TorusGeometry(.0355,.005,10,20),mDark);
    band.position.copy(axisPt);
    band.quaternion.setFromUnitVectors(V3(0,0,1),G.stDir);
    fd.add(band);
    const strap=new THREE.Mesh(new THREE.CylinderGeometry(.007,.007,.010,10),mSteel);
    strap.position.copy(axisPt).add(V3(-.024,-.002,0)); strap.rotation.z=.6; fd.add(strap);
    // 导板：悬在牙盘前上方切线位
    const cagePos=G.BB.clone().addScaledVector(fwd,res.bigRing.r+.012).add(V3(-.02,.05,0));
    cagePos.z=DZ+.028;
    const cage=new THREE.Mesh(new THREE.BoxGeometry(.058,.038,.009),zmat('drive','metal',shadeMix(P.cDrive,'#39404a',.4)));
    cage.position.copy(cagePos); cage.rotation.z=D2R(-52); fd.add(cage); outlineFor(cage,'s');
    const plateLink=new THREE.Mesh(new THREE.BoxGeometry(.014,cagePos.distanceTo(band.position)*.96,.007),mDark);
    orientBetween(plateLink,band.position.clone().add(V3(0,0,DZ+.018)),cagePos.clone().add(V3(-.004,-.004,0)));
    fd.add(plateLink); outlineFor(plateLink,'s');
    fd.updateMatrixWorld(true);
    ANCH.fdC=cagePos.clone();
    res.groups.fd=fd; res.fdReady=true;
  } else res.fdReady=false;
  // ── 后拨（挂在尾勾；拉距随最大飞轮半径自适应）
  const cogs=cogList(P.speed);
  const rMax=cogs[cogs.length-1]*.00202+.005, rMin=cogs[0]*.00202+.005;
  const rd=new THREE.Group();
  rd.position.copy(G.RAxle).add(V3(-.02,-.012,.054));
  const bknuckle=new THREE.Mesh(new THREE.BoxGeometry(.036,.026,.016),zmat('drive','metal',shadeMix(P.cDrive,'#39404a',.4)));
  rd.add(bknuckle); outlineFor(bknuckle,'s');
  const cageL=(rMax-rMin)*.7+.052;
  const plT=new THREE.Group(); plT.position.set(-.012,-.018,-.010);
  const pTm=new THREE.Mesh(makeGear(.019,11,.005,.5),mDark); plT.add(pTm); outlineFor(pTm,'s'); rd.add(plT);
  const bot=pos=>{const pg=new THREE.Group();pg.position.copy(pos);
    const pm=new THREE.Mesh(makeGear(.023,11,.005,.5),mDark); pg.add(pm); outlineFor(pm,'s'); return pg;};
  const dropY=-(cageL+.012);
  const plB=bot(V3(-.024,cageL,-.010)); rd.add(plB);
  const plate=new THREE.Mesh(new THREE.BoxGeometry(.016,cageL+.02,.006),zmat('drive','metal',shadeMix(P.cDrive,'#39404a',.4)));
  plate.position.set(-.018,cageL/2,-.006); plate.rotation.z=-.12; rd.add(plate); outlineFor(plate,'s');
  const springy=new THREE.Mesh(new THREE.CylinderGeometry(.005,.005,.03,8),mSteel);
  springy.geometry.rotateX(Math.PI/2); springy.position.set(.014,.004,.004); springy.rotation.z=.9; rd.add(springy);
  ANCH.rdC=rd.localToWorld?(()=>{rd.updateMatrixWorld(true);return rd.getWorldPosition(V3())})():null;
  res.groups.rd=rd;
  res.chain={ring:res.bigRing.r,DZ,
    cog:{r:cogs[Math.floor(cogs.length*.45)]*.00202+.005},
    rMax,rMin,cogCount:cogs.length};
  return res;
}

/* ── 轮组（实例化辐条）── */
function buildWheel(G,{rear=false,zSign}={}){
  const grp=new THREE.Group(); grp.position.set(rear?G.RAxle.x:G.FAxle.x,G.axleY,0);
  const rot=new THREE.Group(); grp.add(rot);
  const Rc=.3418, tireT=.0132, bead=Rc-tireT;
  const ds=rear? 1: -1; // 内部组件朝向的驱侧标记
  const mRim=zmat('rim','body',P.cRim), mTire=zmat('tire','rubber',P.cTire),
        mHub=zmat('hub','dark','#262a30'), mMetal=zmat('drive','metal',P.cDrive),
        mSpoke=zmat('spoke','chrome','#c9ced6'), mSteel=zmat('steel','chrome','#d4dae1');
  // 圈（环形挤出 + 气嘴孔）
  const rimShape=new THREE.Shape(); rimShape.absarc(0,0,bead+.005,0,Math.PI*2,false);
  const rimHole=new THREE.Path(); rimHole.absarc(0,0,Rc-tireT-.008,0,Math.PI*2,true); rimShape.holes.push(rimHole);
  const vAng=rear?2.9:.8;
  const vh=new THREE.Path(); vh.absarc(Math.cos(vAng)*(bead-.001),Math.sin(vAng)*(bead-.001),.0042,0,Math.PI*2,true);
  rimShape.holes.push(vh);
  const rimGeo=extrudeFlat(rimShape,.020); rimGeo.translate(0,0,-.010);
  const rim=new THREE.Mesh(rimGeo,mRim); rim.castShadow=true; rot.add(rim); outlineFor(rim,'m');
  const liner=new THREE.Mesh(new THREE.CylinderGeometry(Rc-.004,Rc-.004,.014,48,1,true),zmat('inner','dark','#17191d'));
  liner.geometry.rotateX(Math.PI/2); rot.add(liner);
  // 外胎
  const tire=new THREE.Mesh(new THREE.TorusGeometry(Rc,tireT,16,72),mTire); tire.castShadow=true;
  rot.add(tire); outlineFor(tire,'l');
  // 气嘴
  const valve=new THREE.Group();
  const vv=new THREE.Mesh(new THREE.CylinderGeometry(.0022,.0022,.03,8),zmat('metal','metal','#8b929c'));
  vv.position.set(Math.cos(vAng)*(bead-.014),Math.sin(vAng)*(bead-.014),0);
  valve.add(vv);
  const vnut=new THREE.Mesh(new THREE.CylinderGeometry(.004,.004,.004,8),zmat('accent','body',P.cAccent));
  vnut.geometry.rotateX(Math.PI/2); vnut.position.copy(vv.position).multiplyScalar(1.06); valve.add(vnut);
  const vcap=new THREE.Mesh(new THREE.CylinderGeometry(.0034,.0034,.006,8),zmat('accent','body',P.cAccent));
  vcap.geometry.rotateX(Math.PI/2); vcap.position.copy(vv.position).multiplyScalar(.90); valve.add(vcap);
  rot.add(valve);
  // 花鼓
  const shell=new THREE.Mesh(new THREE.CylinderGeometry(.019,.019,.060,18),mHub);
  shell.geometry.rotateX(Math.PI/2); rot.add(shell); outlineFor(shell,'s');
  [-1,1].forEach(s=>{
    const fl=new THREE.Mesh(new THREE.CylinderGeometry(.031,.031,.005,18),mHub);
    fl.geometry.rotateX(Math.PI/2); fl.position.z=s*.025; rot.add(fl);});
  const axle=new THREE.Mesh(new THREE.CylinderGeometry(.005,.005,.135,10),mSteel);
  axle.geometry.rotateX(Math.PI/2); rot.add(axle);
  [-1,1].forEach(s=>{
    const cap=new THREE.Mesh(new THREE.CylinderGeometry(.0115,.0115,.008,12),mHub);
    cap.geometry.rotateX(Math.PI/2); cap.position.z=s*.036; rot.add(cap);});
  if(rear){
    const fhb=new THREE.Mesh(new THREE.CylinderGeometry(.024,.017,.042,16),mMetal);
    fhb.geometry.rotateX(Math.PI/2); fhb.position.z=.052; rot.add(fhb); outlineFor(fhb,'s');
  }
  // 辐条（交叉编法，每侧 N/2 根，两侧共 N 根）
  const N=32;
  const spokeIM=new THREE.InstancedMesh(new THREE.CylinderGeometry(.00085,.00085,1,6),mSpoke,N);
  spokeIM.name='spokes';
  const M=new THREE.Matrix4(),Q=new THREE.Quaternion(),SC=V3(1,1,1),UP=V3(0,1,0);
  let idx=0;
  [-1,1].forEach(side=>{
    for(let i=0;i<N/2;i++){
      const rimA=i/(N/2)*Math.PI*2;
      const lead=(i%2===0?1:-1)*.42*side;
      const flA=rimA+lead;
      const p1=V3(Math.cos(flA)*.030,Math.sin(flA)*.030,side*.025);
      const p2=V3(Math.cos(rimA)*(Rc-.012),Math.sin(rimA)*(Rc-.012),(i%2===0?1:-1)*.008);
      const dir=p2.clone().sub(p1); const len=dir.length();
      Q.setFromUnitVectors(UP,dir.normalize());
      SC.set(1,len,1);
      M.compose(p1.clone().lerp(p2,.5),Q,SC);
      spokeIM.setMatrixAt(idx++,M);
    }
  });
  spokeIM.instanceMatrix.needsUpdate=true;
  spokeIM.userData.noOutline=true; rot.add(spokeIM);
  // 碟片
  const rOut=(rear?.140:P.rotorSize/2000)/2+.028;
  const rDisc=rear?.070:P.rotorSize/2000;
  const rotor=new THREE.Group();
  const rd_=new THREE.Mesh(makeRotor(rDisc),zmat('steel','chrome','#c8cdd4'));
  rotor.add(rd_); outlineFor(rd_,'s');
  const spider=new THREE.Mesh(new THREE.CylinderGeometry(.028,.030,.004,18),zmat('hub','dark'));
  spider.geometry.rotateX(Math.PI/2); spider.position.z=-.0022; rotor.add(spider);
  for(let b=0;b<6;b++){const bb=b/6*Math.PI*2;
    const bolt=new THREE.Mesh(new THREE.CylinderGeometry(.0035,.0035,.006,8),mSteel);
    bolt.geometry.rotateX(Math.PI/2); bolt.position.set(Math.cos(bb)*.021,Math.sin(bb)*.021,-.003); rotor.add(bolt);}
  rotor.position.z=-.054; rot.add(rotor);
  // 飞轮（挂在塔基上的独立子组 —— 分解时额外滑出）
  let cass=null;
  if(rear){
    cass=new THREE.Group(); cass.name='cassette';
    const cogs=cogList(P.speed);
    const thBase=P.speed<=8?.0042:P.speed===9?.0036:P.speed===10?.0030:P.speed===11?.0026:.0022;
    let z=.020;
    cogs.forEach((teeth,k)=>{
      const tr=teeth*.00202+.004, th=thBase+tr*.28;
      const g=makeGear(tr,Math.max(teeth,8),.0018,.82);
      const cog=new THREE.Mesh(g,zmat('drive','metal',k%2?shadeMix(P.cDrive,'#4a5058',.35):P.cDrive));
      cog.position.z=z; cog.castShadow=true;
      cass.add(cog); outlineFor(cog,'s');
      z+=th+.0022;
    });
    const cone=new THREE.Mesh(new THREE.CylinderGeometry(.012,.05,.017,20),zmat('hub','dark'));
    cone.geometry.rotateX(Math.PI/2); cone.position.z=.006; cass.add(cone);
    const lock=new THREE.Mesh(new THREE.CylinderGeometry(.017,.014,.006,14),mMetal);
    lock.geometry.rotateX(Math.PI/2); lock.position.z=z+.004; cass.add(lock);
    rot.add(cass);
  }
  shadowify(grp);
  return {grp,rot,cass};
}
/* ══════════════════════════ 链条（实例化） ══════════════════════════ */
function buildChain(G,ringR,cogR,DZ){
  const cl=new THREE.Group(); cl.name='chain';
  const C1=G.BB.clone(), C2=V3(G.RAxle.x,G.axleY,0);
  const d=C2.clone().sub(C1); const L=Math.max(d.length(),.1);
  const ang=Math.atan2(d.y,d.x);
  const phi=Math.asin(clamp((ringR-cogR)/L,-1,1));
  // 外公切线：上下两条（法向量 n 同侧）
  const tangents=[phi,-phi].map(sf=>{
    const tn=ang+sf+Math.PI/2;
    const n=V3(Math.cos(tn),Math.sin(tn),0);
    return {P1:C1.clone().addScaledVector(n,ringR),P2:C2.clone().addScaledVector(n,cogR),top:sf===phi};
  });
  const upper=tangents.find(t=>t.top), lower=tangents.find(t=>!t.top);
  const aU=Math.atan2(upper.P1.y-C1.y,upper.P1.x-C1.x);
  const aL=Math.atan2(lower.P1.y-C1.y,lower.P1.x-C1.x);
  // 大牙盘包角：从上切点经"远离飞轮一侧"到下切点
  let sweep=(aL-aU)%(Math.PI*2); if(sweep<0)sweep+=Math.PI*2;
  const awayRing=ang+Math.PI;
  const midA=aU+sweep/2;
  if(((awayRing-aU)%(Math.PI*2)+Math.PI*2)%(Math.PI*2) < sweep) sweep=sweep-Math.PI*2; // 保证走背面
  const bL=Math.atan2(lower.P2.y-C2.y,lower.P2.x-C2.x);
  const bU=Math.atan2(upper.P2.y-C2.y,upper.P2.x-C2.x);
  let sweep2=(bU-bL)%(Math.PI*2); if(sweep2<0)sweep2+=Math.PI*2;
  const awayCog=ang;
  const midB=bL+sweep2/2;
  if(((awayCog-midB)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)<Math.PI/2 && sweep2>Math.PI) sweep2=sweep2-Math.PI*2;
  // 路径：牙盘弧 → 下切线 → 飞轮弧 → 上切线
  const path=[];
  const NA=52,NB=34;
  for(let i=0;i<=NA;i++){const th=aU+sweep*i/NA;path.push(V3(C1.x+Math.cos(th)*ringR,C1.y+Math.sin(th)*ringR,0));}
  for(let i=1;i<=10;i++)path.push(lower.P1.clone().lerp(lower.P2,i/10));
  for(let i=1;i<=NB;i++){const th=bL+sweep2*i/NB;path.push(V3(C2.x+Math.cos(th)*cogR,C2.y+Math.sin(th)*cogR,0));}
  for(let i=1;i<10;i++)path.push(upper.P2.clone().lerp(upper.P1,i/10));
  path.push(upper.P1.clone());
  // 弧长表
  const segLen=[];let total=0;
  for(let i=0;i<path.length;i++){const j=(i+1)%path.length;const l=path[i].distanceTo(path[j]);segLen.push(l);total+=l;}
  const pitch=.0127, nLinks=clamp(Math.round(total/pitch),50,170);
  const mPlateO=zmat('chain','dark','#2a2e34'), mRoller=zmat('chainIn','metal','#b9bfc8');
  const gPlate=new THREE.BoxGeometry(.0098,.0072,.0026), gRoll=new THREE.CylinderGeometry(.0033,.0033,pitch*.94,8);
  gRoll.rotateX(Math.PI/2);
  const imO=new THREE.InstancedMesh(gPlate,mPlateO,nLinks);
  const imR=new THREE.InstancedMesh(gRoll,mRoller,nLinks);
  const M=new THREE.Matrix4(),Q=new THREE.Quaternion();
  const zDrv=DZ+.004;
  for(let k=0;k<nLinks;k++){
    let remain=k/nLinks*total,idx=0;
    for(let i=0;i<segLen.length;i++){if(remain<=segLen[i]){idx=i;break;}remain-=segLen[i];}
    const p=path[idx].clone().lerp(path[(idx+1)%path.length],remain/Math.max(segLen[idx],1e-6));
    Q.setFromUnitVectors(V3(1,0,0),path[(idx+1)%path.length].sub(path[idx]).normalize());
    M.compose(V3(p.x,p.y,zDrv),Q,V3(1,1,k%2?1.18:.85)); imO.setMatrixAt(k,M);
    M.compose(V3(p.x,p.y,zDrv),Q,V3(1,1,1)); imR.setMatrixAt(k,M);
  }
  imO.instanceMatrix.needsUpdate=true; imR.instanceMatrix.needsUpdate=true;
  imO.userData.noOutline=true; imR.userData.noOutline=true;
  cl.add(imO,imR);
  return cl;
}

function makeLabelSprite(text){
  const c=document.createElement('canvas');c.width=256;c.height=64;
  const g=c.getContext('2d');
  g.fillStyle='rgba(20,24,32,.86)';
  roundRect(g,6,10,244,44,10);g.fill();
  g.strokeStyle='#ffb877';g.lineWidth=3;roundRect(g,6,10,244,44,10);g.stroke();
  g.fillStyle='#ffffff';g.font='600 24px Inter,"Microsoft YaHei",sans-serif';
  g.textAlign='center';g.textBaseline='middle';g.fillText(text,128,33);
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
  sp.scale.set(.30,.075,1);sp.renderOrder=50;
  return sp;
}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function clearLabels(){
  labelHost.forEach(sp=>{
    if(sp.parent)sp.parent.remove(sp);
    if(sp.material){sp.material.map&&sp.material.map.dispose();sp.material.dispose();}
  });
  labelHost.length=0;
}
function addLabels(CUR,G){
  if(!LABELS_ON)return;
  const defs=[
    ['CUR.frame','车架 Frame',V3(G.BB.x-.06,G.TThead.y-.02,0)],
    ['CUR.fork','前叉 Fork',null],
    ['CUR.cockpit','把持 Cockpit',V3(.10,.12,0)],
    ['CUR.seat','坐垫 Saddle',V3(P.saddleFB-.02,.075,0)],
    ['CUR.seatPost','座管 Seatpost',V3(-.055,.03,0)],
    ['CUR.crank','曲柄牙盘 Crank',V3(.03,-.02,DZ_G)],
    ['CUR.frontWheel','前轮 Wheel F',V3(.02,0,-.10)],
    ['CUR.rearWheel','后轮 Wheel R',V3(-.03,0,-.10)],
    ['CUR.fd','前拨 FD',V3(-.01,.05,0)],
    ['CUR.rd','后拨 RD',V3(-.045,-.02,0)],
    ['CUR.frontCaliper','前刹 Caliper',V3(-.03,.03,0)],
    ['CUR.rearCaliper','后刹 Caliper',V3(.02,.05,0)]
  ];
  defs.forEach(([key,txt,off])=>{
    const tgt=CUR[key.split('.')[1]]; if(!tgt)return;
    const sp=makeLabelSprite(txt);
    if(off)sp.position.copy(off); else sp.position.set(0,G.FAxle.y-G.axleY+ .02,0);

    tgt.add(sp);labelHost.push(sp);

}

/* ══════════════════════════ 整车重建 ══════════════════════════ */
let DZ_G=.047;
let CUR={};
let chainGroup=null,labelHost=[];
function disposeSubtree(root){
  const seen=new Set();
  root.traverse(o=>{
    (Array.isArray(o.material)?o.material:[o.material]).forEach(mm=>{ if(mm&&mm.map&&!PERSIST_TEX.has(mm.map)){/*共享贴图保留*/} });
    if(o.geometry&&!seen.has(o.geometry)){seen.add(o.geometry);}
  });
  seen.forEach(g=>g.dispose());
}
function rebuildAll(){
  const G=solveGeo(P);
  clearLabels();
  disposeSubtree(bikeRoot);
  bikeRoot.clear();
  EXPLODE.length=0; ANCH.prevStdir=G.stDir.clone(); DZ_G=.047;
  ANCH.rAxleZ=null;
  const frame=buildFrame(G); bikeRoot.add(frame);
  const fRes=buildFork(G); bikeRoot.add(fRes.group); ANCH.forkCrown=fRes.group.userData.crown||ANCH.forkCrown;
  const fdCal=buildFrontCaliper(G); bikeRoot.add(fdCal);
  const ck=buildCockpit(G); bikeRoot.add(ck.group);
  const su=buildSeatUnit(G); bikeRoot.add(su.postCl,su.sadCl);
  const drv=buildDrivetrain(G); Object.values(drv.groups).forEach(g=>g&&bikeRoot.add(g));
  const wf=buildWheel(G,{rear:false}); bikeRoot.add(wf.grp);
  const wr=buildWheel(G,{rear:true}); bikeRoot.add(wr.grp);
  // 后刹车夹器
  const rc=buildRearCaliper(G); bikeRoot.add(rc);
  // 链条
  chainGroup=buildChain(G,drv.bigRing.r,drv.chain.cog.r,.047);
  bikeRoot.add(chainGroup);
  // 分解轴注册
  reg(wf.grp,V3(1,0,0),.30);                       // 前轮：沿前轴横向外移
  reg(wr.grp,V3(1,0,0),.30);                       // 后轮：沿后轴横向外移
  if(wr.cass)reg(wr.cass,V3(0,0,1),.24);           // 飞轮：塔基轴向滑出
  reg(fRes.group,G.vDown,.26);                     // 前叉：沿转向轴上移分离
  reg(ck.group,G.uUp,.16);                         // 座舱整体：沿转向轴上提
  reg(su.sadCl,V3(0,1,0),.20);                     // 坐垫：竖直上移脱轨
  reg(su.postCl,G.stDir,.14);                      // 座管：沿座管轴抽出
  reg(drv.groups.crank,V3(0,0,1),.12);             // 曲柄组：中轴轴向右移
  if(drv.groups.bbR)reg(drv.groups.bbR,V3(0,0,1),.20);   // 中轴右碗外移
  if(drv.groups.bbL)reg(drv.groups.bbL,V3(0,0,-1),.20);  // 左碗左移
  if(drv.groups.fd)reg(drv.groups.fd,G.stDir,.10);       // 前拨沿座管轴上移
  reg(drv.groups.rd,V3(-.4,-.91,0).normalize(),.16);     // 后拨从尾勾斜下滑出
  reg(fdCal,V3(0,-1,0).normalize(),.15);           // 前夹器向下脱卡
  reg(rc,V3(0,-1,0).normalize(),.15);
  reg(chainGroup,V3(0,0,1),.0);                    // 链条不位移，分解时淡出
  CUR={frame,fork:fRes.group,cockpit:ck.group,seat:su.sadCl,seatPost:su.postCl,
       crank:drv.groups.crank,fd:drv.groups.fd,rd:drv.groups.rd,
       frontWheel:wf.grp,rearWheel:wr.grp,
       frontCaliper:fdCal,rearCaliper:rc,wheelRots:[wf.rot,wr.rot]};
  refreshHoodsFromAnchors();
  addLabels(CUR,G);
  applyExplode(explodeCur,true);
  updateSpecs(G,drv);
  if(pendingCam)doCamera(pendingCam),pendingCam=null;
}

/* 分解状态应用 */
let explodeCur=0;
function applyExplode(k,force){
  const kk=easeIO(clamp(k,0,1));
  EXPLODE.forEach(e=>{
    e.obj.position.copy(e.obj.userData.basePos).addScaledVector(e.axis,e.dist*kk);
  });
  if(chainGroup){
    const vis=kk<.12;
    if(chainGroup.visible!==vis)chainGroup.visible=vis;
  }
}

/* ══════════════════════════ 规格/重量计算 ══════════════════════════ */
function computeSpecs(G){
  const wb=G.FAxle.x-G.RAxle.x;
  const standover=G.BB.y+Math.sin(D2R(P.seatAngle))*P.seatTubeLen+ .09;
  const cogs=cogList(P.speed), rings=chainRingSet();
  const Rw=.355;
  const devLo=rings[rings.length-1].t/cogs[cogs.length-1]*2*Math.PI*Rw;
  const devHi=rings[0].t/cogs[0]*2*Math.PI*Rw;
  // 重量模型
  const w={
    frame:1.42+P.seatTubeLen*1.1+(P.droppedStay>.5?.04:0),
    fork:.44,
    wheels:(1.58+(P.rotorSize-140)/1000*1.4)*2,
    tires:.32*2, tubes:.10*2,
    cassette:cogs.reduce((a,b)=>a+b,0)*.0033+.12,
    crank:.72+(P.ringSet-1)*.11, bb:.09, pedals:.34,
    rd:.26+(P.speed>=11?.01:0), fd:P.ringSet>=2?.12:0,
    cockpit:.30+P.barW*.12+P.stemLen/1000*.3,
    saddle:.24, seatpost:.22+P.saddleH*.6,
    rotors:P.rotorSize/1000*.30*2, misc:.09
  };
  const total=Object.values(w).reduce((a,b)=>a+b,0);
  return {wb,standover,devLo,devHi,total,w,cogs,rings};
}
function fmtCfg(){
  return `${P.ringSet}×${P.speed}`;
}

/* ══════════════════════════ 后期处理管线 ══════════════════════════ */
const PostShader={
  uniforms:{tDiffuse:{value:null},uLevels:{value:6},uRes:{value:new THREE.Vector2(1,1)}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
  uniform sampler2D tDiffuse;uniform float uLevels;uniform vec2 uRes;varying vec2 vUv;
  float lum(vec3 c){return dot(c,vec3(0.299,0.587,0.114));}
  void main(){
    vec2 px=uRes;
    // 轻微十字采样做边线增强（暗部勾边）
    vec3 col=texture2D(tDiffuse,vUv).rgb;
    float c=lum(col);
    float l=lum(texture2D(tDiffuse,vUv+vec2(1.2/px.x,0.)).rgb);
    float r=lum(texture2D(tDiffuse,vUv-vec2(1.2/px.x,0.)).rgb);
    float u=lum(texture2D(tDiffuse,vUv+vec2(0.,1.2/px.y)).rgb);
    float dn=lum(texture2D(tDiffuse,vUv-vec2(0.,1.2/px.y)).rgb);
    float edge=max(max(abs(c-l),abs(c-r)),max(abs(c-u),abs(c-dn)));
    if(edge>0.16) col*=0.82;                       // 墨线加浓
    col=floor(col*uLevels+.5)/uLevels;             // 色调分离
    gl_FragColor=vec4(col,1.0);
  }`
};
let composer,renderPass,pixelPass,postPass,outputPass;
function setupComposer(){
  composer=new EffectComposer(renderer);
  renderPass=new RenderPass(scene,camera); composer.addPass(renderPass);
  pixelPass=new RenderPixelatedPass(P.pixSize,scene,camera,{normalEdgeThickness:.5,strongEdges:false});
  pixelPass.enabled=P.pixel; composer.addPass(pixelPass);
  postPass=new ShaderPass(PostShader);
  postPass.uniforms.uRes.value.set(innerWidth,innerHeight);
  postPass.enabled=P.posterize; composer.addPass(postPass);
  outputPass=new OutputPass(); composer.addPass(outputPass);
}
setupComposer();

    onParam(key);

  slider.reg[key]={inp,scale,unit};
}

function fmtV(v,scale){const x=v*scale;return Math.abs(x)>=100?x.toFixed(0):x>=10?x.toFixed(1):x.toFixed(x%1===0?0:2)}
function paintFill(inp){
  const p=(inp.value-inp.min)/(inp.max-inp.min)*100;
  inp.style.setProperty('--fill',p+'%');
}
function chips(host,label,key,options,onPick){
  const wrap=document.createElement('div');wrap.className='full row';wrap.style.display='block';
  wrap.innerHTML=`<label style="display:block;margin-bottom:4px;color:var(--dim);font-size:11.5px">${label}</label>`;
  const box=document.createElement('div');box.className='chips wide';
  box.dataset.key=key;
  options.forEach(o=>{
    const b=document.createElement('button');
    b.textContent=o.label;b.dataset.v=o.value;
    if(String(P[key])===String(o.value))b.classList.add('on');
    b.addEventListener('click',()=>{
      P[key]=o.value;
      box.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
      onPick&&onPick(o.value);
    });
    box.appendChild(b);
  });
  wrap.appendChild(box);host.appendChild(wrap);
  return box;
}

/* ══════════════════════════ 参数响应路由 ══════════════════════════ */
let rebuildTimer=null;
function scheduleRebuild(){
  if(rebuildTimer)return;
  rebuildTimer=setTimeout(()=>{rebuildTimer=null;rebuildAll()},30);
}
function onParam(key){
  if(['stack','reach','headAngle','seatTubeLen','seatAngle','chainstay','compact','droppedStay',
      'ringSet','speed','saddleH','saddleFB','barW','rise','flare','stemLen'].includes(key)){
    scheduleRebuild();
  }else if(key==='rotorSize'){
    scheduleRebuild();
  }else if(key==='pLevels'){
    postPass.uniforms.uLevels.value=P.pLevels;
  }else if(key==='pixSize'){
    if(pixelPass){
      if(typeof pixelPass.setPixelSize==='function')pixelPass.setPixelSize(P.pixSize);
      else if(pixelPass.uniforms&&pixelPass.uniforms.granularity)pixelPass.uniforms.granularity.value=P.pixSize;
    }
  }else if(key==='explode'){
    explodeTarget=P.explode;
  }else if(key==='finish'){
    MAT_CACHE.forEach(m=>m.userData.needsUpdate=true);
  }
}
let explodeTarget=0;

function syncUIFromState(){
  Object.entries(slider.reg).forEach(([key,r])=>{
    r.inp.value=P[key]*r.scale;
    r.inp.parentElement.querySelector('.val').textContent=fmtV(P[key],r.scale)+r.unit;
    paintFill(r.inp);
  });
  document.querySelectorAll('.chips[data-key]').forEach(box=>{
    const key=box.dataset.key;
    box.querySelectorAll('button').forEach(b=>{
      b.classList.toggle('on',String(P[key])===b.dataset.v);
    });
  });
}

/* ══════════════════════════ 动画循环 ══════════════════════════ */
const clock=new THREE.Clock();
let cyclePhase=0,cycleHold=0;
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05);
  const t=clock.elapsedTime;
  // 自动循环：装配→停→分解→停
  if(P.cycle){
    cycleHold-=dt;
    if(cycleHold<=0){
      explodeTarget=explodeTarget>.5?0:1;
      cycleHold=explodeTarget>.5?1.6:2.4;
    }
  }
  const kCur=easeIO(clamp(explodeTarget,0,1));
  explodeCur+=(kCur-explodeCur)*Math.min(1,dt*4.5);
  applyExplode(explodeCur);
  // 骑行旋转
  if(P.ride&&explodeCur<.05){
    const wSpd=3.4*dt;
    CUR.wheelRots&&CUR.wheelRots.forEach(r=>r.rotation.z-=wSpd);
    const crank=CUR.crank;
    if(crank){
      const cRank=wSpd*(cogRatio()/44)*1.6;
      crank.rotation.z-=cRank;
      for(const arm of crank.children){
        if(!arm.userData.isArm)continue;
        const ped=arm.children.find(c=>c.userData.isPedal);
        if(ped)ped.rotation.z=-arm.rotation.z-crank.rotation.z;
      }
    }
  }
  // 相机动画
  if(camAnim){
    const a=camAnim,k=Math.min(1,(performance.now()-a.t0)/a.dur),e=easeIO(k);
    camera.position.lerpVectors(a.p0,a.p1,e);
    controls.target.lerpVectors(a.q0,a.q1,e);
    if(k>=1)camAnim=null;
  }
  labelsFloat(t);
  controls.update();
  composer.render();
}
function cogRatio(){
  const rings=chainRingSet();
  return rings[0].t;
}
function labelsFloat(t){ /* 标签静态（避免累积漂移） */ }
window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
  if(postPass)postPass.uniforms.uRes.value.set(innerWidth,innerHeight);
});
