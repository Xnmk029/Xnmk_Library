<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CYCLE FORGE — Custom Bicycle Builder &amp; Assembly Simulator</title>
<style>
  :root{
    --bg:#0e1319; --pane:rgba(17,23,31,.86); --pane2:rgba(24,32,42,.92);
    --line:rgba(255,255,255,.10); --txt:#e7eef5; --dim:#8fa2b4;
    --acc:#37e0d8; --acc2:#ffcf5c; --warn:#ff8a5c; --rad:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font:12px/1.45 "Inter",-apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none}
  #stage{position:fixed;inset:0}
  canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .lab{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
    background:rgba(10,15,20,.72);border:1px solid rgba(255,255,255,.18);color:#eafcff;
    padding:2px 7px;border-radius:20px;font-size:10px;letter-spacing:.4px;text-transform:uppercase;
    backdrop-filter:blur(3px);box-shadow:0 2px 10px rgba(0,0,0,.35)}
  .lab i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--acc);margin-right:5px;vertical-align:middle}

  /* ---------- top bar ---------- */
  #bar{position:absolute;left:0;right:0;top:0;height:46px;display:flex;align-items:center;gap:14px;
    padding:0 12px;background:linear-gradient(180deg,rgba(8,12,17,.92),rgba(8,12,17,.55) 70%,transparent);
    z-index:8}
  .brand{font-size:15px;letter-spacing:2px;font-weight:600}
  .brand b{color:var(--acc)}
  .brand span{color:var(--dim);font-size:10px;letter-spacing:3px;margin-left:6px;text-transform:uppercase}
  #cams{display:flex;gap:5px;flex:1;flex-wrap:wrap}
  .right{display:flex;gap:6px}
  button{font:inherit;color:var(--txt);background:var(--pane2);border:1px solid var(--line);
    padding:5px 9px;border-radius:7px;cursor:pointer;transition:.14s;white-space:nowrap}
  button:hover{border-color:var(--acc);color:#fff;background:rgba(55,224,216,.14)}
  button.on{background:var(--acc);color:#08222a;border-color:var(--acc);font-weight:600}
  button.tiny{padding:3px 7px;font-size:10.5px}

  /* ---------- panels ---------- */
  aside{position:absolute;top:52px;bottom:12px;z-index:7;width:274px;border-radius:var(--rad);
    background:var(--pane);border:1px solid var(--line);backdrop-filter:blur(10px);
    box-shadow:0 18px 50px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden}
  #panelL{left:12px}
  #panelR{right:12px;width:250px}
  aside.hide{transform:translateX(calc(-100% - 20px));opacity:0;pointer-events:none}
  #panelR.hide{transform:translateX(calc(100% + 20px))}
  aside{transition:transform .3s cubic-bezier(.3,.9,.3,1),opacity .3s}
  .scroll{overflow-y:auto;overflow-x:hidden;padding:8px 10px 14px}
  .scroll::-webkit-scrollbar{width:8px}
  .scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}
  .scroll::-webkit-scrollbar-track{background:transparent}

  .grp{margin-bottom:7px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:rgba(255,255,255,.02)}
  .ghd{display:flex;align-items:center;gap:7px;padding:7px 9px;cursor:pointer;background:rgba(255,255,255,.045);
    font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:#cfe0ee}
  .ghd:hover{background:rgba(55,224,216,.12)}
  .ghd em{margin-left:auto;font-style:normal;color:var(--dim);transition:.2s;font-size:10px}
  .grp.cl .gbd{display:none}
  .grp.cl .ghd em{transform:rotate(-90deg)}
  .ghd i{width:6px;height:6px;border-radius:2px;background:var(--acc);display:inline-block}
  .gbd{padding:8px 9px 10px}

  .row{margin-bottom:9px}
  .rlab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;gap:6px}
  .rlab span{color:var(--dim);font-size:10.5px;letter-spacing:.3px}
  .rlab b{font-weight:600;color:var(--acc);font-variant-numeric:tabular-nums;font-size:11px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:rgba(255,255,255,.14)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:var(--acc);margin-top:-4.5px;border:2px solid #0d1b20;box-shadow:0 0 0 1px rgba(55,224,216,.5)}
  input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.14)}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border:2px solid #0d1b20;border-radius:50%;background:var(--acc)}
  .seg{display:flex;gap:3px;flex-wrap:wrap}
  .seg button{flex:1 1 auto;padding:4px 6px;font-size:10.5px;border-radius:6px;min-width:34px}
  .sw{display:flex;gap:5px;flex-wrap:wrap}
  .sw label{position:relative;width:26px;height:22px;border-radius:6px;border:1px solid var(--line);overflow:hidden;cursor:pointer}
  .sw input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;padding:0;border:0}
  .sw label span{position:absolute;inset:0}
  .sw label u{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:8px;text-decoration:none;
    background:rgba(0,0,0,.5);color:#dfe;letter-spacing:.2px}
  .tg{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 0}
  .tg span{color:var(--dim);font-size:10.5px}
  .btns{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
  .note{color:var(--dim);font-size:10px;line-height:1.5;margin:2px 0 6px}

  /* ---------- specs ---------- */
  #specs h4{margin:2px 0 6px;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--acc2)}
  .sp{display:flex;justify-content:space-between;gap:8px;padding:2.5px 0;border-bottom:1px dashed rgba(255,255,255,.07)}
  .sp span{color:var(--dim);font-size:10.5px}
  .sp b{font-weight:600;font-variant-numeric:tabular-nums;font-size:11px}
  .big{display:flex;align-items:flex-end;gap:6px;margin:4px 0 8px}
  .big u{text-decoration:none;font-size:30px;font-weight:700;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
  .big i{font-style:normal;color:var(--dim);font-size:11px;padding-bottom:3px}
  .bar{height:7px;border-radius:4px;background:rgba(255,255,255,.09);overflow:hidden;margin:3px 0 7px;display:flex}
  .bar i{display:block;height:100%}
  .wl{display:flex;flex-wrap:wrap;gap:3px 10px;margin-bottom:8px}
  .wl u{text-decoration:none;color:var(--dim);font-size:10px;display:flex;align-items:center;gap:4px}
  .wl u b{color:var(--txt);font-weight:600}
  .wl em{width:7px;height:7px;border-radius:2px;display:inline-block}
  .cfg{background:rgba(55,224,216,.1);border:1px solid rgba(55,224,216,.35);border-radius:7px;
    padding:6px 8px;margin-bottom:8px;text-align:center;letter-spacing:1px}
  .cfg b{font-size:16px;color:var(--acc)}
  .cfg span{display:block;color:var(--dim);font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase}

  /* ---------- gear bench ---------- */
  #stand{position:absolute;right:274px;bottom:12px;width:330px;z-index:7;border-radius:var(--rad);overflow:hidden;
    background:var(--pane);border:1px solid var(--line);backdrop-filter:blur(8px);box-shadow:0 14px 40px rgba(0,0,0,.45);
    transition:transform .3s,opacity .3s}
  #stand.hide{transform:translateY(140%);opacity:0;pointer-events:none}
  #standHd{display:flex;align-items:center;gap:6px;padding:5px 9px;font-size:10.5px;letter-spacing:1.3px;
    text-transform:uppercase;color:#cfe0ee;background:rgba(255,255,255,.05)}
  #standHd em{margin-left:auto;font-style:normal;color:var(--acc);letter-spacing:1px}
  #standView{height:172px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    background:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 6px,transparent 6px 12px)}
  #standCtl{display:flex;align-items:center;gap:5px;padding:7px 8px}
  #standCtl .gear{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;color:var(--acc2);letter-spacing:1px}
  #rpm{width:74px}

  #hint{position:absolute;left:298px;bottom:14px;color:var(--dim);font-size:10px;letter-spacing:.4px;z-index:6;
    background:rgba(10,15,20,.5);padding:4px 9px;border-radius:20px;border:1px solid var(--line)}
  #boot{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,#16212b,#080c11);transition:opacity .5s}
  #boot.out{opacity:0;pointer-events:none}
  #boot .bx{text-align:center;max-width:520px;padding:20px}
  #boot h1{font-size:20px;letter-spacing:5px;margin:0 0 6px;font-weight:600}
  #boot h1 b{color:var(--acc)}
  #boot p{color:var(--dim);margin:5px 0;font-size:11.5px}
  .spin{width:34px;height:34px;margin:14px auto;border:3px solid rgba(255,255,255,.12);
    border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #boot code{color:var(--acc2);font-size:10.5px}
  @media (max-width:1180px){ #stand{right:12px;bottom:12px} #panelR{opacity:.97} }
  @media (max-width:900px){
    aside{top:50px;bottom:8px;width:250px}
    #stand{width:250px} #standView{height:130px} #hint{display:none}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="labels"></div>

  <header id="bar">
    <div class="brand"><b>CYCLE</b>FORGE <span>assembly studio</span></div>
    <div id="cams"></div>
    <div class="right">
      <button id="tglO" class="tiny" title="空镜录制：自动环绕旋转（快捷键 O）">◉ Orbit</button>
      <button id="tglL" class="on tiny">◧ Build</button>
      <button id="tglR" class="on tiny">Specs ◨</button>
      <button id="tglS" class="on tiny">Gear Bench</button>
    </div>
  </header>

  <aside id="panelL"><div class="scroll" id="groups"></div></aside>
  <aside id="panelR"><div class="scroll" id="specs"></div></aside>

  <section id="stand">
    <div id="standHd"><i>⚙</i> Drivetrain Test Bench <em id="gearTxt">Gear: 3/7</em></div>
    <div id="standView"></div>
    <div id="standCtl">
      <button id="motor" class="tiny">▶ Motor</button>
      <button id="dn" class="tiny">− Shift</button>
      <button id="up" class="tiny">Shift +</button>
      <input id="rpm" type="range" min="0.15" max="2.6" step="0.05" value="1"/>
    </div>
  </section>

  <div id="hint">拖拽旋转 · 滚轮缩放 · 右键平移 · 数字键 1-6 切换机位 · O / ◉ 空镜环绕</div>

  <div id="boot"><div class="bx">
    <h1><b>CYCLE</b>FORGE</h1>
    <p>Procedural Bicycle Builder &amp; Assembly Simulator</p>
    <div class="spin"></div>
    <p id="bootMsg">正在加载 Three.js 运行时…</p>
  </div></div>
</div>

<script>

];

 'Team Cyan'  :{cFrame:'#1fb2c6',cFork:'#16303a',cRim:'#e9eef2',cDrive:'#c3cad3',cCock:'#20252b',cSaddle:'#15181c',cTire:'#2b2f36',cAcc:'#ffcf5c',frameFin:1,forkFin:3,rimFin:2,driveFin:2},

uniform float uBands, uShadeMin, uSpec, uShin, uRim, uFinish, uOpacity, uMode, uTex;

varying vec3 vNv; varying float vD;
void main(){

varying vec3 vNv; varying float vD;

uniform sampler2D tCol, tND; uniform vec2 uTexel;
uniform float uEdge, uThick, uPost, uPix, uHatch; uniform vec3 uInk;
varying vec2 vUv;
void main(){

/* ======================= 4. 几何工具 & 合并构建器 ======================== */
const GC = {};                                    // 几何缓存（长期复用，不释放）
function cylG(seg,taper){
  const k = 'c'+seg+'_'+taper.toFixed(2);
  return GC[k] || (GC[k] = new T.CylinderGeometry(taper,1,1,seg,1,false));
}
function boxG(){ return GC.box || (GC.box = new T.BoxGeometry(1,1,1)); }
function sphG(s){ const k='s'+s; return GC[k] || (GC[k] = new T.SphereGeometry(1,s,Math.max(4,s>>1))); }
function ringG(seg){ const k='r'+seg; return GC[k] || (GC[k] = new T.CircleGeometry(1,seg)); }
function torusG(seg,rad,tube){ const k='t'+seg+'_'+rad+'_'+tube;
  return GC[k] || (GC[k] = new T.TorusGeometry(rad,tube,rad>0.2?10:8,seg)); }

const _m4 = new T.Matrix4(), _q = new T.Quaternion(), _v1 = V3(), _v2 = V3(), _v3 = V3(),
      _UP = V3(0,1,0), _sc = V3(), _m3 = new T.Matrix3();
function segM(a,b,r1,r2,lat){                     // 单位圆柱 → a→b 线段
  _v1.subVectors(b,a); const len = _v1.length()||1e-5;
  _q.setFromUnitVectors(_UP,_v2.copy(_v1).divideScalar(len));
  _v3.addVectors(a,b).multiplyScalar(.5);
  return _m4.compose(_v3,_q,_sc.set(r1,len,(lat||1)*r1));
}
class Builder{
  constructor(){ this.p=[]; this.n=[]; this.u=[]; this.i=[]; }
  add(g,m){
    const pa=g.attributes.position, na=g.attributes.normal, ua=g.attributes.uv;
    _m3.getNormalMatrix(m); const base=this.p.length/3;
    for(let i=0;i<pa.count;i++){
      _v1.fromBufferAttribute(pa,i).applyMatrix4(m); this.p.push(_v1.x,_v1.y,_v1.z);
      if(na){ _v1.fromBufferAttribute(na,i).applyMatrix3(_m3).normalize(); this.n.push(_v1.x,_v1.y,_v1.z); }
      else this.n.push(0,1,0);
      if(ua) this.u.push(ua.getX(i),ua.getY(i)); else this.u.push(0,0);
    }
    const ix=g.index;
    if(ix){ for(let i=0;i<ix.count;i++) this.i.push(base+ix.getX(i)); }
    else  { for(let i=0;i<pa.count;i++) this.i.push(base+i); }
    return this;
  }
  cyl(a,b,r1,r2,seg,lat){
    r1=Math.max(r1,1e-4); r2=Math.max(r2===undefined?r1:r2,1e-4);
    return this.add(cylG(seg||12,Math.round(r2/r1*50)/50),segM(a,b,r1,r2,lat));
  }
  poly(pts,radii,seg,lat,joint){                  // 折线管 + 关节球
    for(let i=0;i<pts.length-1;i++) this.cyl(pts[i],pts[i+1],radii[i],radii[i+1],seg,lat);
    if(joint!==false) for(let i=1;i<pts.length-1;i++) this.ball(pts[i],radii[i]*.99,8,lat);
    return this;
  }
  ball(c,r,seg,lat){ return this.add(sphG(seg||8),_m4.compose(c,_q.identity(),_sc.set(r,r,(lat||1)*r))); }
  box(c,sx,sy,sz,rotZ,rotY){
    _q.identity();
    if(rotZ) _q.setFromAxisAngle(V3(0,0,1),rotZ);
    if(rotY){ const q2=new T.Quaternion().setFromAxisAngle(V3(0,1,0),rotY); _q.multiply(q2); }
    return this.add(boxG(),_m4.compose(c,_q,_sc.set(sx,sy,sz)));
  }
  boxQ(c,sx,sy,sz,q){ return this.add(boxG(),_m4.compose(c,q,_sc.set(sx,sy,sz))); }
  disc(c,r,axis){                                 // 圆盘（axis:'z'|'y'）
    _q.identity();
    if(axis!=='z') _q.setFromAxisAngle(V3(1,0,0),-PI/2);
    return this.add(ringG(16),_m4.compose(c,_q,_sc.set(r,r,r)));
  }
  geo(g,m){ return this.add(g,m); }
  build(){
    const g = new T.BufferGeometry();
    g.setAttribute('position',new T.Float32BufferAttribute(this.p,3));
    g.setAttribute('normal',new T.Float32BufferAttribute(this.n,3));
    g.setAttribute('uv',new T.Float32BufferAttribute(this.u,2));
    g.setIndex(this.i); g.computeBoundingSphere();
    return g;
  }
}
/* 齿盘 / 齿轮 二维轮廓 → 挤出 */
function gearGeo(teeth,thick,holeR,cut){
  const rp = teeth*0.0127/TAU, rt = rp+0.0034, rr = rp-0.0042;
  const sh = new T.Shape(), dt = TAU/teeth, w = dt*0.30;
  for(let i=0;i<teeth;i++){
    const a=i*dt;
    const pts=[[rr,a-dt*0.5+w*0.35],[rt,a-w*0.5],[rt,a+w*0.5],[rr,a+dt*0.5-w*0.35]];
    pts.forEach((p,j)=>{ const x=Math.cos(p[1])*p[0], y=Math.sin(p[1])*p[0];
      (i===0&&j===0)?sh.moveTo(x,y):sh.lineTo(x,y); });
  }
  sh.closePath();
  if(holeR>0){ const h=new T.Path(); h.absarc(0,0,holeR,0,TAU,true); sh.holes.push(h); }
  if(cut){ for(let i=0;i<cut;i++){ const a=i/cut*TAU+.2, r=rr*0.68, h=new T.Path();
      h.absarc(Math.cos(a)*r,Math.sin(a)*r,rr*0.19,0,TAU,true); sh.holes.push(h); } }
  return new T.ExtrudeGeometry(sh,{depth:thick,bevelEnabled:false,curveSegments:4,steps:1});
}
function rotorGeo(dia){
  const R = dia/2000, sh = new T.Shape();
  sh.absarc(0,0,R,0,TAU,false);
  const h = new T.Path(); h.absarc(0,0,R*0.63,0,TAU,true); sh.holes.push(h);
  const n = Math.round(dia/8);
  for(let i=0;i<n;i++){ const a=i/n*TAU, r=R*0.81, p=new T.Path();
    p.absarc(Math.cos(a)*r,Math.sin(a)*r,R*0.055,0,TAU,true); sh.holes.push(p); }
  for(let i=0;i<n;i+=2){ const a=(i+.5)/n*TAU, r=R*0.72, p=new T.Path();
    p.absarc(Math.cos(a)*r,Math.sin(a)*r,R*0.038,0,TAU,true); sh.holes.push(p); }
  return new T.ExtrudeGeometry(sh,{depth:.0018,bevelEnabled:false,curveSegments:5,steps:1});
}
function rotorSpider(dia){                         // 5 臂 + 中心座
  const b = new Builder(), R = dia/2000;
  b.add(cylG(14,1),_m4.compose(V3(0,0,.001),_q.setFromAxisAngle(V3(1,0,0),PI/2),_sc.set(R*.30,.0034,R*.30)));
  for(let i=0;i<5;i++){ const a=i/5*TAU;
    b.boxQ(V3(Math.cos(a)*R*.46,Math.sin(a)*R*.46,.001),R*.40,.0022,.0026,
      new T.Quaternion().setFromAxisAngle(V3(0,0,1),a)); }

}
function tubeCurve(pts,r,seg,rad){

/* =================== 5. 车架几何求解（单一数据源） ====================== */
function cogTeeth(n,maxT){
  const a=[]; for(let i=0;i<n;i++) a.push(Math.round(11*Math.pow(maxT/11,i/(n-1))));
  for(let i=1;i<n;i++) if(a[i]<=a[i-1]) a[i]=a[i-1]+1;
  return a;                                        // 由小到大
}
function solve(){
  const g={};
  const bsd = S.wheelSize===0?0.622:0.584;
  g.bsd=bsd; g.tw=mm(S.tireWidth);
  g.wheelR = bsd/2 + g.tw*0.95;
  g.bbDrop = mm(S.bbDrop);
  const ha=S.headAngle*D2R, sa=S.seatAngle*D2R;
  g.ha=ha; g.sa=sa;
  g.bb = V3(0,g.wheelR-g.bbDrop,0);
  g.dDown = V3(Math.cos(ha),-Math.sin(ha),0);
  g.axisUp = g.dDown.clone().negate();
  g.nFwd = V3(Math.sin(ha),Math.cos(ha),0);
  g.stDir = V3(-Math.cos(sa),Math.sin(sa),0);
  const rake = mm(S.rake);
  g.htTop = V3(mm(S.reach), g.bb.y+mm(S.stack), 0);
  g.totalAxis = (g.htTop.y - g.wheelR + rake*Math.cos(ha))/Math.sin(ha);
  g.frontAxle = g.htTop.clone().addScaledVector(g.dDown,g.totalAxis).addScaledVector(g.nFwd,rake);
  const cp = S.compact/100;  g.cp=cp;
  g.hsLo = mm(11); g.hsUp = mm(9);
  let htL = g.totalAxis - mm(392) - cp*mm(16) + (g.wheelR-0.34)*0.5;
  g.htLen = clamp(htL, mm(78), Math.max(mm(84), g.totalAxis-mm(292)));
  g.htBot = g.htTop.clone().addScaledVector(g.dDown,g.htLen);
  g.crown = g.htBot.clone().addScaledVector(g.dDown,g.hsLo);
  g.a2c = g.crown.distanceTo(g.frontAxle);

  g.stLen = mm(S.seatTube)*(1-0.19*cp);
  g.stTop = g.bb.clone().addScaledVector(g.stDir,g.stLen);
  // 上管：座管端随紧凑度下移 → 斜率 / 座管延伸 / 头管长度联动
  g.ttSeat = g.stTop.clone().addScaledVector(g.stDir,-(mm(13)+cp*mm(66)));
  const tH = Math.min(mm(15)+cp*mm(10), g.htLen-mm(12));
  g.ttHead = g.htTop.clone().addScaledVector(g.dDown,tH);
  g.dtHead = g.htBot.clone().addScaledVector(g.axisUp,mm(21));
  // 后三角
  const cs = mm(S.chainstay);
  g.rearAxle = V3(g.bb.x-Math.sqrt(Math.max(1e-4,cs*cs-g.bbDrop*g.bbDrop)), g.wheelR, 0);
  const ssT = g.stTop.clone().addScaledVector(g.stDir,-mm(17));
  let ssD = g.ttSeat.clone().addScaledVector(g.stDir,-mm(95));
  if(ssD.y < g.bb.y+mm(175)){ const k=(g.bb.y+mm(175)-g.bb.y)/(ssD.y-g.bb.y);
    ssD = g.bb.clone().addScaledVector(ssD.clone().sub(g.bb),k); }
  g.ssJ = S.seatStay===0?ssT:ssD;
  g.dropped = S.seatStay===1;
  // 管径
  const ts=S.tubeset;
  g.R = ts===0?{tt:.0142,dt:.0163,st:.0143,ht0:.0168,ht1:.0180,ss:.0068,cs:.0088,lat:1}
      : ts===1?{tt:.0190,dt:.0225,st:.0158,ht0:.0192,ht1:.0242,ss:.0082,cs:.0112,lat:1}
      :        {tt:.0125,dt:.0135,st:.0130,ht0:.0195,ht1:.0250,ss:.0072,cs:.0100,lat:2.5};
  g.matDens = ts===0?7850:(ts===1?2700:1600);
  g.wall = ts===0?.0009:(ts===1?.0016:.0013);
  // 传动
  g.speeds = S.speeds;
  g.cogs = cogTeeth(S.speeds,S.maxCog);
  g.pitch = mm([5.0,4.8,4.34,3.95,3.7,3.35][S.speeds-7]);
  g.cogZ = i=>mm(62)-i*g.pitch;          // 最小齿在最外侧，塔基锥度向内（链线≈43mm）
  g.rearIdx = clamp(S.speeds-Math.round(S.rearGear),0,S.speeds-1);   // gear1 = 最大齿
  const big = Math.round(S.bigRing);
  g.ringT = S.rings===0?[big] : S.rings===1?[big,big-16] : [big,big-12,big-22];
  g.ringT = g.ringT.map(t=>Math.max(22,t));
  g.ringZ = S.rings===0?[mm(43.5)] : S.rings===1?[mm(48.5),mm(38)] : [mm(53),mm(43.5),mm(34)];
  g.ringIdx = clamp(S.rings+1-Math.round(S.frontGear),0,S.rings);
  g.ringR = g.ringT.map(t=>t*0.0127/TAU);
  g.cogR  = g.cogs.map(t=>t*0.0127/TAU);
  g.chainZ = g.ringZ[g.ringIdx];
  // 座舱
  // 紧凑度压缩座管后，座管外露长度补偿 → 坐高（Fit）保持不变
  g.postExt = mm(S.postExt) + (mm(S.seatTube)-g.stLen);
  g.postTop = g.stTop.clone().addScaledVector(g.stDir,g.postExt);
  g.steerTop = g.crown.clone().addScaledVector(g.axisUp,g.hsLo+g.htLen+g.hsUp+mm(S.spacers)+mm(41));
  g.stemBase = g.crown.clone().addScaledVector(g.axisUp,g.hsLo+g.htLen+g.hsUp+mm(S.spacers)+mm(20));
  const stAng = (PI/2-g.ha) + S.stemAngle*D2R;
  g.stemDir = V3(Math.cos(stAng),Math.sin(stAng),0);
  g.barC = g.stemBase.clone().addScaledVector(g.stemDir,mm(S.stemLen));
  return g;
}
let G = solve();

const bike = new T.Group(); scene.add(bike);
let PARTS=[], DISPOSE=[], LABELS=[];
function reg(o,ax,dist,order,parent){
  (parent||bike).add(o);
  PARTS.push({o:o,ax:ax?ax.clone().normalize():null,d:dist||0,k:order||0,b:o.position.clone()});
  return o;
}
function mesh(geo,mat){ const m=new T.Mesh(geo,mat); DISPOSE.push(geo); return m; }
function ease(t,k){ const sp=.42, a=k/7*sp, u=clamp((t*(1+sp)-a)/1,0,1); return u*u*(3-2*u); }
function applyExplode(t){
  for(let i=0;i<PARTS.length;i++){ const p=PARTS[i];
    if(!p.ax){ p.o.position.copy(p.b); continue; }
    p.o.position.copy(p.b).addScaledVector(p.ax,p.d*ease(t,p.k));
  }
}
function clearBike(){
  for(let i=bike.children.length-1;i>=0;i--) bike.remove(bike.children[i]);
  DISPOSE.forEach(g=>g.dispose()); DISPOSE=[]; PARTS=[]; LABELS=[];
  for(let i=noEdge.length-1;i>=0;i--) if(noEdge[i].userData.bike) noEdge.splice(i,1);
}

function buildFrame(){

  b.cyl(G.htTop,G.htBot,R.ht0,R.ht1,14);

  b.cyl(G.bb,G.stTop,R.st*1.06,R.st,12,lat>1?1.5:1);

  b.add(cylG(16,1),_m4.compose(G.bb,_q.setFromAxisAngle(V3(1,0,0),PI/2),_sc.set(bbR,bbW,bbR)));
  b.ball(G.stTop.clone().addScaledVector(G.stDir,-mm(6)),R.st*1.16,10);

  }
  b.boxQ(G.rearAxle.clone().add(V3(mm(9),-mm(30),mm(66))),mm(15),mm(46),mm(5),
    new T.Quaternion().setFromAxisAngle(V3(0,0,1),-.25));
  const cm=G.rearAxle.clone().lerp(G.ssJ,.18).add(V3(0,0,-mm(56)));
  b.box(cm,mm(38),mm(11),mm(5));

  bolt(G.bb.clone().lerp(G.dtHead,.42).add(V3(0,mm(R.dt*1000+3),0)),.004,.008,'y');
  bolt(G.bb.clone().lerp(G.dtHead,.62).add(V3(0,mm(R.dt*1000+3),0)),.004,.008,'y');
  bolt(G.bb.clone().lerp(G.stTop,.36).add(V3(mm(R.st*1000+3),0,0)),.004,.008,'x');
  bolt(G.bb.clone().lerp(G.stTop,.52).add(V3(mm(R.st*1000+3),0,0)),.004,.008,'x');
  const fm=mesh(b.build(),M.frame); fm.userData.bike=1;
  reg(fm,null,0,0);

  ab.box(G.ttSeat.clone().lerp(G.ttHead,.5).add(V3(0,R.tt*1.02,0)),mm(120),mm(1.5),R.tt*1.5*(lat>1?2:1));
  reg(mesh(ab.build(),M.acc),null,0,0);
  LABELS.push({n:'Frame',p:G.ttSeat.clone().lerp(G.ttHead,.55).add(V3(0,mm(26),0))});

function buildBar(){

             V3(rc*.99,ri-mm(34),s*(hw+fo*.42)), V3(rc*.86,ri-dr*.72,s*(hw+fo*.80)),

  cb.add(tubeCurve([hoodR.clone(),hoodR.clone().add(V3(-mm(50),-mm(20),mm(24))),htMid.clone().add(V3(mm(18),mm(28),mm(14))),

    rdA.clone().add(V3(mm(30),mm(26),mm(6)))],mm(2.4),34,6),new T.Matrix4());
  cb.add(tubeCurve([hoodL.clone().add(V3(-mm(2),-mm(3),0)),hoodL.clone().add(V3(-mm(54),-mm(16),-mm(26))),
    G.ttHead.clone().add(V3(0,mm(8),-mm(10))),G.ttSeat.clone().lerp(G.ttHead,.5).add(V3(0,mm(7),-mm(6))),
    G.ttSeat.clone().add(V3(mm(6),mm(4),-mm(6))),G.ssJ.clone().add(V3(-mm(10),0,-mm(12))),
    G.rearAxle.clone().lerp(G.ssJ,.30).add(V3(0,0,-mm(30)))],mm(2.4),34,6),new T.Matrix4());

/* ---- 座管 / 坐垫 ---- */
function buildSeat(){
  const b=new Builder();
  const a=G.stTop.clone().addScaledVector(G.stDir,-mm(30)), t=G.postTop;
  b.cyl(a,t,mm(13.6),mm(13.6),14);
  b.cyl(t.clone().addScaledVector(G.stDir,-mm(6)),t.clone().addScaledVector(G.stDir,mm(2)),mm(14.6),mm(13),12);
  reg(mesh(b.build(),M.cock),G.stDir,.26,4);
  // 坐垫：参数化网格实体（上壳 + 下壳 + 边缘缝合）
  const L=mm(272), W=mm(146), tilt=S.saddleTilt*D2R;
  const rows=14, cols=8, TH=mm(13), P=[];
  for(let i=0;i<=rows;i++){
    const u=i/rows, x=(u-0.34)*L;
    const wf=Math.pow(Math.sin(Math.min(1,u*1.15)*PI*.5),.55);
    let hw=W*.5*(0.12+0.88*Math.pow(u,.72));
    if(u>0.88) hw*=1-(u-0.88)*3.0;
    const ry=[];
    for(let j=0;j<=cols;j++){
      const v=j/cols, tt=Math.abs(v-.5)*2;
      const y=-Math.pow(tt,2.2)*mm(20)*wf - (u<.30?Math.pow((.30-u)/.30,2)*mm(12):0);
      ry.push(V3(x,y,(v-.5)*2*hw));
    }
    P.push(ry);
  }
  const spos=[],snor=[],suv=[],sidx=[];
  const spush=p=>{ spos.push(p.x,p.y,p.z); snor.push(0,1,0); suv.push(0,0); return spos.length/3-1; };
  const tp2=[],bt2=[];
  for(let i=0;i<=rows;i++){ const ta=[],ba=[];
    for(let j=0;j<=cols;j++){ ta.push(spush(P[i][j])); ba.push(spush(P[i][j].clone().add(V3(0,-TH,0)))); }
    tp2.push(ta); bt2.push(ba); }
  for(let i=0;i<rows;i++) for(let j=0;j<cols;j++){
    sidx.push(tp2[i][j],tp2[i][j+1],tp2[i+1][j+1], tp2[i][j],tp2[i+1][j+1],tp2[i+1][j]);
    sidx.push(bt2[i][j],bt2[i+1][j+1],bt2[i][j+1], bt2[i][j],bt2[i+1][j],bt2[i+1][j+1]);
  }
  for(let i=0;i<rows;i++){
    sidx.push(tp2[i][0],tp2[i+1][0],bt2[i+1][0], tp2[i][0],bt2[i+1][0],bt2[i][0]);
    sidx.push(tp2[i][cols],bt2[i][cols],bt2[i+1][cols], tp2[i][cols],bt2[i+1][cols],tp2[i+1][cols]);
  }
  for(let j=0;j<cols;j++){
    sidx.push(tp2[0][j],bt2[0][j],bt2[0][j+1], tp2[0][j],bt2[0][j+1],tp2[0][j+1]);
    sidx.push(tp2[rows][j],bt2[rows][j+1],bt2[rows][j], tp2[rows][j],tp2[rows][j+1],bt2[rows][j+1]);
  }
  const sgeo=new T.BufferGeometry();
  sgeo.setAttribute('position',new T.Float32BufferAttribute(spos,3));
  sgeo.setAttribute('normal',new T.Float32BufferAttribute(snor,3));
  sgeo.setAttribute('uv',new T.Float32BufferAttribute(suv,2));
  sgeo.setIndex(sidx); sgeo.computeVertexNormals();
  const sg=new T.Group();
  const sm=new T.Mesh(sgeo,M.saddle); DISPOSE.push(sgeo); sg.add(sm);
  const rb=new Builder();
  for(const s of [1,-1]){
    rb.poly([V3(-L*.20,-mm(24),s*mm(22)),V3(-L*.06,-mm(30),s*mm(22)),V3(L*.30,-mm(30),s*mm(22)),V3(L*.44,-mm(22),s*mm(20))],
      [mm(3.5),mm(3.5),mm(3.5),mm(3.5)],7);
  }
  rb.box(V3(mm(6),-mm(34),0),mm(46),mm(15),mm(52));
  const rm=new T.Mesh(rb.build(),M.steel); DISPOSE.push(rm.geometry); sg.add(rm);
  sg.position.copy(G.postTop).add(V3(mm(S.saddleFore),mm(34),0));
  sg.rotation.z = tilt;
  reg(sg,G.stDir,.46,6);
  G.saddleTop = sg.position.clone().add(V3(0,mm(4),0));
  LABELS.push({n:'Saddle',p:G.saddleTop.clone().add(V3(-mm(40),mm(26),0))});
  LABELS.push({n:'Seatpost',p:G.stTop.clone().lerp(G.postTop,.6).add(V3(-mm(28),0,0))});

/* ---- 轮组 ---- */
function buildWheel(front){
  const g=new T.Group();
  const R=G.wheelR, bsd=G.bsd, depth=mm(S.rimDepth), tw=G.tw;
  const rimOut=bsd/2, rimIn=rimOut-depth, w=clamp(tw*.62,mm(19),mm(34));
  // 圈
  const prof=[];
  prof.push(new T.Vector2(rimOut+mm(1),-w*.5));
  prof.push(new T.Vector2(rimOut+mm(1), w*.5));
  prof.push(new T.Vector2(rimOut-mm(4.5), w*.42));
  prof.push(new T.Vector2(rimIn+mm(1), w*.20));
  prof.push(new T.Vector2(rimIn, 0));
  prof.push(new T.Vector2(rimIn+mm(1),-w*.20));
  prof.push(new T.Vector2(rimOut-mm(4.5),-w*.42));
  prof.push(new T.Vector2(rimOut+mm(1),-w*.5));
  const lg=new T.LatheGeometry(prof,30); lg.rotateX(PI/2); lg.computeVertexNormals();
  const rm=new T.Mesh(lg,M.rim); DISPOSE.push(lg); g.add(rm);
  reg(rm,null,0,1,g);
  // 胎
  const tg=new T.TorusGeometry(R-tw*.48,tw*.5,14,26);
  const tm=new T.Mesh(tg,M.tire); DISPOSE.push(tg); g.add(tm);
  reg(tm,V3(0,0,-1),.19,2,g);
  const trg=new T.TorusGeometry(R-tw*.30,tw*.22,8,26);
  const trm=new T.Mesh(trg,M.rubber); DISPOSE.push(trg); g.add(trm);
  reg(trm,V3(0,0,-1),.19,2,g);
  // 气嘴
  const vb=new Builder();
  vb.cyl(V3(0,-rimIn+mm(2),0),V3(0,-rimOut-mm(9),0),mm(2.6),mm(2.2),8);
  vb.cyl(V3(0,-rimOut-mm(9),0),V3(0,-rimOut-mm(15),0),mm(3.4),mm(3.2),8);
  const vm=new T.Mesh(vb.build(),M.steel); DISPOSE.push(vm.geometry); g.add(vm);
  reg(vm,V3(0,0,-1),.19,2,g);
  // 花鼓（前 100mm / 后 142mm OLD）
  const hb=new Builder(), fR=mm(22), hz=front?mm(28):mm(23), cap=front?mm(49):mm(68);
  hb.add(cylG(14,1),_m4.compose(V3(0,0,0),_q.setFromAxisAngle(V3(1,0,0),PI/2),_sc.set(mm(17),hz*2,mm(17))));
  for(const s of [1,-1]){
    hb.add(cylG(16,1),_m4.compose(V3(0,0,s*hz),_q.setFromAxisAngle(V3(1,0,0),PI/2),_sc.set(fR,mm(5),fR)));
    hb.cyl(V3(0,0,s*hz),V3(0,0,s*cap),mm(9.5),mm(7.5),12);
    hb.cyl(V3(0,0,s*cap),V3(0,0,s*(cap+mm(4))),mm(7.5),mm(6.5),10);
  }
  hb.cyl(V3(0,0,-cap-mm(6)),V3(0,0,cap+mm(6)),mm(6),mm(6),10);
  if(!front) hb.add(cylG(14,1),_m4.compose(V3(0,0,mm(42)),_q.setFromAxisAngle(V3(1,0,0),PI/2),_sc.set(mm(15),mm(44),mm(15))));
  const hm=new T.Mesh(hb.build(),M.steel); DISPOSE.push(hm.geometry); g.add(hm);
  reg(hm,null,0,1,g);
  // 辐条（实例化）
  const n=S.spokes, sg=cylG(5,1);
  const sm2=new T.InstancedMesh(sg,M.chain,n);
  const cross=TAU*2.4/n;
  for(let i=0;i<n;i++){
    const side=(i%2)?1:-1, a=i/n*TAU, a2=a+cross*side;
    const p1=V3(Math.cos(a2)*fR*.86,Math.sin(a2)*fR*.86,side*hz);
    const p2=V3(Math.cos(a)*(rimIn+mm(2)),Math.sin(a)*(rimIn+mm(2)),0);
    sm2.setMatrixAt(i,segM(p1,p2,mm(.95),mm(.95),1).clone());
  }
  sm2.instanceMatrix.needsUpdate=true; g.add(sm2);
  reg(sm2,null,0,1,g);
  // 碟片
  const rgeo=rotorGeo(S.rotor), rsp=rotorSpider(S.rotor);
  const rb=new Builder(); rb.add(rgeo,new T.Matrix4()); rb.add(rsp,new T.Matrix4());
  rgeo.dispose(); rsp.dispose();
  const rot=new T.Mesh(rb.build(),M.steel); DISPOSE.push(rot.geometry);
  rot.position.set(0,0,-mm(35)); g.add(rot);
  reg(rot,V3(0,0,-1),.34,4,g);
  // 飞轮
  if(!front){
    const cb=new Builder();
    for(let i=0;i<G.cogs.length;i++){
      const t=G.cogs[i], gg=gearGeo(t,mm(1.7),Math.max(mm(15),t*0.0127/TAU*0.42),t>19?5:0);
      cb.add(gg,_m4.makeTranslation(0,0,G.cogZ(i))); gg.dispose();
      if(i<G.cogs.length-1 && t>17){
        cb.add(cylG(12,1),_m4.compose(V3(0,0,G.cogZ(i)-G.pitch*.5),_q.setFromAxisAngle(V3(1,0,0),PI/2),

    cb.add(cylG(14,1),_m4.compose(V3(0,0,G.cogZ(G.cogs.length-1)-mm(3)),_q.setFromAxisAngle(V3(1,0,0),PI/2),_sc.set(mm(17),mm(8),mm(17))));
    const cm=new T.Mesh(cb.build(),M.drive); DISPOSE.push(cm.geometry); g.add(cm);
    reg(cm,V3(0,0,1),.30,4,g);
    LABELS.push({n:'Cassette '+G.cogs[0]+'-'+G.cogs[G.cogs.length-1]+'T',
      p:G.rearAxle.clone().add(V3(-mm(20),mm(60),mm(50)))});
  }
  const axle=front?G.frontAxle:G.rearAxle;
  g.position.copy(axle);
  reg(g,V3(0,0,-1),front?.52:.50,3);
  bolt(axle.clone().add(V3(0,0,front?mm(53):mm(72))),.006,.008,'z');
  bolt(axle.clone().add(V3(0,0,front?-mm(53):-mm(72))),.006,.008,'z');
  return g;
}

function buildCrank(){
  const g=new T.Group(); g.position.copy(G.bb);
  const cl=mm(S.crankLen), ang=.55;
  // 中轴（绝对坐标烘焙）
  const bb=new Builder();
  bb.add(cylG(12,1),_m4.compose(G.bb,_q.setFromAxisAngle(V3(1,0,0),PI/2),_sc.set(mm(12),mm(120),mm(12))));
  for(const s of [1,-1]) bb.add(cylG(14,1),_m4.compose(G.bb.clone().add(V3(0,0,s*mm(31))),_q.setFromAxisAngle(V3(1,0,0),PI/2),_sc.set(mm(19),mm(14),mm(19))));
  reg(mesh(bb.build(),M.steel),V3(0,0,1),.12,3);
  // 曲柄臂
  function arm(dir,z){
    const b=new Builder();
    const e=V3(Math.cos(dir)*cl,Math.sin(dir)*cl,z);
    b.box(V3(Math.cos(dir)*cl*.5,Math.sin(dir)*cl*.5,z),cl*.98,mm(26),mm(15),dir);
    b.add(cylG(12,1),_m4.compose(V3(0,0,z),_q.setFromAxisAngle(V3(1,0,0),PI/2),_sc.set(mm(20),mm(16),mm(20))));
    b.add(cylG(12,1),_m4.compose(e,_q.setFromAxisAngle(V3(1,0,0),PI/2),_sc.set(mm(12),mm(20),mm(12))));
    const m=new T.Mesh(b.build(),M.drive); DISPOSE.push(m.geometry);
    return {m:m,e:e};
  }
  const aR=arm(ang,mm(42)), aL=arm(ang+PI,-mm(42));
  g.add(aR.m); g.add(aL.m);
  PARTS.push({o:aR.m,ax:V3(0,0,1),d:.34,k:5,b:V3()});
  PARTS.push({o:aL.m,ax:V3(0,0,-1),d:.34,k:5,b:V3()});
  // 牙盘 + 蜘蛛爪
  const rb=new Builder();
  for(let i=0;i<G.ringT.length;i++){
    const t=G.ringT[i], gg=gearGeo(t,mm(2.1),t*0.0127/TAU*0.55,i===0?5:0);
    rb.add(gg,_m4.makeTranslation(0,0,G.ringZ[i]-mm(1))); gg.dispose();
    if(i===0){
      for(let k=0;k<4;k++){ const a=k/4*TAU+ang+.3, r=t*0.0127/TAU*.42;
        rb.boxQ(V3(Math.cos(a)*r*.6,Math.sin(a)*r*.6,G.ringZ[i]),r*1.25,mm(9),mm(3.4),
          new T.Quaternion().setFromAxisAngle(V3(0,0,1),a));
        bolt(G.bb.clone().add(V3(Math.cos(a)*r*1.02,Math.sin(a)*r*1.02,G.ringZ[i]+mm(2))),.0035,.008,'z');
      }
    }
  }
  const rm=new T.Mesh(rb.build(),M.drive); DISPOSE.push(rm.geometry); g.add(rm);
  PARTS.push({o:rm,ax:V3(0,0,1),d:.50,k:6,b:V3()});
  // 脚踏（反向自转保持水平）
  function pedal(e,z){
    const pv=new T.Group(); pv.position.copy(e);
    const b=new Builder();
    b.add(cylG(10,1),_m4.compose(V3(0,0,z>0?mm(22):-mm(22)),_q.setFromAxisAngle(V3(1,0,0),PI/2),_sc.set(mm(6),mm(50),mm(6))));
    b.box(V3(0,0,z>0?mm(44):-mm(44)),mm(92),mm(14),mm(62));
    for(let i=0;i<8;i++){ const x=(i%4-1.5)*mm(24), zz=(i<4?-1:1)*mm(22);
      b.box(V3(x,mm(9),(z>0?mm(44):-mm(44))+zz),mm(4),mm(6),mm(4)); }
    const m=new T.Mesh(b.build(),M.dark); DISPOSE.push(m.geometry); pv.add(m);
    return pv;
  }
  pedR=pedal(aR.e,1); pedL=pedal(aL.e,-1);
  g.add(pedR); g.add(pedL);
  PARTS.push({o:pedR,ax:V3(0,0,1),d:.58,k:7,b:aR.e.clone()});
  PARTS.push({o:pedL,ax:V3(0,0,-1),d:.58,k:7,b:aL.e.clone()});
  bike.add(g);
  LABELS.push({n:'Crankset '+S.crankLen+'mm',p:G.bb.clone().add(V3(mm(30),-mm(60),mm(90)))});
  LABELS.push({n:G.ringT.join('/')+'T Chainring',p:G.bb.clone().add(V3(mm(120),mm(30),mm(60)))});
  return g;
}

/* ---- 链条（连续环，切线求解） ---- */
function chainLoop(circles,link){
  const n=circles.length, ua=[];
  for(let i=0;i<n;i++){
    const a=circles[i], b=circles[(i+1)%n];
    const dx=b.c.x-a.c.x, dy=b.c.y-a.c.y, d=Math.hypot(dx,dy);
    const th=Math.atan2(dy,dx), ph=Math.acos(clamp((a.r-b.r)/Math.max(d,1e-5),-1,1));
    ua.push(th+ph);
  }
  const pts=[];
  for(let i=0;i<n;i++){
    const c=circles[i], inA=ua[(i-1+n)%n]; let out=ua[i];
    while(out>inA) out-=TAU;
    const steps=Math.max(2,Math.ceil(Math.abs(inA-out)/0.30));
    for(let k=0;k<=steps;k++){
      const a=inA+(out-inA)*k/steps;
      pts.push(V3(c.c.x+Math.cos(a)*c.r, c.c.y+Math.sin(a)*c.r, c.z));
    }
    const nx=circles[(i+1)%n], a2=ua[i];
    const p1=V3(c.c.x+Math.cos(a2)*c.r, c.c.y+Math.sin(a2)*c.r, c.z);
    const p2=V3(nx.c.x+Math.cos(a2)*nx.r, nx.c.y+Math.sin(a2)*nx.r, nx.z);
    for(let k=1;k<=3;k++) pts.push(p1.clone().lerp(p2,k/4));
  }
  // 等距重采样
  let total=0; const seg=[];
  for(let i=0;i<pts.length;i++){ const a=pts[i],b=pts[(i+1)%pts.length]; const l=a.distanceTo(b); seg.push(l); total+=l; }
  const cnt=Math.max(24,Math.round(total/link)), out=[];
  const step=total/cnt; let idx=0, acc=0, cur=0;
  for(let i=0;i<cnt;i++){
    const target=i*step;
    while(cur+seg[idx]<target && idx<seg.length-1){ cur+=seg[idx]; idx++; }
    const f=(target-cur)/Math.max(seg[idx],1e-6);
    out.push(pts[idx].clone().lerp(pts[(idx+1)%pts.length],clamp(f,0,1)));
  }
  return out;
}
function buildChain(){
  const rR=G.ringR[G.ringIdx], rZ=G.ringZ[G.ringIdx];
  const circles=[
    {c:{x:G.bb.x,y:G.bb.y},r:rR+mm(1.6),z:rZ},
    {c:{x:-G.cogC.x+2*G.bb.x,y:G.cogC.y},r:G.curCogR+mm(1.6),z:G.cogC.z},
    {c:{x:-G.gp.x+2*G.bb.x,y:G.gp.y},r:mm(12.6),z:G.gp.z},
    {c:{x:-G.tp.x+2*G.bb.x,y:G.tp.y},r:mm(12.6),z:G.tp.z}
  ];
  const pts=chainLoop(circles,mm(12.7)).map(p=>V3(-p.x+2*G.bb.x,p.y,p.z));
  chainPath=pts; chainCount=pts.length;
  const lg=new T.BoxGeometry(1,1,1);
  chainMesh=new T.InstancedMesh(lg,M.chain,chainCount); DISPOSE.push(lg);
  chainMesh.userData.bike=1;
  reg(chainMesh,V3(0,.3,1).normalize(),.16,5);
  updateChainMesh(0);
  LABELS.push({n:'Chain',p:G.bb.clone().lerp(G.rearAxle,.5).add(V3(0,mm(70),mm(50)))});
}
const _cq=new T.Quaternion(), _cm=new T.Matrix4();
function updateChainMesh(off){
  if(!chainMesh||!chainPath) return;
  const n=chainCount;
  for(let i=0;i<n;i++){
    const f=(i+off)%n, i0=Math.floor(f), fr=f-i0;
    const a=chainPath[i0], b=chainPath[(i0+1)%n];
    const p=a.clone().lerp(b,fr);
    const dir=b.clone().sub(a).normalize();
    _cq.setFromUnitVectors(V3(1,0,0),dir);
    _cm.compose(p,_cq,_sc.set(mm(11.6),mm(7.2),(i%2)?mm(6.4):mm(3.6)));
    chainMesh.setMatrixAt(i,_cm);
  }
  chainMesh.instanceMatrix.needsUpdate=true;
}
/* ---- 五金螺栓（实例化） ---- */
function buildBolts(){
  if(!BOLTS.length) return;
  const g=cylG(6,1);
  boltMesh=new T.InstancedMesh(g,M.steel,BOLTS.length);
  const qz=new T.Quaternion().setFromAxisAngle(V3(1,0,0),PI/2);
  const qx=new T.Quaternion().setFromAxisAngle(V3(0,0,1),PI/2);
  const qax=new T.Quaternion().setFromUnitVectors(V3(0,1,0),G.axisUp);
  const qst=new T.Quaternion().setFromUnitVectors(V3(0,1,0),G.stemDir);

  kb.add(cylG(12,1),_m4.compose(V3(0,0,0),_q.setFromAxisAngle(V3(1,0,0),PI/2),_sc.set(.008,pitch*n+.01,.008)));

  stand.add(ca); standParts.push(ca);
  // 后拨（导轮水平移动）
  const rd=new T.Group(); rd.layers.enable(2);
  const rb=new Builder();
  rb.box(V3(0,.014,0),.026,.052,.014);

    rb.add(cylG(10,1),_m4.compose(p,_q.setFromAxisAngle(V3(1,0,0),PI/2),_sc.set(.0125,.006,.0125)));

  rb.boxQ(V3(-.010,-.028,.008),.010,.062,.003,new T.Quaternion().setFromAxisAngle(V3(0,0,1),.35));
  rb.boxQ(V3(-.010,-.028,-.008),.010,.062,.003,new T.Quaternion().setFromAxisAngle(V3(0,0,1),.35));
  const rm=new T.Mesh(rb.build(),M.steel); sDispose.push(rm.geometry); rm.layers.enable(2); rd.add(rm);
  rd.position.set(CC.x+.012,CC.y-cogR[0]-.030,0);

    crank:cr,cass:ca,rd:rd,links:links,path:null,cnt:0,gear:Math.min(3,n),gz:0,gr:cogR[0],
    lerpZ:cogZ(Math.min(3,n)-1),lerpR:cogR[Math.min(3,n)-1],off:0,ang:0};
  BENCH.gear=Math.min(3,n);
  updateBenchPath(true);

let BENCH=null;
function updateBenchPath(force){
  const b=BENCH; if(!b) return;
  const idx=b.n-b.gear;                        // gear1 = 最大齿
  const tz=b.cogZ(idx), tr=b.cogR[idx];
  b.lerpZ=force?tz:lerp(b.lerpZ,tz,.16);
  b.lerpR=force?tr:lerp(b.lerpR,tr,.16);
  const gp=V3(b.CC.x+.012,b.CC.y-b.lerpR-.030,b.lerpZ);
  const tp=gp.clone().add(V3(-.020,-.056,0));
  b.rd.position.set(gp.x,gp.y,b.lerpZ);
  const circles=[
    {c:{x:b.RC.x,y:b.RC.y},r:b.ringR+.0016,z:0},
    {c:{x:b.CC.x,y:b.CC.y},r:b.lerpR+.0016,z:b.lerpZ},
    {c:{x:gp.x,y:gp.y},r:.0135,z:b.lerpZ},
    {c:{x:tp.x,y:tp.y},r:.0135,z:b.lerpZ}
  ];
  b.path=chainLoop(circles,.0127); b.cnt=b.path.length;
  updateBenchLinks();
}
function updateBenchLinks(){
  const b=BENCH; if(!b||!b.path) return;
  const n=Math.min(b.cnt,120), q=new T.Quaternion(), m=new T.Matrix4();
  for(let i=0;i<120;i++){
    if(i>=n){ m.compose(V3(0,-9,0),q,_sc.set(.0001,.0001,.0001)); b.links.setMatrixAt(i,m); continue; }
    const f=(i+b.off)%n, i0=Math.floor(f), fr=f-i0;
    const a=b.path[i0], c=b.path[(i0+1)%n];
    const p=a.clone().lerp(c,fr), dir=c.clone().sub(a).normalize();
    q.setFromUnitVectors(V3(1,0,0),dir);
    m.compose(p,q,_sc.set(.0116,.0072,(i%2)?.0064:.0036));
    b.links.setMatrixAt(i,m);
  }
  b.links.instanceMatrix.needsUpdate=true;
}
function shift(d){
  const b=BENCH; if(!b) return;
  b.gear=clamp(b.gear+d,1,b.n); updateGearTxt();
}
function updateGearTxt(){
  if(!BENCH) return;
  document.getElementById('gearTxt').textContent='Gear: '+BENCH.gear+'/'+BENCH.n;
}

function weights(){
  const R=G.R, dens=G.matDens, wall=G.wall;
  const tubeLen = G.htLen + G.ttSeat.distanceTo(G.ttHead) + G.bb.distanceTo(G.dtHead)
    + G.stLen + 2*(G.bb.distanceTo(G.rearAxle)*1.06) + 2*(G.rearAxle.distanceTo(G.ssJ)*1.04);
  const avgR=(R.tt+R.dt+R.st+R.ht1+R.ss+R.cs)/6;
  const frame = tubeLen*TAU*avgR*wall*dens*1000 + 300;
  const fork  = (G.a2c*2.1)*TAU*mm(12)*wall*dens*1000 + (S.tubeset===2?150:210);
  const rimC  = PI*G.bsd, rimW = rimC*(0.26+S.rimDepth*0.0042)*1000*0.30;
  const spk   = S.spokes*5.6, hubW=[240,320];
  const tireW = 3.9*S.tireWidth*(G.bsd/0.622), tubeW=95;
  const cass  = G.cogs.reduce((a,t)=>a+t*0.92+5,0)+42;
  const rings = G.ringT.reduce((a,t)=>a+t*0.42+26,0);
  const crank = 430+(S.crankLen-165)*1.6+(S.tubeset===2?-40:0);
  const chain = chainCount*2.55;
  const bar   = 165+(S.barWidth-380)*0.34+S.barDrop*0.12;
  const stem  = 88+(S.stemLen-90)*0.62;
  const post  = 145+G.postExt*1000*0.52;
  const rot   = 2*(78+(S.rotor-140)*0.62);
  const brk   = 2*128+290;
  const der   = 235+(S.speeds-9)*7 + (S.rings>0?92:0);
  const parts=[
    ['Frame',frame,'#1fb2c6'],['Fork',fork,'#7bd6e6'],
    ['Wheels',2*rimW+spk*2+hubW[0]+hubW[1]+2*tireW+2*tubeW,'#ffcf5c'],
    ['Drivetrain',cass+rings+crank+chain+der+300,'#ff8a5c'],
    ['Cockpit',bar+stem+post+220+95+110+100,'#a99bff'],
    ['Brakes',rot+brk,'#7de3a8']
  ];
  const total=parts.reduce((a,p)=>a+p[1],0);
  return {parts:parts,total:total};
}
function fmt(v,d){ return (Math.round(v*Math.pow(10,d||0))/Math.pow(10,d||0)).toFixed(d||0); }

  rows.forEach(r=>{ h+= r[1]===null? '<h4>'+r[0]+'</h4>' :

      if(it.t==='pal'){ h+='<div class="btns">'+Object.keys(PALETTES).map(p=>'<button class="tiny" data-pal="'+p+'">'+p+'</button>').join('')+'</div>'; return; }
      if(it.t==='cols'){ h+='<div class="sw">'+COLORKEYS.map(c=>
        '<label title="'+c[1]+'"><span style="background:'+S[c[0]]+'" data-prev="'+c[0]+'"></span><input type="color" value="'+S[c[0]]+'" data-col="'+c[0]+'"><u>'+c[1].slice(0,3)+'</u></label>').join('')+'</div>'; return; }
      if(it.t==='tg'){ h+='<div class="tg"><span>'+it.l+'</span><button class="tiny'+(S[it.k]?' on':'')+'" data-tg="'+it.k+'">'+(S[it.k]?'ON':'OFF')+'</button></div>'; return; }
      if(it.t==='seg'){ h+='<div class="row"><div class="rlab"><span>'+it.l+'</span></div><div class="seg" data-seg="'+it.k+'">'+
        it.o.map(o=>'<button class="tiny'+(S[it.k]===o.v?' on':'')+'" data-v="'+o.v+'">'+o.l+'</button>').join('')+'</div></div>'; return; }
      h+='<div class="row"><div class="rlab"><span>'+it.l+'</span><b data-out="'+it.k+'">'+S[it.k]+(it.u||'')+'</b></div>'+
         '<input type="range" data-k="'+it.k+'" min="'+it.min+'" max="'+it.max+'" step="'+it.step+'" value="'+S[it.k]+'"></div>';
    });
    h+='</div></div>';
  });
  groupsEl.innerHTML=h;
  groupsEl.querySelectorAll('.ghd').forEach(e=>e.onclick=()=>e.parentNode.classList.toggle('cl'));
  groupsEl.querySelectorAll('input[type=range]').forEach(inp=>{
    inp.addEventListener('input',()=>{ setVal(inp.dataset.k,parseFloat(inp.value)); });
  });
  groupsEl.querySelectorAll('[data-seg]').forEach(sg=>{
    sg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      setVal(sg.dataset.seg,parseFloat(b.dataset.v));
      sg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    });
  });
  groupsEl.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.tg; S[k]=S[k]?0:1; b.classList.toggle('on',!!S[k]);
    b.textContent=S[k]?'ON':'OFF'; afterSet(k);
  });
  groupsEl.querySelectorAll('[data-col]').forEach(inp=>{
    inp.addEventListener('input',()=>{
      S[inp.dataset.col]=inp.value;
      const pv=groupsEl.querySelector('[data-prev="'+inp.dataset.col+'"]');
      if(pv) pv.style.background=inp.value;
      applyColors();
    });
  });
  groupsEl.querySelectorAll('[data-pal]').forEach(b=>b.onclick=()=>applyPalette(b.dataset.pal));
  groupsEl.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>action(b.dataset.act));
}
function findItem(k){ for(const g of PARAMS) for(const it of g.items) if(it.k===k) return it; return null; }
function setVal(k,v){
  S[k]=v;
  const it=findItem(k), out=groupsEl.querySelector('[data-out="'+k+'"]');
  if(out) out.textContent=(it&&it.step<1?v.toFixed(String(it.step).split('.')[1].length):v)+(it&&it.u?it.u:'');
  afterSet(k);
}
function refreshUI(){
  PARAMS.forEach(g=>g.items.forEach(it=>{
    if(!it.k) return;
    const inp=groupsEl.querySelector('input[data-k="'+it.k+'"]');
    if(inp){ inp.value=S[it.k];
      const out=groupsEl.querySelector('[data-out="'+it.k+'"]');
      if(out) out.textContent=(it.step<1?Number(S[it.k]).toFixed(String(it.step).split('.')[1].length):S[it.k])+(it.u||''); }
    const sg=groupsEl.querySelector('[data-seg="'+it.k+'"]');
    if(sg) sg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',parseFloat(b.dataset.v)===S[it.k]));
    const tg=groupsEl.querySelector('[data-tg="'+it.k+'"]');
    if(tg){ tg.classList.toggle('on',!!S[it.k]); tg.textContent=S[it.k]?'ON':'OFF'; }
  }));
  COLORKEYS.forEach(c=>{
    const inp=groupsEl.querySelector('[data-col="'+c[0]+'"]');
    if(inp) inp.value=S[c[0]];
    const pv=groupsEl.querySelector('[data-prev="'+c[0]+'"]');
    if(pv) pv.style.background=S[c[0]];
  });
}
let dirtyGeo=false, expT=0, expTarget=0;
function afterSet(k){
  const it=findItem(k), d=it?it.d:0;
  // 动态区间约束
  if(k==='speeds'){ const inp=groupsEl.querySelector('input[data-k="rearGear"]');
    if(inp){ inp.max=S.speeds; if(S.rearGear>S.speeds) setVal('rearGear',S.speeds); } }
  if(k==='rings'){ const inp=groupsEl.querySelector('input[data-k="frontGear"]');
    if(inp){ inp.max=S.rings+1; if(S.frontGear>S.rings+1) setVal('frontGear',S.rings+1); } }
  if(k==='maxCog'&&S.maxCog<14) S.maxCog=14;
  if(k==='explode'){ expTarget=S.explode/100; return; }
  if(k==='labels'){ document.getElementById('labels').style.display=S.labels?'':'none'; return; }
  if(k==='benchMotor'||k==='benchRpm'){
    document.getElementById('motor').classList.toggle('on',!!S.benchMotor);
    document.getElementById('motor').textContent=S.benchMotor?'❚❚ Motor':'▶ Motor';
    document.getElementById('rpm').value=S.benchRpm; return;
  }
  if(d===1) dirtyGeo=true;
  else if(d===2) applyStyle();
  else if(d===3) applyColors();
  else if(d===4) buildStand();
  if(d!==1) updateSpecs();
}
function applyColors(){
  M.frame.uniforms.uColor.value.set(S.cFrame); M.frame.uniforms.uFinish.value=S.frameFin;
  M.fork.uniforms.uColor.value.set(S.cFork);   M.fork.uniforms.uFinish.value=S.forkFin;
  M.rim.uniforms.uColor.value.set(S.cRim);     M.rim.uniforms.uFinish.value=S.rimFin;
  M.drive.uniforms.uColor.value.set(S.cDrive); M.drive.uniforms.uFinish.value=S.driveFin;
  M.cock.uniforms.uColor.value.set(S.cCock);
  M.saddle.uniforms.uColor.value.set(S.cSaddle);
  M.tape.uniforms.uColor.value.set(S.cSaddle);
  M.tire.uniforms.uColor.value.set(S.cTire);
  M.acc.uniforms.uColor.value.set(S.cAcc);
  [M.frame,M.fork,M.rim,M.drive].forEach(m=>{ m.uniforms.uSpec.value=m.uniforms.uFinish.value>1.5?.7:.38; });
}
function applyPalette(name){
  const p=PALETTES[name]; if(!p) return;
  Object.keys(p).forEach(k=>S[k]=p[k]);
  applyColors(); refreshUI(); updateSpecs();
}
function applyStyle(){
  U.bands.value=S.bands; U.shadeMin.value=S.shadeMin; U.rim.value=S.rimlt;
  const bg=BGS[S.bg];
  U.spec.value.set(bg.spec); U.rimC.value.set(bg.rim);
  MATS.forEach(m=>{ if(m.uniforms.uRim) m.uniforms.uRim.value=S.rimlt*(m.userData.rimScale||1); });
  M.floor.uniforms.uColor.value.set(bg.floor);
  M.wall.uniforms.uColor.value.set(bg.wall);
  compMat.uniforms.uEdge.value=S.edge;
  compMat.uniforms.uThick.value=S.thick;
  compMat.uniforms.uPost.value=S.poster;
  compMat.uniforms.uPix.value=S.pixel;
  compMat.uniforms.uHatch.value=S.hatch;
  compMat.uniforms.uInk.value.set(bg.ink);
  clearCol.set(bg.sky);
  const az=S.lightAz*D2R, el=S.lightEl*D2R;
  U.light.value.set(Math.cos(az)*Math.cos(el),Math.sin(el),Math.sin(az)*Math.cos(el)).normalize();
}
function action(a){
  if(a==='asm0'){ setVal('explode',0); syncRange('explode'); }
  else if(a==='asm1'){ setVal('explode',100); syncRange('explode'); }
  else if(a==='asmH'){ setVal('explode',50); syncRange('explode'); }
  else if(a==='reset'){
    Object.keys(DEFAULTS).forEach(k=>S[k]=DEFAULTS[k]);
    refreshUI(); initDynamic(); applyColors(); applyStyle(); buildStand();
    expTarget=0; dirtyGeo=true;
    camTo(CAMS[1]);
  }
}
function syncRange(k){ const i=groupsEl.querySelector('input[data-k="'+k+'"]'); if(i) i.value=S[k]; }

/* ---------------- 相机预设 / 标签 ---------------- */
const CAMS=[
  {n:'Side',p:[.18,.72,3.05],t:[.18,.66,0]},
  {n:'3/4',p:[2.35,1.16,2.55],t:[.12,.62,0]},
  {n:'Drivetrain',p:[.30,.34,.92],t:[-.13,.24,.04]},
  {n:'Cockpit',p:[1.22,1.10,.78],t:[.62,.84,0]},
  {n:'Front End',p:[2.05,.62,.62],t:[.72,.46,0]},
  {n:'Gear Bench',p:[-1.35,1.32,-.35],t:[-2.02,1.05,-1.5]}
];
let camAnim=null;
function camTo(c){
  camAnim={p0:camera.position.clone(),t0:controls.target.clone(),
    p1:V3(c.p[0],c.p[1],c.p[2]),t1:V3(c.t[0],c.t[1],c.t[2]),k:0};
}
document.getElementById('cams').innerHTML=CAMS.map((c,i)=>'<button class="tiny" data-cam="'+i+'">'+(i+1)+'. '+c.n+'</button>').join('');
document.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>camTo(CAMS[+b.dataset.cam]));
addEventListener('keydown',e=>{
  const n=parseInt(e.key,10);
  if(n>=1&&n<=CAMS.length) camTo(CAMS[n-1]);
  if(e.key==='e'||e.key==='E'){ setVal('explode',S.explode>50?0:100); syncRange('explode'); }
  if(e.key==='o'||e.key==='O'){ setOrbit(!S.orbit); }
});
canvas.addEventListener('pointerdown',()=>{ camAnim=null; });
/* ---------------- 空镜录制：自动环绕跟随 ---------------- */
let orbitInit=false, orbitAz=0, orbitR=1, orbitPh=0;
function orbitCam(dt){
  if(!orbitInit){
    const o=camera.position.clone().sub(controls.target);
    orbitR=o.length()||1; orbitPh=Math.asin(clamp(o.y/orbitR,-1,1)); orbitAz=Math.atan2(o.x,o.z);
    orbitInit=true;
  }
  orbitAz += S.orbitSpeed*dt*Math.PI/180;
  const t=controls.target;
  camera.position.set(
    t.x+orbitR*Math.cos(orbitPh)*Math.sin(orbitAz),
    t.y+orbitR*Math.sin(orbitPh),
    t.z+orbitR*Math.cos(orbitPh)*Math.cos(orbitAz));
  camera.lookAt(t);
}
function setOrbit(v){
  S.orbit=!!v;
  controls.enabled=!S.orbit;                 // 空镜期间禁用手拖/缩放，防止镜头被误触打乱
  if(S.orbit){ orbitInit=false; camAnim=null; }
  const b=document.getElementById('tglO'); if(b) b.classList.toggle('on',S.orbit);
  /* 空镜清场：环绕期间收起左右面板与展示台（录制干净画面），停止时还原 */
  ['panelL','panelR','stand'].forEach(id=>{
    const el=document.getElementById(id); if(!el) return;
    if(S.orbit){
      if(el.dataset.prevHide===undefined) el.dataset.prevHide=el.classList.contains('hide')?'1':'0';
      el.classList.add('hide');
    } else {
      if(el.dataset.prevHide==='0') el.classList.remove('hide');
      delete el.dataset.prevHide;
    }
  });
}
const orbitBtn=document.getElementById('tglO'); if(orbitBtn) orbitBtn.onclick=()=>setOrbit(!S.orbit);
const labelsEl=document.getElementById('labels');
let labelDivs=[];
function syncLabels(){
  labelsEl.innerHTML='';
  labelDivs=LABELS.filter(l=>l.n).map(l=>{
    const d=document.createElement('div'); d.className='lab';
    d.innerHTML='<i></i>'+l.n; labelsEl.appendChild(d); return {d:d,p:l.p};
  });
}
const _pv=V3();
function drawLabels(){
  if(!S.labels){ return; }
  const w=innerWidth/2,h=innerHeight/2;
  for(const L of labelDivs){
    _pv.copy(L.p).project(camera);
    const vis=_pv.z<1&&_pv.z>-1;
    L.d.style.display=vis?'':'none';
    if(vis){ L.d.style.left=(_pv.x*w+w)+'px'; L.d.style.top=(-_pv.y*h+h)+'px';
      L.d.style.opacity=String(clamp(1.35-_pv.z*1.2,.25,1)); }
  }
}

/* ------------- 顶栏 / 展示台按钮 ------------- */
function tgl(btn,pane){ const b=document.getElementById(btn),p=document.getElementById(pane);
  b.onclick=()=>{ p.classList.toggle('hide'); b.classList.toggle('on'); }; }
tgl('tglL','panelL'); tgl('tglR','panelR'); tgl('tglS','stand');
document.getElementById('motor').onclick=()=>{ S.benchMotor=S.benchMotor?0:1; afterSet('benchMotor'); refreshUI(); };
document.getElementById('up').onclick=()=>shift(1);
document.getElementById('dn').onclick=()=>shift(-1);
document.getElementById('rpm').addEventListener('input',e=>{ S.benchRpm=parseFloat(e.target.value); refreshUI(); });

/* =========================== 12. 渲染循环 ============================= */
const clearCol=new T.Color(BGS[0].sky), ndClear=new T.Color(.5,.5,1);
let W=1,H=1;
function resize(){
  W=innerWidth; H=innerHeight;
  renderer.setSize(W,H,false);
  camera.aspect=W/H; camera.updateProjectionMatrix();
  const pr=renderer.getPixelRatio();
  rtCol.setSize(Math.floor(W*pr),Math.floor(H*pr));
  rtND.setSize(Math.floor(W*pr),Math.floor(H*pr));
  compMat.uniforms.uTexel.value.set(1/(W*pr),1/(H*pr));
}
addEventListener('resize',resize);
function insetRect(){
  const el=document.getElementById('standView');
  const st=document.getElementById('stand');
  if(st.classList.contains('hide')) return null;
  const r=el.getBoundingClientRect();
  if(r.width<20||r.height<20) return null;
  const pr=renderer.getPixelRatio();
  return {x:Math.floor(r.left*pr),y:Math.floor((H-r.bottom)*pr),
          w:Math.floor(r.width*pr),h:Math.floor(r.height*pr)};
}
function renderScene(rt,mat,clr,alpha){
  scene.overrideMaterial=mat;
  renderer.setClearColor(clr,alpha);
  rt.scissorTest=false; rt.viewport.set(0,0,rt.width,rt.height); rt.scissor.set(0,0,rt.width,rt.height);
  renderer.setRenderTarget(rt);
  renderer.autoClear=true;
  renderer.render(scene,camera);
  const ir=insetRect();
  if(ir){
    rt.viewport.set(ir.x,ir.y,ir.w,ir.h); rt.scissor.set(ir.x,ir.y,ir.w,ir.h); rt.scissorTest=true;
    renderer.setRenderTarget(rt);
    renderer.autoClear=false;
    renderer.clear(true,true,false);
    insetCam.aspect=ir.w/ir.h; insetCam.updateProjectionMatrix();
    renderer.render(scene,insetCam);
    renderer.autoClear=true;
    rt.scissorTest=false; rt.viewport.set(0,0,rt.width,rt.height); rt.scissor.set(0,0,rt.width,rt.height);
  }
  scene.overrideMaterial=null;
}
let spinAng=0, benchAng=0, t0=performance.now();
function frame(){
  requestAnimationFrame(frame);
  const now=performance.now(), dt=Math.min(.05,(now-t0)/1000); t0=now;
  if(dirtyGeo){ dirtyGeo=false; rebuild(); }
  // 分解插值（可逆、平滑、末端精确归位）
  if(Math.abs(expT-expTarget)>1e-4){ expT=lerp(expT,expTarget,1-Math.pow(.001,dt)); applyExplode(expT); }
  else if(expT!==expTarget){ expT=expTarget; applyExplode(expT); }
  // 传动旋转
  if(S.spin){
    const rot=dt*1.9;
    spinAng+=rot;
    if(wheelF) wheelF.rotation.z=-spinAng;
    if(wheelR) wheelR.rotation.z=-spinAng;
    const ratio=G.ringT[G.ringIdx]/G.cogs[G.rearIdx];
    const crankRot=-spinAng/Math.max(ratio,.1);
    if(crankG){ crankG.rotation.z=crankRot;
      if(pedR) pedR.rotation.z=-crankRot; if(pedL) pedL.rotation.z=-crankRot; }
    updateChainMesh((spinAng*(G.curCogR||.03)/mm(12.7))%chainCount);
  }
  // 展示台
  if(BENCH){
    const b=BENCH;
    const idx=b.n-b.gear;
    if(Math.abs(b.lerpZ-b.cogZ(idx))>1e-5||Math.abs(b.lerpR-b.cogR[idx])>1e-5) updateBenchPath(false);
    if(S.benchMotor){
      const w=S.benchRpm*2.2;
      benchAng+=dt*w;
      b.crank.rotation.z=-benchAng;
      b.cass.rotation.z=-benchAng*(b.ringT/b.teeth[idx]);
      b.off=(b.off + dt*w*b.ringR/.0127)%Math.max(b.cnt,1);
      updateBenchLinks();
    }
    // 内嵌视口相机缓慢环绕
    const wc=stand.localToWorld(V3(0,.16,0));
    const a=now*0.00016;
    insetCam.position.set(wc.x+Math.cos(a)*.62,wc.y+.20,wc.z+Math.sin(a)*.62+.10);
    insetCam.lookAt(wc);
  }
  // 相机动画
  if(camAnim){
    camAnim.k=Math.min(1,camAnim.k+dt*1.7);
    const k=camAnim.k, e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(camAnim.p0,camAnim.p1,e);
    controls.target.lerpVectors(camAnim.t0,camAnim.t1,e);
    if(k>=1) camAnim=null;
  }
  if(S.orbit){ orbitCam(dt); } else { controls.autoRotate=false; }
  controls.update();
  // 阴影跟随
  if(shadowF&&wheelF){ shadowF.position.x=wheelF.position.x; shadowF.scale.setScalar(G.wheelR*.92); }
  if(shadowR&&wheelR){ shadowR.position.x=wheelR.position.x; shadowR.scale.setScalar(G.wheelR*.92); }
  // 渲染：颜色 → 法线深度 → 合成
  renderScene(rtCol,null,clearCol,1);
  for(const o of noEdge) o.visible=false;
  renderScene(rtND,ndMat,ndClear,60);
  for(const o of noEdge) o.visible=true;
  renderer.setRenderTarget(null);
  renderer.setClearColor(clearCol,1);
  renderer.autoClear=true;
  renderer.render(fsScene,fsCam);
  drawLabels();
}

/* ============================== 启动 ================================= */
function initDynamic(){
  const a=groupsEl.querySelector('input[data-k="rearGear"]');
  if(a){ a.max=S.speeds; if(S.rearGear>S.speeds) setVal('rearGear',S.speeds); }
  const b=groupsEl.querySelector('input[data-k="frontGear"]');
  if(b){ b.max=S.rings+1; if(S.frontGear>S.rings+1) setVal('frontGear',S.rings+1); }
}
buildUI(); initDynamic(); applyStyle(); applyColors();
buildShop(); buildStand(); rebuild(); resize();
document.getElementById('labels').style.display=S.labels?'':'none';
camTo(CAMS[1]);
window.__CF={S:S,G:()=>G,solve:solve,rebuild:rebuild,setVal:setVal,applyStyle:applyStyle,
  applyColors:applyColors,buildStand:buildStand,shift:shift,parts:()=>PARTS,scene:scene,
  chain:()=>chainPath,bench:()=>BENCH};
frame();
const bootEl=document.getElementById('boot');
bootEl.classList.add('out'); setTimeout(()=>bootEl.style.display='none',600);
}

/* ---------------------- CDN 加载（多镜像回退） ---------------------- */
(function(){
  var V='0.137.5';
  var BASES=['https://cdn.jsdelivr.net/npm/three@'+V+'/','https://unpkg.com/three@'+V+'/',
             'https://fastly.jsdelivr.net/npm/three@'+V+'/'];
  var FILES=['build/three.min.js','examples/js/controls/OrbitControls.js'];
  var msg=document.getElementById('bootMsg');
  function load(path,i){
    return new Promise(function(res,rej){
      if(i>=BASES.length){ rej(new Error(path)); return; }
      var s=document.createElement('script');
      s.src=BASES[i]+path; s.async=false;
      s.onload=function(){ res(); };
      s.onerror=function(){ s.remove(); load(path,i+1).then(res,rej); };
      document.head.appendChild(s);
    });
  }
  function chain(k){
    if(k>=FILES.length){
      msg.textContent='正在生成程序化几何…';
      try{ bootApp(); }
      catch(err){
        console.error(err);
        msg.innerHTML='初始化失败：<code>'+(err&&err.message?err.message:err)+'</code>';
      }
      return;
    }
    msg.textContent='加载 '+FILES[k].split('/').pop()+' …';
    load(FILES[k],0).then(function(){ chain(k+1); },function(){
      msg.innerHTML='无法从 CDN 加载 <code>'+FILES[k]+'</code>。<br>请检查网络后刷新页面。';
    });
  }
  chain(0);
})();
