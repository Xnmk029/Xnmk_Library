function buildCranks(g,FR,ds){
  g.position.set(FR.bb.x,FR.bb.y,0);
  const P=paint('drive'),Metl=M.metal;
  const L=mm(CFG.crankLen),phi=ds?0.70:0.70+Math.PI;
  const dir=V(Math.cos(phi),Math.sin(phi));
  const arm=new THREE.Mesh(G.get('arm'+L.toFixed(3),()=>new THREE.BoxGeometry(0.028,L,0.008)),P);
  arm.position.set(dir.x*L/2,dir.y*L/2,ds?0.011:-0.011);
  arm.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),l2v(dir));
  addMesh(g,arm);
  cyl(g,0.032,0.032,0.02,Metl,0,0,ds?0.011:-0.011,Math.PI/2);
  if(ds){
    cyl(g,0.048,0.048,0.008,P,0,0,0.014,Math.PI/2);
    const rr=ringRadii(CFG.rings),tt=ringTeeth(CFG.rings),nn=rr.length;
    for(let i=0;i<nn;i++){
      const geo=G.get('gr'+tt[i],()=>gearShape(rr[i],tt[i],rr[i]*0.3));
      const m=new THREE.Mesh(geo,P);
      m.position.set(0,0,0.020+i*0.0072);addMesh(g,m);
      for(let j=0;j<5;j++){
        const a=j*TAU/5,bm=new THREE.Mesh(G.get('rbolt',()=>new THREE.CylinderGeometry(0.0025,0.0025,0.007,6)),Metl);
        bm.rotation.x=Math.PI/2;
        bm.position.set(Math.cos(a)*rr[i]*0.68,Math.sin(a)*rr[i]*0.68,0.020+i*0.0072+0.002);
        addMesh(g,bm);
      }
    }
  }
  const end={x:dir.x*L,y:dir.y*L},pz=ds?0.013:-0.013,zout=ds?0.052:-0.052;
  cyl(g,0.0045,0.0045,0.045,Metl,end.x,end.y,(pz+zout)/2,Math.PI/2);
  box(g,0.095,0.022,0.052,P,end.x,end.y,zout+(ds?0.012:-0.012));
  cyl(g,0.005,0.005,0.008,Metl,end.x,end.y,zout+(ds?0.024:-0.024),Math.PI/2);
}
function buildChain(g,FR){
  const rr=ringRadii(CFG.rings);
  B.chainZ=0.020+(rr.length-1)*0.0072;
  const pts=chainPoints(CFG,FR);
  const curve=new THREE.CatmullRomCurve3(pts.map(l2v),true,'centripetal');
  B.chainLen=curve.getLength();
  const n=Math.max(60,Math.min(240,Math.round(curve.getLength()/0.015)));
  const im=new THREE.InstancedMesh(new THREE.BoxGeometry(0.0145,0.0032,0.0055),M.chain,n);
  im.frustumCulled=false;
  const p=new THREE.Vector3(),q=new THREE.Quaternion(),m4=new THREE.Matrix4(),s=new THREE.Vector3(1,1,1);
  const tan=new THREE.Vector3(),bin=new THREE.Vector3(),zA=new THREE.Vector3(0,0,1),basis=new THREE.Matrix4();
  for(let i=0;i<n;i++){
    const t=i/n;
    curve.getPoint(t,p);curve.getTangent(t,tan);
    bin.crossVectors(zA,tan).normalize();
    basis.makeBasis(tan,zA,bin);
    q.setFromRotationMatrix(basis);
    m4.compose(p,q,s);im.setMatrixAt(i,m4);
  }
  im.instanceMatrix.needsUpdate=true;addMesh(g,im);
}
function buildCassette(g,FR){
  g.position.set(0,RAD,0);
  const teeth=cogTeeth(CFG.speed),n=teeth.length;
  const rMax=cogMaxRadius(CFG.speed),rMin=0.0475;
  const totalW=0.016+CFG.speed*0.0023,z0=0.036;
  const sp=n>1?(totalW-0.004)/(n-1):0;
  const body=new THREE.Mesh(G.get('wh'+totalW.toFixed(3),()=>new THREE.CylinderGeometry(0.0165,0.0135,totalW+0.012,14)),M.metal);
  body.rotation.x=Math.PI/2;body.position.set(0,0,z0+0.006+totalW/2);addMesh(g,body);
  for(let i=0;i<n;i++){
    const r=rMax-(rMax-rMin)*(i/(n-1));
    const geo=G.get('gear'+teeth[i]+'_'+r.toFixed(3),()=>gearShape(r,teeth[i],r*0.32));
    const m=new THREE.Mesh(geo,M.steel);
    m.position.set(0,0,z0+i*sp);addMesh(g,m);
  }
  cyring(g,V(0,0,z0+totalW+0.004),V(0,0,1),0.0175,0.006,M.metal);
}

      }else{
        h+=`<div class="frow"><span class="lbl">${label}</span><input type="range" data-k="${k}" min="${f[2]}" max="${f[3]}" step="${f[4]}" value="${CFG[k]}"><span class="val" id="v${k}"></span></div>`;
        UI_CTRLS[k]={t:'range'};
      }
    }
    for(const [k,label] of sec.toggles||[]){
      h+=`<div class="frow"><span class="lbl">${label}</span><label class="switch"><input type="checkbox" data-k="${k}"${CFG[k]?' checked':''}><span class="sl"></span></label></div>`;
      UI_CTRLS[k]={t:'toggle'};
    }
    for(const [k,label] of sec.colors||[]){
      h+=`<div class="frow"><span class="lbl">${label}</span><input type="color" data-k="${k}" value="${CFG[k]}"></div>`;
      UI_CTRLS[k]={t:'color'};
    }
    if(sec.sel){
      const k=sec.sel[0],label=sec.sel[1];
      h+=`<div class="frow"><span class="lbl">${label}</span><select data-k="${k}">${sec.sel[2].map(o=>`<option value="${o[0]}"${CFG[k]==o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></div>`;
      UI_CTRLS[k]={t:'select'};
    }
    for(const [bt,val] of sec.btns||[])h+=`<button class="ctl" data-bt="${val}" style="margin:2px">${bt}</button>`;
    if(sec.spec)h+=`<table class="spec">
<tr><td>Stack</td><td id="spStack">-</td></tr><tr><td>Reach</td><td id="spReach">-</td></tr>
<tr><td>头管角</td><td id="spHTA">-</td></tr><tr><td>座管角</td><td id="spSTA">-</td></tr>
<tr><td>座管长</td><td id="spSTL">-</td></tr><tr><td>后下叉</td><td id="spCS">-</td></tr>
<tr><td>头管长</td><td id="spHTL">-</td></tr><tr><td>轴距 (计算)</td><td id="spWB">-</td></tr>
<tr><td>五通下沉量</td><td id="spDrop">-</td></tr><tr><td>座管高度</td><td id="spPost">-</td></tr>
<tr><td>坐垫前后</td><td id="spSaddle">-</td></tr><tr><td>车把 宽/抬升/外撇</td><td id="spBar">-</td></tr>
<tr><td>牙盘盘片</td><td id="spRings">-</td></tr><tr><td>曲柄长</td><td id="spCrank">-</td></tr>
<tr><td>飞轮齿数</td><td id="spCogs">-</td></tr><tr><td>链条长度</td><td id="spChain">-</td></tr>
<tr><td>传动配置</td><td id="spCfg">-</td></tr><tr><td>预估重量</td><td id="spWt" class="wt">-</td></tr></table><div id="spList"></div>`;
    h+='</div></details>';
  }
  ui.innerHTML=h;
  ui.addEventListener('input',onUI);
  ui.addEventListener('change',onUI);
  ui.addEventListener('click',ev=>{
    const b=ev.target.closest('[data-bt]');if(!b)return;
    const v=parseFloat(b.dataset.bt),sl=document.querySelector('[data-k="explode"]');
    if(sl)sl.value=v;CFG.explode=v;apply('explode',v);
  });
  for(const k in UI_CTRLS)syncUI(k);
}
function onUI(ev){
  const el=ev.target,k=el.dataset.k;if(!k||!UI_CTRLS[k])return;
  let v;
  if(el.type==='checkbox')v=el.checked;
  else if(el.type==='color')v=el.value;
  else if(el.tagName==='SELECT')v=el.options[el.selectedIndex].value;
  else v=parseFloat(el.value);
  apply(k,v);
}
function syncUI(k){
  const c=UI_CTRLS[k],el=document.querySelector(`[data-k="${k}"]`);if(!c||!el)return;
  if(c.t==='range'){const v=document.getElementById('v'+k);if(v)v.textContent=k==='compact'?Math.round(CFG[k]*100)+'%':CFG[k]}
  else if(c.t==='toggle')el.checked=!!CFG[k];
  else if(c.t==='color')el.value=CFG[k];
  else if(c.t==='select')el.value=String(CFG[k]);
}
function apply(k,v){
  if(k==='explode'){CFG.explode=v;DIRTY.explode=true;updateAll();return}
  if(k==='outline'){CFG.outline=!!v;DIRTY.outline=true;updateAll();return}
  if(k==='poster'){CFG.poster=!!v;DIRTY.poster=true;updateAll();return}
  if(k==='showLabels'){CFG.showLabels=!!v;DIRTY.labels=true;updateAll();return}
  if(k==='toonSteps'){CFG.toonSteps=+v;MM.clear();DIRTY.geom=true;updateAll();return}
  CFG[k]=typeof BASE[k]==='number'?+v:(typeof BASE[k]==='boolean'?!!v:v);DIRTY.geom=true;updateAll();
  syncUI(k);
}
// ================= camera presets / reset / fold =================
const PRESETS={
  side:{pos:V(0.45,0.55,3.4),tgt:V(0.45,0.42,0)},
  drive:{pos:V(0.66,0.42,1.32),tgt:V(0.36,0.34,0.00)},
  cockpit:{pos:V(0.34,0.98,1.02),tgt:V(0.44,0.82,0)},
  front:{pos:V(1.70,0.50,0.01),tgt:V(0.62,0.45,0)},
  top:{pos:V(0.45,3.0,0.01),tgt:V(0.45,-0.15,0)},
  home:{pos:V(1.15,0.75,3.05),tgt:V(0.5,0.4,0)},
};
// camAnim declared in scene section
function goPreset(name){
  const pr=PRESETS[name];if(!pr||!controls)return;
  camAnim={sp:camera.position.clone(),st:controls.target.clone(),ep:l2v(pr.pos),et:l2v(pr.tgt),t:0};
}
function bindTop(){
  const b=id=>document.getElementById(id);
  b('btnPresetSide').onclick=()=>goPreset('side');
  b('btnPresetDrive').onclick=()=>goPreset('drive');
  b('btnPresetCockpit').onclick=()=>goPreset('cockpit');
  b('btnPresetFront').onclick=()=>goPreset('front');
  b('btnPresetTop').onclick=()=>goPreset('top');
  b('btnReset').onclick=()=>{
    Object.assign(CFG,JSON.parse(JSON.stringify(BASE)));
    for(const k in UI_CTRLS)syncUI(k);
    DIRTY.geom=DIRTY.outline=DIRTY.labels=DIRTY.poster=DIRTY.explode=true;
    updateAll();goPreset('home');
  };
  b('btnFold').onclick=()=>{
    const ui=document.getElementById('ui');
    ui.classList.toggle('hidden');
    b('btnFold').textContent=ui.classList.contains('hidden')?'UI 展开':'UI 折叠';
  };
}
// ================= main loop =================
let last=0;
function tick(tm){
  requestAnimationFrame(tick);
  const dt=tm?Math.min(0.05,(tm-last)/1000):0.016;last=tm||0;
  if(controls)controls.update();
  if(camAnim){
    camAnim.t=Math.min(1,camAnim.t+dt*1.6);
    const u=camAnim.t,k=u*u*(3-2*u);
    camera.position.lerpVectors(camAnim.sp,camAnim.ep,k);
    controls.target.lerpVectors(camAnim.st,camAnim.et,k);
    if(u>=1)camAnim=null;
  }
  if(composer)composer.render();
  else if(renderer)renderer.render(scene,camera);
  if(labelRenderer)labelRenderer.render(scene,camera);
}
function onResize(){
  const w=window.innerWidth,h=window.innerHeight;
  camera.aspect=w/h;camera.updateProjectionMatrix();
  if(renderer){renderer.setSize(w,h);if(composer)composer.setSize(w,h)}
  if(labelRenderer)labelRenderer.setSize(w,h);
}
function init(){
  buildUI();
  buildAll();
  updateAll();
  bindTop();
  window.addEventListener('resize',onResize);
  onResize();
  requestAnimationFrame(tick);
}
if(IS_BROWSER){if(document.readyState==='loading')window.addEventListener('DOMContentLoaded',init);else init()}
if(IS_BROWSER){
  window.addEventListener('error',e=>{
    const t=document.getElementById('toast');
    if(t){t.textContent='⚠ '+e.message;t.style.display='block';setTimeout(()=>{t.style.display='none'},5000)}
  });
}
export {CFG,framePoints,barPoints,chainPoints,ringTeeth,ringRadii,cogTeeth,cogMaxRadius,weightsBreakdown,fullReBuild,applyExplode,buildAll,updateAll,scene,groupRoot};
