<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FRAMEWORKS — Custom Bicycle Builder &amp; Assembly Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14161f;
    --paper:#f6f2e6;
    --paper2:#ece6d5;
    --accent:#ff4b32;
    --accent2:#1f7ae0;
    --ok:#18a558;
    --shadow:5px 5px 0 rgba(20,22,31,.9);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#b9d2e6;
    font-family:'Bai Jamjuree', system-ui, sans-serif; color:var(--ink);
    -webkit-font-smoothing:antialiased;}
  canvas#c{position:fixed;inset:0;display:block;width:100%;height:100%;image-rendering:pixelated;}
  .mono{font-family:'JetBrains Mono', ui-monospace, monospace;}

  /* ---------- panels ---------- */
  .panel{
    position:fixed;background:linear-gradient(180deg,rgba(246,242,230,.97),rgba(236,230,213,.95));
    border:2px solid var(--ink); box-shadow:var(--shadow); border-radius:3px;
    backdrop-filter:blur(3px);
  }
  #topbar{
    top:14px;left:50%;transform:translateX(-50%);padding:7px 18px;display:flex;align-items:center;gap:14px;z-index:20;
  }
  #topbar .logo{font-weight:700;font-size:17px;letter-spacing:2px;}
  #topbar .logo span{color:var(--accent)}
  #topbar .tag{font-size:10px;letter-spacing:1.5px;opacity:.65;border-left:2px solid var(--ink);padding-left:12px;text-transform:uppercase}
  #fps{font-size:10px;padding:2px 6px;border:1.5px solid var(--ink);background:var(--ink);color:#7ef7c0}

  #panel{top:66px;left:14px;bottom:70px;width:322px;display:flex;flex-direction:column;z-index:20;overflow:hidden}
  #panelHead{padding:8px 12px;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:var(--paper)}
  #panelHead b{font-size:11px;letter-spacing:2px}
  #panelBody{overflow-y:auto;overflow-x:hidden;padding:4px 0 14px 0;flex:1}
  #panelBody::-webkit-scrollbar{width:9px}
  #panelBody::-webkit-scrollbar-track{background:var(--paper2)}
  #panelBody::-webkit-scrollbar-thumb{background:var(--ink);border:2px solid var(--paper2)}

  .sec{border-bottom:1.5px dashed rgba(20,22,31,.32)}
  .sec>h3{margin:0;padding:9px 12px;font-size:11px;letter-spacing:1.8px;text-transform:uppercase;
    display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;background:rgba(20,22,31,.045)}
  .sec>h3:hover{background:rgba(255,75,50,.12)}
  .sec>h3 .dot{width:9px;height:9px;background:var(--accent);border:1.5px solid var(--ink);flex:none}
  .sec>h3 .arw{margin-left:auto;font-size:10px;transition:transform .18s}
  .sec.closed .arw{transform:rotate(-90deg)}
  .sec .body{padding:8px 12px 12px}
  .sec.closed .body{display:none}

  .ctrl{margin:0 0 9px}
  .ctrl .row{display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;letter-spacing:.6px;margin-bottom:3px;text-transform:uppercase}
  .ctrl .row b{font-family:'JetBrains Mono',monospace;font-size:11px;background:var(--ink);color:#ffe9a8;padding:1px 5px;font-weight:400;min-width:52px;text-align:right}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:ew-resize;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:6px;background:var(--paper2);border:1.5px solid var(--ink);}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:15px;background:var(--accent);border:1.5px solid var(--ink);margin-top:-6px;box-shadow:1.5px 1.5px 0 rgba(20,22,31,.55)}
  input[type=range]::-moz-range-track{height:6px;background:var(--paper2);border:1.5px solid var(--ink)}
  input[type=range]::-moz-range-thumb{width:11px;height:14px;border-radius:0;background:var(--accent);border:1.5px solid var(--ink)}

  .seg{display:flex;gap:4px;flex-wrap:wrap}
  .seg button{flex:1;min-width:34px;font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:5px 2px;background:var(--paper);
    border:1.5px solid var(--ink);cursor:pointer;transition:.12s;color:var(--ink)}
  .seg button:hover{background:#ffd9d1}
  .seg button.on{background:var(--ink);color:var(--paper)}
  .seg.acc button.on{background:var(--accent);color:#fff}

  .tog{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;cursor:pointer;margin:0 0 9px;user-select:none}
  .tog .sw{width:34px;height:17px;border:1.5px solid var(--ink);background:var(--paper2);position:relative;flex:none}
  .tog .sw:after{content:"";position:absolute;top:1px;left:1px;width:13px;height:11px;background:var(--ink);transition:.15s}
  .tog.on .sw{background:var(--ok)}
  .tog.on .sw:after{left:17px;background:#fff}

  .swatches{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
  .sw-btn{width:24px;height:24px;border:1.5px solid var(--ink);cursor:pointer;box-shadow:1.5px 1.5px 0 rgba(20,22,31,.5)}
  .sw-btn.on{outline:2px solid var(--accent);outline-offset:1px}
  .colorRow{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px}
  .colorRow input[type=color]{width:34px;height:22px;padding:0;border:1.5px solid var(--ink);background:none;cursor:pointer}
  .hint{font-size:9.5px;line-height:1.45;opacity:.6;margin:-2px 0 9px}

  /* ---------- specs ---------- */
  #specs{top:66px;right:14px;width:246px;z-index:20;padding:0;overflow:hidden}
  #specs h4{margin:0;padding:8px 12px;background:var(--ink);color:var(--paper);font-size:11px;letter-spacing:2px}
  #specList{padding:8px 12px 10px;max-height:calc(100vh - 260px);overflow-y:auto}
  #specList::-webkit-scrollbar{width:7px}
  #specList::-webkit-scrollbar-thumb{background:var(--ink)}
  .spec{display:flex;justify-content:space-between;font-size:10.5px;padding:2.5px 0;border-bottom:1px dotted rgba(20,22,31,.25);letter-spacing:.3px}
  .spec span{opacity:.72;text-transform:uppercase}
  .spec b{font-family:'JetBrains Mono',monospace;font-weight:400}
  .bigw{padding:10px 12px;border-top:2px solid var(--ink);background:var(--accent);color:#fff;display:flex;justify-content:space-between;align-items:flex-end}
  .bigw span{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;opacity:.9}
  .bigw b{font-family:'JetBrains Mono',monospace;font-size:24px;line-height:.95}
  .dtrain{padding:7px 12px;background:var(--ink);color:#7ef7c0;font-family:'JetBrains Mono',monospace;font-size:12px;display:flex;justify-content:space-between}

  /* ---------- bottom bar ---------- */
  #bottombar{bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:7px 9px;z-index:20;flex-wrap:wrap;justify-content:center;max-width:min(96vw,900px)}
  #bottombar .lbl{font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;opacity:.65;padding:0 4px}
  .btn{font-family:'Bai Jamjuree',sans-serif;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;padding:6px 10px;background:var(--paper);
    border:1.5px solid var(--ink);cursor:pointer;transition:.12s;box-shadow:2px 2px 0 rgba(20,22,31,.55)}
  .btn:hover{background:#ffd9d1;transform:translate(-1px,-1px);box-shadow:3px 3px 0 rgba(20,22,31,.6)}
  .btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(20,22,31,.6)}
  .btn.on{background:var(--ink);color:var(--paper)}
  .btn.red{background:var(--accent);color:#fff}
  #expWrap{display:flex;align-items:center;gap:7px;padding:0 6px;border-left:2px solid var(--ink);border-right:2px solid var(--ink)}
  #expWrap input{width:140px}

  #tip{position:fixed;pointer-events:none;z-index:40;background:var(--ink);color:var(--paper);font-family:'JetBrains Mono',monospace;
    font-size:11px;padding:4px 8px;border:1.5px solid #fff;opacity:0;transition:opacity .12s;transform:translate(12px,-50%);white-space:nowrap}
  #tip.on{opacity:1}

  #loader{position:fixed;inset:0;background:#e9e3d3;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s}
  #loader.hide{opacity:0;pointer-events:none}
  #loader .t{font-size:26px;letter-spacing:6px;font-weight:700}
  #loader .b{width:230px;height:12px;border:2px solid var(--ink);padding:2px}
  #loader .b i{display:block;height:100%;background:var(--accent);width:10%;transition:width .3s}
  #loader .s{font-size:10px;letter-spacing:2px;opacity:.6}

  .hiddenUI #panel,.hiddenUI #specs,.hiddenUI #topbar{opacity:0;pointer-events:none;transition:opacity .25s}
  @media (max-width:1180px){ #panel{width:280px} #specs{width:214px} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="loader">
  <div class="t">FRAME<span style="color:#ff4b32">WORKS</span></div>
  <div class="s mono">FABRICATING PROCEDURAL COMPONENTS…</div>
  <div class="b"><i id="ldbar"></i></div>
</div>

<header id="topbar" class="panel">
  <div class="logo">FRAME<span>WORKS</span></div>
  <div class="tag">Custom Bicycle Builder &amp; Assembly Simulator</div>
  <div id="fps" class="mono">-- fps</div>
</header>

<aside id="panel" class="panel">
  <div id="panelHead"><b>BUILD CONFIGURATOR</b><span class="mono" style="font-size:10px;opacity:.7">v1.0</span></div>
  <div id="panelBody"></div>
</aside>

<aside id="specs" class="panel">
  <h4>SPEC SHEET</h4>
  <div class="dtrain"><span id="sp-dt">2×11</span><span id="sp-gears" class="mono" style="opacity:.7">22 gears</span></div>
  <div id="specList"></div>
  <div class="bigw"><span>Est. weight</span><b id="sp-weight">8.42<small style="font-size:12px"> kg</small></b></div>
</aside>

<div id="bottombar" class="panel">
  <span class="lbl">View</span>
  <button class="btn" data-cam="three">3/4</button>
  <button class="btn" data-cam="side">Side</button>
  <button class="btn" data-cam="front">Front</button>
  <button class="btn" data-cam="cockpit">Cockpit</button>
  <button class="btn" data-cam="drive">Drivetrain</button>
  <div id="expWrap">
    <span class="lbl">Exploded</span>
    <input id="explodeSlider" type="range" min="0" max="100" step="1" value="0">
    <b class="mono" id="explodeVal" style="font-size:11px;min-width:34px">0%</b>
  </div>
  <button class="btn" id="btnSpin">Auto-spin</button>
  <button class="btn" id="btnUI">Hide UI</button>
  <button class="btn red" id="btnReset">Reset</button>
</div>

<div id="tip" class="mono"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =====================================================================
   0. PARAMETERS
   ===================================================================== */
const DEFAULTS = {
  // frame geometry (mm / deg)
  stack:565, reach:387, headAngle:71.5, seatAngle:73.5, seatTube:540, chainstay:415,
  compact:0.35, dropped:false,
  // drivetrain
  rings:2, cogs:11, crankLen:172.5,
  // fit / cockpit
  postExt:180, saddleFA:0, stemLen:100, barType:'drop', barWidth:420, barRise:14, barFlare:10,
  // wheels
  tire:28, rimDepth:40, spokes:24, showTube:false,
  // colours + finish
  frameColor:'#e8452c', frameFinish:'gloss',
  forkMatch:false, forkColor:'#1d2330', forkFinish:'carbon',
  rimColor:'#2b3448', driveColor:'#c8cdd8', driveFinish:'metal',
  accentColor:'#f3c14a',
  // render
  explode:0, pixel:3, poster:5, outline:0.95, dither:0.55, env:true
};
const P = Object.assign({}, DEFAULTS);
const mm = v => v/1000;
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const D2R = THREE.MathUtils.degToRad;

/* =====================================================================
   1. RENDERER / SCENE / CAMERA
   ===================================================================== */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:false, powerPreference:'high-performance', stencil:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#cfe1ef');
scene.fog = new THREE.Fog('#cfe1ef', 11, 34);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.05, 90);
camera.position.set(2.35, 1.24, -2.55);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.target.set(0, 0.72, 0);
controls.minDistance = 0.85;
controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI*0.495;
controls.update();

/* =====================================================================
   2. POST FX  — low-res target + toon ink / posterise / dither pass
   ===================================================================== */
let rt = null;
function makeRT(w,h){
  const t = new THREE.WebGLRenderTarget(w,h,{
    minFilter:THREE.NearestFilter, magFilter:THREE.NearestFilter,
    type:THREE.UnsignedByteType, depthBuffer:true, samples:0
  });
  t.texture.generateMipmaps = false;
  t.depthTexture = new THREE.DepthTexture(w,h);
  t.depthTexture.type = THREE.UnsignedIntType;
  t.depthTexture.minFilter = THREE.NearestFilter;
  t.depthTexture.magFilter = THREE.NearestFilter;
  return t;
}
const postMat = new THREE.ShaderMaterial({
  uniforms:{
    tDiffuse:{value:null}, tDepth:{value:null},
    res:{value:new THREE.Vector2(1,1)},
    poster:{value:P.poster}, outline:{value:P.outline}, dither:{value:P.dither},
    cNear:{value:camera.near}, cFar:{value:camera.far}
  },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
  fragmentShader:`
    precision highp float;
    uniform sampler2D tDiffuse, tDepth;
    uniform vec2 res; uniform float poster, outline, dither, cNear, cFar;
    varying vec2 vUv;
    float lin(vec2 uv){
      float z = texture2D(tDepth, uv).x;
      float ndc = z*2.0-1.0;
      float v = (2.0*cNear*cFar)/(cFar+cNear-ndc*(cFar-cNear));
      return clamp((v-cNear)/(cFar-cNear),0.0,1.0);
    }
    float luma(vec3 c){ return dot(c, vec3(0.299,0.587,0.114)); }
    float bayer2(vec2 a){ a=floor(a); return fract(a.x*0.5 + a.y*a.y*0.75); }
    float bayer4(vec2 a){ return bayer2(0.5*a)*0.25 + bayer2(a); }
    void main(){
      vec2 px = 1.0/res;
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      // --- depth + luminance edge detection (ink lines) ---
      float dc = lin(vUv);
      float dl = lin(vUv+vec2(-px.x,0.0)), dr = lin(vUv+vec2(px.x,0.0));
      float du = lin(vUv+vec2(0.0,px.y)),  dd = lin(vUv+vec2(0.0,-px.y));
      float dEdge = max(max(abs(dc-dl),abs(dc-dr)),max(abs(dc-du),abs(dc-dd)));
      dEdge = dEdge/(dc*0.55+0.0035);
      dEdge = smoothstep(0.55, 1.6, dEdge);
      float lc = luma(c);
      float ll = luma(texture2D(tDiffuse, vUv+vec2(-px.x,0.0)).rgb);
      float lr = luma(texture2D(tDiffuse, vUv+vec2(px.x,0.0)).rgb);
      float lu = luma(texture2D(tDiffuse, vUv+vec2(0.0,px.y)).rgb);
      float ld = luma(texture2D(tDiffuse, vUv+vec2(0.0,-px.y)).rgb);
      float lEdge = max(max(abs(lc-ll),abs(lc-lr)),max(abs(lc-lu),abs(lc-ld)));
      lEdge = smoothstep(0.17, 0.42, lEdge) * (1.0 - smoothstep(0.55,0.95,dc));
      float e = clamp(max(dEdge, lEdge*0.85),0.0,1.0) * outline;
      // --- posterise with ordered dither ---
      vec2 sp = vUv*res;
      float b = (bayer4(sp)-0.5)*dither;
      float lv = max(2.0, poster);
      vec3 q = floor(c*lv + b + 0.5)/lv;
      q = mix(c, q, 0.92);
      // gentle graphic contrast + warm/cool split tone
      q = clamp((q-0.5)*1.075 + 0.5, 0.0, 1.0);
      q += vec3(0.02,0.012,-0.01)*(1.0-luma(q));
      // ink
      vec3 ink = mix(vec3(0.07,0.075,0.11), q*0.28, 0.25);
      q = mix(q, ink, e);
      // soft vignette (kept light)
      vec2 v = (vUv-0.5)*vec2(1.0,0.92);
      q *= 1.0 - dot(v,v)*0.34;
      gl_FragColor = vec4(pow(clamp(q,0.0,1.0), vec3(0.4545)), 1.0);
    }`,
  depthTest:false, depthWrite:false
});
const quadScene = new THREE.Scene();
const quadCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
quadScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), postMat));

function resizeRT(){
  const w = innerWidth, h = innerHeight;
  const s = P.pixel<=1 ? Math.min(devicePixelRatio,1.6) : 1/P.pixel;
  const rw = Math.max(220, Math.floor(w*s)), rh = Math.max(160, Math.floor(h*s));
  if(rt){ rt.dispose(); rt.depthTexture.dispose(); }
  rt = makeRT(rw, rh);
  postMat.uniforms.tDiffuse.value = rt.texture;
  postMat.uniforms.tDepth.value = rt.depthTexture;
  postMat.uniforms.res.value.set(rw, rh);
}
function onResize(){
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  resizeRT();
}
addEventListener('resize', onResize);
resizeRT();

/* =====================================================================
   3. LIGHTING  (bright, high contrast, anime key/rim)
   ===================================================================== */
const hemi = new THREE.HemisphereLight(0xdff0ff, 0xffd9ab, 1.15);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff4dc, 2.05);
key.position.set(3.4, 5.2, -3.6);
key.castShadow = true;
key.shadow.mapSize.set(1024,1024);
key.shadow.camera.left=-2.2; key.shadow.camera.right=2.2;
key.shadow.camera.top=2.2; key.shadow.camera.bottom=-1.2;
key.shadow.camera.near=0.5; key.shadow.camera.far=14;
key.shadow.bias=-0.0016; key.shadow.normalBias=0.02;
scene.add(key);
const rim = new THREE.DirectionalLight(0x8fd8ff, 1.05);
rim.position.set(-4.0, 2.6, 3.4);
scene.add(rim);
const fill = new THREE.DirectionalLight(0xffd2a8, 0.55);
fill.position.set(-1.5, 1.2, -4.5);
scene.add(fill);

/* =====================================================================
   4. MATERIAL SYSTEM  (toon gradients + procedural canvas finishes)
   ===================================================================== */
function gradTex(steps, gamma){
  const d = new Uint8Array(steps);
  for(let i=0;i<steps;i++) d[i] = Math.round(255*Math.pow((i+0.85)/steps, gamma||0.78));
  const t = new THREE.DataTexture(d, steps, 1, THREE.RedFormat);
  t.magFilter = t.minFilter = THREE.NearestFilter; t.needsUpdate = true;
  return t;
}
const GRAD = { g3:gradTex(3,0.72), g4:gradTex(4,0.8), g5:gradTex(5,0.86), g2:gradTex(2,0.62) };

function cvs(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return [c,c.getContext('2d')]; }
function texFrom(c, rx, ry){
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx||1, ry||1);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 2;
  return t;
}
// carbon weave
const carbonTex = (()=>{ const [c,x]=cvs(64,64);
  x.fillStyle='#5a6070'; x.fillRect(0,0,64,64);
  for(let i=0;i<4;i++) for(let j=0;j<4;j++){
    const dark=(i+j)%2===0; x.fillStyle = dark? '#3d4351':'#7c8496';
    x.fillRect(i*16,j*16,16,16);
    x.fillStyle='rgba(255,255,255,.12)';
    for(let k=0;k<4;k++){ if(dark) x.fillRect(i*16, j*16+k*4, 16, 1.4); else x.fillRect(i*16+k*4, j*16, 1.4, 16); }
  }
  return texFrom(c, 6, 6); })();
// brushed metal
const brushTex = (()=>{ const [c,x]=cvs(128,16);
  x.fillStyle='#b8bec9'; x.fillRect(0,0,128,16);
  for(let i=0;i<240;i++){ const y=Math.random()*16, l=8+Math.random()*60, a=Math.random()*0.35;
    x.strokeStyle=`rgba(${Math.random()>0.5?255:70},255,255,${a})`; x.lineWidth=Math.random()*1.2;
    x.beginPath(); x.moveTo(Math.random()*128,y); x.lineTo(Math.random()*128+l,y); x.stroke(); }
  return texFrom(c, 3, 1); })();
// bar tape wrap
const tapeTex = (()=>{ const [c,x]=cvs(32,32);
  x.fillStyle='#ffffff'; x.fillRect(0,0,32,32);
  x.strokeStyle='rgba(0,0,0,.42)'; x.lineWidth=3;
  for(let i=-2;i<6;i++){ x.beginPath(); x.moveTo(i*10,0); x.lineTo(i*10+14,32); x.stroke(); }

// hazard stripes

const FINISH = {
  gloss:  {grad:GRAD.g4, map:null,       em:0.055, flat:false, ao:1.00},
  matte:  {grad:GRAD.g3, map:null,       em:0.005, flat:false, ao:0.94},
  metal:  {grad:GRAD.g5, map:brushTex,   em:0.10,  flat:false, ao:1.10},
  carbon: {grad:GRAD.g4, map:carbonTex,  em:0.03,  flat:false, ao:1.55},
  neon:   {grad:GRAD.g2, map:null,       em:0.55,  flat:false, ao:1.15},
  raw:    {grad:GRAD.g5, map:brushTex,   em:0.05,  flat:true,  ao:1.06}
};
const FINISH_W = {gloss:1.0, matte:0.985, metal:1.13, carbon:0.79, neon:1.0, raw:1.08};

function toon(color, opts){
  const o = opts||{};
  const m = new THREE.MeshToonMaterial({
    color:new THREE.Color(color),
    gradientMap:o.grad||GRAD.g4,
    map:o.map||null,
    transparent:!!o.transparent, opacity:o.opacity!==undefined?o.opacity:1,
    side:o.side||THREE.FrontSide
  });
  if(o.em) m.emissive = new THREE.Color(color).multiplyScalar(o.em);
  if(o.flat) m.flatShading = true;
  return m;
}
function applyFinish(mat, color, finishName, tintMap){
  const f = FINISH[finishName] || FINISH.gloss;
  const col = new THREE.Color(color);
  mat.color.copy(col).multiplyScalar(f.ao);
  mat.gradientMap = f.grad;
  mat.map = tintMap===false ? null : f.map;
  mat.emissive.copy(col).multiplyScalar(f.em);
  mat.flatShading = !!f.flat;
  mat.needsUpdate = true;
}

function refreshMaterials(){

/* =====================================================================
   5. GEOMETRY HELPERS  (shared geo cache + primitive builders)
   ===================================================================== */
const SHARED = new Set();
function share(g){ SHARED.add(g); return g; }
const G = {
  hex:  share(new THREE.CylinderGeometry(1,1,1,6)),
  cyl:  share(new THREE.CylinderGeometry(1,1,1,14)),
  cyl8: share(new THREE.CylinderGeometry(1,1,1,8)),
  box:  share(new THREE.BoxGeometry(1,1,1)),
  ico:  share(new THREE.IcosahedronGeometry(1,1)),
  sph:  share(new THREE.SphereGeometry(1,12,8)),
  unit: share(new THREE.CylinderGeometry(1,1,1,7))
};
const _v1=new THREE.Vector3(), _v2=new THREE.Vector3(), _q=new THREE.Quaternion(), _up=new THREE.Vector3(0,1,0), _m=new THREE.Matrix4();

function orientTo(obj, from, to){
  _v1.subVectors(to, from);
  obj.quaternion.setFromUnitVectors(_up, _v1.clone().normalize());
  obj.position.copy(from);
  return _v1.length();
}
/** tube between two Vector3 (r1 at p1, r2 at p2); ovX/ovZ ovalises the section */
function tube(p1, p2, r1, r2, mat, seg, ovX, ovZ){
  const len = _v1.subVectors(p2,p1).length();
  const g = new THREE.CylinderGeometry(r2===undefined?r1:r2, r1, len, seg||14, 1, false);
  g.translate(0, len/2, 0);
  const m = new THREE.Mesh(g, mat);
  m.position.copy(p1);
  m.quaternion.setFromUnitVectors(_up, _v1.clone().normalize());
  if(ovX||ovZ) m.scale.set(ovX||1, 1, ovZ||1);
  m.castShadow = true;
  return m;
}
/** unit-geometry instance placed with scale */
function part(geo, mat, x,y,z, sx,sy,sz, rx,ry,rz){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x||0,y||0,z||0);
  m.scale.set(sx===undefined?1:sx, sy===undefined?1:sy, sz===undefined?1:sz);
  if(rx||ry||rz) m.rotation.set(rx||0, ry||0, rz||0);
  m.castShadow = true;
  return m;
}
function boxM(w,h,d, mat, x,y,z, rx,ry,rz){ return part(G.box, mat, x,y,z, w,h,d, rx,ry,rz); }
function cylM(r,h, mat, x,y,z, rx,ry,rz, seg){ return part(seg===8?G.cyl8:G.cyl, mat, x,y,z, r,h,r, rx,ry,rz); }
function bolt(r, h, mat, x,y,z, rx,ry,rz){
  const b = part(G.hex, mat||MAT.steel, x,y,z, r,h,r, rx,ry,rz); return b;
}
function disc(r,h,seg,mat){ const g=new THREE.CylinderGeometry(r,r,h,seg); const m=new THREE.Mesh(g,mat); m.castShadow=true; return m; }

/** sprocket pitch radius for a chain-driven cog of T teeth (1/2" pitch) */
const cogR = T => 0.0127/(2*Math.sin(Math.PI/T));

function group(name, parent){ const g=new THREE.Group(); g.name=name; if(parent) parent.add(g); return g; }

/** register a group for exploded view */
const explodeParts = [];
function explodable(obj, dirVec, dist, label, scaleUp){
  obj.userData.exBase = obj.position.clone();
  obj.userData.exDir  = dirVec.clone().normalize();
  obj.userData.exDist = dist;
  obj.userData.exScale= scaleUp||0;
  if(label) obj.userData.label = label;
  explodeParts.push(obj);
  return obj;
}
function labelize(obj, label){ obj.userData.label = label; return obj; }

function disposeTree(obj){
  obj.traverse(o=>{
    if(o.isMesh || o.isInstancedMesh){
      if(o.geometry && !SHARED.has(o.geometry)) o.geometry.dispose();
    }
  });
}

/** sub-curve sampler */
function subCurve(curve, t0, t1, n){
  const pts=[]; for(let i=0;i<=n;i++) pts.push(curve.getPoint(THREE.MathUtils.lerp(t0,t1,i/n)));
  return new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.2);
}
function closestT(curve, target, n){
  n = n||200; let best=0, bd=1e9;
  for(let i=0;i<=n;i++){ const t=i/n; const d=curve.getPoint(t).distanceToSquared(target); if(d<bd){bd=d;best=t;} }
  return best;
}
function curveTube(points, radius, mat, tubular, rad, closed){
  const c = new THREE.CatmullRomCurve3(points, !!closed, 'catmullrom', 0.35);
  const g = new THREE.TubeGeometry(c, tubular||40, radius, rad||6, !!closed);
  const m = new THREE.Mesh(g, mat); m.castShadow = true;
  m.userData.curve = c;
  return m;
}

/* =====================================================================
   6. BIKE ROOT
   ===================================================================== */
const bikeRoot = group('bikeRoot');          // world placement
scene.add(bikeRoot);
let bike = group('bike', bikeRoot);          // rebuilt geometry lives here
let A = {};                                  // computed anchors

/* =====================================================================
   7. PARAMETRIC FRAME SOLVER  — every anchor the bike depends on
   ===================================================================== */
const DZ = -1;               // drive-side sign (z)
function solveGeometry(){
  const a = {};
  a.tireW   = mm(P.tire);
  a.rimR    = 0.311 - mm(P.rimDepth)*0.0;      // 622 bead seat
  a.rimOut  = 0.311;
  a.wheelR  = 0.311 + a.tireW*0.92;
  a.bbDrop  = 0.070;
  const ha = D2R(P.headAngle), sa = D2R(P.seatAngle);
  a.ha = ha; a.sa = sa;
  a.bb = new THREE.Vector3(0,0,0);
  a.axisUp = new THREE.Vector3(-Math.cos(ha), Math.sin(ha), 0);           // up the steerer
  a.perp   = new THREE.Vector3( Math.sin(ha), Math.cos(ha), 0);           // fwd-perp (rake dir)
  a.htTop  = new THREE.Vector3(mm(P.reach), mm(P.stack), 0);
  a.htLen  = clamp(0.082 + (mm(P.stack)-0.50)*0.80 - P.compact*0.055, 0.072, 0.30);
  a.htBot  = a.htTop.clone().addScaledVector(a.axisUp, -a.htLen);
  a.rake   = 0.047;
  const t  = (a.htBot.y + a.rake*Math.cos(ha) - a.bbDrop)/Math.sin(ha);
  a.forkLen= t;
  a.frontAxle = new THREE.Vector3(a.htBot.x + t*Math.cos(ha) + a.rake*Math.sin(ha), a.bbDrop, 0);
  a.crown  = a.htBot.clone().addScaledVector(a.axisUp, -0.032);
  a.trail  = (a.wheelR*Math.cos(ha) - a.rake)/Math.sin(ha);
  const csl = mm(P.chainstay);
  a.rearAxle = new THREE.Vector3(-Math.sqrt(Math.max(0.02, csl*csl - a.bbDrop*a.bbDrop)), a.bbDrop, 0);
  a.stDir  = new THREE.Vector3(-Math.cos(sa), Math.sin(sa), 0);
  a.stTop  = a.stDir.clone().multiplyScalar(mm(P.seatTube));
  a.ttDrop = P.compact*0.135;
  a.ttRear = a.stTop.clone().addScaledVector(a.stDir, -(0.022 + a.ttDrop));
  a.ttFront= a.htTop.clone().addScaledVector(a.axisUp, -0.026);
  a.dtFront= a.htBot.clone().addScaledVector(a.axisUp, 0.030);
  a.dtRear = new THREE.Vector3(0.030, 0.012, 0);
  a.ssJoint= P.dropped
      ? a.stTop.clone().multiplyScalar(clamp(0.56 - P.compact*0.05, 0.35, 0.8))
      : a.ttRear.clone().addScaledVector(a.stDir, -0.028);
  a.postTop= a.stTop.clone().addScaledVector(a.stDir, mm(P.postExt));
  a.saddle = a.postTop.clone().add(new THREE.Vector3(mm(P.saddleFA), 0.030, 0));
  a.spacer = 0.030;
  a.stemClamp = a.htTop.clone().addScaledVector(a.axisUp, a.spacer + 0.021);
  a.steerTop  = a.htTop.clone().addScaledVector(a.axisUp, a.spacer + 0.046);
  const sDir = new THREE.Vector3(Math.cos(D2R(-6)), Math.sin(D2R(-6)), 0);
  a.stemDir = sDir;
  a.barCenter = a.stemClamp.clone().addScaledVector(sDir, mm(P.stemLen));
  a.wheelbase = a.frontAxle.x - a.rearAxle.x;
  // drivetrain
  a.ringT = P.rings===1 ? [40] : P.rings===2 ? [50,34] : [50,39,30];
  a.chainlineZ = DZ*(0.0435 + (P.rings-1)*0.0055);
  a.cogT = [];
  const maxCog = [null,null,null,null,null,null,null,28,30,32,34,36,40][P.cogs] || 34;
  for(let i=0;i<P.cogs;i++){
    const u = i/(P.cogs-1);
    a.cogT.push(Math.round(11 + (maxCog-11)*Math.pow(u,1.55)));
  }
  a.cogPitch = 0.0037 + 0.0042/Math.max(1,P.cogs-6);
  a.cassetteW = a.cogPitch*(P.cogs-1) + 0.006;
  return a;
}

/* =====================================================================
   8. FRAME
   ===================================================================== */
function buildFrame(){
  const g = group('frame', bike);
  const M = MAT.frame, weld = MAT.frame;
  labelize(g, 'Frame — main triangle');
  // head tube (tapered, ovalised)
  const ht = tube(A.htBot, A.htTop, 0.0245, 0.0215, M, 16, 1, 0.94); g.add(ht);
  g.add(ringAt(A.htBot.clone().addScaledVector(A.axisUp,0.006), A.axisUp, 0.028, 0.014, M));
  // top tube
  g.add(tube(A.ttFront, A.ttRear, 0.019, 0.0175, M, 14, 1.55, 0.82));
  // down tube
  g.add(tube(A.dtFront, A.dtRear, 0.0235, 0.0285, M, 16, 1.18, 0.86));
  // seat tube
  g.add(tube(A.bb.clone().addScaledVector(A.stDir,0.02), A.stTop, 0.021, 0.0175, M, 14, 1.06, 0.94));
  // BB shell
  const bbs = part(G.cyl, M, 0,0,0, 0.0215,0.072,0.0215, Math.PI/2,0,0);
  g.add(bbs);
  g.add(part(G.cyl, MAT.dark, 0,0,0, 0.0185,0.078,0.0185, Math.PI/2,0,0));
  // chainstays (curved)
  for(const s of [1,-1]){
    const p0 = new THREE.Vector3(0.010, 0.004, s*0.036);
    const p1 = new THREE.Vector3(A.rearAxle.x*0.42, 0.012, s*0.070);
    const p2 = new THREE.Vector3(A.rearAxle.x*0.80, A.rearAxle.y*0.72, s*0.060);
    const p3 = new THREE.Vector3(A.rearAxle.x+0.012, A.rearAxle.y, s*0.055);
    g.add(curveTube([p0,p1,p2,p3], 0.0125, M, 26, 8));
  }
  // seatstays
  for(const s of [1,-1]){
    const j = A.ssJoint.clone(); j.z = s*0.016;
    const mid = j.clone().lerp(A.rearAxle,0.5); mid.z = s*0.045; mid.y += P.dropped?0.006:0.010;
    const end = new THREE.Vector3(A.rearAxle.x+0.010, A.rearAxle.y+0.004, s*0.052);
    g.add(curveTube([j, mid, end], 0.0095, M, 22, 7));
    // seatstay bridge / junction weld
    g.add(part(G.ico, M, j.x, j.y, j.z, 0.017,0.017,0.014));
  }
  // dropouts
  for(const s of [1,-1]){
    const d = boxM(0.055,0.040,0.010, MAT.dark, A.rearAxle.x+0.004, A.rearAxle.y-0.004, s*0.055, 0,0,-0.25);
    g.add(d);
    g.add(bolt(0.008,0.010, MAT.steel, A.rearAxle.x, A.rearAxle.y, s*0.062, Math.PI/2,0,0));
  }
  // rear axle
  g.add(part(G.cyl, MAT.steel, A.rearAxle.x, A.rearAxle.y, 0, 0.006,0.145,0.006, Math.PI/2,0,0));
  // welds / lugs
  const welds = [[A.ttFront,0.021],[A.ttRear,0.020],[A.dtFront,0.026],[A.stTop,0.020],[A.bb,0.030]];
  for(const [p,r] of welds) g.add(part(G.ico, weld, p.x,p.y,p.z, r,r,r*0.9));
  // seat clamp
  const clampP = A.stTop.clone().addScaledVector(A.stDir,-0.010);
  const cl = new THREE.Mesh(new THREE.TorusGeometry(0.020,0.0055,6,14), MAT.accent);
  cl.quaternion.setFromUnitVectors(_up, A.stDir); cl.rotateX(Math.PI/2);
  cl.position.copy(clampP);
  g.add(cl);
  g.add(bolt(0.0055,0.016, MAT.steel, clampP.x-0.017, clampP.y-0.004, 0, 0,0,Math.PI/2));
  // bottle bosses + cable stops
  for(let i=0;i<2;i++){
    const p = A.dtFront.clone().lerp(A.dtRear, 0.42+i*0.22);
    p.y += 0.020;
    g.add(bolt(0.0055,0.008, MAT.steel, p.x,p.y,p.z, 0,0,0));
  }
  const cs = A.dtFront.clone().lerp(A.dtRear,0.12); cs.y+=0.014;
  g.add(boxM(0.022,0.010,0.030, MAT.dark, cs.x, cs.y, cs.z));
  return g;
}
/** helper: a ring (short cylinder) around an axis at a point */
function ringAt(p, axis, r, h, mat){
  const m = part(G.cyl, mat, 0,0,0, r,h,r);
  m.quaternion.setFromUnitVectors(_up, axis.clone().normalize());
  m.position.copy(p);
  return m;
}

/* =====================================================================
   9. FORK  (explodes down the steering axis)
   ===================================================================== */
function buildFork(){
  const g = group('fork', bike);
  const M = MAT.fork;
  labelize(g,'Fork');
  // steerer
  g.add(tube(A.crown, A.steerTop, 0.0145, 0.0145, M, 12));
  // crown
  const cw = boxM(0.052,0.030,0.086, M, 0,0,0);
  cw.quaternion.setFromUnitVectors(_up, A.axisUp);
  cw.position.copy(A.crown).addScaledVector(A.axisUp,-0.006);
  g.add(cw);
  g.add(part(G.ico, M, A.crown.x, A.crown.y, A.crown.z, 0.026,0.020,0.030));
  // blades
  for(const s of [1,-1]){
    const p0 = A.crown.clone().add(new THREE.Vector3(0,-0.012,s*0.038));
    const p1 = A.crown.clone().lerp(A.frontAxle,0.45).add(new THREE.Vector3(-0.004,0,s*0.050));
    const p2 = A.crown.clone().lerp(A.frontAxle,0.80).add(new THREE.Vector3(0.004,0,s*0.050));
    const p3 = new THREE.Vector3(A.frontAxle.x, A.frontAxle.y+0.004, s*0.048);
    g.add(curveTube([p0,p1,p2,p3], 0.0135, M, 26, 8));
    // dropout
    g.add(boxM(0.030,0.044,0.011, MAT.dark, A.frontAxle.x, A.frontAxle.y+0.002, s*0.048, 0,0,0.1));
    g.add(bolt(0.008,0.010, MAT.steel, A.frontAxle.x, A.frontAxle.y, s*0.056, Math.PI/2,0,0));
  }
  // front axle
  g.add(part(G.cyl, MAT.steel, A.frontAxle.x, A.frontAxle.y, 0, 0.006,0.125,0.006, Math.PI/2,0,0));
  // brake mount tabs
  g.add(boxM(0.030,0.055,0.012, MAT.dark,
    A.crown.clone().lerp(A.frontAxle,0.72).x-0.012, A.crown.clone().lerp(A.frontAxle,0.72).y, -DZ*0.052, 0,0,0.3));
  explodable(g, A.axisUp.clone().negate(), 0.42, 'Fork assembly');
  return g;
}

/* =====================================================================
   10. HEADSET + STEM + BAR + LEVERS + TAPE
   ===================================================================== */
function buildHeadset(){
  const g = group('headset', bike);
  labelize(g,'Headset');
  const low = ringAt(A.htBot.clone().addScaledVector(A.axisUp,0.008), A.axisUp, 0.0275, 0.016, MAT.drive);
  const upp = ringAt(A.htTop.clone().addScaledVector(A.axisUp,-0.006), A.axisUp, 0.0255, 0.014, MAT.drive);
  g.add(low); g.add(upp);
  const spTop = group('spacers', bike);
  labelize(spTop,'Headset spacers + top cap');
  let h = 0.004;
  while(h < A.spacer-0.002){
    spTop.add(ringAt(A.htTop.clone().addScaledVector(A.axisUp, h+0.005), A.axisUp, 0.0215, 0.0092, MAT.dark));
    h += 0.011;
  }
  spTop.add(ringAt(A.steerTop.clone().addScaledVector(A.axisUp,0.004), A.axisUp, 0.021, 0.008, MAT.accent));
  spTop.add(ringAt(A.steerTop.clone().addScaledVector(A.axisUp,0.012), A.axisUp, 0.0062, 0.010, MAT.steel));
  explodable(g, A.axisUp.clone(), 0.30, 'Headset');
  explodable(spTop, A.axisUp.clone(), 0.46, 'Spacers / top cap');
  return g;
}

function barPoints(){
  const bc = A.barCenter, hw = mm(P.barWidth)/2, rise = mm(P.barRise), fl = Math.tan(D2R(P.barFlare));
  if(P.barType==='flat'){
    const pts=[];
    for(let i=0;i<=10;i++){
      const u=i/10, z=THREE.MathUtils.lerp(hw*1.04,-hw*1.04,u), t=Math.abs(z)/(hw*1.04);
      pts.push(new THREE.Vector3(bc.x - 0.042*t*t, bc.y + rise*t*0.85 + 0.004*t, bc.z + z));
    }
    return {pts, hoods:[pts[2],pts[8]], ends:[pts[0],pts[10]], drop:false};
  }
  const R = 0.080, D = 0.126;
  const side = s => {
    const f = fl*D;
    return [
      new THREE.Vector3(-0.014, -D-0.005, s*(hw+f*1.10)),
      new THREE.Vector3( R*0.50, -D,       s*(hw+f*0.98)),
      new THREE.Vector3( R*0.94, -D*0.70,  s*(hw+f*0.62)),
      new THREE.Vector3( R*1.00, -D*0.24,  s*(hw+f*0.28)),
      new THREE.Vector3( R*0.84, -0.014,   s*(hw+f*0.10)),
      new THREE.Vector3( R*0.38,  rise*0.55-0.006, s*hw),
      new THREE.Vector3( 0.030,   rise*0.96, s*hw*0.985),
      new THREE.Vector3(-0.008,   rise,      s*hw*0.70),
      new THREE.Vector3(-0.008,   rise*0.72, s*0.034)
    ];
  };
  const L = side(1), Rt = side(-1).reverse();
  const pts = L.concat(Rt).map(p=>p.add(bc));
  return {pts, hoods:[pts[4], pts[13]], ends:[pts[0], pts[17]], drop:true};
}

function buildCockpit(){
  const stemG = group('stem', bike); labelize(stemG,'Stem');
  const barG  = group('bar', bike);  labelize(barG, P.barType==='flat'?'Flat handlebar':'Drop handlebar');
  const tapeG = group('tape', bike); labelize(tapeG, P.barType==='flat'?'Grips':'Bar tape');
  const lvG   = group('levers', bike); labelize(lvG,'Shifters / brake levers');

  // ---- stem ----
  const c0 = A.stemClamp, bc = A.barCenter;
  stemG.add(ringAt(c0, A.axisUp, 0.0215, 0.042, MAT.dark));
  const body = tube(c0.clone().addScaledVector(A.stemDir,0.012), bc.clone().addScaledVector(A.stemDir,-0.012), 0.019, 0.017, MAT.dark, 10, 1.35, 0.72);
  stemG.add(body);
  const face = boxM(0.016,0.052,0.052, MAT.dark, bc.x+0.012, bc.y, bc.z);
  stemG.add(face);
  stemG.add(ringAt(bc, new THREE.Vector3(0,0,1), 0.0175, 0.045, MAT.dark));
  for(const sy of [1,-1]) for(const sz of [1,-1])
    stemG.add(bolt(0.0042,0.020, MAT.steel, bc.x+0.019, bc.y+sy*0.016, bc.z+sz*0.016, 0,0,Math.PI/2));
  for(const sy of [1,-1])
    stemG.add(bolt(0.0042,0.020, MAT.steel, c0.x-0.019, c0.y+sy*0.013, c0.z, 0,0,Math.PI/2));
  explodable(stemG, A.axisUp.clone(), 0.30, 'Stem');

  // ---- handlebar ----
  const B = barPoints();
  const curve = new THREE.CatmullRomCurve3(B.pts, false, 'catmullrom', 0.4);
  const barMesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 130, 0.0128, 8, false), MAT.drive);
  barMesh.castShadow = true; barG.add(barMesh);
  barG.add(part(G.sph, MAT.drive, B.pts[0].x,B.pts[0].y,B.pts[0].z, 0.0128,0.0128,0.0128));
  const last = B.pts[B.pts.length-1];
  barG.add(part(G.sph, MAT.drive, last.x,last.y,last.z, 0.0128,0.0128,0.0128));
  explodable(barG, new THREE.Vector3(0.55,0.83,0), 0.34, 'Handlebar');

  // ---- tape / grips ----
  if(B.drop){
    const tEnd = closestT(curve, B.pts[0]), tTop = closestT(curve, B.pts[7]);
    const tEnd2 = closestT(curve, B.pts[17]), tTop2 = closestT(curve, B.pts[10]);
    for(const [t0,t1] of [[tEnd,tTop],[tEnd2,tTop2]]){
      const sc = subCurve(curve, t0, t1, 26);
      const m = new THREE.Mesh(new THREE.TubeGeometry(sc, 54, 0.0158, 7, false), MAT.tape);
      m.castShadow = true; tapeG.add(m);
    }
  } else {
    const tA = closestT(curve, B.pts[0]), tB = closestT(curve, B.pts[2]);
    const tC = closestT(curve, B.pts[8]), tD = closestT(curve, B.pts[10]);
    for(const [t0,t1] of [[tA,tB],[tC,tD]]){
      const sc = subCurve(curve, t0, t1, 12);
      const m = new THREE.Mesh(new THREE.TubeGeometry(sc, 22, 0.0168, 8, false), MAT.tape);
      m.castShadow = true; tapeG.add(m);
    }
  }
  explodable(tapeG, new THREE.Vector3(0.35,0.94,0), 0.50, B.drop?'Bar tape':'Grips');

  // ---- levers / shifters ----
  const hoodOut = [];
  B.hoods.forEach((h,i)=>{
    const s = i===0?1:-1;
    const lg = group('lever'+i, lvG);
    const yaw = s*D2R(P.barFlare*0.55);
    lg.position.copy(h); lg.rotation.y = yaw;
    if(B.drop){
      lg.add(boxM(0.106,0.062,0.030, MAT.saddle, 0.026,0.030,0, 0,0,D2R(-26)));
      lg.add(part(G.sph, MAT.saddle, 0.070,0.048,0, 0.020,0.020,0.015));
      lg.add(boxM(0.020,0.085,0.016, MAT.drive, 0.052,-0.028,0, 0,0,D2R(9)));
      lg.add(boxM(0.012,0.040,0.010, MAT.accent, 0.040,-0.026,s*0.010, 0,0,D2R(14)));
      lg.add(bolt(0.005,0.014, MAT.steel, -0.006,0.014,0, 0,0,Math.PI/2));
      hoodOut.push(h.clone().add(new THREE.Vector3(-0.010,0.050,0)));
    } else {
      lg.add(part(G.cyl, MAT.saddle, 0,0,s*0.012, 0.014,0.030,0.014, Math.PI/2,0,0));
      lg.add(boxM(0.075,0.012,0.014, MAT.drive, 0.040,-0.008,s*0.018, 0,D2R(-s*8),0));
      lg.add(boxM(0.030,0.026,0.024, MAT.saddle, 0.010,0.014,s*0.030));
      hoodOut.push(h.clone().add(new THREE.Vector3(0.0,0.028,s*0.02)));
    }
  });
  explodable(lvG, new THREE.Vector3(0.75,0.55,0), 0.42, 'Levers / shifters');
  return {curve, hoods:hoodOut, drop:B.drop};
}

/* =====================================================================
   11. SEATPOST + SADDLE
   ===================================================================== */
function saddleGeometry(){
  const s = new THREE.Shape();
  s.moveTo(0.132, 0);
  s.bezierCurveTo(0.105, 0.020, 0.030, 0.030, -0.030, 0.070);
  s.bezierCurveTo(-0.072, 0.100, -0.104, 0.076, -0.108, 0.006);
  s.bezierCurveTo(-0.112,-0.070, -0.072,-0.100, -0.030,-0.070);
  s.bezierCurveTo(0.030,-0.030, 0.105,-0.020, 0.132, 0);
  const g = new THREE.ExtrudeGeometry(s, {depth:0.016, bevelEnabled:true, bevelSize:0.009, bevelThickness:0.009, bevelSegments:3, curveSegments:14});
  g.rotateX(-Math.PI/2);
  const pos = g.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), y=pos.getY(i), z=pos.getZ(i);
    const tail = Math.max(0,(-x-0.010)/0.10);
    let ny = y + 0.052*tail*tail + 0.010*Math.max(0,(x-0.05)/0.09);
    ny -= 2.6*z*z;                                  // lateral curvature
    pos.setY(i, ny);
  }
  g.computeVertexNormals();
  return g;
}
function buildSeat(){
  const postG = group('seatpost', bike); labelize(postG,'Seatpost');
  const sadG  = group('saddle', bike);   labelize(sadG,'Saddle');
  const base = A.stTop.clone().addScaledVector(A.stDir, -0.075);
  postG.add(tube(base, A.postTop, 0.0155, 0.0155, MAT.dark, 12));
  postG.add(ringAt(A.postTop.clone().addScaledVector(A.stDir,-0.004), A.stDir, 0.017, 0.010, MAT.drive));
  // saddle clamp head
  const head = A.postTop.clone();
  postG.add(boxM(0.036,0.020,0.030, MAT.dark, head.x, head.y+0.008, 0));
  postG.add(bolt(0.005,0.026, MAT.steel, head.x-0.012, head.y+0.004, 0, Math.PI/2,0,0));
  explodable(postG, A.stDir.clone(), 0.30, 'Seatpost');

  const sm = new THREE.Mesh(saddleGeometry(), MAT.saddle);
  sm.castShadow = true;
  sm.position.copy(A.saddle);
  sm.rotation.z = D2R(-2);
  sadG.add(sm);
  // top pad accent
  const pad = new THREE.Mesh(saddleGeometry(), MAT.accent);
  pad.scale.set(0.88,1.0,0.80);
  pad.position.copy(A.saddle).add(new THREE.Vector3(0.004,0.0035,0));
  pad.rotation.z = D2R(-2);
  sadG.add(pad);
  // rails
  for(const s of [1,-1]){
    const r0 = A.saddle.clone().add(new THREE.Vector3(0.075,-0.014, s*0.021));
    const r1 = A.saddle.clone().add(new THREE.Vector3(0.030,-0.030, s*0.021));
    const r2 = A.saddle.clone().add(new THREE.Vector3(-0.060,-0.030, s*0.021));
    const r3 = A.saddle.clone().add(new THREE.Vector3(-0.088,-0.012, s*0.021));
    sadG.add(curveTube([r0,r1,r2,r3], 0.0035, MAT.steel, 16, 5));
  }
  explodable(sadG, A.stDir.clone(), 0.52, 'Saddle');
  return sadG;
}

/* extra materials that need double-sided rendering */
MAT.rimwell = toon('#39414f',{grad:GRAD.g3});

MAT.rimside = toon('#2b3448',{grad:GRAD.g4});

/* =====================================================================
   12. WHEELS  (rim / spokes / hub / tyre / valve / rotor / cassette)
   ===================================================================== */
function buildWheel(center, rear){
  const g = group(rear?'rearWheel':'frontWheel', bike);
  g.position.copy(center);
  labelize(g, rear?'Rear wheel':'Front wheel');
  const rimOut = A.rimOut, depth = clamp(mm(P.rimDepth),0.018,0.09), rimW = 0.025;
  const inner = rimOut - depth;

  const outerG = new THREE.CylinderGeometry(rimOut, rimOut, rimW, 44, 1, true); outerG.rotateX(Math.PI/2);
  const outerM = new THREE.Mesh(outerG, MAT.rim); outerM.castShadow = true; g.add(outerM);
  for(const s of [1,-1]){
    const rg = new THREE.RingGeometry(inner, rimOut, 44, 1);
    const m = new THREE.Mesh(rg, MAT.rimside); m.position.z = s*rimW/2; g.add(m);
  }
  const inG = new THREE.CylinderGeometry(inner, inner, rimW*0.7, 34,1,true); inG.rotateX(Math.PI/2);
  g.add(new THREE.Mesh(inG, MAT.rimwell));

  // hub
  const hubG = group('hub', g); labelize(hubG, rear?'Rear hub':'Front hub');
  hubG.add(part(G.cyl, MAT.hub, 0,0,0, 0.0215,0.070,0.0215, Math.PI/2,0,0));
  for(const s of [1,-1]) hubG.add(part(G.cyl, MAT.hub, 0,0,s*0.028, 0.033,0.009,0.033, Math.PI/2,0,0));
  hubG.add(part(G.cyl, MAT.steel, 0,0,0, 0.0065,0.150,0.0065, Math.PI/2,0,0));
  if(rear) hubG.add(part(G.cyl, MAT.drive, 0,0,DZ*0.046, 0.020,0.040,0.020, Math.PI/2,0,0));

  // spokes
  const spN = P.spokes;
  const sIM = new THREE.InstancedMesh(G.cyl8, MAT.steel, spN);
  sIM.castShadow = true;
  const sc = new THREE.Vector3();
  for(let i=0;i<spN;i++){
    const side = (i%2)?1:-1;
    const a  = (i/spN)*Math.PI*2;
    const a2 = a + side*0.62;
    const hubP = new THREE.Vector3(Math.cos(a)*0.031, Math.sin(a)*0.031, side*0.028);
    const rimP = new THREE.Vector3(Math.cos(a2)*(inner-0.003), Math.sin(a2)*(inner-0.003), 0);
    const mid = hubP.clone().add(rimP).multiplyScalar(0.5);
    const dir = rimP.clone().sub(hubP); const len = dir.length();
    _q.setFromUnitVectors(_up, dir.normalize());
    sc.set(0.0013, len, 0.0013);
    _m.compose(mid, _q, sc);
    sIM.setMatrixAt(i,_m);
  }
  sIM.instanceMatrix.needsUpdate = true;
  g.add(labelize(sIM,'Spokes ×'+spN));

  // tyre + tread + inner tube + valve
  const tireG = group('tyre', g); labelize(tireG,'Tyre '+P.tire+'mm');
  const tR = A.tireW*0.5, tRad = rimOut + tR*0.80;
  const tm = new THREE.Mesh(new THREE.TorusGeometry(tRad, tR, 9, 48), MAT.tire);
  tm.castShadow = true; tireG.add(tm);
  const nT = 36, tIM = new THREE.InstancedMesh(G.box, MAT.tread, nT);
  for(let i=0;i<nT;i++){
    const a = i/nT*Math.PI*2;
    const r = tRad + tR*0.80;
    _q.setFromAxisAngle(new THREE.Vector3(0,0,1), a);
    _m.compose(new THREE.Vector3(Math.cos(a)*r, Math.sin(a)*r, 0), _q, new THREE.Vector3(0.011,0.008,A.tireW*0.66));
    tIM.setMatrixAt(i,_m);
  }
  tIM.instanceMatrix.needsUpdate = true; tireG.add(tIM);
  explodable(tireG, new THREE.Vector3(0,0,1), 0, 'Tyre', 0.20);
  // inner tube (visualisation)
  const itG = group('innertube', g); labelize(itG,'Inner tube');
  const it = new THREE.Mesh(new THREE.TorusGeometry(tRad-tR*0.10, tR*0.62, 8, 40), MAT.tube);
  itG.add(it);
  itG.visible = P.showTube;
  // valve stem
  const va = -Math.PI/2 + 0.25;
  const vg = group('valve', g);
  const vpos = new THREE.Vector3(Math.cos(va)*(inner+0.010), Math.sin(va)*(inner+0.010), 0);
  const vm = part(G.cyl8, MAT.drive, vpos.x, vpos.y, 0, 0.0034,0.026,0.0034, 0,0,va+Math.PI/2);
  vg.add(vm);
  vg.add(part(G.hex, MAT.accent, Math.cos(va)*(inner-0.004), Math.sin(va)*(inner-0.004), 0, 0.005,0.006,0.005, 0,0,va+Math.PI/2));
  labelize(vg,'Valve stem / inner tube');
  g.add(vg);

  // disc rotor (non-drive side)
  buildRotor(g, -DZ*0.046, rear);
  if(rear) buildCassette(g);
  explodable(g, new THREE.Vector3(rear?-1:1, 0, 0), 0.50, rear?'Rear wheel':'Front wheel');
  return g;
}

function buildRotor(parent, z, rear){
  const g = group('rotor', parent);
  g.position.z = z;
  labelize(g, (rear?'Rear':'Front')+' brake rotor (160mm)');
  const N = 22, rOut = 0.080, rIn = 0.056;
  const im = new THREE.InstancedMesh(G.box, MAT.steel, N);
  for(let i=0;i<N;i++){
    const a = i/N*Math.PI*2;
    const r = (rOut+rIn)/2;
    _q.setFromAxisAngle(new THREE.Vector3(0,0,1), a);
    _m.compose(new THREE.Vector3(Math.cos(a)*r, Math.sin(a)*r, 0), _q, new THREE.Vector3(0.0125,(rOut-rIn),0.0019));
    im.setMatrixAt(i,_m);
  }
  im.instanceMatrix.needsUpdate = true; g.add(im);
  // spider arms
  for(let i=0;i<5;i++){
    const a = i/5*Math.PI*2 + 0.3;
    const r = (rIn+0.024)/2;
    g.add(part(G.box, MAT.steel, Math.cos(a)*r, Math.sin(a)*r, 0, 0.011, rIn-0.020, 0.0019, 0,0,a));
  }
  g.add(part(G.cyl, MAT.steel, 0,0,0, 0.026,0.0026,0.026, Math.PI/2,0,0));
  for(let i=0;i<6;i++){
    const a = i/6*Math.PI*2;
    g.add(bolt(0.0035,0.005, MAT.dark, Math.cos(a)*0.020, Math.sin(a)*0.020, 0, Math.PI/2,0,0));
  }
  explodable(g, new THREE.Vector3(0,0,-DZ), 0.30, (rear?'Rear':'Front')+' rotor');
  return g;
}

function buildCassette(wheel){
  const g = group('cassette', wheel);
  labelize(g, P.cogs+'-speed cassette '+A.cogT[0]+'-'+A.cogT[A.cogT.length-1]+'T');
  const zOuter = DZ*0.064;
  A.cogZ = [];
  for(let i=0;i<A.cogT.length;i++){
    const T = A.cogT[i], r = cogR(T);
    const z = zOuter - DZ*(i*A.cogPitch);
    A.cogZ.push(z);
    const cg = new THREE.CylinderGeometry(r, r, 0.0019, Math.min(60,Math.max(9,T)));
    cg.rotateX(Math.PI/2);
    const m = new THREE.Mesh(cg, MAT.drive); m.position.z = z; m.castShadow = true; g.add(m);
    const inner = new THREE.Mesh(new THREE.CylinderGeometry(r*0.80, r*0.80, 0.0028, 14), MAT.hub);
    inner.rotation.x = Math.PI/2; inner.position.z = z; g.add(inner);
  }
  g.add(part(G.cyl, MAT.hub, 0,0,DZ*0.040, 0.0195,0.048,0.0195, Math.PI/2,0,0));
  A.cogMidZ = A.cogZ[Math.min(A.cogZ.length-1, Math.floor(A.cogZ.length/2))];
  A.cogMidR = cogR(A.cogT[Math.floor(A.cogT.length/2)]);
  A.cogMaxR = cogR(A.cogT[A.cogT.length-1]);
  explodable(g, new THREE.Vector3(0,0,DZ), 0.34, 'Cassette');
  return g;
}

/* =====================================================================
   13. DRIVETRAIN  (BB / cranks / rings / pedals / derailleurs / chain)
   ===================================================================== */
function ringZ(i){ return DZ*(0.040 + (P.rings-1-i)*0.0088); }

function buildDrivetrain(){
  const dt = group('drivetrain', bike);
  // ---- bottom bracket ----
  const bbG = group('bb', dt); labelize(bbG,'Bottom bracket');
  for(const s of [1,-1]) bbG.add(part(G.cyl, MAT.drive, 0,0,s*0.041, 0.019,0.014,0.019, Math.PI/2,0,0));
  bbG.add(part(G.cyl, MAT.steel, 0,0,0, 0.0125,0.150,0.0125, Math.PI/2,0,0));
  explodable(bbG, new THREE.Vector3(0,0,-DZ), 0.22, 'Bottom bracket');

  const CL = mm(P.crankLen);
  // ---- crank arms + pedals ----
  const angles = [D2R(38), D2R(38+180)];
  [1,-1].forEach((side,idx)=>{
    const dr = (side===1);                       // drive side
    const z = (dr?DZ:-DZ)*0.062;
    const ang = angles[idx];
    const cg = group(dr?'crankR':'crankL', dt);
    labelize(cg, dr?'Drive-side crankarm':'Non-drive crankarm');
    const mid = new THREE.Vector3(Math.cos(ang)*CL*0.5, Math.sin(ang)*CL*0.5, z);
    cg.add(part(G.box, MAT.drive, mid.x, mid.y, mid.z, CL, 0.030, 0.015, 0,0,ang));
    cg.add(part(G.box, MAT.drive, mid.x*0.55, mid.y*0.55, z, CL*0.45, 0.040, 0.019, 0,0,ang));
    cg.add(part(G.cyl, MAT.drive, 0,0,z, 0.024,0.022,0.024, Math.PI/2,0,0));
    cg.add(bolt(0.008,0.012, MAT.steel, 0,0,z+(dr?DZ:-DZ)*0.012, Math.PI/2,0,0));
    // pedal
    const pe = new THREE.Vector3(Math.cos(ang)*CL, Math.sin(ang)*CL, z);
    const pg = group('pedal', cg); labelize(pg,'Pedal');
    const zo = (dr?DZ:-DZ)*0.042;
    pg.add(part(G.cyl, MAT.steel, pe.x, pe.y, pe.z+zo*0.42, 0.0075,0.070,0.0075, Math.PI/2,0,0));
    pg.add(part(G.box, MAT.black, pe.x, pe.y, pe.z+zo, 0.082,0.017,0.062));
    pg.add(part(G.box, MAT.accent, pe.x-0.030, pe.y+0.010, pe.z+zo, 0.014,0.006,0.050));
    pg.add(part(G.box, MAT.accent, pe.x+0.030, pe.y+0.010, pe.z+zo, 0.014,0.006,0.050));
    explodable(pg, new THREE.Vector3(0,0,(dr?DZ:-DZ)), 0.30, 'Pedal');
    explodable(cg, new THREE.Vector3(0,0,(dr?DZ:-DZ)), 0.28, dr?'Drive crankarm':'Non-drive crankarm');
  });

  // ---- chainrings ----
  const crG = group('chainrings', dt);
  labelize(crG, P.rings+'× chainring set ('+A.ringT.join('/')+'T)');
  for(let i=0;i<A.ringT.length;i++){
    const T = A.ringT[i], R = cogR(T), z = ringZ(i);
    const tor = new THREE.Mesh(new THREE.TorusGeometry(R-0.0035, 0.0042, 4, Math.min(64,T)), MAT.drive);
    tor.position.z = z; tor.castShadow = true; crG.add(tor);
    const web = new THREE.Mesh(new THREE.CylinderGeometry(R-0.010, R-0.010, 0.0024, Math.min(64,T)), i===0?MAT.drive:MAT.hub);
    web.rotation.x = Math.PI/2; web.position.z = z; crG.add(web);
    // lightening windows
    for(let k=0;k<5;k++){
      const a = k/5*Math.PI*2 + 0.4;
      crG.add(part(G.cyl, MAT.dark, Math.cos(a)*R*0.62, Math.sin(a)*R*0.62, z, R*0.20, 0.0032, R*0.20, Math.PI/2,0,0));
    }
  }
  // spider + chainring bolts
  for(let k=0;k<5;k++){
    const a = k/5*Math.PI*2 + 0.4;
    const R0 = cogR(A.ringT[0]);
    crG.add(part(G.box, MAT.drive, Math.cos(a)*R0*0.35, Math.sin(a)*R0*0.35, ringZ(0), R0*0.72, 0.016, 0.006, 0,0,a));
    crG.add(bolt(0.005,0.010+ (P.rings-1)*0.008, MAT.steel, Math.cos(a)*R0*0.66, Math.sin(a)*R0*0.66, ringZ(0)-DZ*0.004, Math.PI/2,0,0));
  }
  explodable(crG, new THREE.Vector3(0,0,DZ), 0.40, 'Chainrings');

  // ---- front derailleur ----
  if(P.rings>1){
    const fd = group('frontDer', dt); labelize(fd,'Front derailleur');
    const R0 = cogR(A.ringT[0]);
    const bandY = R0 + 0.060;
    const u = bandY/Math.sin(A.sa);
    const bp = A.stDir.clone().multiplyScalar(u);
    const band = new THREE.Mesh(new THREE.TorusGeometry(0.019,0.006,6,14), MAT.dark);
    band.quaternion.setFromUnitVectors(_up, A.stDir); band.rotateX(Math.PI/2);
    band.position.copy(bp); fd.add(band);
    fd.add(part(G.box, MAT.dark, bp.x+0.026, bp.y-0.012, ringZ(0)*0.55, 0.030,0.048,0.016, 0,0,-0.3));
    // cage
    for(const s of [1,-1]){
      const zc = ringZ(0) + s*0.008;
      fd.add(part(G.box, MAT.drive, 0.010, R0+0.016, zc, 0.086,0.030,0.0022, 0,0,-0.10));
      fd.add(part(G.box, MAT.drive, 0.042, R0+0.026, zc, 0.030,0.020,0.0022, 0,0,-0.45));
    }
    fd.add(part(G.box, MAT.drive, 0.010, R0+0.032, ringZ(0), 0.070,0.010,0.019, 0,0,-0.10));
    fd.add(bolt(0.004,0.014, MAT.steel, bp.x+0.030, bp.y-0.030, ringZ(0)*0.55, Math.PI/2,0,0));
    explodable(fd, new THREE.Vector3(0.1,0.25,DZ), 0.30, 'Front derailleur');
  }

  // ---- rear derailleur ----
  const rd = group('rearDer', dt); labelize(rd,'Rear derailleur ('+P.cogs+'sp)');
  const zr = DZ*0.055;
  const hang = new THREE.Vector3(A.rearAxle.x+0.006, A.rearAxle.y-0.006, zr);
  const bknu = new THREE.Vector3(hang.x+0.028, hang.y-0.030, zr);
  const gp   = new THREE.Vector3(A.rearAxle.x+0.004, A.rearAxle.y-Math.max(0.082, A.cogMaxR+0.020), zr-DZ*0.004);
  const tp   = new THREE.Vector3(gp.x-0.030, gp.y-0.074, zr-DZ*0.004);
  A.gp = gp; A.tp = tp;
  rd.add(part(G.box, MAT.dark, hang.x, hang.y, zr, 0.022,0.030,0.012, 0,0,-0.4));
  rd.add(part(G.box, MAT.dark, bknu.x, bknu.y, zr, 0.030,0.034,0.020, 0,0,0.3));
  // parallelogram links
  for(const o of [-0.008, 0.008]){
    const p1 = new THREE.Vector3(hang.x+0.004+o*0.6, hang.y-0.012, zr+o);
    const p2 = new THREE.Vector3(bknu.x-0.002+o*0.6, bknu.y+0.010, zr+o);
    rd.add(tube(p1,p2,0.0045,0.0045, MAT.drive, 6));
  }
  rd.add(part(G.cyl, MAT.dark, hang.x, hang.y, zr-DZ*0.010, 0.010,0.026,0.010, Math.PI/2,0,0));
  // cage plates
  for(const s of [1,-1]){
    const zc = zr + s*0.010;
    rd.add(part(G.box, MAT.drive, (gp.x+tp.x)/2, (gp.y+tp.y)/2, zc, gp.distanceTo(tp)+0.030,0.020,0.0026, 0,0, Math.atan2(tp.y-gp.y, tp.x-gp.x)));
  }
  // pulleys
  [gp,tp].forEach((p,i)=>{
    const pr = 0.0265;
    const pg = new THREE.Mesh(new THREE.CylinderGeometry(pr,pr,0.006,11), MAT.black);
    pg.rotation.x = Math.PI/2; pg.position.copy(p); pg.castShadow = true; rd.add(pg);
    rd.add(part(G.cyl, MAT.drive, p.x,p.y,p.z, 0.011,0.010,0.011, Math.PI/2,0,0));
    rd.add(bolt(0.004,0.014, MAT.steel, p.x,p.y,p.z, Math.PI/2,0,0));
  });
  rd.add(part(G.box, MAT.accent, bknu.x+0.006, bknu.y-0.004, zr+DZ*0.012, 0.020,0.014,0.004, 0,0,0.3));
  explodable(rd, new THREE.Vector3(-0.35,-0.15,DZ*0.9), 0.34, 'Rear derailleur');

  buildChain(dt);
  return dt;
}

/* ---------------- chain: closed spline + instanced link plates ------- */
function buildChain(dt){
  const g = group('chain', dt); labelize(g,'Chain');
  const R0 = cogR(A.ringT[0]) + 0.004;
  const zF = ringZ(0), zR = A.cogMidZ===undefined? DZ*0.045 : A.cogMidZ;
  const Rc = A.cogMidR || 0.03;
  const pts = [];
  const ax = A.rearAxle;
  const add = (x,y,z)=>pts.push(new THREE.Vector3(x,y,z));
  // chainring wrap (enters bottom-rear, round the front, exits at the top)
  [263, 300, 340, 25, 65, 95].forEach(d=>{
    const a = D2R(d); add(Math.cos(a)*R0, Math.sin(a)*R0, zF);
  });
  // top run -> cassette
  add(ax.x*0.55, R0*0.55 + (ax.y+Rc)*0.45 + 0.004, THREE.MathUtils.lerp(zF,zR,0.55));
  // cassette wrap
  [95, 140, 185, 225].forEach(d=>{
    const a = D2R(d); add(ax.x + Math.cos(a)*Rc, ax.y + Math.sin(a)*Rc, zR);
  });
  // guide pulley: contacts the front, wraps clockwise round the bottom
  const pr = 0.0295;
  [22, -30, -78, -104].forEach(d=>{
    const a = D2R(d); add(A.gp.x + Math.cos(a)*pr, A.gp.y + Math.sin(a)*pr, A.gp.z);
  });
  // tension pulley: S-wrap — rear, bottom, exits forward
  [168, 205, 245, 288].forEach(d=>{
    const a = D2R(d); add(A.tp.x + Math.cos(a)*pr, A.tp.y + Math.sin(a)*pr, A.tp.z);
  });
  // bottom run back to chainring
  add(ax.x*0.40, THREE.MathUtils.lerp(A.tp.y-pr*0.92, -R0, 0.5), THREE.MathUtils.lerp(zF,zR,0.5));
  const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.22);
  const tubeG = new THREE.TubeGeometry(curve, 190, 0.0026, 5, true);
  g.add(new THREE.Mesh(tubeG, MAT.chain));
  // link plates
  const L = curve.getLength();
  const n = Math.max(40, Math.min(170, Math.round(L/0.0127)));
  const im = new THREE.InstancedMesh(G.box, MAT.chain, n);
  im.castShadow = true;
  const zAx = new THREE.Vector3(0,0,1);
  for(let i=0;i<n;i++){
    const u = i/n;
    const p = curve.getPointAt(u), t = curve.getTangentAt(u);
    _q.setFromUnitVectors(zAx, t);
    const w = (i%2)? 0.0092 : 0.0062;
    _m.compose(p, _q, new THREE.Vector3(w, 0.0088, 0.0122));
    im.setMatrixAt(i,_m);
  }
  im.instanceMatrix.needsUpdate = true;
  g.add(im);
  explodable(g, new THREE.Vector3(0,0.25,DZ*0.97), 0.26, 'Chain');
  A.chainLinks = n;
  return g;
}

/* =====================================================================
   14. BRAKES + CABLES
   ===================================================================== */
function buildBrakes(){
  const g = group('brakes', bike);
  const zc = -DZ*0.046;
  // front caliper on fork blade
  const fA = A.frontAxle, dirUp = A.crown.clone().sub(fA).normalize();
  const fc = group('fcal', g); labelize(fc,'Front brake caliper');
  const fp = fA.clone().addScaledVector(dirUp, 0.085); fp.z = zc;
  fc.add(part(G.box, MAT.dark, fp.x, fp.y, fp.z, 0.032,0.078,0.030, 0,0,(Math.PI/2 - A.ha)));
  fc.add(part(G.box, MAT.drive, fp.x, fp.y+0.030, fp.z, 0.024,0.022,0.026, 0,0,(Math.PI/2 - A.ha)));
  fc.add(bolt(0.005,0.026, MAT.steel, fp.x, fp.y+0.024, fp.z-DZ*0.004, Math.PI/2,0,0));
  fc.add(bolt(0.005,0.026, MAT.steel, fp.x-0.008, fp.y-0.024, fp.z-DZ*0.004, Math.PI/2,0,0));
  A.fHose = fp.clone().add(new THREE.Vector3(-0.012, 0.040, 0));
  explodable(fc, new THREE.Vector3(-0.3,0.1,-DZ), 0.24, 'Front caliper');
  // rear caliper near chainstay/seatstay junction
  const rc = group('rcal', g); labelize(rc,'Rear brake caliper');
  const rp = new THREE.Vector3(A.rearAxle.x+0.052, A.rearAxle.y+0.052, zc);
  rc.add(part(G.box, MAT.dark, rp.x, rp.y, rp.z, 0.070,0.030,0.030, 0,0,0.32));
  rc.add(part(G.box, MAT.drive, rp.x-0.028, rp.y-0.010, rp.z, 0.026,0.024,0.026));
  rc.add(bolt(0.005,0.026, MAT.steel, rp.x+0.024, rp.y+0.010, rp.z-DZ*0.004, Math.PI/2,0,0));
  rc.add(bolt(0.005,0.026, MAT.steel, rp.x-0.020, rp.y-0.006, rp.z-DZ*0.004, Math.PI/2,0,0));
  A.rHose = rp.clone().add(new THREE.Vector3(0.030, 0.014, 0));
  explodable(rc, new THREE.Vector3(0.25,0.25,-DZ), 0.24, 'Rear caliper');
  return g;
}

function cable(points, mat, r){
  return curveTube(points, r||0.0033, mat||MAT.cable, Math.max(24, points.length*8), 5);
}
function buildCables(ck){
  const g = group('cables', bike); labelize(g,'Cables & housing');
  const hoods = ck.hoods;
  const sc = A.stemClamp, ht = A.htTop, hb = A.htBot;
  const nearStem = s => sc.clone().add(new THREE.Vector3(0.010, 0.016, s*0.024));
  const htFront = s => ht.clone().add(new THREE.Vector3(0.026,-0.030, s*0.010)).addScaledVector(A.axisUp,-0.02);

  hoods.forEach((h,i)=>{
    const s = i===0?1:-1;
    const bend = h.clone().add(new THREE.Vector3(-0.055, 0.030, s*0.010));
    g.add(cable([h, bend, nearStem(s), htFront(s)], MAT.cable, 0.0034));
  });
  // front brake hose down the fork
  const fz = -DZ*0.05;
  g.add(cable([
    htFront(-1), hb.clone().add(new THREE.Vector3(0.010,-0.020, fz*0.4)),
    A.crown.clone().add(new THREE.Vector3(0.012,-0.010, fz*0.85)),
    A.crown.clone().lerp(A.frontAxle,0.45).add(new THREE.Vector3(-0.010,0,fz)),
    A.fHose
  ], MAT.cable, 0.0032));
  // rear brake hose along top tube + seatstay
  const ssMid = A.ssJoint.clone().lerp(A.rearAxle,0.5); ssMid.z = -DZ*0.048; ssMid.y += 0.012;
  g.add(cable([
    htFront(1), A.ttFront.clone().add(new THREE.Vector3(0.006,0.014,-DZ*0.012)),
    A.ttFront.clone().lerp(A.ttRear,0.5).add(new THREE.Vector3(0,0.019,-DZ*0.010)),
    A.ttRear.clone().add(new THREE.Vector3(0,0.016,-DZ*0.012)),
    A.ssJoint.clone().add(new THREE.Vector3(-0.006,0.004,-DZ*0.020)),
    ssMid, A.rHose
  ], MAT.cable, 0.0032));
  // rear shift cable along down tube + chainstay
  g.add(cable([
    htFront(-1).add(new THREE.Vector3(0,-0.004,0)),
    A.dtFront.clone().add(new THREE.Vector3(0.004,-0.020, DZ*0.014)),
    A.dtFront.clone().lerp(A.dtRear,0.55).add(new THREE.Vector3(0,-0.022, DZ*0.012)),
    new THREE.Vector3(0.030, -0.006, DZ*0.030),
    new THREE.Vector3(A.rearAxle.x*0.55, 0.006, DZ*0.052),
    new THREE.Vector3(A.rearAxle.x+0.030, A.rearAxle.y-0.020, DZ*0.058),
    new THREE.Vector3(A.rearAxle.x+0.030, A.rearAxle.y-0.038, DZ*0.056)
  ], MAT.cable, 0.0031));
  // front shift cable
  if(P.rings>1){
    const R0 = cogR(A.ringT[0]);
    const bp = A.stDir.clone().multiplyScalar((R0+0.060)/Math.sin(A.sa));
    g.add(cable([
      htFront(1).add(new THREE.Vector3(0,-0.010,0)),
      A.dtFront.clone().add(new THREE.Vector3(0.002,-0.024, DZ*0.006)),
      A.dtFront.clone().lerp(A.dtRear,0.6).add(new THREE.Vector3(0,-0.024, DZ*0.004)),
      new THREE.Vector3(0.010, 0.030, DZ*0.026),
      bp.clone().add(new THREE.Vector3(0.014,-0.030, DZ*0.024)),
      bp.clone().add(new THREE.Vector3(0.020,-0.008, DZ*0.022))
    ], MAT.cable, 0.0031));
  }
  explodable(g, new THREE.Vector3(0.15,0.55,-DZ*0.5), 0.20, 'Cables & housing');
  return g;
}

let explodeDisplay = 0;
function applyExplode(t){
  for(const o of explodeParts){
    const u = o.userData;
    o.position.copy(u.exBase).addScaledVector(u.exDir, t*u.exDist);
    if(u.exScale) o.scale.setScalar(1 + t*u.exScale);
  }
}
function rebuild(){
  disposeTree(bike);
  bikeRoot.remove(bike);
  explodeParts.length = 0;
  bike = group('bike', bikeRoot);
  A = solveGeometry();
  bikeRoot.position.set(0, A.wheelR - A.bbDrop + PLINTH_Y, 0);
  buildFrame();
  buildFork();
  buildHeadset();
  const ck = buildCockpit();
  buildSeat();
  buildWheel(A.frontAxle, false);
  buildWheel(A.rearAxle, true);
  buildDrivetrain();
  buildBrakes();
  buildCables(ck);
  bike.traverse(o=>{ if(o.isMesh||o.isInstancedMesh){ o.castShadow = true; o.receiveShadow = false; } });
  applyExplode(explodeDisplay);
  updateSpecs();
}

function EB(w,h,d,mat,x,y,z,ry,rx){
  const m = new THREE.Mesh(G.box, mat);
  m.scale.set(w,h,d); m.position.set(x,y,z);
  if(ry) m.rotation.y = ry; if(rx) m.rotation.x = rx;
  m.castShadow = true; m.receiveShadow = true; return m;
}
function EC(r,h,mat,x,y,z,rx,rz,seg){
  const m = new THREE.Mesh(seg===8?G.cyl8:G.cyl, mat);
  m.scale.set(r,h,r); m.position.set(x,y,z);
  if(rx) m.rotation.x = rx; if(rz) m.rotation.z = rz;
  m.castShadow = true; m.receiveShadow = true; return m;
}
function signTexture(lines, bg, fg){
  const [c,x] = cvs(512,256);
  x.fillStyle = bg; x.fillRect(0,0,512,256);
  x.strokeStyle = fg; x.lineWidth = 8; x.strokeRect(14,14,484,228);
  x.fillStyle = fg; x.textAlign='center';
  x.font = 'bold 62px "Bai Jamjuree", sans-serif';
  x.fillText(lines[0], 256, 110);
  x.font = '30px "JetBrains Mono", monospace';
  x.fillText(lines[1], 256, 170);
  x.fillRect(150,196,212,8);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

function propWheel(x,y,z,ry,r){
  const g = new THREE.Group(); g.position.set(x,y,z); g.rotation.y = ry; g.rotation.z = 0.12;
  const t = new THREE.Mesh(new THREE.TorusGeometry(r, r*0.085, 6, 26), EM.rub); g.add(t);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(r*0.88, r*0.045, 4, 26), EM.steel); g.add(rim);
  for(let i=0;i<6;i++){
    const sp = EB(r*1.7, 0.008, 0.008, EM.steel, 0,0,0);
    sp.rotation.z = i/6*Math.PI; g.add(sp);
  }
  g.add(EC(r*0.09, 0.06, EM.steel, 0,0,0, Math.PI/2,0,8));
  g.traverse(o=>{ if(o.isMesh){o.castShadow=true;} });
  return g;
}
function propFrame(x,y,z,ry,col){
  const g = new THREE.Group(); g.position.set(x,y,z); g.rotation.y = ry;
  const mat = new THREE.MeshToonMaterial({color:col, gradientMap:GRAD.g4});
  const P0=new THREE.Vector3(0,0,0), HT=new THREE.Vector3(0.62,0.50,0), STp=new THREE.Vector3(-0.16,0.52,0),
        RA=new THREE.Vector3(-0.42,0.02,0), HB=new THREE.Vector3(0.56,0.36,0);
  g.add(tube(P0,STp,0.019,0.016,mat,8));
  g.add(tube(P0,HB,0.024,0.020,mat,8));
  g.add(tube(STp,HT,0.017,0.016,mat,8));
  g.add(tube(HB,HT,0.023,0.021,mat,8));
  for(const s of [1,-1]){
    g.add(tube(new THREE.Vector3(0,0,s*0.03), RA.clone().setZ(s*0.05),0.010,0.008,mat,6));
    g.add(tube(STp.clone().setZ(s*0.015), RA.clone().setZ(s*0.05),0.008,0.007,mat,6));
  }
  g.traverse(o=>{ if(o.isMesh) o.castShadow=true; });

}
function buildWarehouse(){
  const W = warehouse;
  // ---- floor ----
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(30,30), EM.floor);
  fl.rotation.x = -Math.PI/2; fl.receiveShadow = true; W.add(fl);
  // hazard bay markings
  const bay = new THREE.Mesh(new THREE.RingGeometry(1.55,1.78,44,1), EM.hazard);
  bay.rotation.x = -Math.PI/2; bay.position.y = 0.004; W.add(bay);
  for(const s of [1,-1]){
    const st = EB(6.4,0.006,0.16, EM.hazard, 0,0.003, s*3.2); W.add(st);
  }
  // low display plinth
  const pl = new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.56,0.05,42), EM.dark);
  pl.position.y = 0.025; pl.receiveShadow = true; W.add(pl);
  const plTop = new THREE.Mesh(new THREE.CylinderGeometry(1.44,1.44,0.055,42), EM.wall2);
  plTop.position.y = 0.03; plTop.receiveShadow = true; W.add(plTop);

  // ---- walls ----
  const H = 5.4, RX = 7.2, RZ = 6.2;
  const mkWall=(w,x,z,ry)=>{
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w,H), EM.wall);
    m.position.set(x,H/2,z); m.rotation.y = ry; m.receiveShadow = true; W.add(m);
    const ix = x===0 ? 0 : -Math.sign(x)*0.05, iz = z===0 ? 0 : -Math.sign(z)*0.05;
    W.add(EB(w,1.0,0.06, EM.wall2, x+ix, 0.5, z+iz, ry));
    W.add(EB(w,0.09,0.09, EM.red, x+ix*1.2, 1.05, z+iz*1.2, ry));
  };
  mkWall(2*RX, 0, RZ, 0);
  mkWall(2*RX, 0, -RZ, Math.PI);
  mkWall(2*RZ, -RX, 0, Math.PI/2);
  mkWall(2*RZ, RX, 0, -Math.PI/2);
  // ceiling
  const ce = new THREE.Mesh(new THREE.PlaneGeometry(2*RX,2*RZ), EM.wall2);
  ce.rotation.x = Math.PI/2; ce.position.y = H; W.add(ce);
  // trusses
  for(let i=-2;i<=2;i++){
    const z = i*2.6;
    W.add(EB(2*RX,0.20,0.16, EM.beam, 0, H-0.20, z));
    W.add(EB(2*RX,0.05,0.05, EM.beam, 0, H-0.62, z));
    for(let k=-3;k<=3;k++) W.add(EB(0.05,0.46,0.05, EM.beam, k*1.9, H-0.42, z, 0, 0));

function buildSpecList(){

function estWeight(){
  const ff = FINISH_W[P.frameFinish]||1;
  const fkf = FINISH_W[P.forkMatch?P.frameFinish:P.forkFinish]||1;
  const df = FINISH_W[P.driveFinish]||1;
  let frame = 1.02 + (mm(P.seatTube)-0.50)*0.62 + (mm(P.reach)-0.385)*0.95
            + (mm(P.stack)-0.560)*0.42 + (mm(P.chainstay)-0.415)*0.75 - P.compact*0.075;
  frame = Math.max(0.72, frame)*ff;
  const fork   = 0.415*fkf;
  const wheels = 1.34 + (P.tire-25)*0.0125 + (P.rimDepth-30)*0.0038 + (P.spokes-24)*0.0065;
  const tyres  = 0.44 + (P.tire-25)*0.016;
  const cass   = (0.135 + P.cogs*0.0225)*df;
  const chain  = 0.205 + P.cogs*0.0042;
  const crank  = (0.505 + P.rings*0.082 + (P.crankLen-170)*0.0009)*df;
  const der    = 0.245 + (P.rings>1?0.096:0);
  const brakes = 0.71;
  const bar    = (P.barType==='flat'?0.16:0.235) + (P.barWidth-400)*0.0004 + P.barRise*0.0007;
  const stem   = 0.10 + (P.stemLen-90)*0.0007;
  const post   = 0.165 + mm(P.postExt)*0.42;
  const saddle = 0.205;
  const misc   = 0.20;
  return frame+fork+wheels+tyres+cass+chain+crank+der+brakes+bar+stem+post+saddle+misc;
}
function updateSpecs(){
  const S = SPEC_EL; if(!S.stack) return;
  const f1 = v=>v.toFixed(1);
  S.stack.textContent = Math.round(P.stack)+' mm';
  S.reach.textContent = Math.round(P.reach)+' mm';
  S.hta.textContent   = f1(P.headAngle)+'°';
  S.sta.textContent   = f1(P.seatAngle)+'°';
  S.stl.textContent   = Math.round(P.seatTube)+' mm';
  S.cs.textContent    = Math.round(P.chainstay)+' mm';
  S.wb.textContent    = Math.round(A.wheelbase*1000)+' mm';
  S.trail.textContent = Math.round(A.trail*1000)+' mm';
  S.comp.textContent  = Math.round(P.compact*100)+' %';
  S.ss.textContent    = P.dropped?'Dropped':'Standard';
  S.rings.textContent = P.rings+'× ('+A.ringT.join('/')+'T)';
  S.cass.textContent  = P.cogs+'sp '+A.cogT[0]+'-'+A.cogT[A.cogT.length-1]+'T';
  S.chain.textContent = (A.chainLinks||0)+' links';
  S.fa.textContent    = (P.saddleFA>0?'+':'')+Math.round(P.saddleFA)+' mm';
  S.bw.textContent    = Math.round(P.barWidth)+' mm';
  S.br.textContent    = Math.round(P.barRise)+' mm';
  S.bf.textContent    = Math.round(P.barFlare)+'°';
  S.stem.textContent  = Math.round(P.stemLen)+' mm';
  S.tyre.textContent  = P.tire+' mm';
  S.rim.textContent   = P.rimDepth+' mm';
  S.wheel.textContent = Math.round(A.wheelR*2000)+' mm';
  S.fin.textContent   = P.frameFinish.toUpperCase();
  S.exp.textContent   = Math.round(P.explode*100)+' %';
  document.getElementById('sp-dt').textContent = P.rings+'×'+P.cogs;
  document.getElementById('sp-gears').textContent = (P.rings*P.cogs)+' gears';
  document.getElementById('sp-weight').innerHTML = estWeight().toFixed(2)+'<small style="font-size:12px"> kg</small>';
}

function fmtVal(it, v){
  const m = it.mul||1;
  const x = v*m;
  return (it.dec!==undefined ? x.toFixed(it.dec) : Math.round(x)) + (it.unit||'');
}
function applyAct(it){
  const a = it.act||'build';
  if(a==='build') scheduleRebuild();
  else if(a==='mat'){ refreshMaterials(); }
  else if(a==='post'){ postMat.uniforms.poster.value=P.poster; postMat.uniforms.outline.value=P.outline; postMat.uniforms.dither.value=P.dither; }
  else if(a==='pixel'){ resizeRT(); }
  else if(a==='env'){ warehouse.visible = P.env; }
  else if(a==='tube'){ bike.traverse(o=>{ if(o.name==='innertube') o.visible = P.showTube; }); }
  updateSpecs();
}
function mkSlider(it){
  const d = el('div','ctrl');
  const row = el('div','row'); row.appendChild(el('span',null,it.label));
  const b = el('b'); row.appendChild(b); d.appendChild(row);
  const inp = document.createElement('input');
  inp.type='range'; inp.min=it.min; inp.max=it.max; inp.step=it.step;
  const div = it.div||1;
  const set = v=>{ inp.value = v*div; b.textContent = fmtVal(it, v); };
  set(P[it.k]);
  inp.addEventListener('input', ()=>{ P[it.k] = parseFloat(inp.value)/div; b.textContent = fmtVal(it, P[it.k]); applyAct(it); });
  d.appendChild(inp);
  ctlRefs[it.k] = set;
  return d;
}

  const btns = it.opts.map(([v,lab])=>{
    const b = el('button',null,lab);
    b.addEventListener('click', ()=>{ P[it.k] = v; upd(); applyAct(it); });
    s.appendChild(b); return [b,v];
  });
  const upd = ()=>btns.forEach(([b,v])=>b.classList.toggle('on', P[it.k]===v));
  upd(); d.appendChild(s);
  ctlRefs[it.k] = upd;
  return d;
}
function mkToggle(it){
  const d = el('div','tog');
  d.appendChild(el('div','sw'));
  d.appendChild(el('span',null,it.label));
  const upd = ()=>d.classList.toggle('on', !!P[it.k]);
  d.addEventListener('click', ()=>{ P[it.k] = !P[it.k]; upd(); applyAct(it); });
  upd();
  ctlRefs[it.k] = upd;
  return d;
}
function mkColor(it){
  const wrap = el('div');
  const row = el('div','colorRow');
  row.appendChild(el('span',null,it.label));
  const inp = document.createElement('input'); inp.type='color'; inp.value = P[it.k];
  row.appendChild(inp);
  const sws = el('div','swatches');
  const btns = PALETTE.map(c=>{
    const b = el('div','sw-btn'); b.style.background = c;
    b.addEventListener('click', ()=>{ P[it.k]=c; inp.value=c; upd(); applyAct(it); });
    sws.appendChild(b); return [b,c];
  });
  const upd = ()=>{ inp.value = P[it.k]; btns.forEach(([b,c])=>b.classList.toggle('on', c.toLowerCase()===String(P[it.k]).toLowerCase())); };
  inp.addEventListener('input', ()=>{ P[it.k]=inp.value; upd(); applyAct(it); });
  upd();
  wrap.appendChild(row); wrap.appendChild(sws);
  ctlRefs[it.k] = upd;
  return wrap;
}
function mkButtons(it){
  const s = el('div','seg');
  it.opts.forEach(([v,lab])=>{
    const b = el('button',null,lab);
    b.addEventListener('click', ()=>{ Object.assign(P, PRESETS[v]); refreshAllUI(); refreshMaterials(); scheduleRebuild(); });
    s.appendChild(b);
  });
  const d = el('div','ctrl'); d.appendChild(s); return d;
}
function refreshAllUI(){ for(const k in ctlRefs) ctlRefs[k](P[k]); }

function buildUI(){
  const body = document.getElementById('panelBody');
  SECTIONS.forEach(sec=>{
    const s = el('div','sec'+(sec.open?'':' closed'));
    const h = el('h3'); h.appendChild(el('i','dot')); h.appendChild(el('span',null,sec.title));
    h.appendChild(el('span','arw','▼'));
    h.addEventListener('click', ()=>s.classList.toggle('closed'));
    s.appendChild(h);
    const b = el('div','body');
    sec.items.forEach(it=>{
      if(it.t==='slider') b.appendChild(mkSlider(it));
      else if(it.t==='seg') b.appendChild(mkSeg(it));
      else if(it.t==='toggle') b.appendChild(mkToggle(it));
      else if(it.t==='color') b.appendChild(mkColor(it));
      else if(it.t==='buttons') b.appendChild(mkButtons(it));
      else if(it.t==='hint') b.appendChild(el('div','hint', it.html));
    });
    s.appendChild(b); body.appendChild(s);
  });
}

/* ---- bottom bar wiring ---- */
const CAMS = {
  three:  [[2.35,1.24,-2.55],[0.15,0.72,0]],
  side:   [[0.05,0.80,-3.10],[0.05,0.72,0]],
  front:  [[2.75,1.05,-0.55],[0.35,0.80,0]],
  cockpit:[[1.15,1.32,-0.80],[0.48,0.98,0]],
  drive:  [[0.15,0.52,-1.10],[-0.12,0.34,0]]
};
let camTween = null;
function flyTo(name){
  const c = CAMS[name]; if(!c) return;
  camTween = {p0:camera.position.clone(), t0:controls.target.clone(),
              p1:new THREE.Vector3(...c[0]), t1:new THREE.Vector3(...c[1]), u:0};
}
document.querySelectorAll('[data-cam]').forEach(b=>b.addEventListener('click', ()=>flyTo(b.dataset.cam)));
const expSlider = document.getElementById('explodeSlider'), expVal = document.getElementById('explodeVal');
expSlider.addEventListener('input', ()=>{ P.explode = parseFloat(expSlider.value)/100; expVal.textContent = Math.round(P.explode*100)+'%'; updateSpecs(); });
document.getElementById('btnSpin').addEventListener('click', e=>{
  controls.autoRotate = !controls.autoRotate; controls.autoRotateSpeed = 0.9;
  e.currentTarget.classList.toggle('on', controls.autoRotate);
});
document.getElementById('btnUI').addEventListener('click', e=>{
  document.body.classList.toggle('hiddenUI');
  e.currentTarget.textContent = document.body.classList.contains('hiddenUI') ? 'Show UI' : 'Hide UI';
});
document.getElementById('btnReset').addEventListener('click', ()=>{
  Object.assign(P, DEFAULTS);
  expSlider.value = 0; expVal.textContent='0%';
  refreshAllUI(); refreshMaterials(); resizeRT();
  postMat.uniforms.poster.value=P.poster; postMat.uniforms.outline.value=P.outline; postMat.uniforms.dither.value=P.dither;
  warehouse.visible = P.env;
  scheduleRebuild(); flyTo('three');
});

/* ---- hover labels ---- */
const ray = new THREE.Raycaster();
const pointer = new THREE.Vector2(-5,-5);
const tip = document.getElementById('tip');
let hoverTimer = 0;
addEventListener('pointermove', e=>{
  pointer.set((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
  tip.style.left = e.clientX+'px'; tip.style.top = e.clientY+'px';
});
function updateHover(){
  ray.setFromCamera(pointer, camera);
  const hits = ray.intersectObject(bike, true);
  let label = null;
  if(hits.length){
    let o = hits[0].object;
    while(o && o!==bike){ if(o.userData && o.userData.label){ label = o.userData.label; break; } o = o.parent; }
  }
  if(label){ tip.textContent = label; tip.classList.add('on'); }
  else tip.classList.remove('on');
}

/* =====================================================================
   19. BOOT + LOOP
   ===================================================================== */
buildWarehouse();
buildSpecList();
refreshMaterials();
rebuild();
buildUI();
warehouse.visible = P.env;

const fpsEl = document.getElementById('fps');
let last = performance.now(), acc = 0, frames = 0;
function animate(now){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05,(now-last)/1000); last = now;
  if(dirty){ dirty = false; rebuild(); }
  // exploded view interpolation
  if(Math.abs(P.explode-explodeDisplay) > 0.0008){
    explodeDisplay += (P.explode-explodeDisplay)*Math.min(1, dt*7.5);
    applyExplode(explodeDisplay);
  }
  // camera tween
  if(camTween){
    camTween.u = Math.min(1, camTween.u + dt*1.5);
    const s = camTween.u<0.5 ? 2*camTween.u*camTween.u : 1-Math.pow(-2*camTween.u+2,2)/2;
    camera.position.lerpVectors(camTween.p0, camTween.p1, s);
    controls.target.lerpVectors(camTween.t0, camTween.t1, s);
    if(camTween.u>=1) camTween = null;
  }
  controls.update();
  hoverTimer += dt;
  if(hoverTimer>0.09){ hoverTimer = 0; updateHover(); }
  renderer.setRenderTarget(rt);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.render(quadScene, quadCam);
  acc += dt; frames++;
  if(acc>0.5){ fpsEl.textContent = Math.round(frames/acc)+' fps'; acc=0; frames=0; }
}
requestAnimationFrame(animate);
setTimeout(()=>{
  document.getElementById('ldbar').style.width='100%';
  setTimeout(()=>document.getElementById('loader').classList.add('hide'), 260);
}, 220);



</script>
