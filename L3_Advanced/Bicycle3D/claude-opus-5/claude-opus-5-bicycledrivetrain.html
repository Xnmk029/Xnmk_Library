<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>低多边形自行车传动系统 — 演示台 (OPUS)</title>
<style>
  :root{
    --cyan:#2fe6ff;
    --cyan-dim:rgba(47,230,255,.45);
    --magenta:#ff3d81;
    --amber:#ffc44d;
    --ink:#e8f4fb;
    --ink-dim:#8fa6b6;
    --glass:rgba(10,18,26,.62);
    --stroke:rgba(47,230,255,.22);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; overflow:hidden; background:#05080d; }
  body{
    font-family:var(--sans);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    touch-action:none;
  }
  #app{ position:fixed; inset:0; }
  canvas{ display:block; }

  /* ---------- HUD panel ---------- */
  #hud{
    position:fixed;
    top:18px; right:18px;
    width:268px;
    padding:16px 16px 14px;
    border-radius:16px;
    background:var(--glass);
    border:1px solid var(--stroke);
    backdrop-filter:blur(16px) saturate(140%);
    -webkit-backdrop-filter:blur(16px) saturate(140%);
    box-shadow:
      0 18px 50px rgba(0,0,0,.55),
      0 0 0 1px rgba(255,255,255,.03) inset,
      0 0 32px -14px var(--cyan-dim);
    z-index:10;
    user-select:none;
  }
  #hud .brand{
    display:flex; align-items:center; gap:8px;
    margin-bottom:2px;
  }
  #hud .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 10px var(--cyan);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
  #hud h1{
    margin:0; font-size:12.5px; font-weight:650;
    letter-spacing:.14em; text-transform:uppercase;
  }
  #hud .sub{
    font-family:var(--mono); font-size:9.5px; letter-spacing:.18em;
    color:var(--ink-dim); text-transform:uppercase; margin-bottom:13px;
  }

  .rule{ height:1px; background:linear-gradient(90deg,var(--stroke),transparent); margin:12px 0; }

  /* ---------- gear readout ---------- */
  .readout{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:10px; margin-bottom:9px;
  }
  .readout .lbl{
    font-family:var(--mono); font-size:9.5px; letter-spacing:.18em;
    color:var(--ink-dim); text-transform:uppercase;
  }
  #gearBig{
    font-family:var(--mono); font-weight:700;
    font-size:30px; line-height:.92; letter-spacing:-.02em;
    color:var(--cyan);
    text-shadow:0 0 22px var(--cyan-dim);
    font-variant-numeric:tabular-nums;
  }
  #gearBig small{ font-size:14px; color:var(--ink-dim); text-shadow:none; font-weight:600; }
  .meta{ text-align:right; font-family:var(--mono); font-size:10px; color:var(--ink-dim); line-height:1.55; }
  .meta b{ color:var(--ink); font-weight:600; }

  /* ---------- gear ladder ---------- */
  #ladder{ display:flex; gap:4px; margin:2px 0 4px; }
  #ladder .seg{
    flex:1; height:22px; border-radius:5px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.06);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:9px; color:var(--ink-dim);
    transition:background .22s, color .22s, box-shadow .22s, border-color .22s;
    cursor:pointer;
  }
  #ladder .seg:hover{ background:rgba(47,230,255,.12); color:var(--ink); }
  #ladder .seg.on{
    background:linear-gradient(180deg, rgba(47,230,255,.9), rgba(47,230,255,.55));
    border-color:rgba(47,230,255,.9);
    color:#04222b; font-weight:700;
    box-shadow:0 0 16px var(--cyan-dim);
  }

  /* ---------- buttons ---------- */
  button{
    font-family:var(--sans); color:var(--ink);
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.10);
    border-radius:9px;
    padding:9px 10px;
    font-size:11.5px; font-weight:600; letter-spacing:.06em;
    cursor:pointer;
    transition:background .18s, border-color .18s, transform .08s, box-shadow .18s, color .18s;
  }
  button:hover:not(:disabled){
    background:rgba(47,230,255,.14);
    border-color:rgba(47,230,255,.42);
    box-shadow:0 0 18px -6px var(--cyan-dim);
  }
  button:active:not(:disabled){ transform:translateY(1px); }
  button:disabled{ opacity:.3; cursor:not-allowed; }
  #btnMotor{ width:100%; margin-bottom:7px; display:flex; align-items:center; justify-content:center; gap:8px; }
  #btnMotor .glyph{ font-size:12px; line-height:1; }
  #btnMotor.paused{ border-color:rgba(255,196,77,.45); color:var(--amber); }
  #btnMotor.paused:hover{ background:rgba(255,196,77,.14); box-shadow:0 0 18px -6px rgba(255,196,77,.5); }
  .shiftRow{ display:grid; grid-template-columns:1fr 1fr; gap:7px; }

  /* ---------- slider ---------- */
  .field{ margin-top:11px; }
  .field .row{
    display:flex; justify-content:space-between; align-items:center;
    font-family:var(--mono); font-size:9.5px; letter-spacing:.14em;
    color:var(--ink-dim); text-transform:uppercase; margin-bottom:6px;
  }
  .field .row span{ color:var(--cyan); }
  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:100%; height:3px; border-radius:2px;
    background:linear-gradient(90deg,var(--cyan) 0%, rgba(255,255,255,.1) 0%);
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:13px; height:13px; border-radius:50%;
    background:var(--cyan); border:2px solid #06121a;
    box-shadow:0 0 12px var(--cyan-dim); cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:11px; height:11px; border-radius:50%;
    background:var(--cyan); border:2px solid #06121a;
    box-shadow:0 0 12px var(--cyan-dim); cursor:pointer;
  }

  .toggleRow{ display:flex; gap:7px; margin-top:9px; }
  .toggleRow button{ flex:1; font-size:10.5px; padding:7px 6px; }
  .toggleRow button.on{
    background:rgba(47,230,255,.16); border-color:rgba(47,230,255,.5); color:var(--cyan);
  }

  .hint{
    margin-top:12px;
    font-family:var(--mono); font-size:9px; line-height:1.7;
    color:rgba(143,166,182,.72); letter-spacing:.04em;
  }
  .hint kbd{
    font-family:var(--mono); font-size:8.5px;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.10);
    border-radius:4px; padding:1px 4px; color:var(--ink);
  }

  /* ---------- corner plate ---------- */
  #plate{
    position:fixed; left:20px; bottom:18px; z-index:10;
    font-family:var(--mono); font-size:9.5px; letter-spacing:.16em;
    color:rgba(143,166,182,.6); text-transform:uppercase; line-height:1.9;
    pointer-events:none;
  }
  #plate b{ color:var(--cyan); font-weight:600; letter-spacing:.2em; }

  /* ---------- loader ---------- */
  #loader{
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    background:#05080d; transition:opacity .7s ease;
  }
  #loader.gone{ opacity:0; pointer-events:none; }
  #loader .ring{
    width:38px; height:38px; border-radius:50%;
    border:2px solid rgba(47,230,255,.16);
    border-top-color:var(--cyan);
    animation:spin .85s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg) } }
  #loader p{
    margin:0; font-family:var(--mono); font-size:10px;
    letter-spacing:.22em; text-transform:uppercase; color:var(--ink-dim);
    text-align:center; max-width:340px; line-height:1.9; padding:0 20px;
  }
  #loader p.err{ color:var(--magenta); letter-spacing:.1em; text-transform:none; }

  @media (max-width:640px){
    #hud{ width:auto; left:12px; right:12px; top:12px; padding:13px; }
    #gearBig{ font-size:26px; }
    #plate{ display:none; }
  }
</style>
</head>
<body>

<div id="app"></div>

<!-- ==================== HUD ==================== -->
<div id="hud">
  <div class="brand"><span class="dot"></span><h1>自行车传动系统演示台</h1></div>
  <div class="sub">Low-Poly · WebGL · 7-Speed Rig</div>

  <div class="readout">
    <div>
      <div class="lbl">Gear</div>
      <div id="gearBig">4<small> / 7</small></div>
    </div>
    <div class="meta">
      <div>COG <b id="mCog">22T</b></div>
      <div>RING <b id="mRing">44T</b></div>
      <div>RATIO <b id="mRatio">2.00</b></div>
    </div>
  </div>

  <div id="ladder"></div>

  <div class="rule"></div>

  <button id="btnMotor"><span class="glyph">❚❚</span><span id="motorLabel">暂停电机</span></button>
  <div class="shiftRow">
    <button id="btnDown">▼ 降档 (Shift Down)</button>
    <button id="btnUp">升档 ▲ (Shift Up)</button>
  </div>

  <div class="field">
    <div class="row">Cadence <span id="rpmVal">28 RPM</span></div>
    <input id="rpm" type="range" min="8" max="90" step="1" value="28" />
  </div>

  <div class="toggleRow">
    <button id="btnOrbit">自动视角旋转</button>
    <button id="btnView">重置视角</button>
  </div>

  <div class="hint">
    <kbd>Space</kbd> motor · <kbd>↑</kbd><kbd>↓</kbd> shift<br />
    Drag to orbit · Scroll to zoom
  </div>
</div>

<div id="plate">
  <b>Booth&nbsp;07</b> — Dynamic Drivetrain<br />
  Procedural geometry · No external assets
</div>

<div id="loader">
  <div class="ring"></div>
  <p id="loadMsg">Initialising WebGL Stand</p>
</div>

<script>
  // If the module never boots (offline / blocked CDN) tell the user instead of spinning forever.
  window.__booted = false;
  setTimeout(() => {
    if (window.__booted) return;
    const p = document.getElementById('loadMsg');
    const r = document.querySelector('#loader .ring');
    if (r) r.style.display = 'none';
    if (p) {
      p.className = 'err';
      p.textContent = 'Could not load Three.js r170 from unpkg. This demo pulls the library from a CDN — check your network connection and reload.';
    }
  }, 12000);
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const TAU = Math.PI * 2;
const clamp = THREE.MathUtils.clamp;
const lerp  = THREE.MathUtils.lerp;

/* ============================================================
   DRIVETRAIN SPECIFICATION
   Every radius is derived from a single chain pitch so the
   rollers genuinely land between the teeth and each sprocket
   turns at the physically correct rate.
   ============================================================ */
const CHAIN_PITCH   = 0.16;
const pitchRadius   = n => CHAIN_PITCH / (2 * Math.sin(Math.PI / n));

const RING_TEETH    = 44;
const R_RING        = pitchRadius(RING_TEETH);
const COG_TEETH     = [32, 28, 25, 22, 19, 16, 13];   // gear 1 (easiest) → 7 (hardest)
const COG_R         = COG_TEETH.map(pitchRadius);
const N_GEARS       = COG_TEETH.length;
const COG_SPACING   = 0.12;
const COG_Z0        = -0.36;
const COG_Z         = COG_TEETH.map((_, i) => COG_Z0 + i * COG_SPACING);

const PULLEY_TEETH  = 11;
const R_PULLEY      = pitchRadius(PULLEY_TEETH);

const BB   = new THREE.Vector3(-2.0,  0.35, 0);
const HUB  = new THREE.Vector3( 2.0,  0.35, 0);
const HANGER = new THREE.Vector3(2.34, -0.10, 0.60);

const CAGE_OFFSET = new THREE.Vector3(0.26, -0.74, 0);   // guide → tension pulley
const LINK_A = 0.95;   // b-knuckle arm
const LINK_B = 0.85;   // parallelogram arm
const N_LINKS = 100;

/* ============================================================
   RENDERER / SCENE
   ============================================================ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
app.appendChild(renderer.domElement);

const BG = 0x05080d;
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 14, 44);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
const HOME_CAM = new THREE.Vector3(4.9, 2.15, 7.9);
const HOME_TGT = new THREE.Vector3(0, -0.35, 0);
camera.position.copy(HOME_CAM);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME_TGT);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.rotateSpeed = 0.85;
controls.minDistance = 3.2;
controls.maxDistance = 24;
controls.minPolarAngle = 0.06;
controls.maxPolarAngle = Math.PI * 0.495;
controls.autoRotateSpeed = 0.9;
controls.update();

/* ---------- procedural studio environment (drives the metals) ---------- */
(function buildEnvironment () {
  const env = new THREE.Scene();
  env.background = new THREE.Color(0x090d13);
  const panel = (hex, w, h, p, r) => {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: hex, side: THREE.DoubleSide })
    );
    m.position.set(p[0], p[1], p[2]);
    if (r) m.rotation.set(r[0], r[1], 0);
    env.add(m);
  };
  panel(0xffffff, 15,  9, [ 0,  9,  0], [Math.PI / 2, 0]);   // key softbox overhead
  panel(0x1ec8ff, 11, 10, [-9,  1,  2], [0,  Math.PI / 2]);  // cyan booth wall
  panel(0xff3a86,  9,  9, [ 9,  1, -2], [0, -Math.PI / 2]);  // magenta booth wall
  panel(0x6f97e0, 13,  8, [ 0,  1,-10], [0, 0]);             // cool backdrop
  panel(0x0d1219, 24, 24, [ 0, -8,  0], [-Math.PI / 2, 0]);  // dark floor bounce

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(env, 0.02).texture;
  if ('environmentIntensity' in scene) scene.environmentIntensity = 1.05;
  pmrem.dispose();
})();

/* ============================================================
   MATERIALS — matte dark aluminium, chrome, glowing acrylic
   ============================================================ */
const M = {
  alu: new THREE.MeshStandardMaterial({ color: 0x424b55, metalness: 0.42, roughness: 0.5, flatShading: true }),
  aluDark: new THREE.MeshStandardMaterial({ color: 0x252b33, metalness: 0.34, roughness: 0.62, flatShading: true }),
  chrome: new THREE.MeshStandardMaterial({ color: 0xc4d2df, metalness: 0.95, roughness: 0.29, flatShading: true }),
  steel: new THREE.MeshStandardMaterial({ color: 0x93a0ac, metalness: 1.0, roughness: 0.33, flatShading: true }),
  rubber: new THREE.MeshStandardMaterial({ color: 0x0e1116, metalness: 0.1, roughness: 0.92, flatShading: true }),
  acrylic: new THREE.MeshPhysicalMaterial({
    color: 0x63d8ff, metalness: 0, roughness: 0.08,
    transparent: true, opacity: 0.15, side: THREE.DoubleSide,
    clearcoat: 1, clearcoatRoughness: 0.04, depthWrite: false, flatShading: true
  }),
  edge: new THREE.LineBasicMaterial({ color: 0x7df3ff, transparent: true, opacity: 0.85 }),
  ledCyan: new THREE.MeshBasicMaterial({ color: 0x1ea8c4 }),
  ledCyanSoft: new THREE.MeshBasicMaterial({ color: 0x146d80 }),
  ledMagenta: new THREE.MeshBasicMaterial({ color: 0xb02a5c }),
  ledAmber: new THREE.MeshBasicMaterial({ color: 0xb08434 }),
  deck: new THREE.MeshStandardMaterial({ color: 0x11161d, metalness: 0.55, roughness: 0.45, flatShading: true }),
  floor: new THREE.MeshStandardMaterial({ color: 0x080b10, metalness: 0.42, roughness: 0.62 })
};

/* helper: mesh with shadow flags */
function mesh (geo, mat, cast = true, receive = true) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = cast; m.receiveShadow = receive;
  return m;
}
/* helper: cylinder whose axle runs along world Z */
function axleCyl (r1, r2, len, seg, mat) {
  const g = new THREE.CylinderGeometry(r1, r2, len, seg);
  g.rotateX(Math.PI / 2);
  return mesh(g, mat);
}

/* ============================================================
   LIGHTING — soft ambient + studio spot + coloured booth rims
   ============================================================ */
scene.add(new THREE.HemisphereLight(0x9fd4ff, 0x0a0f16, 0.95));
scene.add(new THREE.AmbientLight(0x2b4055, 0.7));

const spot = new THREE.SpotLight(0xffffff, 460, 40, 0.62, 0.62, 2);
spot.position.set(3.0, 8.6, 4.6);
spot.castShadow = true;
spot.shadow.mapSize.set(2048, 2048);
spot.shadow.camera.near = 1.5;
spot.shadow.camera.far = 26;
spot.shadow.bias = -0.0006;
spot.shadow.normalBias = 0.022;
spot.shadow.radius = 3;
spot.target.position.set(0, -0.2, 0);
scene.add(spot, spot.target);

const rimCyan = new THREE.DirectionalLight(0x2fe6ff, 0.85);
rimCyan.position.set(-7, 2.4, -5);
scene.add(rimCyan);

const rimMag = new THREE.DirectionalLight(0xff3d81, 0.5);
rimMag.position.set(6.5, 1.2, -6);
scene.add(rimMag);

const fill = new THREE.DirectionalLight(0xbcd9ff, 0.9);
fill.position.set(5, 3, 8);
scene.add(fill);

/* ============================================================
   FLOOR — dark deck, glowing grid, booth dais
   ============================================================ */
const floor = mesh(new THREE.PlaneGeometry(90, 90), M.floor, false, true);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -3.14;
scene.add(floor);

const grid = new THREE.GridHelper(90, 90, 0x2fe6ff, 0x0f4152);
grid.position.y = -3.12;
grid.material.transparent = true;
grid.material.opacity = 0.42;
grid.material.depthWrite = false;
scene.add(grid);

const dais = mesh(new THREE.CylinderGeometry(5.4, 5.75, 0.5, 8), M.deck);
dais.position.y = -2.88;
scene.add(dais);

const daisRim = new THREE.Mesh(new THREE.CylinderGeometry(5.46, 5.46, 0.03, 8), M.ledCyanSoft);
daisRim.position.y = -2.672;
scene.add(daisRim);

/* ============================================================
   SPROCKET FACTORY
   Body = low-poly disc (optionally with lightening holes),
   teeth = one InstancedMesh of tapered 4-sided prisms whose
   tips reach just past the chain's pitch circle.
   ============================================================ */
const TOOTH_H = 0.145;
const TOOTH_GEO = (() => {
  const g = new THREE.CylinderGeometry(0.026, 0.05, TOOTH_H, 4);
  g.rotateY(Math.PI / 4);            // flats face laterally
  g.translate(0, TOOTH_H / 2, 0);    // pivot at the tooth root
  return g;
})();

function makeSprocket (teeth, thickness, opts = {}) {
  const {
    bodyColor = 0x30363e,
    holes = 0,
    holeR = 0.3,
    holeAt = 0.55,
    toothWidth = null,
    hubR = 0.16
  } = opts;

  const r = pitchRadius(teeth);
  const rootR = r - 0.09;          // tooth root, tucked just inside the body rim
  const bodyR = r - 0.075;
  const grp = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({
    color: bodyColor, metalness: 0.5, roughness: 0.44, flatShading: true,
    emissive: 0x0aa8d8, emissiveIntensity: 0
  });
  grp.userData.bodyMat = bodyMat;

  let bodyGeo;
  if (holes > 0) {
    const shape = new THREE.Shape();
    shape.absarc(0, 0, bodyR, 0, TAU, false);
    for (let i = 0; i < holes; i++) {
      const a = (i / holes) * TAU + Math.PI / holes;
      const p = new THREE.Path();
      p.absarc(Math.cos(a) * bodyR * holeAt, Math.sin(a) * bodyR * holeAt, holeR, 0, TAU, true);
      shape.holes.push(p);
    }
    const inner = new THREE.Path();
    inner.absarc(0, 0, hubR, 0, TAU, true);
    shape.holes.push(inner);
    bodyGeo = new THREE.ExtrudeGeometry(shape, { depth: thickness, bevelEnabled: false, curveSegments: 22 });
    bodyGeo.translate(0, 0, -thickness / 2);
  } else {
    bodyGeo = new THREE.CylinderGeometry(bodyR, bodyR, thickness, Math.min(teeth, 22));
    bodyGeo.rotateX(Math.PI / 2);
  }
  grp.add(mesh(bodyGeo, bodyMat));

  const tw = toothWidth ?? thickness * 0.92;
  const teethMesh = new THREE.InstancedMesh(TOOTH_GEO, M.chrome, teeth);
  teethMesh.castShadow = true; teethMesh.receiveShadow = true;
  const mat4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  const pos = new THREE.Vector3(), scl = new THREE.Vector3(1, 1, tw / 0.078);
  for (let i = 0; i < teeth; i++) {
    const a = (i / teeth) * TAU;
    e.set(0, 0, a - Math.PI / 2);
    q.setFromEuler(e);
    pos.set(Math.cos(a) * rootR, Math.sin(a) * rootR, 0);
    teethMesh.setMatrixAt(i, mat4.compose(pos, q, scl));
  }
  grp.add(teethMesh);

  grp.userData.radius = r;
  return grp;
}

/* ============================================================
   FRONT DRIVETRAIN — crankset, spider, chainring, pedals
   ============================================================ */
const crankGroup = new THREE.Group();
crankGroup.position.copy(BB);
scene.add(crankGroup);

// bottom-bracket spindle (spans out to the acrylic frame)
const bbSpindle = axleCyl(0.085, 0.085, 1.24, 12, M.steel);
bbSpindle.position.z = -0.365;
crankGroup.add(bbSpindle);

// chainring + spider
const chainring = makeSprocket(RING_TEETH, 0.065, {

/* ============================================================
   CHAIN PATH SOLVER
   Four wheels, each with a signed wrap direction:
     chainring (CW) → cog (CW) → guide pulley (CCW) → tension (CW)
   Between consecutive wheels we solve the classic belt-tangent
   problem with signed radii, which reproduces the real S-wrap
   through the derailleur cage instead of faking a loop.
   ============================================================ */
const wheels = [
  { c: new THREE.Vector2(BB.x, BB.y),   r: R_RING,   s: -1, z: 0 },
  { c: new THREE.Vector2(HUB.x, HUB.y), r: COG_R[3], s: -1, z: 0 },
  { c: new THREE.Vector2(),             r: R_PULLEY, s:  1, z: 0 },
  { c: new THREE.Vector2(),             r: R_PULLEY, s: -1, z: 0 }
];
const segs = wheels.map(() => ({ dep: 0, arr: 0, ax: 0, ay: 0, bx: 0, by: 0 }));

// reusable Vector3 pool so the per-frame rebuild allocates nothing
const pool = [];
let poolIdx = 0;
const pt = (x, y, z) => {
  let v = pool[poolIdx];
  if (!v) v = pool[poolIdx] = new THREE.Vector3();
  poolIdx++;
  return v.set(x, y, z);
};

const path = [];
const cum  = [];
let pathLen = 0;

function solveChain () {
  const n = wheels.length;

  // 1. tangent between every consecutive pair
  for (let i = 0; i < n; i++) {
    const A = wheels[i], B = wheels[(i + 1) % n];
    const dx = B.c.x - A.c.x, dy = B.c.y - A.c.y;
    const d = Math.hypot(dx, dy) || 1e-6;
    const phi = Math.atan2(dy, dx);
    const K = A.r * A.s - B.r * B.s;
    const psi = phi - Math.acos(clamp(K / d, -1, 1));
    const mx = Math.cos(psi), my = Math.sin(psi);
    const S = segs[i];
    S.dep = Math.atan2(A.s * my, A.s * mx);
    S.arr = Math.atan2(B.s * my, B.s * mx);
    S.ax = A.c.x + A.r * A.s * mx;  S.ay = A.c.y + A.r * A.s * my;
    S.bx = B.c.x + B.r * B.s * mx;  S.by = B.c.y + B.r * B.s * my;
  }

  // 2. walk the loop: arc over each wheel, straight run to the next
  path.length = 0;
  poolIdx = 0;
  for (let i = 0; i < n; i++) {
    const W = wheels[i], S = segs[i];
    const arrive = segs[(i - 1 + n) % n].arr;
    let sweep = S.dep - arrive;
    if (W.s > 0) { while (sweep < 0) sweep += TAU; while (sweep >= TAU) sweep -= TAU; }
    else         { while (sweep > 0) sweep -= TAU; while (sweep <= -TAU) sweep += TAU; }

    const steps = Math.max(3, Math.ceil(Math.abs(sweep) / 0.16));
    for (let k = 0; k <= steps; k++) {
      const a = arrive + sweep * (k / steps);
      path.push(pt(W.c.x + W.r * Math.cos(a), W.c.y + W.r * Math.sin(a), W.z));
    }

    // straight run — the chain is a true straight line in 3D, so the
    // lateral offset interpolates linearly across the span
    const Nx = wheels[(i + 1) % n];
    const lineSteps = 12;
    for (let k = 1; k < lineSteps; k++) {
      const t = k / lineSteps;
      path.push(pt(
        S.ax + (S.bx - S.ax) * t,
        S.ay + (S.by - S.ay) * t,
        W.z + (Nx.z - W.z) * t
      ));
    }
  }
  path.push(path[0]);   // close the loop

  // 3. cumulative arc length for even link spacing
  cum.length = path.length;
  cum[0] = 0;
  for (let i = 1; i < path.length; i++) cum[i] = cum[i - 1] + path[i].distanceTo(path[i - 1]);
  pathLen = cum[cum.length - 1];
}

const sPos = new THREE.Vector3(), sTan = new THREE.Vector3();
function samplePath (s) {
  s = ((s % pathLen) + pathLen) % pathLen;
  let lo = 0, hi = cum.length - 1;
  while (lo < hi - 1) {
    const mid = (lo + hi) >> 1;
    if (cum[mid] <= s) lo = mid; else hi = mid;
  }
  const a = path[lo], b = path[lo + 1];
  const seg = cum[lo + 1] - cum[lo] || 1e-6;
  sPos.lerpVectors(a, b, (s - cum[lo]) / seg);
  sTan.subVectors(b, a).normalize();
}

/* ---------- chain meshes: alternating plates + chrome rollers ---------- */
const plateGeoChain = new THREE.BoxGeometry(0.143, 0.086, 0.078);
const rollerGeo = new THREE.CylinderGeometry(0.033, 0.033, 0.105, 6);
rollerGeo.rotateX(Math.PI / 2);

const chainPlates = new THREE.InstancedMesh(
  plateGeoChain,
  new THREE.MeshStandardMaterial({ color: 0x9aa6b2, metalness: 1, roughness: 0.34, flatShading: true }),
  N_LINKS
);
const chainRollers = new THREE.InstancedMesh(rollerGeo, M.chrome, N_LINKS);
[chainPlates, chainRollers].forEach(m => {
  m.castShadow = true; m.receiveShadow = true; m.frustumCulled = false;
  scene.add(m);
});

const _m4 = new THREE.Matrix4();
const _xA = new THREE.Vector3(), _yA = new THREE.Vector3(), _zA = new THREE.Vector3();
const _up = new THREE.Vector3(0, 0, 1);

function updateChainMeshes (offset) {
  const spacing = pathLen / N_LINKS;
  for (let i = 0; i < N_LINKS; i++) {
    samplePath(offset + i * spacing);
    _xA.copy(sTan);
    _yA.crossVectors(_up, _xA).normalize();
    if (_yA.lengthSq() < 1e-8) _yA.set(0, 1, 0);
    _zA.crossVectors(_xA, _yA);

    // outer / inner plates alternate, exactly like a real roller chain
    const w = i % 2 ? 0.62 : 1.0;
    _m4.makeBasis(_xA, _yA, _zA.multiplyScalar(w));
    _m4.setPosition(sPos);
    chainPlates.setMatrixAt(i, _m4);

    _zA.normalize();
    _m4.makeBasis(_xA, _yA, _zA);
    _m4.setPosition(sPos);
    chainRollers.setMatrixAt(i, _m4);
  }
  chainPlates.instanceMatrix.needsUpdate = true;
  chainRollers.instanceMatrix.needsUpdate = true;
}

/* ============================================================
   DERAILLEUR POSE — 2-bone IK from hanger to guide pulley
   ============================================================ */
const DOWN = new THREE.Vector3(0, -1, 0);
const _G = new THREE.Vector3(), _T = new THREE.Vector3(), _v = new THREE.Vector3();
const _u = new THREE.Vector3(), _ref = new THREE.Vector3(), _elb = new THREE.Vector3();
const _d = new THREE.Vector3();

function aim (obj, from, to, scaleIt) {
  obj.position.copy(from);
  _d.subVectors(to, from);
  const len = _d.length() || 1e-6;
  _d.divideScalar(len);
  obj.quaternion.setFromUnitVectors(DOWN, _d);
  if (scaleIt) obj.scale.y = len;
  return len;
}

function poseDerailleur (rCog, zCog) {
  // guide pulley tracks the engaged cog: constant tooth gap, matching chainline
  _G.set(HUB.x + 0.14, HUB.y - rCog - 0.62, zCog);
  _T.copy(_G).add(CAGE_OFFSET);

  _v.subVectors(_G, HANGER);
  const reach = _v.length() || 1e-6;
  const d = clamp(reach, Math.abs(LINK_A - LINK_B) + 1e-3, LINK_A + LINK_B - 1e-3);
  _u.copy(_v).divideScalar(reach);

  // angle between bone A and the hanger→pulley line
  const A = Math.acos(clamp((LINK_A * LINK_A + d * d - LINK_B * LINK_B) / (2 * LINK_A * d), -1, 1));

  // bend the elbow up-and-rearward, like a real b-knuckle
  _ref.set(0.55, 1, 0);
  _ref.addScaledVector(_u, -_ref.dot(_u));
  if (_ref.lengthSq() < 1e-8) _ref.set(0, 0, 1); else _ref.normalize();

  _elb.copy(HANGER)
      .addScaledVector(_u, Math.cos(A) * LINK_A)
      .addScaledVector(_ref, Math.sin(A) * LINK_A);

  aim(linkA, HANGER, _elb, true);
  elbow.position.copy(_elb);
  aim(linkB, _elb, _G, true);     // scaling absorbs any residual reach error
  aim(cage, _G, _T, false);

  wheels[2].c.set(_G.x, _G.y); wheels[2].z = _G.z;
  wheels[3].c.set(_T.x, _T.y); wheels[3].z = _T.z;
}

  mCog: document.getElementById('mCog'),

  mRatio: document.getElementById('mRatio'),
  ladder: document.getElementById('ladder'),

  btnUp: document.getElementById('btnUp'),
  btnDown: document.getElementById('btnDown'),

  btnView: document.getElementById('btnView'),
  rpm: document.getElementById('rpm'),
  rpmVal: document.getElementById('rpmVal'),
  loader: document.getElementById('loader')
};

let motorOn = true;
let gearIndex = 3;
let gearLerp = 3;
let cadence = parseFloat(ui.rpm.value);

ui.mRing.textContent = RING_TEETH + 'T';

const ladderSegs = [];
for (let i = 0; i < N_GEARS; i++) {
  const seg = document.createElement('div');
  seg.className = 'seg';
  seg.textContent = COG_TEETH[i];
  seg.title = `Gear ${i + 1} — ${COG_TEETH[i]}T`;
  seg.addEventListener('click', () => setGear(i));
  ui.ladder.appendChild(seg);
  ladderSegs.push(seg);
}

function refreshHUD () {
  ui.gearBig.innerHTML = `${gearIndex + 1}<small> / ${N_GEARS}</small>`;
  ui.mCog.textContent = COG_TEETH[gearIndex] + 'T';
  ui.mRatio.textContent = (RING_TEETH / COG_TEETH[gearIndex]).toFixed(2);
  ladderSegs.forEach((s, i) => s.classList.toggle('on', i === gearIndex));
  ui.btnUp.disabled = gearIndex >= N_GEARS - 1;
  ui.btnDown.disabled = gearIndex <= 0;
}
function setGear (i) {
  const next = clamp(Math.round(i), 0, N_GEARS - 1);
  if (next === gearIndex) return;
  gearIndex = next;
  refreshHUD();
}
function setMotor (on) {
  motorOn = on;
  ui.btnMotor.classList.toggle('paused', !on);
  ui.btnMotor.querySelector('.glyph').textContent = on ? '❚❚' : '▶';
  ui.motorLabel.textContent = on ? 'Pause Motor' : 'Start Motor';
}
function paintSlider () {
  const p = (cadence - ui.rpm.min) / (ui.rpm.max - ui.rpm.min) * 100;
  ui.rpm.style.background =
    `linear-gradient(90deg, var(--cyan) ${p}%, rgba(255,255,255,.1) ${p}%)`;
  ui.rpmVal.textContent = `${Math.round(cadence)} RPM`;
}

ui.btnMotor.addEventListener('click', () => setMotor(!motorOn));
ui.btnUp.addEventListener('click', () => setGear(gearIndex + 1));
ui.btnDown.addEventListener('click', () => setGear(gearIndex - 1));
ui.rpm.addEventListener('input', () => { cadence = parseFloat(ui.rpm.value); paintSlider(); });
ui.btnOrbit.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  ui.btnOrbit.classList.toggle('on', controls.autoRotate);
});
ui.btnView.addEventListener('click', () => {
  camera.position.copy(HOME_CAM);
  controls.target.copy(HOME_TGT);
  controls.update();
});

addEventListener('keydown', e => {
  if (e.code === 'Space')                                  { e.preventDefault(); setMotor(!motorOn); }
  else if (e.code === 'ArrowUp'   || e.code === 'ArrowRight' || e.key === ']') { e.preventDefault(); setGear(gearIndex + 1); }
  else if (e.code === 'ArrowDown' || e.code === 'ArrowLeft'  || e.key === '[') { e.preventDefault(); setGear(gearIndex - 1); }
});

refreshHUD();
setMotor(true);
paintSlider();

/* ============================================================
   POST — subtle bloom for the LED / chrome highlights
   (dynamically imported so the demo still runs without it)
   ============================================================ */
let composer = null;
try {
  const [{ EffectComposer }, { RenderPass }, { UnrealBloomPass }, { OutputPass }] = await Promise.all([
    import('three/addons/postprocessing/EffectComposer.js'),
    import('three/addons/postprocessing/RenderPass.js'),
    import('three/addons/postprocessing/UnrealBloomPass.js'),
    import('three/addons/postprocessing/OutputPass.js')
  ]);
  composer = new EffectComposer(renderer);
  composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  composer.setSize(innerWidth, innerHeight);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.34, 0.42, 0.86));
  composer.addPass(new OutputPass());
} catch (err) {
  console.warn('Bloom pass unavailable — rendering without post-processing.', err);
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
const clock = new THREE.Clock();
let chainOffset = 0;
let lastGearLerp = NaN;

function tick () {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);

  // --- smooth, frame-rate-independent shifting
  gearLerp += (gearIndex - gearLerp) * (1 - Math.exp(-dt * 8));
  if (Math.abs(gearIndex - gearLerp) < 1e-4) gearLerp = gearIndex;

  const i0 = Math.floor(gearLerp), i1 = Math.min(i0 + 1, N_GEARS - 1), f = gearLerp - i0;
  const rCog = lerp(COG_R[i0], COG_R[i1], f);
  const zCog = COG_Z0 + gearLerp * COG_SPACING;

  // --- drive: crank speed → chain speed → everything else
  const omega = motorOn ? (cadence / 60) * TAU : 0;   // rad/s at the crank
  const vChain = omega * R_RING;                       // units/s along the chain

  crankGroup.rotation.z -= omega * dt;
  hubGroup.rotation.z   -= (vChain / rCog) * dt;
  guidePulley.rotation.z   += (vChain / R_PULLEY) * dt;
  tensionPulley.rotation.z -= (vChain / R_PULLEY) * dt;
  chainOffset += vChain * dt;

  pedals.forEach(p => { p.pedal.rotation.z = -(crankGroup.rotation.z + p.base); });

  // --- derailleur + chain path only rebuild while actually shifting
  if (gearLerp !== lastGearLerp) {
    lastGearLerp = gearLerp;
    wheels[1].r = rCog;
    wheels[1].z = zCog;
    poseDerailleur(rCog, zCog);
    solveChain();

    cogs.forEach((cog, i) => {
      cog.userData.bodyMat.emissiveIntensity = Math.max(0, 1 - Math.abs(gearLerp - i)) * 0.42;
    });
  }

  if (pathLen > 0) chainOffset %= pathLen;
  updateChainMeshes(chainOffset);

  controls.update();
  if (composer) composer.render(); else renderer.render(scene, camera);
}

function applyViewport () {
  const aspect = innerWidth / innerHeight;
  camera.aspect = aspect;
  // widen the lens on narrow / portrait viewports so the stand still fits
  camera.fov = clamp(42 / Math.min(1, aspect), 42, 64);
  camera.updateProjectionMatrix();
  // on portrait the HUD becomes a top bar — bias the frame downwards so the
  // stand sits in the clear area beneath it
  if (aspect < 1) camera.setViewOffset(innerWidth, innerHeight, 0, -innerHeight * 0.19, innerWidth, innerHeight);
  else camera.clearViewOffset();
  renderer.setSize(innerWidth, innerHeight);
  if (composer) composer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', applyViewport);
applyViewport();

window.__booted = true;
tick();
requestAnimationFrame(() => ui.loader.classList.add('gone'));
</script>
</body>
</html>
