<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Low-Poly Dynamic Bicycle Drivetrain Demo Stand</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        :root {
            --bg-dark: #07090e;
            --panel-bg: rgba(14, 18, 27, 0.75);
            --panel-border: rgba(0, 243, 255, 0.25);
            --accent-cyan: #00f3ff;
            --accent-magenta: #ff0055;
            --accent-yellow: #ffb700;
            --text-main: #f0f4f8;
            --text-muted: #8a99ad;
            --font-sans: 'Outfit', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: var(--font-sans);
            color: var(--text-main);
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* UI Overlay HUD */
        .hud-header {
            position: absolute;
            top: 24px;
            left: 28px;
            z-index: 10;
            pointer-events: none;
        }

        .hud-title-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 20px;
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--accent-cyan);
            text-transform: uppercase;
            margin-bottom: 8px;
            backdrop-filter: blur(8px);
        }

        .hud-title-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--accent-cyan);
            box-shadow: 0 0 10px var(--accent-cyan);
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .hud-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #a0b2ce 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .hud-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 400;
        }

        /* Control Panel (Top-Right) */
        .hud-panel {
            position: absolute;
            top: 24px;
            right: 28px;
            width: 340px;
            z-index: 10;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: border-color 0.3s ease;
        }

        .hud-panel:hover {
            border-color: rgba(0, 243, 255, 0.5);
        }

        .panel-section-title {
            font-family: var(--font-mono);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Gear Display Block */
        .gear-display-card {
            background: rgba(8, 11, 18, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 18px;
            position: relative;
            overflow: hidden;
        }

        .gear-display-card::after {
            content: '';
            position: absolute;
            top: 0; right: 0; width: 80px; height: 100%;
            background: radial-gradient(circle at 100% 50%, rgba(0, 243, 255, 0.15), transparent 70%);
            pointer-events: none;
        }

        .gear-num-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }

        .gear-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .gear-value {
            font-family: var(--font-mono);
            font-size: 38px;
            font-weight: 700;
            color: var(--accent-cyan);
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            line-height: 1;
        }

        .gear-value span {
            font-size: 18px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .ratio-spec {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-family: var(--font-mono);
            font-size: 12px;
        }

        .ratio-spec .val {
            color: #fff;
            font-weight: 600;
        }

        /* Cog Indicator Grid */
        .cog-selector-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-bottom: 18px;
        }

        .cog-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            height: 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 600;
        }

        .cog-btn:hover {
            background: rgba(0, 243, 255, 0.15);
            border-color: rgba(0, 243, 255, 0.4);
            color: #fff;
        }

        .cog-btn.active {
            background: var(--accent-cyan);
            border-color: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        }

        .cog-btn .teeth-tag {
            font-size: 8px;
            opacity: 0.7;
            margin-top: 1px;
        }

        /* Shift Buttons Row */
        .shift-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 18px;
        }

        .btn-shift {
            background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-shift:hover:not(:disabled) {
            transform: translateY(-2px);
            background: rgba(0, 243, 255, 0.2);
            border-color: var(--accent-cyan);
            box-shadow: 0 6px 20px rgba(0, 243, 255, 0.2);
        }

        .btn-shift:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-shift:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Primary Action Buttons */
        .motor-control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-motor {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: none;
            font-family: var(--font-sans);
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s ease;
        }

        .btn-motor.playing {
            background: linear-gradient(135deg, #00f3ff 0%, #0088ff 100%);
            color: #000;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
        }

        .btn-motor.paused {
            background: linear-gradient(135deg, #ff0055 0%, #990033 100%);
            color: #fff;
            box-shadow: 0 0 20px rgba(ff, 0, 85, 0.3);
        }

        /* Cadence Slider */
        .slider-group {
            margin-top: 14px;
            background: rgba(0, 0, 0, 0.25);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-family: var(--font-mono);
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .slider-header .val {
            color: var(--accent-cyan);
            font-weight: 600;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-cyan);
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-cyan);
            transition: transform 0.1s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }

        /* Camera Views Toolbar (Bottom Center) */
        .view-toolbar {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 8px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 6px;
            border-radius: 30px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .view-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .view-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        .view-btn.active {
            background: rgba(0, 243, 255, 0.15);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 243, 255, 0.3);
        }

        /* Keyboard Hints Footer */
        .hud-key-hints {
            position: absolute;
            bottom: 24px;
            left: 28px;
            z-index: 10;
            display: flex;
            gap: 12px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .key-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .kbd {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            padding: 2px 6px;
            color: #fff;
            font-size: 10px;
        }

        @media (max-width: 768px) {
            .hud-panel {
                top: auto;
                bottom: 80px;
                right: 14px;
                left: 14px;
                width: auto;
            }
            .hud-header {
                top: 14px;
                left: 14px;
            }
            .hud-title { font-size: 20px; }
            .hud-key-hints { display: none; }
        }
    </style>
</head>
<body>

    <div id="webgl-container"></div>

    <!-- HUD Header -->
    <div class="hud-header">
        <div class="hud-title-badge">ANTIGRAVITY TECH LAB // DEMO STAND</div>
        <div class="hud-title">3D Low-Poly Bicycle Drivetrain</div>
        <div class="hud-subtitle">Interactive WebGL 1x7 Speed Kinetic Physics Simulation</div>
    </div>

    <!-- Floating Control Panel -->
    <div class="hud-panel">
        <div class="panel-section-title">
            <span>Drivetrain Dynamics</span>
            <span style="color: var(--accent-cyan); font-weight: 700;">LIVE METRICS</span>
        </div>

        <!-- Gear Card -->
        <div class="gear-display-card">
            <div class="gear-num-row">
                <div class="gear-label">Active Gear</div>
                <div class="gear-value" id="gear-display">4 <span>/ 7</span></div>
            </div>
            <div class="ratio-spec">
                <div>TEETH: <span class="val" id="teeth-ratio">50T / 20T</span></div>
                <div>RATIO: <span class="val" id="gear-ratio">2.50 : 1</span></div>
                <div>REAR RPM: <span class="val" id="rear-rpm">150</span></div>
            </div>
        </div>

        <!-- Cog Selector Grid -->
        <div class="cog-selector-grid" id="cog-grid">
            <!-- Dynamically populated -->
        </div>

        <!-- Shift Control Buttons -->
        <div class="shift-controls">
            <button class="btn-shift" id="btn-shift-down">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
                SHIFT DOWN (EASY)
            </button>
            <button class="btn-shift" id="btn-shift-up">
                SHIFT UP (FAST)
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
        </div>

        <!-- Motor Controls -->
        <div class="motor-control-group">
            <button class="btn-motor playing" id="btn-motor-toggle">
                <svg id="motor-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                <span id="motor-btn-text">PAUSE MOTOR</span>
            </button>

            <div class="slider-group">
                <div class="slider-header">
                    <span>CRANK CADENCE</span>
                    <span class="val" id="cadence-val">60 RPM</span>
                </div>
                <input type="range" id="cadence-slider" min="10" max="130" value="60">
            </div>
        </div>
    </div>

    <!-- Camera Toolbar -->
    <div class="view-toolbar">
        <button class="view-btn active" data-view="iso">ISOMETRIC</button>
        <button class="view-btn" data-view="side">SIDE VIEW</button>
        <button class="view-btn" data-view="derailleur">REAR DERAILLEUR</button>
        <button class="view-btn" data-view="top">TOP DOWN</button>
    </div>

    <!-- Key Hints -->
    <div class="hud-key-hints">
        <div class="key-tag"><span class="kbd">↑</span> <span class="kbd">↓</span> Shift Gears</div>
        <div class="key-tag"><span class="kbd">SPACE</span> Toggle Motor</div>
        <div class="key-tag"><span class="kbd">LMB + Drag</span> Orbit View</div>
    </div>

    <!-- Application Script -->
    <script>
        /**
         * 3D Low-Poly Bicycle Drivetrain Engine
         * Built with Three.js
         */

        // --- Gear Specs Configuration ---
        const FRONT_TEETH = 50;
        const FRONT_RADIUS = 7.5;
        const BB_POS = new THREE.Vector3(-11, 8.5, 0);
        const REAR_POS = new THREE.Vector3(11, 8.5, 0);
        
        // 7 Cassette cogs (from largest Cog 1 to smallest Cog 7)
        const CASSETTE_SPECS = [
            { gear: 1, teeth: 34, radius: 5.8, zOffset: -1.4 },
            { gear: 2, teeth: 28, radius: 4.9, zOffset: -0.9 },
            { gear: 3, teeth: 24, radius: 4.2, zOffset: -0.4 },
            { gear: 4, teeth: 20, radius: 3.5, zOffset:  0.1 },
            { gear: 5, teeth: 16, radius: 2.8, zOffset:  0.6 },
            { gear: 6, teeth: 13, radius: 2.2, zOffset:  1.1 },
            { gear: 7, teeth: 11, radius: 1.8, zOffset:  1.6 }
        ];

        // System State
        let currentGearIndex = 3; // Default Gear 4 (0-indexed)
        let targetGearIndex = 3;
        let shiftProgress = 1.0; // 0 to 1 lerp transition
        let isMotorRunning = true;
        let crankRPM = 60;
        let crankAngle = 0;
        let cassetteAngle = 0;
        let chainOffset = 0;
        let lastTime = performance.now();

        // Three.js Core Globals
        let scene, camera, renderer, controls;
        let crankGroup, cassetteGroup, derailleurAssembly, chainMeshGroup;
        let activeChainSplinePoints = [];

        // Materials Palette
        const materials = {
            aluminumDark: new THREE.MeshStandardMaterial({
                color: 0x1a1d24,
                roughness: 0.4,
                metalness: 0.8,
                flatShading: true
            }),
            chrome: new THREE.MeshStandardMaterial({
                color: 0xe2e8f0,
                roughness: 0.15,
                metalness: 0.95,
                flatShading: true
            }),
            acrylicStand: new THREE.MeshPhysicalMaterial({
                color: 0x00f3ff,
                transparent: true,
                opacity: 0.25,
                roughness: 0.1,
                metalness: 0.1,
                transmission: 0.85,
                ior: 1.4,
                thickness: 1.5,
                flatShading: true
            }),
            acrylicEdge: new THREE.MeshBasicMaterial({
                color: 0x00f3ff,
                wireframe: true,
                transparent: true,
                opacity: 0.3
            }),
            chainLinkOuter: new THREE.MeshStandardMaterial({
                color: 0xc8d1dc,
                roughness: 0.25,
                metalness: 0.85,
                flatShading: true
            }),
            chainLinkInner: new THREE.MeshStandardMaterial({
                color: 0x64748b,
                roughness: 0.35,
                metalness: 0.75,
                flatShading: true
            }),
            derailleurBody: new THREE.MeshStandardMaterial({
                color: 0x0f172a,
                roughness: 0.3,
                metalness: 0.85,
                flatShading: true
            }),
            neonCyan: new THREE.MeshBasicMaterial({
                color: 0x00f3ff
            }),
            pedalReflector: new THREE.MeshBasicMaterial({
                color: 0xffb700
            })
        };

        // --- Initialize Scene & Canvas ---
        function init() {
            const container = document.getElementById('webgl-container');

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x07090e);
            scene.fog = new THREE.FogExp2(0x07090e, 0.015);

            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(28, 18, 36);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.1;
            container.appendChild(renderer.domElement);

            // Orbit Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 7.5, 0);
            controls.maxPolarAngle = Math.PI / 2 + 0.05; // Prevent camera under floor
            controls.minDistance = 10;
            controls.maxDistance = 80;

            // Lighting Setup
            setupLighting();

            // Environment & Floor Pod
            buildEnvironment();

            // Procedural 3D Components
            buildAcrylicStand();
            buildFrontDrivetrain();
            buildRearCassette();
            buildRearDerailleur();
            buildChainMeshGroup();

            // UI Init
            setupUI();

            // Window Resize Listener
            window.addEventListener('resize', onWindowResize, false);
            window.addEventListener('keydown', onKeyDown, false);

            // Animation Loop
            animate(performance.now());
        }

        // --- Lighting ---
        function setupLighting() {
            // Soft Ambient
            const ambient = new THREE.AmbientLight(0x1a233a, 1.2);
            scene.add(ambient);

            // Main Studio Spotlight
            const mainLight = new THREE.DirectionalLight(0xffffff, 2.2);
            mainLight.position.set(20, 35, 25);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.camera.near = 5;
            mainLight.shadow.camera.far = 80;
            mainLight.shadow.camera.left = -25;
            mainLight.shadow.camera.right = 25;
            mainLight.shadow.camera.top = 25;
            mainLight.shadow.camera.bottom = -15;
            mainLight.shadow.bias = -0.0005;
            scene.add(mainLight);

            // Cyan Rim Spotlight (Behind Stand)
            const cyanRim = new THREE.SpotLight(0x00f3ff, 4.0, 60, Math.PI / 4, 0.5);
            cyanRim.position.set(-20, 15, -20);
            cyanRim.target.position.set(0, 8, 0);
            scene.add(cyanRim);
            scene.add(cyanRim.target);

            // Magenta Fill Light
            const magentaFill = new THREE.PointLight(0xff0055, 2.5, 50);
            magentaFill.position.set(25, 6, -15);
            scene.add(magentaFill);
        }

        // --- Environment & Floor ---
        function buildEnvironment() {
            // Floor Plane
            const floorGeo = new THREE.PlaneGeometry(120, 120);
            const floorMat = new THREE.MeshStandardMaterial({
                color: 0x0a0d14,
                roughness: 0.2,
                metalness: 0.8
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Glowing Grid Overlay
            const grid = new THREE.GridHelper(100, 50, 0x00f3ff, 0x162032);
            grid.position.y = 0.02;
            grid.material.opacity = 0.35;
            grid.material.transparent = true;
            scene.add(grid);

            // Octagonal Trade Show Pedestal
            const pedestalShape = new THREE.Shape();
            const sides = 8;
            const radius = 22;
            for (let i = 0; i < sides; i++) {
                const angle = (i / sides) * Math.PI * 2;
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;
                if (i === 0) pedestalShape.moveTo(x, y);
                else pedestalShape.lineTo(x, y);
            }
            const extrudeSettings = { depth: 0.6, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.4, bevelThickness: 0.3 };
            const pedestalGeo = new THREE.ExtrudeGeometry(pedestalShape, extrudeSettings);
            const pedestalMat = new THREE.MeshStandardMaterial({ color: 0x111622, roughness: 0.3, metalness: 0.7, flatShading: true });

        // --- Procedural Cog / Tooth Generator ---
        function createCogGeometry(teethCount, radius, thickness = 0.35) {
            const shape = new THREE.Shape();
            const innerR = radius * 0.84;
            const outerR = radius * 1.08;
            const toothAngle = (Math.PI * 2) / teethCount;

            for (let i = 0; i < teethCount; i++) {
                const a0 = i * toothAngle;
                const a1 = a0 + toothAngle * 0.25;
                const a2 = a0 + toothAngle * 0.50;
                const a3 = a0 + toothAngle * 0.75;

                // Tooth root -> rising edge -> tip -> falling edge
                const p0x = Math.cos(a0) * innerR, p0y = Math.sin(a0) * innerR;
                const p1x = Math.cos(a1) * outerR, p1y = Math.sin(a1) * outerR;
                const p2x = Math.cos(a2) * outerR, p2y = Math.sin(a2) * outerR;
                const p3x = Math.cos(a3) * innerR, p3y = Math.sin(a3) * innerR;

                if (i === 0) shape.moveTo(p0x, p0y);
                else shape.lineTo(p0x, p0y);

                shape.lineTo(p1x, p1y);
                shape.lineTo(p2x, p2y);
                shape.lineTo(p3x, p3y);
            }

            // Internal Weight-Reduction Cutout Holes
            if (teethCount > 14) {
                const holeCount = teethCount > 24 ? 5 : 4;
                const holeR = radius * 0.45;
                const holeDist = radius * 0.62;
                for (let h = 0; h < holeCount; h++) {
                    const holePath = new THREE.Path();
                    const ha = (h / holeCount) * Math.PI * 2;
                    const hcx = Math.cos(ha) * holeDist;
                    const hcy = Math.sin(ha) * holeDist;
                    holePath.absarc(hcx, hcy, holeR * 0.4, 0, Math.PI * 2, true);
                    shape.holes.push(holePath);
                }
            }

            // Center axle hole
            const centerHole = new THREE.Path();
            centerHole.absarc(0, 0, radius * 0.28, 0, Math.PI * 2, true);
            shape.holes.push(centerHole);

            const extrudeOpts = {
                depth: thickness,
                bevelEnabled: true,
                bevelSegments: 1,
                steps: 1,
                bevelSize: 0.05,
                bevelThickness: 0.05
            };

            return new THREE.ExtrudeGeometry(shape, extrudeOpts);
        }

        // --- Chain Mesh Loop & Instanced Links ---
        function buildChainMeshGroup() {
            chainMeshGroup = new THREE.Group();
            scene.add(chainMeshGroup);

            // We create 74 outer and inner chain link meshes
            const LINK_COUNT = 76;
            
            // Outer Link Plate Geometry
            const outerPlateShape = new THREE.Shape();
            outerPlateShape.absarc(-0.4, 0, 0.32, Math.PI / 2, Math.PI * 1.5);
            outerPlateShape.lineTo(0.4, -0.22);
            outerPlateShape.absarc(0.4, 0, 0.32, -Math.PI / 2, Math.PI / 2);
            outerPlateShape.lineTo(-0.4, 0.22);
            
            const outerExtrude = { depth: 0.08, bevelEnabled: true, bevelSize: 0.02, bevelThickness: 0.02 };
            const outerLinkGeo = new THREE.ExtrudeGeometry(outerPlateShape, outerExtrude);
            
            // Roller Pin Cylinder Geometry
            const pinGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.65, 8);
            pinGeo.rotateX(Math.PI / 2);

            for (let i = 0; i < LINK_COUNT; i++) {
                const linkContainer = new THREE.Group();
                
                const isOuter = (i % 2 === 0);
                const mat = isOuter ? materials.chainLinkOuter : materials.chainLinkInner;
                const width = isOuter ? 0.6 : 0.42;

                // Left Plate
                const plate1 = new THREE.Mesh(outerLinkGeo, mat);
                plate1.position.z = width / 2;
                linkContainer.add(plate1);

                // Right Plate
                const plate2 = new THREE.Mesh(outerLinkGeo, mat);
                plate2.position.z = -width / 2 - 0.08;
                linkContainer.add(plate2);

                // Central Roller Pin
                const pin = new THREE.Mesh(pinGeo, materials.chrome);
                linkContainer.add(pin);

                linkContainer.castShadow = true;
                chainMeshGroup.add(linkContainer);
            }
        }

        // --- Compute Dynamic 3D Chain Path Spline ---
        function calculateChainCurve() {
            // Retrieve active cog spec (interpolated during gear shift lerp)
            const fromSpec = CASSETTE_SPECS[currentGearIndex];
            const toSpec = CASSETTE_SPECS[targetGearIndex];
            
            const lerpT = easeInOutCubic(shiftProgress);
            const currentCogZ = THREE.MathUtils.lerp(fromSpec.zOffset, toSpec.zOffset, lerpT);
            const currentCogRadius = THREE.MathUtils.lerp(fromSpec.radius, toSpec.radius, lerpT);

            // Derive Derailleur Guide & Tension Pulley Positions
            const guidePulleyPos = new THREE.Vector3(
                REAR_POS.x - 0.5,
                REAR_POS.y - currentCogRadius - 1.2,
                currentCogZ
            );

            // Cage pivots backward/forward based on cog size
            const cageAngle = THREE.MathUtils.mapLinear(currentCogRadius, 1.8, 5.8, 0.25, -0.45);
            const tensionPulleyPos = new THREE.Vector3(
                guidePulleyPos.x + 2.2 * Math.sin(cageAngle + 0.4),
                guidePulleyPos.y - 3.0 * Math.cos(cageAngle + 0.4),
                currentCogZ
            );

            // Update physical Derailleur Cage Position in 3D scene
            const cageGroup = derailleurAssembly.getObjectByName("cageGroup");
            if (cageGroup) {
                cageGroup.position.copy(guidePulleyPos);
                cageGroup.rotation.z = cageAngle;
            }

            // Key Spline Control Points along the continuous drivetrain loop
            const frontZ = 0.5;
            const topFront = new THREE.Vector3(BB_POS.x, BB_POS.y + FRONT_RADIUS, frontZ);
            const topRear  = new THREE.Vector3(REAR_POS.x, REAR_POS.y + currentCogRadius, currentCogZ);
            
            const rearBackWrap = new THREE.Vector3(
                REAR_POS.x + currentCogRadius * 0.8,
                REAR_POS.y + currentCogRadius * 0.4,
                currentCogZ
            );
            
            const guideWrap = new THREE.Vector3(guidePulleyPos.x - 0.8, guidePulleyPos.y, currentCogZ);
            const tensionWrap = new THREE.Vector3(tensionPulleyPos.x + 0.6, tensionPulleyPos.y - 0.5, currentCogZ);
            const botFront = new THREE.Vector3(BB_POS.x + 1.0, BB_POS.y - FRONT_RADIUS, frontZ);
            const frontWrap = new THREE.Vector3(BB_POS.x - FRONT_RADIUS, BB_POS.y, frontZ);

            const pathPoints = [
                topFront,
                topRear,
                rearBackWrap,
                guideWrap,
                tensionWrap,
                botFront,
                frontWrap
            ];

            return new THREE.CatmullRomCurve3(pathPoints, true, 'centripetal', 0.25);
        }

        // --- Animation Loop ---
        function animate(time) {
            requestAnimationFrame(animate);

            const dt = Math.min((time - lastTime) / 1000, 0.1);
            lastTime = time;

            // Handle Smooth Gear Shift Lerp
            if (shiftProgress < 1.0) {
                shiftProgress += dt * 2.2; // ~0.45s shift duration
                if (shiftProgress >= 1.0) {
                    shiftProgress = 1.0;
                    currentGearIndex = targetGearIndex;
                    updateGearHUD();
                }
            }

            // Motor Kinetics Logic
            if (isMotorRunning) {
                const rps = crankRPM / 60;
                const crankDelta = rps * Math.PI * 2 * dt;
                crankAngle += crankDelta;

                // Calculate active gear ratio
                const fromSpec = CASSETTE_SPECS[currentGearIndex];
                const toSpec = CASSETTE_SPECS[targetGearIndex];
                const activeTeeth = THREE.MathUtils.lerp(fromSpec.teeth, toSpec.teeth, shiftProgress);
                const gearRatio = FRONT_TEETH / activeTeeth;

                // Rear Cassette Spin Speed
                const cassetteDelta = crankDelta * gearRatio;
                cassetteAngle += cassetteDelta;

                // Chain Travel Linear Distance
                const chainLinearSpeed = rps * (Math.PI * 2 * FRONT_RADIUS);
                chainOffset += chainLinearSpeed * dt;

                // Apply Rotations to 3D Meshes
                if (crankGroup) {
                    crankGroup.rotation.z = -crankAngle;
                    
                    // Keep Pedals Horizontal (counter-rotate)
                    const rightPedal = crankGroup.getObjectByName("rightPedal");
                    const leftPedal = crankGroup.getObjectByName("leftPedal");
                    if (rightPedal) rightPedal.rotation.z = crankAngle;
                    if (leftPedal) leftPedal.rotation.z = crankAngle;
                }

                if (cassetteGroup) {
                    cassetteGroup.rotation.z = -cassetteAngle;
                }

                // Spin Derailleur Pulley Wheels
                const cageGroup = derailleurAssembly ? derailleurAssembly.getObjectByName("cageGroup") : null;
                if (cageGroup) {
                    const upperP = cageGroup.getObjectByName("upperPulley");
                    const lowerP = cageGroup.getObjectByName("lowerPulley");
                    if (upperP) upperP.rotation.z = -cassetteAngle * 2.0;
                    if (lowerP) lowerP.rotation.z = -cassetteAngle * 2.0;
                }

                // Dynamic Live Telemetry Updates
                document.getElementById('rear-rpm').textContent = Math.round(crankRPM * gearRatio);
            }

            // Update Dynamic Chain Curve & Position Links
            updateChainLinks();

            // Controls & Render
            controls.update();
            renderer.render(scene, camera);
        }

        // --- Position Chain Links Along Spline ---
        function updateChainLinks() {
            const spline = calculateChainCurve();
            const totalLength = spline.getLength();
            const links = chainMeshGroup.children;
            const count = links.length;
            const linkSpacing = 0.82; // Distance between link pins

            for (let i = 0; i < count; i++) {
                const link = links[i];
                const dist = (chainOffset + i * linkSpacing) % totalLength;
                const u = dist / totalLength;

                const point = spline.getPointAt(u);
                const tangent = spline.getTangentAt(u);

                link.position.copy(point);
                
                // Align link along curve tangent
                const targetLook = point.clone().add(tangent);
                link.lookAt(targetLook);
                link.rotateY(Math.PI / 2);
            }
        }

        // --- User Interface & Interactivity ---
        function setupUI() {
            // Populate Cog Selection Grid
            const grid = document.getElementById('cog-grid');
            grid.innerHTML = '';
            CASSETTE_SPECS.forEach((spec, idx) => {
                const btn = document.createElement('div');
                btn.className = `cog-btn ${idx === currentGearIndex ? 'active' : ''}`;
                btn.innerHTML = `${spec.gear}<div class="teeth-tag">${spec.teeth}T</div>`;
                btn.onclick = () => selectGear(idx);
                grid.appendChild(btn);
            });

            // Buttons & Slider Handlers
            document.getElementById('btn-shift-up').onclick = shiftUp;
            document.getElementById('btn-shift-down').onclick = shiftDown;
            document.getElementById('btn-motor-toggle').onclick = toggleMotor;
            
            const slider = document.getElementById('cadence-slider');
            slider.oninput = (e) => {
                crankRPM = parseFloat(e.target.value);
                document.getElementById('cadence-val').textContent = `${crankRPM} RPM`;
            };

            // Camera Toolbar
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.onclick = (e) => {
                    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    switchCameraView(e.target.dataset.view);
                };
            });

            updateGearHUD();
        }

        function selectGear(index) {
            if (index < 0 || index >= CASSETTE_SPECS.length || index === targetGearIndex) return;
            targetGearIndex = index;
            shiftProgress = 0.0;
            updateGearHUD();
        }

        function shiftUp() {
            if (targetGearIndex < CASSETTE_SPECS.length - 1) {
                selectGear(targetGearIndex + 1);
            }
        }

        function shiftDown() {
            if (targetGearIndex > 0) {
                selectGear(targetGearIndex - 1);
            }
        }

        function toggleMotor() {
            isMotorRunning = !isMotorRunning;
            const btn = document.getElementById('btn-motor-toggle');
            const icon = document.getElementById('motor-icon');
            const text = document.getElementById('motor-btn-text');

            if (isMotorRunning) {
                btn.className = "btn-motor playing";
                text.textContent = "PAUSE MOTOR";
                icon.innerHTML = `<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>`;
            } else {
                btn.className = "btn-motor paused";
                text.textContent = "START MOTOR";
                icon.innerHTML = `<polygon points="5 3 19 12 5 21 5 3"></polygon>`;
            }
        }

        function updateGearHUD() {
            const spec = CASSETTE_SPECS[targetGearIndex];
            const ratio = (FRONT_TEETH / spec.teeth).toFixed(2);

            document.getElementById('gear-display').innerHTML = `${spec.gear} <span>/ 7</span>`;
            document.getElementById('teeth-ratio').textContent = `${FRONT_TEETH}T / ${spec.teeth}T`;
            document.getElementById('gear-ratio').textContent = `${ratio} : 1`;

            // Cog grid active states
            const buttons = document.querySelectorAll('.cog-btn');
            buttons.forEach((btn, idx) => {
                if (idx === targetGearIndex) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            // Shift buttons disabled state
            document.getElementById('btn-shift-down').disabled = (targetGearIndex === 0);
            document.getElementById('btn-shift-up').disabled = (targetGearIndex === CASSETTE_SPECS.length - 1);
        }

        function switchCameraView(viewKey) {
            const duration = 1000;
            let targetPos, targetLookAt;

            switch(viewKey) {
                case 'side':
                    targetPos = new THREE.Vector3(0, 8.5, 42);
                    targetLookAt = new THREE.Vector3(0, 8.5, 0);
                    break;
                case 'derailleur':
                    targetPos = new THREE.Vector3(20, 5.0, 16);
                    targetLookAt = new THREE.Vector3(12, 6.0, 0);
                    break;
                case 'top':
                    targetPos = new THREE.Vector3(0, 48, 0.1);
                    targetLookAt = new THREE.Vector3(0, 8.5, 0);
                    break;
                case 'iso':
                default:
                    targetPos = new THREE.Vector3(28, 18, 36);
                    targetLookAt = new THREE.Vector3(0, 7.5, 0);
                    break;
            }

            animateCamera(targetPos, targetLookAt, duration);
        }

        function animateCamera(targetPos, targetLookAt, duration) {
            const startPos = camera.position.clone();
            const startTarget = controls.target.clone();
            const startTime = performance.now();

            function updateCam() {
                const elapsed = performance.now() - startTime;
                const progress = Math.min(elapsed / duration, 1.0);
                const ease = easeInOutCubic(progress);

                camera.position.lerpVectors(startPos, targetPos, ease);
                controls.target.lerpVectors(startTarget, targetLookAt, ease);

                if (progress < 1.0) {
                    requestAnimationFrame(updateCam);
                }
            }
            updateCam();
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onKeyDown(e) {
            if (e.key === 'ArrowUp' || e.key === 'ArrowRight') shiftUp();
            else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') shiftDown();
            else if (e.code === 'Space') {
                e.preventDefault();
                toggleMotor();
            }
        }

        // Start Application
        window.onload = init;
    </script>
</body>
</html>
