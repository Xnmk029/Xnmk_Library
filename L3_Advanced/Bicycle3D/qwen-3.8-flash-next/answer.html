<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier Vélo — 参数化 3D 自行车工作室与装配模拟器</title>
<style>
  :root{
    --ink:#171b21; --ink2:#2b323c; --paper:#f2f0ea; --paper2:#ffffff;
    --line:#171b21; --accent:#ef5a29; --accent2:#2f6df0; --ok:#1f9d6b;
    --shadow:0 3px 0 rgba(23,27,33,.16);
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Inter","Helvetica Neue",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--sans)}
  #stage{position:fixed;inset:0;z-index:0}
  #stage canvas{display:block;width:100%;height:100%}
  #grain{position:fixed;inset:0;z-index:1;pointer-events:none;mix-blend-mode:multiply;opacity:.10;
    background-image:radial-gradient(rgba(23,27,33,.5) .5px, transparent .6px);background-size:3px 3px}
  /* ── top bar ── */
  #topbar{position:fixed;top:0;left:0;right:0;height:52px;z-index:6;display:flex;align-items:center;gap:14px;
    padding:0 16px;background:linear-gradient(180deg,rgba(242,240,234,.96),rgba(242,240,234,.72));
    border-bottom:2px solid var(--line);backdrop-filter:blur(6px)}
  #brand{font-family:var(--mono);font-weight:700;letter-spacing:.10em;font-size:14px;text-transform:uppercase}
  #brand small{display:block;font-weight:500;letter-spacing:.22em;font-size:9px;opacity:.62}
  .chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;border:2px solid var(--line);
    background:var(--paper2);padding:4px 9px;box-shadow:var(--shadow);white-space:nowrap}
  .chip b{color:var(--accent)}
  #chips{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
  .btn{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;
    border:2px solid var(--line);background:var(--paper2);color:var(--ink);padding:5px 10px;box-shadow:var(--shadow);
    transition:transform .08s ease, background .15s}
  .btn:hover{background:#fff7ef}
  .btn:active{transform:translate(1px,2px);box-shadow:0 1px 0 rgba(23,27,33,.16)}
  .btn.on{background:var(--accent);color:#fff}
  /* ── side panel ── */
  #panel{position:fixed;top:52px;left:0;bottom:26px;width:328px;z-index:5;overflow-y:auto;overscroll-behavior:contain;
    background:rgba(255,255,255,.90);border-right:2px solid var(--line);backdrop-filter:blur(8px);padding:10px 10px 40px}
  #panel::-webkit-scrollbar{width:9px}#panel::-webkit-scrollbar-thumb{background:#c9c6bd;border:2px solid #fff}
  #panel.collapsed{transform:translateX(-320px)}
  #panel{transition:transform .28s cubic-bezier(.4,1.3,.5,1)}
  .grp{border:2px solid var(--line);background:var(--paper2);margin:0 0 9px;box-shadow:var(--shadow)}
  .grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 10px;
    font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
    background:var(--ink);color:var(--paper);user-select:none}
  .grp>summary::-webkit-details-marker{display:none}
  .grp>summary .dot{width:8px;height:8px;background:var(--accent);border:1.5px solid #fff;flex:0 0 auto}
  .grp>summary .tw{margin-left:auto;font-size:9px;opacity:.7}
  .grp[open]>summary .tw{transform:rotate(90deg)}
  .grp:nth-of-type(2)>summary .dot{background:var(--accent2)}
  .grp:nth-of-type(3)>summary .dot{background:#1f9d6b}
  .grp:nth-of-type(4)>summary .dot{background:#c9a227}
  .grp:nth-of-type(5)>summary .dot{background:#a03cd4}
  .grp:nth-of-type(6)>summary .dot{background:#e8447a}
  .grp:nth-of-type(7)>summary .dot{background:#0f8f9d}
  .body{padding:9px 10px 11px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:8px}
  .lab{font-size:10.5px;letter-spacing:.02em;flex:1 1 auto;line-height:1.25}
  .lab em{font-style:normal;font-family:var(--mono);font-size:9px;opacity:.55;display:block}
  .val{font-family:var(--mono);font-size:10.5px;font-weight:700;min-width:56px;text-align:right;
    background:#f4f2ec;border:1.5px solid #dcd8cd;padding:1px 4px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:118px;height:16px;background:transparent;flex:0 0 auto}
  input[type=range]::-webkit-slider-runnable-track{height:6px;background:#e6e2d8;border:1.5px solid var(--line)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-6px;
    background:var(--accent);border:2px solid var(--line);cursor:grab}
  input[type=range]::-moz-range-track{height:6px;background:#e6e2d8;border:1.5px solid var(--line)}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;background:var(--accent);border:2px solid var(--line);cursor:grab}
  select{font-family:var(--mono);font-size:10.5px;border:1.5px solid var(--line);background:#f8f6f1;padding:3px 5px;
    box-shadow:1px 1px 0 rgba(23,27,33,.12);max-width:150px}
  input[type=color]{width:30px;height:22px;padding:0;border:2px solid var(--line);background:#fff;cursor:pointer}
  .seg{display:flex;gap:0;border:1.5px solid var(--line);overflow:hidden}
  .seg button{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;border:0;border-right:1.5px solid var(--line);
    background:#f6f4ef;padding:4px 6px;cursor:pointer;flex:1;text-transform:uppercase}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--ink);color:#fff}
  .hint{font-size:9.5px;line-height:1.4;opacity:.62;border-left:3px solid var(--accent);padding-left:7px}
  /* ── HUD ── */
  #hud{position:fixed;right:12px;top:64px;width:270px;z-index:5;border:2px solid var(--line);background:rgba(255,255,255,.92);
    box-shadow:var(--shadow);backdrop-filter:blur(6px);font-family:var(--mono)}
  #hud h3{margin:0;padding:6px 9px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:var(--ink);color:#fff;
    display:flex;align-items:center;gap:6px}
  #hud h3 .bar{margin-left:auto;font-size:9px;opacity:.7;letter-spacing:.06em}
  #hud .hrow{display:flex;justify-content:space-between;gap:8px;padding:2.5px 9px;font-size:10px;border-bottom:1px dotted #cfcabd}
  #hud .hrow span:first-child{opacity:.62;letter-spacing:.03em}
  #hud .hrow b{font-weight:700}
  #wt{padding:7px 9px 9px}
  #wt .tot{font-size:21px;font-weight:700;letter-spacing:-.01em}
  #wt .tot i{font-style:normal;font-size:10px;opacity:.6;margin-left:3px}
  .wbar{height:9px;border:1.5px solid var(--line);display:flex;margin-top:6px;background:#eee9df}
  .wbar div{height:100%;border-right:1px solid rgba(23,27,33,.35)}
  .wleg{display:flex;flex-wrap:wrap;gap:3px 9px;margin-top:5px;font-size:8.5px;line-height:1.3;opacity:.85}
  .wleg i{width:7px;height:7px;display:inline-block;border:1px solid var(--line);margin-right:3px}
  #hud.min #wt,#hud.min .hrow{display:none}
  /* ── labels ── */
  #labels{position:fixed;inset:0;z-index:3;pointer-events:none}
  .tag{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-size:9px;letter-spacing:.05em;
    border:1.5px solid var(--line);background:rgba(255,255,255,.94);padding:1.5px 5px;white-space:nowrap;
    box-shadow:1px 1px 0 rgba(23,27,33,.25)}
  .tag::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:11px;background:var(--line)}
  .tag.acc{background:var(--accent);color:#fff}
  /* ── status bar ── */
  #status{position:fixed;left:0;right:0;bottom:0;height:26px;z-index:6;display:flex;align-items:center;gap:12px;
    padding:0 12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;background:var(--ink);color:#e9e6de;
    border-top:2px solid var(--line)}
  #status b{color:#ffb28a;font-weight:700}
  #status .sp{margin-left:auto;opacity:.6}
  #err{position:fixed;left:340px;bottom:36px;z-index:9;max-width:min(560px,60vw);font-family:var(--mono);font-size:10px;
    background:#fff3f0;border:2px solid #c0392b;color:#7c1d12;padding:8px 10px;display:none;white-space:pre-wrap;line-height:1.45}
  #toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);z-index:9;font-family:var(--mono);font-size:10.5px;
    background:var(--ink);color:#fff;border:2px solid var(--ink);padding:6px 12px;box-shadow:var(--shadow);opacity:0;
    transition:opacity .25s, transform .25s;letter-spacing:.05em}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
  @media (max-width:1080px){ #hud{display:none} }
  @media (max-width:820px){ #panel{width:288px} }
</style>
</head>
<body>
<div id="stage"></div>
<div id="grain"></div>
<div id="labels"></div>

<div id="topbar">
  <div id="brand">ATELIER&nbsp;VÉLO<small>parametric studio · assembly sim</small></div>
  <div id="chips">
    <div class="chip">CFG <b id="c-cfg">—</b></div>
    <div class="chip">GEAR <b id="c-gear">—</b></div>
    <div class="chip">WEIGHT <b id="c-wt">—</b></div>
    <div class="chip">EXPLODE <b id="c-exp">0%</b></div>
    <button class="btn" id="b-reset" title="恢复默认参数">Reset</button>
    <button class="btn" id="b-tags" title="组件标签">Tags</button>
    <button class="btn" id="b-fold" title="折叠控制面板">Panel</button>
  </div>
</div>

<aside id="panel"></aside>

<div id="hud">
  <h3>Specifications<span class="bar" id="h-mode">STUDIO</span></h3>
  <div id="hrows"></div>
  <div id="wt">
    <div class="tot"><span id="w-tot">0</span><i>g · estimated</i></div>
    <div class="wbar" id="w-bar"></div>
    <div class="wleg" id="w-leg"></div>
  </div>
</div>

<div id="status">
  <span>FPS <b id="s-fps">–</b></span><span>DRAW <b id="s-dc">–</b></span><span>TRI <b id="s-tri">–</b></span>
  <span>GEO <b id="s-geo">–</b></span><span>TEX <b id="s-tex">–</b></span><span>PROG <b id="s-exp">0.00</b></span>
  <span class="sp" id="s-hint">拖拽旋转 · 滚轮缩放 · 右键平移</span>
</div>
<div id="err"></div>
<div id="toast"></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
} }
</script>
<script>
window.addEventListener('error', function (e) {
  var d = document.getElementById('err');
  d.style.display = 'block';
  d.textContent = 'RUNTIME · ' + (e.message || e.error) + '\n' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || '?');
});
</script>
<script type="module">
/* =====================================================================
   10 · CORE — renderer / scene / camera / NPR materials / geometry kit
   ===================================================================== */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => { const n = +v; return Number.isFinite(n) ? (n < a ? a : n > b ? b : n) : (a + b) / 2; };
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const rad = (d) => d * Math.PI / 180;
const deg = (r) => r * 180 / Math.PI;
const num = (v, d) => Number.isFinite(+v) ? +v : d;
const mm = (v) => Math.round(v * 1000);
const V = (x, y, z) => new THREE.Vector3(x || 0, y || 0, z || 0);
const V2 = (x, y) => new THREE.Vector2(x || 0, y || 0);
const UP = V(0, 1, 0);
const DRIVE = -1;                       // drive side = -Z (bike faces +X)
window.__BIKE__ = { THREE, params: null, layout: null, scene: null };

/* ── renderer ─────────────────────────────────────────────────────── */
const stage = $('#stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const SKY = { top: new THREE.Color('#dfe9f2'), bot: new THREE.Color('#f7f4ee') };
function makeSkyTex() {
  const c = document.createElement('canvas'); c.width = 4; c.height = 128;
  const g = c.getContext('2d'), lg = g.createLinearGradient(0, 0, 0, 128);
  lg.addColorStop(0, SKY.top.getStyle()); lg.addColorStop(0.62, '#f2efe8'); lg.addColorStop(1, SKY.bot.getStyle());
  g.fillStyle = lg; g.fillRect(0, 0, 4, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const bgTex = makeSkyTex();
scene.background = bgTex;
scene.fog = new THREE.Fog(new THREE.Color('#efece4'), 7.5, 20);

const camera = new THREE.PerspectiveCamera(37, innerWidth / innerHeight, 0.05, 60);
camera.position.set(0.30, 0.70, -3.55);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.06, 0.20, 0);
controls.enableDamping = true; controls.dampingFactor = 0.075;
controls.minDistance = 0.8; controls.maxDistance = 9;
controls.maxPolarAngle = rad(101);
controls.update();

/* ── lights (bright readable baseline) ─────────────────────────────── */
const key = new THREE.DirectionalLight(0xfff4e2, 2.35);
key.position.set(-1.7, 3.3, -2.9); key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -2.3; key.shadow.camera.right = 2.3;
key.shadow.camera.top = 2.3; key.shadow.camera.bottom = -2.3;
key.shadow.camera.near = 0.4; key.shadow.camera.far = 12; key.shadow.bias = -0.0012;
const fill = new THREE.DirectionalLight(0xdce8ff, 0.85); fill.position.set(2.6, 1.5, -2.2);
const rim = new THREE.DirectionalLight(0xffffff, 0.65); rim.position.set(0.6, 1.3, 3.4);
const hemi = new THREE.HemisphereLight(0xeaf2ff, 0xbdb6a6, 0.85);
scene.add(key, fill, rim, hemi);
const lightRig = { key, fill, rim, hemi };

/* ── procedural textures ───────────────────────────────────────────── */
function lutTex(steps) {                       // cel banding LUT
  const c = document.createElement('canvas'); c.width = steps.length; c.height = 1;
  const g = c.getContext('2d');
  steps.forEach((s, i) => { g.fillStyle = 'rgb(' + [s, s, s].map((v) => Math.round(clamp(v, 0, 1) * 255)).join(',') + ')'; g.fillRect(i, 0, 1, 1); });
  const t = new THREE.CanvasTexture(c); t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false;
  t.colorSpace = THREE.NoColorSpace; return t;
}
function noiseTex(n, contrast, base) {         // matte speckle / brushed metal
  const c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d'), im = g.createImageData(n, n);
  for (let i = 0; i < n * n; i++) {
    const v = base + (Math.random() - 0.5) * contrast * 255;
    im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = clamp(v, 0, 255); im.data[i * 4 + 3] = 255;
  }
  g.putImageData(im, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t;
}
function carbonTex() {
  const n = 32, c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d');
  for (let y = 0; y < n; y += 8) for (let x = 0; x < n; x += 8) {
    const up = ((x + y) / 8) % 2 === 0;
    const lg = g.createLinearGradient(x, y, x + 8, y + 8);
    if (up) { lg.addColorStop(0, '#4c5157'); lg.addColorStop(1, '#22262b'); }
    else { lg.addColorStop(0, '#2a2e33'); lg.addColorStop(1, '#43484f'); }
    g.fillStyle = lg; g.fillRect(x, y, 8, 8);
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(9, 2);
  t.colorSpace = THREE.SRGBColorSpace; return t;
}
function stripeTex(a, b, w, tilt) {            // bar tape / tyre sheen
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const g = c.getContext('2d'); g.fillStyle = a; g.fillRect(0, 0, 32, 32);
  g.strokeStyle = b; g.lineWidth = w || 6; g.beginPath();
  for (let i = -32; i < 64; i += 16) { g.moveTo(i, 34); g.lineTo(i + 34 * (tilt || 1), -2); } g.stroke();
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(26, 1);
  t.colorSpace = THREE.SRGBColorSpace; return t;
}
function floorTex() {
  const n = 512, c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d');
  g.fillStyle = '#e8e5dd'; g.fillRect(0, 0, n, n);
  g.strokeStyle = 'rgba(23,27,33,.22)'; g.lineWidth = 3;
  for (let i = 0; i <= 4; i++) { const p = i * n / 4; g.beginPath(); g.moveTo(p, 0); g.lineTo(p, n); g.moveTo(0, p); g.lineTo(n, p); g.stroke(); }
  g.fillStyle = 'rgba(23,27,33,.035)';
  for (let i = 0; i < 2600; i++) g.fillRect(Math.random() * n, Math.random() * n, 2, 2);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(7, 7);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
const TEX = { carbon: carbonTex(), matte: noiseTex(64, .10, 214), brush: noiseTex(64, .16, 200), tape: stripeTex('#ffffff', 'rgba(0,0,0,.20)', 7, 1), floor: floorTex() };
const LUT = {
  gloss: lutTex([.30, .58, .84, 1.06]),
  matte: lutTex([.52, .74, .92, 1.04]),
  metallic: lutTex([.24, .44, .62, 1.10]),
  carbon: lutTex([.22, .40, .70, 1.12]),
};

/* ── material registry (shared / reused) ──────────────────────────── */
const INK = '#171b21';
function mkToon(color, o) {
  o = o || {};
  const m = new THREE.MeshToonMaterial({
    color: new THREE.Color(color), gradientMap: LUT[o.lut || 'gloss'],
    map: o.map || null, side: o.side || THREE.FrontSide,
  });
  m.userData.kind = o.kind || 'paint'; m.userData.lut = o.lut || 'gloss'; m.userData.base = new THREE.Color(color);
  return m;
}
const MAT = {
  ink: new THREE.MeshBasicMaterial({ color: new THREE.Color(INK), side: THREE.BackSide }),
  line: new THREE.LineBasicMaterial({ color: new THREE.Color(INK) }),
  frame: mkToon('#e8541f', { lut: 'gloss', kind: 'frame' }),
  fork: mkToon('#e8541f', { lut: 'gloss', kind: 'fork' }),
  rim: mkToon('#25303f', { lut: 'metallic', kind: 'rim' }),
  drive: mkToon('#cfd4da', { lut: 'metallic', kind: 'drive', map: TEX.brush }),
  cockpit: mkToon('#2a2f38', { lut: 'matte', kind: 'cockpit', map: TEX.matte }),
  saddle: mkToon('#1b1e24', { lut: 'matte', kind: 'saddle', map: TEX.matte }),
  carbon: mkToon('#3b4148', { lut: 'carbon', kind: 'carbon', map: TEX.carbon }),
  steel: mkToon('#b7bec8', { lut: 'metallic', kind: 'steel', map: TEX.brush }),
  chrome: mkToon('#e7ebf0', { lut: 'metallic', kind: 'steel' }),
  rubber: mkToon('#20242a', { lut: 'matte', kind: 'rubber', map: TEX.matte }),
  tape: mkToon('#f2e9d8', { lut: 'matte', kind: 'tape', map: TEX.tape }),
  cable: mkToon('#191c21', { lut: 'matte', kind: 'cable' }),
  gold: mkToon('#d8a83c', { lut: 'metallic', kind: 'drive' }),
  glass: new THREE.MeshBasicMaterial({ color: new THREE.Color('#9fd4ff'), transparent: true, opacity: .28 }),
  sticker: mkToon('#ffffff', { lut: 'gloss', kind: 'sticker' }),
};
MAT.drive.repeat = 4;
const PAINTED = ['frame', 'fork', 'rim', 'drive', 'cockpit', 'saddle', 'carbon', 'tape'];
/* live render-style state (driven by the Render Style panel) */
const RENDER = { outline: 1.6, posterize: 7, pixel: 1, sat: 1.10, exposure: 1.06, shadows: true, bg: 'studio', wire: false, steps: 'gloss' };
const envMats = [];                            // studio props keep their own flat palette

/* ── geometry cache / kit ─────────────────────────────────────────── */
const GEO = {
  seg: new THREE.CylinderGeometry(1, 1, 1, 16, 1),
  seg8: new THREE.CylinderGeometry(1, 1, 1, 8, 1),
  seg6: new THREE.CylinderGeometry(1, 1, 1, 6, 1),
  ball: new THREE.SphereGeometry(1, 14, 10),
  box: new THREE.BoxGeometry(1, 1, 1),
  ring: new THREE.RingGeometry(0.9, 1, 40),
  cyl: new THREE.CylinderGeometry(1, 1, 1, 20, 1),

function hullChain() {
  const circ = [
    { x: 0, y: 0, r: L.ringR(clamp(P.gearF, 0, L.rings - 1)) + 0.0026, z: L.ringZ[clamp(P.gearF, 0, L.rings - 1)] },
    { x: L.RA.x, y: L.RA.y, r: L.cogR(L.kSel) + 0.0026, z: L.cogZ(L.kSel) },
    { x: L.j1.x, y: L.j1.y, r: 0.0085, z: L.j1.z },
    { x: L.j2.x, y: L.j2.y, r: 0.0085, z: L.j2.z },

  const pts = [];
  circ.forEach((cc, ci) => {
    const N = 30;
    for (let i = 0; i < N; i++) { const a = i / N * Math.PI * 2; pts.push({ x: cc.x + Math.cos(a) * cc.r, y: cc.y + Math.sin(a) * cc.r, z: cc.z, ci }); }
  });

  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lo = [], up = [];
  for (const p of pts) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }

  hull.forEach((p) => { const last = out[out.length - 1]; if (!last || Math.hypot(p.x - last.x, p.y - last.y) > 0.004) out.push(p); });
  return out;
}

/* ── audit: alignment errors & explode round-trip (console + chip) ──── */
function snapshotWorld() {
  const out = new Map();
  bike.updateMatrixWorld(true);
  for (const g of EXPL) out.set(g.name + '|' + (g.userData.label || ''), g.matrixWorld.clone());
  return out;
}
function audit() {
  const R = [];
  const fin = (x) => Number.isFinite(x);
  const pts = [L.A, L.B, L.FA, L.RA, L.ttST, L.ssST, L.stTop, L.spTop, L.saddleC, L.barPt, L.stemEnd];
  R.push(['anchors finite', pts.every((p) => fin(p.x) && fin(p.y) && fin(p.z))]);
  R.push(['chainstay length', Math.abs(-L.RA.x - P.chainstay / 1000) < 1e-6]);
  R.push(['axle heights match', Math.abs(L.FA.y - L.RA.y) < 1e-6]);
  R.push(['wheelbase', fin(L.wheelbase) && L.wheelbase > 0.9 && L.wheelbase < 1.4]);
  R.push(['trail in 25–85mm', L.trail > 0.025 && L.trail < 0.085]);
  const csErr = Math.abs(V(L.RA.x, L.RA.y, DRIVE * 0.0575).distanceTo(V(-P.chainstay / 1000, L.hubY, DRIVE * 0.0575)));
  R.push(['dropout alignment <1e-6', csErr < 1e-6]);
  const chainErr = Math.abs(L.guideZ - L.cogZ(L.kSel));
  R.push(['RD aligned to selected cog', chainErr < 1e-9]);
  const m0 = snapshotWorld(); setExplode(1, true); const m1 = snapshotWorld(); setExplode(0, true); const m2 = snapshotWorld();
  let maxD = 0;
  m0.forEach((mm0, k) => { const d = mm0.elements.reduce((s, v, i) => Math.max(s, Math.abs(v - m2.get(k).elements[i])), 0); maxD = Math.max(maxD, d); });
  R.push(['explode round-trip (Δmatrix <1e-9)', maxD < 1e-9]);
  R.push(['cassette cogs = speed', CAS.cogs.filter((c) => c.visible).length === L.n]);
  R.push(['FD visibility matches rings', fdG.visible === (L.rings > 1)]);
  const moved = EXPL.filter((g, i) => !m1.get(g.name + '|' + (g.userData.label || '')).equals(m0.get(g.name + '|' + (g.userData.label || '')))).length;
  R.push(['exploded assemblies ≥10', moved >= 10]);
  const bad = R.filter((r) => !r[1]);
  console.log('%c BIKE AUDIT ', 'background:#171b21;color:#fff', '\n' + R.map((r) => (r[1] ? ' ✓ ' : ' ✗ ') + r[0]).join('\n'));
  if (bad.length) console.warn('audit failures:', bad.map((b) => b[0]));
  toast('AUDIT ' + (R.length - bad.length) + '/' + R.length + (bad.length ? ' · ' + bad.map((b) => b[0]).join(' | ') : ' · all pass'));
  window.__BIKE__.auditResult = R;
  return R;
}

    { t: 'seg', k: 'bg', label: 'Backdrop', options: [['Studio', 'studio'], ['Flat', 'flat'], ['Ink', 'ink']] },

];
const RENDER_KEYS = ['outline', 'posterize', 'pixel', 'sat', 'exposure', 'bg', 'shadows', 'wire', 'steps'];
const SCHEMES = [
  { cFrame: '#e8541f', cFork: '#e8541f', cRim: '#25303f', cDrive: '#cfd4da', cCockpit: '#2a2f38', cSaddle: '#1b1e24', cTape: '#f2e9d8', fFrame: 'gloss', fRim: 'metallic', label: 'SIGNAL' },
  { cFrame: '#1c1f24', cFork: '#1c1f24', cRim: '#141619', cDrive: '#8d949d', cCockpit: '#0f1114', cSaddle: '#26292e', cTape: '#2b2f35', fFrame: 'matte', fRim: 'matte', label: 'STEALTH' },
  { cFrame: '#12a3b8', cFork: '#f5f2ea', cRim: '#2b323c', cDrive: '#d8a83c', cCockpit: '#2b323c', cSaddle: '#f5f2ea', cTape: '#12a3b8', fFrame: 'gloss', fRim: 'carbon', label: 'CYAN' },
  { cFrame: '#3b5f36', cFork: '#c9b47f', cRim: '#d9d2c0', cDrive: '#b7bec8', cCockpit: '#4a3a28', cSaddle: '#7a4a2b', cTape: '#e8dcc0', fFrame: 'metallic', fRim: 'gloss', label: 'HERITAGE' },
];
let schemeI = 0;
function cycleScheme() {
  schemeI = (schemeI + 1) % SCHEMES.length; const s = SCHEMES[schemeI];
  ['cFrame', 'cFork', 'cRim', 'cDrive', 'cCockpit', 'cSaddle', 'cTape', 'fFrame', 'fRim'].forEach((k) => { P[k] = s[k]; });
  applyColors(); syncInputs(); requestUpdate(); toast('scheme · ' + s.label);
}
function applyColors() {
  MAT.frame.color.set(P.cFrame); MAT.fork.color.set(P.cFork); MAT.rim.color.set(P.cRim);
  MAT.drive.color.set(P.cDrive); MAT.cockpit.color.set(P.cCockpit); MAT.saddle.color.set(P.cSaddle); MAT.tape.color.set(P.cTape);
  applyFinish(MAT.frame, P.fFrame); applyFinish(MAT.fork, P.fFrame);
  applyFinish(MAT.rim, P.fRim); applyFinish(MAT.drive, P.fDrive); applyFinish(MAT.cockpit, P.fCockpit);
  applyFinish(MAT.carbon, P.fFrame === 'carbon' ? 'carbon' : 'carbon');
  const bands = clamp(parseInt(P.steps, 10) || 4, 2, 5);
  Object.keys(LUT).forEach((k) => {
    const src = { gloss: [.30, .58, .84, 1.06], matte: [.52, .74, .92, 1.04], metallic: [.24, .44, .62, 1.10], carbon: [.22, .40, .70, 1.12] }[k];
    const out = []; for (let i = 0; i < bands; i++) out.push(src[Math.round(i / (bands - 1) * (src.length - 1))]);
    LUT[k].dispose(); LUT[k] = lutTex(out);
  });
  [MAT.frame, MAT.fork, MAT.rim, MAT.drive, MAT.cockpit, MAT.saddle, MAT.carbon, MAT.tape, MAT.rubber, MAT.cable, MAT.steel, MAT.chrome, MAT.gold].forEach((m) => {
    if (m.userData && m.userData.lut) { m.gradientMap = LUT[m.userData.lut]; m.needsUpdate = true; }
  });
  scene.traverse((o) => { if (o.isMesh && o.material && o.material.isMeshToonMaterial) o.material.needsUpdate = true; });
}
function copySpecs(json) {
  const l = L, m = massEstimate(P, l), tot = Object.values(m).reduce((a, b) => a + b, 0);
  const txt = json ? JSON.stringify({ params: P, specs: { stack: mm(l.stack), reach: mm(l.reach), headAngle: +deg(l.HA).toFixed(1), seatAngle: +deg(l.SA).toFixed(1), chainstay: mm(l.CS), wheelbase: mm(l.wheelbase), trail: mm(l.trail), bbDrop: mm(l.hubY), config: cfgText(P, l), weight_g: Math.round(tot), breakdown: Object.fromEntries(Object.entries(m).map(([k, v]) => [k, Math.round(v)])) } })
    : ['ATELIER VÉLO — spec sheet', 'frame: stack ' + mm(l.stack) + ' reach ' + mm(l.reach) + ' HTA ' + deg(l.HA).toFixed(1) + ' STA ' + deg(l.SA).toFixed(1),
    'seat tube ' + mm(l.stLen) + ' · head tube ' + mm(l.htLen) + ' · chainstay ' + mm(l.CS) + ' · BB drop ' + mm(l.hubY),
    'wheelbase ' + mm(l.wheelbase) + ' · trail ' + mm(l.trail) + ' · stays ' + (P.droppedStays ? 'dropped' : 'traditional') + ' · compact ' + Math.round(P.compact * 100) + '%',
    'drivetrain ' + cfgText(P, l) + ' · gear ' + (l.kSel + 1) + '/' + l.n + ' · crank ' + P.crankLen + 'mm',
    'contact: saddle ' + mm(l.spTop.y) + ' above BB, setback ' + P.saddleSetback + ' · bar ' + P.barWidth + 'mm, flare ' + P.barFlare + ', rise ' + P.barRise,
    'estimated mass ' + Math.round(tot) + ' g — ' + Object.entries(m).map(([k, v]) => k + ' ' + Math.round(v)).join(', ')].join('\n');
  try {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta); toast(json ? 'build JSON copied' : 'spec sheet copied');
  } catch (e) { toast('copy blocked · see console'); console.log(txt); }
}

function buildPanel() {
  panel.innerHTML = '';
  GROUPS.forEach((g, gi) => {
    const d = el('details', 'grp'); d.open = !!g.open;
    const s = el('summary'); s.innerHTML = '<span class="dot"></span>' + g.name + '<span class="tw">▶</span>';
    d.appendChild(s);
    const b = el('div', 'body');
    g.items.forEach((sp) => b.appendChild(makeRow(sp)));
    d.appendChild(b); panel.appendChild(d);
  });
  syncInputs();
}
function syncInputs() { BINDINGS.forEach((b) => { try { b.set(); } catch (e) { } }); }
function wireStatic() {
  $('#b-reset').addEventListener('click', resetAll);
  $('#b-tags').addEventListener('click', (e) => { showTags = !showTags; e.currentTarget.classList.toggle('on', showTags); updateLabels(); });
  $('#b-fold').addEventListener('click', (e) => { panel.classList.toggle('collapsed'); e.currentTarget.classList.toggle('on', panel.classList.contains('collapsed')); });
}
/* =====================================================================
   80 · RENDER — post process (cel tone separation), stats, animation loop
   ===================================================================== */
renderer.toneMapping = THREE.NoToneMapping;
let rt = null, postOk = false, quad = null, quadMat = null, quadScene = null, quadCam = null;
try {
  rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
  rt.texture.colorSpace = THREE.NoColorSpace;
  rt.texture.minFilter = rt.texture.magFilter = THREE.LinearFilter;
  quadMat = new THREE.ShaderMaterial({
    uniforms: {
      tTex: { value: rt.texture }, uRes: { value: new THREE.Vector2(1, 1) },
      uPixel: { value: 1 }, uLevels: { value: 7 }, uSat: { value: 1.1 }, uExp: { value: 1.06 }, uVig: { value: 0.14 },
    },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: [
      'uniform sampler2D tTex; uniform vec2 uRes; uniform float uPixel, uLevels, uSat, uExp, uVig;',
      'varying vec2 vUv;',
      'vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }',
      'void main(){',
      '  vec2 uv = vUv;',
      '  if(uPixel > 1.001){ vec2 g = uRes/uPixel; uv = (floor(uv*g)+0.5)/g; }',
      '  vec3 col = texture2D(tTex, uv).rgb * uExp;',
      '  col = aces(col);',
      '  if(uLevels > 1.5){ col = floor(col*uLevels + 0.5)/uLevels; }',
      '  float l = dot(col, vec3(0.2126,0.7152,0.0722));',
      '  col = mix(vec3(l), col, uSat);',
      '  float d = distance(vUv, vec2(0.5));',
      '  col *= 1.0 - smoothstep(0.40, 1.02, d) * uVig;',
      '  col = pow(max(col, 0.0), vec3(1.0/2.2));',
      '  gl_FragColor = vec4(col, 1.0);',
      '}',

  quad.frustumCulled = false;

  postOk = true;
} catch (e) {
  postOk = false; renderer.toneMapping = THREE.ACESFilmicToneMapping;
  console.warn('post-process unavailable, falling back to direct render', e);
}

function syncRender() {
  RENDER.outline = num(P.outline, 1.6);
  RENDER.posterize = num(P.posterize, 7);
  RENDER.pixel = num(P.pixel, 1);
  RENDER.sat = num(P.sat, 1.1);
  RENDER.exposure = num(P.exposure, 1.06);
  RENDER.bg = P.bg || 'studio';
  RENDER.shadows = !!P.shadows;
  RENDER.wire = !!P.wire;
  renderer.toneMappingExposure = 1;
  renderer.shadowMap.enabled = RENDER.shadows;
  key.castShadow = RENDER.shadows;
  lightRig.hemi.intensity = RENDER.bg === 'ink' ? 1.15 : 0.85;
  const wireable = [MAT.frame, MAT.fork, MAT.rim, MAT.drive, MAT.cockpit, MAT.saddle, MAT.carbon, MAT.steel, MAT.chrome, MAT.rubber, MAT.tape];
  wireable.forEach((m) => { m.wireframe = RENDER.wire; });
  if (RENDER.bg === 'studio') { scene.background = bgTex; scene.fog.color.set('#efece4'); }
  else if (RENDER.bg === 'flat') { scene.background = new THREE.Color('#f1eee6'); }
  else { scene.background = new THREE.Color('#2f3640'); }
  envRoot.visible = RENDER.bg === 'studio';
  const g = $('#grain'); if (g) g.style.opacity = RENDER.bg === 'studio' ? '0.10' : '0.04';
  if (quadMat) {
    quadMat.uniforms.uLevels.value = RENDER.posterize;
    quadMat.uniforms.uPixel.value = RENDER.pixel;
    quadMat.uniforms.uSat.value = RENDER.sat;
    quadMat.uniforms.uExp.value = RENDER.exposure;
    quadMat.uniforms.uVig.value = RENDER.bg === 'ink' ? 0.22 : 0.13;
  }
  applyColors();
  syncHulls();
}

function resize() {
  const w = innerWidth, h = innerHeight, pr = Math.min(devicePixelRatio || 1, 2);
  renderer.setPixelRatio(pr); renderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  if (rt) {
    rt.setSize(Math.max(1, Math.round(w * pr)), Math.max(1, Math.round(h * pr)));
    if (quadMat) quadMat.uniforms.uRes.value.set(rt.width, rt.height);
  }
}
addEventListener('resize', resize);

/* ── animation loop ─────────────────────────────────────────────────── */
const clock = new THREE.Clock();
const stat = { calls: 0, tri: 0 };
let acc = 0, frames = 0, fps = 60, statT = 0;
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (dirty) { dirty = false; SPIN_A = rad(num(P.spin, 0)); updateAll(); }
  if (EXP.playing) {
    EXP.dir = EXP.dir || 1;
    const nx = clamp(EXP.target + EXP.dir * dt * 0.34, 0, 1);
    if (nx >= 1 && EXP.dir > 0) { EXP.dir = -1; } if (nx <= 0 && EXP.dir < 0) { EXP.dir = 1; }
    EXP.target = nx; setExplode(nx);
    const sl = $('#i_explode'); if (sl) { sl.value = String(nx.toFixed(2)); P.explode = nx; }
  }
  const moving = stepExplode(dt);
  stepCam(dt);
  controls.update();
  if (moving || camTween.on) updateLabels();
  if (postOk && rt) {
    renderer.info.autoReset = true;
    renderer.setRenderTarget(rt); renderer.render(scene, camera);
    stat.calls = renderer.info.render.calls; stat.tri = renderer.info.render.triangles;
    renderer.info.autoReset = false;
    renderer.setRenderTarget(null); renderer.render(quadScene, quadCam);
    renderer.info.autoReset = true;
  } else {
    renderer.info.autoReset = true;
    renderer.setRenderTarget(null); renderer.render(scene, camera);
    stat.calls = renderer.info.render.calls; stat.tri = renderer.info.render.triangles;
  }
  frames++; acc += dt; statT += dt;
  if (acc > 0.5) { fps = frames / acc; frames = 0; acc = 0; }
  if (statT > 0.4) {
    statT = 0;
    const inf = renderer.info;
    $('#s-fps').textContent = fps.toFixed(0);
    $('#s-dc').textContent = stat.calls;
    $('#s-tri').textContent = stat.tri.toLocaleString('en-US');
    $('#s-geo').textContent = inf.memory.geometries;
    $('#s-tex').textContent = inf.memory.textures;
    $('#c-exp').textContent = Math.round(EXP_T * 100) + '%';
    $('#s-exp').textContent = EXP_T.toFixed(2);
    const m = window.__BIKE__.mass; if (m) $('#c-wt').textContent = (m.tot / 1000).toFixed(2) + ' kg';
  }
}

/* ── keyboard shortcuts ─────────────────────────────────────────────── */
addEventListener('keydown', (e) => {
  if (e.target && /input|select|textarea/i.test(e.target.tagName)) return;
  const seq = ['side', 'drive', 'front', 'cockpit', 'drivetrain', 'top', 'studio'];
  if (e.key >= '1' && e.key <= '7') flyTo(seq[+e.key - 1]);
  else if (e.code === 'Space') { e.preventDefault(); setExplode(EXP_T > 0.5 ? 0 : 1); P.explode = EXP.target; syncInputs(); }
  else if (e.key === 't' || e.key === 'T') { showTags = !showTags; $('#b-tags').classList.toggle('on', showTags); updateLabels(); }
  else if (e.key === 'r' || e.key === 'R') resetAll();
  else if (e.key === 'a' || e.key === 'A') audit();
});

function countMeshes() { let n = 0; scene.traverse((o) => { if (o.isMesh && !o.userData.isHull && o.visible) n++; }); return n; }
Object.assign(window.__BIKE__, {
