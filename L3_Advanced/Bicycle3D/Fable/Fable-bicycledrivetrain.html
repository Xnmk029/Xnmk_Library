<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>低多边形自行车传动系统 — 交互式演示台</title>
<style>
  :root {
    --cyan: #22d3ee;
    --cyan-soft: #67e8f9;
    --cyan-dim: rgba(34, 211, 238, 0.35);
    --panel-bg: rgba(8, 12, 18, 0.78);
    --text-dim: #7a8899;
    --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', 'Roboto Mono', Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070c; }
  body { font-family: var(--mono); }
  canvas { display: block; }

  /* ---------- HUD control panel ---------- */
  #hud {
    position: fixed; top: 18px; right: 18px; width: 248px;
    background: var(--panel-bg);
    border: 1px solid var(--cyan-dim);
    border-radius: 14px;
    padding: 16px 16px 14px;
    color: #cfeaf2;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.55), inset 0 0 24px rgba(34, 211, 238, 0.04);
    user-select: none;
    z-index: 10;
  }
  .hud-head {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; letter-spacing: 2.5px; color: var(--cyan-soft);
    border-bottom: 1px solid rgba(34, 211, 238, 0.18);
    padding-bottom: 10px; margin-bottom: 12px;
  }
  .hud-head small { color: var(--text-dim); letter-spacing: 1.5px; font-size: 9px; margin-left: auto; }
  #statusDot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #34d399; box-shadow: 0 0 8px #34d399;
    animation: pulse 1.6s ease-in-out infinite;
  }
  #statusDot.off { background: #64748b; box-shadow: none; animation: none; }
  @keyframes pulse { 50% { opacity: 0.45; } }

  .gear-row { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 10px; }
  .gear-label { font-size: 9px; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 4px; }
  #gearNum {
    font-size: 34px; font-weight: 700; line-height: 1; color: var(--cyan-soft);
    text-shadow: 0 0 18px rgba(34, 211, 238, 0.6);
    transition: text-shadow 0.2s;
  }
  #gearNum span { font-size: 14px; font-weight: 400; color: var(--text-dim); text-shadow: none; }
  #ticks { display: flex; gap: 4px; padding-bottom: 5px; }
  #ticks i {
    width: 8px; height: 16px; border-radius: 2px;
    background: rgba(122, 136, 153, 0.22);
    border: 1px solid rgba(122, 136, 153, 0.25);
    transition: all 0.25s;
  }
  #ticks i.on {
    background: rgba(34, 211, 238, 0.85);
    border-color: var(--cyan);
    box-shadow: 0 0 9px rgba(34, 211, 238, 0.8);
  }

  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 14px; }
  .stat {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(122, 136, 153, 0.18);
    border-radius: 8px; padding: 6px 4px; text-align: center;
  }
  .stat em { display: block; font-style: normal; font-size: 8px; letter-spacing: 1.5px; color: var(--text-dim); margin-bottom: 3px; }
  .stat b { font-size: 13px; color: #e2f4fa; font-weight: 600; }

  button {
    width: 100%; padding: 9px 10px; margin-bottom: 8px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 1.8px;
    color: #a5f3fc; background: rgba(34, 211, 238, 0.08);
    border: 1px solid var(--cyan-dim); border-radius: 9px;
    cursor: pointer; transition: all 0.15s;
  }
  button:hover:not(:disabled) {
    background: rgba(34, 211, 238, 0.18);
    box-shadow: 0 0 14px rgba(34, 211, 238, 0.35);
    color: #e0fbff;
  }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.3; cursor: default; }
  .btn-pair { display: flex; gap: 8px; }
  .btn-pair button { margin-bottom: 0; }
  .hint { margin-top: 12px; font-size: 9px; letter-spacing: 1.2px; color: var(--text-dim); text-align: center; }

  #brand {
    position: fixed; left: 18px; bottom: 16px; z-index: 10;
    font-size: 10px; letter-spacing: 2px; color: var(--text-dim);
    background: var(--panel-bg);
    border: 1px solid rgba(122, 136, 153, 0.2);
    border-radius: 10px; padding: 9px 14px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    user-select: none;
  }
  #brand b { color: var(--cyan-soft); font-weight: 600; }

  #err {
    position: fixed; inset: 0; display: none; z-index: 50;
    align-items: center; justify-content: center; text-align: center;
    color: #fca5a5; background: #0a0d12; padding: 30px;
    font-size: 13px; line-height: 1.7; letter-spacing: 1px;
  }

  @media (max-width: 560px) {
    #hud { width: 200px; padding: 12px; top: 10px; right: 10px; }
    #gearNum { font-size: 26px; }
    #brand { display: none; }
  }
</style>
</head>
<body>

<div id="hud">
  <div class="hud-head">
    <div id="statusDot"></div>
    DRIVETRAIN <small>LP-DT/7 STAND</small>
  </div>

  <div class="gear-row">
    <div>
      <div class="gear-label">当前档位</div>
      <div id="gearNum">3 <span>/ 7</span></div>
    </div>
    <div id="ticks"></div>
  </div>

  <div class="stats">
    <div class="stat"><em>飞轮齿数</em><b id="statCog">17T</b></div>
    <div class="stat"><em>齿轮比</em><b id="statRatio">1.88</b></div>
    <div class="stat"><em>踏频 RPM</em><b id="statRpm">0</b></div>
  </div>

  <button id="btnMotor">&#10074;&#10074; &nbsp;PAUSE MOTOR</button>
  <div class="btn-pair">
    <button id="btnUp">&#9650; 升档 (Shift Up)</button>
    <button id="btnDown">&#9660; 降档 (Shift Down)</button>
  </div>
  <div class="hint">SPACE = MOTOR &nbsp;&middot;&nbsp; &#8593;/&#8595; = SHIFT</div>
</div>

<div id="brand"><b>LOW-POLY DRIVETRAIN LAB</b> &nbsp;//&nbsp; WEBGL DEMO STAND &nbsp;&middot;&nbsp; DRAG TO ORBIT &nbsp;&middot;&nbsp; SCROLL TO ZOOM</div>
<div id="err"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const TAU = Math.PI * 2;
const { lerp, clamp } = THREE.MathUtils;

/* ================================================================
   CONFIG — every dimension of the stand lives here
   ================================================================ */
const CFG = {
  axleY: 3.6,                       // height of both axles above floor
  frontX: 3.2, rearX: -3.2,         // axle x positions (front = chainring)
  pitch: 0.42,                      // chain pitch (drives every gear radius)
  ringTeeth: 32,
  cogTeeth: [22, 19, 17, 15, 13, 11, 9],  // gear 1 (big/easy) .. gear 7 (small/hard)
  cogZ0: -0.84, cogDZ: 0.28,        // cassette z spread, gear 1 innermost
  ringZ: 0,                         // chainline
  pulleyR: 0.30,                    // derailleur pulley pitch radius
  guideDX: 0.12,                    // guide pulley sits slightly ahead of cog center
  guideGap: 0.25,                   // clearance between cog and guide pulley circles
  cageL: 0.80,                      // pulley-to-pulley cage length
  cagePhiMin: -1.15, cagePhiMax: 1.25,  // cage swing solve range (rad from vertical, + = forward)
  crankLen: 2.75, crankZ: 0.85,     // crank arm reach and lateral offset
  crankRPM: 2.4,                    // motor speed, rad/s at the crank
};
const toothR = t => t * CFG.pitch / TAU;               // teeth -> pitch radius
const RING_R = toothR(CFG.ringTeeth);
const COG_R = CFG.cogTeeth.map(toothR);
const N_GEARS = CFG.cogTeeth.length;

const params = new URLSearchParams(location.search);   // ?gear=5&motor=0 for deep links

/* ================================================================
   RENDERER / SCENE / CAMERA
   ================================================================ */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  const el = document.getElementById('err');
  el.style.display = 'flex';
  el.textContent = 'WEBGL UNAVAILABLE — this demo needs a WebGL-capable browser. ' + e.message;
  throw e;
}
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070c);
scene.fog = new THREE.FogExp2(0x05070c, 0.018);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(5.8, 4.9, 13.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.7, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 4.5;
controls.maxDistance = 30;
controls.maxPolarAngle = 1.42;
controls.autoRotate = params.get('rotate') !== '0';   // showcase spin until the user grabs it
controls.autoRotateSpeed = 0.8;
controls.addEventListener('start', () => { controls.autoRotate = false; });

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ================================================================
   MATERIALS
   ================================================================ */
const MAT = {
  alu: new THREE.MeshStandardMaterial({ color: 0x2b323c, metalness: 0.82, roughness: 0.44, flatShading: true, envMapIntensity: 0.7 }),
  gunmetal: new THREE.MeshStandardMaterial({ color: 0x39424e, metalness: 0.8, roughness: 0.42, flatShading: true, envMapIntensity: 0.75 }),
  aluDark: new THREE.MeshStandardMaterial({ color: 0x171b21, metalness: 0.7, roughness: 0.55, flatShading: true, envMapIntensity: 0.4 }),
  chrome: new THREE.MeshStandardMaterial({ color: 0xdfe5ec, metalness: 0.95, roughness: 0.26, flatShading: true, envMapIntensity: 0.85 }),
  chromeDim: new THREE.MeshStandardMaterial({ color: 0xaab3bd, metalness: 0.9, roughness: 0.38, flatShading: true, envMapIntensity: 0.7 }),
  acrylic: new THREE.MeshPhysicalMaterial({
    color: 0x7dd3fc, transparent: true, opacity: 0.22, roughness: 0.12, metalness: 0,
    clearcoat: 1, clearcoatRoughness: 0.1, side: THREE.DoubleSide, depthWrite: false,
    envMapIntensity: 1.3, flatShading: true,
  }),
  ledCyan: new THREE.MeshStandardMaterial({ color: 0x06222b, emissive: 0x22d3ee, emissiveIntensity: 2.0, roughness: 0.4 }),
  ledMagenta: new THREE.MeshStandardMaterial({ color: 0x2b0626, emissive: 0xe879f9, emissiveIntensity: 1.6, roughness: 0.4 }),
  floor: new THREE.MeshStandardMaterial({ color: 0x0b0e14, metalness: 0.1, roughness: 0.94 }),
  pedestal: new THREE.MeshStandardMaterial({ color: 0x10141b, metalness: 0.35, roughness: 0.6, flatShading: true }),
};

/* ================================================================
   LIGHTING — soft ambient + studio spot with shadows + accents
   ================================================================ */
scene.add(new THREE.AmbientLight(0x223344, 0.5));
scene.add(new THREE.HemisphereLight(0x3b4f66, 0x0b0d10, 0.55));

const spot = new THREE.SpotLight(0xf4f8ff, 1500, 0, 0.55, 0.5, 2);
spot.position.set(7, 14, 7);
spot.castShadow = true;
spot.shadow.mapSize.set(2048, 2048);
spot.shadow.bias = -0.0003;
spot.shadow.normalBias = 0.025;
spot.shadow.camera.near = 4;
spot.shadow.camera.far = 40;
spot.target.position.set(0, 2.8, 0);
scene.add(spot, spot.target);

const fill = new THREE.DirectionalLight(0x8fb4d8, 0.5);
fill.position.set(-7, 8, -9);
scene.add(fill);

const rimCyan = new THREE.PointLight(0x06b6d4, 55, 30, 2);
rimCyan.position.set(7, 3.5, -7);
scene.add(rimCyan);

const rimMagenta = new THREE.PointLight(0xd946ef, 45, 30, 2);
rimMagenta.position.set(-8.5, 5, -5.5);
scene.add(rimMagenta);

/* ================================================================
   GEOMETRY HELPERS
   ================================================================ */

// Low-poly spur gear: trapezoid teeth on an annulus, extruded flat.
function makeGearGeometry(pitchR, teeth, depth, holeR = 0, toothH = 0.13, rootD = 0.10) {
  const tipR = pitchR + toothH;
  const rootR = pitchR - rootD;
  const shape = new THREE.Shape();
  const step = TAU / teeth;
  shape.moveTo(rootR, 0);
  for (let i = 0; i < teeth; i++) {
    const a = i * step;
    if (i > 0) shape.lineTo(rootR * Math.cos(a), rootR * Math.sin(a));
    const a1 = a + 0.45 * step, a2 = a + 0.58 * step, a3 = a + 0.92 * step;
    shape.lineTo(rootR * Math.cos(a1), rootR * Math.sin(a1));
    shape.lineTo(tipR * Math.cos(a2), tipR * Math.sin(a2));
    shape.lineTo(tipR * Math.cos(a3), tipR * Math.sin(a3));
  }
  if (holeR > 0) {
    const hole = new THREE.Path();
    hole.absarc(0, 0, holeR, 0, TAU, true);
    shape.holes.push(hole);
  }
  const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments: 10 });
  geo.translate(0, 0, -depth / 2);
  return geo;
}

// Capsule-outline plate (derailleur cage side plate), long axis down -Y.
function makeCagePlateGeometry(len, rad, depth) {
  const s = new THREE.Shape();
  s.absarc(0, 0, rad, 0, Math.PI, false);
  s.lineTo(-rad, -len);
  s.absarc(0, -len, rad, Math.PI, TAU, false);
  s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: false, curveSegments: 5 });
  geo.translate(0, 0, -depth / 2);
  return geo;
}

// Cylinder pre-rotated so its axis runs along Z (axle orientation).
function zCylinder(rTop, rBottom, len, segs = 12) {
  const g = new THREE.CylinderGeometry(rTop, rBottom, len, segs);
  g.rotateX(Math.PI / 2);
  return g;
}

function mesh(geo, mat, x = 0, y = 0, z = 0, shadows = true) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  if (shadows) { m.castShadow = true; m.receiveShadow = true; }
  return m;
}

// Stretch a unit box between two world points (used for hanger linkage bars).
const _mid = new THREE.Vector3(), _dir = new THREE.Vector3();
function stretchBar(bar, ax, ay, az, bx, by, bz) {
  _mid.set((ax + bx) / 2, (ay + by) / 2, (az + bz) / 2);
  _dir.set(bx - ax, by - ay, bz - az);
  const len = _dir.length();
  bar.position.copy(_mid);
  bar.scale.set(bar.userData.thick, bar.userData.thick, len);
  bar.lookAt(bx, by, bz);
}

/* ================================================================
   BOOTH ENVIRONMENT — floor, glowing grid, pedestal, pylons
   ================================================================ */
{
  const floor = mesh(new THREE.PlaneGeometry(160, 160), MAT.floor, 0, 0, 0);
  floor.rotation.x = -Math.PI / 2;
  floor.castShadow = false;
  scene.add(floor);

  const grid = new THREE.GridHelper(160, 80, 0x22d3ee, 0x1d5f73);
  grid.position.y = 0.02;
  grid.material.transparent = true;
  grid.material.opacity = 0.6;
  grid.material.blending = THREE.AdditiveBlending;
  grid.material.depthWrite = false;
  scene.add(grid);

  // soft cyan light pool under the pedestal
  const cv = document.createElement('canvas');
  cv.width = cv.height = 256;
  const ctx = cv.getContext('2d');
  const grad = ctx.createRadialGradient(128, 128, 10, 128, 128, 128);
  grad.addColorStop(0, 'rgba(255,255,255,0.9)');
  grad.addColorStop(0.5, 'rgba(255,255,255,0.25)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 256, 256);
  const pool = new THREE.Mesh(
    new THREE.PlaneGeometry(26, 26),
    new THREE.MeshBasicMaterial({
      map: new THREE.CanvasTexture(cv), color: 0x0e7490, transparent: true, opacity: 0.55,
      blending: THREE.AdditiveBlending, depthWrite: false,
    })
  );
  pool.rotation.x = -Math.PI / 2;
  pool.position.y = 0.015;
  scene.add(pool);

  const pedestal = mesh(new THREE.CylinderGeometry(5.4, 5.75, 0.26, 48), MAT.pedestal, 0, 0.13, 0);
  scene.add(pedestal);

  const ring = new THREE.Mesh(new THREE.TorusGeometry(5.45, 0.05, 6, 96), MAT.ledCyan);
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.27;
  scene.add(ring);

  // two slim backdrop pylons for trade-show depth
  for (const [px, m] of [[-8.4, MAT.ledCyan], [8.4, MAT.ledMagenta]]) {
    const py = mesh(new THREE.BoxGeometry(0.24, 5.2, 0.24), MAT.aluDark, px, 2.6, -6.6);
    scene.add(py);
    const strip = new THREE.Mesh(new THREE.BoxGeometry(0.05, 4.6, 0.05), m);
    strip.position.set(px, 2.6, -6.45);
    scene.add(strip);
  }
}

/* ================================================================
   ACRYLIC DEMO STAND — base slab + two transparent towers
   ================================================================ */
const ledPulseMats = [MAT.ledCyan, MAT.ledMagenta];
{
  // dark aluminum chassis plate with a glass top sheet
  scene.add(mesh(new THREE.BoxGeometry(9.6, 0.16, 3.3), MAT.alu, 0, 0.34, -0.55));
  const sheet = mesh(new THREE.BoxGeometry(9.6, 0.05, 3.3), MAT.acrylic, 0, 0.445, -0.55);
  sheet.castShadow = false;
  scene.add(sheet);

  // LED strips along slab edges
  for (const zEdge of [-2.18, 1.08]) {
    scene.add(new THREE.Mesh(new THREE.BoxGeometry(9.6, 0.05, 0.06), MAT.ledCyan)
      .translateX(0).translateY(0.43).translateZ(zEdge));
  }

  // transparent towers (tapered, with a cut-out window), supports on the non-drive side
  function tower(cx, zCenter) {
    const s = new THREE.Shape();
    s.moveTo(cx - 0.66, 0.4); s.lineTo(cx + 0.66, 0.4);
    s.lineTo(cx + 0.26, CFG.axleY); s.lineTo(cx - 0.26, CFG.axleY);
    s.closePath();
    const hole = new THREE.Path();
    hole.moveTo(cx - 0.3, 0.95); hole.lineTo(cx - 0.09, 3.0);
    hole.lineTo(cx + 0.09, 3.0); hole.lineTo(cx + 0.3, 0.95);
    hole.closePath();
    s.holes.push(hole);
    const g = new THREE.ExtrudeGeometry(s, { depth: 0.24, bevelEnabled: false });
    g.translate(0, 0, zCenter - 0.12);
    const t = new THREE.Mesh(g, MAT.acrylic);
    t.castShadow = false;
    scene.add(t);

    // LED edge strips following the taper
    for (const side of [-1, 1]) {
      const strip = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), side === -1 ? MAT.ledCyan : MAT.ledMagenta);
      strip.userData.thick = 0.045;
      stretchBar(strip,
        cx + side * 0.62, 0.44, zCenter + 0.13,
        cx + side * 0.24, CFG.axleY - 0.06, zCenter + 0.13);
      scene.add(strip);
    }
    // clamp collar where the axle passes through
    scene.add(mesh(zCylinder(0.45, 0.45, 0.3, 10), MAT.alu, cx, CFG.axleY, zCenter));
  }
  tower(CFG.frontX, -0.50);
  tower(CFG.rearX, -1.45);
}

/* ================================================================
   FRONT DRIVETRAIN — crankset, spider, chainring, pedals
   ================================================================ */
const crankGroup = new THREE.Group();
crankGroup.position.set(CFG.frontX, CFG.axleY, 0);
scene.add(crankGroup);

// static bottom-bracket shell
scene.add(mesh(zCylinder(0.30, 0.30, 1.5, 12), MAT.aluDark, CFG.frontX, CFG.axleY, 0));

{
  // spindle
  crankGroup.add(mesh(zCylinder(0.13, 0.13, 2.05, 8), MAT.chromeDim));

  // chainring (chrome, toothed) + inner reinforcement ring
  crankGroup.add(mesh(makeGearGeometry(RING_R, CFG.ringTeeth, 0.12, RING_R - 0.36), MAT.chrome, 0, 0, CFG.ringZ));
  crankGroup.add(mesh(zCylinder(0.5, 0.5, 0.3, 10), MAT.alu));

  // 5-arm spider (reaches into the ring annulus)
  for (let i = 0; i < 5; i++) {
    const arm = mesh(new THREE.BoxGeometry(0.17, 1.8, 0.09), MAT.alu, 0, 0, CFG.ringZ);
    arm.rotation.z = i * TAU / 5;
    arm.translateY(1.02);
    crankGroup.add(arm);
  }

  // crank arms + pedals (pedals counter-rotate to stay level)
  const armShape = new THREE.Shape();
  armShape.moveTo(-0.18, -0.30); armShape.lineTo(0.18, -0.30);
  armShape.lineTo(0.13, CFG.crankLen); armShape.lineTo(-0.13, CFG.crankLen);
  armShape.closePath();
  const armGeo = new THREE.ExtrudeGeometry(armShape, { depth: 0.15, bevelEnabled: false });
  armGeo.translate(0, 0, -0.075);

  window.pedals = [];
  for (const [phase, zSide] of [[0, 1], [Math.PI, -1]]) {
    const armPivot = new THREE.Group();
    armPivot.rotation.z = phase;
    crankGroup.add(armPivot);

    armPivot.add(mesh(zCylinder(0.28, 0.28, 0.16, 8), MAT.alu, 0, 0, zSide * CFG.crankZ));
    armPivot.add(mesh(armGeo, MAT.alu, 0, 0, zSide * CFG.crankZ));

    const pedal = new THREE.Group();
    pedal.position.set(0, CFG.crankLen - 0.08, zSide * CFG.crankZ);
    pedal.userData.phase = phase;
    armPivot.add(pedal);
    pedal.add(mesh(zCylinder(0.055, 0.055, 0.34, 6), MAT.chromeDim, 0, 0, zSide * 0.2));
    pedal.add(mesh(new THREE.BoxGeometry(0.34, 0.1, 0.46), MAT.gunmetal, 0, 0, zSide * 0.44));
    pedal.add(new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.03, 0.48), MAT.ledCyan).translateZ(zSide * 0.44).translateY(0.055));
    pedals.push(pedal);
  }
}

/* ================================================================
   REAR DRIVETRAIN — hub + tapered cassette
   ================================================================ */
const cassetteGroup = new THREE.Group();
cassetteGroup.position.set(CFG.rearX, CFG.axleY, 0);
scene.add(cassetteGroup);

// static axle reaching into the rear tower
scene.add(mesh(zCylinder(0.08, 0.08, 2.95, 8), MAT.chromeDim, CFG.rearX, CFG.axleY, -0.2));

{
  cassetteGroup.add(mesh(zCylinder(0.22, 0.22, 2.4, 10), MAT.alu, 0, 0, -0.1));      // hub body
  cassetteGroup.add(mesh(zCylinder(0.30, 0.30, 1.95, 10), MAT.aluDark, 0, 0, 0));    // freehub core
  cassetteGroup.add(mesh(zCylinder(0.48, 0.52, 0.1, 12), MAT.alu, 0, 0, -1.25));     // flange
  cassetteGroup.add(mesh(zCylinder(0.4, 0.42, 0.12, 10), MAT.alu, 0, 0, 1.0));       // lockring

  for (let i = 0; i < N_GEARS; i++) {
    const z = CFG.cogZ0 + i * CFG.cogDZ;
    const cog = mesh(makeGearGeometry(COG_R[i], CFG.cogTeeth[i], 0.11, 0.34), MAT.chrome, 0, 0, z);
    cog.rotation.z = i * 0.23;      // stagger teeth so the stack reads as separate cogs
    cassetteGroup.add(cog);
  }
}

/* ================================================================
   REAR DERAILLEUR — hanger linkage, knuckle, cage, two pulleys
   ================================================================ */
const derailleur = new THREE.Group();
scene.add(derailleur);

const cage = new THREE.Group();
derailleur.add(cage);

let guidePulley, tensionPulley, knuckle, hangerBarA, hangerBarB, hangerBase;
{
  const pulleyGeo = makeGearGeometry(CFG.pulleyR, 8, 0.12, 0.09, 0.14, 0.08);

  guidePulley = mesh(pulleyGeo, MAT.chrome);
  derailleur.add(guidePulley);

  tensionPulley = mesh(pulleyGeo, MAT.chrome, 0, -CFG.cageL, 0);
  cage.add(tensionPulley);

  const plateGeo = makeCagePlateGeometry(CFG.cageL, 0.33, 0.05);
  for (const zs of [-0.17, 0.17]) cage.add(mesh(plateGeo, MAT.gunmetal, 0, 0, zs));
  cage.add(mesh(zCylinder(0.07, 0.07, 0.36, 6), MAT.aluDark));                        // pulley axles
  cage.add(mesh(zCylinder(0.07, 0.07, 0.36, 6), MAT.aluDark, 0, -CFG.cageL, 0));
  cage.add(mesh(new THREE.BoxGeometry(0.1, CFG.cageL * 0.62, 0.38), MAT.aluDark, -0.28, -CFG.cageL / 2, 0));
  cage.add(new THREE.Mesh(new THREE.BoxGeometry(0.04, CFG.cageL * 0.5, 0.40), MAT.ledMagenta).translateX(-0.31).translateY(-CFG.cageL / 2));

  knuckle = mesh(new THREE.BoxGeometry(0.26, 0.4, 0.24), MAT.aluDark);
  scene.add(knuckle);

  hangerBase = mesh(new THREE.BoxGeometry(0.24, 0.5, 0.22), MAT.aluDark, CFG.rearX - 0.28, CFG.axleY - 0.35, 1.05);
  hangerBase.rotation.z = -0.5;
  scene.add(hangerBase);

  for (const bar of [hangerBarA = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), MAT.alu),
                     hangerBarB = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), MAT.alu)]) {
    bar.userData.thick = 0.09;
    bar.castShadow = true;
    scene.add(bar);
  }
}

/* ================================================================
   CHAIN — belt path around 4 circles, rendered as instanced links
   ================================================================

   Circles in chain-travel order (drive-side view, +x = front):
     F chainring (CW) -> T tension pulley (CW) -> G guide pulley (CCW)
     -> C cassette cog (CW) -> back to F.
   CW/CCW windings give the classic derailleur S-bend automatically. */

// Tangent line between two circles respecting wrap direction (w = +1 CCW, -1 CW).
function beltTangent(c1, c2) {
  const dx = c2.x - c1.x, dy = c2.y - c1.y;
  const d = Math.hypot(dx, dy);
  const theta = Math.atan2(dy, dx);
  const rr = (c1.w === c2.w) ? (c1.r - c2.r) : (c1.r + c2.r);
  const phi = Math.acos(clamp(rr / d, -1, 1));
  const a1 = theta - c1.w * phi;
  const a2 = (c1.w === c2.w) ? a1 : a1 + Math.PI;
  return {
    p1x: c1.x + c1.r * Math.cos(a1), p1y: c1.y + c1.r * Math.sin(a1), a1,
    p2x: c2.x + c2.r * Math.cos(a2), p2y: c2.y + c2.r * Math.sin(a2), a2,
  };
}

// Circle set for a (possibly fractional) gear value and cage angle.
function makeCircles(g, phiCage) {
  const gi = g - 1;
  const Rc = lerp(COG_R[Math.floor(gi)], COG_R[Math.min(Math.ceil(gi), N_GEARS - 1)], gi % 1);
  const zc = CFG.cogZ0 + gi * CFG.cogDZ;
  const F = { x: CFG.frontX, y: CFG.axleY, r: RING_R, w: -1, z: CFG.ringZ };
  const C = { x: CFG.rearX, y: CFG.axleY, r: Rc, w: -1, z: zc };
  const G = { x: CFG.rearX + CFG.guideDX, y: CFG.axleY - Rc - CFG.pulleyR - CFG.guideGap, r: CFG.pulleyR, w: 1, z: zc };
  const T = { x: G.x + CFG.cageL * Math.sin(phiCage), y: G.y - CFG.cageL * Math.cos(phiCage), r: CFG.pulleyR, w: -1, z: zc };
  return { order: [F, T, G, C], Rc, zc, G, T };
}

// Tangent segments + wrap arcs for one full loop.
function assembleLoop(order) {
  const tans = order.map((c, i) => beltTangent(c, order[(i + 1) % 4]));
  const segs = [];
  let total = 0;
  for (let i = 0; i < 4; i++) {
    const c2 = order[(i + 1) % 4];
    const t = tans[i];
    const dx = t.p2x - t.p1x, dy = t.p2y - t.p1y;
    const len = Math.hypot(dx, dy);
    segs.push({ arc: false, x: t.p1x, y: t.p1y, ux: dx / len, uy: dy / len, len, z1: order[i].z, z2: c2.z, s0: total });
    total += len;

    const aIn = t.a2, aOut = tans[(i + 1) % 4].a1;
    let dA = c2.w > 0 ? aOut - aIn : aIn - aOut;
    dA = ((dA % TAU) + TAU) % TAU;
    const alen = dA * c2.r;
    segs.push({ arc: true, cx: c2.x, cy: c2.y, r: c2.r, aIn, w: c2.w, len: alen, z1: c2.z, z2: c2.z, s0: total });
    total += alen;
  }
  return { segs, total };
}

// The chain has a fixed physical length; the tension cage rotates to absorb the
// difference between cogs. Path length shrinks monotonically as the cage swings
// forward, so a short bisection finds the exact cage angle per frame.
const CHAIN_LEN = assembleLoop(makeCircles(4, 0).order).total;
const lenAt = (g, phi) => assembleLoop(makeCircles(g, phi).order).total;

function buildChainPath(g) {
  let lo = CFG.cagePhiMin, hi = CFG.cagePhiMax, phi;
  if (lenAt(g, lo) <= CHAIN_LEN) phi = lo;
  else if (lenAt(g, hi) >= CHAIN_LEN) phi = hi;
  else {
    for (let i = 0; i < 14; i++) {
      phi = (lo + hi) / 2;
      if (lenAt(g, phi) > CHAIN_LEN) lo = phi; else hi = phi;
    }
  }
  const c = makeCircles(g, phi);
  const loop = assembleLoop(c.order);
  return { segs: loop.segs, total: loop.total, Rc: c.Rc, zc: c.zc, phiCage: phi, G: c.G, T: c.T };
}

// Sample position + tangent at arc-length s along the loop.
function samplePath(path, s, out) {
  s = ((s % path.total) + path.total) % path.total;
  const segs = path.segs;
  let seg = segs[segs.length - 1];
  for (let i = 0; i < segs.length; i++) {
    if (s < segs[i].s0 + segs[i].len) { seg = segs[i]; break; }
  }
  const u = s - seg.s0;
  if (seg.arc) {
    const a = seg.aIn + seg.w * (u / seg.r);
    out.px = seg.cx + seg.r * Math.cos(a);
    out.py = seg.cy + seg.r * Math.sin(a);
    out.pz = seg.z1;
    out.tx = seg.w * -Math.sin(a);
    out.ty = seg.w * Math.cos(a);
    out.tz = 0;
  } else {
    out.px = seg.x + seg.ux * u;
    out.py = seg.y + seg.uy * u;
    const f = u / seg.len;
    out.pz = seg.z1 + (seg.z2 - seg.z1) * f;
    out.tx = seg.ux;
    out.ty = seg.uy;
    out.tz = (seg.z2 - seg.z1) / seg.len;
  }
}

// Two alternating instanced link styles: wide outer plates / slim inner rollers.
const MAX_LINKS = 128;
const outerLinks = new THREE.InstancedMesh(new THREE.BoxGeometry(0.28, 0.24, 0.22), MAT.chrome, MAX_LINKS);
const innerLinks = new THREE.InstancedMesh(new THREE.BoxGeometry(0.36, 0.16, 0.12), MAT.chromeDim, MAX_LINKS);
for (const im of [outerLinks, innerLinks]) {
  im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  im.castShadow = true;
  scene.add(im);
}

const _s = {};
const _obj = new THREE.Object3D();
const _xA = new THREE.Vector3(), _yA = new THREE.Vector3(), _zA = new THREE.Vector3();
const _m = new THREE.Matrix4();
const Z_UP = new THREE.Vector3(0, 0, 1);
let linkCount = 0;   // fixed after first build so the chain never "pops"

function updateChain(path, offset) {
  if (!linkCount) linkCount = 2 * Math.round(path.total / (CFG.pitch * 2));
  const pitchEff = path.total / linkCount;
  let nOut = 0, nIn = 0;
  for (let i = 0; i < linkCount; i++) {
    samplePath(path, offset + i * pitchEff, _s);
    _xA.set(_s.tx, _s.ty, _s.tz).normalize();
    _yA.copy(Z_UP).cross(_xA).normalize();
    _zA.copy(_xA).cross(_yA);
    _m.makeBasis(_xA, _yA, _zA);
    _obj.position.set(_s.px, _s.py, _s.pz);
    _obj.quaternion.setFromRotationMatrix(_m);
    _obj.updateMatrix();
    if (i % 2 === 0) outerLinks.setMatrixAt(nOut++, _obj.matrix);
    else innerLinks.setMatrixAt(nIn++, _obj.matrix);
  }
  outerLinks.count = nOut;
  innerLinks.count = nIn;
  outerLinks.instanceMatrix.needsUpdate = true;
  innerLinks.instanceMatrix.needsUpdate = true;
}

/* ================================================================
   STATE + ANIMATION
   ================================================================ */
const state = {
  gear: clamp(parseInt(params.get('gear')) || 3, 1, N_GEARS),
  gearFloat: 0,
  motorOn: params.get('motor') !== '0',
  crankSpeed: 0,
  crankAngle: 0,
  chainOffset: 0,
  casAngle: 0,
  gAngle: 0,
  tAngle: 0,
};
state.gearFloat = state.gear;

function applyDerailleur(path) {
  derailleur.position.set(path.G.x, path.G.y, path.zc);
  cage.rotation.z = path.phiCage;
  guidePulley.rotation.z = state.gAngle;
  tensionPulley.rotation.z = state.tAngle;

  // hanger linkage: fixed base near the axle -> knuckle riding above the cage
  const kx = path.G.x - 0.1, ky = path.G.y + 0.42, kz = path.zc + 0.28;
  knuckle.position.set(kx, ky, kz);
  stretchBar(hangerBarA, CFG.rearX - 0.32, CFG.axleY - 0.42, 1.05, kx, ky + 0.09, kz);
  stretchBar(hangerBarB, CFG.rearX - 0.24, CFG.axleY - 0.58, 1.05, kx, ky - 0.09, kz);
}

const clock = new THREE.Clock();
let elapsed = 0;

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  // motor spin-up / coast-down
  const targetSpeed = state.motorOn ? CFG.crankRPM : 0;
  state.crankSpeed += (targetSpeed - state.crankSpeed) * Math.min(1, dt * 2.2);
  if (Math.abs(state.crankSpeed) < 0.001 && !state.motorOn) state.crankSpeed = 0;

  // smooth gear interpolation
  state.gearFloat += (state.gear - state.gearFloat) * Math.min(1, dt * 6);
  if (Math.abs(state.gear - state.gearFloat) < 0.0005) state.gearFloat = state.gear;

  const path = buildChainPath(state.gearFloat);
  const chainSpeed = state.crankSpeed * RING_R;

  // rotations: crank/chainring CW, cassette driven through the chain,
  // pulleys spun by chain contact (guide CCW, tension CW)
  state.crankAngle -= state.crankSpeed * dt;
  state.chainOffset += chainSpeed * dt;
  state.casAngle -= (chainSpeed / path.Rc) * dt;
  state.gAngle += (chainSpeed / CFG.pulleyR) * dt;
  state.tAngle -= (chainSpeed / CFG.pulleyR) * dt;

  crankGroup.rotation.z = state.crankAngle;
  cassetteGroup.rotation.z = state.casAngle;
  for (const p of pedals) p.rotation.z = -(state.crankAngle + p.userData.phase);

  applyDerailleur(path);
  updateChain(path, state.chainOffset);

  // LED breathing
  const pulse = 1.8 + Math.sin(elapsed * 2.4) * 0.5;
  MAT.ledCyan.emissiveIntensity = pulse;
  MAT.ledMagenta.emissiveIntensity = pulse * 0.8;

  hud.rpm.textContent = Math.round(Math.abs(state.crankSpeed) * 9.549);

  controls.update();
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(tick);

/* ================================================================
   HUD WIRING
   ================================================================ */
const hud = {
  gearNum: document.getElementById('gearNum'),
  ticks: document.getElementById('ticks'),
  cog: document.getElementById('statCog'),
  ratio: document.getElementById('statRatio'),
  rpm: document.getElementById('statRpm'),
  motor: document.getElementById('btnMotor'),
  up: document.getElementById('btnUp'),
  down: document.getElementById('btnDown'),
  dot: document.getElementById('statusDot'),
};

for (let i = 0; i < N_GEARS; i++) hud.ticks.appendChild(document.createElement('i'));

function refreshHUD() {
  hud.gearNum.innerHTML = `${state.gear} <span>/ ${N_GEARS}</span>`;
  hud.cog.textContent = CFG.cogTeeth[state.gear - 1] + 'T';
  hud.ratio.textContent = (CFG.ringTeeth / CFG.cogTeeth[state.gear - 1]).toFixed(2);
  [...hud.ticks.children].forEach((el, i) => el.classList.toggle('on', i < state.gear));
  hud.up.disabled = state.gear >= N_GEARS;
  hud.down.disabled = state.gear <= 1;
  hud.motor.innerHTML = state.motorOn ? '&#10074;&#10074; &nbsp;暂停电机' : '&#9654; &nbsp;启动电机';
  hud.dot.classList.toggle('off', !state.motorOn);
}

function shift(delta) {
  const g = clamp(state.gear + delta, 1, N_GEARS);
  if (g === state.gear) return;
  state.gear = g;
  refreshHUD();
}

function toggleMotor() {
  state.motorOn = !state.motorOn;
  refreshHUD();
}

hud.up.addEventListener('click', e => { shift(1); e.currentTarget.blur(); });
hud.down.addEventListener('click', e => { shift(-1); e.currentTarget.blur(); });
hud.motor.addEventListener('click', e => { toggleMotor(); e.currentTarget.blur(); });

addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggleMotor(); }
  else if (e.code === 'ArrowUp' || e.code === 'ArrowRight') { e.preventDefault(); shift(1); }
  else if (e.code === 'ArrowDown' || e.code === 'ArrowLeft') { e.preventDefault(); shift(-1); }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

refreshHUD();
</script>
</body>
