<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Custom Bicycle Builder &amp; Assembly Simulator</title>
<style>
  :root {
    --bg: #15171c;
    --panel: #1e2128;
    --panel2: #262a33;
    --line: #333945;
    --text: #e8eaf0;
    --muted: #9aa3b2;
    --accent: #ffb454;
    --accent2: #5ac8fa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #app { position: fixed; inset: 0; }
  #sceneWrap { position: absolute; inset: 0; }
  #sceneWrap canvas { display: block; width: 100%; height: 100%; }
  #labelCanvas { position: absolute; inset: 0; pointer-events: none; }

  #hud { position: absolute; inset: 0; pointer-events: none; }
  #hud > * { pointer-events: auto; }

  #topbar {
    position: absolute; top: 0; left: 0; right: 0; height: 46px;
    display: flex; align-items: center; gap: 10px; padding: 0 12px;
    background: linear-gradient(180deg, rgba(21,23,28,.96), rgba(21,23,28,.82));
    border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); z-index: 5;
  }
  #topbar .title { font-weight: 700; letter-spacing: .3px; font-size: 14px; }
  #topbar .sub { color: var(--muted); font-size: 12px; }
  #topbar .spacer { flex: 1; }
  .btn {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 11px; font-size: 12px; cursor: pointer; transition: .15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: #20150a; border-color: var(--accent); font-weight: 700; }
  .btn.primary:hover { background: #ffc87a; color: #20150a; }

  #left {
    position: absolute; top: 54px; left: 10px; bottom: 10px; width: 292px;
    overflow-y: auto; padding-right: 4px; z-index: 4;
  }
  #left::-webkit-scrollbar { width: 8px; }
  #left::-webkit-scrollbar-thumb { background: #333945; border-radius: 4px; }

  .group {
    background: rgba(30,33,40,.92); border: 1px solid var(--line); border-radius: 10px;
    margin-bottom: 8px; overflow: hidden; backdrop-filter: blur(6px);
  }
  .group > .head {
    display: flex; align-items: center; gap: 8px; padding: 9px 11px; cursor: pointer; user-select: none;
    font-weight: 700; font-size: 12.5px; letter-spacing: .4px; text-transform: uppercase; color: #cdd4e0;
  }
  .group > .head .arrow { transition: transform .18s; color: var(--muted); font-size: 10px; }
  .group.collapsed > .head .arrow { transform: rotate(-90deg); }
  .group.collapsed > .body { display: none; }
  .group > .body { padding: 2px 11px 11px; }

  .ctl { margin: 8px 0; }
  .ctl .lbl { display: flex; justify-content: space-between; font-size: 11.5px; color: #b6bfcd; margin-bottom: 4px; }
  .ctl .lbl b { color: var(--text); font-weight: 600; }
  .ctl .lbl .val { color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 18px; cursor: pointer; }
  select { width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 7px; font-size: 12px; }
  .row2 { display: flex; gap: 8px; }
  .row2 > * { flex: 1; }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .sw { flex: 1; min-width: 62px; text-align: center; font-size: 10.5px; color: var(--muted); }
  .sw input[type=color] { width: 100%; height: 30px; border: 1px solid var(--line); border-radius: 6px; background: none; padding: 1px; cursor: pointer; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { flex: 1; background: var(--panel2); color: var(--muted); border: none; padding: 6px 2px; font-size: 11px; cursor: pointer; }
  .seg button.on { background: var(--accent); color: #20150a; font-weight: 700; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #c3cbd8; margin: 7px 0; cursor: pointer; }
  .check input { accent-color: var(--accent); }

  #specPanel {
    position: absolute; top: 54px; right: 10px; width: 258px; max-height: calc(100% - 66px);
    overflow-y: auto; z-index: 4; background: rgba(30,33,40,.92); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px; backdrop-filter: blur(6px);
  }
  #specPanel h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .4px; text-transform: uppercase; color: #cdd4e0; }
  .spec-grid { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 11.5px; }
  .spec-grid .k { color: var(--muted); }
  .spec-grid .v { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }
  .spec-grid .v.hl { color: var(--accent); }
  .spec-sep { grid-column: 1 / -1; border-top: 1px solid var(--line); margin: 5px 0; }
  #weightBig { font-size: 26px; font-weight: 800; color: var(--accent); }
  #weightSub { color: var(--muted); font-size: 11px; }

  #hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--muted);
    background: rgba(21,23,28,.7); padding: 5px 12px; border-radius: 20px; border: 1px solid var(--line); pointer-events: none; z-index: 3; }

  @media (max-width: 980px) {
    #left { width: 250px; }
    #specPanel { width: 220px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="sceneWrap"></div>
  <canvas id="labelCanvas"></canvas>
  <div id="hud">
    <div id="topbar">
      <span class="title">🚲 Bicycle Studio</span><span class="sub">Parameterized builder &amp; assembly simulator</span>
      <span class="spacer"></span>
      <button class="btn" id="btnPresetFront">Front</button>
      <button class="btn" id="btnPresetSide">Side</button>
      <button class="btn" id="btnPreset3q">3/4</button>
      <button class="btn" id="btnPresetTop">Top</button>
      <button class="btn" id="btnPresetDrive">Drivetrain</button>
      <button class="btn" id="btnDisassemble">Disassemble</button>
      <button class="btn" id="btnAssemble">Assemble</button>
      <button class="btn primary" id="btnReset">Reset</button>
    </div>
    <div id="left"></div>
    <div id="specPanel">
      <h3>Specifications</h3>
      <div id="weightBig">--</div>
      <div id="weightSub">estimated weight</div>
      <div style="height:8px"></div>
      <div class="spec-grid" id="specGrid"></div>
    </div>
    <div id="hint">Drag to orbit · Scroll to zoom · Right-drag to pan · Adjust sliders to re-fit geometry live</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

THREE.ColorManagement.enabled = false;

const DEG = Math.PI / 180;
const PITCH = 0.0127;
const WHEEL_R = 0.340;
const RIM_R = 0.322;
const BB_DROP = 0.070;
const RAKE = 0.045;
const SPROCKET_SPACING = 0.0037;

const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

const DEFAULTS = {
  stack: 0.550, reach: 0.385, headAngle: 72.5, seatTubeLength: 0.560,
  seatAngle: 73.5, chainstay: 0.410, compactness: 0.35, seatstayStyle: 'traditional',
  chainrings: 2, cassette: 11,
  saddleForeAft: 0.0, seatpostHeight: 0.08, barWidth: 0.42, barRise: 0.02, barFlare: 6,
  frameColor: '#e63946', forkColor: '#e63946', rimColor: '#2b2f36',
  driveColor: '#3a3f47', cockpitColor: '#26292f', finish: 'gloss',
  celLevels: 3, outline: true, pixelation: 0, posterize: 0, labels: false,
  assembly: 0
};
const state = JSON.parse(JSON.stringify(DEFAULTS));

const groupColors = {
  frame: () => state.frameColor,
  fork: () => state.forkColor,
  rim: () => state.rimColor,
  drive: () => state.driveColor,
  cockpit: () => state.cockpitColor,
  env: () => '#b8b2a8'
};

const FINISH_ORDER = ['gloss', 'matte', 'metallic', 'carbon'];
const FINISHES = {
  gloss:    { spec: 0.60, rim: 0.18, shininess: 70 },
  matte:    { spec: 0.04, rim: 0.08, shininess: 6 },
  metallic: { spec: 0.95, rim: 0.48, shininess: 110 },
  carbon:   { spec: 0.34, rim: 0.30, shininess: 46 }
};

const VSH = `
  varying vec3 vNormalV;
  varying vec3 vViewDir;
  varying vec3 vWorldPos;
  varying vec2 vUv;
  void main() {
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    vNormalV = normalize(normalMatrix * normal);
    vViewDir = normalize(-mv.xyz);
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vWorldPos = wp.xyz;
    vUv = uv;
    gl_Position = projectionMatrix * mv;
  }
`;

const FSH = `
  precision highp float;
  uniform vec3 uColor;
  uniform float uLevels;
  uniform float uSpec;
  uniform float uRim;
  uniform float uShininess;
  uniform float uFinish;
  uniform float uPosterize;
  uniform vec3 uLightDir;
  uniform vec3 uKeyColor;
  uniform vec3 uRimColor;
  varying vec3 vNormalV;
  varying vec3 vViewDir;
  varying vec3 vWorldPos;
  varying vec2 vUv;

  float banded(float v, float n) {
    if (n < 1.5) return v;
    return floor(v * n + 0.5) / max(n - 1.0, 1.0);
  }

  void main() {
    vec3 N = normalize(vNormalV);
    vec3 V = normalize(vViewDir);
    vec3 L = normalize(uLightDir);
    float ndl = max(dot(N, L), 0.0);
    float dif = banded(ndl, uLevels);

    vec3 H = normalize(L + V);
    float sp = banded(pow(max(dot(N, H), 0.0), uShininess), 2.0) * uSpec;
    float fr = banded(pow(1.0 - max(dot(N, V), 0.0), 3.0), 2.0) * uRim;

    vec3 base = uColor;
    if (uFinish > 2.5) {
      float a = sin(vWorldPos.y * 260.0 + vWorldPos.z * 40.0);
      float b = sin(vWorldPos.z * 260.0 - vWorldPos.y * 40.0);
      float weave = step(0.0, a * b);
      vec3 dark = vec3(0.055, 0.058, 0.066);
      vec3 lite = vec3(0.17, 0.175, 0.19);
      base = mix(dark, lite, weave);
      base = mix(base, uColor, 0.10);
    }

    float ambient = 0.46;
    vec3 col = base * (ambient + (1.0 - ambient) * dif);
    col += uKeyColor * sp;
    col += uRimColor * fr;
    if (uFinish > 1.5 && uFinish < 2.5) {
      col += uColor * fr * 0.40;
    }

    if (uPosterize > 0.01) {
      float n = mix(64.0, 6.0, uPosterize);
      col = floor(col * n + 0.5) / n;
    }
    gl_FragColor = vec4(col, 1.0);
  }
`;

let outlineMat = null;
const bikeToon = [];
const envToon = [];
const matGroups = { frame: [], fork: [], rim: [], drive: [], cockpit: [] };

function finishIndex() { return FINISH_ORDER.indexOf(state.finish); }

function makeToon(color, group, persist) {
  const f = FINISHES[state.finish] || FINISHES.gloss;
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color(color) },
      uLevels: { value: state.celLevels },
      uSpec: { value: f.spec },
      uRim: { value: f.rim },
      uShininess: { value: f.shininess },
      uFinish: { value: finishIndex() },
      uPosterize: { value: state.posterize },
      uLightDir: { value: V3(0.5, 0.72, 0.45).normalize() },
      uKeyColor: { value: new THREE.Color(1, 1, 1) },
      uRimColor: { value: new THREE.Color(0.72, 0.86, 1.0) }
    },
    vertexShader: VSH,
    fragmentShader: FSH,
    side: THREE.FrontSide
  });
  if (persist) envToon.push(mat);
  else {
    bikeToon.push(mat);
    if (group && matGroups[group]) matGroups[group].push(mat);
  }
  return mat;
}
function eachToon(fn) { bikeToon.forEach(fn); envToon.forEach(fn); }
function m(group) { return makeToon(groupColors[group](), group, false); }

function setGroupColor(group, hex) {
  (matGroups[group] || []).forEach(mm => mm.uniforms.uColor.value.set(hex));
}
function applyFinish() {
  const f = FINISHES[state.finish] || FINISHES.gloss;
  const fi = finishIndex();
  bikeToon.forEach(mm => {
    mm.uniforms.uSpec.value = f.spec;
    mm.uniforms.uRim.value = f.rim;
    mm.uniforms.uShininess.value = f.shininess;
    mm.uniforms.uFinish.value = fi;
  });
}
function applyLevels() { eachToon(mm => mm.uniforms.uLevels.value = state.celLevels); }
function applyPosterize() { eachToon(mm => mm.uniforms.uPosterize.value = state.posterize); }

function tube(p1, p2, r1, r2, mat, seg, doOutline) {
  const dir = p2.clone().sub(p1);
  const len = dir.length();
  if (len < 1e-6) return new THREE.Group();
  seg = seg || 10;
  const geo = new THREE.CylinderGeometry(r2, r1, len, seg, 1, false);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(p1).addScaledVector(dir, 0.5);
  mesh.quaternion.setFromUnitVectors(V3(0, 1, 0), dir.clone().normalize());
  if (doOutline !== false) addOutline(mesh);
  return mesh;
}

function addOutline(mesh) {
  if (!outlineMat) return;
  const o = new THREE.Mesh(mesh.geometry, outlineMat);
  o.scale.setScalar(1.07);
  o.renderOrder = -1;
  mesh.add(o);
}

function cylinderX(center, radius, length, mat, doOutline) {
  const geo = new THREE.CylinderGeometry(radius, radius, length, 14, 1, false);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.z = Math.PI / 2;
  mesh.position.copy(center);
  if (doOutline !== false) addOutline(mesh);
  return mesh;
}

function disc(center, radius, thickness, mat, seg) {
  const geo = new THREE.CylinderGeometry(radius, radius, thickness, seg || 24, 1, false);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.z = Math.PI / 2;
  mesh.position.copy(center);
  return mesh;
}

function boxAt(center, sx, sy, sz, mat, doOutline) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat);
  mesh.position.copy(center);
  if (doOutline) addOutline(mesh);
  return mesh;
}

function ring(center, radius, tubeR, mat, seg) {
  const geo = new THREE.TorusGeometry(radius, tubeR, (seg || 12), 40);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.y = Math.PI / 2;
  mesh.position.copy(center);
  return mesh;
}

function lat(p, x) { return V3(p.x + x, p.y, p.z); }

function computeFrame(p) {
  const R = WHEEL_R, drop = BB_DROP, rake = RAKE;
  const axleY = R;
  const bb = V3(0, axleY - drop, p.chainstay);
  const hTop = V3(0, bb.y + p.stack, bb.z + p.reach);
  const hta = p.headAngle * DEG;
  const sta = p.seatAngle * DEG;

  const dSteer = V3(0, -Math.sin(hta), Math.cos(hta));
  const upSteer = V3(0, Math.sin(hta), -Math.cos(hta));
  const headLen = lerp(0.19, 0.10, p.compactness);
  const hBot = hTop.clone().addScaledVector(dSteer, headLen);

  const dSeat = V3(0, Math.sin(sta), -Math.cos(sta));
  const seatTop = bb.clone().addScaledVector(dSeat, p.seatTubeLength);

  const extension = 0.03 + p.compactness * 0.05;
  const clusterLen = Math.max(0.15, p.seatTubeLength - extension);
  const seatCluster = bb.clone().addScaledVector(dSeat, clusterLen);

  const stayLen = (p.seatstayStyle === 'dropped') ? Math.max(0.12, clusterLen - 0.07) : clusterLen;
  const seatstayTop = bb.clone().addScaledVector(dSeat, stayLen);

  const sAxle = (axleY - hTop.y) / dSteer.y;
  const steerAtAxle = hTop.clone().addScaledVector(dSteer, sAxle);
  const frontAxle = V3(0, axleY, steerAtAxle.z + rake);
  const rearAxle = V3(0, axleY, 0);

  const sGround = (0 - hTop.y) / dSteer.y;
  const steerAtGround = hTop.clone().addScaledVector(dSteer, sGround);
  const trail = steerAtGround.z - frontAxle.z;
  const wheelbase = frontAxle.z - rearAxle.z;
  const topTubeLen = hTop.distanceTo(seatCluster);
  const steererTop = hTop.clone().addScaledVector(upSteer, 0.09);

  return { bb, hTop, hBot, dSteer, upSteer, dSeat, seatTop, seatCluster, seatstayTop,
    frontAxle, rearAxle, trail, wheelbase, topTubeLen, headLen, hta, sta, steererTop, steerAtAxle };
}

const parts = {};
let GEO = null;

function buildFrame() {
  const g = new THREE.Group();
  const mm = m('frame');
  g.add(tube(GEO.bb, GEO.hBot, 0.021, 0.016, mm));
  g.add(tube(GEO.hTop, GEO.seatCluster, 0.014, 0.012, mm));
  g.add(tube(GEO.bb, GEO.seatTop, 0.016, 0.013, mm));
  g.add(tube(GEO.hBot, GEO.hTop, 0.0185, 0.0185, mm));
  g.add(cylinderX(GEO.bb, 0.036, 0.075, mm));
  g.add(tube(lat(GEO.bb, 0.030), lat(GEO.rearAxle, 0.058), 0.012, 0.010, mm));
  g.add(tube(lat(GEO.bb, -0.030), lat(GEO.rearAxle, -0.058), 0.012, 0.010, mm));
  g.add(tube(lat(GEO.seatstayTop, 0.014), lat(GEO.rearAxle, 0.058), 0.010, 0.009, mm));
  g.add(tube(lat(GEO.seatstayTop, -0.014), lat(GEO.rearAxle, -0.058), 0.010, 0.009, mm));
  g.add(tube(lat(GEO.seatstayTop, 0.014), lat(GEO.seatstayTop, -0.014), 0.006, 0.006, mm, 8, false));
  g.add(boxAt(GEO.rearAxle, 0.012, 0.045, 0.012, mm, false));
  return g;
}

function buildFork() {
  const g = new THREE.Group();
  const mm = m('fork');
  g.add(tube(GEO.hBot, GEO.steererTop, 0.013, 0.013, mm));
  g.add(boxAt(GEO.hBot, 0.032, 0.03, 0.032, mm, false));
  g.add(tube(lat(GEO.hBot, 0.016), lat(GEO.frontAxle, 0.050), 0.013, 0.011, mm));
  g.add(tube(lat(GEO.hBot, -0.016), lat(GEO.frontAxle, -0.050), 0.013, 0.011, mm));
  g.add(boxAt(GEO.frontAxle, 0.010, 0.036, 0.010, mm, false));
  return g;
}

function buildHeadset() {
  const g = new THREE.Group();
  const mm = m('cockpit');
  g.add(ring(GEO.hTop, 0.021, 0.006, mm, 16));
  g.add(ring(GEO.hBot, 0.021, 0.006, mm, 16));
  return g;
}

function buildStem() {
  const g = new THREE.Group();
  const mm = m('cockpit');
  const top = GEO.steererTop.clone();
  const fwd = top.clone().add(V3(0, 0, 0.100));
  g.add(tube(top, fwd, 0.0135, 0.012, mm));
  g.add(tube(GEO.hTop, top, 0.014, 0.0135, mm, 10, false));
  g.add(boxAt(fwd, 0.02, 0.036, 0.028, mm, false));
  parts.barCenter = fwd.clone();
  return g;
}

function buildBars() {
  const g = new THREE.Group();
  const mm = m('cockpit');
  const tapeM = makeToon(groupColors.cockpit(), 'cockpit', false);
  const W = state.barWidth / 0.42;
  const rise = state.barRise;
  const flare = state.barFlare * DEG;

  const c = parts.barCenter || V3(0, 0, 0);
  const hood = V3(0.185 * W, 0.022, 0.055);
  const pts = [
    V3(0.03, 0.0, 0.0),
    V3(0.12 * W, 0.006, -0.015),
    V3(0.17 * W, 0.014, 0.028),
    hood.clone(),
    V3(0.185 * W, -0.05 - rise, 0.072),
    V3(0.20 * W, -0.135 - rise, 0.035),
    V3(0.19 * W, -0.125 - rise, -0.030)
  ];
  for (let i = 4; i < pts.length; i++) {
    const dx = pts[i].x - hood.x, dz = pts[i].z - hood.z;
    pts[i].x = hood.x + dx * Math.cos(flare) - dz * Math.sin(flare);
    pts[i].z = hood.z + dx * Math.sin(flare) + dz * Math.cos(flare);
  }
  const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.5);
  const tubeGeo = new THREE.TubeGeometry(curve, 44, 0.0095, 9, false);

  const right = new THREE.Mesh(tubeGeo, mm);
  const left = new THREE.Mesh(tubeGeo, mm);
  left.scale.x = -1;
  g.add(right); g.add(left);

  const tapePts = pts.slice(3);
  const tapeCurve = new THREE.CatmullRomCurve3(tapePts, false, 'catmullrom', 0.5);
  const tapeGeo = new THREE.TubeGeometry(tapeCurve, 22, 0.0115, 9, false);
  const tapeR = new THREE.Mesh(tapeGeo, tapeM);
  const tapeL = new THREE.Mesh(tapeGeo, tapeM);
  tapeL.scale.x = -1;
  g.add(tapeR); g.add(tapeL);

  for (const s of [1, -1]) {
    g.add(boxAt(V3(hood.x * s, hood.y, hood.z), 0.028, 0.032, 0.05, mm, false));
    g.add(tube(V3(hood.x * s, hood.y, hood.z + 0.02), V3(hood.x * s, hood.y - 0.07, hood.z + 0.05), 0.006, 0.004, mm, 8, false));
  }
  g.position.copy(c);
  return g;
}

function buildCables() {
  const g = new THREE.Group();
  const mm = makeToon('#181a1f', 'cockpit', false);

function buildCrankSet() {

  const bL = V3(-0.022, GEO.bb.y, GEO.bb.z);

  crankR.add(tube(bR, pR, 0.013, 0.011, mm));
  crankR.add(boxAt(bR, 0.05, 0.05, 0.05, mm, false));

function rotorMesh(mm) {
  const shape = new THREE.Shape();
  shape.absarc(0, 0, 0.068, 0, Math.PI * 2, false);
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    const hx = Math.cos(a) * 0.042, hy = Math.sin(a) * 0.042;
    const hole = new THREE.Path();
    hole.absarc(hx, hy, 0.011, 0, Math.PI * 2, true);
    shape.holes.push(hole);
  }
  const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.0035, bevelEnabled: false, steps: 1 });
  const mesh = new THREE.Mesh(geo, mm);
  mesh.rotation.y = Math.PI / 2;
  return mesh;
}

function buildWheel(side, isRear) {
  const g = new THREE.Group();
  const rimM = m('rim');

  const spokeM = makeToon('#c7ccd4', 'rim', false);
  const axle = isRear ? GEO.rearAxle : GEO.frontAxle;

  g.add(ring(axle, RIM_R, 0.009, rimM));
  g.add(ring(axle, WHEEL_R, 0.022, tireM));
  const hubLen = isRear ? 0.130 : 0.100;
  g.add(cylinderX(axle, 0.014, hubLen, hubM, false));
  g.add(cylinderX(lat(axle, isRear ? -0.045 : -0.038), 0.016, 0.012, hubM, false));
  g.add(cylinderX(lat(axle, isRear ? 0.045 : 0.038), 0.016, 0.012, hubM, false));

  g.add(tube(V3(axle.x, axle.y + RIM_R, axle.z), V3(axle.x, axle.y + RIM_R + 0.025, axle.z), 0.003, 0.003, hubM, 6, false));

  const N = 16;
  const geo = new THREE.CylinderGeometry(0.0012, 0.0012, 1, 5, 1, false);
  const inst = new THREE.InstancedMesh(geo, spokeM, N * 2);
  const dummy = new THREE.Object3D();
  let idx = 0;
  for (const s of [1, -1]) {
    const fx = s * (isRear ? 0.036 : 0.030);
    for (let i = 0; i < N; i++) {
      const th = (i / N) * Math.PI * 2;
      const thH = th + s * 0.55;
      const rimPt = V3(axle.x, axle.y + RIM_R * Math.cos(th), axle.z + RIM_R * Math.sin(th));
      const hubPt = V3(axle.x + fx, axle.y + 0.018 * Math.cos(thH), axle.z + 0.018 * Math.sin(thH));
      const d = hubPt.clone().sub(rimPt);
      dummy.position.copy(rimPt).addScaledVector(d, 0.5);
      dummy.quaternion.setFromUnitVectors(V3(0, 1, 0), d.clone().normalize());
      dummy.scale.set(1, d.length(), 1);
      dummy.updateMatrix();
      inst.setMatrixAt(idx++, dummy.matrix);
    }
  }
  inst.instanceMatrix.needsUpdate = true;
  g.add(inst);
  return g;
}

function buildCassette() {
  const g = new THREE.Group();
  const mm = m('drive');
  const teeth = cassetteTeeth();
  const xBase = 0.016;
  for (let i = 0; i < teeth.length; i++) {
    const r = teeth[i] * PITCH / (2 * Math.PI);
    const x = xBase + (teeth.length - 1 - i) * SPROCKET_SPACING;
    g.add(disc(V3(x, WHEEL_R, 0), r, 0.0018, mm, 22));
    g.add(disc(V3(x, WHEEL_R, 0), Math.max(0.012, r * 0.35), 0.004, mm, 14));
  }
  return g;
}

function externalTangents(C1, r1, C2, r2) {
  const dx = C2.z - C1.z, dy = C2.y - C1.y;
  const d = Math.hypot(dx, dy);
  const th = Math.atan2(dy, dx);
  const beta = Math.acos(clamp((r1 - r2) / d, -1, 1));
  const mk = (C, r, n) => ({ y: C.y + r * Math.sin(n), z: C.z + r * Math.cos(n) });
  const A = { t1: mk(C1, r1, th + beta), t2: mk(C2, r2, th + beta) };
  const B = { t1: mk(C1, r1, th - beta), t2: mk(C2, r2, th - beta) };
  const top = (A.t1.y + A.t2.y) > (B.t1.y + B.t2.y) ? A : B;
  const bot = top === A ? B : A;
  return { top, bot };
}
function angOf(C, P) { return Math.atan2(P.y - C.y, P.z - C.z); }
function arcSeg(C, r, a0, a1, through, n) {
  const norm = a => ((a % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  const A0 = norm(a0), A1 = norm(a1), TH = norm(through);
  const ccwTo = t => (t - A0 + 2 * Math.PI) % (2 * Math.PI);
  const dA1 = ccwTo(A1), dTH = ccwTo(TH);
  const ccw = dTH <= dA1 + 1e-6;
  const sweep = ccw ? dA1 : (2 * Math.PI - dA1);
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const a = A0 + (ccw ? 1 : -1) * sweep * (i / n);
    pts.push({ y: C.y + r * Math.sin(a), z: C.z + r * Math.cos(a) });
  }
  return pts;
}
function lineSeg(a, b) { return [a, b]; }

function chainPath() {
  const teeth = chainringTeeth();
  const r1 = teeth[0] * PITCH / (2 * Math.PI);
  const ringX = 0.048;
  const cass = cassetteTeeth();
  const mid = Math.floor(cass.length / 2);
  const r2 = cass[mid] * PITCH / (2 * Math.PI);
  const sprocketX = 0.016 + (cass.length - 1 - mid) * SPROCKET_SPACING;
  const derX = 0.020;
  const C1 = { y: GEO.bb.y, z: GEO.bb.z };
  const C2 = { y: WHEEL_R, z: 0 };
  const ext = externalTangents(C1, r1, C2, r2);
  const T1top = ext.top.t1, T2top = ext.top.t2, T1bot = ext.bot.t1, T2bot = ext.bot.t2;
  const pu = { y: WHEEL_R - 0.110, z: -0.008, r: 0.011 };
  const pl = { y: WHEEL_R - 0.155, z: -0.016, r: 0.011 };

  const segs = [
    { pts: arcSeg(C1, r1, angOf(C1, T1bot), angOf(C1, T1top), 0, 14), xa: ringX, xb: ringX },
    { pts: lineSeg(T1top, T2top), xa: ringX, xb: sprocketX },
    { pts: arcSeg(C2, r2, angOf(C2, T2top), angOf(C2, T2bot), Math.PI, 14), xa: sprocketX, xb: sprocketX },
    { pts: lineSeg(T2bot, { y: pu.y + pu.r, z: pu.z }), xa: sprocketX, xb: derX },
    { pts: arcSeg(pu, pu.r, Math.PI / 2, -Math.PI / 2, 0, 8), xa: derX, xb: derX },
    { pts: lineSeg({ y: pu.y - pu.r, z: pu.z }, { y: pl.y + pl.r, z: pl.z }), xa: derX, xb: derX },
    { pts: arcSeg(pl, pl.r, Math.PI / 2, Math.PI * 1.5, Math.PI, 8), xa: derX, xb: derX },
    { pts: lineSeg({ y: pl.y - pl.r, z: pl.z }, T1bot), xa: derX, xb: ringX }
  ];

  const pts = [];
  for (const s of segs) {
    const n = s.pts.length;
    for (let j = 0; j < n; j++) {
      const t = n > 1 ? j / (n - 1) : 0;
      pts.push({ x: lerp(s.xa, s.xb, t), y: s.pts[j].y, z: s.pts[j].z });
    }
  }
  return pts;
}

function resample(pts, N) {
  const cum = [0];
  for (let i = 1; i < pts.length; i++) {
    cum.push(cum[i - 1] + Math.hypot(pts[i].z - pts[i - 1].z, pts[i].y - pts[i - 1].y, pts[i].x - pts[i - 1].x));
  }
  const L = cum[cum.length - 1];
  const out = [], tans = [];
  for (let k = 0; k < N; k++) {
    const s = k * L / N;
    let i = 0;
    while (i < cum.length - 2 && cum[i + 1] < s) i++;
    const a = pts[i], b = pts[Math.min(i + 1, pts.length - 1)];
    const segL = (cum[i + 1] - cum[i]) || 1e-6;
    const t = clamp((s - cum[i]) / segL, 0, 1);
    out.push({ x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), z: lerp(a.z, b.z, t) });
    tans.push({ x: b.x - a.x, y: b.y - a.y, z: b.z - a.z });
  }
  return { points: out, tangents: tans };
}

function buildChain() {
  const mm = makeToon('#9aa0a8', 'drive', false);
  const pts = chainPath();
  let L = 0;
  for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i].z - pts[i - 1].z, pts[i].y - pts[i - 1].y, pts[i].x - pts[i - 1].x);
  const N = clamp(Math.round(L / 0.0125), 40, 130);
  const geo = new THREE.BoxGeometry(0.003, 0.0075, 0.0135);
  const inst = new THREE.InstancedMesh(geo, mm, N);
  const smp = resample(pts, N);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < N; i++) {
    const p = smp.points[i];
    const t = smp.tangents[i];
    const zz = V3(t.x, t.y, t.z).normalize();
    if (zz.lengthSq() < 1e-6) zz.set(0, 0, 1);
    const xx = V3(1, 0, 0);
    let yy = V3().crossVectors(zz, xx).normalize();
    if (yy.lengthSq() < 1e-6) yy.set(0, 1, 0);
    const xx2 = V3().crossVectors(yy, zz).normalize();
    dummy.position.set(p.x, p.y, p.z);
    dummy.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xx2, yy, zz));
    dummy.updateMatrix();
    inst.setMatrixAt(i, dummy.matrix);
  }
  inst.instanceMatrix.needsUpdate = true;
  return inst;
}

function applyExplode(t) {
  const e = t;
  if (parts.frontWheel) parts.frontWheel.position.set(GEO.frontAxle.x + e * 0.40, GEO.frontAxle.y, GEO.frontAxle.z);
  if (parts.rearWheel) parts.rearWheel.position.set(GEO.rearAxle.x - e * 0.40, GEO.rearAxle.y, GEO.rearAxle.z);
  if (parts.fork) parts.fork.position.copy(GEO.dSteer).multiplyScalar(e * 0.30);
  if (parts.headset) parts.headset.position.copy(GEO.upSteer).multiplyScalar(e * 0.16);
  if (parts.cockpit) parts.cockpit.position.copy(GEO.upSteer).multiplyScalar(e * 0.24);
  if (parts.seatpost) parts.seatpost.position.copy(GEO.dSeat).multiplyScalar(e * 0.34);
  if (parts.crankL) parts.crankL.position.x = -e * 0.13;
  if (parts.crankR) parts.crankR.position.x = e * 0.18;
  if (parts.cassette) parts.cassette.position.x = e * 0.14;
  if (parts.discs) parts.discs.position.x = -e * 0.12;
  if (parts.chain) parts.chain.position.y = -e * 0.06;
  if (parts.pedalL) parts.pedalL.position.x = -e * 0.05;
  if (parts.pedalR) parts.pedalR.position.x = e * 0.05;
}

    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(mm => { if (mm && mm !== outlineMat && mm !== shadowPlane.material) mm.dispose(); });
    }
  });
}

function buildBike() {
  parts.frame = buildFrame();
  parts.fork = buildFork();
  parts.headset = buildHeadset();
  const stem = buildStem();
  parts.cockpit = new THREE.Group();
  parts.cockpit.add(stem);
  parts.cockpit.add(buildBars());
  parts.cockpit.add(buildCables());
  parts.seatpost = buildSeatpost();
  parts.saddle = buildSaddle();
  const cs = buildCrankSet();
  parts.crankL = cs.crankL;
  parts.crankR = cs.crankR;
  parts.frontDer = buildFrontDerailleur();
  parts.rearDer = buildRearDerailleur();
  parts.brakes = buildBrakes();
  parts.discs = buildDiscs();
  parts.frontWheel = buildWheel(1, false);
  parts.rearWheel = buildWheel(-1, true);
  parts.cassette = buildCassette();
  parts.chain = buildChain();

  const order = ['frame', 'frontWheel', 'rearWheel', 'fork', 'headset', 'cockpit', 'seatpost', 'saddle',
    'crankL', 'crankR', 'frontDer', 'rearDer', 'brakes', 'discs', 'cassette', 'chain'];
  order.forEach(k => { if (parts[k]) bikeRoot.add(parts[k]); });
}

function rebuildAll() {
  disposeObject(bikeRoot);
  bikeToon.length = 0;
  for (const k in matGroups) matGroups[k].length = 0;
  for (const k in parts) delete parts[k];
  while (bikeRoot.children.length) bikeRoot.remove(bikeRoot.children[0]);
  GEO = computeFrame(state);
  buildBike();
  applyExplode(asmCur);
  updateSpecs();
}

function computeWeight(p) {
  const stackMm = p.stack * 1000, reachMm = p.reach * 1000;
  let w = 1.10 + (stackMm - 550) * 0.0016 + (reachMm - 385) * 0.0010;
  w += 0.42 + (stackMm - 550) * 0.0006;
  w += 1.95;
  w += 0.16 + p.cassette * 0.038;
  w += 0.52 + (p.chainrings - 1) * 0.13;
  w += 0.24;
  w += p.chainrings >= 2 ? 0.105 : 0.0;
  w += 0.23 + (p.cassette - 7) * 0.004;
  w += 0.30;
  w += 0.34 + 0.055 * (p.seatpostHeight / 0.08);
  w += 0.30;
  w += 0.34;
  w += 0.10;
  return w;
}

function updateSpecs() {
  const p = state, g = GEO;
  const mm = v => (v * 1000).toFixed(0);
  const mm1 = v => (v * 1000).toFixed(1);
  const ct = chainringTeeth();
  const cass = cassetteTeeth();
  const driveText = p.chainrings + '×' + p.cassette;
  const ringStr = ct.join('/') + 'T';
  const cassStr = cass[0] + '–' + cass[cass.length - 1] + 'T';
  const wkg = computeWeight(p);

  document.getElementById('weightBig').textContent = wkg.toFixed(2) + ' kg';
  document.getElementById('weightSub').textContent = '≈ ' + (wkg * 2.20462).toFixed(1) + ' lb · estimated';

  const rows = [
    ['Stack', mm(p.stack) + ' mm'],
    ['Reach', mm(p.reach) + ' mm'],
    ['Head angle', p.headAngle.toFixed(1) + '°'],
    ['Seat tube', mm(p.seatTubeLength) + ' mm'],
    ['Seat angle', p.seatAngle.toFixed(1) + '°'],
    ['Chainstay', mm(p.chainstay) + ' mm'],
    ['Top tube (eff.)', mm(g.topTubeLen) + ' mm'],
    ['—', ''],
    ['Wheelbase', mm1(g.wheelbase) + ' mm', 'hl'],
    ['Trail', mm1(g.trail) + ' mm', 'hl'],
    ['BB drop', '70 mm'],
    ['Fork rake', '45 mm'],
    ['—', ''],
    ['Drivetrain', driveText, 'hl'],
    ['Chainring', ringStr],
    ['Cassette', cassStr + ' (' + p.cassette + ' spd)']
  ];
  document.getElementById('specGrid').innerHTML = rows.map(r =>
    `<span class="k">${r[0]}</span><span class="v ${r[2] || ''}">${r[1]}</span>`
  ).join('');
}

function labelAnchors() {
  const g = GEO;
  const list = [
    ['Frame', V3(0, (g.hTop.y + g.seatCluster.y) / 2 + 0.03, (g.hTop.z + g.seatCluster.z) / 2)],
    ['Fork', g.frontAxle.clone().add(V3(0, 0.28, 0))],
    ['Headset', g.hTop.clone().add(V3(0, 0.05, 0))],
    ['Cockpit', parts.barCenter ? parts.barCenter.clone().add(V3(0, 0.06, 0)) : g.steererTop],
    ['Seatpost', g.seatTop.clone().addScaledVector(g.dSeat, 0.12)],
    ['Saddle', parts.saddlePoint ? parts.saddlePoint.clone().add(V3(0, 0.07, 0)) : g.seatTop],
    ['Crank & Rings', g.bb.clone().add(V3(0.05, 0.04, 0))],
    ['Cassette', g.rearAxle.clone().add(V3(0.05, 0.05, 0))],
    ['Chain', g.bb.clone().add(V3(0.05, 0.14, 0))],
    ['Rear Wheel', g.rearAxle.clone()],
    ['Front Wheel', g.frontAxle.clone()],
    ['Derailleur', V3(0.04, WHEEL_R - 0.13, -0.02)]
  ];
  return list;
}

const labelCanvas = document.getElementById('labelCanvas');
const lctx = labelCanvas.getContext('2d');
function renderLabels() {
  labelCanvas.width = container.clientWidth;
  labelCanvas.height = container.clientHeight;
  lctx.clearRect(0, 0, labelCanvas.width, labelCanvas.height);
  if (!state.labels) return;
  lctx.font = '11px -apple-system, Segoe UI, sans-serif';
  lctx.textAlign = 'center';
  for (const [name, wp] of labelAnchors()) {
    const v = wp.clone().project(camera);
    if (v.z > 1 || v.z < -1) continue;
    const x = (v.x * 0.5 + 0.5) * labelCanvas.width;
    const y = (-v.y * 0.5 + 0.5) * labelCanvas.height;
    lctx.fillStyle = '#ffb454';
    lctx.beginPath(); lctx.arc(x, y, 2.5, 0, Math.PI * 2); lctx.fill();
    lctx.fillStyle = 'rgba(21,23,28,0.8)';
    const tw = lctx.measureText(name).width;
    lctx.fillRect(x - tw / 2 - 4, y - 20, tw + 8, 15);
    lctx.strokeStyle = '#ffb454'; lctx.strokeRect(x - tw / 2 - 4, y - 20, tw + 8, 15);
    lctx.fillStyle = '#ffd9a0';
    lctx.fillText(name, x, y - 8.5);
  }
}

const leftPanel = document.getElementById('left');

function addGroup(title) {
  const g = document.createElement('div');
  g.className = 'group';
  g.innerHTML = `<div class="head"><span class="arrow">▼</span>${title}</div><div class="body"></div>`;
  g.querySelector('.head').addEventListener('click', () => g.classList.toggle('collapsed'));
  leftPanel.appendChild(g);
  return g.querySelector('.body');
}

function slider(body, label, min, max, step, value, unit, fmt, onChange) {
  const c = document.createElement('div'); c.className = 'ctl';
  const val = fmt ? fmt(value) : value.toFixed(step < 1 ? 1 : 0);
  c.innerHTML = `<div class="lbl"><span>${label}</span><span class="val">${val}${unit || ''}</span></div>`;
  const input = document.createElement('input');
  input.type = 'range'; input.min = min; input.max = max; input.step = step; input.value = value;
  input.addEventListener('input', () => {
    const v = parseFloat(input.value);
    c.querySelector('.val').textContent = (fmt ? fmt(v) : v.toFixed(step < 1 ? 1 : 0)) + (unit || '');
    onChange(v);
  });
  c.appendChild(input);
  body.appendChild(c);
}

function select(body, label, options, value, onChange) {
  const c = document.createElement('div'); c.className = 'ctl';
  c.innerHTML = `<div class="lbl"><span>${label}</span></div>`;
  const sel = document.createElement('select');
  options.forEach(o => {
    const op = document.createElement('option');
    op.value = o.value; op.textContent = o.label;
    if (String(o.value) === String(value)) op.selected = true;
    sel.appendChild(op);
  });
  sel.addEventListener('change', () => onChange(sel.value));
  c.appendChild(sel);
  body.appendChild(c);
}

function seg(body, label, options, value, onChange) {
  const c = document.createElement('div'); c.className = 'ctl';
  c.innerHTML = `<div class="lbl"><span>${label}</span></div><div class="seg"></div>`;
  const box = c.querySelector('.seg');
  options.forEach(o => {
    const b = document.createElement('button');
    b.textContent = o.label;
    if (String(o.value) === String(value)) b.classList.add('on');
    b.addEventListener('click', () => {
      box.querySelectorAll('button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      onChange(o.value);
    });
    box.appendChild(b);
  });
  body.appendChild(c);
}

function swatch(body, label, color, onChange) {
  const c = document.createElement('div'); c.className = 'ctl sw';
  c.innerHTML = `<div class="lbl" style="justify-content:center"><span>${label}</span></div>`;
  const input = document.createElement('input');
  input.type = 'color'; input.value = color;
  input.addEventListener('input', () => onChange(input.value));
  c.appendChild(input);
  body.appendChild(c);
}

function check(body, label, value, onChange) {
  const c = document.createElement('label'); c.className = 'check';
  const input = document.createElement('input');
  input.type = 'checkbox'; input.checked = value;
  input.addEventListener('change', () => onChange(input.checked));
  c.appendChild(input);
  c.appendChild(document.createTextNode(label));
  body.appendChild(c);
}

function buildUI() {
  const mark = () => { dirty = true; };

  let b = addGroup('Frame Geometry');
  slider(b, 'Stack', 0.50, 0.62, 0.001, state.stack, ' mm', v => (v * 1000).toFixed(0), v => { state.stack = v; mark(); });
  slider(b, 'Reach', 0.35, 0.46, 0.001, state.reach, ' mm', v => (v * 1000).toFixed(0), v => { state.reach = v; mark(); });
  slider(b, 'Head angle', 70, 75, 0.1, state.headAngle, '°', v => v.toFixed(1), v => { state.headAngle = v; mark(); });
  slider(b, 'Seat tube length', 0.50, 0.62, 0.001, state.seatTubeLength, ' mm', v => (v * 1000).toFixed(0), v => { state.seatTubeLength = v; mark(); });
  slider(b, 'Seat angle', 71, 76, 0.1, state.seatAngle, '°', v => v.toFixed(1), v => { state.seatAngle = v; mark(); });
  slider(b, 'Chainstay', 0.40, 0.46, 0.001, state.chainstay, ' mm', v => (v * 1000).toFixed(0), v => { state.chainstay = v; mark(); });
  slider(b, 'Compactness', 0, 1, 0.01, state.compactness, '', v => Math.round(v * 100) + '%', v => { state.compactness = v; mark(); });
  seg(b, 'Seatstay style', [{ value: 'traditional', label: 'Traditional' }, { value: 'dropped', label: 'Dropped' }], state.seatstayStyle, v => { state.seatstayStyle = v; mark(); });

  b = addGroup('Drivetrain');
  seg(b, 'Chainrings', [{ value: 1, label: '1×' }, { value: 2, label: '2×' }, { value: 3, label: '3×' }], state.chainrings, v => { state.chainrings = parseInt(v); mark(); });
  seg(b, 'Cassette speeds', Array.from({ length: 6 }, (_, i) => ({ value: i + 7, label: (i + 7) + 's' })), state.cassette, v => { state.cassette = parseInt(v); mark(); });

  b = addGroup('Fit & Cockpit');
  slider(b, 'Saddle fore/aft', -0.05, 0.05, 0.001, state.saddleForeAft, ' mm', v => (v * 1000).toFixed(0), v => { state.saddleForeAft = v; mark(); });
  slider(b, 'Seatpost height', 0.02, 0.14, 0.001, state.seatpostHeight, ' mm', v => (v * 1000).toFixed(0), v => { state.seatpostHeight = v; mark(); });
  slider(b, 'Bar width', 0.36, 0.46, 0.001, state.barWidth, ' mm', v => (v * 1000).toFixed(0), v => { state.barWidth = v; mark(); });
  slider(b, 'Bar rise', 0.0, 0.06, 0.001, state.barRise, ' mm', v => (v * 1000).toFixed(0), v => { state.barRise = v; mark(); });
  slider(b, 'Bar flare', 0, 16, 0.5, state.barFlare, '°', v => v.toFixed(1), v => { state.barFlare = v; mark(); });

  b = addGroup('Assembly');
  slider(b, 'Disassemble', 0, 1, 0.01, state.assembly, '', v => Math.round(v * 100) + '%', v => { state.assembly = v; asmTarget = v; });

  b = addGroup('Colors & Finishes');
  select(b, 'Surface finish', [
    { value: 'gloss', label: 'Gloss' },
    { value: 'matte', label: 'Matte' },
    { value: 'metallic', label: 'Metallic' },
    { value: 'carbon', label: 'Carbon-inspired' }
  ], state.finish, v => { state.finish = v; applyFinish(); });
  const sw = document.createElement('div'); sw.className = 'swatches';
  swatch(sw, 'Frame', state.frameColor, v => { state.frameColor = v; setGroupColor('frame', v); });
  swatch(sw, 'Fork', state.forkColor, v => { state.forkColor = v; setGroupColor('fork', v); });
  swatch(sw, 'Rims', state.rimColor, v => { state.rimColor = v; setGroupColor('rim', v); });
  swatch(sw, 'Drivetrain', state.driveColor, v => { state.driveColor = v; setGroupColor('drive', v); });
  swatch(sw, 'Cockpit', state.cockpitColor, v => { state.cockpitColor = v; setGroupColor('cockpit', v); });
  b.appendChild(sw);

  b = addGroup('Render Style');
  slider(b, 'Cel levels', 2, 6, 1, state.celLevels, '', v => v, v => { state.celLevels = v; applyLevels(); });
  slider(b, 'Posterize', 0, 1, 0.01, state.posterize, '', v => Math.round(v * 100) + '%', v => { state.posterize = v; applyPosterize(); });
  slider(b, 'Pixelation', 0, 1, 0.01, state.pixelation, '', v => Math.round(v * 100) + '%', v => { state.pixelation = v; applyPixelation(); });
  check(b, 'Outline (ink lines)', state.outline, v => { state.outline = v; outlineMat.visible = v; });
  check(b, 'Component labels', state.labels, v => { state.labels = v; });
}

function applyPixelation() {
  const scale = Math.max(0.16, 1 - state.pixelation * 0.84);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2) * scale);
  renderer.setSize(container.clientWidth, container.clientHeight, false);
  renderer.domElement.style.imageRendering = state.pixelation > 0.04 ? 'pixelated' : 'auto';
}

const PRESETS = {
  front: { pos: V3(0, 0.72, 2.4), tgt: V3(0, 0.62, 0.35) },
  side: { pos: V3(2.2, 0.9, 0.7), tgt: V3(0, 0.62, 0.35) },
  '3q': { pos: V3(-1.6, 1.05, -1.8), tgt: V3(0, 0.6, 0.3) },
  top: { pos: V3(0.01, 2.7, 0.5), tgt: V3(0, 0.35, 0.3) },
  drive: { pos: V3(0.75, 0.55, 0.85), tgt: V3(0.04, 0.27, 0.25) }
};
let camAnim = null;
function flyTo(name) {
  const pr = PRESETS[name];
  if (pr) camAnim = { pos: pr.pos.clone(), tgt: pr.tgt.clone() };
}

function bindButtons() {
  document.getElementById('btnPresetFront').onclick = () => flyTo('front');
  document.getElementById('btnPresetSide').onclick = () => flyTo('side');
  document.getElementById('btnPreset3q').onclick = () => flyTo('3q');
  document.getElementById('btnPresetTop').onclick = () => flyTo('top');
  document.getElementById('btnPresetDrive').onclick = () => flyTo('drive');
  document.getElementById('btnDisassemble').onclick = () => { asmTarget = 1; };
  document.getElementById('btnAssemble').onclick = () => { asmTarget = 0; };
  document.getElementById('btnReset').onclick = resetAll;
}

function resetAll() {
  Object.assign(state, JSON.parse(JSON.stringify(DEFAULTS)));
  asmTarget = 0;
  applyFinish(); applyLevels(); applyPosterize(); applyPixelation();
  outlineMat.visible = state.outline;
  leftPanel.innerHTML = '';
  buildUI();
  dirty = true;
  flyTo('3q');
  controls.target.set(0, 0.62, 0.3);
}

const clock = new THREE.Clock();
const worldLightDir = V3(0.5, 0.72, 0.45).normalize();
const lightDirView = V3();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (dirty) { rebuildAll(); dirty = false; }

  asmCur += (asmTarget - asmCur) * (1 - Math.pow(0.0001, dt));
  if (Math.abs(asmTarget - asmCur) < 1e-4) asmCur = asmTarget;
  applyExplode(asmCur);

  if (camAnim) {
    camera.position.lerp(camAnim.pos, 0.09);
    controls.target.lerp(camAnim.tgt, 0.09);
    if (camera.position.distanceTo(camAnim.pos) < 0.012 && controls.target.distanceTo(camAnim.tgt) < 0.012) camAnim = null;
  }
  controls.update();
  camera.updateMatrixWorld();

  lightDirView.copy(worldLightDir).transformDirection(camera.matrixWorldInverse);
  eachToon(mm => mm.uniforms.uLightDir.value.copy(lightDirView));

  renderer.render(scene, camera);
  renderLabels();
}

function onResize() {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  applyPixelation();
}
window.addEventListener('resize', onResize);

function boot() {
  buildUI();
  bindButtons();
  applyPixelation();
  outlineMat.visible = state.outline;
  flyTo('3q');
  animate();
}

window.addEventListener('error', e => {
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#15171c;color:#ff8a80;padding:20px;font-family:monospace;z-index:99';
  el.textContent = 'Runtime error: ' + (e.message || e.error);
  document.body.appendChild(el);
});

boot();
</script>
