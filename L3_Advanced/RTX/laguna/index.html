<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Path Tracing Room - GPU Benchmark</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; background: #000; color: #fff; font-family: 'Courier New', monospace; }
    #canvas-container { position: relative; width: 100vw; height: 100vh; }
    canvas { display: block; width: 100%; height: 100%; }
    #ui {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      background: rgba(0,0,0,0.7); padding: 12px 16px; border-radius: 6px;
      font-size: 13px; line-height: 1.6; min-width: 240px;
    }
    #ui h2 { font-size: 15px; margin-bottom: 8px; color: #0ff; }
    .stat { display: flex; justify-content: space-between; gap: 12px; }
    .stat span { color: #0f0; }
    button {
      background: #222; color: #0ff; border: 1px solid #0ff; padding: 4px 10px;
      border-radius: 3px; cursor: pointer; font-size: 12px; margin-top: 6px;
    }
    button:hover { background: #0ff; color: #000; }
    .slider-group { margin-top: 8px; }
    .slider-group label { display: block; font-size: 11px; color: #aaa; margin-bottom: 2px; }
    input[type=range] { width: 100%; }
    #warning { color: #f80; font-size: 11px; margin-top: 6px; }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="glcanvas"></canvas>
    <div id="ui">
      <h2>Path Tracing Room Benchmark</h2>
      <div class="stat"><span>Backend:</span><span id="backend">Detecting...</span></div>
      <div class="stat"><span>FPS:</span><span id="fps">--</span></div>
      <div class="stat"><span>Samples/sec:</span><span id="sps">--</span></div>
      <div class="stat"><span>Total Samples:</span><span id="samples">0</span></div>
      <div class="stat"><span>Convergence:</span><span id="convergence">--</span></div>
      <div class="stat"><span>Bounces:</span><span id="bounces-val">4</span></div>
      <div class="stat"><span>Resolution:</span><span id="resolution">--</span></div>
      <button id="reset-btn">Reset Accumulation</button>
      <button id="toggle-bounce">Toggle Bounce Count</button>
      <div class="slider-group">
        <label>Max Bounces: <span id="bounce-label">4</span></label>
        <input type="range" id="bounces" min="1" max="16" value="4">
      </div>
      <div id="warning"></div>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
