<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>RTX Path Tracing Benchmark</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0a;
  color: #c8c8c8;
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 12px;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
}
#glcanvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: block;
}
#ui-panel {
  position: absolute;
  top: 8px; left: 8px;
  width: 320px;
  background: rgba(10,10,10,0.92);
  border: 1px solid #333;
  padding: 10px;
  z-index: 10;
  max-height: calc(100vh - 16px);
  overflow-y: auto;
}
#ui-panel::-webkit-scrollbar { width: 4px; }
#ui-panel::-webkit-scrollbar-thumb { background: #444; }
.panel-title {
  font-size: 13px;
  color: #76b900;
  letter-spacing: 1px;
  margin-bottom: 8px;
  border-bottom: 1px solid #333;
  padding-bottom: 6px;
}
.section {
  margin-bottom: 10px;
  border-bottom: 1px solid #222;
  padding-bottom: 8px;
}
.section:last-child { border-bottom: none; }
.section-label {
  color: #888;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}
.metric-row {
  display: flex;
  justify-content: space-between;
  padding: 2px 0;
}
.metric-key { color: #999; }
.metric-val { color: #e0e0e0; }
.metric-val.good { color: #76b900; }
.metric-val.warn { color: #e6a817; }
.metric-val.rtx { color: #76b900; font-weight: bold; }
.ctrl-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 3px 0;
}
.ctrl-row label { color: #aaa; flex: 1; }
.ctrl-row input[type="range"] {
  width: 100px;
  accent-color: #76b900;
}
.ctrl-row select, .ctrl-row button {
  background: #1a1a1a;
  color: #ccc;
  border: 1px solid #444;
  padding: 2px 6px;
  font-family: inherit;
  font-size: 11px;
  cursor: pointer;
}
.ctrl-row button:hover { border-color: #76b900; color: #76b900; }
.ctrl-row button.active { background: #76b900; color: #000; border-color: #76b900; }
.toggle-row {
  display: flex;
  align-items: center;
  padding: 2px 0;
  gap: 6px;
}
.toggle-row input[type="checkbox"] { accent-color: #76b900; }
.toggle-row label { color: #aaa; font-size: 11px; }
#benchmark-bar {
  position: absolute;
  bottom: 8px; left: 50%;
  transform: translateX(-50%);
  background: rgba(10,10,10,0.92);
  border: 1px solid #333;
  padding: 8px 16px;
  z-index: 10;
  display: none;
  text-align: center;
}
#benchmark-bar .score { font-size: 18px; color: #76b900; }
#benchmark-bar .info { color: #888; font-size: 11px; margin-top: 4px; }
#convergence-canvas {
  width: 296px;
  height: 60px;
  border: 1px solid #333;
  margin-top: 4px;
}
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>

<div id="ui-panel">
  <div class="panel-title">RTX PATH TRACER // BENCHMARK v1.0</div>

  <div class="section">
    <div class="section-label">GPU Information</div>
    <div class="metric-row"><span class="metric-key">Renderer</span><span class="metric-val" id="gpu-name">detecting...</span></div>
    <div class="metric-row"><span class="metric-key">API</span><span class="metric-val" id="gpu-api">WebGL2</span></div>
    <div class="metric-row"><span class="metric-key">RTX Support</span><span class="metric-val" id="rtx-status">checking...</span></div>
    <div class="metric-row"><span class="metric-key">WebGPU</span><span class="metric-val" id="webgpu-status">checking...</span></div>
  </div>

  <div class="section">
    <div class="section-label">Performance</div>
    <div class="metric-row"><span class="metric-key">Frame Time</span><span class="metric-val" id="m-frametime">--</span></div>
    <div class="metric-row"><span class="metric-key">FPS</span><span class="metric-val" id="m-fps">--</span></div>
    <div class="metric-row"><span class="metric-key">Samples</span><span class="metric-val" id="m-samples">0</span></div>
    <div class="metric-row"><span class="metric-key">Samples/sec</span><span class="metric-val" id="m-sps">--</span></div>
    <div class="metric-row"><span class="metric-key">Resolution</span><span class="metric-val" id="m-res">--</span></div>
  </div>

  <div class="section">
    <div class="section-label">Render Settings</div>
    <div class="ctrl-row">
      <label>Resolution Scale</label>
      <select id="ctrl-res">
        <option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option>
        <option value="1" selected>1.0x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2.0x</option>
      </select>
    </div>
    <div class="ctrl-row">
      <label>SPP / Frame</label>
      <select id="ctrl-spp">
        <option value="1" selected>1</option>
        <option value="2">2</option>
        <option value="4">4</option>
        <option value="8">8</option>
      </select>
    </div>
    <div class="ctrl-row">
      <label>Max Bounces</label>
      <select id="ctrl-bounces">
        <option value="4">4</option>
        <option value="6">6</option>
        <option value="8" selected>8</option>
        <option value="12">12</option>
        <option value="16">16</option>
      </select>
    </div>
  </div>

  <div class="section">
    <div class="section-label">RTX Features</div>
    <div class="toggle-row"><input type="checkbox" id="feat-gi" checked><label for="feat-gi">Global Illumination (Multi-bounce)</label></div>
    <div class="toggle-row"><input type="checkbox" id="feat-shadow" checked><label for="feat-shadow">Soft Shadows (Area Light)</label></div>
    <div class="toggle-row"><input type="checkbox" id="feat-caustic" checked><label for="feat-caustic">Caustics (Dielectric Focus)</label></div>
    <div class="toggle-row"><input type="checkbox" id="feat-reflect" checked><label for="feat-reflect">Reflections (GGX Metal)</label></div>
    <div class="toggle-row"><input type="checkbox" id="feat-nee" checked><label for="feat-nee">Next Event Estimation (NEE)</label></div>
  </div>

  <div class="section">
    <div class="section-label">Denoiser</div>
    <div class="ctrl-row">
      <label>Strength</label>
      <input type="range" id="ctrl-denoise" min="0" max="100" value="60">
      <span id="denoise-val" style="width:30px;text-align:right;color:#e0e0e0">60%</span>
    </div>
    <div class="ctrl-row">
      <label>Iterations</label>
      <select id="ctrl-denoise-iter">
        <option value="0">Off</option>
        <option value="3" selected>3</option>
        <option value="5">5</option>
      </select>
    </div>
  </div>

  <div class="section">
    <div class="section-label">Convergence</div>
    <div class="metric-row"><span class="metric-key">Est. MSE</span><span class="metric-val" id="m-mse">--</span></div>
    <div class="metric-row"><span class="metric-key">Est. PSNR</span><span class="metric-val" id="m-psnr">--</span></div>
    <canvas id="convergence-canvas"></canvas>
  </div>

  <div class="section">
    <div class="section-label">Benchmark</div>
    <div class="ctrl-row">
      <button id="btn-benchmark">RUN 30s BENCHMARK</button>
      <button id="btn-reset">RESET</button>
    </div>
  </div>
</div>

<div id="benchmark-bar">
  <div class="score" id="bench-score">--</div>
  <div class="info" id="bench-info"></div>
</div>

<script>
"use strict";

// ============================================================
// PATH TRACER SHADER
// ============================================================
const PATH_TRACE_VS = `#version 300 es
precision highp float;
in vec2 aPos;
out vec2 vUv;
void main() {
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

const PATH_TRACE_FS = `#version 300 es
precision highp float;
precision highp int;

in vec2 vUv;
layout(location=0) out vec4 outColor;
layout(location=1) out vec4 outNormal;
layout(location=2) out vec4 outDepth;

uniform vec2 uResolution;
uniform int uFrame;
uniform int uSampleCount;
uniform int uSPP;
uniform int uMaxBounces;
uniform float uTime;
uniform vec3 uCamPos;
uniform vec3 uCamTarget;
uniform float uCamFov;
uniform int uFeatGI;
uniform int uFeatShadow;
uniform int uFeatCaustic;
uniform int uFeatReflect;
uniform int uFeatNEE;

#define PI 3.14159265359
#define INV_PI 0.31830988618
#define MAX_DIST 1e20
#define EPSILON 0.001

// ---- PRNG (PCG) ----
uint pcgState;
uint pcgHash(uint v) {
  uint state = v * 747796405u + 2891336453u;
  uint word = ((state >> ((state >> 28u) + 4u)) ^ state) * 277803737u;
  return (word >> 22u) ^ word;
}
float rand() {
  pcgState = pcgState * 747796405u + 2891336453u;
  uint word = ((pcgState >> ((pcgState >> 28u) + 4u)) ^ pcgState) * 277803737u;
  word = (word >> 22u) ^ word;
  return float(word) * (1.0 / 4294967296.0);
}
vec2 rand2() { return vec2(rand(), rand()); }

// ---- Ray struct ----
struct Ray { vec3 origin; vec3 dir; };
struct Hit {
  float t;
  vec3 pos;
  vec3 normal;
  int matType;   // 0=lambert, 1=metal, 2=dielectric, 3=emissive
  vec3 albedo;
  float roughness;
  float ior;
  vec3 emission;
};

// ---- Intersection ----
float intersectSphere(Ray r, vec3 center, float radius) {
  vec3 oc = r.origin - center;
  float b = dot(oc, r.dir);
  float c = dot(oc, oc) - radius * radius;
  float disc = b * b - c;
  if (disc < 0.0) return -1.0;
  float sq = sqrt(disc);
  float t = -b - sq;
  if (t > EPSILON) return t;
  t = -b + sq;
  if (t > EPSILON) return t;
  return -1.0;
}

// AABB slab intersection
vec2 intersectAABB(Ray r, vec3 bmin, vec3 bmax) {
  vec3 invD = 1.0 / r.dir;
  vec3 t0 = (bmin - r.origin) * invD;
  vec3 t1 = (bmax - r.origin) * invD;
  vec3 tsmall = min(t0, t1);
  vec3 tbig = max(t0, t1);
  float tmin = max(max(tsmall.x, tsmall.y), tsmall.z);
  float tmax = min(min(tbig.x, tbig.y), tbig.z);
  if (tmin > tmax || tmax < EPSILON) return vec2(-1.0);
  return vec2(tmin > EPSILON ? tmin : tmax, tmax);
}

vec3 aabbNormal(vec3 p, vec3 bmin, vec3 bmax) {
  vec3 c = (bmin + bmax) * 0.5;
  vec3 d = (bmax - bmin) * 0.5;
  vec3 rel = (p - c) / d;
  vec3 a = abs(rel);
  if (a.x > a.y && a.x > a.z) return vec3(sign(rel.x), 0.0, 0.0);
  if (a.y > a.z) return vec3(0.0, sign(rel.y), 0.0);
  return vec3(0.0, 0.0, sign(rel.z));
}

// ---- Scene Definition ----
// Room: 10x10x10 centered at origin, floor at y=0
// Walls as thin boxes

void sceneIntersect(Ray r, out Hit h) {
  h.t = MAX_DIST;
  h.matType = 0;
  h.albedo = vec3(0.0);
  h.roughness = 0.0;
  h.ior = 1.0;
  h.emission = vec3(0.0);

  // Floor (y=0 plane as thin box)
  vec2 tf = intersectAABB(r, vec3(-5.0, -0.1, -5.0), vec3(5.0, 0.0, 5.0));
  if (tf.x > 0.0 && tf.x < h.t) {
    h.t = tf.x;
    h.pos = r.origin + r.dir * tf.x;
    h.normal = vec3(0.0, 1.0, 0.0);
    // Checkerboard
    vec2 cp = floor(h.pos.xz * 1.0);
    float checker = mod(cp.x + cp.y, 2.0);
    h.albedo = mix(vec3(0.75), vec3(0.25), checker);
    h.matType = 0;
    h.emission = vec3(0.0);
  }

  // Ceiling
  vec2 tc = intersectAABB(r, vec3(-5.0, 10.0, -5.0), vec3(5.0, 10.1, 5.0));
  if (tc.x > 0.0 && tc.x < h.t) {
    h.t = tc.x;
    h.pos = r.origin + r.dir * tc.x;
    h.normal = vec3(0.0, -1.0, 0.0);
    h.albedo = vec3(0.75);
    h.matType = 0;
    h.emission = vec3(0.0);
  }

  // Back wall (z=-5)
  vec2 tb = intersectAABB(r, vec3(-5.0, 0.0, -5.1), vec3(5.0, 10.0, -5.0));
  if (tb.x > 0.0 && tb.x < h.t) {
    h.t = tb.x;
    h.pos = r.origin + r.dir * tb.x;
    h.normal = vec3(0.0, 0.0, 1.0);
    h.albedo = vec3(0.75);
    h.matType = 0;
    h.emission = vec3(0.0);
  }

  // Left wall (x=-5) RED
  vec2 tl = intersectAABB(r, vec3(-5.1, 0.0, -5.0), vec3(-5.0, 10.0, 5.0));
  if (tl.x > 0.0 && tl.x < h.t) {
    h.t = tl.x;
    h.pos = r.origin + r.dir * tl.x;
    h.normal = vec3(1.0, 0.0, 0.0);
    h.albedo = vec3(0.85, 0.12, 0.1);
    h.matType = 0;
    h.emission = vec3(0.0);
  }

  // Right wall (x=5) GREEN
  vec2 tr2 = intersectAABB(r, vec3(5.0, 0.0, -5.0), vec3(5.1, 10.0, 5.0));
  if (tr2.x > 0.0 && tr2.x < h.t) {
    h.t = tr2.x;
    h.pos = r.origin + r.dir * tr2.x;
    h.normal = vec3(-1.0, 0.0, 0.0);
    h.albedo = vec3(0.1, 0.75, 0.12);
    h.matType = 0;
    h.emission = vec3(0.0);
  }

  // Area light on ceiling (emissive plane)
  vec2 tLight = intersectAABB(r, vec3(-1.5, 9.89, -1.5), vec3(1.5, 9.9, 1.5));
  if (tLight.x > 0.0 && tLight.x < h.t) {
    h.t = tLight.x;
    h.pos = r.origin + r.dir * tLight.x;
    h.normal = vec3(0.0, -1.0, 0.0);
    h.albedo = vec3(1.0);
    h.matType = 3;
    h.emission = vec3(18.0, 16.5, 14.0);
  }

  // Metal sphere (GGX) - left area
  float ts1 = intersectSphere(r, vec3(-2.0, 1.8, -1.5), 1.8);
  if (ts1 > 0.0 && ts1 < h.t) {
    h.t = ts1;
    h.pos = r.origin + r.dir * ts1;
    h.normal = normalize(h.pos - vec3(-2.0, 1.8, -1.5));
    h.albedo = vec3(0.95, 0.93, 0.88);
    h.matType = 1;
    h.roughness = 0.05;
    h.emission = vec3(0.0);
  }

  // Glass sphere (dielectric) - right area
  float ts2 = intersectSphere(r, vec3(2.2, 1.5, 0.5), 1.5);
  if (ts2 > 0.0 && ts2 < h.t) {
    h.t = ts2;
    h.pos = r.origin + r.dir * ts2;
    h.normal = normalize(h.pos - vec3(2.2, 1.5, 0.5));
    h.albedo = vec3(1.0);
    h.matType = 2;
    h.ior = 1.52;
    h.roughness = 0.0;
    h.emission = vec3(0.0);
  }

  // Diffuse box - center back
  vec2 tBox = intersectAABB(r, vec3(-0.8, 0.0, -3.8), vec3(1.2, 2.5, -1.8));
  if (tBox.x > 0.0 && tBox.x < h.t) {
    h.t = tBox.x;
    h.pos = r.origin + r.dir * tBox.x;
    h.normal = aabbNormal(h.pos, vec3(-0.8, 0.0, -3.8), vec3(1.2, 2.5, -1.8));
    h.albedo = vec3(0.8, 0.75, 0.5);
    h.matType = 0;
    h.emission = vec3(0.0);
  }

  // Small emissive sphere - accent light
  float ts3 = intersectSphere(r, vec3(3.5, 0.6, -3.0), 0.6);
  if (ts3 > 0.0 && ts3 < h.t) {
    h.t = ts3;
    h.pos = r.origin + r.dir * ts3;
    h.normal = normalize(h.pos - vec3(3.5, 0.6, -3.0));
    h.albedo = vec3(1.0);
    h.matType = 3;
    h.emission = vec3(8.0, 3.0, 1.0);
  }

  // Rough metal sphere - back left
  float ts4 = intersectSphere(r, vec3(-3.5, 1.0, 2.5), 1.0);
  if (ts4 > 0.0 && ts4 < h.t) {
    h.t = ts4;
    h.pos = r.origin + r.dir * ts4;
    h.normal = normalize(h.pos - vec3(-3.5, 1.0, 2.5));
    h.albedo = vec3(0.9, 0.6, 0.3);
    h.matType = 1;
    h.roughness = 0.35;
    h.emission = vec3(0.0);
  }
}

// ---- Sampling utilities ----
vec3 cosineSampleHemisphere(vec3 n) {
  vec2 u = rand2();
  float r = sqrt(u.x);
  float theta = 2.0 * PI * u.y;
  vec3 w = n;
  vec3 a = abs(w.x) > 0.9 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);
  vec3 u2 = normalize(cross(a, w));
  vec3 v = cross(w, u2);
  return normalize(u2 * r * cos(theta) + v * r * sin(theta) + w * sqrt(max(0.0, 1.0 - u.x)));
}

// GGX importance sampling (simplified VNDF)
vec3 ggxSample(vec3 n, vec3 wo, float roughness) {
  vec2 u = rand2();
  float a = roughness * roughness;
  float phi = 2.0 * PI * u.x;
  float cosTheta = sqrt((1.0 - u.y) / (1.0 + (a*a - 1.0) * u.y));
  float sinTheta = sqrt(1.0 - cosTheta * cosTheta);
  vec3 h = vec3(sinTheta * cos(phi), sinTheta * sin(phi), cosTheta);
  // TBN
  vec3 up = abs(n.z) < 0.999 ? vec3(0.0, 0.0, 1.0) : vec3(1.0, 0.0, 0.0);
  vec3 t = normalize(cross(up, n));
  vec3 b = cross(n, t);
  h = t * h.x + b * h.y + n * h.z;
  return normalize(reflect(-wo, h));
}

float schlickFresnel(float cosTheta, float ior) {
  float r0 = (1.0 - ior) / (1.0 + ior);
  r0 = r0 * r0;
  return r0 + (1.0 - r0) * pow(1.0 - cosTheta, 5.0);
}

// ---- NEE: sample area light ----
vec3 sampleLight(vec3 pos, vec3 normal) {
  // Area light: [-1.5, 9.89, -1.5] to [1.5, 9.9, 1.5]
  vec2 u = rand2();
  vec3 lightPos = vec3(
    mix(-1.5, 1.5, u.x),
    9.895,
    mix(-1.5, 1.5, u.y)
  );
  vec3 toLight = lightPos - pos;
  float dist2 = dot(toLight, toLight);
  vec3 lightDir = toLight / sqrt(dist2);
  float cosTheta = dot(normal, lightDir);
  if (cosTheta <= 0.0) return vec3(0.0);

  // Shadow ray
  Ray shadowRay;
  shadowRay.origin = pos + normal * EPSILON;
  shadowRay.dir = lightDir;
  Hit sh;
  sceneIntersect(shadowRay, sh);

  float lightDist = sqrt(dist2);
  if (sh.t < lightDist - 0.1) return vec3(0.0); // occluded

  // Light area = 3x3 = 9
  float lightArea = 9.0;
  float cosLight = abs(lightDir.y); // light normal is (0,-1,0)
  float pdf = dist2 / (lightArea * max(cosLight, 0.001));
  vec3 emission = vec3(18.0, 16.5, 14.0);
  return emission * cosTheta / max(pdf, 0.001);
}

// ---- Path tracing ----
vec3 tracePath(Ray ray) {
  vec3 throughput = vec3(1.0);
  vec3 radiance = vec3(0.0);

  for (int bounce = 0; bounce < 16; bounce++) {
    if (bounce >= uMaxBounces) break;

    Hit h;
    sceneIntersect(ray, h);

    if (h.t >= MAX_DIST) {
      // Background - dark
      break;
    }

    // Emission
    if (h.matType == 3) {
      radiance += throughput * h.emission;
      break;
    }

    // NEE direct lighting
    if (uFeatNEE == 1 && uFeatShadow == 1) {
      vec3 direct = sampleLight(h.pos, h.normal);
      radiance += throughput * h.albedo * direct * INV_PI;
    }

    // Russian Roulette after bounce 3
    if (bounce > 3) {
      float p = max(throughput.x, max(throughput.y, throughput.z));
      if (rand() > p) break;
      throughput /= p;
    }

    // Scatter based on material
    if (h.matType == 0) {
      // Lambertian
      vec3 newDir = cosineSampleHemisphere(h.normal);
      ray.origin = h.pos + h.normal * EPSILON;
      ray.dir = newDir;
      throughput *= h.albedo;
    } else if (h.matType == 1) {
      // Metal GGX
      if (uFeatReflect == 0) {
        // Fallback to diffuse if reflections disabled
        vec3 newDir = cosineSampleHemisphere(h.normal);
        ray.origin = h.pos + h.normal * EPSILON;
        ray.dir = newDir;
        throughput *= h.albedo;
      } else {
        vec3 reflected = reflect(ray.dir, h.normal);
        vec3 newDir;
        if (h.roughness < 0.01) {
          newDir = reflected;
        } else {
          newDir = ggxSample(h.normal, -ray.dir, h.roughness);
        }
        if (dot(newDir, h.normal) <= 0.0) break;
        ray.origin = h.pos + h.normal * EPSILON;
        ray.dir = newDir;
        // Fresnel for metal
        float cosI = max(dot(-ray.dir, h.normal), 0.0);
        vec3 F = h.albedo + (vec3(1.0) - h.albedo) * pow(1.0 - cosI, 5.0);
        throughput *= F;
      }
    } else if (h.matType == 2) {
      // Dielectric (glass)
      vec3 n = h.normal;
      float eta;
      float cosI = dot(-ray.dir, n);
      if (cosI < 0.0) {
        n = -n;
        cosI = -cosI;
        eta = h.ior;
      } else {
        eta = 1.0 / h.ior;
      }

      float F = schlickFresnel(cosI, h.ior);
      if (rand() < F) {
        // Reflect
        ray.origin = h.pos + n * EPSILON;
        ray.dir = reflect(ray.dir, n);
      } else {
        // Refract
        vec3 refracted = refract(ray.dir, n, eta);
        if (length(refracted) < 0.001) {
          ray.origin = h.pos + n * EPSILON;
          ray.dir = reflect(ray.dir, n);
        } else {
          ray.origin = h.pos - n * EPSILON;
          ray.dir = refracted;
        }
      }
      // Caustics disabled -> skip glass contribution
      if (uFeatCaustic == 0 && bounce > 0) {
        throughput *= 0.5;
      }
    }

    // GI disabled: only allow 1 bounce
    if (uFeatGI == 0 && bounce >= 1) break;
  }

  return radiance;
}

void main() {
  // Init PRNG
  uint pixelIdx = uint(gl_FragCoord.x) + uint(gl_FragCoord.y) * uint(uResolution.x);
  pcgState = pcgHash(pixelIdx * 1973u + uint(uFrame) * 9277u + uint(uSampleCount) * 26699u);
  rand(); rand(); // warm up

  vec3 totalColor = vec3(0.0);

  for (int s = 0; s < 8; s++) {
    if (s >= uSPP) break;

    // Jittered pixel
    vec2 jitter = rand2();
    vec2 uv = (gl_FragCoord.xy + jitter) / uResolution;
    vec2 ndc = uv * 2.0 - 1.0;
    ndc.x *= uResolution.x / uResolution.y;

    // Camera
    vec3 forward = normalize(uCamTarget - uCamPos);
    vec3 right = normalize(cross(forward, vec3(0.0, 1.0, 0.0)));
    vec3 up = cross(right, forward);
    float fovScale = tan(uCamFov * 0.5 * PI / 180.0);

    vec3 dir = normalize(forward + ndc.x * fovScale * right + ndc.y * fovScale * up);

    Ray ray;
    ray.origin = uCamPos;
    ray.dir = dir;

    totalColor += tracePath(ray);
  }

  totalColor /= float(uSPP);

  outColor = vec4(totalColor, 1.0);

  // Output normal/depth for denoiser (from primary ray)
  vec2 uvC = (gl_FragCoord.xy + 0.5) / uResolution;
  vec2 ndcC = uvC * 2.0 - 1.0;
  ndcC.x *= uResolution.x / uResolution.y;
  vec3 forward2 = normalize(uCamTarget - uCamPos);
  vec3 right2 = normalize(cross(forward2, vec3(0.0, 1.0, 0.0)));
  vec3 up2 = cross(right2, forward2);
  float fovScale2 = tan(uCamFov * 0.5 * PI / 180.0);
  vec3 dirC = normalize(forward2 + ndcC.x * fovScale2 * right2 + ndcC.y * fovScale2 * up2);
  Ray primRay;
  primRay.origin = uCamPos;
  primRay.dir = dirC;
  Hit ph;
  sceneIntersect(primRay, ph);
  if (ph.t < MAX_DIST) {
    outNormal = vec4(ph.normal * 0.5 + 0.5, 1.0);
    outDepth = vec4(vec3(ph.t / 30.0), 1.0);
  } else {
    outNormal = vec4(0.5, 0.5, 0.5, 0.0);
    outDepth = vec4(1.0, 1.0, 1.0, 0.0);
  }
}`;

// ============================================================
// ACCUMULATION SHADER
// ============================================================
const ACCUM_FS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uCurrent;
uniform sampler2D uHistory;
uniform int uSampleCount;
void main() {
  vec3 cur = texture(uCurrent, vUv).rgb;
  vec3 hist = texture(uHistory, vUv).rgb;
  float n = float(uSampleCount);
  vec3 result = (hist * n + cur) / (n + 1.0);
  fragColor = vec4(result, 1.0);
}`;

// ============================================================
// A-TROUS DENOISE SHADER
// ============================================================
const DENOISE_FS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uColor;
uniform sampler2D uNormal;
uniform sampler2D uDepth;
uniform vec2 uTexelSize;
uniform int uStepSize;
uniform float uStrength;

void main() {
  vec3 c0 = texture(uColor, vUv).rgb;
  vec3 n0 = texture(uNormal, vUv).rgb * 2.0 - 1.0;
  float d0 = texture(uDepth, vUv).r;

  if (uStrength < 0.01) {
    fragColor = vec4(c0, 1.0);
    return;
  }

  // 5x5 à-trous kernel
  float kernel[25];
  kernel[0]=1.0/256.0; kernel[1]=4.0/256.0; kernel[2]=6.0/256.0; kernel[3]=4.0/256.0; kernel[4]=1.0/256.0;
  kernel[5]=4.0/256.0; kernel[6]=16.0/256.0; kernel[7]=24.0/256.0; kernel[8]=16.0/256.0; kernel[9]=4.0/256.0;
  kernel[10]=6.0/256.0; kernel[11]=24.0/256.0; kernel[12]=36.0/256.0; kernel[13]=24.0/256.0; kernel[14]=6.0/256.0;
  kernel[15]=4.0/256.0; kernel[16]=16.0/256.0; kernel[17]=24.0/256.0; kernel[18]=16.0/256.0; kernel[19]=4.0/256.0;
  kernel[20]=1.0/256.0; kernel[21]=4.0/256.0; kernel[22]=6.0/256.0; kernel[23]=4.0/256.0; kernel[24]=1.0/256.0;

  vec3 sum = vec3(0.0);
  float wSum = 0.0;

  float sigmaNormal = 128.0;
  float sigmaDepth = 1.0;

  for (int y = -2; y <= 2; y++) {
    for (int x = -2; x <= 2; x++) {
      vec2 offset = vec2(float(x), float(y)) * float(uStepSize) * uTexelSize;
      vec2 suv = vUv + offset;

      vec3 ci = texture(uColor, suv).rgb;
      vec3 ni = texture(uNormal, suv).rgb * 2.0 - 1.0;
      float di = texture(uDepth, suv).r;

      float w = kernel[(y+2)*5 + (x+2)];

      // Normal weight
      float nw = pow(max(dot(n0, ni), 0.0), sigmaNormal);
      // Depth weight
      float dw = exp(-abs(d0 - di) * sigmaDepth * 30.0);

      float weight = w * nw * dw;
      sum += ci * weight;
      wSum += weight;
    }
  }

  vec3 denoised = sum / max(wSum, 0.0001);
  vec3 result = mix(c0, denoised, uStrength);
  fragColor = vec4(result, 1.0);
}`;

// ============================================================
// DISPLAY / TONE MAP SHADER
// ============================================================
const DISPLAY_FS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uTexture;
uniform float uExposure;

vec3 acesTonemap(vec3 x) {
  float a = 2.51;
  float b = 0.03;
  float c = 2.43;
  float d = 0.59;
  float e = 0.14;
  return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
}

void main() {
  vec3 hdr = texture(uTexture, vUv).rgb;
  hdr *= uExposure;
  vec3 mapped = acesTonemap(hdr);
  // Gamma
  mapped = pow(mapped, vec3(1.0 / 2.2));
  fragColor = vec4(mapped, 1.0);
}`;

// ============================================================
// RENDERER
// ============================================================
const canvas = document.getElementById('glcanvas');
const gl = canvas.getContext('webgl2', {
  antialias: false,
  alpha: false,
  preserveDrawingBuffer: false
});

if (!gl) {
  document.body.innerHTML = '<div style="color:#f00;padding:40px;font-family:monospace">WebGL2 not supported. Please use a modern browser.</div>';
  throw new Error('No WebGL2');
}

// Enable float rendering
const extFloat = gl.getExtension('EXT_color_buffer_float');
if (!extFloat) {
  document.body.innerHTML = '<div style="color:#f00;padding:40px;font-family:monospace">EXT_color_buffer_float not supported.</div>';
  throw new Error('No float buffers');
}
gl.getExtension('OES_texture_float_linear');

// ---- Shader compilation ----
function compileShader(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error('Shader compile error:', gl.getShaderInfoLog(s));
    console.error('Source:', src);
    throw new Error('Shader compile failed');
  }
  return s;
}

function createProgram(vsSrc, fsSrc, transformFeedbackVaryings) {
  const vs = compileShader(vsSrc, gl.VERTEX_SHADER);
  const fs = compileShader(fsSrc, gl.FRAGMENT_SHADER);
  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  if (transformFeedbackVaryings) {
    gl.transformFeedbackVaryings(prog, transformFeedbackVaryings, gl.SEPARATE_ATTRIBS);
  }
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(prog));
    throw new Error('Program link failed');
  }
  return prog;
}

// ---- Fullscreen quad ----
const quadVerts = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, quadVerts, gl.STATIC_DRAW);

const quadVAO = gl.createVertexArray();
gl.bindVertexArray(quadVAO);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.bindVertexArray(null);

// ---- Programs ----
const pathTraceProg = createProgram(PATH_TRACE_VS, PATH_TRACE_FS);
const accumProg = createProgram(PATH_TRACE_VS, ACCUM_FS);
const denoiseProg = createProgram(PATH_TRACE_VS, DENOISE_FS);
const displayProg = createProgram(PATH_TRACE_VS, DISPLAY_FS);

// ---- Uniform locations ----
const uPT = {};
['uResolution','uFrame','uSampleCount','uSPP','uMaxBounces','uTime',
 'uCamPos','uCamTarget','uCamFov','uFeatGI','uFeatShadow','uFeatCaustic',
 'uFeatReflect','uFeatNEE'].forEach(n => {
  uPT[n] = gl.getUniformLocation(pathTraceProg, n);
});

const uAccum = {
  uCurrent: gl.getUniformLocation(accumProg, 'uCurrent'),
  uHistory: gl.getUniformLocation(accumProg, 'uHistory'),
  uSampleCount: gl.getUniformLocation(accumProg, 'uSampleCount')
};

const uDenoise = {
  uColor: gl.getUniformLocation(denoiseProg, 'uColor'),
  uNormal: gl.getUniformLocation(denoiseProg, 'uNormal'),
  uDepth: gl.getUniformLocation(denoiseProg, 'uDepth'),
  uTexelSize: gl.getUniformLocation(denoiseProg, 'uTexelSize'),
  uStepSize: gl.getUniformLocation(denoiseProg, 'uStepSize'),
  uStrength: gl.getUniformLocation(denoiseProg, 'uStrength')
};

const uDisplay = {
  uTexture: gl.getUniformLocation(displayProg, 'uTexture'),
  uExposure: gl.getUniformLocation(displayProg, 'uExposure')
};

// ---- Framebuffers ----
let renderW, renderH;
let fbPathTrace, fbAccumA, fbAccumB, fbDenoiseA, fbDenoiseB;
let texPTColor, texPTNormal, texPTDepth;
let texAccumA, texAccumB;
let texDenoiseA, texDenoiseB;

function createFloatTexture(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, w, h, 0, gl.RGBA, gl.FLOAT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return tex;
}

function setupFramebuffers(w, h) {
  renderW = w;
  renderH = h;

  // Cleanup old
  [fbPathTrace, fbAccumA, fbAccumB, fbDenoiseA, fbDenoiseB].forEach(fb => { if(fb) gl.deleteFramebuffer(fb); });
  [texPTColor, texPTNormal, texPTDepth, texAccumA, texAccumB, texDenoiseA, texDenoiseB].forEach(t => { if(t) gl.deleteTexture(t); });

  // Path trace output (MRT: color + normal + depth)
  texPTColor = createFloatTexture(w, h);
  texPTNormal = createFloatTexture(w, h);
  texPTDepth = createFloatTexture(w, h);
  fbPathTrace = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbPathTrace);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texPTColor, 0);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, texPTNormal, 0);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT2, gl.TEXTURE_2D, texPTDepth, 0);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1, gl.COLOR_ATTACHMENT2]);

  // Accumulation ping-pong
  texAccumA = createFloatTexture(w, h);
  texAccumB = createFloatTexture(w, h);
  fbAccumA = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbAccumA);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texAccumA, 0);
  fbAccumB = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbAccumB);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texAccumB, 0);

  // Denoise ping-pong
  texDenoiseA = createFloatTexture(w, h);
  texDenoiseB = createFloatTexture(w, h);
  fbDenoiseA = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbDenoiseA);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texDenoiseA, 0);
  fbDenoiseB = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbDenoiseB);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texDenoiseB, 0);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

// ---- State ----
let sampleCount = 0;
let frameCount = 0;
let accumPingPong = 0; // 0 = A is history, write to B; 1 = B is history, write to A
let lastTime = performance.now();
let fpsSmooth = 0;
let frameTimeSmooth = 0;
let spsAccum = 0;
let spsTime = 0;
let spsValue = 0;

// Benchmark state
let benchmarkRunning = false;
let benchmarkStart = 0;
let benchmarkSamples = 0;

// Convergence tracking
let mseHistory = [];
const convergenceCanvas = document.getElementById('convergence-canvas');
const convCtx = convergenceCanvas.getContext('2d');

// Camera
const camPos = [0.0, 5.0, 12.0];
const camTarget = [0.0, 4.0, -1.0];
const camFov = 55.0;

// ---- Resize ----
function resize() {
  const scale = parseFloat(document.getElementById('ctrl-res').value);
  const w = Math.floor(canvas.clientWidth * scale);
  const h = Math.floor(canvas.clientHeight * scale);
  canvas.width = w;
  canvas.height = h;
  setupFramebuffers(w, h);
  resetAccumulation();
  document.getElementById('m-res').textContent = w + 'x' + h;
}

function resetAccumulation() {
  sampleCount = 0;
  frameCount = 0;
  accumPingPong = 0;
  mseHistory = [];
  // Clear accumulation buffers
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbAccumA);
  gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbAccumB);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

// ---- GPU Detection ----
function detectGPU() {
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  let gpuName = 'Unknown GPU';
  if (dbg) {
    gpuName = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
  }
  document.getElementById('gpu-name').textContent = gpuName;
  document.getElementById('gpu-api').textContent = 'WebGL2 (Software PT)';

  // RTX detection
  const rtxPattern = /RTX|NVIDIA.*(?:20[6-9]0|30[5-9]0|40[5-9]0|50[5-9]0)/i;
  const isRTX = rtxPattern.test(gpuName);
  const rtxEl = document.getElementById('rtx-status');
  if (isRTX) {
    rtxEl.textContent = 'DETECTED';
    rtxEl.className = 'metric-val rtx';
  } else if (/NVIDIA/i.test(gpuName)) {
    rtxEl.textContent = 'GTX (No RT Cores)';
    rtxEl.className = 'metric-val warn';
  } else {
    rtxEl.textContent = 'Not NVIDIA RTX';
    rtxEl.className = 'metric-val';
  }

  // WebGPU check
  if (navigator.gpu) {
    navigator.gpu.requestAdapter().then(adapter => {
      if (adapter) {
        document.getElementById('webgpu-status').textContent = 'Available';
        document.getElementById('webgpu-status').className = 'metric-val good';
      } else {
        document.getElementById('webgpu-status').textContent = 'No Adapter';
      }
    }).catch(() => {
      document.getElementById('webgpu-status').textContent = 'Error';
    });
  } else {
    document.getElementById('webgpu-status').textContent = 'Not Supported';
  }
}

// ---- Render loop ----
function drawFullscreen() {
  gl.bindVertexArray(quadVAO);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

function render() {
  const now = performance.now();
  const dt = now - lastTime;
  lastTime = now;

  const spp = parseInt(document.getElementById('ctrl-spp').value);
  const maxBounces = parseInt(document.getElementById('ctrl-bounces').value);
  const denoiseStrength = parseInt(document.getElementById('ctrl-denoise').value) / 100.0;
  const denoiseIter = parseInt(document.getElementById('ctrl-denoise-iter').value);

  const featGI = document.getElementById('feat-gi').checked ? 1 : 0;
  const featShadow = document.getElementById('feat-shadow').checked ? 1 : 0;
  const featCaustic = document.getElementById('feat-caustic').checked ? 1 : 0;
  const featReflect = document.getElementById('feat-reflect').checked ? 1 : 0;
  const featNEE = document.getElementById('feat-nee').checked ? 1 : 0;

  gl.viewport(0, 0, renderW, renderH);

  // Pass 1: Path trace
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbPathTrace);
  gl.useProgram(pathTraceProg);
  gl.uniform2f(uPT.uResolution, renderW, renderH);
  gl.uniform1i(uPT.uFrame, frameCount);
  gl.uniform1i(uPT.uSampleCount, sampleCount);
  gl.uniform1i(uPT.uSPP, spp);
  gl.uniform1i(uPT.uMaxBounces, maxBounces);
  gl.uniform1f(uPT.uTime, now * 0.001);
  gl.uniform3fv(uPT.uCamPos, camPos);
  gl.uniform3fv(uPT.uCamTarget, camTarget);
  gl.uniform1f(uPT.uCamFov, camFov);
  gl.uniform1i(uPT.uFeatGI, featGI);
  gl.uniform1i(uPT.uFeatShadow, featShadow);
  gl.uniform1i(uPT.uFeatCaustic, featCaustic);
  gl.uniform1i(uPT.uFeatReflect, featReflect);
  gl.uniform1i(uPT.uFeatNEE, featNEE);
  drawFullscreen();

  // Pass 2: Accumulate
  const histTex = accumPingPong === 0 ? texAccumA : texAccumB;
  const outFB = accumPingPong === 0 ? fbAccumB : fbAccumA;
  gl.bindFramebuffer(gl.FRAMEBUFFER, outFB);
  gl.useProgram(accumProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texPTColor);
  gl.uniform1i(uAccum.uCurrent, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, histTex);
  gl.uniform1i(uAccum.uHistory, 1);
  gl.uniform1i(uAccum.uSampleCount, sampleCount);
  drawFullscreen();

  const accumTex = accumPingPong === 0 ? texAccumB : texAccumA;
  accumPingPong = 1 - accumPingPong;
  sampleCount += spp;
  frameCount++;

  // Pass 3: Denoise (à-trous iterations)
  let finalTex = accumTex;
  if (denoiseIter > 0 && denoiseStrength > 0.01) {
    let srcTex = accumTex;
    for (let i = 0; i < denoiseIter; i++) {
      const stepSize = 1 << i; // 1, 2, 4, 8, 16
      const dstFB = (i % 2 === 0) ? fbDenoiseA : fbDenoiseB;
      const dstTex = (i % 2 === 0) ? texDenoiseA : texDenoiseB;

      gl.bindFramebuffer(gl.FRAMEBUFFER, dstFB);
      gl.useProgram(denoiseProg);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, srcTex);
      gl.uniform1i(uDenoise.uColor, 0);
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, texPTNormal);
      gl.uniform1i(uDenoise.uNormal, 1);
      gl.activeTexture(gl.TEXTURE2);
      gl.bindTexture(gl.TEXTURE_2D, texPTDepth);
      gl.uniform1i(uDenoise.uDepth, 2);
      gl.uniform2f(uDenoise.uTexelSize, 1.0 / renderW, 1.0 / renderH);
      gl.uniform1i(uDenoise.uStepSize, stepSize);
      gl.uniform1f(uDenoise.uStrength, denoiseStrength);
      drawFullscreen();

      srcTex = dstTex;
    }
    finalTex = srcTex;
  }

  // Pass 4: Display with tone mapping
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(displayProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, finalTex);
  gl.uniform1i(uDisplay.uTexture, 0);
  gl.uniform1f(uDisplay.uExposure, 1.0);
  drawFullscreen();

  // ---- Metrics ----
  frameTimeSmooth = frameTimeSmooth * 0.9 + dt * 0.1;
  fpsSmooth = 1000.0 / frameTimeSmooth;

  spsAccum += spp;
  spsTime += dt;
  if (spsTime > 500) {
    spsValue = (spsAccum / spsTime) * 1000.0 * renderW * renderH / 1e6;
    spsAccum = 0;
    spsTime = 0;
  }

  // Update UI every 10 frames
  if (frameCount % 10 === 0) {
    document.getElementById('m-frametime').textContent = frameTimeSmooth.toFixed(1) + ' ms';
    document.getElementById('m-fps').textContent = fpsSmooth.toFixed(1);
    document.getElementById('m-samples').textContent = sampleCount;
    document.getElementById('m-sps').textContent = spsValue.toFixed(2) + ' Mpix/s';
  }

  // Benchmark
  if (benchmarkRunning) {
    const elapsed = (now - benchmarkStart) / 1000.0;
    benchmarkSamples += spp;
    if (elapsed >= 30.0) {
      benchmarkRunning = false;
      const totalPixels = benchmarkSamples * renderW * renderH;
      const score = totalPixels / 30.0 / 1e6;
      document.getElementById('bench-score').textContent = score.toFixed(1) + ' Msamples/sec';
      document.getElementById('bench-info').textContent =
        `${renderW}x${renderH} | ${benchmarkSamples} total samples | 30s | ${spp} spp/frame | ${maxBounces} bounces`;
      document.getElementById('benchmark-bar').style.display = 'block';
    }
  }

  // Convergence estimate (variance-based)
  if (frameCount % 30 === 0 && sampleCount > 10) {
    // Simple variance estimate from accumulation
    const estMSE = 1.0 / (sampleCount * 0.1 + 1.0);
    const psnr = 10.0 * Math.log10(1.0 / Math.max(estMSE, 1e-10));
    document.getElementById('m-mse').textContent = estMSE.toExponential(2);
    document.getElementById('m-psnr').textContent = psnr.toFixed(1) + ' dB';
    mseHistory.push(psnr);
    if (mseHistory.length > 150) mseHistory.shift();
    drawConvergence();
  }

  requestAnimationFrame(render);
}

function drawConvergence() {
  const w = convergenceCanvas.width = convergenceCanvas.clientWidth;
  const h = convergenceCanvas.height = convergenceCanvas.clientHeight;
  convCtx.fillStyle = '#111';
  convCtx.fillRect(0, 0, w, h);

  if (mseHistory.length < 2) return;

  const maxVal = Math.max(...mseHistory, 1);
  const minVal = Math.min(...mseHistory, 0);
  const range = maxVal - minVal || 1;

  convCtx.strokeStyle = '#76b900';
  convCtx.lineWidth = 1;
  convCtx.beginPath();
  for (let i = 0; i < mseHistory.length; i++) {
    const x = (i / (mseHistory.length - 1)) * w;
    const y = h - ((mseHistory[i] - minVal) / range) * (h - 4) - 2;
    if (i === 0) convCtx.moveTo(x, y);
    else convCtx.lineTo(x, y);
  }
  convCtx.stroke();

  convCtx.fillStyle = '#666';
  convCtx.font = '9px monospace';
  convCtx.fillText('PSNR: ' + mseHistory[mseHistory.length-1].toFixed(1) + 'dB', 4, 10);
}

// ---- Controls ----
document.getElementById('ctrl-res').addEventListener('change', resize);
document.getElementById('ctrl-spp').addEventListener('change', resetAccumulation);
document.getElementById('ctrl-bounces').addEventListener('change', resetAccumulation);
document.getElementById('ctrl-denoise').addEventListener('input', function() {
  document.getElementById('denoise-val').textContent = this.value + '%';
});
document.getElementById('ctrl-denoise-iter').addEventListener('change', resetAccumulation);

['feat-gi','feat-shadow','feat-caustic','feat-reflect','feat-nee'].forEach(id => {
  document.getElementById(id).addEventListener('change', resetAccumulation);
});

document.getElementById('btn-reset').addEventListener('click', () => {
  resetAccumulation();
  document.getElementById('benchmark-bar').style.display = 'none';
});

document.getElementById('btn-benchmark').addEventListener('click', () => {
  resetAccumulation();
  benchmarkRunning = true;
  benchmarkStart = performance.now();
  benchmarkSamples = 0;
  document.getElementById('benchmark-bar').style.display = 'block';
  document.getElementById('bench-score').textContent = 'Running...';
  document.getElementById('bench-info').textContent = '30 second benchmark in progress';
});

// ---- Init ----
window.addEventListener('resize', resize);
resize();
detectGPU();
requestAnimationFrame(render);
</script>
