<script type="module">

import { ShaderPass }     from 'three/addons/postprocessing/ShaderPass.js';

/* ============================================================
 *  电机预设 (定子 → 质量/kg 内阻/Ω 最大电流/A)
 * ============================================================ */
const MOTOR_PRESETS = {
  '0802':  { mass:0.0024,  R:0.42, maxA:6   },
  '1103':  { mass:0.0035,  R:0.22, maxA:9   },
  '1204':  { mass:0.0055,  R:0.15, maxA:14  },

  '2004':  { mass:0.018,   R:0.06, maxA:28  },
  '2205':  { mass:0.026,   R:0.05, maxA:34  },
  '2207':  { mass:0.030,   R:0.04, maxA:42  },
  '2306':  { mass:0.032,   R:0.035,maxA:45  },
  '2405':  { mass:0.031,   R:0.038,maxA:44  },
  '2807':  { mass:0.052,   R:0.025,maxA:58  },
};

/* ============================================================
 *  飞机预设 (完整参数: 轮距/电机/电池/桨/相机)
 * ============================================================ */
const CRAFT_PRESETS = {
  freestyle5: { name:'5寸花飞 (4S)',
    wheelbase:220, motor:'2306', motorKV:2400,
    battCells:4, battCap:1500, battC:95,
    propD:5.1, propP:3.6, camWt:45 },

    wheelbase:215, motor:'2207', motorKV:1800,

    propD:5.0, propP:4.3, camWt:25 },
  toothpick3: { name:'3寸牙签 (2S)',
    wheelbase:130, motor:'1404', motorKV:4500,
    battCells:2, battCap:450, battC:75,
    propD:3.0, propP:2.4, camWt:6 },
  cinewhoop3:{ name:'3寸涵道 (4S)',
    wheelbase:140, motor:'1505', motorKV:3600,
    battCells:4, battCap:850, battC:90,
    propD:3.0, propP:3.0, camWt:15 },
  whoop65:    { name:'65mm Whoop (1S)',
    wheelbase:65, motor:'0802', motorKV:19000,
    battCells:1, battCap:300, battC:60,
    propD:1.6, propP:1.2, camWt:3 },
};

/* ============================================================
 *  飞控 PID 档位 (纯PID, 不含Rates)
 * ============================================================ */
const FC_PROFILES = {
  bf:   { name:'Betaflight 标准', kp:[0.34,0.30,0.34], ki:[1.6,1.4,1.6], kd:[0.0035,0.0020,0.0035], iMax:0.35, tMax:[1.8,0.9,1.8] },
  race: { name:'Race 紧致',       kp:[0.48,0.42,0.48], ki:[2.4,2.0,2.4], kd:[0.0050,0.0028,0.0050], iMax:0.45, tMax:[2.2,1.1,2.2] },
  cine: { name:'Cinematic 柔和',  kp:[0.26,0.24,0.26], ki:[1.1,1.0,1.1], kd:[0.0026,0.0016,0.0026], iMax:0.28, tMax:[1.4,0.7,1.4] },
};

/* ============================================================
 *  Rates 预设 (Betaflight / Actual / KISS)
 * ============================================================ */
const RATES_DEFAULTS = {
  bf:     { type:'bf',     rcRP:1.45,  srRP:0.70, expRP:0.35, rcY:1.35,  srY:0.65, expY:0.30 },
  actual: { type:'actual', cenRP:220,  maxRP:760, expRP:0.55, cenY:200,  maxY:560, expY:0.50 },
  kiss:   { type:'kiss',   rcRP:1.00,  rRP:0.70,  expRP:0.25, rcY:0.90,  rY:0.60,  expY:0.20 },
};

/* ============================================================
 *  Rates 解算函数
 * ============================================================ */
function betaflightRate(stick, rcRate, superRate, expo) {
  const s = Math.abs(stick);
  const cmd = stick * s * s * s * expo + stick * (1 - expo);
  let rc = rcRate;
  if (rc > 2.0) rc += 14.54 * (rc - 2.0);
  let rate = 200 * rc * cmd;
  if (superRate > 0) rate /= THREE.MathUtils.clamp(1 - s * superRate, 0.01, 1);
  return rate;
}
function actualRate(stick, centerSens, maxRate, expo) {
  const s = Math.abs(stick);
  const expof = s * (Math.pow(stick, 5) * expo + stick * (1 - expo));
  return stick * centerSens + Math.max(0, maxRate - centerSens) * expof;
}
function kissRate(stick, rcRate, rate, expo) {
  const s = Math.abs(stick);
  const useRates = 1 / THREE.MathUtils.clamp(1 - s * rate, 0.01, 1);
  const cmd = (stick * stick * stick * expo + stick * (1 - expo)) * rcRate;
  return 200 * cmd * useRates;
}
function getRates(input) {
  const type = SETTINGS.rates.type || 'bf', R = SETTINGS.rates;
  const fn = type === 'actual' ? actualRate : type === 'kiss' ? kissRate : betaflightRate;
  const rp = type === 'actual'
    ? fn(input.pitch, R.cenRP, R.maxRP, R.expRPAc)
    : type === 'kiss'
    ? fn(input.pitch, R.rcRPk, R.rRPk, R.expRPk)
    : fn(input.pitch, R.rcRP, R.srRP, R.expRP);
  const yw = type === 'actual'
    ? fn(input.yaw, R.cenY, R.maxY, R.expYAc)
    : type === 'kiss'
    ? fn(input.yaw, R.rcYk, R.rYk, R.expYk)
    : fn(input.yaw, R.rcY, R.srY, R.expY);
  const rl = type === 'actual'
    ? fn(input.roll, R.cenRP, R.maxRP, R.expRPAc)
    : type === 'kiss'
    ? fn(input.roll, R.rcRPk, R.rRPk, R.expRPk)
    : fn(input.roll, R.rcRP, R.srRP, R.expRP);
  return { pitch: rp, yaw: yw, roll: rl };
}

function getRateMaxRP() {
  const type = SETTINGS.rates.type || 'bf', R = SETTINGS.rates;
  if (type === 'actual') return R.maxRP;
  if (type === 'kiss') return kissRate(1, R.rcRPk, R.rRPk, R.expRPk);
  return betaflightRate(1, R.rcRP, R.srRP, R.expRP);
}
function getRateMaxY() {
  const type = SETTINGS.rates.type || 'bf', R = SETTINGS.rates;
  if (type === 'actual') return R.maxY;
  if (type === 'kiss') return kissRate(1, R.rcYk, R.rYk, R.expYk);
  return betaflightRate(1, R.rcY, R.srY, R.expY);
}

/* ============================================================
 *  设置系统 (localStorage)
 * ============================================================ */
const SETTINGS_KEY = 'fpvsim_v2';
const DEFAULT_SETTINGS = {
  axes:{roll:{axis:0,invert:false},pitch:{axis:1,invert:true},throttle:{axis:2,invert:true},yaw:{axis:3,invert:false}},
  btnArm:0, btnReset:1,
  craft:'freestyle5', fc:'bf', power:'real', mode:'acro',
  build:{wheelbase:220,motor:'2306',motorKV:2400,battCells:4,battCap:1500,battC:95,propD:5.1,propP:3.6,camWt:45},
  rates:{type:'bf',rcRP:1.45,srRP:0.70,expRP:0.35,rcY:1.35,srY:0.65,expY:0.30,
    cenRP:220,maxRP:760,expRPAc:0.55,cenY:200,maxY:560,expYAc:0.50,
    rcRPk:1.00,rRPk:0.70,expRPk:0.25,rcYk:0.90,rYk:0.60,expYk:0.20},
  fx:{fisheye:55,vignette:45,scanline:35,chromatic:30},
  camTilt:28, camFov:105, vtxRange:420, volume:50, audioPos:'onboard'
};
function loadSettings() {
  const d = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  try {
    const s = JSON.parse(localStorage.getItem(SETTINGS_KEY));
    if (s) {
      for (const k in d) {
        if (k === 'axes' && s.axes) for (const ch in d.axes) if (s.axes[ch]) Object.assign(d.axes[ch], s.axes[ch]);
        else if (typeof d[k] === 'object' && s[k]) Object.assign(d[k], s[k]);
        else if (s[k] !== undefined) d[k] = s[k];
      }
    }
  } catch (e) {}
  return d;
}
let SETTINGS = loadSettings();
function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(SETTINGS)); } catch (e) {} }

/* ============================================================
 *  运行时配置 (由 applySettings 填充)
 * ============================================================ */
const RHO = 1.225; // 空气密度 kg/m³
const G = 9.81;

const CFG = {
  mass:0.65, inertia:new THREE.Vector3(0.0065,0.0095,0.0065),
  wheelbase:0.220, armL:0.078,
  propD:0.130, propP:0.091, propCt0:0.12, propCq0:0.015,
  motorKV:2400, motorKe:0, motorKt:0, motorR:0.035, motorMass:0.032, motorMaxA:45,
  battCells:4, battCapAh:1.5, battRi:0, battOcvFull:16.8,
  camWt:0.045,
  dragK:0.0055, dragLin:0.05, angDamp:0.015,
  maxThrust:38, hoverThr:0.0,
  tauMax:new THREE.Vector3(1.8,0.9,1.8),
  pid:null,
  camTilt:THREE.MathUtils.degToRad(28), camFov:105, vtxRange:420, crashSpeed:6.5,
  physHz:480, power:'real', mode:'acro', cells:4, fc:'bf'
};
CFG.pid = {
  kp:new THREE.Vector3(0.34,0.30,0.34), ki:new THREE.Vector3(1.6,1.4,1.6),
  kd:new THREE.Vector3(0.0035,0.0020,0.0035), iMax:0.35,
  tMax:new THREE.Vector3(1.8,0.9,1.8)
};

/* ============================================================
 *  SO(3) 工具
 * ============================================================ */
function expSO3(w, dt, out) {
  const wx = w.x * dt, wy = w.y * dt, wz = w.z * dt;
  const theta = Math.sqrt(wx * wx + wy * wy + wz * wz);
  if (theta < 1e-10) { out.set(1, -wz, wy, wz, 1, -wx, -wy, wx, 1); return out; }
  const x = wx / theta, y = wy / theta, z = wz / theta;
  const c = Math.cos(theta), s = Math.sin(theta), C = 1 - c;
  out.set(c+x*x*C, x*y*C-z*s, x*z*C+y*s, y*x*C+z*s, c+y*y*C, y*z*C-x*s, z*x*C-y*s, z*y*C+x*s, c+z*z*C);
  return out;
}
const _c0=new THREE.Vector3(),_c1=new THREE.Vector3(),_c2=new THREE.Vector3();
function orthonormalize(R) {
  const e=R.elements;
  _c0.set(e[0],e[1],e[2]).normalize(); _c1.set(e[3],e[4],e[5]);
  _c1.addScaledVector(_c0,-_c0.dot(_c1)).normalize(); _c2.crossVectors(_c0,_c1);
  e[0]=_c0.x;e[1]=_c0.y;e[2]=_c0.z;e[3]=_c1.x;e[4]=_c1.y;e[5]=_c1.z;e[6]=_c2.x;e[7]=_c2.y;e[8]=_c2.z;
}

/* ============================================================
 *  无人机物理 (桨叶气动 + 四电机独立动力学)
 * ============================================================ */
class Drone {
  constructor() {
    this.pos=new THREE.Vector3(); this.vel=new THREE.Vector3();
    this.R=new THREE.Matrix3(); this.w=new THREE.Vector3();
    this.integ=new THREE.Vector3(); this.prevW=new THREE.Vector3();
    this.armed=false; this.crashed=false; this.failsafe=false; this.throttle=0;
    this._dR=new THREE.Matrix3(); this._tmp=new THREE.Matrix3();
    this._v=new THREE.Vector3(); this._f=new THREE.Vector3(); this._tau=new THREE.Vector3();
    this._orthoCounter=0;
    // 四电机状态
    this.motors=[0,0,0,0];      // 归一化转速 [0,1]
    this.motorOmega=[0,0,0,0];  // rad/s
    this.motorThrust=[0,0,0,0]; // N
    this.motorCurr=[0,0,0,0];   // A
    this.totalCurrent=0;
    this.batSOC=1; this.vbat=16.8; this.vbatSmoothed=16.8;
    this._mpos=[]; this._mdir=[];
    this.reset();
  }

  reset() {
    this.pos.set(0,0.10,8); this.vel.set(0,0,0);
    this.R.identity(); this.w.set(0,0,0);
    this.integ.set(0,0,0); this.prevW.set(0,0,0);
    this.crashed=false; this.failsafe=false; this.armed=false; this.throttle=0;
    this.motors=[0,0,0,0]; this.motorOmega=[0,0,0,0];
    this.motorThrust=[0,0,0,0]; this.motorCurr=[0,0,0,0];
    this.totalCurrent=0; this.batSOC=1;
    this.vbat=CFG.battOcvFull; this.vbatSmoothed=CFG.battOcvFull;
    // 电机布局 (体轴: +X右 +Y上 -Z前, X-frame)
    const a=CFG.armL;
    this._mpos=[new THREE.Vector3( a,0,-a),new THREE.Vector3(-a,0,-a),new THREE.Vector3( a,0, a),new THREE.Vector3(-a,0, a)];
    this._mdir=[1,-1,-1,1]; // CW/CCW
  }

  _propCoeffs(omega, vAxial) {
    const n=Math.max(omega/(2*Math.PI),1); // rev/s
    const J=Math.max(0,vAxial)/(n*CFG.propD); // 进速比 (仅正向进气衰减)
    const jLim=Math.max(CFG.propP/CFG.propD,0.2);
    const ctAtt=THREE.MathUtils.clamp(1-J/jLim,0.1,1.0);
    const ct=CFG.propCt0*ctAtt;
    const cq=CFG.propCq0; // 转矩系数近似恒定
    return {ct,cq};
  }

  step(dt, input) {
    const active=this.armed&&!this.crashed&&!this.failsafe;
    const thr=active?input.throttle:0;
    this.throttle=thr;

    // ---- Rates 解算 → 目标角速度 (deg/s → rad/s) ----
    const D2R=THREE.MathUtils.degToRad;
    const tgt=this._v;
    if (!active) tgt.set(0,0,0);
    else if(CFG.mode==='angle') {
      const maxA=0.9, rts=getRates(input);
      const pA=THREE.MathUtils.clamp(rts.pitch/Math.max(getRateMaxRP(),1)*maxA,-maxA,maxA);
      const rA=THREE.MathUtils.clamp(rts.roll/Math.max(getRateMaxRP(),1)*maxA,-maxA,maxA);
      const e=this.R.elements;
      let fx=-e[6], fz=-e[8], fl=Math.hypot(fx,fz);
      if(fl<1e-3){fx=e[0];fz=e[2];fl=Math.hypot(fx,fz)||1;}
      fx/=fl;fz/=fl;
      const dU=_c1.set(fx*Math.tan(pA)-fz*Math.tan(rA),1,fz*Math.tan(pA)+fx*Math.tan(rA)).normalize();
      const cU=_c2.set(e[3],e[4],e[5]);
      const errW=_c0.crossVectors(cU,dU);
      const kA=9.0, mxR=D2R(getRateMaxRP()), mxY=D2R(getRateMaxY());
      tgt.set(
        THREE.MathUtils.clamp(kA*(e[0]*errW.x+e[1]*errW.y+e[2]*errW.z),-mxR,mxR),
        THREE.MathUtils.clamp(-D2R(rts.yaw),-mxY,mxY),
        THREE.MathUtils.clamp(kA*(e[6]*errW.x+e[7]*errW.y+e[8]*errW.z),-mxR,mxR)
      );
    } else {
      const rts=getRates(input);
      tgt.set(-D2R(rts.pitch),-D2R(rts.yaw),-D2R(rts.roll));
    }

    // ---- PID 角速度控制 → 期望力矩 ----
    const P=CFG.pid, tau=this._tau, w=this.w;
    const ex=tgt.x-w.x, ey=tgt.y-w.y, ez=tgt.z-w.z;
    if(active&&thr>0.03){
      this.integ.x=THREE.MathUtils.clamp(this.integ.x+ex*dt*P.ki.x,-P.iMax,P.iMax);
      this.integ.y=THREE.MathUtils.clamp(this.integ.y+ey*dt*P.ki.y,-P.iMax,P.iMax);
      this.integ.z=THREE.MathUtils.clamp(this.integ.z+ez*dt*P.ki.z,-P.iMax,P.iMax);
    } else this.integ.multiplyScalar(0.95);
    const dx=-(w.x-this.prevW.x)/dt, dy=-(w.y-this.prevW.y)/dt, dz=-(w.z-this.prevW.z)/dt;
    this.prevW.copy(w);
    tau.set(THREE.MathUtils.clamp(P.kp.x*ex+this.integ.x+P.kd.x*dx,-P.tMax.x,P.tMax.x),
            THREE.MathUtils.clamp(P.kp.y*ey+this.integ.y+P.kd.y*dy,-P.tMax.y,P.tMax.y),
            THREE.MathUtils.clamp(P.kp.z*ez+this.integ.z+P.kd.z*dz,-P.tMax.z,P.tMax.z));
    if(!active) tau.set(0,0,0);

    // ---- 归一化力矩 → Mixer (Airmode) ----
    const tMX=CFG.tauMax.x, tMY=CFG.tauMax.y, tMZ=CFG.tauMax.z;
    const nT=THREE.MathUtils.clamp(thr+(active?0.04:0),0,1); // 怠速5%
    const nP=tau.x/Math.max(tMX,0.001), nY=tau.y/Math.max(tMY,0.001), nR=tau.z/Math.max(tMZ,0.001);
    let m0=nT+0.25*( nP+nR+nY), m1=nT+0.25*( nP-nR-nY), m2=nT+0.25*(-nP+nR-nY), m3=nT+0.25*(-nP-nR+nY);
    // Airmode 饱和处理
    const cmd=[m0,m1,m2,m3];
    let mxV=Math.max(...cmd), mnV=Math.min(...cmd);
    if(mxV>1){const s=1/mxV;for(let i=0;i<4;i++)cmd[i]*=s;}
    if(mnV<0){const s=-mnV;for(let i=0;i<4;i++)cmd[i]=Math.min(1,cmd[i]+s);}
    for(let i=0;i<4;i++) cmd[i]=THREE.MathUtils.clamp(cmd[i],0,1);

    // ---- 电机动力学: 每步解稳态转速 + 一阶滞后 ----
    const Vbat=this.vbatSmoothed;
    const props=this._mpos; let totalThrust=0, totalCurr=0;
    // 机体轴向速度 (各桨进气近似)
    const upBody=_c1.set(0,1,0).applyMatrix3(this.R);
    const vAxial=this.vel.dot(upBody); // 桨盘轴向进气速度 (+为爬升, 推力衰减)

    for(let i=0;i<4;i++){
      const duty=cmd[i];
      const Veff=Vbat*duty;
      const Ke=CFG.motorKe, Kt=CFG.motorKt, Rm=CFG.motorR;
      const a=CFG.propCq0*RHO*Math.pow(CFG.propD,5)/(4*Math.PI*Math.PI);
      const b=Kt*Ke/Rm, c=Kt*Veff/Rm;
      let wSS=0;
      if(c>1e-12){
        const disc=Math.max(0,b*b+4*a*c);
        wSS=(-b+Math.sqrt(disc))/(2*a);
      }
      // 一阶响应
      const tauM=0.025+0.015*duty;
      const alpha=Math.min(1,dt/tauM);
      let omega=this.motorOmega[i]+(wSS-this.motorOmega[i])*alpha;
      if(omega<0)omega=0;
      this.motorOmega[i]=omega;
      this.motors[i]=omega/Math.max(wSS||1,1);

      // 推力 & 转矩
      const pc=this._propCoeffs(omega,vAxial);
      const rpm=omega/(2*Math.PI);
      const T=pc.ct*RHO*rpm*rpm*Math.pow(CFG.propD,4);
      const Q=pc.cq*RHO*rpm*rpm*Math.pow(CFG.propD,5);
      this.motorThrust[i]=T;
      totalThrust+=T;

      // 电流
      const backEMF=omega*Ke;
      const Im=(Veff-backEMF)/Rm;
      this.motorCurr[i]=Math.max(0,Im);
      totalCurr+=duty*Math.max(0,Im); // 电池端电流
    }

    // ---- 机体力矩 (来自推力位置 + 反扭) ----
    let fullTx=0,fullTz=0,fullTy=0;
    for(let i=0;i<4;i++){
      const T=this.motorThrust[i], Q=this.motorCurr[i]*CFG.motorKt*0.95;
      const p=props[i];
      fullTx+=-p.z*T; // pitch (about X)
      fullTz+= p.x*T; // roll  (about Z)
      fullTy+=this._mdir[i]*Q; // yaw (about Y, 反扭来自电机转矩)
    }
    // 气动角阻尼
    const aeroDamp=CFG.angDamp*Math.pow(CFG.wheelbase,2)*0.25;

    // ---- 角速度积分 ----
    const I=CFG.inertia, Iw=_c0.set(I.x*w.x,I.y*w.y,I.z*w.z);
    const gyro=_c1.crossVectors(w,Iw);
    w.x+=(fullTx-aeroDamp*w.x-gyro.x)/I.x*dt;
    w.y+=(fullTy-aeroDamp*w.y-gyro.y)/I.y*dt;
    w.z+=(fullTz-aeroDamp*w.z-gyro.z)/I.z*dt;

    // ---- 姿态积分 ----
    expSO3(w,dt,this._dR); this._tmp.multiplyMatrices(this.R,this._dR); this.R.copy(this._tmp);
    if(++this._orthoCounter>=24){orthonormalize(this.R);this._orthoCounter=0;}

    // ---- 平移 ----
    const up=_c1.set(0,1,0).applyMatrix3(this.R);
    const force=up.clone().multiplyScalar(totalThrust);
    force.y-=CFG.mass*G;
    const spd=this.vel.length();
    force.addScaledVector(this.vel,-(CFG.dragK*spd+CFG.dragLin));
    this.vel.addScaledVector(force,dt/CFG.mass);
    this.pos.addScaledVector(this.vel,dt);

    // ---- 电池 ----
    this.totalCurrent=totalCurr;
    const ampS=totalCurr/3600;
    this.batSOC=Math.max(0,this.batSOC-ampS*dt/CFG.battCapAh);
    const ocvCell=3.50+0.70*this.batSOC+0.25*this.batSOC*this.batSOC*(1-this.batSOC);
    const ocv=CFG.battCells*ocvCell;
    const Ri=CFG.battRi;
    this.vbat=ocv-totalCurr*Ri;
    const lp=0.08;
    this.vbatSmoothed+=Math.min(1,dt/lp)*(this.vbat-this.vbatSmoothed);

    // ---- 地面接触 ----
    if(this.pos.y<0.10){
      const impact=this.vel.length();
      this.pos.y=0.10;
      if(this.armed&&impact>CFG.crashSpeed){this.crashed=true;this.armed=false;}
      if(this.vel.y<0)this.vel.y=0;
      this.vel.x*=0.94;this.vel.z*=0.94;
      this.w.multiplyScalar(0.90);
      if(this.crashed)this.vel.multiplyScalar(0.8);
    }

    // ---- 声音用 (归一化转速比例) ----
    for(let i=0;i<4;i++) this.motors[i]=THREE.MathUtils.clamp(cmd[i],0,1);
  }
}

/* ============================================================
 *  applySettings: 从设置计算所有运行时参数
 * ============================================================ */
function applySettings() {
  // 飞机参数
  const craft=S['craft'];
  const b=S.build;
  CFG.wheelbase=b.wheelbase/1000;
  CFG.armL=CFG.wheelbase*Math.SQRT2*0.25;
  const mp=MOTOR_PRESETS[b.motor]||MOTOR_PRESETS['2306'];
  CFG.motorKV=b.motorKV; CFG.motorR=mp.R; CFG.motorMass=mp.mass; CFG.motorMaxA=mp.maxA;
  CFG.motorKe=60/(2*Math.PI*CFG.motorKV);
  CFG.motorKt=CFG.motorKe;
  CFG.propD=b.propD*0.0254; CFG.propP=b.propP*0.0254;
  const pd=CFG.propP/CFG.propD;
  CFG.propCt0=THREE.MathUtils.clamp(0.08+0.06*pd,0.09,0.15);
  CFG.propCq0=THREE.MathUtils.clamp(0.008+0.010*pd,0.010,0.018);
  CFG.battCells=b.battCells; CFG.battCapAh=b.battCap/1000; CFG.battRi=CFG.battCells*0.35/(CFG.battCapAh*b.battC);
  CFG.battOcvFull=b.battCells*4.20;
  CFG.camWt=b.camWt/1000;
  // 质量 (kg): 机架幂律 + 电调/飞控/图传电子件 + 电机×4 + 桨×4 + 电池 + 相机
  const frameMass=(10+Math.pow(b.wheelbase,1.9)*0.0035)/1000;
  const elecMass=0.008+0.012*Math.min(1,b.wheelbase/220);
  const battMass=0.030*CFG.battCapAh*CFG.battCells+0.015;
  const propMass=0.0002*Math.pow(b.propD,2)*4;
  CFG.mass=frameMass+elecMass+CFG.motorMass*4+battMass+propMass+CFG.camWt;
  // 惯量: 电机在臂端 + 机架分布 + 相机在机头
  const r=CFG.wheelbase*0.5, mEnd=CFG.motorMass+propMass*0.25;
  const Ixx=4*mEnd*CFG.armL*CFG.armL+frameMass*r*r*0.4+CFG.camWt*r*r*0.5+2e-5;
  const Iyy=4*mEnd*r*r+frameMass*r*r*0.5+3e-5;
  const Izz=Ixx;
  CFG.inertia.set(Ixx,Iyy,Izz);
  // 拖动
  CFG.dragK=0.004+0.02*CFG.wheelbase;
  CFG.dragLin=0.05;
  CFG.angDamp=0.012+0.05*CFG.wheelbase;
  // 最大推力估算 (标称电压, 静止)
  const Vnom=CFG.battCells*3.85;
  const a0=CFG.propCq0*RHO*Math.pow(CFG.propD,5)/(4*Math.PI*Math.PI);
  const b0=CFG.motorKt*CFG.motorKe/CFG.motorR;
  const c0=CFG.motorKt*Vnom/CFG.motorR;
  const disc=Math.max(0,b0*b0+4*a0*c0);
  const wMax=(-b0+Math.sqrt(disc))/(2*a0);
  const rpmMax=wMax/(2*Math.PI);
  const TperMotor=CFG.propCt0*RHO*rpmMax*rpmMax*Math.pow(CFG.propD,4);
  CFG.maxThrust=TperMotor*4;
  CFG.hoverThr=Math.sqrt(CFG.mass*G/Math.max(CFG.maxThrust,0.1));
  // 最大力矩
  const tPitch=2*TperMotor*CFG.armL;
  const tRoll=tPitch;
  const QperMotor=CFG.propCq0*RHO*rpmMax*rpmMax*Math.pow(CFG.propD,5);
  const tYaw=QperMotor*2;
  CFG.tauMax.set(tPitch,tYaw,tRoll);
  // PID (增益随惯量归一化, 全机型仿真验证稳定)
  const f=FC_PROFILES[S.fc]||FC_PROFILES.bf;
  const k=Ixx/0.0017;
  CFG.pid.kp.set(f.kp[0]*k,f.kp[1]*k,f.kp[2]*k);
  CFG.pid.ki.set(f.ki[0]*k,f.ki[1]*k,f.ki[2]*k);
  CFG.pid.kd.set(f.kd[0]*k,f.kd[1]*k,f.kd[2]*k);
  CFG.pid.iMax=f.iMax*k;
  CFG.pid.tMax.set(tPitch,tYaw,tRoll);
  // 通用
  CFG.power=S.power; CFG.mode=S.mode; CFG.vtxRange=S.vtxRange; CFG.fc=S.fc;
  CFG.cells=b.battCells;
  CFG.camTilt=THREE.MathUtils.degToRad(S.camTilt);
  _qt.setFromAxisAngle(_XUP,CFG.camTilt);
  camera.fov=S.camFov; camera.updateProjectionMatrix();
}

const DEADBAND=0.02;
const input={roll:0,pitch:0,yaw:0,throttle:0,gamepad:false,name:'',rawAxes:null};
const keys={};
let armToggleLatch=false, resetLatch=false;
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Enter')toggleArm();
  if(e.code==='KeyR')doReset();
  if(e.code==='Escape')toggleMenu();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('gamepadconnected',e=>{input.name=e.gamepad.id;});
addEventListener('gamepaddisconnected',()=>{input.name='';});
function readAxis(gp,map){
  let v=gp.axes[map.axis]??0;
  if(map.invert)v=-v;
  if(Math.abs(v)<DEADBAND)v=0;
  return THREE.MathUtils.clamp(v,-1,1);
}
let kbThrottle=0;
function pollInput(dt){
  const pads=navigator.getGamepads?navigator.getGamepads():[];
  let gp=null;
  for(const p of pads)if(p&&p.connected&&p.axes.length>=4){gp=p;break;}
  if(gp){
    input.gamepad=true;input.name=gp.id;input.rawAxes=gp.axes;
    const A=S.axes;
    input.roll=readAxis(gp,A.roll); input.pitch=readAxis(gp,A.pitch); input.yaw=readAxis(gp,A.yaw);
    let t=gp.axes[A.throttle.axis]??-1;
    if(A.throttle.invert)t=-t;
    input.throttle=THREE.MathUtils.clamp((t+1)*0.5,0,1);
    if(gp.buttons[S.btnArm]?.pressed){if(!armToggleLatch){toggleArm();armToggleLatch=true;}}
    else armToggleLatch=false;
    if(gp.buttons[S.btnReset]?.pressed){if(!resetLatch){doReset();resetLatch=true;}}
    else resetLatch=false;
  }else{
    input.gamepad=false;input.rawAxes=null;
    const rate=5.0*dt;
    const tgt=(p,m)=>(keys[p]?1:0)-(keys[m]?1:0);
    input.pitch=approach(input.pitch,tgt('ArrowUp','ArrowDown'),rate);
    input.roll=approach(input.roll,tgt('ArrowRight','ArrowLeft'),rate);
    input.yaw=approach(input.yaw,tgt('KeyD','KeyA'),rate);
    kbThrottle=THREE.MathUtils.clamp(kbThrottle+tgt('KeyW','KeyS')*0.9*dt,0,1);
    input.throttle=kbThrottle;
  }
}
function approach(cur,tgt,rate){if(cur<tgt)return Math.min(cur+rate,tgt);if(cur>tgt)return Math.max(cur-rate,tgt);return cur;}

    uniform sampler2D tDiffuse;
    uniform float uFisheye, uVignette, uScanline, uChromatic;
    uniform vec2 uResolution;
    varying vec2 vUv;
    void main(){
      vec2 dc=vUv-0.5;
      float r=length(dc);
      // 桶形畸变 (鱼眼)
      float k=uFisheye*0.65;
      float factor=1.0+k*r*r;
      vec2 uvD=0.5+dc*factor;
      // 色散 (chromatic aberration)
      float ca=uChromatic*0.012;
      // 暗角 (光学渐晕)
      float vig=1.0-uVignette*dot(dc,dc)*4.2;
      vig=clamp(vig,0.0,1.0);
      vig=smoothstep(0.0,1.0,vig);
      // 屏幕边缘裁剪
      if(uvD.x<0.0||uvD.x>1.0||uvD.y<0.0||uvD.y>1.0){
        gl_FragColor=vec4(0.0,0.0,0.0,1.0);return;
      }
      vec2 uvR=uvD+vec2(ca*r,0.0);
      vec2 uvB=uvD-vec2(ca*r,0.0);
      float rC=texture2D(tDiffuse,clamp(uvR,0.0,1.0)).r;
      float gC=texture2D(tDiffuse,clamp(uvD,0.0,1.0)).g;
      float bC=texture2D(tDiffuse,clamp(uvB,0.0,1.0)).b;
      vec3 col=vec3(rC,gC,bC);
      // 暗角
      col*=vig;
      // 高频扫描线 (幅度受控, 0=关闭)
      float sl=1.0-uScanline*0.12*(0.5+0.5*sin(vUv.y*uResolution.y*3.14159));
      col*=sl;
      // 镜头边缘压暗
      float edge=1.0-smoothstep(0.0,1.0,r)*0.15;
      col*=edge;
      gl_FragColor=vec4(col,1.0);
    }`
};

/* ============================================================
 *  VTX 模拟图传衰弱 Shader (滚动条/撕裂/雪花/闪烁)
 * ============================================================ */
const VTXShader = {
  uniforms: {
    tDiffuse:{value:null}, uTime:{value:0}, uSignal:{value:1},
    uResolution:{value:new THREE.Vector2(innerWidth,innerHeight)}
  },
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
    uniform sampler2D tDiffuse;uniform float uTime,uSignal;uniform vec2 uResolution;varying vec2 vUv;
    float hash(vec2 p){p=fract(p*vec2(443.897,441.423));p+=dot(p,p.yx+19.19);return fract((p.x+p.y)*p.x);}
    void main(){
      float s=clamp(uSignal,0.0,1.0);float bad=1.0-s;vec2 uv=vUv;
      float frameT=floor(uTime*60.0);
      float tearAmt=smoothstep(0.55,0.10,s);
      float row=floor(uv.y*uResolution.y/3.0);
      float gate=step(1.0-0.55*tearAmt,hash(vec2(row*0.731,frameT*0.517)));
      float tear=(hash(vec2(row,frameT))-0.5)*0.55*tearAmt*gate;
      float bigGate=step(1.0-0.25*tearAmt,hash(vec2(frameT,7.77)));
      float bigBand=step(hash(vec2(frameT,3.3)),uv.y)*step(uv.y,hash(vec2(frameT,3.3))+0.22);
      tear+=bigGate*bigBand*(hash(vec2(frameT,9.1))-0.5)*0.8*tearAmt;
      uv.x=fract(uv.x+tear);
      float roll1=fract(uv.y*1.35+uTime*(0.35+bad*1.4));
      float roll2=fract(uv.y*0.6-uTime*0.9+0.37);
      float band=smoothstep(0.00,0.10,roll1)*smoothstep(0.28,0.14,roll1)+0.6*smoothstep(0.0,0.06,roll2)*smoothstep(0.16,0.08,roll2);
      float bandAmt=smoothstep(0.5,0.12,s);
      vec3 col=texture2D(tDiffuse,uv).rgb;
      float lum=dot(col,vec3(0.299,0.587,0.114));
      col=mix(vec3(lum),col,mix(0.15,1.0,smoothstep(0.05,0.75,s)));
      float noiseAmt=0.035+bad*bad*1.1;
      float lineN=hash(vec2(floor(uv.y*uResolution.y),frameT));
      float pixN=hash(uv*uResolution.xy+fract(uTime)*1e3);
      float streak=step(0.985-bad*0.12,lineN);
      col=mix(col,vec3(pixN),clamp(noiseAmt,0.0,1.0));
      col+=streak*(pixN*0.8+0.2)*(0.15+bad*0.6);
      col*=1.0-clamp(band,0.0,1.0)*bandAmt*0.85;
      float lost=smoothstep(0.045,0.0,s);
      col=mix(col,vec3(pixN)*(0.75+0.25*lineN),lost);
      gl_FragColor=vec4(col,1.0);
    }`
};

/* ---- 合成器: Render→FishEye→VTX ---- */

composer.addPass(new RenderPass(scene,camera));
const fishEyePass=new ShaderPass(FishEyeShader);
composer.addPass(fishEyePass);
const vtxPass=new ShaderPass(VTXShader);
composer.addPass(vtxPass);

/* ============================================================
 *  桨叶/电机声音 (Web Audio)
 * ============================================================ */
class SoundEngine {
  constructor(){this.ctx=null;}
  init(){
    if(this.ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const ctx=this.ctx=new AC();this.master=ctx.createGain();this.master.gain.value=0;
    const comp=ctx.createDynamicsCompressor();this.master.connect(comp);comp.connect(ctx.destination);
    this.units=[];
    for(let i=0;i<4;i++){
      const g=ctx.createGain();g.gain.value=0;
      const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2800;lp.Q.value=0.6;
      g.connect(lp);lp.connect(this.master);
      const o1=ctx.createOscillator();o1.type='sawtooth';o1.frequency.value=60;
      const g1=ctx.createGain();g1.gain.value=1.0;
      const o2=ctx.createOscillator();o2.type='triangle';o2.frequency.value=121;
      const g2=ctx.createGain();g2.gain.value=0.55;
      o1.detune.value=(Math.random()-0.5)*16;o2.detune.value=(Math.random()-0.5)*22;
      o1.connect(g1);g1.connect(g);o2.connect(g2);g2.connect(g);o1.start();o2.start();
      this.units.push({o1,o2,g});
    }
    const len=ctx.sampleRate*2;const buf=ctx.createBuffer(1,len,ctx.sampleRate);const data=buf.getChannelData(0);
    for(let i=0;i<len;i++)data[i]=Math.random()*2-1;
    const noise=ctx.createBufferSource();noise.buffer=buf;noise.loop=true;
    this.bp=ctx.createBiquadFilter();this.bp.type='bandpass';this.bp.frequency.value=900;this.bp.Q.value=0.7;
    this.nGain=ctx.createGain();this.nGain.gain.value=0;
    noise.connect(this.bp);this.bp.connect(this.nGain);this.nGain.connect(this.master);noise.start();
  }
  update(motors,pitchScale,vol,speed){
    if(!this.ctx||this.ctx.state!=='running')return;const t=this.ctx.currentTime,k=0.035;let avg=0;
    for(let i=0;i<4;i++){const m=motors[i];avg+=m*0.25;const u=this.units[i];
     const f=(58+560*m)*pitchScale;u.o1.frequency.setTargetAtTime(f,t,k);
     u.o2.frequency.setTargetAtTime(f*2.03,t,k);u.g.gain.setTargetAtTime(0.085*Math.pow(m,1.35),t,k);}
    this.bp.frequency.setTargetAtTime(Math.min(9000,500+4500*avg*pitchScale),t,k);
    this.nGain.gain.setTargetAtTime(0.30*avg*avg+0.10*Math.min(1,speed/30),t,k);
    this.master.gain.setTargetAtTime(vol,t,0.06);
  }
}
const sound=new SoundEngine();
function ensureAudio(){sound.init();if(sound.ctx&&sound.ctx.state==='suspended')sound.ctx.resume();}
addEventListener('pointerdown',ensureAudio);addEventListener('keydown',ensureAudio);

function onMenuChange(e){

  if(ds.kind==='inv'){S.axes[ds.ch].invert=t.checked;applySettings();saveSettings();return;}
  // Standard IDs
  switch(t.id){
    case 'btnArm':S.btnArm=+t.value;break;case 'btnReset':S.btnReset=+t.value;break;
    case 'selCraft':
      {const v=t.value;S.craft=v;
      if(CRAFT_PRESETS[v]){Object.assign(S.build,CRAFT_PRESETS[v]);applySettings();saveSettings();buildMenu();return;}
      else{S.craft='custom';break;}}
    case 'selFc':S.fc=t.value;break;case 'selMode':S.mode=t.value;break;
    case 'selAudio':S.audioPos=t.value;break;
    case 'rngTilt':S.camTilt=+t.value;break;case 'rngFov':S.camFov=+t.value;break;
    case 'rngVtx':S.vtxRange=+t.value;break;case 'rngVol':S.volume=+t.value;break;
    // Build
    case 'b_wb':S.build.wheelbase=+t.value;S.craft='custom';break;
    case 'b_motor':S.build.motor=t.value;S.craft='custom';break;
    case 'b_kv':S.build.motorKV=+t.value;S.craft='custom';break;
    case 'b_cells':S.build.battCells=+t.value;S.craft='custom';break;
    case 'b_cap':S.build.battCap=+t.value;S.craft='custom';break;
    case 'b_cr':S.build.battC=+t.value;S.craft='custom';break;
    case 'b_pd':S.build.propD=+t.value;S.craft='custom';break;
    case 'b_pp':S.build.propP=+t.value;S.craft='custom';break;
    case 'b_cam':S.build.camWt=+t.value;S.craft='custom';break;
    // Rates (BF)
    case 'rate_rcRP':S.rates.rcRP=+t.value;break;case 'rate_srRP':S.rates.srRP=+t.value;break;
    case 'rate_expRP':S.rates.expRP=+t.value;break;case 'rate_rcY':S.rates.rcY=+t.value;break;
    case 'rate_srY':S.rates.srY=+t.value;break;case 'rate_expY':S.rates.expY=+t.value;break;
    // Rates (Actual)
    case 'rate_cenRP':S.rates.cenRP=+t.value;break;case 'rate_maxRP':S.rates.maxRP=+t.value;break;
    case 'rate_expRPAc':S.rates.expRPAc=+t.value;break;case 'rate_cenY':S.rates.cenY=+t.value;break;
    case 'rate_maxY':S.rates.maxY=+t.value;break;case 'rate_expYAc':S.rates.expYAc=+t.value;break;
    // Rates (KISS)
    case 'rate_rcRPk':S.rates.rcRPk=+t.value;break;case 'rate_rRPk':S.rates.rRPk=+t.value;break;
    case 'rate_expRPk':S.rates.expRPk=+t.value;break;case 'rate_rcYk':S.rates.rcYk=+t.value;break;
    case 'rate_rYk':S.rates.rYk=+t.value;break;case 'rate_expYk':S.rates.expYk=+t.value;break;
    // FX
    case 'fx_fish':S.fx.fisheye=+t.value;break;case 'fx_vig':S.fx.vignette=+t.value;break;
    case 'fx_scan':S.fx.scanline=+t.value;break;case 'fx_ca':S.fx.chromatic=+t.value;break;
    default:return;
  }
  applySettings();saveSettings();syncLabels();updateBuildStats();updateRateDisplay();
}

function updateMenuLive(){
  for(const ch of['roll','pitch','yaw','throttle']){
    const v=ch==='throttle'?input.throttle*2-1:input[ch];
    const bar=document.getElementById('axb_'+ch),num=document.getElementById('axn_'+ch);
    if(bar)bar.style.width=((v+1)*50).toFixed(1)+'%';
    if(num)num.textContent=(v>=0?'+':'')+v.toFixed(2);
  }
  const mon=document.getElementById('axMon');
  if(mon)mon.textContent=input.rawAxes?'原始轴值: '+Array.from(input.rawAxes).map((v,i)=>`[${i}] ${v.toFixed(2)}`).join('  '):'未检测到遥控器 (键盘模式) — 连接后拨动摇杆以识别轴号';
}

/* ============================================================
 *  主循环
 * ============================================================ */
const drone=new Drone();
const HOME=new THREE.Vector3(0,0,8);

function toggleArm(){if(drone.crashed||drone.failsafe)return;if(!drone.armed&&input.throttle>0.12)return;ensureAudio();drone.armed=!drone.armed;}
function doReset(){drone.reset();kbThrottle=0;}

const _m4=new THREE.Matrix4(),_q=new THREE.Quaternion(),_XUP=new THREE.Vector3(1,0,0),_qt=new THREE.Quaternion();
function syncCamera(){
  camera.position.copy(drone.pos);_m4.setFromMatrix3(drone.R);_q.setFromRotationMatrix(_m4);
  camera.quaternion.copy(_q).multiply(_qt);skyMesh.position.copy(drone.pos);
}

const $=id=>document.getElementById(id);
const el={rssiTxt:$('rssiTxt'),rssiBar:$('rssiBar'),distTxt:$('distTxt'),altTxt:$('altTxt'),spdTxt:$('spdTxt'),
  thrTxt:$('thrTxt'),thrBar:$('thrBar'),gpTxt:$('gpTxt'),msgTxt:$('msgTxt'),batTxt:$('batTxt'),ampTxt:$('ampTxt')};

function updateOSD(signal,dist){
  el.rssiTxt.textContent=Math.round(-40-(1-signal)*60)+' dBm';
  el.rssiBar.style.width=(signal*100).toFixed(0)+'%';
  el.rssiBar.style.background=signal>0.4?'#aaffaa':(signal>0.15?'#ffd54f':'#ff5252');
  el.distTxt.textContent=dist.toFixed(0);el.altTxt.textContent=drone.pos.y.toFixed(1);
  el.spdTxt.textContent=(drone.vel.length()*3.6).toFixed(0);
  el.batTxt.textContent=drone.vbat.toFixed(1);el.batTxt.style.color=drone.vbat<3.55*CFG.cells?'#ff5252':'';
  el.ampTxt.textContent=drone.totalCurrent.toFixed(1);
  el.thrTxt.textContent=Math.round(input.throttle*100);el.thrBar.style.width=(input.throttle*100).toFixed(0)+'%';
  el.gpTxt.textContent=input.gamepad?('TX: '+input.name.slice(0,40)):'未检测到遥控器 — 使用键盘模式';
  if(drone.failsafe)el.msgTxt.innerHTML='FAILSAFE<div class="sub">图传信号丢失 — 按 R 复位</div>';
  else if(drone.crashed)el.msgTxt.innerHTML='CRASHED<div class="sub">按 R / 手柄按键1 复位</div>';
  else if(!drone.armed)el.msgTxt.innerHTML='DISARMED<div class="sub">油门归零后按 ENTER / 手柄按键0 解锁</div>';
  else el.msgTxt.innerHTML='';
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);vtxPass.uniforms.uResolution.value.set(innerWidth,innerHeight);
  fishEyePass.uniforms.uResolution.value.set(innerWidth,innerHeight);
});

applySettings();
const PHYS_DT=1/CFG.physHz;
let last=performance.now(),acc=0,elapsed=0;

function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-last)/1000;last=now;dt=Math.min(dt,0.1);elapsed+=dt;
  pollInput(dt);
  acc+=dt;
  while(acc>=PHYS_DT){drone.step(PHYS_DT,input);acc-=PHYS_DT;}
  const dist=drone.pos.distanceTo(HOME);
  const signal=THREE.MathUtils.clamp(1-dist/CFG.vtxRange,0,1);
  if(dist>CFG.vtxRange&&!drone.failsafe){drone.failsafe=true;drone.armed=false;}
  syncCamera();
  // 图传特效更新
  fishEyePass.uniforms.uFisheye.value=S.fx.fisheye/100;
  fishEyePass.uniforms.uVignette.value=S.fx.vignette/100;
  fishEyePass.uniforms.uScanline.value=S.fx.scanline/100;
  fishEyePass.uniforms.uChromatic.value=S.fx.chromatic/100;
  vtxPass.uniforms.uTime.value=elapsed;
  vtxPass.uniforms.uSignal.value=drone.failsafe?0:signal;
  // 声音: 基于实际转速调制 (propD 决定 pitch scale)
  const pitchScale=1.0+Math.pow(5.1/Math.max(S.build.propD,1),0.5)*0.6;
  const distAtt=S.audioPos==='ground'?1/(1+Math.pow(dist/18,1.8)):1;
  sound.update(drone.motors,pitchScale,(S.volume/100)*distAtt,drone.vel.length());
  updateOSD(signal,dist);
  if(menuOpen)updateMenuLive();
  composer.render();
}
requestAnimationFrame(loop);
</script>
