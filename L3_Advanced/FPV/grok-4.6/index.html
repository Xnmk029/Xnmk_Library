<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FPV 穿越机花飞模拟器 — SO(3) Acro</title>
<style>
  :root {
    --bg: #07090d;
    --panel: rgba(8, 12, 18, 0.92);
    --line: rgba(0, 230, 180, 0.35);
    --accent: #00e6b4;
    --warn: #ffb020;
    --danger: #ff3b4e;
    --text: #d8e8e4;
    --muted: #7a908c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  #view { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  #osd {
    position: fixed; inset: 0; pointer-events: none;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 2px #000, 0 0 8px #000;
  }
  #crosshair {
    position: absolute; left: 50%; top: 50%; width: 28px; height: 28px;
    margin: -14px 0 0 -14px; border: 1px solid rgba(0,230,180,.55);
    border-radius: 50%;
  }
  #crosshair::before, #crosshair::after {
    content: ""; position: absolute; background: rgba(0,230,180,.7);
  }
  #crosshair::before { left: 50%; top: 4px; bottom: 4px; width: 1px; margin-left: -0.5px; }
  #crosshair::after { top: 50%; left: 4px; right: 4px; height: 1px; margin-top: -0.5px; }
  .osd-tl, .osd-tr, .osd-bl, .osd-br, .osd-bc {
    position: absolute; font-size: 13px; letter-spacing: 0.04em; line-height: 1.55;
  }
  .osd-tl { top: 14px; left: 16px; }
  .osd-tr { top: 14px; right: 16px; text-align: right; }
  .osd-bl { bottom: 16px; left: 16px; }
  .osd-br { bottom: 16px; right: 16px; text-align: right; }
  .osd-bc { bottom: 18px; left: 50%; transform: translateX(-50%); text-align: center; }
  .ok { color: var(--accent); }
  .warn { color: var(--warn); }
  .bad { color: var(--danger); }
  #thr-bar {
    position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
    width: 8px; height: 160px; background: rgba(0,0,0,.45);
    border: 1px solid rgba(0,230,180,.35); pointer-events: none;
  }
  #thr-fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); }
  #sig-bar {
    position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
    width: 8px; height: 160px; background: rgba(0,0,0,.45);
    border: 1px solid rgba(255,176,32,.35); pointer-events: none;
  }
  #sig-fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--warn); }
  #help {
    position: fixed; left: 50%; top: 22px; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--line); padding: 10px 16px;
    font-size: 12px; color: var(--muted); pointer-events: none; border-radius: 6px;
    text-align: center; line-height: 1.5;
  }
  #fail-banner {
    display: none; position: fixed; inset: 0; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; background: #000; color: #f44;
    font-size: 28px; letter-spacing: 0.3em; z-index: 5; pointer-events: none;
  }
  #menu {
    display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(920px, 96vw); max-height: 88vh; overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px 20px 16px; z-index: 8; pointer-events: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
  }
  #menu h2 { font-size: 16px; color: var(--accent); margin-bottom: 12px; font-weight: 600; }
  #menu h3 { font-size: 13px; color: var(--warn); margin: 14px 0 8px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; }
  .row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .row label { width: 92px; color: var(--muted); flex-shrink: 0; }
  .row input[type="range"] { flex: 1; accent-color: var(--accent); }
  .row select, .row input[type="number"] {
    background: #10161c; color: var(--text); border: 1px solid #2a3a40; border-radius: 4px; padding: 3px 6px;
  }
  .row .val { width: 52px; text-align: right; color: var(--accent); font-variant-numeric: tabular-nums; }
  .btns { display: flex; gap: 8px; margin-top: 14px; }
  button {
    background: #10221e; color: var(--accent); border: 1px solid var(--line);
    padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
  }
  button:hover { background: #16352e; }
  #menu-btn {
    position: fixed; top: 12px; right: 12px; z-index: 6; pointer-events: auto;
  }
  .chk { width: auto !important; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="osd">
  <div id="crosshair"></div>
  <div class="osd-tl" id="osd-tl"></div>
  <div class="osd-tr" id="osd-tr"></div>
  <div class="osd-bl" id="osd-bl"></div>
  <div class="osd-br" id="osd-br"></div>
  <div class="osd-bc" id="osd-bc"></div>
  <div id="thr-bar"><div id="thr-fill"></div></div>
  <div id="sig-bar"><div id="sig-fill"></div></div>
</div>
<div id="help">Tab 设置 · Space 解锁 · R 重置 · C 视角 · WASD 俯仰/横滚 · QE 偏航 · Shift/Ctrl 油门 · 点击画面锁定鼠标</div>
<div id="fail-banner">失联 FAILSAFE<div style="font-size:14px;letter-spacing:0.12em;color:#888">按 R 重置回起飞点</div></div>
<button id="menu-btn" type="button">设置 (Tab)</button>
<div id="menu">
  <h2>飞控 / 通道 / 气动 设置</h2>
  <h3>手柄通道绑定（Gamepad axes）</h3>
  <div class="grid" id="ch-grid"></div>
  <h3>PID 角速度环（力矩输出）</h3>
  <div class="grid" id="pid-grid"></div>
  <h3>气动与物理</h3>
  <div class="grid" id="aero-grid"></div>
  <h3>图传 VTX</h3>
  <div class="grid" id="vtx-grid"></div>
  <div class="btns">
    <button type="button" id="btn-close">关闭</button>
    <button type="button" id="btn-reset-cfg">恢复默认参数</button>
    <button type="button" id="btn-reset-craft">重置飞机</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
<script>
(function () {
  "use strict";

  /* ============================================================
     SO(3) / so(3) 刚体数学
     姿态 R ∈ SO(3)，p_world = R p_body
     列向量：body-X 右, body-Y 上(推力), body-Z 前
     运动学：Ṙ = R [ω]_×   ω ∈ ℝ³ 为机体系角速度
     积分：  R ← R · exp([ω Δt]_×)
     exp: Rodrigues  I + (sinθ/θ)K + ((1-cosθ)/θ²)K² , K=[θ]_×
     ============================================================ */
  function m3id() { return new Float64Array([1, 0, 0, 0, 1, 0, 0, 0, 1]); }
  function m3mul(a, b, out) {
    const t = out === a || out === b ? new Float64Array(9) : out;
    for (let i = 0; i < 3; i++) {
      const i3 = i * 3;
      for (let j = 0; j < 3; j++) {
        t[i3 + j] = a[i3] * b[j] + a[i3 + 1] * b[3 + j] + a[i3 + 2] * b[6 + j];
      }
    }
    if (t !== out) out.set(t);
    return out;
  }
  function so3exp(wx, wy, wz, dt, out) {
    const tx = wx * dt, ty = wy * dt, tz = wz * dt;
    const theta2 = tx * tx + ty * ty + tz * tz;
    if (theta2 < 1e-16) {
      out[0] = 1; out[1] = -tz; out[2] = ty;
      out[3] = tz; out[4] = 1; out[5] = -tx;
      out[6] = -ty; out[7] = tx; out[8] = 1;
      return out;
    }
    const theta = Math.sqrt(theta2);
    const s = Math.sin(theta) / theta;
    const c = (1 - Math.cos(theta)) / theta2;
    out[0] = 1 + c * (tx * tx - theta2);
    out[1] = -s * tz + c * tx * ty;
    out[2] = s * ty + c * tx * tz;
    out[3] = s * tz + c * ty * tx;
    out[4] = 1 + c * (ty * ty - theta2);
    out[5] = -s * tx + c * ty * tz;
    out[6] = -s * ty + c * tz * tx;
    out[7] = s * tx + c * tz * ty;
    out[8] = 1 + c * (tz * tz - theta2);
    return out;
  }
  function orthonormalize(R) {
    let x0 = R[0], x1 = R[3], x2 = R[6];
    let y0 = R[1], y1 = R[4], y2 = R[7];
    let inv = 1 / (Math.hypot(x0, x1, x2) || 1);
    x0 *= inv; x1 *= inv; x2 *= inv;
    const d = x0 * y0 + x1 * y1 + x2 * y2;
    y0 -= d * x0; y1 -= d * x1; y2 -= d * x2;
    inv = 1 / (Math.hypot(y0, y1, y2) || 1);
    y0 *= inv; y1 *= inv; y2 *= inv;
    const z0 = x1 * y2 - x2 * y1;
    const z1 = x2 * y0 - x0 * y2;
    const z2 = x0 * y1 - x1 * y0;
    R[0] = x0; R[3] = x1; R[6] = x2;
    R[1] = y0; R[4] = y1; R[7] = y2;
    R[2] = z0; R[5] = z1; R[8] = z2;
  }
  function applyPose(obj, p, R) {
    obj.matrixAutoUpdate = false;
    const e = obj.matrix.elements;
    e[0] = R[0]; e[1] = R[3]; e[2] = R[6]; e[3] = 0;
    e[4] = R[1]; e[5] = R[4]; e[6] = R[7]; e[7] = 0;
    e[8] = R[2]; e[9] = R[5]; e[10] = R[8]; e[11] = 0;
    e[12] = p.x; e[13] = p.y; e[14] = p.z; e[15] = 1;
  }
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  function expo(x, e) { return (1 - e) * x + e * x * x * x; }
  function dead(x, d) { const ax = Math.abs(x); if (ax < d) return 0; return Math.sign(x) * (ax - d) / (1 - d); }

  /* ----------------------------- 配置 ----------------------------- */
  const DEFAULTS = {
    ch: {
      roll: { axis: 2, inv: false },
      pitch: { axis: 3, inv: true },
      yaw: { axis: 0, inv: false },
      throttle: { axis: 1, inv: true }
    },
    deadzone: 0.05,
    stickExpo: 0.35,
    maxRate: { roll: 8.5, pitch: 8.5, yaw: 6.2 },
    pid: {
      roll: { kp: 0.085, ki: 0.055, kd: 0.0022 },
      pitch: { kp: 0.085, ki: 0.055, kd: 0.0022 },
      yaw: { kp: 0.055, ki: 0.040, kd: 0.0006 }
    },
    iLim: 0.35,
    mass: 0.62,
    drag: 0.038,
    angDrag: 0.004,
    maxThrust: 17.5,
    gravity: 9.81,
    arm: 0.095,
    kYaw: 0.018,
    Ixx: 0.0028,
    Iyy: 0.0046,
    Izz: 0.0028,
    vtxRange: 75,
    vtxFail: 115,
    vtxKnee: 1.35
  };
  let cfg = JSON.parse(JSON.stringify(DEFAULTS));

  /* ----------------------------- 飞控状态 ----------------------------- */
  const craft = {
    R: m3id(),
    dR: m3id(),
    tmp: m3id(),
    p: { x: 0, y: 1.15, z: 0 },
    v: { x: 0, y: 0, z: 0 },
    w: { x: 0, y: 0, z: 0 },
    wPrev: { x: 0, y: 0, z: 0 },
    integ: { x: 0, y: 0, z: 0 },
    motors: [0, 0, 0, 0],
    armed: false,
    failsafe: false,
    crashed: false,
    throttle: 0
  };
  const home = { x: 0, y: 1.15, z: 0 };
  const sticks = { roll: 0, pitch: 0, yaw: 0, throttle: 0 };
  const keys = Object.create(null);
  let mouseLook = false;
  let mouseRoll = 0, mousePitch = 0;
  let inputSrc = "键盘";
  let gpIndex = -1;
  let chaseCam = false;
  let menuOpen = false;
  let flightTime = 0;
  let vtxSignal = 1;
  let crashTimer = 0;

  function resetCraft() {
    craft.R.set(m3id());
    craft.p.x = home.x; craft.p.y = home.y; craft.p.z = home.z;
    craft.v.x = craft.v.y = craft.v.z = 0;
    craft.w.x = craft.w.y = craft.w.z = 0;
    craft.wPrev.x = craft.wPrev.y = craft.wPrev.z = 0;
    craft.integ.x = craft.integ.y = craft.integ.z = 0;
    craft.motors[0] = craft.motors[1] = craft.motors[2] = craft.motors[3] = 0;
    craft.armed = false;
    craft.failsafe = false;
    craft.crashed = false;
    craft.throttle = 0;
    flightTime = 0;
    vtxSignal = 1;
    crashTimer = 0;
    document.getElementById("fail-banner").style.display = "none";
  }

  /* ----------------------------- 输入 ----------------------------- */
  const canvas = document.getElementById("view");
  window.addEventListener("keydown", (e) => {
    keys[e.code] = true;
    if (e.code === "Tab") { e.preventDefault(); toggleMenu(); }
    if (e.code === "Space") { e.preventDefault(); if (!menuOpen) toggleArm(); }
    if (e.code === "KeyR" && !menuOpen) resetCraft();
    if (e.code === "KeyC" && !menuOpen) chaseCam = !chaseCam;
    if (e.code === "Escape" && menuOpen) toggleMenu();
  });
  window.addEventListener("keyup", (e) => { keys[e.code] = false; });
  canvas.addEventListener("click", () => {
    if (!menuOpen) canvas.requestPointerLock();
  });
  document.addEventListener("pointerlockchange", () => {
    mouseLook = document.pointerLockElement === canvas;
    if (!mouseLook) { mouseRoll = 0; mousePitch = 0; }
  });
  document.addEventListener("mousemove", (e) => {
    if (!mouseLook || menuOpen) return;
    mouseRoll = clamp(mouseRoll + e.movementX * 0.0022, -1, 1);
    mousePitch = clamp(mousePitch + e.movementY * 0.0022, -1, 1);
  });
  window.addEventListener("gamepadconnected", (e) => { gpIndex = e.gamepad.index; });
  window.addEventListener("gamepaddisconnected", () => { gpIndex = -1; });

  function readAxis(gp, spec) {
    if (!gp || spec.axis < 0 || spec.axis >= gp.axes.length) return 0;
    let v = gp.axes[spec.axis];
    if (spec.inv) v = -v;
    return clamp(v, -1, 1);
  }
  function pollInput(dt) {
    let gp = null;
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    if (gpIndex >= 0 && pads[gpIndex]) gp = pads[gpIndex];
    else {
      for (let i = 0; i < pads.length; i++) if (pads[i]) { gp = pads[i]; gpIndex = i; break; }
    }
    if (gp) {
      inputSrc = gp.id ? gp.id.slice(0, 28) : "Gamepad";
      let r = readAxis(gp, cfg.ch.roll);
      let p = readAxis(gp, cfg.ch.pitch);
      let y = readAxis(gp, cfg.ch.yaw);
      let t = readAxis(gp, cfg.ch.throttle);
      r = expo(dead(r, cfg.deadzone), cfg.stickExpo);
      p = expo(dead(p, cfg.deadzone), cfg.stickExpo);
      y = expo(dead(y, cfg.deadzone), cfg.stickExpo);
      t = (dead(t, cfg.deadzone * 0.5) + 1) * 0.5;
      sticks.roll = r; sticks.pitch = p; sticks.yaw = y; sticks.throttle = clamp(t, 0, 1);
      if (gp.buttons[9] && gp.buttons[9].pressed) resetCraft();
      if (gp.buttons[8] && gp.buttons[8].pressed && !pollInput._start) toggleMenu();
      pollInput._start = gp.buttons[8] && gp.buttons[8].pressed;
      const armBtn = (gp.buttons[5] && gp.buttons[5].pressed) || (gp.buttons[0] && gp.buttons[0].pressed);
      if (armBtn && !pollInput._arm) toggleArm();
      pollInput._arm = armBtn;
    } else {
      inputSrc = mouseLook ? "键盘+鼠标" : "键盘";
      let r = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
      let p = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
      let y = (keys.KeyE ? 1 : 0) - (keys.KeyQ ? 1 : 0);
      if (mouseLook) { r = clamp(r + mouseRoll, -1, 1); p = clamp(p + mousePitch, -1, 1); }
      sticks.roll = r; sticks.pitch = p; sticks.yaw = y;
      if (keys.ShiftLeft || keys.ShiftRight || keys.ArrowUp) craft.throttle = clamp(craft.throttle + dt * 0.9, 0, 1);
      if (keys.ControlLeft || keys.ControlRight || keys.ArrowDown) craft.throttle = clamp(craft.throttle - dt * 0.9, 0, 1);
      sticks.throttle = craft.throttle;
      mouseRoll *= Math.pow(0.12, dt);
      mousePitch *= Math.pow(0.12, dt);
    }
    if (gp) craft.throttle = sticks.throttle;
  }
  function toggleArm() {
    if (craft.failsafe || craft.crashed) return;
    if (!craft.armed) {
      if (sticks.throttle > 0.08) return;
      craft.armed = true;
      craft.integ.x = craft.integ.y = craft.integ.z = 0;
    } else {
      craft.armed = false;
      craft.motors[0] = craft.motors[1] = craft.motors[2] = craft.motors[3] = 0;
    }
  }

  /* ----------------------------- 物理步进 ----------------------------- */
  const solids = [];
  function pidAxis(err, integ, dmeas, g, dt) {
    let i = integ + err * dt;
    i = clamp(i, -cfg.iLim, cfg.iLim);
    const u = g.kp * err + g.ki * i - g.kd * dmeas;
    return { u, i };
  }
  function physicsStep(dt) {
    if (dt <= 0 || dt > 0.05) return;
    const R = craft.R, w = craft.w, p = craft.p, v = craft.v;
    const dist = Math.hypot(p.x - home.x, p.y - home.y, p.z - home.z);
    const knee = Math.max(cfg.vtxRange, 1);
    vtxSignal = 1 / (1 + Math.pow(dist / knee, cfg.vtxKnee));
    if (dist >= cfg.vtxFail) {
      vtxSignal = 0;
      if (!craft.failsafe) {
        craft.failsafe = true;
        craft.armed = false;
        document.getElementById("fail-banner").style.display = "flex";
      }
    }

    let thr = craft.failsafe || !craft.armed || craft.crashed ? 0 : sticks.throttle;
    const maxR = cfg.maxRate;
    let wDesRoll = 0, wDesPitch = 0, wDesYaw = 0;
    if (craft.armed && !craft.failsafe && !craft.crashed) {
      wDesRoll = sticks.roll * maxR.roll;
      wDesPitch = sticks.pitch * maxR.pitch;
      wDesYaw = sticks.yaw * maxR.yaw;
    }
    const wdx = (w.x - craft.wPrev.x) / dt;
    const wdy = (w.y - craft.wPrev.y) / dt;
    const wdz = (w.z - craft.wPrev.z) / dt;
    craft.wPrev.x = w.x; craft.wPrev.y = w.y; craft.wPrev.z = w.z;

    const er = wDesRoll - w.z;
    const ep = wDesPitch - w.x;
    const ey = wDesYaw - w.y;
    const pr = pidAxis(er, craft.integ.z, wdz, cfg.pid.roll, dt);
    const pp = pidAxis(ep, craft.integ.x, wdx, cfg.pid.pitch, dt);
    const py = pidAxis(ey, craft.integ.y, wdy, cfg.pid.yaw, dt);
    craft.integ.z = pr.i; craft.integ.x = pp.i; craft.integ.y = py.i;

    const uRoll = pr.u, uPitch = pp.u, uYaw = py.u;
    const Tcmd = thr;
    let mFR = Tcmd - uRoll - uPitch + uYaw;
    let mRR = Tcmd - uRoll + uPitch - uYaw;
    let mRL = Tcmd + uRoll + uPitch + uYaw;
    let mFL = Tcmd + uRoll - uPitch - uYaw;
    mFR = clamp(mFR, 0, 1); mRR = clamp(mRR, 0, 1); mRL = clamp(mRL, 0, 1); mFL = clamp(mFL, 0, 1);
    if (!craft.armed || craft.failsafe || craft.crashed) mFR = mRR = mRL = mFL = 0;
    craft.motors[0] = mFR; craft.motors[1] = mRR; craft.motors[2] = mRL; craft.motors[3] = mFL;

    const kT = cfg.maxThrust / 4;
    const thrust = kT * (mFR + mRR + mRL + mFL);
    const L = cfg.arm;
    const tauX = L * kT * (-mFR + mRR + mRL - mFL);
    const tauY = cfg.kYaw * cfg.maxThrust * (mFR - mRR + mRL - mFL);
    const tauZ = L * kT * (mFR + mRR - mRL - mFL);

    const spd = Math.hypot(v.x, v.y, v.z);
    const fd = -cfg.drag * spd;
    const fx = R[1] * thrust + fd * v.x;
    const fy = R[4] * thrust + fd * v.y - cfg.mass * cfg.gravity;
    const fz = R[7] * thrust + fd * v.z;
    const invm = 1 / cfg.mass;
    v.x += fx * invm * dt;
    v.y += fy * invm * dt;
    v.z += fz * invm * dt;
    p.x += v.x * dt;
    p.y += v.y * dt;
    p.z += v.z * dt;

    const Ix = cfg.Ixx, Iy = cfg.Iyy, Iz = cfg.Izz;
    const wx = w.x, wy = w.y, wz = w.z;
    const Iwx = Ix * wx, Iwy = Iy * wy, Iwz = Iz * wz;
    const cx = wy * Iwz - wz * Iwy;
    const cy = wz * Iwx - wx * Iwz;
    const cz = wx * Iwy - wy * Iwx;
    const ad = cfg.angDrag;
    w.x += ((tauX - cx - ad * wx * Math.abs(wx)) / Ix) * dt;
    w.y += ((tauY - cy - ad * wy * Math.abs(wy)) / Iy) * dt;
    w.z += ((tauZ - cz - ad * wz * Math.abs(wz)) / Iz) * dt;

    so3exp(w.x, w.y, w.z, dt, craft.dR);
    m3mul(R, craft.dR, craft.tmp);
    R.set(craft.tmp);
    orthonormalize(R);

    collide(dt);
    if (!Number.isFinite(p.x) || !Number.isFinite(w.x) || !Number.isFinite(R[0])) resetCraft();
  }

  function collide() {
    const p = craft.p, v = craft.v, w = craft.w;
    const rad = 0.16;
    if (p.y < rad) {
      const impact = -v.y;
      p.y = rad;
      if (v.y < 0) v.y = 0;
      v.x *= 0.72; v.z *= 0.72;
      w.x *= 0.55; w.z *= 0.55;
      const tiltUp = craft.R[4];
      if (impact > 7 || tiltUp < 0.15 && impact > 2.5) onCrash();
    }
    for (let i = 0; i < solids.length; i++) {
      const s = solids[i];
      if (s.kind === "box") {
        const qx = clamp(p.x, s.minx, s.maxx);
        const qy = clamp(p.y, s.miny, s.maxy);
        const qz = clamp(p.z, s.minz, s.maxz);
        const dx = p.x - qx, dy = p.y - qy, dz = p.z - qz;
        const d2 = dx * dx + dy * dy + dz * dz;
        if (d2 < rad * rad && d2 > 1e-10) {
          const d = Math.sqrt(d2);
          const nx = dx / d, ny = dy / d, nz = dz / d;
          const pen = rad - d;
          p.x += nx * pen; p.y += ny * pen; p.z += nz * pen;
          const vn = v.x * nx + v.y * ny + v.z * nz;
          if (vn < 0) {
            v.x -= 1.4 * vn * nx; v.y -= 1.4 * vn * ny; v.z -= 1.4 * vn * nz;
            if (-vn > 6) onCrash();
          }
        }
      } else if (s.kind === "cyl") {
        const dx = p.x - s.x, dz = p.z - s.z;
        const hr = Math.hypot(dx, dz);
        if (p.y > 0 && p.y < s.h + rad && hr < s.r + rad && hr > 1e-6) {
          const nx = dx / hr, nz = dz / hr;
          const need = s.r + rad;
          p.x = s.x + nx * need;
          p.z = s.z + nz * need;
          const vn = v.x * nx + v.z * nz;
          if (vn < 0) {
            v.x -= 1.4 * vn * nx; v.z -= 1.4 * vn * nz;
            if (-vn > 6) onCrash();
          }
        }
      }
    }
  }

  let acc = 0;
  const HDT = 1 / 400;
  let last = performance.now();
  let fps = 60, fpsT = 0, fpsN = 0;

  function loop(now) {
    requestAnimationFrame(loop);
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    fpsT += dt; fpsN++;
    if (fpsT > 0.4) { fps = fpsN / fpsT; fpsT = 0; fpsN = 0; }

    if (!menuOpen) pollInput(dt);
    acc += dt;
    let steps = 0;
    while (acc >= HDT && steps < 12) {
      physicsStep(HDT);
      acc -= HDT;
      steps++;
    }
    if (craft.armed && !craft.failsafe) flightTime += dt;
    if (craft.crashed) {
      crashTimer -= dt;
      if (crashTimer <= 0) resetCraft();
    }

    applyPose(drone, craft.p, craft.R);
    const props = drone.userData.props;
    for (let i = 0; i < 4; i++) {
      props[i].rotation.z += craft.motors[i] * dt * 80 * (i % 2 ? 1 : -1);
      props[i].material.opacity = 0.12 + craft.motors[i] * 0.45;
    }

    const cam = chaseCam ? chase : fpvCam;
    if (chaseCam) {
      const back = 2.4, up = 0.85;
      chase.position.set(
        craft.p.x - craft.R[2] * back + craft.R[1] * up,
        craft.p.y - craft.R[5] * back + craft.R[4] * up,
        craft.p.z - craft.R[8] * back + craft.R[7] * up
      );
      chase.up.set(craft.R[1], craft.R[4], craft.R[7]);
      chase.lookAt(craft.p.x, craft.p.y + 0.1, craft.p.z);
    }

    vtxUniforms.time.value = now * 0.001;
    vtxUniforms.signal.value = vtxSignal;
    vtxUniforms.failsafe.value = craft.failsafe ? 1 : 0;

    renderer.setRenderTarget(rt);
    renderer.render(scene, cam);
    renderer.setRenderTarget(null);
    renderer.render(quadScene, quadCam);

    const spd = Math.hypot(craft.v.x, craft.v.y, craft.v.z);
    const dist = Math.hypot(craft.p.x - home.x, craft.p.y - home.y, craft.p.z - home.z);
    const alt = craft.p.y;
    const wxd = craft.w.x * 57.3, wyd = craft.w.y * 57.3, wzd = craft.w.z * 57.3;
    const armCls = craft.armed ? "ok" : "warn";
    const sigCls = vtxSignal < 0.25 ? "bad" : vtxSignal < 0.55 ? "warn" : "ok";
    osdTL.innerHTML = "MODE <span class='ok'>ACRO SO(3)</span><br>ARM <span class='" + armCls + "'>" + (craft.armed ? "ARMED" : "DISARM") + "</span><br>IN  " + inputSrc;
    osdTR.innerHTML = "SIG <span class='" + sigCls + "'>" + (vtxSignal * 100).toFixed(0) + "%</span><br>D " + dist.toFixed(1) + " m<br>ALT " + alt.toFixed(1) + " m";
    osdBL.innerHTML = "GYRO °/s<br>R " + wzd.toFixed(0) + "  P " + wxd.toFixed(0) + "  Y " + wyd.toFixed(0);
    osdBR.innerHTML = spd.toFixed(1) + " m/s<br>" + fps.toFixed(0) + " FPS<br>" + flightTime.toFixed(1) + " s";
    osdBC.textContent = craft.crashed ? "CRASH — 重置中" : (craft.failsafe ? "" : "THR " + (sticks.throttle * 100).toFixed(0) + "%");
    thrFill.style.height = (sticks.throttle * 100) + "%";
    sigFill.style.height = (vtxSignal * 100) + "%";
    sigFill.style.background = vtxSignal < 0.25 ? "#ff3b4e" : vtxSignal < 0.55 ? "#ffb020" : "#00e6b4";
    failBanner.style.display = craft.failsafe ? "flex" : "none";
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
