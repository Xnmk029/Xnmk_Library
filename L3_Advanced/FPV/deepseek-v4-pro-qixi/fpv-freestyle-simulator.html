<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>FPV 穿越机花飞模拟器 · deepseek-v4-pro-qixi</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--txt:#c9d1d9;--acc:#58a6ff;--dim:#8b949e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font:13px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
#app{position:fixed;inset:0}
#topbar{position:fixed;top:0;left:0;right:0;height:34px;display:flex;align-items:center;gap:14px;
  padding:0 12px;background:rgba(13,17,23,.72);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  z-index:20;user-select:none}
#topbar .brand{font-weight:600;letter-spacing:.3px;color:#fff}
#topbar .brand b{color:var(--acc)}
#topbar .stat{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
#topbar .stat b{color:var(--txt);font-weight:600}
#topbar .spacer{flex:1}
#topbar button{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:6px;
  padding:4px 10px;cursor:pointer;font-size:12px}
#topbar button:hover{border-color:var(--acc);color:var(--acc)}
#topbar button.on{color:#0d1117;background:var(--acc);border-color:var(--acc)}
#hud{position:fixed;left:10px;bottom:10px;background:rgba(13,17,23,.68);border:1px solid var(--line);
  border-radius:8px;padding:8px 12px;font:11px/1.8 "Consolas",ui-monospace,monospace;z-index:20;
  color:var(--dim);white-space:pre}
#hud b{color:#7ee787;font-weight:600}
#menu{position:fixed;top:44px;right:10px;width:316px;max-height:calc(100% - 60px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;z-index:30;
  box-shadow:0 8px 32px rgba(0,0,0,.5)}
#menu h2{font-size:13px;margin:0 0 4px;color:#fff;display:flex;align-items:center;justify-content:space-between}
#menu h2 .close{background:none;border:none;color:var(--dim);font-size:16px;cursor:pointer}
#menu section{margin:12px 0 0;border-top:1px solid var(--line);padding-top:10px}
#menu section h3{font-size:12px;margin:0 0 8px;color:var(--acc);text-transform:uppercase;letter-spacing:.5px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0}
.row label{color:var(--dim);flex:1}
.row input[type=range]{flex:1.2;accent-color:var(--acc)}
.row output{width:52px;text-align:right;color:var(--txt);font-variant-numeric:tabular-nums;font-size:12px}
.chip{display:flex;gap:6px;margin:6px 0}
.chip label{flex:1;text-align:center;background:#0d1117;border:1px solid var(--line);border-radius:6px;
  padding:4px 0;cursor:pointer;font-size:11px;color:var(--dim)}
.chip input{display:none}
.chip input:checked+span{color:#0d1117}
.chip input[value="1"]:checked+span{color:#7ee787}
.chip input[value="-1"]:checked+span{color:#f0883e}
select{width:100%;background:#0d1117;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px}
.kbd{color:var(--acc);font-family:Consolas,monospace;font-size:11px}
#hint{position:fixed;bottom:10px;right:10px;color:var(--dim);font-size:11px;z-index:15;text-align:right}
#lost{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.9);
  color:#ff5b5b;font-size:26px;font-weight:700;letter-spacing:2px;z-index:40;text-align:center}
#lost small{display:block;font-size:13px;color:var(--dim);font-weight:400;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>

<div id="topbar">
  <span class="brand">FPV<b>花飞</b> · SO(3) 刚体仿真</span>
  <span class="stat">高度 <b id="st-alt">0.0</b> m</span>
  <span class="stat">速度 <b id="st-spd">0.0</b> m/s</span>
  <span class="stat">信号 <b id="st-rssi">100%</b></span>
  <span class="stat">模式 <b id="st-mode">ACRO</b></span>
  <span class="spacer"></span>
  <button id="btnFpv">FPV 视角</button>
  <button id="btnReset">重置</button>
  <button id="btnMenu">⚙ 设置</button>
</div>

<div id="hud"></div>
<div id="hint">W/S/A/D 前后左右 · ↑/↓/←/→ 俯仰滚转 · Q/E 偏航 · R 重置 · F FPV · M 菜单<br>或插入手柄/遥控器自动识别</div>

<div id="menu" style="display:none">
  <h2>设置菜单 <span class="close" id="btnClose">✕</span></h2>

  <section>
    <h3>通道轴向绑定与反向</h3>
    <div class="row"><label>Roll 滚转</label><div class="chip" id="bindRoll"></div></div>
    <div class="row"><label>Pitch 俯仰</label><div class="chip" id="bindPitch"></div></div>
    <div class="row"><label>Yaw 偏航</label><div class="chip" id="bindYaw"></div></div>
    <div class="row"><label>Throttle 油门</label><div class="chip" id="bindThr"></div></div>
  </section>

  <section>
    <h3>PID 参数微调</h3>
    <div class="row"><label>P 比例</label><input type="range" id="pidP" min="0" max="60" step="0.5"><output id="pidPo"></output></div>
    <div class="row"><label>I 积分</label><input type="range" id="pidI" min="0" max="20" step="0.1"><output id="pidIo"></output></div>
    <div class="row"><label>D 微分</label><input type="range" id="pidD" min="0" max="6" step="0.05"><output id="pidDo"></output></div>
    <div class="row"><label>角速度灵敏度</label><input type="range" id="rateG" min="1" max="20" step="0.5"><output id="rateGo"></output></div>
  </section>

  <section>
    <h3>气动物理参数</h3>
    <div class="row"><label>最大推力</label><input type="range" id="thrust" min="10" max="80" step="1"><output id="thrusto"></output></div>
    <div class="row"><label>线性阻尼</label><input type="range" id="drag" min="0" max="2" step="0.05"><output id="drago"></output></div>
    <div class="row"><label>角阻尼</label><input type="range" id="adrag" min="0" max="3" step="0.05"><output id="adrago"></output></div>
    <div class="row"><label>质量 (kg)</label><input type="range" id="mass" min="0.2" max="1.5" step="0.05"><output id="masso"></output></div>
  </section>

  <section>
    <h3>图传 (VTX) 参数</h3>
    <div class="row"><label>最大图传距离</label><input type="range" id="vtxR" min="20" max="200" step="5"><output id="vtxRo"></output></div>
  </section>

  <div class="row" style="margin-top:12px"><span class="kbd">F</span> FPV视角 <span class="kbd">R</span> 重置 <span class="kbd">M</span> 菜单</div>
</div>

<div id="lost">SIGNAL LOST<small>失控保护已触发 · 按 R 返航重置</small></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

/* ============================== 基础 ============================== */
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
app.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87b7d8);
scene.fog=new THREE.Fog(0x87b7d8,180,520);

const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.1,1200);
camera.position.set(0,7,22);

/* ============================== 光照 ============================== */
scene.add(new THREE.HemisphereLight(0xdfeaff,0x3a4a3a,1.15));
const sun=new THREE.DirectionalLight(0xfff2d0,1.8);
sun.position.set(80,120,40);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-120;sun.shadow.camera.right=120;
sun.shadow.camera.top=120;sun.shadow.camera.bottom=-120;
sun.shadow.camera.far=420;
scene.add(sun);

/* ============================== 环境 ============================== */
function gridTexture(size,base,line){
  const c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d');
  g.fillStyle=base;g.fillRect(0,0,size,size);
  g.strokeStyle=line;g.lineWidth=2;
  for(let i=0;i<=size;i+=size/8){g.beginPath();g.moveTo(i,0);g.lineTo(i,size);g.stroke();
    g.beginPath();g.moveTo(0,i);g.lineTo(size,i);g.stroke();}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(30,30);t.anisotropy=4;return t;
}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600),
  new THREE.MeshLambertMaterial({map:gridTexture(256,'#3f6d3f','#356035')}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

const poleMat=new THREE.MeshStandardMaterial({color:0xdddddd,roughness:.6});
const gateMat=new THREE.MeshStandardMaterial({color:0xff6a00,roughness:.5,emissive:0x331500});
function gate(x,y,z,ry,r,radius){
  const g=new THREE.Group();
  const ring=new THREE.Mesh(new THREE.TorusGeometry(radius,0.16,10,40),gateMat);
  ring.position.y=r;ring.castShadow=true;g.add(ring);
  for(const sx of[-1,1]){
    const p=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,r,8),poleMat);
    p.position.set(sx*radius, r/2, 0);p.castShadow=true;g.add(p);
  }
  g.position.set(x,y,z);g.rotation.y=ry;
  scene.add(g);return g;
}
function pylon(x,z,h,color){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.7,h,10),
    new THREE.MeshStandardMaterial({color,roughness:.4}));
  m.position.set(x,h/2,z);m.castShadow=true;scene.add(m);return m;
}
function wall(x,z,ry){
  const g=new THREE.Group();
  const w=new THREE.Mesh(new THREE.BoxGeometry(10,4,1.4),
    new THREE.MeshStandardMaterial({color:0x8a8a8a,roughness:.9}));
  w.position.y=2;w.castShadow=true;g.add(w);
  const door=new THREE.Mesh(new THREE.BoxGeometry(4,3,1.6),
    new THREE.MeshStandardMaterial({color:0xffcc00,roughness:.5,emissive:0x221600}));
  door.position.y=1.5;g.add(door);
  g.position.set(x,0,z);g.rotation.y=ry;scene.add(g);return g;
}
// 花飞障碍物组合：环形门 + 立柱 + 可穿越墙体废墟
gate(0,0,40,0, 6, 6);
gate(24,0,-10,Math.PI/2, 6, 5);
gate(-26,0,14,-Math.PI/2.2, 6, 5.4);
gate(0,0,-60,0, 6, 7);
for(let i=0;i<6;i++)pylon(14+i*3.4, 26, 5+i%2*2, 0xff6a00);
for(let i=0;i<6;i++)pylon(-14-i*3.4, -2, 5+i%2*2, 0x2f9fff);
pylon(40,40,9,0x2f9fff);pylon(44,44,9,0x2f9fff);pylon(36,44,9,0x2f9fff);
wall(0,-90,0);
wall(70,10,Math.PI/2);

/* ============================== 无人机模型 ============================== */
const drone=new THREE.Group();
const bodyMat=new THREE.MeshStandardMaterial({color:0x1b1f27,roughness:.45,metalness:.3});
const carbonMat=new THREE.MeshStandardMaterial({color:0x0c0c0c,roughness:.4,metalness:.6});
const motorMat=new THREE.MeshStandardMaterial({color:0x555b66,roughness:.3,metalness:.8});
const propMat=new THREE.MeshStandardMaterial({color:0xd8d8d8,roughness:.35,metalness:.2,side:THREE.DoubleSide});
const core=new THREE.Mesh(new THREE.BoxGeometry(2.6,0.7,2.0),bodyMat);
core.castShadow=true;drone.add(core);
const camMod=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.6,0.8),
  new THREE.MeshStandardMaterial({color:0x111,roughness:.2}));
camMod.position.set(0,0.15,1.1);drone.add(camMod);
const led=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.4,0.2),
  new THREE.MeshBasicMaterial({color:0x00ff55}));
led.position.set(0,0.1,-1.1);drone.add(led);
const motors=[],props=[];
const armDirs=[[1,1],[-1,1],[1,-1],[-1,-1]];
armDirs.forEach(([sx,sz],i)=>{
  const arm=new THREE.Mesh(new THREE.BoxGeometry(3.4,0.5,0.5),carbonMat);
  arm.position.set(sx*1.7,0.15,sz*1.55);arm.rotation.y=Math.atan2(sz*1.55,sx*1.7);
  drone.add(arm);
  const motor=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.62,0.5,12),motorMat);
  motor.position.set(sx*2.9,0.35,sz*2.7);motor.castShadow=true;drone.add(motor);motors.push(motor);
  const prop=new THREE.Mesh(new THREE.BoxGeometry(3.4,0.06,0.7),propMat);
  prop.position.set(sx*2.9,0.62,sz*2.7);drone.add(prop);props.push(prop);
});
drone.position.set(0,1.2,16);
scene.add(drone);
const gimbal=new THREE.Group();gimbal.add(drone);scene.add(gimbal);

/* ============================== 刚体动力学 (SO(3)) ============================== */
const P={
  pos:drone.position.clone(),
  quat:new THREE.Quaternion(),
  vel:new THREE.Vector3(),
  omega:new THREE.Vector3(),
  angMom:new THREE.Vector3(),
  inertiaInv:new THREE.Vector3(8,8,5),
};
const eulerTmp=new THREE.Euler();
const state={rssi:1,fail:false,fpv:false,thr:0.15};

const CFG={
  pid:{P:18,I:1.2,D:0.15,rate:7},
  bind:{roll:1,pitch:1,yaw:1,thr:1},
  aero:{thrust:40,drag:0.6,adrag:1.2,mass:0.7},
  vtx:{range:90},
};
const integr=new THREE.Vector3();
let lastErr=new THREE.Vector3();
let firstErr=true;

/* so(3) 指数映射 → 四元数 (角速度 omega·dt) */
function expMap(wx,wy,wz,dt){
  const half=0.5*dt, x=wx*half, y=wy*half, z=wz*half;
  const th2=x*x+y*y+z*z;
  const th=Math.sqrt(th2);
  let qw,qx,qy,qz;
  if(th<1e-8){qw=1-th2/2;qx=x;qy=y;qz=z;}
  else{const s=Math.sin(th)/th;qw=Math.cos(th);qx=x*s;qy=y*s;qz=z*s;}
  return new THREE.Quaternion(qx,qy,qz,qw);
}
function quatMul(q1,q2){return new THREE.Quaternion(
  q1.w*q2.x+q1.x*q2.w+q1.y*q2.z-q1.z*q2.y,
  q1.w*q2.y-q1.x*q2.z+q1.y*q2.w+q1.z*q2.x,
  q1.w*q2.z+q1.x*q2.y-q1.y*q2.x+q1.z*q2.w,
  q1.w*q2.w-q1.x*q2.x-q1.y*q2.y-q1.z*q2.z);}

function physicsStep(dt){
  const up=new THREE.Vector3(0,1,0);
  // 推力与阻尼(机体系)
  const thrust=new THREE.Vector3(0,state.thr*CFG.aero.thrust,0);
  const dragW=new THREE.Vector3(-P.vel.x*CFG.aero.drag,-P.vel.y*CFG.aero.drag,-P.vel.z*CFG.aero.drag);
  const F=new THREE.Vector3(0,-9.81*CFG.aero.mass,0)
    .add(thrust.applyQuaternion(P.quat)).add(dragW);
  P.vel.addScaledVector(F,dt/CFG.aero.mass);
  P.pos.addScaledVector(P.vel,dt);

  // PID 角速度控制 → 力矩(机体系)
  const tw=new THREE.Vector3(targetRate.x,targetRate.y,targetRate.z);
  const err=new THREE.Vector3().subVectors(tw,P.omega);
  integr.addScaledVector(err,dt);
  const derr=firstErr?new THREE.Vector3():err.clone().sub(lastErr).multiplyScalar(1/dt);
  lastErr.copy(err);firstErr=false;
  const pid=new THREE.Vector3(
    CFG.pid.P*err.x+CFG.pid.I*integr.x+CFG.pid.D*derr.x,
    CFG.pid.P*err.y+CFG.pid.I*integr.y+CFG.pid.D*derr.y,
    CFG.pid.P*err.z+CFG.pid.I*integr.z+CFG.pid.D*derr.z);
  const torque=new THREE.Vector3(pid.x,pid.y,pid.z);
  const tau=new THREE.Vector3(
    torque.x*P.inertiaInv.x - P.omega.x*CFG.aero.adrag,
    torque.y*P.inertiaInv.y - P.omega.y*CFG.aero.adrag,
    torque.z*P.inertiaInv.z - P.omega.z*CFG.aero.adrag);
  P.omega.addScaledVector(tau,dt);
  accOmega.copy(tau);

  // so(3) 指数映射姿态积分：q ← q ⊗ exp(ω·dt)
  const dq=expMap(P.omega.x,P.omega.y,P.omega.z,dt);
  P.quat.copy(quatMul(P.quat,dq)).normalize();

  // 地面碰撞
  if(P.pos.y<0.35){P.pos.y=0.35;if(P.vel.y<0)P.vel.y=0;}

  // 图传距离
  const dist=P.pos.length();
  state.rssi=THREE.MathUtils.clamp(1-dist/CFG.vtx.range,0,1);
  if(dist>CFG.vtx.range&&!state.fail){state.fail=true;document.getElementById('lost').style.display='flex';}
  if(state.fail)state.thr=0;
}
let targetRate=new THREE.Vector3();
let accOmega=new THREE.Vector3();

/* ============================== 输入 ============================== */
const keys={};
const sticks={pitch:0,roll:0,yaw:0,thr:0.15};
let hasPad=false;

addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  keys[e.code]=true;
  if(e.code==='KeyF'){state.fpv=!state.fpv;syncTopbar();}
  if(e.code==='KeyR')resetDrone();
  if(e.code==='KeyM'){menu.style.display=menu.style.display==='none'?'block':'none';}
});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});

function readGamepad(){
  hasPad=false;
  const gs=navigator.getGamepads?navigator.getGamepads():[];
  for(const g of gs){
    if(!g||!g.connected)continue;
    if(g.axes.length<4&&g.buttons.length<8)continue;
    hasPad=true;
    sticks.roll=g.axes[0]||0;
    sticks.pitch=g.axes[1]||0;
    sticks.yaw=g.axes[2]||0;
    sticks.thr=((g.buttons[7]?g.buttons[7].value:0)-g.axes[3])*0.5+0.5;
    return true;
  }
  return false;
}
function updateInput(){
  const kb={
    pitch:(keys['ArrowUp']?1:0)-(keys['ArrowDown']?1:0),
    roll:(keys['ArrowRight']?1:0)-(keys['ArrowLeft']?1:0),
    yaw:(keys['KeyE']?1:0)-(keys['KeyQ']?1:0),
    thr:(keys['KeyW']?1:0)-(keys['KeyS']?1:0),
  };
  const thrAxis=(keys['ShiftLeft']?1:0)-(keys['Space']?1:0);
  readGamepad();
  const used=hasPad;
  const r=used?sticks:kb;
  const thr=used?sticks.thr:(0.15+thrAxis*0.03);
  targetRate.set(
    r.pitch*CFG.pid.rate*CFG.bind.pitch,
    r.roll*CFG.pid.rate*CFG.bind.roll,
    r.yaw*CFG.pid.rate*CFG.bind.yaw);
  state.thr=THREE.MathUtils.clamp(used?thr:(kb.thr?1:thr),0,1);
}

function resetDrone(){
  P.pos.set(0,1.2,16);P.vel.set(0,0,0);P.omega.set(0,0,0);
  P.quat.identity();integr.set(0,0,0);accOmega.set(0,0,0);
  state.rssi=1;state.fail=false;state.thr=0.15;
  document.getElementById('lost').style.display='none';
  targetRate.set(0,0,0);
}

/* ============================== VTX 后处理 ============================== */
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const vtxPass=new ShaderPass({
  uniforms:{
    tDiffuse:{value:null},
    uTime:{value:0},
    uRssi:{value:1},
    uRes:{value:new THREE.Vector2(innerWidth,innerHeight)},
  },
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D tDiffuse;
    uniform float uTime,uRssi;
    uniform vec2 uRes;
    float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    void main(){
      vec2 uv=vUv;
      float loss=1.0-uRssi;
      // 横向撕裂
      if(loss>0.001){
        float row=floor(vUv.y*uRes.y/3.0);
        float r=hash(vec2(row,floor(uTime*24.0)));
        if(r<loss*0.45){
          uv.x+= (hash(vec2(row,11.0))-0.5)*0.08*loss;
        }
        // 滚动条纹
        float band=sin((vUv.y+uTime*(0.5+loss))*uRes.y*0.06);
        float b=step(0.82+loss*0.15,abs(band));
        uv.x+= b*(hash(vec2(row,7.0))-0.5)*0.6*loss;
      }
      vec4 col=texture2D(tDiffuse,uv);
      // 雪花噪点
      if(loss>0.001){
        float n=hash(uv*uRes+vec2(uTime*60.0));
        float mixv=loss*loss;
        col.rgb=mix(col.rgb,vec3(n),clamp(mixv*1.6,0.0,1.0));
      }
      // 失联黑屏
      if(uRssi<0.001)col.rgb=vec3(0.0);
      // 轻微暗角
      float d=length(vUv-0.5);
      col.rgb*=1.0-d*d*0.35;
      gl_FragColor=col;
    }`
});
vtxPass.renderToScreen=true;
composer.addPass(vtxPass);

/* ============================== 相机 ============================== */
const controls=new OrbitControls(camera,renderer.domElement);
controls.target=new THREE.Vector3(0,2,0);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=4;controls.maxDistance=80;
controls.maxPolarAngle=Math.PI*0.62;

/* ============================== UI ============================== */
const menu=document.getElementById('menu');
document.getElementById('btnMenu').onclick=()=>menu.style.display=menu.style.display==='none'?'block':'none';
document.getElementById('btnClose').onclick=()=>menu.style.display='none';
document.getElementById('btnReset').onclick=resetDrone;
document.getElementById('btnFpv').onclick=()=>{state.fpv=!state.fpv;syncTopbar();};

function bindChips(el,key){
  const names=['+ 正向','- 反向'];
  el.innerHTML=names.map((n,i)=>`<label><input type="radio" name="${key}" value="${i===0?1:-1}" ${CFG.bind[key]===(i===0?1:-1)?'checked':''}><span>${n}</span></label>`).join('');
  el.querySelectorAll('input').forEach(r=>r.onchange=()=>CFG.bind[key]=parseInt(r.value));
}
bindChips(document.getElementById('bindRoll'),'roll');
bindChips(document.getElementById('bindPitch'),'pitch');
bindChips(document.getElementById('bindYaw'),'yaw');
bindChips(document.getElementById('bindThr'),'thr');

function slider(id,out,obj,key,fmt){
  const el=document.getElementById(id),o=document.getElementById(out);
  const set=()=>{obj[key]=parseFloat(el.value);o.textContent=fmt(obj[key]);};
  el.value=obj[key];set();el.oninput=set;
}
slider('pidP','pidPo',CFG.pid,'P',v=>v.toFixed(1));
slider('pidI','pidIo',CFG.pid,'I',v=>v.toFixed(1));
slider('pidD','pidDo',CFG.pid,'D',v=>v.toFixed(2));
slider('rateG','rateGo',CFG.pid,'rate',v=>v.toFixed(1));
slider('thrust','thrusto',CFG.aero,'thrust',v=>v.toFixed(0));
slider('drag','drago',CFG.aero,'drag',v=>v.toFixed(2));
slider('adrag','adrago',CFG.aero,'adrag',v=>v.toFixed(2));
slider('mass','masso',CFG.aero,'mass',v=>v.toFixed(2));
slider('vtxR','vtxRo',CFG.vtx,'range',v=>v.toFixed(0)+' m');

function syncTopbar(){
  document.getElementById('st-alt').textContent=P.pos.y.toFixed(1);
  document.getElementById('st-spd').textContent=P.vel.length().toFixed(1);
  document.getElementById('st-rssi').textContent=(state.rssi*100).toFixed(0)+'%';
  document.getElementById('st-rssi').style.color=state.rssi>0.5?'#7ee787':state.rssi>0.15?'#f0b34e':'#ff5b5b';
  document.getElementById('st-mode').textContent=state.fail?'FAILSAFE':'ACRO';
  document.getElementById('btnFpv').classList.toggle('on',state.fpv);
}
function syncHud(){
  eulerTmp.setFromQuaternion(P.quat,'YXZ');
  const deg=v=>(v*180/Math.PI).toFixed(1);
  document.getElementById('hud').innerHTML=
    `姿态  R ${deg(eulerTmp.x).padStart(6)}°  P ${deg(eulerTmp.y).padStart(6)}°  Y ${deg(eulerTmp.z).padStart(6)}°\n`+
    `角速  R ${P.omega.x.toFixed(2).padStart(7)}  P ${P.omega.y.toFixed(2).padStart(7)}  Y ${P.omega.z.toFixed(2).padStart(7)} rad/s\n`+
    `油门  <b>${(state.thr*100).toFixed(0).padStart(3)}%</b>   高度 <b>${P.pos.y.toFixed(1)}</b> m   速度 <b>${P.vel.length().toFixed(1)}</b> m/s\n`+
    `图传  <b>${(state.rssi*100).toFixed(0)}%</b>   距离 <b>${P.pos.length().toFixed(0)}</b> m   状态 <b>${state.fail?'LOST':'LINK'}</b>`;
}

/* ============================== 主循环 ============================== */
const clock=new THREE.Clock();
let acc=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  // 定步长物理
  acc+=dt;const step=1/240;let steps=0;
  while(acc>=step&&steps<8){updateInput();physicsStep(step);acc-=step;steps++;}
  if(steps===0)updateInput();

  // 更新无人机渲染姿态
  drone.position.copy(P.pos);
  drone.quaternion.copy(P.quat);
  const spd=state.thr*40+(P.omega.length()*2);
  props.forEach((p,i)=>p.rotation.y+=(i%2?1:-1)*spd*dt*10);

  // LED 与螺旋桨随信号变色
  led.material.color.setHSL(state.rssi*0.35,1,0.55);

  // 相机
  if(state.fpv){
    const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(P.quat);
    const up=new THREE.Vector3(0,1,0).applyQuaternion(P.quat);
    camera.position.copy(P.pos).add(new THREE.Vector3(0,0.2,0).applyQuaternion(P.quat));
    camera.up.copy(up);camera.lookAt(P.pos.clone().add(fwd));
  }else{
    controls.target.lerp(P.pos,0.15);
    controls.update();
  }

  vtxPass.uniforms.uTime.value+=dt;
  vtxPass.uniforms.uRssi.value=state.rssi;
  vtxPass.uniforms.uRes.value.set(innerWidth*renderer.getPixelRatio(),innerHeight*renderer.getPixelRatio());
  composer.render();

  syncTopbar();syncHud();
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});
resetDrone();
animate();
</script>
</body>
</html>
