.osd-br{position:absolute;bottom:26px;right:18px;text-align:right;}

<div id="helpbar">TAB 设置 · Enter 解锁/上锁 · R 复位 · C 切换第一人称/跟随视角 · 手柄或键盘：W/S 油门 · I/K 或 ↑/↓ 俯仰 · J/L 或 ←/→ 横滚 · A/D 偏航</div>

<script>
"use strict";
/* =====================================================================================
 *  FPV 穿越机花飞模拟器（单文件 / 零依赖）
 *  - 刚体动力学：姿态以 SO(3) 旋转矩阵表达，通过 so(3) 李代数指数映射精确积分（无欧拉角）
 *  - 受力：电机总推力 + 重力 + 与速度平方成正比的气动阻尼
 *  - Acro 角速度 PID 闭环 → 控制力矩
 *  - Gamepad API 硬件遥控器 4 通道（归一化 / 重绑定 / 反向）
 *  - WebGL 手写渲染：天空 / 地面 / 花飞场地，VTX 5.8G 模拟图传后处理着色器
 * ===================================================================================== */

/* ============================== 基础工具 ============================== */
const clamp = (x, a, b) => x < a ? a : (x > b ? b : x);
const $ = id => document.getElementById(id);

/* ---------- 三维向量 ---------- */
function vadd(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
function vsub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
function vscale(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
function vdot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function vcross(a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}
function vlen(a) { return Math.hypot(a[0], a[1], a[2]); }
function vnorm(a) { const l = vlen(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }

/* ---------- 3x3 矩阵（列主序，与 GL 一致） ----------
 * 约定：机体坐标系 X=右, Y=上(推力轴), Z=后；机头方向 = -Z（与相机约定一致）
 * 旋转矩阵 R 的三列分别是机体 X/Y/Z 轴在世界系下的方向。
 */
function m3Identity() { return [1, 0, 0, 0, 1, 0, 0, 0, 1]; }
function m3Mul(a, b) { // C = A * B（列主序）
  const c = new Array(9);
  for (let j = 0; j < 3; j++)
    for (let r = 0; r < 3; r++) {
      let s = 0;
      for (let k = 0; k < 3; k++) s += a[k * 3 + r] * b[j * 3 + k];
      c[j * 3 + r] = s;
    }
  return c;
}
function m3MulV(m, v) { // 世界向量 = R * 机体向量
  return [
    m[0] * v[0] + m[3] * v[1] + m[6] * v[2],
    m[1] * v[0] + m[4] * v[1] + m[7] * v[2],
    m[2] * v[0] + m[5] * v[1] + m[8] * v[2]
  ];
}
function m3TMulV(m, v) { // 机体向量 = R^T * 世界向量
  return [
    m[0] * v[0] + m[1] * v[1] + m[2] * v[2],
    m[3] * v[0] + m[4] * v[1] + m[5] * v[2],
    m[6] * v[0] + m[7] * v[1] + m[8] * v[2]
  ];
}
function m3RotX(a) { const c = Math.cos(a), s = Math.sin(a); return [1, 0, 0, 0, c, s, 0, -s, c]; }
function m3RotY(a) { const c = Math.cos(a), s = Math.sin(a); return [c, 0, -s, 0, 1, 0, s, 0, c]; }
function m3RotZ(a) { const c = Math.cos(a), s = Math.sin(a); return [c, s, 0, -s, c, 0, 0, 0, 1]; }

/* ============================ SO(3) / so(3) 核心数学 ============================
 * 反对称（斜对称）矩阵 hat 映射：so(3) -> 3x3 斜对称矩阵，满足 K*v = w x v
 */
function m3Skew(w) {
  return [
    0,   w[2], -w[1],   // 第 0 列
    -w[2], 0,   w[0],   // 第 1 列
    w[1], -w[0], 0      // 第 2 列
  ];
}
/* so(3) 指数映射（Rodrigues 公式）：旋转矢量 w = θ·k  ->  SO(3) 元素
 * exp([w]x) = I + sin(θ)·[k]x + (1-cos(θ))·[k]x^2
 * 这是姿态积分的精确解（对常值角速度在一个步长内无离散误差）。
 */
function m3ExpSo3(rv) {
  const th = vlen(rv);
  const I = (i) => (i % 4 === 0 ? 1 : 0);
  if (th < 1e-9) { // 小角度：二阶泰勒展开 I + [w]x + [w]x^2/2
    const K = m3Skew(rv), K2 = m3Mul(K, K), R = new Array(9);
    for (let i = 0; i < 9; i++) R[i] = I(i) + K[i] + 0.5 * K2[i];
    return R;
  }
  const s = Math.sin(th), c = 1 - Math.cos(th);
  const K = m3Skew([rv[0] / th, rv[1] / th, rv[2] / th]);
  const K2 = m3Mul(K, K), R = new Array(9);
  for (let i = 0; i < 9; i++) R[i] = I(i) + s * K[i] + c * K2[i];
  return R;
}
/* Gram-Schmidt 重正交化：把数值漂移后的矩阵拉回 SO(3)（保证 det=+1 且列正交单位） */
function m3Renormalize(R) {
  let c0 = vnorm([R[0], R[1], R[2]]);
  let c1 = [R[3], R[4], R[5]];
  c1 = vnorm(vsub(c1, vscale(c0, vdot(c0, c1))));
  const c2 = vcross(c0, c1);
  return [c0[0], c0[1], c0[2], c1[0], c1[1], c1[2], c2[0], c2[1], c2[2]];
}

/* ---------- 4x4 矩阵（列主序） ---------- */
function m4Perspective(fovyRad, aspect, zn, zf) {
  const f = 1 / Math.tan(fovyRad / 2), m = new Array(16).fill(0);
  m[0] = f / aspect; m[5] = f;
  m[10] = (zf + zn) / (zn - zf); m[11] = -1;
  m[14] = 2 * zf * zn / (zn - zf);
  return m;
}
function m4Mul(a, b) { // C = A * B
  const c = new Array(16);
  for (let j = 0; j < 4; j++)
    for (let r = 0; r < 4; r++) {
      let s = 0;
      for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[j * 4 + k];
      c[j * 4 + r] = s;
    }
  return c;
}
function m4FromRT(r, t) { // 旋转(3x3)+平移 -> 模型矩阵
  return [r[0], r[1], r[2], 0, r[3], r[4], r[5], 0, r[6], r[7], r[8], 0, t[0], t[1], t[2], 1];
}
function m4ViewFromRT(r, t) { // 相机世界位姿的逆（视图矩阵）
  const c0 = [r[0], r[1], r[2]], c1 = [r[3], r[4], r[5]], c2 = [r[6], r[7], r[8]];
  return [
    c0[0], c1[0], c2[0], 0,
    c0[1], c1[1], c2[1], 0,
    c0[2], c1[2], c2[2], 0,
    -vdot(c0, t), -vdot(c1, t), -vdot(c2, t), 1
  ];
}
function m4LookAt(eye, center, up) {
  const z = vnorm(vsub(eye, center));
  const x = vnorm(vcross(up, z));
  const y = vcross(z, x);
  return [
    x[0], y[0], z[0], 0,
    x[1], y[1], z[1], 0,
    x[2], y[2], z[2], 0,
    -vdot(x, eye), -vdot(y, eye), -vdot(z, eye), 1
  ];
}
function m3FromM4(m) { return [m[0], m[1], m[2], m[4], m[5], m[6], m[8], m[9], m[10]]; }

/* ============================== 参数（默认值） ============================== */
const SET = {
  channels: { // 硬件遥控器通道绑定：src='auto'|'kbd'|'a0'...'a11'，inv=反向
    roll:     { src: 'auto', inv: false },
    pitch:    { src: 'auto', inv: true  }, // 手柄摇杆上推通常输出 -1，默认反向
    yaw:      { src: 'auto', inv: false },
    throttle: { src: 'auto', inv: true  }  // 手柄Y轴上推输出-1，默认反向使上推=加大油门
  },
  rates: { roll: 720, pitch: 650, yaw: 380 }, // 满杆角速度 (deg/s)
  expo: 0.45,       // 摇杆 Expo 曲线
  deadband: 0.02,   // 摇杆中心死区
  pid: {            // 三轴角速度 PID（输出为控制力矩 N·m）
    roll:  { p: 0.24, i: 0.60, d: 0.0026 },
    pitch: { p: 0.24, i: 0.60, d: 0.0026 },
    yaw:   { p: 0.32, i: 0.90, d: 0.0020 }
  },
  phys: {
    mass: 0.68,       // kg
    Jx: 0.0042,       // 俯仰轴惯量 kg·m^2
    Jy: 0.0071,       // 偏航轴惯量
    Jz: 0.0045,       // 横滚轴惯量
    TWR: 4.6,         // 推重比（满油门总推力/重量）
    dragK: 0.010,     // 气动阻尼系数 k（F = -k·|v|·v，速度平方阻力）
    motorTau: 0.045,  // 电机响应时间常数 s
    angDamp: 0.00025  // 机体角阻尼 N·m/(rad/s)
  },
  vtx: {
    range: 160,        // 图传有效距离 m
    res: '640x480',    // 图传分辨率
    fov: 100,          // 垂直视场角 deg
    tilt: 22,          // 摄像机上仰角 deg
    noise: 1.0,        // 雪花噪点强度
    tear: 1.0,         // 画面撕裂强度
    band: 1.0,         // 滚动条纹强度
    jello: true,       // 果冻效应（螺旋桨振动）
    failsafeMode: 'drop', // drop=失控断电坠落 / rth=自动返航
    sound: true
  }
};
function deepMerge(dst, src) {
  for (const k in src) {
    if (src[k] && typeof src[k] === 'object' && dst[k] && typeof dst[k] === 'object') deepMerge(dst[k], src[k]);
    else dst[k] = src[k];
  }
}
function saveSettings() {
  try { localStorage.setItem('fpv-sim-cfg-v1', JSON.stringify(SET)); } catch (e) { /* 忽略存储错误 */ }
}
function loadSettings() {
  try {
    const s = localStorage.getItem('fpv-sim-cfg-v1');
    if (s) deepMerge(SET, JSON.parse(s));
  } catch (e) { /* 损坏的配置则使用默认值 */ }
}
loadSettings();

/* ============================== 无人机状态 ============================== */
const HOME = [0, 0, 0];
const drone = {
  p: [0, 0.12, 0.15],   // 位置（世界系，米）
  v: [0, 0, 0],         // 速度（世界系）
  R: m3Identity(),      // 姿态：SO(3) 旋转矩阵（体->世界）
  w: [0, 0, 0],         // 机体角速度 rad/s（陀螺仪测量值）
  throttleActual: 0,    // 电机实际油门（含一阶滞后）
  integ: [0, 0, 0],     // PID 积分器
  wPrev: [0, 0, 0],     // 上一步角速度（D 项用）
  dFilt: [0, 0, 0],     // D 项低通滤波值
  armed: false,
  crashed: false,
  propAng: [0, 0, 0, 0]
};
let sticks = { roll: 0, pitch: 0, yaw: 0, throttle: 0 }; // 归一化后的摇杆
let flightTime = 0, battDrain = 0;
let signalRaw = 1, signalSm = 1, blackAmt = 0;
let failsafe = false, fsTimer = 0;
let losView = false; // false=FPV 第一人称, true=跟随视角
let orthoCount = 0;

const G = 9.81;
const H = 1 / 240;     // 物理固定步长
const D_ALPHA = 1 - Math.exp(-2 * Math.PI * 80 * H); // D 项低通（80Hz 截止）

/* ============================== 输入系统 ============================== */
const keys = {};
let gp = null; // 当前 gamepad
const kbdSticks = { roll: 0, pitch: 0, yaw: 0, throttle: 1 }; // 键盘虚拟摇杆（与手柄轴语义一致：上推=-1，油门初始在底部=+1）

window.addEventListener('keydown', e => {
  if (e.target && e.target.closest && e.target.closest('#panel')) return;
  keys[e.code] = true;
  if (e.code === 'Tab') { e.preventDefault(); togglePanel(); }
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Enter') toggleArm();
  if (e.code === 'KeyR') resetDrone();
  if (e.code === 'KeyC') losView = !losView;
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('gamepadconnected', () => { gp = null; buildInputTab(); });
window.addEventListener('gamepaddisconnected', () => { gp = null; buildInputTab(); });

function pollGamepad() {
  let found = null;
  if (navigator.getGamepads) {
    const list = navigator.getGamepads();
    for (let i = 0; i < list.length; i++) if (list[i] && list[i].connected) { found = list[i]; break; }
  }
  gp = found;
}
function updateKeyboard(dt) {
  const rate = 4.5, thrRate = 2.2;
  const tgtPitch = (keys.KeyI || keys.ArrowUp ? 1 : 0) + (keys.KeyK || keys.ArrowDown ? -1 : 0);
  const tgtRoll  = (keys.KeyL || keys.ArrowRight ? 1 : 0) + (keys.KeyJ || keys.ArrowLeft ? -1 : 0);
  const tgtYaw   = (keys.KeyD ? 1 : 0) + (keys.KeyA ? -1 : 0);
  kbdSticks.pitch += clamp(tgtPitch - kbdSticks.pitch, -rate * dt, rate * dt);
  kbdSticks.roll  += clamp(tgtRoll  - kbdSticks.roll,  -rate * dt, rate * dt);
  kbdSticks.yaw   += clamp(tgtYaw   - kbdSticks.yaw,   -rate * dt, rate * dt);
  const tt = (keys.KeyS ? -1 : 0) + (keys.KeyW ? 1 : 0); // 油门保持式：W 推高（轴向语义上推=-1，经默认反向后=加大油门）
  if (tt !== 0) kbdSticks.throttle = clamp(kbdSticks.throttle - tt * thrRate * dt, -1, 1);
}
/* Gamepad 默认映射（Mode 2 摇杆布局：右摇杆=俯仰/横滚，左摇杆=油门/偏航） */
function autoMap() {
  if (!gp) return { roll: 'kbd', pitch: 'kbd', yaw: 'kbd', throttle: 'kbd' };
  const n = gp.axes.length;
  if (n >= 4) return { roll: 2, pitch: 3, yaw: 0, throttle: 1 };
  if (n >= 2) return { roll: 0, pitch: 1, yaw: 'kbd', throttle: 'kbd' };
  return { roll: 'kbd', pitch: 'kbd', yaw: 'kbd', throttle: 'kbd' };
}
/* 取某通道归一化原始值 [-1,1]（应用轴向绑定与反向） */
function channelRaw(ch) {
  const cfg = SET.channels[ch];
  let src = cfg.src;
  if (src === 'auto') src = autoMap()[ch];
  let v;
  if (typeof src === 'number' && gp && gp.axes[src] !== undefined) v = gp.axes[src];
  else v = kbdSticks[ch];
  return cfg.inv ? -v : v;
}
function applyDeadband(x, db) {
  if (Math.abs(x) < db) return 0;
  return (x - Math.sign(x) * db) / (1 - db);
}
function applyExpo(x, e) { // x*( (1-e) + e·|x|^2 )
  const s = Math.sign(x), a = Math.abs(x);
  return s * a * ((1 - e) + e * a * a);
}
function computeSticks() {
  const db = SET.deadband, ex = SET.expo;
  sticks.roll     = applyExpo(applyDeadband(clamp(channelRaw('roll'), -1, 1), db), ex);
  sticks.pitch    = applyExpo(applyDeadband(clamp(channelRaw('pitch'), -1, 1), db), ex);
  sticks.yaw      = applyExpo(applyDeadband(clamp(channelRaw('yaw'), -1, 1), db), ex);
  sticks.throttle = clamp((channelRaw('throttle') + 1) * 0.5, 0, 1);
}
function toggleArm() {
  if (drone.crashed) return;
  if (!drone.armed) {
    if (sticks.throttle < 0.06) {
      drone.armed = true; flightTime = 0;
      ensureAudio();
    }
  } else drone.armed = false;
}
function resetDrone() {
  drone.p = [0, 0.12, 0.15]; drone.v = [0, 0, 0];
  drone.R = m3Identity(); drone.w = [0, 0, 0];
  drone.integ = [0, 0, 0]; drone.dFilt = [0, 0, 0]; drone.wPrev = [0, 0, 0];
  drone.throttleActual = 0; drone.armed = false; drone.crashed = false;
  failsafe = false; fsTimer = 0; blackAmt = 0; signalSm = 1;
  flightTime = 0; battDrain = 0;
  kbdSticks.throttle = 1;
}

/* ============================== 控制与物理 ==============================
 * 机体角速度三分量语义：w[0]=绕体X(俯仰速率), w[1]=绕体Y(偏航速率), w[2]=绕体Z(横滚速率)
 * 摇杆方向约定（Betaflight 习惯）：俯仰杆前推=低头，横滚杆右=右滚，偏航杆右=右偏航
 */
function getControl() {
  const d2r = Math.PI / 180;
  // 由摇杆得到目标机体角速度（Acro 角速度模式）
  let rates = [
    -sticks.pitch * SET.rates.pitch * d2r,
    -sticks.yaw   * SET.rates.yaw   * d2r,
    -sticks.roll  * SET.rates.roll  * d2r
  ];
  let thr = drone.armed ? sticks.throttle : 0;

  if (failsafe) { // 失控保护
    if (SET.vtx.failsafeMode === 'rth' && drone.armed && !drone.crashed) {
      // 简化 RTH：自动水平 + 机头指向起飞点 + 定高油门
      const R = drone.R;
      const fwd = [-R[6], -R[7], -R[8]], right = [R[0], R[1], R[2]], up = [R[3], R[4], R[5]];
      const pitchA = Math.asin(clamp(fwd[1], -1, 1));
      const rollA  = Math.atan2(right[1], up[1]);
      rates = [-2.6 * pitchA, 0, -2.6 * rollA];
      const toHome = vsub(HOME, drone.p); toHome[1] = 0;
      const hd = vlen(toHome);
      if (hd > 3) {
        const b = m3TMulV(R, vnorm(toHome));
        const yawErr = Math.atan2(b[0], -b[2]); // 目标方向相对机头的方位角
        rates[1] = -1.6 * clamp(yawErr, -1.4, 1.4);
        thr = clamp(0.30 + 0.045 * (12 - drone.p[1]), 0.16, 0.7);
      } else {
        thr = clamp(0.30 - 0.02 * drone.p[1], 0.1, 0.35); // 到家缓降
      }
    } else {
      thr = 0; rates = [0, 0, 0]; // 失控断电坠落
    }
  }
  if (!drone.armed) { thr = 0; rates = [0, 0, 0]; }
  // 电机是否参与控制：解锁且非"断电坠落"式失控保护
  const active = drone.armed && !(failsafe && SET.vtx.failsafeMode !== 'rth');
  if (!active) { thr = 0; rates = [0, 0, 0]; }
  return { thr, rates, active };
}

/* ------------------------------ 物理单步积分 ------------------------------
 * 平动：m·dv/dt = R·(0,T,0) + (0,-mg,0) - k·|v|·v
 * 转动（欧拉方程，体坐标系）：J·dw/dt = τ - w × (Jw)
 * 姿态：R ← R · exp([w·h]×)   ←←← SO(3) 精确积分（so(3) 指数映射），绝无欧拉角/万向节死锁
 */
function physicsStep(h, thrCmd, rates, active) {
  const R = drone.R, w = drone.w, J = [SET.phys.Jx, SET.phys.Jy, SET.phys.Jz];
  const gains = [SET.pid.pitch, SET.pid.yaw, SET.pid.roll]; // 对应 w[0..2]
  const tau = [0, 0, 0];

  if (active) {
    for (let i = 0; i < 3; i++) {
      const e = rates[i] - w[i];                       // 角速度误差
      drone.integ[i] = clamp(drone.integ[i] + e * h, -2.5, 2.5); // 积分项（含抗饱和限幅）
      const dRaw = -(w[i] - drone.wPrev[i]) / h;       // D 作用于测量值（陀螺）微分
      drone.dFilt[i] += (dRaw - drone.dFilt[i]) * D_ALPHA;
      tau[i] = gains[i].p * e + gains[i].i * drone.integ[i] + gains[i].d * drone.dFilt[i];
      tau[i] -= SET.phys.angDamp * w[i];               // 机体气动角阻尼
      drone.wPrev[i] = w[i];
    }
  } else {
    drone.integ = [0, 0, 0]; drone.dFilt = [0, 0, 0];
    for (let i = 0; i < 3; i++) { drone.wPrev[i] = w[i]; }
  }

  // 欧拉刚体转动方程：dw = J^-1 (τ - w × (Jw))
  const jw = [J[0] * w[0], J[1] * w[1], J[2] * w[2]];
  const gyro = vcross(w, jw);
  for (let i = 0; i < 3; i++) {
    w[i] += ((tau[i] - gyro[i]) / J[i]) * h;
    w[i] = clamp(w[i], -60, 60);
  }

  // 电机一阶响应滞后 → 总推力（沿机体 +Y，即 R 第二列方向）
  drone.throttleActual += (thrCmd - drone.throttleActual) * (1 - Math.exp(-h / Math.max(SET.phys.motorTau, 1e-3)));
  const Tmax = SET.phys.TWR * SET.phys.mass * G;
  const T = drone.throttleActual * Tmax;

  const v = drone.v, m = SET.phys.mass;
  const sp = vlen(v), kd = SET.phys.dragK;
  const drag = kd * sp; // F_drag = -k·|v|·v  →  与速度平方成正比
  const F = [
    R[3] * T - drag * v[0],
    R[4] * T - drag * v[1] - m * G,
    R[5] * T - drag * v[2]
  ];
  v[0] += F[0] / m * h; v[1] += F[1] / m * h; v[2] += F[2] / m * h;
  drone.p[0] += v[0] * h; drone.p[1] += v[1] * h; drone.p[2] += v[2] * h;

  // ============ 姿态 SO(3) 指数映射积分（核心约束） ============
  const dR = m3ExpSo3([w[0] * h, w[1] * h, w[2] * h]); // exp(so(3) 上的旋转矢量)
  drone.R = m3Mul(R, dR);
  if ((++orthoCount % 120) === 0) drone.R = m3Renormalize(drone.R); // 抑制数值漂移

  // 地面接触
  if (drone.p[1] < 0.10) {
    drone.p[1] = 0.10;
    const vy = v[1], tilt = drone.R[4], hs = Math.hypot(v[0], v[2]);
    if (drone.armed && (vy < -2.5 || tilt < 0.45 || hs > 7)) {
      crash(); return;
    }
    if (vy < 0) v[1] = -vy * 0.2;
    const f = Math.exp(-7 * h);
    v[0] *= f; v[2] *= f;
    const wf = Math.exp(-6 * h);
    w[0] *= wf; w[1] *= wf; w[2] *= wf;
  }
}
function crash() {
  drone.crashed = true; drone.armed = false;
  drone.v = [0, 0, 0]; drone.w = [0, 0, 0]; drone.throttleActual = 0;
}

/* ============================== 图传信号 / 失控保护 ============================== */
function updateSignal(dt, t) {
  const d = vlen(drone.p);
  const raw = clamp(1 - d / SET.vtx.range, 0, 1);
  const flutter = 0.5 + 0.5 * Math.sin(t * 7.3) * Math.sin(t * 3.1 + 1.7); // 多径抖动
  signalRaw = raw;
  const target = failsafe ? 0 : clamp(raw * (0.93 + 0.07 * flutter), 0, 1);
  signalSm += (target - signalSm) * Math.min(1, dt * 6);
  if (!failsafe) {
    if (raw <= 0.005) { fsTimer += dt; if (fsTimer > 0.4) { failsafe = true; } }
    else fsTimer = 0;
  } else if (raw > 0.05) { failsafe = false; fsTimer = 0; }
  blackAmt = failsafe ? Math.min(1, blackAmt + dt * 4) : 0;
}

/* ============================== WebGL 初始化 ============================== */
const canvas = $('glcanvas');
let gl = null;
try {
  gl = canvas.getContext('webgl', { antialias: false }) || canvas.getContext('experimental-webgl', { antialias: false });
} catch (e) { gl = null; }
if (!gl) {
  $('errtext').textContent = '无法初始化 WebGL，请使用支持 WebGL 的浏览器打开本文件。';
  $('errbox').style.display = 'flex';
  throw new Error('no webgl');
}

function compileShader(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src); gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error('Shader: ' + gl.getShaderInfoLog(sh));
  return sh;
}
function makeProgram(vsSrc, fsSrc, attribs) {
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, compileShader(gl.FRAGMENT_SHADER, fsSrc));
  attribs.forEach((name, i) => gl.bindAttribLocation(p, i, name));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('Link: ' + gl.getProgramInfoLog(p));
  return p;
}

/* ---------- 着色器：天空 ---------- */
const SKY_VS = `
attribute vec2 aPos; varying vec2 vUV;
void main(){ vUV = aPos; gl_Position = vec4(aPos, 0.0, 1.0); }`;
const SKY_FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 vUV;
uniform vec3 uFwd, uRight, uUp, uSun, uFogColor;
uniform float uTanV, uAspect, uTime;
float hash21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash21(i), b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0)), d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float fbm(vec2 p){ float s = 0.0, a = 0.5; for(int k = 0; k < 4; k++){ s += a * vnoise(p); p *= 2.03; a *= 0.5; } return s; }
void main(){
  vec3 ray = normalize(uFwd + uRight * (vUV.x * uAspect * uTanV) + uUp * (vUV.y * uTanV));
  float h = ray.y;
  vec3 zen = vec3(0.22, 0.46, 0.82);
  vec3 sky = mix(uFogColor, zen, pow(clamp(h, 0.0, 1.0), 0.55));
  if (h < 0.0) sky = mix(uFogColor, uFogColor * 0.72, clamp(-h * 3.0, 0.0, 1.0));
  float sd = max(dot(ray, uSun), 0.0);
  sky += vec3(1.0, 0.92, 0.75) * pow(sd, 90.0) * 0.25;
  sky += vec3(1.0, 0.98, 0.90) * smoothstep(0.99950, 0.99975, sd) * 3.0;
  float cm = smoothstep(0.02, 0.20, h);
  if (cm > 0.001) {
    vec2 cuv = ray.xz / (abs(h) + 0.12);
    float cn = fbm(cuv * 0.30 + vec2(uTime * 0.005, uTime * 0.0013));
    float cl = smoothstep(0.52, 0.80, cn) * cm;
    sky = mix(sky, vec3(0.98, 0.99, 1.0), cl * 0.85);
  }
  gl_FragColor = vec4(sky, 1.0);
}`;

/* ---------- 着色器：网格（地表/障碍物/机体） ----------
 * uMode: 0=纯色  1=门环橙白条纹(uv.x)  2=墙体棋盘  3=地表网格(世界坐标)  4=立柱警戒斜纹
 */
const MESH_VS = `
attribute vec3 aPos; attribute vec3 aNormal; attribute vec2 aUV;
uniform mat4 uVP, uModel; uniform mat3 uNrm;
varying vec3 vN; varying vec2 vUV; varying vec3 vW;
void main(){
  vec4 wp = uModel * vec4(aPos, 1.0);
  vW = wp.xyz; vN = uNrm * aNormal; vUV = aUV;
  gl_Position = uVP * wp;
}`;
const MESH_FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec3 vN; varying vec2 vUV; varying vec3 vW;
uniform vec3 uColor, uSun, uCamPos, uFogColor;
uniform float uMode, uFogDensity;
void main(){
  vec3 base = uColor;
  if (uMode > 3.5) {
    // 地表：草地棋盘 + 网格线 + 起飞坪（基于世界 XZ 坐标）
    vec2 gp = vW.xz;
    float ck = mod(floor(gp.x / 8.0) + floor(gp.y / 8.0), 2.0);
    base = mix(vec3(0.30, 0.43, 0.24), vec3(0.36, 0.51, 0.27), ck);
    float d = length(vW - uCamPos);
    float lw = 0.05 + d * 0.006;
    vec2 q = abs(fract(gp * 0.25 + 0.5) - 0.5) * 4.0; // 到最近 4m 网格线的距离
    float line = smoothstep(lw, 0.0, min(q.x, q.y));
    base = mix(base, vec3(0.72, 0.78, 0.72), line * 0.55);
    float r = length(gp);
    base = mix(base, vec3(0.62, 0.62, 0.64), smoothstep(0.65, 0.5, r));      // 起飞坪
    base = mix(base, vec3(0.88, 0.16, 0.10), smoothstep(0.20, 0.06, abs(r - 2.1))); // 红环
    base = mix(base, vec3(0.95, 0.95, 0.95), smoothstep(0.10, 0.03, abs(r - 2.45)));
  } else if (uMode > 2.5) {
    float st = mod(floor(vUV.x * 10.0 + vUV.y * 3.0), 2.0);
    base = mix(vec3(0.13, 0.13, 0.14), vec3(0.98, 0.82, 0.10), st);
  } else if (uMode > 1.5) {
    float ck = mod(floor(vUV.x * 4.0) + floor(vUV.y * 4.0), 2.0);
    base = uColor * mix(0.62, 1.0, ck);
  } else if (uMode > 0.5) {
    float st = mod(floor(vUV.x * 20.0), 2.0);
    base = mix(vec3(1.0, 1.0, 1.0), vec3(1.0, 0.42, 0.05), st);
  }
  vec3 n = normalize(vN);
  float dif = max(dot(n, uSun), 0.0);
  float amb = 0.42 + 0.16 * n.y;
  vec3 col = base * (amb + dif * 0.78);
  float d = length(vW - uCamPos);
  float fog = 1.0 - exp(-d * uFogDensity);
  col = mix(col, uFogColor, fog);
  gl_FragColor = vec4(col, 1.0);
}`;

/* ---------- 着色器：VTX 模拟图传后处理 ----------
 * 信号强度 uSignal: 1=满格 → 0=失联。随距离衰减渐进出现：
 * 雪花噪点 / 横向撕裂 / 不同步滚动条纹 / 色散 / 果冻 / 暗角 / 失联黑屏(uBlack)
 */
const VTX_VS = `
attribute vec2 aPos; varying vec2 vUV;
void main(){ vUV = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;
const VTX_FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 vUV;
uniform sampler2D uTex;
uniform vec2 uRes;
uniform float uTime, uSignal, uThrottle, uBlack;
uniform float uNoiseAmt, uTearAmt, uBandAmt, uJello;
float hash21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
void main(){
  vec2 c = vUV - 0.5;
  float r2 = dot(c, c);
  // 桶形畸变（模拟镜头）
  vec2 duv = vUV + c * r2 * 0.10;
  // 果冻效应（电机振动导致的行波动）
  duv.x += sin(duv.y * uRes.y * 0.55 + uTime * 88.0) * 0.0024 * uThrottle * uJello;
  float s = clamp(uSignal, 0.0, 1.0);
  float q = 1.0 - s;                       // 信号劣化度
  // 横向撕裂：按行带 + 随机触发
  float bandId = floor(duv.y * 36.0);
  float tt = floor(uTime * 24.0);
  float hr = hash21(vec2(bandId, tt));
  float p = q * q * 0.85 * uTearAmt;
  float torn = step(hr, p);
  duv.x += torn * (hash21(vec2(bandId * 1.73 + 3.1, tt + 11.0)) - 0.5) * 0.5 * q * uTearAmt;
  duv.x += (hash21(vec2(tt, 17.0)) - 0.5) * q * q * 0.05 * uTearAmt; // 偶发整帧抖动
  duv = clamp(duv, 0.0, 1.0);
  // 色散（随信号劣化加剧）
  float ca = (0.0012 + 0.006 * q) * (1.0 + r2 * 2.0);
  vec3 col;
  col.r = texture2D(uTex, duv + vec2(ca, 0.0)).r;
  col.g = texture2D(uTex, duv).g;
  col.b = texture2D(uTex, duv - vec2(ca, 0.0)).b;
  // 不同步滚动条纹（两条速度不同的暗带循环滚动）
  float band1 = 0.5 + 0.5 * sin((duv.y + uTime * 0.21) * 12.566);
  float band2 = 0.5 + 0.5 * sin((duv.y - uTime * 0.43) * 6.2831);
  col *= 1.0 - uBandAmt * q * (0.16 * band1 + 0.12 * band2);
  // 雪花噪点
  float n = hash21(floor(vUV * uRes) + vec2(fract(uTime * 13.7) * 91.0, fract(uTime * 7.3) * 57.0));
  float grain = clamp(q * 1.4 * uNoiseAmt, 0.0, 1.0) * (0.55 + 0.45 * hash21(vec2(tt, 5.0)));
  col = mix(col, vec3(n), grain);
  // 扫描线 / 暗角 / 模拟黑位
  col *= 0.93 + 0.07 * sin(vUV.y * uRes.y * 3.14159);
  col *= 1.0 - 0.38 * r2;
  col *= mix(0.30, 1.0, smoothstep(0.0, 0.35, s));
  col.r *= 1.0 + q * 0.08;
  col = col * 0.96 + 0.02;
  // 失联彻底黑屏
  col *= (1.0 - uBlack);
  gl_FragColor = vec4(col, 1.0);
}`;

const skyProg   = makeProgram(SKY_VS, SKY_FS, ['aPos']);
const meshProg  = makeProgram(MESH_VS, MESH_FS, ['aPos', 'aNormal', 'aUV']);
const vtxProg   = makeProgram(VTX_VS, VTX_FS, ['aPos']);
const U = p => new Proxy({}, { get: (_, k) => gl.getUniformLocation(p, k) });
const uSky = U(skyProg), uMesh = U(meshProg), uVtx = U(vtxProg);

/* ---------- 全屏三角形 ---------- */
const fsBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, fsBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

/* ============================== 几何生成 ============================== */
class MeshData {
  constructor() { this.pos = []; this.nrm = []; this.uv = []; this.idx = []; }
  quad(p0, p1, p2, p3, n, uvs) {
    const b = this.pos.length / 3;
    [p0, p1, p2, p3].forEach((p, i) => {
      this.pos.push(p[0], p[1], p[2]);
      if (Array.isArray(n[0])) { this.nrm.push(n[i][0], n[i][1], n[i][2]); }
      else this.nrm.push(n[0], n[1], n[2]);
      const t = uvs ? uvs[i] : [[0, 0], [1, 0], [1, 1], [0, 1]][i];
      this.uv.push(t[0], t[1]);
    });
    this.idx.push(b, b + 1, b + 2, b, b + 2, b + 3);
  }
  tri(a, b, c, n) {
    const base = this.pos.length / 3;
    [a, b, c].forEach(p => { this.pos.push(p[0], p[1], p[2]); this.nrm.push(n[0], n[1], n[2]); this.uv.push(0, 0); });
    this.idx.push(base, base + 1, base + 2);
  }
}
function meshBox(w, h, d) {
  const x = w / 2, y = h / 2, z = d / 2, m = new MeshData();
  m.quad([x, -y, z], [x, -y, -z], [x, y, -z], [x, y, z], [1, 0, 0]);
  m.quad([-x, -y, -z], [-x, -y, z], [-x, y, z], [-x, y, -z], [-1, 0, 0]);
  m.quad([-x, y, -z], [x, y, -z], [x, y, z], [-x, y, z], [0, 1, 0]);
  m.quad([-x, -y, z], [x, -y, z], [x, -y, -z], [-x, -y, -z], [0, -1, 0]);
  m.quad([-x, -y, z], [x, -y, z], [x, y, z], [-x, y, z], [0, 0, 1]);
  m.quad([x, -y, -z], [-x, -y, -z], [-x, y, -z], [x, y, -z], [0, 0, -1]);
  return m;
}
function meshCylinder(r, h, seg) { // 沿 Y 轴
  const m = new MeshData(), y0 = -h / 2, y1 = h / 2;
  for (let i = 0; i < seg; i++) {
    const a0 = i / seg * Math.PI * 2, a1 = (i + 1) / seg * Math.PI * 2;
    const c0 = Math.cos(a0), s0 = Math.sin(a0), c1 = Math.cos(a1), s1 = Math.sin(a1);
    const u0 = i / seg, u1 = (i + 1) / seg;
    m.quad(
      [r * c0, y0, r * s0], [r * c1, y0, r * s1], [r * c1, y1, r * s1], [r * c0, y1, r * s0],
      [[c0, 0, s0], [c1, 0, s1], [c1, 0, s1], [c0, 0, s0]],
      [[u0, 0], [u1, 0], [u1, 1], [u0, 1]]
    );
    m.tri([0, y1, 0], [r * c0, y1, r * s0], [r * c1, y1, r * s1], [0, 1, 0]);
    m.tri([0, y0, 0], [r * c1, y0, r * s1], [r * c0, y0, r * s0], [0, -1, 0]);
  }
  return m;
}
function meshTorus(R, r, seg1, seg2) { // 环面位于 XY 平面，轴向为 Z（可沿 Z 穿越）
  const m = new MeshData();
  for (let i = 0; i < seg1; i++) {
    const u0 = i / seg1 * Math.PI * 2, u1 = (i + 1) / seg1 * Math.PI * 2;
    for (let j = 0; j < seg2; j++) {
      const v0 = j / seg2 * Math.PI * 2, v1 = (j + 1) / seg2 * Math.PI * 2;
      const pt = (u, v) => [(R + r * Math.cos(v)) * Math.cos(u), (R + r * Math.cos(v)) * Math.sin(u), r * Math.sin(v)];
      const nm = (u, v) => [Math.cos(u) * Math.cos(v), Math.sin(u) * Math.cos(v), Math.sin(v)];
      const uu0 = i / seg1, uu1 = (i + 1) / seg1, vv0 = j / seg2, vv1 = (j + 1) / seg2;
      m.quad(pt(u0, v0), pt(u1, v0), pt(u1, v1), pt(u0, v1),
        [nm(u0, v0), nm(u1, v0), nm(u1, v1), nm(u0, v1)],
        [[uu0, vv0], [uu1, vv0], [uu1, vv1], [uu0, vv1]]);
    }
  }
  return m;
}
class Mesh {
  constructor(data) {
    this.count = data.idx.length;
    this.bufs = [
      gl.createBuffer(), gl.createBuffer(), gl.createBuffer()
    ];
    const [bp, bn, bt] = this.bufs;
    gl.bindBuffer(gl.ARRAY_BUFFER, bp); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data.pos), gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, bn); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data.nrm), gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, bt); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data.uv), gl.STATIC_DRAW);
    this.ibo = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.ibo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(data.idx), gl.STATIC_DRAW);
  }
  bind() {
    const stride = [3, 3, 2];
    this.bufs.forEach((b, i) => {
      gl.bindBuffer(gl.ARRAY_BUFFER, b);
      gl.enableVertexAttribArray(i);
      gl.vertexAttribPointer(i, stride[i], gl.FLOAT, false, 0, 0);
    });
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.ibo);
  }
}

let vtxTarget = null, vtxW = 0, vtxH = 0;
function makeTarget(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const depth = gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER, depth);
  gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, w, h);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, depth);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex, fbo, depth, w, h };
}
function ensureVtxTarget() {
  const [w, h] = SET.vtx.res.split('x').map(Number);
  if (w !== vtxW || h !== vtxH) {
    if (vtxTarget) {
      gl.deleteFramebuffer(vtxTarget.fbo);
      gl.deleteTexture(vtxTarget.tex);
      gl.deleteRenderbuffer(vtxTarget.depth);
    }
    vtxTarget = makeTarget(w, h); vtxW = w; vtxH = h;
  }
}
ensureVtxTarget();

function computeCamera() {
  const R = drone.R;
  if (!losView) {
    // FPV：机载相机，带固定上仰角
    const tilt = SET.vtx.tilt * Math.PI / 180;
    const Rc = m3Mul(R, m3RotX(tilt));
    const eye = vadd(drone.p, m3MulV(R, [0, 0.06, -0.10]));
    const view = m4ViewFromRT(Rc, eye);
    return { view, eye, right: [Rc[0], Rc[1], Rc[2]], up: [Rc[3], Rc[4], Rc[5]], fwd: [-Rc[6], -Rc[7], -Rc[8]] };
  }
  // 跟随视角
  const fwd = [-R[6], -R[7], -R[8]];
  const eye = vadd(vadd(drone.p, vscale(fwd, -3.6)), [0, 1.3, 0]);
  const view = m4LookAt(eye, drone.p, [0, 1, 0]);
  const cf = vnorm(vsub(drone.p, eye));
  const right = vnorm(vcross(cf, [0, 1, 0]));
  const up = vcross(right, cf);
  return { view, eye, right, up, fwd: cf };
}
function drawMesh(mesh, model, nrm, color, mode) {
  gl.uniformMatrix4fv(uMesh.uModel, false, model);
  gl.uniformMatrix3fv(uMesh.uNrm, false, nrm);
  gl.uniform3fv(uMesh.uColor, color);
  gl.uniform1f(uMesh.uMode, mode);
  mesh.bind();
  gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_SHORT, 0);
}
function renderScene(cam, t) {
  ensureVtxTarget();
  gl.bindFramebuffer(gl.FRAMEBUFFER, vtxTarget.fbo);
  gl.viewport(0, 0, vtxW, vtxH);
  gl.clearColor(FOG_COLOR[0], FOG_COLOR[1], FOG_COLOR[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  // 1) 天空（全屏射线求交，不写深度）
  gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
  gl.useProgram(skyProg);
  gl.bindBuffer(gl.ARRAY_BUFFER, fsBuf);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.disableVertexAttribArray(1); gl.disableVertexAttribArray(2);
  const aspect = vtxW / vtxH, tanV = Math.tan(SET.vtx.fov * Math.PI / 360);
  gl.uniform3fv(uSky.uFwd, cam.fwd);
  gl.uniform3fv(uSky.uRight, cam.right);
  gl.uniform3fv(uSky.uUp, cam.up);
  gl.uniform3fv(uSky.uSun, SUN);
  gl.uniform3fv(uSky.uFogColor, FOG_COLOR);
  gl.uniform1f(uSky.uTanV, tanV);
  gl.uniform1f(uSky.uAspect, aspect);
  gl.uniform1f(uSky.uTime, t);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // 2) 场景网格
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
  gl.useProgram(meshProg);
  const proj = m4Perspective(SET.vtx.fov * Math.PI / 180, aspect, 0.03, 2500);
  const vp = m4Mul(proj, cam.view);
  gl.uniformMatrix4fv(uMesh.uVP, false, vp);
  gl.uniform3fv(uMesh.uSun, SUN);
  gl.uniform3fv(uMesh.uCamPos, cam.eye);
  gl.uniform3fv(uMesh.uFogColor, FOG_COLOR);
  gl.uniform1f(uMesh.uFogDensity, FOG_DENSITY);
  for (const s of statics) drawMesh(s.mesh, s.model, s.nrm, s.color, s.mode);

  // 3) 机体部件
  const baseRot = drone.R, basePos = drone.p;
  for (const part of droneParts) {
    let rot = part.rot, pos = part.pos;
    if (part.prop >= 0) rot = m3Mul(m3RotY(drone.propAng[part.prop]), rot);
    const worldRot = m3Mul(baseRot, rot);
    const worldPos = vadd(basePos, m3MulV(baseRot, pos));
    drawMesh(part.mesh, m4FromRT(worldRot, worldPos), worldRot, part.color, 0);
  }
}
function renderVTX(t) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

/* ============================== 音频（电机音） ============================== */
const audio = { ctx: null };
function ensureAudio() {
  if (audio.ctx || !SET.vtx.sound) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    const master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 2400; filter.Q.value = 1.5;
    filter.connect(master);
    const o1 = ctx.createOscillator(); o1.type = 'sawtooth';
    const o2 = ctx.createOscillator(); o2.type = 'sawtooth';
    const og = ctx.createGain(); og.gain.value = 0.5;
    o1.connect(og); o2.connect(og); og.connect(filter);
    o1.start(); o2.start();
    // 风噪
    const nb = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const ch = nb.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    const ns = ctx.createBufferSource(); ns.buffer = nb; ns.loop = true;
    const nf = ctx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 900; nf.Q.value = 0.6;
    const ng = ctx.createGain(); ng.gain.value = 0;
    ns.connect(nf); nf.connect(ng); ng.connect(ctx.destination);
    ns.start();
    Object.assign(audio, { ctx, master, o1, o2, ng });
  } catch (e) { audio.ctx = null; }
}
function audioUpdate(dt) {
  if (!audio.ctx) return;
  try {
    const on = drone.armed && !drone.crashed;
    const thr = on ? drone.throttleActual : 0;
    const f = 75 + thr * 430;
    const t = audio.ctx.currentTime;
    audio.o1.frequency.setTargetAtTime(f, t, 0.05);
    audio.o2.frequency.setTargetAtTime(f * 2.02, t, 0.05);
    audio.master.gain.setTargetAtTime(thr * 0.055 + (on ? 0.015 : 0), t, 0.08);
    const spd = vlen(drone.v);
    audio.ng.gain.setTargetAtTime(clamp(spd / 40, 0, 1) * 0.05 * (on ? 1 : 0.4), t, 0.15);
  } catch (e) { /* 音频异常不影响模拟 */ }
}

function getPath(obj, path) { return path.split('.').reduce((o, k) => o[k], obj); }
function setPath(obj, path, v) {
  const ks = path.split('.'); const last = ks.pop();
  ks.reduce((o, k) => o[k], obj)[last] = v;
}

    setPath(SET, path, parseFloat(inp.value));
    val.textContent = fmt(parseFloat(inp.value));

function selectRow(parent, label, path, options) {

    const opts = [['auto', '自动'], ['kbd', '键盘']];
    const nAxes = gp ? Math.max(gp.axes.length, 8) : 12;
    for (let i = 0; i < nAxes; i++) opts.push(['a' + i, '手柄轴 ' + i]);
    opts.forEach(([v, txt]) => { const o = el('option', sel); o.value = v; o.textContent = txt; });
    const cur = SET.channels[ch].src;
    sel.value = (typeof cur === 'number' ? 'a' + cur : cur);
    sel.addEventListener('change', () => {
      SET.channels[ch].src = sel.value.startsWith('a') ? parseInt(sel.value.slice(1), 10) : sel.value;
      saveSettings();
    });
    const inv = el('input'); inv.type = 'checkbox'; inv.title = '反向';
    const wrap = el('label', row); wrap.textContent = '反向'; wrap.style.flex = '0 0 auto'; wrap.style.color = '#9fb4c4';
    wrap.insertBefore(inv, wrap.firstChild);
    inv.checked = SET.channels[ch].inv;
    inv.addEventListener('change', () => { SET.channels[ch].inv = inv.checked; saveSettings(); });
    const bar = el('div', row, 'bar');
    el('span', bar, 'mid');
    const fill = el('i', bar);
    chBars[ch] = fill;
  }

  el('h3', tab).textContent = '摇杆特性';
  sliderRow(tab, 'Expo 指数', 'expo', 0, 1, 0.01, fmt2);
  sliderRow(tab, '中心死区', 'deadband', 0, 0.15, 0.005, fmt3);
  sliderRow(tab, '横滚满杆速率 °/s', 'rates.roll', 200, 1200, 10, fmt0);
  sliderRow(tab, '俯仰满杆速率 °/s', 'rates.pitch', 200, 1200, 10, fmt0);
  sliderRow(tab, '偏航满杆速率 °/s', 'rates.yaw', 100, 800, 10, fmt0);

  el('h3', tab).textContent = '手柄原始轴监视';
  rawAxisWrap = el('div', tab);
  const note = el('div', tab, 'note');
  note.textContent = '提示: "自动" 按 Mode2 布局取右摇杆(轴2/3)=横滚/俯仰, 左摇杆(轴0/1)=偏航/油门; 可任意改绑到其他轴或键盘。';
}
function rebuildRawAxes() {
  if (!rawAxisWrap) return;
  rawAxisWrap.innerHTML = '';
  if (!gp) { rawAxisWrap.textContent = '（无设备）'; return; }
  for (let i = 0; i < gp.axes.length; i++) {
    const row = el('div', rawAxisWrap, 'chrow');
    const lab = el('label', row); lab.textContent = '轴 ' + i; lab.style.flex = '0 0 44px';
    const bar = el('div', row, 'bar');
    el('span', bar, 'mid');
    const fill = el('i', bar);
    const v = clamp(gp.axes[i], -1, 1);
    fill.style.left = (v < 0 ? 50 + v * 50 : 50) + '%';
    fill.style.width = Math.abs(v) * 50 + '%';
  }
}

/* ---------- PID 页 ---------- */
function buildPidTab() {
  const tab = $('tab-pid');
  const names = { roll: '横滚 Roll (绕体Z)', pitch: '俯仰 Pitch (绕体X)', yaw: '偏航 Yaw (绕体Y)' };
  for (const ax of ['roll', 'pitch', 'yaw']) {
    el('h3', tab).textContent = names[ax];
    sliderRow(tab, 'P 比例 N·m/(rad/s)', 'pid.' + ax + '.p', 0, 0.8, 0.01, fmt2);
    sliderRow(tab, 'I 积分 N·m/(rad·s)', 'pid.' + ax + '.i', 0, 3, 0.05, fmt2);
    sliderRow(tab, 'D 微分 N·m/(rad/s²)', 'pid.' + ax + '.d', 0, 0.02, 0.0005, fmt => fmt);
  }
  const note = el('div', tab, 'note');
  note.textContent = '角速度 PID 闭环: τ = P·e + I·∫e + D·dω/dt, e = 目标角速度 - 陀螺测量角速度; 输出力矩直接作用于刚体欧拉方程。';
}

/* ---------- 物理页 ---------- */
function buildPhysTab() {
  const tab = $('tab-phys');
  el('h3', tab).textContent = '机体';
  sliderRow(tab, '质量 kg', 'phys.mass', 0.3, 2, 0.01, fmt2);
  sliderRow(tab, '推重比 TWR', 'phys.TWR', 2, 10, 0.1, fmt2);
  sliderRow(tab, '电机响应 τ s', 'phys.motorTau', 0.01, 0.15, 0.005, fmt3);
  el('h3', tab).textContent = '气动物理';
  sliderRow(tab, '平动阻尼 k (F=-k|v|v)', 'phys.dragK', 0, 0.05, 0.001, fmt3);
  sliderRow(tab, '角阻尼 N·m/(rad/s)', 'phys.angDamp', 0, 0.002, 0.00005, v => v.toFixed(5));
  el('h3', tab).textContent = '转动惯量';
  sliderRow(tab, 'Jx 俯仰 kg·m²', 'phys.Jx', 0.002, 0.02, 0.0005, fmt3);
  sliderRow(tab, 'Jy 偏航 kg·m²', 'phys.Jy', 0.002, 0.02, 0.0005, fmt3);
  sliderRow(tab, 'Jz 横滚 kg·m²', 'phys.Jz', 0.002, 0.02, 0.0005, fmt3);
  const note = el('div', tab, 'note');
  note.textContent = '姿态以 SO(3) 旋转矩阵表达, 用 so(3) 指数映射 R←R·exp([ωh]×) 精确积分, 全程不使用欧拉角, 无万向节死锁。受力: 推力+重力+速度平方气动阻尼。';
}

/* ---------- 图传页 ---------- */
function buildVtxTab() {
  const tab = $('tab-vtx');
  el('h3', tab).textContent = '5.8G 模拟图传';
  sliderRow(tab, '有效距离 m', 'vtx.range', 30, 1000, 5, fmt0);
  sliderRow(tab, '雪花噪点强度', 'vtx.noise', 0, 2, 0.05, fmt2);
  sliderRow(tab, '画面撕裂强度', 'vtx.tear', 0, 2, 0.05, fmt2);
  sliderRow(tab, '滚动条纹强度', 'vtx.band', 0, 2, 0.05, fmt2);
  selectRow(tab, '失控保护', 'vtx.failsafeMode', [['drop', '断电坠落 (Drop)'], ['rth', '自动返航 (RTH)']]);
  el('h3', tab).textContent = '镜头与画面';
  sliderRow(tab, '垂直 FOV °', 'vtx.fov', 50, 130, 1, fmt0);
  sliderRow(tab, '摄像头上仰角 °', 'vtx.tilt', 0, 60, 1, fmt0);
  selectRow(tab, '图传分辨率', 'vtx.res', [['640x480', '640x480 (NTSC)'], ['720x576', '720x576 (PAL)'], ['1280x720', '1280x720 (HD)']]);
  checkRow(tab, '果冻效应', 'vtx.jello');
  checkRow(tab, '电机音效', 'vtx.sound');
}
buildInputTab(); buildPidTab(); buildPhysTab(); buildVtxTab();

$('resetBtn').addEventListener('click', () => {
  const fresh = {
    channels: {
      roll: { src: 'auto', inv: false }, pitch: { src: 'auto', inv: true },
      yaw: { src: 'auto', inv: false }, throttle: { src: 'auto', inv: true }
    },
    rates: { roll: 720, pitch: 650, yaw: 380 }, expo: 0.45, deadband: 0.02,
    pid: {
      roll: { p: 0.24, i: 0.6, d: 0.0026 }, pitch: { p: 0.24, i: 0.6, d: 0.0026 },
      yaw: { p: 0.32, i: 0.9, d: 0.002 }
    },
    phys: { mass: 0.68, Jx: 0.0042, Jy: 0.0071, Jz: 0.0045, TWR: 4.6, dragK: 0.010, motorTau: 0.045, angDamp: 0.00025 },
    vtx: { range: 160, res: '640x480', fov: 100, tilt: 22, noise: 1.0, tear: 1.0, band: 1.0, jello: true, failsafeMode: 'drop', sound: true }
  };
  deepMerge(SET, fresh);
  saveSettings();
  buildInputTab(); buildPidTab(); buildPhysTab(); buildVtxTab();
  ensureVtxTarget();
});

/* ============================== OSD ============================== */
const osdEls = {
  arm: $('armTxt'), rssi: $('rssiTxt'), batt: $('battTxt'), dist: $('distTxt'),
  thr: $('thrTxt'), spd: $('spdTxt'), alt: $('altTxt'), time: $('timeTxt'),
  warn: $('warn'), nosig: $('nosignal'), fps: $('fpsTxt')
};
function fmtTime(t) {
  const m = Math.floor(t / 60), s = t - m * 60;
  return String(m).padStart(2, '0') + ':' + s.toFixed(1).padStart(4, '0');
}
function updateOSD(fps) {
  osdEls.arm.textContent = drone.crashed ? '坠毁' : (drone.armed ? (failsafe ? '失控保护' : '已解锁') : '未解锁');
  osdEls.arm.style.color = drone.crashed ? '#ff5544' : (drone.armed && !failsafe ? '#5aff7a' : '#ffcc44');
  const pct = Math.round(signalSm * 100);
  const bars = Math.round(signalSm * 8);
  osdEls.rssi.textContent = 'RSSI ' + String(pct) + '% [' + '#'.repeat(bars) + '-'.repeat(8 - bars) + ']';
  osdEls.rssi.style.color = signalSm < 0.3 ? '#ff8866' : '#d8f0d8';
  const volt = clamp(16.8 - battDrain * 0.9 - drone.throttleActual * 1.3, 12.6, 16.8);
  osdEls.batt.textContent = volt.toFixed(1) + 'V';
  osdEls.batt.style.color = volt < 14.0 ? '#ff8866' : '#d8f0d8';
  osdEls.dist.textContent = '距离 ' + Math.round(vlen(drone.p)) + 'm';
  osdEls.thr.textContent = '油门 ' + Math.round(drone.throttleActual * 100) + '%';
  osdEls.spd.textContent = Math.round(vlen(drone.v) * 3.6) + ' km/h';
  osdEls.alt.textContent = '高度 ' + Math.max(0, drone.p[1]).toFixed(1) + 'm';
  osdEls.time.textContent = fmtTime(flightTime);
  osdEls.fps.textContent = fps > 0 ? fps + ' FPS' : '';

  let warn = '';
  if (drone.crashed) warn = 'CRASHED 已坠毁 · 按 R 复位';
  else if (failsafe) warn = 'FAILSAFE 失控保护';
  else if (signalRaw < 0.3) warn = 'LOW SIGNAL 信号弱';
  else if (volt < 14.0) warn = 'LOW BATT 电压低';
  osdEls.warn.style.display = warn ? 'block' : 'none';
  osdEls.warn.textContent = warn;
  osdEls.nosig.style.display = (failsafe && blackAmt > 0.9 && !losView) ? 'flex' : 'none';

  // 通道监视条
  for (const ch of ['roll', 'pitch', 'yaw', 'throttle']) {
    const f = chBars[ch];
    if (!f) continue;
    const v = ch === 'throttle' ? sticks.throttle * 2 - 1 : sticks[ch];
    f.style.left = (v < 0 ? 50 + v * 50 : 50) + '%';
    f.style.width = Math.abs(v) * 50 + '%';
  }
  const st = $('gpStatus');
  if (st) {
    const name = gp ? (gp.id || '手柄') : null;
    const cur = st.textContent;
    const want = gp ? '已连接设备: ' + name : '未检测到硬件遥控器（可插入手柄/游戏杆，或使用键盘）';
    if (cur !== want) st.textContent = want;
  }
}

/* ============================== 主循环 ============================== */
let last = performance.now(), acc = 0, uiTimer = 0, fpsCount = 0, fpsTime = 0, fpsShown = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const t = now / 1000;
  let dt = (now - last) / 1000; last = now;
  dt = clamp(dt, 0, 0.05);

  pollGamepad();
  updateKeyboard(dt);
  computeSticks();
  updateSignal(dt, t);

  if (!drone.crashed) {
    if (drone.armed) flightTime += dt;
    battDrain += drone.throttleActual * dt * 0.006;
    acc += dt;
    let n = 0;
    const ctl = getControl();
    while (acc >= H && n < 14) {
      physicsStep(H, ctl.thr, ctl.rates, ctl.active);
      acc -= H; n++;
    }
    if (n >= 14) acc = 0; // 避免螺旋积累
    // 螺旋桨视觉转动
    for (const part of droneParts) {
      if (part.prop >= 0) drone.propAng[part.prop] += part.spin * (25 + drone.throttleActual * 280) * dt;
    }
  }

  const cam = computeCamera();
  renderScene(cam, t);
  renderVTX(t);
  audioUpdate(dt);

  fpsCount++; fpsTime += dt;
  if (fpsTime >= 0.5) { fpsShown = Math.round(fpsCount / fpsTime); fpsCount = 0; fpsTime = 0; }
  uiTimer += dt;
  if (uiTimer >= 0.1) {
    updateOSD(fpsShown);
    rebuildRawAxes();
    uiTimer = 0;
  }
}
requestAnimationFrame(frame);
</script>
