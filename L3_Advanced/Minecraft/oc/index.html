<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方块世界 · 光影我的世界</title>
<link rel="icon" href="data:,">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1026; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; user-select: none; }
  #game { position: fixed; inset: 0; display: block; }

  #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,10,0) 55%, rgba(0,0,10,0.32) 100%); z-index: 5; }

  #crosshair { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 22px; height: 22px; z-index: 6; pointer-events: none; opacity: .92; }
  #crosshair::before, #crosshair::after { content: ""; position: absolute; background: rgba(255,255,255,.85); box-shadow: 0 0 2px rgba(0,0,0,.6); }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
  #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }

  #debug { position: fixed; top: 8px; left: 8px; color: rgba(255,255,255,.75); font: 11px/1.7 Consolas, monospace; text-shadow: 0 1px 2px rgba(0,0,0,.8); z-index: 6; pointer-events: none; background: rgba(0,0,0,.22); padding: 4px 8px; border-radius: 4px; }

  #hotbarWrap { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 6; pointer-events: none; text-align: center; }
  #itemName { color: #fff; font-size: 13px; margin-bottom: 6px; text-shadow: 0 1px 3px rgba(0,0,0,.9); min-height: 18px; }
  #hotbar { display: flex; gap: 3px; padding: 4px; background: rgba(0,0,0,.45); border: 2px solid rgba(255,255,255,.35); border-radius: 6px; }
  .slot { position: relative; width: 52px; height: 52px; border: 2px solid rgba(255,255,255,.25); border-radius: 3px; background-size: 100% 100%; image-rendering: pixelated; }
  .slot .num { position: absolute; top: 1px; left: 4px; font-size: 10px; color: rgba(255,255,255,.9); text-shadow: 0 1px 2px #000; }
  .slot.sel { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.35), 0 0 10px rgba(255,255,255,.25); transform: translateY(-4px); }

  #menu { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 30%, rgba(38,70,120,.55), rgba(8,12,28,.92)); backdrop-filter: blur(2px); }
  #menu.hidden { display: none; }
  #menu h1 { font-size: 64px; font-weight: 900; letter-spacing: 6px; color: transparent; background: linear-gradient(180deg, #eaffd0 0%, #8fe86a 45%, #3fa84c 60%, #c9f28a 100%); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 4px 14px rgba(0,0,0,.7)); text-align: center; }
  #menu .sub { margin-top: 6px; color: #cfe6ff; font-size: 15px; letter-spacing: 4px; text-shadow: 0 2px 6px #000; }
  #menu .box { margin-top: 34px; background: rgba(10,16,32,.72); border: 1px solid rgba(255,255,255,.18); border-radius: 10px; padding: 22px 30px; color: #dce8ff; font-size: 13px; line-height: 2.1; text-align: left; min-width: 380px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #menu .box b { color: #9fe97a; font-weight: 600; display: inline-block; min-width: 66px; }
  #menu .box .k { display: inline-block; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); border-radius: 4px; padding: 0 7px; margin: 0 2px; font-size: 12px; }
  #startBtn { margin-top: 30px; font-size: 20px; font-weight: 700; letter-spacing: 6px; color: #fff; background: linear-gradient(180deg, #7ddc5c, #3f9c3f); border: 2px solid rgba(255,255,255,.5); padding: 14px 74px; border-radius: 8px; cursor: pointer; box-shadow: 0 6px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.4); transition: transform .12s; }
  #startBtn:hover { transform: scale(1.05); }
  #startBtn:active { transform: scale(.97); }
  #pauseHint { position: fixed; left: 50%; bottom: 26%; transform: translateX(-50%); z-index: 9; color: #fff; font-size: 18px; background: rgba(0,0,0,.55); padding: 10px 22px; border-radius: 8px; display: none; letter-spacing: 2px; pointer-events: none; }
  #err { position: fixed; inset: auto 0 0 0; z-index: 99; color: #ffb4b4; background: rgba(40,0,0,.85); padding: 8px 14px; font: 12px/1.6 Consolas, monospace; white-space: pre-wrap; }
  #loading { position: fixed; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center; background: #0b1026; color: #9fc9ff; font-size: 15px; letter-spacing: 3px; }
  #loading.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="vignette"></div>
<div id="crosshair"></div>
<div id="debug">FPS --<br>生成中…</div>
<div id="hotbarWrap">
  <div id="itemName"></div>
  <div id="hotbar"></div>
</div>
<div id="loading">正在生成世界…</div>
<div id="pauseHint">鼠标已释放 · 点击画面恢复控制</div>
<div id="err" style="display:none"></div>

<div id="menu">
  <h1>方块世界</h1>
  <div class="sub">材质 · 光影 · 日夜交替</div>
  <div class="box">
    <div><b>移动</b> <span class="k">W</span><span class="k">A</span><span class="k">S</span><span class="k">D</span> / 方向键　　<b>跳跃</b> <span class="k">空格</span></div>
    <div><b>飞行</b> <span class="k">F</span> 切换　（空格 上升 / Shift 下降）</div>
    <div><b>冲刺</b> <span class="k">Ctrl</span>　　<b>潜行</b> <span class="k">Shift</span>（地面上）</div>
    <div><b>破坏</b> 鼠标左键（长按）　　<b>放置</b> 鼠标右键</div>
    <div><b>选择方块</b> 滚轮 或 <span class="k">1</span>~<span class="k">0</span></div>
  </div>
  <button id="startBtn">进入世界</button>
</div>

<script src="three.min.js"></script>
<script>
'use strict';
(function () {
  var params = new URLSearchParams(location.search);
  var SEED = parseInt(params.get('seed') || '1337', 10) || 1337;
  var START_TIME = parseFloat(params.get('time') || '50');
  var AUTO = params.get('auto') === '1';
  var CAM_MODE = params.get('cam') || 'orbit';

  // ===================== 基础常量 =====================
  var CHUNK = 16, H = 64, WATER_LEVEL = 15;
  var AIR = 0, B_GRASS = 1, B_DIRT = 2, B_STONE = 3, B_COBBLE = 4, B_LOG = 5,
      B_PLANKS = 6, B_LEAVES = 7, B_SAND = 8, B_GLASS = 9, B_BRICK = 10, B_SNOW = 11, B_WATER = 12;
  var WORLD_R = 4; // 区块半径
  var BLOCK_NAMES = ['空气','草方块','泥土','石头','圆石','橡木原木','橡木木板','橡树树叶','沙子','玻璃','红砖','雪块','水'];

  function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }

  // ===================== 噪声（确定性） =====================
  function hash2(x, z) {
    var s = Math.sin(x * 127.1 + z * 311.7 + SEED * 7.137) * 43758.5453123;
    return s - Math.floor(s);
  }
  function vnoise(x, z) {
    var ix = Math.floor(x), iz = Math.floor(z);
    var fx = x - ix, fz = z - iz;
    var sx = fx * fx * (3 - 2 * fx), sz = fz * fz * (3 - 2 * fz);
    var a = hash2(ix, iz), b = hash2(ix + 1, iz), c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1);
    return a + (b - a) * sx + (c - a) * sz + (a - b - c + d) * sx * sz;
  }
  function fbm(x, z, oct) {
    var amp = 1, f = 1, sum = 0, norm = 0;
    for (var i = 0; i < (oct || 5); i++) {
      sum += amp * vnoise(x * f, z * f);
      norm += amp; amp *= 0.5; f *= 2.1;
    }
    return sum / norm;
  }
  function terrainHeight(x, z) {
    var base = fbm(x * 0.011, z * 0.011, 4) * 20 + 7;
    var hills = fbm(x * 0.045 + 17.3, z * 0.045 + 9.1, 4) * 9;
    var ridge = 1 - Math.abs(vnoise(x * 0.0065 + 31, z * 0.0065 - 19) * 2 - 1);
    ridge = ridge * ridge * ridge * ridge;
    var mountains = fbm(x * 0.02 - 55, z * 0.02 + 41, 5) * 32;
    var h = base + hills + ridge * mountains;
    return Math.max(1, Math.min(H - 5, h));
  }
  function surfaceType(h, x, z) {
    if (h >= 46) return B_SNOW;
    if (h <= WATER_LEVEL + 1) return B_SAND;
    return B_GRASS;
  }

  // ===================== 程序化材质 =====================
  function makeTileCanvas(size) {
    var c = document.createElement('canvas'); c.width = c.height = size;
    return { c: c, ctx: c.getContext('2d') };
  }
  function pixelFill(ctx, size, fn) {
    var img = ctx.createImageData(size, size);
    var d = img.data;
    for (var y = 0; y < size; y++) for (var x = 0; x < size; x++) {
      var c = fn(x, y);
      var i = (y * size + x) * 4;
      d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = c[3];
    }
    ctx.putImageData(img, 0, 0);
  }
  var S = 32, rnd;
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function hsl(h, s, l, a) {
    s /= 100; l /= 100;
    var k = function (n) { return (n + h / 30) % 12; };
    var aa = s * Math.min(l, 1 - l);
    var f = function (n) {
      var kk = k(n);
      return l - aa * Math.max(-1, Math.min(kk - 3, Math.min(9 - kk, 1)));
    };
    return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255), a === undefined ? 255 : a];
  }
  function shade(c, mul) { return [Math.min(255, c[0] * mul), Math.min(255, c[1] * mul), Math.min(255, c[2] * mul), c[3]]; }
  function mix(c1, c2, t) { return [c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t, c1[2] + (c2[2] - c1[2]) * t, c1[3] + (c2[3] - c1[3]) * t]; }

  var TILE = {
    grassTop: function (r) {
      var c = makeTileCanvas(S), ctx = c.ctx;
      pixelFill(ctx, S, function (x, y) {
        var n = r();
        var g = mix(hsl(96, 52, 24), hsl(108, 50, 36), n * 0.9 + (Math.sin(x * 0.9 + y * 0.4) + 1) * 0.5 * 0.25);
        if (n > 0.62) g = shade(g, 1.22);
        return g;
      });
      return c.c;
    },
    grassSide: function (r) {
      var c = makeTileCanvas(S), ctx = c.ctx;
      pixelFill(ctx, S, function (x, y) {
        var d = mix(hsl(30, 38, 20), hsl(28, 40, 32), r());
        if (r() < 0.1) d = shade(d, 0.72);
        return d;
      });
      for (var x = 0; x < S; x++) {
        var strip = 3 + Math.floor(r() * 4);
        for (var y = 0; y < strip; y++) {
          var g = mix(hsl(100, 55, 24), hsl(112, 52, 34), r());
          ctx.fillStyle = 'rgb(' + g[0] + ',' + g[1] + ',' + g[2] + ')';
          ctx.fillRect(x, y, 1, 1);
        }
      }
      return c.c;
    },
    dirt: function (r) {
      var c = makeTileCanvas(S), ctx = c.ctx;
      pixelFill(ctx, S, function (x, y) {
        var d = mix(hsl(27, 34, 22), hsl(31, 42, 33), r());
        if (r() < 0.09) d = shade(d, 0.6);
        return d;
      });
      return c.c;
    },
    stone: function (r) {
      var c = makeTileCanvas(S), ctx = c.ctx;
      pixelFill(ctx, S, function (x, y) {
        var v = 42 + Math.floor(r() * 26);
        if (r() < 0.08) v -= 20;
        if (r() < 0.05) v += 16;
        return [v, v, v + Math.floor(r() * 6), 255];
      });
      return c.c;
    },
    cobble: function (r) {
      var c = makeTileCanvas(S), ctx = c.ctx;
      var cells = [];
      for (var i = 0; i < 9; i++) {
        var gx = (i % 3) * (S / 3) + S / 6, gy = Math.floor(i / 3) * (S / 3) + S / 6;
        var rr = 6 + Math.floor(r() * 3);
        var sh = 0.78 + r() * 0.45;
        cells.push({ x: gx + (r() - 0.5) * 4, y: gy + (r() - 0.5) * 4, r: rr, sh: sh });
      }
      pixelFill(ctx, S, function (x, y) {
        var best = 99, bestSh = 0.8;
        for (var k = 0; k < cells.length; k++) {
          var dx = x - cells[k].x, dy = y - cells[k].y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < best) { best = dist; bestSh = cells[k].sh; }
        }
        var edge = best > cells[0].r * 0.75;
        var v = 96 * bestSh + (r() - 0.5) * 30;
        if (edge) v *= 0.45;
        return [v, v, v + r() * 8, 255];
      });
      return c.c;
    },
    logSide: function (r) {
      var c = makeTileCanvas(S), ctx = c.ctx;
      pixelFill(ctx, S, function (x, y) {
        var v = 68 + Math.floor(r() * 30);
        var groove = (x % 8);
        if (groove === 0 || groove === 7) v *= 0.62;
        if (r() < 0.1) v *= 0.82;
        if (r() < 0.08) v *= 1.22;
        return [v * 0.82, v * 0.6, v * 0.34, 255];
      });
      return c.c;
    },
    logTop: function (r) {
      var c = makeTileCanvas(S), ctx = c.ctx;
      pixelFill(ctx, S, function (x, y) {
        var cx = x - S / 2 + 0.5, cy = y - S / 2 + 0.5;
        var d = Math.max(Math.abs(cx), Math.abs(cy));
        var ring = Math.floor(d / 3) % 2;
        var v = ring ? 96 : 74;
        v += (r() - 0.5) * 18;
        if (d < 2) v = 140;
        return [v * 0.85, v * 0.68, v * 0.4, 255];
      });
      return c.c;
    },
    planks: function (r) {
      var c = makeTileCanvas(S), ctx = c.ctx;
      pixelFill(ctx, S, function (x, y) {
        var row = Math.floor(y / 8);
        var base = [150 - row * 8, 112 - row * 6, 66 - row * 4];
        var v = (r() - 0.5) * 26;
        if ((y % 8) === 0 || (y % 8) === 7) v -= 34;
        if (r() < 0.06) v -= 30;
        var o = 0;
        return [base[0] + v + o, base[1] + v + o, base[2] + v, 255];
      });
      return c.c;
    },
    leaves: function (r) {
      var c = makeTileCanvas(S), ctx = c.ctx;
      var spots = [];
      for (var i = 0; i < 4; i++) spots.push([Math.floor(r() * S), Math.floor(r() * S), 0.5 + r() * 0.5]);
      pixelFill(ctx, S, function (x, y) {
        if (r() < 0.2) return [0, 0, 0, 0];
        var base = mix(hsl(96, 62, 12), hsl(120, 55, 26), r());
        for (var k = 0; k < spots.length; k++) {
          var dx = x - spots[k][0], dy = y - spots[k][1];
          if (dx * dx + dy * dy < 26) base = shade(base, 0.72 + spots[k][2] * 0.3);
        }
        if (r() < 0.1) base = shade(base, 1.35);
        return base;
      });
      return c.c;
    },
    sand: function (r) {
      var c = makeTileCanvas(S), ctx = c.ctx;
      pixelFill(ctx, S, function (x, y) {
        var d = mix(hsl(45, 48, 48), hsl(42, 42, 62), r());
        if (r() < 0.1) d = shade(d, 0.75);
        return d;
      });
      return c.c;
    },
    glass: function (r) {
      var c = makeTileCanvas(S), ctx = c.ctx;
      pixelFill(ctx, S, function (x, y) {
        var edge = x < 2 || x >= S - 2 || y < 2 || y >= S - 2;
        if (edge) {
          var b = 225 + (r() - 0.5) * 30;
          return [b, b, b, 220];
        }
        var t = r();
        if (t < 0.12) return [210, 230, 255, 60];
        return [255, 255, 255, 0];
      });
      return c.c;
    },
    brick: function (r) {
      var c = makeTileCanvas(S), ctx = c.ctx;
      pixelFill(ctx, S, function (x, y) {
        var row = Math.floor(y / 8);
        var off = row % 2 === 0 ? 0 : 8;
        var m = (y % 8) === 7;
        var vx = (x + off) % 16;
        var mortar = m || vx === 0 || vx === 15;
        if (mortar) {
          var g = 60 + (r() - 0.5) * 20;
          return [g, g, g, 255];
        }
        var b = mix(hsl(6, 52, 32), hsl(12, 50, 44), r());
        return b;
      });
      return c.c;
    },
    snow: function (r) {
      var c = makeTileCanvas(S), ctx = c.ctx;
      pixelFill(ctx, S, function (x, y) {
        var v = 205 + Math.floor(r() * 42);
        var b = (r() - 0.5) * 18;
        return [v + b, v + b + 2, v + 10, 255];
      });
      return c.c;
    },
    water: function (r) {
      var c = makeTileCanvas(S), ctx = c.ctx;
      pixelFill(ctx, S, function (x, y) {
        var wave = Math.sin((x + y) * 0.6) * 0.5 + 0.5;
        var base = mix(hsl(208, 88, 34), hsl(205, 90, 52), wave * 0.6 + r() * 0.4);
        if (r() < 0.06) base = shade(base, 1.35);
        return [base[0], base[1], base[2], 200];
      });
      return c.c;
    }
  };

  // 构建贴图集
  function buildTextures() {
    var tileCanvases = [];
    var order = ['grassTop', 'grassSide', 'dirt', 'stone', 'cobble', 'logSide', 'logTop', 'planks', 'leaves', 'sand', 'glass', 'brick', 'snow'];
    for (var i = 0; i < order.length; i++) {
      rnd = mulberry32(SEED * 100 + i * 7919);
      tileCanvases.push(TILE[order[i]](rnd));
    }
    rnd = mulberry32(SEED * 100 + 31337);
    var waterCanvas = TILE.water(rnd);
    var atl = document.createElement('canvas');
    atl.width = atl.height = 256;
    var actx = atl.getContext('2d');
    for (var k = 0; k < tileCanvases.length; k++) {
      actx.drawImage(tileCanvases[k], (k % 8) * 32, Math.floor(k / 8) * 32);
    }
    return { atlas: atl, water: waterCanvas, tiles: tileCanvases };
  }

  // ===================== 区块数据 =====================
  var chunks = new Map();
  function ckey(cx, cz) { return cx + ',' + cz; }
  function idxOf(x, y, z) { return (y * CHUNK + z) * CHUNK + x; }
  function genChunkData(cx, cz) {
    var data = new Uint8Array(CHUNK * CHUNK * H);
    var x0 = cx * CHUNK, z0 = cz * CHUNK;
    for (var x = 0; x < CHUNK; x++) for (var z = 0; z < CHUNK; z++) {
      var wx = x0 + x, wz = z0 + z;
      var h = Math.floor(terrainHeight(wx, wz));
      var top = surfaceType(h, wx, wz);
      var c = hash2(wx * 0.7 + 5, wz * 0.7 - 3);
      for (var y = 0; y <= h; y++) {
        var b;
        if (y === h) b = top;
        else if (y > h - 3) b = (top === B_SAND || top === B_SNOW) ? B_SAND : B_DIRT;
        else if (y < h - 3 && y > h - 3 - 6 && hash2(wx, y * 3.1, wz) < 0.03) b = B_COBBLE;
        else b = (hash2(wx + y, wz - y) < 0.012 && y > 4) ? B_COBBLE : B_STONE;
        data[idxOf(x, y, z)] = b;
      }
      for (var wy = h + 1; wy <= WATER_LEVEL; wy++) data[idxOf(x, wy, z)] = B_WATER;
      // 树
      if (top === B_GRASS && h > WATER_LEVEL + 1 && c > 0.985) {
        var th = 4 + Math.floor(hash2(wx * 3.3, wz * 3.3) * 3);
        for (var dy = 1; dy <= th && h + dy < H; dy++) data[idxOf(x, h + dy, z)] = B_LOG;
        var lh = h + th;
        for (var ly = 0; ly < 3; ly++) {
          var yy = lh - ly;
          if (yy >= H) continue;
          var rr = ly === 2 ? 1 : 2;
          for (var dx = -rr; dx <= rr; dx++) for (var dz = -rr; dz <= rr; dz++) {
            if (Math.abs(dx) === rr && Math.abs(dz) === rr && hash2(wx + dx * 7, wz + dz * 13, yy) > 0.5) continue;
            var bx = x + dx, bz = z + dz;
            if (bx < 0 || bx >= CHUNK || bz < 0 || bz >= CHUNK) continue;
            var tgt = data[idxOf(bx, yy, bz)];
            if (tgt === AIR || tgt === B_WATER || tgt === B_LEAVES) data[idxOf(bx, yy, bz)] = B_LEAVES;
          }
        }
      }
    }
    return data;
  }
  function ensureChunk(cx, cz) {
    var k = ckey(cx, cz);
    if (!chunks.has(k)) chunks.set(k, { cx: cx, cz: cz, data: genChunkData(cx, cz), meshes: null });
    return chunks.get(k);
  }
  function getBlock(wx, wy, wz) {
    if (wy < 0 || wy >= H) return 0;
    var cx = Math.floor(wx / CHUNK), cz = Math.floor(wz / CHUNK);
    var c = chunks.get(ckey(cx, cz));
    if (!c) return 0;
    return c.data[idxOf(wx - cx * CHUNK, wy, wz - cz * CHUNK)];
  }
  function setBlock(wx, wy, wz, b) {
    if (wy < 0 || wy >= H) return;
    var cx = Math.floor(wx / CHUNK), cz = Math.floor(wz / CHUNK);

    canvas.addEventListener('mousedown', function (e) {
      if (!isLocked && !AUTO) return;
      if (e.button === 0) breaking = true;
      if (e.button === 2) tryPlace();
    });
    document.addEventListener('mouseup', function (e) { if (e.button === 0) breaking = false; });
    document.addEventListener('mouseup', function (e) { if (e.button === 2) {} });
    canvas.addEventListener('wheel', function (e) {
      if (!isLocked && !AUTO) return;
      selSlot = (selSlot + (e.deltaY > 0 ? 1 : -1) + HOTBAR.length) % HOTBAR.length;
      updateHotbar();
    }, { passive: true });
    document.addEventListener('keydown', function (e) {
      keys[e.code] = true;
      if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
      if (e.code === 'KeyF') {
        player.flying = !player.flying;
        if (player.flying) player.vel.set(0, 0, 0);
      }
      var n = parseInt(e.code.replace('Digit', ''), 10);
      if (!isNaN(n) && n >= 0 && n <= 9) {
        selSlot = n === 0 ? 9 : n - 1;
        updateHotbar();
      }
      if (e.code === 'KeyR' && !AUTO) {
        player.pos.copy(spawnPos); player.vel.set(0, 0, 0);
      }
    });
    document.addEventListener('keyup', function (e) { keys[e.code] = false; });
    window.addEventListener('blur', function () { keys = {}; breaking = false; });
    window.addEventListener('resize', function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  }

  function updatePlayer(dt) {
    var p = player;
    var fwd = new THREE.Vector3(-Math.sin(p.yaw), 0, -Math.cos(p.yaw));
    var right = new THREE.Vector3(-fwd.z, 0, fwd.x);
    var mx = (keys['KeyW'] || keys['ArrowUp'] ? 1 : 0) - (keys['KeyS'] || keys['ArrowDown'] ? 1 : 0);
    var mz = (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0) - (keys['KeyA'] || keys['ArrowLeft'] ? 1 : 0);
    var wish = new THREE.Vector3();
    wish.addScaledVector(fwd, mx);
    wish.addScaledVector(right, mz);
    if (wish.lengthSq() > 0) wish.normalize();

    var eyeBlock = getBlock(Math.floor(p.pos.x), Math.floor(p.pos.y + 1.4), Math.floor(p.pos.z));
    var inWater = eyeBlock === B_WATER;

    if (p.flying) {
      var spd = p.flySpeed * (keys['ControlLeft'] ? 1.8 : 1);
      wish.multiplyScalar(spd);
      var tvy = (keys['Space'] ? 1 : 0) - (keys['ShiftLeft'] ? 1 : 0);
      p.vel.x += (wish.x - p.vel.x) * Math.min(1, dt * 12);
      p.vel.z += (wish.z - p.vel.z) * Math.min(1, dt * 12);
      p.vel.y += (tvy * spd - p.vel.y) * Math.min(1, dt * 12);
    } else {
      var sprint = keys['ControlLeft'];
      var sneak = keys['ShiftLeft'];
      var speed = sneak ? 1.7 : (sprint ? 6.2 : 4.4);
      p.vel.x = wish.x * speed;
      p.vel.z = wish.z * speed;
      if (inWater) {
        p.vel.y -= 10 * dt;
        if (keys['Space']) p.vel.y = Math.max(p.vel.y, 3.4);
        p.vel.x *= Math.max(0, 1 - dt * 3);
        p.vel.z *= Math.max(0, 1 - dt * 3);
      } else {
        p.vel.y -= 26 * dt;
        if (keys['Space'] && p.onGround) { p.vel.y = 8.6; p.onGround = false; }
      }
    }
    p.onGround = false;
    moveAxis('y', p.vel.y * dt);
    moveAxis('x', p.vel.x * dt);
    moveAxis('z', p.vel.z * dt);
    if (p.pos.y < -14) { p.pos.copy(spawnPos); p.vel.set(0, 0, 0); }

    var eye = p.pos.y + 1.62;
    camera.position.set(p.pos.x, eye, p.pos.z);
    camera.rotation.y = p.yaw;
    camera.rotation.x = p.pitch;
    var targetFov = sprint && !p.flying ? 78 : 70;
    camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 8);
    camera.updateProjectionMatrix();
  }
  function moveAxis(axis, delta) {
    var p = player;
    p.pos[axis] += delta;
    var minX = p.pos.x - 0.3, maxX = p.pos.x + 0.3;
    var minY = p.pos.y, maxY = p.pos.y + 1.8;
    var minZ = p.pos.z - 0.3, maxZ = p.pos.z + 0.3;
    var x0 = Math.floor(minX), x1 = Math.floor(maxX);
    var y0 = Math.floor(minY), y1 = Math.floor(maxY);
    var z0 = Math.floor(minZ), z1 = Math.floor(maxZ);
    for (var ix = x0; ix <= x1; ix++) for (var iy = y0; iy <= y1; iy++) for (var iz = z0; iz <= z1; iz++) {
      if (!solidForPhysics(getBlock(ix, iy, iz))) continue;
      if (axis === 'x') {
        if (delta > 0) p.pos.x = ix - 0.301; else p.pos.x = ix + 1.301;
        p.vel.x = 0;
      } else if (axis === 'y') {
        if (delta > 0) { p.pos.y = iy - 1.801; p.vel.y = 0; }
        else { p.pos.y = iy + 1.001; p.vel.y = 0; p.onGround = true; }
      } else {
        if (delta > 0) p.pos.z = iz - 0.301; else p.pos.z = iz + 1.301;
        p.vel.z = 0;
      }
      break;
    }
  }

  // ===================== 方块交互 =====================
  function pickBlock() {
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    raycaster.far = 6.5;
    var hits = raycaster.intersectObjects(pickables, false);
    if (hits.length === 0) {
      outline.visible = false;
      return null;
    }
    var h = hits[0];
    var dir = raycaster.ray.direction;
    var px = h.point.x, py = h.point.y, pz = h.point.z;
    var bx = Math.floor(px + dir.x * 0.002), by = Math.floor(py + dir.y * 0.002), bz = Math.floor(pz + dir.z * 0.002);
    outline.position.set(bx + 0.5, by + 0.5, bz + 0.5);
    outline.visible = true;
    return { bx: bx, by: by, bz: bz, px: px, py: py, pz: pz, dir: dir };
  }
  function tryBreak() {
    var t = pickBlock();
    if (!t) return;
    if (getBlock(t.bx, t.by, t.bz) === B_WATER) return;
    setBlock(t.bx, t.by, t.bz, AIR);
  }
  function tryPlace() {
    var t = pickBlock();
    if (!t) return;
    var nb = getBlock(t.bx, t.by, t.bz);
    if (nb === AIR || nb === B_WATER) return;
    var d = t.dir;
    var px = Math.floor(t.px - d.x * 0.002), py = Math.floor(t.py - d.y * 0.002), pz = Math.floor(t.pz - d.z * 0.002);
    if (py < 0 || py >= H) return;
    if (getBlock(px, py, pz) !== AIR) return;
    // 不能放在玩家身体内
    if (px + 0.5 > player.pos.x - 0.3 && px - 0.5 < player.pos.x + 0.3 &&
        py + 0.5 > player.pos.y && py - 0.5 < player.pos.y + 1.8 &&
        pz + 0.5 > player.pos.z - 0.3 && pz - 0.5 < player.pos.z + 0.3) return;
    setBlock(px, py, pz, HOTBAR[selSlot]);
  }

  // ===================== 日夜循环 =====================
  var CYCLE = 240;
  function mixColor(c1, c2, t) {
    return new THREE.Color(c1).lerp(new THREE.Color(c2), t);
  }
  function updateSky(dt) {
    worldTime += dt;
    if (worldTime >= CYCLE) worldTime -= CYCLE;
    var e = Math.sin(Math.PI * worldTime / 120); // 太阳高度角 sin
    var day = clamp01(e * 1.05 + 0.10);
    var night = clamp01((-e - 0.05) * 1.2);
    var sunset = clamp01(1 - e / 0.55) * (e > 0.02 ? 1 : 0);

    var az = Math.PI * 0.3 + worldTime * 0.0045;
    var ce = Math.sqrt(Math.max(0, 1 - e * e));
    var sunDir = new THREE.Vector3(Math.cos(az) * ce, e, Math.sin(az) * ce);
    var moonDir = sunDir.clone().negate();

    var skyTop = mixColor(0x070b1c, 0x3f8efc, day);
    var skyHor = mixColor(mixColor(0x1b2440, 0xcfe8ff, day), 0xffa55a, sunset * 0.85);
    var glow = mixColor(0xff7a3c, 0x000000, 1 - sunset);
    skyDome.material.uniforms.topColor.value.copy(skyTop);
    skyDome.material.uniforms.horizonColor.value.copy(skyHor);
    skyDome.material.uniforms.glowColor.value.copy(glow);
    skyDome.material.uniforms.glowStrength.value = sunset * 1.0;

    var fogColor = mixColor(skyHor, 0x0e1428, night * 0.9);
    scene.fog.color.copy(fogColor);
    renderer.setClearColor(fogColor);

    var sunColor = new THREE.Color(0xfff2d8).lerp(new THREE.Color(0xff9a4d), sunset * 0.95);
    sunLight.color.copy(sunColor);
    sunLight.intensity = day * 2.05;
    moonLight.intensity = night * 0.55;
    hemiLight.intensity = 0.38 + day * 0.52 + night * 0.1;
    ambient.intensity = 0.17 + day * 0.13;

    var ppos = camera.position;
    sunLight.position.copy(sunDir).multiplyScalar(90).add(ppos);
    sunLight.target.position.copy(ppos);
    sunLight.target.updateMatrixWorld();
    sunLight.castShadow = day > 0.05;
    moonLight.position.copy(moonDir).multiplyScalar(90).add(ppos);
    moonLight.target.position.copy(ppos);
    moonLight.target.updateMatrixWorld();

    sunSprite.position.copy(sunDir).multiplyScalar(880).add(ppos);
    sunSprite.material.opacity = Math.max(0, e) * 1.2;
    moonSprite.position.copy(moonDir).multiplyScalar(880).add(ppos);
    moonSprite.material.opacity = night;
    stars.material.opacity = night * 0.95;
    skyDome.position.copy(ppos);
    skyDome.matrixAutoUpdate = false;
    skyDome.matrix.setPosition(ppos.x, ppos.y, ppos.z);

    // 云
    cloudA.position.x += dt * 5.2; cloudB.position.x += dt * 8;
    if (cloudA.position.x > 160) cloudA.position.x -= 320;
    if (cloudB.position.x > 160) cloudB.position.x -= 320;
    cloudA.position.z = ppos.z - 140 + Math.sin(worldTime * 0.05) * 40;
    cloudB.position.z = ppos.z + 120 + Math.cos(worldTime * 0.03) * 60;
    cloudA.material.opacity = 0.35 + day * 0.55;
    cloudB.material.opacity = 0.2 + day * 0.35;

    // 水面微动
    materials[3].map.offset.x = worldTime * 0.02;
  }

  function groundTopAt(x, z) {
    for (var y = H - 1; y >= 0; y--) {
      var b = getBlock(Math.floor(x), y, Math.floor(z));
      if (b !== AIR && b !== B_WATER) return y + 1;
    }
    return 1;
  }

  // ===================== 主循环 =====================
  var spawnPos = new THREE.Vector3();
  var clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05);

    if (AUTO && !(window.__t && window.__t.freezeCam)) {
      autoT += dt * 0.1;
      var targ = spawnPos.clone().add(new THREE.Vector3(0, 6, 0));
      if (CAM_MODE === 'ground') {
        var r = 9;
        var gx = spawnPos.x + Math.cos(autoT) * r, gz = spawnPos.z + Math.sin(autoT) * r;
        var gy = groundTopAt(gx, gz);
        camera.position.set(gx, Math.max(spawnPos.y + 2.2, gy + 1.7), gz);
        camera.lookAt(spawnPos.x, spawnPos.y + 2.4, spawnPos.z);
      } else if (CAM_MODE === 'close') {
        var tp = treeTarget;
        if (tp) {
          var px = tp.x + Math.cos(autoT) * 5.5, pz = tp.z + Math.sin(autoT) * 5.5;
          var py = groundTopAt(px, pz) + 1.8;
          camera.position.set(px, Math.max(py, tp.y + 2.2), pz);
          camera.lookAt(tp.x, tp.y + 1.2, tp.z);
        }
      } else {
        camera.position.set(
          spawnPos.x + Math.cos(autoT) * 58,
          38,
          spawnPos.z + Math.sin(autoT) * 58
        );
        camera.lookAt(targ);
      }
    } else if (!AUTO) {
      updatePlayer(dt);
      if (breaking) {
        breakTimer -= dt;
        if (breakTimer <= 0) { tryBreak(); breakTimer = 0.24; }
      } else if (pickBlock()) {
        // 高亮更新
      }
    }
    updateSky(dt);

    // FPS
    fpsAcc += dt; fpsFrames++;
    if (fpsAcc >= 0.5) {
      var fps = Math.round(fpsFrames / fpsAcc);
      fpsFrames = 0; fpsAcc = 0;
      var p = AUTO ? camera.position : player.pos;
      document.getElementById('debug').innerHTML =
        'FPS ' + fps + '　' +
        '坐标 ' + Math.floor(p.x) + ' ' + Math.floor(p.y) + ' ' + Math.floor(p.z) +
        (player.flying ? '　[飞行]' : '') +
        (AUTO ? '　[预览模式]' : '');
    }

    renderer.render(scene, camera);
  }

  // ===================== 启动 =====================
  try {
    initThree();
    setupControls();
    document.getElementById('loading').textContent = '正在生成世界…';
    setTimeout(function () {
      generateWorld();
      var sy = findSpawn();
      spawnPos.set(0.5, sy, 0.5);
      treeTarget = findTree();
      if (!AUTO) {
        player.pos.copy(spawnPos);
        player.yaw = -Math.PI * 0.45;
        player.pitch = -0.08;
      }
      if (AUTO) document.getElementById('menu').classList.add('hidden');
      animate();
    }, 30);
  } catch (err) {
    var el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent = '初始化失败: ' + (err && err.stack || err);
    document.getElementById('loading').classList.add('hidden');
  }

  // 调试钩子（浏览器自动化验证用）
  window.__t = { pickBlock: pickBlock, tryBreak: tryBreak, tryPlace: tryPlace, getBlock: getBlock, setBlock: setBlock, player: player, spawnPos: spawnPos, outline: outline, camera: camera, freezeCam: false };
})();
</script>
