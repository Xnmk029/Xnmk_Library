<script type="module">
/* ============================================================
   CONFIG 集中参数（燃烧黄金树 · 艾尔登法环夜景 · 单文件）
   世界尺度: 树高1400 | 树干0~770 | 树冠y∈[620,1460]
   华盖椭球壳: 心(0,980,0) RX=950 RY=470 | shellRadiusAt(y,az)=950*sqrt(1-h^2)*(0.4+0.9*fbm3(...4阶))
   相机: CAM_POS=(150,105,-3900) CAM_TARGET=(0,560,0) FOV=37 near=1 far=30000
   画质: ?q=high|medium|low（默认 high）
     叶簇 5200/3400/2000 | 碎叶 1100/700/420 | 火星 900/650/450
     灰烬 800/640/500 | 火焰 36/30/24 | 垂藤 26/22/18 | 光束 14/12/10
     烟团 8 | 城簇 12/10/8 | 植被 90/70/50 | 树干 44x48/36x40/28x32
   渲染: ACESFilmic exposure0.9 SRGB pixelRatio<=1.5 FogExp2(0x1a0d08,0.00028)
   后期: RenderPass->UnrealBloomPass(半分辨率 0.50/0.45/0.40 r0.70 t0.85)->VignettePass->OutputPass
   随机: mulberry32(20260802) 唯一随机源 | JS/GLSL 同构 vnoise3/fbm3/sstep
   降档: fps<24 持续 2.5s => bloom x0.8 | 20s 无操作绕Y缓转 0.008 rad/s
   ============================================================ */

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
function mergeGeos(gs){
  return BufferGeometryUtils.mergeGeometries(gs);
}

const ENABLE_CROWN_SMOKE = true;
const CAM_POS = [150, 105, -3900];
const CAM_TARGET = [0, 560, 0];
const CAM_FOV = 37;
const CAM_NEAR = 1, CAM_FAR = 30000;
const TREE_H = 1400;
const SHELL_C = new THREE.Vector3(0, 980, 0);
const SHELL_RX = 950, SHELL_RY = 470;
const UP = new THREE.Vector3(0, 1, 0);

const q = new URLSearchParams(location.search).get('q') || 'high';
const QUALITY = {
  high:  { leaves: 5200, frags: 1100, sparks: 900,  ashes: 800,  flames: 36, vines: 26, beams: 14, smoke: 8, city: 12, veg: 90,  trunkR: 44, trunkS: 48, bloom: 0.50 },
  medium:{ leaves: 3400, frags: 700,  sparks: 650,  ashes: 640,  flames: 30, vines: 22, beams: 12, smoke: 8, city: 10, veg: 70,  trunkR: 36, trunkS: 40, bloom: 0.45 },
  low:   { leaves: 2000, frags: 420,  sparks: 450,  ashes: 500,  flames: 24, vines: 18, beams: 10, smoke: 8, city: 8,  veg: 50,  trunkR: 28, trunkS: 32, bloom: 0.40 }
};
const Q = QUALITY[q] || QUALITY.high;

/* ---------- 唯一随机源 + JS 噪声（与 GLSL 同构） ---------- */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20260802);

function hash13(x, y, z){
  x += 1.0; y += 1.0; z += 1.0;
  let h = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
  h -= Math.floor(h);
  return h;
}
function vnoise3(x, y, z){
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  let fx = x - ix, fy = y - iy, fz = z - iz;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy), w = fz * fz * (3 - 2 * fz);
  const a = hash13(ix, iy, iz),     b = hash13(ix + 1, iy, iz),
        c = hash13(ix, iy + 1, iz), d = hash13(ix + 1, iy + 1, iz),
        e = hash13(ix, iy, iz + 1), f = hash13(ix + 1, iy, iz + 1),
        g = hash13(ix, iy + 1, iz + 1), h = hash13(ix + 1, iy + 1, iz + 1);
  const x1 = a + (b - a) * u, x2 = c + (d - c) * u, x3 = e + (f - e) * u, x4 = g + (h - g) * u;
  const y1 = x1 + (x2 - x1) * v, y2 = x3 + (x4 - x3) * v;
  return y1 + (y2 - y1) * w;
}
function fbm3(x, y, z, oct){
  let f = 0, amp = 0.5;
  for (let i = 0; i < oct; i++){
    f += amp * vnoise3(x, y, z);
    x = x * 2 + 11.3; y = y * 2 + 7.7; z = z * 2 + 5.1;
    amp *= 0.5;
  }
  return f;
}
function sstep(a, b, x){
  if (a === b) return x < a ? 0 : 1;
  if (a > b) return 1 - sstep(b, a, x);
  if (x <= a) return 0;
  if (x >= b) return 1;
  const t = (x - a) / (b - a);
  return t * t * (3 - 2 * t);
}

/* ---------- GLSL 公共前缀（NOISE） ---------- */
const GLSL_NOISE = `
float hash13(vec3 p){
  p = fract(p * 0.1031);
  p += dot(p, p.zyx + 31.32);
  return fract((p.x + p.y) * p.z);
}
float vnoise3(vec3 p){
  vec3 i = floor(p);
  vec3 f = fract(p);
  vec3 u = f * f * (3.0 - 2.0 * f);
  float n000 = hash13(i);
  float n100 = hash13(i + vec3(1.0, 0.0, 0.0));
  float n010 = hash13(i + vec3(0.0, 1.0, 0.0));
  float n110 = hash13(i + vec3(1.0, 1.0, 0.0));
  float n001 = hash13(i + vec3(0.0, 0.0, 1.0));
  float n101 = hash13(i + vec3(1.0, 0.0, 1.0));
  float n011 = hash13(i + vec3(0.0, 1.0, 1.0));
  float n111 = hash13(i + vec3(1.0, 1.0, 1.0));
  return mix(mix(mix(n000, n100, u.x), mix(n010, n110, u.x), u.y),
             mix(mix(n001, n101, u.x), mix(n011, n111, u.x), u.y), u.z);
}
float fbm(vec3 p){
  float f = 0.0;
  float a = 0.5;
  for (int i = 0; i < 4; i++){
    f += a * vnoise3(p);
    p = p * 2.0 + vec3(11.3, 7.7, 5.1);
    a *= 0.5;
  }
  return f;
}
float fbm5(vec3 p){
  float f = 0.0;
  float a = 0.5;
  for (int i = 0; i < 5; i++){
    f += a * vnoise3(p);
    p = p * 2.02 + vec3(13.7, 9.1, 3.9);
    a *= 0.5;
  }
  return f;
}
float sstep(float a, float b, float x){
  return smoothstep(a, b, x);
}
`;

/* ---------- G-1 叶簇/碎叶 ---------- */
const LEAF_VS = `
attribute float aPhase;
uniform float uTime;
varying vec2 vUv;
varying vec3 vCol;
void main() {
#ifdef USE_INSTANCING_COLOR
  float flick = 1.0 + 0.15 * sin(uTime * (1.0 + 2.0 * aPhase) + aPhase * 6.2831);
  vCol = instanceColor * flick;
#else
  vCol = vec3(0.85, 0.38, 0.08);
#endif
  vUv = uv;
  vec4 wp = instanceMatrix * vec4(position, 1.0);
  float ph = aPhase * 6.2831;
  float w1 = sin(uTime * (0.50 + aPhase * 0.40) + ph);
  float w2 = cos(uTime * (0.35 + aPhase * 0.50) + ph * 1.7);
  float amp = min(2.5, (0.6 + 1.6 * aPhase) * (wp.y / 1460.0 + 0.10));
  wp.x += w1 * amp;
  wp.z += w2 * amp;
  wp.y += sin(uTime * 0.9 + ph * 2.3) * amp * 0.20;
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;
const LEAF_FS = `
uniform sampler2D uTex;
varying vec2 vUv;
varying vec3 vCol;
void main() {
  vec4 t = texture2D(uTex, vUv);
  if (t.a < 0.45) discard;
  gl_FragColor = vec4(vCol * t.rgb, 1.0);
}`;

/* ---------- G-2 树皮（主干与枝干全部用此） ---------- */
const BARK_VS = `
varying vec3 vWorldPos;
varying vec3 vNormalW;
varying vec3 vCol;
void main(){
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vWorldPos = wp.xyz;
  vNormalW = normalMatrix * normal;
  vCol = color;
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;
const BARK_FS = GLSL_NOISE + `
uniform float uTime;
uniform vec3 uSunDir;
uniform vec3 uFogNear;
uniform vec3 uFogFar;
varying vec3 vWorldPos;
varying vec3 vNormalW;
varying vec3 vCol;
void main() {
  vec3 N = normalize(vNormalW);
  vec3 V = normalize(cameraPosition - vWorldPos);
  float lambert = max(dot(N, uSunDir), 0.0);
  float hF = clamp(vWorldPos.y / 1400.0, 0.0, 1.0);
  vec3 col = vec3(0.05, 0.045, 0.038) * (0.55 + 0.45 * lambert);
  float ang = atan(vWorldPos.z, vWorldPos.x);
  float fiber = fbm(vec3(ang * 13.0, vWorldPos.y * 0.004, 3.7));
  col *= 1.0 + 0.09 * (fiber - 0.5) * 2.0;
  col *= 0.85 + 0.15 * smoothstep(0.0, 1.0, abs(N.y));
  float heat = clamp(vCol.r, 0.0, 1.0);
  vec3 heatCol = mix(vec3(0.35, 0.10, 0.03), vec3(0.70, 0.26, 0.05), smoothstep(0.45, 0.9, heat));
  col += heatCol * smoothstep(0.40, 0.90, heat) * (0.25 + 0.75 * heat) * 0.55;
  col += vec3(0.70, 0.26, 0.05) * smoothstep(0.80, 1.0, heat) * 0.22;
  float dens = 0.32 + 0.68 * hF;
  float c1 = fbm(vec3(vWorldPos.x * 0.10, vWorldPos.y * 0.006 - uTime * 0.015, vWorldPos.z * 0.10));
  float c2 = fbm(vec3(vWorldPos.x * 0.26, vWorldPos.y * 0.017 - uTime * 0.045, vWorldPos.z * 0.26 + 7.31));
  float w = 0.055 + 0.08 * dens;
  float b = smoothstep(0.48 - w, 0.48, c1) * smoothstep(0.48 + w, 0.48, c1) * 0.8
          + smoothstep(0.52 - w, 0.52, c2) * smoothstep(0.52 + w, 0.52, c2) * 0.5;
  float crackMask = pow(clamp(b, 0.0, 1.0), 1.6);
  float pulse = fbm(vec3(vWorldPos.x * 0.35, vWorldPos.y * 0.02 - uTime * 0.30, vWorldPos.z * 0.35 + 1.7));
  vec3 crackCol = mix(vec3(0.30, 0.04, 0.005), vec3(1.0, 0.32, 0.04), smoothstep(0.25, 0.65, pulse));
  crackCol = mix(crackCol, vec3(1.0, 0.82, 0.45), smoothstep(0.80, 0.95, pulse));
  crackCol *= 1.0 + 0.6 * smoothstep(0.50, 0.90, pulse);
  float rootBoost = mix(1.7, 1.0, hF) * (0.5 + 0.5 * clamp(vCol.r, 0.0, 1.0));
  col += crackCol * crackMask * rootBoost;
  col += vec3(1.0, 0.45, 0.12) * pow(1.0 - max(dot(N, V), 0.0), 3.0) * 0.18;
  float dist = length(vWorldPos - cameraPosition);
  float fog = 1.0 - exp(-pow(dist * 0.00022, 1.7));
  vec3 fogCol = mix(uFogNear, uFogFar, clamp(dist / 6000.0, 0.0, 1.0));
  col = mix(col, fogCol, clamp(fog, 0.0, 0.9));
  gl_FragColor = vec4(col, 1.0);
}`;

/* ---------- G-3 天空（fbm 5 阶变体） ---------- */
const SKY_VS = `
varying vec3 vDir;
void main(){
  vDir = position;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;
const SKY_FS = GLSL_NOISE + `
uniform float uTime;
varying vec3 vDir;
void main() {
  vec3 dir = normalize(vDir);
  float h = dir.y;
  vec3 col = mix(vec3(0.16, 0.07, 0.035), vec3(0.028, 0.024, 0.022), smoothstep(-0.05, 0.35, h));
  float band = exp(-pow((h - 0.005) / 0.075, 2.0));
  col = mix(col, vec3(0.24, 0.10, 0.04), band * 0.90);
  float big = smoothstep(0.30, 0.50, fbm5(dir * 0.9 + 4.2));
  float cn1 = fbm5(vec3(dir.x * 2.2, dir.y * 4.0, dir.z * 2.2 + uTime * 0.002));
  float cn2 = fbm5(vec3(dir.x * 3.6, dir.y * 4.68, dir.z * 3.6 + uTime * 0.003));
  float cn3 = fbm5(vec3(dir.x * 6.3, dir.y * 5.7, dir.z * 6.3 + uTime * 0.005));
  float low = smoothstep(0.0, 0.22, h) * smoothstep(0.52, 0.08, h);
  float mid = smoothstep(0.10, 0.30, h) * smoothstep(0.65, 0.16, h);
  float high = smoothstep(0.28, 0.68, h);
  float m1 = smoothstep(0.47, 0.57, cn1) * (low * 0.7 + band * 0.9) * big;
  float m2 = smoothstep(0.47, 0.57, cn2) * (mid * 0.7) * big;
  float m3 = smoothstep(0.47, 0.57, cn3) * (high * 0.5) * big;
  float det = fbm5(dir * 7.0 + uTime * 0.004);
  col = mix(col, vec3(0.048, 0.033, 0.024) * (0.55 + 0.9 * det), m1);
  col = mix(col, vec3(0.036, 0.026, 0.020) * (0.55 + 0.9 * det), m2);
  col = mix(col, vec3(0.024, 0.018, 0.014) * (0.55 + 0.9 * det), m3);
  col = mix(col, vec3(0.022, 0.020, 0.018), smoothstep(0.0, -0.10, h));
  float fire = smoothstep(0.0, 0.30, h) * (1.0 - smoothstep(0.10, 0.30, h)) * pow(max(dot(dir, normalize(vec3(0.0, 0.3, 1.0))), 0.0), 1.5);
  col += vec3(0.55, 0.18, 0.04) * fire * 0.75;
  float azw = pow(max(dot(dir, normalize(vec3(0.0, 0.3, 1.0))), 0.0), 2.0);
  float ring = smoothstep(0.28, 0.38, h) * smoothstep(0.60, 0.48, h);
  float rn = fbm5(vec3(dir.x * 4.0, dir.y * 6.0 + uTime * 0.002, dir.z * 4.0 + 9.3));
  float ringMask = ring * azw * smoothstep(0.45, 0.58, rn);
  col = mix(col, vec3(0.06, 0.040, 0.028), ringMask);
  col += vec3(0.50, 0.16, 0.035) * ringMask * (1.0 - h) * 0.55;
  float ember = smoothstep(0.55, 0.75, h) * smoothstep(0.32, 0.14, fbm5(dir * 3.0 + 5.1));
  col = mix(col, vec3(0.06, 0.030, 0.018), ember * 0.45);
  col += vec3(0.014, 0.007, 0.004) * smoothstep(0.35, 0.80, h);
  float lum = dot(col, vec3(0.299, 0.587, 0.114));
  if (lum > 0.22) col *= 0.22 / lum;
  gl_FragColor = vec4(col, 1.0);
}`;

/* ---------- G-4 火焰舌（billboard，结构同 G-5） ---------- */
const FLAME_VS = `
attribute float aSize;
attribute float aPhase;
uniform float uTime;
varying vec2 vUv;
varying float vPhase;
varying float vFlick;
void main(){
  vUv = uv;
  vPhase = aPhase;
  vFlick = 1.0 + 0.15 * sin(uTime * (2.0 + aPhase * 2.5) + aPhase * 6.2831);
  vec3 right = vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]);
  vec3 up = vec3(viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1]);
  vec3 c = instanceMatrix[3].xyz;
  vec3 world = c + right * (position.x * aSize) + up * (position.y * aSize);
  gl_Position = projectionMatrix * viewMatrix * vec4(world, 1.0);
}`;
const FLAME_FS = GLSL_NOISE + `
uniform float uTime;
varying vec2 vUv;
varying float vPhase;
varying float vFlick;
void main() {
  float dx = (vUv.x - 0.5) / 0.26;
  float horiz = exp(-dx * dx);
  float vert = smoothstep(0.0, 0.18, vUv.y) * pow(max(0.0, 1.0 - vUv.y), 1.5);
  float n = fbm(vec3(vUv.x * 2.6, vUv.y * 1.8 - uTime * 1.5 + vPhase * 3.0, 4.7));
  float alpha = smoothstep(0.38, 0.62, n) * horiz * vert * 0.85;
  if (alpha < 0.02) discard;
  vec3 col = mix(vec3(1.0, 0.72, 0.30), vec3(0.85, 0.22, 0.03), vUv.y);
  gl_FragColor = vec4(col * alpha * vFlick, alpha * vFlick);
}`;

/* ---------- G-5 核心光晕 billboard ---------- */
const GLOW_VS = `
attribute float aSize;
attribute float aAlpha;
attribute float aPhase;
uniform float uTime;
varying vec2 vUv;
varying float vA;
void main(){
  vUv = uv;
  vec3 right = vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]);
  vec3 up = vec3(viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1]);
  vec3 c = instanceMatrix[3].xyz;
  vec3 world = c + right * (position.x * aSize) + up * (position.y * aSize);
  vA = aAlpha * (0.75 + 0.25 * sin(uTime * 0.30 + aPhase * 6.2831));
  gl_Position = projectionMatrix * viewMatrix * vec4(world, 1.0);
}`;
const GLOW_FS = `
uniform sampler2D uTex;
varying vec2 vUv;
varying float vA;
void main(){
  vec4 t = texture2D(uTex, vUv);
  gl_FragColor = vec4(t.rgb * vec3(1.0, 0.58, 0.16) * vA, t.a * vA);
}`;

/* ---------- G-6 剪影通用 ---------- */
const SIL_VS = `
varying vec3 vWorldPos;
void main(){
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vWorldPos = wp.xyz;
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;
const SIL_FS = `
uniform vec3 uColor;
uniform vec3 uFogNear;
uniform vec3 uFogFar;
varying vec3 vWorldPos;
void main(){
  float dist = length(vWorldPos - cameraPosition);
  float fog = 1.0 - exp(-pow(dist * 0.00030, 1.7));
  vec3 fogCol = mix(uFogNear, uFogFar, clamp(dist / 6000.0, 0.0, 1.0));
  gl_FragColor = vec4(mix(uColor, fogCol, clamp(fog, 0.0, 0.9)), 1.0);
}`;

/* ---------- G-7 体积光束 ---------- */
const BEAM_VS = GLSL_NOISE + `
attribute float aPhase;
uniform float uTime;
varying vec2 vUv;
varying float vPh;
void main(){
  vUv = uv;
  vPh = aPhase;
  vec3 p = position;
  p.x += sstep(0.2, 1.0, uv.y) * (position.x > 0.0 ? 1.0 : -1.0) * (4.0 + 3.0 * sin(uTime * (0.4 + 0.3 * aPhase) + aPhase * 6.2831));
  gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
}`;
const BEAM_FS = `
uniform sampler2D uTex;
uniform float uTime;
uniform float uAlpha;
varying vec2 vUv;
varying float vPh;
void main(){
  vec4 t = texture2D(uTex, vUv);
  float breath = 0.6 + 0.4 * (0.5 + 0.5 * sin(uTime * 0.4 + vPh * 6.2831));
  gl_FragColor = vec4(t.rgb, t.a * uAlpha * breath);

attribute float aV;
attribute float aSeed;
uniform float uTime;
varying vec3 vCol;
varying vec3 vWorldPos;

  p.z += cos(tt * 1.3 + aSeed * 2.7) * sway;
  p.y += sin(tt * 0.9 + aSeed * 4.1) * 0.15;

  vWorldPos = wp.xyz;
  float f = aV;
  vec3 colA = mix(vec3(0.55, 0.22, 0.06), vec3(0.85, 0.35, 0.08), sstep(0.0, 0.66, f));

const SPARK_VS = `
attribute float aPhase;

attribute float aAmp;
attribute float aHz;
attribute float aSize;
attribute vec3 aCol;

  pos.x += sin(uTime * aHz + aPhase * 6.2831) * aAmp * p;

/* ---------- 工具函数 ---------- */
function shellRadiusAt(y, az){
  const h = Math.max(-0.98, Math.min(0.98, (y - 980) / 470));
  const c = Math.cos(az) * 0.9, s = Math.sin(az) * 0.9;
  return 950 * Math.sqrt(Math.max(0, 1 - h * h)) * (0.4 + 0.9 * fbm3(c, y * 0.004, s, 4));
}
function canopyFireColor(y, kr){
  const t = sstep(620, 1460, y);
  const c = new THREE.Color(0.85, 0.38, 0.08);
  const wB = Math.max(t, sstep(0.40, 0.85, kr)) * 0.9;
  c.lerp(new THREE.Color(1.0, 0.62, 0.18), wB);
  const wD = Math.min(1, Math.max(1 - t, (1 - kr) * 0.5, sstep(0.88, 1.0, kr)) * 0.85);
  c.lerp(new THREE.Color(0.42, 0.10, 0.02), wD);
  return c.multiplyScalar(0.88 + 0.24 * rng());
}
function krAt(x, y, z){
  return Math.hypot(x, z) / Math.max(1, shellRadiusAt(y, Math.atan2(z, x)));
}
function terrainH(x, z){
  const d = Math.sqrt(x * x + z * z);
  return 30 * Math.exp(-(d * d) / (560 * 560)) + 10 * Math.exp(-(d * d) / (150 * 150))
       + (fbm3(x * 0.0012 + 7.3, 3.0, z * 0.0012 + 1.4, 4) - 0.5) * 12;
}

function makeCanvas(w, h){

function radialGlowTexture(inner, outer){

}
function tubeGeometry(pts, rings, segs, radFn, colFn){
  const n = Math.max(4, rings);
  const P = [];
  for (let i = 0; i < n; i++){
    const t = i / (n - 1);
    const idx = Math.min(pts.length - 1, Math.round(t * (pts.length - 1)));
    P.push(pts[idx]);
  }
  const frames = [];
  {
    let T = P[1].clone().sub(P[0]);
    if (T.lengthSq() < 1e-9) T.set(0, 1, 0);
    T.normalize();
    const ref = Math.abs(T.y) < 0.95 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
    let N = new THREE.Vector3().crossVectors(T, ref).normalize();
    let B = new THREE.Vector3().crossVectors(T, N).normalize();
    frames.push({ T: T.clone(), N: N, B: B });
  }
  for (let i = 1; i < n; i++){
    const T = P[Math.min(i + 1, n - 1)].clone().sub(P[Math.max(i - 1, 0)]);
    if (T.lengthSq() < 1e-12) T.copy(frames[i - 1].T);
    T.normalize();
    const qm = new THREE.Quaternion().setFromUnitVectors(frames[i - 1].T, T);
    const N = frames[i - 1].N.clone().applyQuaternion(qm);
    const B = frames[i - 1].B.clone().applyQuaternion(qm);
    frames.push({ T: T.clone(), N: N, B: B });
  }
  const pos = [], nor = [], uv = [], col = [], idx = [];
  for (let i = 0; i < n; i++){
    const t = i / (n - 1);
    const f = frames[i];
    for (let j = 0; j <= segs; j++){
      const a = (j / segs) * Math.PI * 2;
      const ca = Math.cos(a), sa = Math.sin(a);
      const r = radFn(t, a);
      const px = P[i].x + f.N.x * ca * r + f.B.x * sa * r;
      const py = P[i].y + f.N.y * ca * r + f.B.y * sa * r;
      const pz = P[i].z + f.N.z * ca * r + f.B.z * sa * r;
      const nx = f.N.x * ca + f.B.x * sa;
      const ny = f.N.y * ca + f.B.y * sa;
      const nz = f.N.z * ca + f.B.z * sa;
      pos.push(px, py, pz);
      nor.push(nx, ny, nz);
      uv.push(j / segs, t);
      const c = colFn(t, a);
      col.push(c.r, c.g, c.b);
    }
  }
  for (let i = 0; i < n - 1; i++){
    for (let j = 0; j < segs; j++){
      const a0 = i * (segs + 1) + j;
      idx.push(a0, a0 + 1, a0 + segs + 1, a0 + 1, a0 + segs + 2, a0 + segs + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  return g;
}
function instancedCards(quadGeo, material, items){
  const mesh = new THREE.InstancedMesh(quadGeo, material, items.length);
  const m4 = new THREE.Matrix4(), quat = new THREE.Quaternion(), eul = new THREE.Euler(), pos = new THREE.Vector3(), scl = new THREE.Vector3();
  for (let i = 0; i < items.length; i++){
    const it = items[i];
    pos.set(it.x, it.y, it.z);
    quat.setFromEuler(eul.set(0, rng() * Math.PI * 2, 0));
    scl.set(it.size, it.size * (0.85 + rng() * 0.25), 1);
    m4.compose(pos, quat, scl);
    mesh.setMatrixAt(i, m4);
    mesh.setColorAt(i, it.color);
  }
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.frustumCulled = false;
  scene.add(mesh);
  return mesh;
}

/* ---------- 纹理：叶簇（核心修复：高镂空） ---------- */
let leafTex, leafCoverage;
function makeLeafTexture(){
  const W = 256;
  let n = 40 + Math.floor(rng() * 21);
  let scale = 1.0;
  let coverage = 0;
  let c = makeCanvas(W, W);
  for (let attempt = 0; attempt < 26; attempt++){
    c = makeCanvas(W, W);
    const g = c.getContext('2d');
    for (let i = 0; i < n; i++){
      const ang = rng() * Math.PI * 2;
      const rad = Math.pow(rng(), 0.55) * 0.40 * (W / 2);
      const cx = W / 2 + Math.cos(ang) * rad;
      const cy = W / 2 + Math.sin(ang) * rad;
      const len = (10 + rng() * 12) * scale;
      const wid = len * 0.4;
      const gray = 0.72 + rng() * 0.28;
      g.save();
      g.translate(cx, cy);
      g.rotate(rng() * Math.PI * 2);
      g.fillStyle = 'rgb(' + (gray * 255 | 0) + ',' + (gray * 255 | 0) + ',' + (gray * 255 | 0) + ')';
      g.beginPath();
      g.moveTo(-len / 2, 0);
      g.quadraticCurveTo(0, -wid, len / 2, 0);
      g.quadraticCurveTo(0, wid, -len / 2, 0);
      g.fill();
      g.restore();
    }
    const img = g.getImageData(0, 0, W, W);
    let cnt = 0;
    for (let i = 3; i < img.data.length; i += 4){ if (img.data[i] >= 115) cnt++; }
    coverage = cnt / (W * W);
    if (coverage >= 0.18 && coverage <= 0.38) break;
    if (coverage > 0.38){ n = Math.max(18, Math.floor(n * 0.82)); scale *= 0.90; }
    else { n = Math.min(96, n + 8); scale *= 1.08; }
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  console.log('叶簇纹理覆盖率: ' + (coverage * 100).toFixed(1) + '%');
  return { tex: t, coverage: coverage };
}

function trunkR(t){
  return (45 + 52 * Math.pow(1 - t, 0.55))
       * (1 + 0.10 * Math.sin(6.1 * t + 1.3) + 0.07 * Math.sin(2.9 * t + 0.4))
       * (1 + 0.28 * Math.exp(-7 * t));
}

  new THREE.Vector3(0, 0, 0), new THREE.Vector3(5, 150, 3), new THREE.Vector3(12, 310, -8),

function rootGeometry(az, L, H0){
  const segs = 6;
  const pos = [], nor = [], uv = [], col = [], idx = [];
  const ox = -Math.sin(az), oz = Math.cos(az);
  const cx0 = Math.cos(az), cz0 = Math.sin(az);
  const r0 = trunkR(0) - 10;
  const baseY = terrainH(0, 0) - 3;
  for (let s = 0; s <= segs; s++){
    const f = s / segs;
    const dist = r0 + L * Math.pow(f, 1.15);
    const y = baseY + H0 * Math.pow(1 - f, 1.1) + H0 * 0.12 * f;
    const w = (22 + (6 - 22) * f) / 2;
    const px = cx0 * dist, pz = cz0 * dist;
    const hf = 1 - f;
    pos.push(px + ox * w, y, pz + oz * w);
    pos.push(px - ox * w, y, pz - oz * w);
    nor.push(ox, 0.25, oz); nor.push(ox, 0.25, oz);
    uv.push(0, 0); uv.push(1, 0);
    const cr = 0.20 + 0.10 * hf, cg = 0.10 + 0.05 * hf, cb = 0.04 + 0.03 * hf;
    col.push(cr, cg, cb, cr, cg, cb);
  }
  for (let s = 0; s < segs; s++){
    const a0 = s * 2;
    idx.push(a0, a0 + 1, a0 + 2, a0 + 1, a0 + 3, a0 + 2);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  return g;
}
function branchCurvePoints(p0, dir, len, elevEnd, curl, N){
  const R = new THREE.Vector3();
  R.crossVectors(dir, UP);
  if (R.lengthSq() < 1e-8) R.set(1, 0, 0); else R.normalize();
  const dirE = dir.clone();
  dirE.y = dir.y * elevEnd;
  dirE.normalize();
  const pts = [];
  const pos = p0.clone();
  for (let i = 0; i <= N; i++){
    const t = i / N;
    const d = new THREE.Vector3().lerpVectors(dir, dirE, sstep(0.55, 1.0, t)).normalize();
    pts.push(pos.clone());
    pos.addScaledVector(d, len / N);
  }
  for (let i = 0; i <= N; i++){
    const t = i / N;
    const u = Math.max(0, t - 0.55) / 0.45;
    pts[i].addScaledVector(R, curl * len * u * u * 0.30);
  }
  return pts;
}
function childDir(parentDir, spread, tropism, gold){
  const axis = new THREE.Vector3().crossVectors(UP, parentDir);
  if (axis.lengthSq() < 1e-8) axis.set(1, 0, 0);
  axis.normalize();
  axis.applyAxisAngle(parentDir, gold);
  const d = parentDir.clone().applyAxisAngle(axis, spread);
  d.y += tropism;
  d.normalize();
  return d;
}

    for (let i = 0; i < steps; i++){

{

  const cells = new Int8Array(N_AZ * N_Y);
  const mark = (x, y, z) => {
    if (y < 700) return;
    const az = Math.atan2(z, x);
    let ai = Math.floor((az + Math.PI) / (Math.PI * 2) * N_AZ);
    ai = (ai % N_AZ + N_AZ) % N_AZ;
    const yi = Math.max(0, Math.min(N_Y - 1, Math.floor((y - 700) / (1460 - 700) * N_Y)));
    cells[ai * N_Y + yi] = 1;
  };
  for (const it of leafItems) mark(it.x, it.y, it.z);
  let rate = () => {
    let empty = 0, total = 0;
    for (let i = 0; i < N_AZ * N_Y; i++){
      const yi = i % N_Y;
      const y = 700 + (yi + 0.5) / N_Y * 760;
      const az = (Math.floor(i / N_Y) + 0.5) / N_AZ * Math.PI * 2 - Math.PI;
      const R = shellRadiusAt(y, az);

function ridgeRing(r, H, color){
  const N = 360;
  const pos = [];
  const seed = rng() * 10;
  for (let i = 0; i <= N; i++){
    const az = (i % N) / N * Math.PI * 2;
    const f1 = fbm3(az * 9 + seed, 0.5, 7.7, 4);
    const f2 = fbm3(az * 23 + seed * 2.7, 0.5, 3.3, 4);
    const h = Math.pow(f1, 1.6) * H + 0.45 * Math.pow(f2, 1.4) * H;
    pos.push(Math.cos(az) * r, h, Math.sin(az) * r);
    pos.push(Math.cos(az) * r, -80, Math.sin(az) * r);
  }
  const idx = [];
  for (let i = 0; i < N; i++){
    const a = i * 2, b = i * 2 + 1, c = (i + 1) * 2, d = (i + 1) * 2 + 1;
    idx.push(a, b, c, c, b, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, silMaterial(color[0], color[1], color[2]));
  m.frustumCulled = false;
  scene.add(m);
}

    fpsEma = fpsEma * 0.9 + fps * 0.1;
    if (fpsEma < 24){
      if (lowFpsSince === 0) lowFpsSince = tNow;
      else if (tNow - lowFpsSince > 2.5 && !bloomDown){
        bloomDown = true;
        bloomPass.strength *= 0.8;
      }
    } else lowFpsSince = 0;
  }
  if (!paused){
    tNow += dt;
    const t = tNow;
    leafMat.uniforms.uTime.value = t;
    fragMat.uniforms.uTime.value = t;
    barkMat.uniforms.uTime.value = t;
    skyMat.uniforms.uTime.value = t;
    glowMat.uniforms.uTime.value = t;
    flameMat.uniforms.uTime.value = t;
    beamMat.uniforms.uTime.value = t;
    vineMat.uniforms.uTime.value = t;
    sparkMat.uniforms.uTime.value = t;
    ashMat.uniforms.uTime.value = t;
    dustMat.uniforms.uTime.value = t;
    cityFireMat && (cityFireMat.uniforms.uTime.value = t);
    pointLight.intensity = 60000 * (1 + 0.2 * (fbm3(t * 0.8, 3.5, 7.7, 3) - 0.5) * 2);
    if (ENABLE_CROWN_SMOKE) updateSmoke(t);
    if (t - lastInteract > 20){
      tmpQ.setFromAxisAngle(Y_AXIS, 0.008 * dt);
      camera.position.sub(controls.target).applyQuaternion(tmpQ).add(controls.target);
    }
  }
  controls.update();
  composer.render();
  frameCount++;
  if (!booted && frameCount >= 3){
    booted = true;
    document.getElementById('loading').style.display = 'none';
    setTimeout(runAcceptance, 200);
  }
}

/* ---------- 运行时自动验收 ---------- */
function countDrawCalls(){
  let c = 0;
  scene.traverse(o => { if (o.isMesh || o.isPoints || o.isLine) c++; });
  return c;
}
function runAcceptance(){
  const widthRatio = (2 * Math.atan(maxR / 3900)) / (CAM_FOV * Math.PI / 180);
  const v = new THREE.Vector3(0, 1460, 0).project(camera);
  const topRatio = (1 - v.y) / 2;
  const calls = countDrawCalls();
  const glslOk = LEAF_VS.includes('instanceMatrix * vec4(position')
    && !/gl_Position\s*=\s*projectionMatrix\s*\*\s*viewMatrix\s*\*\s*position/.test(LEAF_VS);
  const rows = [
    { 指标: '叶簇纹理覆盖率', 实测: (leafCoverage * 100).toFixed(1) + '%', 目标: '18%~38%', 结果: (leafCoverage >= 0.18 && leafCoverage <= 0.38) ? 'PASS' : 'FAIL' },
    { 指标: '树冠直方图空格率', 实测: (histEmptyRate * 100).toFixed(1) + '%', 目标: '≤18%', 结果: histEmptyRate <= 0.18 ? 'PASS' : 'FAIL' },
    { 指标: '树冠最大角宽/视口', 实测: widthRatio.toFixed(3), 目标: '0.60~0.98', 结果: (widthRatio >= 0.60 && widthRatio <= 0.98) ? 'PASS' : 'FAIL' },
    { 指标: '冠顶距上缘比例', 实测: (topRatio * 100).toFixed(1) + '%', 目标: '8%~14%', 结果: (topRatio >= 0.08 && topRatio <= 0.14) ? 'PASS' : 'FAIL' },
    { 指标: 'draw call 总数', 实测: calls, 目标: '≤70', 结果: calls <= 70 ? 'PASS' : 'FAIL' },
    { 指标: 'GLSL 完整性(instanceMatrix)', 实测: glslOk ? '是' : '否', 目标: '是', 结果: glslOk ? 'PASS' : 'FAIL' }
  ];
  console.table(rows);
  const fails = rows.filter(r => r.结果 === 'FAIL');
  if (fails.length){
    console.warn('未达标项：' + fails.map(r => r.指标 + ' 实测=' + r.实测 + '（目标 ' + r.目标 + '）').join('；'));
  } else {
    console.log('全部验收指标达标');
  }
}
animate();
</script>
