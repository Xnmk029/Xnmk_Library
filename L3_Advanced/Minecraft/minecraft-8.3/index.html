<script type="module">
import * as THREE from 'three';

/* ================================================================
   我的世界 —— 从零构建的体素沙盒
   程序化地形 / 程序化像素纹理 / 区块网格合并 / 环境光遮蔽(AO)
   昼夜循环 / 天空穹顶 / 体积云 / 星星日月 / 动态阴影 / 物理与交互
   ================================================================ */

// ---------- 工具 ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smoothstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const $=id=>document.getElementById(id);

// ---------- 参数 ----------
const params=new URLSearchParams(location.search);
const TEST=params.has('test');
const worldSeed=(Number(params.get('seed'))||0)||Math.floor(Math.random()*1e9);
const RD=Math.min(Number(params.get('rd'))||5,7);
const DAY_LEN=Number(params.get('day'))||600;      // 一天多少秒
const REACH=5.5;
const SHADOW_RANGE=100;

// ---------- 方块定义 ----------
const B={AIR:0,GRASS:1,DIRT:2,STONE:3,SAND:4,WATER:5,LOG:6,LEAVES:7,PLANKS:8,GLASS:9,BEDROCK:10,SNOW:11,COBBLE:12,GRAVEL:13};
const BLOCKS={
  1:{name:'草方块', tiles:[1,1,0,2,1,1]},
  2:{name:'泥土',   tiles:[2,2,2,2,2,2]},
  3:{name:'石头',   tiles:[3,3,3,3,3,3]},
  4:{name:'沙子',   tiles:[4,4,4,4,4,4]},
  5:{name:'水',     tiles:[13,13,13,13,13,13], water:true},
  6:{name:'橡木原木',tiles:[5,5,6,6,5,5]},
  7:{name:'橡树树叶',tiles:[7,7,7,7,7,7], cutout:true},
  8:{name:'橡木木板',tiles:[8,8,8,8,8,8]},
  9:{name:'玻璃',   tiles:[9,9,9,9,9,9], cutout:true},
  10:{name:'基岩',  tiles:[10,10,10,10,10,10]},
  11:{name:'雪块',  tiles:[15,15,11,2,15,15]},
  12:{name:'圆石',  tiles:[12,12,12,12,12,12]},
  13:{name:'沙砾',  tiles:[14,14,14,14,14,14]},
};
const SOLID=id=>id!==B.AIR&&id!==B.WATER;
const OPAQUE=id=>SOLID(id)&&id!==B.LEAVES&&id!==B.GLASS;
const PARTS={1:[96,150,52],2:[134,96,67],3:[125,125,125],4:[219,207,163],5:[70,110,220],6:[102,72,40],7:[63,115,41],8:[143,106,63],9:[205,232,244],10:[58,58,58],11:[240,248,247],12:[122,122,122],13:[135,126,111]};
const HOTBAR=[1,2,3,12,8,6,7,9,5];

// ---------- 噪声 ----------
function hash2i(x,z,s){let h=(s^(x*374761393)^(z*668265263))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
function vnoise(x,z,s){
  const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi;
  const u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
  const a=hash2i(xi,zi,s),b=hash2i(xi+1,zi,s),c=hash2i(xi,zi+1,s),d=hash2i(xi+1,zi+1,s);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,z,oct,s){let v=0,amp=.5,f=1,tot=0;for(let o=0;o<oct;o++){v+=vnoise(x*f,z*f,s+o*131)*amp;tot+=amp;amp*=.5;f*=2;}return v/tot*2-1;}

// ---------- 程序化纹理 ----------
function makeTiles(){
  const tiles=[];
  const mk=fn=>{const c=document.createElement('canvas');c.width=c.height=16;fn(c.getContext('2d'));return c;};
  const rgb=(r,g,b)=>'rgb('+Math.round(clamp(r,0,255))+','+Math.round(clamp(g,0,255))+','+Math.round(clamp(b,0,255))+')';
  const sh=(c,v)=>[c[0]+v,c[1]+v,c[2]+v];
  const speck=(g,base,amp,n)=>{for(let i=0;i<n;i++){g.fillStyle=rgb(...sh(base,(Math.random()*2-1)*amp));g.fillRect(Math.random()*16|0,Math.random()*16|0,1,1);}};
  const fill=(g,base,amp)=>{for(let y=0;y<16;y++)for(let x=0;x<16;x++){g.fillStyle=rgb(...sh(base,(Math.random()*2-1)*amp));g.fillRect(x,y,1,1);}};
  // 0 草顶
  tiles.push(mk(g=>{fill(g,[106,170,64],26);speck(g,[70,120,40],30,26);speck(g,[150,210,100],20,14);}));
  // 1 草侧
  tiles.push(mk(g=>{fill(g,[134,96,67],14);speck(g,[110,74,50],18,10);
    for(let x=0;x<16;x++){const drop=Math.random()*2|0;for(let y=0;y<3+drop;y++){g.fillStyle=rgb(...sh([106,170,64],(Math.random()*2-1)*26));g.fillRect(x,y,1,1);}}}));
  // 2 泥土
  tiles.push(mk(g=>{fill(g,[134,96,67],14);speck(g,[104,72,46],30,22);speck(g,[168,128,90],18,12);}));
  // 3 石头
  tiles.push(mk(g=>{fill(g,[125,125,125],20);speck(g,[80,80,84],34,20);speck(g,[165,165,165],22,16);}));
  // 4 沙子
  tiles.push(mk(g=>{fill(g,[219,207,163],9);speck(g,[245,236,200],12,14);speck(g,[180,170,130],12,14);}));
  // 5 原木侧面
  tiles.push(mk(g=>{for(let y=0;y<16;y++)for(let x=0;x<16;x++){const c=x%4<2?[85,62,31]:[102,72,40];g.fillStyle=rgb(...sh(c,(Math.random()*2-1)*8));g.fillRect(x,y,1,1);}speck(g,[60,42,20],14,8);}));
  // 6 原木顶
  tiles.push(mk(g=>{for(let y=0;y<16;y++)for(let x=0;x<16;x++){const d=Math.sqrt((x-7.5)**2+(y-7.5)**2);const c=Math.floor(d*1.05)%2?[109,84,50]:[88,64,36];g.fillStyle=rgb(...sh(c,(Math.random()*2-1)*10));g.fillRect(x,y,1,1);}speck(g,[60,44,24],16,8);}));
  // 7 树叶
  tiles.push(mk(g=>{for(let y=0;y<16;y++)for(let x=0;x<16;x++){if(Math.random()<.16){g.clearRect(x,y,1,1);continue;}g.fillStyle=rgb(...sh([63,115,41],(Math.random()*2-1)*28));g.fillRect(x,y,1,1);}speck(g,[35,75,22],20,20);speck(g,[110,170,70],18,10);}));
  // 8 木板
  tiles.push(mk(g=>{fill(g,[143,106,63],12);
    for(let y=0;y<16;y++){if(y%4===0){g.fillStyle=rgb(...sh([70,48,22],8));g.fillRect(0,y,16,1);}}
    speck(g,[96,68,36],22,14);speck(g,[180,140,88],14,10);}));
  // 9 玻璃
  tiles.push(mk(g=>{g.clearRect(0,0,16,16);g.fillStyle='rgba(225,240,248,.9)';g.fillRect(0,0,16,1);g.fillRect(0,15,16,1);g.fillRect(0,0,1,16);g.fillRect(15,0,1,16);
    g.strokeStyle='rgba(190,220,235,.5)';for(let i=0;i<4;i++){g.beginPath();g.moveTo(2+i*3,2);g.lineTo(6+i*2,14);g.stroke();}}));
  // 10 基岩
  tiles.push(mk(g=>{fill(g,[52,52,54],34);speck(g,[20,20,22],40,26);speck(g,[120,120,124],30,12);}));
  // 11 雪
  tiles.push(mk(g=>{fill(g,[240,248,247],6);speck(g,[218,232,238],10,12);speck(g,[255,255,255],6,14);}));
  // 12 圆石
  tiles.push(mk(g=>{fill(g,[122,122,122],14);for(let i=0;i<9;i++){const x=Math.random()*14|0,y=Math.random()*14|0,r=1.5+Math.random()*3;g.fillStyle=rgb(...sh([122,122,122],(Math.random()*2-1)*36));g.beginPath();g.arc(x,y,r,0,7);g.fill();}speck(g,[70,70,74],18,8);}));
  // 13 水
  tiles.push(mk(g=>{
    for(let y=0;y<16;y++)for(let x=0;x<16;x++){
      const d=Math.sin((x+y)*0.7)*3+Math.sin(x*0.4-y*0.5)*4+Math.sin(x*1.7+y*0.9)*2;
      g.fillStyle=rgb(...sh([52,88,200],(Math.random()*2-1)*9+d*1.4));g.fillRect(x,y,1,1);
    }
    for(let i=0;i<6;i++){
      const y0=1+Math.random()*13;
      const amp=1+Math.random()*2.6,fr=0.5+Math.random()*1.1,ph=Math.random()*6.28;
      g.fillStyle='rgba(130,175,248,'+(0.15+Math.random()*0.2)+')';
      for(let x=0;x<16;x++){
        const y=(y0+Math.sin(x*fr+ph)*amp)|0;
        if(y>=0&&y<16)g.fillRect(x,y,1,1);
      }
    }
    for(let i=0;i<12;i++){g.fillStyle='rgba(190,225,255,'+(0.25+Math.random()*0.4)+')';g.fillRect(Math.random()*16|0,Math.random()*16|0,1,1);}
  }));
  // 14 沙砾
  tiles.push(mk(g=>{fill(g,[135,126,111],18);speck(g,[90,82,70],26,30);speck(g,[175,166,148],16,16);}));
  // 15 雪侧
  tiles.push(mk(g=>{fill(g,[134,96,67],14);speck(g,[110,74,50],18,10);
    for(let x=0;x<16;x++){const drop=Math.random()*2|0;for(let y=0;y<3+drop;y++){g.fillStyle=rgb(...sh([240,248,247],(Math.random()*2-1)*8));g.fillRect(x,y,1,1);}}}));
  return tiles;
}
const TS=18,COLS=8,ROWS=2,TW=COLS*TS,TH=ROWS*TS;
function makeAtlas(){
  const tiles=makeTiles();
  const cv=document.createElement('canvas');cv.width=TW;cv.height=TH;
  const g=cv.getContext('2d');
  tiles.forEach((t,i)=>{g.imageSmoothingEnabled=false;g.drawImage(t,(i%COLS)*TS,(i/COLS|0)*TS,TS,TS);});
  const tex=new THREE.CanvasTexture(cv);
  tex.magFilter=THREE.NearestFilter;tex.minFilter=THREE.NearestMipmapLinearFilter;
  tex.generateMipmaps=true;tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.anisotropy=4;tex.colorSpace=THREE.SRGBColorSpace;
  return {tex,cv,tiles};
}
const atlas=makeAtlas();
function uvOf(tile){
  const col=tile%COLS,row=(tile/COLS)|0;
  return {u0:col*TS/TW,u1:(col*TS+TS)/TW,v0:1-(row*TS+TS)/TH,v1:1-row*TS/TH};
}

// ---------- 场景 / 渲染器 ----------
const canvas=$('app');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xa8c8ee,60,95);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,2000);
camera.rotation.order='YXZ';
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
renderer.setSize(innerWidth,innerHeight);

// ---------- 光照 ----------
const hemi=new THREE.HemisphereLight(0xbfd8ff,0x6a5a40,0.65);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff2d6,1.35);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-SHADOW_RANGE;sun.shadow.camera.right=SHADOW_RANGE;
sun.shadow.camera.top=SHADOW_RANGE;sun.shadow.camera.bottom=-SHADOW_RANGE;
sun.shadow.camera.near=20;sun.shadow.camera.far=320;
sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.02;

const SEA=26,SNOW_LINE=68;
function genHeight(wx,wz){
  const cont=fbm(wx*0.0035,wz*0.0035,4,worldSeed+7);
  const hill=fbm(wx*0.012,wz*0.012+300,3,worldSeed+17);
  let h=25+hill*9+cont*13;
  const r=1-Math.abs(fbm(wx*0.0045+500,wz*0.0045+500,3,worldSeed+27));
  h+=smoothstep(0.42,0.72,r)*75;
  return Math.floor(h);
}

function chunkAt(cx,cz){return chunks.get(cx+','+cz);}
function getBlock(x,y,z){
  if(y<0)return B.BEDROCK;if(y>255)return B.AIR;
  const c=chunkAt(x>>4,z>>4);if(!c)return B.AIR;
  return c.data[(y<<8)|((z&15)<<4)|(x&15)];
}
function setLocal(x,y,z,id){
  if(y<0||y>255)return;
  const c=chunkAt(x>>4,z>>4);if(!c)return;
  const lx=x&15,lz=z&15,ix=(y<<8)|(lz<<4)|lx;
  if(c.data[ix]===id)return;
  c.data[ix]=id;
  const i=lz*16+lx;
  if(id!==B.AIR){if(y>c.hm[i])c.hm[i]=y;}
  else if(y===c.hm[i]){let yy=y-1;while(yy>0&&c.data[(yy<<8)|(lz<<4)|lx]===B.AIR)yy--;c.hm[i]=yy;}
}

// ---------- 地形生成 ----------
function registerTree(x,y,z){
  const r=hash2i(x,z,worldSeed+66);
  const big=r<0.22,small=r>0.72;
  const trunk=(4+Math.floor(hash2i(x,z,worldSeed+55)*3))+(big?2:small?-1:1);
  const keys=new Set();
  for(let dx=-3;dx<=3;dx++)for(let dz=-3;dz<=3;dz++)keys.add((x+dx>>4)+','+(z+dz>>4));
  for(const k of keys){if(!pending.has(k))pending.set(k,[]);pending.get(k).push({x,y,z,trunk,big,small});}
}
function applyTreeJob(job){
  const{x,y,z,trunk,big,small}=job;
  for(let i=0;i<trunk;i++)setLocal(x,y+i,z,B.LOG);
  const topY=y+trunk-1;
  const layers=big?[[3,2],[3,2],[2,2],[1,2],[0,1]]:small?[[1,2],[1,2],[0,1]]:[[2,2],[2,2],[1,2],[1,2],[0,1]];
  for(let dy=0;dy<layers.length;dy++){
    const ly=topY-1+dy;
    const r=layers[dy][0];
    for(let dx=-r;dx<=r;dx++)for(let dz=-r;dz<=r;dz++){
      if(layers[dy][1]===2&&Math.abs(dx)===r&&Math.abs(dz)===r)continue;
      const id=getBlock(x+dx,ly,z+dz);
      if(id===B.AIR||id===B.LEAVES)setLocal(x+dx,ly,z+dz,B.LEAVES);
    }
  }
}
function genChunk(cx,cz){
  const key=cx+','+cz;
  let c=chunks.get(key);
  if(!c){c={cx,cz,data:new Uint8Array(16*256*16),hm:new Uint8Array(256),mesh:null};chunks.set(key,c);}
  for(let lz=0;lz<16;lz++)for(let lx=0;lx<16;lx++){
    const wx=cx*16+lx,wz=cz*16+lz;
    const h=genHeight(wx,wz);
    let top=B.GRASS;
    if(h>=SNOW_LINE)top=B.SNOW;
    else if(h>=SNOW_LINE-2&&hash2i(wx,wz,worldSeed+123)<smoothstep(SNOW_LINE-2,SNOW_LINE,h))top=B.SNOW;
    else if(h>=62)top=B.STONE;
    else if(h<=SEA+1)top=B.SAND;
    for(let y=0;y<=h;y++){
      let id;
      if(y===0)id=B.BEDROCK;
      else if(y<h-3)id=B.STONE;
      else if(h>=SNOW_LINE-2)id=(y===h)?top:B.STONE;
      else if(h>=62)id=B.STONE;
      else if(h<=SEA+1)id=B.SAND;
      else id=(y===h)?top:B.DIRT;
      c.data[(y<<8)|(lz<<4)|lx]=id;
    }
    c.hm[lz*16+lx]=Math.max(h,SEA);
    for(let y=h+1;y<=SEA;y++)c.data[(y<<8)|(lz<<4)|lx]=B.WATER;
    if(top===B.GRASS&&h>SEA+1&&h<SNOW_LINE-4&&hash2i(wx,wz,worldSeed+55)<0.020)registerTree(wx,h+1,wz);
  }
  const jobs=pending.get(key);
  if(jobs){for(const j of jobs)applyTreeJob(j);pending.delete(key);}
  remesh(cx,cz);
}

function faceVisible(self,nb){
  if(nb===B.AIR)return true;
  if(self===B.WATER)return nb===B.AIR;
  if(nb===B.WATER)return true;
  if(OPAQUE(nb))return false;

function buildMesh(c){
  const G=[[],[],[]];
  for(let gi=0;gi<3;gi++)G[gi]={pos:[],nor:[],uv:[],col:[],idx:[]};
  const{cx,cz,data,hm}=c;
  for(let lz=0;lz<16;lz++)for(let lx=0;lx<16;lx++){
    const wx=cx*16+lx,wz=cz*16+lz;
    const topY=hm[lz*16+lx];
    for(let y=0;y<=topY;y++){
      const id=data[(y<<8)|(lz<<4)|lx];
      if(id===B.AIR)continue;
      const grp=G[id===B.WATER?2:(OPAQUE(id)?0:1)];
      let base=grp.pos.length/3;
      const blk=BLOCKS[id];
      const tint=(id===B.GRASS)?0.86+0.14*hash2i(wx,wz,worldSeed+99):(id===B.LEAVES?0.78+0.22*hash2i(wx,wz,worldSeed+101):1);
      for(let fi=0;fi<6;fi++){
        const f=FACES[fi];
        const nb=getBlock(wx+f.n[0],y+f.n[1],wz+f.n[2]);
        if(!faceVisible(id,nb))continue;
        const uv=uvOf(blk.tiles[fi]);
        const axisU=f.a,fv=f.b===1?1:2;
        const au=axisU===2?2:(fv===1?0:0); // u 轴：侧面用水平轴，顶底用 X
        const av=fv;
        for(let vi=0;vi<4;vi++){
          const v=f.v[vi];
          const su=v[au]<0.5?0:1,sv=v[av]<0.5?0:1;
          let ao=1;
          const s1=v[f.a]<0.5?-1:1,s2=v[f.b]<0.5?-1:1;
          const ax=f.a===0?s1:0,ay=f.a===1?s1:0,az=f.a===2?s1:0;
          const bx=f.b===0?s2:0,by=f.b===1?s2:0,bz=f.b===2?s2:0;
          const n1=OPAQUE(getBlock(wx+ax,y+ay,wz+az));
          const n2=OPAQUE(getBlock(wx+bx,y+by,wz+bz));
          const n3=OPAQUE(getBlock(wx+ax+bx,y+ay+by,wz+az+bz));
          if(n1&&n2)ao=0.5;else if(n1||n2)ao=0.72;else if(n3)ao=0.86;
          const cL=f.light*ao*tint;
          grp.pos.push(wx+v[0],y+v[1],wz+v[2]);
          grp.nor.push(f.n[0],f.n[1],f.n[2]);
          grp.uv.push(uv.u0+su*(uv.u1-uv.u0),uv.v0+sv*(uv.v1-uv.v0));
          grp.col.push(cL,cL,cL);
        }
        grp.idx.push(base,base+1,base+2,base,base+2,base+3);
        base+=4;
      }
    }
  }
  let vOff=0,iOff=0,totalPos=0,totalNor=0,totalUv=0,totalCol=0,totalIdx=0;
  for(const g of G){totalPos+=g.pos.length;totalNor+=g.nor.length;totalUv+=g.uv.length;totalCol+=g.col.length;totalIdx+=g.idx.length;}
  if(totalIdx===0)return null;
  const geo=new THREE.BufferGeometry();
  const pos=new Float32Array(totalPos),nor=new Float32Array(totalNor),uvs=new Float32Array(totalUv),col=new Float32Array(totalCol),idx=new Uint32Array(totalIdx);
  for(let gi=0;gi<3;gi++){
    const g=G[gi];
    if(!g.idx.length)continue;
    pos.set(g.pos,vOff*3);nor.set(g.nor,vOff*3);uvs.set(g.uv,vOff*2);col.set(g.col,vOff*3);
    for(let i=0;i<g.idx.length;i++)idx[iOff+i]=g.idx[i]+vOff;
    geo.addGroup(iOff,g.idx.length,gi);
    vOff+=g.pos.length/3;iOff+=g.idx.length;
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('normal',new THREE.BufferAttribute(nor,3));
  geo.setAttribute('uv',new THREE.BufferAttribute(uvs,2));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  geo.setIndex(new THREE.BufferAttribute(idx,1));
  geo.computeBoundingSphere();
  const mesh=new THREE.Mesh(geo,MATS);
  mesh.castShadow=true;mesh.receiveShadow=true;
  return mesh;
}
function remesh(cx,cz){
  const c=chunkAt(cx,cz);if(!c)return;
  if(c.mesh){scene.remove(c.mesh);c.mesh.geometry.dispose();c.mesh=null;}
  const m=buildMesh(c);
  if(m){c.mesh=m;scene.add(m);}
}
function setBlock(x,y,z,id){
  if(y<0||y>255)return;
  const cx=x>>4,cz=z>>4,lx=x&15,lz=z&15;
  setLocal(x,y,z,id);
  remesh(cx,cz);
  if(lx===0)remesh(cx-1,cz);
  if(lx===15)remesh(cx+1,cz);
  if(lz===0)remesh(cx,cz-1);
  if(lz===15)remesh(cx,cz+1);

let lastPCX=null,lastPCZ=null;
function updateChunks(){
  const pcx=Math.floor(player.pos.x/16),pcz=Math.floor(player.pos.z/16);
  if(pcx!==lastPCX||pcz!==lastPCZ){lastPCX=pcx;lastPCZ=pcz;}
  let budget=4;
  for(const[dx,dz]of spiral){
    const cx=pcx+dx,cz=pcz+dz;
    if(!chunkAt(cx,cz)){genChunk(cx,cz);if(--budget<=0)break;}
  }
  for(const[key,c]of[...chunks]){
    if(Math.max(Math.abs(c.cx-pcx),Math.abs(c.cz-pcz))>RD+1){
      if(c.mesh){scene.remove(c.mesh);c.mesh.geometry.dispose();}
      chunks.delete(key);
    }
  }
}

const player={pos:new THREE.Vector3(),vel:new THREE.Vector3(),yaw:0,pitch:0,onGround:false,flying:false,eye:1.62,w:0.3,h:1.8};
const keys={},mouse={left:false,right:false};
let sel=0,swingT=0,bobPhase=0,inWater=false,holdL=0,holdR=0;

function findSpawn(){
  for(let r=0;r<14;r++)for(let dx=-r;dx<=r;dx++)for(let dz=-r;dz<=r;dz++){
    const x=8+dx,z=8+dz;
    let y=200;
    while(y>0&&getBlock(x,y,z)===B.AIR)y--;
    const id=getBlock(x,y,z);
    if(id!==B.AIR&&id!==B.WATER)return new THREE.Vector3(x+0.5,y+1.05,z+0.5);
  }
  return new THREE.Vector3(8.5,40,8.5);
}
function collideAxis(axis,d){
  player.pos[axis]+=d;
  const x0=Math.floor(player.pos.x-player.w),x1=Math.floor(player.pos.x+player.w);
  const y0=Math.floor(player.pos.y),y1=Math.floor(player.pos.y+player.h-0.001);
  const z0=Math.floor(player.pos.z-player.w),z1=Math.floor(player.pos.z+player.w);
  for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++)for(let x=x0;x<=x1;x++){
    if(!SOLID(getBlock(x,y,z)))continue;
    if(axis==='x'){player.pos.x=d>0?x-player.w-0.001:x+1+player.w+0.001;player.vel.x=0;}
    else if(axis==='z'){player.pos.z=d>0?z-player.w-0.001:z+1+player.w+0.001;player.vel.z=0;}
    else{
      if(d<0){player.pos.y=y+1;player.vel.y=0;player.onGround=true;}
      else{player.pos.y=y-player.h-0.001;player.vel.y=0;}
    }
  }
}
function updatePlayer(dt){
  const p=player;
  const fwd=(keys.KeyW?1:0)-(keys.KeyS?1:0);
  const strafe=(keys.KeyD?1:0)-(keys.KeyA?1:0);
  const sneak=keys.ShiftLeft||keys.ShiftRight;
  const sprint=keys.ControlLeft&&!sneak&&fwd>0;
  const sinY=Math.sin(p.yaw),cosY=Math.cos(p.yaw);
  let mx=(-sinY*fwd+cosY*strafe),mz=(-cosY*fwd-sinY*strafe);
  const ml=Math.hypot(mx,mz);
  if(ml>0){mx/=ml;mz/=ml;}
  let speed=p.flying?(sprint?18:11):(sneak?1.8:sprint?6.2:4.4);
  if(inWater&&!p.flying)speed*=0.65;
  const accel=p.flying?14:(p.onGround?13:3.5);
  const k=1-Math.exp(-accel*dt);
  p.vel.x+=(mx*speed-p.vel.x)*k;
  p.vel.z+=(mz*speed-p.vel.z)*k;
  if(!p.flying){
    const damp=p.onGround?9:0.9;
    p.vel.x*=Math.exp(-damp*dt);p.vel.z*=Math.exp(-damp*dt);
    const g=inWater?26*0.32:26;
    p.vel.y-=g*dt;
    if(p.vel.y<-60)p.vel.y=-60;
    if(inWater&&keys.Space&&p.vel.y<6)p.vel.y+=22*dt;
    if(keys.Space&&p.onGround){p.vel.y=8.6;p.onGround=false;}
  }else{
    let vy=(keys.Space?1:0)-(keys.ShiftLeft||keys.ShiftRight?1:0);
    p.vel.y+=(vy*speed*0.8-p.vel.y)*(1-Math.exp(-10*dt));
  }
  const hSpeed=Math.hypot(p.vel.x,p.vel.z);
  p.onGround=false;
  collideAxis('x',p.vel.x*dt);
  collideAxis('z',p.vel.z*dt);
  collideAxis('y',p.vel.y*dt);
  if(p.flying&&p.pos.y<=0){p.pos.y=0;p.vel.y=0;}
  // 视角晃动
  if(p.onGround&&hSpeed>0.8){
    bobPhase+=hSpeed*dt*1.75;
    const amp=Math.min(1,hSpeed/6);
    camBobY=Math.sin(bobPhase*2)*0.05*amp;
    if(Math.sin(bobPhase*2-Math.PI/2)>0&&Math.sin(bobPhase*2)<0)stepSfx();
  }else camBobY*=Math.exp(-8*dt);
  // FOV
  const targetFov=75+(sprint?8:0)+(p.flying?5:0);
  camera.fov+=(targetFov-camera.fov)*(1-Math.exp(-6*dt));camera.updateProjectionMatrix();
  // 水下
  inWater=getBlock(camera.position.x,camera.position.y,camera.position.z)===B.WATER;
}
let camBobY=0;

const REACH2=REACH;
function raycast(){
  const o=camera.position,d=new THREE.Vector3();
  camera.getWorldDirection(d);
  let x=Math.floor(o.x),y=Math.floor(o.y),z=Math.floor(o.z);
  const stepX=d.x>0?1:-1,stepY=d.y>0?1:-1,stepZ=d.z>0?1:-1;
  const tdx=d.x!==0?Math.abs(1/d.x):Infinity,tdy=d.y!==0?Math.abs(1/d.y):Infinity,tdz=d.z!==0?Math.abs(1/d.z):Infinity;
  let tmx=d.x>0?(x+1-o.x)/d.x:(o.x-x)/(-d.x);
  if(d.x===0)tmx=Infinity;
  let tmy=d.y>0?(y+1-o.y)/d.y:(o.y-y)/(-d.y);
  if(d.y===0)tmy=Infinity;
  let tmz=d.z>0?(z+1-o.z)/d.z:(o.z-z)/(-d.z);
  if(d.z===0)tmz=Infinity;
  let face=[0,0,0],t=0;
  for(let i=0;i<256;i++){
    const id=getBlock(x,y,z);
    if(id!==B.AIR)return{x,y,z,face,t,id};
    if(tmx<tmy&&tmx<tmz){if(tmx>REACH2)return null;x+=stepX;t=tmx;tmx+=tdx;face=[-stepX,0,0];}
    else if(tmy<tmz){if(tmy>REACH2)return null;y+=stepY;t=tmy;tmy+=tdy;face=[0,-stepY,0];}
    else{if(tmz>REACH2)return null;z+=stepZ;t=tmz;tmz+=tdz;face=[0,0,-stepZ];}
  }
  return null;
}
const highlight=new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(1.002,1.002,1.002)),
  new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:0.55}));
highlight.renderOrder=6;scene.add(highlight);
function doBreak(){
  const rc=raycast();if(!rc)return;
  const id=getBlock(rc.x,rc.y,rc.z);
  if(id===B.AIR)return;
  spawnParticles(rc.x+0.5,rc.y+0.5,rc.z+0.5,PARTS[id]||[120,120,120]);
  setBlock(rc.x,rc.y,rc.z,B.AIR);
  sfx(id===B.WATER?'splash':'break');
  swing();
}
function doPlace(){
  const rc=raycast();if(!rc)return;
  const px=rc.x+rc.face[0],py=rc.y+rc.face[1],pz=rc.z+rc.face[2];
  const cur=getBlock(px,py,pz);
  if(cur!==B.AIR&&cur!==B.WATER)return;
  if(SOLID(cur)&&px-player.w<player.pos.x&&px+1+player.w>player.pos.x&&
     py<player.pos.y+player.h&&py+1>player.pos.y&&
     pz-player.w<player.pos.z&&pz+1+player.w>player.pos.z)return;
  const id=HOTBAR[sel];
  if(cur===id)return;
  setBlock(px,py,pz,id);
  sfx('place');
  swing();
}
function swing(){swingT=1;}

// ---------- 粒子 ----------
const MAXP=512;
const pGeo=new THREE.BoxGeometry(0.16,0.16,0.16);
const pMat=new THREE.MeshBasicMaterial({color:0xffffff});
const pMesh=new THREE.InstancedMesh(pGeo,pMat,MAXP);
pMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(pMesh);
const parts=[];
const m4=new THREE.Matrix4(),q4=new THREE.Quaternion(),e4=new THREE.Euler(),v3a=new THREE.Vector3(),v3b=new THREE.Vector3();
const colTmp=new THREE.Color();
function spawnParticles(x,y,z,color){
  for(let i=0;i<12;i++){
    if(parts.length>=MAXP)break;
    parts.push({x,y,z,
      vx:(Math.random()-0.5)*5,vy:Math.random()*5+1,vz:(Math.random()-0.5)*5,
      rx:Math.random()*6.28,ry:Math.random()*6.28,rz:Math.random()*6.28,
      life:0.55+Math.random()*0.25,
      c:colTmp.setRGB(color[0]/255,color[1]/255,color[2]/255)});
  }
}
function updateParticles(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.life-=dt;
    if(p.life<=0){parts.splice(i,1);continue;}
    p.vy-=22*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
    p.rx+=dt*7;p.ry+=dt*5;
    e4.set(p.rx,p.ry,p.rz);q4.setFromEuler(e4);
    v3a.set(p.x,p.y,p.z);
    const s=Math.min(1,p.life*3);
    m4.compose(v3a,q4,v3b.set(s,s,s));
    pMesh.setMatrixAt(i,m4);pMesh.setColorAt(i,p.c);
  }
  pMesh.count=parts.length;
  pMesh.instanceMatrix.needsUpdate=true;
  if(pMesh.instanceColor)pMesh.instanceColor.needsUpdate=true;
}

// ---------- 第一人称手 ----------
function buildHandGeo(tiles){
  const pos=[],nor=[],uvs=[],idx=[];
  for(let fi=0;fi<6;fi++){
    const f=FACES[fi],uv=uvOf(tiles[fi]);
    const au=f.a,av=f.b===1?1:2;
    const base=pos.length/3;
    for(let vi=0;vi<4;vi++){
      const v=f.v[vi];
      pos.push(v[0]-0.5,v[1]-0.5,v[2]-0.5);
      nor.push(f.n[0],f.n[1],f.n[2]);
      uvs.push(uv.u0+(v[au]<0.5?0:1)*(uv.u1-uv.u0),uv.v0+(v[av]<0.5?0:1)*(uv.v1-uv.v0));
    }
    idx.push(base,base+1,base+2,base,base+2,base+3);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));
  g.setAttribute('normal',new THREE.BufferAttribute(new Float32Array(nor),3));
  g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(uvs),2));
  g.setIndex(idx);
  return g;
}
const handMat=new THREE.MeshBasicMaterial({map:atlas.tex,depthTest:false,depthWrite:false});
const handPivot=new THREE.Object3D();
const handMesh=new THREE.Mesh(buildHandGeo(BLOCKS[HOTBAR[0]].tiles),handMat);
handMesh.scale.setScalar(0.42);
handPivot.add(handMesh);
handPivot.position.set(0.5,-0.42,-0.62);
camera.add(handPivot);scene.add(camera);
function updateHand(dt){
  handPivot.rotation.x=-0.05+Math.sin(bobPhase*2)*0.012;
  handPivot.rotation.z=Math.sin(bobPhase)*0.012;
  if(swingT>0){
    swingT=Math.max(0,swingT-dt*4.5);
    const p=1-swingT;
    handPivot.rotation.x=-1.35*Math.sin(p*Math.PI);
    handPivot.rotation.z=0.3*Math.sin(p*Math.PI);
  }
}

// ---------- 声音 ----------
let AC=null;
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}}
function tone(f0,f1,dur,type,vol){
  if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),AC.currentTime+dur);
  g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+dur+0.05);
}
function noiseBurst(dur,freq,vol,type){
  if(!AC)return;const n=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=buf;
  const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq;
  const g=AC.createGain();g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  s.connect(f).connect(g).connect(AC.destination);s.start();s.stop(AC.currentTime+dur+0.05);
}
const sfx={
  break:()=>{noiseBurst(0.12,800,0.32);tone(220,70,0.1,'triangle',0.14);},
  place:()=>{tone(320,170,0.07,'square',0.13);},
  step:()=>{noiseBurst(0.05,3000,0.05,'highpass');},
  splash:()=>{noiseBurst(0.3,900,0.2);},
  jump:()=>{noiseBurst(0.1,600,0.08,'bandpass');},
};
let stepCool=0;
function stepSfx(){if(stepCool<=0){sfx.step();stepCool=0.22;}else{stepCool=0;}}

// ---------- 昼夜 ----------
let worldTime=7.5; // 小时
const sunDir=new THREE.Vector3();
function updateSky(dt){
  worldTime+=dt/DAY_LEN*24;
  const ang=(worldTime-6)/24*Math.PI*2;
  sunDir.set(Math.cos(ang),Math.sin(ang),0.22).normalize();
  const sunY=sunDir.y;
  const dayF=smoothstep(-0.08,0.18,sunY);
  const sunset=1-smoothstep(0.02,0.34,Math.abs(sunY));
  // 天空颜色
  const top=lerp(0.02,0.35,dayF),tg=lerp(0.03,0.58,dayF),tb=lerp(0.09,0.93,dayF);
  const hz=lerp(0.07,0.78,dayF),hg=lerp(0.08,0.88,dayF),hb=lerp(0.16,0.99,dayF);
  const below=lerp(0.05,0.45,dayF),bg=lerp(0.06,0.55,dayF),bb=lerp(0.11,0.68,dayF);
  const sr=1.0,sg=0.42,sb=0.15;
  const hzr=Math.min(1,hz+sr*sunset*0.55),hzg=Math.min(1,hg+sg*sunset*0.55),hzb=Math.min(1,hb+sb*sunset*0.5);
  skyMat.uniforms.uTop.value.set(top,tg,tb);
  skyMat.uniforms.uHorizon.value.set(hzr,hzg,hzb);
  skyMat.uniforms.uBelow.value.set(below,bg,bb);
  const sunCol=lerp(1.0,1.0,dayF),sunColG=lerp(0.62,0.98,dayF),sunColB=lerp(0.28,0.85,dayF);
  skyMat.uniforms.uSunColor.value.set(sunCol,sunColG,sunColB);
  skyMat.uniforms.uSunDir.value.copy(sunDir);
  // 雾
  const fogTarget=inWater?new THREE.Color(0.06,0.16,0.45):new THREE.Color(hzr,hzg,hzb);
  scene.fog.color.lerp(fogTarget,1-Math.exp(-3*dt));
  if(inWater){scene.fog.near=2;scene.fog.far=26;}
  else{scene.fog.near=RD*16*0.42;scene.fog.far=RD*16*0.92;}
  // 光
  hemi.color.setRGB(lerp(0.1,0.75,dayF),lerp(0.12,0.85,dayF),lerp(0.25,1.0,dayF));
  hemi.groundColor.setRGB(lerp(0.06,0.42,dayF),lerp(0.07,0.35,dayF),lerp(0.12,0.28,dayF));
  hemi.intensity=0.55+0.42*dayF;
  sun.color.setRGB(lerp(0.45,1.0,dayF),lerp(0.55,sunColG,dayF),lerp(1.0,sunColB,dayF));
  sun.intensity=0.22+1.2*dayF;
  const eye=camera.position;
  sun.position.copy(eye).addScaledVector(sunDir,120);
  sun.target.position.copy(eye);
  // 星星日月
  stars.material.opacity=Math.pow(1-dayF,1.6)*0.9;
  stars.visible=stars.material.opacity>0.01;
  sunSpr.position.copy(eye).addScaledVector(sunDir,450);
  moonSpr.position.copy(eye).addScaledVector(sunDir,-450);
  sunSpr.visible=sunY>-0.1;
  moonSpr.visible=-sunY>-0.1;
  // 云
  for(const L of cloudLayers){
    L.t.offset.x-=L.drift*dt/(640*L.mesh.scale.x);
    L.mesh.position.set(eye.x,L.mesh.scale.x>1?148:132,eye.z);
    L.mesh.material.color.setScalar(0.3+0.7*dayF);
  }
  waterTex.offset.x+=dt*0.008;
  waterTex.offset.y-=dt*0.015;
  // 穹顶跟随
  dome.position.copy(eye);
}

// ---------- HUD ----------
const hudEl=$('hud');
function buildHotbar(){
  const bar=$('hotbar');
  HOTBAR.forEach((id,i)=>{
    const d=document.createElement('div');d.className='slot';d.dataset.i=i;
    const cv=document.createElement('canvas');cv.width=cv.height=48;
    const g=cv.getContext('2d');
    const tile=BLOCKS[id].tiles[2];
    g.drawImage(atlas.cv,(tile%COLS)*TS+2,((tile/COLS)|0)*TS+2,14,14,2,2,44,44);
    d.appendChild(cv);bar.appendChild(d);
  });
}
function updateHudUI(){
  document.querySelectorAll('.slot').forEach((s,i)=>s.classList.toggle('sel',i===sel));
  $('selname').textContent=BLOCKS[HOTBAR[sel]].name;
}
let fps=0,fpsAcc=0,fpsN=0;
function updateDebug(dt){
  fpsAcc+=dt;fpsN++;
  if(fpsAcc>=0.5){fps=Math.round(fpsN/fpsAcc);fpsAcc=0;fpsN=0;}
  const h=((worldTime%24)+24)%24;
  const hh=Math.floor(h),mm=Math.floor((h-hh)*60);
  const dirs=['南','西南','西','西北','北','东北','东','东南'];
  const dir=dirs[Math.round(((player.yaw/Math.PI*4)%8+8)%8)%8];
  $('debug').innerHTML=`<span class="fps">FPS ${fps}</span>  坐标 ${player.pos.x.toFixed(1)}, ${player.pos.y.toFixed(1)}, ${player.pos.z.toFixed(1)}
面向 ${dir} · 时间 ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')} · 区块 ${Math.floor(player.pos.x/16)},${Math.floor(player.pos.z/16)}
飞行 ${player.flying?'开':'关'} · 区块数 ${chunks.size} · 粒子 ${parts.length}`;
  $('waterfx').style.opacity=inWater?0.5:0;
}

// ---------- 事件 ----------
function bindEvents(){
  canvas.addEventListener('mousedown',e=>{
    if(!started||TEST)return;
    if(e.button===0){mouse.left=true;holdL=0;doBreak();}
    if(e.button===2){mouse.right=true;holdR=0;doPlace();}
  });
  addEventListener('mouseup',e=>{if(e.button===0)mouse.left=false;if(e.button===2)mouse.right=false;});
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
  addEventListener('mousemove',e=>{
    if(document.pointerLockElement===canvas){
      player.yaw-=e.movementX*0.0023;
      player.pitch=clamp(player.pitch-e.movementY*0.0023,-1.55,1.55);
    }
  });
  addEventListener('wheel',e=>{if(started&&!TEST){sel=(sel+(e.deltaY>0?1:8))%9;updateHudUI();}},{passive:true});
  addEventListener('keydown',e=>{
    keys[e.code]=true;
    if(e.code==='Space')e.preventDefault();
    if(!started||TEST)return;
    if(e.code.startsWith('Digit')){const n=+e.code.slice(5);if(n>=1&&n<=9){sel=n-1;updateHudUI();}}
    if(e.code==='KeyF'){player.flying=!player.flying;player.vel.y=0;}
  });
  addEventListener('keyup',e=>keys[e.code]=false);
  addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.left=mouse.right=false;});
}
let started=false;
const overlay=$('overlay'),pauseEl=$('pause');
$('startBtn').addEventListener('click',()=>{
  initAudio();
  overlay.style.display='none';
  canvas.requestPointerLock();
  started=true;
  if(TEST){hudEl.style.display='none';}
});
$('resumeBtn').addEventListener('click',()=>{initAudio();canvas.requestPointerLock();});
$('regenBtn').addEventListener('click',()=>location.reload());
document.addEventListener('pointerlockchange',()=>{
  if(!started||TEST)return;
  if(document.pointerLockElement===canvas){pauseEl.style.display='none';}
  else pauseEl.style.display='flex';
});
canvas.addEventListener('click',()=>{if(started&&!TEST&&document.pointerLockElement!==canvas){canvas.requestPointerLock();}});

// ---------- 主循环 ----------
let lastT=performance.now(),lastSpawnFind=0,titleAng=0;
function animate(t){
  requestAnimationFrame(animate);
  let dt=Math.min((t-lastT)/1000,0.05);lastT=t;
  if(TEST){
    view.ang+=dt*0.08;
    const a=view.ang;
    camera.position.set(view.cx+Math.cos(a)*view.r,view.h+Math.sin(t*0.0005)*4,view.cz+Math.sin(a)*view.r);
    camera.lookAt(view.cx,view.ty!==undefined?view.ty:view.h*0.35,view.cz);
    player.pos.set(view.cx,view.h,view.cz);
  }else if(!started){
    titleAng+=dt*0.05;
    camera.position.set(spawn.x+Math.cos(titleAng)*30,spawn.y+6+Math.sin(t*0.0004)*3,spawn.z+Math.sin(titleAng)*30);
    camera.lookAt(spawn.x,spawn.y+2,spawn.z);
  }else{
    updatePlayer(dt);
  }
  updateChunks();
  updateSky(dt);
  updateParticles(dt);
  updateHand(dt);
  // 交互重复
  if(started&&!TEST&&document.pointerLockElement===canvas){
    if(mouse.left){holdL+=dt;if(holdL>0.18){holdL=0;doBreak();}}
    if(mouse.right){holdR+=dt;if(holdR>0.28){holdR=0;doPlace();}}
    const rc=raycast();
    if(rc){highlight.visible=true;highlight.position.set(rc.x+0.5,rc.y+0.5,rc.z+0.5);$('blockname').textContent=BLOCKS[rc.id]?.name||'';}
    else{highlight.visible=false;$('blockname').textContent='';}
  }else highlight.visible=false;
  // 相机
  if(!TEST&&started){
    camera.position.set(player.pos.x,player.pos.y+player.eye+camBobY,player.pos.z);
    camera.rotation.set(player.pitch,player.yaw,0);
  }
  if(started||TEST)updateDebug(dt);
  renderer.render(scene,camera);
}
