<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>MCZPI · 我的世界（无限世界）</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<canvas id="game-canvas"></canvas>

<div id="hud" class="hidden">
  <div id="crosshair"></div>
  <div id="debug" class="hidden"></div>
  <div id="toast" class="hidden"></div>
  <div id="hotbar-wrap">
    <div id="item-name"></div>
    <div id="hotbar"></div>
  </div>
</div>

<div id="title-screen" class="overlay">
  <div class="title-panel">
    <h1 class="logo">MCZPI</h1>
    <div class="subtitle">我的世界 · 网页版</div>
    <div class="btn-row">
      <button id="btn-start" class="mc-btn primary">▶ 开始游戏</button>
      <button id="btn-new" class="mc-btn">新世界</button>
    </div>
    <div class="seed-row">
      <label for="seed-input">世界种子</label>
      <input id="seed-input" type="text" maxlength="32" placeholder="留空 = 随机"/>
    </div>
    <div class="hint">
      WASD 移动 · 空格 跳跃 · Shift 潜行 · Ctrl 疾跑<br/>
      左键 破坏 · 右键 放置 · 滚轮/数字键 选格 · 中键 取色<br/>
      F 飞行 · F3 调试 · M 静音
    </div>
    <div class="version">无限世界 · 无缝地形 · 昼夜循环 · 自动存档</div>
  </div>
</div>

<div id="pause-screen" class="overlay hidden">
  <div class="pause-panel">
    <h2>游戏已暂停</h2>
    <button id="btn-resume" class="mc-btn primary">继续游戏</button>
    <button id="btn-save-exit" class="mc-btn">保存并返回标题</button>
    <button id="btn-reset" class="mc-btn danger">重置世界（删除存档）</button>
  </div>
</div>

<div id="gl-error" class="gl-error hidden"></div>

<script src="js/vendor/three.min.js"></script>
<script src="js/noise.js"></script>
<script src="js/textures.js"></script>
<script src="js/blocks.js"></script>
<script src="js/world.js"></script>
<script src="js/player.js"></script>
<script src="js/sky.js"></script>
<script src="js/audio.js"></script>
<script src="js/particles.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
