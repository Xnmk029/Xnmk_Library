<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的世界 3D - 网页版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
  #cv { display:block; width:100vw; height:100vh; }

  /* ===== 晕影 ===== */
  #vignette { position:fixed; inset:0; pointer-events:none; z-index:3;
    box-shadow:inset 0 0 180px rgba(0,0,0,.38); }
  #underTint { position:fixed; inset:0; pointer-events:none; z-index:3; display:none;
    background:rgba(24,66,150,.42); }

  /* ===== 准星 ===== */
  #crosshair { position:fixed; left:50%; top:50%; width:22px; height:22px; transform:translate(-50%,-50%); z-index:4; pointer-events:none; }
  #crosshair::before, #crosshair::after { content:""; position:absolute; background:rgba(255,255,255,.92); box-shadow:0 0 3px rgba(0,0,0,.9); }
  #crosshair::before { left:10px; top:0; width:2px; height:22px; }
  #crosshair::after  { left:0; top:10px; width:22px; height:2px; }

  #status { position:fixed; left:50%; bottom:92px; transform:translateX(-50%); z-index:4;
    display:flex; gap:10px; align-items:center; pointer-events:none;
    background:rgba(10,12,16,.4); padding:6px 14px; border-radius:9px;
    border:1px solid rgba(255,255,255,.12); }
  #status canvas { image-rendering:pixelated; }

  /* ===== 快捷栏 ===== */
  #hotbar { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:4;
    display:flex; gap:5px; padding:6px; border-radius:10px;
    background:rgba(10,12,16,.55); border:1px solid rgba(255,255,255,.14); backdrop-filter:blur(4px); }
  #hotbar .slot { width:54px; height:54px; border:2px solid rgba(255,255,255,.28); border-radius:7px;
    background:rgba(255,255,255,.06); position:relative; overflow:hidden; }
  #hotbar .slot canvas { width:100%; height:100%; image-rendering:pixelated; display:block; }
  #hotbar .slot .num { position:absolute; left:2px; top:0; font:10px Consolas,monospace; color:#fff; text-shadow:0 1px 2px #000; opacity:.8; }
  #hotbar .slot.sel { border-color:#fff; box-shadow:0 0 12px rgba(255,255,255,.65); }

  /* ===== 调试 ===== */
  #debug { position:fixed; left:12px; top:12px; z-index:4; display:none; pointer-events:none;
    font:13px/1.75 Consolas,monospace; color:#eaf2ff; text-shadow:0 1px 3px #000;
    background:rgba(0,0,0,.4); padding:10px 14px; border-radius:8px; white-space:pre; }

  /* ===== 提示 ===== */
  #toast { position:fixed; left:50%; top:16%; transform:translateX(-50%); z-index:5;
    font-size:15px; color:#fff; text-shadow:0 1px 4px #000; background:rgba(0,0,0,.55);
    padding:8px 20px; border-radius:8px; opacity:0; transition:opacity .35s; pointer-events:none; white-space:pre; }
  #toast.show { opacity:1; }

  /* ===== 遮罩 ===== */
  #overlay { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 40%, rgba(10,16,28,.72), rgba(4,6,10,.88)); color:#fff; text-align:center; }
  #overlay h1 { font-size:56px; font-weight:900; letter-spacing:8px; color:#9fe870;
    text-shadow:0 3px 0 #3a6b1f, 0 8px 30px rgba(0,0,0,.9), 0 0 60px rgba(140,230,110,.25); }
  #overlay .sub { font-size:16px; margin-top:10px; color:#c8d6ea; letter-spacing:3px; }
  #loadingBox { margin-top:34px; width:360px; }
  #loadingBar { height:12px; border-radius:6px; background:rgba(255,255,255,.13); overflow:hidden; border:1px solid rgba(255,255,255,.15); }
  #loadingFill { height:100%; width:0%; background:linear-gradient(90deg,#9fe870,#4aa8f5); transition:width .12s; }
  #loadText { margin-top:10px; font-size:13px; color:#93a7c2; }
  #startBox { display:none; margin-top:26px; }
  #keys { background:rgba(0,0,0,.42); border:1px solid rgba(255,255,255,.14); border-radius:10px;
    padding:16px 26px; font-size:14px; line-height:2.15; color:#b9c8dc; text-align:left; }
  #keys b { color:#fff; background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.28);
    border-radius:4px; padding:1px 8px; font-weight:600; margin:0 2px; font-size:12px; }
  #keys .row { display:flex; justify-content:space-between; gap:26px; }
  #keys .col b { display:inline-block; min-width:64px; }
  #startBtn { margin-top:26px; font-size:21px; font-weight:700; letter-spacing:4px; color:#fff;
    background:linear-gradient(180deg,#63b94f,#3e8a35); border:2px solid rgba(255,255,255,.55);
    border-radius:10px; padding:13px 52px; cursor:pointer; box-shadow:0 6px 22px rgba(0,0,0,.5); }
  #startBtn:hover { filter:brightness(1.15); }
  #startBtn:active { transform:translateY(1px); }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="vignette"></div>
<div id="underTint"></div>
<div id="crosshair"></div>
<div id="status"></div>
<div id="hotbar"></div>
<div id="debug"></div>
<div id="toast"></div>

<div id="overlay">
  <h1>⛏ 我的世界</h1>
  <div class="sub">无限世界 · 昼夜光影 · 体素沙盒</div>
  <div id="loadingBox">
    <div id="loadingBar"><div id="loadingFill"></div></div>
    <div id="loadText">正在生成世界…</div>
  </div>
  <div id="startBox">
    <div id="keys">
      <div class="row">
        <div class="col"><b>W A S D</b> 移动<br><b>空格</b> 跳跃 / 游泳<br><b>Shift</b> 潜行 / 下潜<br><b>Ctrl</b> 疾跑</div>
        <div class="col"><b>左键</b> 破坏方块<br><b>右键</b> 放置方块<br><b>滚轮/数字键</b> 选择方块<br><b>中键</b> 取色</div>
      </div>
      <div class="row">
        <div class="col"><b>F</b> 飞行切换<br><b>T</b> 时间加速<br><b>F1/F2</b> 视距<br><b>F3</b> 调试信息</div>
        <div class="col"><b>Esc</b> 暂停菜单<br><br>世界无限生成，尽情探索！</div>
      </div>
    </div>
    <button id="startBtn">点击进入世界</button>
  </div>
</div>
<script>
