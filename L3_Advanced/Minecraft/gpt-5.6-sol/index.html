<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#14191c">
  <title>方界 - 像素开放世界</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css?v=2">
</head>
<body>
  <main id="game-shell">
    <div id="viewport" aria-label="方界游戏视口"></div>

    <div id="loading-screen" class="screen-layer">
      <div class="loading-mark" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="loading-copy">
        <strong>正在生成世界</strong>
        <span id="loading-state">准备地形</span>
      </div>
      <div class="loading-track"><span id="loading-progress"></span></div>
    </div>

    <div id="entry-screen" class="screen-layer is-hidden">
      <div class="world-title">
        <span class="title-cube" aria-hidden="true"></span>
        <h1>方界</h1>
        <p id="world-seed-label">世界种子 560713</p>
      </div>
      <button id="enter-world" class="primary-button" type="button">
        <span class="play-icon" aria-hidden="true"></span>
        进入世界
      </button>
    </div>

    <section id="hud" aria-label="游戏状态">
      <div class="hud-top">
        <div class="world-status">
          <div class="brand-lockup">
            <span class="mini-cube" aria-hidden="true"></span>
            <strong>方界</strong>
          </div>
          <div class="location-row">
            <span id="biome-name">青原</span>
            <span id="coordinates">0 / 0 / 0</span>
          </div>
        </div>

        <div class="time-status">
          <span id="time-icon" class="sun-icon" aria-hidden="true"></span>
          <div>
            <strong id="day-label">第 1 天</strong>
            <span id="time-label">08:00</span>
          </div>
        </div>

        <div class="vitals">
          <div class="vital-line">
            <span class="heart-icon" aria-hidden="true"></span>
            <div class="meter health"><span id="health-fill"></span></div>
          </div>
          <div class="vital-line">
            <span class="bolt-icon" aria-hidden="true"></span>
            <div class="meter stamina"><span id="stamina-fill"></span></div>
          </div>
        </div>
      </div>

      <div id="target-label" class="target-label is-hidden"></div>
      <div id="crosshair" aria-hidden="true"><span></span><span></span></div>

      <div class="bottom-ui">
        <button id="inventory-button" class="utility-button" type="button" title="背包">
          <span class="bag-icon" aria-hidden="true"></span>
          <span>背包</span>
        </button>
        <div id="hotbar" class="hotbar" aria-label="快捷栏"></div>
        <button id="save-button" class="utility-button icon-only" type="button" title="保存世界">
          <span class="save-icon" aria-hidden="true"></span>
        </button>
      </div>

      <div id="toast" role="status" aria-live="polite"></div>
      <div id="damage-flash" aria-hidden="true"></div>
    </section>

    <section id="inventory-panel" class="panel-layer is-hidden" aria-label="背包与合成">
      <div class="inventory-window">
        <header class="panel-header">
          <div>
            <span>行囊</span>
            <strong>背包、合成与选项</strong>
          </div>
          <button id="close-inventory" class="close-button" type="button" title="关闭" aria-label="关闭">
            <span aria-hidden="true"></span>
          </button>
        </header>

        <div class="panel-tabs" role="tablist">
          <button class="tab-button is-active" data-tab="items" type="button" role="tab">背包</button>
          <button class="tab-button" data-tab="crafting" type="button" role="tab">合成</button>
          <button class="tab-button" data-tab="settings" type="button" role="tab">选项</button>
        </div>

        <div id="items-tab" class="tab-view">
          <div id="inventory-grid" class="inventory-grid"></div>
        </div>

        <div id="crafting-tab" class="tab-view is-hidden">
          <div id="recipe-list" class="recipe-list"></div>
        </div>

        <div id="settings-tab" class="tab-view is-hidden">
          <div class="settings-list">
            <label class="setting-row">
              <span class="setting-copy">
                <strong>永为白日</strong>
                <small>将世界时间固定在正午</small>
              </span>
              <input id="eternal-day-toggle" class="setting-toggle" type="checkbox">
              <span class="toggle-track" aria-hidden="true"></span>
            </label>
            <label class="setting-row">
              <span class="setting-copy">
                <strong>创造模式</strong>
                <small>无限方块、无伤害、无限体力并允许飞行</small>
              </span>
              <input id="creative-mode-toggle" class="setting-toggle" type="checkbox">
              <span class="toggle-track" aria-hidden="true"></span>
            </label>
          </div>
        </div>
      </div>
    </section>

    <div id="mobile-controls" aria-hidden="true">
      <div id="move-pad" class="move-pad"><span id="move-stick"></span></div>
      <div class="touch-actions">
        <button id="touch-break" type="button" aria-label="破坏方块"><span class="pick-icon"></span></button>
        <button id="touch-place" type="button" aria-label="放置方块"><span class="block-icon"></span></button>
        <button id="touch-inventory" type="button" aria-label="打开背包"><span class="bag-icon"></span></button>
        <button id="touch-jump" type="button" aria-label="跳跃"><span class="jump-icon"></span></button>
        <button id="touch-descend" type="button" aria-label="向下降落"><span class="descend-icon"></span></button>
      </div>
    </div>

    <div id="fatal-error" class="screen-layer is-hidden">
      <div class="error-box">
        <strong>世界加载失败</strong>
        <span id="fatal-message"></span>
      </div>
    </div>
  </main>

  <script type="module" src="./main.js?v=3"></script>
</body>
</html>
