/* ---------------- 环境贴图 mip 生成 ---------------- */
const WGSL_MIP = /* wgsl */`
@group(0) @binding(0) var srcT : texture_2d<f32>;
@group(0) @binding(1) var smp : sampler;
@group(0) @binding(2) var<uniform> lu : vec4f;   // 源 mip, 目标宽, 目标高, -
@vertex fn vs_mip(@builtin(vertex_index) vi : u32) -> @builtin(position) vec4f {
  var p = array<vec2f, 3>(vec2f(-1, -1), vec2f(3, -1), vec2f(-1, 3));
  return vec4f(p[vi], 0.0, 1.0);
}
@fragment fn fs_mip(@builtin(position) cp : vec4f) -> @location(0) vec4f {
  let dst = lu.yz;
  let uv = cp.xy / dst;
  let t = 1.0 / dst;
  let l = lu.x;
  var c = textureSampleLevel(srcT, smp, uv, l).rgb * 0.25;
  c += textureSampleLevel(srcT, smp, uv + vec2f(t.x, t.y), l).rgb * 0.1875;
  c += textureSampleLevel(srcT, smp, uv + vec2f(-t.x, t.y), l).rgb * 0.1875;
  c += textureSampleLevel(srcT, smp, uv + vec2f(t.x, -t.y), l).rgb * 0.1875;
  c += textureSampleLevel(srcT, smp, uv + vec2f(-t.x, -t.y), l).rgb * 0.1875;
  return vec4f(c, 1.0);
}
`;

@group(0) @binding(1) var smp : sampler;
@vertex fn vs_blit(@builtin(vertex_index) vi : u32) -> @builtin(position) vec4f {
  var p = array<vec2f, 3>(vec2f(-1, -1), vec2f(3, -1), vec2f(-1, 3));
  return vec4f(p[vi], 0.0, 1.0);
}
@fragment fn fs_blit(@builtin(position) cp : vec4f) -> @location(0) vec4f {
  let uv = cp.xy / vec2f(textureDimensions(srcT));
  return textureSampleLevel(srcT, smp, uv, 0.0);

/* ---------- 工具 ---------- */
function guard(dev, label, fn) {
  dev.pushErrorScope('validation');
  let r;
  try { r = fn(); } catch (e) { (window.__errs = window.__errs || []).push('EX[' + label + ']: ' + e.message); return null; }
  dev.popErrorScope().then(e => { if (e) (window.__errs = window.__errs || []).push('BG[' + label + ']: ' + e.message); });
  return r;
}
function bufUse(usage, size, label) {
  const b = GX.dev.createBuffer({ size: Math.max(16, size), usage, label });
  return b;
}
function texCreate(dev, o) {
  const t = dev.createTexture(Object.assign({ format: 'rgba16float', dimension: '2d' }, o));
  return t;
}
function mkVerts(device, mb) {
  const n = mb.vcount;
  const stride = 36;
  const ab = new ArrayBuffer(n * stride);
  const f = new Float32Array(ab), u = new Uint32Array(ab);
  for (let i = 0; i < n; i++) {
    f[i * 9] = mb.pos[i * 3]; f[i * 9 + 1] = mb.pos[i * 3 + 1]; f[i * 9 + 2] = mb.pos[i * 3 + 2];
    f[i * 9 + 3] = mb.nrm[i * 3]; f[i * 9 + 4] = mb.nrm[i * 3 + 1]; f[i * 9 + 5] = mb.nrm[i * 3 + 2];
    f[i * 9 + 6] = mb.uv[i * 2]; f[i * 9 + 7] = mb.uv[i * 2 + 1];
    u[i * 9 + 8] = mb.mat[i];
  }
  const vb = device.createBuffer({ size: ab.byteLength, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(vb, 0, ab);
  const ib = device.createBuffer({ size: mb.idx.length * 4, usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(ib, 0, new Uint32Array(mb.idx));

}

/* ---------- 环境球谐系数 ---------- */
function skyRadianceJS(d, env) {
  const t = clamp(d[1] * 0.5 + 0.5, 0, 1);
  let c = [
    lerp(env.skyDown[0], env.skyUp[0], Math.pow(t, .62)),
    lerp(env.skyDown[1], env.skyUp[1], Math.pow(t, .62)),
    lerp(env.skyDown[2], env.skyUp[2], Math.pow(t, .62))];
  const sd = Math.max(v3dot(d, env.sunDir), 0);
  const sun = Math.pow(sd, 900) * 45 * env.sunI + Math.pow(sd, 5) * 0.14 * env.sunI + Math.pow(sd, 1.4) * 0.02 * env.sunI;
  for (let i = 0; i < 3; i++) c[i] += env.sunColor[i] * sun;
  if (d[1] < 0.02) {
    const gh = smoothstep(0.02, -0.10, d[1]);
    for (let i = 0; i < 3; i++) c[i] = lerp(c[i], env.ground[i] * 0.8, gh);
  }
  return c;
}
function computeSH(env) {
  const N = 32 * 16;
  const sh = new Float32Array(9 * 4);
  const conv = [1, 2 / 3, 1 / 4];
  for (let iy = 0; iy < 16; iy++) {
    const theta = (iy + .5) / 16 * PI;
    const st = Math.sin(theta), ct = Math.cos(theta);
    for (let ix = 0; ix < 32; ix++) {
      const phi = (ix + .5) / 32 * TAU;
      const d = [st * Math.cos(phi), ct, st * Math.sin(phi)];
      const L = skyRadianceJS(d, env);
      const w = st;
      const Y = [
        0.282095,
        0.488603 * d[1], 0.488603 * d[2], 0.488603 * d[0],
        1.092548 * d[0] * d[1], 1.092548 * d[1] * d[2],
        0.315392 * (3 * d[2] * d[2] - 1), 1.092548 * d[0] * d[2],
        0.546274 * (d[0] * d[0] - d[1] * d[1])];
      for (let k = 0; k < 9; k++) {
        const l = k < 1 ? 0 : k < 4 ? 1 : 2;
        const f = w * Y[k] * conv[l] * (4 * PI / N) * 4;
        sh[k * 4] += L[0] * f; sh[k * 4 + 1] += L[1] * f; sh[k * 4 + 2] += L[2] * f;
      }
    }
  }
  return sh;
}

/* ---------- 地面碾压痕迹纹理 ---------- */
function makeGroundTexture(size, meters) {
  const data = new Uint8Array(size * size * 4);
  const half = size / 2;
  const px = meters / size;
  for (let y = 0; y < size; y++) {
    const wz = (y - half) * px;
    for (let x = 0; x < size; x++) {
      const wx = (x - half) * px;
      let rut = 0, comp = 0;
      for (const side of [-1, 1]) {
        // 履带中心线（带轻微弯曲与摆动）
        const cz = side * 1.43 + Math.sin(wx * 0.09) * 0.06 + Math.sin(wx * 0.31 + side) * 0.02;
        const d = Math.abs(wz - cz);
        const w = 0.30;
        if (d < w) {
          const t = 1 - d / w;
          const prof = smoothstep(0, .55, t) * (1 - smoothstep(.55, 1, t) * 0.55);
          const grain = fbm2(wx * 6.0, wz * 6.0, 3);
          rut = Math.max(rut, prof * (0.62 + 0.38 * grain));
          comp = Math.max(comp, prof * 0.8);
        }
        // 履带两侧被推起的浮土
        const e = Math.abs(d - w - 0.055);
        if (e < 0.075) rut = Math.max(rut, (1 - e / 0.075) * 0.22 * fbm2(wx * 9, wz * 9, 2));
      }
      // 碎石与凹坑
      const grit = fbm2(wx * 7.0 + 31.0, wz * 7.0 + 17.0, 3);
      const pit = fbm2(wx * 2.1 + 5.0, wz * 2.1 + 9.0, 2);
      let h = rut;
      if (pit > 0.66) h = Math.max(h, (pit - 0.66) * 0.9);
      h = clamp(h + grit * 0.10, 0, 1);
      const i = (y * size + x) * 4;
      data[i] = Math.round(h * 255);
      data[i + 1] = Math.round(comp * 255);
      data[i + 2] = Math.round(clamp(grit * 0.7 + fbm2(wx * 24, wz * 24, 2) * 0.3, 0, 1) * 255);
      data[i + 3] = 255;
    }
  }
  return data;
}

/* ---------- 随尺寸变化的资源 ---------- */
function gpuResize(W, H) {
  const dev = GX.dev;
  GX.W = W; GX.H = H;
  for (const k of ['depth', 'norm', 'ao', 'gi', 'col', 'dof', 'acc']) if (GX.tex[k]) GX.tex[k].destroy();
  for (const k of ['bloom']) if (GX.tex[k]) GX.tex[k].forEach(t => t.destroy());

  GX.tex.depth = texCreate(dev, { size: [W, H], format: 'depth32float', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_SRC });
  const colUse = GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_SRC;
  GX.tex.norm = texCreate(dev, { size: [W, H], usage: colUse });
  GX.tex.ao = texCreate(dev, { size: [W, H], usage: colUse });
  GX.tex.gi = texCreate(dev, { size: [W, H], usage: colUse });
  GX.tex.col = texCreate(dev, { size: [W, H], usage: colUse });
  GX.tex.dof = texCreate(dev, { size: [W, H], usage: colUse });
  GX.tex.acc = texCreate(dev, { size: [W, H], usage: colUse });

  GX.tex.bloom = [];
  let bw = Math.max(2, W >> 1), bh = Math.max(2, H >> 1);
  for (let i = 0; i < 5; i++) {
    GX.tex.bloom.push(texCreate(dev, { size: [bw, bh], usage: colUse }));
    bw = Math.max(2, bw >> 1); bh = Math.max(2, bh >> 1);
  }

  /* 绑定组：按通道区分，避免"附件与采样同用"校验错误 */
  const d1 = GX.tex.d1.createView(), dd = GX.tex.dd.createView();
  const mkBG = (label, o) => guard(dev, label, () => dev.createBindGroup({
    label,
    layout: GX.bgLayout,
    entries: [
      { binding: 0, resource: { buffer: GX.buffers.scene } },
      { binding: 1, resource: { buffer: GX.buffers.nodes } },
      { binding: 2, resource: { buffer: GX.buffers.mat } },
      { binding: 3, resource: GX.tex.env.createView() },
      { binding: 4, resource: GX.tex.lin },
      { binding: 5, resource: o.shadow || dd },
      { binding: 6, resource: GX.tex.shadowSmp },
      { binding: 7, resource: o.ao || d1 },
      { binding: 8, resource: o.gi || d1 },
      { binding: 9, resource: GX.tex.ground.createView() },
      { binding: 10, resource: GX.tex.clampLin },
      { binding: 11, resource: o.depth || dd },
      { binding: 12, resource: o.norm || d1 },
      { binding: 13, resource: o.prev || d1 },
    ],
  }));
  GX.bg.shadow = mkBG('bgShadow', {});
  GX.bg.main = mkBG('bgMain', { shadow: GX.tex.shadow.createView(), ao: GX.tex.ao.createView(), gi: GX.tex.gi.createView() });
  GX.bg.ao = mkBG('bgAO', { depth: GX.tex.depth.createView(), norm: GX.tex.norm.createView(), prev: GX.tex.acc.createView() });
  GX.bg.dof = mkBG('bgDOF', { depth: GX.tex.depth.createView(), norm: GX.tex.norm.createView(), prev: GX.tex.col.createView() });

  GX.bg.acc = guard(dev, 'acc', () => dev.createBindGroup({
    layout: GX.pipe.acc.getBindGroupLayout(0),
    entries: [{ binding: 0, resource: GX.tex.dof.createView() }, { binding: 1, resource: GX.tex.clampLin }],
  }));
  GX.bg.post = guard(dev, 'post', () => dev.createBindGroup({
    layout: GX.pipe.post.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: GX.buffers.post } },
      { binding: 1, resource: GX.tex.acc.createView() },
      { binding: 2, resource: GX.tex.bloom[0].createView() },
      { binding: 3, resource: GX.tex.clampLin }],
  }));
  GX.bg.bloom = GX.tex.bloom.map((t, i) => {
    const src = i === 0 ? GX.tex.acc : GX.tex.bloom[i - 1];
    const p = i === 0 ? GX.pipe.bloomPref : GX.pipe.bloomDown;
    return dev.createBindGroup({
      layout: p.getBindGroupLayout(0),
      entries: [{ binding: 0, resource: src.createView() }, { binding: 1, resource: GX.tex.clampLin }, { binding: 2, resource: { buffer: GX.buffers.bloom } }],
    });
  });
  GX.bg.bloomUp = GX.tex.bloom.map((t, i) => {
    if (i === 0) return null;
    return dev.createBindGroup({
      layout: GX.pipe.bloomUp.getBindGroupLayout(0),
      entries: [{ binding: 0, resource: GX.tex.bloom[i].createView() }, { binding: 1, resource: GX.tex.clampLin }, { binding: 2, resource: { buffer: GX.buffers.bloom } }],
    });
  });
  GX.resetAcc = true;
}

/* ---------- 相机 ---------- */
function camSetFocal(mm) {
  CAM.focal = clamp(mm, 8, 400);
  CAM.fov = 2 * Math.atan(CAM.sensorH / 2 / CAM.focal) * RAD;
}
function camUpdate() {
  if (CAM.mode === 'orbit') {
    const cp = Math.cos(CAM.pitch), sp = Math.sin(CAM.pitch);
    CAM.pos[0] = CAM.target[0] + Math.cos(CAM.yaw) * cp * CAM.dist;
    CAM.pos[1] = CAM.target[1] + sp * CAM.dist;
    CAM.pos[2] = CAM.target[2] + Math.sin(CAM.yaw) * cp * CAM.dist;
    if (CAM.pos[1] < 0.15) CAM.pos[1] = 0.15;
    m4lookAt(CAM.view, CAM.pos, CAM.target, [0, 1, 0]);
  } else {
    const cp = Math.cos(CAM.fly.pitch);
    const d = [Math.cos(CAM.fly.yaw) * cp, Math.sin(CAM.fly.pitch), Math.sin(CAM.fly.yaw) * cp];
    CAM.dir[0] = d[0]; CAM.dir[1] = d[1]; CAM.dir[2] = d[2];
    CAM.pos[0] = CAM.fly.pos[0]; CAM.pos[1] = CAM.fly.pos[1]; CAM.pos[2] = CAM.fly.pos[2];
    m4lookAt(CAM.view, CAM.pos, [CAM.pos[0] + d[0], CAM.pos[1] + d[1], CAM.pos[2] + d[2]], [0, 1, 0]);
  }
  // 记录视线方向
  if (CAM.mode === 'orbit') {
    v3norm(CAM.dir, v3sub(v3(), CAM.target, CAM.pos));
  }
  m4perspective(CAM.proj, CAM.fov * DEG, GX.W / Math.max(1, GX.H), 0.05, 1200);
}
function camJitter(px, py) {
  const jx = (px - .5) * 2 / GX.W, jy = (py - .5) * 2 / GX.H;
  CAM.proj[8] += jx; CAM.proj[9] += jy;
  m4mul(CAM.vp, CAM.proj, CAM.view);

/* ---------- 阴影矩阵 ---------- */
const _sv = m4(), _sp = m4(), _svp = m4();
function shadowVP(sunDir) {
  const c = [0, 1.0, 0], R = 17.5, D = 46;
  const eye = [c[0] + sunDir[0] * D, c[1] + sunDir[1] * D, c[2] + sunDir[2] * D];
  const up = Math.abs(sunDir[1]) > 0.94 ? [1, 0, 0] : [0, 1, 0];
  m4lookAt(_sv, eye, c, up);
  m4ortho(_sp, -R, R, -R, R, 0.5, D * 2.2);
  return m4mul(_svp, _sp, _sv);
}
function jitterSun(dir, amt, r1, r2) {
  const t = Math.sqrt(r1) * amt, a = r2 * TAU;
  const up = Math.abs(dir[1]) > 0.9 ? [1, 0, 0] : [0, 1, 0];
  const tx = v3norm(v3(), v3cross(v3(), up, dir));
  const ty = v3cross(v3(), dir, tx);
  const d = v3([dir[0] + (tx[0] * Math.cos(a) + ty[0] * Math.sin(a)) * t,
  dir[1] + (tx[1] * Math.cos(a) + ty[1] * Math.sin(a)) * t,
  dir[2] + (tx[2] * Math.cos(a) + ty[2] * Math.sin(a)) * t]);
  return v3norm(d, d);
}

/* ---------- Halton 序列 ---------- */
function halton(i, b) { let f = 1, r = 0; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; }

/* ---------- 可见性 ---------- */
function nodeVisible(n) {
  if (!n._visBase) return false;
  if (n._visNode === false || n._visGroup === false) return false;
  const t = n.tags;
  if (t.group && APP.groups[t.group] === false) return false;
  const L = t.layer || 'outer';
  if (L === 'ground') return APP.show.ground;
  if (L === 'interior' || L === 'crew') {
    if (L === 'crew') return APP.show.crew;
    return APP.show.interior;
  }
  return APP.show.outer;
}

  if ((GX.errScope | 0) < 6) { GX.errScope = (GX.errScope | 0) + 1; dev.pushErrorScope('validation'); }
  const flat = scene.update(APP.explode, dt, time);

  /* 节点缓冲 */
  const nf = GX.nodeFloat, nu = GX.nodeUint;
  let idx = 0, draws = 0;
  const list = [];
  for (const n of flat) {
    if (!nodeVisible(n)) continue;
    const cnt = n.instances ? n.instances.length : 1;
    if (idx + cnt > GX.nodeCap) break;
    const hl = (APP.highlight && n.tags.diff && n._visBase) ? 1 : 0;
    const op = (APP.xray > 0 && (n.tags.layer === 'outer')) ? lerp(1, 0.20, APP.xray) : 1;
    const isG = n.tags.isGround ? 1 : 0;
    if (n.instances) {
      for (let k = 0; k < cnt; k++) nf.set(n.instances[k], (idx + k) * 20);
    } else {
      nf.set(n.world, idx * 20);
    }
    for (let k = 0; k < cnt; k++) {
      const o = (idx + k) * 20;
      const inner = (n.tags.layer === 'interior' || n.tags.layer === 'crew') ? 1 : 0;
      nf[o + 16] = hl; nf[o + 17] = op; nf[o + 18] = isG; nf[o + 19] = inner;
    }
    list.push({ n, base: idx, cnt });
    idx += cnt; draws++;
  }
  if (idx > 0) q.writeBuffer(GX.buffers.nodes, 0, nf, 0, idx * 20);

  /* 场景 uniform */
  camUpdate();
  camJitter(halton(frameSeed % 512 + 1, 2), halton(frameSeed % 512 + 1, 3));
  const sd = GX.envDir || [0.5, 0.8, 0.3];
  const soft = ENV.sunSoft * (APP.quality.mode === 'draft' ? 1.6 : 1.0);
  const js = jitterSun(sd, soft, Math.random(), Math.random());
  const lvp = shadowVP(js);

  const su = new Float32Array(176);
  su.set(CAM.vp, 0); su.set(CAM.invVp, 16); su.set(CAM.view, 32); su.set(CAM.proj, 48);
  su.set(lvp, 64);
  su.set([CAM.pos[0], CAM.pos[1], CAM.pos[2], 1], 80);
  su.set([js[0], js[1], js[2], ENV.sunI], 84);
  su.set([ENV.sunColor[0], ENV.sunColor[1], ENV.sunColor[2], 0], 88);
  su.set(ENV.skyUp, 92); su.set(ENV.skyDown, 96);
  su.set([ENV.ground[0], ENV.ground[1], ENV.ground[2], ENV.bounce], 100);
  su.set([time, APP.quality.ao ? 1.0 : 0.0, (frameSeed % 4096) / 4096, 0], 104);
  su.set([0, APP.highlight ? 1 : 0, APP.xray, APP.cut.on ? 1 : 0], 108);
  const ax = APP.cut.axis;
  const nrm = ax === 0 ? [1, 0, 0] : ax === 1 ? [0, 1, 0] : [0, 0, 1];
  su.set([nrm[0], nrm[1], nrm[2], APP.cut.pos], 112);
  su.set([ENV.fog, soft, APP.groundAmp, 1], 116);
  // 物理弥散圆系数（像素·米）：(F/N)·F/sensorH·H_px
  const cocScale = (CAM.focal / 1000 / APP.aperture) * (CAM.focal / 1000) / (CAM.sensorH / 1000) * GX.H;
  if (APP.autoFocus) APP.focus = Math.max(0.4, v3dist(CAM.pos, CAM.target));
  APP._coc = cocScale;
  su.set([APP.focus, cocScale, APP.dofMax == null ? 26 : APP.dofMax, APP._dofDebug ? 1 : 0], 120);
  su.set(GX.sh, 124);
  q.writeBuffer(GX.buffers.scene, 0, su);

  /* 后处理 uniform */
  q.writeBuffer(GX.buffers.post, 0, new Float32Array([
    APP.post.exposure, APP.post.contrast, APP.post.saturation, APP.post.vignette,
    APP.post.curve, APP.post.bloom, APP.post.grain, APP.post.wb,
    GX.W, GX.H, time, 0]));
  q.writeBuffer(GX.buffers.bloom, 0, new Float32Array([1.0, 1.0, 1.0, 1.0]));

  const enc = dev.createCommandEncoder();

  /* 1. 阴影 */
  {
    const p = enc.beginRenderPass({ label:'shadow',
      colorAttachments: [],
      depthStencilAttachment: {
        view: GX.tex.shadow.createView(), depthClearValue: 1.0, depthLoadOp: 'clear', depthStoreOp: 'store',
      },
    });
    p.setPipeline(GX.pipe.shadow);
    p.setBindGroup(0, GX.bg.shadow);
    bindGeom(p);
    for (const d of list) {
      if (d.n.tags.isGround || !APP.shadowOn) continue;
      p.drawIndexed(d.n.mesh.count, d.cnt, d.n.mesh.first, 0, d.base);
    }
    p.end();
  }

  /* 2. 预通道（深度 + 法线） */
  {
    const p = enc.beginRenderPass({ label:'prepass',
      colorAttachments: [{ view: GX.tex.norm.createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: .5, g: .5, b: 1, a: 1 } }],
      depthStencilAttachment: {
        view: GX.tex.depth.createView(), depthClearValue: 1.0, depthLoadOp: 'clear', depthStoreOp: 'store',
      },
    });
    p.setPipeline(GX.pipe.pre);
    p.setBindGroup(0, GX.bg.main);
    bindGeom(p);
    for (const d of list) p.drawIndexed(d.n.mesh.count, d.cnt, d.n.mesh.first, 0, d.base);
    p.end();
  }

  /* 3. SSAO + SSGI */
  if (APP.quality.ao) {
    const p = enc.beginRenderPass({ label:'ao',
      colorAttachments: [
        { view: GX.tex.ao.createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 1, g: 0, b: 0, a: 1 } },
        { view: GX.tex.gi.createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }],
    });
    p.setPipeline(GX.pipe.ao);
    p.setBindGroup(0, GX.bg.ao);
    p.draw(3);
    p.end();
  }

  /* 4. 天空背景 */
  {
    const p = enc.beginRenderPass({ label: 'sky',
      colorAttachments: [{ view: GX.tex.col.createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }],
    });
    p.setPipeline(GX.pipe.sky);
    p.setBindGroup(0, GX.bg.main);
    p.draw(3);
    p.end();
  }

  /* 5. 主通道 */
  {
    const p = enc.beginRenderPass({ label:'main',
      colorAttachments: [{ view: GX.tex.col.createView(), loadOp: 'load', storeOp: 'store' }],
      depthStencilAttachment: {
        view: GX.tex.depth.createView(), depthLoadOp: 'load', depthStoreOp: 'store',
      },
    });
    p.setPipeline(GX.pipe.main);
    p.setBindGroup(0, GX.bg.main);
    bindGeom(p);
    for (const d of list) {
      if (APP.xray > 0 && d.n.tags.layer === 'outer') continue;
      p.drawIndexed(d.n.mesh.count, d.cnt, d.n.mesh.first, 0, d.base);
    }
    if (APP.xray > 0) {
      p.setPipeline(GX.pipe.mainBlend);
      bindGeom(p);
      for (const d of list) {
        if (d.n.tags.layer !== 'outer') continue;
        p.drawIndexed(d.n.mesh.count, d.cnt, d.n.mesh.first, 0, d.base);
      }
    }
    /* 粒子 */
    if (APP.particles && GX.partCount) {
      const cr = v3(CAM.view[0], CAM.view[4], CAM.view[8]);
      const cu = v3(CAM.view[1], CAM.view[5], CAM.view[9]);
      const pu = particleUniform(time, dt, cr, cu, CAM.vp, CAM.pos);
      pu[31] = APP.partDensity;
      pu.set(particleWind(time), 32);
      pu.set([0, 0, 0, APP.spin > 0 ? 1 : 0], 36);
      q.writeBuffer(GX.buffers.part, 0, pu);
      const bg = dev.createBindGroup({
        label: 'partDrawBG',
        layout: GX.pipe.partDraw.getBindGroupLayout(0),
        entries: [{ binding: 0, resource: { buffer: GX.buffers.part } }, { binding: 1, resource: { buffer: GX.buffers.parts } }],
      });
      p.setPipeline(GX.pipe.partDraw);
      p.setBindGroup(0, bg);
      p.draw(4, Math.floor(GX.partCount * APP.partDensity));
    }
    p.end();
  }

  /* 5. 景深 */
  {
    const p = enc.beginRenderPass({ label:'dof',
      colorAttachments: [{ view: GX.tex.dof.createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }],
    });
    p.setPipeline(GX.pipe.dof);
    p.setBindGroup(0, GX.bg.dof);
    p.draw(3);
    p.end();
  }

  /* 6. 累积 */
  {
    const w = APP.acc.reset ? 1.0 : 1.0 / (APP.acc.n + 1);
    const p = enc.beginRenderPass({ label:'acc',
      colorAttachments: [{
        view: GX.tex.acc.createView(), loadOp: APP.acc.reset ? 'clear' : 'load',
        storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 },
      }],
    });
    p.setPipeline(GX.pipe.acc);
    p.setBindGroup(0, GX.bg.acc);
    p.setBlendConstant({ r: w, g: w, b: w, a: w });
    p.draw(3);
    p.end();
    APP.acc.n = APP.acc.reset ? 1 : APP.acc.n + 1;
    APP.acc.reset = false;
  }

  /* 7. 泛光 */
  if (APP.post.bloom > 0.001) {
    for (let i = 0; i < GX.tex.bloom.length; i++) {
      const p = enc.beginRenderPass({ label:'bloomDown',
        colorAttachments: [{ view: GX.tex.bloom[i].createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }],
      });
      p.setPipeline(i === 0 ? GX.pipe.bloomPref : GX.pipe.bloomDown);
      p.setBindGroup(0, GX.bg.bloom[i]);
      p.draw(3);
      p.end();
    }
    for (let i = GX.tex.bloom.length - 1; i > 0; i--) {
      const p = enc.beginRenderPass({ label:'bloomUp',
        colorAttachments: [{ view: GX.tex.bloom[i - 1].createView(), loadOp: 'load', storeOp: 'store' }],
      });
      p.setPipeline(GX.pipe.bloomUp);
      p.setBindGroup(0, GX.bg.bloomUp[i]);
      p.draw(3);
      p.end();
    }
  }

  /* 8. 后处理 → 画布 */
  {
    const view = GX.ctx.getCurrentTexture().createView();
    const p = enc.beginRenderPass({ label:'post',
      colorAttachments: [{ view, loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }],
    });
    p.setPipeline(GX.pipe.post);
    p.setBindGroup(0, GX.bg.post);
    p.draw(3);
    p.end();
  }

  /* 9. 粒子更新（下一帧用） */
  if (APP.particles) {
    const bg = dev.createBindGroup({
      label: 'partSimBG',
      layout: GX.pipe.partUpdate.getBindGroupLayout(0),
      entries: [{ binding: 0, resource: { buffer: GX.buffers.part } }, { binding: 1, resource: { buffer: GX.buffers.parts } }],
    });
    const cp = enc.beginComputePass({ label: 'particles' });
    cp.setPipeline(GX.pipe.partUpdate);
    cp.setBindGroup(0, bg);
    cp.dispatchWorkgroups(Math.ceil(GX.partCount / 64));
    cp.end();
  }

  q.submit([enc.finish()]);
  if (GX.errScope > 0) {
    const n = GX.errScope; GX.errScope = 0;
    dev.popErrorScope().then(e => { if (e) window.__errs.push('GPU 校验错误: ' + e.message); });
  }
  APP.drawCalls = draws;
  return draws;
}

'use strict';
/* =========================================================================
   A0_ui.js — 界面构建与面板
   ========================================================================= */

const UI = {
  el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; },
  group(title, open, children, badge) {
    const g = UI.el('div', 'grp' + (open ? '' : ' closed'));
    const hd = UI.el('div', 'hd');
    hd.appendChild(UI.el('span', 'arw', '▼'));
    hd.appendChild(UI.el('span', 't', title));
    if (badge) hd.appendChild(UI.el('span', 'badge', badge));
    const bd = UI.el('div', 'bd');
    for (const c of children) if (c) bd.appendChild(c);
    hd.onclick = () => g.classList.toggle('closed');
    g.appendChild(hd); g.appendChild(bd);
    return g;
  },
  row() { const r = UI.el('div', 'row'); for (const a of arguments) if (a) r.appendChild(a); return r; },
  slider(o) {
    const wrap = UI.el('div', 'slider');
    const top = UI.el('div', 'top');
    const lab = UI.el('div', 'lab', o.label);
    const val = UI.el('div', 'val');
    top.appendChild(lab); top.appendChild(val);
    if (o.unit) { const u = UI.el('span', 'unit', o.unit); top.appendChild(u); }
    const inp = UI.el('input');
    inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step ?? 0.01; inp.value = o.value;
    const fmt = o.fmt || (v => (o.step && o.step < 0.1 ? (+v).toFixed(2) : (+v).toFixed(o.step >= 1 ? 0 : 1)));
    val.textContent = fmt(o.value);
    inp.oninput = () => { const v = +inp.value; val.textContent = fmt(v); o.onInput(v); };
    wrap.appendChild(top); wrap.appendChild(inp);
    wrap.setValue = (v) => { inp.value = v; val.textContent = fmt(v); };
    return wrap;
  },
  toggle(o) {
    const r = UI.el('div', 'row');
    r.appendChild(UI.el('div', 'lab', o.label));
    const sw = UI.el('div', 'sw' + (o.value ? ' on' : ''));
    sw.onclick = () => { o.value = !o.value; sw.classList.toggle('on', o.value); o.onChange(o.value); };
    r.appendChild(sw);
    r.setValue = v => { o.value = v; sw.classList.toggle('on', v); };
    return r;
  },
  chk(o) {
    const c = UI.el('div', 'chk' + (o.indent ? ' ind' : '') + (o.value ? ' on' : ''));
    c.appendChild(UI.el('div', 'bx', '✓'));
    c.appendChild(UI.el('div', 'lab', o.label));
    if (o.dot) { const d = UI.el('div', 'sw2' + (o.value ? ' on' : '')); c.appendChild(d); c._dot = d; }
    c.onclick = (e) => { e.stopPropagation(); o.value = !o.value; c.classList.toggle('on', o.value); if (c._dot) c._dot.classList.toggle('on', o.value); o.onChange && o.onChange(o.value); };
    c.setValue = v => { o.value = v; c.classList.toggle('on', v); if (c._dot) c._dot.classList.toggle('on', v); };
    if (o.onSelect) c.oncontextmenu = (e) => { e.preventDefault(); o.onSelect(); };
    return c;
  },
  seg(o) {
    const wrap = UI.el('div');
    if (o.label) { const l = UI.el('div', 'lab', o.label); l.style.marginBottom = '5px'; wrap.appendChild(l); }
    const s = UI.el('div', 'seg');
    const btns = [];
    for (const op of o.options) {
      const b = UI.el('button', op.k === o.value ? 'on' : '', op.label);
      b.onclick = () => { btns.forEach(x => x.classList.remove('on')); b.classList.add('on'); o.onChange(op.k); };
      btns.push(b); s.appendChild(b);
    }
    wrap.appendChild(s);
    wrap.setValue = k => { o.options.forEach((op, i) => btns[i].classList.toggle('on', op.k === k)); };
    return wrap;
  },
  btn(label, cls, onClick) {
    const b = UI.el('button', 'btn ' + (cls || ''), label);
    b.onclick = onClick; return b;
  },
  note(html, hl) { const n = UI.el('div', 'note' + (hl ? ' hl' : '')); n.innerHTML = html; return n; },
  kv(k, v, cls, id) {
    const r = UI.el('div', 'kv');
    r.appendChild(UI.el('span', 'k', k));
    const val = UI.el('span', 'v ' + (cls || ''), v);
    if (id) val.id = id;
    r.appendChild(val);
    return r;
  },
  hr() { return UI.el('div', 'hr'); },
  mini(t) { return UI.el('div', 'mini', t); },
};

/* ---------- 装配树 ---------- */
function buildTree(scene) {
  const box = PANEL.treeBox;
  box.innerHTML = '';
  const byGroup = new Map();
  scene.walk(n => {
    if (!n.mesh) return;
    const g = n.tags.group || 'hull';
    if (!byGroup.has(g)) byGroup.set(g, []);
    byGroup.get(g).push(n);
  });
  for (const g of GROUPS) {
    const items = byGroup.get(g.key);
    if (!items || !items.length) continue;
    const head = UI.chk({
      label: g.name, value: APP.groups[g.key] !== false, dot: true,
      onChange: v => {
        APP.groups[g.key] = v;
        for (const n of items) n._visGroup = v;
        APP.acc.reset = true;
        for (const c of body.children) if (c.setValue && c._isGroupChild) c.setValue(v);
      }
    });
    const body = UI.el('div');
    body.style.display = 'none';
    head.oncontextmenu = (e) => {
      e.preventDefault();
      body.style.display = body.style.display === 'none' ? 'block' : 'none';
    };
    // 单击展开
    head.addEventListener('click', () => {
      body.style.display = body.style.display === 'none' ? 'block' : 'none';
    }, true);
    for (const n of items) {
      const c = UI.chk({
        label: n.name, value: n._visBase !== false, indent: true,
        onChange: v => { n._visNode = v; APP.acc.reset = true; },
        onSelect: () => showPartInfo(n)
      });
      c._isGroupChild = true;
      c.addEventListener('click', (e) => { e.stopPropagation(); }, false);
      c.addEventListener('mouseenter', () => showPartInfo(n, true));
      body.appendChild(c);
    }
    box.appendChild(head); box.appendChild(body);
  }
}

/* ---------- 部件信息 ---------- */
function showPartInfo(n, hover) {
  if (!PANEL.infoBox) return;
  if (!n) {
    PANEL.infoBox.innerHTML = '';
    PANEL.infoBox.appendChild(UI.note('在左侧装配树中点击任意部件以查看其结构说明与规格数据。'));
    return;
  }
  PANEL.infoBox.innerHTML = '';
  const t = UI.el('div');
  t.style.cssText = 'font-size:12.5px;font-weight:600;color:#e4edf7;margin-bottom:7px';
  t.textContent = n.name;
  PANEL.infoBox.appendChild(t);
  const tags = UI.el('div');
  tags.style.marginBottom = '8px';
  const gname = (GROUPS.find(g => g.key === n.tags.group) || { name: n.tags.group }).name;
  tags.innerHTML = `<span class="tag">${gname}</span>` +
    (n.tags.layer === 'interior' ? '<span class="tag b">内构</span>' : '') +
    (n.tags.layer === 'crew' ? '<span class="tag g">乘员</span>' : '') +
    (n.tags.diff ? '<span class="tag acc">改型差异件</span>' : '');
  PANEL.infoBox.appendChild(tags);
  if (n.info) PANEL.infoBox.appendChild(UI.note(n.info));
  if (n.spec) {
    const kvs = UI.el('div');
    kvs.style.marginTop = '8px';
    for (const k in n.spec) kvs.appendChild(UI.kv(k, n.spec[k]));
    PANEL.infoBox.appendChild(kvs);
  }
  const tri = (n.mesh.count / 3) | 0;
  PANEL.infoBox.appendChild(UI.kv('三角形数', tri.toLocaleString()));
}

/* ---------- 尺寸校核 ---------- */
function buildDimCheck() {
  const box = PANEL.dimBox;
  const rows = [
    ['车长（含炮向前）', 10.10, 10.10], ['车宽（履带外缘）', 3.44, 3.44],
    ['车高（至炮塔顶）', 2.40, 2.40], ['离地间隙', 0.45, 0.43],
    ['车体长', 7.60, 7.60], ['负重轮直径', 0.75, 0.75],
    ['履带宽度', 0.575, 0.58], ['炮管长度（耳轴前）', 5.50, 5.60],
  ];
  for (const [n, mine, ref] of rows) {
    const d = Math.abs(mine - ref);
    const cls = d < 0.03 ? 'g' : d < 0.12 ? 'w' : 'b';
    box.appendChild(UI.kv(n, `${mine.toFixed(2)} / ${ref.toFixed(2)} m`, cls));
  }
  box.appendChild(UI.note('左值为本模型程序化生成尺寸，右值为公开资料标称值。偏差在 ±3cm 内视为一致。'));
}

/* ---------- 交互动作 ---------- */
function setTab(t) {
  APP.tab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.dataset.tab === t));
  const hints = {
    asm: '左键旋转 · 中键平移 · 滚轮缩放 · 点击装配树查看部件',
    var: '左键旋转 · 滚轮缩放 · 选择改型后开启透视解构对比差异',
    studio: '左键旋转 · 中键平移 · 滚轮缩放 · 自由飞行模式下 WASD 移动',
  };
  document.getElementById('ovHint').textContent = hints[t] || '';
  APP.highlight = (t === 'var');
  const hlChk = document.querySelectorAll('.panel[data-tab="var"] .chk, .panel[data-tab="asm"] .chk');
  for (const c of hlChk) { const lb = c.querySelector('.lab'); if (lb && lb.textContent.indexOf('差异') >= 0) c.setValue(APP.highlight); }
  const vl = document.getElementById('vlabel');
  if (t === 'var') {
    document.getElementById('vlTitle').textContent = VARIANTS[APP.variant].name;
    document.getElementById('vlDesc').textContent = VARIANTS[APP.variant].desc;
    vl.style.display = 'flex';
  } else { vl.style.display = 'none'; }
  APP.acc.reset = true;
}

function setVariant(k) {
  APP.variant = k;
  applyVariant(scene, k);
  document.querySelectorAll('.vcard[data-k]').forEach(c => c.classList.toggle('on', c.dataset.k === k));
  document.getElementById('ovVar').textContent = VARIANTS[k].name;
  document.getElementById('vlTitle').textContent = VARIANTS[k].name;
  document.getElementById('vlDesc').textContent = VARIANTS[k].desc;
  buildDiffList();
  APP.acc.reset = true;
}

function setXray(mode) {
  if (mode === 'off') { APP.xray = 0; APP.cut.on = false; }
  else if (mode === 'ghost') { APP.xray = 0.78; APP.cut.on = false; APP.show.interior = true; }
  else { APP.xray = 0; APP.cut.on = true; APP.show.interior = true; }
  APP.acc.reset = true;
}

  power: { pos: [-1.05, 2.40, 2.70], tgt: [-2.75, 1.05, 0.05], mode: 'ghost' },
  top: { pos: [1.7, 4.7, 2.7], tgt: [-0.2, 2.05, 0], mode: 'solid' },
};
function camPreset(k) {
  const p = CAM_PRESETS[k]; if (!p) return;
  CAM.mode = 'orbit';
  CAM.target[0] = p.tgt[0]; CAM.target[1] = p.tgt[1]; CAM.target[2] = p.tgt[2];
  const d = v3sub(v3(), p.pos, p.tgt);
  CAM.dist = Math.max(0.4, v3len(d));
  CAM.yaw = Math.atan2(d[2], d[0]);
  CAM.pitch = Math.asin(clamp(d[1] / CAM.dist, -1, 1));
  if (p.mode === 'ghost') {
    APP.xray = 0.62; APP.cut.on = false;
    APP.show.interior = true; APP.show.crew = (k === 'driver' || k === 'gunner' || k === 'commander');
    if (PANEL.envRefresh) { }
    const segs = document.querySelectorAll('.panel[data-tab="var"] .seg');
    if (segs[0]) segs[0].querySelectorAll('button')[1].click();
    const chks = document.querySelectorAll('.panel[data-tab="var"] .chk');
    for (const c of chks) {
      const t = c.querySelector('.lab').textContent;
      if (t.indexOf('车体内构') >= 0 || t.indexOf('乘员组') >= 0) { if (!c.classList.contains('on')) c.click(); }
    }
  } else {
    APP.xray = 0; APP.cut.on = false;
    const segs = document.querySelectorAll('.panel[data-tab="var"] .seg');
    if (segs[0]) segs[0].querySelectorAll('button')[0].click();
  }
  APP.acc.reset = true;
}


/* ==================== A2_main.js ==================== */
'use strict';
/* =========================================================================
   A2_main.js — 引导 / 输入 / 渲染主循环 / 大画幅导出
   ========================================================================= */

let scene = null, mb = null;
let canvas = null, running = false, bootDone = false;
const keys = Object.create(null);

/* 运行期错误收集（便于诊断 WebGPU 校验错误） */
window.__errs = [];
(function () {
  const ce = console.error.bind(console), cw = console.warn.bind(console);
  console.error = (...a) => { window.__errs.push(a.map(x => (x && x.message) || String(x)).join(' ')); ce(...a); };
  console.warn = (...a) => { window.__errs.push('WARN ' + a.map(x => (x && x.message) || String(x)).join(' ')); cw(...a); };
  window.addEventListener('error', e => window.__errs.push('ERR: ' + e.message));
  window.addEventListener('unhandledrejection', e => window.__errs.push('REJ: ' + (e.reason && e.reason.message || e.reason)));
})();

/* ---------- 引导 ---------- */
function bootUI(pct, text) {
  const f = document.getElementById('bootFill'), s = document.getElementById('bootSt');
  if (f) f.style.width = (pct * 100).toFixed(0) + '%';
  if (s && text) s.textContent = text;
}
const yieldFrame = () => new Promise(r => setTimeout(r, 0));

async function boot() {
  canvas = document.getElementById('gfx');
  try {
    bootUI(0.03, '正在初始化场景图…');
    await yieldFrame();

    mb = new MeshBuilder(null);
    scene = new Scene(mb);
    mb.scene = scene;

    bootUI(0.10, '正在程序化生成车体装甲壳体…');
    await yieldFrame();
    scene.add('hull', scene.root, {});
    scene.add('turret', scene.root, { pivot: [TUR.ringX, 0, 0] });
    scene.add('gun', scene.find('turret'), { pivot: [TUR.trunnionX, TUR.trunnionY, 0] });

    bootUI(0.18, '正在生成沙砾地面…');
    await yieldFrame();
    buildGround(scene, mb);

    bootUI(0.24, '正在生成车体与首上装甲…');
    await yieldFrame();
    buildHull(scene, mb);
    buildGlacisERA(scene, mb, 'std');
    buildGlacisERA(scene, mb, 'P');

    bootUI(0.36, '正在生成行动装置与双销履带…');
    await yieldFrame();
    buildRunning(scene, mb);

    bootUI(0.50, '正在生成炮塔与 125mm 滑膛炮…');
    await yieldFrame();
    buildTurret(scene, mb);
    buildGun(scene, mb);

    bootUI(0.60, '正在生成附加装甲与观瞄设备…');
    await yieldFrame();
    buildTurretArmor(scene, mb, 'VT-4');
    buildTurretArmor(scene, mb, 'P');
    buildTurretArmor(scene, mb, 'A1');

    bootUI(0.70, '正在生成动力舱内构…');
    await yieldFrame();
    buildPowerpack(scene, mb);

    bootUI(0.78, '正在生成战斗舱自动装弹机…');
    await yieldFrame();
    buildAutoloader(scene, mb);

    bootUI(0.84, '正在生成驾驶舱…');
    await yieldFrame();
    buildDriverStation(scene, mb);

    bootUI(0.89, '正在装配三人乘员组…');
    await yieldFrame();
    buildCrew(scene, mb);

    applyVariant(scene, 'VT-4');
    bootUI(0.92, `正在上传几何数据（${(mb.triCount / 1000).toFixed(0)}k 三角形）…`);
    await yieldFrame();

    /* GPU */
    bootUI(0.94, '正在初始化 WebGPU 设备与管线…');
    await yieldFrame();
    await gpuInit(canvas, mb, ENV);
    document.getElementById('stGpu').textContent = (GX.adapterInfo.description || GX.adapterInfo.vendor || 'WebGPU').slice(0, 22);

    bootUI(0.97, '正在生成程序化 HDRI 环境…');
    await yieldFrame();
    renderEnv(ENV);

    resizeCanvas();
    camSetFocal(50);
    APP.aperture = 8.0; APP.focus = 13.0; APP.dofMax = 26; APP.autoFocus = true;

    bootUI(0.99, '正在构建界面…');
    await yieldFrame();
    buildUI(scene);
    setTab('asm');
    bindInput();
    setVariant('VT-4');

    bootUI(1.0, '就绪');
    bootDone = true;
    setTimeout(() => document.getElementById('boot').classList.add('gone'), 260);
    requestAnimationFrame(loop);
  } catch (err) {
    console.error(err);
    const e = document.getElementById('bootErr');
    const s = document.getElementById('bootSt');
    if (s) s.textContent = '启动失败';
    if (e) e.innerHTML = `<b>无法启动：</b>${String(err.message || err)}<br>
      <code style="font-size:10px;opacity:.7">${String(err.stack || '').split('\n').slice(0, 4).join('<br>')}</code><br><br>
      请确认：① 使用 Chrome 113+ / Edge 113+ 桌面版；② 已启用 WebGPU（<code>chrome://gpu</code> 中 WebGPU 为 Enabled）；
      ③ 显卡驱动为最新版本。`;
  }
}

/* ---------- 画布尺寸 ---------- */
function resizeCanvas() {
  const wrap = document.getElementById('vpwrap');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const scale = APP.quality.scale || 1;
  const W = Math.max(64, Math.floor(wrap.clientWidth * dpr * scale));
  const H = Math.max(64, Math.floor(wrap.clientHeight * dpr * scale));
  if (W === GX.W && H === GX.H) return;
  canvas.width = W; canvas.height = H;
  canvas.style.width = '100%'; canvas.style.height = '100%';
  if (GX.ok) { gpuResize(W, H); APP.acc.reset = true; }
  document.getElementById('stRes').textContent = `${W}×${H}`;
}

/* ---------- 输入 ---------- */
function bindInput() {
  const wrap = document.getElementById('vpwrap');
  let drag = null;
  const st = { x: 0, y: 0, btn: 0, shift: false };

  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    drag = { x: e.clientX, y: e.clientY, btn: e.button, shift: e.shiftKey, alt: e.altKey };
    wrap.classList.add('drag');
  });
  canvas.addEventListener('pointerup', e => {
    drag = null; wrap.classList.remove('drag');
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) { }
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    if (CAM.mode === 'orbit') {
      if (drag.btn === 0 && !drag.shift) {
        CAM.yaw -= dx * 0.0055;
        CAM.pitch = clamp(CAM.pitch + dy * 0.0050, -1.45, 1.45);
      } else {
        const s = CAM.dist * 0.0016;
        const right = [CAM.view[0], CAM.view[4], CAM.view[8]];
        const up = [CAM.view[1], CAM.view[5], CAM.view[9]];
        for (let i = 0; i < 3; i++) CAM.target[i] += -right[i] * dx * s + up[i] * dy * s;
      }
    } else {
      if (drag.btn === 0) {
        CAM.fly.yaw += dx * 0.0038;
        CAM.fly.pitch = clamp(CAM.fly.pitch - dy * 0.0038, -1.5, 1.5);
      } else {
        const s = 0.02;
        const right = [CAM.view[0], CAM.view[4], CAM.view[8]];
        const up = [CAM.view[1], CAM.view[5], CAM.view[9]];
        for (let i = 0; i < 3; i++) CAM.fly.pos[i] += -right[i] * dx * s + up[i] * dy * s;
      }
    }
    APP.acc.reset = true;
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    if (CAM.mode === 'orbit') {
      CAM.dist = clamp(CAM.dist * Math.exp(e.deltaY * 0.0011), 0.6, 260);
    } else {
      const cp = Math.cos(CAM.fly.pitch);
      const d = [Math.cos(CAM.fly.yaw) * cp, Math.sin(CAM.fly.pitch), Math.sin(CAM.fly.yaw) * cp];
      const s = Math.exp(e.deltaY * 0.0009) * 0.9;
      for (let i = 0; i < 3; i++) CAM.fly.pos[i] += d[i] * s;
    }
    APP.acc.reset = true;
  }, { passive: false });

  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space' && APP.tab === 'studio') { APP.acc.reset = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  window.addEventListener('resize', () => resizeCanvas());
}

function updateFly(dt) {
  if (CAM.mode !== 'fly') return;
  const sp = (keys['ShiftLeft'] ? 26 : 7.5) * dt;
  const cp = Math.cos(CAM.fly.pitch), sp2 = Math.sin(CAM.fly.pitch);
  const f = [Math.cos(CAM.fly.yaw) * cp, sp2, Math.sin(CAM.fly.yaw) * cp];
  const r = v3norm(v3(), v3cross(v3(), f, [0, 1, 0]));
  let moved = false;
  const mv = (v, s) => { for (let i = 0; i < 3; i++) CAM.fly.pos[i] += v[i] * s; moved = true; };
  if (keys['KeyW']) mv(f, sp);
  if (keys['KeyS']) mv(f, -sp);
  if (keys['KeyA']) mv(r, -sp);
  if (keys['KeyD']) mv(r, sp);
  if (keys['KeyE'] || keys['Space']) mv([0, 1, 0], sp);
  if (keys['KeyQ'] || keys['ControlLeft']) mv([0, 1, 0], -sp);
  if (moved) APP.acc.reset = true;
}

/* ---------- 主循环 ---------- */
let lastT = 0, fpsAcc = 0, fpsN = 0, msAcc = 0, lastFrame = 0, watchdog = 0;
function loop(now) {
  if (!running) return;
  requestAnimationFrame(loop);
  if (now - lastFrame < 6) return;      // 防止 rAF 与兜底定时器重复驱动
  lastFrame = now;
  // 兜底：rAF 被挂起时（后台标签 / 离屏合成）改用定时器驱动，保证仍在推进
  clearTimeout(watchdog);
  watchdog = setTimeout(() => { if (performance.now() - lastFrame > 420) loop(performance.now()); }, 420);
  const t = now * 0.001;
  let dt = lastT ? Math.min(0.1, t - lastT) : 0.016;
  lastT = t;
  APP.time += dt;
  const time = APP.time;

  updateFly(dt);

  /* 行走动画 */
  if (APP.drive) {
    APP.spin += APP.driveSpeed * dt;
    APP.acc.reset = true;
  }
  /* 炮塔 / 火炮姿态 */
  const tur = scene.find('turret'), gun = scene.find('gun');
  if (tur) {
    if (Math.abs(tur.rot[1] - APP.turretYaw) > 1e-5) { tur.rot[1] = APP.turretYaw; tur._dirty = true; APP.acc.reset = true; }
  }
  if (gun) {
    if (Math.abs(gun.rot[2] - APP.gunPitch) > 1e-5) { gun.rot[2] = APP.gunPitch; gun._dirty = true; APP.acc.reset = true; }
  }

  const t0 = performance.now();
  const seed = APP.acc.reset ? 0 : APP.acc.n;
  const converged = !APP.acc.reset && APP.acc.n >= APP.quality.samples;
  if (converged) {
    presentOnly();
  } else {
    renderFrame(dt, time, APP.acc.reset ? (Math.random() * 4096) | 0 : APP.acc.n);
  }
  const t1 = performance.now();
  msAcc = msAcc * 0.9 + (t1 - t0) * 0.1;

  /* 统计 */
  fpsN++; fpsAcc += dt;
  if (fpsAcc > 0.4) {
    APP.fps = fpsN / fpsAcc; fpsN = 0; fpsAcc = 0;
    document.getElementById('stFps').textContent = APP.fps.toFixed(0);
    document.getElementById('stSpp').textContent = APP.acc.n;
    document.getElementById('stTri').textContent = (GX.triCount / 1000).toFixed(0) + 'k';
    document.getElementById('ovPerf').textContent = msAcc.toFixed(1) + ' ms';
    document.getElementById('ovSpp').textContent = converged ? `已收敛 ${APP.acc.n} spp` : `累积 ${APP.acc.n} spp`;
    const dot = document.getElementById('ovDot');
    dot.className = 'dot' + (converged ? '' : ' w');
    document.getElementById('ovMode').textContent = converged ? '累积渲染 · 已收敛' : '累积渲染 · 采样中';
    document.getElementById('ovCam').textContent =
      (CAM.mode === 'orbit' ? '轨道环视' : '自由飞行') + ' · ' + CAM.focal.toFixed(0) + 'mm f/' + APP.aperture.toFixed(1);
    const pct = Math.min(1, APP.acc.n / APP.quality.samples);
    document.getElementById('accbar').style.width = (pct * 100).toFixed(1) + '%';
    const setT = (id, t, cls) => { const e = document.getElementById(id); if (e) { e.textContent = t; if (cls) e.className = 'v ' + cls; } };
    setT('statSpp', APP.acc.n + ' spp', 'g');
    setT('statConv', converged ? '已收敛' : '累积中', converged ? 'g' : 'w');
    setT('statDraw', APP.drawCalls);
    setT('perfFps', APP.fps.toFixed(0), 'g');
    setT('perfMs', msAcc.toFixed(1) + ' ms');
    setT('perfDraw', APP.drawCalls);
  }
}

/* 收敛后仅重绘后处理（低成本保持画面） */
function presentOnly() {
  const dev = GX.dev, enc = dev.createCommandEncoder();
  const p = enc.beginRenderPass({
    colorAttachments: [{ view: GX.ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }],
  });
  p.setPipeline(GX.pipe.post);
  p.setBindGroup(0, GX.bg.post);
  p.draw(3);
  p.end();
  GX.q.submit([enc.finish()]);
}

/* ---------- 大画幅导出 ---------- */
let exporting = false;
async function doExport() {
  if (exporting || !GX.ok) return;
  exporting = true;
  const W = APP.exportW || 3840;
  const H = Math.round(W * 9 / 16);
  const spp = APP.exportSpp || 96;
  const oldW = canvas.width, oldH = canvas.height;
  const btn = document.querySelector('.panel[data-tab="studio"] .btn.primary');
  const setBtn = (t, dis) => { if (btn) { btn.textContent = t; btn.disabled = !!dis; } };
  try {
    setBtn(`正在准备 ${W}×${H} 渲染…`, true);
    canvas.width = W; canvas.height = H;
    GX.ctx.configure({ device: GX.dev, format: GX.fmt, alphaMode: 'opaque' });
    gpuResize(W, H);
    APP.acc.reset = true;
    document.getElementById('stRes').textContent = `${W}×${H}`;
    await yieldFrame();
    for (let i = 0; i < spp; i++) {
      renderFrame(1 / 60, APP.time + i / 60, i);
      if (i % 4 === 0) {
        await GX.dev.queue.onSubmittedWorkDone();
        setBtn(`正在渲染 ${W}×${H} · ${i + 1}/${spp} spp`, true);
        await yieldFrame();
      }
    }
    await GX.dev.queue.onSubmittedWorkDone();
    setBtn('正在编码 PNG…', true);
    await yieldFrame();
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    if (blob) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `VT4_${APP.variant}_${W}x${H}_${spp}spp.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }
  } catch (err) {
    console.error(err);
    setBtn('导出失败：' + String(err.message || err).slice(0, 40), false);
    exporting = false;
    await new Promise(r => setTimeout(r, 2600));
  }
  /* 恢复视口 */
  canvas.width = oldW; canvas.height = oldH;
  GX.ctx.configure({ device: GX.dev, format: GX.fmt, alphaMode: 'opaque' });
  gpuResize(oldW, oldH);
  APP.acc.reset = true;
  document.getElementById('stRes').textContent = `${oldW}×${oldH}`;
  setBtn('开始渲染并导出 PNG', false);
  exporting = false;
}

/* ---------- 启动 ---------- */
/* ---------- 控制台调试接口 ---------- */
window.__st = function () {
  return {
    ok: GX.ok, 分辨率: [GX.W, GX.H], 采样数: APP.acc.n, 绘制调用: APP.drawCalls,
    三角形: GX.triCount, 相机: { 模式: CAM.mode, 位置: Array.from(CAM.pos).map(v => +v.toFixed(2)), 焦距: CAM.focal },
    光照: { 预设: ENV.key, 太阳方位: ENV.az, 太阳高度: ENV.el, 强度: ENV.sunI },
    错误: window.__errs.slice(0, 8),
  };
};
window.__set = function (o) { Object.assign(APP, o); APP.acc.reset = true; return '已更新：' + Object.keys(o).join(', '); };
window.__cam = function (o) { Object.assign(CAM, o); APP.acc.reset = true; return '已更新相机'; };

running = true;
boot();

</script>
