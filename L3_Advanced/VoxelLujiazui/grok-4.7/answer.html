<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>陆家嘴体素沙盘 · Voxel Lujiazui</title>
<style>
  :root {
    --ink: #e8e2d6;
    --muted: #b4ab9c;
    --gold: #d7b56a;
    --panel: rgba(8, 12, 16, 0.72);
    --line: rgba(215, 181, 106, 0.38);
  }
  html, body { margin: 0; height: 100%; background: #07090c; overflow: hidden; }
  #c { display: block; width: 100vw; height: 100vh; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,.34) 100%);
  }
  .panel {
    position: fixed; z-index: 2; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; backdrop-filter: blur(10px);
    box-shadow: 0 10px 40px rgba(0,0,0,.28);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #title {
    top: 16px; left: 16px; padding: 12px 16px 11px; min-width: 240px;
  }
  #title h1 {
    margin: 0; font-size: 18px; font-weight: 620; letter-spacing: .18em;
  }
  #title .sub {
    margin-top: 3px; color: var(--gold); font-size: 11px; letter-spacing: .22em;
  }
  #title .legend {
    margin-top: 8px; color: var(--muted); font-size: 12px; line-height: 1.55;
  }
  #status {
    top: 16px; right: 16px; padding: 10px 14px; text-align: right; min-width: 160px;
  }
  #status .zone { font-size: 16px; letter-spacing: .08em; }
  #status .time { color: var(--gold); font-size: 12px; margin-top: 3px; letter-spacing: .12em; }
  #status .fps { color: var(--muted); font-size: 11px; margin-top: 2px; }
  #dock {
    left: 16px; right: 196px; bottom: 16px; padding: 10px 12px 12px;
  }
  #dock .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #dock .row + .row { margin-top: 7px; }
  button, .tag {
    font-family: inherit; font-size: 12px; color: var(--ink);
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.12);
    border-radius: 999px; padding: 5px 10px; cursor: pointer; letter-spacing: .04em;
  }
  button:hover { border-color: var(--gold); color: white; }
  button.on { background: rgba(215,181,106,.18); border-color: var(--gold); color: #ffe7b0; }
  #dock .help { color: var(--muted); font-size: 12px; line-height: 1.45; }
  input[type="range"] {
    width: 160px; accent-color: #d7b56a; vertical-align: middle;
  }
  label.chk { color: var(--muted); font-size: 12px; display: inline-flex; gap: 6px; align-items: center; }
  #mapwrap {
    position: fixed; z-index: 2; right: 16px; bottom: 16px; width: 168px;
  }
  #mapwrap .cap {
    color: var(--muted); font-size: 10px; letter-spacing: .16em; text-align: right;
    margin-bottom: 4px; font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  #map {
    width: 168px; height: 140px; image-rendering: pixelated;
    border-radius: 10px; border: 1px solid var(--line); background: #071018;
    cursor: crosshair; display: block;
  }
  #cross {
    position: fixed; left: 50%; top: 50%; width: 10px; height: 10px; z-index: 2;
    transform: translate(-50%, -50%); pointer-events: none; display: none;
  }
  #cross::before, #cross::after {
    content: ""; position: absolute; background: rgba(255,255,255,.85);
  }
  #cross::before { left: 4px; top: 0; width: 1px; height: 10px; }
  #cross::after { left: 0; top: 4px; width: 10px; height: 1px; }
  #load {
    position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
    background: #07090c; color: var(--ink);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #load .box { text-align: center; }
  #load h2 { font-weight: 500; letter-spacing: .28em; font-size: 18px; margin: 0 0 8px; }
  #load p { color: var(--gold); letter-spacing: .12em; font-size: 13px; margin: 0; }
  #err {
    display: none; position: fixed; inset: 40px; z-index: 6; color: #ffd0c8;
    font-family: ui-monospace, Consolas, monospace; white-space: pre-wrap;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="cross"></div>
<div class="panel" id="title">
  <h1>陆家嘴体素沙盘</h1>
  <div class="sub">VOXEL LUJIAZUI</div>
  <div class="legend">上海中心 632m · 环球金融中心 492m<br>东方明珠 468m · 金茂大厦 420m</div>
</div>
<div class="panel" id="status">
  <div class="zone" id="zone">外滩</div>
  <div class="time" id="timelabel">黄昏</div>
  <div class="fps" id="fps">—</div>
</div>
<div class="panel" id="dock">
  <div class="row">
    <button id="btn-god" class="on">上帝视角</button>
    <button id="btn-fps">步行漫游</button>
    <button data-tod="0.28">黎明</button>
    <button data-tod="0.50">正午</button>
    <button data-tod="0.725" class="on" id="btn-dusk">黄昏</button>

  </div>
  <div class="row">
    <button data-cam="classic">外滩经典</button>

    <button data-cam="river">江心平视</button>
    <button data-tp="bund">外滩步道</button>
    <button data-tp="pudong">陆家嘴滨江</button>
    <button data-tp="park">中心绿地</button>
    <button data-tp="ave">世纪大道</button>
    <button data-tp="bridge">南浦桥面</button>
  </div>
  <div class="row help" id="help">
    上帝视角：拖拽旋转 · 滚轮缩放 · 右键平移 · 点击小地图聚焦。
    步行：点击画面锁定鼠标，WASD 移动，鼠标环顾，空格跳跃，Shift 加速。
    V 切换视角 · N 黄昏/夜景 · H 收起说明 · F 全屏。北在小地图上方。

</div>
<div id="mapwrap">
  <div class="cap">N · 小地图</div>

</div>
<div id="load"><div class="box"><h2>陆家嘴</h2><p id="loadmsg">正在堆砌体素…</p></div></div>
<div id="err"></div>
<pre id="audit" style="display:none"></pre>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
'use strict';
window.__LOGS = [];
['error','warn'].forEach((k) => {
  const orig = console[k].bind(console);
  console[k] = function () {
    try { window.__LOGS.push(k + ': ' + Array.from(arguments).map(a => (a && a.message) || String(a)).join(' ').slice(0, 500)); } catch (e) {}
    orig.apply(console, arguments);
  };
});
if (!window.THREE || !THREE.OrbitControls) {
  document.getElementById('err').style.display = 'block';
  document.getElementById('err').textContent = 'Three.js 未能从 CDN 加载。请联网后重新打开本页。';
  throw new Error('THREE missing');
}

const VOX = 2;
const NX = 580;
const NZ = 460;
const WATER_Y = -4.0;
const UP = new THREE.Vector3(0, 1, 0);

const M = {
  CONC: 1, GLASS: 2, METAL: 3, GOLD: 4, ROAD: 5, WALK: 6, GRASS: 7, LEAF: 8,
  TRUNK: 9, STONE: 10, PINK: 11, STEEL: 12, PLAZA: 13, ROOF: 14, LAMP: 15,
  BEACON: 16, BRICK: 17, COPPER: 18, DARK: 19, WHITE: 20
};
const T = { WATER: 0, LOT: 1, ROAD: 2, WALK: 3, GRASS: 4, PLAZA: 5, MEDIAN: 6, BUND: 7, BLD: 8 };

const PAL = [];
function pal(id, hex) { PAL[id] = new THREE.Color(hex); }
pal(M.CONC, 0xb3ad9f); pal(M.GLASS, 0x6e93a6); pal(M.METAL, 0xa9b6c2);
pal(M.GOLD, 0xc6a15d); pal(M.ROAD, 0x3a4048); pal(M.WALK, 0xcbbba6);
pal(M.GRASS, 0x6d8d56); pal(M.LEAF, 0x3f6b46); pal(M.TRUNK, 0x6b5140);
pal(M.STONE, 0xd5c6af); pal(M.PINK, 0xd47f9c); pal(M.STEEL, 0x9aa8b4);
pal(M.PLAZA, 0xd9d2c6); pal(M.ROOF, 0x8e887c); pal(M.LAMP, 0xffe1a8);
pal(M.BEACON, 0xff3030); pal(M.BRICK, 0x8d463e); pal(M.COPPER, 0x6e8f78);
pal(M.DARK, 0x2a3038); pal(M.WHITE, 0xf4f1ea);

const TER = new Uint8Array(NX * NZ);
const LOCK = new Uint8Array(NX * NZ);
const SOLID = new Uint8Array(NX * NZ);
const DECK = new Float32Array(NX * NZ);

const U = {
  uNight: { value: 0 },
  uTime: { value: 0 },
  uVoxel: { value: VOX },
  uSunDir: { value: new THREE.Vector3(0.4, 0.8, 0.3) }
};

const META = {
  focus: new THREE.Vector3(),
  landmarks: {},
  spawn: {},
  paths: [],
  boats: [],
  lamps: [],
  beacons: [],
  tris: 0,
  boxes: 0,
  holeVoids: 0,
  heights: {}
};

function hash2(x, z) {
  let n = Math.imul(x | 0, 374761393) + Math.imul(z | 0, 668265263);
  n = (n ^ (n >>> 13)) >>> 0;
  n = Math.imul(n, 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
function smoothstep(a, b, x) {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}
function inB(x, z) { return x >= 0 && z >= 0 && x < NX && z < NZ; }
function I(x, z) { return z * NX + x; }
function lerp(a, b, t) { return a + (b - a) * t; }

function eastBank(z) {
  const t = z / (NZ - 1);
  const tip = Math.exp(-Math.pow((t - 0.40) / 0.20, 2));
  const wave = Math.sin(t * 3.4) * 6 + Math.sin(t * 9.0) * 1.6;
  return 338 - 78 * tip + wave;
}
function riverW(z) {
  const t = z / (NZ - 1);
  return 158 + 16 * Math.sin(t * 2.2 + 0.3);
}
function westBank(z) { return eastBank(z) - riverW(z); }

function paint(x, z, type, mode) {
  x = x | 0; z = z | 0;
  if (x < 1 || z < 1 || x >= NX - 1 || z >= NZ - 1) return;
  const i = I(x, z);
  if (TER[i] === T.WATER && type !== T.WATER) return;
  if (mode !== 2 && LOCK[i]) return;
  TER[i] = type;
  if (mode >= 1) LOCK[i] = 1;
}
function stampDisk(cx, cz, r, type, mode) {
  const R = Math.ceil(r);
  for (let dz = -R; dz <= R; dz++) {
    for (let dx = -R; dx <= R; dx++) {
      if (dx * dx + dz * dz <= r * r) paint((cx + dx) | 0, (cz + dz) | 0, type, mode);
    }
  }
}
function stampLine(x0, z0, x1, z1, half, type, mode) {
  const len = Math.hypot(x1 - x0, z1 - z0) || 1;
  const steps = Math.ceil(len * 1.4);
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    stampDisk(x0 + (x1 - x0) * t, z0 + (z1 - z0) * t, half, type, mode);
  }
}

const _col = new THREE.Color();
class BoxBuf {
  constructor() {
    this.pos = []; this.nor = []; this.col = []; this.mat = []; this.boxes = 0;
  }
  add(x, y, z, sx, sy, sz, mat, color) {
    if (sx <= 0 || sy <= 0 || sz <= 0) return;
    this.boxes++;
    const x0 = x * VOX, y0 = y * VOX, z0 = z * VOX;
    const x1 = (x + sx) * VOX, y1 = (y + sy) * VOX, z1 = (z + sz) * VOX;
    _col.copy(color || PAL[mat] || PAL[M.CONC]);
    const shade = 0.92 + 0.08 * hash2(Math.floor(x + sx * 3), Math.floor(z + sz * 5));
    _col.multiplyScalar(shade);
    const r = _col.r, g = _col.g, b = _col.b;
    const faces = [
      [x0,y1,z0, x0,y1,z1, x1,y1,z1, x1,y1,z0, 0,1,0],
      [x0,y0,z0, x1,y0,z0, x1,y0,z1, x0,y0,z1, 0,-1,0],
      [x1,y0,z0, x1,y1,z0, x1,y1,z1, x1,y0,z1, 1,0,0],
      [x0,y0,z1, x0,y1,z1, x0,y1,z0, x0,y0,z0, -1,0,0],
      [x0,y0,z1, x1,y0,z1, x1,y1,z1, x0,y1,z1, 0,0,1],
      [x1,y0,z0, x0,y0,z0, x0,y1,z0, x1,y1,z0, 0,0,-1]
    ];
    for (let f = 0; f < 6; f++) {
      const F = faces[f];
      const quad = [
        [F[0],F[1],F[2]], [F[3],F[4],F[5]], [F[6],F[7],F[8]], [F[9],F[10],F[11]]
      ];
      const nx = F[12], ny = F[13], nz = F[14];
      const order = [0,1,2, 0,2,3];
      for (let k = 0; k < 6; k++) {
        const v = quad[order[k]];
        this.pos.push(v[0], v[1], v[2]);
        this.nor.push(nx, ny, nz);
        this.col.push(r, g, b);
        this.mat.push(mat);
      }
    }
  }
  geometry() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(this.nor, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(this.col, 3));
    g.setAttribute('aMat', new THREE.Float32BufferAttribute(this.mat, 1));
    g.computeBoundingSphere();
    g.computeBoundingBox();
    return g;
  }
}

class VoxGrid {
  constructor(sx, sy, sz) {
    this.sx = sx; this.sy = sy; this.sz = sz;
    this.g = new Uint8Array(sx * sy * sz);
  }
  set(x, y, z, m) {
    if (x < 0 || y < 0 || z < 0 || x >= this.sx || y >= this.sy || z >= this.sz || !m) return;
    this.g[x + this.sx * (z + this.sz * y)] = m;
  }
  emit(buf, ox, oy, oz) {
    const { sx, sy, sz, g } = this;
    const vis = new Uint8Array(g.length);
    for (let y = 0; y < sy; y++) {
      for (let z = 0; z < sz; z++) {
        for (let x = 0; x < sx; x++) {
          const i0 = x + sx * (z + sz * y);
          if (!g[i0] || vis[i0]) continue;
          const m = g[i0];
          let w = 1;
          while (x + w < sx) {
            const j = (x + w) + sx * (z + sz * y);
            if (g[j] !== m || vis[j]) break;
            w++;
          }
          let d = 1;
          extD: while (z + d < sz) {
            for (let k = 0; k < w; k++) {
              const j = (x + k) + sx * ((z + d) + sz * y);
              if (g[j] !== m || vis[j]) break extD;
            }
            d++;
          }
          let h = 1;
          extH: while (y + h < sy) {
            for (let dz = 0; dz < d; dz++) {
              for (let k = 0; k < w; k++) {
                const j = (x + k) + sx * ((z + dz) + sz * (y + h));
                if (g[j] !== m || vis[j]) break extH;
              }
            }
            h++;
          }
          for (let yy = 0; yy < h; yy++)
            for (let zz = 0; zz < d; zz++)
              for (let xx = 0; xx < w; xx++)
                vis[(x + xx) + sx * ((z + zz) + sz * (y + yy))] = 1;
          buf.add(ox + x, oy + y, oz + z, w, h, d, m, PAL[m]);
        }
      }
    }
  }
}

function occupyRect(x, z, w, d) {
  for (let zz = 0; zz < d; zz++) {
    for (let xx = 0; xx < w; xx++) {
      const X = x + xx, Z = z + zz;
      if (!inB(X, Z)) continue;
      const i = I(X, Z);
      SOLID[i] = 1;
      TER[i] = T.BLD;
      LOCK[i] = 1;
    }
  }
}

function inRoundTri(lx, lz, rad, twist) {
  if (rad <= 0.4) return false;
  const c = Math.cos(-twist), s = Math.sin(-twist);
  const x = lx * c - lz * s;
  const z = lx * s + lz * c;
  const ang = Math.atan2(z, x);
  const lobe = 0.64 + 0.36 * (0.5 + 0.5 * Math.cos(ang * 3));
  const rr = rad * lobe;
  return x * x + z * z <= rr * rr;
}
function inOct(lx, lz, r) {
  const ax = Math.abs(lx), az = Math.abs(lz);
  return ax <= r && az <= r && (ax + az) <= r * 1.46;
}

const city = new BoxBuf();

function buildBase() {
  for (let z = 0; z < NZ; z++) {
    const eb = eastBank(z);
    const wb = westBank(z);
    const pudong = Math.ceil(eb);
    const puxi = Math.floor(wb);
    for (let x = 0; x < NX; x++) {
      const i = I(x, z);
      if (x < pudong && x > puxi) { TER[i] = T.WATER; continue; }
      if (x >= pudong && x < NX - 2) {
        if (x < pudong + 5) { TER[i] = T.WALK; LOCK[i] = 1; }
        else if (x < pudong + 7) { TER[i] = T.GRASS; LOCK[i] = 1; }
        else if (x < pudong + 13) { TER[i] = T.ROAD; }
        else TER[i] = T.LOT;
        continue;
      }
      if (x <= puxi && x > puxi - 64 && x > 2) {
        if (x > puxi - 6) { TER[i] = T.WALK; LOCK[i] = 1; }
        else if (x > puxi - 11) { TER[i] = T.ROAD; }
        else if (x > puxi - 30) { TER[i] = T.BUND; LOCK[i] = 1; }
        else TER[i] = T.LOT;
        continue;
      }
      TER[i] = T.WATER;
    }
  }
  // 苏州河汇入黄浦，外白渡桥位置留一条可走的桥面
  const cz = 28;
  for (let z = cz - 4; z <= cz + 4; z++) {
    const wb = Math.floor(westBank(z));
    for (let x = 2; x < wb; x++) {
      const i = I(x, z);
      TER[i] = T.WATER; LOCK[i] = 0; SOLID[i] = 0; DECK[i] = 0;
    }
  }
  for (let z = cz - 1; z <= cz + 1; z++) {
    const wb = Math.floor(westBank(z));
    for (let x = 2; x < wb - 1; x++) {
      paint(x, z, T.WALK, 2);
      DECK[I(x, z)] = 0;
    }
  }
}

let PARK, PEARL, JM, SW, ST, SITES;

function layoutSites() {
  const tipZ = Math.round(0.40 * (NZ - 1));
  const ex = Math.round(eastBank(tipZ));
  PEARL = { x: ex + 30, z: tipZ - 18, name: '东方明珠' };
  PARK = { x: ex + 92, z: tipZ + 36, rx: 58, rz: 44 };
  // 三件套沿江面展开：金茂在北、环球靠前露出开孔、上海中心略偏东居后
  JM = { x: PARK.x + PARK.rx + 26, z: PARK.z - 16, name: '金茂大厦' };
  SW = { x: JM.x + 4, z: JM.z + 50, name: '环球金融中心' };
  ST = { x: JM.x + 34, z: JM.z + 24, name: '上海中心' };
  // 若落入江中则向东推
  for (const p of [PEARL, JM, SW, ST]) {
    const shore = Math.ceil(eastBank(p.z)) + 18;
    if (p.x < shore) p.x = shore;
  }
  SITES = [
    { p: ST, clear: 26 }, { p: SW, clear: 22 }, { p: JM, clear: 22 }, { p: PEARL, clear: 24 }
  ];
  META.focus.set(ST.x * VOX, 160, ST.z * VOX);
  META.landmarks = { st: ST, sw: SW, jm: JM, pearl: PEARL, park: PARK };
}

function inPark(x, z) {
  const dx = (x - PARK.x) / PARK.rx;
  const dz = (z - PARK.z) / PARK.rz;
  return dx * dx + dz * dz <= 1;
}
function nearSite(x, z, pad) {
  for (const s of SITES) {
    const dx = x - s.p.x, dz = z - s.p.z;
    if (dx * dx + dz * dz < (s.clear + (pad || 0)) * (s.clear + (pad || 0))) return true;
  }
  return false;
}

function buildDistrictMasks() {
  for (let z = 2; z < NZ - 2; z++) {
    for (let x = 2; x < NX - 2; x++) {
      if (!inPark(x, z)) continue;
      paint(x, z, T.GRASS, 1);
    }
  }
  stampLine(PARK.x - PARK.rx + 6, PARK.z, PARK.x + PARK.rx - 6, PARK.z, 2.2, T.WALK, 2);
  stampLine(PARK.x, PARK.z - PARK.rz + 6, PARK.x, PARK.z + PARK.rz - 6, 2.2, T.WALK, 2);
  const ringA = Math.PI * 2;
  for (let a = 0; a < ringA; a += 0.04) {
    const x = PARK.x + Math.cos(a) * (PARK.rx - 8);
    const z = PARK.z + Math.sin(a) * (PARK.rz - 7);
    stampDisk(x, z, 1.6, T.WALK, 2);
  }

  // 正交街网
  const GAP = 24;
  for (let z = 4; z < NZ - 4; z++) {
    for (let x = 4; x < NX - 4; x++) {
      if ((x % GAP) <= 3 || (z % GAP) <= 3) paint(x, z, T.ROAD, 0);
    }
  }
  // 环路包住绿地与三件套
  const rcx = (PARK.x + ST.x) * 0.5 + 6;
  const rcz = (PARK.z + ST.z) * 0.5;
  const rrx = Math.abs(ST.x - PARK.x) * 0.55 + PARK.rx + 18;
  const rrz = Math.abs(ST.z - PARK.z) * 0.55 + PARK.rz + 16;
  META.ring = { rcx, rcz, rrx, rrz };
  for (let a = 0; a < Math.PI * 2; a += 0.012) {
    const x = rcx + Math.cos(a) * rrx;
    const z = rcz + Math.sin(a) * rrz;
    stampDisk(x, z, 3.2, T.ROAD, 0);
  }
  // 世纪大道：自绿地南缘向东南
  const ax = PARK.x + 8, az = PARK.z + PARK.rz + 8;
  const bx = NX - 30, bz = NZ - 26;
  META.ave = { ax, az, bx, bz };
  stampLine(ax, az, bx, bz, 16, T.WALK, 0);
  stampLine(ax, az, bx, bz, 13, T.ROAD, 1);
  stampLine(ax, az, bx, bz, 2.1, T.MEDIAN, 2);
  // 明珠到江岸的步行通廊
  const shore = Math.ceil(eastBank(PEARL.z)) + 6;
  stampLine(shore, PEARL.z, PEARL.x - 8, PEARL.z, 7, T.PLAZA, 1);
}

function fillSphere(g, cx, cy, cz, r, mat, shell) {
  const R = Math.ceil(r);
  const r2 = r * r;
  const i2 = shell ? (r - 1.35) * (r - 1.35) : -1;
  for (let y = -R; y <= R; y++) {
    for (let z = -R; z <= R; z++) {
      for (let x = -R; x <= R; x++) {
        const d = x * x + y * y + z * z;
        if (d <= r2 && d >= i2) g.set(cx + x, cy + y, cz + z, mat);
      }
    }
  }
}

function buildShanghaiTower() {
  const H = 298;
  const TOP = 316;
  const R = 20;
  const sx = 64, sz = 64, sy = TOP + 4;
  const g = new VoxGrid(sx, sy, sz);
  const cx = 32, cz = 32;
  for (let y = 0; y < H; y++) {
    const step = (y / 3 | 0);
    const t = step * 3 / H;
    const twist = t * (120 * Math.PI / 180);
    const rad = R * (1 - 0.58 * Math.pow(t, 1.12));
    const recess = (y % 15 === 14);
    const outer = recess ? rad - 2.4 : rad;
    for (let z = 1; z < sz - 1; z++) {
      for (let x = 1; x < sx - 1; x++) {
        const lx = x - cx, lz = z - cz;
        if (y < 8) {
          if (Math.abs(lx) <= 26 && Math.abs(lz) <= 26) {
            const rim = Math.abs(lx) > 23 || Math.abs(lz) > 23;
            if (rim || y < 2 || y === 7) g.set(x, y, z, y < 2 ? M.STONE : M.GLASS);
          }
          continue;
        }
        if (!inRoundTri(lx, lz, outer, twist)) continue;
        const innerCut = inRoundTri(lx, lz, outer - 1.45, twist);
        if (!innerCut || recess) g.set(x, y, z, M.GLASS);
      }
    }
  }
  for (let y = H; y < TOP; y++) {
    const r = Math.max(0.8, 3.2 - (y - H) * 0.16);
    for (let z = -3; z <= 3; z++) for (let x = -3; x <= 3; x++) {
      if (x * x + z * z <= r * r) g.set(cx + x, y, cz + z, M.METAL);
    }
  }
  g.set(cx, TOP - 1, cz, M.BEACON);
  const ox = ST.x - cx, oz = ST.z - cz;
  g.emit(city, ox, 0, oz);
  occupyRect(ST.x - 22, ST.z - 22, 44, 44);
  META.heights.st = TOP * VOX;
  META.beacons.push(new THREE.Vector3(ST.x * VOX, TOP * VOX, ST.z * VOX));
  META.landmarks.st.h = META.heights.st;
}

function buildSWFC() {
  const H = 246;
  const g = new VoxGrid(48, H + 4, 48);
  const cx = 24, cz = 24;
  const hole0 = Math.floor(H * 0.68);
  const hole1 = Math.floor(H * 0.90);
  let voids = 0;
  for (let y = 0; y < H; y++) {
    const t = y / (H - 1);
    const hx = lerp(16, 9.2, t);
    const hz = lerp(16, 10.5, t);
    for (let z = 0; z < 48; z++) {
      for (let x = 0; x < 48; x++) {
        const lx = x - cx, lz = z - cz;
        if (Math.abs(lx) > hx || Math.abs(lz) > hz) continue;
        let hole = false;
        let hzHole = 0;
        if (y >= hole0 && y <= hole1) {
          const u = (y - hole0) / Math.max(1, hole1 - hole0);
          hzHole = Math.min(hz - 2.4, lerp(5.2, 9.2, Math.pow(u, 0.8)));
          if (Math.abs(lz) < hzHole) hole = true;
        }
        if (hole) { voids++; continue; }
        const frame = y >= hole0 && y <= hole1 && Math.abs(lz) < hzHole + 1.6;
        if (frame) { g.set(x, y, z, M.DARK); continue; }
        const shell = Math.abs(lx) > hx - 1.35 || Math.abs(lz) > hz - 1.35 || y < 3 || y > H - 3;
        if (shell) g.set(x, y, z, M.METAL);
      }
    }
  }
  // 顶部收成开瓶口的斜面框
  for (let y = H; y < H + 2; y++) {
    for (let z = -8; z <= 8; z++) for (let x = -7; x <= 7; x++) {
      if (Math.abs(z) > 6 && Math.abs(x) < 6) g.set(cx + x, y, cz + z, M.STEEL);
    }
  }
  g.set(cx, H + 2, cz, M.BEACON);
  META.holeVoids = voids;
  g.emit(city, SW.x - cx, 0, SW.z - cz);
  occupyRect(SW.x - 18, SW.z - 18, 36, 36);
  META.heights.sw = H * VOX;
  META.beacons.push(new THREE.Vector3(SW.x * VOX, (H + 2) * VOX, SW.z * VOX));
}

function buildJinMao() {
  const H = 210;
  const g = new VoxGrid(46, H + 2, 46);
  const cx = 23, cz = 23;
  let y = 0;
  let r = 15;
  let band = 16;
  while (y < 176) {
    const y1 = Math.min(176, y + band);
    for (let yy = y; yy < y1; yy++) {
      for (let z = 0; z < 46; z++) for (let x = 0; x < 46; x++) {
        const lx = x - cx, lz = z - cz;
        if (!inOct(lx, lz, r)) continue;
        const inner = inOct(lx, lz, r - 1.3);
        const fin = (Math.abs(Math.abs(lx) - Math.abs(lz)) < 1.2) && (Math.abs(lx) + Math.abs(lz) > r - 2.2);
        if (!inner || yy === y || fin) g.set(x, yy, z, fin ? M.METAL : M.GOLD);
      }
    }
    // 角部壁柱
    if (r > 6) {
      const corners = [[r, r], [r, -r], [-r, r], [-r, -r]];
      for (const c of corners) {
        for (let yy = y; yy < y1; yy++) g.set(cx + Math.round(c[0] * 0.72), yy, cz + Math.round(c[1] * 0.72), M.METAL);
      }
    }
    y = y1;
    r = Math.max(2.2, r - 1);
    band = Math.max(4, band - 1);
  }
  for (let yy = 176; yy < H; yy++) {
    const r2 = Math.max(0.6, 2.4 - (yy - 176) * 0.05);
    for (let z = -3; z <= 3; z++) for (let x = -3; x <= 3; x++) {
      if (x * x + z * z <= r2 * r2) g.set(cx + x, yy, cz + z, M.METAL);
    }
  }
  g.set(cx, H - 1, cz, M.BEACON);
  g.emit(city, JM.x - cx, 0, JM.z - cz);
  occupyRect(JM.x - 18, JM.z - 18, 36, 36);
  META.heights.jm = H * VOX;
  META.beacons.push(new THREE.Vector3(JM.x * VOX, H * VOX, JM.z * VOX));
}

function buildPearl() {
  const H = 234;
  const g = new VoxGrid(64, H + 2, 64);
  const cx = 32, cz = 32;
  const legs = 3;
  for (let y = 0; y < 168; y++) {
    const t = y / 168;
    const spread = lerp(16, 2.4, Math.pow(t, 0.9));
    const rad = y < 80 ? 3.3 : 2.5;
    for (let k = 0; k < legs; k++) {
      const a = -Math.PI / 2 + k * Math.PI * 2 / 3;
      const px = Math.round(Math.cos(a) * spread);
      const pz = Math.round(Math.sin(a) * spread);
      for (let dz = -3; dz <= 3; dz++) for (let dx = -3; dx <= 3; dx++) {
        if (dx * dx + dz * dz <= rad * rad) g.set(cx + px + dx, y, cz + pz + dz, M.STEEL);
      }
    }
  }
  for (let y = 8; y < H; y++) {
    const r = y > 188 ? 1.5 : 2.8;
    for (let z = -4; z <= 4; z++) for (let x = -4; x <= 4; x++) {
      if (x * x + z * z <= r * r) g.set(cx + x, y, cz + z, M.STEEL);
    }
  }
  fillSphere(g, cx, 52, cz, 14, M.PINK, false);
  fillSphere(g, cx, 52, cz, 6, M.GLASS, true);
  // 赤道观察环
  for (let a = 0; a < Math.PI * 2; a += 0.18) {
    const x = cx + Math.round(Math.cos(a) * 13);
    const z = cz + Math.round(Math.sin(a) * 13);
    g.set(x, 52, z, M.WHITE);
    g.set(x, 58, z, M.WHITE);
    g.set(x, 46, z, M.WHITE);
  }
  fillSphere(g, cx, 128, cz, 11.5, M.PINK, false);
  fillSphere(g, cx, 128, cz, 5, M.GLASS, true);
  for (let a = 0; a < Math.PI * 2; a += 0.25) {
    g.set(cx + Math.round(Math.cos(a) * 11), 128, cz + Math.round(Math.sin(a) * 11), M.WHITE);
  }
  fillSphere(g, cx, 176, cz, 5.5, M.PINK, false);
  for (let y = 182; y < H; y++) {
    const r = Math.max(0.6, 2.1 - (y - 182) * 0.03);
    for (let z = -2; z <= 2; z++) for (let x = -2; x <= 2; x++) {
      if (x * x + z * z <= r * r) g.set(cx + x, y, cz + z, M.STEEL);
    }
  }
  g.set(cx, H - 1, cz, M.BEACON);
  // 底座
  for (let y = 0; y < 4; y++) {
    for (let z = -18; z <= 18; z++) for (let x = -18; x <= 18; x++) {
      if (Math.abs(x) > 14 && Math.abs(z) > 14) continue;
      const rim = Math.abs(x) > 12 || Math.abs(z) > 12;
      if (rim || y === 0 || y === 3) g.set(cx + x, y, cz + z, M.CONC);
    }
  }
  g.emit(city, PEARL.x - cx, 0, PEARL.z - cz);
  occupyRect(PEARL.x - 20, PEARL.z - 20, 40, 40);
  META.heights.pearl = H * VOX;
  META.beacons.push(new THREE.Vector3(PEARL.x * VOX, H * VOX, PEARL.z * VOX));
}

function buildConvention() {
  const x = Math.ceil(eastBank(PEARL.z + 22)) + 14;

function addStyledTower(x, z, w, d, h, style, mat) {
  if (w < 3 || d < 3 || h < 2) return;
  const col = PAL[mat];
  if (style === 'podium' || h > 28) {
    const ph = Math.min(4, h);
    city.add(x, 0, z, w, ph, d, mat === M.GLASS ? M.STONE : M.CONC, PAL[M.STONE]);
    const iw = Math.max(3, w - 2 - (h > 40 ? 2 : 0));
    const id = Math.max(3, d - 2 - (h > 40 ? 2 : 0));
    const ox = x + ((w - iw) >> 1);
    const oz = z + ((d - id) >> 1);
    if (style === 'step' && h > 24) {
      const tiers = 4;
      let yy = ph;
      let tw = iw, td = id, tx = ox, tz = oz;
      const body = h - ph;
      for (let i = 0; i < tiers; i++) {
        const th = Math.max(2, Math.floor(body * (tiers - i) / (tiers * (tiers + 1) / 2)));
        city.add(tx, yy, tz, tw, th, td, mat, col);
        yy += th;
        if (tw > 3) { tx++; tw -= 2; }
        if (td > 3) { tz++; td -= 2; }
      }
      city.add(tx, yy, tz, Math.max(1, tw), 2, Math.max(1, td), M.ROOF, PAL[M.ROOF]);
    } else if (style === 'slant') {
      city.add(ox, ph, oz, iw, h - ph - 4, id, mat, col);
      let yy = h - 4;
      for (let s = 0; s < 4; s++) {
        city.add(ox, yy, oz + s, iw, 1, id - s, mat, col);
        yy++;
      }
    } else if (style === 'crown') {
      city.add(ox, ph, oz, iw, h - ph - 6, id, mat, col);
      const top = h - 6;
      city.add(ox, top, oz, iw, 1, id, M.ROOF, PAL[M.ROOF]);
      city.add(ox, top, oz, 1, 6, 1, M.STEEL, PAL[M.STEEL]);
      city.add(ox + iw - 1, top, oz, 1, 6, 1, M.STEEL, PAL[M.STEEL]);
      city.add(ox, top, oz + id - 1, 1, 6, 1, M.STEEL, PAL[M.STEEL]);
      city.add(ox + iw - 1, top, oz + id - 1, 1, 6, 1, M.STEEL, PAL[M.STEEL]);
      city.add(ox, top + 5, oz, iw, 1, id, M.STEEL, PAL[M.STEEL]);
    } else {
      city.add(ox, ph, oz, iw, h - ph, id, mat, col);
      if (hash2(x, z) > 0.45) {
        const mw = Math.max(2, iw >> 1), md = Math.max(2, id >> 1);
        city.add(ox + 1, h, oz + 1, mw, 2, md, M.ROOF, PAL[M.DARK]);
      }
    }
  } else {
    city.add(x, 0, z, w, h, d, mat, col);
    if (h > 8 && hash2(x + 3, z) > 0.5) {
      city.add(x + 1, h, z + 1, Math.max(1, w >> 1), 2, Math.max(1, d >> 1), M.ROOF, PAL[M.DARK]);
    }
  }
  occupyRect(x, z, w, d);
}

function buildSecondary() {
  const specs = [
    { x: ST.x - 50, z: ST.z + 40, w: 12, d: 14, h: 124, style: 'crown', mat: M.GLASS },
    { x: ST.x - 50, z: ST.z + 58, w: 12, d: 14, h: 132, style: 'crown', mat: M.GLASS },
    { x: SW.x + 34, z: SW.z + 18, w: 16, d: 14, h: 112, style: 'step', mat: M.GOLD },
    { x: JM.x + 36, z: JM.z - 34, w: 16, d: 14, h: 104, style: 'slant', mat: M.METAL },
    { x: JM.x - 42, z: JM.z + 26, w: 16, d: 14, h: 92, style: 'podium', mat: M.GLASS },
    { x: PARK.x + PARK.rx + 18, z: PARK.z + PARK.rz + 12, w: 18, d: 14, h: 80, style: 'podium', mat: M.GLASS },
    { x: ST.x + 42, z: ST.z - 36, w: 14, d: 12, h: 76, style: 'step', mat: M.CONC },
    { x: PEARL.x + 36, z: PEARL.z + 18, w: 20, d: 12, h: 14, style: 'box', mat: M.GLASS }
  ];
  const placed = [];
  for (const s of specs) {
    if (s.x < 8 || s.z < 8 || s.x + s.w >= NX - 2 || s.z + s.d >= NZ - 2) continue;
    let blocked = false;
    for (let zz = 0; zz < s.d && !blocked; zz++) for (let xx = 0; xx < s.w; xx++) {
      const X = s.x + xx, Z = s.z + zz;
      if (!inB(X, Z) || TER[I(X, Z)] === T.WATER || SOLID[I(X, Z)] || inPark(X, Z)) blocked = true;
    }
    if (blocked) continue;
    addStyledTower(s.x, s.z, s.w, s.d, s.h, s.style, s.mat);
    placed.push(s);
  }
  if (placed.length >= 2 && placed[0].x === placed[1].x) {
    const a = placed[0], b = placed[1];
    const z0 = Math.min(a.z + a.d, b.z);
    const z1 = Math.max(a.z, b.z);
    if (z1 > z0 && z1 - z0 < 16) city.add(a.x + 2, 36, z0, Math.max(4, a.w - 4), 2, z1 - z0, M.STEEL, PAL[M.STEEL]);
  }
}

function buildProcedural() {
  const used = new Uint8Array(NX * NZ);
  const coreX = (JM.x + SW.x + ST.x) / 3;
  const coreZ = (JM.z + SW.z + ST.z) / 3;
  for (let z = 3; z < NZ - 3; z++) {
    for (let x = 3; x < NX - 3; x++) {
      const i = I(x, z);
      if (used[i] || TER[i] !== T.LOT) continue;
      let w = 1;
      while (w < 16 && x + w < NX - 2) {
        const j = I(x + w, z);
        if (TER[j] !== T.LOT || used[j]) break;
        w++;
      }
      let d = 1;
      grow: while (d < 18 && z + d < NZ - 2) {
        for (let k = 0; k < w; k++) {
          const j = I(x + k, z + d);
          if (TER[j] !== T.LOT || used[j]) break grow;
        }
        d++;
      }
      for (let zz = 0; zz < d; zz++) for (let xx = 0; xx < w; xx++) used[I(x + xx, z + zz)] = 1;
      if (w < 4 || d < 4) {
        for (let zz = 0; zz < d; zz++) for (let xx = 0; xx < w; xx++) {
          const j = I(x + xx, z + zz);
          if (TER[j] === T.LOT) TER[j] = T.PLAZA;
        }
        continue;
      }
      const cx = x + w * 0.5, cz = z + d * 0.5;
      if (nearSite(cx, cz, 2)) {
        for (let zz = 0; zz < d; zz++) for (let xx = 0; xx < w; xx++) {
          const j = I(x + xx, z + zz);
          if (TER[j] === T.LOT) TER[j] = T.PLAZA;
        }
        continue;
      }
      const puxi = cx < westBank(cz);
      const dist = Math.hypot(cx - coreX, cz - coreZ);
      const rnd = hash2(x * 3 + 1, z * 5 + 2);
      if (!puxi && rnd < 0.06) {
        for (let zz = 0; zz < d; zz++) for (let xx = 0; xx < w; xx++) TER[I(x + xx, z + zz)] = T.PLAZA;
        continue;
      }
      let hv;
      if (puxi) hv = 5 + (rnd * 8) | 0;
      else if (dist < 55) hv = 32 + (rnd * 38) | 0;
      else if (dist < 110) hv = 16 + (rnd * 26) | 0;
      else if (dist < 180) hv = 8 + (rnd * 16) | 0;
      else hv = 4 + (rnd * 9) | 0;
      const inset = w >= 8 && d >= 8 ? 1 : 0;
      const styleRoll = hash2(x, z + 9);
      let style = 'box';
      if (hv > 26 && styleRoll > 0.72) style = 'crown';
      else if (hv > 22 && styleRoll > 0.48) style = 'step';
      else if (hv > 14 && styleRoll > 0.28) style = 'slant';
      else style = 'podium';
      let mat = M.GLASS;
      const mr = hash2(x + 4, z + 1);
      if (puxi) mat = mr > 0.55 ? M.BRICK : M.STONE;
      else if (mr > 0.78) mat = M.GOLD;
      else if (mr > 0.55) mat = M.CONC;
      else if (mr > 0.38) mat = M.METAL;
      addStyledTower(x + inset, z + inset, w - inset * 2, d - inset * 2, hv, puxi ? 'box' : style, mat);
    }
  }
}

function buildBund() {
  const focusZ = ST.z;
  const specials = [
    { z: focusZ - 8, w: 8, h: 28, kind: 'clock' },
    { z: focusZ + 6, w: 14, h: 16, kind: 'dome' },
    { z: focusZ + 24, w: 12, h: 20, kind: 'pyramid' },
    { z: focusZ - 28, w: 16, h: 14, kind: 'brick' }
  ];
  const taken = [];
  function blocked(z0, z1) {
    for (const t of taken) if (z1 > t[0] && z0 < t[1]) return true;
    return false;
  }
  for (const s of specials) {
    const wb = Math.floor(westBank(s.z));
    const depth = 12;
    const x = wb - 16 - depth;
    if (x < 4) continue;
    taken.push([s.z, s.z + s.w]);
    if (s.kind === 'clock') {
      city.add(x, 0, s.z, depth, 8, s.w, M.STONE, PAL[M.STONE]);
      city.add(x + 2, 8, s.z + 1, depth - 3, 16, s.w - 2, M.STONE, PAL[M.STONE]);
      city.add(x + 4, 24, s.z + 2, depth - 6, 6, s.w - 4, M.DARK, PAL[M.DARK]);
      addClock(x + depth, 14, s.z + (s.w >> 1));
    } else if (s.kind === 'dome') {
      city.add(x, 0, s.z, depth, 10, s.w, M.STONE, PAL[M.STONE]);
      addDome(x + (depth >> 1), 10, s.z + (s.w >> 1), 5, M.COPPER);
    } else if (s.kind === 'pyramid') {
      city.add(x, 0, s.z, depth, 12, s.w, M.STONE, PAL[M.STONE]);
      let yy = 12, tw = s.w, td = depth, ox = x, oz = s.z;
      for (let k = 0; k < 6; k++) {
        city.add(ox, yy, oz, td, 1, tw, M.COPPER, PAL[M.COPPER]);
        yy++;
        if (td > 2) { ox++; td -= 2; }
        if (tw > 2) { oz++; tw -= 2; }
      }
    } else {
      city.add(x, 0, s.z, depth, s.h, s.w, M.BRICK, PAL[M.BRICK]);
      city.add(x, s.h, s.z, depth, 1, s.w, M.COPPER, PAL[M.COPPER]);
    }
    // 底层内凹形成骑楼，朝向江面（+x）
    occupyRect(x, s.z, depth, s.w);
  }
  for (let z = 40; z < NZ - 36; ) {
    const width = 8 + (hash2(0, z) * 10) | 0;
    if (blocked(z, z + width)) { z += 2; continue; }
    const slope = Math.abs(westBank(z) - westBank(Math.min(NZ - 2, z + width)));
    if (slope > 10) { z += width; continue; }
    const wb = Math.floor(westBank(z + (width >> 1)));
    const depth = 10 + (hash2(z, 2) * 3) | 0;
    const x = wb - 16 - depth;
    if (x < 4) { z += width; continue; }
    let water = false;
    for (let k = 0; k < width && !water; k++) if (TER[I(Math.min(NX - 2, x + depth), z + k)] === T.WATER) water = true;
    if (water) { z += 4; continue; }
    const h = 8 + (hash2(z, 4) * 8) | 0;
    const mat = hash2(z, 8) > 0.7 ? M.BRICK : M.STONE;
    city.add(x + 1, 0, z, depth - 1, 2, width, mat, PAL[mat]);
    city.add(x, 2, z, depth, h - 2, width, mat, PAL[mat]);
    if (hash2(z, 6) > 0.6) city.add(x, h, z, depth, 1, width, M.COPPER, PAL[M.COPPER]);
    occupyRect(x, z, depth, width);
    taken.push([z, z + width]);
    z += width + 1;
  }
  // 外白渡桥：钢桁架低桥横跨苏州河
  const cz = 28;
  const wb = Math.floor(westBank(cz));
  for (let x = 4; x < wb - 2; x += 1) {
    city.add(x, 0, cz - 1, 1, 1, 3, M.STEEL, PAL[M.STEEL]);
    if (x % 4 === 0) {
      city.add(x, 1, cz - 1, 1, 3, 1, M.STEEL, PAL[M.STEEL]);
      city.add(x, 1, cz + 1, 1, 3, 1, M.STEEL, PAL[M.STEEL]);
      city.add(x, 3, cz - 1, 1, 1, 3, M.STEEL, PAL[M.STEEL]);
    }
    for (let z = cz - 1; z <= cz + 1; z++) {
      if (!inB(x, z)) continue;
      TER[I(x, z)] = T.BLD;
      SOLID[I(x, z)] = 0;
      DECK[I(x, z)] = 2;
    }
  }
}

function addClock(faceX, cy, cz) {
  const r = 3;
  for (let dy = -r; dy <= r; dy++) for (let dz = -r; dz <= r; dz++) {
    const d2 = dy * dy + dz * dz;
    if (d2 <= r * r && d2 >= (r - 1) * (r - 1)) city.add(faceX, cy + dy, cz + dz, 1, 1, 1, M.WHITE, PAL[M.WHITE]);
    else if (d2 <= 0.5) city.add(faceX, cy + dy, cz + dz, 1, 1, 1, M.DARK, PAL[M.DARK]);
  }
  city.add(faceX, cy, cz, 1, 2, 1, M.DARK, PAL[M.DARK]);
  city.add(faceX, cy, cz, 1, 1, 2, M.DARK, PAL[M.DARK]);
}
function addDome(cx, baseY, cz, r, mat) {
  const g = new VoxGrid(r * 2 + 3, r + 2, r * 2 + 3);
  const c = r + 1;
  for (let y = 0; y <= r; y++) for (let z = 0; z <= r * 2 + 2; z++) for (let x = 0; x <= r * 2 + 2; x++) {
    const dx = x - c, dy = y, dz = z - c;
    if (dx * dx + dy * dy + dz * dz <= r * r) g.set(x, y, z, mat);
  }
  g.emit(city, cx - c, baseY, cz - c);
}

function buildBridge() {
  const bz = Math.round(NZ * 0.78);
  const eb = Math.ceil(eastBank(bz));
  const wb = Math.floor(westBank(bz));
  const deck = 18;
  const x0 = wb - 6;
  const x1 = eb + 18;
  const half = 3;
  const rampLen = 42;
  META.bridge = { bz, deck, x0, x1, wb, eb, y: (deck + 1) * VOX };
  const minX = wb - 64;
  const maxX = x1 + rampLen + 6;
  const minZ = bz - 12;
  const maxZ = bz + 84;
  const ox = minX, oz = minZ;
  const g = new VoxGrid(maxX - minX + 4, deck + 36, maxZ - minZ + 4);
  function setB(x, y, z, m) { g.set(x - ox, y, z - oz, m); }
  function deckAt(x, z, y) {
    for (let dz = -half; dz <= half; dz++) {
      setB(x, y, z + dz, M.ROAD);
      if (Math.abs(dz) === half) setB(x, y + 1, z + dz, M.CONC);
      if (inB(x, z + dz)) DECK[I(x, z + dz)] = Math.max(DECK[I(x, z + dz)], (y + 1) * VOX);
    }
  }
  for (let x = x0; x <= x1; x++) deckAt(x, bz, deck);
  // 桥塔
  const pylons = [
    Math.round(wb + (eb - wb) * 0.30),
    Math.round(wb + (eb - wb) * 0.70)
  ];
  for (const px of pylons) {
    for (let y = 0; y < deck + 22; y++) {
      for (const dz of [-half - 1, half + 1]) {
        setB(px, y, bz + dz, M.CONC);
        setB(px + 1, y, bz + dz, M.CONC);
        if (inB(px, bz + dz)) SOLID[I(px, bz + dz)] = 1;
        if (inB(px + 1, bz + dz)) SOLID[I(px + 1, bz + dz)] = 1;
      }
      if (y === deck + 20) {
        for (let dz = -half; dz <= half; dz++) {
          setB(px, y, bz + dz, M.CONC);
          setB(px + 1, y, bz + dz, M.CONC);
        }
      }
    }
    // 斜拉索
    for (const side of [-1, 1]) {
      for (let k = 1; k <= 7; k++) {
        const xA = px, yA = deck + 20, zA = bz + side * (half + 1);
        const xB = px + side * (8 + k * 7), yB = deck + 1, zB = bz + side * half;
        const steps = Math.ceil(Math.hypot(xB - xA, yB - yA, zB - zA));
        for (let s = 0; s <= steps; s++) {
          const t = s / steps;
          setB(Math.round(lerp(xA, xB, t)), Math.round(lerp(yA, yB, t)), Math.round(lerp(zA, zB, t)), M.STEEL);
        }
      }
    }
  }
  // 浦东引桥
  for (let i = 0; i <= rampLen; i++) {
    const y = Math.max(0, Math.round(deck * (1 - i / rampLen)));
    const x = x1 + i;
    deckAt(x, bz, y);
  }
  // 浦西螺旋
  const scx = wb - 34, scz = bz + 30;
  const turns = 1.15;
  const steps = 150;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const a = t * turns * Math.PI * 2 - Math.PI / 2;
    const y = Math.round(t * deck);
    const rad = 14;
    const cxp = scx + Math.cos(a) * rad;
    const czp = scz + Math.sin(a) * rad;
    for (let w = -2; w <= 2; w++) {
      const x = Math.round(cxp + Math.cos(a) * w);
      const z = Math.round(czp + Math.sin(a) * w);
      setB(x, y, z, M.ROAD);
      if (Math.abs(w) === 2) setB(x, y + 1, z, M.CONC);
      if (inB(x, z)) DECK[I(x, z)] = Math.max(DECK[I(x, z)], (y + 1) * VOX);
    }
  }
  // 螺旋顶端接入桥面
  for (let x = scx; x <= x0; x++) {
    const t = (x - scx) / Math.max(1, x0 - scx);
    const y = Math.round(lerp(deck, deck, t));
    deckAt(x, bz, deck);
  }
  for (let z = bz; z <= scz; z++) {
    deckAt(scx, z, deck);
  }
  META.bridge.spiral = { x: scx, z: scz };
  g.emit(city, ox, 0, oz);
}

function emitTerrain() {
  const vis = new Uint8Array(NX * NZ);
  function matOf(t) {
    if (t === T.ROAD) return M.ROAD;
    if (t === T.WALK) return M.WALK;
    if (t === T.GRASS) return M.GRASS;
    if (t === T.MEDIAN) return M.GRASS;
    if (t === T.PLAZA) return M.PLAZA;
    if (t === T.BUND) return M.WALK;
    return M.PLAZA;
  }
  for (let z = 0; z < NZ; z++) {
    for (let x = 0; x < NX; x++) {
      const i = I(x, z);
      const t = TER[i];
      if (vis[i] || t === T.WATER || t === T.BLD || t === 0) continue;
      let w = 1;
      while (x + w < NX && TER[i + w] === t && !vis[i + w] && !SOLID[i + w]) w++;
      // SOLID cells already T.BLD, so just same type
      let d = 1;
      ext: while (z + d < NZ) {
        for (let k = 0; k < w; k++) {
          const j = I(x + k, z + d);
          if (TER[j] !== t || vis[j]) break ext;
        }
        d++;
      }
      for (let zz = 0; zz < d; zz++) for (let xx = 0; xx < w; xx++) vis[I(x + xx, z + zz)] = 1;
      const m = matOf(t);
      let col = PAL[m];
      if (t === T.GRASS || t === T.MEDIAN) col = hash2(x, z) > 0.5 ? PAL[M.GRASS] : new THREE.Color(0x5f7c4c);
      city.add(x, -4, z, w, 4, d, m, col);
    }
  }
}

function emitTreesAndLamps() {
  for (let z = 2; z < NZ - 2; z += 1) {
    for (let x = 2; x < NX - 2; x += 1) {
      const i = I(x, z);
      if (SOLID[i] || LOCK[i] && TER[i] === T.BUND) continue;
      const t = TER[i];
      if (t !== T.GRASS && t !== T.MEDIAN) continue;
      const hsh = hash2(x * 2, z * 3);
      if (t === T.MEDIAN) {
        if ((x + z) % 7 !== 0) continue;
      } else if (inPark(x, z)) {
        const dx = (x - PARK.x) / PARK.rx, dz = (z - PARK.z) / PARK.rz;
        if (dx * dx + dz * dz < 0.30) continue;
        if (hsh > 0.26) continue;
      } else if (hsh > 0.16) continue;
      addTree(x, z, 3 + (hsh * 3) | 0);
    }
  }
  // 滨江与外滩路灯
  for (let z = 6; z < NZ - 6; z += 8) {
    const eb = Math.ceil(eastBank(z));
    const wb = Math.floor(westBank(z));
    addLamp(eb + 2, z);
    addLamp(wb - 3, z);
  }
  // 世纪大道灯
  const { ax, az, bx, bz } = META.ave;
  const len = Math.hypot(bx - ax, bz - az);
  const n = Math.floor(len / 10);
  for (let i = 1; i < n; i += 1) {
    const t = i / n;
    const x = ax + (bx - ax) * t;
    const z = az + (bz - az) * t;
    const dx = (bx - ax) / len, dz = (bz - az) / len;
    addLamp(Math.round(x - dz * 12), Math.round(z + dx * 12));
    if (i % 2 === 0) addLamp(Math.round(x + dz * 12), Math.round(z - dx * 12));
  }
}
function addTree(x, z, h) {
  const leaf = hash2(x, z) > 0.5 ? PAL[M.LEAF] : new THREE.Color(0x4d7a52);
  const leaf2 = new THREE.Color(0x2f5538);
  city.add(x, 0, z, 1, h, 1, M.TRUNK, PAL[M.TRUNK]);
  city.add(x - 1, h - 1, z - 1, 3, 2, 3, M.LEAF, leaf);
  city.add(x - 1, h + 1, z, 3, 1, 1, M.LEAF, leaf2);
  city.add(x, h + 1, z - 1, 1, 1, 3, M.LEAF, leaf);
  city.add(x, h + 2, z, 1, 1, 1, M.LEAF, leaf2);
}
function addLamp(x, z) {
  if (!inB(x, z) || SOLID[I(x, z)] || TER[I(x, z)] === T.WATER) return;
  const deck = DECK[I(x, z)];
  const y = deck > 1 ? deck / VOX : 0;
  city.add(x, y, z, 1, 4, 1, M.DARK, PAL[M.DARK]);
  city.add(x, y + 4, z, 1, 1, 1, M.LAMP, PAL[M.LAMP]);
  META.lamps.push(new THREE.Vector3((x + 0.5) * VOX, (y + 4.2) * VOX, (z + 0.5) * VOX));
}

function buildCarPaths() {
  function pushLine(x0, z0, x1, z1, y) {
    const len = Math.hypot(x1 - x0, z1 - z0);
    const n = Math.max(2, Math.ceil(len / 4));
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      pts.push(new THREE.Vector3(
        (x0 + (x1 - x0) * t) * VOX,
        y,
        (z0 + (z1 - z0) * t) * VOX
      ));
    }
    return pts;
  }
  const paths = [];
  // 滨江双向
  const samples = [];
  for (let z = 20; z < NZ - 20; z += 6) {
    const x = Math.ceil(eastBank(z)) + 9;
    samples.push([x, z]);
  }
  const fwd = [], back = [];
  for (const p of samples) fwd.push(new THREE.Vector3(p[0] * VOX, 0.05, p[1] * VOX));
  for (let i = samples.length - 1; i >= 0; i--) {
    back.push(new THREE.Vector3((samples[i][0] + 3) * VOX, 0.05, samples[i][1] * VOX));
  }
  paths.push(fwd, back);
  // 外滩路
  const bf = [], bb = [];
  for (let z = 40; z < NZ - 40; z += 6) {
    const x = Math.floor(westBank(z)) - 8;
    bf.push(new THREE.Vector3(x * VOX, 0.05, z * VOX));
    bb.push(new THREE.Vector3((x - 3) * VOX, 0.05, z * VOX));
  }
  bb.reverse();
  paths.push(bf, bb);
  // 世纪大道双向（偏离中线）
  const { ax, az, bx, bz } = META.ave;
  const dx = bx - ax, dz = bz - az;
  const len = Math.hypot(dx, dz) || 1;
  const px = -dz / len, pz = dx / len;
  function avePath(off) {
    const pts = [];
    const n = Math.ceil(len / 4);
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      pts.push(new THREE.Vector3(
        (ax + dx * t + px * off) * VOX,
        0.05,
        (az + dz * t + pz * off) * VOX
      ));
    }
    return pts;
  }
  const a1 = avePath(5), a2 = avePath(-5);
  a2.reverse();
  paths.push(a1, a2);
  // 环路
  const ring = META.ring;
  const loop = [];
  for (let a = 0; a <= Math.PI * 2 + 0.02; a += 0.08) {
    loop.push(new THREE.Vector3(
      (ring.rcx + Math.cos(a) * ring.rrx) * VOX,
      0.05,
      (ring.rcz + Math.sin(a) * ring.rrz) * VOX
    ));
  }
  paths.push(loop);
  // 桥面
  const br = META.bridge;
  const bridgePath = [];
  for (let x = br.x0 - 10; x <= br.x1 + 30; x += 3) {
    let y = br.deck;
    if (x > br.x1) y = Math.max(0, Math.round(br.deck * (1 - (x - br.x1) / 42)));
    bridgePath.push(new THREE.Vector3(x * VOX, y * VOX + 0.2, br.bz * VOX));
  }
  paths.push(bridgePath);
  META.paths = paths.filter(p => p.length > 2);
}

function pathPoint(path, dist, target) {
  let acc = 0;
  for (let i = 0; i < path.length - 1; i++) {
    const a = path[i], b = path[i + 1];
    const seg = a.distanceTo(b);
    if (acc + seg >= dist) {
      const t = seg < 1e-4 ? 0 : (dist - acc) / seg;
      target.lerpVectors(a, b, t);
      target._tx = b.x - a.x; target._tz = b.z - a.z;
      return true;
    }
    acc += seg;
  }
  return false;
}
function pathLen(path) {
  let L = 0;
  for (let i = 0; i < path.length - 1; i++) L += path[i].distanceTo(path[i + 1]);
  return L;
}

function buildWaterGeometry() {
  const positions = [];
  const indices = [];
  const row = [];
  for (let z = 0; z <= NZ; z += 2) {
    const landE = Math.ceil(eastBank(Math.min(NZ - 1, z)));
    const landW = Math.floor(westBank(Math.min(NZ - 1, z)));
    const xw = (landW + 1) * VOX + 0.2;
    const xe = landE * VOX - 0.2;
    row.push(positions.length / 3);
    positions.push(xw, WATER_Y, z * VOX, xe, WATER_Y, z * VOX);
  }
  for (let i = 0; i < row.length - 1; i++) {
    const a = row[i], b = row[i + 1];
    // a west, a+1 east, b west, b+1 east. +Y winding: west-near, west-far, east-far / west-near, east-far, east-near
    indices.push(a, b, b + 1, a, b + 1, a + 1);
  }
  // 苏州河
  const cz = 28;
  const base = positions.length / 3;
  const wb = Math.floor(westBank(cz));
  const segs = 18;
  for (let i = 0; i <= segs; i++) {
    const x = lerp(4, wb - 1, i / segs) * VOX;
    positions.push(x, WATER_Y, (cz - 4) * VOX, x, WATER_Y, (cz + 4) * VOX);
  }
  for (let i = 0; i < segs; i++) {
    const a = base + i * 2;
    indices.push(a, a + 2, a + 3, a, a + 3, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setIndex(indices);
  g.computeVertexNormals();
  return g;
}

function makeBoat() {
  const g = new THREE.Group();
  function box(x, y, z, sx, sy, sz, color) {
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(sx, sy, sz),
      new THREE.MeshLambertMaterial({ color })
    );
    m.position.set(x, y, z);
    m.castShadow = true;
    g.add(m);
  }
  box(0, 0.4, 0, 4.2, 0.7, 14, 0xd8d2c6);
  box(0, 0.15, 0, 3.2, 0.5, 12, 0x8a3e3a);
  box(0, 1.3, -1.2, 3.2, 1.3, 5, 0xf2efe8);
  box(0, 2.3, -1.2, 1.4, 0.8, 1.4, 0xc4554a);
  return g;
}

const VOXEL_GLSL = `
vec3 vSpec = vec3(0.0);
vec3 vGlow = vec3(0.0);
float hash13(vec3 p){
  p = fract(p * 0.1031);
  p += dot(p, p.zyx + 31.32);
  return fract((p.x + p.y) * p.z);
}
void voxelShade(inout vec4 diffuseColor, inout vec3 emit, vec3 n, vec3 wpos){
  float mat = floor(vMat + 0.5);
  vec3 fw = wpos / uVoxel;
  vec3 cell = floor(fw);
  vec3 fr = fract(fw);
  vec2 uv;
  float edge;
  if (abs(n.y) > 0.62) { edge = min(min(fr.x, 1.0-fr.x), min(fr.z, 1.0-fr.z)); uv = fr.xz; }
  else if (abs(n.x) > 0.62) { edge = min(min(fr.y, 1.0-fr.y), min(fr.z, 1.0-fr.z)); uv = fr.zy; }
  else { edge = min(min(fr.x, 1.0-fr.x), min(fr.y, 1.0-fr.y)); uv = fr.xy; }
  float groove = smoothstep(0.0, 0.06, edge);
  diffuseColor.rgb *= mix(0.6, 1.0, groove);
  diffuseColor.rgb *= 0.94 + 0.08 * hash13(cell);
  diffuseColor.rgb *= 0.9 + 0.1 * smoothstep(-0.2, 0.65, n.y);
  float night = clamp(max(uNight, emit.r), 0.0, 1.0);
  emit = vec3(0.0);
  vec3 wn = normalize(vWNrm);
  float vert = 1.0 - smoothstep(0.45, 0.9, abs(wn.y));
  float foliage = smoothstep(0.03, 0.09, diffuseColor.g - max(diffuseColor.r, diffuseColor.b));
  float facade = vert * (1.0 - foliage) * step(0.035, dot(diffuseColor.rgb, vec3(0.34, 0.33, 0.33)));
  float glassish = smoothstep(0.02, 0.12, diffuseColor.b - diffuseColor.r * 0.85);
  float win = 0.0;
  if (facade > 0.5) {
    if (glassish > 0.45) win = step(0.10, uv.x) * step(uv.x, 0.90) * step(0.08, uv.y) * step(uv.y, 0.88);
    else win = step(0.22, uv.x) * step(uv.x, 0.78) * step(0.18, uv.y) * step(uv.y, 0.72);
  }
  float occ = step(0.08, hash13(cell + vec3(7.2, 1.7, 4.4)));
  if (win > 0.5) {
    vec3 glassTint = mix(vec3(0.55, 0.70, 0.78), diffuseColor.rgb, 0.35);
    diffuseColor.rgb = mix(diffuseColor.rgb * 0.45, glassTint, 0.75);
    float flick = step(0.985, hash13(cell + vec3(floor(uTime * 1.7))));
    vec3 warm = vec3(1.0, 0.66, 0.32);
    vec3 cool = vec3(0.62, 0.78, 1.0);
    vec3 lampC = mix(warm, cool, step(0.84, hash13(cell.zyx)));
    vec3 glow = lampC * occ * (0.2 + 8.0 * night) * (1.0 + 0.8 * hash13(cell + 2.0)) * (1.0 + flick);
    vGlow += glow;
  }
  if (mat > 6.5 && mat < 8.5) {
    diffuseColor.rgb *= 0.85 + 0.3 * hash13(cell + 4.0);
  }
  if (mat > 14.5 && mat < 15.5) {
    vec3 lampE = vec3(1.0, 0.78, 0.42) * mix(0.2, 1.3, night);
    vGlow += lampE;
    diffuseColor.rgb = vec3(1.0, 0.86, 0.55);
  }
  if (mat > 15.5 && mat < 16.5) {
    float b = 0.25 + 0.75 * step(0.62, fract(uTime * 0.45 + hash13(cell)));
    vGlow += vec3(1.0, 0.16, 0.08) * b * 1.6;
    diffuseColor.rgb = vec3(0.55, 0.05, 0.04);
  }
  vec3 viewDir = normalize(cameraPosition - wpos);
  float specP = pow(max(dot(reflect(-uSunDir, n), viewDir), 0.0), 48.0);
  vSpec += specP * glassish * facade * vec3(1.0, 0.96, 0.9) * (0.55 * (1.0 - uNight) + 0.05);
  float rim = pow(1.0 - max(dot(n, viewDir), 0.0), 3.0);
  vSpec += rim * vec3(0.45, 0.6, 0.75) * 0.12 * (1.0 - uNight);
}
`;

function tuneCityMaterial(mat) {
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uNight = U.uNight;
    shader.uniforms.uTime = U.uTime;
    shader.uniforms.uVoxel = U.uVoxel;
    shader.uniforms.uSunDir = U.uSunDir;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nattribute float aMat;\nvarying float vMat;\nvarying vec3 vWPos;\nvarying vec3 vWNrm;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;\nvMat = aMat;\nvWNrm = normalize(mat3(modelMatrix) * objectNormal);');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying float vMat;\nvarying vec3 vWPos;\nvarying vec3 vWNrm;\nuniform float uNight;\nuniform float uTime;\nuniform float uVoxel;\nuniform vec3 uSunDir;\n' + VOXEL_GLSL)
      .replace('#include <normal_fragment_begin>', '#include <normal_fragment_begin>\n\tvSpec = vec3(0.0);\n\tvGlow = vec3(0.0);\n\tvoxelShade(diffuseColor, totalEmissiveRadiance, normal, vWPos);')
      .replace('#include <output_fragment>', 'outgoingLight += vSpec + vGlow;\n\t#include <output_fragment>');
    window.__SHADER_OK = shader.fragmentShader.indexOf('outgoingLight += vSpec + vGlow') >= 0;
  };
  mat.customProgramCacheKey = function () { return 'voxel-city-v1'; };
}

function buildSky() {
  const geo = new THREE.SphereGeometry(7000, 32, 20);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    uniforms: {
      uZenith: { value: new THREE.Color(0x7eb6e0) },
      uHorizon: { value: new THREE.Color(0xe7eef2) },
      uSunDir: U.uSunDir,
      uNight: U.uNight,
      uTime: U.uTime
    },
    vertexShader: 'varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `
      varying vec3 vDir;
      uniform vec3 uZenith; uniform vec3 uHorizon; uniform vec3 uSunDir;
      uniform float uNight; uniform float uTime;
      float hash(vec3 p){ p=fract(p*0.1031); p+=dot(p,p.zyx+31.32); return fract((p.x+p.y)*p.z); }
      void main(){
        vec3 d = normalize(vDir);
        float h = d.y;
        vec3 col = mix(uHorizon, uZenith, smoothstep(-0.02, 0.72, h));
        float sun = max(dot(d, normalize(uSunDir)), 0.0);
        col += vec3(1.0, 0.78, 0.45) * pow(sun, 6.0) * (1.0 - uNight) * 0.85;
        col += vec3(1.0, 0.96, 0.88) * pow(sun, 900.0);
        float stars = step(0.9988, hash(floor(d * 480.0)));
        col += stars * smoothstep(0.45, 0.9, uNight) * smoothstep(0.05, 0.28, h);
        vec2 cuv = d.xz / max(0.15, d.y + 0.35);
        float c = sin(cuv.x * 2.2 + uTime * 0.015) * sin(cuv.y * 1.7 - uTime * 0.01);
        c = smoothstep(0.35, 0.85, c * 0.5 + 0.5);
        col = mix(col, vec3(1.0, 0.97, 0.94), c * (1.0 - uNight) * smoothstep(0.0, 0.25, h) * 0.45);
        col += vec3(1.0, 0.42, 0.18) * uNight * pow(clamp(1.0 - abs(h * 3.2), 0.0, 1.0), 2.0) * 0.28;
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  skyMesh = new THREE.Mesh(geo, mat);
  skyMesh.frustumCulled = false;
  scene.add(skyMesh);
  META.sky = mat;
}

function buildWaterMesh() {
  const mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    uniforms: {
      uTime: U.uTime,
      uNight: U.uNight,
      uSunDir: U.uSunDir,
      uDeep: { value: new THREE.Color(0x0a3344) },
      uShallow: { value: new THREE.Color(0x176878) },
      uFog: { value: new THREE.Color(0xc5d4de) },
      uHorizon: { value: new THREE.Color(0xd5e2ea) }
    },
    vertexShader: `
      uniform float uTime;
      varying vec3 vPos; varying vec3 vN;
      void main(){
        vec3 p = position;
        float w = sin(p.x*0.03 + uTime*1.25)*0.16 + cos(p.z*0.025 - uTime*0.95)*0.12 + sin((p.x+p.z)*0.018 + uTime*0.6)*0.08;
        float dx = cos(p.x*0.03 + uTime*1.25)*0.03*0.16 + cos((p.x+p.z)*0.018 + uTime*0.6)*0.018*0.08;
        float dz = sin(p.z*0.025 - uTime*0.95)*0.025*0.12 + cos((p.x+p.z)*0.018 + uTime*0.6)*0.018*0.08;
        p.y += w;
        vec4 wp = modelMatrix * vec4(p, 1.0);
        vPos = wp.xyz;
        vN = normalize(mat3(modelMatrix) * vec3(-dx, 1.0, -dz));
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: `
      uniform float uTime; uniform float uNight; uniform vec3 uSunDir;
      uniform vec3 uDeep; uniform vec3 uShallow; uniform vec3 uFog; uniform vec3 uHorizon;
      varying vec3 vPos; varying vec3 vN;
      void main(){
        vec3 n = normalize(vN);
        vec3 view = normalize(cameraPosition - vPos);
        float fres = pow(1.0 - max(dot(n, view), 0.0), 3.0);
        vec3 col = mix(uDeep, uShallow, fres);
        col = mix(col, uHorizon, fres * (0.18 + 0.2 * (1.0 - uNight)));
        float spec = pow(max(dot(reflect(-normalize(uSunDir), n), view), 0.0), 80.0);
        col += vec3(1.0, 0.92, 0.8) * spec * (1.0 - uNight) * 0.7;
        float spark = sin(vPos.x*0.35 + uTime*2.0) * sin(vPos.z*0.28 - uTime*1.6);
        spark = smoothstep(0.72, 1.0, spark);
        col += vec3(1.0, 0.72, 0.42) * spark * uNight * 0.55;
        float dist = length(cameraPosition - vPos);
        float fg = smoothstep(900.0, 4600.0, dist);
        col = mix(col, uFog, fg);
        gl_FragColor = vec4(col, 0.94);
      }
    `
  });
  waterMesh = new THREE.Mesh(buildWaterGeometry(), mat);
  waterMesh.renderOrder = 2;
  scene.add(waterMesh);
  META.water = mat;
}

function sunVectors(time) {
  const az = (time - 0.25) * Math.PI * 2;
  const x = Math.cos(az);
  const y = Math.sin(az);
  const z = -0.48 * Math.cos(az);
  const len = Math.hypot(x, y, z) || 1;
  return { x: x / len, y: y / len, z: z / len };
}

function applyTime() {
  const s = sunVectors(tod);
  const night = smoothstep(0.16, -0.06, s.y);
  const dusk = Math.exp(-Math.pow((s.y - 0.08) / 0.16, 2)) * (1 - night * 0.25);
  U.uNight.value = night;
  const sunDir = U.uSunDir.value;
  if (s.y > 0.02) sunDir.set(s.x, s.y, s.z);
  else sunDir.set(-s.x, Math.max(0.18, -s.y), -s.z);
  const zenith = new THREE.Color(0x7eafd6).lerp(new THREE.Color(0x1a2748), dusk * 0.55).lerp(new THREE.Color(0x070b14), night);
  const horizon = new THREE.Color(0xe4eef3).lerp(new THREE.Color(0xf09958), Math.min(1, dusk)).lerp(new THREE.Color(0x1a1424), night);
  const sunCol = new THREE.Color(0xfff6e8).lerp(new THREE.Color(0xffb15a), smoothstep(0.45, 0.05, s.y));
  if (META.sky) {
    META.sky.uniforms.uZenith.value.copy(zenith);
    META.sky.uniforms.uHorizon.value.copy(horizon);
  }
  scene.background.copy(horizon);
  scene.fog.color.copy(horizon);
  scene.fog.near = 900;
  scene.fog.far = 4800 - night * 600;
  if (META.water) {
    META.water.uniforms.uFog.value.copy(horizon);
    META.water.uniforms.uHorizon.value.copy(horizon);
    META.water.uniforms.uDeep.value.set(night ? 0x071820 : 0x0c3b4a);
  }
  hemi.color.copy(zenith);
  hemi.groundColor.set(0x8d816e).lerp(new THREE.Color(0x16120e), night);
  hemi.intensity = 0.40 + 0.18 * (1 - night);
  const focus = META.focus;
  const ld = sunDir;
  dirLight.color.copy(s.y > 0.02 ? sunCol : new THREE.Color(0xb7c4ee));
  dirLight.intensity = s.y > 0.02 ? (0.5 + 0.85 * smoothstep(0.0, 0.4, s.y)) : 0.15;
  dirLight.position.set(focus.x + ld.x * 1700, focus.y + ld.y * 1700, focus.z + ld.z * 1700);
  const shadowCenter = mode === 'fps' ? new THREE.Vector3(player.x, 30, player.z) : focus;
  dirLight.target.position.copy(shadowCenter);
  const ext = mode === 'fps' ? 260 : 880;
  const camL = dirLight.shadow.camera;
  camL.left = -ext; camL.right = ext; camL.top = ext; camL.bottom = -ext;
  camL.updateProjectionMatrix();
  renderer.toneMappingExposure = 0.96 - night * 0.22 + dusk * 0.04;
  if (META.lampMat) META.lampMat.emissiveIntensity = 0.15 + night * 1.35;
  if (cityMesh) cityMesh.material.emissive.setRGB(night, 0, 0);
  for (const sp of lampSprites) sp.material.opacity = night * 0.85;
  const blink = 0.35 + 0.65 * (Math.sin(U.uTime.value * 3.1) > 0.4 ? 1 : 0.15);
  for (const sp of beaconSprites) sp.material.opacity = 0.25 + blink;
  const names = night > 0.65 ? '夜景' : dusk > 0.55 && s.y < 0.35 ? (tod < 0.5 ? '黎明' : '黄昏') : s.y > 0.75 ? '正午' : '白昼';
  const hh = Math.floor(tod * 24) % 24;
  const mm = Math.floor((tod * 24 - hh) * 60);
  document.getElementById('timelabel').textContent = names + '  ' + String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
}

function stepDynamics(dt) {
  U.uTime.value += dt;
  if (autoCycle) {
    tod = (tod + dt / 140) % 1;
    const slider = document.getElementById('tod');
    slider.value = String(Math.round(tod * 1000));
  }
  for (let i = 0; i < cars.length; i++) {
    const c = cars[i];
    c.dist = (c.dist + c.speed * dt) % c.len;
    if (!pathPoint(c.path, c.dist, _carPos)) continue;
    const tx = _carPos._tx || 0, tz = _carPos._tz || 1;
    _dummy.position.copy(_carPos);
    _dummy.position.y += 0.55;
    _dummy.lookAt(_carPos.x + tx, _dummy.position.y, _carPos.z + tz);
    _dummy.updateMatrix();
    carMesh.setMatrixAt(i, _dummy.matrix);
    _dummy.position.y += 0.55;
    _dummy.position.x -= tx * 0.05;
    _dummy.updateMatrix();
    carCabin.setMatrixAt(i, _dummy.matrix);
    // 车头灯：沿 +Z 局部前方，lookAt 把 +Z 指向行驶方向
    const fl = Math.hypot(tx, tz) || 1;
    const fx = tx / fl, fz = tz / fl;
    const rx = fz, rz = -fx;
    for (let k = 0; k < 2; k++) {
      const s = k === 0 ? 0.55 : -0.55;
      _dummy.position.set(
        _carPos.x + fx * 2.0 + rx * s,
        _carPos.y + 0.55,
        _carPos.z + fz * 2.0 + rz * s
      );
      _dummy.lookAt(_dummy.position.x + fx, _dummy.position.y, _dummy.position.z + fz);
      _dummy.updateMatrix();
      carLamps.setMatrixAt(i * 2 + k, _dummy.matrix);
    }
  }
  if (carMesh) {
    carMesh.instanceMatrix.needsUpdate = true;
    carCabin.instanceMatrix.needsUpdate = true;
    carLamps.instanceMatrix.needsUpdate = true;
  }
  // 江面游船
  const boatPath = [];
  for (let z = 16; z < NZ - 16; z += 8) {
    const mid = (eastBank(z) + westBank(z)) * 0.5;
    boatPath.push(new THREE.Vector3(mid * VOX, WATER_Y + 0.15, z * VOX));
  }
  const bl = pathLen(boatPath);
  for (const b of boatGroups) {
    b.dist = (b.dist + b.speed * dt) % bl;
    if (!pathPoint(boatPath, b.dist, _carPos)) continue;
    const off = b.side * 28;
    b.mesh.position.set(_carPos.x + off, WATER_Y + 0.2, _carPos.z);
    const tx = _carPos._tx || 0, tz = _carPos._tz || 1;
    b.mesh.lookAt(b.mesh.position.x + tx, b.mesh.position.y, b.mesh.position.z + tz);
  }
}

function floorAt(ix, iz, feet) {
  if (ix < 1 || iz < 1 || ix >= NX - 1 || iz >= NZ - 1) return null;
  const i = I(ix, iz);
  if (SOLID[i]) return null;
  const deck = DECK[i];
  const water = TER[i] === T.WATER;
  if (deck > 0.8 && feet >= deck - VOX - 0.45) return deck;
  if (water) return null;
  return 0;
}
function tryStep(nx, nz, feet) {
  const ix = Math.floor(nx / VOX);
  const iz = Math.floor(nz / VOX);
  const f = floorAt(ix, iz, feet);
  if (f === null) return null;
  if (f > feet + VOX + 0.25) return null;
  return f;
}
function updateFPS(dt) {
  let fIn = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  let rIn = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  camera.rotation.order = 'YXZ';
  camera.rotation.x = pitch;
  camera.rotation.y = yaw;
  camera.rotation.z = 0;
  camera.updateMatrixWorld(true);
  camera.getWorldDirection(_fwd);
  _fwd.y = 0;
  if (_fwd.lengthSq() < 1e-8) _fwd.set(0, 0, -1); else _fwd.normalize();
  _right.crossVectors(_fwd, UP);
  _wish.set(0, 0, 0);
  if (fIn || rIn) {
    _wish.addScaledVector(_fwd, fIn).addScaledVector(_right, rIn).normalize();
  }
  const speed = (keys.ShiftLeft || keys.ShiftRight) ? 11.5 : 5.4;
  const dist = speed * dt * (_wish.lengthSq() > 0 ? 1 : 0);
  const sub = Math.max(1, Math.ceil(dist / 0.45));
  for (let s = 0; s < sub; s++) {
    if (_wish.lengthSq() < 1e-6) break;
    const step = dist / sub;
    const nx = player.x + _wish.x * step;
    const nz = player.z + _wish.z * step;
    let nf = tryStep(nx, nz, player.y);
    let mx = nx, mz = nz;
    if (nf === null) {
      const fx = tryStep(nx, player.z, player.y);
      const fz = tryStep(player.x, nz, player.y);
      if (fx !== null) { mx = nx; mz = player.z; nf = fx; }
      else if (fz !== null) { mx = player.x; mz = nz; nf = fz; }
      else nf = null;
    }
    if (nf !== null) {
      if (player.onGround && nf <= player.y + VOX + 0.2) {
        player.x = mx; player.z = mz;
        if (Math.abs(nf - player.y) <= VOX + 0.2) player.y = nf;
      } else {
        player.x = mx; player.z = mz;
      }
    }
  }
  if (keys.Space && player.onGround) { player.vy = 6.4; player.onGround = false; }
  player.vy -= 26 * dt;
  player.y += player.vy * dt;
  const g = floorAt(Math.floor(player.x / VOX), Math.floor(player.z / VOX), player.y);
  const ground = g === null ? player.y : g;
  if (g !== null && player.y <= ground) {
    player.y = ground; player.vy = 0; player.onGround = true;
  } else if (g === null && player.y < -2) {
    const sp = META.spawn.bund;
    player.x = sp.x; player.y = sp.y; player.z = sp.z; player.vy = 0; player.onGround = true;
  } else player.onGround = false;
  if (_wish.lengthSq() > 0 && player.onGround) player.bob += dt * speed * 1.6;
  const bob = player.onGround ? Math.sin(player.bob) * 0.035 : 0;
  camera.position.set(player.x, player.y + 1.68 + bob, player.z);
}

function zoneAt(x, z) {
  const vx = x / VOX, vz = z / VOX;
  const spots = [
    [ST, 30, '上海中心大厦'],
    [SW, 26, '环球金融中心'],
    [JM, 26, '金茂大厦'],
    [PEARL, 28, '东方明珠']
  ];
  for (const s of spots) {
    const dx = vx - s[0].x, dz = vz - s[0].z;
    if (dx * dx + dz * dz < s[1] * s[1]) return s[2];
  }
  if (vx > westBank(vz) && vx < eastBank(vz)) return '黄浦江';
  if (META.bridge && Math.abs(vz - META.bridge.bz) < 8 && vx > META.bridge.wb - 40 && vx < META.bridge.eb + 40) {
    const feet = mode === 'fps' ? player.y : 0;
    if (feet > 8 || mode !== 'fps') return '南浦大桥';
  }
  if (inPark(vx, vz)) return '陆家嘴中心绿地';
  if (vx < westBank(vz)) return '外滩';
  const { ax, az, bx, bz } = META.ave;
  const dx = bx - ax, dz = bz - az;
  const L2 = dx * dx + dz * dz;
  const t = Math.max(0, Math.min(1, ((vx - ax) * dx + (vz - az) * dz) / L2));
  const px = ax + dx * t, pz = az + dz * t;
  if (Math.hypot(vx - px, vz - pz) < 18) return '世纪大道';
  if (vx < Math.ceil(eastBank(vz)) + 14) return '滨江大道';
  return '陆家嘴金融城';
}

function updateHUD(dt) {
  const p = mode === 'fps' ? player : { x: controls.target.x, z: controls.target.z };
  document.getElementById('zone').textContent = zoneAt(p.x, p.z);
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.4) { fpsShow = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  document.getElementById('fps').textContent = fpsShow ? (fpsShow.toFixed(0) + ' fps') : '—';
  if (miniStatic) {
    const map = document.getElementById('map');
    const g = map.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.drawImage(miniStatic, 0, 0, map.width, map.height);
    const mx = (p.x / VOX) / NX * map.width;
    const my = (p.z / VOX) / NZ * map.height;
    g.fillStyle = '#ffd56a';
    g.beginPath(); g.arc(mx, my, 3.2, 0, Math.PI * 2); g.fill();
  }
}

function frameGod(kind) {
  const f = META.landmarks.st;
  const wb = westBank(f.z);
  if (kind === 'aerial') {
    camera.position.set(f.x * VOX + 40, 980, f.z * VOX + 520);
    controls.target.set(f.x * VOX, 40, f.z * VOX);
  } else if (kind === 'river') {
    const mid = (eastBank(f.z) + westBank(f.z)) * 0.5;
    camera.position.set(mid * VOX, 12, (f.z + 70) * VOX);
    controls.target.set(f.x * VOX, 180, f.z * VOX);
  } else {
    const cx = (ST.x + SW.x + JM.x) / 3;
    const cz = (ST.z + SW.z + JM.z) / 3;
    const shore = westBank(SW.z);
    camera.position.set((shore - 22) * VOX, 175, SW.z * VOX + 6);
    controls.target.set(SW.x * VOX, 300, SW.z * VOX);
  }
  controls.maxPolarAngle = kind === 'aerial' ? Math.PI * 0.49 : Math.PI * 0.49;
  controls.update();
}

function spawnOf(name) {
  if (name === 'pudong') {
    const z = ST.z;
    const x = (Math.ceil(eastBank(z)) + 3) * VOX;
    return { x, y: 0, z: z * VOX, yaw: Math.PI / 2 };
  }
  if (name === 'park') {
    return { x: PARK.x * VOX, y: 0, z: PARK.z * VOX, yaw: -0.6 };
  }
  if (name === 'ave') {
    const { ax, az, bx, bz } = META.ave;
    return { x: ((ax + bx) * 0.35) * VOX, y: 0, z: ((az + bz) * 0.35) * VOX, yaw: Math.atan2(-(bx - ax), -(bz - az)) };
  }
  if (name === 'bridge') {
    const b = META.bridge;
    return { x: ((b.wb + b.eb) * 0.5) * VOX, y: b.y, z: b.bz * VOX, yaw: 0 };
  }
  const z = JM.z;
  const x = (Math.floor(westBank(z)) - 3) * VOX;
  return { x, y: 0, z: z * VOX, yaw: -Math.PI / 2 };
}

function setMode(next, tp) {
  if (next === 'fps') {
    const sp = spawnOf(tp || (mode === 'fps' ? null : 'bund'));
    if (tp || mode !== 'fps') {
      player.x = sp.x; player.y = sp.y; player.z = sp.z; player.vy = 0; player.onGround = true;
      yaw = sp.yaw; pitch = 0;
    }
    controls.enabled = false;
    document.getElementById('cross').style.display = 'block';
    document.body.style.cursor = 'none';
  } else {
    if (document.pointerLockElement) document.exitPointerLock();
    controls.enabled = true;
    document.getElementById('cross').style.display = 'none';
    document.body.style.cursor = '';
    camera.rotation.order = 'XYZ';
    if (mode === 'fps') frameGod('classic');
  }
  mode = next;
  document.getElementById('btn-god').classList.toggle('on', mode === 'god');
  document.getElementById('btn-fps').classList.toggle('on', mode === 'fps');
}

function drawMinimap() {
  const c = document.createElement('canvas');
  c.width = NX / 2; c.height = NZ / 2;
  const g = c.getContext('2d');
  const img = g.createImageData(c.width, c.height);
  for (let z = 0; z < c.height; z++) {
    for (let x = 0; x < c.width; x++) {
      const sx = x * 2, sz = z * 2;
      const t = TER[I(Math.min(NX - 1, sx), Math.min(NZ - 1, sz))];
      const solid = SOLID[I(Math.min(NX - 1, sx), Math.min(NZ - 1, sz))];
      let r = 12, gg = 28, b = 36;
      if (t === T.WATER) { r = 18; gg = 70; b = 92; }
      else if (t === T.ROAD) { r = 48; gg = 52; b = 58; }
      else if (t === T.GRASS || t === T.MEDIAN) { r = 70; gg = 120; b = 64; }
      else if (t === T.WALK || t === T.PLAZA) { r = 176; gg = 164; b = 140; }
      else if (t === T.BUND) { r = 196; gg = 176; b = 150; }
      else { r = 120; gg = 124; b = 118; }
      if (solid) { r = 210; gg = 214; b = 216; }
      const o = (z * c.width + x) * 4;
      img.data[o] = r; img.data[o + 1] = gg; img.data[o + 2] = b; img.data[o + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  g.fillStyle = '#ffd56a';
  for (const p of [ST, SW, JM, PEARL]) {
    g.fillRect(p.x / 2 - 1, p.z / 2 - 1, 3, 3);
  }
  miniStatic = c;
}

function auditWinding() {
  const b = new BoxBuf();
  b.add(0, 0, 0, 1, 1, 1, M.CONC, PAL[M.CONC]);
  const p = b.pos, n = b.nor;
  let bad = 0;
  const tris = p.length / 9;
  for (let t = 0; t < tris; t++) {
    const i = t * 9;
    const ax = p[i + 3] - p[i], ay = p[i + 4] - p[i + 1], az = p[i + 5] - p[i + 2];
    const bx = p[i + 6] - p[i], by = p[i + 7] - p[i + 1], bz = p[i + 8] - p[i + 2];
    const nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
    const dot = nx * n[i] + ny * n[i + 1] + nz * n[i + 2];
    if (dot <= 0) bad++;
  }
  return { tris, bad };
}

function auditMotion() {
  const savedOrder = camera.rotation.order;
  const saved = camera.rotation.clone();
  function dir(yawV, pitchV, forward, strafe) {
    camera.rotation.order = 'YXZ';
    camera.rotation.set(pitchV, yawV, 0);
    camera.updateMatrixWorld(true);
    const f = new THREE.Vector3();
    camera.getWorldDirection(f);
    const horiz = f.clone(); horiz.y = 0; horiz.normalize();
    const r = new THREE.Vector3().crossVectors(horiz, UP);
    const wish = new THREE.Vector3().addScaledVector(horiz, forward).addScaledVector(r, strafe);
    return { f, wish };
  }
  const a = dir(-Math.PI / 2, 0, 1, 0);
  const b = dir(-Math.PI / 2, 0, 0, 1);
  const c = dir(0, 0, 1, 0);
  const d = dir(0, 0.5, 1, 0);
  camera.rotation.order = savedOrder;
  camera.rotation.copy(saved);
  camera.updateMatrixWorld(true);
  return {
    east: a.wish.x,
    south: b.wish.z,
    defaultForwardZ: c.f.z,
    lookUp: d.f.y
  };
}

function setMsg(t) { document.getElementById('loadmsg').textContent = t; }
function tick() { return new Promise(r => setTimeout(r, 20)); }

async function main() {
  setMsg('描绘黄浦江与路网…');
  await tick();
  buildBase();
  layoutSites();
  buildDistrictMasks();
  bootRenderer();
  setMsg('立起上海中心…');
  await tick();
  buildShanghaiTower();
  setMsg('开出环球之孔…');
  await tick();
  buildSWFC();
  setMsg('叠起金茂塔檐…');
  await tick();
  buildJinMao();
  setMsg('串起东方明珠…');
  await tick();
  buildPearl();
  buildConvention();
  buildSecondary();
  setMsg('铺开街区与外滩…');
  await tick();
  buildProcedural();
  buildBund();
  setMsg('架起南浦大桥…');
  await tick();
  buildBridge();
  emitTerrain();
  emitTreesAndLamps();
  setMsg('点亮玻璃与江面…');
  await tick();
  const geo = city.geometry();
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true });
  tuneCityMaterial(mat);
  cityMesh = new THREE.Mesh(geo, mat);
  cityMesh.castShadow = true;
  cityMesh.receiveShadow = true;
  scene.add(cityMesh);
  META.tris = geo.attributes.position.count / 3;
  META.boxes = city.boxes;
  buildSky();
  buildWaterMesh();
  buildCarsAndBoats();
  drawMinimap();
  META.spawn.bund = spawnOf('bund');
  const sp = META.spawn.bund;
  player.x = sp.x; player.y = sp.y; player.z = sp.z;
  const q = new URLSearchParams(location.search);
  if (q.has('t')) {
    tod = Math.min(0.999, Math.max(0, parseFloat(q.get('t')) || tod));
    const slider = document.getElementById('tod');
    if (slider) slider.value = String(Math.round(tod * 1000));
  }
  frameGod(q.get('cam') || 'classic');
  if (q.get('mode') === 'fps') {
    setMode('fps', q.get('tp') || 'bund');
    pitch = parseFloat(q.get('pitch') || '0.22');
  }
  applyTime();
  const wind = auditWinding();
  const motion = auditMotion();
  window.__AUDIT__ = {
    windingBad: wind.bad,
    tris: META.tris | 0,
    boxes: META.boxes,
    holeVoids: META.holeVoids,
    heights: META.heights,
    motion,
    cars: cars.length,
    focus: META.focus.toArray(),
    spawn: sp,
    spawnSolid: SOLID[I(Math.floor(sp.x / VOX), Math.floor(sp.z / VOX))],
    spawnTer: TER[I(Math.floor(sp.x / VOX), Math.floor(sp.z / VOX))],
    car0: cars[0] ? cars[0].dist : 0
  };
  window.__step = stepDynamics;
  window.__cars = cars;
  window.__player = player;
  window.__READY__ = false;
  document.getElementById('load').style.display = 'none';
  clock.start();
  requestAnimationFrame(loop);
}

let __frames = 0;
function loop() {
  const dt = Math.min(0.05, clock.getDelta());
  stepDynamics(dt);
  if (mode === 'god') {
    controls.update();
    if (camera.position.y < 2) camera.position.y = 2;
  } else updateFPS(dt);
  applyTime();
  skyMesh.position.copy(camera.position);
  updateHUD(dt);
  renderer.render(scene, camera);
  __frames++;
  window.__FRAMES = __frames;
  if (__frames === 2) {
    window.__READY__ = true;
    const gl = renderer.getContext();
    window.__AUDIT__.shaderOk = !!window.__SHADER_OK;
    window.__AUDIT__.glError = gl.getError();
    window.__AUDIT__.carMoved = cars[0] ? Math.abs(cars[0].dist - window.__AUDIT__.car0) : 0;
    window.__AUDIT__.logs = window.__LOGS.slice(0, 12);
    window.__AUDIT__.drawCalls = renderer.info.render.calls;
    window.__AUDIT__.geoms = renderer.info.memory.geometries;
    const pre = document.getElementById('audit');
    if (pre) pre.textContent = JSON.stringify(window.__AUDIT__);
  }
  requestAnimationFrame(loop);
}

document.getElementById('btn-god').onclick = () => setMode('god');
document.getElementById('btn-fps').onclick = () => setMode('fps', 'bund');
document.querySelectorAll('[data-tod]').forEach(btn => {
  btn.onclick = () => {
    autoCycle = false;
    document.getElementById('auto').checked = false;
    tod = parseFloat(btn.dataset.tod);
    document.getElementById('tod').value = String(Math.round(tod * 1000));
    document.querySelectorAll('[data-tod]').forEach(b => b.classList.toggle('on', b === btn));
  };
});
document.getElementById('auto').onchange = (e) => { autoCycle = e.target.checked; };
document.getElementById('tod').oninput = (e) => {
  autoCycle = false;
  document.getElementById('auto').checked = false;
  tod = parseInt(e.target.value, 10) / 1000;
  document.querySelectorAll('[data-tod]').forEach(b => b.classList.remove('on'));
};
document.querySelectorAll('[data-cam]').forEach(btn => {
  btn.onclick = () => { setMode('god'); frameGod(btn.dataset.cam); };
});
document.querySelectorAll('[data-tp]').forEach(btn => {
  btn.onclick = () => setMode('fps', btn.dataset.tp);
});
document.getElementById('c').addEventListener('click', () => {
  if (mode === 'fps') document.getElementById('c').requestPointerLock();
});
document.addEventListener('mousemove', (e) => {
  if (mode !== 'fps' || document.pointerLockElement !== document.getElementById('c')) return;
  yaw -= e.movementX * 0.0022;
  pitch -= e.movementY * 0.0022;
  pitch = Math.max(-1.35, Math.min(1.35, pitch));
});
document.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyV') setMode(mode === 'god' ? 'fps' : 'god', 'bund');
  if (e.code === 'KeyN') {
    autoCycle = false;
    document.getElementById('auto').checked = false;
    tod = U.uNight.value > 0.55 ? 0.725 : 0.03;
    document.getElementById('tod').value = String(Math.round(tod * 1000));
  }
  if (e.code === 'KeyH') {
    helpOn = !helpOn;
    document.getElementById('help').style.display = helpOn ? '' : 'none';
  }
  if (e.code === 'KeyF') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen();
  }
  if (e.code === 'KeyM') document.getElementById('mapwrap').style.display =
    document.getElementById('mapwrap').style.display === 'none' ? '' : 'none';
});
document.addEventListener('keyup', (e) => { keys[e.code] = false; });
document.getElementById('map').addEventListener('click', (e) => {
  const rect = e.target.getBoundingClientRect();
  const u = (e.clientX - rect.left) / rect.width;
  const v = (e.clientY - rect.top) / rect.height;
  const vx = u * NX, vz = v * NZ;
  const x = vx * VOX, z = vz * VOX;
  if (mode === 'god') {
    controls.target.set(x, 50, z);
    controls.update();
  } else {
    const ix = vx | 0, iz = vz | 0;
    if (!inB(ix, iz)) return;
    const feet = floorAt(ix, iz, DECK[I(ix, iz)] > 2 ? DECK[I(ix, iz)] : 0);
    if (feet === null) return;
    player.x = x; player.z = z; player.y = feet; player.vy = 0; player.onGround = true;
  }
});
window.addEventListener('error', (e) => {
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = (el.textContent || '') + '\n' + (e.message || e.error);
});
main().catch(err => {
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = String(err && err.stack || err);
});
</script>
