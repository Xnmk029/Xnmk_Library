<!DOCTYPE html>

<head>

<title>体素陆家嘴 · Voxel Lujiazui</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05080e; font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  /* ---------- Loading ---------- */
  #loading {
    position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px;
    background:radial-gradient(1200px 700px at 50% 40%, #0d1626 0%, #05080e 70%);
    color:#cfe3f5; transition:opacity .6s ease;
  }
  #loading.done { opacity:0; pointer-events:none; }
  #loading h1 { font-size:34px; letter-spacing:6px; font-weight:600; color:#e8f3ff; text-shadow:0 0 24px rgba(80,160,255,.5); }
  #loading .sub { font-size:13px; letter-spacing:3px; color:#7fa3c8; }
  #bar-wrap { width:340px; height:6px; border-radius:3px; background:#16233a; overflow:hidden; box-shadow:inset 0 1px 3px #000; }
  #bar { height:100%; width:0%; border-radius:3px; background:linear-gradient(90deg,#2e7fd8,#62d0ff); box-shadow:0 0 12px #4db2ff; transition:width .15s ease; }
  #load-tip { font-size:12px; color:#5f7d9c; letter-spacing:1px; min-height:16px; }
  .cube-spin { width:44px; height:44px; border:3px solid #2e7fd8; border-top-color:#62d0ff; border-radius:8px; animation:spin 1.1s cubic-bezier(.6,.15,.4,.85) infinite; }
  @keyframes spin { to { transform:rotate(360deg);} }

  /* ---------- HUD common ---------- */
  .panel {
    position:fixed; z-index:20; color:#d7e6f5;
    background:rgba(10,18,30,.62); border:1px solid rgba(110,170,230,.22);
    border-radius:12px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    box-shadow:0 6px 24px rgba(0,0,0,.45);
  }
  #title-card { top:16px; left:16px; padding:12px 18px 11px; }
  #title-card .t { font-size:19px; font-weight:600; letter-spacing:2px; color:#eaf4ff; }
  #title-card .t em { font-style:normal; color:#62d0ff; }
  #title-card .s { margin-top:3px; font-size:11px; letter-spacing:2px; color:#7fa3c8; }

  #ctrl-panel { top:16px; right:16px; padding:12px 14px; width:238px; display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; gap:8px; align-items:center; }
  .btn {
    flex:1; text-align:center; padding:7px 10px; font-size:12.5px; letter-spacing:1px; cursor:pointer;
    color:#cfe3f5; background:rgba(46,90,140,.30); border:1px solid rgba(110,170,230,.3);
    border-radius:8px; transition:all .18s; user-select:none;
  }
  .btn:hover { background:rgba(70,130,190,.45); }
  .btn.on { background:linear-gradient(135deg,#2e7fd8,#3ea8e8); color:#fff; border-color:#62d0ff; box-shadow:0 0 14px rgba(80,180,255,.35); }
  .lbl { font-size:11px; color:#8fb2d4; letter-spacing:1px; white-space:nowrap; }
  input[type=range] { flex:1; accent-color:#3ea8e8; height:4px; cursor:pointer; }
  #clock { font-size:12px; color:#ffd9a0; min-width:44px; text-align:right; font-variant-numeric:tabular-nums; }
  .chk { display:flex; align-items:center; gap:6px; font-size:11.5px; color:#a8c4de; cursor:pointer; }
  .chk input { accent-color:#3ea8e8; cursor:pointer; }

  #help { left:16px; bottom:16px; padding:12px 16px; max-width:305px; font-size:12px; line-height:1.85; color:#b9d2ea; }
  #help b { color:#7ec8ff; font-weight:600; }
  #help .h { font-size:11px; letter-spacing:2px; color:#6f93b8; margin-bottom:5px; }
  #help kbd { display:inline-block; padding:0 6px; margin:0 1px; border-radius:4px; background:#1a2c47; border:1px solid #33507a; font-size:11px; color:#9fd0ff; font-family:inherit; }

  #minimap-box { right:16px; bottom:16px; padding:8px; }
  #minimap { display:block; width:176px; height:176px; border-radius:8px; }
  #map-lbl { position:absolute; top:12px; left:14px; font-size:10px; letter-spacing:1px; color:#7fa3c8; }

  #fps-hint {
    position:fixed; left:50%; bottom:34px; transform:translateX(-50%); z-index:22;
    padding:9px 20px; font-size:13px; letter-spacing:1px; color:#dcecfb; display:none;
    background:rgba(10,18,30,.7); border:1px solid rgba(110,170,230,.3); border-radius:24px;
    backdrop-filter:blur(8px); pointer-events:none;
  }
  #crosshair { position:fixed; left:50%; top:50%; width:6px; height:6px; margin:-3px; border-radius:50%;
    background:rgba(255,255,255,.85); box-shadow:0 0 6px rgba(120,200,255,.9); z-index:21; display:none; }
  #fps-stat { position:fixed; left:16px; top:104px; z-index:20; font-size:11px; color:#5f7d9c; letter-spacing:1px; }

  @media (max-width:900px){ #help{ display:none; } #ctrl-panel{ width:200px; } }
</style>
</head>
<body>
<div id="app"></div>

<div id="loading">
  <div class="cube-spin"></div>
  <h1>体素陆家嘴</h1>
  <div class="sub">VOXEL LUJIAZUI · 数字沙盘</div>
  <div id="bar-wrap"><div id="bar"></div></div>
  <div id="load-tip">初始化…</div>
</div>

<div id="title-card" class="panel">
  <div class="t"><em>体素</em> 陆家嘴 · 数字沙盘</div>

</div>

<div id="ctrl-panel" class="panel">
  <div class="row">
    <div id="btn-god" class="btn on">上帝视角</div>

<div id="minimap-box" class="panel">
  <canvas id="minimap" width="352" height="352"></canvas>
  <div id="map-lbl">LUJIAZUI · N↑</div>

<div id="fps-hint">点击画面锁定鼠标 · WASD 移动 · F 飞行 · V 上帝视角</div>
<div id="crosshair"></div>
<div id="fps-stat"></div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ================================================================
   0. 基础：渲染器 / 场景 / 相机 / 灯光 / 后期
================================================================ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fc0e4);
scene.fog = new THREE.Fog(0x9fc0e4, 750, 2750);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 1, 6500);
camera.position.set(560, 470, 560);

const sun = new THREE.DirectionalLight(0xffe3b3, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 100;
sun.shadow.camera.far = 3200;
sun.shadow.camera.left = -900; sun.shadow.camera.right = 900;
sun.shadow.camera.top = 900; sun.shadow.camera.bottom = -900;
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 2.2;
scene.add(sun); scene.add(sun.target);

const moon = new THREE.DirectionalLight(0x6a86c8, 0.0);
moon.position.set(-400, 700, -500);
scene.add(moon); scene.add(moon.target);

const hemi = new THREE.HemisphereLight(0xbcd8f5, 0x4a4438, 0.85);
scene.add(hemi);
const amb = new THREE.AmbientLight(0x334455, 0.35);
scene.add(amb);

/* composer + bloom */
const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { samples:4, type:THREE.HalfFloatType });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.5, 0.82);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());
let useBloom = true;

/* ================================================================
   1. 常量 / 随机数 / 体素批渲染器
================================================================ */
const V = 4;                    // 体素边长（米）
const MG = 384;                 // 网格数 384×384
const HW = MG * V / 2;          // 世界半径 768m
const rand = (()=>{ let s = 20260913>>>0;
  return ()=>{ s|=0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s>>>15, 1|s);
    t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; };
})();
const R = (a,b)=> a + rand()*(b-a);
const RI = (a,b)=> Math.floor(R(a,b+0.999));
const clamp = (v,a,b)=> Math.max(a, Math.min(b,v));
const lerp = (a,b,t)=> a+(b-a)*t;
const smooth = (a,b,v)=>{ const t = clamp((v-a)/(b-a),0,1); return t*t*(3-2*t); };

const C = h => { const c = new THREE.Color(h); return [c.r,c.g,c.b]; };
const Cj = (h, j=0.07) => { const c = new THREE.Color(h); const k = 1 + (rand()*2-1)*j; return [clamp(c.r*k,0,1), clamp(c.g*k,0,1), clamp(c.b*k,0,1)]; };

/* 批：主结构 / 玻璃 / 发光窗(昼夜换色) / 水面 / 云 */
const B_main=[], B_glass=[], B_glow=[], B_water=[], B_cloud=[];
const P = (arr,x,y,z,sx,sy,sz,c,rx=0,ry=0,rz=0)=> arr.push({x,y,z,sx,sy,sz,rx,ry,rz,c});
const PV = (arr,x,y,z,c)=> P(arr,x,y,z,V*0.94,V*0.94,V*0.94,c);
const PG = (x,y,z,c,cn)=>{ B_glow.push({x,y,z,sx:V*0.9,sy:V*0.9,sz:V*0.9,rx:0,ry:0,rz:0,c,cn}); };

/* 高度场（行走碰撞/地表高度） & 占位栅格 */
const hmap = new Float32Array(MG*MG);
const occ  = new Uint8Array(MG*MG);     // 0空 1建筑/设施
const gidx = (x,z)=> { const i = Math.round((x+HW)/V - .5), j = Math.round((z+HW)/V - .5);
  return (i<0||j<0||i>=MG||j>=MG)? -1 : j*MG+i; };
const setH = (x,z,h)=>{ const i=gidx(x,z); if(i>=0) hmap[i]=h; };
const markOcc = (x,z,w,d,h)=>{ const i0=gidx(x-w/2,z-d/2), i1=gidx(x+w/2,z+d/2);
  if(i0<0) return; const a=i0%MG, b=Math.floor(i0/MG), a2=i1%MG, b2=Math.floor(i1/MG);
  for(let j=Math.min(b,b2); j<=Math.max(b,b2); j++) for(let i=Math.min(a,a2); i<=Math.max(a,a2); i++){ occ[j*MG+i]=1; hmap[j*MG+i]=h; } };

/* ================================================================
   2. 地理：黄浦江河湾 + 路网
================================================================ */
const RIVER = [ [-505,880],[-495,560],[-478,300],[-448,40],[-412,-180],[-352,-345],
                [-258,-442],[-112,-502],[58,-532],[300,-552],[880,-580] ];
const RIVER_HW = 158;   // 河半宽 ≈316m
function dSeg(px,pz, ax,az,bx,bz){ const dx=bx-ax, dz=bz-az, L2=dx*dx+dz*dz;
  let t = L2? ((px-ax)*dx+(pz-az)*dz)/L2 : 0; t=clamp(t,0,1);
  const ex=ax+dx*t-px, ez=az+dz*t-pz; return Math.sqrt(ex*ex+ez*ez); }
function riverDist(x,z){ let m=1e9; for(let i=0;i<RIVER.length-1;i++)
  m=Math.min(m, dSeg(x,z, RIVER[i][0],RIVER[i][1], RIVER[i+1][0],RIVER[i+1][1])); return m; }

/* 道路：轴线矩形 + 世纪大道斜轴 + 环路 */
const AVENUES = [ {x:-300,z0:-140,z1:760,w:16}, {x:-190,z0:-220,z1:760,w:14}, {x:-80,z0:-280,z1:760,w:16},
                  {x:30,z0:-260,z1:760,w:14}, {x:140,z0:-300,z1:760,w:16}, {x:250,z0:-330,z1:760,w:14},
                  {x:360,z0:-360,z1:760,w:16}, {x:480,z0:-380,z1:760,w:14}, {x:600,z0:-400,z1:760,w:16} ];
const STREETS = [ {z:-240,x0:-200,x1:760,w:12}, {z:-120,x0:-280,x1:760,w:14}, {z:0,x0:-320,x1:760,w:12},
                  {z:120,x0:-352,x1:760,w:14}, {z:240,x0:-372,x1:760,w:12}, {z:360,x0:-392,x1:760,w:14},
                  {z:480,x0:-412,x1:760,w:12}, {z:600,x0:-430,x1:760,w:14}, {z:700,x0:-450,x1:760,w:12} ];
const CENTURY = { ax:40, az:-48, bx:640, bz:552, w:30 };
const RING = { x:-8, z:-118, r:188, w:15 };
const BRIDGE_X = 330;

function roadMask(x,z){
  for(const a of AVENUES) if(Math.abs(x-a.x)<a.w/2 && z>a.z0 && z<a.z1) return 1;
  for(const s of STREETS) if(Math.abs(z-s.z)<s.w/2 && x>s.x0 && x<s.x1) return 1;
  if(dSeg(x,z, CENTURY.ax,CENTURY.az, CENTURY.bx,CENTURY.bz) < CENTURY.w/2) return 1;
  const dr = Math.abs(Math.hypot(x-RING.x,z-RING.z) - RING.r); if(dr < RING.w/2) return 1;
  return 0;
}
function nearRoad(x,z,pad){ // 距路缘 pad 内（人行道）
  for(const a of AVENUES) if(Math.abs(x-a.x)<a.w/2+pad && z>a.z0 && z<a.z1) return 1;
  for(const s of STREETS) if(Math.abs(z-s.z)<s.w/2+pad && x>s.x0 && x<s.x1) return 1;
  if(dSeg(x,z, CENTURY.ax,CENTURY.az, CENTURY.bx,CENTURY.bz) < CENTURY.w/2+pad) return 1;
  if(Math.abs(Math.hypot(x-RING.x,z-RING.z)-RING.r) < RING.w/2+pad) return 1;
  return 0;
}
/* 中心绿地（楔形公园） */
const PARK = { x0:96, z0:-30, x1:252, z1:104 };
const inPark = (x,z)=> x>PARK.x0 && x<PARK.x1 && z>PARK.z0 && z<PARK.z1 && (x-PARK.x0)+(z-PARK.z0) < 300;
/* 明珠环岛广场 */
const PLAZA = { x:-52, z:-238, r:70 };

/* ================================================================
   3. 建筑生成器
================================================================ */
const GLASS_TONES = [0x86aac8,0x7ba3c4,0x93b8d4,0x6f9cba,0xa4c4da,0x7fa8a8,0x8a9ec0,0x6a8aa8,0x9ab8a8];
const WALL_TONES  = [0xbdb4a2,0xc8bda8,0xa8a49a,0xb0a894,0x9aa0a8,0xb98f6f];
const WIN_WARM = [[1.0,0.72,0.38],[1.0,0.80,0.50],[0.98,0.62,0.30],[0.78,0.88,1.0]];

function winGlow(x,y,z,day,warm){ PG(x,y,z, day, warm||WIN_WARM[RI(0,2)]); }

/* 通用塔楼：矩形壳 + 幕墙窗格 + 退台 + 屋顶 */
function tower(cx,cz,w,d,h,opt={}){
  const tone = opt.tone ?? GLASS_TONES[RI(0,GLASS_TONES.length-1)];
  const kind = opt.kind ?? 'office';
  const fl=Math.max(3,Math.round(h/V));
  const pod = opt.podium ?? 0;                 // 裙楼层数
  const lit = opt.lit ?? 0.5;                  // 亮灯率
  const setb = opt.setbacks ?? [];             // [{at:fraction, dw, dd}]
  const gseed = rand()*97;                     // 每楼亮灯图样相位
  let hw=w/2, hd=d/2;
  const ringCells = (w2,d2)=>{ const cells=[];
    const a=Math.round(w2/V), b=Math.round(d2/V);
    for(let i=-a;i<=a;i++) for(let j=-b;j<=b;j++)
      if(Math.abs(i)===a||Math.abs(j)===b) cells.push([i,j]);
    return cells; };

  for(let f=0; f<fl; f++){
    for(const sb of setb) if(f >= fl*sb.at){ hw=Math.max(8,(w/2+ (sb.dw??-8))); hd=Math.max(8,(d/2+(sb.dd??-8))); }
    const y = f*V + V/2;
    const podx = f<pod ? 1 : 0;
    const cells = ringCells(hw+podx*V, hd+podx*V);
    const mech = (f%14===13);
    const band = (f%6===5);                    // 层间暗带
    for(const [i,j] of cells){
      const x=cx+i*V, z=cz+j*V;
      if(f<pod){ // 裙楼：暖色石材 + 底商橱窗
        const win = ((i+j+f)&1)===0;
        if(win) winGlow(x,y,z, [0.72,0.64,0.5], [1.0,0.68,0.32]);
        else PV(B_main, x,y,z, Cj(0xb8a685,.05));
        continue;
      }
      if(kind==='office'){
        const gcm=Cj(tone,.04);
        if(mech){ PV(B_main,x,y,z, [gcm[0]*0.45,gcm[1]*0.45,gcm[2]*0.45]); continue; }
        /* 统一幕墙：整体玻璃 + 轻微明暗 + 竖梃微凸 */
        const fin = (((i*7+j*11)%5)+5)%5===0;
        const dim = band?0.78 : fin?0.88 : 1.0;
        const day=[gcm[0]*dim,gcm[1]*dim,gcm[2]*dim];
        const hsh=Math.abs(Math.sin(i*12.9898+j*78.233+f*37.7+gseed));
        if(hsh<lit*0.5) winGlow(x,y,z, day, WIN_WARM[RI(0,3)]);
        else PV(fin?B_main:B_glass,x,y,z, day);
      } else { // residential / hotel：小窗实墙
        const isWin = ((i*3+j*5+f)%2===0);
        const gcm=Cj(tone,.05);
        if(mech){ PV(B_main,x,y,z, [gcm[0]*0.5,gcm[1]*0.5,gcm[2]*0.5]); continue; }
        if(isWin){ const day=[gcm[0]*0.55,gcm[1]*0.62,gcm[2]*0.7];
          const hsh=Math.abs(Math.sin(i*9.13+j*41.7+f*23.3+gseed));
          if(hsh<lit*0.45) winGlow(x,y,z, day, WIN_WARM[RI(0,2)]);
          else PV(B_glass,x,y,z, day);
        } else PV(B_main,x,y,z, gcm);
      }
    }
  }
  /* 屋顶：压顶 + 设备间 + 天线 */
  const ty = fl*V;
  for(const [i,j] of ringCells(hw,hd)) PV(B_main, cx+i*V, ty+V/2, cz+j*V, Cj(0x767c84,.05));
  P(B_main, cx, ty+V*0.9, cz, Math.max(6,hw*.8), V*1.6, Math.max(6,hd*.8), Cj(0x8a9098,.06));
  if(h>120 || rand()<0.3){ const ah=R(12,30);
    P(B_main, cx+R(-hw*.4,hw*.4), ty+ah/2, cz+R(-hd*.4,hd*.4), 1.6, ah, 1.6, C(0x5a6068));
    PG(cx, ty+ah+1.5, cz, [0.25,0.1,0.1],[1.0,0.15,0.2]); }
  markOcc(cx,cz, w+V*2, d+V*2, ty);
  return ty;
}

/* —— 上海中心大厦：扭转塔身 —— */
function shanghaiTower(cx,cz){
  const H=632, fl=Math.round(H/V);
  for(let f=0; f<fl; f++){
    const t=f/fl;
    const r = lerp(34,17,Math.pow(t,0.8));
    const th = t*2.05;                       // ≈117°总扭转
    const y=f*V+V/2;
    const a=Math.ceil(r/V)+1;
    for(let i=-a;i<=a;i++) for(let j=-a;j<=a;j++){
      const lx=i*V, lz=j*V;
      const qx= lx*Math.cos(th)+lz*Math.sin(th), qz=-lx*Math.sin(th)+lz*Math.cos(th);
      const inside = Math.max(Math.abs(qx),Math.abs(qz))<r && (Math.abs(qx)+Math.abs(qz))<r*1.5;
      if(!inside) continue;
      const edge = Math.max(Math.abs(qx),Math.abs(qz))>r-V*1.4 || (Math.abs(qx)+Math.abs(qz))>r*1.5-V*1.4;
      if(!edge) continue;
      const x=cx+lx, z=cz+lz;
      const hsh=Math.abs(Math.sin(i*12.9898+j*78.233+f*37.7));
      const gc=Cj(0x9cc2da,.04);
      if(t>0.94){ if(hsh<0.8) winGlow(x,y,z, [0.6,0.72,0.82],[0.75,0.88,1.0]); }
      else if(hsh<0.3) winGlow(x,y,z, gc, WIN_WARM[RI(0,3)]);
      else PV(B_glass,x,y,z, gc);
    }
  }
  P(B_main, cx, H+10, cz, 10, 20, 10, C(0x8fb2c8));
  PG(cx, H+22, cz, [0.3,0.1,0.1],[1,0.2,0.25]);
  markOcc(cx,cz, 76,76, H);
}

/* —— 环球金融中心：开瓶器 —— */
function swfc(cx,cz){
  const H=492, fl=Math.round(H/V);
  const w0=58, d0=30;
  for(let f=0; f<fl; f++){
    const t=f/fl, y=f*V+V/2;
    const hw = lerp(w0/2, 15, t), hd = lerp(d0/2, 10, t);
    const hole = (t>0.74 && t<0.9);
    const holeHW = hole ? (t-0.74)/0.16 * hw*0.75 : 0;
    const a=Math.ceil(hw/V), b=Math.ceil(hd/V);
    for(let i=-a;i<=a;i++) for(let j=-b;j<=b;j++){
      const edge = Math.abs(i)===a||Math.abs(j)===b;
      if(!edge) continue;
      const x=cx+i*V, z=cz+j*V;
      if(hole && Math.abs(i*V)<holeHW && Math.abs(j)!==b){ // 梯形洞口
        if(Math.abs(Math.abs(i*V)-holeHW)<V) PV(B_main,x,y,z,Cj(0x6d7c88,.04));
        continue;
      }
      const hsh=Math.abs(Math.sin(i*12.9898+j*78.233+f*37.7));
      const gc=Cj(0x7fa9c2,.045);
      if(hsh<0.28) winGlow(x,y,z, gc, WIN_WARM[RI(0,3)]);
      else PV(B_glass,x,y,z, gc);
    }
  }
  P(B_main, cx, H+6, cz, 6, 12, 6, C(0x5c7080));
  markOcc(cx,cz, w0+8, d0+8, H);
}

/* —— 金茂大厦：宝塔退台 —— */
function jinMao(cx,cz){
  const H=420; let s=52, y=0; const seg=8;
  for(let g=0; g<13 && s>10; g++){
    const n=Math.min(seg, Math.round((H-y)/V));
    const a=Math.round(s/2/V);
    for(let f=0; f<n; f++){
      const yy=y+f*V+V/2;
      for(let i=-a;i<=a;i++) for(let j=-a;j<=a;j++){
        if(Math.abs(i)!==a && Math.abs(j)!==a) continue;
        const x=cx+i*V, z=cz+j*V;
        const win = ((i+j+f)&1)===0;
        const hsh=Math.abs(Math.sin(i*12.9898+j*78.233+f*37.7));
        if(win){ if(hsh<0.3) winGlow(x,yy,z, Cj(0xc9b896,.04), WIN_WARM[RI(0,2)]);
          else PV(B_glass,x,yy,z, Cj(0xc9b896,.04)); }
        else PV(B_main,x,yy,z, Cj(0xb3a58a,.04));
      }
    }
    y += n*V;
    for(let i=-a;i<=a;i++) for(let j=-a;j<=a;j++) // 层间腰线
      if(Math.abs(i)===a||Math.abs(j)===a) PV(B_main, cx+i*V, y-V*0.15, cz+j*V, Cj(0xd8c9a8,.04));
    s -= 3.6;
  }
  P(B_main, cx, H-36, cz, 8, 40, 8, C(0xcabfa2));
  P(B_main, cx, H-2, cz, 3, 34, 3, C(0xb5ab93));
  PG(cx, H+16, cz, [0.3,0.12,0.1],[1,0.25,0.2]);
  markOcc(cx,cz, 58,58, H);
}

/* —— 斜拉桥（越江） —— */
function cableBridge(){
  const x=BRIDGE_X;
  const pts=[[x,-372,4],[x,-430,10],[x,-500,13],[x,-620,13],[x,-700,9],[x,-762,4]];
  for(let s=0;s<pts.length-1;s++){ // 桥面
    const [ax,az,ay]=pts[s],[bx,bz,by]=pts[s+1];
    const n=Math.ceil(Math.hypot(bz-az,bx-ax)/V);
    for(let k=0;k<=n;k++){ const t=k/n;
      const px=lerp(ax,bx,t), pz=lerp(az,bz,t), py=lerp(ay,by,t);
      P(B_main, px-5, py-1, pz, 8, 2, V*0.98, Cj(0x4a5058,.04));
      P(B_main, px+5, py-1, pz, 8, 2, V*0.98, Cj(0x4a5058,.04));
      P(B_main, px-9.5, py+0.6, pz, 1.2, 2.4, V*0.9, Cj(0xd8dde2,.05));
      P(B_main, px+9.5, py+0.6, pz, 1.2, 2.4, V*0.9, Cj(0xd8dde2,.05));
      if(k%4===0) PG(px, py+3.2, pz, [0.4,0.35,0.3],[1,0.8,0.45]);

        P(B_main, x+sx, (top+dy)/2, pz+sgn*dz/2, 0.7, len, 0.7, C(0xeef2f6), Math.atan2(dz, top-dy)*sgn, 0, 0);
      }
    }
    PG(x, 86, pz, [0.3,0.1,0.1],[1,0.2,0.2]);
  }
}

/* —— 陆家嘴环形天桥 —— */
function footbridge(){
  const {x:cx,z:cz}=PLAZA, r=52;
  const n=Math.round(2*Math.PI*r/V);
  for(let k=0;k<n;k++){ const a=k/n*Math.PI*2;

      const x=cx+Math.cos(a)*(r+off), z=cz+Math.sin(a)*(r+off);
      P(B_main, x, 10, z, V*0.96, 2, V*0.96, Cj(0x9aa2ab,.04));
      P(B_main, x, 11.4, z, V*0.96, 0.8, V*0.96, Cj(0x707880,.05));
      if(k%3===0) P(B_main, cx+Math.cos(a)*(r+off*2.2), 11, cz+Math.sin(a)*(r+off*2.2), 0.8,2.2,0.8, C(0x606870));
    }
    if(k%6===0){ const x=cx+Math.cos(a)*r, z=cz+Math.sin(a)*r;
      P(B_main, x, 5, z, 1.6, 10, 1.6, C(0x7c848c));
      PG(x, 11.8, z, [0.4,0.35,0.3],[1,0.82,0.5]); }
    setH(cx+Math.cos(a)*r, cz+Math.sin(a)*r, 11);
  }
  for(let s=0;s<4;s++){ // 四条踏步坡道
    const a=s*Math.PI/2+Math.PI/4;
    for(let st=0; st<8; st++){ const rr=r+8+st*4.2, x=cx+Math.cos(a)*rr, z=cz+Math.sin(a)*rr;

      P(B_main, x, y-0.6, z, 5, 1.4, 5, Cj(0x9aa2ab,.04));

}

/* ================================================================
   4. 地表生成（分类→铺砖）
================================================================ */
const cls = new Uint8Array(MG*MG); // 0水 1陆 2路 3步道 4滨江 5公园 6广场
const nextFrame = ()=> new Promise(r=>requestAnimationFrame(r));
const loadTip = document.getElementById('load-tip');
const bar = document.getElementById('bar');
async function progress(p,tip){ bar.style.width=(p*100).toFixed(0)+'%'; if(tip)loadTip.textContent=tip; await nextFrame(); }

async function buildGround(){
  for(let j=0;j<MG;j++){
    for(let i=0;i<MG;i++){
      const x=i*V-HW+V/2, z=j*V-HW+V/2, id=j*MG+i;
      const rd=riverDist(x,z);
      if(rd<RIVER_HW){ cls[id]=0; hmap[id]=-6;
        B_water.push({x,y:-1.6,z,sx:3.75,sy:3.6,sz:3.75,rx:0,ry:0,rz:0,
          c: rd<RIVER_HW*0.55? Cj(0x1e506e,.08): Cj(0x2a6080,.08)});
        continue; }
      const onRoad = roadMask(x,z);
      if(onRoad){ cls[id]=2; hmap[id]=4; PV(B_main,x,2,z,Cj(0x33383f,.05)); continue; }
      if(rd<RIVER_HW+8){ cls[id]=4; hmap[id]=4; // 防汛墙
        P(B_main,x,1.4,z,4,5.4,4,Cj(0x7c8288,.05)); continue; }
      if(nearRoad(x,z,8)){ cls[id]=3; hmap[id]=4; PV(B_main,x,2,z,Cj(0x8d939a,.06)); continue; }
      if(rd<RIVER_HW+34){ cls[id]=4; hmap[id]=4; PV(B_main,x,2,z,Cj(0xb3a68b,.07)); continue; } // 滨江步道
      if(inPark(x,z)){ cls[id]=5; hmap[id]=4; PV(B_main,x,2,z,Cj(0x56814a,.10)); continue; }
      if(Math.hypot(x-PLAZA.x,z-PLAZA.z)<PLAZA.r){ cls[id]=6; hmap[id]=4; PV(B_main,x,2,z,Cj(0xa9a294,.06)); continue; }
      cls[id]=1; hmap[id]=4;
      PV(B_main,x,2,z, rand()<0.14? Cj(0x5f8452,.10): Cj(0x83898f,.07));
    }
    if((j&15)===0) await progress(0.05+0.3*j/MG,'铺设城市地表…');
  }
}

/* 滨江栏杆 / 堤岸灯 */
async function buildWaterfront(){
  for(let j=1;j<MG-1;j++){
    for(let i=1;i<MG-1;i++){
      const id=j*MG+i; if(cls[id]===0) continue;
      const nearWater = cls[id-1]===0||cls[id+1]===0||cls[id-MG]===0||cls[id+MG]===0;
      if(!nearWater) continue;
      const x=i*V-HW+V/2, z=j*V-HW+V/2;
      if(cls[id]!==2){ // 非道路边缘 → 栏杆
        for(const [dx,dz] of [[-1.6,0],[1.6,0],[0,-1.6],[0,1.6]])
          P(B_main, x+dx, 4.8, z+dz, 0.5,1.6,0.5, C(0x4c565e));
        P(B_main, x, 5.5, z, 3.6,0.4,0.9, C(0x5a646c));
        setH(x,z,6);
        if((i+j)%7===0) lamp(x+1,z+1);
        if((i*3+j)%9===0 && cls[id]===4) tree(x,z+1);
      }
    }
    if((j&31)===0) await progress(0.36+0.04*j/MG,'营造滨江步道…');
  }
}

/* ================================================================
   5. 街区填充
================================================================ */
const CORE={x:-10,z:-120};
function zoneH(x,z){
  const dc=Math.hypot(x-CORE.x,z-CORE.z);
  const dcen=dSeg(x,z,CENTURY.ax,CENTURY.az,CENTURY.bx,CENTURY.bz);
  const rd=riverDist(x,z);
  let h;
  if(dc<170) h=R(120,260);
  else if(dc<300) h=R(70,180);
  else if(dcen<80) h=R(50,150);
  else if(dc<480) h=R(30,95);
  else h=R(20,58);
  if(rd<RIVER_HW+90) h=Math.min(h,R(22,70));
  return h;
}
function blockBuildings(bx0,bz0,bx1,bz1){
  const W=bx1-bx0, D=bz1-bz0;
  if(W<30||D<30) return;
  const lots=[];
  const dc=Math.hypot((bx0+bx1)/2-CORE.x,(bz0+bz1)/2-CORE.z);
  if(W>70&&D>70&&rand()<0.5){ lots.push([bx0,bz0,bx1,bz1]); }
  else{
    const nx=Math.max(1,Math.round(W/58)), nz=Math.max(1,Math.round(D/58));
    const lw=W/nx, ld=D/nz;
    for(let a=0;a<nx;a++) for(let b=0;b<nz;b++)
      lots.push([bx0+a*lw,bz0+b*ld,bx0+(a+1)*lw,bz0+(b+1)*ld]);
  }
  for(const [x0,z0,x1,z1] of lots){
    const cx=(x0+x1)/2, cz=(z0+z1)/2, lw=x1-x0-10, ld=z1-z0-10;
    if(lw<20||ld<20) continue;
    /* 与道路/水体冲突检测：中心+四角 */
    let ok=true;
    for(const [tx,tz] of [[cx,cz],[x0+6,z0+6],[x1-6,z0+6],[x0+6,z1-6],[x1-6,z1-6]]){
      if(riverDist(tx,tz)<RIVER_HW+16 || roadMask(tx,tz) || inPark(tx,tz) ||
         Math.hypot(tx-PLAZA.x,tz-PLAZA.z)<PLAZA.r+8){ ok=false; break; }
      const ii=gidx(tx,tz); if(ii>=0&&occ[ii]){ ok=false; break; }
    }
    if(!ok) continue;
    const h=zoneH(cx,cz);
    const bw=clamp(lw*R(.55,.9),20,64), bd=clamp(ld*R(.55,.9),20,64);
    const kind = (h<85 && rand()<0.6) ? 'res' : 'office';
    tower(cx,cz,bw,bd,h,{kind, podium:(kind==='office'&&rand()<0.6)?RI(1,2):0,
      lit:R(.35,.6), setbacks: (h>150&&rand()<0.5)?[{at:.72,dw:-8,dd:-8},{at:.9,dw:-8,dd:-8}]:[]});
    if(rand()<0.3&&lw>44&&ld>44) // 配楼
      tower(cx+R(-14,14),cz+R(-14,14), R(18,26),R(18,26), R(14,30), {kind:'res',lit:.4});
  }
}
async function buildDistricts(){
  const xs=AVENUES.map(a=>a.x).sort((a,b)=>a-b);
  const zs=STREETS.map(s=>s.z).sort((a,b)=>a-b);
  const xb=[-HW+8,...xs,HW-8], zb=[-HW+8,...zs,HW-8];
  let done=0, total=(xb.length-1)*(zb.length-1);
  for(let a=0;a<xb.length-1;a++) for(let b=0;b<zb.length-1;b++){
    blockBuildings(xb[a]+12, zb[b]+12, xb[a+1]-12, zb[b+1]-12);
    if(++done%24===0) await progress(0.42+0.22*done/total,'生长城市街区…');
  }
}

/* ================================================================
   6. 道路标线 / 行道树 / 公园 / 广场
================================================================ */
async function buildStreetDetail(){
  /* 车道虚线 + 路侧行道树 + 路灯 */
  const dash=(x,z)=> P(B_main,x,4.12,z,1.1,0.18,3.4,C(0xd8d2b8));
  const dashX=(x,z)=> P(B_main,x,4.12,z,3.4,0.18,1.1,C(0xd8d2b8));
  for(const a of AVENUES){
    for(let z=a.z0+10; z<a.z1-10; z+=12){
      const i=gidx(a.x,z); if(i<0||cls[i]!==2) continue;
      dash(a.x,z);
      if(z%48<12){ if(rand()<0.6) tree(a.x-a.w/2-5,z); if(rand()<0.6) tree(a.x+a.w/2+5,z); lamp(a.x-a.w/2-3,z+6); }
    }
  }
  for(const s of STREETS){
    for(let x=s.x0+10; x<s.x1-10; x+=12){
      const i=gidx(x,s.z); if(i<0||cls[i]!==2) continue;
      dashX(x,s.z);
      if(x%48<12){ if(rand()<0.55) tree(x,s.z-s.w/2-5); if(rand()<0.55) tree(x,s.z+s.w/2+5); lamp(x+6,s.z+s.w/2+3); }
    }
  }
  /* 世纪大道：中央绿带 + 双向标线 */
  const L=Math.hypot(CENTURY.bx-CENTURY.ax,CENTURY.bz-CENTURY.az);
  const ux=(CENTURY.bx-CENTURY.ax)/L, uz=(CENTURY.bz-CENTURY.az)/L;
  for(let t=14;t<L-14;t+=8){
    const x=CENTURY.ax+ux*t, z=CENTURY.az+uz*t;
    P(B_main,x,4.14,z,1.4,0.2,1.4,C(0xe8c85a));
    if(t%24<8){ PV(B_main,x-uz*7,4.6,z+ux*7,Cj(0x4d7d3e,.1)); tree(x+uz*7,z-ux*7); }
    if(t%40<8) lamp(x-uz*10,z+ux*10);
  }
  /* 环路标线与路灯 */
  for(let k=0;k<80;k++){ const a=k/80*Math.PI*2;
    P(B_main,RING.x+Math.cos(a)*RING.r,4.12,RING.z+Math.sin(a)*RING.r,2.6,0.18,1.1,C(0xd8d2b8),0,-a,0);
    if(k%8===0) lamp(RING.x+Math.cos(a)*(RING.r+11),RING.z+Math.sin(a)*(RING.r+11));
  }
  await progress(0.66,'勾勒道路肌理…');

  /* 中心绿地：小湖 + 园路 + 树阵 */
  for(let i=0;i<2400;i++){
    const x=R(PARK.x0+8,PARK.x1-8), z=R(PARK.z0+8,PARK.z1-8);

    if(Math.hypot(x-170,z-40)<34){ P(B_main,x,4.1,z,3.7,0.2,3.7,Cj(0x9aa39a,.06)); continue; }
    if(rand()<0.32 && !occ[id]) tree(x,z,rand()<0.4);
  }
  await progress(0.7,'种植中心绿地…');

  /* 明珠环岛广场：喷泉 + 树阵 */
  for(let k=0;k<26;k++){ const a=k/26*Math.PI*2;
    PV(B_waterish(), PLAZA.x+Math.cos(a)*14, 4.6, PLAZA.z+Math.sin(a)*14, Cj(0x3a7ca8,.08)); }
  function B_waterish(){ return B_water; }
  for(let k=0;k<12;k++){ const a=k/12*Math.PI*2; tree(PLAZA.x+Math.cos(a)*30,PLAZA.z+Math.sin(a)*30,true); }
  P(B_main,PLAZA.x,7,PLAZA.z,6,10,6,C(0x8f96a0));

}

const uTime={value:0}, uNight={value:0};
function makeInstanced(items, geo, mat, {shadow=true, recv=true}={}){
  const m=new THREE.InstancedMesh(geo,mat,items.length);
  const M=new THREE.Matrix4(), Qt=new THREE.Quaternion(), E=new THREE.Euler(),
        Sv=new THREE.Vector3(), Pv=new THREE.Vector3();
  const col=new Float32Array(items.length*3);
  const night=new Float32Array(items.length*3);
  const seed=new Float32Array(items.length);
  const hasN = items.length && items[0].cn!==undefined;
  for(let i=0;i<items.length;i++){ const it=items[i];
    E.set(it.rx||0,it.ry||0,it.rz||0); Qt.setFromEuler(E);
    Sv.set(it.sx,it.sy,it.sz); Pv.set(it.x,it.y,it.z);
    M.compose(Pv,Qt,Sv); m.setMatrixAt(i,M);
    col[i*3]=it.c[0]; col[i*3+1]=it.c[1]; col[i*3+2]=it.c[2];
    if(hasN){ const cn=it.cn||it.c; night[i*3]=cn[0]; night[i*3+1]=cn[1]; night[i*3+2]=cn[2]; }
    seed[i]=it.seed||0;
  }
  m.instanceColor=new THREE.InstancedBufferAttribute(col,3);
  if(hasN) geo.setAttribute('aNight',new THREE.InstancedBufferAttribute(night,3));
  if(items.length && items[0].seed!==undefined) geo.setAttribute('aSeed',new THREE.InstancedBufferAttribute(seed,1));
  m.castShadow=shadow; m.receiveShadow=recv; m.frustumCulled=false;
  return m;
}

const paths=[];
function addPath(pts,opt={}){ paths.push({pts,y:opt.y??4,n:pts.length,closed:opt.closed??false,
  speed:opt.speed??[9,15], count:opt.count??10, boat:opt.boat??false}); }
function samplePath(p,s){ // s: 弧长参数(米)
  const segs=p.n-(p.closed?0:1);
  const total=p.len;
  let d=((s%total)+total)%total;
  for(let k=0;k<segs;k++){ const a=p.pts[k], b=p.pts[(k+1)%p.n];
    const L=Math.hypot(b[0]-a[0],b[2]-a[2]);
    if(d<=L){ const t=d/L; return [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t),
      Math.atan2(b[0]-a[0],b[2]-a[2])]; }
    d-=L; }
  const a=p.pts[0]; return [a[0],a[1],a[2],0];
}
const vehicles=[];
function buildTraffic(){
  for(const a of AVENUES){ // 双向车道
    addPath([[a.x-2.9,4,a.z0+8],[a.x-2.9,4,a.z1-8]],{count:Math.round((a.z1-a.z0)/90)});
    addPath([[a.x+2.9,4,a.z1-8],[a.x+2.9,4,a.z0+8]],{count:Math.round((a.z1-a.z0)/90)});
  }
  for(const s of STREETS){
    addPath([[s.x0+8,4,s.z-2.9],[s.x1-8,4,s.z-2.9]],{count:Math.round((s.x1-s.x0)/110)});
    addPath([[s.x1-8,4,s.z+2.9],[s.x0+8,4,s.z+2.9]],{count:Math.round((s.x1-s.x0)/110)});
  }
  { // 世纪大道
    const L=Math.hypot(CENTURY.bx-CENTURY.ax,CENTURY.bz-CENTURY.az);
    const ux=(CENTURY.bx-CENTURY.ax)/L, uz=(CENTURY.bz-CENTURY.az)/L;
    addPath([[CENTURY.ax-uz*8,4,CENTURY.az+ux*8],[CENTURY.bx-uz*8,4,CENTURY.bz+ux*8]],{count:16});
    addPath([[CENTURY.bx+uz*8,4,CENTURY.bz-ux*8],[CENTURY.ax+uz*8,4,CENTURY.az-ux*8]],{count:16});
  }
  { // 环路（单向环行）
    const pts=[]; for(let k=0;k<40;k++){ const a=k/40*Math.PI*2;
      pts.push([RING.x+Math.cos(a)*(RING.r-3.4),4,RING.z+Math.sin(a)*(RING.r-3.4)]); }
    addPath(pts,{closed:true,count:16});
  }
  { // 大桥双向
    addPath([[BRIDGE_X-3.4,4,300],[BRIDGE_X-3.4,4,-368],[BRIDGE_X-3.4,10,-430],[BRIDGE_X-3.4,13,-500],
             [BRIDGE_X-3.4,13,-620],[BRIDGE_X-3.4,9,-700],[BRIDGE_X-3.4,4,-764]],{count:7});
    addPath([[BRIDGE_X+3.4,4,-764],[BRIDGE_X+3.4,9,-700],[BRIDGE_X+3.4,13,-620],[BRIDGE_X+3.4,13,-500],
             [BRIDGE_X+3.4,10,-430],[BRIDGE_X+3.4,4,-368],[BRIDGE_X+3.4,4,300]],{count:7});
  }
  { // 江面船只（双向航道）
    const up=RIVER.map(p=>[p[0]+52,0.4,p[1]]); addPath(up,{count:5,speed:[5,8],boat:true});
    const dn=RIVER.map(p=>[p[0]-52,0.4,p[1]]).reverse(); addPath(dn,{count:5,speed:[5,8],boat:true});
  }
  for(const p of paths){ p.len=0;
    const segs=p.n-(p.closed?0:1);
    for(let k=0;k<segs;k++){ const a=p.pts[k],b=p.pts[(k+1)%p.n]; p.len+=Math.hypot(b[0]-a[0],b[2]-a[2]); }
    for(let i=0;i<p.count;i++){
      const boat=p.boat;
      const hue=boat? [0.85,0.88,0.9] : [R(0.1,0.9),R(0.1,0.55),R(0.1,0.55)];
      if(boat&&rand()<0.5){hue[0]=0.7;hue[1]=0.15;hue[2]=0.12;}
      vehicles.push({p, s:R(0,p.len), v:R(p.speed[0],p.speed[1]), dir:1,
        w:boat?7:2.3, l:boat?26:4.6, h:boat?3.2:2.1, c:hue, boat});
    }
  }
}

const _M=new THREE.Matrix4(),_Q=new THREE.Quaternion(),_E=new THREE.Euler(),_S=new THREE.Vector3(1,1,1),_Pv=new THREE.Vector3();
function updateTraffic(dt){
  for(let i=0;i<vehicles.length;i++){ const v=vehicles[i];
    v.s=(v.s+v.v*dt)%v.p.len;
    const [x,y,z,yaw]=samplePath(v.p,v.s);
    _E.set(0,yaw,0); _Q.setFromEuler(_E); _Pv.set(x,y+v.h*0.55,z);
    _M.compose(_Pv,_Q,_S); carBody.setMatrixAt(i,_M);
    _Pv.set(x,y+v.h+v.h*0.35,z+(v.boat?-v.l*0.18:-v.l*0.06)*0); // 舱室随车局部前移
    const fwd=v.boat? -v.l*0.18 : v.l*0.1;
    _Pv.set(x+Math.sin(yaw)*fwd, y+v.h+v.h*0.35, z+Math.cos(yaw)*fwd);
    _M.compose(_Pv,_Q,_S); carCab.setMatrixAt(i,_M);
    _Pv.set(x+Math.sin(yaw)*(v.l/2+0.2), y+1.1, z+Math.cos(yaw)*(v.l/2+0.2));
    _M.compose(_Pv,_Q,_S); carLightF.setMatrixAt(i,_M);
    _Pv.set(x-Math.sin(yaw)*(v.l/2+0.2), y+1.1, z-Math.cos(yaw)*(v.l/2+0.2));
    _M.compose(_Pv,_Q,_S); carLightR.setMatrixAt(i,_M);
  }
  carBody.instanceMatrix.needsUpdate=true;
  carCab.instanceMatrix.needsUpdate=true;
  carLightF.instanceMatrix.needsUpdate=true;
  carLightR.instanceMatrix.needsUpdate=true;
}

function hAt(x,z){ const i=gidx(x,z); return i<0?4:hmap[i]; }
function updatePlayer(dt){
  const spd=(keys.ShiftLeft||keys.ShiftRight)?26:10.5;
  const fx=-Math.sin(player.yaw), fz=-Math.cos(player.yaw);
  const rx=Math.cos(player.yaw)*-1, rz=Math.sin(player.yaw);
  let mx=0,mz=0;
  if(keys.KeyW){mx+=fx;mz+=fz;} if(keys.KeyS){mx-=fx;mz-=fz;}
  if(keys.KeyA){mx+=rx;mz+=rz;} if(keys.KeyD){mx-=rx;mz-=rz;}
  const ml=Math.hypot(mx,mz)||1; mx=mx/ml*spd*dt; mz=mz/ml*spd*dt;
  if(player.fly){
    player.x=clamp(player.x+mx,-HW+6,HW-6); player.z=clamp(player.z+mz,-HW+6,HW-6);
    if(keys.Space) player.y+=spd*1.4*dt; if(keys.KeyC) player.y-=spd*1.4*dt;
    player.y=clamp(player.y,3,900); player.vy=0;
  } else {
    const feet=player.y-1.7;
    const nx=clamp(player.x+mx,-HW+6,HW-6), nz=clamp(player.z+mz,-HW+6,HW-6);
    const tryMove=(cx,cz)=>{ const h=hAt(cx,cz); return h>-2 && h-feet<1.25; };
    if(tryMove(nx,player.z)) player.x=nx;
    if(tryMove(player.x,nz)) player.z=nz;
    player.ground=hAt(player.x,player.z);
    player.vy-=16*dt;
    player.y+=player.vy*dt;
    const gy=player.ground+1.7;
    if(player.y<gy){ player.y=gy; player.vy=0; }
    if(player.y>gy+0.01&&player.vy===0){} // airborne handled by vy
    else player.y=lerp(player.y,gy,1-Math.pow(0.0001,dt));
  }
  camera.position.set(player.x,player.y,player.z);
  camera.rotation.set(0,0,0);
  camera.rotateY(player.yaw); camera.rotateX(player.pitch);
}

function applyTime(h,dt){
  const th=(h-6)/12*Math.PI;
  const el=Math.sin(th);
  const day=smooth(-0.06,0.3,el);
  const dusk=smooth(-0.12,0.02,el)*(1-smooth(0.02,0.32,el)); // 晨昏带
  const night=1-day;
  /* 太阳轨迹 */
  const az=th;
  const sd=new THREE.Vector3(Math.cos(az)*0.9,Math.max(Math.sin(th),-0.35),Math.sin(az)*0.55+0.25).normalize();
  sun.position.copy(orbit.target).addScaledVector(sd,1400);
  sun.target.position.copy(orbit.target);
  _sc.copy(sunDay).lerp(sunDusk,clamp(dusk*1.6,0,1));
  sun.color.copy(_sc);
  sun.intensity=day*2.7+0.02;
  moon.intensity=night*0.32;
  moon.position.copy(orbit.target).add(new THREE.Vector3(-500,800,-600));
  moon.target.position.copy(orbit.target);
  hemi.intensity=0.22+day*0.68;
  hemi.color.copy(_sky.copy(skyNight).lerp(skyDay,day));
  amb.intensity=0.12+day*0.28;
  /* 天空/雾 */
  _sky.copy(skyNight).lerp(skyDay,day);
  _sky.lerp(skyDusk,dusk*0.75);
  scene.background.copy(_sky);
  _fog.copy(fogNight).lerp(fogDay,day).lerp(fogDusk,dusk*0.6);
  scene.fog.color.copy(_fog);
  scene.fog.near=lerp(600,820,day); scene.fog.far=lerp(2100,2900,day);
  uNight.value=smooth(0.25,0.6,night);
  bloomPass.strength=0.32+uNight.value*0.38;
  clockEl.textContent=`${String(Math.floor(h)).padStart(2,'0')}:${String(Math.floor((h%1)*60)).padStart(2,'0')}`;
}

/* ================================================================
   12. 小地图
================================================================ */
const mm=document.getElementById('minimap'),mctx=mm.getContext('2d');
let mmBase=null;
function buildMinimap(){
  const c=document.createElement('canvas');c.width=MG/2;c.height=MG/2;
  const g=c.getContext('2d');const img=g.createImageData(MG/2,MG/2);
  for(let j=0;j<MG/2;j++)for(let i=0;i<MG/2;i++){
    const id=(j*2)*MG+i*2,cl=cls[id];let r=20,g2=26,b=34;
    if(cl===0){r=26;g2=66;b=104;} else if(cl===2){r=56;g2=62;b=70;}
    else if(cl===3){r=66;g2=70;b=78;} else if(cl===4){r=94;g2=86;b=66;}
    else if(cl===5){r=42;g2=76;b=48;} else if(cl===6){r=88;g2=82;b=70;}
    if(occ[id]&&cl!==0){r=150;g2=120;b=70;}
    const o=(j*(MG/2)+i)*4;img.data[o]=r;img.data[o+1]=g2;img.data[o+2]=b;img.data[o+3]=255;
  }
  g.putImageData(img,0,0);
  g.fillStyle='#ffd070';g.font='7px sans-serif';g.textAlign='center';
  const mm2=v=>(v+HW)/(2*HW)*(MG/2);
  const tag=(x,z,t)=>{g.fillRect(mm2(x)-1.5,mm2(z)-1.5,3,3);g.fillText(t,mm2(x),mm2(z)-3);};
  tag(28,-146,'上海中心');tag(-48,-166,'环球金融');tag(14,-74,'金茂');tag(-206,-196,'东方明珠');
  g.strokeStyle='rgba(140,190,240,.5)';g.strokeRect(0.5,0.5,MG/2-1,MG/2-1);
  mmBase=c;
}
function drawMinimap(){
  const s=mm.width; mctx.imageSmoothingEnabled=false;
  mctx.clearRect(0,0,s,s); mctx.drawImage(mmBase,0,0,s,s);
  const px=((mode==='fps'?player.x:camera.position.x)+HW)/(2*HW)*s;
  const pz=((mode==='fps'?player.z:camera.position.z)+HW)/(2*HW)*s;
  mctx.fillStyle='#62d0ff';mctx.strokeStyle='#062033';mctx.lineWidth=2;
  mctx.beginPath();mctx.arc(clamp(px,4,s-4),clamp(pz,4,s-4),4.5,0,7);mctx.fill();mctx.stroke();
  if(mode==='fps'){ mctx.strokeStyle='#aee4ff';mctx.beginPath();mctx.moveTo(px,pz);
    mctx.lineTo(px-Math.sin(player.yaw)*14,pz-Math.cos(player.yaw)*14);mctx.stroke(); }
}

/* ================================================================
   13. 生成流程
================================================================ */
async function generate(){
  await progress(0.02,'测绘黄浦江河湾…');
  await buildGround();
  await progress(0.4,'竖立地标塔楼…');
  shanghaiTower(28,-146); swfc(-48,-166); jinMao(14,-74);
  orientalPearl(-206,-196); aurora(-148,-64); ifcTwin(-160,-128); mall(-110,-218);
  await progress(0.5,'生长城市街区…');
  await buildDistricts();
  await progress(0.64,'架设越江大桥…');
  cableBridge(); footbridge();
  await buildWaterfront();
  await buildStreetDetail();
  buildClouds();
  await progress(0.8,'装配体素世界…');
  assembleScene(); buildMinimap();
  await progress(0.92,'唤醒车流与江船…');
  buildTraffic(); buildVehicleMeshes();
  await progress(1,'完成');
}

/* ================================================================
   14. 主循环
================================================================ */
const statEl=document.getElementById('fps-stat');
let last=performance.now(),fpsAcc=0,fpsN=0;
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(); const dt=Math.min((now-last)/1000,0.05); last=now;
  uTime.value+=dt;
  if(autoEl.checked){ hour=(hour+dt*24/300)%24; slider.value=hour; }
  applyTime(hour,dt);
  if(mode==='god') orbit.update(); else updatePlayer(dt);
  updateTraffic(dt);
  drawMinimap();
  if(useBloom) composer.render(); else renderer.render(scene,camera);
  fpsAcc+=dt;fpsN++;
  if(fpsAcc>0.5){ statEl.textContent=`${(fpsN/fpsAcc).toFixed(0)} FPS · ${(renderer.info.render.calls)} calls`;
    fpsAcc=0;fpsN=0; }
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
});

/* URL 参数：?h=时刻 &mode=fps &x= &z= &yaw= &cx=&cy=&cz=&tx=&ty=&tz= */
if(Q.get('x')) player.x=parseFloat(Q.get('x'));
if(Q.get('z')) player.z=parseFloat(Q.get('z'));
if(Q.get('yaw')) player.yaw=parseFloat(Q.get('yaw'));
if(Q.get('pitch')) player.pitch=parseFloat(Q.get('pitch'));
if(Q.get('cx')) camera.position.set(parseFloat(Q.get('cx')),parseFloat(Q.get('cy')),parseFloat(Q.get('cz')));
if(Q.get('tx')) orbit.target.set(parseFloat(Q.get('tx')),parseFloat(Q.get('ty')),parseFloat(Q.get('tz')));

generate().then(()=>{
  document.getElementById('loading').classList.add('done');
  player.y=hAt(player.x,player.z)+1.7; player.ground=hAt(player.x,player.z);
  if(Q.get('mode')==='fps') setMode('fps');
  animate();
});
