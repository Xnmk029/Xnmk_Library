<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoxelLujiazui · 陆家嘴体素数字沙盘</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #0a0a1a; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; color: #fff; }
  #canvas3d { display: block; width: 100vw; height: 100vh; }
  #ui {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    display: flex; flex-direction: column; gap: 10px;
    pointer-events: none;
  }
  #ui > * { pointer-events: auto; }
  .panel {
    background: rgba(10, 14, 30, 0.85);
    border: 1px solid rgba(100, 160, 255, 0.3);
    border-radius: 10px; padding: 12px 16px;
    backdrop-filter: blur(8px);
  }
  .panel h3 {
    font-size: 13px; font-weight: 600; color: #7ec8ff;
    margin-bottom: 8px; letter-spacing: 1px;
    text-transform: uppercase;
  }
  .mode-btn {
    display: block; width: 100%; padding: 8px 16px;
    background: rgba(40, 80, 160, 0.6); color: #c8e0ff;
    border: 1px solid rgba(100, 160, 255, 0.4);
    border-radius: 6px; cursor: pointer; font-size: 13px;
    transition: all 0.2s; text-align: left;
  }
  .mode-btn:hover { background: rgba(60, 120, 220, 0.7); }
  .mode-btn.active {
    background: rgba(80, 140, 255, 0.7);
    border-color: #7ec8ff; color: #fff;
    box-shadow: 0 0 12px rgba(100, 160, 255, 0.4);
  }
  .info-row {
    font-size: 11px; color: #9ab0d0; line-height: 1.6;
  }
  .info-row b { color: #7ec8ff; }
  #hud {
    position: fixed; bottom: 16px; right: 16px; z-index: 10;
    font-size: 11px; color: #9ab0d0; text-align: right;
    line-height: 1.7; pointer-events: none;
  }
  #hud b { color: #7ec8ff; }
  #loading {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: #0a0a1a; transition: opacity 0.6s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 48px; height: 48px; border: 3px solid rgba(100,160,255,0.2);
    border-top-color: #7ec8ff; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #crosshair {
    position: fixed; top: 50%; left: 50%; z-index: 9;
    transform: translate(-50%, -50%); pointer-events: none;
    display: none;
  }
  #crosshair.visible { display: block; }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: rgba(255,255,255,0.6);
  }
  #crosshair::before { width: 18px; height: 1px; left: -9px; top: -0.5px; }
  #crosshair::after { width: 1px; height: 18px; left: -0.5px; top: -9px; }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div></div>

<div id="ui">
  <div class="panel">
    <h3>VoxelLujiazui</h3>
    <div class="info-row">
      <b>上海陆家嘴 · 体素数字沙盘</b><br>
      三件套 · 黄浦江 · 双模式漫游
    </div>
  </div>
  <div class="panel">
    <h3>视角模式</h3>
    <button class="mode-btn active" id="btn-god" onclick="setMode('god')">🌐 上帝视角 · 轨道相机</button>
    <button class="mode-btn" id="btn-fp" onclick="setMode('fps')">🎮 第一人称 · 自由漫游</button>
  </div>
  <div class="panel" id="controls-panel">
    <h3>控制说明</h3>
    <div class="info-row" id="god-controls">
      <b>鼠标左键拖拽</b> · 环绕观察<br>
      <b>鼠标滚轮</b> · 缩放<br>
      <b>右键拖拽</b> · 平移
    </div>
    <div class="info-row" id="fps-controls" style="display:none">
      <b>W/A/S/D</b> · 前后左右移动<br>
      <b>鼠标</b> · 视角转向<br>
      <b>空格</b> · 跳跃<br>
      <b>Shift</b> · 疾走<br>
      <b>Esc</b> · 锁定/解锁鼠标
    </div>
  </div>
  <div class="panel">
    <h3>环境</h3>
    <button class="mode-btn" id="btn-day" onclick="toggleDayNight()" style="margin-bottom:6px">🌅 昼夜切换</button>
    <div class="info-row" id="env-info">当前：<b id="time-label">白天</b></div>
  </div>
</div>

<div id="crosshair">+</div>

<div id="hud">
  <div id="fps-counter">-- FPS</div>
  <div id="pos-info">X: -- &nbsp; Z: --</div>
  <div style="margin-top:4px; color:#5a7090">VoxelLujiazui v1.0</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

// ─── Constants ───────────────────────────────────────────────
const VOXEL = 4; // world unit per voxel
const WORLD_W = 120; // grid width (voxels)
const WORLD_D = 120; // grid depth (voxels)
const WATER_Y = 8;
const GROUND_Y = 0;
const SKY_H = 60;

// Lujiazui real-world approximate coordinates (voxel grid)
// Center of Lujiazui at (60, 60)
const CX = 60, CZ = 60;

// ─── Scene Setup ─────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2a4a);
scene.fog = new THREE.FogExp2(0x1a2a4a, 0.004);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 2000);

// ─── Lights ──────────────────────────────────────────────────
let sunLight, hemiLight, ambientLight;
let dayNight = 0; // 0 = day, 1 = night

function buildLights(t) {
  // Remove old
  if (sunLight) scene.remove(sunLight);
  if (hemiLight) scene.remove(hemiLight);
  if (ambientLight) scene.remove(ambientLight);

  const sunColor = new THREE.Color().lerpColors(
    new THREE.Color(0xffeedd), new THREE.Color(0x8899cc), t
  );
  const skyColor = new THREE.Color().lerpColors(
    new THREE.Color(0x88bbff), new THREE.Color(0x111133), t
  );
  const groundColor = new THREE.Color().lerpColors(
    new THREE.Color(0x224422), new THREE.Color(0x050510), t
  );
  const ambColor = new THREE.Color().lerpColors(
    new THREE.Color(0x446688), new THREE.Color(0x111122), t
  );

  sunLight = new THREE.DirectionalLight(sunColor, t < 0.5 ? 1.4 : 0.3);
  sunLight.position.set(40, 55, 30);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.set(2048, 2048);
  sunLight.shadow.camera.left = -100;
  sunLight.shadow.camera.right = 100;
  sunLight.shadow.camera.top = 100;
  sunLight.shadow.camera.bottom = -100;
  scene.add(sunLight);

  hemiLight = new THREE.HemisphereLight(skyColor, groundColor, t < 0.5 ? 0.6 : 0.15);
  scene.add(hemiLight);

  ambientLight = new THREE.AmbientLight(ambColor, t < 0.5 ? 0.3 : 0.05);
  scene.add(ambientLight);

  // Night: add street lights
  if (t > 0.5) {
    streetLights.forEach(sl => sl.intensity = 1.5);
  } else {
    streetLights.forEach(sl => sl.intensity = 0);
  }
}

// ─── Controls ────────────────────────────────────────────────
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(CX * VOXEL, 20, CZ * VOXEL);
orbit.enableDamping = true;
orbit.dampingFactor = 0.08;
orbit.minDistance = 20;
orbit.maxDistance = 400;
orbit.maxPolarAngle = Math.PI * 0.48;
orbit.update();

const pointer = new PointerLockControls(camera, document.body);

let mode = 'god';

// ─── Voxel Geometry Cache ────────────────────────────────────
const matConcrete = new THREE.MeshStandardMaterial({ color: 0x888899, roughness: 0.9, metalness: 0.05 });
const matGlass = new THREE.MeshPhysicalMaterial({ color: 0x4488cc, roughness: 0.05, metalness: 0.9, transparent: true, opacity: 0.65, transmission: 0.4, thickness: 0.5 });
const matRoad = new THREE.MeshStandardMaterial({ color: 0x444455, roughness: 0.95 });
const matRoadLine = new THREE.MeshStandardMaterial({ color: 0xeeeecc, roughness: 0.8, emissive: 0x222200 });
const matGrass = new THREE.MeshStandardMaterial({ color: 0x336633, roughness: 0.95 });
const matWater = new THREE.MeshPhysicalMaterial({ color: 0x225588, roughness: 0.1, metalness: 0.1, transparent: true, opacity: 0.85, transmission: 0.3, thickness: 1.0 });
const matBrick = new THREE.MeshStandardMaterial({ color: 0x996644, roughness: 0.9 });
const matLight = new THREE.MeshBasicMaterial({ color: 0xffffcc });
const matCar = new THREE.MeshStandardMaterial({ color: 0xff4444, roughness: 0.6, emissive: 0x330000 });
const matCarWhite = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6, emissive: 0x111111 });

function makeBox(w, h, d, mat) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function addBox(x, y, z, w, h, d, mat) {
  const m = makeBox(w, h, d, mat);
  m.position.set(x + w / 2, y + h / 2, z + d / 2);
  scene.add(m);
  return m;
}

// ─── Ground ──────────────────────────────────────────────────
addBox(0, GROUND_Y, 0, WORLD_W * VOXEL, 1, WORLD_D * VOXEL, matGrass);

// ─── Huangpu River ───────────────────────────────────────────
// River runs roughly north-south, offset ~20 voxels west of center
const riverX = 18;
const riverW = 12;
const riverLen = WORLD_D;
const waterGroup = new THREE.Group();
for (let z = 0; z < riverLen; z++) {
  const w = makeBox(riverW * VOXEL, 1.5, VOXEL, matWater);
  w.position.set(riverX * VOXEL + riverW * VOXEL / 2, WATER_Y - 0.75, z * VOXEL + VOXEL / 2);
  waterGroup.add(w);
}
scene.add(waterGroup);

// River banks (concrete)
for (let z = 0; z < riverLen; z++) {
  addBox(riverX * VOXEL - 2, GROUND_Y, z * VOXEL, 2, 2, VOXEL, matConcrete);
  addBox((riverX + riverW) * VOXEL, GROUND_Y, z * VOXEL, 2, 2, VOXEL, matConcrete);
}

// Bund waterfront walkway
for (let z = 0; z < riverLen; z++) {
  addBox(riverX * VOXEL - 10, GROUND_Y + 1, z * VOXEL, 8, 0.5, VOXEL, matBrick);
}

// ─── Road Network ────────────────────────────────────────────
// Main east-west boulevard through Lujiazui
const mainRdY = GROUND_Y + 0.05;
function addRoad(x, z, w, d, horiz = true) {
  if (horiz) addBox(x, mainRdY, z, w, 0.15, d, matRoad);
  else addBox(x, mainRdY, z, w, 0.15, d, matRoad);
}

// Century Avenue (世纪大道) - main north-south
addRoad(CX * VOXEL - 6, 0, 12, WORLD_D * VOXEL);
// Lujiazui Ring Road
addRoad(0, CZ * VOXEL - 6, WORLD_W * VOXEL, 12);
// Smaller streets
addRoad(CX * VOXEL - 18, 0, 4, WORLD_D * VOXEL);
addRoad(CX * VOXEL + 6, 0, 4, WORLD_D * VOXEL);
addRoad(0, CZ * VOXEL - 18, WORLD_W * VOXEL, 4);
addRoad(0, CZ * VOXEL + 6, WORLD_W * VOXEL, 4);

// Road markings
function addLine(x, z, w, d, horiz = true) {
  if (horiz) addBox(x, mainRdY + 0.1, z, w, 0.04, d, matRoadLine);
  else addBox(x, mainRdY + 0.1, z, w, 0.04, d, matRoadLine);
}
addLine(CX * VOXEL - 6, 0, 12, WORLD_D * VOXEL);
addLine(0, CZ * VOXEL - 6, WORLD_W * VOXEL, 12);

// ─── Buildings ───────────────────────────────────────────────
// All positions in voxel coordinates, scaled by VOXEL

// Shanghai Tower (上海中心大厦) - tallest, twisted form
function buildShanghaiTower(cx, cz) {
  const base = 10;
  const h = 55;
  const floors = 11;
  for (let f = 0; f < floors; f++) {
    const fh = h / floors;
    const scale = 1 - (f / floors) * 0.35;
    const twist = f * 0.15;
    const bw = base * VOXEL * scale;
    const bd = base * VOXEL * scale;
    const group = new THREE.Group();
    const box = makeBox(bw, fh, bd, matGlass);
    box.position.set(0, fh / 2, 0);
    box.rotation.y = twist;
    group.add(box);
    // Core
    const core = makeBox(2 * VOXEL, fh, 2 * VOXEL, matConcrete);
    core.position.set(0, fh / 2, 0);
    group.add(core);
    group.position.set(cx * VOXEL - bw / 2, GROUND_Y, cz * VOXEL - bd / 2);
    scene.add(group);
  }
}

// SWFC (环球金融中心) - bottle opener shape
function buildSWFC(cx, cz) {
  const w = 8, d = 8;
  const h = 48;
  // Base
  addBox(cx * VOXEL - w * VOXEL / 2, GROUND_Y, cz * VOXEL - d * VOXEL / 2, w * VOXEL, 3, d * VOXEL, matConcrete);
  // Tower shaft
  addBox(cx * VOXEL - 3 * VOXEL, GROUND_Y + 3, cz * VOXEL - 3 * VOXEL, 6 * VOXEL, h - 8, 6 * VOXEL, matGlass);
  // Top cut-out (bottle opener)
  addBox(cx * VOXEL - 4 * VOXEL, GROUND_Y + h - 8, cz * VOXEL - 4 * VOXEL, 8 * VOXEL, 3, 8 * VOXEL, matGlass);
  addBox(cx * VOXEL - 5 * VOXEL, GROUND_Y + h - 5, cz * VOXEL - 5 * VOXEL, 10 * VOXEL, 3, 10 * VOXEL, matConcrete);
}

// Jin Mao Tower (金茂大厦) - stepped pagoda
function buildJinMao(cx, cz) {
  const h = 42;
  const steps = 10;
  const stepH = h / steps;
  for (let i = 0; i < steps; i++) {
    const s = 1 - (i / steps) * 0.7;
    const bw = 8 * VOXEL * s;
    const bd = 8 * VOXEL * s;
    const mat = i % 2 === 0 ? matGlass : matConcrete;
    addBox(cx * VOXEL - bw / 2, GROUND_Y + i * stepH, cz * VOXEL - bd / 2, bw, stepH, bd, mat);
  }
  // Spire
  addBox(cx * VOXEL - 1.5 * VOXEL, GROUND_Y + h, cz * VOXEL - 1.5 * VOXEL, 3 * VOXEL, 8, 3 * VOXEL, matConcrete);
}

// Bank of China Tower
function buildBOC(cx, cz) {
  const h = 32;
  addBox(cx * VOXEL - 6 * VOXEL, GROUND_Y, cz * VOXEL - 6 * VOXEL, 12 * VOXEL, h, 12 * VOXEL, matGlass);
  // Diagonal cuts
  const cut1 = makeBox(8 * VOXEL, h, 0.5, matConcrete);
  cut1.position.set(cx * VOXEL, GROUND_Y + h / 2, cz * VOXEL - 5 * VOXEL);
  cut1.rotation.z = 0.3;
  scene.add(cut1);
}

// Shanghai World Financial Center (already SWFC above)
// Additional skyscrapers
function buildSkyscraper(cx, cz, w, d, h, color = 0x5588cc) {
  const m = new THREE.MeshPhysicalMaterial({ color, roughness: 0.1, metalness: 0.9, transparent: true, opacity: 0.7, transmission: 0.3 });
  addBox(cx * VOXEL - w * VOXEL / 2, GROUND_Y, cz * VOXEL - d * VOXEL / 2, w * VOXEL, h, d * VOXEL, m);
}

function buildOfficeTower(cx, cz, w, d, h) {
  addBox(cx * VOXEL - w * VOXEL / 2, GROUND_Y, cz * VOXEL - d * VOXEL / 2, w * VOXEL, h, d * VOXEL, matGlass);
  // Concrete structural grid
  for (let i = 0; i < 4; i++) {
    const xOff = -w * VOXEL / 2 + i * w * VOXEL / 3;
    addBox(xOff, GROUND_Y, cz * VOXEL - d * VOXEL / 2, 0.5, h, d * VOXEL, matConcrete);
  }
}

// ─── Lujiazui Layout ─────────────────────────────────────────
// "Three Sisters" cluster near the river bend
// Shanghai Tower: (52, 55)
// SWFC: (58, 55)
// Jin Mao: (64, 55)
// BOC: (70, 55)

buildShanghaiTower(52, 55);
buildSWFC(58, 55);
buildJinMao(64, 55);
buildBOC(70, 55);

// Additional towers in the financial district
buildSkyscraper(48, 62, 6, 6, 28, 0x336699);
buildSkyscraper(76, 62, 6, 6, 25, 0x664488);
buildSkyscraper(44, 48, 5, 5, 20, 0x4477aa);
buildSkyscraper(80, 48, 5, 5, 18, 0x556677);
buildSkyscraper(50, 42, 7, 7, 22, 0x335577);
buildSkyscraper(74, 42, 7, 7, 20, 0x446688);
buildSkyscraper(42, 70, 4, 4, 15, 0x667788);
buildSkyscraper(86, 70, 4, 4, 14, 0x556677);
buildSkyscraper(55, 35, 5, 5, 16, 0x334466);
buildSkyscraper(69, 35, 5, 5, 17, 0x445577);

// Mid-rise office buildings
buildOfficeTower(38, 55, 4, 4, 12);
buildOfficeTower(88, 55, 4, 4, 10);
buildOfficeTower(46, 38, 3, 3, 8);
buildOfficeTower(78, 38, 3, 3, 8);
buildOfficeTower(35, 65, 3, 3, 7);
buildOfficeTower(91, 65, 3, 3, 7);

// Residential towers (slightly further out)
buildSkyscraper(25, 50, 5, 5, 14, 0x8899aa);
buildSkyscraper(100, 50, 5, 5, 13, 0x778899);
buildSkyscraper(25, 70, 4, 4, 10, 0x99aabb);
buildSkyscraper(100, 70, 4, 4, 10, 0x8899aa);
buildSkyscraper(25, 30, 4, 4, 9, 0xaabbcc);
buildSkyscraper(100, 30, 4, 4, 9, 0x99aabb);

// ─── Street Lights ───────────────────────────────────────────
const streetLights = [];
const streetLightPositions = [
  [50, 55], [60, 55], [70, 55], [55, 60], [65, 60],
  [50, 45], [70, 45], [40, 55], [80, 55], [55, 50], [65, 50],
  [30, 55], [90, 55], [55, 70], [65, 70], [30, 40], [90, 40],
];
for (const [sx, sz] of streetLightPositions) {
  const pole = makeBox(0.6, 6, 0.6, matConcrete);
  pole.position.set(sx * VOXEL, GROUND_Y + 3, sz * VOXEL);
  scene.add(pole);

  const bulb = makeBox(1.5, 1.5, 1.5, matLight);
  bulb.position.set(sx * VOXEL, GROUND_Y + 9, sz * VOXEL);
  bulb.emissive = 0xffffcc;
  bulb.emissiveIntensity = 0;
  scene.add(bulb);

  const pointLight = new THREE.PointLight(0xffffcc, 0, 12);
  pointLight.position.set(sx * VOXEL, GROUND_Y + 9, sz * VOXEL);
  scene.add(pointLight);
  streetLights.push(pointLight);
}

// ─── Cars ────────────────────────────────────────────────────
const cars = [];
const carPositions = [
  { x: 40, z: 55, dir: 1, speed: 0.08 },
  { x: 80, z: 55, dir: -1, speed: 0.06 },
  { x: 60, z: 40, dir: 1, speed: 0.07 },
  { x: 60, z: 70, dir: -1, speed: 0.09 },
  { x: 30, z: 65, dir: 1, speed: 0.05 },
  { x: 90, z: 65, dir: -1, speed: 0.06 },
];
for (const cp of carPositions) {
  const group = new THREE.Group();
  const body = makeBox(2.4, 0.8, 1.2, matCar);
  body.position.set(0, 0.4, 0);
  group.add(body);
  const roof = makeBox(1.6, 0.5, 1.0, matCarWhite);
  roof.position.set(0, 1.0, 0);
  group.add(roof);
  group.position.set(cp.x * VOXEL, GROUND_Y + 0.5, cp.z * VOXEL);
  scene.add(group);
  cars.push({ group, ...cp });
}

// ─── Trees / Greenery ────────────────────────────────────────
const treeMat = new THREE.MeshStandardMaterial({ color: 0x225511, roughness: 0.95 });
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x553311, roughness: 0.9 });
const treePositions = [
  [30, 30], [35, 30], [40, 30], [80, 30], [85, 30], [90, 30],
  [30, 80], [35, 80], [40, 80], [80, 80], [85, 80], [90, 80],
  [20, 50], [25, 50], [95, 50], [100, 50],
  [20, 60], [25, 60], [95, 60], [100, 60],
  [30, 45], [35, 45], [85, 45], [90, 45],
  [30, 65], [35, 65], [85, 65], [90, 65],
];
for (const [tx, tz] of treePositions) {
  addBox(tx * VOXEL, GROUND_Y, tz * VOXEL, 1.2, 3, 1.2, trunkMat);
  // Canopy (voxel cluster)
  for (let dy = 0; dy < 3; dy++) {
    for (let dx = -2; dx <= 2; dx++) {
      for (let dz = -2; dz <= 2; dz++) {
        if (Math.abs(dx) + Math.abs(dy) + Math.abs(dz) <= 4) {
          addBox(tx * VOXEL + dx * VOXEL, GROUND_Y + 3 + dy, tz * VOXEL + dz * VOXEL, VOXEL, VOXEL, VOXEL, treeMat);
        }
      }
    }
  }
}

// ─── Sky / Clouds ────────────────────────────────────────────
const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, transparent: true, opacity: 0.7 });
const clouds = [];
for (let i = 0; i < 20; i++) {
  const group = new THREE.Group();
  const cx2 = Math.random() * WORLD_W * VOXEL;
  const cz2 = Math.random() * WORLD_D * VOXEL;
  const cy = 35 + Math.random() * 15;
  for (let j = 0; j < 5; j++) {
    const c = makeBox(VOXEL * 2, VOXEL, VOXEL * 2, cloudMat);
    c.position.set((Math.random() - 0.5) * 8, j * VOXEL * 0.8, (Math.random() - 0.5) * 8);
    group.add(c);
  }
  group.position.set(cx2, cy, cz2);
  scene.add(group);
  clouds.push(group);
}

// ─── Skybox ──────────────────────────────────────────────────
const skyGeo = new THREE.SphereGeometry(600, 32, 32);
const skyMat = new THREE.MeshBasicMaterial({
  color: 0x1a3a6a, side: THREE.BackSide
});
const sky = new THREE.Mesh(skyGeo, skyMat);
scene.add(sky);

// ─── Mode Switching ──────────────────────────────────────────
window.setMode = function(m) {
  mode = m;
  const btnGod = document.getElementById('btn-god');
  const btnFp = document.getElementById('btn-fp');
  const crosshair = document.getElementById('crosshair');
  const godCtrl = document.getElementById('god-controls');
  const fpCtrl = document.getElementById('fps-controls');

  if (m === 'god') {
    btnGod.classList.add('active');
    btnFp.classList.remove('active');
    crosshair.classList.remove('visible');
    godCtrl.style.display = 'block';
    fpCtrl.style.display = 'none';
    // Switch from pointer lock to orbit
    pointer.unlock();
    // Restore camera position
    camera.position.set(CX * VOXEL + 80, 55, CZ * VOXEL + 80);
    orbit.target.set(CX * VOXEL, 20, CZ * VOXEL);
    orbit.enabled = true;
  } else {
    btnFp.classList.add('active');
    btnGod.classList.remove('active');
    crosshair.classList.add('visible');
    godCtrl.style.display = 'none';
    fpCtrl.style.display = 'block';
    orbit.enabled = false;
    // Position camera at street level
    camera.position.set(CX * VOXEL, 6, CZ * VOXEL);
    pointer.lock();
  }
};

window.toggleDayNight = function() {
  dayNight = dayNight < 0.5 ? 1 : 0;
  document.getElementById('time-label').textContent = dayNight < 0.5 ? '白天' : '夜晚';
  buildLights(dayNight);
  // Update sky
  skyMat.color.set(dayNight < 0.5 ? 0x1a3a6a : 0x050510);
  scene.fog.color.set(dayNight < 0.5 ? 0x1a2a4a : 0x050510);
  scene.fog.density = dayNight < 0.5 ? 0.004 : 0.008;
};

// ─── Pointer Lock Events ─────────────────────────────────────
pointer.addEventListener('lock', () => {});
pointer.addEventListener('unlock', () => {
  if (mode === 'fps') {
    // Return to god view when unlocked
    setMode('god');
  }
});

// ─── Resize ──────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── FPS Counter ─────────────────────────────────────────────
let frameCount = 0, lastFpsTime = performance.now();
const fpsEl = document.getElementById('fps-counter');
const posEl = document.getElementById('pos-info');

// ─── Animation Loop ──────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.getElapsedTime();

  // FPS
  frameCount++;
  if (t - lastFpsTime > 0.5) {
    fpsEl.textContent = Math.round(frameCount / (t - lastFpsTime)) + ' FPS';
    frameCount = 0;
    lastFpsTime = t;
  }

  // Position HUD
  posEl.textContent = `X: ${camera.position.x.toFixed(0)} &nbsp; Z: ${camera.position.z.toFixed(0)}`;

  // Controls
  if (mode === 'god') {
    orbit.update();
  }

  // Water wave animation
  waterGroup.children.forEach((w, i) => {
    const z = w.position.z;
    const wave = Math.sin(t * 1.5 + z * 0.08) * 0.15 + Math.sin(t * 0.8 + z * 0.05 + i) * 0.08;
    w.position.y = WATER_Y - 0.75 + wave;
  });

  // Car movement
  for (const car of cars) {
    car.group.position.z += car.speed * VOXEL * car.dir;
    if (car.dir > 0 && car.group.position.z > (WORLD_D + 5) * VOXEL) car.group.position.z = -5 * VOXEL;
    if (car.dir < 0 && car.group.position.z < -5 * VOXEL) car.group.position.z = (WORLD_D + 5) * VOXEL;
  }

  // Cloud drift
  clouds.forEach(c => {
    c.position.x += dt * 2;
    if (c.position.x > WORLD_W * VOXEL + 50) c.position.x = -50;
  });

  // Night light breathing
  if (dayNight > 0.5) {
    const breathe = 0.8 + Math.sin(t * 2) * 0.2;
    streetLights.forEach(sl => { sl.intensity = 1.5 * breathe; });
  }

  renderer.render(scene, camera);
}

// ─── Start ───────────────────────────────────────────────────
buildLights(0);

// Hide loading
setTimeout(() => {
  document.getElementById('loading').classList.add('hidden');
}, 500);

animate();

console.log('VoxelLujiazui ready. God view: drag to orbit, scroll to zoom. Press FPS mode button to explore streets.');
</script>
