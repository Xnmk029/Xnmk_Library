<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>低多边形动态自行车传动展示台 · Low-poly Bicycle Drivetrain</title>
<style>
  :root {
    --bg: #0e1220;
    --panel: rgba(18, 24, 40, 0.82);
    --panel-border: rgba(120, 180, 255, 0.22);
    --accent: #4fd1ff;
    --accent2: #ffd23f;
    --text: #eaf2ff;
    --dim: #8fa3c0;
    --good: #57e6a2;
    --mono: "SFMono-Regular", "Consolas", "Menlo", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  .panel {
    position: fixed;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    z-index: 10;
  }

  /* ---- HUD (top-left) ---- */
  #hud { top: 20px; left: 20px; padding: 18px 20px; min-width: 232px; }
  #hud .brand {
    font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--accent); margin-bottom: 4px; font-weight: 600;
  }
  #hud .title { font-size: 15px; font-weight: 700; line-height: 1.35; margin-bottom: 14px; }
  .gear-row { display: flex; align-items: baseline; gap: 6px; margin-bottom: 6px; }
  .gear-row .lbl { font-size: 12px; color: var(--dim); margin-right: 4px; }
  #gearNum { font-size: 46px; font-weight: 800; font-family: var(--mono); color: var(--accent2); line-height: 1; }
  .gear-sep { font-size: 26px; color: var(--dim); font-family: var(--mono); }
  #gearTotal { font-size: 26px; color: var(--dim); font-family: var(--mono); }
  #ratioText { font-size: 13px; color: var(--text); font-family: var(--mono); margin-bottom: 8px; }
  #ratioText b { color: var(--accent2); }
  #motorText { font-size: 12px; font-weight: 600; padding: 5px 9px; border-radius: 20px; display: inline-block; }
  #motorText.on { color: #042b18; background: var(--good); }
  #motorText.off { color: #ffe9e0; background: #b0523a; }

  /* ---- Spec (top-right) ---- */
  #spec { top: 20px; right: 20px; padding: 16px 18px; min-width: 220px; font-family: var(--mono); }
  #spec .h { font-size: 10px; letter-spacing: 2px; color: var(--accent); margin-bottom: 10px; font-weight: 700; }
  #spec table { width: 100%; border-collapse: collapse; font-size: 12px; }
  #spec td { padding: 4px 0; }
  #spec td:first-child { color: var(--dim); }
  #spec td:last-child { text-align: right; color: var(--text); }
  #spec td b { color: var(--accent2); font-weight: 700; }

  /* ---- Controls (bottom-center) ---- */
  #controls {
    bottom: 20px; left: 50%; transform: translateX(-50%);
    padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 9px;
    align-items: center; justify-content: center; max-width: 94vw;
  }
  button {
    font-family: inherit; font-size: 13px; font-weight: 600;
    color: var(--text); background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 10px;
    padding: 9px 14px; cursor: pointer; transition: all .14s ease;
    white-space: nowrap; user-select: none;
  }
  button:hover { background: rgba(79,209,255,0.16); border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); color: #04121c; border-color: transparent; }
  button.primary:hover { background: #7cdfff; }
  button.accent { background: var(--accent2); color: #1c1500; border-color: transparent; }
  button.accent:hover { background: #ffdf6b; }
  button.ghost { background: transparent; }
  button.toggle.on { background: rgba(79,209,255,0.28); border-color: var(--accent); }
  .sep { width: 1px; height: 22px; background: rgba(255,255,255,0.16); }

  #hint {
    position: fixed; bottom: 82px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: var(--dim); letter-spacing: 1px; z-index: 9;
    text-align: center; pointer-events: none;
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud" class="panel">
  <div class="brand">NPR · Low-poly Display</div>
  <div class="title">低多边形动态自行车<br>传动展示台</div>
  <div class="gear-row">
    <span class="lbl">Gear</span>
    <span id="gearNum">3</span>
    <span class="gear-sep">/</span>
    <span id="gearTotal">7</span>
  </div>
  <div id="ratioText">齿比 <b id="ratioVal">2.11</b> · <span id="ratioDetail">40 / 19</span></div>
  <span id="motorText" class="on">● 电机运行中</span>
</div>

<div id="spec" class="panel">
  <div class="h">传动规格 · SPEC</div>
  <table>
    <tr><td>牙盘齿数</td><td id="specRing">40 T</td></tr>
    <tr><td>飞轮齿数</td><td id="specSprocket">19 T</td></tr>
    <tr><td>当前齿比</td><td><b id="specRatio">2.11</b></td></tr>
    <tr><td>链条节数</td><td id="specChain">112</td></tr>
    <tr><td>帧率 FPS</td><td id="specFps">--</td></tr>
    <tr><td>Draw calls</td><td id="specDc">--</td></tr>
    <tr><td>三角形</td><td id="specTri">--</td></tr>
  </table>
</div>

<div id="hint">拖拽旋转 · 滚轮缩放 · 右键平移 · 空格=启停 · ↑/↓=换挡</div>

<div id="controls" class="panel">
  <button id="btnMotor" class="primary">⏸ 停止电机</button>
  <span class="sep"></span>
  <button id="btnDown" class="accent">◀ 降挡</button>
  <button id="btnUp" class="accent">升挡 ▶</button>
  <span class="sep"></span>
  <button id="btnReset" class="ghost">↺ 重置</button>
  <button id="btnFront" class="ghost cam">前视</button>
  <button id="btnSide" class="ghost cam">侧视</button>
  <button id="btnTop" class="ghost cam">俯视</button>
  <button id="btnClose" class="ghost cam">特写</button>
  <span class="sep"></span>
  <button id="btnPixel" class="toggle">▦ 像素化</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutlinePass } from 'three/addons/postprocessing/OutlinePass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============================================================
 * 常量与配置
 * ============================================================ */
const PITCH = 0.5;                 // 链条节距（单位）
const CHAINRING_TEETH = 40;        // 牙盘齿数
const SPROCKET_TEETH = [11, 13, 15, 17, 19, 22, 25]; // 飞轮 7 片（index 0 = 最小 11T）
const NUM_GEARS = SPROCKET_TEETH.length; // 7
const L = 20;                      // 中轴到后轴水平距离
const RG = 0.32;                   // 导轮/张紧轮半径
const SPROCKET_SPACING = 0.22;     // 飞轮轴向间距
const ARC_SAMPLES = 44;            // 链条路径圆弧采样
const LINE_SAMPLES = 16;           // 链条路径直线采样
const N_LINKS = 112;               // 链条节数
const MOTOR_SPEED = 1.25;          // 牙盘角速度 rad/s

const R1 = CHAINRING_TEETH * PITCH / (2 * Math.PI);
const R2_LIST = SPROCKET_TEETH.map(t => t * PITCH / (2 * Math.PI));
const R2_MIN = R2_LIST[0];

/* 挡位 -> 飞轮片（挡位 1 = 最大飞轮片 25T，挡位 7 = 最小飞轮片 11T） */
function sprocketIndexForGear(g) { return NUM_GEARS - g; }        // gear1->6, gear7->0
function r2ForGear(g) { return R2_LIST[sprocketIndexForGear(g)]; }
function zForGear(g) { return (sprocketIndexForGear(g) - 3) * SPROCKET_SPACING; }

/* ============================================================
 * 渲染器 / 场景 / 相机
 * ============================================================ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1420);
scene.fog = new THREE.Fog(0x0d1420, 60, 130);

const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(30, 4, 30);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(9, -1.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 8;
controls.maxDistance = 90;
controls.maxPolarAngle = Math.PI * 0.82;
controls.update();

/* 环境反射（用于透明亚克力高光） */
try {
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environment = envTex;
  pmrem.dispose();
} catch (e) {
  console.warn('RoomEnvironment 不可用，使用默认光照', e);
}

/* ============================================================
 * 灯光
 * ============================================================ */
scene.add(new THREE.HemisphereLight(0xcfe4ff, 0x3a4256, 0.85));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.25);
keyLight.position.set(18, 28, 24);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xbfe0ff, 0.45);
fillLight.position.set(-16, -4, 18);
scene.add(fillLight);
const rimLight = new THREE.DirectionalLight(0xffffff, 0.9);
rimLight.position.set(6, 2, -26);
scene.add(rimLight);

/* ============================================================
 * NPR 赛璐璐材质（toon 渐变映射 = cel shading + 色调分离）
 * ============================================================ */
function makeGradientMap() {
  // 4 级亮度阶梯：暗部 -> 中间调 -> 高光，实现高对比明暗分区
  const steps = [0.32, 0.52, 0.78, 1.0];
  const data = new Uint8Array(steps.length * 4);
  for (let i = 0; i < steps.length; i++) {
    const v = Math.round(255 * steps[i]);
    data[i * 4] = v; data[i * 4 + 1] = v; data[i * 4 + 2] = v; data[i * 4 + 3] = 255;
  }
  const tex = new THREE.DataTexture(data, steps.length, 1, THREE.RGBAFormat);
  tex.minFilter = THREE.NearestFilter;
  tex.magFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}
const GRADIENT_MAP = makeGradientMap();

function toon(color, extra) {
  const m = new THREE.MeshToonMaterial(Object.assign({ color: color, gradientMap: GRADIENT_MAP }, extra || {}));
  return m;
}

/* ============================================================
 * 辅助：两圆外公切线
 * ============================================================ */
function extTangents(ax, ay, ra, bx, by, rb) {
  const dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy);
  const phi = Math.atan2(dy, dx);
  const c = Math.max(-1, Math.min(1, (ra - rb) / d));
  const delta = Math.acos(c);
  return [phi + delta, phi - delta].map(ang => ({
    ang,
    pA: { x: ax + ra * Math.cos(ang), y: ay + ra * Math.sin(ang) },
    pB: { x: bx + rb * Math.cos(ang), y: by + rb * Math.sin(ang) }
  }));
}
function cwSpan(a, b) { let s = a - b; s = ((s % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI); return s; }

/* ============================================================
 * 链条闭合路径（随当前飞轮半径 r2 与轴向 z 变化）
 * ============================================================ */
const SOLS = [0, 0, 1, 0];   // 每组圆对的切线解（上/下）
const WRAPS = [0, 0, 0, 1];  // 每圆包裹方向（0=顺时针,1=逆时针）
function buildChainPath(r2, zTarget) {
  const C1 = { x: 0, y: 0 };
  const C2 = { x: L, y: 0 };
  const guide = { x: L - (1.6 + 1.2 * (r2 - R2_MIN)), y: -(r2 + 2.0) };
  const tens  = { x: L - (4.6 + 3.2 * (r2 - R2_MIN)), y: -(r2 + 4.2) };
  const centers = [C1, C2, guide, tens];
  const radii = [R1, r2, RG, RG];
  const zs = [0, zTarget, zTarget, zTarget]; // 牙盘侧 z=0，后拨/飞轮侧 z=zTarget
  const pairs = [];
  for (let i = 0; i < 4; i++) {
    pairs.push(extTangents(centers[i].x, centers[i].y, radii[i], centers[(i + 1) % 4].x, centers[(i + 1) % 4].y, radii[(i + 1) % 4]));
  }
  const pts = [];
  for (let i = 0; i < 4; i++) {
    const entry = pairs[(i + 3) % 4][SOLS[(i + 3) % 4]].ang;
    const exit = pairs[i][SOLS[i]].ang;
    const ccw = WRAPS[i] === 1;
    const span = ccw ? cwSpan(exit, entry) : cwSpan(entry, exit);
    const n = Math.max(2, Math.round(span / (2 * Math.PI) * ARC_SAMPLES));
    for (let k = 0; k <= n; k++) {
      const a = ccw ? entry + span * k / n : entry - span * k / n;
      pts.push(new THREE.Vector3(
        centers[i].x + radii[i] * Math.cos(a),
        centers[i].y + radii[i] * Math.sin(a),
        zs[i]
      ));
    }
    // 直线段：从该圆出口到下一圆入口，z 线性过渡
    const pB = pairs[i][SOLS[i]].pB;
    const z0 = zs[i], z1 = zs[(i + 1) % 4];
    const start = pts[pts.length - 1].clone();
    for (let k = 1; k <= LINE_SAMPLES; k++) {
      const t = k / LINE_SAMPLES;
      pts.push(new THREE.Vector3(
        start.x + (pB.x - start.x) * t,
        start.y + (pB.y - start.y) * t,
        z0 + (z1 - z0) * t
      ));
    }
  }
  // 去除圆交界处的重复点（消除零长度线段）
  const dedup = [];
  for (const p of pts) {
    const last = dedup[dedup.length - 1];
    if (!last || p.distanceTo(last) > 1e-9) dedup.push(p);
  }
  const cum = [0];
  for (let i = 0; i < dedup.length - 1; i++) cum.push(cum[cum.length - 1] + dedup[i].distanceTo(dedup[i + 1]));
  return { pts: dedup, cum, total: cum[cum.length - 1] };
}

function samplePath(path, s) {
  const { pts, cum, total } = path;
  let s2 = s % total; if (s2 < 0) s2 += total;
  let lo = 0, hi = cum.length - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (cum[mid] <= s2) lo = mid + 1; else hi = mid; }
  const i = Math.max(0, lo - 1);
  const segLen = cum[i + 1] - cum[i] || 1e-9;
  const t = (s2 - cum[i]) / segLen;
  const a = pts[i], b = pts[i + 1];
  return {
    x: a.x + (b.x - a.x) * t,
    y: a.y + (b.y - a.y) * t,
    z: a.z + (b.z - a.z) * t,
    angle: Math.atan2(b.y - a.y, b.x - a.x)
  };
}

/* ============================================================
 * 低多边形齿轮建模（牙盘 / 飞轮）
 * ============================================================ */
const outlineTargets = []; // 参与墨线描边的主体

function makeGear(radius, teethCount, thickness, z, color, segments) {
  const group = new THREE.Group();
  const diskGeo = new THREE.CylinderGeometry(radius, radius, thickness, segments || 24);
  diskGeo.rotateX(Math.PI / 2);
  const disk = new THREE.Mesh(diskGeo, toon(color));
  group.add(disk);
  // 齿（实例化）
  const toothW = PITCH * 0.42, toothH = PITCH * 0.62, toothD = thickness * 1.02;
  const toothGeo = new THREE.BoxGeometry(toothW, toothH, toothD);
  const teeth = new THREE.InstancedMesh(toothGeo, toon(color), teethCount);
  const m4 = new THREE.Matrix4();
  const q = new THREE.Quaternion();
  const up = new THREE.Vector3(0, 0, 1);
  const pos = new THREE.Vector3();
  for (let i = 0; i < teethCount; i++) {
    const a = (i / teethCount) * Math.PI * 2;
    pos.set(Math.cos(a) * (radius + toothH * 0.46), Math.sin(a) * (radius + toothH * 0.46), 0);
    q.setFromAxisAngle(up, a);
    m4.compose(pos, q, new THREE.Vector3(1, 1, 1));
    teeth.setMatrixAt(i, m4);
  }
  teeth.instanceMatrix.needsUpdate = true;
  group.add(teeth);
  group.position.z = z;
  outlineTargets.push(disk, teeth);
  return { group, disk, teeth };
}

/* 牙盘（链轮） */
const chainring = makeGear(R1, CHAINRING_TEETH, 0.30, 0, 0x5b7fbf, 40);
scene.add(chainring.group);

/* 飞轮 7 片 */
const sprocketGroups = [];
const sprocketMats = [];
const SPROCKET_BASE = 0x8aa0b8;
const SPROCKET_SEL = 0xff9f43;
for (let i = 0; i < NUM_GEARS; i++) {
  const r = R2_LIST[i];
  const z = (i - 3) * SPROCKET_SPACING;
  const g = makeGear(r, SPROCKET_TEETH[i], 0.18, z, SPROCKET_BASE, 20);
  sprocketGroups.push(g.group);
  sprocketMats.push({ disk: g.disk, teeth: g.teeth });
  scene.add(g.group);
}

/* ============================================================
 * 曲柄与踏板
 * ============================================================ */
const crankGroup = new THREE.Group();
let pedalGroup = null;
{
  const bbGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.5, 18);
  bbGeo.rotateX(Math.PI / 2);
  const bb = new THREE.Mesh(bbGeo, toon(0x2f3542));
  crankGroup.add(bb);
  // 曲柄臂（右侧）
  const armLen = R1 * 1.35;
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.34, armLen, 0.24), toon(0x39404d));
  arm.position.set(0, armLen * 0.5 - R1 * 0.2, 0.14);
  crankGroup.add(arm);
  // 踏板（独立子组，反向旋转以保持水平）
  pedalGroup = new THREE.Group();
  pedalGroup.position.set(0, armLen - R1 * 0.2, 0.2);
  const pedal = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.16, 0.5), toon(0xff6b6b));
  pedalGroup.add(pedal);
  const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.66, 10), toon(0x8a8f98));
  pin.rotation.x = Math.PI / 2;
  pedalGroup.add(pin);
  crankGroup.add(pedalGroup);
  outlineTargets.push(bb, arm, pedal, pin);
}
scene.add(crankGroup);

/* ============================================================
 * 后拨（含导轮 + 张紧轮，位于链条下侧路径）
 * ============================================================ */
const derailleur = new THREE.Group();
scene.add(derailleur);
let derPulleyGuide, derPulleyTension, derCageA, derCageB, derBody, derLink;
{
  derBody = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.4, 0.34), toon(0x39404d));
  derBody.position.set(L - 1.1, -1.2, 0);
  derailleur.add(derBody);
  derLink = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.1, 0.26), toon(0x2f3542));
  derLink.position.set(L - 1.6, -2.0, 0);
  derailleur.add(derLink);

  function jockey() {
    const geo = new THREE.CylinderGeometry(RG, RG, 0.16, 14);
    geo.rotateX(Math.PI / 2);
    return new THREE.Mesh(geo, toon(0x6c7480));
  }
  derPulleyGuide = jockey();
  derPulleyTension = jockey();
  derailleur.add(derPulleyGuide, derPulleyTension);

  derCageA = new THREE.Mesh(new THREE.BoxGeometry(0.16, 1, 0.12), toon(0x2f3542));
  derCageB = derCageA.clone();
  derailleur.add(derCageA, derCageB);
  outlineTargets.push(derBody, derLink, derPulleyGuide, derPulleyTension, derCageA, derCageB);
}
function derailleurPositions(r2) {
  const gx = L - (1.6 + 1.2 * (r2 - R2_MIN));
  const tx = L - (4.6 + 3.2 * (r2 - R2_MIN));
  return {
    G: { x: gx, y: -(r2 + 2.0) },
    T: { x: tx, y: -(r2 + 4.2) }
  };
}
function updateDerailleur(r2, z) {
  const p = derailleurPositions(r2);
  derPulleyGuide.position.set(p.G.x, p.G.y, z);
  derPulleyTension.position.set(p.T.x, p.T.y, z);
  // 导板（连接导轮与张紧轮）
  const mx = (p.G.x + p.T.x) / 2, my = (p.G.y + p.T.y) / 2;
  const ang = Math.atan2(p.T.y - p.G.y, p.T.x - p.G.x);
  const len = Math.hypot(p.T.x - p.G.x, p.T.y - p.G.y);
  derCageA.scale.y = len;
  derCageA.position.set(mx, my, z + 0.12);
  derCageA.rotation.z = ang;
  derCageB.scale.y = len;
  derCageB.position.set(mx, my, z - 0.12);
  derCageB.rotation.z = ang;
  derBody.position.z = z;
  derLink.position.z = z;
}

/* ============================================================
 * 链条（闭合环，实例化）
 * ============================================================ */
const plateGeo = new THREE.BoxGeometry(0.34, 0.17, 0.24);
const pinGeo = new THREE.CylinderGeometry(0.075, 0.075, 0.24, 6);
pinGeo.rotateX(Math.PI / 2);
const chainPlates = new THREE.InstancedMesh(plateGeo, toon(0xc7ccd4), N_LINKS);
const chainPins = new THREE.InstancedMesh(pinGeo, toon(0x2a2f3a), N_LINKS);
chainPlates.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
chainPins.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(chainPlates, chainPins);
outlineTargets.push(chainPlates, chainPins);

const dummy = new THREE.Object3D();
let currentPath = buildChainPath(R2_LIST[4], zForGear(3));
let chainOffset = PITCH * 0.5; // 半节距相位，使滚子落入齿槽
function updateChainLinks(offset) {
  const total = currentPath.total;
  const spacing = total / N_LINKS;
  for (let i = 0; i < N_LINKS; i++) {
    const s = i * spacing + offset;
    const sp = samplePath(currentPath, s);
    dummy.position.set(sp.x, sp.y, sp.z);
    dummy.rotation.set(0, 0, sp.angle);
    dummy.updateMatrix();
    chainPlates.setMatrixAt(i, dummy.matrix);
    chainPins.setMatrixAt(i, dummy.matrix);
  }
  chainPlates.instanceMatrix.needsUpdate = true;
  chainPins.instanceMatrix.needsUpdate = true;
}

/* ============================================================
 * 透明亚克力展示支架 + 工作台
 * ============================================================ */
const acrylic = new THREE.MeshPhysicalMaterial({
  color: 0xbfe8ff,
  transparent: true,
  opacity: 0.34,
  roughness: 0.08,
  metalness: 0.0,
  clearcoat: 1.0,
  clearcoatRoughness: 0.06,
  envMapIntensity: 1.6,
  side: THREE.DoubleSide
});
const acrylicEdge = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  transparent: true,
  opacity: 0.55,
  roughness: 0.04,
  metalness: 0.0,
  clearcoat: 1.0,
  clearcoatRoughness: 0.03,
  envMapIntensity: 2.0,
  side: THREE.DoubleSide
});

function acrylicBox(w, h, d, x, y, z, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat || acrylic);
  m.position.set(x, y, z);
  scene.add(m);
  return m;
}
// 底座
acrylicBox(28, 0.9, 7, 10, -8.45, 0);
// 立柱
acrylicBox(1.2, 8, 1.4, 0, -4.0, 0);
acrylicBox(1.2, 8, 1.4, L, -4.0, 0);
// 顶部横梁 + 轴座
acrylicBox(L, 0.7, 1.0, L / 2, 0.35, 0);
acrylicBox(2.0, 2.0, 0.9, 0, 0.4, 0, acrylicEdge);
acrylicBox(2.4, 2.4, 0.9, L, 0.4, 0, acrylicEdge);
// 背面透明挡板（尺度感）
const backPanel = new THREE.Mesh(new THREE.BoxGeometry(27, 12, 0.25), acrylic);
backPanel.position.set(10, -2.2, -2.4);
scene.add(backPanel);

// 工作台地面
const floor = new THREE.Mesh(new THREE.CylinderGeometry(40, 40, 1.0, 48), toon(0x1a2334));
floor.position.set(9, -9.0, 0);
scene.add(floor);
const grid = new THREE.GridHelper(80, 40, 0x2c3a52, 0x1c2738);
grid.position.set(9, -8.48, 0);
scene.add(grid);

// 中轴与后轴（金属）
function axle(x, y) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 4.4, 14), toon(0x8a8f98));
  m.rotation.x = Math.PI / 2;
  m.position.set(x, y, 0);
  scene.add(m);
  outlineTargets.push(m);
  return m;
}
axle(0, 0);
axle(L, 0);

/* ============================================================
 * 状态
 * ============================================================ */
let motorOn = true;
let currentGear = 3;
let r2Current = r2ForGear(currentGear);
let zCurrent = zForGear(currentGear);
let crankAngle = 0;
const sprocketAngles = new Array(NUM_GEARS).fill(0);
let guideAngle = 0, tensionAngle = 0;
let pixelated = false;

function setGearHighlight(g) {
  for (let i = 0; i < NUM_GEARS; i++) {
    const sel = i === sprocketIndexForGear(g);
    const col = sel ? SPROCKET_SEL : SPROCKET_BASE;
    sprocketMats[i].disk.material.color.setHex(col);
    sprocketMats[i].teeth.material.color.setHex(col);
  }
}

function updateHUD() {
  const idx = sprocketIndexForGear(currentGear);
  const teeth = SPROCKET_TEETH[idx];
  const ratio = CHAINRING_TEETH / teeth;
  document.getElementById('gearNum').textContent = currentGear;
  document.getElementById('ratioVal').textContent = ratio.toFixed(2);
  document.getElementById('ratioDetail').textContent = CHAINRING_TEETH + ' / ' + teeth;
  document.getElementById('specRing').textContent = CHAINRING_TEETH + ' T';
  document.getElementById('specSprocket').textContent = teeth + ' T';
  document.getElementById('specRatio').textContent = ratio.toFixed(2);
  document.getElementById('motorText').textContent = motorOn ? '● 电机运行中' : '○ 电机已停止';
  document.getElementById('motorText').className = motorOn ? 'on' : 'off';
  document.getElementById('btnMotor').textContent = motorOn ? '⏸ 停止电机' : '▶ 启动电机';
}

function shiftGear(delta) {
  const g = Math.min(NUM_GEARS, Math.max(1, currentGear + delta));
  if (g !== currentGear) {
    currentGear = g;
    setGearHighlight(g);
    updateHUD();
  }
}

/* ============================================================
 * 相机预设（平滑过渡）
 * ============================================================ */
const CAM_PRESETS = [
  { pos: new THREE.Vector3(30, 4, 30),  tgt: new THREE.Vector3(9, -1.4, 0) },  // 前侧视（默认）
  { pos: new THREE.Vector3(9, 2, 44),   tgt: new THREE.Vector3(9, -1.4, 0) },  // 正视
  { pos: new THREE.Vector3(46, 0, 2),   tgt: new THREE.Vector3(9, -1.4, 0) },  // 侧视
  { pos: new THREE.Vector3(9, 40, 1),   tgt: new THREE.Vector3(9, -1.4, 0) },  // 俯视
  { pos: new THREE.Vector3(20, -4, 14), tgt: new THREE.Vector3(19, -3, 0) }    // 后拨特写
];
let camAnim = null;
function goCamera(i) {
  const c = CAM_PRESETS[i];
  camAnim = { fromP: camera.position.clone(), fromT: controls.target.clone(), toP: c.pos, toT: c.tgt, t: 0 };
}

/* ============================================================
 * 主循环
 * ============================================================ */
const clock = new THREE.Clock();
let fpsAcc = 0, fpsFrames = 0, fps = 0, fpsTimer = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // 换挡平滑插值（飞轮半径 + 轴向 + 后拨位置）
  const targetR2 = r2ForGear(currentGear);
  const targetZ = zForGear(currentGear);
  const k = Math.min(1, dt * 9);
  r2Current += (targetR2 - r2Current) * k;
  zCurrent += (targetZ - zCurrent) * k;

  // 电机驱动
  let v = 0;
  if (motorOn) {
    crankAngle += MOTOR_SPEED * dt;
    v = MOTOR_SPEED * R1;
  }
  const idx = sprocketIndexForGear(currentGear);
  if (motorOn && v > 0) sprocketAngles[idx] += (v / r2Current) * dt;
  guideAngle -= (v / RG) * dt;
  tensionAngle += (v / RG) * dt;
  chainOffset = (chainOffset + v * dt) % 100000;

  // 更新机械旋转
  crankGroup.rotation.z = -crankAngle;
  chainring.group.rotation.z = -crankAngle;
  if (pedalGroup) pedalGroup.rotation.z = crankAngle;
  for (let i = 0; i < NUM_GEARS; i++) sprocketGroups[i].rotation.z = -sprocketAngles[i];

  // 后拨位置（随换挡水平移动并 lerp）
  updateDerailleur(r2Current, zCurrent);
  derPulleyGuide.rotation.z = guideAngle;
  derPulleyTension.rotation.z = tensionAngle;

  // 链条路径 + 实例同步
  currentPath = buildChainPath(r2Current, zCurrent);
  updateChainLinks(chainOffset);

  // 相机预设动画
  if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + dt * 1.8);
    const e = camAnim.t < 0.5 ? 2 * camAnim.t * camAnim.t : 1 - Math.pow(-2 * camAnim.t + 2, 2) / 2;
    camera.position.lerpVectors(camAnim.fromP, camAnim.toP, e);
    controls.target.lerpVectors(camAnim.fromT, camAnim.toT, e);
    if (camAnim.t >= 1) camAnim = null;
  }

  controls.update();
  renderLoop();

  // FPS
  fpsAcc += dt; fpsFrames++; fpsTimer += dt;
  if (fpsTimer >= 0.5) { fps = Math.round(fpsFrames / fpsAcc); fpsAcc = 0; fpsFrames = 0; fpsTimer = 0; }
  document.getElementById('specFps').textContent = fps;
  document.getElementById('specDc').textContent = renderer.info.render.calls;
  document.getElementById('specTri').textContent = renderer.info.render.triangles;
}

/* ============================================================
 * 后处理：墨线描边 + 输出
 * ============================================================ */
let composer;
try {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const outline = new OutlinePass(new THREE.Vector2(window.innerWidth, window.innerHeight), scene, camera);
  outline.edgeStrength = 2.6;
  outline.edgeGlow = 0.0;
  outline.edgeThickness = 1.0;
  outline.visibleEdgeColor.set(0x0a0e18);
  outline.hiddenEdgeColor.set(0x0a0e18);
  outline.selectedObjects = outlineTargets;
  composer.addPass(outline);
  composer.addPass(new OutputPass());
} catch (e) {
  console.warn('后处理初始化失败，回退到直接渲染', e);
  composer = null;
}

function renderLoop() {
  if (composer) composer.render();
  else renderer.render(scene, camera);
}

/* ============================================================
 * UI 事件
 * ============================================================ */
document.getElementById('btnMotor').addEventListener('click', () => { motorOn = !motorOn; updateHUD(); });
document.getElementById('btnUp').addEventListener('click', () => shiftGear(+1));
document.getElementById('btnDown').addEventListener('click', () => shiftGear(-1));
document.getElementById('btnReset').addEventListener('click', () => {
  motorOn = true;
  currentGear = 3;
  crankAngle = 0;
  for (let i = 0; i < NUM_GEARS; i++) sprocketAngles[i] = 0;
  guideAngle = 0; tensionAngle = 0; chainOffset = PITCH * 0.5;
  r2Current = r2ForGear(3); zCurrent = zForGear(3);
  setGearHighlight(3);
  updateHUD();
  goCamera(0);
});
document.getElementById('btnFront').addEventListener('click', () => goCamera(1));
document.getElementById('btnSide').addEventListener('click', () => goCamera(2));
document.getElementById('btnTop').addEventListener('click', () => goCamera(3));
document.getElementById('btnClose').addEventListener('click', () => goCamera(4));
document.getElementById('btnPixel').addEventListener('click', () => {
  pixelated = !pixelated;
  renderer.setPixelRatio(pixelated ? 0.4 : Math.min(window.devicePixelRatio, 2));
  renderer.domElement.style.imageRendering = pixelated ? 'pixelated' : 'auto';
  document.getElementById('btnPixel').classList.toggle('on', pixelated);
});

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); motorOn = !motorOn; updateHUD(); }
  else if (e.code === 'ArrowUp') { e.preventDefault(); shiftGear(+1); }
  else if (e.code === 'ArrowDown') { e.preventDefault(); shiftGear(-1); }
  else if (e.code === 'KeyR') { document.getElementById('btnReset').click(); }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (composer) composer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================
 * 启动
 * ============================================================ */
setGearHighlight(3);
updateHUD();
updateDerailleur(r2Current, zCurrent);
currentPath = buildChainPath(r2Current, zCurrent);
updateChainLinks(chainOffset);
animate();
</script>
</body>
</html>
