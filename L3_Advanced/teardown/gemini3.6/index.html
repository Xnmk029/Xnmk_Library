<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metropolis Micro-Voxel City Diorama - Teardown Style</title>
  <style>
    :root {
      --bg-color: #080a0f;
      --panel-bg: rgba(15, 18, 26, 0.78);
      --panel-border: rgba(255, 255, 255, 0.12);
      --accent-color: #ff9d00;
      --accent-cyan: #00f0ff;
      --text-main: #f0f4f8;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
    }

    #webgl-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Glassmorphism UI Overlay */
    .ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 360px;
      pointer-events: none;
    }

    .ui-card {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
      transition: all 0.25s ease;
    }

    .ui-card:hover {
      border-color: rgba(255, 255, 255, 0.22);
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .badge {
      background: linear-gradient(135deg, #00f0ff, #0077ff);
      color: #000;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    h1 {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #ffffff;
    }

    p.subtitle {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      font-family: monospace;
    }

    /* Controls Panel Right */
    .controls-panel {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: auto;
      max-width: 240px;
    }

    .btn {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff6b00, #ff9d00);
      color: #0d0e12;
      border: none;
      box-shadow: 0 4px 16px rgba(255, 107, 0, 0.4);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #ff7a1a, #ffb31a);
      box-shadow: 0 6px 20px rgba(255, 107, 0, 0.6);
      color: #000;
    }

    .btn.active {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.35);
    }

    /* Tilt Shift Control Range */
    .slider-group {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      padding: 10px 14px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slider-label {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent-cyan);
      cursor: pointer;
    }

    /* Loading Screen */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #06070a;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .spinner {
      width: 52px;
      height: 52px;
      border: 3px solid rgba(0, 240, 255, 0.15);
      border-radius: 50%;
      border-top-color: var(--accent-cyan);
      animation: spin 1s infinite linear;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 14px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }
  </style>

  <!-- Import maps polyfill & Three.js imports -->
  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <div class="loading-text">构建体素城市与移轴沙盘中...</div>
  </div>

  <div id="webgl-container"></div>

  <!-- UI Header / Info -->
  <div class="ui-overlay">
    <div class="ui-card">
      <div class="title-group">
        <span class="badge">CITY DIORAMA</span>
        <h1>城市局部移轴沙盘</h1>
      </div>
      <p class="subtitle">实心木纹台座 × 像素天空盒 × 体素动态河流 × 强化移轴 (Tilt-Shift) 镜头模型感</p>
      
      <div class="stats-grid">
        <div class="stat-item">
          <span class="stat-label">城市体素总数</span>
          <span class="stat-value" id="stat-voxels">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">绘制调用 (Draw Calls)</span>
          <span class="stat-value" id="stat-drawcalls">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">帧率 (FPS)</span>
          <span class="stat-value" id="stat-fps">60</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">移轴虚化强度</span>
          <span class="stat-value" id="stat-blur">强 (Tilt-Shift)</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Controls Panel -->
  <div class="controls-panel">
    <button class="btn btn-primary" id="btn-explode">
      <span>💣 城市拆迁爆破</span>
    </button>

    <div class="slider-group">
      <div class="slider-label">
        <span>移轴镜头模糊 (Tilt-Shift)</span>
        <span id="tilt-val">80%</span>
      </div>
      <input type="range" id="slider-tilt" min="0" max="100" value="80">
    </div>

    <button class="btn active" id="btn-ssao">
      <span>阴影遮蔽 SSAO</span>
      <span class="status">开</span>
    </button>
    <button class="btn" id="btn-lighting">
      <span>环境光效</span>
      <span id="light-mode-text">日间模式</span>
    </button>
    <button class="btn" id="btn-reset-cam">
      <span>视角复位</span>
      <span>45°等轴</span>
    </button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // ==========================================
    // 1. 常量与 WebGL 基础设置 (Setup)
    // ==========================================
    const container = document.getElementById('webgl-container');
    const VOXEL_SIZE = 0.4;
    const HALF_VOXEL = VOXEL_SIZE / 2;

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      32, // 窄视角增强微缩玩具感 (Narrow FOV for Miniature Feel)
      window.innerWidth / window.innerHeight,
      0.5,
      120
    );

    // 45°经典等轴俯视视角 (Classic 45-degree isometric position)
    const initialCamPos = new THREE.Vector3(26, 22, 26);
    const targetLookAt = new THREE.Vector3(0, 3.5, 0);
    camera.position.copy(initialCamPos);
    camera.lookAt(targetLookAt);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.01; // 不穿透桌面
    controls.minDistance = 10;
    controls.maxDistance = 65;
    controls.target.copy(targetLookAt);

    // ==========================================
    // 2. 像素风格天空盒 & PBR 环境贴图生成器
    // ==========================================
    function createPixelSkyboxCubemap() {
      // 动态绘制像素艺术天空盒 Texture Canvas
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // 像素天空渐变背景 (Pixel sky gradient)
      const grad = ctx.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0, '#1a365d'); // 深蓝空域
      grad.addColorStop(0.4, '#2b6cb0');
      grad.addColorStop(0.7, '#4299e1');
      grad.addColorStop(0.9, '#90cdf4');
      grad.addColorStop(1.0, '#ebf8ff');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      // 绘制像素化方块云朵 (Pixel art clouds)
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      const cloudBlocks = [
        [40, 180, 120, 30], [80, 160, 80, 40], [180, 220, 140, 35],
        [300, 140, 160, 45], [340, 120, 90, 35], [420, 200, 70, 30]
      ];
      cloudBlocks.forEach(([x, y, w, h]) => {
        // 阶梯状像素块效果
        ctx.fillRect(x, y, w, h);
        ctx.fillRect(x + 10, y - 10, w - 20, 10);
      });

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;

      // 使用 PMREMGenerator 提取 PBR 环境光图
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      pmremGenerator.compileEquirectangularShader();
      const envMap = pmremGenerator.fromEquirectangular(texture).texture;
      scene.environment = envMap;
      scene.background = new THREE.Color(0x101726);

      pmremGenerator.dispose();
    }
    createPixelSkyboxCubemap();

    // ==========================================
    // 3. 影棚级光照系统 (Diorama Studio Lighting)
    // ==========================================
    const dirLight = new THREE.DirectionalLight(0xfff8ee, 3.0);
    dirLight.position.set(22, 32, 18);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 5;
    dirLight.shadow.camera.far = 80;
    const shadowD = 20;
    dirLight.shadow.camera.left = -shadowD;
    dirLight.shadow.camera.right = shadowD;
    dirLight.shadow.camera.top = shadowD;
    dirLight.shadow.camera.bottom = -shadowD;
    dirLight.shadow.bias = -0.0001;
    scene.add(dirLight);

    const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x2d241e, 0.9);
    scene.add(hemiLight);

    // 城市路灯与夜景点光源点缀
    const cityLights = [];
    const lightPositions = [
      [ -8, 3.5, 4 ], [ 8, 3.5, 4 ],
      [ -8, 3.5, -4 ], [ 8, 3.5, -4 ],
      [ 0, 5.0, 0 ] // 桥头高杆灯
    ];

    lightPositions.forEach(([lx, ly, lz]) => {
      const pLight = new THREE.PointLight(0xffaa33, 0, 8, 2);
      pLight.position.set(lx * VOXEL_SIZE, ly * VOXEL_SIZE, lz * VOXEL_SIZE);
      scene.add(pLight);
      cityLights.push(pLight);
    });

    // ==========================================
    // 4. 实心木纹桌台 Base & PBR 材质库
    // ==========================================
    const sharedBoxGeometry = new THREE.BoxGeometry(VOXEL_SIZE, VOXEL_SIZE, VOXEL_SIZE);

    // A. 桌面底座材质 (Solid Mahogany Desk Pedestal)
    const matTableWood = new THREE.MeshPhysicalMaterial({
      color: 0x3d2314,
      roughness: 0.35,
      metalness: 0.05,
      clearcoat: 0.4,
      clearcoatRoughness: 0.2
    });

    // B. 桌台金属包边 (Brass Bevel Trim)
    const matTableBrass = new THREE.MeshPhysicalMaterial({
      color: 0xd4af37,
      roughness: 0.25,
      metalness: 0.95
    });

    // C. 柏油马路 (Asphalt Road)
    const matRoad = new THREE.MeshPhysicalMaterial({ roughness: 0.88, metalness: 0.05 });
    // D. 建筑混凝土 (Concrete Building)
    const matConcrete = new THREE.MeshPhysicalMaterial({ roughness: 0.82, metalness: 0.08 });
    // E. 建筑红砖 (Brick Building)
    const matBrick = new THREE.MeshPhysicalMaterial({ roughness: 0.92, metalness: 0.0 });
    // F. 高楼玻璃幕墙 (Glass Skyscrapers)
    const matGlass = new THREE.MeshPhysicalMaterial({
      roughness: 0.05,
      metalness: 0.1,
      transmission: 0.90,
      transparent: true,
      ior: 1.52,
      thickness: 0.5,
      attenuationDistance: 0.8,
      attenuationColor: new THREE.Color(0x38bdf8)
    });
    // G. 体素动态河流 (Voxel River Water)
    const matWater = new THREE.MeshPhysicalMaterial({
      roughness: 0.06,
      metalness: 0.05,
      transmission: 0.88,
      transparent: true,
      ior: 1.33,
      thickness: 0.8,
      attenuationDistance: 1.2,
      attenuationColor: new THREE.Color(0x0284c7)
    });
    // H. 金属/汽车/管道 (Metals & Vehicles)
    const matMetal = new THREE.MeshPhysicalMaterial({
      roughness: 0.20,
      metalness: 0.92,
      clearcoat: 0.4
    });
    // I. 绿化树木 (Greenery)
    const matFoliage = new THREE.MeshPhysicalMaterial({ roughness: 0.75, metalness: 0.0 });
    // J. 霓虹自发光 (Neon Emissive Core)
    const matEmissive = new THREE.MeshPhysicalMaterial({
      roughness: 0.2,
      emissive: new THREE.Color(0x00f0ff),
      emissiveIntensity: 4.0
    });

    // ==========================================
    // 5. 实心桌台构建 (Solid Table Desk Pedestal)
    // ==========================================
    const TABLE_SIZE = 38; // 桌台尺寸 (比城市沙盘大一圈)
    const HALF_TABLE = TABLE_SIZE / 2;

    // 桌台由一个大块实体 Mesh 呈现 (Solid pedestal mesh)
    const tableBaseGeo = new THREE.BoxGeometry(TABLE_SIZE * VOXEL_SIZE, 3 * VOXEL_SIZE, TABLE_SIZE * VOXEL_SIZE);
    const tableMesh = new THREE.Mesh(tableBaseGeo, matTableWood);
    tableMesh.position.set(0, -1.5 * VOXEL_SIZE, 0);
    tableMesh.receiveShadow = true;
    scene.add(tableMesh);

    // 桌台黄铜金属黄边框 (Brass frame)
    const borderGeo = new THREE.BoxGeometry((TABLE_SIZE + 0.4) * VOXEL_SIZE, 0.4 * VOXEL_SIZE, (TABLE_SIZE + 0.4) * VOXEL_SIZE);
    const borderMesh = new THREE.Mesh(borderGeo, matTableBrass);
    borderMesh.position.set(0, 0.1 * VOXEL_SIZE, 0);
    scene.add(borderMesh);

    // ==========================================
    // 6. 城市局部沙盘逻辑生成器 (City Diorama Generator)
    // ==========================================
    const voxelCategories = {
      road: [],
      concrete: [],
      brick: [],
      glass: [],
      water: [],
      metal: [],
      foliage: [],
      emissive: []
    };

    const paletteConcrete = [0xd4d8dc, 0xb8bcbe, 0x9ea2a5, 0x7e8387];
    const paletteBrick = [0xb83a28, 0x9e2d1d, 0xc74834, 0x8a3224, 0x4a5568];
    const paletteGlass = [0x7dd3fc, 0x38bdf8, 0x0284c7, 0xbae6fd];
    const paletteFoliage = [0x15803d, 0x16a34a, 0x22c55e, 0x4ade80];
    const paletteCar = [0xef4444, 0x3b82f6, 0xeab308, 0x8b5cf6, 0xf97316, 0xffffff];

    function getRandomColor(arr) {
      return new THREE.Color(arr[Math.floor(Math.random() * arr.length)]);
    }

    const CITY_SIZE = 34; // 34x34 微体素规模
    const HALF_CITY = CITY_SIZE / 2;

    // 结构规划：
    // Z 轴方向 z = 6..12 为一条贯穿城市的“体素斜向/直线河流”
    // X 轴方向 x = -2..2 为主干道大桥跨越河流
    // Z 轴 z = -4..-1 为横向次干道
    // 其余四区为高楼大厦、沿街商铺、城市公园

    for (let x = -HALF_CITY; x < HALF_CITY; x++) {
      for (let z = -HALF_CITY; z < HALF_CITY; z++) {
        
        // 6.1 体素河流 (Voxel River)
        const isRiver = (z >= 6 && z <= 11) && !(x >= -3 && x <= 3); // 留出 bridge 区域

        if (isRiver) {
          // 河底 (Riverbed)
          voxelCategories.concrete.push({
            x, y: 0, z,
            color: new THREE.Color(0x1e293b),
            isDebris: false
          });
          // 河水层 (Water Surface)
          voxelCategories.water.push({
            x, y: 1, z,
            color: getRandomColor(paletteGlass),
            isDebris: false,
            isWater: true
          });
          continue;
        }

        // 6.2 马路网络 (Asphalt Roads & Crosswalks)
        const isMainRoadX = (x >= -3 && x <= 3); // 南北大桥主干道
        const isSubRoadZ = (z >= -3 && z <= 0);  // 东西次干道

        if (isMainRoadX || isSubRoadZ) {
          // 桥身/马路地基
          const roadY = (z >= 6 && z <= 11) ? 2 : 1; // 桥面抬高1层

          // 斑马线/路面调色
          let roadColor = new THREE.Color(0x334155); // 柏油黑
          if ((x % 4 === 0 && isSubRoadZ) || (z % 4 === 0 && isMainRoadX)) {
            roadColor = new THREE.Color(0xf8fafc); // 车道线/斑马线
          }

          voxelCategories.road.push({
            x, y: roadY, z,
            color: roadColor,
            isDebris: false
          });

          // 桥梁栏杆 (Bridge Guardrails)
          if ((z >= 6 && z <= 11) && (x === -3 || x === 3)) {
            voxelCategories.metal.push({
              x, y: roadY + 1, z,
              color: new THREE.Color(0x94a3b8),
              isDebris: false
            });
          }
          continue;
        }

        // 6.3 城市绿化公园 (City Park - North West Block)
        const isParkArea = (x < -3 && z < -3);
        if (isParkArea) {
          // 草地基础
          voxelCategories.foliage.push({
            x, y: 1, z,
            color: getRandomColor(paletteFoliage),
            isDebris: false
          });

          // 随机公园树木 (Voxel Trees)
          if (x % 3 === 0 && z % 3 === 0 && Math.random() > 0.3) {
            // 树干 (Trunk)
            voxelCategories.brick.push({
              x, y: 2, z,
              color: new THREE.Color(0x78350f),
              isDebris: false
            });
            // 树冠 (Foliage crown)
            for (let tx = -1; tx <= 1; tx++) {
              for (let tz = -1; tz <= 1; tz++) {
                for (let ty = 3; ty <= 5; ty++) {
                  if (Math.abs(tx) + Math.abs(tz) + (ty - 3) <= 2) {
                    voxelCategories.foliage.push({
                      x: x + tx, y: ty, z: z + tz,
                      color: getRandomColor(paletteFoliage),
                      isDebris: false
                    });
                  }
                }
              }
            }
          }
          // 喷泉核心
          if (x === -9 && z === -9) {
            voxelCategories.glass.push({ x, y: 2, z, color: new THREE.Color(0x38bdf8), isDebris: false });
            voxelCategories.emissive.push({ x, y: 3, z, color: new THREE.Color(0x00f0ff), isDebris: false });
          }
          continue;
        }

        // 6.4 建筑物群 (City Buildings & Skyscrapers)
        // 基地层
        voxelCategories.concrete.push({
          x, y: 1, z,
          color: getRandomColor(paletteConcrete),
          isDebris: false
        });

        // 建筑1：摩天玻璃大厦 (Commercial Glass Tower - South East)
        if (x > 3 && z > 11) {
          const towerDist = Math.max(Math.abs(x - 10), Math.abs(z - 13));
          if (towerDist <= 4) {
            const h = 24 - towerDist * 2; // 高度达 24 层体素
            for (let y = 2; y <= h; y++) {
              // 玻璃幕墙与框架
              if (x === 10 - towerDist || x === 10 + towerDist || z === 13 - towerDist || z === 13 + towerDist) {
                if (y % 4 === 0) {
                  voxelCategories.metal.push({ x, y, z, color: new THREE.Color(0x475569), isDebris: false });
                } else {
                  voxelCategories.glass.push({ x, y, z, color: getRandomColor(paletteGlass), isDebris: false });
                }
              } else {
                voxelCategories.concrete.push({ x, y, z, color: new THREE.Color(0x1e293b), isDebris: false });
              }
            }
            // 楼顶直升机坪/警示灯
            if (x === 10 && z === 13) {
              voxelCategories.emissive.push({ x, y: h + 1, z, color: new THREE.Color(0xff0055), isDebris: false });
            }
          }
        }
        // 建筑2：红砖综合楼 (Brick Apartments - North East)
        else if (x > 3 && z < -3) {
          const aptHeight = 12 + Math.floor(Math.sin(x * 0.5 + z * 0.5) * 3);
          if (Math.random() > 0.15) {
            for (let y = 2; y <= aptHeight; y++) {
              // 窗户开孔逻辑
              const isWindow = (y % 3 !== 0) && (x % 2 === 0);
              if (isWindow && (x === 4 || z === -4 || x === 14 || z === -14)) {
                voxelCategories.glass.push({ x, y, z, color: getRandomColor(paletteGlass), isDebris: false });
              } else {
                voxelCategories.brick.push({ x, y, z, color: getRandomColor(paletteBrick), isDebris: false });
              }
            }
          }
        }
        // 建筑3：工业大厦与沿街商铺 (Industrial & Shops - South West)
        else if (x < -3 && z > 11) {
          const shopH = 8 + (x % 3);
          for (let y = 2; y <= shopH; y++) {
            if (y === 2) {
              // 商铺自发光霓虹招牌
              voxelCategories.emissive.push({ x, y, z, color: getRandomColor([0xff0077, 0x00f0ff, 0xffaa00]), isDebris: false });
            } else {
              voxelCategories.concrete.push({ x, y, z, color: getRandomColor(paletteConcrete), isDebris: false });
            }
          }
        }
      }
    }

    // 6.5 街道体素车辆与残骸散落 (Voxel Vehicles on Roads)
    const carPositions = [
      { x: 1, z: 8, dir: 'z', color: 0xef4444 },  // 桥上红色跑车
      { x: -1, z: -1, dir: 'x', color: 0xeab308 }, // 交叉口黄色出租车
      { x: 1, z: -8, dir: 'z', color: 0x3b82f6 },  // 蓝色公交车
      { x: 8, z: -2, dir: 'x', color: 0xffffff },  // 白色货车
      { x: -1, z: 2, dir: 'z', color: 0x10b981 }   // 绿色轿车
    ];

    carPositions.forEach(car => {
      // 简易体素汽车造型 (2x1x1 体素)
      const y = (car.z >= 6 && car.z <= 11) ? 3 : 2;
      voxelCategories.metal.push({ x: car.x, y, z: car.z, color: new THREE.Color(car.color), isDebris: true });
      voxelCategories.glass.push({ x: car.x, y: y + 0.6, z: car.z, color: new THREE.Color(0xffffff), isDebris: true });
    });

    // 散落爆破残骸 (Scattered Rubble)
    for (let i = 0; i < 220; i++) {
      const rx = (Math.random() - 0.5) * 26;
      const rz = (Math.random() - 0.5) * 26;
      if (Math.abs(rx) > 3 || Math.abs(rz) > 3) {
        voxelCategories.brick.push({
          x: rx, y: 2, z: rz,
          rotX: Math.random(), rotY: Math.random(), rotZ: Math.random(),
          color: getRandomColor(paletteBrick),
          isDebris: true
        });
      }
    }

    // ==========================================
    // 7. THREE.InstancedMesh 渲染对象构建
    // ==========================================
    const categoryMaterials = {
      road: matRoad,
      concrete: matConcrete,
      brick: matBrick,
      glass: matGlass,
      water: matWater,
      metal: matMetal,
      foliage: matFoliage,
      emissive: matEmissive
    };

    const instancedMeshMap = {};
    const animationVoxelData = [];
    let totalVoxelCount = 0;
    const dummy = new THREE.Object3D();

    Object.keys(voxelCategories).forEach(catKey => {
      const voxels = voxelCategories[catKey];
      const count = voxels.length;
      totalVoxelCount += count;

      const instMesh = new THREE.InstancedMesh(
        sharedBoxGeometry,
        categoryMaterials[catKey],
        count
      );
      instMesh.castShadow = true;
      instMesh.receiveShadow = true;

      voxels.forEach((v, index) => {
        dummy.position.set(
          v.x * VOXEL_SIZE,
          v.y * VOXEL_SIZE + HALF_VOXEL,
          v.z * VOXEL_SIZE
        );

        if (v.rotX || v.rotY || v.rotZ) {
          dummy.rotation.set(v.rotX || 0, v.rotY || 0, v.rotZ || 0);
        } else {
          dummy.rotation.set(0, 0, 0);
        }
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();

        instMesh.setMatrixAt(index, dummy.matrix);
        instMesh.setColorAt(index, v.color);

        // 记录爆破动画向量
        animationVoxelData.push({
          instMesh,
          index,
          isWater: v.isWater,
          origPosition: dummy.position.clone(),
          origRotation: dummy.rotation.clone(),
          isDebris: v.isDebris,
          blastDir: new THREE.Vector3(
            v.x + (Math.random() - 0.5) * 6,
            v.y + Math.random() * 8 + 4,
            v.z + (Math.random() - 0.5) * 6
          ).normalize().multiplyScalar(6 + Math.random() * 10),
          rotVel: new THREE.Vector3((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12)
        });
      });

      instMesh.instanceMatrix.needsUpdate = true;
      if (instMesh.instanceColor) instMesh.instanceColor.needsUpdate = true;

      scene.add(instMesh);
      instancedMeshMap[catKey] = instMesh;
    });

    document.getElementById('stat-voxels').innerText = totalVoxelCount.toLocaleString();
    document.getElementById('stat-drawcalls').innerText = Object.keys(voxelCategories).length + 2;

    // ==========================================
    // 8. 强化“移轴镜头” (Tilt-Shift Lens Effect) Shader
    // ==========================================
    const TiltShiftShader = {
      uniforms: {
        'tDiffuse': { value: null },
        'focusPos': { value: 0.5 },    // 屏幕中央聚焦带
        'range': { value: 0.12 },       // 清晰清晰带宽度
        'blurAmount': { value: 0.006 }  // 移轴模糊极值
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float focusPos;
        uniform float range;
        uniform float blurAmount;
        varying vec2 vUv;

        void main() {
          // 距离中心焦平面的距离 (Distance from tilt-shift focus line)
          float d = abs(vUv.y - focusPos);
          float blurFactor = smoothstep(range * 0.4, range * 2.2, d);

          // 9-tap 垂直高斯虚化 (Gaussian vertical blur)
          vec4 sum = vec4(0.0);
          float totalWeight = 0.0;
          float radius = blurFactor * blurAmount;

          for (float t = -4.0; t <= 4.0; t += 1.0) {
            float weight = exp(-0.5 * (t * t) / 4.0);
            vec2 offset = vec2(0.0, t * radius);
            sum += texture2D(tDiffuse, vUv + offset) * weight;
            totalWeight += weight;
          }

          // 微调饱和度与对比度，提升移轴玩具质感 (Boost Saturation for Miniature Look)
          vec4 col = sum / totalWeight;
          float gray = dot(col.rgb, vec3(0.299, 0.587, 0.114));
          col.rgb = mix(vec3(gray), col.rgb, 1.15); // +15% 饱和度

          gl_FragColor = col;
        }
      `
    };

    // 后处理管线
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));

    // SSAO 环境遮蔽
    const ssaoPass = new SSAOPass(scene, camera, window.innerWidth, window.innerHeight);
    ssaoPass.kernelRadius = 0.9;
    ssaoPass.minDistance = 0.001;
    ssaoPass.maxDistance = 0.14;
    composer.addPass(ssaoPass);

    // 专用的强化移轴 ShaderPass (Tilt-Shift Pass)
    const tiltShiftPass = new ShaderPass(TiltShiftShader);
    composer.addPass(tiltShiftPass);

    // 输出通道
    composer.addPass(new OutputPass());

    // 隐藏 loading 动画
    const loadingScreen = document.getElementById('loading-screen');
    setTimeout(() => {
      loadingScreen.style.opacity = '0';
      setTimeout(() => loadingScreen.style.display = 'none', 600);
    }, 400);

    // ==========================================
    // 9. 交互控制逻辑 (UI Handlers)
    // ==========================================
    let isExploded = false;
    let animProgress = 0;

    const btnExplode = document.getElementById('btn-explode');
    btnExplode.addEventListener('click', () => {
      isExploded = !isExploded;
      btnExplode.innerHTML = isExploded ? '<span>🔄 修复城市沙盘</span>' : '<span>💣 城市拆迁爆破</span>';
      btnExplode.classList.toggle('btn-primary', !isExploded);
    });

    // 移轴滑块控制
    const sliderTilt = document.getElementById('slider-tilt');
    const tiltValText = document.getElementById('tilt-val');
    const statBlurText = document.getElementById('stat-blur');

    sliderTilt.addEventListener('input', (e) => {
      const val = parseInt(e.target.value);
      tiltValText.innerText = `${val}%`;
      const blurAmount = (val / 100) * 0.008;
      tiltShiftPass.uniforms['blurAmount'].value = blurAmount;
      
      if (val === 0) statBlurText.innerText = '已关闭';
      else if (val > 60) statBlurText.innerText = '极强 (Tilt-Shift)';
      else statBlurText.innerText = '标准';
    });

    // SSAO 开关 Toggle
    let ssaoEnabled = true;
    const btnSSAO = document.getElementById('btn-ssao');
    btnSSAO.addEventListener('click', () => {
      ssaoEnabled = !ssaoEnabled;
      ssaoPass.enabled = ssaoEnabled;
      btnSSAO.classList.toggle('active', ssaoEnabled);
      btnSSAO.querySelector('.status').innerText = ssaoEnabled ? '开' : '关';
    });

    // 日夜/日光切换 (Day / Night Mode)
    let lightMode = 0; // 0 = 白天, 1 = 夕阳, 2 = 赛博夜景
    const btnLighting = document.getElementById('btn-lighting');
    const lightText = document.getElementById('light-mode-text');

    btnLighting.addEventListener('click', () => {
      lightMode = (lightMode + 1) % 3;
      if (lightMode === 0) {
        // 白天
        lightText.innerText = '日间模式';
        dirLight.color.setHex(0xfff8ee);
        dirLight.intensity = 3.0;
        dirLight.position.set(22, 32, 18);
        hemiLight.color.setHex(0x87ceeb);
        scene.background.setHex(0x101726);
        cityLights.forEach(l => l.intensity = 0);
      } else if (lightMode === 1) {
        // 夕阳
        lightText.innerText = '夕阳模式';
        dirLight.color.setHex(0xff7733);
        dirLight.intensity = 3.8;
        dirLight.position.set(-24, 16, -14);
        hemiLight.color.setHex(0xffaa55);
        scene.background.setHex(0x1c121e);
        cityLights.forEach(l => l.intensity = 1.5);
      } else {
        // 赛博夜景
        lightText.innerText = '霓虹夜景';
        dirLight.color.setHex(0x38bdf8);
        dirLight.intensity = 0.8;
        dirLight.position.set(0, 30, 0);
        hemiLight.color.setHex(0x0284c7);
        scene.background.setHex(0x05070a);
        cityLights.forEach(l => l.intensity = 4.5);
      }
    });

    // 复位视角
    document.getElementById('btn-reset-cam').addEventListener('click', () => {
      camera.position.copy(initialCamPos);
      controls.target.copy(targetLookAt);
      controls.update();
    });

    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
    });

    // ==========================================
    // 10. 实时动画渲染主循环 (Animation Loop)
    // ==========================================
    let lastTime = performance.now();
    let frameCount = 0;
    const fpsElement = document.getElementById('stat-fps');

    const eulerTemp = new THREE.Euler();

    function animate(currentTime) {
      requestAnimationFrame(animate);

      // FPS 计算
      frameCount++;
      if (currentTime - lastTime >= 500) {
        const fps = Math.round((frameCount * 1000) / (currentTime - lastTime));
        fpsElement.innerText = fps;
        frameCount = 0;
        lastTime = currentTime;
      }

      controls.update();

      // 体素河流波浪动效 (Voxel River Water Ripple Animation)
      const timeSec = currentTime * 0.0025;
      const waterInst = instancedMeshMap['water'];
      if (waterInst) {
        const voxels = voxelCategories.water;
        voxels.forEach((v, idx) => {
          const waveY = (v.y * VOXEL_SIZE + HALF_VOXEL) + Math.sin(timeSec * 2 + v.x * 0.8 + v.z * 0.8) * 0.04;
          dummy.position.set(v.x * VOXEL_SIZE, waveY, v.z * VOXEL_SIZE);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.set(1, 1, 1);
          dummy.updateMatrix();
          waterInst.setMatrixAt(idx, dummy.matrix);
        });
        waterInst.instanceMatrix.needsUpdate = true;
      }

      // 爆破 / 修复动画平滑插值
      const targetAnimProgress = isExploded ? 1 : 0;
      if (Math.abs(animProgress - targetAnimProgress) > 0.001) {
        animProgress += (targetAnimProgress - animProgress) * 0.07;

        animationVoxelData.forEach(item => {
          if (!item.isWater && (item.isDebris || item.origPosition.y > 1.2)) {
            const p = item.origPosition.clone().addScaledVector(item.blastDir, animProgress);
            p.y -= animProgress * animProgress * 4.0; // 模拟重力

            eulerTemp.set(
              item.origRotation.x + item.rotVel.x * animProgress,
              item.origRotation.y + item.rotVel.y * animProgress,
              item.origRotation.z + item.rotVel.z * animProgress
            );

            dummy.position.copy(p);
            dummy.rotation.copy(eulerTemp);
            dummy.scale.setScalar(1 - animProgress * 0.15);
            dummy.updateMatrix();

            item.instMesh.setMatrixAt(item.index, dummy.matrix);
          }
        });

        Object.values(instancedMeshMap).forEach(instMesh => {
          instMesh.instanceMatrix.needsUpdate = true;
        });
      }

      composer.render();
    }

    animate(performance.now());
  </script>
</body>
</html>
