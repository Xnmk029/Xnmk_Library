<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Teardown 微体素沙盘 · Micro-Voxel City Diorama</title>
<style>
  :root{
    --ui-bg: rgba(18,20,24,.82);
    --ui-bd: rgba(255,255,255,.10);
    --ui-fg: #e8ecf1;
    --ui-dim: #9aa4b2;
    --ui-ac: #ffb04a;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:#0d1014; }
  body{
    font-family: ui-sans-serif, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color:var(--ui-fg);
  }
  #app{ position:fixed; inset:0; }
  canvas{ display:block; }

  /* ---------- Loading ---------- */
  #loader{
    position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px;
    background:radial-gradient(circle at 50% 40%, #1b2027 0%, #0b0e12 70%);
    transition:opacity .6s ease;
  }
  #loader.hidden{ opacity:0; pointer-events:none; }
  .spinner{
    width:46px; height:46px; border-radius:8px;
    background:linear-gradient(135deg,#ffb04a,#ff5f4a);
    animation:spin 1.1s cubic-bezier(.6,.05,.4,.95) infinite;
    box-shadow:0 8px 30px rgba(255,140,60,.35);
  }
  @keyframes spin{ 0%{transform:rotate(0) scale(1)} 50%{transform:rotate(180deg) scale(.82)} 100%{transform:rotate(360deg) scale(1)} }
  #loader .txt{ font-size:13px; letter-spacing:.14em; color:var(--ui-dim); text-transform:uppercase; }
  #loader .sub{ font-size:12px; color:#6b7583; }

  /* ---------- HUD ---------- */
  #hud{
    position:fixed; top:14px; left:14px; z-index:20;
    width:266px; padding:12px 14px 14px;
    background:var(--ui-bg); border:1px solid var(--ui-bd); border-radius:12px;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:0 18px 50px rgba(0,0,0,.45);
    font-size:12px; user-select:none;
  }
  #hud h1{
    margin:0 0 2px; font-size:13px; font-weight:650; letter-spacing:.02em;
  }
  #hud .sub{ color:var(--ui-dim); font-size:11px; margin-bottom:10px; line-height:1.5; }
  .grp{ border-top:1px solid rgba(255,255,255,.07); padding-top:9px; margin-top:9px; }
  .grp > .gt{
    font-size:10px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--ui-ac); margin-bottom:8px; font-weight:600;
  }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin:7px 0; }
  .row label{ color:var(--ui-dim); font-size:11.5px; white-space:nowrap; }
  .row .val{ color:var(--ui-fg); font-variant-numeric:tabular-nums; font-size:11px; min-width:38px; text-align:right; }
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:118px; height:3px; border-radius:2px;
    background:rgba(255,255,255,.16); outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:12px; height:12px; border-radius:50%;
    background:var(--ui-ac); border:2px solid #14171c; cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:12px; height:12px; border-radius:50%; background:var(--ui-ac);
    border:2px solid #14171c; cursor:pointer;
  }
  .chk{ display:flex; align-items:center; gap:6px; cursor:pointer; color:var(--ui-dim); }
  .chk input{ accent-color:var(--ui-ac); cursor:pointer; }
  .btns{ display:flex; gap:6px; flex-wrap:wrap; }
  button.btn{
    flex:1 1 auto; padding:6px 8px; font-size:11px; cursor:pointer;
    background:rgba(255,255,255,.06); color:var(--ui-fg);
    border:1px solid var(--ui-bd); border-radius:7px; transition:.18s;
  }
  button.btn:hover{ background:rgba(255,176,74,.16); border-color:rgba(255,176,74,.45); }
  #stats{
    margin-top:9px; padding-top:8px; border-top:1px solid rgba(255,255,255,.07);
    color:#6f7a88; font-size:10.5px; line-height:1.6; font-variant-numeric:tabular-nums;
  }
  #tip{
    position:fixed; bottom:12px; left:50%; transform:translateX(-50%); z-index:20;
    padding:6px 14px; font-size:11px; color:var(--ui-dim);
    background:var(--ui-bg); border:1px solid var(--ui-bd); border-radius:20px;
    backdrop-filter:blur(10px); white-space:nowrap;
  }
  #err{
    position:fixed; inset:0; z-index:99; display:none; padding:40px;
    background:#12060a; color:#ffb4b4; font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:12px; white-space:pre-wrap; overflow:auto;
  }
  @media (max-width:720px){ #hud{ width:calc(100% - 28px); } #tip{ display:none; } }
</style>

<body>
<div id="app"></div>

<div id="loader">
  <div class="spinner"></div>
  <div class="txt">Building Voxel City</div>
  <div class="sub">编译实例化几何 · 烘焙光照 · 装配后处理管线</div>
</div>

<div id="hud" style="display:none">
  <h1>TEARDOWN · MICRO-VOXEL CITY</h1>
  <div class="sub">微体素几何 × 写实 PBR 光影<br />SSAO + 移轴景深（Tilt-Shift）</div>

  <div class="grp">
    <div class="gt">后处理 Post FX</div>

    <div class="row"><label>移轴范围</label><input id="r-range" type="range" min="0.5" max="30" step="0.5" value="4.5"><span class="val" id="v-range">4.5</span></div>
    <div class="row"><label>虚化强度</label><input id="r-blur" type="range" min="0" max="8" step="0.1" value="3.6"><span class="val" id="v-blur">3.6</span></div>

  <div class="grp">

    <div class="row"><label>主光强度</label><input id="r-sun" type="range" min="0" max="8" step="0.1" value="1.55"><span class="val" id="v-sun">1.55</span></div>
    <div class="row"><label>环境强度</label><input id="r-env" type="range" min="0" max="3" step="0.05" value="0.40"><span class="val" id="v-env">0.40</span></div>
    <div class="row"><label>曝光 EV</label><input id="r-exp" type="range" min="-2" max="3" step="0.05" value="-0.20"><span class="val" id="v-exp">-0.20</span></div>
    <div class="row"><label>阴影</label><input id="s-shadow" type="checkbox" checked></div>
  </div>

  <div class="grp">
    <div class="gt">材质体系 Materials</div>
    <div class="row"><label>玻璃透射 Glass</label><input id="s-glass" type="checkbox" checked></div>
    <div class="row"><label>玻璃 IOR</label><input id="r-ior" type="range" min="1.0" max="2.4" step="0.01" value="1.48"><span class="val" id="v-ior">1.48</span></div>
    <div class="row"><label>金属度 Metal</label><input id="r-metal" type="range" min="0" max="1" step="0.01" value="0.92"><span class="val" id="v-metal">0.92</span></div>
    <div class="row"><label>粗糙度 Rough</label><input id="r-rough" type="range" min="0.02" max="1" step="0.01" value="0.32"><span class="val" id="v-rough">0.32</span></div>
  </div>

  <div class="grp">
    <div class="gt">视角 Camera</div>
    <div class="btns">
      <button class="btn" id="b-iso">等轴测俯视</button>
      <button class="btn" id="b-street">街道视角</button>
      <button class="btn" id="b-top">正俯视</button>
      <button class="btn" id="b-autorot">自动环绕</button>
    </div>
  </div>

  <div id="stats">—</div>
</div>

<div id="tip">左键拖拽旋转 · 滚轮缩放 · 右键平移 · 点击拾取体素（射线检测）</div>
<div id="err"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }

<script type="module">
import * as THREE from 'three';
import { OrbitControls }    from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment }  from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer }   from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }       from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass }       from 'three/addons/postprocessing/ShaderPass.js';
import { SSAOPass }         from 'three/addons/postprocessing/SSAOPass.js';
import { OutputPass }       from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass }         from 'three/addons/postprocessing/SMAAPass.js';
import { mergeGeometries }  from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================================
 * 0. 全局常量 / 工具
 * ==========================================================================*/
const VOX = 0.5;                 // 单个微体素边长（世界单位）
const WORLD_Y0 = 0;              // 体素底面所在高度

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;

/** 确定性伪随机（mulberry32）：保证城市布局可复现 */
function makeRng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = makeRng(20260828);
const rr    = (a, b) => a + rng() * (b - a);
const ri    = (a, b) => Math.floor(rr(a, b + 1));
const pick  = arr => arr[Math.floor(rng() * arr.length)];

/** 值噪声：用于河岸、地形起伏、锈迹分布 */
function makeNoise2D(seed) {
  const r = makeRng(seed);
  const P = new Float32Array(256 * 256);
  for (let i = 0; i < P.length; i++) P[i] = r();
  const at = (x, y) => P[(((y & 255) << 8) | (x & 255))];
  return function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = at(xi, yi), b = at(xi + 1, yi), c = at(xi, yi + 1), d = at(xi + 1, yi + 1);
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  };
}
const noise2D = makeNoise2D(1337);
function fbm(x, y) {
  let s = 0, amp = 0.5, f = 1;
  for (let i = 0; i < 4; i++) { s += noise2D(x * f, y * f) * amp; amp *= 0.5; f *= 2; }
  return s;
}

const tmpM = new THREE.Matrix4();
const tmpQ = new THREE.Quaternion();
const tmpE = new THREE.Euler();
const tmpV = new THREE.Vector3();
const tmpS = new THREE.Vector3();
const tmpC = new THREE.Color();

/* ============================================================================
 * 1. 渲染器 / 场景 / 相机
 * ==========================================================================*/
const container = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance',
  stencil: false
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // 电影级色调映射
renderer.toneMappingExposure = Math.pow(2, -0.20);       // 整体压暗一档，避免 ACES 高光挤到饱和
renderer.outputColorSpace = THREE.SRGBColorSpace;
// r155+ 默认即为物理正确光照（useLegacyLights 已废弃且默认为 false），
// 此处不再显式赋值以避免弃用警告。
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x6b86a3);          // 略深的背景，让浅色沙盘对比
scene.fog = new THREE.Fog(0x7a96b3, 110, 360);

const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.5, 600);
// —— 初始 45° 俯视等轴测视角（沙盘对角线方向）——
const ISO_DIR = new THREE.Vector3(1, 1.10, 1).normalize();
const ISO_DIST = 38;
camera.position.copy(ISO_DIR).multiplyScalar(ISO_DIST);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.target.set(0, 3.5, 0);
controls.minDistance = 14;
controls.maxDistance = 200;
controls.maxPolarAngle = Math.PI * 0.495;   // 不允许钻到地平面以下
controls.autoRotateSpeed = 0.55;
controls.update();

/* ============================================================================
 * 2. 环境光照（影棚级）
 *    · PMREM 生成的 RoomEnvironment 提供柔和天光/环境反射（无外部 HDRI，离线可用）
 *    · 半球光补天光梯度
 *    · 强平行光投射高分辨率软阴影
 * ==========================================================================*/
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envRT = pmrem.fromScene(new RoomEnvironment(), 0.06);
scene.environment = envRT.texture;
scene.environmentIntensity = 0.40;     // 全局环境强度（与 HUD 滑块联动）
pmrem.dispose();

const hemi = new THREE.HemisphereLight(0xbcd8f5, 0x6b5f52, 0.35);
scene.add(hemi);

const ambient = new THREE.AmbientLight(0xffffff, 0.06);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xfff0d6, 1.55);
sun.position.set(34, 56, 22);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);            // 减小阴影图：实例量太大时 4K 反而噪
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 220;
const SH = 50;                                  // 阴影正交视锥：贴合沙盘
sun.shadow.camera.left = -SH;
sun.shadow.camera.right = SH;
sun.shadow.camera.top = SH;
sun.shadow.camera.bottom = -SH;
sun.shadow.bias = -0.0008;
sun.shadow.normalBias = 0.05;                   // 体素大台阶阴影偏移
sun.shadow.radius = 2.4;                        // PCFSoft 边缘柔化
scene.add(sun);
scene.add(sun.target);
sun.target.position.set(0, 0, 0);

// 冷色补光（模拟天光反弹），压低对比但不产生第二组阴影
const fill = new THREE.DirectionalLight(0x9fc4ee, 0.35);
fill.position.set(-42, 26, -34);
scene.add(fill);

// 窗口发光体对应的点光源
const glowLight = new THREE.PointLight(0xffb765, 12, 34, 2.0);
scene.add(glowLight);

/* ============================================================================
 * 3. 体素世界数据结构
 *    —— 体素只以 (ix, iy, iz) 整数索引 + 材质槽位存在，最后统一编译为
 *       每种材质一个 InstancedMesh（含遮挡剔除：内部不可见体素直接丢弃）
 * ==========================================================================*/
const MAT = {
  CONCRETE: 0, BRICK: 1, WOOD: 2, METAL: 3, RUST: 4,
  GLASS: 5, GLOW: 6, ASPHALT: 7, WATER: 8, GRASS: 9,
  PLATE: 10, ROAD: 11, PLASTIC: 12
};
const MAT_COUNT = 13;

/** 体素占位表：key = ix|iy|iz 编码，value = 材质 id（后写入覆盖先写入） */
const voxelMap = new Map();
const keyOf = (x, y, z) => (x + 512) * 1048576 + (y + 512) * 1024 + (z + 512);

function setVoxel(x, y, z, m) { voxelMap.set(keyOf(x, y, z), m); }
function getVoxel(x, y, z) { return voxelMap.get(keyOf(x, y, z)); }
function hasVoxel(x, y, z) { return voxelMap.has(keyOf(x, y, z)); }

/** 实心块填充 */
function fillBox(x0, y0, z0, x1, y1, z1, m) {
  for (let y = y0; y <= y1; y++)
    for (let z = z0; z <= z1; z++)
      for (let x = x0; x <= x1; x++) setVoxel(x, y, z, m);
}
/** 空心盒（只写外壳），用于建筑外墙 */
function shellBox(x0, y0, z0, x1, y1, z1, m) {
  for (let y = y0; y <= y1; y++)
    for (let z = z0; z <= z1; z++)
      for (let x = x0; x <= x1; x++) {
        const edge = (x === x0 || x === x1) && (z === z0 || z === z1);
        if (edge || y === y0 || y === y1) setVoxel(x, y, z, m);
      }
}
/** 实心盒但剔除完全被包围的内部体素（保守：只要 6 邻域全满就跳过） */
function solidBoxCulled(x0, y0, z0, x1, y1, z1, m) {
  for (let y = y0; y <= y1; y++)
    for (let z = z0; z <= z1; z++)
      for (let x = x0; x <= x1; x++) {
        const inner = x > x0 && x < x1 && y > y0 && y < y1 && z > z0 && z < z1;
        if (inner && hasVoxel(x - 1, y, z) && hasVoxel(x + 1, y, z) &&
            hasVoxel(x, y - 1, z) && hasVoxel(x, y + 1, z) &&
            hasVoxel(x, y, z - 1) && hasVoxel(x, y, z + 1)) continue;
        setVoxel(x, y, z, m);
      }
}

/** 体素坐标 → 世界坐标（体素中心） */
const v2w = (i) => (i + 0.5) * VOX;

/* ============================================================================
 * 4. 沙盘布局参数（明确边界的实心台座）
 * ==========================================================================*/
const GRID = 88;                       // 沙盘网格 88×88 体素 ≈ 44×44 世界单位
const HALF = GRID >> 1;                // 索引范围 [-44, 43]
const PEDESTAL_H = 5;                  // 台座高度（体素）
const GROUND_Y = PEDESTAL_H;           // 地表第一层体素索引

const inBounds = (x, z) => x >= -HALF && x < HALF && z >= -HALF && z < HALF;

/* ============================================================================
 * 5. 场景生成 I：实心台座（Plinth）
 *    —— 沙盘的"明确边界"：厚重的深色混凝土底座 + 顶面浅灰石板 + 倒角边线
 * ==========================================================================*/
function buildPedestal() {
  // 主体：深色混凝土（内部剔除，仅保留可见外壳，大幅降低实例数）
  solidBoxCulled(-HALF, 0, -HALF, HALF - 1, PEDESTAL_H - 1, HALF - 1, MAT.CONCRETE);
  // 顶面：浅色铺装板
  for (let z = -HALF; z < HALF; z++)
    for (let x = -HALF; x < HALF; x++) setVoxel(x, PEDESTAL_H, z, MAT.PLATE);
  // 台座四周的竖向强调线，强化"实体台座"轮廓
  for (let y = 0; y < PEDESTAL_H; y++) {
    for (let t = -HALF; t < HALF; t++) {
      setVoxel(t, y, -HALF, MAT.CONCRETE);
      setVoxel(t, y, HALF - 1, MAT.CONCRETE);
      setVoxel(-HALF, y, t, MAT.CONCRETE);
      setVoxel(HALF - 1, y, t, MAT.CONCRETE);
    }
  }
}

/* ============================================================================
 * 6. 场景生成 II：微缩沙盘核心（约 20×20×10 体素）
 *    —— 混凝土地基 / 被破坏一半的红砖墙 / 散落金属管道 / 中央玻璃发光体
 * ==========================================================================*/
const DIORAMA = { cx: 0, cz: 0 };   // 核心区中心（网格索引）

function buildDioramaCore() {
  const cx = DIORAMA.cx, cz = DIORAMA.cz;
  const S = 12;                                        // 半宽 12 → 24×24 体素（≈ 12×12 世界单位）
  const x0 = cx - S, x1 = cx + S - 1;
  const z0 = cz - S, z1 = cz + S - 1;

  /* --- (a) 底部灰白色混凝土地基 --- */
  fillBox(x0, GROUND_Y + 1, z0, x1, GROUND_Y + 1, z1, MAT.CONCRETE);
  // 地基侧面的侵蚀缺口：噪声决定是否缺失，露出下面的铺装
  for (let z = z0; z <= z1; z++)
    for (let x = x0; x <= x1; x++) {
      const n = fbm(x * 0.35 + 40, z * 0.35 + 40);
      if (n < 0.31) voxelMap.delete(keyOf(x, GROUND_Y + 1, z));
      else if (n > 0.76) setVoxel(x, GROUND_Y + 2, z, MAT.CONCRETE);  // 局部凸起
    }

  /* --- (b) 被破坏一半的红砖墙 --- */
  const wy0 = GROUND_Y + 2, wyTop = GROUND_Y + 12;     // 高 11 层 ≈ 12 体素规模
  const wallZ = cz - 3;                                 // 墙沿 X 方向延伸
  for (let x = x0 + 1; x <= x1 - 1; x++) {
    // 破坏剖面：左半段残留、右半段沿一条锯齿状断口整体塌落
    const t = (x - x0) / (x1 - x0);
    // 断口高度由多频噪声 + 整体下降趋势共同决定
    let brk = fbm(x * 0.55, 7.3) * 5.5 + (1.0 - t) * 3.2;
    if (x > cx + 3) brk -= (x - (cx + 3)) * 1.35;      // 右半段加速塌落
    const h = clamp(Math.round(wyTop - brk), wy0 - 1, wyTop);
    for (let y = wy0; y <= h; y++) {
      // 上半部随机掉砖（松动）
      if (y > wy0 + 4 && rng() < 0.13) continue;
      // 砖缝：交错砌法，偶数层偏移，缝隙用略深的砖色表示
      const course = (y - wy0) % 2 === 0;
      const off = course ? 0 : 1;
      if ((x + off) % 3 === 0 && rng() < 0.55) setVoxel(x, y, wallZ, MAT.BRICK);
      else setVoxel(x, y, wallZ, pick([MAT.BRICK, MAT.BRICK, MAT.BRICK, MAT.BRICK, MAT.WOOD]));
    }
    // 墙脚碎石堆积
    if (h >= wy0 && rng() < 0.5) {
      const rx = x + ri(-1, 1);
      if (inBounds(rx, wallZ + ri(0, 2))) setVoxel(rx, wy0 - 1, wallZ + ri(0, 2), MAT.BRICK);
    }
  }
  // 墙前散落的碎砖（破坏后的残骸）
  for (let i = 0; i < 46; i++) {
    const x = ri(x0, x1), z = ri(wallZ + 1, wallZ + 5);
    if (!inBounds(x, z)) continue;
    const h = ri(1, 2);
    for (let y = 0; y < h; y++) setVoxel(x, GROUND_Y + 1 + y, z, pick([MAT.BRICK, MAT.WOOD]));
  }

  /* --- (c) 散落的金属管道（银色 / 生锈色）--- */
  const pipes = [
    { x: cx - 6, z: cz + 4, len: 13, dir: 'x', m: MAT.METAL, r: 1.0 },
    { x: cx + 2, z: cz + 6, len: 9,  dir: 'x', m: MAT.RUST,  r: 1.0 },
    { x: cx + 7, z: cz + 1, len: 11, dir: 'z', m: MET_(0.42), r: 1.0 },
    { x: cx - 8, z: cz + 7, len: 7,  dir: 'z', m: MAT.RUST,  r: 1.0 }
  ];
  for (const p of pipes) {
    for (let i = 0; i < p.len; i++) {
      const jitter = Math.sin(i * 0.9 + p.x) * 0.6;
      const ix = p.x + (p.dir === 'x' ? i : Math.round(jitter));
      const iz = p.z + (p.dir === 'z' ? i : Math.round(jitter));
      if (!inBounds(ix, iz)) continue;
      // 管身：2×2 截面的方管的"口"字形排列（微体素圆柱近似）
      const yb = GROUND_Y + 2;
      for (let dy = 0; dy < 2; dy++)
        for (let dz = 0; dz < 2; dz++)
          for (let dx = 0; dx < 2; dx++) {
            const cxv = ix + (p.dir === 'x' ? 0 : dx);
            const czv = iz + (p.dir === 'x' ? dx : 0);
            if (!inBounds(cxv, czv)) continue;
            if (dx === 1 && dz === 1) continue;       // 掏空中心 → 管腔
            setVoxel(cxv, yb + dy, czv, p.m);
          }
      // 法兰环（每 4 格一圈凸起）
      if (i % 4 === 0) {
        for (let dy = 0; dy < 3; dy++)
          for (let d = -1; d <= 1; d++) {
            const fx = ix + (p.dir === 'x' ? 0 : d);
            const fz = iz + (p.dir === 'x' ? d : 0);
            if (inBounds(fx, fz)) setVoxel(fx, yb + dy, fz, p.m);
          }
      }
    }
  }
  function MET_(p) { return rng() < p ? MAT.METAL : MAT.RUST; }

  /* --- (d) 场景中央：半透明玻璃体素组成的发光体 / 落地窗 --- */
  // 玻璃展柜：4×4 底面、高 7 层的玻璃盒子，内部为发光核心
  const gx = cx - 2, gz = cz - 0, gh = 7;
  for (let y = 0; y < gh; y++)
    for (let dz = 0; dz < 4; dz++)
      for (let dx = 0; dx < 4; dx++) {
        const edge = (dx === 0 || dx === 3) && (dz === 0 || dz === 3);
        if (edge || y === 0 || y === gh - 1) setVoxel(gx + dx, GROUND_Y + 2 + y, gz + dz, MAT.GLASS);
      }
  // 内部发光核心（悬浮的暖色光源方块）
  setVoxel(gx + 1, GROUND_Y + 3, gz + 1, MAT.GLOW);
  setVoxel(gx + 2, GROUND_Y + 3, gz + 2, MAT.GLOW);
  setVoxel(gx + 1, GROUND_Y + 4, gz + 2, MAT.GLOW);
  setVoxel(gx + 2, GROUND_Y + 4, gz + 1, MAT.GLOW);
  setVoxel(gx + 1, GROUND_Y + 5, gz + 1, MAT.GLOW);
  // 金属底座与顶部压条
  for (let dz = 0; dz < 4; dz++)
    for (let dx = 0; dx < 4; dx++) setVoxel(gx + dx, GROUND_Y + 1, gz + dz, MAT.PLATE);
  for (let dz = -1; dz <= 4; dz++)
    for (let dx = -1; dx <= 4; dx++)
      if ((dx === -1 || dx === 4 || dz === -1 || dz === 4) && inBounds(gx + dx, gz + dz))
        setVoxel(gx + dx, GROUND_Y + 2 + gh, gz + dz, MAT.METAL);

  glowLight.position.set(v2w(gx + 1.5), v2w(GROUND_Y + 4) , v2w(gz + 1.5));
}

/* ============================================================================
 * 7. 场景生成 III：城市局部沙盘
 *    —— 道路网 / 街区建筑 / 城市设施（路灯、车、树、天桥、工地、公园）
 *    —— 体素风格河流（蜿蜒贯穿沙盘，含桥与河岸）
 * ==========================================================================*/
const cityBlocks = [];      // 记录建筑占地，用于设施避让
const roadMask = new Set(); // 道路占位
const waterMask = new Set();// 河流占位

/** 河流中心线：x 随 z 蜿蜒（贝塞尔式采样的正弦叠加） */
function riverCenterX(zWorld) {
  return Math.sin(zWorld * 0.085) * 9.0 + Math.sin(zWorld * 0.031 + 1.7) * 5.5 - 2.0;
}
const RIVER_HALF_W = 4.2;   // 半宽（世界单位）

function isRiver(x, z) {
  const wx = v2w(x), wz = v2w(z);
  const wc = riverCenterX(wz);
  const wob = (fbm(wz * 0.22, 11.5) - 0.5) * 1.8;      // 岸线不规则抖动
  return Math.abs(wx - wc) < RIVER_HALF_W + wob;
}

function buildTerrainAndRiver() {
  for (let z = -HALF; z < HALF; z++) {
    for (let x = -HALF; x < HALF; x++) {
      // 跳过核心 diorama 区（已由 buildDioramaCore 铺好地基）
      if (Math.abs(x - DIORAMA.cx) <= 10 && Math.abs(z - DIORAMA.cz) <= 10) continue;

      if (isRiver(x, z)) {
        waterMask.add(x * 1000 + z);
        // 河床下沉 1 层，水面 1 层
        setVoxel(x, GROUND_Y, z, MAT.CONCRETE);
        setVoxel(x, GROUND_Y + 1, z, MAT.WATER);
        continue;
      }
      // 河岸带：草 / 石
      const wx = v2w(x), wz = v2w(z);
      const d = Math.abs(wx - riverCenterX(wz));
      const n = fbm(x * 0.14 + 5, z * 0.14 + 5);
      let m = MAT.GRASS;
      if (d < RIVER_HALF_W + 2.6) m = MAT.PLATE;         // 石砌护岸
      else if (n > 0.62) m = MAT.PLATE;                  // 铺装空地
      else if (n < 0.30) m = MAT.CONCRETE;
      setVoxel(x, GROUND_Y + 1, z, m);
      // 少量地形起伏
      if (n > 0.80) setVoxel(x, GROUND_Y + 2, z, MAT.GRASS);
    }
  }
}

/** 道路网：3 条横 + 3 条纵，主干道宽 5，次干道宽 3 */
function buildRoads() {
  const lanesAt = [-30, -6, 18, 38];
  const lanesBt = [-32, -8, 16, 36];
  const markX = new Set(lanesAt), markZ = new Set(lanesBt);

  for (let z = -HALF; z < HALF; z++) {
    for (let x = -HALF; x < HALF; x++) {
      if (Math.abs(x - DIORAMA.cx) <= 10 && Math.abs(z - DIORAMA.cz) <= 10) continue;
      let onRoad = false, isMain = false;
      for (const lx of lanesAt) if (Math.abs(x - lx) <= 2) { onRoad = true; isMain = true; }
      for (const lz of lanesBt) if (Math.abs(z - lz) <= 1) { onRoad = true; }
      if (!onRoad) continue;

      if (isRiver(x, z)) continue;                       // 河流优先（下面架桥）

      // 路面铺在地表之上
      setVoxel(x, GROUND_Y + 1, z, MAT.ASPHALT);
      voxelMap.delete(keyOf(x, GROUND_Y + 2, z));

      // 中心虚线 / 边线
      if (isMain && Math.abs(x - lanesAt.find(l => Math.abs(x - l) <= 2)) === 0) {
        if ((z + 100) % 6 < 3) setVoxel(x, GROUND_Y + 2, z, MAT.ROAD);
      }
      roadMask.add(x * 1000 + z);
    }
  }
  return { markX, markZ };
}

/** 跨河桥梁 */
function buildBridges(roadInfo) {
  const bridgeZ = [];
  for (const lz of roadInfo.markZ) {
    // 检测该横向道路是否与河相交
    let hits = 0;
    for (let x = -HALF; x < HALF; x++) if (isRiver(x, lz)) hits++;
    if (hits > 0) bridgeZ.push(lz);
  }
  for (const lz of bridgeZ) {
    for (let z = lz - 2; z <= lz + 2; z++) {
      for (let x = -HALF; x < HALF; x++) {
        if (!isRiver(x, z)) continue;
        const edge = (z === lz - 2 || z === lz + 2);
        setVoxel(x, GROUND_Y + 1, z, MAT.CONCRETE);            // 桥面
        if (edge) {
          setVoxel(x, GROUND_Y + 2, z, MAT.METAL);             // 栏杆
          if ((x & 3) === 0) setVoxel(x, GROUND_Y + 3, z, MAT.METAL); // 栏杆立柱
        }
        waterMask.delete(x * 1000 + z);
      }
    }
    // 桥墩
    for (let z = lz - 1; z <= lz + 1; z++) {
      const cxw = riverCenterX(v2w(z));
      const px = Math.round(cxw / VOX);
      for (let y = 0; y <= GROUND_Y; y++) setVoxel(px, y, z, MAT.CONCRETE);
    }
  }
}

/** 建筑：沿街区网格排布，程序化外观（窗带、退台、屋顶设备、玻璃幕墙） */
function buildBuildings() {
  const lotCells = [];
  for (let bz = -HALF + 4; bz < HALF - 4; bz += 7)
    for (let bx = -HALF + 4; bx < HALF - 4; bx += 7)
      lotCells.push([bx, bz]);

  for (const [bx, bz] of lotCells) {
    // 与核心区 / 河流 / 道路保持距离
    if (Math.abs(bx - DIORAMA.cx) < 15 && Math.abs(bz - DIORAMA.cz) < 15) continue;

    const w = ri(4, 6), d = ri(4, 6);
    const x0 = bx, x1 = bx + w - 1, z0 = bz, z1 = bz + d - 1;
    if (x1 >= HALF - 2 || z1 >= HALF - 2) continue;

    // 合法性检查：占地内不得压到河流或道路
    let ok = true;
    for (let z = z0 - 1; z <= z1 + 1 && ok; z++)
      for (let x = x0 - 1; x <= x1 + 1 && ok; x++) {
        if (isRiver(x, z)) ok = false;
        if (roadMask.has(x * 1000 + z)) ok = false;
      }
    if (!ok) continue;

    const kind = rng();
    const height = kind < 0.5 ? ri(3, 6) : kind < 0.85 ? ri(7, 12) : ri(13, 20);
    const style = pick(['brick', 'concrete', 'glass', 'concrete', 'brick']);
    const baseM = style === 'brick' ? MAT.BRICK : style === 'glass' ? MAT.PLATE : MAT.CONCRETE;

    const y0 = GROUND_Y + 2, y1 = GROUND_Y + 1 + height;
    cityBlocks.push({ x0, x1, z0, z1, y1 });

    for (let y = y0; y <= y1; y++) {
      // 退台：高层上部收窄
      const shrink = y > y0 + Math.floor(height * 0.62) ? 1 : 0;
      const ax0 = x0 + shrink, ax1 = x1 - shrink;
      const az0 = z0 + shrink, az1 = z1 - shrink;
      if (ax1 < ax0 || az1 < az0) continue;

      const isTop = (y === y1);
      const isBottom = (y === y0);
      const faceY = (y - y0);

      for (let z = az0; z <= az1; z++) {
        for (let x = ax0; x <= ax1; x++) {
          const onX = (x === ax0 || x === ax1);
          const onZ = (z === az0 || z === az1);
          const isShell = onX || onZ;

          if (isTop) {
            // 屋顶：铺装 + 设备
            if (rng() < 0.16) setVoxel(x, y, z, MAT.METAL);        // 空调机组
            else if (rng() < 0.10) setVoxel(x, y, z, MAT.PLASTIC); // 水箱
            else setVoxel(x, y, z, MAT.CONCRETE);
            continue;
          }
          if (isBottom) { setVoxel(x, y, z, MAT.CONCRETE); continue; }

          if (!isShell) continue;                                   // 内部完全剔除

          // 立面：玻璃幕墙窗带 / 砖墙 / 混凝土
          const band = (faceY % 3 === 1);
          // 限制玻璃密度，避免整栋楼变成白色
          const windowOpen = band && ((x + y * 3 + z) % 7 < 2);
          if (style === 'glass') {
            setVoxel(x, y, z, windowOpen ? MAT.GLASS : MAT.PLATE);
          } else if (style === 'brick') {
            setVoxel(x, y, z, windowOpen ? MAT.GLASS : MAT.BRICK);
          } else {
            setVoxel(x, y, z, windowOpen ? MAT.GLASS : MAT.CONCRETE);
          }
        }
      }
      // 窗间横向压条（金属），强化体素楼层感
      if (faceY % 3 === 0 && faceY > 0 && !isTop) {
        for (let z = az0; z <= az1; z++)
          for (let x = ax0; x <= ax1; x++)
            if (x === ax0 || x === ax1 || z === az0 || z === az1)
              if (rng() < 0.75) setVoxel(x, y, z, MAT.METAL);
      }
    }

    // 夜间/室内发光窗：随机把部分玻璃换成发光体
    if (rng() < 0.55) {
      const lit = ri(3, 10);
      for (let i = 0; i < lit; i++) {
        const x = (rng() < 0.5) ? pick([x0, x1]) : ri(x0 + 1, x1 - 1);
        const z = (x === x0 || x === x1) ? ri(z0 + 1, z1 - 1) : pick([z0, z1]);
        const y = ri(y0 + 1, y1 - 1);
        if (getVoxel(x, y, z) === MAT.GLASS) setVoxel(x, y, z, MAT.GLOW);
      }
    }
  }
}

/** 城市设施：路灯、车辆、行道树、长椅、垃圾桶、工地塔吊、天桥 */
function buildProps(roadInfo) {
  const occupied = (x, z) => {
    for (const b of cityBlocks)
      if (x >= b.x0 - 1 && x <= b.x1 + 1 && z >= b.z0 - 1 && z <= b.z1 + 1) return true;
    return Math.abs(x - DIORAMA.cx) <= 13 && Math.abs(z - DIORAMA.cz) <= 13;
  };

  /* --- 路灯：沿主干道两侧每 9 格 --- */
  for (const lx of roadInfo.markX) {
    for (let z = -HALF + 3; z < HALF - 3; z += 9) {
      for (const side of [-1, 1]) {
        const x = lx + side * 3;
        if (!inBounds(x, z)) continue;
        if (isRiver(x, z) || roadMask.has(x * 1000 + z) || occupied(x, z)) continue;
        const h = 5;
        for (let y = 1; y <= h; y++) setVoxel(x, GROUND_Y + 1 + y, z, MAT.METAL);
        setVoxel(x, GROUND_Y + 2 + h, z, MAT.GLOW);          // 灯头
        setVoxel(x + (side > 0 ? -1 : 1), GROUND_Y + 2 + h, z, MAT.METAL); // 悬臂
      }
    }
  }

  /* --- 车辆：停在路边，体素小车 --- */
  const carColors = [MAT.PLASTIC, MAT.METAL, MAT.RUST, MAT.BRICK];
  let carCount = 0;
  for (const lz of roadInfo.markZ) {
    for (let x = -HALF + 4; x < HALF - 6 && carCount < 16; x += 11) {
      if (rng() < 0.42) continue;
      const z = lz + (rng() < 0.5 ? -2 : 3);
      if (isRiver(x, z) || isRiver(x + 2, z) || !inBounds(x + 2, z)) continue;
      if (occupied(x, z) || occupied(x + 2, z)) continue;
      const c = pick(carColors);
      // 车身 3 长 × 2 宽 × 1 高 + 驾驶舱 1 高
      for (let dx = 0; dx < 3; dx++) {
        setVoxel(x + dx, GROUND_Y + 2, z, c);
        if (dx === 1) setVoxel(x + dx, GROUND_Y + 3, z, c);
      }
      for (let dx = 0; dx < 3; dx += 2) setVoxel(x + dx, GROUND_Y + 1, z, MAT.METAL); // 轮
      if (rng() < 0.5) setVoxel(x, GROUND_Y + 3, z, MAT.GLOW);   // 车灯
      carCount++;
    }
  }

  /* --- 行道树：树坑 + 树干 + 树冠 --- */
  for (const lx of roadInfo.markX) {
    for (let z = -HALF + 6; z < HALF - 6; z += 6) {
      for (const side of [-1, 1]) {
        const x = lx + side * 4;
        if (rng() < 0.45) continue;
        if (!inBounds(x, z) || isRiver(x, z) || occupied(x, z)) continue;
        if (roadMask.has(x * 1000 + z)) continue;
        const th = ri(2, 3);
        for (let y = 1; y <= th; y++) setVoxel(x, GROUND_Y + 1 + y, z, MAT.WOOD);
        const cy = GROUND_Y + 1 + th;
        // 树冠：半径 2 的实心球（微体素）
        for (let dy = -1; dy <= 2; dy++)
          for (let dz = -2; dz <= 2; dz++)
            for (let dx = -2; dx <= 2; dx++) {
              const d2 = dx * dx + dy * dy * 1.6 + dz * dz;
              if (d2 <= 5.2 && inBounds(x + dx, z + dz))
                setVoxel(x + dx, cy + dy, z + dz, MAT.GRASS);
            }
      }
    }
  }

  /* --- 公园长椅 / 垃圾桶（散布在铺装区）--- */
  for (let i = 0; i < 26; i++) {
    const x = ri(-HALF + 3, HALF - 4), z = ri(-HALF + 3, HALF - 4);
    if (isRiver(x, z) || roadMask.has(x * 1000 + z) || occupied(x, z)) continue;
    if (rng() < 0.5) {                      // 长椅
      for (let dx = 0; dx < 3; dx++) {
        setVoxel(x + dx, GROUND_Y + 2, z, MAT.WOOD);
        if (dx !== 1) setVoxel(x + dx, GROUND_Y + 3, z, MAT.WOOD);
      }
    } else {                                 // 垃圾桶
      setVoxel(x, GROUND_Y + 2, z, MAT.PLASTIC);
      setVoxel(x, GROUND_Y + 3, z, MAT.METAL);
    }
  }

  /* --- 工地塔吊（城市天际线的体素标志物）--- */
  (function crane() {
    const bx = -HALF + 12, bz = HALF - 16;
    if (isRiver(bx, bz)) return;
    const H = 20;
    // 塔身：2×2 桁架
    for (let y = 0; y < H; y++)
      for (let dx = 0; dx < 2; dx++)
        for (let dz = 0; dz < 2; dz++)
          if (dx === 0 || dz === 0 || y % 3 === 0)
            setVoxel(bx + dx, GROUND_Y + 2 + y, bz + dz, MAT.METAL);
    // 吊臂 + 配重臂
    for (let i = -8; i <= 16; i++)
      if (inBounds(bx + i, bz)) {
        setVoxel(bx + i, GROUND_Y + 2 + H, bz, MAT.METAL);
        if (i % 5 === 0) setVoxel(bx + i, GROUND_Y + 3 + H, bz, MAT.METAL);
      }
    // 吊索 + 吊钩
    const hx = bx + 12;
    for (let y = 0; y < 6; y++) if (inBounds(hx, bz)) setVoxel(hx, GROUND_Y + H - 4 - y, bz, MAT.METAL);
    if (inBounds(hx, bz)) setVoxel(hx, GROUND_Y + H - 10, bz, MAT.RUST);
  })();

  /* --- 沿河护栏：仅在水体与陆地交界处立柱，且避开桥面 --- */
  for (const k of waterMask) {
    const x = Math.floor(k / 1000);
    const z = k - x * 1000;
    let nearLand = false;
    for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      if (!waterMask.has((x + dx) * 1000 + (z + dz))) nearLand = true;
    }
    if (nearLand && ((x + z) & 3) === 0 && !roadMask.has(k)) {
      setVoxel(x, GROUND_Y + 2, z, MAT.METAL);
    }
  }
}

/* ============================================================================
 * 8. 编译为 InstancedMesh（每种材质一个 draw call）
 * ==========================================================================*/
const MAT_DEF = {
  [MAT.CONCRETE]: { name: 'concrete', color: 0x46453F, metalness: 0.02, roughness: 0.92, transmission: 0,  emissive: 0x000000, emissiveIntensity: 0 },
  [MAT.PLATE]:    { name: 'plate',    color: 0x56544E, metalness: 0.03, roughness: 0.85, transmission: 0,  emissive: 0x000000, emissiveIntensity: 0 },
  [MAT.BRICK]:    { name: 'brick',    color: 0x8A3A2A, metalness: 0.00, roughness: 0.96, transmission: 0,  emissive: 0x000000, emissiveIntensity: 0 },
  [MAT.WOOD]:     { name: 'wood',     color: 0x6B4826, metalness: 0.00, roughness: 0.88, transmission: 0,  emissive: 0x000000, emissiveIntensity: 0 },
  [MAT.METAL]:    { name: 'metal',    color: 0xB9BDC4, metalness: 1.00, roughness: 0.26, transmission: 0,  emissive: 0x000000, emissiveIntensity: 0 },
  [MAT.RUST]:     { name: 'rust',     color: 0x7A4626, metalness: 0.85, roughness: 0.65, transmission: 0,  emissive: 0x000000, emissiveIntensity: 0 },
  [MAT.GLASS]:    { name: 'glass',    color: 0xB6DDE8, metalness: 0.00, roughness: 0.05, transmission: 0.95, emissive: 0x000000, emissiveIntensity: 0 },
  [MAT.GLOW]:     { name: 'glow',     color: 0xFFC978, metalness: 0.00, roughness: 0.60, transmission: 0,  emissive: 0xFFA23C, emissiveIntensity: 3.6 },
  [MAT.ASPHALT]:  { name: 'asphalt',  color: 0x2F3338, metalness: 0.05, roughness: 0.78, transmission: 0,  emissive: 0x000000, emissiveIntensity: 0 },
  [MAT.ROAD]:     { name: 'roadmark', color: 0xDED9C0, metalness: 0.00, roughness: 0.70, transmission: 0,  emissive: 0x000000, emissiveIntensity: 0 },
  [MAT.WATER]:    { name: 'water',    color: 0x2E6F95, metalness: 0.10, roughness: 0.08, transmission: 0.72, emissive: 0x000000, emissiveIntensity: 0 },
  [MAT.GRASS]:    { name: 'grass',    color: 0x4F7036, metalness: 0.00, roughness: 0.95, transmission: 0,  emissive: 0x000000, emissiveIntensity: 0 },
  [MAT.PLASTIC]:  { name: 'plastic',  color: 0x2B607A, metalness: 0.00, roughness: 0.45, transmission: 0,  emissive: 0x000000, emissiveIntensity: 0 }
};

// 单位立方体（微体素），略微内缩以保留体素间的缝隙 → SSAO 有明确的夹角可采样
const boxGeo = new THREE.BoxGeometry(VOX * 0.98, VOX * 0.98, VOX * 0.98);
boxGeo.computeBoundingSphere();

// 每种材质的实例数据
const buckets = Array.from({ length: MAT_COUNT }, () => ({
  mats: [], colors: []
}));

function compileVoxels() {
  for (const [key, m] of voxelMap) {
    const iz = key % 1024;
    const iy = Math.floor(key / 1024) % 1024;
    const ix = Math.floor(key / 1048576);
    const x = ix - 512, y = iy - 512, z = iz - 512;

    // 遮挡剔除：6 邻域全为不透明体素 → 内部不可见，丢弃
    const around =
      hasVoxel(x + 1, y, z) && hasVoxel(x - 1, y, z) &&
      hasVoxel(x, y + 1, z) && hasVoxel(x, y - 1, z) &&
      hasVoxel(x, y, z + 1) && hasVoxel(x, y, z - 1);
    if (around && y > 0) continue;

    const def = MAT_DEF[m];
    tmpM.compose(
      tmpV.set(v2w(x), (y + 0.5) * VOX, v2w(z)),
      tmpQ.identity(),
      tmpS.set(1, 1, 1)
    );
    buckets[m].mats.push(tmpM.clone());

    // 每实例轻微色差（Albedo jitter）：消除大片纯色的"塑料感"
    const j = (rng() - 0.5);
    const lumJ = 1 + j * 0.085;
    const hueJ = j * 0.030;
    tmpC.setHex(def.color);
    tmpC.multiplyScalar(lumJ);
    tmpC.offsetHSL(hueJ, j * 0.02, 0);
    buckets[m].colors.push(tmpC.clone());
  }
}

const instMeshes = [];
let totalInstances = 0;

function buildInstancedMeshes() {
  for (let m = 0; m < MAT_COUNT; m++) {
    const b = buckets[m];
    if (!b.mats.length) continue;
    const def = MAT_DEF[m];

    const isGlass = def.transmission > 0.5;
    const geo = boxGeo.clone();
    const count = b.mats.length;
    const inst = new THREE.InstancedBufferAttribute(new Float32Array(count * 3), 3);
    for (let i = 0; i < count; i++) {
      inst.setXYZ(i, b.colors[i].r, b.colors[i].g, b.colors[i].b);
    }
    geo.setAttribute('instanceColor', inst);

    const mat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      metalness: def.metalness,
      roughness: def.roughness,
      emissive: def.emissive,
      emissiveIntensity: def.emissiveIntensity,
      transmission: def.transmission,
      ior: def.transmission > 0 ? 1.48 : 1.45,
      thickness: def.transmission > 0 ? VOX * 1.6 : 0,
      attenuationDistance: def.transmission > 0 ? 1.5 : Infinity,
      attenuationColor: new THREE.Color(def.transmission > 0 ? 0x6db5cf : 0xffffff),
      clearcoat: def.transmission > 0 ? 0.35 : 0.0,
      clearcoatRoughness: 0.08,
      specularIntensity: 1.0,
      envMapIntensity: 1.0,
      vertexColors: false,
      flatShading: true,             // 微体素的硬朗切面
      side: THREE.FrontSide
    });
    mat.defines = mat.defines || {};
    // 让 instanceColor 参与着色（three r160 的 InstancedMesh 原生支持 instanceColor，
    // 这里手工注入 USE_INSTANCING_COLOR 以配合 InstancedBufferAttribute）
    mat.onBeforeCompile = (shader) => {
      shader.defines = shader.defines || {};
      shader.defines.USE_INSTANCING_COLOR = '';
    };

    const im = new THREE.InstancedMesh(geo, mat, count);
    im.instanceMatrix.setUsage(THREE.StaticDrawUsage);
    for (let i = 0; i < count; i++) im.setMatrixAt(i, b.mats[i]);
    im.instanceMatrix.needsUpdate = true;

    im.castShadow = !isGlass;
    im.receiveShadow = true;
    im.frustumCulled = false;
    im.name = 'voxel_' + def.name;
    im.userData.matId = m;
    im.userData.isGlass = isGlass;

    // 玻璃需要正确的深度排序：关闭写深度避免自遮挡伪影
    if (isGlass) {
      im.renderOrder = 2;
      mat.depthWrite = true;
      mat.transparent = false;      // 使用 transmission 而非 alpha blend
    }

    scene.add(im);
    instMeshes.push(im);
    totalInstances += count;
  }
}

/* ============================================================================
 * 9. 后处理管线：Render → SSAO → 移轴景深(DOF/Bokeh) → SMAA → Output
 * ==========================================================================*/

/* --- 9.1 移轴景深：基于深度的对焦 + 可分离散焦模糊（Bokeh） --- */
const BokehShader = {
  uniforms: {
    tDiffuse:    { value: null },
    tDepth:      { value: null },
    uResolution: { value: new THREE.Vector2(1, 1) },
    uFocus:      { value: 42.0 },   // 对焦距离（世界单位，沿视线）
    uRange:      { value: 4.5 },    // 清晰带半宽（移轴沙盘厚度）
    uMaxBlur:    { value: 3.6 },    // 最大散焦半径（像素 ×系数）
    uBokeh:      { value: 1.0 },    // 散焦圈形状强度
    uNear:       { value: 0.5 },
    uFar:        { value: 600.0 },
    uEnabled:    { value: 1.0 },
    uDebug:      { value: 0.0 }
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,
  fragmentShader: /* glsl */`
    #include <common>
    varying vec2 vUv;
    uniform sampler2D tDiffuse;
    uniform sampler2D tDepth;
    uniform vec2  uResolution;
    uniform float uFocus, uRange, uMaxBlur, uBokeh, uNear, uFar, uEnabled, uDebug;

    const int TAPS = 16;
    // 黄金角螺旋采样 → 均匀的散焦圆盘
    const float GOLDEN = 2.39996323;

    float linearDepth(float d){
      float z = d * 2.0 - 1.0;
      return (2.0 * uNear * uFar) / (uFar + uNear - z * (uFar - uNear));
    }

    float cocFor(float viewZ){
      // 移轴模型：|Z - focus| 在 range 内完全清晰，超出后线性增长并饱和
      float d = abs(viewZ - uFocus) - uRange;
      if (d <= 0.0) return 0.0;
      return clamp(d / (uRange * 1.6 + 1e-3), 0.0, 1.0);
    }

    void main(){
      vec4 base = texture2D(tDiffuse, vUv);

      if (uEnabled < 0.5) { gl_FragColor = base; return; }

      float dz = texture2D(tDepth, vUv).x;
      float viewZ = linearDepth(dz);
      float coc = cocFor(viewZ);

      if (uDebug > 0.5){
        gl_FragColor = vec4(vec3(1.0 - coc), 1.0);
        return;
      }

      if (coc <= 0.0015) { gl_FragColor = base; return; }

      float radius = coc * uMaxBlur;              // 像素
      vec2 texel = radius / uResolution;

      vec3 sum = base.rgb;
      float wsum = 1.0;

      // 前景像素可以"涂抹"到背景上，背景像素不能被前景污染 → 做 coc 比较
      for (int i = 0; i < TAPS; i++){
        float fi = float(i);
        float a = fi * GOLDEN;
        float r = sqrt((fi + 0.5) / float(TAPS));
        vec2 off = vec2(cos(a), sin(a)) * r;

        // 六边形 bokeh 整形（轻微偏圆，保留玩具感）
        off = normalize(off + 1e-6) * pow(length(off), mix(1.0, 0.85, uBokeh));

        vec2 uv = vUv + off * texel;
        vec3 c = texture2D(tDiffuse, uv).rgb;
        float sz = linearDepth(texture2D(tDepth, uv).x);
        float sc = cocFor(sz);

        // 采样点比中心更清晰 → 降低其权重（避免清晰前景污染背景）
        float w = max(sc, coc * 0.35);
        w = clamp(w / max(coc, 1e-4), 0.0, 1.0);
        w = mix(w, 1.0, 0.35);
        sum += c * w;
        wsum += w;
      }

      vec3 col = sum / wsum;
      gl_FragColor = vec4(col, base.a);
    }
  `
};

/* --- 9.2 最终合成：轻微暗角 + 胶片颗粒 + 阴影/高光微调 --- */
const GradeShader = {
  uniforms: {
    tDiffuse:   { value: null },
    uVignette:  { value: 0.34 },
    uGrain:     { value: 0.030 },
    uTime:      { value: 0 },
    uContrast:  { value: 1.045 },
    uSaturation:{ value: 1.06 }
  },
  vertexShader: BokehShader.vertexShader,
  fragmentShader: /* glsl */`
    varying vec2 vUv;
    uniform sampler2D tDiffuse;
    uniform float uVignette, uGrain, uTime, uContrast, uSaturation;
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);

      // 暗角（微缩沙盘的镜头感）
      vec2 p = vUv - 0.5;
      float v = 1.0 - uVignette * dot(p, p) * 1.85;
      c.rgb *= clamp(v, 0.0, 1.0);

      // 对比度 / 饱和度
      c.rgb = (c.rgb - 0.5) * uContrast + 0.5;
      float l = dot(c.rgb, vec3(0.2126, 0.7152, 0.0722));
      c.rgb = mix(vec3(l), c.rgb, uSaturation);

      // 胶片颗粒
      float n = fract(sin(dot(vUv * uResolutionDummy(), vec2(12.9898, 78.233))) * 43758.5453);
      c.rgb += (n - 0.5) * uGrain;

      gl_FragColor = vec4(clamp(c.rgb, 0.0, 1.0), 1.0);
    }
  `.replace('uResolutionDummy()', 'vec2(1920.0, 1080.0) + uTime * 0.0')
};

const composer = new EffectComposer(renderer);
composer.setSize(window.innerWidth, window.innerHeight);

const renderTarget = new THREE.WebGLRenderTarget(
  window.innerWidth, window.innerHeight,
  { type: THREE.HalfFloatType, samples: 4, depthTexture: new THREE.DepthTexture() }
);
composer.renderTarget1 = renderTarget;
composer.renderTarget2 = renderTarget.clone();

const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

const ssaoPass = new SSAOPass(scene, camera, window.innerWidth, window.innerHeight);
ssaoPass.kernelRadius = 0.65;
ssaoPass.minDistance = 0.0005;
ssaoPass.maxDistance = 0.10;
ssaoPass.output = SSAOPass.OUTPUT.Default;
composer.addPass(ssaoPass);

const bokehPass = new ShaderPass(BokehShader);
bokehPass.uniforms.tDepth.value = renderTarget.depthTexture;
composer.addPass(bokehPass);

const gradePass = new ShaderPass(GradeShader);
composer.addPass(gradePass);

const smaaPass = new SMAAPass(
  window.innerWidth * renderer.getPixelRatio(),
  window.innerHeight * renderer.getPixelRatio()
);
composer.addPass(smaaPass);

const outputPass = new OutputPass();
composer.addPass(outputPass);

// SSAO 强度：通过多次乘算增强（SSAOPass 本身是乘性 AO）
let aoIntensity = 1.15;
ssaoPass.needsSwap = true;

/* ============================================================================
 * 10. 体素拾取交互（射线 → InstancedMesh.instanceId）
 * ==========================================================================*/
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let hoverInfo = null;

const outlineGeo = new THREE.BoxGeometry(VOX * 1.06, VOX * 1.06, VOX * 1.06);
const outlineMat = new THREE.MeshBasicMaterial({
  color: 0xffb04a, wireframe: true, transparent: true, opacity: 0.9, depthTest: false
});
const outline = new THREE.Mesh(outlineGeo, outlineMat);
outline.visible = false;
outline.renderOrder = 999;
scene.add(outline);

renderer.domElement.addEventListener('pointermove', (e) => {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
});
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(instMeshes, false);
  if (hits.length) {
    const h = hits[0];
    const im = h.object;
    tmpM.fromArray(im.instanceMatrix.array, h.instanceId * 16);
    tmpV.setFromMatrixPosition(tmpM);
    outline.position.copy(tmpV);
    outline.visible = true;
    hoverInfo = {
      mat: MAT_DEF[im.userData.matId].name,
      pos: tmpV.clone(),
      dist: h.distance
    };
  } else {
    outline.visible = false;
    hoverInfo = null;
  }
});

/* ============================================================================
 * 11. UI 绑定
 * ==========================================================================*/
const $ = id => document.getElementById(id);
function bindRange(id, valId, fn, fmt = v => v.toFixed(2)) {
  const el = $(id), vl = $(valId);
  const upd = () => { const v = parseFloat(el.value); vl.textContent = fmt(v); fn(v); };
  el.addEventListener('input', upd);
  upd();
}
function bindCheck(id, fn) {
  const el = $(id);
  const upd = () => fn(el.checked);
  el.addEventListener('change', upd);
  upd();
}

bindRange('r-aoi', 'v-aoi', v => { aoIntensity = v; });
bindRange('r-aor', 'v-aor', v => { ssaoPass.kernelRadius = v; });
bindRange('r-focus', 'v-focus', v => { bokehPass.uniforms.uFocus.value = v; }, v => v.toFixed(1));
bindRange('r-range', 'v-range', v => { bokehPass.uniforms.uRange.value = v; }, v => v.toFixed(1));
bindRange('r-blur', 'v-blur', v => { bokehPass.uniforms.uMaxBlur.value = v; }, v => v.toFixed(1));
bindRange('r-sun', 'v-sun', v => { sun.intensity = v; }, v => v.toFixed(1));
bindRange('r-env', 'v-env', v => { scene.environmentIntensity = v; }, v => v.toFixed(2));
bindRange('r-exp', 'v-exp', v => { renderer.toneMappingExposure = Math.pow(2, v); });
bindRange('r-ior', 'v-ior', v => {
  for (const im of instMeshes) if (im.userData.isGlass) im.material.ior = v;
});
bindRange('r-metal', 'v-metal', v => {
  for (const im of instMeshes) {
    const id = im.userData.matId;
    if (id === MAT.METAL || id === MAT.RUST) {
      im.material.metalness = id === MAT.RUST ? v * 0.85 : v;
    }
  }
});
bindRange('r-rough', 'v-rough', v => {
  for (const im of instMeshes) {
    const id = im.userData.matId;
    if (id === MAT.METAL) im.material.roughness = v;
    else if (id === MAT.RUST) im.material.roughness = clamp(v * 2.8, 0.05, 1.0);
  }
});

bindCheck('s-ao', v => { ssaoPass.enabled = v; });
bindCheck('s-dof', v => { bokehPass.uniforms.uEnabled.value = v ? 1 : 0; });
bindCheck('s-shadow', v => {
  renderer.shadowMap.enabled = v;
  sun.castShadow = v;
  instMeshes.forEach(im => { im.material.needsUpdate = true; });
});
bindCheck('s-glass', v => {
  for (const im of instMeshes) {
    if (im.userData.isGlass) {
      im.material.transmission = v ? 0.95 : 0.0;
      im.material.opacity = v ? 1.0 : 0.55;
      im.material.transparent = !v;
      im.material.needsUpdate = true;
    }
  }
});

// 视角预设
function flyTo(pos, target) {
  const from = camera.position.clone(), ft = controls.target.clone();
  const t0 = performance.now();
  controls.enabled = false;
  (function step() {
    const k = clamp((performance.now() - t0) / 780, 0, 1);
    const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(from, pos, e);
    controls.target.lerpVectors(ft, target, e);
    controls.update();
    if (k < 1) requestAnimationFrame(step); else controls.enabled = true;
  })();
}
$('b-iso').onclick = () => flyTo(ISO_DIR.clone().multiplyScalar(ISO_DIST), new THREE.Vector3(0, 3.5, 0));
$('b-street').onclick = () => flyTo(new THREE.Vector3(-22, 9.0, 26), new THREE.Vector3(-2, 4.0, -6));
$('b-top').onclick = () => flyTo(new THREE.Vector3(0.01, 40, 0.01), new THREE.Vector3(0, 3, 0));
$('b-autorot').onclick = (e) => {
  controls.autoRotate = !controls.autoRotate;
  e.target.style.background = controls.autoRotate ? 'rgba(255,176,74,.22)' : '';
};

/* ============================================================================
 * 12. Resize / 主循环 / 统计
 * ==========================================================================*/
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  ssaoPass.setSize(w, h);
  smaaPass.setSize(w * renderer.getPixelRatio(), h * renderer.getPixelRatio());
  const pr = renderer.getPixelRatio();
  bokehPass.uniforms.uResolution.value.set(w * pr, h * pr);
  bokehPass.uniforms.tDepth.value = renderTarget.depthTexture;
}
window.addEventListener('resize', onResize);

const clock = new THREE.Clock();
let frames = 0, fpsTimer = 0, fps = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  controls.update();

  // 河面轻微起伏：整体上下微动（体素水面，保持离散感）
  const t = clock.elapsedTime;
  waterMeshUpdate(t);

  gradePass.uniforms.uTime.value = t;
  bokehPass.uniforms.uNear.value = camera.near;
  bokehPass.uniforms.uFar.value = camera.far;

  // 自动对焦到轨道中心（移轴：清晰带始终贴合沙盘中心）
  if (!controls.autoRotate) {
    const d = camera.position.distanceTo(controls.target);
    bokehPass.uniforms.uFocus.value = lerp(
      bokehPass.uniforms.uFocus.value, d, 1 - Math.pow(0.001, dt)
    );
  }

  composer.render();

  frames++; fpsTimer += dt;
  if (fpsTimer >= 0.5) {
    fps = Math.round(frames / fpsTimer);
    frames = 0; fpsTimer = 0;
    updateStats();
  }
}

let waterIM = null;
function waterMeshUpdate(t) {
  if (!waterIM) {
    waterIM = instMeshes.find(im => im.userData.matId === MAT.WATER);
    if (!waterIM) return;
    waterIM.userData.base = [];
    for (let i = 0; i < waterIM.count; i++) {
      tmpM.fromArray(waterIM.instanceMatrix.array, i * 16);
      tmpV.setFromMatrixPosition(tmpM);
      waterIM.userData.base.push(tmpV.y);
    }
  }
  // 每帧只更新 Y（体素水面保持水平分层，位移量化到 1/4 体素 → 保持体素感）
  const arr = waterIM.instanceMatrix.array;
  const base = waterIM.userData.base;
  for (let i = 0; i < waterIM.count; i++) {
    tmpM.fromArray(arr, i * 16);
    tmpV.setFromMatrixPosition(tmpM);
    const wave = Math.sin(t * 1.6 + base[i] * 0.0 + tmpV.x * 0.55 + tmpV.z * 0.42) * 0.5
               + Math.sin(t * 0.9 + tmpV.z * 0.31) * 0.35;
    const q = Math.round(wave * 3) / 3 * 0.14;      // 量化 → 离散体素台阶
    tmpM.setPosition(tmpV.x, base[i] + q, tmpV.z);
    tmpM.toArray(arr, i * 16);
  }
  waterIM.instanceMatrix.needsUpdate = true;
}

function updateStats() {
  const drawCalls = renderer.info.render.calls;
  const tris = renderer.info.render.triangles;
  $('stats').innerHTML =
    `体素实例 <b>${totalInstances.toLocaleString()}</b> · 材质批次 <b>${instMeshes.length}</b><br />` +
    `DrawCall <b>${drawCalls}</b> · 三角形 <b>${(tris / 1000).toFixed(0)}K</b> · FPS <b>${fps}</b><br />` +
    (hoverInfo
      ? `拾取：<b>${hoverInfo.mat}</b> @ (${hoverInfo.pos.x.toFixed(1)}, ${hoverInfo.pos.y.toFixed(1)}, ${hoverInfo.pos.z.toFixed(1)})`
      : `提示：点击任意体素查看其材质`);
}

/* ============================================================================
 * 13. 启动
 * ==========================================================================*/
function boot() {
  buildPedestal();
  buildDioramaCore();
  buildTerrainAndRiver();
  const roadInfo = buildRoads();
  buildBridges(roadInfo);
  buildBuildings();
  buildProps(roadInfo);

  compileVoxels();
  buildInstancedMeshes();

  onResize();
  animate();

  setTimeout(() => {
    const l = document.getElementById('loader');
    l.classList.add('hidden');
    document.getElementById('hud').style.display = 'block';
    setTimeout(() => l.remove(), 700);
  }, 320);
}

try {
  boot();
} catch (err) {
  const e = document.getElementById('err');
  e.style.display = 'block';
  e.textContent = '初始化失败：\n' + (err && err.stack ? err.stack : err);
  console.error(err);
}
</script>
</body>
</html>
