<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>微体素 PBR 沙盘 — Teardown 风格渲染</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0d0d; }
canvas { display: block; }

#hud {
  position: fixed; top: 0; left: 0; z-index: 10;
  padding: 12px 16px;
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 12px; line-height: 1.7;
  color: #a0a0a0; background: rgba(10,10,10,0.88);
  border-right: 1px solid #333; border-bottom: 1px solid #333;
  pointer-events: none; user-select: none;
}
#hud .title { color: #e0e0e0; font-size: 13px; font-weight: bold; letter-spacing: 1px; }
#hud .sep { color: #444; }
#hud .val { color: #70b0e0; }
#hud .dim { color: #606060; }

/* ─── SETTINGS PANEL ─── */
#panelToggle {
  position: fixed; top: 10px; right: 10px; z-index: 100;
  width: 32px; height: 32px;
  background: #1a1a1a; border: 1px solid #444;
  color: #a0a0a0; font-family: 'Consolas', monospace; font-size: 16px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
#panelToggle:hover { background: #252525; color: #e0e0e0; border-color: #666; }

#settingsPanel {
  position: fixed; top: 0; right: 0; z-index: 90;
  width: 320px; height: 100%; overflow-y: auto;
  background: rgba(12,12,14,0.95); border-left: 1px solid #333;
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 11px; color: #b0b0b0;
  transform: translateX(100%); transition: transform 0.2s ease;
  padding: 48px 14px 20px 14px;
}
#settingsPanel.open { transform: translateX(0); }
#settingsPanel::-webkit-scrollbar { width: 4px; }
#settingsPanel::-webkit-scrollbar-track { background: #111; }
#settingsPanel::-webkit-scrollbar-thumb { background: #444; }

.grp { margin-bottom: 16px; border: 1px solid #2a2a2a; background: #141416; }
.grp-hdr {
  padding: 7px 10px; background: #1c1c1f; border-bottom: 1px solid #2a2a2a;
  color: #8ab4d8; font-size: 11px; font-weight: bold; letter-spacing: 1px;
  cursor: pointer; user-select: none; display: flex; justify-content: space-between;
}
.grp-hdr:hover { background: #222226; }
.grp-hdr .arrow { color: #555; font-size: 10px; }
.grp-body { padding: 8px 10px; }
.grp-body.collapsed { display: none; }

.ctrl { margin-bottom: 8px; }
.ctrl label { display: flex; justify-content: space-between; margin-bottom: 3px; color: #888; }
.ctrl label .cv { color: #70b0e0; min-width: 48px; text-align: right; }
.ctrl input[type="range"] {
  width: 100%; height: 3px; -webkit-appearance: none; appearance: none;
  background: #333; outline: none; cursor: pointer;
}
.ctrl input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 10px; height: 14px;
  background: #5a8ab5; border: 1px solid #7ab0d8; cursor: pointer;
}
.ctrl input[type="range"]::-moz-range-thumb {
  width: 10px; height: 14px; background: #5a8ab5; border: 1px solid #7ab0d8;
  border-radius: 0; cursor: pointer;
}
.ctrl-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.ctrl-row label { flex: 1; color: #888; }
.ctrl-row input[type="checkbox"] { accent-color: #5a8ab5; }

.btn-reset {
  width: 100%; padding: 6px; margin-top: 4px;
  background: #1a1a1a; border: 1px solid #444; color: #a0a0a0;
  font-family: 'Consolas', monospace; font-size: 11px; cursor: pointer;
}
.btn-reset:hover { background: #252525; color: #e0e0e0; }
</style>
</head>
<body>

<div id="hud">
  <div class="title">微体素 PBR 沙盘</div>
  <div class="sep">────────────────────────────</div>
  <div>体素数: <span class="val" id="voxCount">—</span></div>
  <div>帧率: <span class="val" id="fpsVal">—</span></div>
  <div class="sep">────────────────────────────</div>
  <div class="dim">左键: 旋转 | 右键: 平移 | 滚轮: 缩放</div>
</div>

<button id="panelToggle" title="设置">S</button>

<div id="settingsPanel">
  <!-- SSAO 组 -->
  <div class="grp">
    <div class="grp-hdr" data-target="grpAO">SSAO / 环境光遮蔽 <span class="arrow">[-]</span></div>
    <div class="grp-body" id="grpAO">
      <div class="ctrl-row"><label>启用</label><input type="checkbox" id="aoEnable" checked></div>
      <div class="ctrl"><label>采样半径 <span class="cv" id="v_aoRadius">0.60</span></label>
        <input type="range" id="aoRadius" min="0.05" max="2.0" step="0.01" value="0.60"></div>
      <div class="ctrl"><label>最小距离 <span class="cv" id="v_aoMin">0.0010</span></label>
        <input type="range" id="aoMin" min="0.0001" max="0.02" step="0.0001" value="0.001"></div>
      <div class="ctrl"><label>最大距离 <span class="cv" id="v_aoMax">0.150</span></label>
        <input type="range" id="aoMax" min="0.01" max="0.5" step="0.005" value="0.15"></div>
    </div>
  </div>

  <!-- 镜面反射组 -->
  <div class="grp">
    <div class="grp-hdr" data-target="grpMirror">镜面反射 / 玻璃 <span class="arrow">[-]</span></div>
    <div class="grp-body" id="grpMirror">
      <div class="ctrl-row"><label>启用</label><input type="checkbox" id="mirrorEnable" checked></div>
      <div class="ctrl"><label>反射强度 <span class="cv" id="v_mirrorInt">1.50</span></label>
        <input type="range" id="mirrorInt" min="0.0" max="3.0" step="0.05" value="1.5"></div>
      <div class="ctrl"><label>更新间隔(帧) <span class="cv" id="v_mirrorInterval">30</span></label>
        <input type="range" id="mirrorInterval" min="5" max="120" step="5" value="30"></div>
    </div>
  </div>

  <!-- 景深 / 相机组 -->
  <div class="grp">
    <div class="grp-hdr" data-target="grpDOF">景深 / 相机光学 <span class="arrow">[-]</span></div>
    <div class="grp-body" id="grpDOF">
      <div class="ctrl-row"><label>启用</label><input type="checkbox" id="dofEnable" checked></div>
      <div class="ctrl-row"><label>自动对焦(画面中心)</label><input type="checkbox" id="dofAutoFocus" checked></div>
      <div class="ctrl"><label>对焦距离 <span class="cv" id="v_dofFocus">18.0</span></label>
        <input type="range" id="dofFocus" min="2.0" max="50.0" step="0.5" value="18.0" disabled></div>
      <div class="ctrl"><label>光圈 <span class="cv" id="v_dofAperture">0.0008</span></label>
        <input type="range" id="dofAperture" min="0.0" max="0.005" step="0.00005" value="0.0008"></div>
      <div class="ctrl"><label>最大模糊 <span class="cv" id="v_dofMaxblur">0.0080</span></label>
        <input type="range" id="dofMaxblur" min="0.0" max="0.03" step="0.0005" value="0.008"></div>
      <div class="ctrl"><label>视场角 <span class="cv" id="v_camFov">40</span></label>
        <input type="range" id="camFov" min="15" max="90" step="1" value="40"></div>
    </div>
  </div>

  <!-- 光照组 -->
  <div class="grp">
    <div class="grp-hdr" data-target="grpLight">光照 / 环境 <span class="arrow">[-]</span></div>
    <div class="grp-body" id="grpLight">
      <div class="ctrl"><label>主光强度 <span class="cv" id="v_sunInt">4.50</span></label>
        <input type="range" id="sunInt" min="0.0" max="12.0" step="0.1" value="4.5"></div>
      <div class="ctrl"><label>补光强度 <span class="cv" id="v_fillInt">1.20</span></label>
        <input type="range" id="fillInt" min="0.0" max="5.0" step="0.05" value="1.2"></div>
      <div class="ctrl"><label>天光强度 <span class="cv" id="v_hemiInt">0.80</span></label>
        <input type="range" id="hemiInt" min="0.0" max="3.0" step="0.05" value="0.8"></div>
      <div class="ctrl"><label>环境亮度 <span class="cv" id="v_envInt">1.00</span></label>
        <input type="range" id="envInt" min="0.0" max="3.0" step="0.05" value="1.0"></div>
      <div class="ctrl"><label>曝光 <span class="cv" id="v_exposure">1.10</span></label>
        <input type="range" id="exposure" min="0.2" max="3.0" step="0.05" value="1.1"></div>
      <div class="ctrl"><label>阴影偏移 <span class="cv" id="v_shadowBias">-0.0004</span></label>
        <input type="range" id="shadowBias" min="-0.002" max="0.002" step="0.0001" value="-0.0004"></div>
    </div>
  </div>

  <!-- 自发光组 -->
  <div class="grp">
    <div class="grp-hdr" data-target="grpEmit">自发光 / 辉光 <span class="arrow">[-]</span></div>
    <div class="grp-body" id="grpEmit">
      <div class="ctrl"><label>发光强度 <span class="cv" id="v_glowInt">2.50</span></label>
        <input type="range" id="glowInt" min="0.0" max="10.0" step="0.1" value="2.5"></div>
      <div class="ctrl"><label>发光半径 <span class="cv" id="v_glowRadius">3.0</span></label>
        <input type="range" id="glowRadius" min="0.5" max="8.0" step="0.1" value="3.0"></div>
    </div>
  </div>

  <!-- 场景组 -->
  <div class="grp">
    <div class="grp-hdr" data-target="grpScene">场景 / 雾效 <span class="arrow">[-]</span></div>
    <div class="grp-body" id="grpScene">
      <div class="ctrl-row"><label>启用雾效</label><input type="checkbox" id="fogEnable" checked></div>
      <div class="ctrl"><label>雾浓度 <span class="cv" id="v_fogDensity">0.0120</span></label>
        <input type="range" id="fogDensity" min="0.0" max="0.06" step="0.001" value="0.012"></div>
      <div class="ctrl-row"><label>太阳动画</label><input type="checkbox" id="sunAnimate" checked></div>
      <div class="ctrl-row"><label>锁定帧率</label><input type="checkbox" id="fpsLock" checked></div>
      <div class="ctrl"><label>目标帧率 <span class="cv" id="v_fpsTarget">60</span></label>
        <input type="range" id="fpsTarget" min="15" max="144" step="1" value="60"></div>
    </div>
  </div>

  <button class="btn-reset" id="btnReset">恢复默认设置</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ═══════════════════════════════════════════
// SECTION 1: RENDERER & SCENE
// ═══════════════════════════════════════════

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1c22);
scene.fog = new THREE.FogExp2(0x1a1c22, 0.012);

// ═══════════════════════════════════════════
// SECTION 2: CAMERA
// ═══════════════════════════════════════════

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(14, 12, 14);
camera.lookAt(0, 1.5, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 5;
controls.maxDistance = 50;
controls.maxPolarAngle = Math.PI * 0.48;
controls.update();

// ═══════════════════════════════════════════
// SECTION 3: PBR MATERIALS
// ═══════════════════════════════════════════

const matConcrete = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, roughness: 0.92, metalness: 0.0,
  clearcoat: 0.0, envMapIntensity: 0.3
});
const matBrick = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, roughness: 0.85, metalness: 0.0,
  clearcoat: 0.0, envMapIntensity: 0.2
});
const matMetal = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, roughness: 0.18, metalness: 0.95,
  clearcoat: 0.3, clearcoatRoughness: 0.1, envMapIntensity: 1.2
});
const matGlass = new THREE.MeshPhysicalMaterial({
  color: 0xddeeff, roughness: 0.05, metalness: 0.0,
  transmission: 0.92, ior: 1.52, thickness: 0.4,
  clearcoat: 1.0, clearcoatRoughness: 0.02,
  envMapIntensity: 1.5, transparent: true
});
const matWood = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, roughness: 0.88, metalness: 0.0,
  clearcoat: 0.0, envMapIntensity: 0.15
});
const matEmissive = new THREE.MeshPhysicalMaterial({
  color: 0x111111, roughness: 0.3, metalness: 0.0,
  emissive: new THREE.Color(0.4, 0.85, 1.0), emissiveIntensity: 2.5
});

// ═══════════════════════════════════════════
// SECTION 4: VOXEL DATA
// ═══════════════════════════════════════════

const VS = 0.5;
const voxels = { concrete: [], brick: [], metal: [], glass: [], wood: [], emissive: [] };

function addVoxel(category, x, y, z, color) {
  voxels[category].push({ x: x * VS, y: y * VS + VS * 0.5, z: z * VS, color });
}

let seed = 42;
function rand() { seed = (seed * 16807 + 0) % 2147483647; return (seed - 1) / 2147483646; }

// --- CONCRETE BASE ---
const BASE_W = 24, BASE_D = 24, BASE_H = 2;
const ox = -BASE_W / 2, oz = -BASE_D / 2;
for (let ly = 0; ly < BASE_H; ly++) {
  for (let bx = 0; bx < BASE_W; bx++) {
    for (let bz = 0; bz < BASE_D; bz++) {
      if (ly === 1 && rand() < 0.03) continue;
      const g = 0.45 + rand() * 0.2;
      const tint = rand() < 0.1 ? 0.03 : 0;
      addVoxel('concrete', ox + bx, ly, oz + bz, new THREE.Color(g + tint, g, g - tint * 0.5));
    }
  }
}

// --- DAMAGED BRICK WALL ---
const WALL_X = -8, WALL_Z = -6, WALL_W = 14, WALL_H = 10;
for (let wy = 0; wy < WALL_H; wy++) {
  for (let wx = 0; wx < WALL_W; wx++) {
    const damageThreshold = WALL_H - 2 - (wx / WALL_W) * 5;
    if (wy > damageThreshold + rand() * 2.5) continue;
    if (wy > damageThreshold - 1 && rand() < 0.5) continue;
    const isMortar = (wy % 3 === 0) || ((wx + Math.floor(wy / 3)) % 4 === 0);
    let c;
    if (isMortar) {
      c = new THREE.Color(0.55 + rand() * 0.05, 0.52 + rand() * 0.05, 0.48);
    } else {
      const r = 0.55 + rand() * 0.2;
      c = new THREE.Color(r, r * 0.35 + rand() * 0.05, r * 0.2);
    }
    addVoxel('brick', WALL_X + wx, BASE_H + wy, WALL_Z, c);
  }
}
for (let i = 0; i < 25; i++) {
  const dx = WALL_X + Math.floor(rand() * WALL_W);
  const dz = WALL_Z + 1 + Math.floor(rand() * 4);
  const r = 0.5 + rand() * 0.2;
  addVoxel('brick', dx, BASE_H, dz, new THREE.Color(r, r * 0.35, r * 0.2));
}

// --- METAL PIPES ---
function addPipe(startX, startZ, length, radius, dirX, dirZ, rustRatio) {
  const crossSection = [];
  for (let a = 0; a < 8; a++) {
    const angle = (a / 8) * Math.PI * 2;
    crossSection.push([Math.round(Math.cos(angle) * radius), Math.round(Math.sin(angle) * radius)]);
  }
  for (let seg = 0; seg < length; seg++) {
    const cx = startX + dirX * seg, cz = startZ + dirZ * seg, cy = BASE_H + radius;
    for (const [dx, dy] of crossSection) {
      const isRust = rand() < rustRatio;
      let c;
      if (isRust) { c = new THREE.Color(0.45 + rand() * 0.15, 0.25 + rand() * 0.1, 0.1); }
      else { const s = 0.7 + rand() * 0.2; c = new THREE.Color(s, s * 0.98, s * 0.95); }
      addVoxel('metal', cx + dx, cy + dy, cz, c);
    }
  }
}
addPipe(3, -3, 10, 1, 1, 0, 0.3);
addPipe(4, 2, 7, 1, 0, 1, 0.5);
addPipe(-2, 4, 5, 1, 1, 0, 0.15);
for (let vy = 0; vy < 5; vy++) {
  for (let a = 0; a < 8; a++) {
    const angle = (a / 8) * Math.PI * 2;
    const s = 0.65 + rand() * 0.2;
    addVoxel('metal', 8 + Math.round(Math.cos(angle)), BASE_H + vy, -2 + Math.round(Math.sin(angle)),
      new THREE.Color(s, s * 0.95, s * 0.9));
  }
}

// --- GLASS WINDOW ---
const WIN_X = -1, WIN_Z = 0, WIN_W = 6, WIN_H = 7;
const winBaseY = BASE_H;
for (let fy = 0; fy <= WIN_H + 1; fy++) {
  addVoxel('metal', WIN_X - 1, winBaseY + fy, WIN_Z, new THREE.Color(0.25, 0.25, 0.27));
  addVoxel('metal', WIN_X + WIN_W, winBaseY + fy, WIN_Z, new THREE.Color(0.25, 0.25, 0.27));
}
for (let fx = -1; fx <= WIN_W; fx++) {
  addVoxel('metal', WIN_X + fx, winBaseY, WIN_Z, new THREE.Color(0.25, 0.25, 0.27));
  addVoxel('metal', WIN_X + fx, winBaseY + WIN_H + 1, WIN_Z, new THREE.Color(0.25, 0.25, 0.27));
}
for (let fx = 0; fx < WIN_W; fx++) {
  addVoxel('metal', WIN_X + fx, winBaseY + Math.floor(WIN_H / 2), WIN_Z, new THREE.Color(0.28, 0.28, 0.3));
}
for (let gy = 1; gy <= WIN_H; gy++) {
  for (let gx = 0; gx < WIN_W; gx++) {
    if (gy === Math.floor(WIN_H / 2)) continue;
    if (gx === 4 && gy === 5) continue;
    const tint = 0.85 + rand() * 0.15;
    addVoxel('glass', WIN_X + gx, winBaseY + gy, WIN_Z, new THREE.Color(tint * 0.9, tint * 0.95, tint));
  }
}

// --- WOODEN PLANKS ---
for (let p = 0; p < 3; p++) {
  const px = -4 + p * 4 + Math.floor(rand() * 2);
  const pz = 5 + Math.floor(rand() * 3);
  const len = 4 + Math.floor(rand() * 3);
  const angle = rand() * 0.4 - 0.2;
  for (let i = 0; i < len; i++) {
    const wx = px + i, wz = pz + Math.round(i * angle);
    const b = 0.35 + rand() * 0.15;
    addVoxel('wood', wx, BASE_H, wz, new THREE.Color(b, b * 0.65, b * 0.3));
    if (rand() < 0.3) addVoxel('wood', wx, BASE_H + 1, wz, new THREE.Color(b * 0.9, b * 0.6, b * 0.28));
  }
}

// --- EMISSIVE GLOW STRIP (neon tube on ground near window) ---
for (let i = 0; i < 8; i++) {
  addVoxel('emissive', WIN_X + i - 1, BASE_H, WIN_Z + 2, new THREE.Color(0.4, 0.85, 1.0));
}
for (let i = 0; i < 4; i++) {
  addVoxel('emissive', WIN_X + 7, BASE_H + i, WIN_Z + 2, new THREE.Color(1.0, 0.5, 0.2));
}

// --- RUBBLE ---
for (let i = 0; i < 40; i++) {
  const rx = -10 + Math.floor(rand() * 20);
  const rz = -8 + Math.floor(rand() * 16);
  const g = 0.4 + rand() * 0.25;
  addVoxel('concrete', rx, BASE_H, rz, new THREE.Color(g, g * 0.98, g * 0.95));
}

// ═══════════════════════════════════════════
// SECTION 5: INSTANCED MESHES
// ═══════════════════════════════════════════

const boxGeo = new THREE.BoxGeometry(VS * 0.96, VS * 0.96, VS * 0.96);
const dummy = new THREE.Object3D();
const materialMap = { concrete: matConcrete, brick: matBrick, metal: matMetal, glass: matGlass, wood: matWood, emissive: matEmissive };
const meshes = [];
let totalVoxels = 0;

for (const [category, items] of Object.entries(voxels)) {
  if (items.length === 0) continue;
  const mesh = new THREE.InstancedMesh(boxGeo, materialMap[category], items.length);
  mesh.castShadow = category !== 'emissive';
  mesh.receiveShadow = true;
  for (let i = 0; i < items.length; i++) {
    const v = items[i];
    dummy.position.set(v.x, v.y, v.z);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
    mesh.setColorAt(i, v.color);
  }
  mesh.instanceMatrix.needsUpdate = true;
  mesh.instanceColor.needsUpdate = true;
  scene.add(mesh);
  meshes.push(mesh);
  totalVoxels += items.length;
}
document.getElementById('voxCount').textContent = totalVoxels.toLocaleString();

// ═══════════════════════════════════════════
// SECTION 6: LIGHTING
// ═══════════════════════════════════════════

const sunLight = new THREE.DirectionalLight(0xfff4e6, 4.5);
sunLight.position.set(8, 16, 6);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(4096, 4096);
sunLight.shadow.camera.left = -15;
sunLight.shadow.camera.right = 15;
sunLight.shadow.camera.top = 15;
sunLight.shadow.camera.bottom = -15;
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 40;
sunLight.shadow.bias = -0.0004;
sunLight.shadow.normalBias = 0.02;
sunLight.shadow.radius = 3;
scene.add(sunLight);

const fillLight = new THREE.DirectionalLight(0xc8d8f0, 1.2);
fillLight.position.set(-6, 8, -4);
scene.add(fillLight);

const hemiLight = new THREE.HemisphereLight(0x8899bb, 0x443322, 0.8);
scene.add(hemiLight);

const rimLight = new THREE.DirectionalLight(0xffeedd, 0.8);
rimLight.position.set(-3, 4, 10);
scene.add(rimLight);

// Emissive point light (linked to glow strip)
const glowLight = new THREE.PointLight(0x66ccff, 2.5, 3.0, 2);
glowLight.position.set((WIN_X + 3) * VS, BASE_H * VS + VS, (WIN_Z + 2) * VS);
scene.add(glowLight);

// Environment map
const pmremGenerator = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.background = new THREE.Color(0x2a2c33);
const envTop = new THREE.Mesh(
  new THREE.SphereGeometry(50, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0x445566, side: THREE.BackSide })
);
envScene.add(envTop);
const envPtLight = new THREE.PointLight(0xffffff, 200, 100);
envPtLight.position.set(10, 20, 5);
envScene.add(envPtLight);
const envRT = pmremGenerator.fromScene(envScene, 0.04);
scene.environment = envRT.texture;
pmremGenerator.dispose();

// ═══════════════════════════════════════════
// SECTION 7: POST-PROCESSING
// ═══════════════════════════════════════════

const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

const ssaoPass = new SSAOPass(scene, camera, window.innerWidth, window.innerHeight);
ssaoPass.kernelRadius = 0.6;
ssaoPass.minDistance = 0.001;
ssaoPass.maxDistance = 0.15;
ssaoPass.output = SSAOPass.OUTPUT.Default;
composer.addPass(ssaoPass);

// 镜面反射 — 低分辨率 CubeCamera，仅对玻璃材质生效
const cubeRT = new THREE.WebGLCubeRenderTarget(64, {
  generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter
});
const cubeCamera = new THREE.CubeCamera(0.1, 50, cubeRT);
cubeCamera.position.set(0, 2, 0);
scene.add(cubeCamera);
matGlass.envMap = cubeRT.texture;
matGlass.envMapIntensity = 1.5;
let cubeUpdateCounter = 0;
const CUBE_UPDATE_INTERVAL = 30; // 每30帧更新一次反射

const bokehPass = new BokehPass(scene, camera, {
  focus: 18.0, aperture: 0.0008, maxblur: 0.008
});
composer.addPass(bokehPass);

const outputPass = new OutputPass();
composer.addPass(outputPass);

// ═══════════════════════════════════════════
// SECTION 8: SETTINGS PANEL LOGIC
// ═══════════════════════════════════════════

const panel = document.getElementById('settingsPanel');
document.getElementById('panelToggle').addEventListener('click', () => panel.classList.toggle('open'));

// Collapsible groups
document.querySelectorAll('.grp-hdr').forEach(hdr => {
  hdr.addEventListener('click', () => {
    const body = document.getElementById(hdr.dataset.target);
    const arrow = hdr.querySelector('.arrow');
    body.classList.toggle('collapsed');
    arrow.textContent = body.classList.contains('collapsed') ? '[+]' : '[-]';
  });
});

// Slider binding utility
function bind(id, displayId, callback, fmt) {
  const el = document.getElementById(id);
  const disp = document.getElementById(displayId);
  el.addEventListener('input', () => {
    const v = parseFloat(el.value);
    if (disp) disp.textContent = fmt ? fmt(v) : v.toFixed(4);
    callback(v);
  });
}

// --- AO bindings ---
document.getElementById('aoEnable').addEventListener('change', e => { ssaoPass.enabled = e.target.checked; });
bind('aoRadius', 'v_aoRadius', v => { ssaoPass.kernelRadius = v; }, v => v.toFixed(2));
bind('aoMin', 'v_aoMin', v => { ssaoPass.minDistance = v; }, v => v.toFixed(4));
bind('aoMax', 'v_aoMax', v => { ssaoPass.maxDistance = v; }, v => v.toFixed(3));

// --- 镜面反射 bindings ---
const mirrorEnableEl = document.getElementById('mirrorEnable');
const mirrorIntervalEl = document.getElementById('mirrorInterval');
mirrorEnableEl.addEventListener('change', e => {
  matGlass.envMap = e.target.checked ? cubeRT.texture : null;
  matGlass.needsUpdate = true;
});
bind('mirrorInt', 'v_mirrorInt', v => { matGlass.envMapIntensity = v; }, v => v.toFixed(2));
bind('mirrorInterval', 'v_mirrorInterval', v => {}, v => v.toFixed(0));

// --- DOF bindings ---
document.getElementById('dofEnable').addEventListener('change', e => { bokehPass.enabled = e.target.checked; });
const dofAutoFocusEl = document.getElementById('dofAutoFocus');
const dofFocusSlider = document.getElementById('dofFocus');
dofAutoFocusEl.addEventListener('change', e => { dofFocusSlider.disabled = e.target.checked; });
bind('dofFocus', 'v_dofFocus', v => { bokehPass.uniforms['focus'].value = v; }, v => v.toFixed(1));
bind('dofAperture', 'v_dofAperture', v => { bokehPass.uniforms['aperture'].value = v; }, v => v.toFixed(5));
bind('dofMaxblur', 'v_dofMaxblur', v => { bokehPass.uniforms['maxblur'].value = v; }, v => v.toFixed(4));
bind('camFov', 'v_camFov', v => { camera.fov = v; camera.updateProjectionMatrix(); }, v => v.toFixed(0));

// --- Lighting bindings ---
bind('sunInt', 'v_sunInt', v => { sunLight.intensity = v; }, v => v.toFixed(2));
bind('fillInt', 'v_fillInt', v => { fillLight.intensity = v; }, v => v.toFixed(2));
bind('hemiInt', 'v_hemiInt', v => { hemiLight.intensity = v; }, v => v.toFixed(2));
bind('envInt', 'v_envInt', v => {
  matConcrete.envMapIntensity = 0.3 * v;
  matBrick.envMapIntensity = 0.2 * v;
  matMetal.envMapIntensity = 1.2 * v;
  matGlass.envMapIntensity = 1.5 * v;
  matWood.envMapIntensity = 0.15 * v;
}, v => v.toFixed(2));
bind('exposure', 'v_exposure', v => { renderer.toneMappingExposure = v; }, v => v.toFixed(2));
bind('shadowBias', 'v_shadowBias', v => { sunLight.shadow.bias = v; sunLight.shadow.needsUpdate = true; }, v => v.toFixed(4));

// --- Emissive bindings ---
bind('glowInt', 'v_glowInt', v => { matEmissive.emissiveIntensity = v; glowLight.intensity = v; }, v => v.toFixed(2));
bind('glowRadius', 'v_glowRadius', v => { glowLight.distance = v; }, v => v.toFixed(1));

// --- Scene bindings ---
document.getElementById('fogEnable').addEventListener('change', e => {
  scene.fog = e.target.checked ? new THREE.FogExp2(0x1a1c22, parseFloat(document.getElementById('fogDensity').value)) : null;
});
bind('fogDensity', 'v_fogDensity', v => { if (scene.fog) scene.fog.density = v; }, v => v.toFixed(4));

// --- 帧率锁定 bindings ---
const fpsLockEl = document.getElementById('fpsLock');
const fpsTargetEl = document.getElementById('fpsTarget');
bind('fpsTarget', 'v_fpsTarget', v => {}, v => v.toFixed(0));

// --- Reset ---
document.getElementById('btnReset').addEventListener('click', () => { location.reload(); });

// ═══════════════════════════════════════════
// SECTION 9: ANIMATION LOOP
// ═══════════════════════════════════════════

let frameCount = 0, lastFpsTime = performance.now();
const fpsEl = document.getElementById('fpsVal');
const sunAnimateEl = document.getElementById('sunAnimate');
let lastRenderTime = 0;

function animate(timestamp) {
  requestAnimationFrame(animate);

  // 帧率锁定：未达到目标间隔则跳过渲染
  if (fpsLockEl.checked) {
    const interval = 1000 / parseFloat(fpsTargetEl.value);
    const elapsed = timestamp - lastRenderTime;
    if (elapsed < interval) return;
    lastRenderTime = timestamp - (elapsed % interval);
  }

  controls.update();

  // 自动对焦：每帧计算相机到画面中心的距离
  if (dofAutoFocusEl.checked && bokehPass.enabled) {
    const dist = camera.position.distanceTo(controls.target);
    bokehPass.uniforms['focus'].value = dist;
    dofFocusSlider.value = dist;
    document.getElementById('v_dofFocus').textContent = dist.toFixed(1);
  }

  if (sunAnimateEl.checked) {
    const t = performance.now() * 0.0001;
    sunLight.position.x = 8 + Math.sin(t) * 2;
    sunLight.position.z = 6 + Math.cos(t) * 2;
  }

  // 镜面反射：低频更新 CubeCamera（仅玻璃材质使用）
  if (mirrorEnableEl.checked) {
    cubeUpdateCounter++;
    if (cubeUpdateCounter >= parseInt(mirrorIntervalEl.value)) {
      cubeUpdateCounter = 0;
      // 隐藏玻璃自身避免自反射
      meshes.forEach(m => { if (m.material === matGlass) m.visible = false; });
      cubeCamera.update(renderer, scene);
      meshes.forEach(m => { if (m.material === matGlass) m.visible = true; });
    }
  }

  composer.render();

  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime >= 1000) {
    fpsEl.textContent = frameCount;
    frameCount = 0;
    lastFpsTime = now;
  }
}
requestAnimationFrame(animate);

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  ssaoPass.setSize(w, h);
});

</script>
</body>
</html>
