<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR-15 自动步枪 — 3D 剖面机械结构解构演示 (Fable)</title>
<!--
  AR-15 MODULAR RIFLE SYSTEM — TECHNICAL MECHANICAL ANIMATION (educational schematic)
  Self-contained SVG/JS reference render for the prompts in
  prompts/video_prompts/ar15_mechanical_animation.md

  Modes:
    CYCLE    — semi-auto cycle of operation (macro receiver view, slow motion)
    TAKEDOWN — rear takedown pin pops, upper pivots open on front pivot pin (clamshell), BCG out
    EXPLODED — full component separation with index labels

  This is a stylized functional diagram (how parts MOVE). It contains no dimensions,
  tolerances or fabrication data. URL params for stills: ?mode=cycle&t=0.42&still=1&xray=1&zoom=0
-->
<style>
  :root{
    --bg:#0a0c0f; --panel:#11151a; --panel2:#0d1116; --line:#232a32;
    --ink:#c7d3dc; --dim:#7d8b96; --accent:#41d9ff; --amber:#ffb64d;
    --good:#57e389; --warn:#ffb64d; --bad:#ff6b6b;
    --mono:"SF Mono","Cascadia Code","JetBrains Mono",Consolas,"Roboto Mono",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--mono);overflow:hidden}
  #stage{position:fixed;inset:0}
  svg#scene{width:100%;height:100%;display:block}
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 120% 90% at 50% 42%,transparent 55%,rgba(0,0,0,.55) 100%)}

  /* ------- HUD ------- */
  .hud-top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:flex-start;padding:14px 18px;pointer-events:none;z-index:6}
  .tblock{border:1px solid var(--line);background:rgba(13,17,22,.82);padding:8px 12px;backdrop-filter:blur(4px)}
  .tblock h1{font-size:12px;letter-spacing:.18em;color:var(--ink);font-weight:600}
  .tblock .sub{font-size:9.5px;letter-spacing:.14em;color:var(--dim);margin-top:3px}
  .tblock .sub b{color:var(--accent);font-weight:600}
  .dwg{ text-align:right}
  .dwg div{font-size:9.5px;letter-spacing:.12em;color:var(--dim);line-height:1.5}
  .dwg .rev{color:var(--amber)}

  .phase-hud{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);width:min(860px,92vw);
    border:1px solid var(--line);background:rgba(13,17,22,.86);padding:9px 14px;z-index:6;
    display:flex;gap:14px;align-items:baseline;pointer-events:none;backdrop-filter:blur(4px)}
  .phase-hud .tag{font-size:10px;letter-spacing:.16em;color:#08303c;background:var(--accent);
    padding:2px 8px;white-space:nowrap;font-weight:700}
  .phase-hud .desc{font-size:11px;color:var(--ink);letter-spacing:.03em;line-height:1.45}

  /* phase list (cycle mode) */
  #phaselist{position:fixed;left:18px;top:96px;z-index:6;display:flex;flex-direction:column;gap:2px;
    border:1px solid var(--line);background:rgba(13,17,22,.8);padding:6px;backdrop-filter:blur(4px)}
  #phaselist button{all:unset;cursor:pointer;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
    color:var(--dim);padding:4px 9px;border-left:2px solid transparent}
  #phaselist button:hover{color:var(--ink)}
  #phaselist button.on{color:var(--accent);border-left-color:var(--accent);background:rgba(65,217,255,.06)}

  /* inset */
  #inset{position:fixed;right:18px;top:96px;z-index:6;border:1px solid var(--line);
    background:rgba(10,13,17,.88);padding:8px;backdrop-filter:blur(4px)}
  #inset .cap{font-size:9px;letter-spacing:.16em;color:var(--dim);text-align:center;margin-top:5px}
  #lockState{font-size:10px;letter-spacing:.2em;text-align:center;margin-top:2px;font-weight:700}

  /* ------- CONTROL BAR ------- */
  #bar{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;align-items:center;gap:14px;
    padding:10px 16px;background:rgba(10,13,17,.92);border-top:1px solid var(--line);backdrop-filter:blur(6px)}
  .tabs{display:flex;border:1px solid var(--line)}
  .tabs button{all:unset;cursor:pointer;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
    padding:7px 14px;color:var(--dim)}
  .tabs button.on{background:var(--accent);color:#062730;font-weight:700}
  .tabs button:not(.on):hover{color:var(--ink)}
  #play{all:unset;cursor:pointer;width:34px;height:30px;border:1px solid var(--line);text-align:center;
    color:var(--accent);font-size:12px;line-height:30px}
  #play:hover{background:rgba(65,217,255,.08)}
  #scrub{flex:1;appearance:none;height:3px;background:var(--line);outline:none}
  #scrub::-webkit-slider-thumb{appearance:none;width:13px;height:13px;background:var(--accent);
    border-radius:50%;cursor:pointer;box-shadow:0 0 8px rgba(65,217,255,.6)}
  .spd{display:flex;align-items:center;gap:8px;font-size:9.5px;color:var(--dim);letter-spacing:.1em}
  #speed{appearance:none;width:90px;height:3px;background:var(--line)}
  #speed::-webkit-slider-thumb{appearance:none;width:11px;height:11px;background:var(--amber);border-radius:50%;cursor:pointer}
  #spdval{color:var(--amber);min-width:42px}
  .togs{display:flex;gap:6px}
  .togs button{all:unset;cursor:pointer;font-family:var(--mono);font-size:9px;letter-spacing:.12em;
    padding:6px 9px;border:1px solid var(--line);color:var(--dim)}
  .togs button.on{color:var(--accent);border-color:rgba(65,217,255,.5);background:rgba(65,217,255,.07)}
  .togs button:hover{color:var(--ink)}
  #tclock{font-size:9.5px;color:var(--dim);letter-spacing:.08em;min-width:86px;text-align:right}

  /* ------- SVG shared ------- */
  text.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;fill:#9fb4c0}
  text.lbl.sm{font-size:9.5px}
  .leader{stroke:#5c6d79;stroke-width:1;fill:none}
  .ldot{fill:var(--accent)}
  text.stamp{font-family:var(--mono);fill:#3d4a55;letter-spacing:.3em;font-size:13px}

  /* X-RAY mode: parts go wireframe */
  .xray .pt{fill:rgba(10,24,32,.16)!important;stroke:#38cff5!important;stroke-width:1!important}
  .xray .pt2{fill:rgba(10,24,32,.10)!important;stroke:#2596b3!important;stroke-width:.8!important}
  .xray .hatched{fill:rgba(10,24,32,.10)!important;stroke:#1d7a94!important}
  .xray .noxray{display:none}
  .xray text.lbl{fill:#7fd8f0}

  @media (max-width:1100px){ #phaselist{display:none} }
  @media (max-width:900px){ #inset{transform:scale(.8);transform-origin:top right} .phase-hud{bottom:96px} }
</style>
</head>
<body>

<div id="stage">
<svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-label="AR-15 cutaway mechanical animation">
<defs>
  <!-- material gradients -->
  <linearGradient id="gAlu" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2c333b"/><stop offset=".45" stop-color="#1c2127"/>
    <stop offset=".55" stop-color="#171b20"/><stop offset="1" stop-color="#22282f"/>
  </linearGradient>
  <linearGradient id="gAluD" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#242a31"/><stop offset=".5" stop-color="#14181d"/><stop offset="1" stop-color="#1b2026"/>
  </linearGradient>
  <linearGradient id="gSteel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4d565f"/><stop offset=".5" stop-color="#31383f"/><stop offset="1" stop-color="#454e57"/>
  </linearGradient>
  <linearGradient id="gSteelL" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#77828d"/><stop offset=".5" stop-color="#4d5760"/><stop offset="1" stop-color="#68737d"/>
  </linearGradient>
  <linearGradient id="gSteelD" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#33383e"/><stop offset=".5" stop-color="#1e2226"/><stop offset="1" stop-color="#2c3136"/>
  </linearGradient>
  <linearGradient id="gBoltN" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3a4148"/><stop offset=".5" stop-color="#22262b"/><stop offset="1" stop-color="#343a41"/>
  </linearGradient>
  <linearGradient id="gBrass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d4ac58"/><stop offset=".5" stop-color="#96742f"/><stop offset="1" stop-color="#c19a48"/>
  </linearGradient>
  <linearGradient id="gCopper" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c07a48"/><stop offset=".55" stop-color="#8a4f2c"/><stop offset="1" stop-color="#aa683c"/>
  </linearGradient>
  <linearGradient id="gPoly" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2a2e33"/><stop offset=".5" stop-color="#1c1f23"/><stop offset="1" stop-color="#26292e"/>
  </linearGradient>
  <radialGradient id="gGas" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ffe9b0" stop-opacity=".95"/>
    <stop offset=".4" stop-color="#ffb64d" stop-opacity=".55"/>
    <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="gFlash" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#fff6d8" stop-opacity="1"/>
    <stop offset=".35" stop-color="#ffcf6e" stop-opacity=".8"/>
    <stop offset="1" stop-color="#ff7a2d" stop-opacity="0"/>
  </radialGradient>
  <!-- cut-section hatching -->
  <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <rect width="7" height="7" fill="#262d35"/>
    <line x1="0" y1="0" x2="0" y2="7" stroke="#4a5560" stroke-width="1.4"/>
  </pattern>
  <pattern id="hatchS" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <rect width="6" height="6" fill="#3a3f45"/>
    <line x1="0" y1="0" x2="0" y2="6" stroke="#6a747e" stroke-width="1.3"/>
  </pattern>
  <!-- blueprint grid -->
  <pattern id="gridMinor" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="rgba(65,217,255,.045)" stroke-width="1"/>
  </pattern>
  <pattern id="gridMajor" width="100" height="100" patternUnits="userSpaceOnUse">
    <path d="M100 0H0V100" fill="none" stroke="rgba(65,217,255,.09)" stroke-width="1"/>
  </pattern>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- ======================= BACKDROP ======================= -->
<g id="gGrid">
  <rect x="-400" y="-300" width="2400" height="1500" fill="url(#gridMinor)"/>
  <rect x="-400" y="-300" width="2400" height="1500" fill="url(#gridMajor)"/>
  <line x1="-400" y1="430" x2="2000" y2="430" stroke="rgba(65,217,255,.14)" stroke-width="1" stroke-dasharray="14 6 3 6"/>
  <text class="stamp" x="1180" y="856">SECTION A-A · RH SIDE · SCALE N/A</text>
  <text class="stamp" x="70" y="856">FUNCTIONAL DIAGRAM — NOT FOR FABRICATION</text>
</g>

<!-- ======================= LOWER GROUP (static frame) ======================= -->
<g id="gLowerAsm">
  <!-- stock (behind tube) -->
  <g id="gStock">
    <path class="pt2" d="M1150 399 L1398 394 Q1428 394 1434 412 L1442 552 Q1443 570 1424 572 L1392 574 Q1372 575 1360 558 L1268 470 L1150 462 Z"
      fill="url(#gPoly)" stroke="#3a424b" stroke-width="1.2" opacity=".92"/>
    <path d="M1420 400 L1436 552" stroke="#12151a" stroke-width="3" opacity=".6"/>
    <path d="M1408 398 L1422 560" stroke="#454e58" stroke-width="1" opacity=".5"/>
    <!-- stock latch -->
    <path class="pt2" d="M1196 462 L1268 462 L1258 486 Q1230 494 1206 486 Z" fill="#1a1e23" stroke="#3a424b"/>
  </g>

  <!-- receiver extension (buffer tube) : cutaway walls -->
  <g id="gTube">
    <rect class="hatched" x="1076" y="401" width="312" height="9"  fill="url(#hatch)" stroke="#4a5560" stroke-width=".8"/>
    <rect class="hatched" x="1076" y="450" width="312" height="9"  fill="url(#hatch)" stroke="#4a5560" stroke-width=".8"/>
    <rect x="1076" y="410" width="312" height="40" fill="#0d1013"/> <!-- bore of tube -->
    <rect class="pt" x="1386" y="397" width="14" height="66" fill="url(#gSteelD)" stroke="#12151a"/>
    <!-- castle nut + end plate -->
    <rect class="pt" x="1052" y="394" width="12" height="72" fill="url(#gSteel)" stroke="#12151a"/>
    <rect class="pt" x="1064" y="397" width="14" height="66" fill="url(#gSteelD)" stroke="#12151a"/>
    <line x1="1068" y1="400" x2="1068" y2="462" stroke="#565f68" stroke-width="1"/>
    <!-- position holes -->
    <circle cx="1130" cy="455" r="2.2" fill="#0a0c0f"/><circle cx="1188" cy="455" r="2.2" fill="#0a0c0f"/>
    <circle cx="1246" cy="455" r="2.2" fill="#0a0c0f"/><circle cx="1304" cy="455" r="2.2" fill="#0a0c0f"/>
  </g>

  <!-- action spring + buffer (dynamic) -->
  <polyline id="spring" points="" fill="none" stroke="#8d979f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <g id="gBuffer">
    <rect class="pt" x="1054" y="411" width="10" height="38" fill="url(#gSteel)" stroke="#12151a"/>
    <rect class="pt" x="1064" y="414" width="84" height="32" fill="url(#gPoly)" stroke="#12151a"/>
    <!-- internal counterweights (cutaway) -->
    <rect x="1070" y="417" width="20" height="26" fill="url(#gSteelD)" stroke="#0f1216" stroke-width=".8"/>
    <rect x="1094" y="417" width="20" height="26" fill="url(#gSteel)"  stroke="#0f1216" stroke-width=".8"/>
    <rect x="1118" y="417" width="20" height="26" fill="url(#gSteelD)" stroke="#0f1216" stroke-width=".8"/>
    <rect x="1140" y="416" width="8"  height="28" fill="#4b3a35" stroke="#0f1216" stroke-width=".8"/>
  </g>
  <!-- buffer retainer -->
  <path id="bufRetainer" class="pt" d="M1058 452 l7 0 l-3.5 -8 z" fill="#8d979f" stroke="#12151a" stroke-width=".6"/>

  <!-- lower receiver body -->
  <g id="gLowerBody">
    <path class="pt" fill="url(#gAluD)" stroke="#0e1114" stroke-width="1.4" d="
      M640 470 L640 496 Q640 508 656 510 L722 514 L738 514 L738 470 Z"/>
    <!-- mag well walls -->
    <rect class="hatched" x="738" y="470" width="11" height="168" fill="url(#hatch)" stroke="#39424c" stroke-width=".8"/>
    <rect class="hatched" x="861" y="470" width="11" height="158" fill="url(#hatch)" stroke="#39424c" stroke-width=".8"/>
    <path class="pt" d="M738 638 l11 0 l6 10 l-17 0 z" fill="url(#gAluD)" stroke="#0e1114"/>
    <path class="pt" d="M861 628 l11 0 l6 10 l-17 0 z" fill="url(#gAluD)" stroke="#0e1114"/>
    <!-- body aft of mag well, FCG pocket walls -->
    <path class="pt" fill="url(#gAluD)" stroke="#0e1114" stroke-width="1.4" d="
      M872 470 L1052 470 L1052 522 Q1052 532 1042 534 L1010 540 L1010 560 Q1010 574 996 578
      L916 586 Q884 588 878 556 L872 512 Z"/>
    <!-- FCG pocket (cutaway cavity) -->
    <path d="M878 474 L1046 474 L1046 520 Q1046 528 1036 530 L1004 536 L1002 556 Q1000 570 986 572 L920 578 Q892 580 888 552 L884 508 Z"
      fill="#0c0f12" stroke="#2b333c" stroke-width="1"/>
    <!-- trigger guard -->
    <path class="pt" d="M884 586 Q880 612 906 616 L986 616 Q1006 614 1008 592 L1008 578 L996 578 L996 590
      Q996 602 982 604 L910 604 Q896 602 897 588 L895 580 L884 580 Z" fill="url(#gAluD)" stroke="#0e1114"/>
    <!-- grip -->
    <path class="pt" fill="url(#gPoly)" stroke="#0e1114" stroke-width="1.4" d="
      M1008 540 L1054 528 Q1068 526 1072 542 L1104 668 Q1108 686 1090 690 L1044 698 Q1030 700 1026 684 L1000 576 Z"/>
    <path d="M1022 570 L1050 682" stroke="#31363c" stroke-width="1" opacity=".8"/>
    <path d="M1036 566 L1064 678" stroke="#31363c" stroke-width="1" opacity=".8"/>
    <!-- front pivot lug -->
    <path class="pt" d="M640 470 L640 452 Q640 444 650 444 L664 444 Q674 444 674 452 L674 470 Z"
      fill="url(#gAluD)" stroke="#0e1114"/>
    <!-- rear takedown lug -->
    <path class="pt" d="M986 470 L986 456 Q986 448 996 448 L1010 448 Q1020 448 1020 456 L1020 470 Z"
      fill="url(#gAluD)" stroke="#0e1114"/>
  </g>

  <!-- ============ FIRE CONTROL GROUP ============ -->
  <g id="gFCG">
    <!-- hammer spring (torsion, stylized) -->
    <g id="gHamSpring">
      <path id="hamSpringPath" fill="none" stroke="#98a2ab" stroke-width="2.4" d="M895 545 m-9 0 a9 9 0 1 1 18 0 a7 7 0 1 1 -14 0"/>
      <path id="hamSpringLeg" fill="none" stroke="#98a2ab" stroke-width="2.4" d="M902 551 L948 557"/>
    </g>
    <!-- TRIGGER + DISCONNECTOR rotate about (950,548) -->
    <g id="gTrigger">
      <path class="pt" fill="url(#gSteelD)" stroke="#101317" stroke-width="1.2" d="
        M922 536 L934 542 L986 544 Q994 544 994 551 L992 557 L938 557 Q928 557 924 549 Z"/>
      <path class="pt" fill="url(#gSteelD)" stroke="#101317" stroke-width="1.2" d="
        M932 557 Q928 578 919 593 Q916 600 924 601 Q936 602 940 587 Q944 571 943 557 Z"/>
      <path fill="none" stroke="#98a2ab" stroke-width="2" d="M950 548 m-6.5 0 a6.5 6.5 0 1 1 13 0 M943.5 548 L928 542"/>
    </g>
    <g id="gDisc">
      <path class="pt" fill="#5d6873" stroke="#101317" stroke-width="1.2" d="
        M942 532 L950 524 L957 529 L951 536 L980 538 L982 545 L948 543 Q942 540 942 532 Z"/>
      <path fill="none" stroke="#98a2ab" stroke-width="1.6" d="M976 545 l0 4 l3 3 l-6 3 l6 3 l-3 3"/>
    </g>
    <!-- HAMMER rotates about (895,545); drawn COCKED -->
    <g id="gHammer">
      <path class="pt" fill="url(#gSteelL)" stroke="#101317" stroke-width="1.3" d="
        M884 534 Q894 524 910 528 L946 526 L956 518 L964 525 L954 532 L994 532 Q1010 532 1012 546
        Q1012 558 998 557 L958 552 Q930 560 908 556 Q884 552 884 534 Z"/>
      <!-- head / strike face -->
      <path class="pt" fill="url(#gSteelL)" stroke="#101317" stroke-width="1.3"
        d="M994 526 Q1016 524 1018 544 Q1018 560 1000 559 Q988 556 989 542 Q990 528 994 526 Z"/>
      <!-- sear notch mark near pivot -->
      <path d="M922 549 L928 543" stroke="#c9d4dc" stroke-width="1.6"/>
      <circle cx="895" cy="545" r="4.6" fill="#171b20" stroke="#98a2ab" stroke-width="1.4"/>
    </g>
    <circle cx="950" cy="548" r="4.2" fill="#171b20" stroke="#98a2ab" stroke-width="1.4"/>

    <!-- SAFETY SELECTOR -->
    <g id="gSelector">
      <circle class="pt" cx="988" cy="512" r="11.5" fill="url(#gSteelD)" stroke="#101317" stroke-width="1.2"/>
      <path d="M988 512 m-11.5 0 a11.5 11.5 0 0 1 23 0" fill="#0c0f12" opacity=".55"/>
      <rect class="pt" x="984" y="488" width="8" height="13" rx="2" fill="url(#gSteel)" stroke="#101317"/>
      <circle cx="988" cy="512" r="2.4" fill="#0a0c0f"/>
    </g>
    <text class="lbl sm noxray" id="selTxt" x="1004" y="500" fill="#8d979f">FIRE</text>

    <!-- BOLT CATCH (far side, dashed) -->
    <g id="gBoltCatch" opacity=".85">
      <rect x="748" y="478" width="18" height="28" rx="4" fill="none" stroke="#66727d" stroke-width="1.2" stroke-dasharray="4 3"/>
      <path d="M757 478 L757 462 L764 458" fill="none" stroke="#66727d" stroke-width="1.2" stroke-dasharray="4 3"/>
      <circle cx="757" cy="492" r="2" fill="#66727d"/>
    </g>

    <!-- MAG RELEASE (near side button + dashed catch bar) -->
    <g id="gMagRel">
      <circle class="pt" cx="895" cy="507" r="7.5" fill="url(#gSteelD)" stroke="#101317" stroke-width="1.2"/>
      <circle cx="895" cy="507" r="4" fill="#14181d" stroke="#39424c"/>
      <path d="M887 507 L864 507 L864 500 L856 507 L864 514 L864 507" fill="none" stroke="#66727d" stroke-width="1.2" stroke-dasharray="4 3"/>
    </g>

    <!-- FCG pins -->
    <circle id="pinHammer" cx="895" cy="545" r="0.1" fill="none"/>
  </g>

  <!-- ============ MAGAZINE ============ -->
  <g id="gMag">
    <path class="pt" fill="url(#gPoly)" stroke="#0e1114" stroke-width="1.4" d="
      M752 472 L860 472 L856 552 Q848 662 830 738 Q828 748 818 746 L740 730 Q732 728 734 718 Q748 640 750 552 Z"/>
    <path d="M750 504 L858 510 M748 544 L855 550" stroke="#2e343b" stroke-width="1" opacity=".8"/>
    <!-- floorplate -->
    <path class="pt" d="M736 720 L826 736 L822 754 Q820 760 812 758 L738 746 Q730 744 732 736 Z"
      fill="url(#gPoly)" stroke="#0e1114"/>
    <!-- cutaway window -->
    <path d="M768 516 L844 522 Q840 636 826 706 L756 694 Q766 610 768 516 Z" fill="#0c0f12" stroke="#2b333c"/>
    <!-- mag spring -->
    <polyline id="magSpring" points="762,570 800,586 764,598 802,614 766,626 806,642 770,654 810,670 774,682" fill="none" stroke="#8d979f" stroke-width="2.2"/>
    <!-- follower (anti-tilt, polymer) -->
    <g id="gFollower">
      <path class="pt" d="M762 556 L806 562 L810 550 L766 544 Z" fill="#5f7a4d" stroke="#101317"/>

});

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp = (a,b,k) => a+(b-a)*k;
const eio = k => k<".5"?0:0; // placeholder overwritten below
function easeInOutCubic(k){ return k<0.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2; }
function easeOutCubic(k){ return 1-Math.pow(1-k,3); }
function easeInCubic(k){ return k*k*k; }
function easeOutBack(k){ const c=1.55; return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2); }
function seg(t,a,b,ease){ const k=clamp((t-a)/(b-a),0,1); return ease?ease(k):k; }
/* damped flip for dust cover: returns scaleY 1 -> -0.92 with bounce */
function coverFlip(k){
  if(k<=0) return 1;
  const target=-0.92;
  const s = 1-(1-target)*easeOutCubic(Math.min(k*1.6,1));
  const wob = Math.exp(-4*k)*Math.sin(k*26)*0.22*(k>0.4?1:0);
  return s+wob;
}

/* ---------------- element refs ---------------- */

const E = {};
['gBCG','gBolt','gCamPin','gFP','gHammer','gTrigger','gDisc','gSelector','gDustCover','gCH',

 'bulletFly','spring','gBuffer','gRounds','gFollower','magSpring','selTxt',
 'fxPrimer','fxMuzzle','fxMuzzleStar','fxPort','fxTube','fxTubeLine','fxTubeHead','fxKey',
 'fxChamberGas','fxVent1','fxVent2','fxCatch','gPinZoom','zoomPin','zoomDetent',
 'gLblInt','gLblExt','gMuzzle','gBarrel','gGasSys','gHandguard','gUpperBody','gBarrelExt',
 'gUpperWalls','gPort','gLowerBody','gFCG','gMag','gStock','gTube','gBuffer2','gCarrier','gGasKey',
 'gHamSpring','hamSpringLeg','gBoltCatch','gMagRel','gPivotPin','gFwdAssist','gRail','bufRetainer','fpRetain'
].forEach(id=>{ E[id]=$(id); });

  <path class="pt" fill="url(#gCopper)" stroke="#3c2413" stroke-width=".8" d="M-52 -6.5 L-68 -2 Q-74 0 -68 2 L-52 6.5 Z"/>`;
  g.setAttribute('transform',`translate(${x},${y})`);
  if(dim) g.setAttribute('opacity','.55');

}

const ins = $('insetSvg');
(function buildInset(){
  let s='';
  s+=`<circle r="96" fill="#0b0e12" stroke="#232a32"/>`;
  s+=`<circle r="88" fill="url(#gSteelD)" stroke="#101317" stroke-width="2"/>`;
  s+=`<circle r="60" fill="#0b0e12"/>`;
  /* extension ring with 8 recess gaps -> drawn as ring segments */
  let ringSeg='';
  for(let i=0;i<8;i++){
    const a0=i*45+11, a1=(i+1)*45-11;
    const r0=60,r1=88;
    const p=(a,r)=>[r*Math.cos(a*Math.PI/180),r*Math.sin(a*Math.PI/180)];
    const [x0,y0]=p(a0,r1),[x1,y1]=p(a1,r1),[x2,y2]=p(a1,r0),[x3,y3]=p(a0,r0);
    ringSeg+=`<path d="M${x0} ${y0} A ${r1} ${r1} 0 0 1 ${x1} ${y1} L ${x2} ${y2} A ${r0} ${r0} 0 0 0 ${x3} ${y3} Z"
      fill="url(#gSteel)" fill-opacity=".92" stroke="#101317"/>`;
  }
  /* bolt group (rotates) */
  let lugs='';
  for(let i=0;i<8;i++){
    const a=i*45+22.5;               /* base pose = LOCKED: lugs behind ring segments */
    const w=(i===0)?30:22;
    lugs+=`<g transform="rotate(${a})"><rect x="${-w/2}" y="-76" width="${w}" height="17" rx="3"
      fill="${i===0?'url(#gBrass)':'url(#gBoltN)'}" stroke="#0d1013" stroke-width="1.2"/></g>`;
  }
  s+=`<g id="insBolt">
    ${lugs}
    <circle r="58" fill="url(#gBoltN)" stroke="#0d1013" stroke-width="1.5"/>
    <circle r="30" fill="#14171b" stroke="#2a3138"/>
    <circle id="insFP" r="7" fill="#454e57"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#10151a" stroke-width="1"/>
    <circle cx="21" cy="-21" r="5.5" fill="#39424c" stroke="#10151a"/>
  </g>`;
  s = `<g>${ringSeg}</g>` + s;      /* ring behind? no: draw bolt then ring on top */
  ins.innerHTML = `<g id="insWrap">${s}</g>`;
  /* move ring segments after bolt so lugs hide behind ring when rotated */
  const wrap=$('insWrap');
  wrap.appendChild(wrap.firstElementChild); /* ringSeg group to end */
})();

/* ---------------- pose functions ---------------- */
function setT(el,x,y){ el.setAttribute('transform',`translate(${x},${y})`); }
function setR(el,deg,cx,cy){ el.setAttribute('transform',`rotate(${deg} ${cx} ${cy})`); }

function springPts(x0,x1){
  const N=14, amp=11, cy=430;
  let pts=`${x0},${cy}`;
  for(let i=1;i<=N;i++){
    const x=lerp(x0,x1,(i-.5)/N), y=cy+(i%2?-amp:amp);
    pts+=` ${x},${y}`;
  }
  pts+=` ${x1},${cy}`;
  E.spring.setAttribute('points',pts);
}

function poseBCG(dx,boltRel,fpJab){
  setT(E.gBCG,dx,0);
  setT(E.gBolt,boltRel,0);
  E.gFP.setAttribute('transform',`translate(${fpJab},0)`);
  /* cam pin slides in slot + drops slightly to suggest rotation */
  const k = clamp(-boltRel/UNLOCK_DX,0,1); /* 0 locked, 1 unlocked */
  const px = 776 - 0, py = 415;            /* base pos inside gBolt coords */
  E.gCamPin.setAttribute('transform',`translate(${k*2},${k*7})`);
  /* buffer + spring follow carrier */
  setT(E.gBuffer,dx,0);
  springPts(SPRING_X0+dx, SPRING_X1);
  return k;
}
function lockAngleDeg(boltRel){ return clamp(-boltRel/UNLOCK_DX,0,1)*22.5; }

function poseInset(lockDeg,fpHot){
  insBolt.setAttribute('transform',`rotate(${-lockDeg})`);
  insFP.setAttribute('fill', fpHot ? '#ffd98a' : '#454e57');
  const locked = lockDeg<1, unlocked = lockDeg>21.5;
  lockState.textContent = (locked?'LOCKED':unlocked?'UNLOCKED':'ROTATING')+` · ${lockDeg.toFixed(1)}°`;
  lockState.style.color = locked?'var(--good)':unlocked?'var(--bad)':'var(--warn)';
}

/* ================= CYCLE ================= */
function updateCycle(t){
  resetTransforms();
  /* --- selector --- */
  const selK = seg(t,0.02,0.05,easeInOutCubic);
  poseSelector(-90*selK, selK>0.5?'FIRE':'SAFE');
  /* --- trigger pull & reset --- */
  const pull = seg(t,0.055,0.085,easeInOutCubic);
  const release = seg(t,0.885,0.925,easeInOutCubic);
  poseTrigger(5*pull*(1-release));
  /* --- hammer --- */
  let hRot=0; let fpHot=false;
  const fall = seg(t,0.085,0.112,easeInCubic);
  const recock = seg(t,0.335,0.46,easeInOutCubic);
  const settle = seg(t,0.46,0.50,easeOutCubic);
  const reset = seg(t,0.925,0.955,easeOutCubic);
  if(t<0.335) hRot = -58*fall;
  else hRot = lerp(-58, 8, recock) - 2.4*settle;   /* pushed past, settles on disconnector (+5.6) */
  if(t>=0.925) hRot = 5.6 - 5.6*reset;             /* disconnector -> sear (reset click) */
  else if(t>=0.50) hRot = 5.6;
  poseHammer(hRot);
  /* hammer spring leg follows roughly */
  E.hamSpringLeg.setAttribute('d', hRot<-30 ? 'M902 551 L946 559' : 'M902 551 L948 557');
  /* disconnector nudge as hook rides over */
  const dn = seg(t,0.40,0.44,easeOutCubic)*(1-seg(t,0.46,0.50,easeOutCubic));
  const dRel = seg(t,0.925,0.945,easeOutCubic);
  poseDisc(5*seg(t,0.055,0.085,easeInOutCubic)*(1-release) - 3*dn - 4*dRel*(1-seg(t,0.955,0.99,easeOutCubic)));
  /* --- firing pin & ignition fx --- */
  const jab = 4*seg(t,0.105,0.118,easeOutCubic)*(1-seg(t,0.24,0.30,easeInOutCubic));
  fpHot = t>0.105 && t<0.20;
  fx(E.fxPrimer, t>0.112&&t<0.135 ? (1-seg(t,0.112,0.135))*0.9 : 0);
  /* --- bullet --- */
  if(t>0.118){
    E.chamberBullet.setAttribute('opacity',0);
    const bt=seg(t,0.118,0.148,easeInCubic);
    if(bt<1){ E.bulletFly.setAttribute('opacity',1);
      E.bulletFly.setAttribute('transform',`translate(${lerp(600,60,bt)},430)`); }
  }
  const mz = t>0.140&&t<0.185 ? Math.sin(seg(t,0.140,0.185)*Math.PI) : 0;
  fx(E.fxMuzzle,mz*0.95); fx(E.fxMuzzleStar,mz*0.9);
  /* --- gas system --- */
  fx(E.fxPort, t>0.135&&t<0.175 ? Math.sin(seg(t,0.135,0.175)*Math.PI)*0.9 : 0);
  if(t>0.150 && t<0.235){
    const gk=seg(t,0.150,0.225,easeOutCubic);
    const head=lerp(356,748,gk);
    E.fxTube.setAttribute('opacity',showGas?0.95:0);
    E.fxTubeLine.setAttribute('x1',Math.max(356,head-90)); E.fxTubeLine.setAttribute('x2',head);
    E.fxTubeHead.setAttribute('cx',head);
  }
  fx(E.fxKey, t>0.215&&t<0.27 ? Math.sin(seg(t,0.215,0.27)*Math.PI)*0.95 : 0);
  fx(E.fxChamberGas, t>0.235&&t<0.32 ? Math.sin(seg(t,0.235,0.32)*Math.PI) : 0);
  fx(E.fxVent1, t>0.30&&t<0.37 ? Math.sin(seg(t,0.30,0.37)*Math.PI)*0.8 : 0);
  fx(E.fxVent2, t>0.315&&t<0.385 ? Math.sin(seg(t,0.315,0.385)*Math.PI)*0.8 : 0);
  /* --- carrier motion --- */
  let dx=0, boltRel=0;
  const free = seg(t,0.240,0.300,easeInCubic);              /* free travel: carrier only */
  const rec  = seg(t,0.300,0.520,easeOutCubic);             /* main recoil */
  const bounce = t>0.52&&t<0.58 ? Math.sin(seg(t,0.52,0.58)*Math.PI)*4 : 0;
  const ret  = seg(t,0.580,0.800,easeInOutCubic);           /* return */
  const lock = seg(t,0.800,0.856,easeOutCubic);             /* final cam-lock travel */
  if(t<0.300){ dx = UNLOCK_DX*free; boltRel = -UNLOCK_DX*free; }
  else if(t<0.580){ dx = UNLOCK_DX + (STROKE-UNLOCK_DX)*rec - bounce; boltRel=-UNLOCK_DX; }
  else if(t<0.800){ dx = STROKE - (STROKE-UNLOCK_DX)*ret; boltRel=-UNLOCK_DX; }
  else { dx = UNLOCK_DX*(1-lock); boltRel = -UNLOCK_DX*(1-lock); }
  poseBCG(dx,boltRel,jab);
  const lockDeg=lockAngleDeg(boltRel);
  poseInset(lockDeg,fpHot);
  /* --- dust cover --- */
  poseCover(seg(t,0.262,0.40) * (t>0.985?0:1));
  /* --- spent case: extract + eject --- */
  if(t>0.24 && t<0.995){
    E.gChambered.setAttribute('opacity',0); /* case now drawn as gSpentCase */
    const face = BOLT_FACE + dx + boltRel;  /* actual bolt face x */
    if(t<0.40){
      E.gSpentCase.setAttribute('opacity',1);
      E.gSpentCase.setAttribute('transform',`translate(${face},430)`);
    } else if(t<0.52){
      const ek=seg(t,0.40,0.52,easeOutCubic);
      const ex=lerp(face,930,ek)+(face- face), ey=430-150*Math.sin(ek*Math.PI*0.62);
      const er=-15-150*ek;
      E.gSpentCase.setAttribute('opacity',1);
      E.gSpentCase.setAttribute('transform',`translate(${lerp(806,980,ek)},${430-170*Math.sin(ek*Math.PI*0.58)+90*ek*ek}) rotate(${er})`);
    } else if(t<0.62){
      const fk=seg(t,0.52,0.62,easeInCubic);
      E.gSpentCase.setAttribute('opacity',1-fk);
      E.gSpentCase.setAttribute('transform',`translate(${980+140*fk},${350+260*fk}) rotate(${-165-80*fk})`);
    } else E.gSpentCase.setAttribute('opacity',0);
  }
  /* --- feed next round --- */
  if(t>0.58){
    const face = BOLT_FACE + dx + boltRel;
    if(t<0.86){
      /* round leaves mag when bolt face passes MAGX on the way forward */
      if(face < MAGX+8){
        E.gFeedRound.setAttribute('opacity',1);
        magRounds[0].setAttribute('opacity',0);
        const fk = clamp((MAGX+8-face)/(MAGX+8-(BOLT_FACE)),0,1); /* 0 at pickup, 1 seated */
        const rx = face - 2;
        const lift = Math.sin(Math.min(fk*1.35,1)*Math.PI*0.5);
        const ry = MAGY0 - (MAGY0-430)*lift;
        const rr = 8*Math.sin(fk*Math.PI);
        E.gFeedRound.setAttribute('transform',`translate(${rx},${ry}) rotate(${-rr})`);
        /* stack shifts up */
        const sh = seg(fk,0.25,0.7,easeOutCubic)*MAGDY;
        magRounds.forEach((r,i)=>{ if(i>0) r.setAttribute('transform',
          `translate(${MAGX+(i%2?-6:0)},${MAGY0+i*MAGDY-sh})`); });
        setT(E.gFollower,0,-sh*0.9);
      }
    } else {
      /* seated: show as chambered round again */
      E.gFeedRound.setAttribute('opacity',0);
      E.gChambered.setAttribute('opacity',1);
      E.chamberBullet.setAttribute('opacity',1);
      magRounds.forEach((r,i)=>{ if(i>0) r.setAttribute('transform',
        `translate(${MAGX+(i%2?-6:0)},${MAGY0+(i-1)*MAGDY})`); r.setAttribute('opacity', i===0?0:(i%2?1:.55)); });
      setT(E.gFollower,0,-MAGDY*0.9);
    }
  }
  /* hammer-strike spark, disconnector catch + sear reset flashes */
  if(t>0.106&&t<0.130){ E.fxCatch.setAttribute('cx',952);E.fxCatch.setAttribute('cy',440);
    fx(E.fxCatch,Math.sin(seg(t,0.106,0.130)*Math.PI)*0.9); }
  if(t>0.455&&t<0.505){ E.fxCatch.setAttribute('cx',952);E.fxCatch.setAttribute('cy',526);
    fx(E.fxCatch,Math.sin(seg(t,0.455,0.505)*Math.PI)*0.85); }
  if(t>0.925&&t<0.965){ E.fxCatch.setAttribute('cx',926);E.fxCatch.setAttribute('cy',543);
    fx(E.fxCatch,Math.sin(seg(t,0.925,0.965)*Math.PI)*0.85); }
}

/* ================= TAKEDOWN ================= */
function updateTakedown(t){
  resetTransforms();
  poseSelector(0,'SAFE');
  poseHammer(0);
  poseInset(lockAngleDeg(0),false);
  /* mag removed for maintenance — ghosted in place */
  E.gMag.setAttribute('opacity', 0.16);
  E.gChambered.setAttribute('opacity',0);
  /* pin pop */
  const pk = seg(t,0.07,0.18,easeOutBack);
  const pinBack = seg(t,0.88,0.97,easeInOutCubic);
  const pin = clamp(pk-pinBack,0,1);
  E.tdShaft.setAttribute('width',26*pin);
  E.tdPop.setAttribute('opacity', pk>0.9&&t<0.22 ? (1-seg(t,0.18,0.24)) : 0);
  setT(E.gTDPin, 6*pin, 0);
  /* magnifier */
  const zop = Math.min(seg(t,0.05,0.09), 1-seg(t,0.22,0.27));
  E.gPinZoom.setAttribute('opacity',clamp(zop,0,1));
  E.zoomPin.setAttribute('x', 1116+44*pin);
  E.zoomDetent.setAttribute('d',`M${1120+44*pin} 300 l${-6-10*pin} 0`);
  /* clamshell */
  const openK = seg(t,0.19,0.43,easeInOutCubic) - seg(t,0.90,0.995,easeInOutCubic);
  const ang = -26*clamp(openK,0,1) - 1.5*Math.sin(clamp(seg(t,0.40,0.46),0,1)*Math.PI);
  setR(E.gUpperAsm, ang, PIVOT[0], PIVOT[1]);
  /* BCG + CH slide out along tilted upper axis (local coords) */
  const outK = seg(t,0.44,0.60,easeInOutCubic) - seg(t,0.74,0.88,easeInOutCubic);
  const o = clamp(outK,0,1);
  const chK = clamp(seg(t,0.44,0.52,easeInOutCubic) - seg(t,0.80,0.88,easeInOutCubic),0,1);
  setT(E.gCH, 118*chK, 0);
  const slide = 280*o, sag = 46*o*o;
  E.gBCG.setAttribute('transform',`translate(${slide},${sag})`);
  setT(E.gBuffer,0,0); springPts(SPRING_X0,SPRING_X1);
  /* small internal decompose while out */
  const dk = clamp(seg(t,0.56,0.64,easeInOutCubic) - seg(t,0.72,0.80,easeInOutCubic),0,1);
  setT(E.gBolt, 30*dk, 14*dk);
  E.gCamPin.setAttribute('transform',`translate(${-8*dk},${-30*dk})`);
  E.gFP.setAttribute('transform',`translate(${52*dk},${30*dk})`);
  /* dust cover open while apart */
  poseCover(seg(t,0.30,0.42)*(1-seg(t,0.93,0.99)));
  /* labels on components while out */
  explLblEls.forEach(l=>{
    const p=l.parentNode.id;
    if(p==='gBolt'||p==='gCamPin'||p==='gFP'||p==='gBCG') l.setAttribute('opacity',dk*0.95);
  });
  /* buffer retainer flash while open */
  if(openK>0.9&&t<0.60){ E.fxCatch.setAttribute('cx',1061); E.fxCatch.setAttribute('cy',449);
    fx(E.fxCatch, 0.5+0.4*Math.sin(t*80)); }
}

/* ================= EXPLODED ================= */
function updateExploded(t){
  resetTransforms();
  poseSelector(0,'SAFE');
  poseHammer(0); poseTrigger(0);
  poseInset(0,false);
  E.gChambered.setAttribute('opacity',0);
  let f = 0;
  if(t<0.40) f=easeInOutCubic(seg(t,0.05,0.40));
  else if(t<0.75) f=1;
  else f=1-easeInOutCubic(seg(t,0.75,0.97));
  const hold = t>=0.40&&t<0.75;
  EXPL.forEach(([gid,dx,dy],i)=>{
    const el=E[gid]; if(!el) return;
    const wob = hold ? Math.sin(t*Math.PI*10+i*1.7)*2.2*f : 0;
    if(gid==='gTDPin'||gid==='gPivotPin'||gid==='gHammer'||gid==='gTrigger'||gid==='gDisc'||gid==='gSelector'){
      el.setAttribute('transform',`translate(${dx*f},${dy*f+wob})`);
    } else {
      el.setAttribute('transform',`translate(${dx*f},${dy*f+wob})`);
    }
  });
  Object.entries(EXPL_BCG).forEach(([gid,[dx,dy]],i)=>{
    E[gid].setAttribute('transform',`translate(${dx*f},${dy*f})`);
  });
  /* action spring lifts out of the tube as a rigid coil */
  springPts(SPRING_X0, SPRING_X1);
  E.spring.setAttribute('transform',`translate(${-20*f},${-160*f})`);
  const lop = clamp((f-0.55)/0.45,0,1)*(showLabels?1:0);
  explLblEls.forEach(l=>l.setAttribute('opacity',lop));
  poseCover(0);
}

/* ---------------- phases / HUD ---------------- */
const phaseTag=$('phaseTag'), phaseDesc=$('phaseDesc'), tclock=$('tclock'), modeName=$('modeName'), camTag=$('camTag');
function phasesFor(){ return mode==='cycle'?CYC_PH: mode==='takedown'?TAK_PH:EXP_PH; }
function phaseAt(t){
  const P=phasesFor(); let idx=0;
  for(let i=0;i<P.length;i++) if(t>=P[i][0]) idx=i;
  return idx;
}
const phaselist=$('phaselist');
function buildPhaseList(){
  phaselist.innerHTML='';
  phasesFor().forEach((p,i)=>{
    const b=document.createElement('button');
    b.textContent=String(i).padStart(2,'0')+' '+p[1];
    b.onclick=()=>{ t=p[0]+0.001; if(!playing) render(); };
    phaselist.appendChild(b);
  });
}
function updateHUD(){
  const P=phasesFor(), i=phaseAt(t);
  phaseTag.textContent='PHASE '+String(i).padStart(2,'0')+' · '+P[i][1];
  phaseDesc.textContent=P[i][2];
  [...phaselist.children].forEach((b,j)=>b.classList.toggle('on',j===i));
  tclock.textContent='t='+t.toFixed(3);
  modeName.textContent = mode==='cycle'?'CYCLE OF OPERATION': mode==='takedown'?'TAKEDOWN / CLAMSHELL':'EXPLODED VIEW';
  camTag.textContent = 'VIEW: '+(followZoom&&mode==='cycle'?'MACRO · SECTION A-A':'FULL · SECTION A-A');
}

/* ---------------- camera ---------------- */
function camTarget(){
  if(!followZoom) return CAMS.full;
  if(mode==='cycle'){
    const b=[...CAMS.cycle];
    b[0]+=8*Math.sin(t*Math.PI*2); b[1]+=4*Math.sin(t*Math.PI*4+1);
    return b;
  }
  return CAMS[mode];
}
function updateCam(snap){
  const tg=camTarget();
  if(snap){ cam=[...tg]; }
  else for(let i=0;i<4;i++) cam[i]=lerp(cam[i],tg[i],0.07);
  svg.setAttribute('viewBox',cam.join(' '));
}

/* ---------------- main loop ---------------- */
const scrub=$('scrub');
function render(snapCam){
  if(mode==='cycle') updateCycle(t);
  else if(mode==='takedown') updateTakedown(t);
  else updateExploded(t);
  /* label groups: internal set for the cycle, external set for takedown;
     exploded mode uses per-part labels that ride each component */
  E.gLblInt.setAttribute('opacity', showLabels && mode==='cycle' ? 0.92 : 0);
  E.gLblExt.setAttribute('opacity', showLabels && mode==='takedown' ? 0.92 : 0);
  $('inset').style.display = (mode==='exploded') ? 'none':'block';
  updateHUD();
  updateCam(snapCam);
  scrub.value=Math.round(t*1000);
}
let last=performance.now();
function loop(now){
  const dt=(now-last)/1000; last=now;
  if(playing){ t+=dt*speed/DUR[mode]; if(t>=1)t-=1; }
  render(false);
  requestAnimationFrame(loop);
}

/* ---------------- controls ---------------- */
const playBtn=$('play');
function setMode(m){
  mode=m; t=0;
  ['tabCycle','tabTake','tabExpl'].forEach(id=>$(id).classList.remove('on'));
  $(m==='cycle'?'tabCycle':m==='takedown'?'tabTake':'tabExpl').classList.add('on');
  buildPhaseList(); render(true);
}
$('tabCycle').onclick=()=>setMode('cycle');
$('tabTake').onclick=()=>setMode('takedown');
$('tabExpl').onclick=()=>setMode('exploded');
playBtn.onclick=()=>{ playing=!playing; playBtn.textContent=playing?'❚❚':'▶'; };
scrub.oninput=e=>{ t=+e.target.value/1000; playing=false; playBtn.textContent='▶'; render(false); };
$('speed').oninput=e=>{ speed=+e.target.value/100; $('spdval').textContent=speed.toFixed(2)+'×'; };
function bindTog(id,get,set){ $(id).onclick=()=>{ set(!get()); $(id).classList.toggle('on',get()); render(false); }; }
bindTog('tgXray',()=>xray,v=>{ xray=v; svg.classList.toggle('xray',v); });
bindTog('tgLbl',()=>showLabels,v=>showLabels=v);
bindTog('tgGas',()=>showGas,v=>showGas=v);
bindTog('tgZoom',()=>followZoom,v=>followZoom=v);
$('tgXray').classList.toggle('on',xray);
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); playBtn.onclick(); }
  if(e.code==='ArrowRight'){ t=Math.min(1,t+0.01); playing=false; playBtn.textContent='▶'; render(false); }
  if(e.code==='ArrowLeft'){ t=Math.max(0,t-0.01); playing=false; playBtn.textContent='▶'; render(false); }
  if(e.key==='1') setMode('cycle'); if(e.key==='2') setMode('takedown'); if(e.key==='3') setMode('exploded');
});

/* ---------------- boot ---------------- */
setMode(mode);
t = params.has('t') ? clamp(parseFloat(params.get('t'))||0,0,1) : t;
if(still){ playing=false; playBtn.textContent='▶'; render(true); }
else requestAnimationFrame(loop);
</script>
