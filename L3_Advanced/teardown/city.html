<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

let seed = 20260718;
const rand = () => {
  seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
};

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.shadowMap.needsUpdate = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(26, window.innerWidth / window.innerHeight, 2, 500);
camera.position.set(75, 95, 75);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 30;
controls.maxDistance = 280;
controls.maxPolarAngle = Math.PI * 0.49;
controls.autoRotateSpeed = 0.9;

function makePixelSky() {
  const w = 256, h = 128;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  const stops = [
    [0.00, [40, 74, 142]],
    [0.30, [66, 120, 184]],
    [0.55, [122, 170, 216]],
    [0.80, [216, 180, 150]],
    [1.00, [255, 198, 140]]
  ];
  const bands = 18;
  for (let i = 0; i < bands; i++) {
    const t = i / (bands - 1);
    let c = [0, 0, 0];
    for (let s = 0; s < stops.length - 1; s++) {
      const [t0, c0] = stops[s], [t1, c1] = stops[s + 1];
      if (t >= t0 && t <= t1) {
        const u = (t - t0) / (t1 - t0);
        c = [0, 1, 2].map(j => Math.round(c0[j] + (c1[j] - c0[j]) * u));
      }
    }
    g.fillStyle = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
    const y0 = Math.floor(i * (h / 2) / bands), y1 = Math.floor((i + 1) * (h / 2) / bands);
    g.fillRect(0, y0, w, y1 - y0 + 1);
  }
  g.fillStyle = '#3a3630'; g.fillRect(0, h / 2, w, 6);
  g.fillStyle = '#2b2925'; g.fillRect(0, h / 2 + 6, w, 10);
  g.fillStyle = '#1f1e1b'; g.fillRect(0, h / 2 + 16, w, h / 2 - 16);
  const sunPx = 234, sunPy = 43;
  const disc = (r, color) => {
    g.fillStyle = color;
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (dx * dx + dy * dy <= r * r) g.fillRect(sunPx + dx, sunPy + dy, 1, 1);
    }
  };
  disc(9, 'rgba(255,214,150,0.4)');
  disc(6, '#ffd9a0');
  disc(4, '#fff3d0');
  disc(2, '#ffffff');
  for (let i = 0; i < 11; i++) {
    const cw = 8 + Math.floor(rand() * 26), ch = 2 + Math.floor(rand() * 3);
    const cx = 8 + Math.floor(rand() * (w - 48)), cy = 10 + Math.floor(rand() * 40);
    if (Math.abs(cx - sunPx) < 28 && Math.abs(cy - sunPy) < 18) continue;
    g.fillStyle = '#f2ead9'; g.fillRect(cx, cy, cw, ch);
    g.fillStyle = '#fbf6ea'; g.fillRect(cx + 2, cy - 1, cw - 6, 2);
    g.fillStyle = '#cbbfae'; g.fillRect(cx + 1, cy + ch - 1, cw - 2, 1);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  return tex;
}
const skyTex = makePixelSky();
scene.background = skyTex;
scene.backgroundIntensity = 1.0;
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromEquirectangular(skyTex).texture;
scene.environmentIntensity = 0.55;
pmrem.dispose();

const sun = new THREE.DirectionalLight(0xffd9b0, 3.0);
sun.position.set(-111, 75, 67);
sun.target.position.set(0, 4, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.camera.left = -62;
sun.shadow.camera.right = 62;
sun.shadow.camera.top = 62;
sun.shadow.camera.bottom = -62;
sun.shadow.camera.near = 30;
sun.shadow.camera.far = 320;
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun);
scene.add(sun.target);
scene.add(new THREE.HemisphereLight(0xbdd4ff, 0x54483c, 0.5));

const S = 32;
const roadZ = [[-20, -17], [-2, 1], [16, 19]];
const roadX = [[-22, -19], [-4, -1], [24, 27]];
const inB = (v, b) => v >= b[0] && v <= b[1];
const isRoad = (x, z) => roadZ.some(b => inB(z, b)) || roadX.some(b => inB(x, b));
const rC = z => Math.round(9 + 6 * Math.sin(z * 0.08));
const riverKind = (x, z) => {
  const c = rC(z);
  if (x >= c - 3 && x <= c + 2) return 'water';
  if (x === c - 4 || x === c + 3) return 'wall';
  return null;
};

const surf = new Map();
for (let x = -S; x < S; x++) for (let z = -S; z < S; z++) {
  let t = 'lot';
  if (isRoad(x, z)) t = 'road';
  else {
    outer:
    for (let dx = -2; dx <= 2; dx++) for (let dz = -2; dz <= 2; dz++) {
      if (isRoad(x + dx, z + dz)) { t = 'walk'; break outer; }
    }
  }
  const rv = riverKind(x, z);
  if (rv === 'water') t = (t === 'road') ? 'bridge' : 'water';
  else if (rv === 'wall') t = (t === 'road') ? 'bridge' : 'wall';
  if (t === 'lot' && x >= -16 && x <= -7 && z >= 4 && z <= 13) t = 'grass';
  surf.set(x + ',' + z, t);
}
for (let z = -S; z < S; z++) {
  const wx = rC(z) + 3;
  for (const xx of [wx + 1, wx + 2]) {
    if (surf.get(xx + ',' + z) === 'lot') surf.set(xx + ',' + z, 'walk');
  }
}

const V = new Map();
const key = (x, y, z) => x + ',' + y + ',' + z;
const has = (x, y, z) => V.has(key(x, y, z));
const put = (x, y, z, g, c) => { const k = key(x, y, z); if (!V.has(k)) V.set(k, { x, y, z, g, c }); };
const putF = (x, y, z, g, c) => V.set(key(x, y, z), { x, y, z, g, c });
const col = (hex, jitter = 0) => {
  const c = new THREE.Color(hex);
  if (jitter) c.offsetHSL(0, 0, (rand() - 0.5) * jitter);
  return c;
};

function roadColor(x, z) {
  if (x >= -4 && x <= -1 && (z === -4 || z === -3 || z === 2 || z === 3) && (x & 1) === 0) return col(0xd8d6d0, 0.03);
  if (z >= -2 && z <= 1 && (x === -6 || x === -5 || x === 2 || x === 3) && (z & 1) === 0) return col(0xd8d6d0, 0.03);
  for (const b of roadZ) {
    if (inB(z, b) && z === b[0] + 1 && !roadX.some(bx => x >= bx[0] - 2 && x <= bx[1] + 2) && ((x % 4) + 4) % 4 < 2) return col(0xc9a23a, 0.05);
  }
  for (const b of roadX) {
    if (inB(x, b) && x === b[0] + 1 && !roadZ.some(bz => z >= bz[0] - 2 && z <= bz[1] + 2) && ((z % 4) + 4) % 4 < 2) return col(0xc9a23a, 0.05);
  }
  if (rand() < 0.012) return col(0x2c2e31, 0.03);
  return col(0x3b3e42, 0.05);
}

for (let x = -S; x < S; x++) for (let z = -S; z < S; z++) {
  const t = surf.get(x + ',' + z);
  put(x, 0, z, 'diffuse', col(0x66625c, 0.05));
  if (t === 'water') {
    put(x, 1, z, 'diffuse', col(0x474c43, 0.07));
    put(x, 2, z, 'water', col(0xcfeef2, 0.04));
    continue;
  }
  if (t === 'bridge') {
    put(x, 1, z, 'diffuse', col(0x474c43, 0.07));
    put(x, 2, z, 'water', col(0xcfeef2, 0.04));
    put(x, 3, z, 'diffuse', roadColor(x, z));
    continue;
  }
  put(x, 1, z, 'diffuse', col(0x6e6a64, 0.05));
  put(x, 2, z, 'diffuse', t === 'wall' ? col(0x8a867e, 0.05) : col(0x6b4a33, 0.07));
  let sc;
  if (t === 'road') sc = roadColor(x, z);
  else if (t === 'walk') sc = col(((x + z) & 1) ? 0xa6a29a : 0x9c9890, 0.04);
  else if (t === 'grass') sc = col(0x5c8a3a, 0.12);
  else if (t === 'wall') sc = col(0x99958d, 0.05);
  else sc = col(0x8f8b83, 0.05);
  put(x, 3, z, 'diffuse', sc);
}

for (const b of roadZ) {
  for (const zr of [b[0], b[1]]) {
    for (let x = -S; x < S; x++) {
      if (surf.get(x + ',' + zr) !== 'bridge') continue;
      putF(x, 4, zr, 'diffuse', col(0x9a968e, 0.05));
      if (((x % 4) + 4) % 4 === 0) {
        putF(x, 2, zr, 'diffuse', col(0x84807a, 0.04));
        putF(x, 1, zr, 'diffuse', col(0x84807a, 0.04));
      }
    }
  }
}

const buildings = [
  { x: -31, z: -31, w: 7, d: 7, h: 18, c: 0x9a4f3c },
  { x: -16, z: -30, w: 8, d: 7, h: 20, c: 0x6e7f8f },
  { x: 12, z: -31, w: 8, d: 8, h: 15, c: 0xa8998a },
  { x: -31, z: -14, w: 7, d: 8, h: 26, c: 0xd8d2c4, glassy: true, tower: true },
  { x: -16, z: -14, w: 9, d: 8, h: 14, c: 0xa04a38, neon: true },
  { x: 14, z: -14, w: 8, d: 8, h: 19, c: 0x87909a, tower: true },
  { x: -31, z: 4, w: 7, d: 8, h: 12, c: 0x5f8a96 },
  { x: 3, z: 3, w: 3, d: 8, h: 8, c: 0xb0a494 },
  { x: -31, z: 22, w: 8, d: 8, h: 16, c: 0x8f8a80 },
  { x: -16, z: 22, w: 8, d: 7, h: 10, c: 0xcbbfa8 },
  { x: 2, z: 22, w: 6, d: 8, h: 11, c: 0x74655a },
  { x: 29, z: -12, w: 3, d: 6, h: 5, c: 0x996f4a },
  { x: 29, z: 6, w: 3, d: 5, h: 4, c: 0x6a7a6a }
];

function addBuilding(b) {
  const y0 = 4, x = b.x, z = b.z, w = b.w, d = b.d, h = b.h;
  const base = new THREE.Color(b.c);
  for (let i = 0; i < w; i++) for (let k = 0; k < d; k++) {
    const px = x + i, pz = z + k;
    const isEdge = i === 0 || i === w - 1 || k === 0 || k === d - 1;
    if (!isEdge) {
      put(px, y0 + h - 1, pz, 'diffuse', col(0x6d6a64, 0.05));
      continue;
    }
    for (let y = y0; y < y0 + h; y++) {
      const fy = (y - y0) % 3;
      const floorTop = y >= y0 + h - 2;
      const corner = (i === 0 || i === w - 1) && (k === 0 || k === d - 1);
      const onX = i === 0 || i === w - 1;
      const innerCell = onX ? (k > 0 && k < d - 1) : (i > 0 && i < w - 1);
      const stripe = onX ? (k % 2 === 1) : (i % 2 === 1);
      const groundF = y < y0 + 2;
      if (k === d - 1 && i === (w >> 1) && y < y0 + 2) continue;
      const isWin = !corner && innerCell && !floorTop && !groundF && stripe && (b.glassy ? fy > 0 : fy === 1);
      if (isWin) {
        if (rand() < 0.14) put(px, y, pz, 'emitWarm', new THREE.Color(0xffffff));
        else put(px, y, pz, 'glass', col(0xcfe6ea, 0.04));
      } else {
        const c2 = base.clone().offsetHSL(0, 0, (rand() - 0.5) * 0.05);
        if (groundF) c2.multiplyScalar(0.72);
        else if (y === y0 + h - 1) c2.multiplyScalar(0.85);
        put(px, y, pz, 'diffuse', c2);
      }
    }
  }
  if (b.tower) {
    const tx = x + 1, tz = z + 1, ty = y0 + h;
    for (let i = 0; i < 2; i++) for (let k = 0; k < 2; k++) {
      put(tx + i, ty, tz + k, 'metal', col(0x707880, 0.04));
      for (let y = ty + 1; y < ty + 3; y++) put(tx + i, y, tz + k, 'diffuse', col(0x7a5a34, 0.06));
    }
  }
  if (w >= 6 && d >= 6 && h >= 10) {
    put(x + w - 3, y0 + h, z + d - 3, 'metal', col(0x9aa2aa, 0.05));
    put(x + w - 4, y0 + h, z + d - 3, 'metal', col(0x8a9298, 0.05));
  }
  if (b.neon) {
    const nx = x + w, nz = z + d - 2;
    for (let y = y0 + 4; y < Math.min(y0 + 10, y0 + h - 2); y++) put(nx, y, nz, 'emitNeon', new THREE.Color(0xffffff));
  }
}
buildings.forEach(addBuilding);

function addCar(x, z, alongX, hex) {
  const L = 4, W = 2;
  const cells = [];
  for (let a = 0; a < L; a++) for (let b = 0; b < W; b++) {
    cells.push(alongX ? [x + a, z + b, a] : [x + b, z + a, a]);
  }
  for (const [px, pz] of cells) {
    const t = surf.get(px + ',' + pz);
    if (t !== 'road' && t !== 'bridge') return;
    for (let y = 4; y <= 7; y++) if (has(px, y, pz)) return;
  }
  const paint = new THREE.Color(hex);
  for (const [px, pz, a] of cells) {
    const wheel = a === 0 || a === L - 1;
    if (wheel) put(px, 4, pz, 'diffuse', col(0x17181a, 0.03));
    else put(px, 4, pz, 'diffuse', paint.clone().multiplyScalar(0.45));
    put(px, 5, pz, 'metal', paint.clone().offsetHSL(0, 0, (rand() - 0.5) * 0.04));
    if (a === 1 || a === 2) put(px, 6, pz, 'glass', col(0xbfdfe6, 0.03));
  }
}
const cars = [
  [-14, -1, true, 0xc0392b],
  [7, -1, true, 0x12a4b0],
  [18, -1, true, 0xe8b820],
  [-10, -19, true, 0xe8e6e0],
  [2, -19, true, 0x2e5fa3],
  [-28, -19, true, 0x394047],
  [-8, 17, true, 0xc0392b],
  [25, 8, false, 0xe8b820],
  [25, -8, false, 0xe8e6e0],
  [-3, 10, false, 0x12a4b0],
  [-21, 24, false, 0x8a4a8f],
  [-3, -28, false, 0x2e5fa3]
];
cars.forEach(c => addCar(c[0], c[1], c[2], c[3]));

function addTree(x, z) {
  const t = surf.get(x + ',' + z);
  if (t !== 'grass' && t !== 'walk' && t !== 'lot') return;
  for (let y = 4; y <= 8; y++) if (has(x, y, z)) return;
  put(x, 4, z, 'diffuse', col(0x5a3d22, 0.06));
  put(x, 5, z, 'diffuse', col(0x63452a, 0.06));
  for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
    const corner = Math.abs(dx) + Math.abs(dz) === 2;
    if (corner && rand() < 0.5) continue;
    put(x + dx, 6, z + dz, 'diffuse', col(rand() < 0.5 ? 0x4e7d2f : 0x639441, 0.08));
    if (!corner) put(x + dx, 7, z + dz, 'diffuse', col(rand() < 0.5 ? 0x4e7d2f : 0x639441, 0.08));
  }
  put(x, 8, z, 'diffuse', col(0x639441, 0.08));
}
[[-14, 6], [-10, 9], [-8, 5], [-13, 11], [-9, 13]].forEach(p => addTree(p[0], p[1]));
[-12, -8, 8, 14, 24].forEach(z => addTree(rC(z) + 4, z));
addTree(-8, 3); addTree(-13, 3); addTree(6, 21);

function addLamp(x, z) {
  const t = surf.get(x + ',' + z);
  if (t !== 'walk' && t !== 'grass' && t !== 'lot') return;
  for (let y = 4; y <= 8; y++) if (has(x, y, z)) return;
  for (let y = 4; y <= 7; y++) put(x, y, z, 'metal', col(0x35383c, 0.04));
  put(x, 8, z, 'emitWarm', new THREE.Color(0xffffff));
}
[-14, -6, 4, 12, 22].forEach(z => addLamp(rC(z) + 5, z));
addLamp(-16, 3); addLamp(-7, 14);

const toDelete = [];
for (const [k, v] of V) {
  if (has(v.x + 1, v.y, v.z) && has(v.x - 1, v.y, v.z) &&
      has(v.x, v.y + 1, v.z) && has(v.x, v.y - 1, v.z) &&
      has(v.x, v.y, v.z + 1) && has(v.x, v.y, v.z - 1)) toDelete.push(k);
}
toDelete.forEach(k => V.delete(k));

const groups = { diffuse: [], metal: [], glass: [], water: [], emitWarm: [], emitNeon: [] };
for (const v of V.values()) groups[v.g].push(v);

const box = new THREE.BoxGeometry(1, 1, 1);
const matDiffuse = new THREE.MeshPhysicalMaterial({ roughness: 0.93, metalness: 0, envMapIntensity: 0.35 });
const matMetal = new THREE.MeshPhysicalMaterial({ roughness: 0.25, metalness: 1, envMapIntensity: 1.0 });
const matGlass = new THREE.MeshPhysicalMaterial({
  roughness: 0.05, metalness: 0, transmission: 1, ior: 1.52, thickness: 0.8,
  attenuationColor: new THREE.Color(0xd0ecee), attenuationDistance: 6, envMapIntensity: 1.0
});
const matWater = new THREE.MeshPhysicalMaterial({
  roughness: 0.13, metalness: 0, transmission: 1, ior: 1.33, thickness: 1.6,
  attenuationColor: new THREE.Color(0x3fb5c4), attenuationDistance: 2.5, envMapIntensity: 0.9
});
const matWarm = new THREE.MeshPhysicalMaterial({ color: 0x100a04, emissive: 0xffb26a, emissiveIntensity: 2.6, roughness: 1 });
const matNeon = new THREE.MeshPhysicalMaterial({ color: 0x03110f, emissive: 0x19e8d2, emissiveIntensity: 3.0, roughness: 1 });

const build = (list, material, castShadow, receiveShadow) => {
  const mesh = new THREE.InstancedMesh(box, material, list.length);
  const m = new THREE.Matrix4();
  list.forEach((v, i) => {
    m.setPosition(v.x + 0.5, v.y + 0.5, v.z + 0.5);
    mesh.setMatrixAt(i, m);
    mesh.setColorAt(i, v.c);
  });
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.castShadow = castShadow;
  mesh.receiveShadow = receiveShadow;
  scene.add(mesh);
  return mesh;
};
const meshDiffuse = build(groups.diffuse, matDiffuse, true, true);
const meshMetal = build(groups.metal, matMetal, true, true);
const meshGlass = build(groups.glass, matGlass, false, false);
const meshWater = build(groups.water, matWater, false, true);
const meshWarm = build(groups.emitWarm, matWarm, false, false);
const meshNeon = build(groups.emitNeon, matNeon, false, false);

const matWood = new THREE.MeshPhysicalMaterial({ color: 0x7a5634, roughness: 0.5, metalness: 0, clearcoat: 0.35, clearcoatRoughness: 0.4, envMapIntensity: 0.6 });
const matWoodDark = new THREE.MeshPhysicalMaterial({ color: 0x5b3f26, roughness: 0.6, metalness: 0, envMapIntensity: 0.4 });
const tableTop = new THREE.Mesh(new THREE.BoxGeometry(84, 2.99, 84), matWood);
tableTop.position.set(0, -1.505, 0);
tableTop.castShadow = tableTop.receiveShadow = true;
scene.add(tableTop);
const legGeo = new THREE.BoxGeometry(5, 20, 5);
[[-35, -35], [35, -35], [-35, 35], [35, 35]].forEach(p => {
  const leg = new THREE.Mesh(legGeo, matWoodDark);
  leg.position.set(p[0], -13, p[1]);
  leg.castShadow = leg.receiveShadow = true;
  scene.add(leg);
});
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(900, 900),
  new THREE.MeshPhysicalMaterial({ color: 0x26282d, roughness: 0.95, metalness: 0, envMapIntensity: 0.2 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -23.01;
floor.receiveShadow = true;
scene.add(floor);

const composer = new EffectComposer(renderer);
composer.setPixelRatio(renderer.getPixelRatio());

const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

const aoParams = { radius: 1.0, distanceExponent: 1, thickness: 1, distanceFallOff: 1, scale: 1.2, samples: 16, screenSpaceRadius: false };
const gtaoPass = new GTAOPass(scene, camera, window.innerWidth, window.innerHeight);
gtaoPass.output = GTAOPass.OUTPUT.Default;
gtaoPass.blendIntensity = 1.0;
gtaoPass.updateGtaoMaterial(aoParams);
gtaoPass.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 4, radiusExponent: 1, rings: 2, samples: 16 });
composer.addPass(gtaoPass);

const bokehPass = new BokehPass(scene, camera, { focus: 118, aperture: 0.0006, maxblur: 0.02 });
composer.addPass(bokehPass);

composer.addPass(new OutputPass());

const GradeShader = {
  name: 'GradeShader',
  uniforms: { tDiffuse: { value: null }, saturation: { value: 1.25 }, contrast: { value: 1.06 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'uniform sampler2D tDiffuse; uniform float saturation; uniform float contrast; varying vec2 vUv; void main(){ vec4 c = texture2D(tDiffuse, vUv); float l = dot(c.rgb, vec3(0.2126, 0.7152, 0.0722)); c.rgb = mix(vec3(l), c.rgb, saturation); c.rgb = (c.rgb - 0.5) * contrast + 0.5; gl_FragColor = c; }'
};
const gradePass = new ShaderPass(GradeShader);
composer.addPass(gradePass);

const fxaaPass = new ShaderPass(FXAAShader);
composer.addPass(fxaaPass);
const updateFXAA = () => {
  const pr = renderer.getPixelRatio();
  fxaaPass.material.uniforms['resolution'].value.set(1 / (window.innerWidth * pr), 1 / (window.innerHeight * pr));
};
updateFXAA();

const P = {
  ao: true, aoOnly: false, aoRadius: 1.0, aoIntensity: 1.0,
  dof: true, autoFocus: true, focus: 118, aperture: 0.0006, maxblur: 0.02,
  sat: 1.25, con: 1.06, exposure: 1.15, sun: 3.0, autoRotate: false
};
const gui = new GUI({ title: '渲染管线' });
const f1 = gui.addFolder('GTAO 环境光遮蔽');
f1.add(P, 'ao').name('启用').onChange(v => gtaoPass.enabled = v);
f1.add(P, 'aoOnly').name('仅显示 AO').onChange(v => {
  gtaoPass.output = v ? GTAOPass.OUTPUT.Denoise : GTAOPass.OUTPUT.Default;
});
f1.add(P, 'aoRadius', 0.2, 4, 0.05).name('采样半径').onChange(v => {
  aoParams.radius = v;
  gtaoPass.updateGtaoMaterial(aoParams);
});
f1.add(P, 'aoIntensity', 0, 2, 0.05).name('强度').onChange(v => gtaoPass.blendIntensity = v);
const f2 = gui.addFolder('移轴景深');
f2.add(P, 'dof').name('启用').onChange(v => bokehPass.enabled = v);
f2.add(P, 'autoFocus').name('自动对焦画面中心');
const focusCtrl = f2.add(P, 'focus', 20, 300, 1).name('对焦距离')
  .onChange(v => bokehPass.uniforms['focus'].value = v);
f2.add(P, 'aperture', 0, 0.003, 0.00005).name('光圈(模糊斜率)')
  .onChange(v => bokehPass.uniforms['aperture'].value = v);
f2.add(P, 'maxblur', 0, 0.04, 0.001).name('最大模糊')
  .onChange(v => bokehPass.uniforms['maxblur'].value = v);
const f3 = gui.addFolder('画面');
f3.add(P, 'sat', 0.5, 2, 0.05).name('饱和度').onChange(v => gradePass.uniforms['saturation'].value = v);
f3.add(P, 'con', 0.8, 1.5, 0.01).name('对比度').onChange(v => gradePass.uniforms['contrast'].value = v);
f3.add(P, 'exposure', 0.3, 2.5, 0.05).name('曝光').onChange(v => renderer.toneMappingExposure = v);
const f4 = gui.addFolder('光照与相机');
f4.add(P, 'sun', 0, 8, 0.1).name('太阳强度').onChange(v => sun.intensity = v);
f4.add(P, 'autoRotate').name('自动旋转').onChange(v => controls.autoRotate = v);

const raycaster = new THREE.Raycaster();
const pickables = [meshDiffuse, meshMetal, meshGlass, meshWater, meshWarm, meshNeon, tableTop, floor];
renderer.domElement.addEventListener('dblclick', e => {
  const ndc = new THREE.Vector2(
    (e.clientX / window.innerWidth) * 2 - 1,
    -(e.clientY / window.innerHeight) * 2 + 1
  );
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(pickables, false)[0];
  if (hit) {
    P.autoFocus = false;
    P.focus = hit.distance;
    bokehPass.uniforms['focus'].value = hit.distance;
    gui.controllersRecursive().forEach(c => c.updateDisplay());
  }
});

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  const pr = renderer.getPixelRatio();
  if (bokehPass.renderTargetDepth) bokehPass.renderTargetDepth.setSize(Math.round(w * pr), Math.round(h * pr));
  if (bokehPass.uniforms['aspect']) bokehPass.uniforms['aspect'].value = camera.aspect;
  updateFXAA();
});

const total = V.size;
setTimeout(() => {
  document.getElementById('stat').textContent =
    '体素实例: ' + total + ' · InstancedMesh x 6 · draw calls: ' + renderer.info.render.calls + ' · three r170 GTAO';
}, 1500);

renderer.setAnimationLoop(() => {
  controls.update();
  if (P.dof && P.autoFocus) {
    const d = camera.position.distanceTo(controls.target);
    P.focus = d;
    bokehPass.uniforms['focus'].value = d;
    focusCtrl.updateDisplay();
  }
  composer.render();
});
</script>
</body>
</html>
