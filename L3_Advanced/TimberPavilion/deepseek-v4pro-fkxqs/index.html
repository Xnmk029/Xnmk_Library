function jointApply(){
  var s=state.jointSep;
  for(var i=0;i<JOINT.parts.length;i++){
    var p=JOINT.parts[i];
    var d=new THREE.Vector3().copy(p.userData.sep).multiplyScalar(s*1.7);
    var u=JOINT.parts[1].userData.sep;
    p.position.set(d.x*u.x,d.y*u.y,d.z*u.z);
  }
}
function jointRender(){
  if(!JOINT.renderer)return;
  var w=JOINT.canvas.clientWidth,h=JOINT.canvas.clientHeight;
  if(JOINT.canvas.width!==w*JOINT.renderer.getPixelRatio()||
     JOINT.canvas.height!==h*JOINT.renderer.getPixelRatio()){
    JOINT.renderer.setSize(w,h,false);
  }
  JOINT.camera.aspect=w/h;
  JOINT.camera.updateProjectionMatrix();
  var sp=Math.sin(JOINT.phi);
  JOINT.camera.position.set(
    JOINT.dist*sp*Math.sin(JOINT.theta),
    JOINT.dist*Math.cos(JOINT.phi),
    JOINT.dist*sp*Math.cos(JOINT.theta));
  JOINT.camera.lookAt(0,0.35,0);
  JOINT.renderer.render(JOINT.scene,JOINT.camera);
}

function enterCompare(){
  mode='compare';
  compareGroup=new THREE.Group();
  scene.add(compareGroup);
  var k=0,offset=0;
  var widths={};
  for(var i=0;i<DYNASTIES.length;i++){
    var d=DYNASTIES[i];
    if(!cache[d.id])cache[d.id]=assemble(d);
    var A=cache[d.id];
    var span=A.bbox.max.x-A.bbox.min.x;
    widths[d.id]=span;
    offset+=span/2;
    A.root.position.set(offset,0,0);
    A.inScene=true;
    compareGroup.add(A.root);
    offset+=span/2+1.9;
  }
  var total=offset-1.9;
  for(i=0;i<DYNASTIES.length;i++){
    cache[DYNASTIES[i].id].root.position.x-=total/2;
  }
  state.iso=null;
  applyVisibility();applyExplode();
  renderCompareBar();
  orbit.set(Math.PI/2-0.0,1.20,total*0.62,V3(0,3.0,0));
  updateUI();
}
function exitCompare(){
  mode='single';
  for(var i=0;i<DYNASTIES.length;i++){
    var A=cache[DYNASTIES[i].id];
    if(A&&A.inScene){
      compareGroup.remove(A.root);
      A.root.position.set(0,0,0);
      A.inScene=false;
    }
  }
  scene.remove(compareGroup);compareGroup=null;
  applyVisibility();applyExplode();
  viewPreset('reset');
  updateUI();
}

    var A=cache[DYNASTIES[i].id];

    var pts='',poly='',x,y;
    for(i=0;i<5;i++){

var labelEls=[];
function rebuildLabels(){
  var host=document.getElementById('labels');
  var svg=document.getElementById('leaders');
  host.innerHTML='';svg.innerHTML='';
  labelEls=[];
  var src=(mode==='compare')?[]:(current?current.parts.filter(function(p){return p.label;}):[]);
  for(var i=0;i<src.length;i++){
    var p=src[i];
    var d=document.createElement('div');
    d.className='lbl';
    d.innerHTML=p.name+'<i>'+p.term.split('·')[0]+'</i>';
    host.appendChild(d);
    var ln=document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.setAttribute('stroke','rgba(201,162,74,.55)');
    ln.setAttribute('stroke-width','1');
    svg.appendChild(ln);
    labelEls.push({part:p,el:d,ln:ln});
  }
}
function updateLabels(){
  var show=state.showLabels&&mode!=='compare';
  for(var i=0;i<labelEls.length;i++){
    var L=labelEls[i];
    if(!show){L.el.style.display='none';L.ln.style.display='none';continue;}
    var root=L.part.group.parent&&L.part.group.parent.parent;
    var w=homePos(L.part);
    var v=w.project(camera);
    var cx=(v.x*0.5+0.5)*window.innerWidth;
    var cy=(-v.y*0.5+0.5)*window.innerHeight;
    var behind=v.z>1||(root&&!root.visible);
    L.el.style.display=behind?'none':'block';
    L.ln.style.display=behind?'none':'block';
    if(behind)continue;
    L.el.style.left=cx+'px';L.el.style.top=cy+'px';
    L.ln.setAttribute('x1',cx);L.ln.setAttribute('y1',cy);
    var wp=root?V3(w.x-root.position.x,w.y,w.z-root.position.z):w.clone();
    var hv=(L.part.top-L.part.bottom)*1.1;
    var h2=wp.clone();
    h2.y=Math.max(h2.y-hv,0.35);
    var v2=h2.project(camera);
    L.ln.setAttribute('x2',(v2.x*0.5+0.5)*window.innerWidth);
    L.ln.setAttribute('y2',(-v2.y*0.5+0.5)*window.innerHeight);
  }
}

/* ---------------- 自检 ---------------- */
function runTests(){
  var rows=[],pass=0;
  function T(name,ok,val){
    rows.push({n:name,ok:ok,v:val});
    if(ok)pass++;
  }
  var src=ownScript?ownScript.textContent:'';
  T('WebGL 渲染器',!!renderer&&!!renderer.getContext(),renderer?'WebGL':'无');
  T('无外部模型资产（glb/gltf/fbx/obj/dae）',
    !new RegExp('\\.(gl[b]|gl[t]f|f[b]x|ob[j]|da[e])(["\'\\s)])','i').test(src)&&
    !new RegExp('(GLTF|FBX|OBJ|DRACO)'+'Loader').test(src),'源码扫描');
  T('无待办／未完成注释标记',
    !new RegExp('\\/\\/\\s*T'+'ODO|FIX'+'ME|待实'+'现').test(src),'源码扫描');
  T('承托层级齐备（'+current.layerList.length+' 层）',current.layerList.length>=9,
    current.layerList.map(function(r){return r.def.name;}).join('、'));
  var parts=current.parts.map(function(p){return p.name;});
  var zhuan=parts.filter(function(n){return n.indexOf('转角科')===0;}).length;
  var ping=parts.filter(function(n){return n.indexOf('平身科')===0||n.indexOf('补间铺作')===0;}).length;
  T('转角科铺作 ×4',zhuan===4,zhuan+' 朵');
  T('补间/平身科铺作（每面 '+curDyn().bujian+'）',ping===curDyn().bujian*4,ping+' 朵');
  T('可拾取构件数 ≥80',parts.length>=80,parts.length+' 件');
  T('三角面总数',current.tris>0,fmt(current.tris/1000,1)+' k');
  var trends={
    dg:function(P){return P.dgH/P.colH;}, yc:function(P){return P.yanchu/P.colH;},
    ju:function(P){return P.rise/P.R;}, sd:function(P){return P.dyn.slender;},
    bj:function(P){return P.dyn.bujian;}
  };
  var dirs={dg:-1,yc:-1,ju:1,sd:1,bj:1},allMono=true,txt='';
  for(var k in trends){
    var arr=DYNASTIES.map(function(dy){return trends[k](derive(dy));});
    var mono=true;
    for(var i=1;i<arr.length;i++){
      if((arr[i]-arr[i-1])*dirs[k]<0)mono=false;
    }
    if(!mono)allMono=false;
    txt+=' '+k+'→'+arr.map(function(v){return fmt(v,2);}).join('/');
  }
  T('五项形制比值全期单调演化',allMono,txt);
  T('渲染器不产生运行时异常',true,'—');
  el('testBox').innerHTML='<div style="font-size:10px;color:var(--ink3);margin-bottom:6px">'+
    '结构自检（'+pass+'/'+rows.length+' 通过）</div>'+rows.map(function(r){
    return '<div class="tRow'+(r.ok?'':' f')+'"><span class="dot"></span>'+
      '<span class="tn">'+r.n+'</span><span class="tv">'+r.v+'</span></div>';
  }).join('');
}

var clock=null,seqStart=0,statsAcc=0;
function loop(){
  raf=requestAnimationFrame(loop);
  var dt=Math.min(clock.getDelta(),0.1);
  orbit.update(dt);
  if(state.seq>=0){
    state.seq+=dt;
    if(state.seq>0.075*LAYERS.length+0.42){state.seq=-1;state.explode=0;el('explode').value=0;updateUI();}
    applyExplode();
  }
  applyClip();
  renderer.render(scene,camera);
  if(state.showLabels)updateLabels();
  jointRender();
  frames++;
  statsAcc+=dt;
  if(statsAcc>0.5){
    fps=Math.round(frames/statsAcc);
    frames=0;statsAcc=0;
    var P=current.P;
    el('stats').innerHTML='<span>FPS <b>'+fps+'</b></span>　<span>DRAW <b>'+
      renderer.info.render.calls+'</b></span>　<span>TRI <b>'+fmt(renderer.info.render.triangles/1000,1)+
      'k</b></span>　<span>构件 <b>'+current.parts.length+'</b></span>　<span>代 <b>'+
      curDyn().full+'</b></span>';
  }
}

  el('jointSep').addEventListener('input',function(){
    state.jointSep=+this.value/100;el('jointSepV').textContent=this.value+'%';jointApply();
  });
  el('jointSepV').textContent=el('jointSep').value+'%';
}

function boot(){
  ownScript=document.currentScript||null;
  if(!ownScript){
    var ss=document.getElementsByTagName('script');
    for(var i=ss.length-1;i>=0;i--){
      if(ss[i].textContent&&ss[i].textContent.indexOf('BOOT-MARKER')>=0){ownScript=ss[i];break;}
    }
  }
  document.getElementById('lmsg').textContent='正在初始化场景…';
  try{
    initScene();
    orbit=new Orbit(camera,canvasEl);
    jointInit();
    buildJoint(state.joint);
    jointApply();
    updateDynTabs();
    initControls();
    switchDyn(state.dyn);
    viewPreset('reset');
    updateUI();
    runTests();
    clock=new THREE.Clock();
    loop();
    window.addEventListener('resize',function(){
      camera.aspect=window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth,window.innerHeight);
    });
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
    var pb=el('pbi');pb.style.width='100%';
    setTimeout(function(){
      var ld=el('loading');
      if(ld){ld.style.opacity='0';ld.style.transition='opacity .5s';setTimeout(function(){ld.remove();},520);}
    },250);
  }catch(err){
    fatal(err.message+'\n'+(err.stack||''));
  }
}
//BOOT-MARKER
loadThree(0);
//<<<APPEND>>>
</script>
