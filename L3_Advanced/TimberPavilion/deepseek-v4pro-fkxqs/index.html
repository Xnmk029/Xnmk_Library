<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>四角攒尖亭 · 木构营造与朝代形制演变</title>
<style>
:root{
  --bg:#15130f; --bg2:#1b1814; --bg3:#211d18; --line:#3a342b; --line2:#4d453a;
  --ink:#e9e2d4; --ink2:#b3a894; --ink3:#7d7466;
  --zhu:#a8352b; --zhe:#b4763a; --qing:#4a6f7c; --jin:#c9a24a;
  --ok:#6f8f4f; --warn:#c07a2c; --bad:#a8352b;
  --mono:"Consolas","DejaVu Sans Mono","Courier New",monospace;
  --serif:"Songti SC","STSong","SimSun","Source Han Serif SC","Noto Serif CJK SC",serif;
  --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column}
#hud .panel,#hud header,#hud footer,#hud #compareBar,#hud #jointView{pointer-events:auto}
button,select,input,label{font-family:inherit;font-size:12px;color:inherit}

/* ---------- top bar ---------- */
#topbar{display:flex;align-items:stretch;height:46px;background:linear-gradient(180deg,#1e1a15,#17140f);
  border-bottom:1px solid var(--line);flex:0 0 auto}
.brand{display:flex;flex-direction:column;justify-content:center;padding:0 16px;border-right:1px solid var(--line);min-width:250px}
.brand .zh{font-family:var(--serif);font-size:17px;letter-spacing:5px;color:var(--ink)}
.brand .en{font-family:var(--mono);font-size:9px;letter-spacing:1.2px;color:var(--ink3);margin-top:2px}
#dynTabs{display:flex;align-items:stretch;flex:1 1 auto}
#dynTabs button{background:transparent;border:0;border-right:1px solid var(--line);padding:0 18px;cursor:pointer;
  display:flex;flex-direction:column;justify-content:center;gap:2px;color:var(--ink2);transition:background .12s,color .12s}
#dynTabs button b{font-family:var(--serif);font-size:16px;letter-spacing:2px;font-weight:400}
#dynTabs button i{font-style:normal;font-family:var(--mono);font-size:9px;color:var(--ink3);letter-spacing:.5px}
#dynTabs button:hover{background:#241f19;color:var(--ink)}
#dynTabs button.on{background:#2b241b;color:var(--ink);box-shadow:inset 0 -2px 0 var(--zhe)}
#dynTabs button.on i{color:var(--zhe)}
.topRight{display:flex;align-items:center;gap:6px;padding:0 12px;border-left:1px solid var(--line)}
.btn{background:#26211a;border:1px solid var(--line2);color:var(--ink2);padding:6px 11px;cursor:pointer;letter-spacing:1px}
.btn:hover{background:#332b21;color:var(--ink);border-color:#6a5e4c}
.btn.on{background:var(--zhe);border-color:var(--zhe);color:#1a150f}
.btn.ghost{background:transparent}

/* ---------- side panels ---------- */
#mid{flex:1 1 auto;display:flex;justify-content:space-between;min-height:0;position:relative}
.panel{width:286px;background:rgba(21,19,15,.93);border:1px solid var(--line);border-top:0;border-bottom:0;
  overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
#panelL{border-left:0}#panelR{border-right:0}
.panel::-webkit-scrollbar{width:8px}
.panel::-webkit-scrollbar-thumb{background:#3d372d}
.panel::-webkit-scrollbar-track{background:#191611}
.panel section{border-bottom:1px solid var(--line);padding:11px 13px 13px}
.panel h2{font-family:var(--serif);font-size:12.5px;font-weight:400;letter-spacing:3px;color:var(--zhe);
  margin-bottom:9px;display:flex;align-items:center;gap:7px}
.panel h2::after{content:"";flex:1;height:1px;background:var(--line)}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:2.5px 0;gap:8px}
.kv span:first-child{color:var(--ink3);flex:0 0 auto}
.kv span:last-child{font-family:var(--mono);color:var(--ink);text-align:right}
.kv.hl span:last-child{color:var(--jin)}
.bar{height:5px;background:#2a251e;position:relative;margin:3px 0 7px;border:1px solid #322c24}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--zhe);display:block}
.bar.q i{background:var(--qing)}
.rlab{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3)}
.rlab b{font-family:var(--mono);font-weight:400;color:var(--ink)}
.note{font-size:12px;line-height:1.75;color:var(--ink2)}
.note em{font-style:normal;color:var(--jin)}
.src{font-size:11px;color:var(--ink3);line-height:1.6;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}

/* ---------- rows / controls ---------- */
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row>label{flex:0 0 42px;color:var(--ink3);font-size:11.5px}
.row>output,.row>.val{flex:0 0 46px;text-align:right;font-family:var(--mono);color:var(--jin);font-size:11.5px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1 1 auto;height:16px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:#332d25;border:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:15px;background:var(--zhe);margin-top:-6px;border:0}
input[type=range]::-moz-range-track{height:3px;background:#332d25}
input[type=range]::-moz-range-thumb{width:11px;height:15px;background:var(--zhe);border:0;border-radius:0}
select{background:#26211a;border:1px solid var(--line2);padding:4px 6px;flex:1 1 auto}
.chks{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;margin-top:2px}
.chk{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink2);padding:2px 0}
.chk:hover{color:var(--ink)}
.chk input{appearance:none;-webkit-appearance:none;width:12px;height:12px;border:1px solid var(--line2);background:#1d1a15;position:relative;cursor:pointer;flex:0 0 auto}
.chk input:checked{background:var(--zhe);border-color:var(--zhe)}
.chk input:checked::after{content:"";position:absolute;left:3px;top:1px;width:4px;height:7px;border:solid #1a150f;border-width:0 2px 2px 0;transform:rotate(40deg)}
.btnRow{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.btnRow .btn{flex:1 1 auto;padding:5px 6px;text-align:center;font-size:11px;letter-spacing:0}

/* ---------- layer list ---------- */
#layerList{list-style:none;margin-top:9px;border-top:1px solid var(--line)}
#layerList li{display:flex;align-items:center;gap:7px;padding:5px 2px;border-bottom:1px solid #262119;cursor:default}
#layerList li:hover{background:#221e18}
#layerList li.hidden .lname{color:var(--ink3);text-decoration:line-through}
#layerList li.iso{background:#2c2418}
.lidx{font-family:var(--mono);font-size:9.5px;color:var(--ink3);flex:0 0 16px}
.lname{flex:1 1 auto;font-size:12px;color:var(--ink)}
.lcnt{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.lbtn{background:transparent;border:1px solid transparent;color:var(--ink3);cursor:pointer;padding:1px 4px;font-size:10px}
.lbtn:hover{border-color:var(--line2);color:var(--ink)}
.lbtn.on{color:var(--zhe);border-color:var(--zhe)}
.lswatch{width:8px;height:8px;flex:0 0 8px;border:1px solid #00000055}

/* ---------- part info ---------- */
#partInfo.empty{color:var(--ink3);font-size:11.5px;line-height:1.7;padding:4px 0}
.piTitle{font-family:var(--serif);font-size:15px;color:var(--ink);letter-spacing:1px}
.piTerm{font-family:var(--mono);font-size:10px;color:var(--zhe);letter-spacing:.5px;margin:3px 0 8px}
.piTag{display:inline-block;border:1px solid var(--line2);color:var(--ink2);font-size:10px;padding:1px 5px;margin:0 4px 4px 0}
.piDesc{font-size:12px;line-height:1.75;color:var(--ink2);margin:6px 0}

/* ---------- joints ---------- */
#jointList{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:9px}
#jointList li{border:1px solid var(--line);background:#1e1b16;padding:5px 6px;cursor:pointer;font-size:11.5px;color:var(--ink2);text-align:center;letter-spacing:1px}
#jointList li:hover{border-color:var(--line2);color:var(--ink)}
#jointList li.on{border-color:var(--zhe);color:var(--jin);background:#2a2318}
#jointView{border:1px solid var(--line);background:#0f0d0a}
#jc{display:block;width:100%;height:170px}
#jointCap{padding:7px 8px;border-top:1px solid var(--line);font-size:11.5px;line-height:1.65;color:var(--ink2)}
#jointCap b{color:var(--jin);font-weight:400;font-family:var(--serif);letter-spacing:1px}
#jointView .row{margin:6px 8px 8px}

/* ---------- status ---------- */
#statusbar{flex:0 0 auto;height:26px;display:flex;align-items:center;justify-content:space-between;
  padding:0 13px;background:#17140f;border-top:1px solid var(--line);font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
#stats span{color:var(--ink2)}
#stats b{color:var(--jin);font-weight:400}

/* ---------- labels ---------- */
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#leaders{position:absolute;inset:0;pointer-events:none;overflow:visible}
.lbl{position:absolute;transform:translate(0,-50%);background:rgba(18,16,12,.86);border:1px solid var(--line2);
  border-left:2px solid var(--zhe);padding:2px 6px;font-size:11px;color:var(--ink);white-space:nowrap;letter-spacing:.5px}
.lbl i{font-style:normal;font-family:var(--mono);font-size:9px;color:var(--ink3);margin-left:5px}

/* ---------- compare ---------- */
#compareBar{position:absolute;left:0;right:0;bottom:0;background:rgba(19,17,13,.95);border-top:1px solid var(--line);
  padding:9px 14px 11px;display:flex;gap:14px;align-items:stretch}
#compareBar.hidden,.hidden{display:none!important}
.cmpTable{flex:0 0 auto;border-collapse:collapse;font-size:11px}
.cmpTable th,.cmpTable td{border:1px solid var(--line);padding:3px 8px;text-align:right;font-family:var(--mono)}
.cmpTable th{color:var(--ink3);font-weight:400;background:#1d1a15}
.cmpTable th.rh{text-align:left;font-family:var(--sans)}
.cmpTable td.dy{font-family:var(--serif);font-size:13px;color:var(--jin);text-align:center;letter-spacing:1px}
.cmpChart{flex:1 1 auto;display:flex;gap:10px;min-width:0}
.chartBox{flex:1 1 0;min-width:0;border:1px solid var(--line);background:#191611;padding:5px 7px 3px}
.chartBox h3{font-size:10.5px;font-weight:400;color:var(--ink3);letter-spacing:1px;margin-bottom:4px}
.chartBox svg{display:block;width:100%;height:52px}

/* ---------- overlays ---------- */
#loading{position:fixed;inset:0;background:#12100d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:50}
#loading .t{font-family:var(--serif);font-size:22px;letter-spacing:9px;color:var(--ink)}
#loading .s{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:1px}
#loading .pb{width:260px;height:2px;background:#2a251e}
#loading .pb i{display:block;height:100%;width:0;background:var(--zhe);transition:width .2s}
#help{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:520px;max-height:76%;overflow:auto;
  background:rgba(20,18,14,.97);border:1px solid var(--line2);padding:20px 24px;pointer-events:auto;z-index:30}
#help h3{font-family:var(--serif);font-size:16px;font-weight:400;letter-spacing:3px;color:var(--zhe);margin-bottom:12px}
#help dl{display:grid;grid-template-columns:120px 1fr;gap:5px 12px;font-size:12px;line-height:1.7}
#help dt{color:var(--ink3);font-family:var(--mono);font-size:11px}
#help dd{color:var(--ink2)}
#help .close{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--ink3);font-size:18px;cursor:pointer}
#err{position:fixed;left:0;right:0;bottom:0;background:#3a1512;border-top:1px solid #a8352b;color:#f0d8d4;
  font-family:var(--mono);font-size:11px;padding:8px 14px;z-index:60;max-height:40%;overflow:auto;white-space:pre-wrap}
.tRow{display:flex;align-items:center;gap:7px;font-size:11.5px;padding:2px 0}
.tRow .dot{width:6px;height:6px;flex:0 0 6px;background:var(--ok)}
.tRow.f .dot{background:var(--bad)}
.tRow .tn{flex:1 1 auto;color:var(--ink2)}
.tRow .tv{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
@media (max-width:1280px){.panel{width:246px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <header id="topbar">
    <div class="brand"><span class="zh">四角攒尖亭</span><span class="en">SQUARE PAVILION · 营造法则与朝代形制演变</span></div>
    <nav id="dynTabs"></nav>
    <div class="topRight">
      <button id="btnCompare" class="btn">朝代并置</button>
      <button id="btnHelp" class="btn ghost">操作说明</button>
    </div>
  </header>

  <div id="mid">
    <aside id="panelL" class="panel">
      <section><h2>营造模数</h2><div id="modBox"></div></section>
      <section><h2>形制比值</h2><div id="ratioBox"></div></section>
      <section><h2>形制要略</h2><div id="noteBox" class="note"></div></section>
      <section><h2>结构自检</h2><div id="testBox"></div></section>
    </aside>

    <aside id="panelR" class="panel">
      <section>
        <h2>层级解构</h2>
        <div class="row"><label>拆解</label><input id="explode" type="range" min="0" max="100" value="0"><output id="explodeV" class="val">0%</output></div>
        <div class="row"><label>剖切</label><select id="clipMode">
          <option value="none">不剖切</option><option value="x">正面半剖</option><option value="d">对角剖切</option></select></div>
        <div class="row"><label>剖面</label><input id="clipPos" type="range" min="0" max="100" value="50"><output id="clipV" class="val">0.0m</output></div>
        <div class="btnRow">
          <button class="btn" id="btnSeq">装配演示</button>
          <button class="btn" id="btnAllShow">全部显示</button>
        </div>
        <ul id="layerList"></ul>
      </section>
      <section><h2>构件信息</h2><div id="partInfo" class="empty">在视图中点选任一构件，此处显示其名称、术语、所属层级、营造尺寸与结构作用。</div></section>
      <section>
        <h2>榫卯节点</h2>
        <ul id="jointList"></ul>
        <div id="jointView">
          <canvas id="jc"></canvas>
          <div class="row"><label>拔榫</label><input id="jointSep" type="range" min="0" max="100" value="30"><output id="jointSepV" class="val">30%</output></div>
          <div id="jointCap"></div>
        </div>
      </section>
      <section>
        <h2>视图选项</h2>
        <div class="chks" id="viewChks"></div>
        <div class="btnRow">
          <button class="btn" data-view="reset">复位</button>
          <button class="btn" data-view="front">正立面</button>
          <button class="btn" data-view="iso">45°鸟瞰</button>
          <button class="btn" data-view="up">仰视梁架</button>
        </div>
      </section>
    </aside>
  </div>

  <svg id="leaders"></svg>
  <div id="labels"></div>
  <div id="compareBar" class="hidden"></div>

  <footer id="statusbar">
    <span id="stats"></span>
    <span id="hint">左键拖拽旋转 · 滚轮缩放 · 右键拖拽平移 · 单击构件查看 · 双击空白处复位</span>
  </footer>
</div>

<div id="loading">
  <div class="t">四角攒尖亭</div>
  <div class="pb"><i id="pbi"></i></div>
  <div class="s" id="lmsg">正在载入三维内核…</div>
</div>

<script>
/* =====================================================================================
   四角攒尖亭 · 木构营造与朝代形制演变
   -------------------------------------------------------------------------------------
   单页可执行 3D 项目。全部几何由代码程序化生成，零外部三维模型资产。
   营造依据：唐宋以《营造法式》材分制（材广 15 分、材厚 10 分、足材 21 分）为准；
             明清以《工程做法则例》斗口制为准。四角亭四柱皆为角柱，故柱头科与转角科
             合一（只有转角科 + 平身科／补间铺作），此为四角亭区别于多柱殿宇之处。
   ===================================================================================== */
'use strict';

/* ------------------------------------------------------------------ 全局错误显示 */
function fatal(msg){
  var d=document.getElementById('err');
  if(!d){d=document.createElement('div');d.id='err';document.body.appendChild(d);}
  d.textContent='运行错误：\n'+msg;
}
window.addEventListener('error',function(e){fatal((e.message||'unknown')+'\n'+(e.filename||'')+':'+(e.lineno||''));});

/* ------------------------------------------------------------------ CDN 载入（含备源） */
var CDNS=[
  'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
  'https://unpkg.com/three@0.128.0/build/three.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.128.0/three.min.js'
];
function loadThree(i){
  if(window.THREE){boot();return;}
  if(i>=CDNS.length){
    document.getElementById('lmsg').textContent='三维内核载入失败：请检查网络后刷新（依赖 three.js r128 公共 CDN）。';
    return;
  }
  document.getElementById('lmsg').textContent='正在载入三维内核… ('+(i+1)+'/'+CDNS.length+')';
  var s=document.createElement('script');
  s.src=CDNS[i];
  s.onload=function(){window.THREE?boot():loadThree(i+1);};
  s.onerror=function(){loadThree(i+1);};
  document.head.appendChild(s);
}

/* ==================================================================================
   一、营造参数表（朝代形制数据）
   ----------------------------------------------------------------------------------
   各代同取面阔＝进深＝4.20m（柱中距），以便比例对照。
   fen  : 一分°的实际尺寸(m)。材广=15分，材厚=10分（＝斗口），足材=21分。
   演化趋势（皆与史实一致）：
     斗栱高/柱高  0.46 → 0.18   斗栱由雄大转纤小
     平身科攒数    1  →  4      铺作由疏朗转密集
     檐出/柱高    0.66 → 0.34   出檐由深远转收浅
     举高/半进深  0.42 → 0.68   屋面由平缓转陡峻
     柱高/柱径    8.6  → 11.0   柱身由粗壮转修长
   ================================================================================== */
var BAY=4.20;

var DYNASTIES=[
{
  id:'tang', name:'唐', full:'唐（盛唐—晚唐）', era:'8—9 C.', modName:'材分制',
  fen:0.0195, colH:3.55, slender:8.6, jumps:2, bujian:1, yanchuR:0.66,
  riseR:0.42, curve:0.10, qiqiaoR:0.10, chongR:0.06, cejiao:0.013,
  pupai:0, queti:0, meizi:0, frame:'A', dougongStyle:'pizhu',
  jichu:0.42, jichuStyle:'plain', chuStyle:'fupenLotus',
  angName:'批竹昂', shoutouName:'批竹耍头', chuName:'覆盆莲花柱础',
  tileName:'青掍布瓦筒瓦', dingName:'陶质火焰宝顶', jiName:'砖石台明（低平）',
  frameName:'角梁三折 · 由戗攒尖（簇角梁前身）',
  puName:'阑额（无普拍枋）',
  col:{col:'#9c3b2c',beam:'#a8452f',gong:'#b8593c',ang:'#933226',board:'#8a6a4a',
       rafter:'#a05a3a',tile:'#5c5f5e',trim:'#4a4d4c',ridge:'#54565a',metal:'#7a6a52',
       stone:'#b8b0a0',stone2:'#9a9284',paint:'#c9bfa8'},
  note:'柱身粗壮、<em>侧脚显著</em>，柱头仅施阑额而<em>无普拍枋</em>。斗栱雄大，几近柱高之半，出跳深远，昂作<em>批竹昂</em>（斜面平直无琴面）。补间只用一朵，铺作疏朗有力。屋面举折平缓，出檐深远，翼角起翘极为含蓄，通体气象雄浑。攒尖以角梁三折递次上收，由戗聚于中心枨杆。',
  src:'形制参照：五台山佛光寺东大殿（857）、南禅寺大殿（782）一系斗栱与出檐做法。'
},
{
  id:'song', name:'宋', full:'宋（含辽金 · 营造法式）', era:'11—13 C.', modName:'材分制',
  fen:0.0165, colH:3.70, slender:9.0, jumps:2, bujian:2, yanchuR:0.58,

/* ==================================================================================
   三、通用几何工具（全部程序化，无外部资产）
   ================================================================================== */
var GEO={};

/* 三维向量简写 */
function V3(x,y,z){return new THREE.Vector3(x,y,z);}

/* 由 8 个角点构成的收分方块（斗、柱顶石、须弥座各层皆用）
   wTop/dTop 顶面尺寸，wBot/dBot 底面尺寸，h 高，原点在底面中心 */
GEO.taper=function(wTop,dTop,wBot,dBot,h){
  var a=wTop/2,b=dTop/2,c=wBot/2,d=dBot/2;
  var v=[
    -c,0,-d,  c,0,-d,  c,0,d,  -c,0,d,      // 0..3 底
    -a,h,-b,  a,h,-b,  a,h,b,  -a,h,b       // 4..7 顶
  ];
  var f=[
    0,2,1, 0,3,2,        // 底（朝下，反向）
    4,5,6, 4,6,7,        // 顶
    0,1,5, 0,5,4,        // -z
    1,2,6, 1,6,5,        // +x
    2,3,7, 2,7,6,        // +z
    3,0,4, 3,4,7         // -x
  ];
  var pos=new Float32Array(f.length*3);
  for(var i=0;i<f.length;i++){pos[i*3]=v[f[i]*3];pos[i*3+1]=v[f[i]*3+1];pos[i*3+2]=v[f[i]*3+2];}
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.computeVertexNormals();
  return g;
};

/* 平面多边形沿 Y 轴挤出成棱柱（榫卯卯口、柱头开口、栱头卷杀等核心工具）
   pts: [[x,z],...] 逆时针；holes: [[[x,z],...],...]；h: 高；原点在底面 */
GEO.prismY=function(pts,h,holes){
  /* pts / holes 均以 [x,z] 给出（世界平面坐标），内部转为 shape 的 y=-z */
  var shape=new THREE.Shape();
  shape.moveTo(pts[0][0],-pts[0][1]);
  for(var i=1;i<pts.length;i++)shape.lineTo(pts[i][0],-pts[i][1]);
  shape.closePath();
  if(holes){
    for(var k=0;k<holes.length;k++){
      var hp=holes[k],p=new THREE.Path();
      p.moveTo(hp[0][0],-hp[0][1]);
      for(var j=1;j<hp.length;j++)p.lineTo(hp[j][0],-hp[j][1]);
      p.closePath();shape.holes.push(p);
    }
  }
  var g=new THREE.ExtrudeGeometry(shape,{depth:h,bevelEnabled:false,steps:1});
  // ExtrudeGeometry 沿 +Z 挤出，转为沿 +Y，并使 shape 的 y 对应世界 -z（右手）
  g.rotateX(-Math.PI/2);
  g.computeVertexNormals();
  return g;
};

/* 平面多边形沿 Z 轴挤出（侧样轮廓：昂、耍头、栱、角梁等，profile 在 XY 平面）
   pts:[[x,y],...]；t: 厚度（沿 Z，居中） */
GEO.prismZ=function(pts,t){
  var shape=new THREE.Shape();
  shape.moveTo(pts[0][0],pts[0][1]);
  for(var i=1;i<pts.length;i++)shape.lineTo(pts[i][0],pts[i][1]);
  shape.closePath();
  var g=new THREE.ExtrudeGeometry(shape,{depth:t,bevelEnabled:false,steps:1});
  g.translate(0,0,-t/2);
  g.computeVertexNormals();
  return g;
};

/* 旋转体（柱础、宝顶、宝瓶）：pts 为 [[r,y],...] */
GEO.lathe=function(pts,seg){
  var v=[];
  for(var i=0;i<pts.length;i++)v.push(new THREE.Vector2(Math.max(pts[i][0],1e-4),pts[i][1]));
  var g=new THREE.LatheGeometry(v,seg||10);
  g.computeVertexNormals();
  return g;
};

/* 低多边形圆柱（柱身，含收分／卷杀） */
GEO.column=function(rBot,rTop,h,seg,entasis){
  if(!entasis){
    var g=new THREE.CylinderGeometry(rTop,rBot,h,seg||10,1,false);
    g.translate(0,h/2,0);return g;
  }
  // 带卷杀：上段三分之一按抛物线收分（唐宋做法），并加上下端盖
  var pts=[[0,0]],N=7;
  for(var i=0;i<=N;i++){
    var t=i/N,y=t*h,r;
    if(t<0.66){r=rBot+(rTop-rBot)*(t/0.66)*0.45;}
    else{var u=(t-0.66)/0.34;r=rBot+(rTop-rBot)*(0.45+0.55*Math.sin(u*Math.PI/2));}
    pts.push([r,y]);
  }
  pts.push([0,h]);
  return GEO.lathe(pts,seg||10);
};

/* 圆角/斜角长方体（枋、梁、椽等基本杆件）；原点在几何中心 */
GEO.box=function(w,h,d){return new THREE.BoxGeometry(w,h,d);};

/* 沿折线放样的矩形截面（垂脊、屋面凹曲的桁架线） */
GEO.sweep=function(path,w,h){
  // path: [Vector3,...]；截面 w(横) × h(竖)，横向取 path 水平方向的法线
  var pos=[],n=path.length;
  function frame(i){
    var p=path[i],q=path[Math.min(i+1,n-1)],o=path[Math.max(i-1,0)];
    var t=new THREE.Vector3().subVectors(q,o);
    if(t.lengthSq()<1e-9)t.set(0,0,1);
    t.normalize();
    var up=V3(0,1,0);
    var side=new THREE.Vector3().crossVectors(t,up);
    if(side.lengthSq()<1e-9)side.set(1,0,0);
    side.normalize().multiplyScalar(w/2);
    var vup=new THREE.Vector3().crossVectors(side,t).normalize().multiplyScalar(h/2);
    return [side,vup];
  }
  var rings=[];
  for(var i=0;i<n;i++){
    var f=frame(i),s=f[0],u=f[1],p=path[i];
    rings.push([
      new THREE.Vector3().copy(p).sub(s).sub(u),
      new THREE.Vector3().copy(p).add(s).sub(u),
      new THREE.Vector3().copy(p).add(s).add(u),
      new THREE.Vector3().copy(p).sub(s).add(u)
    ]);
  }
  function quad(a,b,c,d){
    pos.push(a.x,a.y,a.z,b.x,b.y,b.z,c.x,c.y,c.z);
    pos.push(a.x,a.y,a.z,c.x,c.y,c.z,d.x,d.y,d.z);
  }
  for(var i=0;i<n-1;i++){
    var A=rings[i],B=rings[i+1];
    for(var k=0;k<4;k++){
      var k2=(k+1)%4;
      quad(A[k],B[k],B[k2],A[k2]);
    }
  }
  quad(rings[0][3],rings[0][2],rings[0][1],rings[0][0]);
  quad(rings[n-1][0],rings[n-1][1],rings[n-1][2],rings[n-1][3]);
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.computeVertexNormals();
  return g;
};

/* 三角/四边形面片（望板、屋面板） */
GEO.quadFace=function(a,b,c,d){
  var pos=[a.x,a.y,a.z,b.x,b.y,b.z,c.x,c.y,c.z, a.x,a.y,a.z,c.x,c.y,c.z,d.x,d.y,d.z];
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.computeVertexNormals();
  return g;
};

/* 几何合并（按材质分组后调用），entries:[{g,m}] m 为 Matrix4 */
GEO.merge=function(entries){
  var parts=[],total=0,i;
  for(i=0;i<entries.length;i++){
    var e=entries[i];
    var g=e.g.index?e.g.toNonIndexed():e.g.clone();
    if(e.m)g.applyMatrix4(e.m);
    if(!g.attributes.normal)g.computeVertexNormals();
    parts.push(g);total+=g.attributes.position.count;
  }
  var pos=new Float32Array(total*3),nor=new Float32Array(total*3),o=0;
  for(i=0;i<parts.length;i++){
    var p=parts[i];
    pos.set(p.attributes.position.array,o*3);
    nor.set(p.attributes.normal.array,o*3);
    o+=p.attributes.position.count;
    p.dispose();
  }
  var out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  out.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  out.computeBoundingSphere();
  return out;
};

/* 矩阵简写 */
function MAT4(){return new THREE.Matrix4();}
function mPos(x,y,z){return MAT4().makeTranslation(x,y,z);}
function mRotY(a){return MAT4().makeRotationY(a);}
function compose(px,py,pz,rx,ry,rz,sx,sy,sz){
  var m=MAT4();
  m.compose(V3(px,py,pz),new THREE.Quaternion().setFromEuler(new THREE.Euler(rx||0,ry||0,rz||0)),
            V3(sx===undefined?1:sx,sy===undefined?1:sy,sz===undefined?1:sz));
  return m;
}
function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function fmt(v,n){return (Math.round(v*Math.pow(10,n||2))/Math.pow(10,n||2)).toFixed(n||2);}

   四、材质体系（每代一套，低多边形 flat shading；全部程序化，无贴图）

var CLIP=null;                                  // 剖切面：initScene 中初始化（THREE 就绪后）

function makeMaterials(dyn){
  var c=dyn.col,out={};
  function M(hex,rough,metal,flat){
    return new THREE.MeshStandardMaterial({
      color:new THREE.Color(hex),roughness:rough,metalness:(metal!==undefined?metal:0),
      flatShading:flat===undefined?true:flat,side:THREE.DoubleSide,
      clippingPlanes:[CLIP],clipShadows:true
    });
  }
  out.stone  = M(c.stone ,0.92,0.00);
  out.stone2 = M(c.stone2,0.94,0.00);
  out.col    = M(c.col   ,0.78,0.00);
  out.beam   = M(c.beam  ,0.80,0.00);
  out.gong   = M(c.gong  ,0.76,0.00);
  out.ang    = M(c.ang   ,0.74,0.00);
  out.board  = M(c.board ,0.88,0.00);
  out.rafter = M(c.rafter,0.82,0.00);
  out.tile   = M(c.tile  ,dyn.id==='ming'||dyn.id==='qing'?0.34:0.86, dyn.id==='qing'?0.12:0.0);
  out.trim   = M(c.trim  ,dyn.id==='ming'||dyn.id==='qing'?0.32:0.86, 0.0);
  out.ridge  = M(c.ridge ,0.52,0.05);
  out.metal  = M(c.metal ,0.36,0.62);
  out.paint  = M(c.paint ,0.70,0.00);
  return out;
}

/* 高亮材质（拾取用，全局共用；initScene 中创建） */
var HL_SEL=null,HL_HOV=null;

/* ==================================================================================
   五、装配框架：Assembly / Part
   ----------------------------------------------------------------------------------
   每个"构件单元"(Part) 由若干几何 entry 按材质合并为 1~4 个 Mesh，包裹在一个 Group 中，
   携带 userData.part 元数据用于拾取、标注与信息展示。Part 归属于某一层级 (LAYERS)。
   ================================================================================== */
function Assembly(dyn,lod){
  this.dyn=dyn; this.lod=lod||'full';
  this.mats=makeMaterials(dyn);
  this.root=new THREE.Group(); this.root.name='pavilion-'+dyn.id;
  this.layers={}; this.layerList=[]; this.parts=[]; this.tris=0;
  for(var i=0;i<LAYERS.length;i++){
    var L=LAYERS[i],g=new THREE.Group();
    g.name='layer-'+L.id;
    var rec={def:L,group:g,parts:[],visible:true,idx:i};
    this.layers[L.id]=rec; this.layerList.push(rec);
    this.root.add(g);
  }
}
/* info: {name, term, cat, desc, tag[], size} */
Assembly.prototype.part=function(layerId,info,entries){
  if(!entries||!entries.length)return null;
  var rec=this.layers[layerId];
  var byMat={},i;
  for(i=0;i<entries.length;i++){
    var e=entries[i],k=e.mat||'beam';
    (byMat[k]=byMat[k]||[]).push(e);
  }
  var grp=new THREE.Group();
  grp.name=info.name;
  var box=new THREE.Box3();
  for(var k in byMat){
    var geo=GEO.merge(byMat[k]);
    var mesh=new THREE.Mesh(geo,this.mats[k]||this.mats.beam);
    mesh.castShadow=true; mesh.receiveShadow=true;
    mesh.userData.mat0=mesh.material;
    grp.add(mesh);
    this.tris+=geo.attributes.position.count/3;
    geo.computeBoundingBox();
    box.union(geo.boundingBox);
  }
  var ctr=box.getCenter(new THREE.Vector3());
  var part={
    id:layerId+':'+info.name+':'+this.parts.length,
    name:info.name, term:info.term||'', cat:info.cat||'', desc:info.desc||'',
    tag:info.tag||[], size:info.size||'', layer:layerId, group:grp,
    center:ctr, top:box.max.y, bottom:box.min.y, label:info.label||false
  };
  grp.userData.part=part;
  rec.group.add(grp); rec.parts.push(part); this.parts.push(part);
  return part;
};
Assembly.prototype.dispose=function(){
  this.root.traverse(function(o){ if(o.isMesh&&o.geometry)o.geometry.dispose(); });
  for(var k in this.mats)this.mats[k].dispose();
};

/* ==================================================================================
   六、斗栱铺作生成器
   ----------------------------------------------------------------------------------
   本地坐标：+X 为出跳方向（向外挑出），Z 为面阔方向，Y 向上，原点在坐斗底面中心。
   一切尺寸以"分°"为单位（f = dyn.fen 米/分）：材广 15 分、材厚 10 分、足材 21 分。
   斗栱总高 = 坐斗 20 分 + 足材 21 分 ×(出跳数+1)。
   ================================================================================== */

/* 斗（栌斗/坐斗/交互斗/散斗/齐心斗）：
   open>0 时耳部留十字开口（open＝斗口＝材厚），底段为整块收分；open=0 为齐心斗（整块） */
function makeDou(s,h,open,mat){
  var e=[],hb=h*0.44,hu=h-hb;
  e.push({g:GEO.taper(s*0.90,s*0.90,s*0.58,s*0.58,hb),mat:mat,m:mPos(0,0,0)});
  if(open<=0){e.push({g:GEO.taper(s*0.90,s*0.90,s*0.86,s*0.86,hu),mat:mat,m:mPos(0,hb,0)});}
  else{
    var bw=(s-open)/2,off=(s+open)/4;
    var sx=[1,1,-1,-1],sz=[1,-1,1,-1];
    for(var i=0;i<4;i++){
      e.push({g:GEO.box(bw,hu,bw),mat:mat,m:mPos(sx[i]*off,hb+hu/2,sz[i]*off)});
    }
  }
  return e;
}

/* 栱（华栱/翘/泥道栱/瓜子栱/慢栱/令栱/厢栱）：两端卷杀四瓣 */
function gongProfile(L,H,cutX,cutY,steps){
  var p=[],i,t,n=steps||4;
  p.push([-L/2+cutX,0]);
  p.push([ L/2-cutX,0]);
  for(i=1;i<=n;i++){t=i/n;p.push([L/2-cutX+cutX*Math.sin(t*Math.PI/2), cutY*(1-Math.cos(t*Math.PI/2))]);}
  p.push([ L/2,H]);
  p.push([-L/2,H]);
  p.push([-L/2,cutY]);
  for(i=n-1;i>=1;i--){t=i/n;p.push([-L/2+cutX-cutX*Math.sin(t*Math.PI/2), cutY*(1-Math.cos(t*Math.PI/2))]);}
  return p;
}
/* alongZ=true 表示栱长沿 Z（面阔方向） */
function makeGong(L,H,T,alongZ,mat,f){
  var g=GEO.prismZ(gongProfile(L,H,f*9,f*7,4),T);
  if(alongZ)g.rotateY(Math.PI/2);
  return [{g:g,mat:mat}];
}

/* 昂（下昂）：昂嘴形制随朝代变化——批竹昂／琴面昂／明清昂嘴 */
function angProfile(L,H,style,f){
  var p=[],xo=L/2,xi=-L/2;
  if(style==='pizhu'){                       // 唐 · 批竹昂：斜面平直，一刀切下
    p=[[xi+f*9,0],[xo-f*26,0],[xo,H*0.30],[xo,H],[xi,H],[xi,f*7]];
  }else if(style==='qinmian'){               // 宋元 · 琴面昂：昂面微凸作两折
    p=[[xi+f*9,0],[xo-f*30,0],[xo-f*14,H*0.16],[xo-f*4,H*0.42],[xo,H*0.62],[xo,H],[xi,H],[xi,f*7]];
  }else if(style==='ming'){                  // 明 · 昂嘴（琵琶头）
    p=[[xi+f*8,0],[xo-f*20,0],[xo-f*9,H*0.20],[xo-f*2,H*0.30],[xo-f*7,H*0.46],[xo,H*0.58],[xo,H],[xi,H],[xi,f*6]];
  }else{                                     // 清 · 昂嘴 + 菊花头凹面
    p=[[xi+f*8,0],[xo-f*22,0],[xo-f*12,H*0.18],[xo-f*4,H*0.26],[xo-f*8,H*0.40],[xo-f*2,H*0.50],
       [xo,H*0.66],[xo,H],[xi,H],[xi,f*6]];
  }
  return p;
}
function makeAng(L,H,T,style,mat,f){
  return [{g:GEO.prismZ(angProfile(L,H,style,f),T),mat:mat}];
}

/* 耍头（蚂蚱头／批竹耍头） */
function makeShoutou(L,H,T,style,mat,f){
  var xo=L/2,xi=-L/2,p;
  if(style==='pizhu'){
    p=[[xi,0],[xo-f*12,0],[xo,H*0.42],[xo,H],[xi,H]];
  }else{                                      // 蚂蚱头：上下两卷
    p=[[xi,0],[xo-f*14,0],[xo-f*5,H*0.18],[xo-f*11,H*0.34],[xo-f*2,H*0.46],
       [xo-f*9,H*0.62],[xo,H*0.78],[xo,H],[xi,H]];
  }
  return [{g:GEO.prismZ(p,T),mat:mat}];
}

/* 宝瓶（清式角科由昂之上承仔角梁） */
function makeBaoping(r,h,mat){
  var pts=[[0,0],[r*0.85,0],[r*0.72,h*0.10],[r*1.0,h*0.30],[r*0.78,h*0.55],
           [r*0.42,h*0.72],[r*0.55,h*0.84],[r*0.30,h*0.94],[r*0.16,h],[0,h]];
  return [{g:GEO.lathe(pts,8),mat:mat}];
}

/* -------------------------------------------------------------------
   一朵斗栱：kind = 'ping'(平身科/补间铺作) | 'jiao'(转角科/转角铺作)
   返回 {entries, height, jump} ；jump 为总出跳水平距离
   ------------------------------------------------------------------- */
function buildDougong(dyn,kind){
  var f=dyn.fen, cai=15*f, zu=21*f, hou=10*f, tiao=30*f, dh=6*f;
  var jumps=dyn.jumps, e=[];
  var jixin=dyn.bujian>=2;                           // 补间两朵以上者作计心造
  var style=dyn.dougongStyle;
  var tot=(21*jumps+31)*f;                           // 总高：坐斗20 + 末层斗31 + 21×跳
  var outT=jumps*tiao;

  /* --- 坐斗（栌斗）：栱底沉入斗口 10 分 --- */
  var s0=32*f;
  push(makeDou(s0,20*f,hou,'gong'),0,0,0);

  /* --- 逐跳：栱／昂（底沉入下斗斗口）+ 正心横栱 + 跳头斗 --- */
  for(var k=0;k<jumps;k++){
    var yB=(10+21*k)*f;                              // 栱底：坐斗顶 -10 分，逐跳升 21 分
    var outX=(k+1)*tiao;
    var isAng=(k===jumps-1);
    var L=72*f,cx=outX-L/2+9*f;
    if(isAng){                                       // 末跳：昂（下昂）
      push(makeAng(L+14*f,cai,hou,style,'ang',f),cx+7*f,yB,0);
    }else{
      push(makeGong(L,cai,hou,false,'gong',f),cx,yB,0);
    }
    /* 正心横栱：首层泥道栱，次层慢栱 */
    push(makeGong(k===0?62*f:92*f,cai,hou,true,'gong',f),0,yB,0);
    /* 交互斗（跳头）／散斗（正心）：坐在栱顶 */
    push(makeDou(18*f,dh,hou,'gong'),outX,yB+cai,0);
    push(makeDou(16*f,dh,hou,'gong'),0,yB+cai,0);
    /* 计心造：瓜子栱压在跳头交互斗上，其头再承散斗 */
    if(jixin&&k<jumps-1){
      push(makeGong(62*f,cai,hou,true,'gong',f),outX,yB+cai+dh,0);
      push(makeDou(16*f,dh,hou,'gong'),outX,yB+2*cai+dh, tiao*0.62);
      push(makeDou(16*f,dh,hou,'gong'),outX,yB+2*cai+dh,-tiao*0.62);
    }
  }

  /* --- 末层：耍头（与末跳昂同层）→ 令栱（压于交互斗上）→ 齐心斗（承桁） --- */
  var yBLast=(10+21*(jumps-1))*f;
  push(makeShoutou(outT*1.7,cai,hou,dyn.shoutouName.indexOf('批竹')>=0?'pizhu':'mazha','beam',f),
       outT*0.52,yBLast,0);                          // 耍头贯通里外
  var yLing=(21*jumps+10)*f;                         // 令栱底
  push(makeGong(72*f,cai,hou,true,'gong',f),outT,yLing,0);      // 令栱
  push(makeDou(18*f,dh,hou*0.85,'gong'),outT,yLing+cai,0);      // 齐心斗（开槽纳桁）

  /* --- 转角科：另加正身（Z 向）一套 + 斜出（45°）一套 --- */
  if(kind==='jiao'){
    var e2=[],i;
    for(i=0;i<e.length;i++){
      var it=e[i];
      if(it.skipMirror)continue;
      e2.push({g:it.g,mat:it.mat,m:MAT4().multiplyMatrices(mRotY(-Math.PI/2),it.m||MAT4())});
    }
    var d=Math.SQRT2,e3=[];
    for(var k2=0;k2<jumps;k2++){
      var yy=(10+21*k2)*f,ox=(k2+1)*tiao*d;
      var LL=72*f*d;
      if(k2===jumps-1){
        e3.push.apply(e3,shift(makeAng(LL+18*f,cai,hou,style,'ang',f),ox-LL/2+16*f,yy,0));
      }else{
        e3.push.apply(e3,shift(makeGong(LL,cai,hou,false,'gong',f),ox-LL/2+9*f,yy,0));
      }
      e3.push.apply(e3,shift(makeDou(18*f,dh,hou,'gong'),ox,yy+cai,0));
    }
    /* 由昂（角科最上，斜向挑出最远，上承宝瓶／角梁） */
    var youL=outT*d*1.02+26*f;
    e3.push.apply(e3,shift(makeAng(youL,cai,hou,style,'ang',f),outT*d*0.62-youL/2,yBLast,0));
    var rot45=mRotY(-Math.PI/4);
    for(i=0;i<e3.length;i++){
      e3[i].m=MAT4().multiplyMatrices(rot45,e3[i].m||MAT4());
    }
    e=e.concat(e2,e3);
    /* 宝瓶（明清角科专有）：立于由昂端，上承仔角梁 */
    if(dyn.id==='qing'||dyn.id==='ming'){
      var bp=shift(makeBaoping(9*f,26*f,'stone2'),outT*d*0.62+youL*0.30,yBLast+cai,0);
      for(i=0;i<bp.length;i++)bp[i].m=MAT4().multiplyMatrices(rot45,bp[i].m||MAT4());
      e=e.concat(bp);
    }
  }

  return {entries:e,height:tot,jump:outT,fen:f};

  function shift(arr,x,y,z){
    var o=[];
    for(var i=0;i<arr.length;i++){
      var m=MAT4().multiplyMatrices(mPos(x,y,z),arr[i].m||MAT4());
      o.push({g:arr[i].g,mat:arr[i].mat,m:m});
    }
    return o;
  }
  function push(arr,x,y,z){e.push.apply(e,shift(arr,x,y,z));}
}

/* ==================================================================================
   七、举架表与营造尺度推导
   ----------------------------------------------------------------------------------
   JU：自檐步至脊步逐架的"举"（举高／步架水平长）。唐宋平缓、明清陡峻，且级差逐代加大，
   即《营造法式》"举折"向清式"举架"演进的量化表达。
   ================================================================================== */
var JU={
  tang:[0.35,0.40,0.45,0.48],
  song:[0.38,0.44,0.50,0.56],
  yuan:[0.42,0.49,0.55,0.62],
  ming:[0.48,0.57,0.65,0.70],
  qing:[0.52,0.65,0.76,0.79]
};

function derive(dyn){
  var f=dyn.fen,P={};
  P.dyn=dyn; P.f=f;
  P.cai=15*f; P.hou=10*f; P.zu=21*f; P.tiao=30*f;    // 材广／材厚(斗口)／足材／每跳
  P.bay=BAY; P.half=BAY/2;
  P.colH=dyn.colH;
  P.colD=dyn.colH/dyn.slender;  P.colR=P.colD/2;
  P.colRTop=P.colR*0.86;                              // 柱头收分
  P.cejiao=dyn.cejiao;
  P.jichuH=dyn.jichu;
  P.chuH=(dyn.chuStyle==='suping')?P.colR*0.55:P.colR*1.05;
  P.taiHalf=P.half+dyn.colH*dyn.yanchuR*0.55;
  P.y0=P.jichuH;                                      // 台明上皮
  P.colBase=P.y0+P.chuH;                              // 柱脚
  P.colTop=P.colBase+P.colH;                          // 柱头上皮
  P.efH=(dyn.pupai&&f<0.012)?40*f:30*f;               // 额枋(阑额)高
  P.efT=P.efH*0.66;                                   // 额枋厚
  P.pupaiH=dyn.pupai?(dyn.id==='song'?10*f:(dyn.id==='yuan'?14*f:20*f)):0;
  P.pupaiW=dyn.pupai?(dyn.id==='song'?26*f:(dyn.id==='yuan'?30*f:34*f)):0;
  P.dgBase=P.colTop+P.pupaiH;                         // 斗栱坐斗底皮
  P.dgH=(31+21*dyn.jumps)*f;                          // 斗栱总高（坐斗20分＋21分×跳＋末层31分）
  P.dgJump=dyn.jumps*P.tiao;                          // 总出跳
  P.hengR=15*f;                                       // 桁(檩)半径
  P.yZheng=P.dgBase+P.dgH+P.hengR;                    // 正心桁中心
  P.yZhengTop=P.yZheng+P.hengR;
  P.yanchu=P.colH*dyn.yanchuR;                        // 檐出（自柱中至檐口）
  P.R=P.half+P.yanchu;                                // 檐口水平半距
  P.ju=JU[dyn.id];
  P.yEave=P.yZhengTop-P.yanchu*P.ju[0];               // 檐口（椽上皮）高
  P.rise=P.yanchu*P.ju[0]+(P.half/3)*(P.ju[1]+P.ju[2]+P.ju[3]);
  P.yApex=P.yEave+P.rise;                             // 攒尖顶（雷公柱上端）
  P.chuanD=15*f;                                      // 椽径
  P.chuanGap=P.chuanD*2;                              // 椽中距（椽档＝一椽径）
  P.yTiao=P.yZhengTop-P.dgJump*P.ju[0]-P.chuanD*0.2;  // 挑檐桁中心（贴檐椽下皮，上承檐椽）
  P.qiqiao=P.yanchu*dyn.qiqiaoR;                      // 翼角起翘
  P.chong=P.yanchu*dyn.chongR;                        // 翼角冲出
  P.waPitch=25*f;                                     // 瓦垄中距
  P.baodingH=P.colD*(dyn.id==='qing'?2.6:dyn.id==='ming'?2.2:dyn.id==='yuan'?1.7:1.8);
  P.total=P.yApex-P.chuanD*0.6+P.baodingH;            // 含宝顶总高
  P.jinR=Math.SQRT2*0.75*P.half;                      // 金桁半径（抹角梁中点，B 式梁架）
  /* 屋面剖面：t∈[0,1] 由檐口至顶，返回 {r,y} */
  P.profile=function(t){
    var r,y,seg=[[P.yanchu,P.ju[0]],[P.half/3,P.ju[1]],[P.half/3,P.ju[2]],[P.half/3,P.ju[3]]];
    var totRun=P.R,run=t*totRun,acc=0,rise=0;
    for(var i=0;i<seg.length;i++){
      var L=seg[i][0];
      if(run<=acc+L){rise+=(run-acc)*seg[i][1];acc=run;break;}
      rise+=L*seg[i][1];acc+=L;
    }
    if(acc<run)rise+=(run-acc)*seg[seg.length-1][1];
    return {r:P.R-run,y:P.yEave+rise};
  };
  /* 檐口平面／立面曲线：side 局部坐标，u∈[-1,1]（±1 为翼角尖） */
  P.eave=function(u){
    var a=Math.abs(u),k=Math.pow(a,3);
    return {x:u*(P.R+P.chong),z:P.R+P.chong*k,y:P.yEave+P.qiqiao*k};
  };
  return P;
}

/* 带燕尾卯口的圆形柱头断面：notches=[{a,hw,hwB,d}]（口窄底宽的梯形卯口） */
GEO.circleNotched=function(r,notches,seg){
  var pts=[],i,j,n=seg||24;
  var ranges=[];
  for(j=0;j<notches.length;j++){
    var nc=notches[j],dth=Math.asin(clamp(nc.hw/r,0,0.98));
    ranges.push({a:nc.a,d0:nc.a-dth,d1:nc.a+dth,nc:nc,done:false});
  }
  function norm(x){while(x<0)x+=Math.PI*2;while(x>=Math.PI*2)x-=Math.PI*2;return x;}
  for(i=0;i<n;i++){
    var th=norm(i/n*Math.PI*2),skip=false;
    for(j=0;j<ranges.length;j++){
      var R0=norm(ranges[j].d0),R1=norm(ranges[j].d1),inR;
      inR=(R0<R1)?(th>=R0&&th<=R1):(th>=R0||th<=R1);
      if(inR){
        if(!ranges[j].done){
          ranges[j].done=true;
          var nc2=ranges[j].nc,a=nc2.a;
          var ux=Math.cos(a),uz=Math.sin(a),vx=-Math.sin(a),vz=Math.cos(a);
          var e0=Math.cos(ranges[j].d0)*r,e0z=Math.sin(ranges[j].d0)*r;
          var e1=Math.cos(ranges[j].d1)*r,e1z=Math.sin(ranges[j].d1)*r;
          var bx=ux*(r-nc2.d),bz=uz*(r-nc2.d),iw=nc2.hwB||nc2.hw;
          pts.push([e0,e0z]);
          pts.push([bx-vx*iw,bz-vz*iw]);
          pts.push([bx+vx*iw,bz+vz*iw]);
          pts.push([e1,e1z]);
        }
        skip=true;break;
      }
    }
    if(!skip)pts.push([Math.cos(th)*r,Math.sin(th)*r]);
  }
  return pts;
};

/* ==================================================================================
   八、下架构造：台基石作 · 柱础 · 檐柱 · 额枋 · 平板枋 · 雀替
   ================================================================================== */
function buildBase(A,P){
  var d=A.dyn,th=P.taiHalf,h=P.jichuH,e=[],i;
  if(d.jichuStyle==='xumizuo'){
    /* 清式须弥座：圭角—下枋—下枭—束腰—上枭—上枋，束腰内收 */
    var lv=[[0.00,0.24,1.000],[0.24,0.14,0.980],[0.38,0.11,0.955],
            [0.49,0.17,0.900],[0.66,0.11,0.955],[0.77,0.16,0.990]];
    for(i=0;i<lv.length;i++){
      var y2=lv[i][0]*h,hh2=lv[i][1]*h,w2=th*2*lv[i][2];
      e.push({g:GEO.box(w2,hh2,w2),mat:(i===3)?'stone2':'stone',m:mPos(0,y2+hh2/2,0)});
    }
    e.push({g:GEO.box(th*2,h*0.07,th*2),mat:'stone2',m:mPos(0,h-h*0.035,0)});   // 阶条石
  }else{
    e.push({g:GEO.taper(th*2,th*2,th*2.04,th*2.04,h*0.9),mat:'stone',m:mPos(0,0,0)});
    e.push({g:GEO.box(th*2,h*0.12,th*2),mat:'stone2',m:mPos(0,h-h*0.06,0)});   // 阶条石
  }
  A.part('jichu',{name:'台明',term:'TAI MING · 台基',cat:'石作',label:true,
    size:'台明 '+fmt(th*2,2)+'×'+fmt(th*2,2)+'m　高 '+fmt(h,2)+'m',
    tag:[d.jiName],
    desc:'亭之下承。'+(d.jichuStyle==='xumizuo'
      ? '清式园林亭榭多用须弥座，自下而上为圭角、下枋、下枭、束腰、上枭、上枋，层层叠出，束腰内收。'
      : '早期台明以砖石垒砌，上压阶条石一圈，形制素朴低平，出沿以"回水"承檐口滴水。')+
      '台明出沿按檐出的 0.55 取值，使檐口滴水恰落于台明之外。'},e);

  /* 地面方砖 */
  var inn=th-P.colD*0.9;
  A.part('jichu',{name:'方砖地面',term:'FANG ZHUAN · 地面',cat:'石作',
    size:'方砖地坪 '+fmt(inn*2,2)+'m 见方',
    desc:'亭内地面用方砖细墁，中心与四柱柱础相接，略高于阶条石内皮以利排水。'},
    [{g:GEO.box(inn*2,h*0.04,inn*2),mat:'stone2',m:mPos(0,h+h*0.015,0)}]);

  /* 踏跺（明清） */
  if(d.jichuStyle==='tadao'||d.jichuStyle==='xumizuo'){
    var n=3,w=P.bay*0.52,te=[];
    for(i=0;i<n;i++){
      var sh=h/n,sy=h-(i+1)*sh,sd=(i+1)*sh*1.7;
      te.push({g:GEO.box(w,sh,sd),mat:'stone',m:mPos(0,sy+sh/2,th+sd/2-0.01)});
    }
    te.push({g:GEO.box(w*0.09,h*0.5,th*0.1+h*1.7*n*0.5),mat:'stone2',m:mPos(-w/2,h*0.5,th+h*1.7*n*0.25)});
    te.push({g:GEO.box(w*0.09,h*0.5,th*0.1+h*1.7*n*0.5),mat:'stone2',m:mPos( w/2,h*0.5,th+h*1.7*n*0.25)});
    A.part('jichu',{name:'踏跺',term:'TA DUO · 台阶',cat:'石作',
      size:fmt(n,0)+' 级　总宽 '+fmt(w,2)+'m',
      desc:'南向踏跺三级，两侧垂带石压边。明清园林亭榭常于一面设踏跺，其余三面砌象眼。'},te);
  }
}

function buildPlinth(A,P){
  var d=A.dyn,e,i,cs=corners(P);
  for(i=0;i<4;i++){
    var c=cs[i],pts,g;
    e=[];
    if(d.chuStyle==='fupenLotus'){
      g=GEO.lathe([[0,0],[P.colR*1.62,0],[P.colR*1.62,P.chuH*0.24],[P.colR*1.5,P.chuH*0.42],
                   [P.colR*1.12,P.chuH*0.72],[P.colR*0.95,P.chuH],[0,P.chuH]],12);
      e.push({g:g,mat:'stone2',m:mPos(c.x,P.y0,c.z)});
      for(var k=0;k<8;k++){   // 莲瓣
        var a=k/8*Math.PI*2,rr=P.colR*1.34;
        e.push({g:GEO.taper(P.colR*0.30,P.colR*0.20,P.colR*0.46,P.colR*0.30,P.chuH*0.40),
          mat:'stone2',m:compose(c.x+Math.cos(a)*rr,P.y0+P.chuH*0.28,c.z+Math.sin(a)*rr,0,-a,0)});
      }
    }else if(d.chuStyle==='fupen'){
      g=GEO.lathe([[0,0],[P.colR*1.55,0],[P.colR*1.52,P.chuH*0.3],[P.colR*1.2,P.chuH*0.7],
                   [P.colR*0.95,P.chuH],[0,P.chuH]],12);
      e.push({g:g,mat:'stone2',m:mPos(c.x,P.y0,c.z)});
    }else if(d.chuStyle==='suping'){
      e.push({g:GEO.taper(P.colR*2.5,P.colR*2.5,P.colR*2.7,P.colR*2.7,P.chuH),mat:'stone2',m:mPos(c.x,P.y0,c.z)});
    }else{
      e.push({g:GEO.box(P.colR*2.9,P.chuH*0.55,P.colR*2.9),mat:'stone',m:mPos(c.x,P.y0+P.chuH*0.275,c.z)});
      e.push({g:GEO.lathe([[0,0],[P.colR*1.36,0],[P.colR*1.34,P.chuH*0.28],[P.colR*1.16,P.chuH*0.42],
              [P.colR*1.06,P.chuH*0.45],[0,P.chuH*0.45]],12),mat:'stone2',m:mPos(c.x,P.y0+P.chuH*0.55,c.z)});
    }
    A.part('chushi',{name:'柱础·'+c.name,term:'ZHU CHU · 柱础',cat:'石作',label:i===0,
      size:'础径 '+fmt(P.colR*2*1.5,2)+'m　高 '+fmt(P.chuH,2)+'m',
      tag:[d.chuName],
      desc:'柱础承柱脚，隔潮防碱。'+(d.chuStyle==='fupenLotus'?'唐代多作覆盆并雕莲瓣，盆面外鼓。':
        d.chuStyle==='fupen'?'宋《法式》柱础"方倍柱径"，上作覆盆，素平不雕。':
        d.chuStyle==='suping'?'元代趋简，多用素平础，仅微露方座。':
        '明清用柱顶石加鼓镜，方座之上起圆鼓，柱脚落于鼓镜之上，以馒头榫入柱。')},e);
  }
}

function corners(P){
  var h=P.half;
  /* +Z 为南、+X 为东：东南/西南/西北/东北 */
  return [{x: h,z: h,name:'东南',sx:1,sz:1},{x:-h,z: h,name:'西南',sx:-1,sz:1},
          {x:-h,z:-h,name:'西北',sx:-1,sz:-1},{x: h,z:-h,name:'东北',sx:1,sz:-1}];
}
/* 柱头因侧脚而内收后的平面位置 */
function colTopXZ(P,c){
  var s=P.colH*P.cejiao;
  return {x:c.x-c.sx*s,z:c.z-c.sz*s};
}

function buildColumns(A,P){
  var d=A.dyn,cs=corners(P),i;
  var headH=P.efH*1.05,bodyH=P.colH-headH;
  var tenonHW=P.efT*0.22,tenonD=P.colR*0.34;
  for(i=0;i<4;i++){
    var c=cs[i],t=colTopXZ(P,c),e=[];
    /* 柱身：带收分（唐宋加卷杀） */
    var body=GEO.column(P.colR,P.colR*0.92,bodyH,10,d.id==='tang'||d.id==='song');
    e.push({g:body,mat:'col',m:mPos(0,0,0)});
    /* 柱头段：开燕尾卯口两处，朝向相邻两面 */
    var aX=(c.sx>0)?0:Math.PI;                     // 指向 ±X
    var aZ=(c.sz>0)?Math.PI/2:-Math.PI/2;          // 指向 ±Z
    var nA=[{a:aX+Math.PI,hw:tenonHW,hwB:tenonHW*1.30,d:tenonD},
            {a:aZ+Math.PI,hw:tenonHW,hwB:tenonHW*1.30,d:tenonD}];
    var headPts=GEO.circleNotched(P.colR*0.92,nA,20);
    e.push({g:GEO.prismY(headPts,headH),mat:'col',m:mPos(0,bodyH,0)});
    /* 柱头馒头榫（承梁／承桁） */
    e.push({g:GEO.column(P.colR*0.24,P.colR*0.22,P.colR*0.5,8,false),mat:'col',m:mPos(0,P.colH,0)});
    /* 侧脚：整柱绕柱脚向亭心微倾（柱头内收） */
    var lean=P.cejiao,tilt=compose(c.x,P.colBase,c.z, -c.sz*lean, 0, c.sx*lean);
    for(var k=0;k<e.length;k++)e[k].m=MAT4().multiplyMatrices(tilt,e[k].m);
    A.part('zhu',{name:'檐柱·'+c.name,term:'YAN ZHU · 檐柱',cat:'大木作',label:i===0,
      size:'柱高 '+fmt(P.colH,2)+'m　柱径 '+fmt(P.colD,3)+'m　高径比 '+fmt(d.slender,1),
      tag:['侧脚 '+fmt(P.cejiao*1000,1)+'‰',(d.id==='tang'||d.id==='song')?'柱身卷杀':'直柱收分'],
      desc:'四角亭四柱皆为角柱，柱头同时承受两向额枋与转角科斗栱。柱身自下而上收分，'+
        (P.cejiao>0.004?'柱脚外闪、柱头内倾（侧脚），使构架产生向心的稳定分力，此为唐宋做法之要。'
                       :'明清柱身垂直，侧脚几废，转而依赖榫卯与斗栱层的整体咬合取得稳定。')+
        '柱头开燕尾卯口两处以纳额枋榫头，顶出馒头榫以定位上架。'},e);
  }
}

function buildArchitrave(A,P){
  var d=A.dyn,cs=corners(P),i;
  var tenonHW=P.efT*0.22,tenonD=P.colR*0.34;
  /* 四面额枋（阑额）：两端作燕尾榫 */
  for(i=0;i<4;i++){
    var c0=colTopXZ(P,cs[i]),c1=colTopXZ(P,cs[(i+1)%4]);
    var mx=(c0.x+c1.x)/2,mz=(c0.z+c1.z)/2;
    var dx=c1.x-c0.x,dz=c1.z-c0.z,len=Math.sqrt(dx*dx+dz*dz);
    var ang=Math.atan2(dx,dz);                       // 使局部 +Z 沿枋长
    var e=[],body=len-P.colR*1.84;
    e.push({g:GEO.box(P.efT,P.efH,body),mat:'beam',m:mPos(0,0,0)});
    /* 两端燕尾榫头（大头在外，"乍"）；榫根＝卯口宽、榫端更宽以锁紧 */
    for(var s=-1;s<=1;s+=2){
      var tp=[[-tenonHW,0],[tenonHW,0],[tenonHW*1.30,tenonD],[-tenonHW*1.30,tenonD]];
      var g=GEO.prismY(tp,P.efH*0.56);
      e.push({g:g,mat:'beam',m:compose(0,-P.efH*0.30,s*(body/2),0,s>0?0:Math.PI,0)});
    }
    A.part('efang',{name:'额枋·'+dirName(i),term:d.pupai?'E FANG · 额枋':'LAN E · 阑额',
      cat:'大木作',label:i===0,
      size:'高 '+fmt(P.efH,2)+'m　厚 '+fmt(P.efT,2)+'m　净跨 '+fmt(body,2)+'m',
      tag:[d.puName.split('（')[0],'燕尾榫'],
      desc:'联络四柱柱头、构成"圈梁"的水平构件。'+(d.pupai?'':'唐代仅施阑额，其上直接坐斗，柱头之间无普拍枋过渡。')+
        '两端作燕尾榫（大头在外），自上而下落入柱头卯口，受拉时榫肩相抵而不致拔出，是木构框架抗侧移的关键。',
      },e).group.applyMatrix4(compose(mx,P.colTop-P.efH/2,mz,0,ang,0));
  }
  /* 普拍枋／平板枋 */
  if(d.pupai){
    for(i=0;i<4;i++){
      var a0=colTopXZ(P,cs[i]),a1=colTopXZ(P,cs[(i+1)%4]);
      var mx2=(a0.x+a1.x)/2,mz2=(a0.z+a1.z)/2;
      var dx2=a1.x-a0.x,dz2=a1.z-a0.z,len2=Math.sqrt(dx2*dx2+dz2*dz2);
      var ang2=Math.atan2(dx2,dz2);
      var ee=[{g:GEO.box(P.pupaiW,P.pupaiH,len2+P.pupaiW*(i%2?1.0:1.0)),mat:'beam',m:MAT4()}];
      var pt=A.part('efang',{name:(d.id==='song'||d.id==='yuan'?'普拍枋·':'平板枋·')+dirName(i),
        term:d.id==='song'||d.id==='yuan'?'PU PAI FANG':'PING BAN FANG',cat:'大木作',label:i===0,
        size:'宽 '+fmt(P.pupaiW,2)+'m　高 '+fmt(P.pupaiH,2)+'m',
        tag:[d.id==='song'?'宋代始见':'明清加宽'],
        desc:'压于阑额与柱头之上的扁平枋材，与阑额叠成丁字形断面，为斗栱提供连续坐面。'+
          (d.id==='song'?'宋辽时期始普遍使用，尺寸尚窄。':
           d.id==='yuan'?'元代加宽，而阑额相对减薄。':
           '明清称平板枋，宽达三斗口，斗栱攒数既多，全赖此枋均摊荷载。')},ee);
      pt.group.applyMatrix4(compose(mx2,P.colTop+P.pupaiH/2,mz2,0,ang2,0));
    }
  }
  /* 雀替（明清） */
  if(d.queti){
    for(i=0;i<4;i++){
      var b0=colTopXZ(P,cs[i]),b1=colTopXZ(P,cs[(i+1)%4]);
      var mx3=(b0.x+b1.x)/2,mz3=(b0.z+b1.z)/2;
      var dx3=b1.x-b0.x,dz3=b1.z-b0.z,len3=Math.sqrt(dx3*dx3+dz3*dz3),ang3=Math.atan2(dx3,dz3);
      var qL=len3*(d.id==='qing'?0.26:0.18),qH=P.efH*(d.id==='qing'?1.1:0.85),ee3=[];
      for(var s3=-1;s3<=1;s3+=2){
        var prof=[[0,0],[qL,0],[qL,qH*0.30],[qL*0.62,qH*0.52],[qL*0.30,qH*0.78],[0,qH]];
        var gq=GEO.prismZ(prof,P.efT*0.62);
        ee3.push({g:gq,mat:'gong',m:compose(0,-qH,s3*(len3/2-P.colR*0.7),0,s3>0?-Math.PI/2:Math.PI/2,0)});
      }
      var pq=A.part('efang',{name:'雀替·'+dirName(i),term:'QUE TI · 雀替',cat:'大木作',
        size:'长 '+fmt(qL,2)+'m　高 '+fmt(qH,2)+'m',tag:['明清做法'],
        desc:'置于柱与额枋交角处的托木，缩短额枋净跨、增强节点抗剪，并遮护榫卯。清式雀替加大且施雕饰，'+
          '兼具结构与装饰双重作用；唐宋无此件，其功能由硕大的斗栱与阑额自身断面承担。'},ee3);
      pq.group.applyMatrix4(compose(mx3,P.colTop,mz3,0,ang3,0));
    }
  }
}

function dirName(i){return ['南','西','北','东'][i];}

/* ==================================================================================
   九、斗栱层布置：转角科 ×4 + 平身科（补间铺作）×(每面 n)
   ================================================================================== */
function buildDougongLayer(A,P){
  var d=A.dyn,i,j;
  var jiao=buildDougong(d,'jiao'),ping=buildDougong(d,'ping');
  var cs=corners(P);
  /* 转角科：本地已按东北角（+X／+Z 双向出跳）构造，其余角绕 Y 旋转 -k·90° */
  for(i=0;i<4;i++){
    var th=-i*Math.PI/2,c=colTopXZ(P,cs[i]);
    var e=[],k;
    for(k=0;k<jiao.entries.length;k++)e.push({g:jiao.entries[k].g,mat:jiao.entries[k].mat,m:jiao.entries[k].m});
    A.part('dougong',{name:'转角科·'+cs[i].name,term:'ZHUAN JIAO KE · 转角铺作',cat:'斗栱',label:i===0,
      size:'高 '+fmt(P.dgH,2)+'m　出跳 '+fmt(P.dgJump,2)+'m　'+d.jumps+' 跳',
      tag:[d.modName,d.angName,'斜栱／由昂'],
      desc:'四角亭四柱皆角柱，故柱头科与转角科合一：一朵之内含正身两向出跳与 45° 斜出一缝，'+
        '斜翘、斜昂逐层加长（约 √2 倍），最上由昂挑出最远，'+(d.id==='ming'||d.id==='qing'?'其上立宝瓶承仔角梁。':'其上直接承角梁后尾。')+
        '一朵转角科同时传递两个方向的檐部荷载并锁结转角，是全亭受力最复杂的节点。'},e)
      .group.applyMatrix4(compose(c.x,P.dgBase,c.z,0,th,0));
  }
  /* 平身科：每面 n 攒，攒当均分 */
  var n=d.bujian,sp=P.bay/(n+1);
  for(i=0;i<4;i++){
    var thi=-(i+1)*Math.PI/2;                                    // 使局部 +X 指向该面法向
    for(j=0;j<n;j++){
      var t=(j+1)*sp-P.bay/2;
      var nx=Math.sin(-i*Math.PI/2),nz=Math.cos(-i*Math.PI/2);  // 该面法向（南西东北）
      var tx=Math.cos(-i*Math.PI/2),tz=-Math.sin(-i*Math.PI/2); // 沿面方向
      var px=nx*P.half+tx*t,pz=nz*P.half+tz*t;
      var e2=[],k2;
      for(k2=0;k2<ping.entries.length;k2++)e2.push({g:ping.entries[k2].g,mat:ping.entries[k2].mat,m:ping.entries[k2].m});
      A.part('dougong',{name:(d.pupai&&d.fen<0.012?'平身科·':'补间铺作·')+dirName(i)+(j+1),
        term:d.pupai&&d.fen<0.012?'PING SHEN KE':'BU JIAN PU ZUO',cat:'斗栱',label:(i===0&&j===0),
        size:'高 '+fmt(P.dgH,2)+'m　出跳 '+fmt(P.dgJump,2)+'m　攒当 '+fmt(sp,2)+'m',
        tag:[d.jumps===2?(d.fen<0.012?'五踩单翘单昂':'五铺作单杪单下昂'):'四铺作',d.angName],
        desc:'置于两柱之间的斗栱。'+(n<=1?'唐代每面仅一朵，铺作疏朗，斗栱个体雄大而承重作用真实。':
          n===2?'宋代增为两朵，并多作计心造，跳头置瓜子栱、慢栱，出跳与横栱交织成网。':
          '明清攒数骤增（每面 '+n+' 攒），个体缩小、间距密集，斗栱由主要承重构件转为檐下装饰性过渡层，'+
          '真正的挑檐荷载改由挑尖梁与桁檩体系承担。')},e2)
        .group.applyMatrix4(compose(px,P.dgBase,pz,0,thi,0));
    }
  }
}

/* ==================================================================================
   十、桁檩枋子：正心桁 · 挑檐桁 · 正心枋（搭交出头）
   ================================================================================== */
function buildPurlins(A,P){
  var d=A.dyn,i;
  for(i=0;i<4;i++){
    var th=-(i+1)*Math.PI/2;                       // 桁轴旋转（保持局部 X 轴沿桁长）
    var nx=Math.sin(-i*Math.PI/2),nz=Math.cos(-i*Math.PI/2);   // 该面法向（南西东北）
    var over=P.hengR*1.1;                          // 搭交出头（≈1 桁径，不穿屋面）
    var L=P.bay+over*2;
    /* 正心桁 */
    A.part('heng',{name:'正心桁·'+dirName(i),term:'ZHENG XIN HENG · 檐檩',cat:'大木作',label:i===0,
      size:'径 '+fmt(P.hengR*2,2)+'m　长 '+fmt(L,2)+'m',tag:['十字搭交榫'],
      desc:'正压柱中线的檩木，承檐椽上端。四面正心桁于转角处十字搭交，各自出头，'+
        '互相咬压成闭合方框（"箍"），使四面构架连成整体，是攒尖构架水平刚度的来源。'},
      [{g:GEO.column(P.hengR,P.hengR,L,10,false),mat:'beam',
        m:compose(nx*P.half,P.yZheng,nz*P.half,Math.PI/2,0,th)}]);
    /* 正心枋（桁下，坐于慢栱散斗之上） */
    var fangTop=P.dgBase+P.dgH;
    var fangBot=P.dgBase+(21*d.jumps+10)*P.f;
    var fangH=Math.max(fangTop-fangBot,4*P.f);
    A.part('heng',{name:'正心枋·'+dirName(i),term:'ZHENG XIN FANG',cat:'大木作',
      size:'高 '+fmt(fangH,2)+'m　厚 '+fmt(P.hou,2)+'m',
      desc:'位于正心桁之下、斗栱正心缝上的枋材，与斗栱的泥道栱、慢栱层层叠压，'+
        '把各攒斗栱串联为连续的檐部承重带。'},
      [{g:GEO.box(P.hou,fangH,P.bay+P.hou*2),mat:'beam',
        m:compose(nx*P.half,fangBot+fangH/2,nz*P.half,0,-th,0)}]);
    /* 挑檐桁 + 撩檐枋（桁底至斗栱顶的过渡枋） */
    var ro=P.half+P.dgJump;
    A.part('heng',{name:'挑檐桁·'+dirName(i),term:'TIAO YAN HENG · 挑檐桁',cat:'大木作',label:i===0,
      size:'径 '+fmt(P.hengR*1.7,2)+'m　挑出 '+fmt(P.dgJump,2)+'m',
      desc:'由斗栱最外一跳的令栱、撩檐枋托起的檩木，位置低于正心桁，'+
        '二者高差恰构成檐步举（'+fmt(P.ju[0],2)+'），檐椽即搁于此二桁之上而形成出檐坡度。'},
      [{g:GEO.column(P.hengR*0.85,P.hengR*0.85,P.bay+over*1.4,10,false),mat:'beam',
        m:compose(nx*ro,P.yTiao,nz*ro,Math.PI/2,0,th)}]);
    var liaoH=P.yTiao-P.hengR*0.85-fangTop;
    if(liaoH>4*P.f){
      A.part('heng',{name:'撩檐枋·'+dirName(i),term:'LIAO YAN FANG · 撩檐枋',cat:'大木作',
        size:'高 '+fmt(liaoH,2)+'m　厚 '+fmt(P.hou*0.9,2)+'m',
        desc:'压于令栱齐心斗之上、承挑檐桁的枋材，斗栱顶部至挑檐桁之间的过渡层，'+
          '使桁底与斗栱顶严密相接。'},
        [{g:GEO.box(P.hou*0.9,liaoH,P.bay+P.dgJump*0.6),mat:'beam',
          m:compose(nx*ro,fangTop+liaoH/2,nz*ro,0,-th,0)}]);
    }
  }
}

/* 通用轮廓放样（筒瓦、垂脊、连檐、角梁等）：prof 为 [[side,up],...]
   scales 可选，逐环缩放轮廓（用于瓦垄向宝顶"赶垄"收窄） */
GEO.sweepProfile=function(path,prof,closed,scales){
  var n=path.length,m=prof.length,pos=[],rings=[],i,k;
  for(i=0;i<n;i++){
    var p=path[i],q=path[Math.min(i+1,n-1)],o=path[Math.max(i-1,0)];
    var t=new THREE.Vector3().subVectors(q,o);
    if(t.lengthSq()<1e-10)t.set(0,0,1);
    t.normalize();
    var side=new THREE.Vector3().crossVectors(t,V3(0,1,0));
    if(side.lengthSq()<1e-10)side.set(1,0,0);
    side.normalize();
    var up=new THREE.Vector3().crossVectors(side,t).normalize();
    var sc=scales?Math.max(scales[i],0.02):1;
    var ring=[];
    for(k=0;k<m;k++){
      var ps=prof[k][0]*sc,pu=prof[k][1]*sc;
      ring.push(new THREE.Vector3(
        p.x+side.x*ps+up.x*pu,
        p.y+side.y*ps+up.y*pu,
        p.z+side.z*ps+up.z*pu));
    }
    rings.push(ring);
  }
  function quad(a,b,c,d){
    pos.push(a.x,a.y,a.z,b.x,b.y,b.z,c.x,c.y,c.z);
    pos.push(a.x,a.y,a.z,c.x,c.y,c.z,d.x,d.y,d.z);
  }
  var lim=closed?m:m-1;
  for(i=0;i<n-1;i++){
    for(k=0;k<lim;k++){
      var k2=(k+1)%m;
      quad(rings[i][k],rings[i+1][k],rings[i+1][k2],rings[i][k2]);
    }
  }
  /* 端盖（扇形三角） */
  for(k=1;k<m-1;k++){
    pos.push(rings[0][0].x,rings[0][0].y,rings[0][0].z,
             rings[0][k].x,rings[0][k].y,rings[0][k].z,
             rings[0][k+1].x,rings[0][k+1].y,rings[0][k+1].z);
    var L=rings[n-1];
    pos.push(L[0].x,L[0].y,L[0].z,L[k+1].x,L[k+1].y,L[k+1].z,L[k].x,L[k].y,L[k].z);
  }
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.computeVertexNormals();
  return g;
};

/* ==================================================================================
   十一、屋面几何基准：roofPoint / hipPoint
   ----------------------------------------------------------------------------------
   以檐口平面曲线 E(u) 与屋面剖面 profile(t) 作直纹面：
     水平位置 = E_xz(u) × (r_t / R)      高度 = 由檐口高按剖面归一化升至攒尖顶
   如此翼角的"冲出＋起翘"在檐口最显著，向上逐渐消隐于宝顶，正合翼角实况。
   ================================================================================== */
function roofPoint(P,i,u,t){
  var e=P.eave(u),pr=P.profile(t),k=pr.r/P.R;
  var ly=e.y+(P.yApex-e.y)*((pr.y-P.yEave)/(P.yApex-P.yEave));
  var lx=e.x*k,lz=e.z*k,th=-i*Math.PI/2,c=Math.cos(th),s=Math.sin(th);
  return V3(lx*c+lz*s,ly,-lx*s+lz*c);
}
function hipPoint(P,cIdx,t){return roofPoint(P,cIdx,1,t);}
function offsetY(v,dy){return V3(v.x,v.y+dy,v.z);}

/* ==================================================================================
   十二、梁架体系
   ----------------------------------------------------------------------------------
   A 式（唐宋）：递角栿 + 簇角梁三折（大角梁—次角梁—隐角梁）+ 枨杆
   B 式（元明清）：抹角梁 ×4 + 太平梁 + 雷公柱 + 老角梁／仔角梁 + 由戗
   ================================================================================== */
function buildFrame(A,P){
  var d=A.dyn,f=P.f,i,t,cs=corners(P);
  var hAng=30*f,wAng=20*f,hYou=26*f,wYou=17*f;
  var profAng=[[-wAng/2,-hAng/2],[wAng/2,-hAng/2],[wAng/2,hAng/2],[-wAng/2,hAng/2]];
  var profYou=[[-wYou/2,-hYou/2],[wYou/2,-hYou/2],[wYou/2,hYou/2],[-wYou/2,hYou/2]];
  function hipPath(c,t0,t1,steps,dy){
    var p=[],k;
    for(k=0;k<=steps;k++){
      t=t0+(t1-t0)*k/steps;
      p.push(offsetY(hipPoint(P,c,t),dy));
    }
    return p;
  }

  if(d.frame==='A'){
    /* --- 递角栿：对角大梁两根，十字叠交于亭心，承枨杆 --- */
    var hDi=34*f,wDi=24*f,rD=P.half*1.12;
    for(i=0;i<2;i++){
      var c0=cs[i],c1=cs[i+2];
      var ux=(c0.x>0?1:-1)*Math.SQRT1_2,uz=(c0.z>0?1:-1)*Math.SQRT1_2;
      var yDi=P.yZhengTop-hDi*0.85;                   // 梁顶低于正心桁上皮，藏于翼角望板之下
      A.part('liangjia',{name:'递角栿·'+(i===0?'东南—西北':'西南—东北'),term:'DI JIAO FU · 递角栿',
        cat:'大木作',label:i===0,
        size:'高 '+fmt(hDi,2)+'m　宽 '+fmt(wDi,2)+'m　跨 '+fmt(rD*2,2)+'m',
        tag:['唐宋做法'],
        desc:'沿对角斜跨的大梁，两根十字叠交于亭心，端头搭于转角铺作之上。'+
          '其上立枨杆（中心柱），四缝角梁后尾即攒于枨杆，构成唐宋斗尖亭的基本骨架。'},
        [{g:GEO.sweepProfile([V3(ux*rD,yDi,uz*rD),V3(-ux*rD,yDi,-uz*rD)],
           [[-wDi/2,-hDi/2],[wDi/2,-hDi/2],[wDi/2,hDi/2],[-wDi/2,hDi/2]],true),mat:'board'}]);
    }
    /* --- 簇角梁三折：大角梁 / 次角梁 / 隐角梁 --- */
    var folds=[{n:'大角梁',t0:0.00,t1:0.35,p:profAng,m:'board',term:'DA JIAO LIANG'},
               {n:'次角梁',t0:0.35,t1:0.70,p:profYou,m:'board',term:'CI JIAO LIANG'},
               {n:'隐角梁',t0:0.70,t1:0.985,p:profYou,m:'board',term:'YIN JIAO LIANG'}];
    for(i=0;i<4;i++){
      for(var k=0;k<folds.length;k++){
        var F=folds[k];
        A.part('liangjia',{name:F.n+'·'+cs[i].name,term:F.term+' · 簇角梁',cat:'大木作',
          label:(i===0),
          size:'断面 '+fmt(F.p===profAng?wAng:wYou,2)+'×'+fmt(F.p===profAng?hAng:hYou,2)+'m',
          tag:['簇角梁造','第 '+(k+1)+' 折'],
          desc:'《营造法式》卷五"簇角梁之制"：斗尖亭榭之角梁分三折，自檐角起为大角梁，'+
            '中为次角梁，上为隐角梁，逐折加陡而收向中心，最终攒于枨杆。三折折点即屋面举折的转折处，'+
            '故宋代攒尖屋面呈现明显的分段折线而非单一斜面。'},
          [{g:GEO.sweepProfile(hipPath(i,F.t0,F.t1,4,-hAng*0.45),F.p,true),mat:F.m}]);
      }
    }
    /* --- 枨杆（中心柱） --- */
    var lgTop=P.yApex,lgBot=P.yZhengTop-hDi*0.35;
    A.part('liangjia',{name:'枨杆',term:'CHENG GAN · 中心柱（清称雷公柱）',cat:'大木作',label:true,
      size:'径 '+fmt(30*f,2)+'m　长 '+fmt(lgTop-lgBot,2)+'m',tag:['八角断面'],
      desc:'攒尖之心。宋代称枨杆，立于十字递角栿之上，四缝隐角梁上端以搭掌榫攒于其身，'+
        '将四面屋盖的推力在中心相互抵消。其上即出宝顶。'},
      [{g:GEO.column(30*f/2,26*f/2,lgTop-lgBot,8,false),mat:'board',m:mPos(0,lgBot,0)}]);

  }else{
    /* --- 抹角梁 ×4：斜跨四角，抹去转角 --- */
    var hMo=30*f,wMo=26*f,a=P.half*0.5;
    var rot=function(x,z,cc,ss,yy){return V3(x*cc+z*ss,yy,-x*ss+z*cc);};
    for(i=0;i<4;i++){
      var th=-i*Math.PI/2,cc=Math.cos(th),ss=Math.sin(th),yMo=P.yZhengTop;
      var pA=rot(P.half,a,cc,ss,yMo),pB=rot(a,P.half,cc,ss,yMo);
      A.part('liangjia',{name:'抹角梁·'+cs[i].name,term:'MO JIAO LIANG · 抹角梁',cat:'大木作',
        label:i===0,
        size:'高 '+fmt(hMo,2)+'m　宽 '+fmt(wMo,2)+'m　跨 '+fmt(pA.distanceTo(pB),2)+'m',
        tag:['元明清做法'],
        desc:'斜置于转角、两端搭在相邻两面正心桁上的梁，把方形柱网"抹"成八角形受力圈。'+
          '四根抹角梁互不相交，共同承托太平梁与上部由戗，是元代以后攒尖构架取代簇角梁的关键构件。'},
        [{g:GEO.sweepProfile([pA,pB],[[-wMo/2,-hMo/2],[wMo/2,-hMo/2],[wMo/2,hMo/2],[-wMo/2,hMo/2]],true),
          mat:'board'}]);
    }
    /* --- 太平梁：跨于两根相对抹角梁之上，承雷公柱 --- */
    var hTai=24*f,wTai=28*f,mid=(P.half+a)/2;
    var yTai=P.yZhengTop+hMo/2+hTai/2;
    var q0=V3(mid,yTai,mid),q1=V3(-mid,yTai,-mid);
    A.part('liangjia',{name:'太平梁',term:'TAI PING LIANG · 太平梁',cat:'大木作',label:true,
      size:'高 '+fmt(hTai,2)+'m　宽 '+fmt(wTai,2)+'m　跨 '+fmt(q0.distanceTo(q1),2)+'m',
      tag:['承雷公柱'],
      desc:'压在两根抹角梁之上的横梁，专为承托悬空的雷公柱而设，故名"太平"。'+
        '有此梁，雷公柱方能不落地而稳立于亭心之上，亭内得以完全空敞无柱。'},
      [{g:GEO.sweepProfile([q0,q1],[[-wTai/2,-hTai/2],[wTai/2,-hTai/2],[wTai/2,hTai/2],[-wTai/2,hTai/2]],true),
        mat:'board'}]);
    /* --- 雷公柱：悬空中心柱 --- */
    var lgBot2=P.yZhengTop+hMo/2+hTai,lgTop2=P.yApex;
    A.part('liangjia',{name:'雷公柱',term:'LEI GONG ZHU · 雷公柱',cat:'大木作',label:true,
      size:'径 '+fmt(32*f,2)+'m　长 '+fmt(lgTop2-lgBot2,2)+'m',tag:['八角断面','悬柱'],
      desc:'攒尖亭的中心悬柱，下端立于太平梁，上端出宝顶。四根由戗以搭掌榫攒入柱身，'+
        '柱身受四向推力而自锁。因其不落地、只受上部构架挤压而"悬"于空中，为攒尖构架最具特色之处。'},
      [{g:GEO.column(32*f/2,26*f/2,lgTop2-lgBot2,8,false),mat:'board',m:mPos(0,lgBot2,0)},
       {g:GEO.lathe([[0,0],[22*f,0],[18*f,10*f],[0,12*f]],8),mat:'board',m:mPos(0,lgBot2,0)}]);
    /* --- 老角梁 / 仔角梁 / 由戗 --- */
    for(i=0;i<4;i++){
      A.part('liangjia',{name:'老角梁·'+cs[i].name,term:'LAO JIAO LIANG · 老角梁',cat:'大木作',
        label:i===0,
        size:'断面 '+fmt(wAng,2)+'×'+fmt(hAng,2)+'m',tag:['下段角梁'],
        desc:'转角处斜置的主梁，后尾搭于抹角梁，前端挑出翼角承仔角梁。'+
          '其挑出长度与举高共同决定翼角的"冲"与"翘"。'},
        [{g:GEO.sweepProfile(hipPath(i,0.02,0.40,5,-hAng*0.55),profAng,true),mat:'board'}]);
      A.part('liangjia',{name:'仔角梁·'+cs[i].name,term:'ZI JIAO LIANG · 仔角梁',cat:'大木作',
        size:'断面 '+fmt(wAng*0.86,2)+'×'+fmt(hAng*0.78,2)+'m',tag:['上段角梁','起翘'],
        desc:'叠压于老角梁之上、端头再向外上方挑起的角梁，翼角的上扬曲线即由其头部（"翘"）造成。'+
          (d.id==='qing'?'清式仔角梁后尾坐于角科由昂上的宝瓶，前端冲出三椽、翘起四椽，故翼角最为飞扬。':'')},
        [{g:GEO.sweepProfile(hipPath(i,-0.012,0.30,4,-hAng*0.10),
            [[-wAng*0.43,-hAng*0.39],[wAng*0.43,-hAng*0.39],[wAng*0.43,hAng*0.39],[-wAng*0.43,hAng*0.39]],true),
          mat:'board'}]);
      A.part('liangjia',{name:'由戗·'+cs[i].name,term:'YOU QIANG · 由戗',cat:'大木作',
        label:i===0,
        size:'断面 '+fmt(wYou,2)+'×'+fmt(hYou,2)+'m',tag:['上段翼脊骨架'],
        desc:'角梁向上的续接构件，沿垂脊线一路收至雷公柱，以搭掌榫与雷公柱咬合。'+
          '由戗是攒尖屋面四条垂脊的结构骨干，屋面的四坡即以由戗为界。'},
        [{g:GEO.sweepProfile(hipPath(i,0.36,0.975,5,-hYou*0.5),profYou,true),mat:'board'}]);
    }
    /* --- 金桁：抹角梁上 1/4 与 3/4 处的短桁，承花架椽中段（避让太平梁端头） --- */
    var diagName=['东南','西南','西北','东北'];
    for(i=0;i<4;i++){
      var th=-i*Math.PI/2,cc2=Math.cos(th),ss2=Math.sin(th);
      var qA=rot(P.half,a,cc2,ss2,0),qB=rot(a,P.half,cc2,ss2,0);
      var dir=new THREE.Vector3().subVectors(qB,qA).normalize();
      var qj2=new THREE.Quaternion().setFromUnitVectors(V3(0,1,0),dir);
      for(var s=0;s<2;s++){
        var tt=0.24+0.52*s;
        var qp=qA.clone().lerp(qB,tt);
        A.part('heng',{name:'金桁·'+diagName[i]+'·'+(s+1),term:'JIN HENG · 金檩',cat:'大木作',
          size:'径 '+fmt(P.hengR*1.5,2)+'m',
          desc:'斜置于抹角梁上的上层短桁（1/4 与 3/4 处），承花架椽的中段，使上部屋面不至过长而下垂。'},
          [{g:GEO.column(P.hengR*0.75,P.hengR*0.75,qA.distanceTo(qB)*0.30,10,false),mat:'beam',
            m:MAT4().compose(V3(qp.x,P.yZhengTop+hMo*0.5+P.hengR*0.75,qp.z),qj2,V3(1,1,1))}]);
      }
    }
  }
}

/* ==================================================================================
   十三、椽望层：檐椽 · 飞椽 · 翼角翘飞椽 · 望板 · 连檐
   ================================================================================== */
function innerU(u){
  var a=Math.abs(u);
  if(a<=0.60)return u;
  return (u<0?-1:1)*(0.60+(a-0.60)*0.34);
}
function buildRafters(A,P){
  var d=A.dyn,f=P.f,i,j;
  var tHalf=P.yanchu/P.R;                     // 正心桁所在 t
  var cd=P.chuanD,gap=P.chuanGap;
  var uMax=0.965;
  var nPer=Math.max(4,Math.round(2*uMax*(P.R+P.chong)/gap));
  var profC=[[-cd*0.5,-cd*0.5],[cd*0.5,-cd*0.5],[cd*0.5,cd*0.5],[-cd*0.5,cd*0.5]];
  var profF=[[-cd*0.44,-cd*0.40],[cd*0.44,-cd*0.40],[cd*0.44,cd*0.40],[-cd*0.44,cd*0.40]];

  for(i=0;i<4;i++){
    var eY=[],fY=[],wY=[],up=[],cnt=0,fan=0;
    for(j=0;j<=nPer;j++){
      var u=-uMax+2*uMax*j/nPer;
      var ui=innerU(u);
      var isFan=Math.abs(u)>0.60;
      /* 檐椽：自檐口内侧至正心桁后尾（翼角处按放射排列） */
      var pa=offsetY(roofPoint(P,i,u,0.085),-cd*0.55);
      var pb=offsetY(roofPoint(P,i,ui,tHalf*1.16),-cd*0.55);
      var g1=GEO.sweepProfile([pa,pb],profC,true);
      if(isFan){fan++;wY.push({g:g1,mat:'rafter'});}else{cnt++;eY.push({g:g1,mat:'rafter'});}
      /* 飞椽：压于檐椽之上，头部上扬挑出檐口 */
      var fa=offsetY(roofPoint(P,i,u,-0.055),cd*0.30);
      var fb=offsetY(roofPoint(P,i,u*0.94,0.235),-cd*0.10);
      fY.push({g:GEO.sweepProfile([fa,fb],profF,true),mat:'rafter'});
      /* 花架椽／脑椽：自正心桁经金桁至近雷公柱（随举架折线） */
      if(j%2===0&&Math.abs(u)<0.82){
        var tJ=1-(P.jinR/P.R);
        var qa=offsetY(roofPoint(P,i,ui,tHalf*1.02),-cd*0.55);
        var qm=offsetY(roofPoint(P,i,ui*0.66,tJ),-cd*0.55);
        var qb=offsetY(roofPoint(P,i,ui*0.30,0.94),-cd*0.50);
        up.push({g:GEO.sweepProfile([qa,qm,qb],profC,true),mat:'rafter'});
      }
    }
    A.part('chuan',{name:'檐椽·'+dirName(i),term:'YAN CHUAN · 檐椽',cat:'大木作',label:i===0,
      size:'椽径 '+fmt(cd,3)+'m　椽中距 '+fmt(gap,3)+'m　共 '+cnt+' 根',
      tag:['椽档一椽径'],
      desc:'搁于正心桁与挑檐桁之上、构成出檐坡面的基本杆件。椽径与椽档皆由模数决定：'+
        '本代椽径 '+fmt(cd,3)+'m，故椽当密度与斗栱疏密同步变化——用材愈小则椽愈密。'},eY);
    A.part('chuan',{name:'翼角椽·'+dirName(i),term:'YI JIAO CHUAN · 翼角椽',cat:'大木作',label:i===0,
      size:'共 '+fan+' 根（放射排列）',tag:['翼角放射'],
      desc:'转角段的檐椽。其后尾聚拢于角梁两侧，前端随檐口平面曲线逐根外移并抬高，'+
        '呈扇形放射，是翼角"冲出、起翘"得以成立的构造基础。本代冲出 '+fmt(P.chong,2)+
        'm、起翘 '+fmt(P.qiqiao,2)+'m。'},wY);
    A.part('chuan',{name:'飞椽·'+dirName(i),term:'FEI CHUAN · 飞椽',cat:'大木作',
      size:'共 '+(nPer+1)+' 根',tag:['二次出檐'],

    /* 望板 */
    var wb=[],seg=10,tv=[0,0.16,0.34,0.55,0.78,1.0];

        '角梁的构造层次，是"彻上明造"观察梁架的最佳位置。'},wb);
    /* 小连檐 + 大连檐 + 瓦口 */

    lc.push({g:GEO.sweepProfile(pth2,[[-cd*0.34,-cd*0.30],[cd*0.34,-cd*0.30],[cd*0.34,cd*0.44],[-cd*0.34,cd*0.44]],true),mat:'rafter'});

        '大连檐之上再钉瓦口以承檐头筒瓦、滴水，檐口的优美曲线全由此二件"放线"而成。'},lc);
  }

/* ==================================================================================
   十四、瓦作：筒瓦垄 · 瓦当滴水 · 垂脊 · 宝顶
   ================================================================================== */
function buildRoofing(A,P){
  var d=A.dyn,f=P.f,i,j,k;
  var uMax=0.965,tStop=0.88;
  var nWa=Math.max(6,Math.round(2*uMax*(P.R+P.chong)/P.waPitch));
  var ww=P.waPitch*0.52,wh=ww*0.46;
  var profWa=[[-ww/2,0],[-ww*0.39,wh*0.72],[0,wh],[ww*0.39,wh*0.72],[ww/2,0]];

  for(i=0;i<4;i++){
    var lu=[],dang=[];
    for(j=0;j<=nWa;j++){
      var u=-uMax+2*uMax*j/nWa;
      var path=[],sc=[],steps=7;
      for(k=0;k<=steps;k++){
        var t=tStop*k/steps;
        path.push(roofPoint(P,i,u,t));
        sc.push(1-0.92*t);
      }
      lu.push({g:GEO.sweepProfile(path,profWa,true,sc),mat:'tile'});
      /* 檐头瓦当（筒瓦头）与滴水 */
      var e0=roofPoint(P,i,u,0.006),e1=roofPoint(P,i,u,0.055);
      dang.push({g:GEO.sweepProfile([e0,e1],
        [[-ww*0.60,0],[-ww*0.45,wh*0.86],[0,wh*1.18],[ww*0.45,wh*0.86],[ww*0.60,0]],true),
        mat:(d.id==='qing')?'trim':'tile'});
      if(j<nWa){
        var um=u+uMax/nWa;
        var s0=roofPoint(P,i,um,-0.020),s1=roofPoint(P,i,um,0.030);
        dang.push({g:GEO.sweepProfile([s0,s1],
          [[-P.waPitch*0.40,0],[-P.waPitch*0.26,-wh*0.55],[P.waPitch*0.26,-wh*0.55],[P.waPitch*0.40,0]],true),
          mat:(d.id==='qing')?'trim':'tile'});
      }
    }
    A.part('wa',{name:'筒瓦垄·'+dirName(i),term:'TONG WA · 盖瓦',cat:'瓦作',label:i===0,
      size:'共 '+(nWa+1)+' 垄　垄中距 '+fmt(P.waPitch,3)+'m',tag:[d.tileName],
      desc:'底瓦仰铺、盖瓦（筒瓦）覆于两垄底瓦接缝之上，形成"一仰一合"的防水层。'+
        '瓦垄向宝顶方向渐次收窄（赶垄），故攒尖屋面的瓦垄并非平行而是放射汇聚。'+
        '本代用 '+d.tileName+'，垄距 '+fmt(P.waPitch,3)+'m 亦由模数派生。'},lu);
    A.part('wa',{name:'瓦当滴水·'+dirName(i),term:'WA DANG / DI SHUI',cat:'瓦作',
      size:'檐头一周　'+(nWa*2)+' 件',
      desc:'檐口收头。筒瓦端头封以瓦当（勾头），底瓦端头出滴水，'+
        '使雨水沿滴水尖端脱离檐口而不倒流入椽望，同时形成檐下齿状阴影线。'},dang);
  }

  /* --- 垂脊 ×4（沿由戗／角梁线） --- */
  var rw=P.waPitch*1.5,rh=P.waPitch*1.15;
  var profJi=[[-rw/2,0],[-rw/2,rh*0.42],[-rw*0.30,rh*0.82],[0,rh],[rw*0.30,rh*0.82],[rw/2,rh*0.42],[rw/2,0]];
  for(i=0;i<4;i++){
    var jp=[],js=[];
    for(k=0;k<=8;k++){
      var tt=0.012+(tStop-0.012)*k/8;
      jp.push(offsetY(hipPoint(P,i,tt),wh*0.5));
      js.push(1-0.80*tt);
    }
    var je=[{g:GEO.sweepProfile(jp,profJi,true,js),mat:'ridge'}];
    /* 明清垂脊小兽与套兽 */
    if(d.id==='ming'||d.id==='qing'){
      for(k=1;k<=3;k++){
        var pB=offsetY(hipPoint(P,i,0.05+k*0.075),wh*0.5+rh*0.55);
        je.push({g:GEO.taper(rw*0.34,rw*0.34,rw*0.44,rw*0.44,rh*0.62),mat:'ridge',
          m:mPos(pB.x,pB.y,pB.z)});
      }
      var pT=offsetY(hipPoint(P,i,-0.01),wh*0.5);
      je.push({g:GEO.lathe([[0,0],[rw*0.42,0],[rw*0.36,rh*0.5],[rw*0.16,rh*0.85],[0,rh*0.9]],8),
        mat:'metal',m:mPos(pT.x,pT.y,pT.z)});
    }
    A.part('wa',{name:'垂脊·'+corners(P)[i].name,term:'CHUI JI · 垂脊',cat:'瓦作',label:i===0,
      size:'长 '+fmt(hipPoint(P,i,0).distanceTo(hipPoint(P,i,tStop)),2)+'m',
      tag:(d.id==='ming'||d.id==='qing')?['垂兽','套兽']:['素脊'],
      desc:'覆压于由戗（角梁）之上、自宝顶斜下至翼角的脊，是四坡屋面的分界与防水收口。'+
        ((d.id==='ming'||d.id==='qing')?'明清于脊上安垂兽、脊端安套兽，兼作钉帽以护角梁端头。'
                                       :'唐宋垂脊多素砌，仅以筒瓦叠压，轮廓简洁。')},je);
  }

  /* --- 宝顶 --- */
  var br=P.R*0.13,bh=P.baodingH;
  var seat=[[0,0],[br,0],[br*0.96,bh*0.08],[br*0.80,bh*0.13],[br*0.86,bh*0.19],[br*0.70,bh*0.24]];
  var body;
  if(d.id==='tang'){        // 唐：素朴火焰宝顶
    body=[[br*0.70,bh*0.24],[br*0.52,bh*0.34],[br*0.60,bh*0.46],[br*0.40,bh*0.62],
          [br*0.22,bh*0.80],[br*0.10,bh*0.94],[0,bh]];
  }else if(d.id==='song'){  // 宋：陶质宝珠
    body=[[br*0.70,bh*0.24],[br*0.48,bh*0.32],[br*0.62,bh*0.48],[br*0.56,bh*0.62],
          [br*0.30,bh*0.74],[br*0.34,bh*0.84],[br*0.12,bh*0.95],[0,bh]];
  }else if(d.id==='yuan'){  // 元：砖砌叠涩
    body=[[br*0.70,bh*0.24],[br*0.66,bh*0.36],[br*0.50,bh*0.38],[br*0.46,bh*0.52],
          [br*0.34,bh*0.55],[br*0.30,bh*0.72],[br*0.14,bh*0.86],[0,bh]];
  }else if(d.id==='ming'){  // 明：琉璃宝顶
    body=[[br*0.70,bh*0.24],[br*0.44,bh*0.30],[br*0.64,bh*0.44],[br*0.66,bh*0.56],
          [br*0.40,bh*0.68],[br*0.24,bh*0.76],[br*0.30,bh*0.82],[br*0.10,bh*0.96],[0,bh]];
  }else{                    // 清：多层鎏金宝顶
    body=[[br*0.70,bh*0.22],[br*0.50,bh*0.27],[br*0.74,bh*0.34],[br*0.52,bh*0.42],
          [br*0.68,bh*0.50],[br*0.62,bh*0.60],[br*0.34,bh*0.70],[br*0.40,bh*0.76],
          [br*0.20,bh*0.84],[br*0.24,bh*0.89],[br*0.07,bh*0.97],[0,bh]];
  }
  A.part('wa',{name:'宝顶',term:'BAO DING · 攒尖宝顶',cat:'瓦作',label:true,
    size:'座径 '+fmt(br*2,2)+'m　总高 '+fmt(bh,2)+'m',tag:[d.dingName],
    desc:'攒尖之顶。宝顶座扣压四坡瓦垄与四条垂脊的交汇点，是全亭唯一的防水节点收头，'+
      '其下即雷公柱（枨杆）柱头。'+(d.id==='qing'?'清式宝顶层层叠珠、通体鎏金，装饰性最强。':
      d.id==='tang'?'唐代宝顶素朴，多作火焰或宝珠形，体量收敛。':'')},
    [{g:GEO.lathe(seat,10),mat:'ridge',m:mPos(0,P.yApex-P.chuanD*0.6,0)},
     {g:GEO.lathe(body,10),mat:(d.id==='qing'||d.id==='ming')?'metal':'ridge',
      m:mPos(0,P.yApex-P.chuanD*0.6,0)}]);
}

/* ==================================================================================
   十五、装修：倒挂楣子 · 坐凳楣子（明清园林亭榭做法）
   ================================================================================== */
function buildFurniture(A,P){
  var d=A.dyn;
  if(!d.meizi)return;
  var cs=corners(P),i,j,bw=P.colD*0.16;
  for(i=0;i<4;i++){
    var c0=colTopXZ(P,cs[i]),c1=colTopXZ(P,cs[(i+1)%4]);
    var mx=(c0.x+c1.x)/2,mz=(c0.z+c1.z)/2;
    var dx=c1.x-c0.x,dz=c1.z-c0.z,len=Math.sqrt(dx*dx+dz*dz),ang=Math.atan2(dx,dz);
    /* 倒挂楣子：额枋之下的透空棂条 */
    var mh=P.efH*1.5,inner=len-P.colR*2.1,e=[];
    e.push({g:GEO.box(bw,bw*1.4,inner),mat:'gong',m:mPos(0,-mh+bw*0.7,0)});
    var nb=Math.max(5,Math.round(inner/(P.colD*0.62)));
    for(j=0;j<=nb;j++){
      var z=-inner/2+inner*j/nb;
      e.push({g:GEO.box(bw*0.8,mh,bw*0.8),mat:'gong',m:mPos(0,-mh/2,z)});
      if(j<nb){
        var z2=z+inner/nb/2;
        e.push({g:GEO.box(bw*0.7,bw*0.7,inner/nb*0.92),mat:'gong',m:mPos(0,-mh*0.52,z2)});
        e.push({g:GEO.box(bw*0.7,mh*0.42,bw*0.7),mat:'gong',m:mPos(0,-mh*0.26,z2)});
      }
    }
    A.part('zhuangxiu',{name:'倒挂楣子·'+dirName(i),term:'DAO GUA MEI ZI',cat:'装修',label:i===0,
      size:'高 '+fmt(mh,2)+'m　棂条 '+fmt(bw,3)+'m　'+(nb+1)+' 档',tag:['明清园林做法'],
      desc:'悬挂于额枋之下的透空木格，两端以榫入柱。虽为装修构件，其棂条网格实际对额枋起'+
        '轻微的抗剪支撑，并在视觉上压低檐口、界定亭内空间。'},e)
      .group.applyMatrix4(compose(mx,P.colTop-P.efH,mz,0,ang,0));
    /* 坐凳楣子：南面（0）留作出入，其余三面设坐凳 */
    if(i!==0){
      var sh=P.colH*0.115,e2=[],inn2=len-P.colR*2.1;
      e2.push({g:GEO.box(P.colD*0.62,bw*1.6,inn2),mat:'gong',m:mPos(0,sh,0)});
      var np=3;
      for(j=0;j<np;j++){
        var zz=-inn2/2+inn2*(j+0.5)/np;
        e2.push({g:GEO.box(bw*1.4,sh,bw*1.4),mat:'gong',m:mPos(0,sh/2,zz)});
      }
      e2.push({g:GEO.box(bw,bw,inn2),mat:'gong',m:mPos(0,sh*0.45,0)});
      A.part('zhuangxiu',{name:'坐凳楣子·'+dirName(i),term:'ZUO DENG MEI ZI',cat:'装修',
        size:'凳面高 '+fmt(sh,2)+'m　宽 '+fmt(P.colD*0.62,2)+'m',tag:['明清园林做法'],
        desc:'柱间的固定坐凳，兼作亭下部的水平联系构件（类似"地栿"），'+
          '把四柱柱脚在低位再箍一道，对减小柱脚位移颇有实效。南面不设以便出入。'},e2)
        .group.applyMatrix4(compose(mx,P.y0,mz,0,ang,0));
    }
  }
}

/* ==================================================================================
   十六、总装配
   ================================================================================== */
Assembly.prototype.finalize=function(){
  this.root.updateMatrixWorld(true);
  var b=new THREE.Box3(),i;
  for(i=0;i<this.parts.length;i++){
    var p=this.parts[i];
    b.setFromObject(p.group);
    if(!b.isEmpty()){
      p.center=b.getCenter(new THREE.Vector3());
      p.top=b.max.y; p.bottom=b.min.y;
    }
    p.home=p.group.position.clone();
    var rx=p.center.x,rz=p.center.z,rl=Math.sqrt(rx*rx+rz*rz);
    p.radial=(rl>1e-4)?V3(rx/rl,0,rz/rl):V3(0,0,0);
  }
  this.bbox=new THREE.Box3().setFromObject(this.root);
  return this;
};

function assemble(dyn){
  var P=derive(dyn),A=new Assembly(dyn);
  A.P=P;
  buildBase(A,P);
  buildPlinth(A,P);
  buildColumns(A,P);
  buildArchitrave(A,P);
  buildDougongLayer(A,P);
  buildPurlins(A,P);
  buildFrame(A,P);
  buildRafters(A,P);
  buildRoofing(A,P);
  buildFurniture(A,P);
  return A.finalize();
}

function buildEnvironment(){

/* ==================================================================================
   十八、自研轨道相机（无外部控制器依赖）
   ================================================================================== */
function Orbit(cam,dom){
  this.cam=cam;this.dom=dom;
  this.target=V3(0,2.2,0);this.theta=0.72;this.phi=1.12;this.dist=13;
  this.tTarget=this.target.clone();this.tTheta=this.theta;this.tPhi=this.phi;this.tDist=this.dist;
  this.minPhi=0.06;this.maxPhi=Math.PI-0.06;this.minDist=1.4;this.maxDist=60;
  this.damp=0.16;this.drag=null;this.moved=0;this.autoSpin=0;
  var self=this;
  function pos(e){return {x:e.clientX,y:e.clientY};}
  dom.addEventListener('contextmenu',function(e){e.preventDefault();});
  dom.addEventListener('pointerdown',function(e){
    dom.setPointerCapture&&dom.setPointerCapture(e.pointerId);
    self.drag={btn:e.button,x:e.clientX,y:e.clientY};self.moved=0;
  });
  window.addEventListener('pointermove',function(e){
    if(!self.drag)return;
    var dx=e.clientX-self.drag.x,dy=e.clientY-self.drag.y;
    self.drag.x=e.clientX;self.drag.y=e.clientY;
    self.moved+=Math.abs(dx)+Math.abs(dy);
    if(self.drag.btn===0&&!e.shiftKey){
      self.tTheta-=dx*0.0062;
      self.tPhi=clamp(self.tPhi-dy*0.0062,self.minPhi,self.maxPhi);
    }else{
      var k=self.tDist*0.0016;
      var right=V3(Math.cos(self.tTheta),0,-Math.sin(self.tTheta));
      var upv=V3(0,1,0);
      self.tTarget.addScaledVector(right,-dx*k);
      self.tTarget.addScaledVector(upv,dy*k);
    }
  });
  window.addEventListener('pointerup',function(e){
    if(self.drag&&self.moved<5&&self.drag.btn===0)onPick(e);
    self.drag=null;
  });
  dom.addEventListener('wheel',function(e){
    e.preventDefault();
    var s=Math.pow(1.0016,e.deltaY);
    self.tDist=clamp(self.tDist*s,self.minDist,self.maxDist);
  },{passive:false});
  dom.addEventListener('dblclick',function(){ if(!state.sel)viewPreset('reset'); });
}
Orbit.prototype.set=function(theta,phi,dist,tgt){
  this.tTheta=theta;this.tPhi=phi;this.tDist=dist;
  if(tgt)this.tTarget.copy(tgt);
};
Orbit.prototype.update=function(dt){
  if(state.autoRotate&&!this.drag)this.tTheta+=dt*0.16;
  var k=1-Math.pow(1-this.damp,dt*60);
  this.theta+=(this.tTheta-this.theta)*k;
  this.phi+=(this.tPhi-this.phi)*k;
  this.dist+=(this.tDist-this.dist)*k;
  this.target.lerp(this.tTarget,k);
  var sp=Math.sin(this.phi);
  this.cam.position.set(
    this.target.x+this.dist*sp*Math.sin(this.theta),
    this.target.y+this.dist*Math.cos(this.phi),
    this.target.z+this.dist*sp*Math.cos(this.theta));
  this.cam.lookAt(this.target);
};
var orbit=null;

function viewPreset(k){
  if(!current)return;
  var P=current.P,h=P.total;
  if(k==='reset')orbit.set(0.72,1.12,mode==='compare'?34:h*1.85,V3(0,h*0.42,0));
  else if(k==='front')orbit.set(0,1.30,h*1.75,V3(0,h*0.44,0));
  else if(k==='iso')orbit.set(0.78,0.86,h*1.7,V3(0,h*0.46,0));
  else if(k==='up')orbit.set(0.9,2.45,h*0.95,V3(0,P.yZhengTop*0.94,0));
}

   十九、可见性 · 分层拆解 · 剖切 · 拾取
   ================================================================================== */
function eachAssembly(fn){
  if(mode==='compare'){for(var k in cache)if(cache[k].inScene)fn(cache[k]);}
  else if(current)fn(current);
}
function applyVisibility(){
  eachAssembly(function(A){
    for(var i=0;i<A.layerList.length;i++){
      var rec=A.layerList[i],id=rec.def.id;
      var vis=!state.hidden[id]&&(state.iso===null||state.iso===id);
      rec.group.visible=vis&&rec.parts.length>0;
    }
  });
}
function layerFactor(i){
  if(state.seq<0)return 1;
  var local=clamp((state.seq-i*0.075)/0.34,0,1);
  return 1-local;
}
function applyExplode(){
  var base=state.explode/100;
  eachAssembly(function(A){
    for(var i=0;i<A.parts.length;i++){
      var p=A.parts[i],rec=A.layers[p.layer],L=rec.def,idx=rec.idx;
      var t=(state.seq>=0)?layerFactor(idx):base;
      p.group.position.set(
        p.home.x+p.radial.x*L.rad*t,
        p.home.y+L.gap*t,
        p.home.z+p.radial.z*L.rad*t);
    }
  });
}
function applyClip(){
  if(state.clipMode==='none'){CLIP.constant=1000;return;}
  var P=current?current.P:null,ext=P?P.R+0.6:4;
  var v=(state.clipPos/100)*2*ext-ext;
  if(state.clipMode==='x')CLIP.normal.set(-1,0,0);
  else CLIP.normal.set(-Math.SQRT1_2,0,-Math.SQRT1_2);
  CLIP.constant=v;
}
function applyWire(){
  for(var k in cache){
    var A=cache[k];
    for(var m in A.mats)A.mats[m].wireframe=state.wire;
  }
  HL_SEL.wireframe=state.wire;HL_HOV.wireframe=state.wire;
}
function applyShadow(){
  renderer.shadowMap.enabled=state.shadow;
  for(var k in cache){
    var A=cache[k];
    for(var m in A.mats)A.mats[m].needsUpdate=true;
  }
  renderer.shadowMap.needsUpdate=true;
}

function setMat(part,mat){
  part.group.traverse(function(o){
    if(o.isMesh)o.material=mat||o.userData.mat0;
  });
}
function selectPart(p){
  if(state.sel&&state.sel!==p)setMat(state.sel,null);
  state.sel=p;
  if(p){setMat(p,HL_SEL);showPartInfo(p);}
  else showPartInfo(null);
}
function hoverPart(p){
  if(state.hover&&state.hover!==state.sel)setMat(state.hover,null);
  state.hover=p;
  if(p&&p!==state.sel)setMat(p,HL_HOV);
  canvasEl.style.cursor=p?'pointer':'default';
}
var ray=null,ndc=null;
function pickAt(cx,cy){
  var r=canvasEl.getBoundingClientRect();
  ndc.x=((cx-r.left)/r.width)*2-1;
  ndc.y=-((cy-r.top)/r.height)*2+1;
  ray.setFromCamera(ndc,camera);
  var roots=[];
  eachAssembly(function(A){roots.push(A.root);});
  if(!roots.length)return null;
  var hits=ray.intersectObjects(roots,true);
  for(var i=0;i<hits.length;i++){
    var o=hits[i].object;
    while(o){ if(o.userData&&o.userData.part)return o.userData.part; o=o.parent; }
  }
  return null;
}
function onPick(e){
  var p=pickAt(e.clientX,e.clientY);
  selectPart(p);
  if(p){
    var live=livePos(p);
    orbit.tTarget.lerp(live,0.42);
  }
}
function livePos(p){
  var d=new THREE.Vector3().subVectors(p.group.position,p.home);
  var w=p.center.clone().add(d);
  var root=p.group.parent&&p.group.parent.parent;
  if(root)w.add(root.position);
  return w;
}
function homePos(p){
  var w=p.center.clone();
  var root=p.group.parent&&p.group.parent.parent;
  if(root)w.add(root.position);
  return w;
}

  pair[0].userData.sep=V3();pair[1].userData.sep=(J.sep instanceof THREE.Vector3)?J.sep:V3(J.sep[0],J.sep[1],J.sep[2]);
  var R=A.union(B).getBoundingSphere(new THREE.Sphere()).radius;
