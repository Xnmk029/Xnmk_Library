<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>四角攒尖亭 · 木构营造与朝代演变</title>
<style>
  :root{
    --bg:#1c2230; --panel:rgba(20,26,38,.86); --line:#3a465c;
    --txt:#e7ecf4; --sub:#9fb0c8; --accent:#d9a25e; --accent2:#6fb1c7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
  #app{position:fixed;inset:0}
  canvas{display:block}
  /* 左侧控制面板 */
  #panel{position:fixed;top:12px;left:12px;width:296px;max-height:calc(100% - 24px);
    overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px 14px 16px;backdrop-filter:blur(8px);font-size:13px;z-index:10;}
  #panel h1{font-size:16px;margin:0 0 2px;letter-spacing:1px}
  #panel .desc{color:var(--sub);font-size:11px;line-height:1.5;margin:0 0 10px}
  .group{border-top:1px solid var(--line);padding:10px 0 4px;margin-top:4px}
  .group h2{font-size:12px;margin:0 0 8px;color:var(--accent);letter-spacing:.5px}
  .row{display:flex;align-items:center;justify-content:space-between;margin:7px 0;gap:8px}
  .row label{color:var(--sub);flex:0 0 auto}
  select,button{background:#222c3e;color:var(--txt);border:1px solid var(--line);
    border-radius:7px;padding:6px 8px;font-size:12px;cursor:pointer}
  select{flex:1}
  button:hover,select:hover{border-color:var(--accent)}
  input[type=range]{flex:1;accent-color:var(--accent)}
  .val{color:var(--accent2);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .btns button{flex:1;min-width:64px}
  .toggle{display:flex;align-items:center;gap:6px;color:var(--sub);cursor:pointer}
  .toggle input{accent-color:var(--accent)}
  /* 朝代对比数据表 */
  #eraTable{width:100%;border-collapse:collapse;font-size:11px;margin-top:6px}
  #eraTable th,#eraTable td{border:1px solid var(--line);padding:3px 4px;text-align:center}
  #eraTable th{color:var(--accent);font-weight:600}
  #eraTable td .b{color:var(--accent2)}
  /* 构件信息卡 */
  #info{position:fixed;right:12px;bottom:12px;width:300px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:14px;backdrop-filter:blur(8px);
    display:none;z-index:10}
  #info h3{margin:0 0 4px;font-size:15px;color:var(--accent)}
  #info .term{font-size:11px;color:var(--accent2);margin-bottom:8px}
  #info .fn{font-size:12px;line-height:1.6;color:var(--txt)}
  #info .close{position:absolute;top:8px;right:10px;cursor:pointer;color:var(--sub)}
  /* 图例 */
  #legend{position:fixed;right:12px;top:12px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;font-size:11px;color:var(--sub);z-index:10;max-width:230px}
  #legend b{color:var(--txt)}
  #hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:var(--sub);
    font-size:11px;background:var(--panel);border:1px solid var(--line);padding:6px 12px;
    border-radius:20px;z-index:10}
  .pill{display:inline-block;padding:1px 7px;border:1px solid var(--line);border-radius:10px;margin:2px}
</style>
</head>
<body>
<div id="app"></div>

<div id="panel">
  <h1>四角攒尖亭</h1>
  <p class="desc">Low-poly 程序化木构营造 · 朝代形制演变 · 分层解构观察</p>

  <div class="group">
    <h2>朝代形制</h2>
    <div class="row">
      <label>主视图</label>
      <select id="eraMain"></select>
    </div>
    <div class="row">
      <label>对比视图</label>
      <select id="eraCompare">
        <option value="none">— 关闭并置 —</option>
      </select>
    </div>
    <p class="desc" id="eraName" style="margin:2px 0 0"></p>
  </div>

  <div class="group">
    <h2>分层解构（拆解度）</h2>
    <div class="row">
      <label>整体</label>
      <input type="range" id="explode" min="0" max="100" value="0">
      <span class="val" id="explodeVal">0%</span>
    </div>
    <div class="row btns">
      <button id="btnReset">复位归位</button>
      <button id="btnIsolate">隔离模式</button>
    </div>
    <p class="desc">拖动滑块自台基向宝顶分层抬升，逐层暴露内部榫卯与梁架关系。</p>
  </div>

  <div class="group">
    <h2>层级显隐 / 辅助观察</h2>
    <div id="layerToggles"></div>
    <div class="row" style="margin-top:8px">
      <label class="toggle"><input type="checkbox" id="cbWire"> 线框</label>
      <label class="toggle"><input type="checkbox" id="cbClip"> 剖切</label>
    </div>
  </div>

  <div class="group">
    <h2>朝代结构参数对照</h2>
    <table id="eraTable"></table>
    <p class="desc" id="trendNote" style="margin-top:6px"></p>
  </div>
</div>

<div id="legend">
  <b>承托链条（自下而上）</b><br>
  <span class="pill">台基·柱础</span><span class="pill">檐柱</span><span class="pill">额枋·平板枋</span><br>
  <span class="pill">斗栱（柱/平身/转角）</span><span class="pill">梁架·雷公柱</span><br>
  <span class="pill">椽望</span><span class="pill">瓦作·宝顶</span><br>
  <span style="color:var(--accent)">点击构件</span>查看术语与功能。
</div>

<div id="info">
  <span class="close" id="infoClose">✕</span>
  <h3 id="infoName">构件</h3>
  <div class="term" id="infoTerm"></div>
  <div class="fn" id="infoFn"></div>
</div>

<div id="hint">左键旋转 · 右键平移 · 滚轮缩放 · 点击构件查看说明</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =========================================================================
   一、营造参数体系（材分制 / 斗口制）
   ------------------------------------------------------------------------
   以"材"为模数基准：材宽 = 斗口 k。各朝代以同一斗口基准，按《营造法式》
   材分°与清代斗口制的相对关系定义比例，使构件尺度、斗栱比例、出檐与举架
   随朝代发生可核验的数值变化。
   ========================================================================= */
const ERAS = {
  tang: {
    key:'tang', name:'唐', approx:'（如佛光寺东大殿意象）',
    douKou: 1.0,          // 斗口相对模数（基准=1）
    columnH: 9.0,         // 柱高（单位：斗口k）
    columnD: 0.92,        // 柱径
    eaveOut: 4.6,         // 檐出（出檐深远）
    riseRatio: 0.28,      // 举高/进深（平缓）
    douHeightRatio: 0.55, // 斗栱高/柱高（唐宋大）
    bujian: 1,            // 平身科攒数（疏朗）
    angType:'批竹昂',      // 昂形制
    roofCurve:'举折平缓',
    woodColor:0xb07a40, tileColor:0x6f7a86, baseColor:0x8a8f96
  },
  song: {
    key:'song', name:'宋', approx:'（《营造法式》材分°）',
    douKou: 0.95, columnH: 8.6, columnD: 0.85, eaveOut: 4.2,
    riseRatio: 0.32, douHeightRatio: 0.50, bujian: 1, angType:'琴面昂',
    roofCurve:'举折', woodColor:0xb98a4d, tileColor:0x77828f, baseColor:0x9097a0
  },
  yuan: {
    key:'yuan', name:'元', approx:'（过渡期）',
    douKou: 0.9, columnH: 8.2, columnD: 0.80, eaveOut: 3.8,
    riseRatio: 0.36, douHeightRatio: 0.42, bujian: 2, angType:'琴面昂',
    roofCurve:'举折→举架', woodColor:0xbe8f52, tileColor:0x79848f, baseColor:0x939aa3
  },
  ming: {
    key:'ming', name:'明', approx:'（官式过渡）',
    douKou: 0.85, columnH: 7.8, columnD: 0.74, eaveOut: 3.4,
    riseRatio: 0.42, douHeightRatio: 0.34, bujian: 2, angType:'镏金斗栱',
    roofCurve:'举架', woodColor:0xc4914f, tileColor:0x7c8794, baseColor:0x969ca5
  },
  qing: {
    key:'qing', name:'清', approx:'（斗口制·清式）',
    douKou: 0.8, columnH: 7.4, columnD: 0.68, eaveOut: 3.0,
    riseRatio: 0.50, douHeightRatio: 0.28, bujian: 3, angType:'镏金斗栱',
    roofCurve:'举架陡峻', woodColor:0xc9954b, tileColor:0x818c98, baseColor:0x999fa8
  }
};
const ERA_ORDER = ['tang','song','yuan','ming','qing'];

/* 全局场景模数：将"斗口k"映射到世界单位（米）。取清式约 0.1m 量级。 */
const K_UNIT = 0.10; // 1 斗口(k) = 0.10 米（世界单位）

/* =========================================================================
   二、复用构件库：创建可区分的 Low-poly 部件 + 用户数据（术语/功能/层级）
   ========================================================================= */
let raycaster, pointer;
const pickables = [];      // 可被拾取的 mesh
const layerGroups = {};    // 层级 -> Group
const LAYERS = [
  {id:'base',   name:'台基·柱础'},
  {id:'column', name:'檐柱'},
  {id:'architrave', name:'额枋·平板枋'},
  {id:'dougong', name:'斗栱铺作'},
  {id:'frame',  name:'梁架·雷公柱'},
  {id:'roofwood', name:'椽望翼角'},
  {id:'tile',   name:'瓦作·宝顶'}
];
const LAYER_INDEX = {}; LAYERS.forEach((l,i)=>LAYER_INDEX[l.id]=i);

const partInfo = {}; // mesh.uuid -> {name,term,fn,layer}

function reg(mesh, name, term, fn, layer){
  mesh.userData.partName = name;
  mesh.userData.term = term;
  mesh.userData.fn = fn;
  mesh.userData.layer = layer;
  partInfo[mesh.uuid] = {name,term,fn,layer};
  pickables.push(mesh);
  return mesh;
}

/* 平面着色材质（Low-poly 关键） */
function mat(color, opts={}){
  return new THREE.MeshStandardMaterial({
    color, flatShading:true, roughness:0.85, metalness:0.02, ...opts
  });
}
function woodMat(c, opts={}){ return mat(c, opts); }

/* ---- 通用几何辅助 ---- */
function box(w,h,d,cx,cy,cz, mat, name, term, fn, layer){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(cx,cy,cz);
  reg(m,name,term,fn,layer);
  return m;
}

/* 斗（栌斗/坐斗、散斗、交互斗）—— 上窄下宽的倒梯形 low-poly */
function makeDou(width, height, depth, topRatio, color){
  const g = new THREE.BoxGeometry(width, height, depth);
  // 倒梯形：顶窄底宽
  const p = g.attributes.position;
  for(let i=0;i<p.count;i++){
    const y = p.getY(i);
    if(y > 0){ // 上半部内收
      p.setX(i, p.getX(i)*topRatio);
      p.setZ(i, p.getZ(i)*topRatio);
    }
  }
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat(color));
  return m;
}

/* 栱（华栱/泥道栱/令栱等）—— 长条形带卷杀感（用 box + 两端小斗座） */
function makeGong(len, h, w, color){
  const grp = new THREE.Group();
  const m = new THREE.Mesh(new THREE.BoxGeometry(len, h, w), mat(color));
  grp.add(m);
  return grp;
}

/* 榫卯：在构件之间附加可见的榫头（凸）与卯口（凹以深色块示意） */
const MORTISE_INFO = {
  yanwei:  {name:'燕尾榫', term:'燕尾榫（银锭榫）', fn:'用于拉结额枋与柱头，榫头外大内小，抗拉拔、防脱榫。'},
  mantou:  {name:'馒头榫', term:'馒头榫', fn:'柱头顶部凸出的半圆形榌头，插入平板枋/栌斗底卯口，定位并传递竖向荷载。'},
  gutou:   {name:'箍头榉', term:'箍头榫（箍头）', fn:'额枋两端做箍头扣抱柱头，与柱头十字相交，增强水平拉结。'},
  dazhang: {name:'搭掌榫', term:'搭掌榫（榫接搭交）', fn:'角梁/由戗端部以斜面搭接咬合，传递翼角斜向推力。'},
  shizi:   {name:'十字搭交榫', term:'十字搭交榫', fn:'柱头科/转角科中栌斗与正侧两面栱十字相交，榫卯咬合承挑转角荷载。'},
  chuan:   {name:'透榫', term:'透榫（大进小出）', fn:'梁端穿透柱身以榫卯固定，形成梁柱刚接承托体系。'}
};

/* 生成一对可见榫卯（凸榫 + 卯口深色块），放于指定位置/朝向 */
function addTenon(group, type, color, pos, size, axis='y', matWood){
  const info = MORTISE_INFO[type];
  const s = size;
  // 凸榫：小长方体，燕尾榫用上宽下窄表示
  let tenonGeo;
  if(type==='yanwei'){
    tenonGeo = new THREE.BoxGeometry(s*1.3, s*0.8, s*0.6);
    const p = tenonGeo.attributes.position;
    for(let i=0;i<p.count;i++){ if(p.getY(i)>0){p.setX(i,p.getX(i)*0.6);} }
    tenonGeo.computeVertexNormals();
  } else if(type==='mantou'){
    tenonGeo = new THREE.SphereGeometry(s*0.5, 6, 4, 0, Math.PI*2, 0, Math.PI/2);
  } else {
    tenonGeo = new THREE.BoxGeometry(s, s*0.8, s);
  }
  const tenon = new THREE.Mesh(tenonGeo, matWood);
  // 卯口：深色凹块示意（比榫略大，半透明）
  const mort = new THREE.Mesh(new THREE.BoxGeometry(s*1.5, s, s*1.5),
    new THREE.MeshStandardMaterial({color:0x2a2018, flatShading:true, roughness:1, transparent:true, opacity:0.55}));
  if(axis==='y'){ tenon.position.set(0, s*0.4, 0); mort.position.set(0, -s*0.2, 0); }
  if(axis==='x'){ tenon.rotation.z = Math.PI/2; mort.rotation.z = Math.PI/2; tenon.position.set(s*0.3,0,0); }
  tenon.position.add(pos); mort.position.add(pos);
  group.add(tenon, mort);
  reg(tenon, info.name, info.term, info.fn, 'frame');
  return {tenon, mort};
}

/* =========================================================================
   三、单座四角攒尖亭构建器（参数化）
   ------------------------------------------------------------------------
   输入 era 参数，输出一个 THREE.Group（世界坐标以原点为亭心，台基底面 y=0）
   ========================================================================= */
function buildPavilion(era){
  const G = new THREE.Group();
  const k = K_UNIT * era.douKou;          // 本朝代斗口世界尺寸
  const colH = era.columnH * k;           // 柱高
  const colD = era.columnD * k;           // 柱径
  const eaveOut = era.eaveOut * k;        // 檐出
  const halfSpan = 3.0 * k;               // 亭心到柱中（面阔半）
  const douH = era.douHeightRatio * colH; // 斗栱总高（唐大→清小）
  const woodC = era.woodColor, tileC = era.tileColor, baseC = era.baseColor;
  const wm = (c=woodC, o={})=>woodMat(c,o);

  /* ---- 层级组 ---- */
  const lg = {};
  LAYERS.forEach(l=>{ const g=new THREE.Group(); g.userData.layer=l.id; lg[l.id]=g; G.add(g); layerGroups[l.id]=lg[l.id]; });

  /* ---------- 1. 台基 + 柱础 ---------- */
  const baseH = 0.6*k, baseW = (halfSpan+eaveOut)*2 + 1.2*k;
  const base = box(baseW, baseH, baseW, 0, baseH/2, 0, wm(baseC),
    '台基·素方阶基', '台基（阶基）', '承托全亭荷载，防潮并界定台明高度，是承托链最底层。', 'base');
  lg.base.add(base);
  // 柱础（鼓镜/覆盆） 4 个
  const cornerX = [ halfSpan, -halfSpan, halfSpan, -halfSpan ];
  const cornerZ = [ halfSpan, halfSpan, -halfSpan, -halfSpan ];
  for(let i=0;i<4;i++){
    const cx = cornerX[i], cz = cornerZ[i];
    const zc = new THREE.Mesh(new THREE.CylinderGeometry(colD*0.85, colD*1.05, baseH*0.7, 8), mat(0x9a8f80));
    zc.position.set(cx, baseH + baseH*0.35, cz);
    reg(zc,'柱础·覆盆', '柱础（础石）', '置于台基之上，隔潮并增大柱底承压面，柱根馒头榫入其卯口。', 'base');
    lg.base.add(zc);
    // 柱础卯口（可见）
    const mort = new THREE.Mesh(new THREE.CylinderGeometry(colD*0.3, colD*0.3, baseH*0.3, 8),
      new THREE.MeshStandardMaterial({color:0x2a2018, flatShading:true, transparent:true, opacity:0.6}));
    mort.position.set(cx, baseH+baseH*0.7, cz);
    lg.base.add(mort);
  }

  /* ---------- 2. 檐柱（四面，含侧脚） ---------- */
  // 侧脚：柱头向亭心内倾（唐宋侧脚明显，明清减弱）
  const lean = (era.key==='tang'||era.key==='song') ? 0.06*k : 0.03*k;
  const columns=[];
  for(let i=0;i<4;i++){
    const cx = cornerX[i], cz = cornerZ[i];
    const col = new THREE.Mesh(new THREE.CylinderGeometry(colD*0.5, colD*0.52, colH, 10), wm(woodC));
    // 侧脚：柱顶向中心偏移
    const tx = cx*0.96, tz = cz*0.96;
    col.position.set((cx+tx)/2, baseH + colH/2, (cz+tz)/2);
    // 倾斜
    col.rotation.z = -(tx-cx)/colH;
    col.rotation.x = (tz-cz)/colH;
    reg(col,'檐柱', '檐柱（柱身）', '殿亭外围承重柱，自下承柱础、上托额枋与斗栱；顶部馒头榫插入栌斗底。', 'column');
    lg.column.add(col);
    columns.push({cx,cz,tx,tz});
    // 柱头馒头榫（可见）
    const mt = new THREE.Mesh(new THREE.SphereGeometry(colD*0.28, 8, 5, 0, Math.PI*2, 0, Math.PI/2), wm(0xc89a5e));
    mt.position.set(tx, baseH+colH, tz);
    reg(mt,'馒头榫（柱头）', MORTISE_INFO.mantou.term, MORTISE_INFO.mantou.fn, 'column');
    lg.column.add(mt);
  }

  /* ---------- 3. 额枋 + 平板枋（四面闭合） ---------- */
  const ringGeo = (a,b)=>{
    // a,b 端点
    return {a,b};
  };
  const barH = 0.55*k, barW = 0.45*k;
  // 四边（前后左右）连接四柱
  const edges = [
    [{x:columns[0].tx,z:columns[0].tz},{x:columns[2].tx,z:columns[2].tz}], // x=+ → x=- (z=+)
    [{x:columns[1].tx,z:columns[1].tz},{x:columns[3].tx,z:columns[3].tz}], // z=+ → z=- (x=-)
    [{x:columns[0].tx,z:columns[0].tz},{x:columns[1].tx,z:columns[1].tz}], // x=+ (z=+→-)
    [{x:columns[2].tx,z:columns[2].tz},{x:columns[3].tx,z:columns[3].tz}], // x=- (z=+→-)
  ];
  const efTop = baseH + colH;
  edges.forEach((e,idx)=>{
    const dx = e[1].x-e[0].x, dz = e[1].z-e[0].z;
    const len = Math.hypot(dx,dz);
    const ang = Math.atan2(dz,dx);
    const isZ = Math.abs(dz) > Math.abs(dx);
    const w = isZ? barW : len + barW;
    const d = isZ? len + barW : barW;
    const ex = (e[0].x+e[1].x)/2, ez=(e[0].z+e[1].z)/2;
    // 额枋（下层）
    const ef = new THREE.Mesh(new THREE.BoxGeometry(w, barH, d), wm(0xb98a4d));
    ef.position.set(ex, efTop - barH*0.6, ez);
    reg(ef, idx%2? '额枋（横向）':'额枋（纵向）', '额枋（阑额）', '联系檐柱、拉结柱网，两端做箍头榫扣抱柱头。', 'architrave');
    ef.rotation.y = ang;
    lg.architrave.add(ef);
    // 平板枋（上层，承栌斗）
    const pb = new THREE.Mesh(new THREE.BoxGeometry(w+0.1*k, 0.3*k, d+0.1*k), wm(0xc08f50));
    pb.position.set(ex, efTop + 0.15*k, ez);
    pb.rotation.y = ang;
    reg(pb, '平板枋', '平板枋（普拍枋）', '平置于额枋之上，承托栌斗，使斗栱安放平稳。', 'architrave');
    lg.architrave.add(pb);
    // 箍头榫（可见）：额枋端部小凸块扣柱
    const gt = new THREE.Mesh(new THREE.BoxGeometry(0.3*k, barH*0.9, 0.3*k), wm(0xc89a5e));
    const ex2 = e[0].x, ez2=e[0].z;
    gt.position.set(ex2, efTop - barH*0.6, ez2);
    reg(gt,'箍头榫', MORTISE_INFO.gutou.term, MORTISE_INFO.gutou.fn, 'architrave');
    lg.architrave.add(gt);
  });

  /* ---------- 4. 斗栱铺作（柱头科 / 平身科 / 转角科） ---------- */
  const dougongTop = efTop + 0.3*k; // 平板枋顶面
  const douBaseColor = 0xcaa063;
  function buildBracket(cx, cz, type){
    const g = new THREE.Group();
    g.position.set(cx, dougongTop, cz);
    // 栌斗（坐斗）：上窄下宽
    const luDou = makeDou(1.4*k, douH*0.28, 1.4*k, 0.7, douBaseColor);
    luDou.position.y = douH*0.14;
    g.add(luDou);
    reg(luDou, type==='corner'?'转角科·栌斗':'柱头科·栌斗', '栌斗（坐斗）', '斗栱最下之大斗，承上层栱昂；转角处与斜出栱十字搭交。', 'dougong');
    // 一跳华栱（沿45°或正交）
    const jump = douH*0.36;
    const gongLen = 2.4*k;
    const gongColor = 0xc79b58;
    // 正心泥道栱 + 华栱（简化两跳）
    for(let j=1;j<=2;j++){
      const gy = luDou.position.y + j*douH*0.22;
      const hg = makeGong(gongLen + j*0.6*k, 0.28*k, 0.5*k, gongColor);
      hg.position.set(0, gy, 0);
      g.add(hg.children[0]);
      reg(hg.children[0], type==='corner'?'转角科·华栱':'华栱（翘）', '华栱（抄/翘）', '自栌斗向外出跳的水平构件，逐跳承挑屋檐荷载。', 'dougong');
      // 散斗（每跳两端）
      [-1,1].forEach(s=>{
        const sd = makeDou(0.6*k, 0.22*k, 0.6*k, 0.7, douBaseColor);
        sd.position.set(s*(gongLen/2+j*0.3*k), gy+0.18*k, 0);
        g.add(sd);
        reg(sd,'散斗', '散斗（小斗）', '置于栱端，承托上一层栱昂与枋，分散集中荷载。', 'dougong');
      });
    }
    // 昂（唐批竹/宋琴面/明清镏金）—— 以斜置长条示意
    const ang = new THREE.Mesh(new THREE.BoxGeometry(2.0*k, 0.22*k, 0.5*k), wm(0xb88a45));
    ang.position.set(0, luDou.position.y + douH*0.5, 0);
    ang.rotation.z = -0.18;
    g.add(ang);
    reg(ang, '昂（'+era.angType+'）', '昂', '杠杆式斜挑构件，前端挑檐、后尾挑起，平衡出檐荷载。', 'dougong');
    // 令栱 + 耍头
    const lgong = makeGong(2.0*k, 0.26*k, 0.5*k, gongColor);
    lgong.position.set(0, luDou.position.y + douH*0.62, 0);
    g.add(lgong.children[0]);
    reg(lgong.children[0],'令栱', '令栱', '最外跳之栱，承托楣子与撩檐枋，封住斗栱外端。', 'dougong');
    const shuatou = new THREE.Mesh(new THREE.BoxGeometry(2.2*k, 0.24*k, 0.5*k), wm(0xb88a45));
    shuatou.position.set(0, luDou.position.y + douH*0.74, 0);
    shuatou.rotation.z = -0.05;
    g.add(shuatou);
    reg(shuatou,'耍头', '耍头（爵头）', '斗栱最外端之构件，外端出头作装饰并封挑檐。', 'dougong');
    // 转角科：加斜出栱（搭交）
    if(type==='corner'){
      const diag = makeGong(2.2*k, 0.28*k, 0.5*k, gongColor);
      diag.children[0].rotation.y = Math.PI/4;
      diag.position.set(0, luDou.position.y + douH*0.3, 0);
      g.add(diag.children[0]);
      reg(diag.children[0],'转角科·斜栱', '十字搭交栱', '转角处正侧两面栱斜交搭掌，以十字搭交榫咬合承挑翼角。', 'dougong');
      addTenon(g, 'shizi', gongColor, new THREE.Vector3(0, luDou.position.y,0), 0.35*k, 'y', wm(0xc89a5e));
    }
    // 柱头科/转角科可见十字搭交榫示意（栌斗与柱）
    if(type!=='flat'){
      addTenon(g, 'mantou', gongColor, new THREE.Vector3(0,-0.05*k,0), 0.3*k, 'y', wm(0xc89a5e));
    }
    return g;
  }
  // 4 柱头科
  for(let i=0;i<4;i++){
    lg.dougong.add(buildBracket(columns[i].tx, columns[i].tz, 'column'));
  }
  // 转角科（四角，与柱同位置但加斜栱）—— 实际四角即四柱，这里在四边中点做"平身科"
  // 平身科（补间铺作）：按朝代攒数在每边中点布置
  for(let e=0;e<4;e++){
    const a = edges[e][0], b = edges[e][1];
    for(let n=1;n<=era.bujian;n++){
      const t = n/(era.bujian+1);
      const px = a.x + (b.x-a.x)*t, pz = a.z + (b.z-a.z)*t;
      lg.dougong.add(buildBracket(px, pz, 'flat'));
    }
  }
  const bracketTop = dougongTop + douH;

  /* ---------- 5. 梁架（抹角梁/角梁 + 雷公柱 + 由戗） ---------- */
  const frameG = lg.frame;
  // 抹角梁：四角向中心斜搭
  const cxp = 0, czp = 0, topY = bracketTop + 0.2*k;
  for(let i=0;i<4;i++){
    const a = columns[i];
    const len = Math.hypot(cxp-a.tx, czp-a.tz);
    const mo = new THREE.Mesh(new THREE.BoxGeometry(len, 0.42*k, 0.5*k), wm(0xb5853f));
    mo.position.set(a.tx/2, topY, a.tz/2);
    mo.lookAt(new THREE.Vector3(cxp, topY, czp));
    mo.rotateY(Math.PI/2);
    reg(mo,'抹角梁', '抹角梁', '四角斜搭于斗栱之上，交汇于中心，承托雷公柱与攒尖骨架。', 'frame');
    frameG.add(mo);
  }
  // 雷公柱（攒尖顶点垂线柱）
  const leiH = 1.6*k * (1 + era.riseRatio);
  const lei = new THREE.Mesh(new THREE.CylinderGeometry(0.42*k,0.5*k, leiH, 8), wm(0xb5853f));
  lei.position.set(0, topY + leiH/2, 0);
  reg(lei,'雷公柱', '雷公柱', '攒尖亭顶端悬垂之柱，为各角由戗交汇点，是攒尖结构的"脊心"。', 'frame');
  frameG.add(lei);
  // 老角梁 + 仔角梁（由戗）：自四角向雷公柱顶
  for(let i=0;i<4;i++){
    const a = columns[i];
    const sx=a.tx, sz=a.tz, sy=bracketTop;
    const ex=0, ez=0, ey=topY+leiH;
    const v = new THREE.Vector3(ex-sx, ey-sy, ez-sz);
    const len = v.length();
    const beam = new THREE.Mesh(new THREE.BoxGeometry(len, 0.34*k, 0.46*k), wm(0xad7d3a));
    beam.position.set((sx+ex)/2,(sy+ey)/2,(sz+ez)/2);
    beam.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0), v.clone().normalize());
    reg(beam,'由戗（仔角梁）', '由戗（仔角梁）', '自老角梁续接、斜上交于雷公柱，形成攒尖屋面四条垂脊骨架。', 'frame');
    frameG.add(beam);
    // 搭掌榫（角梁端，可见咬合）
    addTenon(frameG, 'dazhang', woodC, new THREE.Vector3(sx, sy, sz), 0.4*k, 'y', wm(0xc89a5e));
  }

  /* ---------- 6. 椽望（檐椽、飞椽、翼角翘飞、望板、连檐） ---------- */
  const rw = lg.roofwood;
  const eaveY = bracketTop;            // 檐口高度
  const apexY = topY + leiH;           // 宝顶底
  const slopeLen = Math.hypot(halfSpan+eaveOut, apexY-eaveY); // 屋面斜长
  const eaveR = halfSpan + eaveOut;    // 檐出半径
  // 望板：四片独立坡面（Low-poly 攒尖四坡）
  for(let i=0;i<4;i++){
    const ang = i*Math.PI/2 + Math.PI/4; // 坡面朝向角平分线
    const plank = new THREE.Mesh(new THREE.BoxGeometry(eaveR*2*0.96, 0.09*k, slopeLen), wm(0xcaa86a));
    // 平放并倾斜：先绕 x 倾斜，再绕 y 朝向
    plank.rotation.x = -Math.atan2(apexY-eaveY, eaveR);
    const holder = new THREE.Group();
    holder.add(plank);
    plank.position.set(0,0, eaveR/2);
    holder.rotation.y = ang;
    holder.position.y = eaveY;
    // 微调坡面使其一端达顶点
    plank.position.y = (apexY-eaveY)/2;
    reg(plank,'望板', '望板（苫背）', '铺于椽上、瓦下之木板，承托瓦作并找平屋面。', 'roofwood');
    rw.add(holder);
  }
  // 檐椽（沿四坡向外辐射）
  const rafterCount = 14;
  for(let i=0;i<4;i++){
    const ang = i*Math.PI/2 + Math.PI/4;
    for(let r=0;r<rafterCount;r++){
      const t = r/rafterCount;
      const len = slopeLen*0.98;
      const raf = new THREE.Mesh(new THREE.BoxGeometry(0.12*k, 0.12*k, len), wm(0xbf9a55));
      const holder = new THREE.Group();
      holder.rotation.y = ang + (t-0.5)*0.5; // 略散开呈放射
      raf.rotation.x = -Math.atan2(apexY-eaveY, eaveR);
      raf.position.set(0, (apexY-eaveY)/2, eaveR/2);
      holder.add(raf);
      holder.position.y = eaveY;
      reg(raf,'檐椽', '檐椽', '沿屋面坡向铺设之圆/方木，承托望板与瓦，将屋面荷载传至斗栱。', 'roofwood');
      rw.add(holder);
    }
  }
  // 飞椽（檐口外挑短椽，做出檐）
  for(let i=0;i<4;i++){
    const ang = i*Math.PI/2 + Math.PI/4;
    for(let r=0;r<rafterCount;r++){
      const t=r/rafterCount;
      const f = new THREE.Mesh(new THREE.BoxGeometry(0.1*k,0.1*k, eaveOut*0.8), wm(0xc7a05a));
      const holder=new THREE.Group();
      holder.rotation.y = ang + (t-0.5)*0.5;
      f.position.set(0,0, eaveR*0.5 + eaveOut*0.4);
      f.rotation.x = -0.18;
      holder.add(f);
      holder.position.y = eaveY + (apexY-eaveY)*0.92;
      reg(f,'飞椽', '飞椽', '叠于檐椽之上、向外挑出之短椽，形成"檐出"与起翘的优美曲线。', 'roofwood');
      rw.add(holder);
    }
  }
  // 翼角翘飞椽（四角上翘）—— 在四角方向做翘起
  for(let i=0;i<4;i++){
    const sx=columns[i].tx, sz=columns[i].tz;
    const q = new THREE.Mesh(new THREE.BoxGeometry(0.12*k,0.12*k, eaveOut*1.0), wm(0xc7a05a));
    const holder=new THREE.Group();
    holder.position.set(sx, eaveY, sz);
    q.position.set(0, 0.25*k, eaveOut*0.5);
    q.rotation.x = -0.5; // 翘起
    holder.add(q);
    reg(q,'翼角翘飞椽', '翼角翘飞', '角部飞椽上翘，形成翼角起翘，是唐以来重要造型特征。', 'roofwood');
    rw.add(holder);
  }
  // 连檐（檐口一圈）
  const lian = new THREE.Mesh(new THREE.TorusGeometry(eaveR*1.02, 0.06*k, 6, 4), wm(0xb07a40));
  lian.rotation.x = Math.PI/2;
  lian.position.y = eaveY;
  lian.rotation.z = Math.PI/4;
  reg(lian,'连檐', '连檐', '联结各檐椽端部之木条，固定椽头并承托瓦口。', 'roofwood');
  rw.add(lian);

  /* ---------- 7. 瓦作 + 垂脊 + 宝顶 ---------- */
  const tw = lg.tile;
  // 屋面瓦：四坡再覆盖瓦色薄板（略大于望板）
  for(let i=0;i<4;i++){
    const ang = i*Math.PI/2 + Math.PI/4;
    const plank = new THREE.Mesh(new THREE.BoxGeometry(eaveR*2*0.97, 0.05*k, slopeLen*1.02), mat(tileC));
    const holder = new THREE.Group();
    holder.rotation.y = ang;
    plank.rotation.x = -Math.atan2(apexY-eaveY, eaveR);
    plank.position.set(0,(apexY-eaveY)/2, eaveR/2);
    holder.add(plank); holder.position.y=eaveY;
    reg(plank,'筒瓦屋面', '瓦作（筒板瓦）', '屋面覆瓦，排水并保护木骨；坡面举折/举架随朝代变化。', 'tile');
    tw.add(holder);
  }
  // 垂脊（四坡交线）
  for(let i=0;i<4;i++){
    const sx=columns[i].tx, sz=columns[i].tz;
    const v=new THREE.Vector3(-sx, apexY-eaveY, -sz);
    const len=v.length();
    const ridge=new THREE.Mesh(new THREE.BoxGeometry(0.14*k,0.14*k,len), mat(0x4f555e));
    ridge.position.set(sx/2,(eaveY+apexY)/2,sz/2);
    ridge.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), v.clone().normalize());
    reg(ridge,'垂脊', '垂脊', '自宝顶沿四坡至翼角之脊，界定攒尖四条坡面。', 'tile');
    tw.add(ridge);
  }
  // 宝顶（底座 + 宝珠）
  const baD = new THREE.Mesh(new THREE.CylinderGeometry(0.5*k,0.6*k,0.5*k,8), mat(0x8a6f3a));
  baD.position.set(0, apexY+0.25*k, 0);
  reg(baD,'宝顶·底座', '宝顶（座）', '攒尖顶点收头之装饰构件，遮护雷公柱端并镇顶。', 'tile');
  tw.add(baD);
  const baZ = new THREE.Mesh(new THREE.SphereGeometry(0.4*k, 10, 8), mat(0xd9b46a));
  baZ.position.set(0, apexY+0.7*k, 0);
  reg(baZ,'宝顶·宝珠', '宝顶（珠）', '宝顶顶端宝珠，象征"凝露镇亭"，为攒尖亭视觉焦点。', 'tile');
  tw.add(baZ);

  /* 记录层级原始 Y（用于拆解抬升），以及整亭高度 */
  G.userData.topY = apexY + 0.9*k;
  G.userData.era = era;
  return G;
}

/* =========================================================================
   四、场景 / 渲染 / 控制
   ========================================================================= */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1c2230);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 500);
camera.position.set(14, 11, 16);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, 4, 0);
controls.maxPolarAngle = Math.PI*0.495;

// 光照
const sun = new THREE.DirectionalLight(0xfff0d8, 2.0);
sun.position.set(18, 26, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-20; sun.shadow.camera.right=20;
sun.shadow.camera.top=20; sun.shadow.camera.bottom=-20;
sun.shadow.camera.far=80;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbcd2ff, 0x3a3326, 0.6));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));

// 地面
const ground = new THREE.Mesh(new THREE.CircleGeometry(60,48),
  new THREE.MeshStandardMaterial({color:0x2a3142, roughness:1}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true;
scene.add(ground);
// 网格参考
const grid = new THREE.GridHelper(80, 40, 0x39435a, 0x2c3445);
grid.position.y = 0.001; scene.add(grid);

raycaster = new THREE.Raycaster();
pointer = new THREE.Vector2();

/* 装配两个亭：主 + 对比 */
let mainPav = null, cmpPav = null;
const pavilionsGroup = new THREE.Group();
scene.add(pavilionsGroup);

function clearPav(){
  while(pavilionsGroup.children.length){
    const c = pavilionsGroup.children.pop();
    c.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose(); });
    pavilionsGroup.remove(c);
  }
  pickables.length = 0;
  for(const k in partInfo) delete partInfo[k];
}

function assemble(mainKey, cmpKey){
  clearPav();
  mainPav = buildPavilion(ERAS[mainKey]);
  pavilionsGroup.add(mainPav);
  mainPav.position.x = 0;
  applyLayerToggles();

  if(cmpKey && cmpKey!=='none'){
    cmpPav = buildPavilion(ERAS[cmpKey]);
    cmpPav.position.x = 18;
    // 对比亭不进 pickables 主列表（避免误拾取），但保留拆解
    pavilionsGroup.add(cmpPav);
    controls.target.set(9, 4, 0);
  } else {
    cmpPav = null;
    controls.target.set(0, 4, 0);
  }
  // 重建 layerGroups 引用
  rebuildLayerRefs();
  setExplode(explodeSlider.value);
}

function rebuildLayerRefs(){
  // layerGroups 指向主亭各层级组
  if(!mainPav) return;
  LAYERS.forEach(l=>{
    let found=null;
    mainPav.traverse(o=>{ if(o.userData && o.userData.layer===l.id && o.type==='Group'){ found=o; } });
    if(found) layerGroups[l.id]=found;
  });
}

/* 拆解：按层级索引抬升，层级越高抬得越多 */
let explodeVal = 0;
function setExplode(v){
  explodeVal = v/100;
  if(!mainPav) return;
  LAYERS.forEach((l,idx)=>{
    const g = layerGroups[l.id];
    if(!g) return;
    const lift = explodeVal * idx * 2.2;
    g.position.y = lift;
  });
  if(cmpPav){
    LAYERS.forEach((l,idx)=>{
      let g=null; cmpPav.traverse(o=>{ if(o.userData&&o.userData.layer===l.id&&o.type==='Group') g=o; });
      if(g) g.position.y = explodeVal*idx*2.2;
    });
  }
}

/* 层级显隐 */
const layerVisible = {};
LAYERS.forEach(l=> layerVisible[l.id]=true);
function applyLayerToggles(){
  LAYERS.forEach(l=>{
    const g = layerGroups[l.id];
    if(g) g.visible = layerVisible[l.id];
  });
}

/* 线框 / 剖切 */
let clipPlane = new THREE.Plane(new THREE.Vector3(0,-1,0), 0);
function applyHelperModes(){
  const wire = document.getElementById('cbWire').checked;
  const clip = document.getElementById('cbClip').checked;
  pavilionsGroup.traverse(o=>{
    if(o.material){
      const mats = Array.isArray(o.material)?o.material:[o.material];
      mats.forEach(m=>{
        m.wireframe = wire;
        m.clippingPlanes = clip ? [clipPlane] : null;
        m.needsUpdate = true;
      });
    }
  });
}

/* =========================================================================
   五、拾取与信息卡
   ========================================================================= */
const infoBox = document.getElementById('info');
const ray = new THREE.Raycaster();
function onPick(ev){
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((ev.clientX-rect.left)/rect.width)*2-1;
  pointer.y = -((ev.clientY-rect.top)/rect.height)*2+1;
  ray.setFromCamera(pointer, camera);
  const hits = ray.intersectObjects(pickables, false);
  if(hits.length){
    const m = hits[0].object;
    const d = partInfo[m.uuid];
    if(d){
      document.getElementById('infoName').textContent = d.name;
      document.getElementById('infoTerm').textContent = '术语：'+d.term;
      document.getElementById('infoFn').textContent = d.fn;
      infoBox.style.display='block';
      // 高亮
      highlight(m);
    }
  }
}
let highlighted=null, hlColor=null;
function highlight(m){
  if(highlighted && highlighted.material){
    if(Array.isArray(highlighted.material)) highlighted.material.forEach(x=>x.emissive&&x.emissive.setHex(0x000000));
    else highlighted.material.emissive && highlighted.material.emissive.setHex(0x000000);
  }
  highlighted = m;
  if(m.material && m.material.emissive){
    hlColor = m.material.emissive.getHex();
    m.material.emissive.setHex(0x553a12);
  }
}
renderer.domElement.addEventListener('click', onPick);
document.getElementById('infoClose').onclick = ()=>{ infoBox.style.display='none'; if(highlighted&&highlighted.material&&highlighted.material.emissive) highlighted.material.emissive.setHex(0x000000); };

/* =========================================================================
   六、UI 绑定
   ========================================================================= */
const eraMain = document.getElementById('eraMain');
const eraCompare = document.getElementById('eraCompare');
ERA_ORDER.forEach(k=>{
  const e=ERAS[k];
  eraMain.add(new Option(e.name+' '+e.approx, k));
  eraCompare.add(new Option(e.name+' '+e.approx, k));
});
eraMain.value='qing'; eraCompare.value='tang';

const explodeSlider = document.getElementById('explode');
const explodeValEl = document.getElementById('explodeVal');
explodeSlider.addEventListener('input', ()=>{
  explodeValEl.textContent = explodeSlider.value+'%';
  setExplode(explodeSlider.value);
});
document.getElementById('btnReset').onclick = ()=>{ explodeSlider.value=0; explodeValEl.textContent='0%'; setExplode(0); };
document.getElementById('btnIsolate').onclick = ()=>{
  // 隔离模式：仅显示被选中的当前主视图亭（隐藏对比），便于专注观察
  if(cmpPav){ pavilionsGroup.remove(cmpPav); }
  else if(eraCompare.value!=='none'){ assemble(eraMain.value, eraCompare.value); }
};

// 层级显隐勾选
const lt = document.getElementById('layerToggles');
LAYERS.forEach(l=>{
  const id='lv_'+l.id;
  const row=document.createElement('div'); row.className='row';
  row.innerHTML = `<label class="toggle"><input type="checkbox" id="${id}" checked> ${l.name}</label>`;
  lt.appendChild(row);
  row.querySelector('input').addEventListener('change',e=>{ layerVisible[l.id]=e.target.checked; applyLayerToggles(); });
});

document.getElementById('cbWire').addEventListener('change', applyHelperModes);
document.getElementById('cbClip').addEventListener('change', ()=>{
  // 剖切平面：取 y = 亭高一半
  const midY = mainPav? mainPav.userData.topY*0.45 : 4;
  clipPlane = new THREE.Plane(new THREE.Vector3(0,-1,0), midY);
  applyHelperModes();
});

eraMain.addEventListener('change', ()=> assemble(eraMain.value, eraCompare.value));
eraCompare.addEventListener('change', ()=> assemble(eraMain.value, eraCompare.value));

/* 朝代参数表 */
function buildEraTable(){
  const t=document.getElementById('eraTable');
  const ratios = (e)=>({
    dh: (e.douHeightRatio*100).toFixed(0)+'%',
    bj: e.bujian,
    eo: (e.eaveOut/e.columnH).toFixed(2),
    rs: e.riseRatio.toFixed(2),
    cd: (e.columnH/e.columnD).toFixed(1)
  });
  let html = '<tr><th>朝代</th><th>斗栱/柱高</th><th>补间攒</th><th>檐出/柱高</th><th>举高/进深</th><th>柱高/柱径</th></tr>';
  ERA_ORDER.forEach(k=>{
    const r=ratios(ERAS[k]);
    html += `<tr><td>${ERAS[k].name}</td><td class="b">${r.dh}</td><td>${r.bj}</td><td class="b">${r.eo}</td><td class="b">${r.rs}</td><td class="b">${r.cd}</td></tr>`;
  });
  t.innerHTML=html;
  document.getElementById('trendNote').textContent =
    '史实趋势：斗栱/柱高 唐宋大→明清小；补间攒 疏朗→密集；檐出/柱高 深远→收浅；举高/进深 平缓→陡峻；柱高/柱径 粗壮→修长。';
}
buildEraTable();

/* =========================================================================
   七、初始化与渲染循环
   ========================================================================= */
assemble('qing','tang');
document.getElementById('eraName').textContent = '主视图：'+ERAS.qing.name+' '+ERAS.qing.approx;
eraMain.addEventListener('change', ()=> document.getElementById('eraName').textContent='主视图：'+ERAS[eraMain.value].name+' '+ERAS[eraMain.value].approx);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
