<style>
:root{
  --bg:#0d1016; --panel:rgba(16,19,26,.88); --line:rgba(214,178,92,.30);

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);

#c3d{position:fixed;inset:0;display:block;cursor:grab}

.panel{position:fixed;z-index:10;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;backdrop-filter:blur(8px);padding:11px 13px;font-size:12px;line-height:1.55;
  box-shadow:0 8px 28px rgba(0,0,0,.5)}
#pl{left:10px;top:10px;width:262px;max-height:calc(100vh - 20px);overflow-y:auto}
#pr{right:10px;top:10px;width:296px;max-height:calc(100vh - 20px);overflow-y:auto}
h1{font-size:15.5px;color:var(--gold);letter-spacing:.10em;font-weight:600}
.sub{color:var(--dim);font-size:10.5px;margin:2px 0 7px}
.sect{border-top:1px solid var(--line);margin-top:9px;padding-top:7px}
.stt{color:var(--gold);font-size:11.5px;letter-spacing:.14em;margin-bottom:5px}
.rowbtns{display:flex;flex-wrap:wrap;gap:5px}
button,.pill{cursor:pointer;border:1px solid var(--line);background:#171b24;color:var(--ink);
  border-radius:8px;padding:4px 9px;font-size:12px;transition:border-color .15s,background .15s;user-select:none}
button:hover,.pill:hover{border-color:var(--gold)}
button.on,.pill.on{background:#3a2e15;border-color:var(--gold);color:var(--hl)}
#blurb{margin-top:6px;color:var(--ink);opacity:.85;font-size:11.5px;text-align:justify}
table.mt{width:100%;border-collapse:collapse;margin-top:3px}
table.mt td{padding:2px 2px;font-size:11px;color:var(--dim);white-space:nowrap}
table.mt td.v{color:var(--hl);text-align:right;font-variant-numeric:tabular-nums;padding-right:7px}
.btrack{width:64px;height:5px;background:#20242e;border-radius:3px;display:inline-block;
  vertical-align:middle;position:relative;overflow:hidden}
.bfill{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,#7a5b1e,var(--gold));border-radius:3px}
input[type=range]{width:100%;accent-color:var(--gold);cursor:pointer}
.slrow{display:flex;align-items:center;gap:8px;margin-top:4px}
.slrow .val{min-width:44px;text-align:right;color:var(--hl);font-variant-numeric:tabular-nums}

#infoCard .ct{display:inline-block;border:1px solid var(--line);border-radius:6px;color:var(--dim);
  font-size:10.5px;padding:0 6px;margin-left:6px;vertical-align:2px}
#infoCard .ds{margin-top:6px;text-align:justify;color:var(--ink);opacity:.9;font-size:11.8px}
#infoCard .hint{color:var(--dim)}
.pillrow{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
.toolrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:2px}
.mini{font-size:11px;padding:3px 7px}
#labels{position:fixed;inset:0;pointer-events:none;z-index:6;display:none}
.lb{position:absolute;transform:translate(-50%,-130%);font-size:10.5px;color:#ffe9b0;
  background:rgba(10,12,16,.72);border:1px solid rgba(214,178,92,.45);border-radius:5px;
  padding:0 5px;white-space:nowrap;text-shadow:0 1px 2px #000}
#dynBadge{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:9;text-align:center;pointer-events:none}
#dynBadge .big{font-size:44px;color:rgba(216,180,90,.16);letter-spacing:.35em;font-weight:700}
#veil{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;align-items:center;
  justify-content:center;flex-direction:column;gap:10px;color:var(--dim);transition:opacity .6s}
#veil .t{color:var(--gold);letter-spacing:.5em;font-size:18px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.help{color:var(--dim);font-size:10.5px;margin-top:7px}
.sep{height:1px;background:var(--line);opacity:.6;margin:8px 0 6px}
@media (max-width:900px){#pr{display:none}#pl{width:232px}}
</style>

<div id="pr" class="panel">
  <div id="infoCard">
    <div class="tt">构件观察</div><span class="ct">点击场景中的构件</span>

  </div>
  <div class="sect">
    <div class="stt">辅 助 观 察</div>
    <div class="toolrow">
      <button id="btnLabels" class="mini on">名称标注</button>
      <button id="btnWire" class="mini">线框</button>
      <button id="btnClip" class="mini">剖切</button>
      <button id="btnSpin" class="mini">自动旋转</button>
    </div>
    <div id="clipRow" style="display:none;margin-top:6px">
      <div class="slrow"><input type="range" id="clipSlider" min="-40" max="40" value="0" step="1"><span class="val" id="clipVal">0</span></div>

  <div class="help">
    操作：左键拖动旋转 · 滚轮缩放 · 右键拖动平移。<br>
    承托链：台基 → 柱础 → 檐柱 → 额枋／普拍枋 → 斗栱铺作 → 抹角梁·金檩·由戗·雷公柱 → 椽望 → 瓦作宝顶。
  </div>
</div>

<div id="dynBadge"><div class="big" id="badgeTxt"></div></div>
<div id="labels"></div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
//<<CORE-BEGIN>>
'use strict';
/* ================================================================
 * 核心几何工厂 —— 纯逻辑层（不依赖 DOM，可抽出在 Node 中自测）
 * ================================================================ */
const D2R=Math.PI/180;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const ERA_ORDER=['唐','宋','明','清'];
/* ---------- 朝代形制参数表 ----------
 * colH 柱高 colD 柱径 span 面阔 nPing 每面补间攒数 dgH 斗栱全高
 * eaveOut 檐出 flyOut 飞椽伸出 raise 举高/进深 jvZhao 举折|举架

const STYLE={
 '唐':{era:'唐',styleName:'材分制 · 雄大疏朗',
   blurb:'唐风遗意：斗栱雄大、可占柱高三分之一以上；每间仅施补间一朵；出檐深远几及柱高之半；屋面举折平缓如陂陀；柱身粗壮，高径比约六至七，尽显浑厚。',
   colH:3.40,colD:0.52,span:4.20,nPing:1,dgH:1.52,
   eaveOut:1.80,flyOut:0.55,raise:0.245,jvZhao:'举折',
   shouFen:0.080,ceJiao:0.030,shengQi:0.18,waLu:7,tileC:0x55685f},
 '宋':{era:'宋',styleName:'营造法式 · 材分成熟',
   blurb:'宋《营造法式》：以"材"为基本模数，凡构屋之制皆以材为祖；补间每间两朵渐趋整齐；举折之法先定举高、自上而下每缝递减；柱有收分侧脚，制度粲然。',
   colH:3.50,colD:0.42,span:4.30,nPing:2,dgH:1.26,
   eaveOut:1.60,flyOut:0.48,raise:0.275,jvZhao:'举折',
   shouFen:0.068,ceJiao:0.024,shengQi:0.15,waLu:8,tileC:0x5a756c},
 '明':{era:'明',styleName:'官式定型 · 纤巧过渡',
   blurb:'明代官式走向定型：斗栱纤巧化而攒数转密，梁枋断面增大以代偿结构职能；屋面始用举架之法、坡度转陡；檐出收缩，柱身渐趋修长。',
   colH:3.60,colD:0.38,span:4.35,nPing:3,dgH:0.94,
   eaveOut:1.35,flyOut:0.42,raise:0.310,jvZhao:'举架',
   shouFen:0.055,ceJiao:0.017,shengQi:0.12,waLu:9,tileC:0x4f7050},
 '清':{era:'清',styleName:'斗口制 · 密集陡峻',
   blurb:'清工部《工程做法则例》以"斗口"为模数：斗栱缩小为檐下垫层，平身科攒当密排四朵；檐出收浅、举架五举递增至九举，屋面陡峻；柱高径比逾十一最为颀长；黄琉璃瓦独尊。',
   colH:3.70,colD:0.34,span:4.40,nPing:4,dgH:0.70,
   eaveOut:1.20,flyOut:0.38,raise:0.350,jvZhao:'举架',
   shouFen:0.042,ceJiao:0.012,shengQi:0.10,waLu:10,tileC:0xc9992e}
};
function metrics(P){
 return {
  dc:+(P.dgH/P.colH).toFixed(4),
  np:P.nPing,
  eo:+(P.eaveOut/P.colH).toFixed(4),
  rs:+P.raise.toFixed(4),
  sl:+(P.colH/P.colD).toFixed(3),
  algo:P.jvZhao};
}
/* ---------- 屋面剖面曲线：举折／举架 ----------
 * 折线自脊点(px=0)向檐口锚点(px=li)分段变化；px 为沿面阔法线方向
 * 距中轴水平距。檐口以外(飞椽区)按末段放缓延伸。 */
function profPts(P,S){
 const li=S+P.eaveOut-0.26;
 const Hr=P.raise*2*li;
 const slopes=(P.jvZhao==='举架')?[1.15,1.32,1.46,1.62]:[1.62,1.28,0.96,0.68];
 const n=slopes.length;let sum=0;
 for(const s of slopes)sum+=s*(li/n);
 const k=Hr/sum;
 const px=[0],py=[Hr];let y=Hr;
 for(let i=0;i<n;i++){y-=slopes[i]*(li/n)*k;px.push(+((i+1)*li/n).toFixed(6));py.push(+y.toFixed(6));}
 return {li:li,Hr:Hr,px:px,py:py};
}
function profYAt(pf,x){
 const px=pf.px,py=pf.py,N=px.length;
 if(x<=0){const s=(py[1]-py[0])/((px[1]-px[0])||1e-9);return py[0]+Math.abs(Math.min(x,0))*s*0.4;}
 if(x<=px[N-1]){
  for(let i=0;i<N-1;i++)if(x>=px[i]&&x<=px[i+1]){
   const t=(x-px[i])/((px[i+1]-px[i])||1e-9);return py[i]+(py[i+1]-py[i])*t;}
 }
 const s=(py[N-1]-py[N-2])/((px[N-1]-px[N-2])||1e-9);
 return py[N-1]+(x-px[N-1])*s*0.82;
}
/* ---------- 构件术语字典（名称 → 功能说明） ---------- */
const DICT={
 '台基':'台明石作：将全亭重量均匀导入地基并隔水防潮，四面设踏道上下；是承托链条最底端，兜拢整圈柱网。',
 '踏步':'阶前踏道分级条石：级间放低放退，方便升降并与台基压阑石搭接。',
 '柱础':'柱顶石（古镜式）：置于台基之上承托柱脚，隔绝潮气防木柱根糟朽；顶面凿十字卯口纳管脚榫。',
 '管脚榫':'柱根底面的短圆榫：插入柱础卯口，定位防滑，便于安装校正——柱与础之间的暗销榫。',
 '檐柱':'四面檐柱共四根成方形柱网：柱身收分、柱头微内倾为侧脚，柱头按生起基准抬高；荷载自柱头经馒头榫传入普拍枋与栌斗。',
 '馒头榫':'柱头顶端独梗圆榫：插入普拍枋卯眼并直抵栌斗底口，锁住柱头与水平层相对滑移，拆解后可见。',
 '额枋(阑额)':'柱头间的横向联系枋：两端燕尾榫楔入柱身银锭卯口，越拉越紧，把四柱绑扎成整体框架；上皮与柱头顶齐平。',
 '燕尾榫':'大头小尾的银锭形榫头：配柱身燕尾卯口，只能自上而下落槽、水平永不能拔出——专抗横向脱开的最经典抗拉榫。',
 '箍头榫':'枋端绕柱交圈的箍头做法：端头作卡口箍抱柱身转角，增强角部拉结刚度。',
 '普拍枋':'额枋上扁平木枋（清称平板枋）：环柱头一周，为各攒斗栱栌斗提供连续坐面；转角两段刻半十字搭交不断头。',
 '十字搭交榫':'两段枋于角部各剔去半高互相咬合的交圈做法：转折处连续受荷，环形构件过角的标准节点。',
 '栌斗':'铺作最下层大斗：坐于普拍枋上总承全攒栱昂，把檐口荷载层层归聚再经柱头下传；清代坐斗宽三斗口，是材分的直观标尺。',
 '泥道瓜栱':'平行墙面第一层的横栱：坐在栌斗口内与华栱十字相交，其上散斗承托上层构件。',
 '华栱':'内外跳悬挑的足材栱：逐跳出跳把檐口推出墙身，斗栱中受弯最大的悬臂件。',
 '昂':'斜置杠杆：昂嘴下斜探出（唐宋批竹昂），后尾压入梁架之下，以外挑之势平衡檐口倾覆，结构与形象合一。',
 '耍头':'最上一跳外伸的枋头：清式蚂蚱头造，与令栱相交封护铺作正面。',
 '令栱':'置于最外一跳之上、平行墙面的短栱：其上三枚散斗直接承托撩檐枋，是斗栱与檐口木层的交接件。',
 '散斗':'各跳头的小方斗：坐于栱上、口内又嵌上层栱，传递集中力并把各层错缝锁定——数量最多的"关节"零件。',
 '交互斗':'位于华栱跳头、承十字交叉栱昂的小斗：比散斗多一个方向卯口，故称交互。',
 '宝瓶':'转角科上的小瓶状支柱：立于由昂背上承托老角梁悬出端，把翼角集中荷载传入角科斗栱。',
 '撩檐枋':'环檐一周的水平枋：搁在各攒斗栱令栱散斗之上，为檐椽提供连续支承线；转角两面枋头十字搭交出挑。',
 '抹角梁':'内檐转角的斜梁：两端以搭掌榫骑压在相邻两面撩檐枋背上方（刻半台阶啮合），中段立交金瓜柱，为金檩交汇提供支座。',
 '搭掌榫':'梁端与枋背间的阶梯状承压半搭接：靠台阶直接传压并可搁置定位，小式梁架最常用的搭接方式。',
 '交金瓜柱':'立在抹角梁中段的短柱：上承金檩十字交点，把老角梁尾与由戗传来之力导入抹角梁再分向两面撩檐枋。',
 '金檩':'内环方形檩木共四根：四角对头刻半十字搭交成环，既是椽尾支点，又是老角梁后尾与由戗下端的系结节点。',
 '老角梁':'翼角骨架基梁：前端压在角科昂头／宝瓶之上，后尾刻半榫入金檩交点，沿垂脊方向斜置，受弯兼受压。',
 '仔角梁':'叠压在老角梁背上的续长角梁：向外下方续伸、椽头微微起翘，直接承托翼角翘飞椽，成就"如鸟斯革"的飞檐。',
 '由戗':'自金檩四角逐根斜向内上收束的戗木：抵入雷公柱腰部并以穿销锁定——雷公柱由此获得四向合抱支撑，绝非悬空。',
 '穿销':'贯穿由戗与雷公柱叠合面的垂直木销：以销受剪锁定节点，剖切或拆解状态下可见销孔咬合。',
 '雷公柱':'攒尖屋盖正中的垂莲短柱：汇受四根由戗推力并平衡宝顶重量，下座于由戗交汇点，上端没入宝顶底座。',
 '檐椽':'密排受弯构件：尾端支于金檩背、中部搁在撩檐枋上、头部越枋挑出檐外，顺举折／举架坡面铺设，转角让予翘飞。',
 '飞椽':'钉压在檐椽头之上的第二层扁椽：以更平缓坡度再前伸一段，使檐缘轻薄外飘、改善排水抛物线。',
 '翼角翘飞椽':'转角扇状辐射的翘飞椽：逐根抬升加长、愈近角部愈高，是四角亭翼角起翘的直接来源。',
 '望板':'顺坡满铺的木板层：钉在椽背上承接瓦作，把瓦重匀摊给每根椽子并封闭屋面底层。',

function orientMat(pos,dir,len){
 const d=new THREE.Vector3(dir[0],dir[1],dir[2]);
 const L=d.length();if(L>1e-9)d.multiplyScalar(1/L);
 const up=Math.abs(d.y)>0.98?new THREE.Vector3(0,0,1):new THREE.Vector3(0,1,0);
 const q=new THREE.Quaternion();
 q.setFromRotationMatrix(new THREE.Matrix4().lookAt(
   new THREE.Vector3(-d.x,-d.y,-d.z),new THREE.Vector3(0,0,0),up));
 const m=new THREE.Matrix4();
 m.compose(new THREE.Vector3(pos[0]+dir[0]/2,pos[1]+dir[1]/2,pos[2]+dir[2]/2),
   q,new THREE.Vector3(1,1,len));
 return m;
}

/* ---------- 高度链推导（承托链条唯一数据源） ----------

 * → 额枋上皮与柱顶平 → 普拍枋底=colT → 铺作底 keBase
 * → 铺作高 dgH → 铺作顶 keTop = 撩檐枋底 → 撩檐枋顶 liaoTop

function deriveDims(P,S){
 const e=P.ceJiao*P.colH;

 const elH=Math.max(.26,P.colD*.58);

 const u=P.dgH/2.35;
 const keTop=keBase+P.dgH;
 const loH=.32;

 const pf=profPts(P,S);

 return {e:e,theta:theta,rb:rb,rt:rt,zuH:zuH,zuT:zuT,colT:colT,
   elH:elH,pbH:pbH,keBase:keBase,u:u,keTop:keTop,loH:loH,
   liaoCY:liaoCY,liaoTop:liaoTop,hx:hx,Hr:pf.Hr,pf:pf,

     yawOf(f.n),0.92,'柱头科·角位('+f.nm+'向正向出跳)',{noLu:true});
  });
  const byaw=Math.atan2(sx,sz);
  keBranch(ctx,L,P,der,cx,der.keBase+u*.28,cz,byaw,1.0,'转角科',{noLu:true});
  // 宝瓶：立于转角科由昂背上，承老角梁悬端
  ctx._cornerTop=ctx._cornerTop||[];
  ctx._cornerTop.push({x:cx,y:der.keBase+u*2.60,z:cz,ax:sx,az:sz});
 }
 let pingCount=0;
 for(const f of FACES){
  const yaw=yawOf(f.n),nx=f.n[0],nz=f.n[1],rx=f.r[0],rz=f.r[1];
  for(let i=0;i<P.nPing;i++){

   keBranch(ctx,L,P,der,nx*(S-fwShrink(P))+rx*t,der.keBase,nz*(S-fwShrink(P))+rz*t,
     yaw,1.0,'平身科',{noLu:false});

  const lg=addBox(ctx,L,(CR)*2,der.loH,P.colD*.60,i%2===0?0x7c4a2d:0x734328,'撩檐枋','斗栱',
    nx*CR*0.985,der.keTop+der.loH/2+lift,nz*CR*0.985,yawOf(f.n));
 }
 ctx.anchorDefs.push({layer:'dg',pos:[S*.62,der.keBase+der.u*1.4,S*.62],text:'斗栱'});
 ctx.anchorDefs.push({layer:'dg',pos:[-(S+P.eaveOut-.26),der.liaoCY,-.9],text:'撩檐枋'});

/* ---------- L4 梁架 · 金檩 · 由戗 · 雷公柱 ----------

 });

    0,jinCY-jz(sgn),sgn*hj,0);
 });
 // 抹角梁 ×4：两端骑压相邻两面撩檐枋背(搭掌榫台阶)，中点落于垂脊线下
 const v=Math.min(CR*.82,(hj+CR)*.52);

 for(const qx of[-1,1])for(const qz of[-1,1]){
  const a=qx, b=-qz;                     // 镜像对称分量

 // 老角梁 ×4 + 宝瓶 + 仔角梁

  // 宝瓶：立于转角科之上承老角梁前端
  if(ctx._cornerTop){

    if(Math.sign(ct.x)===qx&&Math.sign(ct.z)===qz&&!ct._used){

     addCyl(ctx,L,.07,.105,.20,8,WOODC.dou,'宝瓶','斗栱',ct.x,ct.y+.10,ct.z);
     break;
    }
   }
  }
  // 仔角梁：叠压老角梁背续伸，椽头微翘
  const rtl=(rf-hj*Math.SQRT2)*.72;

 }

 for(const qx of[-1,1])for(const qz of[-1,1]){
  const n0=[qx*hj,jinBkY-jh*.4,qz*hj];
  const n1=[qx*.20,waistY,qz*.20];

 }
 // 雷公柱：正中八棱垂柱，下端垂莲收尾，上端没入宝顶底座
 const leigY0=waistY-.48;
 const leigTop=der.apAbs-.12;
 const lw=.30;
 addBox(ctx,L,lw,leigTop-leigY0,lw,WOODC.red,'雷公柱','梁架',
   0,(leigY0+leigTop)/2,0,0);
 addCyl(ctx,L,.20,.055,.26,8,WOODC.red,'雷公柱','梁架',0,leigY0-.12,0);
 ctx.anchorDefs.push({layer:'lj',pos:[0,waistY+.42,0],text:'雷公柱'});
 ctx.anchorDefs.push({layer:'lj',pos:[mX*.8,Ybm+.1,-mX*.8],text:'梁架'});
 // 关键节点读数（烟测断言用）
 ctx.joints.push(
  {name:'keTop≈铺作顶(撩檐枋底)',v:der.keTop},
  {name:'liaoTop(撩檐枋顶)',v:der.liaoTop},
  {name:'jinBack(金檩背=椽底)',v:jinBkY},
  {name:'xiL(檐口锚距)',v:li},
  {name:'apAbs(脊上皮)',v:der.apAbs});
 return {hj:hj,jinCY:jinCY,jinBkY:jinBkY,rM:rM};
}
function hxOf(P,S){return S+P.eaveOut;}
/* ---------- 共享屋面曲面求值 ----------
 * datum(ξ) 为结构基准线＝椽底缘(亦即檩背／撩檐枋背标高)。
 * 世界坐标：横剖(方位 A)上的方阵半径收缩系数 squareRad 保证
 * 四坡面与四条戗脊同出一源——凡椽、板、瓦、脊均以同一公式取点，
 * 故任意构件只做堆叠不做穿透（各层仅存受控 lift 偏移）。 */
function surfPt(P,der,A,xi,lift){
 const c=Math.cos(A),s=Math.sin(A);
 const rho=Math.max(xi,0)*squareRad(c,s);
 return [Math.sin(A)*rho,
         der.liaoTop+profYAt(der.pf,xi)+(lift||0),
         Math.cos(A)*rho];
}
function datumY(P,der,xi){return der.liaoTop+profYAt(der.pf,xi);}
/* ---------- L5 椽望 · 连檐（全部实例化合批） ---------- */
function buildChuanWang(ctx,L,P,der){
 const S=ctx.S,hx=der.hx,li=der.xiL;
 const HC={yc:.115,fc:.085,qfc:.10,wb:.032};
 // 数据层升量约定：椽底=datum；飞椽、翘飞叠于其上；望板压椽背；瓦垄贴板。
 function mid(a,b){return [(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2];}
 function dirOf(a,b){return [b[0]-a[0],b[1]-a[1],b[2]-a[2]];}
 // —— 檐椽 / 飞椽：四面均布，让出角部扇区给翘飞
 const nPer=P.waLu+2;
 let cntYc=0,cntFc=0,cntQ=0;
 for(let k=0;k<4;k++){
  const Af=k*Math.PI/2;                       // 与 FACES 顺序无关，四向均匀
  for(let j=0;j<nPer;j++){
   const o=(-1+2*j/(nPer-1))*.255;
   const A=Af+o;
   const xt=S+P.eaveOut-.02, xf=li*.46;
   const a=surfPt(P,der,A,xf,HC.yc/2);
   const b=surfPt(P,der,A,xt,HC.yc/2+.004);
   addInst(ctx,'yc',a,dirOf(a,b),
     Math.sqrt((b[0]-a[0])**2+(b[1]-a[1])**2+(b[2]-a[2])**2));
   // 飞椽：压檐椽背上再前伸 flyOut
   const f1=surfPt(P,der,A,hx-flyOutBack(P),(HC.yc+HC.fc/2+.006));
   const f0=surfPt(P,der,A,hx+P.flyOut-.02,(HC.yc+HC.fc/2+.006));
   addInst(ctx,'fc',f0,dirOf(f0,f1),
     Math.sqrt((f1[0]-f0[0])**2+(f1[1]-f0[1])**2+(f1[2]-f0[2])**2));
   cntYc++;cntFc++;
  }
 }
 // —— 翼角翘飞椽：每角五根扇形辐射，愈靠角抬升愈高挑出愈远
 for(let k=0;k<4;k++){
  const Ac=Math.PI/4+k*Math.PI/2;
  for(let j=-2;j<=2;j++){
   const o=j*.135;
   const boost=(1-Math.abs(o)/(.135*2.2))*.85+.15;
   const tipX=hx+P.flyOut*(.34+.34*boost);
   const a=surfPt(P,der,Ac+o,li*.52,HC.yc+HC.qfc/2+.01+boost*.13);
   const b=surfPt(P,der,Ac+o,tipX,HC.yc+HC.qfc/2+.012+boost*.16);
   addInst(ctx,'qfc',b,dirOf(b,a),
     Math.sqrt((b[0]-a[0])**2+(b[1]-a[1])**2+(b[2]-a[2])**2));
   cntQ++;
  }
 }
 // —— 望板：环形满铺条带（压椽背，承接瓦作）
 const rings=[],pxs=der.pf.px,N=pxs.length;
 for(let i=0;i<N;i++){rings.push(pxs[i]);if(i<N-1)rings.push((pxs[i]+pxs[i+1])/2);}
 const nChunk=Math.max(14,Math.round(P.waLu*2.2));
 let cntWb=0;
 for(let ri=0;ri<rings.length;ri++){
  const xi=rings[ri];
  for(let ci=0;ci<nChunk;ci++){
   const A1=ci/nChunk*Math.PI*2,A2=(ci+1)/nChunk*Math.PI*2;
   const Am=(A1+A2)/2;
   const p1=surfPt(P,der,A1,xi,HC.yc+HC.wb*1.5);
   const p2=surfPt(P,der,A2,xi,HC.yc+HC.wb*1.5);
   const pm=mid(p1,p2);
   const dd=dirOf(p1,p2);const len=Math.sqrt(dd[0]**2+dd[1]**2+dd[2]**2);
   addInst(ctx,'wb',pm,dd,len);cntWb++;
  }
 }
 // —— 大连檐／小连檐：联结椽头的通长扁木（四面各一道）
 const ye=datumY(P,der,S+P.eaveOut)+HC.yc;
 const yf=datumY(P,der,hx+P.flyOut)+HC.yc+HC.fc;
 const Ce=S+P.eaveOut,Cf=hx+P.flyOut-.10;
 [1,-1].forEach(sg=>{
  addBox(ctx,L,Cf*2,.09,.11,WOODC.dark,'连檐','椽望',0,ye,sg*Ce,0);
  addBox(ctx,L,.11,.09,Ce*2,WOODC.dark,'连檐','椽望',sg*Ce,ye,0,Math.PI/2);
  addBox(ctx,L,Cf*2,.06,.08,0x6e4028,'连檐','椽望',0,yf,sg*Cf,0);
  addBox(ctx,L,.08,.06,Cf*2,0x6e4028,'连檐','椽望',sg*Cf,yf,0,Math.PI/2);
 });
 ctx.anchorDefs.push({layer:'cw',pos:[Ce*.72,ye+.12,Ce*.2],text:'檐椽'});
 ctx.anchorDefs.push({layer:'cw',pos:[Ce*.62,ye+.24,Ce*.32],text:'飞椽'});
 ctx.anchorDefs.push({layer:'cw',pos:[-Ce*.9,ye+.2,Ce*.15],text:'连檐'});
 const stInst=finalizeInstances(ctx,L);
 ctx.st.wbCnt=cntWb;
 return {yc:cntYc,fc:cntFc,qfc:cntQ,wb:cntWb,inst:stInst};
}
function flyOutBack(P){return P.eaveOut*.28;}
/* ---------- L6 瓦作 · 垂脊 · 宝顶 ---------- */

 // —— 筒瓦垄：每面 P.waLu 行，顺坡分段铺设（贴望板）

   }

    cntWl++;
   }
  }
 }
 function surfPtFlat(P2,der2,A,xi,yAbs){

 return c.getHex();
}
/* ---------- 全亭装配编排器（承托链自下而上一次成型） ---------- */
function buildPavilion(P){
 const ctx=makeCtx(P);
 const der=deriveDims(P,ctx.S);
 ctx.der=der;
 const root=new THREE.Group();root.name='pavilion';
 const layers=LAYERS.map(ld=>{
  const g=new THREE.Group();
  g.name='L:'+ld.key;
  g.userData.off=ld.off;g.userData.label=ld.name;g.userData.key=ld.key;
  root.add(g);
  return {key:ld.key,name:ld.name,off:ld.off,group:g};
 });
 const LG={};layers.forEach(l=>{LG[l.key]=l.group;});
 ctx.curLayer='tai';const taiI=buildTai(ctx,LG.tai,P,der);
 ctx.curLayer='zhu';const zhuI=buildZhu(ctx,LG.zhu,P,der);
 ctx.curLayer='fx';buildFang(ctx,LG.fx,P,der);
 ctx.curLayer='dg';const dgI=buildDougong(ctx,LG.dg,P,der);
 ctx.curLayer='lj';const ljI=buildLiangJia(ctx,LG.lj,P,der);
 ctx.curLayer='cw';const cwI=buildChuanWang(ctx,LG.cw,P,der);
 ctx.curLayer='wa';const waI=buildWa(ctx,LG.wa,P,der);
 return {root:root,layers:layers,registry:ctx.registry,mats:ctx.mats,
   der:der,st:ctx.st,anchors:ctx.anchorDefs,joints:ctx.joints,
   info:{tai:taiI,zhu:zhuI,dougong:dgI,liangjia:ljI,chuan:cwI,wa:waI,
     S:ctx.S,u:ctx.u}};
}
//<<CORE-END>>

/* ================================================================
 * 应用层：场景 · 相机 · 交互
 * ================================================================ */
const $=(id)=>document.getElementById(id);
const CLIP={enabled:false,plane:new THREE.Plane(new THREE.Vector3(0,0,-1),999)};
let renderer,scene,camera,controls;
let builds=[];            // 当前场景中的所有 build（单亭 1 座／并置 4 座）
let curEra='宋',mode='single',explodeT=0,autoDir=0;
let selBox=null,pickedRef=null;
const layerVis={};LAYERS.forEach(l=>layerVis[l.key]=true);
let onlyTenon=false,wireOn=false,labelOn=true;

function initScene(){
 renderer=new THREE.WebGLRenderer({canvas:$('c3d'),antialias:true});
 renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
 renderer.setSize(window.innerWidth,window.innerHeight);
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.06;
 renderer.localClippingEnabled=true;
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x10141b);
 scene.fog=new THREE.Fog(0x10141b,26,60);
 camera=new THREE.PerspectiveCamera(46,window.innerWidth/window.innerHeight,.1,200);
 camera.position.set(9.6,6.8,11.8);
 controls=new OrbitControls(camera,renderer.domElement);
 controls.target.set(0,2.7,0);
 controls.enableDamping=true;controls.dampingFactor=.06;
 controls.maxPolarAngle=Math.PI*.52;controls.minDistance=3.5;controls.maxDistance=40;
 scene.add(new THREE.HemisphereLight(0xcfd9ea,0x33291c,.78));
 const dl=new THREE.DirectionalLight(0xffe2b4,1.22);
 dl.position.set(8.5,13,6);dl.castShadow=true;
 dl.shadow.mapSize.set(2048,2048);
 dl.shadow.camera.left=-9;dl.shadow.camera.right=9;
 dl.shadow.camera.top=9;dl.shadow.camera.bottom=-9;
 dl.shadow.camera.far=45;dl.shadow.bias=-.0004;dl.shadow.normalBias=.02;
 scene.add(dl);
 const fill=new THREE.DirectionalLight(0x9db4d8,.30);
 fill.position.set(-6,5,-9);scene.add(fill);
 // 广场地面
 const ground=new THREE.Mesh(new THREE.CircleGeometry(15,48),
   new THREE.MeshStandardMaterial({color:0x1d232e,roughness:.96,metalness:0}));
 ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
 const ring=new THREE.Mesh(new THREE.RingGeometry(10.6,10.85,64),
   new THREE.MeshBasicMaterial({color:0x39414f,side:THREE.DoubleSide}));
 ring.rotation.x=-Math.PI/2;ring.position.y=.005;scene.add(ring);
 window.addEventListener('resize',onResize);
}
function onResize(){
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
}
function applyClip(mats){
 for(const m of mats){
  m.clippingPlanes=CLIP.enabled?[CLIP.plane]:null;
  m.clipShadows=true;m.needsUpdate=true;
 }
}
function disposeBuild(b){
 b.root.traverse(o=>{
  if(o.geometry)o.geometry.dispose();
 });
 for(const m of b.mats)m.dispose();
 scene.remove(b.root);
}
function rebuild(){
 clearPick();
 for(const b of builds)disposeBuild(b);
 builds=[];
 if(mode==='single'){
  const b=buildPavilion(STYLE[curEra]);
  b.posX=0;b.scaleV=1;b.era=curEra;
  scene.add(b.root);
  applyClip(b.mats);setWire(b,wireOn);
  builds.push(b);
 }else{
  let i=0;
  for(const e of ERA_ORDER){
   const b=buildPavilion(STYLE[e]);
   b.era=e;
   const holder=new THREE.Group();
   holder.position.set((i-1.5)*4.75,0,0);
   holder.scale.setScalar(.46);
   holder.add(b.root);
   b.root2=holder;b.posX=(i-1.5)*4.75;b.scaleV=.46;
   scene.add(holder);
   applyClip(b.mats);setWire(b,wireOn);
   builds.push(b);i++;
  }
 }
 setExplode(explodeT,true);
 applyVisibility();
 refreshLabels();
 applyEraUI();
 $('badgeTxt').textContent=mode==='single'?curEra:'唐 宋 明 清';
}
function setWire(b,on){
 b.mats.forEach(m=>{m.wireframe=on;});
}

/* ---------- 朝代 UI（形制说明 + 关键比值表 + 趋势条） ---------- */
const METRIC_DEFS=[
 {k:'dc',name:'斗栱高／柱高',unit:'',trend:'大 → 小',dir:-1},
 {k:'np',name:'补间攒数',   unit:'朵',trend:'疏 → 密',dir:1},
 {k:'eo',name:'檐出／柱高', unit:'',trend:'深远 → 收浅',dir:-1},
 {k:'rs',name:'举高／进深', unit:'',trend:'平缓 → 陡峻',dir:1},
 {k:'sl',name:'柱高／柱径', unit:'',trend:'粗壮 → 修长',dir:1}];
function metricRanges(){
 const r={};
 for(const d of METRIC_DEFS){
  const vs=ERA_ORDER.map(e=>metrics(STYLE[e])[d.k]);
  r[d.k]={min:Math.min(...vs),max:Math.max(...vs)};
 }
 return r;
}
function applyEraUI(){
 const P=STYLE[curEra],m=metrics(P),rg=metricRanges();
 $('blurb').textContent=P.styleName+' —— '+P.blurb;
 let html='';
 for(const d of METRIC_DEFS){
  const v=m[d.k];
  const t=(v-rg[d.k].min)/((rg[d.k].max-rg[d.k].min)||1);
  const fill=d.dir>0?t:1-t;
  html+='<tr><td>'+d.name+'</td><td class="v">'+(d.k==='np'?v+' '+d.unit:v)+'</td>'+
    '<td><span class="btrack"><span class="bfill" style="width:'+Math.round(fill*100)+'%"></span></span></td>'+
    '<td style="font-size:10px">'+d.trend+'</td></tr>';
 }
 html+='<tr><td>屋面做法</td><td class="v" colspan="3">'+m.algo+'</td></tr>';
 $('mtable').innerHTML=html;
 document.querySelectorAll('#eraBtns button').forEach(b=>{
  b.classList.toggle('on',b.dataset.era===curEra&&mode==='single');
 });
}
function initUI(){
 const eb=$('eraBtns');
 for(const e of ERA_ORDER){
  const b=document.createElement('button');
  b.textContent=e;b.dataset.era=e;
  b.addEventListener('click',()=>{if(mode==='single'){setEra(e);}});
  eb.appendChild(b);
 }
 $('btnSingle').addEventListener('click',()=>{
  if(mode!=='single'){mode='single';rebuild();
   animateCam(new THREE.Vector3(9.6,6.8,11.8),new THREE.Vector3(0,2.7,0));}
 });
 $('btnCompare').addEventListener('click',()=>{
  if(mode!=='compare'){mode='compare';rebuild();
   animateCam(new THREE.Vector3(0,8.4,18.5),new THREE.Vector3(0,2.5,0));}
 });
 $('expSlider').addEventListener('input',ev=>{setExplode(ev.target.value/100);});
 $('btnAssemble').addEventListener('click',()=>{setExplode(0);$('expSlider').value=0;autoDir=0;$('btnAutoExp').classList.remove('on');});
 $('btnAutoExp').addEventListener('click',()=>{
  autoDir=autoDir===0?1:0;
  $('btnAutoExp').classList.toggle('on',autoDir!==0);
 });
 // 层级显隐
 const lp=$('layerPills');
 for(const l of LAYERS){
  const p=document.createElement('button');
  p.className='pill mini on';p.textContent=l.name;p.dataset.key=l.key;
  p.addEventListener('click',()=>{
   layerVis[l.key]=!layerVis[l.key];
   p.classList.toggle('on',layerVis[l.key]);
   applyVisibility();
  });
  lp.appendChild(p);
 }
 $('btnOnlyTenon').addEventListener('click',ev=>{
  onlyTenon=!onlyTenon;ev.target.classList.toggle('on',onlyTenon);applyVisibility();
 });
 $('btnLabels').addEventListener('click',ev=>{
  labelOn=!labelOn;ev.target.classList.toggle('on',labelOn);
  $('labels').style.display=labelOn?'block':'none';
  refreshLabels();
 });
 $('btnWire').addEventListener('click',ev=>{
  wireOn=!wireOn;ev.target.classList.toggle('on',wireOn);
  for(const b of builds)setWire(b,wireOn);
 });
 $('btnClip').addEventListener('click',ev=>{
  CLIP.enabled=!CLIP.enabled;
  if(!CLIP.enabled)CLIP.plane.constant=999;
  ev.target.classList.toggle('on',CLIP.enabled);
  $('clipRow').style.display=CLIP.enabled?'block':'none';
  for(const b of builds)applyClip(b.mats);
 });
 $('clipSlider').addEventListener('input',ev=>{
  CLIP.plane.constant=-ev.target.value/10;
  $('clipVal').textContent=(ev.target.value/10).toFixed(1);
 });
 $('btnSpin').addEventListener('click',ev=>{
  controls.autoRotate=!controls.autoRotate;
  controls.autoRotateSpeed=.9;
  ev.target.classList.toggle('on',controls.autoRotate);
 });
 applyEraUI();
}
function setEra(e){
 curEra=e;clearPick();rebuild();
}
let tween=null;
function animateCam(toPos,toTgt,dur){
 tween={p0:camera.position.clone(),t0:controls.target.clone(),
  p1:toPos,t1:toTgt,t:0,dur:dur||900};
}
function setExplode(t,silent){
 explodeT=t;
 for(const b of builds)
  for(const l of b.layers)l.group.position.y=l.off*t*(1+.25*t);
 if(!silent)$('expSlider').value=Math.round(t*100);
 $('expVal').textContent=Math.round(t*100)+'%';
 clearPick();
}

/* ---------- 可见性（层级显隐 × 仅榫卯） ---------- */
function baseVisible(rec){
 if(!rec)return true;
 const lk=rec.layer||'';
 const lv=lk===''||layerVis[lk]===undefined?true:layerVis[lk];
 return lv&&(!onlyTenon||rec.cat==='榫卯');
}
function applyVisibility(){
 for(const b of builds)
  for(const o of b.registry)
   o.visible=baseVisible(o.userData.rec);
 for(const a of labelObjs)a.div.style.display='none';
}
/* ---------- 构件拾取 + 信息卡 + 高亮 ---------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
let downPos=null;
function onPointerDown(ev){downPos=[ev.clientX,ev.clientY];}
function onPointerUp(ev){
 if(!downPos)return;
 const dx=ev.clientX-downPos[0],dy=ev.clientY-downPos[1];
 downPos=null;
 if(dx*dx+dy*dy>36)return;
 ndc.x=(ev.clientX/window.innerWidth)*2-1;
 ndc.y=-(ev.clientY/window.innerHeight)*2+1;
 ray.setFromCamera(ndc,camera);
 const objs=[];
 for(const b of builds)for(const o of b.registry)if(o.visible)objs.push(o);
 const hits=ray.intersectObjects(objs,false);
 if(!hits.length){return;}
 const h=hits[0];
 let rec=h.object.userData.rec;
 if(h.object.userData.recMap&&h.instanceId!==undefined)
  rec=h.object.userData.recMap[h.instanceId];
 showPick(h.object,rec);
}
let savedEmissive=[];
function showPick(obj,rec){
 clearPick();
 pickedRef=obj;
 savedEmissive=[[obj.material,obj.material.emissive?obj.material.emissive.getHex():0]];
 if(obj.material.emissive)obj.material.emissive.setHex(0x4a3208);
 selBox=new THREE.BoxHelper(obj,0xffd479);
 scene.add(selBox);
 $('infoCard').innerHTML=
  '<div class="tt">'+rec.label+'</div><span class="ct">'+rec.cat+
  '</span><div class="ds">'+rec.desc+'</div>'+
  '<div class="ds" style="color:#98a0aa;font-size:10.5px">朝代形制：'+
   (mode==='single'?STYLE[curEra].styleName:'并置对比模式')+'</div>';
}
function clearPick(){
 if(selBox){scene.remove(selBox);selBox=null;}
 for(const pr of savedEmissive)if(pr[0].emissive)pr[0].emissive.setHex(pr[1]);
 savedEmissive=[];pickedRef=null;
}
/* ---------- 名称标注（锚点随拆解自动跟随所在层） ---------- */
const labelObjs=[];
function refreshLabels(){
 const box=$('labels');
 box.innerHTML='';labelObjs.length=0;
 if(mode!=='single'||!labelOn)return;
 const seen=new Set();
 for(const b of builds){
  for(const an of b.anchors){
   if(seen.has(an.text))continue;
   seen.add(an.text);
   const g=b.root.getObjectByName('L:'+an.layer);
   if(!g)continue;
   const o=new THREE.Object3D();
   o.position.set(an.pos[0],an.pos[1],an.pos[2]);
   g.add(o);
   const div=document.createElement('div');
   div.className='lb';div.textContent=an.text;
   box.appendChild(div);
   labelObjs.push({o:o,div:div});
  }
 }
 applyVisibility2Labels();
 $('labels').style.display=labelOn?'block':'none';
}
function applyVisibility2Labels(){
 const lv=new THREE.Vector3();
 for(const it of labelObjs){
  it.o.getWorldPosition(lv);
  it._wp=[lv.x,lv.y,lv.z];
 }
}
const tmpV=new THREE.Vector3();
function updateLabels(){
 if(!labelOn||mode!=='single')return;
 if(scene)scene.updateMatrixWorld(false);
 const w=window.innerWidth,h=window.innerHeight;
 for(const it of labelObjs){
  let vis=it.o.visible&&it.o.parent&&it.o.parent.visible;
  let p=tmpV.set(it.o.position.x,it.o.position.y,it.o.position.z);
  p.applyMatrix4(it.o.parent.matrixWorld);
  p.project(camera);
  const off=p.z>1;
  it.div.style.display=(vis&&!off)?'block':'none';
  it.div.style.left=((p.x*.5+.5)*w)+'px';
  it.div.style.top=((-p.y*.5+.5)*h)+'px';
 }
}
/* ---------- 主循环 ---------- */
const clock=new THREE.Clock();
let veilGone=false;
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);
 if(tween){
  tween.t+=dt*1000/tween.dur;
  const k=tween.t>=1?1:(tween.t<0?0:.5-.5*Math.cos(Math.PI*tween.t));
  camera.position.lerpVectors(tween.p0,tween.p1,k);
  controls.target.lerpVectors(tween.t0,tween.t1,k);
  if(tween.t>=1)tween=null;
 }
 if(autoDir!==0){
  let t=explodeT+autoDir*dt*.22;
  if(t>=1){t=1;autoDir=-1;}
  else if(t<=0){t=0;autoDir=1;}
  setExplode(t);
 }
 controls.update();
 updateLabels();
 renderer.render(scene,camera);
 if(!veilGone){
  veilGone=true;
  const v=$('veil');
  v.style.opacity='0';
  setTimeout(()=>{v.style.display='none';},650);
 }
}
/* ---------- 启动 ---------- */
try{
 initScene();
 initUI();
 rebuild();
 renderer.domElement.addEventListener('pointerdown',onPointerDown);
 renderer.domElement.addEventListener('pointerup',onPointerUp);
 animate();
}catch(err){
 const vm=$('veilMsg');
 if(vm)vm.textContent='初始化失败：'+err.message;
}
</script>
</body>
</html>
