  #eraBtns button,#btnRow button{border:1px solid var(--line);background:rgba(255,255,255,.06);color:#dfe6ea;padding:5px 12px;font-size:13px;border-radius:4px;cursor:pointer;transition:all .15s}
  #eraBtns button:hover,#btnRow button:hover{background:rgba(255,255,255,.16)}
  #eraBtns button.on{background:var(--acc);border-color:var(--acc);color:#1d2430;font-weight:600}
  #btnRow{margin-left:auto;display:flex;gap:6px}
  #btnRow button.on{background:var(--acc2);border-color:var(--acc2);color:#10161f;font-weight:600}
  #left{top:64px;left:14px;width:238px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:#e8edf3;font-size:12.5px;backdrop-filter:blur(6px);max-height:calc(100% - 220px);overflow-y:auto}

  #left label.row{display:flex;align-items:center;gap:7px;padding:2.5px 0;cursor:pointer;user-select:none}
  #left input[type=range]{width:100%;accent-color:var(--acc)}
  #left input[type=checkbox]{accent-color:var(--acc)}
  #left button{border:1px solid var(--line);background:rgba(255,255,255,.06);color:#dfe6ea;padding:3px 0;font-size:11px;border-radius:4px;cursor:pointer}

  #info .cmeta{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);font-size:11.5px;color:#9fb0c2;line-height:1.6}
  #info .cmeta b{color:#c8d4e2;font-weight:600}
  #infoClose{position:absolute;top:8px;right:10px;cursor:pointer;color:#8b99ab;font-size:15px}
  #table{bottom:14px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 14px 10px;backdrop-filter:blur(6px)}

  .clabel b{color:var(--acc);font-size:13px;display:block;letter-spacing:2px}

<canvas id="c"></canvas>

<div id="topbar" class="ui">
  <h1>四角攒尖亭<small>程序化大木作 · 朝代形制演变 · 分层解构</small></h1>
  <div id="eraBtns"></div>
  <div id="btnRow">

<div id="left" class="ui">

  </div>
  <div class="sec">

    <div id="layerList"></div>
  </div>
  <div class="sec" id="clipSec" style="display:none">

    <input id="clipPos" type="range" min="-260" max="260" value="120" step="1"/>
  </div>
</div>

<div id="info" class="ui">
  <span id="infoClose">✕</span>
  <div class="cname" id="iName"></div>
  <div class="cterm" id="iTerm"></div>
  <div class="cfunc" id="iFunc"></div>
  <div class="cmeta" id="iMeta"></div>
</div>

<div id="table" class="ui"></div>
<div id="hint" class="ui">左键拖拽旋转 · 滚轮缩放 · 右键平移 · 单击构件查看名称/术语/功能</div>
<div id="labels"></div>

  ludou:'⑤ 斗栱', hua:'⑤ 斗栱', qiao:'⑤ 斗栱', ang:'⑤ 斗', ling:'⑤ 斗栱', sandou:'⑤ 斗栱',
  purlin:'⑤ 斗·檩', jiaolin:'⑤ 斗栱·檩',
  makubiki:'⑥ 梁架', laojiao:'⑥ 梁架', zijiao:'⑥ 梁架', leigong:'⑥ 梁架', panding:'⑥ 梁架',
  gutou:'⑥ 梁架（榫）', rafterRing:'⑥ 梁架（椽枋）', shiziku:'⑤/⑥ 枋交节点',
  yuanchuan:'⑦ 椽望', feichuan:'⑦ 椽望', zhengchuan:'⑦ 椽望', qiaofei:'⑦ 椽望',
  lianyan:'⑦ 椽望', guantou:'⑦ 椽望', wangban:'⑦ 椽望',
  dovetail:'⑦ 椽望（榫）', mantou:'⑦ 椽望（榫）',
  guan:'⑧ 瓦作', chuiji:'⑧ 瓦作', jiwei:'⑧ 瓦作', baoding:'⑧ 瓦作·宝顶', cap:'⑧ 瓦作',
  mortise:'榫卯（卯口）',
};

/* ============ 四、几何工具 ============ */
const UNIT_BOX = new THREE.BoxGeometry(1,1,1);
const UNIT_CYL = new THREE.CylinderGeometry(0.5,0.5,1,10);
const UP = new THREE.Vector3(0,1,0);
const V3 = (x,y,z)=>new THREE.Vector3(x,y,z);
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _s = new THREE.Vector3();
const rotY = (x,z,ry)=>V3(x*Math.cos(ry)-z*Math.sin(ry), 0, x*Math.sin(ry)+z*Math.cos(ry));

function makeWedge(len, wNarrow, wWide, h){
  // 燕尾楔：沿 Z 轴的梯形棱柱（底窄顶宽）
  const a=wNarrow/2, b=wWide/2, hh=h/2;
  const v = [
    [-a,-hh,0],[a,-hh,0],[b,hh,0],[-b,hh,0],
    [-a,-hh,len],[a,-hh,len],[b,hh,len],[-b,hh,len]
  ];
  const f = [
    [0,3,2],[0,2,1],[4,5,6],[4,6,7],
    [0,4,7],[0,7,3],[1,5,4],[1,4,0],
    [2,6,5],[2,5,1],[3,7,6],[3,6,2]
  ];
  const pos = new Float32Array(f.length*9);
  f.forEach((face,i)=>{ for(let k=0;k<3;k++){ const vi=v[face[k]]; pos[i*9+k*3]=vi[0]; pos[i*9+k*3+1]=vi[1]; pos[i*9+k*3+2]=vi[2]; } });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.computeVertexNormals();
  return g;
}

/* =====================================================================
   五、亭子构建（承托链自下而上闭合）
   ===================================================================== */
function buildPavilion(P, opts={}){
  const scale = opts.scale ?? 1;
  const shadows = !!opts.shadows;
  const root = new THREE.Group();
  const L = {}; LAYER_DEF.forEach(d=>{ const g=new THREE.Group(); g.name=d.id; L[d.id]=g; root.add(g); });
  const pickables = [];
  const mats = [];
  const M = (hex, o={}) => { const m=new THREE.MeshStandardMaterial({ color:hex, flatShading:true, roughness:0.92, metalness:0.02, ...o }); mats.push(m); return m; };
  const mWood=M(P.wood), mWoodL=M(P.woodLight), mCol=M(P.column), mTile=M(P.tile), mTileD=M(P.tileDark),
        mStone=M(P.stone), mPl=M(P.plinthC), mBoard=M(P.board), mGold=M(P.gold,{roughness:0.45,metalness:0.35}), mMort=M(P.mortar,{roughness:1});

  function reg(mesh, comp, layer){
    if(comp){ mesh.userData.comp = comp; pickables.push(mesh); }
    (layer || L.tile).add(mesh);
    return mesh;
  }
  function box(layer, w,h,d, mat, x,y,z, comp, ry=0){
    const m = new THREE.Mesh(UNIT_BOX, mat);
    m.scale.set(w,h,d); m.position.set(x,y,z);
    if(ry) m.rotation.y = ry;
    m.castShadow = shadows; m.receiveShadow = true;
    return reg(m, comp, layer);
  }
  function beam(layer, A, B, w, t, mat, comp){
    const dir = new THREE.Vector3().subVectors(B,A); const len = dir.length(); dir.normalize();
    const m = new THREE.Mesh(UNIT_BOX, mat);
    m.scale.set(w,t,len);
    m.position.copy(A).add(B).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), dir);
    m.castShadow = shadows; m.receiveShadow = true;
    return reg(m, comp, layer);
  }
  function inst(layer, geo, mat, items){
    const im = new THREE.InstancedMesh(geo, mat, items.length);
    items.forEach((it,i)=>{
      _q.copy(it.quat); _p.copy(it.pos); _s.copy(it.scale);
      _m4.compose(_p,_q,_s); im.setMatrixAt(i,_m4);
      im.setColorAt(i, new THREE.Color(0xffffff));
    });
    im.instanceMatrix.needsUpdate = true;
    if(im.instanceColor) im.instanceColor.needsUpdate = true;
    im.castShadow = shadows; im.receiveShadow = true;
    im.userData.compByInstance = items.map(it=>it.comp);
    pickables.push(im); layer.add(im); return im;
  }
  function beamItem(A,B,w,t,comp){
    const dir = new THREE.Vector3().subVectors(B,A); const len = dir.length(); dir.normalize();
    return { pos:new THREE.Vector3().copy(A).add(B).multiplyScalar(0.5),
             quat:new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1), dir),
             scale:new THREE.Vector3(w,t,len), comp };
  }

  /* ---- 关键标高（全部由形制参数推出，保证承托连续） ---- */
  const w = BAY_W/2;
  const H_pl   = P.plinthH;
  const topY   = H_pl + P.colH;
  const flatH  = 0.14, archH = 0.18;
  const flatTop= topY + flatH;
  const H_dg   = P.bracketRatio * P.colH;
  const purlinB= flatTop + H_dg;
  const purlinH= 0.12;
  const purlinT= purlinB + purlinH;
  const a_p    = w + P.tieOut;
  const a      = a_p + P.eaveOut;
  const H_e    = purlinT - P.slope*P.eaveOut;
  const H_apex = H_e + P.slope*a;
  const a_top  = 0.35;
  // 盘顶枋：梁架交汇环（攒尖顶心），位于老角梁收头处而非半高
  const H_ring = H_apex - 0.15;
  const a_rr   = a_p + P.eaveOut*0.55;
  const H_rr   = purlinT - P.slope*P.eaveOut*0.55;
  const edgeY  = t => H_e + P.upturn*Math.pow(2*Math.abs(t-0.5),2.4) - 0.02*Math.sin(Math.PI*t);

  /* ---- 斗栱出跳数：由斗栱高反推（形制自洽） ---- */
  const LUDO_H = 0.14;
  const tiaoN  = Math.max(2, Math.round((H_dg-LUDO_H)/0.205));
  const adv    = (H_dg-LUDO_H)/tiaoN;   // 每跳竖向进深

  /* ============ ① 台基 ============ */
  {
    const pw=P.plinthW;
    box(L.plinth, pw+0.16, 0.10, pw+0.16, mStone, 0, 0.05, 0, {id:'plinth'});
    box(L.plinth, pw, H_pl-0.10, pw, mPl, 0, 0.10+(H_pl-0.10)/2, 0, {id:'plinth'});
    for(let i=0;i<3;i++){
      box(L.plinth, 1.1, 0.10, 0.42, mStone, 0, H_pl-0.05-i*0.10, pw/2+0.10+i*0.42, {id:'step'});
    }
  }

  /* ============ ② 柱础（鼓磴） ============ */
  const colPos = [ V3(-w,0,-w), V3(w,0,-w), V3(w,0,w), V3(-w,0,w) ];
  colPos.forEach(cp=>{
    const g1 = new THREE.CylinderGeometry(P.colR*1.7, P.colR*1.95, 0.07, 10);
    const s1 = new THREE.Mesh(g1, mStone); s1.position.set(cp.x, H_pl+0.035, cp.z);
    s1.castShadow=shadows; s1.receiveShadow=true; s1.userData.comp={id:'plinth'}; pickables.push(s1); L.base.add(s1);
    const g2 = new THREE.CylinderGeometry(P.colR*1.3, P.colR*1.45, 0.13, 10);
    const s2 = new THREE.Mesh(g2, mStone); s2.position.set(cp.x, H_pl+0.07+0.065, cp.z);
    s2.castShadow=shadows; s2.receiveShadow=true; s2.userData.comp={id:'pedestal'}; pickables.push(s2); L.base.add(s2);
  });

  /* ============ ③ 檐柱（侧脚+收分） ============ */
  const colTop = colPos.map(cp=>{
    const dirC = V3(-cp.x,0,-cp.z).normalize();
    return cp.clone().setY(H_pl).add(dirC.clone().multiplyScalar(P.colH*Math.sin(P.slant))).add(V3(0,P.colH,0));
  });
  colPos.forEach(cp=>{
    const cg = new THREE.Group(); cg.position.set(cp.x, H_pl, cp.z);
    const g = new THREE.CylinderGeometry(P.colR*0.94, P.colR, P.colH, 10);
    const col = new THREE.Mesh(g, mCol);
    col.position.y = P.colH/2;
    col.castShadow = shadows; col.receiveShadow = true;
    col.userData.comp = {id:'column'}; pickables.push(col);
    cg.add(col);
    const dirC = V3(-cp.x,0,-cp.z).normalize();
    const axis = new THREE.Vector3().crossVectors(UP, dirC).normalize();
    cg.quaternion.setFromAxisAngle(axis, P.slant);
    L.column.add(cg);
  });

  /* ============ ④ 阑额（端部搭掌榫）/ 普拍枋 ============ */
  for(let k=0;k<4;k++){
    const cA = colTop[k], cB = colTop[(k+1)%4];
    [cA,cB].forEach(ct=> box(L.column, P.colR*3.4, flatH, P.colR*3.4, mWoodL, ct.x, topY+flatH/2, ct.z, {id:'flat'}));
    const d = new THREE.Vector3().subVectors(cB,cA).normalize();
    const inset = P.colR*0.75;
    const A1 = cA.clone().add(d.clone().multiplyScalar(inset));
    const B1 = cB.clone().add(d.clone().multiplyScalar(-inset));
    beam(L.lintel, A1, B1, 0.13, archH, mWood, {id:'arch'});
    // 搭掌榫：阑额端下榫入普拍枋卯口（普拍枋属③层、榫属④层 → 拆解时分离可见）
    [ {end:cA, inw:d.clone()}, {end:cB, inw:d.clone().negate()} ].forEach(({end,inw})=>{
      const tp = end.clone().add(inw.clone().multiplyScalar(P.colR*0.70));
      box(L.lintel, 0.08, 0.10, 0.08, mWoodL, tp.x, topY+0.09, tp.z, {id:'dazhang'});
      box(L.column, 0.11, 0.03, 0.11, mMort, tp.x, topY+flatH+0.005, tp.z, {id:'mortise'});
    });
  }

  /* ============ ⑤ 斗栱铺作（柱头/补间/转角）+ 檐檩 ============ */
  const huaLen = (P.tieOut-0.12)/Math.max(tiaoN,1);
  // 铺作核心：局部坐标 +Z 出檐；高度精确收至 H_dg（顶行散斗承檩）
  function bracketCore(g, kind, sc, tiao, adv){
    box(g, 0.30*sc, LUDO_H*sc, 0.30*sc, mWoodL, 0, LUDO_H*sc/2, 0.02*sc, {id:'ludou'});
    const qiaoW = (P.tieOut*0.55+0.16)*sc;
    const lingW = (P.tieOut*0.85+0.10)*sc;
    for(let s=0;s<tiao;s++){
      const ys = (LUDO_H + s*adv)*sc;
      const Ls = huaLen*(1-0.06*s)*sc;
      const zStart = (0.10 + huaLen*0.84*s)*sc;
      const zEnd   = zStart + huaLen*(1-0.06*s)*sc;
      box(g, 0.13*sc, 0.34*adv*sc, Ls, mWood, 0, ys+0.17*adv*sc, zStart+Ls/2, {id:'hua', set:kind});
      box(g, qiaoW, 0.16*adv*sc, 0.09*sc, mWood, 0, ys+0.42*adv*sc, zEnd, {id:'qiao', set:kind});
      [-1,1].forEach(sd=> box(g, 0.28*adv*sc, 0.28*adv*sc, 0.28*adv*sc, mWoodL, sd*qiaoW/2, ys+0.42*adv*sc, zEnd, {id:'sandou', set:kind}));
      const zw = zEnd + 0.02*sc;
      box(g, lingW, 0.24*adv*sc, 0.10*sc, mWood, 0, ys+0.62*adv*sc, zw, {id:'ling', set:kind});
      [-1,1].forEach(sd=>{
        box(g, 0.28*adv*sc, 0.28*adv*sc, 0.28*adv*sc, mWoodL, sd*lingW/2, ys+0.62*adv*sc, zw, {id:'sandou', set:kind});
        if(P.shuaHead)
          box(g, 0.09*sc, 0.16*adv*sc, 0.08*sc, mWoodL, sd*(lingW/2+0.055*sc), ys+0.62*adv*sc, zw, {id:'ling', set:kind});
      });
      if(s===tiao-1){ // 顶行散斗：直接承檐檩
        [-1,1].forEach(sd=> box(g, 0.30*adv*sc, 0.30*adv*sc, 0.30*adv*sc, mWoodL, sd*lingW/2, ys+0.85*adv*sc, zw, {id:'sandou', set:kind}));
      }
    }
    if(P.hasAng){
      const A = V3(0, (LUDO_H+tiao*adv)*sc-0.30*adv*sc, 0.18*sc);
      const B = V3(0, LUDO_H*sc + tiao*adv*sc + 0.02, (P.tieOut+0.05)*sc);
      beam(g, A, B, 0.09*sc, 0.09*sc, mWood, {id:'ang', set:kind});
    }
  }
  // 柱头铺作
  colPos.forEach(cp=>{
    const out = V3(cp.x,0,cp.z).normalize();
    const g = new THREE.Group();
    g.position.set(cp.x, flatTop, cp.z);
    g.rotation.y = Math.atan2(out.x, out.z);
    bracketCore(g, P.setNames.col, 1, tiaoN, adv);
    L.bracket.add(g);
  });
  // 补间铺作（平身科）：落于阑额顶的小普拍枋上，顶恰承檐檩
  for(let k=0;k<4;k++){
    for(let j=0;j<P.shu;j++){
      const f = (j+0.5)/(P.shu+1);
      const sm = colPos[k].clone().lerp(colPos[(k+1)%4], f);
      const outDir = V3(sm.x,0,sm.z).normalize();
      const g = new THREE.Group();
      g.position.set(sm.x, flatTop+archH, sm.z);
      g.rotation.y = Math.atan2(outDir.x, outDir.z);
      box(g, 0.26, 0.06, 0.26, mWoodL, 0, 0.03, 0, {id:'flat'});
      const sInter = Math.max(0.4, (H_dg-0.24)/H_dg);
      const inner = new THREE.Group(); inner.position.y = 0.06; inner.scale.setScalar(sInter);
      bracketCore(inner, P.setNames.inter, 1, tiaoN, adv);
      g.add(inner);
      L.bracket.add(g);
    }
  }
  // 转角铺作：斜向铺作（双跳）+ 双墙面华栱
  colPos.forEach(cp=>{
    const out = V3(cp.x,0,cp.z).normalize();
    const g = new THREE.Group();
    g.position.set(cp.x, flatTop, cp.z);
    g.rotation.y = Math.atan2(out.x, out.z);
    bracketCore(g, P.setNames.corner, 1, 2, (H_dg-LUDO_H)/2);
    L.bracket.add(g);
    const Lw = (P.tieOut-0.12)*0.8;
    const yw = flatTop + LUDO_H + 0.5*((H_dg-LUDO_H)/2)*0.5;
    [ [Math.sign(cp.x),0], [0,Math.sign(cp.z)] ].forEach(([ax,az])=>{
      if(ax) box(L.bracket, Lw, 0.08, 0.12, mWood, cp.x + ax*(Lw/2), yw, cp.z, {id:'hua', set:P.setNames.corner});
      if(az) box(L.bracket, 0.12, 0.08, Lw, mWood, cp.x, yw, cp.z + az*(Lw/2), {id:'hua', set:P.setNames.corner});
    });
    if(P.hasAng){
      const yTop = flatTop + H_dg - 0.10;
      [ [Math.sign(cp.x),0], [0,Math.sign(cp.z)] ].forEach(([ax,az])=>{
        const A = V3(cp.x + ax*0.18, yTop, cp.z + az*0.18);
        const B = V3(cp.x + ax*P.tieOut*0.75, flatTop+H_dg+0.02, cp.z + az*P.tieOut*0.75);
        beam(L.bracket, A, B, 0.08, 0.08, mWood, {id:'ang', set:P.setNames.corner});
      });
    }
  });
  // 檐檩（转角十字搭交：主段全高 + 端段斫半）
  for(let k=0;k<4;k++){
    const ry = k*Math.PI/2;
    const c = rotY(0, a_p, ry);
    const tDir = rotY(1, 0, ry);
    const mainLen = 2*a_p - 0.30;
    const m1 = new THREE.Mesh(UNIT_BOX, mWoodL);
    m1.scale.set(mainLen, purlinH, 0.13);
    m1.position.copy(c).add(tDir.clone().multiplyScalar(-0.15)); m1.position.y = purlinB+purlinH/2;
    m1.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0), tDir);
    m1.castShadow=shadows; m1.receiveShadow=true; reg(m1, {id:'purlin'}, L.bracket);
    const m2 = new THREE.Mesh(UNIT_BOX, mWoodL);
    m2.scale.set(0.30, purlinH*0.5, 0.13);
    m2.position.copy(c).add(tDir.clone().multiplyScalar(a_p-0.15)); m2.position.y = purlinB+purlinH*0.25;
    m2.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0), tDir);
    m2.castShadow=shadows; m2.receiveShadow=true; reg(m2, {id:'shiziku'}, L.bracket);
  }
  // 角梁枋（转角铺作顶 → 檐檩角，闭合转角承托链）
  colPos.forEach(cp=>{
    const out = V3(cp.x,0,cp.z).normalize();
    const A = cp.clone().add(out.clone().multiplyScalar(P.tieOut/Math.SQRT2)); A.y = flatTop+H_dg-0.02;
    const B = cp.clone().add(out.clone().multiplyScalar(P.tieOut*Math.SQRT2)); B.y = purlinT+0.02;
    beam(L.bracket, A, B, 0.12, 0.10, mWoodL, {id:'jiaolin'});
  });
  // 箍头榫：老角梁端（榫头+箍带，梁层）与檐檩角卯口（檩层）
  colPos.forEach(cp=>{
    const out = V3(cp.x,0,cp.z).normalize();
    const C = cp.clone().add(out.clone().multiplyScalar(P.tieOut*Math.SQRT2));
    box(L.frame, 0.10, 0.08, 0.10, mWoodL, C.x, purlinT-0.01, C.z, {id:'gutou'});
    box(L.frame, 0.15, 0.035, 0.15, mWoodL, C.x, purlinT+0.10, C.z, {id:'gutou'});
    box(L.bracket, 0.14, 0.06, 0.14, mMort, C.x, purlinT+0.005, C.z, {id:'mortise'});
  });

  /* ============ ⑥ 梁架 ============ */
  [[colTop[0],colTop[2]], [colTop[1],colTop[3]]].forEach(pair=>{
    for(let u=0;u<2;u++){
      const y = topY + flatH + 0.06 + u*0.13;
      beam(L.frame, pair[0].clone().setY(y), pair[1].clone().setY(y), 0.13, 0.11, mWood, {id:'makubiki'});
    }
  });
  colPos.forEach(cp=>{
    const out = V3(cp.x,0,cp.z).normalize();
    const C = cp.clone().add(out.clone().multiplyScalar(P.tieOut*Math.SQRT2)); C.y = purlinT;
    const A = C.clone(); A.y += 0.06;
    // 老角梁收头于盘顶枋角（梁在屋面坡之内，不穿出望板）
    const B = V3(0.32*Math.sign(cp.x||1), H_apex-0.14, 0.32*Math.sign(cp.z||1));
    beam(L.frame, A, B, 0.13, 0.12, mWood, {id:'laojiao'});
    const M0 = A.clone().lerp(B, 0.45); M0.y += 0.05;
    box(L.frame, 0.16, 0.03, 0.16, mWoodL, M0.x, M0.y, M0.z, {id:'zijiao'});
    const B2 = V3(0.26*Math.sign(cp.x||1), H_apex-0.08, 0.26*Math.sign(cp.z||1));
    beam(L.frame, M0, B2, 0.10, 0.09, mWoodL, {id:'zijiao'});
  });
  {
    const h = (H_apex+P.leigong) - (H_ring-0.05);
    const g = new THREE.CylinderGeometry(0.085, 0.095, h, 10);
    const m = new THREE.Mesh(g, mCol);
    m.position.set(0, (H_apex+P.leigong+H_ring-0.05)/2, 0);
    m.castShadow=shadows; m.receiveShadow=true; reg(m, {id:'leigong'}, L.frame);
  }
  for(let k=0;k<4;k++){
    const ry = k*Math.PI/2;
    const c = rotY(0, a_top, ry);
    const tDir = rotY(1, 0, ry);
    const mainLen = 2*a_top - 0.14;
    const m1 = new THREE.Mesh(UNIT_BOX, mWoodL);
    m1.scale.set(mainLen, 0.10, 0.10);
    m1.position.copy(c).add(tDir.clone().multiplyScalar(-0.07)); m1.position.y = H_ring;
    m1.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0), tDir);
    m1.castShadow=shadows; m1.receiveShadow=true; reg(m1, {id:'panding'}, L.frame);
    const m2 = new THREE.Mesh(UNIT_BOX, mWoodL);
    m2.scale.set(0.14, 0.05, 0.10);
    m2.position.copy(c).add(tDir.clone().multiplyScalar(a_top-0.07)); m2.position.y = H_ring-0.025;
    m2.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0), tDir);
    m2.castShadow=shadows; m2.receiveShadow=true; reg(m2, {id:'shiziku'}, L.frame);
  }

  /* ============ ⑦ 椽望 ============ */
  const N = P.rafterN;
  const itemsYuan=[], itemsFei=[], itemsZheng=[], itemsLianyan=[], itemsGuantou=[], itemsQiaofei=[];
  // 椽枋（檐椽尾收头环；归梁架层 → 与椽拆解分离，显燕尾榫）
  for(let k=0;k<4;k++){
    const ry = k*Math.PI/2;
    const c = rotY(0, a_rr, ry);
    const tDir = rotY(1,0,ry);
    const mainLen = 2*a_rr - 0.28;
    const r1 = new THREE.Mesh(UNIT_BOX, mWood);
    r1.scale.set(mainLen, 0.11, 0.12);
    r1.position.copy(c).add(tDir.clone().multiplyScalar(-0.14)); r1.position.y = H_rr+0.055;
    r1.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0), tDir);
    r1.castShadow=shadows; r1.receiveShadow=true; reg(r1, {id:'rafterRing'}, L.frame);
    const r2 = new THREE.Mesh(UNIT_BOX, mWood);
    r2.scale.set(0.28, 0.055, 0.12);
    r2.position.copy(c).add(tDir.clone().multiplyScalar(a_rr-0.14)); r2.position.y = H_rr+0.028;
    r2.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0), tDir);
    r2.castShadow=shadows; r2.receiveShadow=true; reg(r2, {id:'rafterRing'}, L.frame);
  }
  for(let k=0;k<4;k++){
    const ry = k*Math.PI/2;
    const toWorld = p => { const q = rotY(p.x, p.z, ry); return V3(q.x, p.y, q.z); };
    for(let i=1;i<=N-1;i++){
      const t=i/N, x=-a+2*a*t;
      // 檐椽：檐檩 → 椽枋
      const P1 = toWorld(V3(x, purlinT+0.05, a_p+0.055));
      const P2 = toWorld(V3(x, H_rr+0.02, a_rr+0.055));
      itemsYuan.push(beamItem(P1,P2,0.09,0.09,{id:'yuanchuan'}));
      // 燕尾榫 + 卯口（每坡中点）
      if(i===Math.round(N/2)){
        const out = V3(0,0,1).applyAxisAngle(UP, ry);
        const wp = toWorld(V3(x, H_rr+0.055, a_rr+0.02));
        const wedge = new THREE.Mesh(makeWedge(0.10, 0.07, 0.13, 0.08), mWoodL);
        wedge.position.copy(wp);
        wedge.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), out);
        wedge.castShadow=shadows; reg(wedge, {id:'dovetail'}, L.rafter);
        const recess = new THREE.Mesh(makeWedge(0.035, 0.082, 0.148, 0.094), mMort);
        recess.position.copy(toWorld(V3(x, H_rr+0.055, a_rr-0.012)));
        recess.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), out);
        L.rafter.add(recess);
      }
      // 飞椽：叠于檐椽上，探出更深
      const z3 = a_p + 0.20;
      const f = (z3-(a_p+0.055))/((a_rr+0.055)-(a_p+0.055));
      const yE = (purlinT+0.05) + f*((H_rr+0.02)-(purlinT+0.05));
      const P3 = toWorld(V3(x, yE+0.08, z3));
      const P4 = toWorld(V3(x, edgeY(t)+0.10, a-0.02));
      itemsFei.push(beamItem(P3,P4,0.08,0.07,{id:'feichuan'}));
      // 正椽：檐口 → 盘顶枋（角椽落于仔角梁）
      const E = toWorld(V3(x, edgeY(t)+0.178, a-0.03));
      const T = toWorld(V3(x*(a_top/a), H_ring, a_top));
      itemsZheng.push(beamItem(E,T,0.085,0.085,{id:'zhengchuan'}));
      // 连檐 + 椽头
      const eDir = rotY(1,0,ry);
      const eQ = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1), eDir);
      itemsLianyan.push({ pos:toWorld(V3(x, edgeY(t)+0.16, a)), quat:eQ, scale:new THREE.Vector3(0.16,0.05,0.30), comp:{id:'lianyan'} });
      itemsGuantou.push({ pos:toWorld(V3(x, edgeY(t)+0.21, a+0.01)), quat:eQ, scale:new THREE.Vector3(0.12,0.05,0.11), comp:{id:'guantou'} });
    }
    // 翼角翘飞椽（每角 3 椽，斜挑上翘）
    const E0 = toWorld(V3(-a, edgeY(0), a));
    const dOut = V3(-1,0,1).normalize().applyAxisAngle(UP, ry);
    [0.10,0.45,0.80].forEach((off,j)=>{
      const th = 0.15+0.17*j;
      const S = E0.clone().add(dOut.clone().multiplyScalar(off)); S.y = edgeY(0)+0.26;
      const dir = V3(dOut.x*Math.cos(th), Math.sin(th), dOut.z*Math.cos(th));
      const En = S.clone().add(dir.clone().multiplyScalar(0.42));
      itemsQiaofei.push(beamItem(S,En,0.09,0.07,{id:'qiaofei'}));
    });
    // 望板（坡面：椽顶之上）
    {
      const seg=12, rows=4;
      const pts = new Float32Array((seg+1)*rows*3);
      let idx=0;
      for(let s=0;s<rows;s++){
        const f = s/(rows-1);
        for(let i=0;i<=seg;i++){
          const t=i/seg, x=-a+2*a*t;
          const E0b = toWorld(V3(x, edgeY(t)+0.225, a-0.06));
          const T0b = toWorld(V3(x*(a_top/a), H_apex-0.085, a_top-0.01));
          const p = E0b.clone().lerp(T0b, f);
          pts[idx++]=p.x; pts[idx++]=p.y; pts[idx++]=p.z;
        }
      }
      const geo=new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pts,3));
      const index=[];
      for(let i=0;i<seg;i++) for(let s=0;s<rows-1;s++){
        const p0=i*rows+s, p1=(i+1)*rows+s, p2=(i+1)*rows+s+1, p3=i*rows+s+1;
        index.push(p0,p2,p1, p0,p3,p2);
      }
      geo.setIndex(index);
      const g2 = geo.toNonIndexed();
      g2.computeVertexNormals();
      const mesh = new THREE.Mesh(g2, mBoard);
      mesh.castShadow=shadows; mesh.receiveShadow=true;
      reg(mesh, {id:'wangban'}, L.rafter);
    }
  }
  inst(L.rafter, UNIT_BOX, mWood, itemsYuan);
  inst(L.rafter, UNIT_BOX, mWood, itemsFei);
  inst(L.rafter, UNIT_BOX, mWood, itemsZheng);
  inst(L.rafter, UNIT_BOX, mBoard, itemsLianyan);
  inst(L.rafter, UNIT_BOX, mTileD, itemsGuantou);
  inst(L.rafter, UNIT_BOX, mWood, itemsQiaofei);
  // 馒头榫：正椽头 → 盘顶枋（每坡中点；椽层 vs 梁层 → 拆解分离可见）
  for(let k=0;k<4;k++){
    const ry = k*Math.PI/2;
    const toWorld = p => { const q = rotY(p.x, p.z, ry); return V3(q.x, p.y, q.z); };
    const E = toWorld(V3(0, edgeY(0.5)+0.178, a-0.03));
    const T = toWorld(V3(0, H_ring, a_top));
    const dir = new THREE.Vector3().subVectors(T,E).normalize();
    const A = T.clone().sub(dir.clone().multiplyScalar(0.06));
    const Bp = T.clone().add(dir.clone().multiplyScalar(0.06));
    const g = new THREE.CylinderGeometry(0.035,0.035,0.12,8);
    const m = new THREE.Mesh(g, mWoodL);
    m.position.copy(A).add(Bp).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
    m.castShadow=shadows; reg(m, {id:'mantou'}, L.rafter);
    const mp = T.clone().sub(dir.clone().multiplyScalar(0.05));
    box(L.frame, 0.09, 0.09, 0.06, mMort, mp.x, mp.y, mp.z, {id:'mortise'});
  }

  /* ============ ⑧ 瓦作 ============ */
  // 筒瓦（沿正椽，六角柱段，实例化；角位由垂脊/翼角覆盖，不重复铺瓦）
  const itemsGuan = [];
  for(let k=0;k<4;k++){
    const ry = k*Math.PI/2;
    const toWorld = p => { const q = rotY(p.x, p.z, ry); return V3(q.x, p.y, q.z); };
    for(let i=1;i<=N-1;i++){
      const t=i/N, x=-a+2*a*t;
      const E = toWorld(V3(x, edgeY(t)+0.178, a-0.03));
      const T = toWorld(V3(x*(a_top/a), H_ring, a_top));
      const it = beamItem(E,T,1,1,{id:'guan'});
      const localY = new THREE.Vector3(0,1,0).applyQuaternion(it.quat);
      it.pos.add(localY.multiplyScalar(0.10));
      it.scale = new THREE.Vector3(1,1,it.scale.z+0.05);
      itemsGuan.push(it);
    }
  }
  const guanGeo = new THREE.CylinderGeometry(0.045,0.045,1,6);
  guanGeo.rotateX(Math.PI/2);
  inst(L.tile, guanGeo, mTile, itemsGuan);
  // 连檐瓦条（檐口曲线）
  for(let k=0;k<4;k++){
    const ry = k*Math.PI/2;
    const pts=[];
    for(let i=0;i<=8;i++){
      const t=i/8, x=-a+2*a*t;
      const q = rotY(x, a, ry);
      pts.push(V3(q.x, edgeY(t)+0.27, q.z));
    }
    const curve = new THREE.CatmullRomCurve3(pts);
    const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 14, 0.045, 6, false), mTileD);
    tube.castShadow=shadows; reg(tube, {id:'lianyan'}, L.tile);
  }
  // 垂脊 + 戗兽
  for(let k=0;k<4;k++){
    const ry = k*Math.PI/2;
    const E0 = rotY(-a, a, ry); E0.y = edgeY(0);
    const dOut = V3(-1,0,1).normalize().applyAxisAngle(UP, ry);
    const W = E0.clone().add(dOut.clone().multiplyScalar(1.16)); W.y = edgeY(0)+0.47;
    // 垂脊落在屋面角脊线上（檐口角→盘顶枋角→顶心），略浮于坡面
    const Ec = E0.clone(); Ec.y += 0.05;
    const Rc = rotY(-a_top, a_top, ry); Rc.y = H_apex-0.085+0.05;
    const Mid = Ec.clone().lerp(Rc, 0.5);
    const Ap = V3(0, H_apex+0.02, 0);
    const curve = new THREE.CatmullRomCurve3([W, Ec, Mid, Rc, Ap]);
    const ridge = new THREE.Mesh(new THREE.TubeGeometry(curve, 16, 0.06, 6, false), mTile);
    ridge.castShadow=shadows; reg(ridge, {id:'chuiji'}, L.tile);
    // 戗兽
    const base = new THREE.Mesh(UNIT_BOX, mTileD); base.scale.set(0.15,0.10,0.15); base.position.copy(W);
    base.castShadow=shadows; reg(base, {id:'jiwei'}, L.tile);
    const cone = new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.055,0.17,6), mTileD);
    cone.position.copy(W).add(V3(0,0.10,0));
    const axis = new THREE.Vector3().crossVectors(UP, dOut).normalize();
    cone.quaternion.setFromAxisAngle(axis, 0.9);
    cone.castShadow=shadows; reg(cone, {id:'jiwei'}, L.tile);
    const dirCone = UP.applyQuaternion(cone.quaternion);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.04,6,5), mGold);
    tip.position.copy(W).add(V3(0,0.10,0)).add(dirCone.clone().multiplyScalar(0.09));
    tip.castShadow=shadows; reg(tip, {id:'jiwei'}, L.tile);
  }
  // 顶心（宝顶座，四棱锥）
  {
    const baseY = H_apex-0.10, apexY = H_apex+0.02, s2 = a_top+0.02;
    const corners=[[-s2,-s2],[s2,-s2],[s2,s2],[-s2,s2]];
    const posArr=[];
    for(let i=0;i<4;i++){
      const p0=corners[i], p1=corners[(i+1)%4];
      posArr.push(p0[0],baseY,p0[1], 0,apexY,0, p1[0],baseY,p1[1]);
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(posArr),3));
    g.computeVertexNormals();
    const cap=new THREE.Mesh(g, mTile);
    cap.castShadow=shadows; reg(cap, {id:'cap'}, L.tile);
  }
  // 宝顶
  const finBase = H_apex + P.leigong;
  {
    const g1 = new THREE.CylinderGeometry(0.055, 0.07, 0.10, 10);
    const m1 = new THREE.Mesh(g1, mGold); m1.position.set(0, finBase+0.05, 0);
    m1.castShadow=shadows; reg(m1, {id:'baoding'}, L.tile);
    const lotus = new THREE.Mesh(new THREE.SphereGeometry(0.085,8,6), mGold);
    lotus.position.set(0, finBase+0.17, 0); lotus.castShadow=shadows; reg(lotus, {id:'baoding'}, L.tile);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.045,6,5), mGold);
    tip.position.set(0, finBase+0.28, 0); tip.castShadow=shadows; reg(tip, {id:'baoding'}, L.tile);
  }

  root.scale.setScalar(scale);
  root.userData.height = finBase + 0.34;
  root.userData.tiaoN = tiaoN;
  return { root, L, pickables, mats, P };
}

/* ============ 六、舞台管理（主景 / 并置对比） ============ */
const state = {
  era:0, mode:'main', explode:0,
  wire:false, clip:false,
  sel:null,
  main:null, compPavilions:[], labels:[],
  layerVis: LAYER_DEF.map(()=>true),
};
function isShown(o){ for(let n=o;n;n=n.parent){ if(n.visible===false) return false; } return true; }
function disposePav(p){
  if(!p) return;
  p.root.traverse(o=>{
    if(o.isMesh && o.geometry && o.geometry!==UNIT_BOX && o.geometry!==UNIT_CYL) o.geometry.dispose();
  });
  p.mats.forEach(m=>m.dispose());
  scene.remove(p.root);
}
function applyClipTo(p, on){
  p.mats.forEach(m=>{ m.clippingPlanes = on ? [clipPlane] : null; m.clipShadows = true; m.needsUpdate = true; });
}
function applyExplode(){
  if(!state.main) return;
  LAYER_DEF.forEach((d,i)=>{ state.main.L[d.id].position.y = EXPLODE[i]*G*state.explode; });
}
function applyLayerVis(){
  if(!state.main) return;
  LAYER_DEF.forEach((d,i)=>{ state.main.L[d.id].visible = state.layerVis[i]; });
}
function applyWire(){
  const list = state.mode==='main' ? (state.main?[state.main]:[]) : state.compPavilions;
  list.forEach(p=> p.root.traverse(o=>{ if(o.isMesh && o.material) o.material.wireframe = state.wire; }));
}
function clearSelection(){
  state.sel = null;
  document.getElementById('info').style.display='none';
}
function restoreSelection(){
  if(!state.sel) return;
  const s=state.sel;
  if(s.im){ s.im.setColorAt(s.instanceId, new THREE.Color(0xffffff)); if(s.im.instanceColor) s.im.instanceColor.needsUpdate=true; }
  else if(s.matOrig){ s.obj.material = s.matOrig; }
  state.sel=null;
}
function setEra(i){
  state.era = i;
  if(state.mode!=='main') enterMain();
  const P = ERAS[i];
  const ex = state.explode;
  disposePav(state.main);
  state.main = buildPavilion(P, {scale:1, shadows:true});
  scene.add(state.main.root);
  state.explode = ex;
  applyExplode(); applyLayerVis();
  if(state.wire) applyWire();
  if(state.clip) applyClipTo(state.main, true);
  document.querySelectorAll('#eraBtns button').forEach((b,bi)=>b.classList.toggle('on', bi===i));
  updateTableHi();
  clearSelection();
}
function buildCompare(){
  ERAS.forEach((P,i)=>{
    const p = buildPavilion(P, {scale:0.30, shadows:false});
    p.root.position.set((i-2)*2.45, 0, 0);
    scene.add(p.root);
    state.compPavilions.push(p);
    if(state.clip) applyClipTo(p, true);
    if(state.wire) p.root.traverse(o=>{ if(o.isMesh && o.material) o.material.wireframe = true; });
    const d = document.createElement('div');
    d.className='clabel';
    d.innerHTML = `<b>${P.name} · ${P.sub}</b><span>斗栱高/柱高 ${P.bracketRatio.toFixed(2)} · 举高/进深 ${P.slope.toFixed(2)} · 檐出/柱高 ${(P.eaveOut/P.colH).toFixed(2)}</span>`;
    document.getElementById('labels').appendChild(d);
    state.labels.push({el:d, p});
  });
}
function clearCompare(){
  state.compPavilions.forEach(p=>disposePav(p));
  state.compPavilions=[];
  state.labels.forEach(l=>l.el.remove());
  state.labels=[];
}
function enterCompare(){
  state.mode='compare';
  state.main.root.visible=false;
  buildCompare();
  controls.target.set(0,1.1,0);
  camera.position.set(0,2.6,9.5);
  document.getElementById('btnCompare').classList.add('on');
  document.getElementById('left').classList.add('dim');
}
function enterMain(){
  if(state.mode==='main') return;
  state.mode='main';
  clearCompare();
  state.main.root.visible=true;
  controls.target.set(0,2.4,0);
  camera.position.set(6.2,3.4,7.0);
  document.getElementById('btnCompare').classList.remove('on');
  document.getElementById('left').classList.remove('dim');
}

/* ============ 七、UI 绑定 ============ */
{
  const eb = document.getElementById('eraBtns');
  ERAS.forEach((P,i)=>{
    const b=document.createElement('button');
    b.textContent = P.name;
    b.title = P.sub;
    b.onclick=()=>setEra(i);
    eb.appendChild(b);
  });
  const ll = document.getElementById('layerList');
  LAYER_DEF.forEach((d,i)=>{
    const lb=document.createElement('label'); lb.className='row';
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=true;
    cb.onchange=()=>{
      state.layerVis[i]=cb.checked;
      if(state.mode==='main') applyLayerVis();
    };
    lb.appendChild(cb); lb.appendChild(document.createTextNode(d.name));
    ll.appendChild(lb);
  });
  const exEl = document.getElementById('explode');
  exEl.oninput = e=>{
    state.explode = e.target.value/100;
    document.getElementById('explodeVal').textContent = e.target.value+'%';
    applyExplode();
  };
  document.getElementById('btnExpl0').onclick=()=>{ exEl.value=0; exEl.oninput({target:{value:'0'}}); };
  document.getElementById('btnExpl1').onclick=()=>{ exEl.value=100; exEl.oninput({target:{value:'100'}}); };
  document.getElementById('btnWire').onclick=e=>{
    state.wire=!state.wire;
    e.currentTarget.classList.toggle('on', state.wire);
    applyWire();
  };
  document.getElementById('btnClip').onclick=e=>{
    state.clip=!state.clip;
    e.currentTarget.classList.toggle('on', state.clip);
    document.getElementById('clipSec').style.display = state.clip?'block':'none';
    clipVisual.visible = state.clip;
    if(state.mode==='main') applyClipTo(state.main, state.clip);
    else state.compPavilions.forEach(p=>applyClipTo(p, state.clip));
    syncClip();
  };
  document.getElementById('clipPos').oninput = syncClip;
  document.getElementById('btnReset').onclick=()=>{
    if(state.mode==='main'){ camera.position.set(6.2,3.4,7.0); controls.target.set(0,2.4,0); }
    else { camera.position.set(0,2.6,9.5); controls.target.set(0,1.1,0); }
  };
  document.getElementById('btnCompare').onclick=()=>{ state.mode==='main'? enterCompare(): enterMain(); };
  document.getElementById('infoClose').onclick=clearSelection;
}
function syncClip(){
  const c = document.getElementById('clipPos').value/100;
  clipPlane.constant = c;
  clipVisual.position.x = c;
}

/* 朝代参数表（可读数值） */
function buildTable(){
  const rows = [
    ['斗栱高 / 柱高', e=>e.bracketRatio.toFixed(2), '大 → 小'],
    ['补间铺作（攒/面）', e=>String(e.shu), '疏 → 密'],
    ['檐出 / 柱高', e=>(e.eaveOut/e.colH).toFixed(2), '深远 → 收浅'],
    ['举高 / 进深（屋面坡度）', e=>e.slope.toFixed(2), '平缓 → 陡峻'],
    ['柱高 / 柱径', e=>(e.colH/(2*e.colR)).toFixed(1), '粗壮 → 修长'],
    ['椽/面（椽数）', e=>String(e.rafterN), '疏 → 密'],
  ];
  let html = '<h3>朝代形制参数对比（可核验比值）</h3><table><tr><th>形制参数</th>';
  ERAS.forEach((P,i)=>html+=`<th id="thEra${i}">${P.name}</th>`);
  html+='<th>趋势</th></tr>';
  rows.forEach((r,ri)=>{
    html+=`<tr><td>${r[0]}</td>`;
    ERAS.forEach((P,i)=>html+=`<td id="tdEra${i}_${ri}">${r[1](P)}</td>`);
    html+=`<td class="trend">${r[2]}</td></tr>`;
  });
  html+='</table>';
  document.getElementById('table').innerHTML = html;
  updateTableHi();
}
function updateTableHi(){
  ERAS.forEach((P,i)=>{
    const th=document.getElementById('thEra'+i); if(th) th.classList.toggle('hi', i===state.era);
    for(let ri=0; ri<6; ri++){
      const td=document.getElementById(`tdEra${i}_${ri}`);
      if(td) td.classList.toggle('hi', i===state.era);
    }
  });
}
buildTable();

/* ============ 八、拾取与构件信息 ============ */
const raycaster = new THREE.Raycaster();
const ptr = new THREE.Vector2();
let downPos=null;
renderer.domElement.addEventListener('pointerdown', e=>{ downPos=[e.clientX,e.clientY]; });
renderer.domElement.addEventListener('pointerup', e=>{
  if(!downPos) return;
  const dx=e.clientX-downPos[0], dy=e.clientY-downPos[1];
  downPos=null;
  if(dx*dx+dy*dy>25) return;
  ptr.x=(e.clientX/window.innerWidth)*2-1;
  ptr.y=-(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(ptr, camera);
  const pool = state.mode==='main' ? (state.main?[state.main]:[]) : state.compPavilions;
  let hit=null, which=null;
  for(const p of pool){
    const res = raycaster.intersectObjects(p.root.children, true);
    for(const r of res){
      const o=r.object;
      if(!isShown(o)) continue;
      if(o.userData.comp || o.userData.compByInstance){ hit=r; which=p; break; }
    }
    if(hit) break;
  }
  restoreSelection();
  if(!hit){ clearSelection(); return; }
  const o = hit.object;
  let comp=null, instId=null;
  if(o.userData.compByInstance){ comp=o.userData.compByInstance[hit.instanceId]; instId=hit.instanceId; }
  else comp=o.userData.comp;
  if(!comp){ clearSelection(); return; }
  if(o.isInstancedMesh){
    o.setColorAt(instId, new THREE.Color(0xffc94a));
    if(o.instanceColor) o.instanceColor.needsUpdate=true;
    state.sel = {obj:o, im:o, instanceId:instId, comp};
  } else {
    const orig=o.material;
    o.material = orig.clone();
    o.material.emissive = new THREE.Color(0x7a5a10);
    o.material.emissiveIntensity = 0.55;
    state.sel = {obj:o, matOrig:orig, comp};
  }
  showInfo(comp, which);
});
function showInfo(comp, whichP){
  const c = COMP[comp.id]; if(!c) return;
  const era = whichP ? whichP.P : ERAS[state.era];
  document.getElementById('iName').textContent = c.n;
  const setLine = comp.set ? `｜属「${comp.set}」` : '';
  document.getElementById('iTerm').textContent = `${c.t}${setLine}`;
  let func = c.f;
  if(comp.id==='ang') func += `（本朝代：${era.angName}）`;
  if(comp.id==='hua'||comp.id==='ludou') func += `（本朝代铺作：${era.setNames.col}）`;
  document.getElementById('iFunc').textContent = func;
  document.getElementById('iMeta').innerHTML =
    `<b>所属层级</b> ${LAYER_OF[comp.id]||'—'}<br>`+
    `<b>朝代形制</b> ${era.name} · ${era.sub} — ${era.style}<br>`+
    `<b>观测提示</b> 拖动「拆解程度」或开启「剖切」可观察榫卯与内部梁架。`;
  document.getElementById('info').style.display='block';
}

/* ============ 九、主循环 ============ */
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
const projV = new THREE.Vector3();
function updateLabels(){
  if(state.mode!=='compare') return;
  state.labels.forEach(l=>{
    projV.copy(l.p.root.position).add(V3(0, l.p.root.userData.height*0.30 + 0.25, 0));
    projV.project(camera);
    const x=(projV.x*0.5+0.5)*window.innerWidth, y=(-projV.y*0.5+0.5)*window.innerHeight;
    l.el.style.left=x+'px'; l.el.style.top=y+'px';
    l.el.style.display = projV.z<1 ? 'block':'none';
  });
}
function loop(){
  requestAnimationFrame(loop);
  controls.update();
  updateLabels();
  renderer.render(scene, camera);
}
setEra(0);
loop();
</script>
