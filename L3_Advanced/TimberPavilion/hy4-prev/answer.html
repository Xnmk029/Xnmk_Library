  P.beamW = 0.72 * P.beamH;                                 // 梁宽（高∶宽 ≈ 1∶0.72）
  P.yBeam1 = P.yDgTop;                                      // 长趴梁底
  P.yBeam2 = P.yDgTop + P.beamH;                            // 短趴梁（十字搭接）顶
  P.yTaiping = P.yDgTop + P.beamH;                          // 太平梁底
  P.yLeigong = P.yDgTop + 2 * P.beamH;                      // 雷公柱底（太平梁顶）

  P.hEave = profileH(P, P.tp);                              // 檐口至檐檩的举高
  P.yEave = P.yDgTop + P.raftD - P.hEave;                   // 檐口标高
  P.apex = P.yEave + P.juTotal;                             // 屋面攒尖顶（雷公柱顶）

  P.hLeigong = P.apex - P.yLeigong;
  P.cWell = 0.34 * P.rPur;                                  // 井口半边（须令梁架顶面低于屋面）
  P.finialH = 0.30 + 4.5 * P.K;                             // 宝顶通高

  /* —— 可核验的形制指标 —— */
  P.m_dgRatio = P.dgH / P.colH;
  P.m_colSlend = P.colH / P.colD;
  P.m_colKou = P.colH / P.K;
  P.m_colDKou = P.colD / P.K;
  P.m_eaveRatio = P.eave / P.colH;
  P.m_juRatio = P.juTotal / P.aEave;
  P.m_eaveKou = P.eave / P.K;
  P.m_purlinKou = (P.rPur - HALF) / P.K;
  P.m_dgOutKou = P.dgOut / P.K;
  P.m_totalH = P.apex + P.finialH;
  return P;
}

/* 举折／举架剖面：三段折线，t∈[0,1] 自檐口至脊 */
function profileH(P, t) {
  var h = P.juH, s = P.step * 3;   // s = aEave
  var u = clamp(t, 0, 1) * s;      // 自檐口起算的水平进深
  if (u <= P.step) return h[0] * (u / P.step);
  if (u <= 2 * P.step) return h[0] + h[1] * ((u - P.step) / P.step);
  return h[0] + h[1] + h[2] * ((u - 2 * P.step) / P.step);
}

/* 翼角「生出·起翘」衰减：檐口处最大，至檐檩（t=tp）归零 —— 檐檩为水平构件，
   故角部冲出与翘起全部由檐檩以外的檐椽／飞椽／仔角梁完成，此即翼角生成的力学本质。 */
function tipG(P, t) { return Math.pow(clamp((P.tp - t) / P.tp, 0, 1), 1.0); }
function liftG(P, t) { return Math.pow(clamp((P.tp - t) / P.tp, 0, 1), P.qLift); }

/* 檐口平面：正方（半跨 aEave）＋ 角部沿对角线「生出」s，权重由 qPow 控制集中程度
   —— qPow 小＝水戗发戗（唐宋，起翘平缓外伸）；qPow 大＝嫩戗发戗（明清，起翘急骤）。 */
function eaveRadius(P, phi) {
  var c = Math.abs(Math.cos(phi)), n = Math.abs(Math.sin(phi));
  var m = Math.max(c, n), mn = Math.min(c, n);
  var w = Math.pow(mn / m, P.qPow);
  return { rBase: P.aEave / m, w: w, r0: P.aEave / m + P.sheng * w };
}

/* 生成檐口轮廓顶点表（rBase＝正方形基线半径，w＝角权重，r0＝檐口实际半径） */
function eaveVerts(P, seg) {
  var N = 4 * seg, out = [];
  for (var j = 0; j < N; j++) {
    var phi = TAU * j / N;
    var e = eaveRadius(P, phi);
    out.push({
      phi: phi, rBase: e.rBase, w: e.w, r0: e.r0,
      cos: Math.cos(phi), sin: Math.sin(phi),
      corner: (j % seg === seg / 2), idx: j
    });
  }
  return out;
}

/* 屋面（望板顶面）上任意点：t=0 檐口，t=tp 檐檩，t=1 攒尖 */
function surfPoint(P, vert, t) {
  var r = vert.rBase * (1 - t) + P.sheng * vert.w * tipG(P, t);
  var y = P.yEave + profileH(P, t) + P.lift * vert.w * liftG(P, t);
  return V3(r * vert.cos, y, r * vert.sin);
}
/* 屋面（含筒瓦垄起伏） */
function tilePoint(P, vert, t, ridge) {
  var p = surfPoint(P, vert, t);
  if (ridge) p.y += P.tileH * (1 - Math.pow(clamp(t, 0, 1), 2.2));
  return p;
}
/* 构件沿屋面射线摆放所需坐标系（X＝坡度方向，Y＝屋面法向） */
function rayFrame(p0, p1) {
  var X = new THREE.Vector3().subVectors(p1, p0).normalize();
  var right = new THREE.Vector3().crossVectors(X, V3(0, 1, 0));
  if (right.lengthSq() < 1e-8) right.set(1, 0, 0);
  right.normalize();
  var Y = new THREE.Vector3().crossVectors(right, X).normalize();
  return { X: X, Y: Y, Z: right };
}

/* -------------------------------------------------- 2. 低模几何构建器
   以顶点色合并同一构件类型的全部实体，flatShading 呈现低模折面。
   ------------------------------------------------------------------ */
function Builder() { this.pos = []; this.nor = []; this.col = []; }
Builder.prototype._push = function (geo, mat, color) {
  var g = (geo.index ? geo.toNonIndexed() : geo.clone());
  if (g === geo) g = geo.clone();
  g.applyMatrix4(mat);
  var pa = g.attributes.position.array, na = g.attributes.normal.array;
  var n = g.attributes.position.count;
  var c = new THREE.Color(color);
  for (var i = 0; i < n; i++) {
    this.pos.push(pa[i * 3], pa[i * 3 + 1], pa[i * 3 + 2]);
    this.nor.push(na[i * 3], na[i * 3 + 1], na[i * 3 + 2]);
    this.col.push(c.r, c.g, c.b);
  }
  g.dispose();
  return this;
};
/* 轴对齐长方体 */
Builder.prototype.box = function (w, h, d, color, x, y, z, ry) {
  var g = new THREE.BoxGeometry(w, h, d);
  var m = new THREE.Matrix4().makeRotationY(ry || 0);
  m.setPosition(x, y, z);
  this._push(g, m, color); g.dispose(); return this;
};
/* 任意向杆件：p0→p1 为长度轴，h 为竖向厚度，w 为侧向宽度 */
Builder.prototype.beam = function (p0, p1, w, h, color) {
  var d = new THREE.Vector3().subVectors(p1, p0);
  var len = d.length(); if (len < 1e-6) return this;
  var X = d.clone().normalize();
  var up = V3(0, 1, 0);
  var Y = up.clone().addScaledVector(X, -up.dot(X));
  if (Y.lengthSq() < 1e-8) { Y.set(0, 1, 0).addScaledVector(X, -X.y); }
  Y.normalize();
  var Z = new THREE.Vector3().crossVectors(X, Y).normalize();
  var m = new THREE.Matrix4().makeBasis(X, Y, Z);
  m.setPosition((p0.x + p1.x) / 2, (p0.y + p1.y) / 2, (p0.z + p1.z) / 2);
  var g = new THREE.BoxGeometry(len, h, w);
  this._push(g, m, color); g.dispose(); return this;
};
/* 沿指定上向量摆放的杆件（屋面构件用） */
Builder.prototype.ray = function (p0, p1, w, h, color, frameY) {
  var d = new THREE.Vector3().subVectors(p1, p0);
  var len = d.length(); if (len < 1e-6) return this;
  var X = d.clone().normalize();
  var Y = (frameY ? frameY.clone() : V3(0, 1, 0));
  Y.addScaledVector(X, -Y.dot(X));
  if (Y.lengthSq() < 1e-8) Y.set(0, 1, 0).addScaledVector(X, -X.y);
  Y.normalize();
  var Z = new THREE.Vector3().crossVectors(X, Y).normalize();
  var m = new THREE.Matrix4().makeBasis(X, Y, Z);
  m.setPosition((p0.x + p1.x) / 2, (p0.y + p1.y) / 2, (p0.z + p1.z) / 2);
  var g = new THREE.BoxGeometry(len, h, w);
  this._push(g, m, color); g.dispose(); return this;
};
/* 圆柱（Y 轴） */
Builder.prototype.cyl = function (r1, r2, h, seg, color, x, y, z) {
  var g = new THREE.CylinderGeometry(r1, r2, h, seg);
  var m = new THREE.Matrix4().makeTranslation(x, y, z);
  this._push(g, m, color); g.dispose(); return this;
};
/* 正 n 棱柱／棱台（Y 轴） */
Builder.prototype.prism = function (n, r1, r2, h, color, x, y, z, ry) {
  var g = new THREE.CylinderGeometry(r1, r2, h, n);
  var m = new THREE.Matrix4().makeRotationY(ry || 0); m.setPosition(x, y, z);
  this._push(g, m, color); g.dispose(); return this;
};
/* 旋转体（柱础／宝顶） */
Builder.prototype.lathe = function (pts, seg, color, x, y, z) {
  var v = pts.map(function (p) { return new THREE.Vector2(p[0], p[1]); });
  var g = new THREE.LatheGeometry(v, seg);
  var m = new THREE.Matrix4().makeTranslation(x, y, z);
  this._push(g, m, color); g.dispose(); return this;
};
/* 挤出体（雀替等曲线构件） */
Builder.prototype.extrude = function (shape, depth, color, x, y, z, ry) {
  var g = new THREE.ExtrudeGeometry(shape, { depth: depth, bevelEnabled: false, curveSegments: 6 });
  var m = new THREE.Matrix4().makeRotationY(ry || 0); m.setPosition(x, y, z);
  this._push(g, m, color); g.dispose(); return this;
};
/* 任意四边形板（望板／屋面分片） */
Builder.prototype.quad = function (a, b, c, d2, color) {
  var g = new THREE.BufferGeometry();
  var p = new Float32Array([
    a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z,
    a.x, a.y, a.z, c.x, c.y, c.z, d2.x, d2.y, d2.z]);
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  g.computeVertexNormals();
  var m = new THREE.Matrix4();
  this._push(g, m, color); g.dispose(); return this;
};
Builder.prototype.empty = function () { return this.pos.length === 0; };
Builder.prototype.build = function () {
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(this.pos), 3));
  g.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(this.nor), 3));
  g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(this.col), 3));
  g.computeBoundingBox(); g.computeBoundingSphere();
  return g;
};

/* -------------------------------------------------- 3. 构件层定义（自下而上） */
var LAYERS = [
  { id: 'plat',   name: '台基',       hex: '#b9b3a4' },
  { id: 'plinth', name: '柱础',       hex: '#c4beaf' },
  { id: 'col',    name: '檐柱',       hex: '#a03a2c' },
  { id: 'arch',   name: '额枋·平板枋', hex: '#c08a3e' },
  { id: 'dg',     name: '斗栱铺作',   hex: '#b0643f' },
  { id: 'frame',  name: '梁架',       hex: '#8a4a30' },
  { id: 'hip',    name: '角梁·由戗',   hex: '#8f5a34' },
  { id: 'raft',   name: '椽望',       hex: '#a87c4c' },
  { id: 'tile',   name: '瓦作·戗脊',   hex: '#5f6a72' },
  { id: 'finial', name: '宝顶',       hex: '#c9a227' }
];
var LORDER = {}; LAYERS.forEach(function (l, i) { l.order = i; LORDER[l.id] = i; });

/* 柱身轴线（含侧脚）与柱径（含收分） */
function colAxis(P, sx, sz, y) {
  var t = clamp((y - P.yPlinth) / P.colH, 0, 1);
  var d = P.sideJiao * P.colH * t / Math.sqrt(sx * sx + sz * sz);
  return V3(sx - sx * d, y, sz - sz * d);
}
function colRad(P, y) {
  var t = clamp((y - P.yPlinth) / P.colH, 0, 1);
  return (P.colD / 2) * (1 - P.taper * t);
}
/* 倾斜收分柱（八棱） */
function taperBeam(b, n, r0, r1, p0, p1, color) {
  var d = new THREE.Vector3().subVectors(p1, p0); var len = d.length();
  if (len < 1e-6) return;
  var X = d.clone().normalize(), up = V3(0, 1, 0);
  var Y = up.clone().addScaledVector(X, -up.dot(X));
  if (Y.lengthSq() < 1e-8) Y.set(0, 1, 0).addScaledVector(X, -X.y);
  Y.normalize();
  var Z = new THREE.Vector3().crossVectors(X, Y).normalize();
  var m = new THREE.Matrix4().makeBasis(Y, X, Z.clone().negate());
  m.setPosition((p0.x + p1.x) / 2, (p0.y + p1.y) / 2, (p0.z + p1.z) / 2);
  var g = new THREE.CylinderGeometry(r1, r0, len, n);
  b._push(g, m, color); g.dispose();
}
/* 楔形构件（昂、耍头）：沿 X 长度方向，底面平，前端高 hB、后端高 hA */
function wedgeGeo(len, hA, hB, d) {
  var L = len / 2, D = d / 2;
  var v = {
    a0: [-L, 0, -D], b0: [L, 0, -D], c0: [L, 0, D], d0: [-L, 0, D],
    a1: [-L, hA, -D], b1: [L, hB, -D], c1: [L, hB, D], d1: [-L, hA, D]
  };
  var faces = [
    [v.a0, v.d0, v.c0, v.b0], [v.a1, v.b1, v.c1, v.d1],
    [v.a0, v.b0, v.b1, v.a1], [v.d0, v.d1, v.c1, v.c0],
    [v.a0, v.a1, v.d1, v.d0], [v.b0, v.c0, v.c1, v.b1]
  ];
  var pos = [];
  faces.forEach(function (f) {
    pos.push(f[0][0], f[0][1], f[0][2], f[1][0], f[1][1], f[1][2], f[2][0], f[2][1], f[2][2]);
    pos.push(f[0][0], f[0][1], f[0][2], f[2][0], f[2][1], f[2][2], f[3][0], f[3][1], f[3][2]);
  });
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
  g.computeVertexNormals();
  return g;
}
function wedge(b, len, hA, hB, d, color, mat) {
  b._push(wedgeGeo(len, hA, hB, d), mat, color);
}
/* 以「方向 dir（XZ 平面单位向量）＋原点」构成构件局部标架：X＝出跳，Y＝上，Z＝面阔向 */
function dirMatrix(dir, origin) {
  var X = V3(dir.x, 0, dir.z).normalize();
  var Y = V3(0, 1, 0);
  var Z = new THREE.Vector3().crossVectors(X, Y).normalize();
  var m = new THREE.Matrix4().makeBasis(X, Y, Z);
  m.setPosition(origin.x, origin.y, origin.z);
  return m;
}
/* 局部标架下的长方体 */
function lbox(b, m, w, h, d, x, y, z, color) {
  var g = new THREE.BoxGeometry(w, h, d);
  var mm = m.clone().multiply(new THREE.Matrix4().makeTranslation(x, y, z));
  b._push(g, mm, color); g.dispose();
}
function lwedge(b, m, len, hA, hB, d, x, y, z, color) {
  var mm = m.clone().multiply(new THREE.Matrix4().makeTranslation(x, y, z));
  b._push(wedgeGeo(len, hA, hB, d), mm, color);
}
function lprism(b, m, n, r1, r2, h, x, y, z, color) {
  var g = new THREE.CylinderGeometry(r1, r2, h, n);
  var mm = m.clone().multiply(new THREE.Matrix4().makeTranslation(x, y, z));
  b._push(g, mm, color); g.dispose();
}

/* 构件登记：{ 层, 名, 说明, 尺寸表, 承托关系, 构建器 } */
function P0(layer, name, desc, dims, chain, fn) {
  return { layer: layer, name: name, desc: desc, dims: dims, chain: chain, fn: fn };
}

/* ============================ 台基 ============================ */
function buildPlatform(P, lod) {
  var pal = P.pal, w = P.bay + 2 * P.platOut, h = P.platH, out = [];
  var xumi = (P.plat.indexOf('须弥') >= 0);

  var bBase = new Builder();                                   // 土衬石
  bBase.box(w + 0.14, 0.07, w + 0.14, pal.plat, 0, 0.035, 0);
  out.push(P0('plat', '土衬石', '台基最下一层，直接落在夯土基上，四周出金边，承托其上全部台身。',
    [['边长', fmt(w + 0.14, 2) + ' m'], ['厚', '0.07 m']],
    '地基 → 土衬石 → 台身', bBase));

  var bBody = new Builder();                                   // 台身
  if (xumi) {
    var h1 = h * 0.26, h2 = h * 0.40, h3 = h * 0.26, hh = h * 0.04;
    bBody.box(w, h1, w, pal.plat, 0, 0.07 + h1 / 2, 0);                       // 下枋
    bBody.box(w - 0.05, hh, w - 0.05, pal.stone, 0, 0.07 + h1 + hh / 2, 0);   // 下枭
    bBody.box(w - 0.15, h2, w - 0.15, pal.plat, 0, 0.07 + h1 + hh + h2 / 2, 0); // 束腰
    bBody.box(w - 0.05, hh, w - 0.05, pal.stone, 0, 0.07 + h1 + hh + h2 + hh / 2, 0); // 上枭
    bBody.box(w, h3, w, pal.plat, 0, 0.07 + h1 + 2 * hh + h2 + h3 / 2, 0);    // 上枋
  } else {
    bBody.box(w, h - 0.08, w, pal.plat, 0, 0.07 + (h - 0.08) / 2, 0);
  }
  out.push(P0('plat', xumi ? '须弥座台身' : '台身（台明）',
    xumi ? '须弥座式：下枋—下枭—束腰—上枭—上枋五段叠涩，束腰内收，为宋以后高等级台基做法。'
         : '素方／砖砌台身，唐至元代亭榭常用，形制简洁，仅以阶条石收边。',
    [['边长', fmt(w, 2) + ' m'], ['高', fmt(h - 0.08, 2) + ' m'],
     ['每面出柱中', fmt(P.platOut, 2) + ' m']],
    '土衬石 → 台身 → 阶条石（台明面）', bBody));

  var bEdge = new Builder();                                   // 阶条石
  var ew = 0.30, eh = 0.08;
  bEdge.box(w, eh, ew, pal.stone, 0, h - eh / 2, w / 2 - ew / 2);
  bEdge.box(w, eh, ew, pal.stone, 0, h - eh / 2, -(w / 2 - ew / 2));
  bEdge.box(ew, eh, w - 2 * ew, pal.stone, w / 2 - ew / 2, h - eh / 2, 0);
  bEdge.box(ew, eh, w - 2 * ew, pal.stone, -(w / 2 - ew / 2), h - eh / 2, 0);
  out.push(P0('plat', '阶条石', '台明四周铺砌的条石，与台身顶面找平，构成柱础与檐柱的落基面。',
    [['宽', fmt(ew, 2) + ' m'], ['厚', fmt(eh, 2) + ' m']],
    '台身 → 阶条石 → 柱础／檐柱', bEdge));

  var n = Math.max(3, Math.round(h / 0.145));                  // 踏跺
  var tb = new Builder(), tw = 1.30, td = 0.30;
  for (var i = 0; i < n; i++) {
    var topY = h - i * (h / n);
    tb.box(tw, topY, td, pal.stone, 0, topY / 2, w / 2 + (i + 0.5) * td);
  }
  out.push(P0('plat', '踏跺（阶道）',
    '正面出阶道，' + n + ' 级，每级一整石，级高 ' + fmt(h / n, 3) + ' m；两侧以垂带收边。',
    [['级数', n + ' 级'], ['每级高', fmt(h / n, 3) + ' m'], ['踏面宽', fmt(td, 2) + ' m'], ['阶宽', fmt(tw, 2) + ' m']],
    '地面 → 踏跺 → 台明面', tb));

  var tc = new Builder();                                      // 垂带
  var L = n * td;
  for (var s = -1; s <= 1; s += 2) {
    var pa = V3(s * (tw / 2 + 0.07), h - 0.065, w / 2);
    var pb = V3(s * (tw / 2 + 0.07), 0.065, w / 2 + L);
    tc.beam(pa, pb, 0.14, 0.13, pal.stone);
  }
  out.push(P0('plat', '垂带', '阶道两侧的斜置条石，随踏跺坡度安放，兼作拦土与装饰。',
    [['长', fmt(Math.sqrt(h * h + L * L), 2) + ' m'], ['断面', '0.14 × 0.13 m']],
    '阶道两侧，上端与阶条石相交', tc));
  return out;
}

/* ============================ 柱础 ============================ */
function buildPlinth(P, lod) {
  var pal = P.pal, out = [], h = P.plinthH, r = P.colD / 2, w = P.colD * 1.92;
  var style = P.plinth;
  var b = new Builder();
  for (var i = 0; i < 4; i++) {
    var sx = (i % 2 === 0) ? 1 : -1, sz = (i < 2) ? 1 : -1;
    var x = sx * HALF, z = sz * HALF;
    if (style === '素平') {
      b.prism(4, w * 0.5 * Math.SQRT2, w * 0.5 * Math.SQRT2, h, pal.stone, x, P.yPlat + h / 2, z, Math.PI / 4);
    } else {
      var hb = h * 0.34;                                       // 方座
      b.prism(4, w * 0.5 * Math.SQRT2, w * 0.52 * Math.SQRT2, hb, pal.stone, x, P.yPlat + hb / 2, z, Math.PI / 4);
      var h2 = h - hb;
      if (style.indexOf('覆盆') >= 0) {                        // 覆盆：仰覆莲式反盆曲线
        b.lathe([[r * 0.60, 0], [r * 0.63, h2 * 0.22], [r * 0.76, h2 * 0.55],
                 [r * 0.92, h2 * 0.82], [r * 1.00, h2 * 0.93], [r * 0.99, h2]],
          12, pal.stone, x, P.yPlat + hb, z);
      } else {                                                 // 鼓镜：圆柱略鼓
        b.cyl(r * 0.94, r * 1.00, h2 * 0.72, 12, pal.stone, x, P.yPlat + hb + h2 * 0.36, z);
        b.lathe([[r * 0.94, 0], [r * 0.99, h2 * 0.10], [r * 0.90, h2 * 0.24], [r * 0.55, h2 * 0.28]],
          12, pal.stone, x, P.yPlat + hb + h2 * 0.72, z);
      }
      if (style.indexOf('櫍') >= 0)                            // 櫍（柱櫍）
        b.cyl(r * 0.86, r * 0.86, h2 * 0.06, 12, pal.plat, x, P.yPlat + h - h2 * 0.03, z);
    }
  }
  var nm = style.indexOf('覆盆') >= 0 ? '柱础（覆盆式）' : (style === '素平' ? '柱础（素平）' : '柱础（鼓镜式）');
  var ds = style.indexOf('覆盆') >= 0
    ? '覆盆式柱础：方座之上作仰覆莲反盆曲线，上承柱櫍。唐宋常见，与覆盆式卷杀柱脚相配。'
    : (style === '素平' ? '素平方础：仅一方整石块，不加雕饰，元代尚简之风。'
      : '鼓镜式柱础：方座上作圆鼓形柱顶石，顶面微凸如镜，明清通行；柱脚以鼓镜承托、不落榫。');
  out.push(P0('plinth', nm, ds,
    [['通高', fmt(h, 3) + ' m'], ['方座边', fmt(w, 3) + ' m'],
     ['＝斗口', fmt(h / P.K, 2) + ' 斗口'], ['柱径／础宽', fmt(P.colD / w, 3)]],
    '台明（阶条石面） → 柱础 → 檐柱柱脚', b));
  return out;
}

/* ============================ 檐柱 ============================ */
function buildColumns(P, lod) {
  var pal = P.pal, out = [], b = new Builder();
  // 侧脚使柱身倾斜，端面随之倾斜；补偿端面半径引起的竖向下沉／上冲，
  // 使柱脚最低点恰落在柱础顶面、柱头最高点恰抵普拍枋底（无悬浮、无穿模）。
  var sn = Math.sin(Math.atan(P.sideJiao));
  var yBot = P.yPlinth + colRad(P, P.yPlinth) * sn;
  var yTop = P.yColTop - colRad(P, P.yColTop) * sn;
  for (var i = 0; i < 4; i++) {
    var sx = (i % 2 === 0) ? 1 : -1, sz = (i < 2) ? 1 : -1;
    var p0 = colAxis(P, sx * HALF, sz * HALF, yBot);
    var p1 = colAxis(P, sx * HALF, sz * HALF, yTop);
    taperBeam(b, 8, colRad(P, yBot), colRad(P, yTop), p0, p1, pal.col);
  }
  out.push(P0('col', '檐柱（四根）',
    '四根角柱承全亭之重。柱身「收分」——上径小于下径；柱头「侧脚」——柱首微向内倾，' +
    '使柱脚外展、整体呈稳定梯形。唐制收分侧脚最著，至清几乎取消，是本亭可量测的形制标尺之一。',
    [['柱高', fmt(P.colH, 3) + ' m'], ['下径', fmt(P.colD, 3) + ' m'],
     ['上径／下径', fmt(1 - P.taper, 3)], ['＝斗口', fmt(P.m_colKou, 1) + ' 斗口'],
     ['柱径／柱高', '1 : ' + fmt(P.m_colSlend, 1)],
     ['侧脚', fmt(P.sideJiao * P.colH * 100, 2) + ' cm（' + fmt(P.sideJiao * 100, 2) + '%H）']],
    '柱础 → 檐柱 → 普拍枋／平板枋（或直接承栌斗）', b));
  return out;
}

/* ============================ 额枋·普拍枋·雀替 ============================ */
function buildArchitrave(P, lod) {
  var pal = P.pal, out = [], c = P.caiG, K = P.K;
  var mingQing = (P.pph >= 1.8);                 // 明·清：大額枋＋垫板＋小額枋＋平板枋
  var hDa = c * (mingQing ? 1.30 : 1.40);        // 大额枋／阑额
  var hBan = c * 0.30, hXiao = c * 0.95;         // 由额垫板／小额枋
  var th = c * 0.50;

  var bDa = new Builder(), bBan = new Builder(), bXiao = new Builder(), bPp = new Builder();
  var yTop = P.yColTop;
  // 阑额／大額枋：四面，两端插入柱身（不穿模）
  for (var s = 0; s < 4; s++) {
    var ax = (s === 0) ? V3(1, 0, 0) : (s === 1) ? V3(0, 0, 1) : (s === 2) ? V3(-1, 0, 0) : V3(0, 0, -1);
    var fix = (s < 2) ? HALF : -HALF;            // 该面所在坐标
    var midY = yTop - hDa / 2;
    var ra = colRad(P, midY);
    var L = P.bay - 2 * ra * 0.96;
    var cx = 0, cz = 0;
    if (s === 0) cx = 0, cz = fix; else if (s === 1) cx = fix, cz = 0;
    else if (s === 2) cx = 0, cz = fix; else cx = fix, cz = 0;
    var horiz = (s === 0 || s === 2);
    var w = horiz ? L : th, d = horiz ? th : L;
    bDa.box(w, hDa, d, pal.arch, cx, yTop - hDa / 2, cz);
    if (mingQing) {
      bBan.box(w, hBan, d, pal.gong, cx, yTop - hDa - hBan / 2, cz);
      bXiao.box(w, hXiao, d, pal.arch, cx, yTop - hDa - hBan - hXiao / 2, cz);
    }
  }
  out.push(P0('arch', mingQing ? '大額枋' : '阑额',
    mingQing ? '明清大額枋：断面加大，与下方由额垫板、小額枋叠构成一组，横向拉结四柱，' +
      '并直接承托平板枋与斗栱；断面高度按材分递减，已由结构件转为构图线脚。'
      : '阑额：柱头之间的联系梁，两端作榫插入柱身，上承普拍枋（唐宋）或直接承栌斗（唐）。' +
        '唐制阑额断面高瘦、不出头，宋以后渐宽厚。',
    [['高', fmt(hDa, 3) + ' m'], ['厚', fmt(th, 3) + ' m'],
     ['＝材广', fmt(hDa / c, 2) + ' 材'], ['净长', fmt(P.bay - 2 * colRad(P, yTop - hDa / 2) * 0.96, 2) + ' m']],
    '檐柱柱头 → 阑额／大額枋 → 普拍枋／平板枋', bDa));
  if (mingQing) {
    out.push(P0('arch', '由额垫板', '大額枋与小額枋之间的填板，薄而通长，使额枋组外观厚实。',
      [['高', fmt(hBan, 3) + ' m'], ['厚', fmt(th, 3) + ' m']],
      '小額枋 → 由额垫板 → 大額枋', bBan));
    out.push(P0('arch', '小額枋', '额枋组最下一根，位于垫板之下，两端入柱，与雀替相接。',
      [['高', fmt(hXiao, 3) + ' m'], ['厚', fmt(th, 3) + ' m']],
      '檐柱 → 小額枋 → 由额垫板', bXiao));
  }

  // 普拍枋／平板枋：置于柱头之上，闭合方环（转角处错缝搭接，互不穿越）
  if (P.pph > 0) {
    var hp = P.yPupai, wp = c * 1.30;
    for (var k = 0; k < 4; k++) {
      var sign = (k < 2) ? 1 : -1;
      var along = (k < 2) ? 'x' : 'z';
      var full = P.bay;
      if (along === 'x') {
        bPp.box(full, hp, wp, pal.gong, 0, P.yColTop + hp / 2, sign * HALF);
      } else {
        bPp.box(wp, hp, full - wp, pal.gong, sign * HALF, P.yColTop + hp / 2, 0);
      }
    }
    out.push(P0('arch', (P.pph >= 1.8 ? '平板枋' : '普拍枋'),
      '柱头之上通面阔设置的扁平横枋，使斗栱得以均匀落在柱头之外，是宋《营造法式》以后' +
      '斗栱由「柱头孤置」转向「攒当密布」的关键构件。唐制无此件，栌斗直接坐于柱头。',
      [['高', fmt(hp, 3) + ' m'], ['宽', fmt(wp, 3) + ' m'], ['＝斗口', fmt(P.pph, 2) + ' 斗口']],
      '檐柱柱头 → 普拍枋／平板枋 → 栌斗底', bPp));
  }

  // 雀替／替木
  var bq = new Builder();
  var qt = P.queTi;
  if (qt === '替木') {
    var Lt = 5.0 * K, ht = c * 0.62, wt = c * 0.52;
    var yb = P.yColTop - hDa;
    for (var i2 = 0; i2 < 4; i2++) {
      var sx2 = (i2 % 2 === 0) ? 1 : -1, sz2 = (i2 < 2) ? 1 : -1;
      var dirs = [V3(-sx2, 0, 0), V3(0, 0, -sz2)];
      for (var d1 = 0; d1 < 2; d1++) {
        var dv = dirs[d1];
        var ax2 = colAxis(P, sx2 * HALF, sz2 * HALF, yb - ht / 2);
        var rr = colRad(P, yb - ht / 2) * 0.96 - 0.008;
        bq.beam(V3(ax2.x + dv.x * rr, yb - ht, ax2.z + dv.z * rr),
                V3(ax2.x + dv.x * (rr + Lt), yb - ht, ax2.z + dv.z * (rr + Lt)), wt, ht, pal.wood);
      }
    }
    out.push(P0('arch', '替木', '唐宋柱头两侧的短替木，垫于阑额之下，缩短阑额净跨，是最早的雀替雏形。',
      [['长', fmt(Lt, 3) + ' m'], ['高', fmt(ht, 3) + ' m'], ['＝斗口', fmt(Lt / K, 1) + ' 斗口']],
      '檐柱 → 替木 → 阑额底', bq));
  } else {
    var Lq = P.bay * (qt === '小雀替' ? 0.08 : (qt === '大雀替' ? 0.20 : 0.14));
    var hq = c * 1.20, wq = c * 0.52;
    var yq = P.yColTop - (mingQing ? hDa + hBan + hXiao : hDa);
    var sh = new THREE.Shape();
    sh.moveTo(0, hq); sh.lineTo(Lq, hq); sh.lineTo(Lq, hq * 0.30);
    sh.quadraticCurveTo(Lq * 0.42, hq * 0.10, hq * 0.90, 0);
    sh.lineTo(0, 0); sh.closePath();
    for (var i3 = 0; i3 < 4; i3++) {
      var sx3 = (i3 % 2 === 0) ? 1 : -1, sz3 = (i3 < 2) ? 1 : -1;
      var ds = [V3(-sx3, 0, 0), V3(0, 0, -sz3)];
      for (var d2 = 0; d2 < 2; d2++) {
        var dir = ds[d2];
        var ax3 = colAxis(P, sx3 * HALF, sz3 * HALF, yq);
        var rq = colRad(P, yq) * 0.96 - 0.008;
        var px = ax3.x + dir.x * rq, pz = ax3.z + dir.z * rq;
        var X = V3(dir.x, 0, dir.z).normalize(), Y = V3(0, 1, 0);
        var Z = new THREE.Vector3().crossVectors(X, Y).normalize();
        var m = new THREE.Matrix4().makeBasis(X, Y, Z);
        m.setPosition(px, yq - hq, pz);
        var gg = new THREE.ExtrudeGeometry(sh, { depth: wq, bevelEnabled: false, curveSegments: 6 });
        var mm = m.clone().multiply(new THREE.Matrix4().makeTranslation(0, 0, -wq / 2));
        bq._push(gg, mm, pal.gong); gg.dispose();
      }
    }
    out.push(P0('arch', qt,
      qt === '大雀替' ? '清式大雀替：长至面阔的 1/5，蝉肚卷草式轮廓，纯以榫接入柱，装饰性远大于结构性。'
        : (qt === '雀替' ? '明式雀替：置于柱头额枋交角，轮廓舒朗，兼有减小额枋跨距之实。'
          : '元代小雀替：由唐宋替木向明清雀替过渡的雏形，长度尚短。'),
      [['长', fmt(Lq, 3) + ' m（' + fmt(Lq / P.bay * 100, 0) + '% 面阔）'],
       ['高', fmt(hq, 3) + ' m'], ['厚', fmt(wq, 3) + ' m']],
      '檐柱 → 雀替 → 额枋底', bq));
  }
  return out;
}

/* ============================ 斗栱铺作 ============================ */
function buildDougong(P, lod) {
  var pal = P.pal, K = P.K, out = [];
  var nSet = 4 * P.bujian + 4;                       // 平身科＋角科总数
  var isAng = (P.tiao >= 2);                     // 出双跳者，末跳作昂
  var bLudou = new Builder(), bHua = new Builder(), bDou = new Builder(),
      bGong = new Builder(), bLing = new Builder(), bShua = new Builder(), bAng = new Builder();

  function emit(kind, origin, dir, withGong, isDiag) {
    var m = dirMatrix(dir, origin);
    var startX = (kind === 'jiao' ? K * 0.5 : -1.5 * K);
    if (!isDiag) {
      lbox(bLudou, m, 3.2 * K, 2.0 * K, 3.2 * K, 0, 1.0 * K, 0, pal.dou);
    }
    var y = 2.0 * K, TL = P.tiaoLen, zu = P.zuCai, cg = P.caiG;
    for (var i = 1; i <= P.tiao; i++) {
      var xT = TL * i, xa = startX, len = xT - xa;
      var angHere = (isAng && !isDiag && i === P.tiao);
      if (angHere) lwedge(bAng, m, len, zu, zu * 0.52, K, (xa + xT) / 2, y, 0, pal.gong);
      else lbox(bHua, m, len, zu, K, (xa + xT) / 2, y + zu / 2, 0, pal.gong);
      lbox(bDou, m, 1.4 * K, 0.8 * K, 1.4 * K, xT, y + zu + 0.4 * K, 0, pal.dou);
      // 偷心造（唐）：中间各跳跳头不设横栱，仅末跳置令栱
      if (withGong && !(P.touXin && i < P.tiao)) {
        var Lg = 6.2 * K, arm = Lg / 2 - K / 2, yg = y + zu + 0.8 * K;
        for (var s = -1; s <= 1; s += 2) {
          lbox(bGong, m, K, cg, arm, xT, yg + cg / 2, s * (K / 2 + arm / 2), pal.gong);
          lbox(bDou, m, 1.4 * K, 0.8 * K, 1.4 * K, xT, yg + cg + 0.4 * K, s * (Lg / 2 - 0.7 * K), pal.dou);
        }
      }
      y += zu + 0.8 * K;
    }
    var xL = TL * P.tiao;
    if (withGong) {
      var Lling = 7.2 * K, arm2 = Lling / 2 - K / 2;
      for (var s2 = -1; s2 <= 1; s2 += 2) {
        lbox(bLing, m, K, cg, arm2, xL, y + cg / 2, s2 * (K / 2 + arm2 / 2), pal.gong);
        lbox(bDou, m, 1.4 * K, 0.8 * K, 1.4 * K, xL, y + cg + 0.4 * K, s2 * (Lling / 2 - 0.7 * K), pal.dou);
      }
    }
    if (withGong) {
      var ls = 4.0 * K;
      lwedge(bShua, m, ls, zu, zu * 0.62, K, xL + ls / 2 - 1.6 * K, y, 0, pal.gong);
    }
    return y + cg + 0.8 * K;
  }

  var topY = null;
  // 角科：两向正交出跳 ＋ 45° 斜由昂（承老角梁）
  var corners = [[1, 1], [-1, 1], [-1, -1], [1, -1]];
  corners.forEach(function (c) {
    var o = V3(c[0] * HALF, P.yDgBase, c[1] * HALF);
    var d1 = V3(c[0], 0, 0), d2 = V3(0, 0, c[1]);
    var dd = V3(c[0], 0, c[1]).normalize();
    lbox(bLudou, dirMatrix(dd, o), 3.6 * K, 2.0 * K, 3.6 * K, 0, 1.0 * K, 0, pal.dou);
    topY = emit('jiao', o, d1, true, false);
    emit('jiao', o, d2, true, false);
    emit('jiao', o, dd, false, true);
  });
  // 平身科（补间铺作）
  var dirs4 = [V3(1, 0, 0), V3(0, 0, 1), V3(-1, 0, 0), V3(0, 0, -1)];
  for (var s3 = 0; s3 < 4; s3++) {
    var dir = dirs4[s3], nx = -dir.z, nz = dir.x;
    for (var j = 1; j <= P.bujian; j++) {
      var u = -HALF + j * (P.bay / (P.bujian + 1));
      var px = (s3 % 2 === 0) ? dir.x * HALF : (s3 === 1 ? HALF : -HALF);
      var pz = (s3 % 2 === 0) ? u : (s3 === 1 ? HALF : -HALF);
      if (s3 === 0) { px = HALF; pz = u; }
      else if (s3 === 2) { px = -HALF; pz = u; }
      else if (s3 === 1) { px = u; pz = HALF; }
      else { px = u; pz = -HALF; }
      topY = emit('ping', V3(px, P.yDgBase, pz), dir, true, false);
    }
  }
  // 撩檐枋／挑檐桁：闭合方环（错缝搭接）
  var bLiao = new Builder();
  var rp = P.rPur, lw = 1.2 * K, lh = 1.6 * K;
  for (var k2 = 0; k2 < 4; k2++) {
    var sg = (k2 < 2) ? 1 : -1;
    if (k2 < 2) bLiao.box(rp * 2, lh, lw, pal.beam, 0, P.yDgTop - lh / 2, sg * rp);
    else bLiao.box(lw, lh, rp * 2 - lw, pal.beam, sg * rp, P.yDgTop - lh / 2, 0);
  }

  var dgTopNote = '栌斗底 ' + fmt(P.yDgBase, 3) + ' m，撩檐枋背 ' + fmt(P.yDgTop, 3) + ' m';
  out.push(P0('dg', '栌斗／坐斗（' + nSet + ' 攒）',
    '铺作最下之大斗，直接坐于柱头或普拍枋之上，斗口开槽以承华栱。角科栌斗加大并与相邻两向共用。',
    [['高', fmt(2.0 * K, 3) + ' m（2 斗口）'], ['方', fmt(3.2 * K, 3) + ' m（3.2 斗口）']],
    '柱头／普拍枋 → 栌斗 → 华栱', bLudou));
  out.push(P0('dg', isAng ? '华栱·昂（出跳 ' + P.tiao + ' 跳）' : '翘（出跳 ' + P.tiao + ' 跳）',
    '自栌斗口向外逐跳挑出的承重臂。每跳长 ' + fmt(P.tiaoLen, 3) + ' m（30 分°＝3 斗口）。' +
    (isAng ? '末跳作' + P.angType + '，昂身前端斜下、后端斜上，为唐宋下昂之制。'
           : '明清改为水平「翘」，出跳能力下降，出檐改由椽飞承担。'),
    [['每跳长', fmt(P.tiaoLen, 3) + ' m'], ['足材高', fmt(P.zuCai, 3) + ' m'],
     ['总出跳', fmt(P.tiao * P.tiaoLen, 3) + ' m'], ['铺作', P.dgStyle]],
    '栌斗 → 华栱 → 交互斗 → 上一层', bHua));
  if (isAng) out.push(P0('dg', P.angType,
    '昂为斜置杠杆：后尾压于梁栿之下，前端斜下挑出承撩檐枋，是唐宋斗栱得以深远出檐的关键。' +
    '至明清退化为水平假昂，仅存装饰，结构意义尽失。',
    [['长', fmt(P.tiaoLen + 1.5 * K, 3) + ' m'], ['后端高', fmt(P.zuCai, 3) + ' m'],
     ['前端高', fmt(P.zuCai * 0.52, 3) + ' m']],
    '交互斗 → 昂 → 令栱·撩檐枋', bAng));
  out.push(P0('dg', '瓜子栱·瓜栱（横栱）',
    '与出跳方向垂直的横栱，两端置散斗以承上层枋木；与华栱十字相交处开栱口咬合。' +
    (P.touXin ? '本朝行「偷心造」，中间跳头不设横栱，仅末跳置令栱 —— 唐制疏朗之表征。'
              : '本朝行「计心造」，逐跳跳头皆设横栱，铺作趋于繁密。'),
    [['瓜栱长', fmt(6.2 * K, 3) + ' m（6.2 斗口）'], ['单材高', fmt(P.caiG, 3) + ' m']],
    '交互斗 → 横栱 → 散斗', bGong));
  out.push(P0('dg', '散斗·交互斗',
    '栱头之上的小斗，将横栱与出跳构件的集中荷载扩散传递至下层。高 ' + fmt(0.8 * K, 3) + ' m（0.8 斗口）。',
    [['高', fmt(0.8 * K, 3) + ' m'], ['方', fmt(1.4 * K, 3) + ' m']],
    '栱 → 斗 → 上层栱／枋', bDou));
  out.push(P0('dg', '令栱·厢栱',
    '最外一跳之上的横栱，长 ' + fmt(7.2 * K, 3) + ' m（7.2 斗口），其上散斗直接承撩檐枋；' +
    '与耍头十字相交处开栱口，交互承托。',
    [['长', fmt(7.2 * K, 3) + ' m'], ['高', fmt(P.caiG, 3) + ' m']],
    '交互斗 → 令栱 → 散斗 → 撩檐枋', bLing));
  out.push(P0('dg', '耍头·撑头木',
    '与令栱同高、自令栱中穿出之构件，前端斜下作蚂蚱头式，后尾压于梁下；明清称撑头木，渐趋方正。',
    [['长', fmt(4.0 * K, 3) + ' m'], ['高', fmt(P.zuCai, 3) + ' m']],
    '令栱 → 耍头 → 撩檐枋（互相错开，不穿越）', bShua));
  out.push(P0('dg', '撩檐枋·挑檐桁',
    '沿四面通长、闭合搭接的檐檩，坐于各攒令栱散斗之上，是屋面全部椽子的下支点。' +
    dgTopNote + '。',
    [['高', fmt(lh, 3) + ' m'], ['宽', fmt(lw, 3) + ' m'], ['方环半跨', fmt(rp, 3) + ' m']],
    '令栱散斗 → 撩檐枋 → 檐椽·老角梁', bLiao));
  return out;
}

/* ============================ 梁架 ============================ */
function buildFrame(P, lod) {
  var pal = P.pal, out = [], K = P.K;
  var rp = P.rPur, cw = P.cWell, bh = P.beamH, bw = P.beamW;
  var wn = bw + 0.02;                                    // 刻口宽
  var bL = new Builder(), bS = new Builder(), bT = new Builder(), bG = new Builder();

  function segX(b, x0, x1, z, y0, hh) {
    b.box(x1 - x0, hh, bw, pal.beam, (x0 + x1) / 2, y0 + hh / 2, z);
  }
  function segZ(b, z0, z1, x, y0, hh) {
    b.box(bw, hh, z1 - z0, pal.beam, x, y0 + hh / 2, (z0 + z1) / 2);
  }
  // 长趴梁：沿 X，落于撩檐枋之上；与短趴梁相交处上半刻去（十字搭接）
  for (var s = -1; s <= 1; s += 2) {
    var z = s * cw;
    segX(bL, -rp, -cw - wn / 2, z, P.yBeam1, bh);
    segX(bL, -cw - wn / 2, -cw + wn / 2, z, P.yBeam1, bh / 2);
    segX(bL, -cw + wn / 2, cw - wn / 2, z, P.yBeam1, bh);
    segX(bL, cw - wn / 2, cw + wn / 2, z, P.yBeam1, bh / 2);
    segX(bL, cw + wn / 2, rp, z, P.yBeam1, bh);
  }
  // 短趴梁：沿 Z，两端下半刻去，骑坐于长趴梁刻口内（顶面与长趴梁齐平）
  for (var s2 = -1; s2 <= 1; s2 += 2) {
    var x = s2 * cw;
    segZ(bS, -cw, -cw + wn / 2, x, P.yBeam1 + bh / 2, bh / 2);
    segZ(bS, -cw + wn / 2, cw - wn / 2, x, P.yBeam1, bh);
    segZ(bS, cw - wn / 2, cw, x, P.yBeam1 + bh / 2, bh / 2);
  }
  // 太平梁：沿 X 跨于两短趴梁之上，中心承雷公柱
  segX(bT, -cw, cw, 0, P.yTaiping, bh);
  // 雷公柱
  var rl = 0.07 + 1.3 * K;
  bG.prism(8, rl, rl * 0.94, P.hLeigong, pal.col, 0, P.yLeigong + P.hLeigong / 2, 0);

  out.push(P0('frame', '长趴梁（井字梁）',
    '两根通长趴梁沿 X 向搭在撩檐枋（檐檩）方环之上，跨度 ' + fmt(2 * rp, 2) + ' m，' +
    '与短趴梁相交处上半开刻口，形成井字梁架的第一层。',
    [['断面', fmt(bw, 3) + ' × ' + fmt(bh, 3) + ' m'], ['长', fmt(2 * rp, 3) + ' m'],
     ['＝材广', fmt(bh / P.caiG, 2) + ' 材']],
    '撩檐枋 → 长趴梁 → 短趴梁', bL));
  out.push(P0('frame', '短趴梁（十字搭接）',
    '两根短梁沿 Z 向骑坐于长趴梁刻口内，下半开刻口，顶面与长趴梁齐平 —— 此即大木作' +
    '「十字搭角、上下各刻半」的榫卯搭接法，两根梁互相扣锁而不穿越。',
    [['断面', fmt(bw, 3) + ' × ' + fmt(bh, 3) + ' m'], ['长', fmt(2 * cw, 3) + ' m'],
     ['刻口深', fmt(bh / 2, 3) + ' m = 半梁高']],
    '长趴梁 → 短趴梁 → 太平梁', bS));
  out.push(P0('frame', '太平梁',
    '横跨两短趴梁之上的短梁，居井口正中，专承雷公柱柱脚，为攒尖顶的「定心」构件。',
    [['断面', fmt(bw, 3) + ' × ' + fmt(bh, 3) + ' m'], ['长', fmt(2 * cw, 3) + ' m']],
    '短趴梁 → 太平梁 → 雷公柱', bT));
  out.push(P0('frame', '雷公柱',
    '立于太平梁正中、直抵攒尖顶点的中心柱，四根由戗（戗脊骨干）自四角聚于其顶，' +
    '柱顶再承宝顶。本朝举折' + (P.gamma < 0.5 ? '平缓' : (P.gamma < 0.66 ? '适中' : '陡峻')) +
    '，故雷公柱高 ' + fmt(P.hLeigong, 3) + ' m。',
    [['高', fmt(P.hLeigong, 3) + ' m'], ['径', fmt(rl * 2, 3) + ' m'],
     ['高／径', '1 : ' + fmt(P.hLeigong / (2 * rl), 1)]],
    '太平梁 → 雷公柱 → 宝顶（并由四向由戗侧向撑定）', bG));
  return out;
}

/* ============================ 角梁·由戗 ============================ */
function buildHip(P, lod) {
  var pal = P.pal, out = [];
  var verts = eaveVerts(P, 20), corners = verts.filter(function (v) { return v.corner; });
  var depth = 2.2 * P.raftD, wid = 1.6 * P.raftD;
  var bLao = new Builder(), bYou = new Builder(), bZai = new Builder();

  corners.forEach(function (v) {
    var outer = surfPoint(P, v, 0);                       // 檐角
    var pur = surfPoint(P, v, P.tp);                      // 檐檩转角
    var top = surfPoint(P, v, 0.985);                     // 近攒尖
    var fLao = rayFrame(outer, pur), fYou = rayFrame(pur, top);
    var oL = outer.clone().addScaledVector(fLao.Y, -depth * 0.5);
    var pL = pur.clone().addScaledVector(fLao.Y, -depth * 0.5);
    bLao.ray(oL, pL, wid, depth, pal.wood, fLao.Y);
    var pY = pur.clone().addScaledVector(fYou.Y, -depth * 0.5);
    var tY = top.clone().addScaledVector(fYou.Y, -depth * 0.5);
    bYou.ray(pY, tY, wid, depth, pal.wood, fYou.Y);
    // 仔角梁：压于老角梁外段之上，形成翼角起翘
    var fZ = rayFrame(outer, pur);
    var z0 = outer.clone().addScaledVector(fZ.Y, depth * 0.55);
    var tMid = surfPoint(P, v, P.tp * 0.62);
    var fZ2 = rayFrame(outer, tMid);
    var z1 = tMid.clone().addScaledVector(fZ2.Y, depth * 0.55);
    bZai.ray(z0, z1, wid * 0.9, depth * 0.85, pal.wood, fZ.Y);
  });

  out.push(P0('hip', '老角梁（4 根）',
    '自撩檐枋转角斜向外下伸至檐角，是翼角的主承重构件。因角部水平距离为正面的 √2 倍，' +
    '其出檐长度天然大于檐椽 —— 这正是「翼角冲出」的几何根源（本朝角部冲出 ' + fmt(P.sheng, 2) + ' m）。',
    [['断面', fmt(wid, 3) + ' × ' + fmt(depth, 3) + ' m'],
     ['水平长', fmt(surfPoint(P, corners[0], 0).distanceTo(surfPoint(P, corners[0], P.tp)), 2) + ' m'],
     ['＝椽径', fmt(depth / P.raftD, 2) + ' 倍']],
    '撩檐枋转角 → 老角梁 → 檐角（外端）／由戗（内端）', bLao));
  out.push(P0('hip', '由戗（4 根）',
    '老角梁在撩檐枋转角以上的延续，四根自四角沿 45° 斜上汇聚于雷公柱顶，' +
    '构成攒尖屋顶的四条戗脊骨干，同时也是雷公柱的侧向支撑。',
    [['断面', fmt(wid, 3) + ' × ' + fmt(depth, 3) + ' m'],
     ['坡度', fmt(P.juTotal / (P.aEave * Math.SQRT2) * 100, 1) + '%（戗脊平均举）']],
    '老角梁 → 由戗 → 雷公柱顶', bYou));
  out.push(P0('hip', '仔角梁（4 根）',
    '压在老角梁外段之上、前端再挑出并翘起的构件，直接造成翼角「翘」。' +
    (P.qPow > 3 ? '本朝属嫩戗发戗：起翘集中于角部，翘势急骤。' : '本朝属水戗发戗：起翘沿翼角匀缓外伸。'),
    [['断面', fmt(wid * 0.9, 3) + ' × ' + fmt(depth * 0.85, 3) + ' m'],
     ['角部起翘', fmt(P.lift, 3) + ' m'], ['角部生出', fmt(P.sheng, 3) + ' m'],
     ['发戗指数', fmt(P.qPow, 1)]],
    '老角梁 → 仔角梁 → 翼角檐口', bZai));
  return out;
}

/* ============================ 椽望 ============================ */
function buildRafters(P, lod) {
  var pal = P.pal, out = [];
  var verts = eaveVerts(P, 20);
  var tRaftHead = P.tp * 0.45, tFlyHead = 0.0;
  var bR = new Builder(), bF = new Builder(), bW = new Builder();
  var cnt = 0;

  if (!lod) {
    verts.forEach(function (v) {
      if (v.corner) return;                                // 角部由角梁承担
      cnt++;
      var pHead = surfPoint(P, v, tRaftHead);
      var pInner = surfPoint(P, v, 0.965);
      var fr = rayFrame(pHead, pInner);
      bR.ray(pHead.clone().addScaledVector(fr.Y, -P.raftD * 0.5),
             pInner.clone().addScaledVector(fr.Y, -P.raftD * 0.5),
             P.raftD * 0.92, P.raftD, pal.wood, fr.Y);
      var pTip = surfPoint(P, v, tFlyHead);
      var pHeel = surfPoint(P, v, P.tp * 0.52);
      var ff = rayFrame(pTip, pHeel);
      // 飞椽骑坐于望板之上：底面恰与屋面（望板面）相切
      bF.ray(pTip.clone().addScaledVector(ff.Y, P.raftD * 0.35),
             pHeel.clone().addScaledVector(ff.Y, P.raftD * 0.35),
             P.raftD * 0.8, P.raftD * 0.7, pal.wood, ff.Y);
    });
  }
  // 望板（木基层）：沿屋面曲面铺钉的薄板
  var rings = [];
  for (var i = 0; i <= 3; i++) rings.push(P.tp * i / 3);
  for (var j = 1; j <= 6; j++) rings.push(P.tp + (1 - P.tp) * j / 6);
  rings.push(1 / 3, 2 / 3, 1);
  var uniq = [];
  rings.sort(function (a2, b2) { return a2 - b2; }).forEach(function (v2) {
    if (v2 >= 0 && v2 <= 1 && (uniq.length === 0 || v2 - uniq[uniq.length - 1] > 1e-4)) uniq.push(v2);
  });
  for (var r = 0; r < uniq.length - 1; r++) {
    var t0 = uniq[r], t1 = uniq[r + 1];
    for (var k = 0; k < 20; k++) {
      var vA = verts[k], vB = verts[(k + 1) % 20];
      var a1 = surfPoint(P, vA, t0), a2 = surfPoint(P, vA, t1);
      var b1 = surfPoint(P, vB, t0), b2 = surfPoint(P, vB, t1);
      bW.quad(a1, b1, b2, a2, P.glazed ? 0x4a4238 : 0x6a5a44);
    }
  }
  // 连檐（檐口通长木条）
  var bLian = new Builder();
  for (var k2 = 0; k2 < 20; k2++) {
    var v1 = verts[k2], v2 = verts[(k2 + 1) % 20];
    bLian.beam(surfPoint(P, v1, 0), surfPoint(P, v2, 0), 0.055, 0.045, pal.wood);
  }

  out.push(P0('raft', '檐椽（' + cnt + ' 根）',
    '自撩檐枋（檐檩）向外下斜伸出檐口、向内上斜直达雷公柱顶的放射状椽子，呈伞骨状布置。' +
    '其外段悬挑于檐檩之外，即为「檐椽出挑」—— 明清斗栱出跳能力衰退后，出檐主要靠它承担。',
    [['椽径', fmt(P.raftD, 3) + ' m'], ['椽当', fmt(P.raftGap, 3) + ' m（' + fmt(P.raftGap / P.K, 1) + ' 斗口）'],
     ['根数', cnt + ' 根'], ['出挑长', fmt(P.eave - P.tiao * P.tiaoLen, 3) + ' m']],
    '撩檐枋 → 檐椽 → 望板（内端聚于雷公柱）', bR));
  out.push(P0('raft', '飞椽·飞子（' + cnt + ' 根）',
    '钉于檐椽外段之上、再向外挑出的一层椽子，坡度较檐椽平缓，使檐口自然翘起，是「飞檐」之名的由来。',
    [['断面', fmt(P.raftD * 0.8, 3) + ' × ' + fmt(P.raftD * 0.7, 3) + ' m'],
     ['挑出', fmt(P.tp * 0.52 * P.aEave, 3) + ' m']],
    '檐椽 → 飞椽 → 连檐·瓦口', bF));
  out.push(P0('raft', '望板·苫背',
    '铺钉于椽上的木基层，直接承托瓦作。其曲面即屋面举折（举架）曲线的几何呈现：' +
    '檐步举 ' + fmt(P.ju[0], 2) + ' → 脊步举 ' + fmt(P.ju[2], 2) + '，' +
    (P.gamma < 0.5 ? '唐宋行「举折法」，先定举高再逐架向下折减，屋面平缓。'
                   : '明清行「举架法」，自檐步起逐架加举，屋面陡峻。'),
    [['举高', fmt(P.juTotal, 3) + ' m'], ['举高／半跨', fmt(P.m_juRatio, 3)],
     ['檐步举', fmt(P.ju[0], 2)], ['脊步举', fmt(P.ju[2], 2)],
     ['平均坡角', fmt(Math.atan(P.m_juRatio) * 180 / Math.PI, 1) + '°']],
    '檐椽·飞椽 → 望板 → 瓦作', bW));
  out.push(P0('raft', '连檐·瓦口', '檐口通长的横向木条，锁住全部椽头并为瓦当滴水提供坐浆基面。',
    [['断面', '0.055 × 0.045 m']], '椽头 → 连檐 → 瓦当滴水', bLian));
  return out;
}

/* ============================ 瓦作·戗脊 ============================ */
function buildRoof(P, lod) {
  var pal = P.pal, out = [];
  var seg = 40, verts = eaveVerts(P, seg), N = verts.length;
  var bTile = new Builder(), bRidge = new Builder(), bBeast = new Builder(), bTip = new Builder();

  var rings = [];
  for (var i = 0; i <= 3; i++) rings.push(P.tp * i / 3);
  for (var j = 1; j <= 6; j++) rings.push(P.tp + (1 - P.tp) * j / 6);
  rings.push(1 / 3, 2 / 3, 1);
  var uniq = [];
  rings.slice().sort(function (a2, b2) { return a2 - b2; }).forEach(function (v2) {
    if (v2 >= 0 && v2 <= 1 && (uniq.length === 0 || v2 - uniq[uniq.length - 1] > 1e-4)) uniq.push(v2);
  });

  if (!lod) {
    // 筒瓦垄／板瓦沟交替起伏
    for (var r = 0; r < uniq.length - 1; r++) {
      var t0 = uniq[r], t1 = uniq[r + 1];
      for (var k = 0; k < N; k++) {
        var vA = verts[k], vB = verts[(k + 1) % N];
        var hi = (k % 2 === 1);
        var f0 = 1 - Math.pow(t0, 2.2), f1 = 1 - Math.pow(t1, 2.2);
        var a1 = surfPoint(P, vA, t0); a1.y += (hi ? P.tileH * f0 : 0);
        var a2 = surfPoint(P, vA, t1); a2.y += (hi ? P.tileH * f1 : 0);
        var b1 = surfPoint(P, vB, t0); b1.y += (hi ? 0 : P.tileH * f0 * 0.0);
        var b2 = surfPoint(P, vB, t1);
        bTile.quad(a1, b1, b2, a2, hi ? pal.tile : shade(pal.tile, 0.78));
      }
    }
    // 檐口瓦当（垄端）与滴水（沟端）
    for (var k2 = 0; k2 < N; k2++) {
      var v = verts[k2];
      var p = surfPoint(P, v, 0);
      if (k2 % 2 === 1) {
        var dir = V3(v.cos, 0, v.sin);
        bTip.cyl(P.tileH * 0.62, P.tileH * 0.62, 0.035, 6, pal.ridge,
          p.x, p.y + P.tileH * 0.5, p.z);
      } else {
        var pn = surfPoint(P, v, 0.004);
        bTip.beam(p.clone(), pn.clone().setY(pn.y - 0.055), P.tileH * 1.25, 0.05, pal.ridge);
      }
    }
  }
  // 戗脊（四条）＋走兽
  var corners = verts.filter(function (v) { return v.corner; });
  var rw = 0.16 + 1.2 * P.K, rh = 0.10 + 0.9 * P.K;
  corners.forEach(function (v) {
    var pts = [];
    for (var s = 0; s <= 10; s++) pts.push(surfPoint(P, v, s / 10));
    for (var s1 = 0; s1 < pts.length - 1; s1++) {
      var pa = pts[s1], pb = pts[s1 + 1];
      var f = rayFrame(pa, pb);
      var right = new THREE.Vector3().crossVectors(f.X, V3(0, 1, 0)).normalize();
      var mid = new THREE.Vector3().addVectors(pa, pb).multiplyScalar(0.5);
      var up = f.Y.clone().multiplyScalar(P.tileH * 0.5 + rh * 0.5);
      bRidge.beam(mid.clone().addScaledVector(right, -rw / 2).add(up),
                  mid.clone().addScaledVector(right, rw / 2).add(up),
                  pb.distanceTo(pa), rh, pal.ridge);
    }
    if (P.beasts > 0) {
      for (var bi = 0; bi < P.beasts; bi++) {
        var tt = 0.10 + bi * (0.42 / Math.max(1, P.beasts - 1)) * (P.beasts > 1 ? 1 : 0);
        var bp = surfPoint(P, v, tt);
        var bf = rayFrame(bp, surfPoint(P, v, tt + 0.02));
        var sz = 0.055 + bi * 0.006;
        bBeast.box(sz, sz * 1.25, sz * 0.85, pal.gold,
          bp.x, bp.y + P.tileH + rh * 0.5 + sz * 0.62, bp.z, v.phi);
      }
    }
  });

  out.push(P0('tile', '筒瓦·板瓦',
    '沿屋面坡度顺铺的瓦垄：单数垄为筒瓦（凸起），双数垄为板瓦（凹沟），交替成排。' +
    (P.glazed ? '本朝用琉璃瓦，色调明丽。' : '本朝用青灰陶瓦，色调沉稳。'),
    [['垄高', fmt(P.tileH * 100, 1) + ' cm'], ['垄数', (N / 2) + ' 垄'],
     ['垄距', fmt(2 * Math.PI * P.aEave / N * 1.16, 3) + ' m']],
    '望板·苫背 → 筒瓦垄／板瓦沟 → 戗脊', bTile));
  out.push(P0('tile', '戗脊（4 条）',
    '自檐角沿 45° 斜上汇聚于宝顶的四条脊，既是屋面分水线，也是结构上的由戗外衣。' +
    '翼角处随「生出」「起翘」抬起，形成中国屋顶特有的反宇曲线。',
    [['断面', fmt(rw, 3) + ' × ' + fmt(rh, 3) + ' m'],
     ['角部起翘', fmt(P.lift * 100, 1) + ' cm'], ['角部生出', fmt(P.sheng * 100, 1) + ' cm']],
    '由戗 → 脊筒瓦 → 走兽', bRidge));
  if (P.beasts > 0)

    '<div id="clayer">' + d.years + '　·　' + d.sys + '（' + d.sysNote + '）</div>' +
    '<div id="cdesc">以<em>材</em>为祖、分°为度。材广 ' + fmt(P.caiG * 100, 1) + ' cm、材厚 ' + fmt(P.K * 100, 1) + ' cm，' +
    '一材析为十五<em>分°</em>（' + fmt(P.fen * 1000, 1) + ' mm），栔六分°、足材 ' + fmt(P.zuCai * 100, 1) + ' cm。' +
    '全部构件尺寸皆由材／斗口按分°倍数推出，非自由设定。</div>' +
    kv([['斗口／材厚', fmt(P.K * 100, 2) + ' cm'], ['材广', fmt(P.caiG * 100, 2) + ' cm（' + fmt(P.caiRatio, 2) + ' 斗口）'],
        ['一分°', fmt(P.fen * 1000, 2) + ' mm'], ['栔高', fmt(P.qie * 100, 2) + ' cm'],
        ['足材', fmt(P.zuCai * 100, 2) + ' cm'], ['柱高／斗口', fmt(P.m_colKou, 1) + ' 斗口'],
        ['柱径／斗口', fmt(P.m_colDKou, 2) + ' 斗口'], ['铺作', P.dgStyle + ' · ' + P.angType],
        ['举折／举架', d.sys === '斗口制' ? '举架法' : '举折法'], ['发戗', P.qPow > 3 ? '嫩戗发戗' : '水戗发戗']]);
  $('cpick').innerHTML = '<div class="chain" style="border:0;padding:0;margin-top:2px">' +
    '<s>提示</s><br><i>将鼠标移到模型任一构件上可高亮并查看其材分尺寸与承托关系；单击锁定，单击空白复位。</i></div>';
}

/* ------------------------------------------------------------ 参数对比表 */
var METRICS = [
  ['斗口／材厚 K', function (P) { return fmt(P.K * 100, 2); }, 'cm'],
  ['材广', function (P) { return fmt(P.caiG * 100, 2); }, 'cm'],
  ['一分°', function (P) { return fmt(P.fen * 1000, 1); }, 'mm'],
  ['出跳数', function (P) { return P.tiao; }, '跳'],
  ['补间攒／朵', function (P) { return P.bujian; }, '攒'],
  ['斗栱通高', function (P) { return fmt(P.dgH, 3); }, 'm'],
  ['斗栱高／柱高', function (P) { return fmt(P.m_dgRatio * 100, 1); }, '%'],
  ['柱高', function (P) { return fmt(P.colH, 2); }, 'm'],
  ['柱高／柱径', function (P) { return fmt(P.m_colSlend, 1); }, '∶1'],
  ['柱高／斗口', function (P) { return fmt(P.m_colKou, 1); }, '斗口'],
  ['总出檐', function (P) { return fmt(P.eave, 3); }, 'm'],
  ['出檐／柱高', function (P) { return fmt(P.m_eaveRatio * 100, 1); }, '%'],
  ['其中·斗栱出跳', function (P) { return fmt(P.tiao * P.tiaoLen, 3); }, 'm'],
  ['其中·椽飞出挑', function (P) { return fmt(P.eave - P.tiao * P.tiaoLen, 3); }, 'm'],
  ['举高', function (P) { return fmt(P.juTotal, 3); }, 'm'],
  ['举高／半跨', function (P) { return fmt(P.m_juRatio, 3); }, ''],
  ['檐步举', function (P) { return fmt(P.ju[0], 2); }, ''],
  ['脊步举', function (P) { return fmt(P.ju[2], 2); }, ''],
  ['平均坡角', function (P) { return fmt(Math.atan(P.m_juRatio) * 180 / Math.PI, 1); }, '°'],
  ['翼角起翘', function (P) { return fmt(P.lift * 100, 1); }, 'cm'],
  ['翼角生出', function (P) { return fmt(P.sheng * 100, 1); }, 'cm'],
  ['侧脚', function (P) { return fmt(P.sideJiao * P.colH * 100, 2); }, 'cm'],
  ['收分（上／下径）', function (P) { return fmt(1 - P.taper, 3); }, ''],
  ['台基高', function (P) { return fmt(P.platH, 2); }, 'm'],
  ['通高（含宝顶）', function (P) { return fmt(P.m_totalH, 2); }, 'm']
];
var derivedAll = DYN.map(function (d) { return TC.derive(d); });
function renderParams() {
  var h = '<div class="sec"><h3>形 制 参 数 对 比 （可核验）</h3><table class="pt"><tr><th>项目</th>';
  DYN.forEach(function (d) { h += '<th>' + d.name + '</th>'; });
  h += '<th></th></tr>';
  METRICS.forEach(function (M) {
    var on = false;
    h += '<tr class="' + (cur && M[1] ? '' : '') + '"><td>' + M[0] + '</td>';
    DYN.forEach(function (d, i) {
      var isCur = cur && d.key === cur.key;
      if (isCur) on = true;
      h += '<td class="' + (isCur ? 'cc' : '') + '" style="' + (isCur ? 'color:#e8c85a' : '') + '">' + M[1](derivedAll[i]) + '</td>';
    });
    h += '<td class="u">' + M[2] + '</td></tr>';
    void on;
  });
  h += '</table></div>';
  $('cpars').innerHTML = h.replace(/class=""/g, '');
  var rows = $('cpars').querySelectorAll('tr');
  rows.forEach(function (r, i) { if (i > 0 && r.children[1 + DYN.indexOf(DYN.filter(function (d) { return cur && d.key === cur.key; })[0])]) { } });
}
function renderLayers() {
  var md = cur;
  var h = '';
  LAYERS.forEach(function (l) {
    var n = md ? (md.layerCount[l.id] || 0) : 0;
    h += '<div class="ly' + (hidden[l.id] ? ' off' : '') + '" data-id="' + l.id + '">' +
      '<span class="dot" style="background:' + l.hex + '"></span>' +
      '<span class="nm">' + l.name + '</span><span class="ct">' + n + '</span>' +
      '<span class="eye">' + (hidden[l.id] ? '○' : '●') + '</span></div>';
  });
  $('layers').innerHTML = h;
  Array.prototype.forEach.call($('layers').children, function (row) {
    row.onclick = function (e) {
      var id = row.getAttribute('data-id');
      if (e.shiftKey) {                                   // Shift 独显
        var solo = !!(hiddenFlag === id);
        LAYERS.forEach(function (l) { hidden[l.id] = !solo && (l.id !== id); });
        hiddenFlag = solo ? null : id;
      } else {
        hidden[id] = !hidden[id]; hiddenFlag = null;
      }
      applyLayerVis(); renderLayers();
    };
  });
}
var hiddenFlag = null;

/* ------------------------------------------------------------ 朝代按钮 */
function renderDyns() {
  var h = '';
  DYN.forEach(function (d) {
    h += '<div class="dyn' + (d.key === curKey ? ' on' : '') + '" data-k="' + d.key + '">' +
      '<span class="nm">' + d.name + '</span><span class="yr">' + d.years + '</span>' +
      '<span class="tag">' + d.era + '</span></div>';
  });
  $('dyns').innerHTML = h;
  Array.prototype.forEach.call($('dyns').children, function (b) {
    b.onclick = function () { selectDyn(b.getAttribute('data-k')); };
  });
}
function selectDyn(k) {
  curKey = k;
  if (mode === 'single') { setMode('single'); }
  else { renderDyns(); renderParams(); }
  renderSystem();
  if (selected) { selected.material = baseOf(selected); selected = null; }
}

/* ------------------------------------------------------------ 模式 / 按钮 */
function renderModes() {
  var h = '<div class="btn' + (mode === 'single' ? ' on' : '') + '" data-m="single">单体观察</div>' +
          '<div class="btn' + (mode === 'hall' ? ' on' : '') + '" data-m="hall">演变长廊</div>';
  $('modeRow').innerHTML = h;
  Array.prototype.forEach.call($('modeRow').children, function (b) {
    b.onclick = function () { setMode(b.getAttribute('data-m')); renderModes(); };
  });
}
function toggle(id, fn) {
  var e2 = $(id);
  e2.onclick = function () { fn(); e2.classList.toggle('on'); };
}
toggle('bWire', function () { st.wire = !st.wire; applyDisplay(); });
toggle('bXray', function () { st.xray = !st.xray; applyDisplay(); });
toggle('bClip', function () { st.clip = !st.clip; applyDisplay(); });
toggle('bSpin', function () { st.spin = !st.spin; });
$('bAll').onclick = function () { LAYERS.forEach(function (l) { hidden[l.id] = false; }); hiddenFlag = null; applyLayerVis(); renderLayers(); };
$('bOnly').onclick = function () {
  var i = (typeof soloIdx === 'undefined' ? -1 : soloIdx) + 1;
  soloIdx = i % LAYERS.length;
  LAYERS.forEach(function (l, j) { hidden[l.id] = (j !== soloIdx); });
  hiddenFlag = LAYERS[soloIdx].id; applyLayerVis(); renderLayers();
};
var soloIdx = -1;
$('exp').oninput = function () {
  st.explode = this.value / 100; $('expV').textContent = this.value + '%';
  applyExplode();
};
$('clip').oninput = function () { st.clipPos = this.value / 100; };
function view(t, p, r, ty) {
  C.theta = t; C.phi = p; if (r) C.radius = r;
  if (ty != null) C.target.y = ty;
}
$('bV1').onclick = function () { view(0, Math.PI / 2 - 0.06, 20, cur.P.m_totalH * 0.45); };
$('bV2').onclick = function () { view(0.86, 1.14, cur.P.m_totalH * 2.5, cur.P.m_totalH * 0.42); };
$('bV3').onclick = function () { view(0.01, 0.10, cur.P.m_totalH * 2.4, cur.P.m_totalH * 0.30); };
$('bV4').onclick = function () { view(0.9, Math.PI * 0.47, 14, cur.P.yDgTop * 0.9); };
window.addEventListener('keydown', function (e) {
  if (e.code === 'Space') { e.preventDefault(); view(0.86, 1.14, cur.P.m_totalH * 2.5, cur.P.m_totalH * 0.42); }
  var i = ['1', '2', '3', '4', '5'].indexOf(e.key);
  if (i >= 0) selectDyn(DYN[i].key);
});

/* ------------------------------------------------------------ 主循环 */
window.addEventListener('resize', function () {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
var clock = new THREE.Clock();
function tick() {
  var dt = clock.getDelta();
  if (st.spin && !drag) C.theta += dt * 0.16;
  if (mode === 'single') {
    C.target.y += (cur.P.m_totalH * 0.42 - C.target.y) * 0.0;
  }
  applyCam();
  if (st.clip) {
    clipPlane.constant = (st.clipPos - 0.5) * 12;
    clipPlane.normal.set(-1, 0, 0);
  }
  labels.forEach(function (d) {
    var v = d._anchor.clone().project(camera);
    d.style.display = (v.z > 1) ? 'none' : 'block';
    d.style.left = ((v.x * 0.5 + 0.5) * window.innerWidth) + 'px';
    d.style.top = ((-v.y * 0.5 + 0.5) * window.innerHeight) + 'px';
  });
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

/* ------------------------------------------------------------ 启动 */
try {
  cur = TC.buildPavilion(curKey, { lod: false });
  cache[curKey + '_f'] = cur;
  renderDyns(); renderModes(); setMode('single'); renderSystem();
  renderLayers(); renderParams();
  $('load').style.display = 'none';
  tick();
  window.__TING_READY__ = true;
  window.__TING_CHECK__ = DYN.map(function (d) {
    var m = TC.buildPavilion(d.key, { lod: false });
    return { key: d.key, P: m.P, check: m.check };
  });
} catch (err) {
  $('load').style.display = 'none';
  $('err').style.display = 'flex';
  $('err').textContent = '初始化失败：' + (err && err.message ? err.message : err);
  console.error(err);
}
})();
</script>

<style>
.clabel{position:fixed;transform:translate(-50%,-100%);pointer-events:none;text-align:center;
  background:rgba(15,17,21,.8);border:1px solid #39414f;border-radius:4px;padding:4px 9px;z-index:20}
.clabel b{display:block;font-size:14px;color:#c9a227;letter-spacing:2px}
.clabel span{display:block;font-size:9.5px;color:#767f8d;letter-spacing:.5px}
.clabel i{display:block;font-size:9.5px;color:#9aa4b2;font-style:normal;margin-top:2px}
</style>
</body>
