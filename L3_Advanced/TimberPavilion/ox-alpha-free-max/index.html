<script>
/*<<JS*/
'use strict';
(function(){

/* ============================================================
 * 〇、Three.js CDN 引导（多源回退，双击 file:// 即可运行）
 * ============================================================ */
var CDN=[
  'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
  'https://unpkg.com/three@0.128.0/build/three.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'
];
function fatal(msg){
  var ov=document.getElementById('ov');
  if(!ov)return;
  ov.style.opacity='1';
  ov.innerHTML='<h1 style="color:#e07b5f;font-size:18px;letter-spacing:2px">无法启动</h1>'+
    '<p style="max-width:440px;text-align:center;line-height:1.9">'+msg+'</p>';
}
function loadThree(i){
  if(i>=CDN.length){
    fatal('Three.js 加载失败：本项目需联网经公共 CDN 引入 Three.js（jsdelivr / unpkg / cdnjs 任一可达即可）。');
    return;
  }
  var s=document.createElement('script');
  s.src=CDN[i];
  s.onload=function(){ if(window.THREE)boot(); else loadThree(i+1); };
  s.onerror=function(){ loadThree(i+1); };
  document.head.appendChild(s);
}
loadThree(0);

/* ============================================================
 * 一、主程序
 * ============================================================ */
function boot(){
try{

var T=THREE;

/* ---------- 小工具 ---------- */
function clamp(x,a,b){ return x<a?a:(x>b?b:x); }
function lerp(a,b,t){ return a+(b-a)*t; }
function fmt(x,d){ d=(d===undefined)?2:d; return Number(x).toFixed(d); }
function mulberry32(seed){ var t=seed>>>0; return function(){ t+=0x6D2B79F5; var r=Math.imul(t^(t>>>15),1|t); r^=r+Math.imul(r^(r>>>7),61|r); return ((r^(r>>>14))>>>0)/4294967296; }; }
function angDist(a,b){ var d=Math.abs(a-b)%(Math.PI*2); if(d>Math.PI)d=Math.PI*2-d; return d; }
function easeIO(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

/* ---------- 渲染基础 ---------- */
var app=document.getElementById('app');
var renderer;
try{ renderer=new T.WebGLRenderer({antialias:true}); }
catch(e){ fatal('当前环境不支持 WebGL，无法渲染三维场景。'); return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=T.PCFSoftShadowMap;
renderer.outputEncoding=T.sRGBEncoding;
renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
app.appendChild(renderer.domElement);

var scene=new T.Scene();
scene.background=new T.Color(0x11151d);
scene.fog=new T.Fog(0x11151d,34,95);

var camera=new T.PerspectiveCamera(45,window.innerWidth/window.innerHeight,0.1,300);

/* 天空穹顶（着色器渐变，纯代码） */
(function(){
  var geo=new T.SphereGeometry(140,24,12);
  var mat=new T.ShaderMaterial({
    side:T.BackSide, depthWrite:false, fog:false,
    uniforms:{ cTop:{value:new T.Color(0x1b2334)}, cMid:{value:new T.Color(0x141a26)}, cBot:{value:new T.Color(0x0d1017)} },
    vertexShader:'varying float vy; void main(){ vy=normalize(position).y; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:'varying float vy; uniform vec3 cTop; uniform vec3 cMid; uniform vec3 cBot;'+
      'void main(){ float y=clamp(vy,-1.,1.); vec3 c = y>0. ? mix(cMid,cTop,pow(y,.7)) : mix(cMid,cBot,pow(-y,.6)); gl_FragColor=vec4(c,1.); }'
  });
  scene.add(new T.Mesh(geo,mat));
})();

/* 灯光 */
var hemi=new T.HemisphereLight(0xcfdcec,0x2c2620,0.72); scene.add(hemi);
var sun=new T.DirectionalLight(0xffeeda,1.05);
sun.position.set(14,21,9);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-19; sun.shadow.camera.right=19;
sun.shadow.camera.top=19; sun.shadow.camera.bottom=-19;
sun.shadow.camera.near=2; sun.shadow.camera.far=60;
sun.shadow.bias=-0.0006; sun.shadow.normalBias=0.02;
scene.add(sun);
var fill=new T.DirectionalLight(0x9fb4cc,0.28); fill.position.set(-12,10,-14); scene.add(fill);

/* 地面：圆盘 + 细网格 + 亭基定位环 */
var PAV_X=[-12.6,-4.2,4.2,12.6];
(function(){
  var disc=new T.Mesh(new T.CircleGeometry(70,64),
    new T.MeshPhongMaterial({color:0x272c2b,shininess:4}));
  disc.rotation.x=-Math.PI/2; disc.receiveShadow=true; scene.add(disc);
  var grid=new T.GridHelper(120,48,0x39414a,0x2c333b);
  grid.material.transparent=true; grid.material.opacity=0.33; grid.position.y=0.002;
  scene.add(grid);
  for(var i=0;i<4;i++){
    var ring=new T.Mesh(new T.RingGeometry(4.9,5.02,64),
      new T.MeshBasicMaterial({color:0x3a4149,transparent:true,opacity:.5,side:T.DoubleSide}));
    ring.rotation.x=-Math.PI/2; ring.position.set(PAV_X[i],0.004,0); scene.add(ring);
  }
})();

/* ============================================================
 * 二、朝代形制参数体系（材分制 / 斗口制的可视化转译）
 *  u     ：模数。宋「材分」＝材高之1/15，清「斗口」；唐用材最巨，清斗口最小
 *  jumps ：出跳数（踩数）——唐三跳、宋双跳、明清单翘
 *  ang   ：是否施下昂（清废昂改耍头，明昂嘴趋于装饰）
 *  rise/k：举高比率 与 屋面曲线指数——唐「举折」和缓，明清「举架」陡峻
 *  其余：柱径高比、侧脚、卷杀、普拍方、阑额出头、人字栱、平身科数、台基层数…
 * ============================================================ */
var ERAS=[
 { key:'tang', name:'唐', years:'618 — 907', motto:'雄浑疏朗 · 铺作宏丽',
   HS:3.00, colH:2.55, colR:0.175, taper:0.85, ceJiao:0.055,
   u:0.075, jumps:3, jl:1.85, ang:true,
   puPai:false, eTouChu:true, shuangFang:false, renzi:true, pingKe:0,
   rise:0.42, k:1.55, fei:0.55, upLift:0.16, platSteps:[0.27,0.23], nQ:13,
   caiNote:'用材一等 · 模数（材高/15）≈ 0.075',
   feat:'斗栱雄大疏朗，出三跳带下昂，柱头铺作直接承撩檐槫；无普拍方，阑额出头垂直截切；补间置人字栱；屋面举折平缓，出檐深远。' },
 { key:'song', name:'宋', years:'960 — 1279', motto:'矩矱谨严 · 材分有制',
   HS:2.90, colH:2.62, colR:0.156, taper:0.84, ceJiao:0.065,
   u:0.066, jumps:2, jl:1.95, ang:true,
   puPai:true, eTouChu:false, shuangFang:false, renzi:false, pingKe:1,
   rise:0.50, k:1.75, fei:0.50, upLift:0.19, platSteps:[0.26,0.24], nQ:14,
   caiNote:'《营造法式》材分制 · 模数 ≈ 0.066',
   feat:'依材分制约起屋：普拍方初现，柱身卷杀、侧脚显著；补间施铺作一朵；双跳带下昂；举折较唐渐陡，檐口仍深。' },
 { key:'ming', name:'明', years:'1368 — 1644', motto:'梁枋担重 · 斗栱趋纤',
   HS:2.80, colH:2.66, colR:0.148, taper:0.90, ceJiao:0.032,
   u:0.052, jumps:1, jl:2.10, ang:true,
   puPai:true, eTouChu:false, shuangFang:true, renzi:false, pingKe:2,
   rise:0.62, k:2.00, fei:0.44, upLift:0.23, platSteps:[0.20,0.17,0.13], nQ:15,
   caiNote:'斗栱用材骤减 · 模数 ≈ 0.052',
   feat:'斗栱缩小密置、装饰意趣渐浓：平身科两攒，大额枋下增由额垫板与小额枋；单翘带短昂；举架转陡，出檐收敛，翼角起翘增高。' },
 { key:'qing', name:'清', years:'1636 — 1912', motto:'斗口定制 · 屋面陡峻',
   HS:2.70, colH:2.72, colR:0.138, taper:0.92, ceJiao:0.018,
   u:0.048, jumps:1, jl:2.20, ang:false,
   puPai:true, eTouChu:false, shuangFang:true, renzi:false, pingKe:2,
   rise:0.70, k:2.25, fei:0.40, upLift:0.26, platSteps:[0.20,0.17,0.13], nQ:15,
   caiNote:'《工部工程做法》斗口制 · 斗口 ≈ 0.048',
   feat:'以斗口为权衡：斗栱最小且化为层间垫托，梁柱直接承重；不用下昂、耍头平出；侧脚几近消失；举架最陡，宝顶增益。' }
];

/* 朝代之间的演变注脚（场景地面箭头标注文案） */
var TRANS=[
 '斗栱渐纤 · 普拍方初现 · 举折始陡',
 '斗栱缩密 · 举架增陡 · 出檐收敛',
 '斗口定制 · 废昂用耍头 · 侧脚消隐'
];

/* ============================================================
 * 三、派生尺寸计算 —— 自台基至宝顶的连续承托链（唯一数据源）
 *   每一层的支承面标高都由其下构件的实测顶面推出，保证不悬浮、不错位
 * ============================================================ */
function computeLayout(P){
  var L={};
  L.P=P; L.u=P.u; L.jl=P.jl*P.u;
  L.platSteps=P.platSteps;
  L.platTop=0.5;
  L.colBot=L.platTop+0.11;                 // 柱础（鼓磴/覆盆）高 0.11，柱脚立于其上
  L.colTop=L.colBot+P.colH;
  L.ppH=P.puPai?1.5*P.u:0;                 // 普拍方厚
  L.D0=L.colTop+L.ppH;                     // 铺作底面（坐斗底）
  L.douH=1.15*P.u;                         // 坐斗高
  L.tp=1.25*P.u;                           // 每跳层节奏（层高＝臂高＋升高＋微隙）
  L.armH=0.68*P.u; L.armW=0.62*P.u; L.shengH=0.55*P.u;
  L.yLast=L.D0+L.douH+(P.jumps-1)*L.tp;    // 最上一跳标高
  L.lb=L.yLast+L.armH+L.shengH;            // 撩檐枋底＝令栱外端升顶（全圈同一支承面）
  L.sw=2.1*P.u;                            // 撩檐枋断面
  L.reach=P.jumps*L.jl+0.75*P.u;           // 斗栱总出跳（外跳水平距）
  L.rf=L.HS+L.reach;                       // 撩檐枋中心线半距
  L.rLy=L.rf+L.sw/2;                       // 檐口承椽线半径（枋外皮）
  L.yEave=L.lb+L.sw;                       // 撩檐枋顶＝椽底支承面
  L.roofH=P.rise*L.rLy;                    // 举高
  L.rTop=1.05*P.u;                         // 宝顶座外半径（屋面收束处）
  L.apexY=L.yEave+L.roofH;                 // 宝顶座底＝屋面顶点
  L.bs=2.5*P.u;                            // 井字梁断面
  L.yBeam=L.yLast+L.armH+L.shengH;         // 井字梁底＝座于平身科斗栱里跳升顶
  L.postBase=L.yBeam+L.bs;
  L.platM=Math.max(0.55,L.HS*0.22);
  L.platW1=2*(L.HS+P.colR+L.platM);
  L.platW2=L.platW1-0.6;
  L.wingSpan=(Math.PI/2)/P.nQ*1.7;         // 翼角影响角域
  return L;
}

/* ============================================================
 * 四、材质与通用构件工厂（Low-poly：flat shading ＋ 低分段体素）
 * ============================================================ */
function phong(c,sh){ return new T.MeshPhongMaterial({color:c,flatShading:true,shininess:sh||12,specular:0x1f1c18}); }
function makePalette(){
  return {
    column :phong(0x8f4a30,10),
    wood   :phong(0xa9744a,12),
    woodDk :phong(0x8a5c38,10),
    dg     :phong(0xcf9a5c,14),
    dgDk   :phong(0xb9834a,12),
    stone  :phong(0xa9aeae,6),
    stoneDk:phong(0x878d8f,5),
    gold   :(function(){var m=phong(0xd9a93f,36); m.emissive=new T.Color(0x2a1c05); return m;})(),
    fascia :phong(0x6e4a2e,8)
  };
}
/* 盒体构件（w=x 厚, h=y 长, d=z 厚；可选 yaw/pitch 欧拉） */
function addBox(parent,w,h,d,x,y,z,material,opt){
  opt=opt||{};
  var m=new T.Mesh(new T.BoxGeometry(w,h,d),material);
  m.position.set(x,y,z);
  if(opt.yaw!==undefined||opt.pitch!==undefined) m.rotation.set(opt.pitch||0,opt.yaw||0,0,'YXZ');
  m.castShadow=true; m.receiveShadow=true;
  m.userData={n:opt.n||'',g:opt.g||'',r:opt.r||''};
  parent.add(m);
  return m;
}
function addCyl(parent,rt,rb,h,seg,x,y,z,material,opt){
  opt=opt||{};
  var m=new T.Mesh(new T.CylinderGeometry(rt,rb,h,seg),material);
  m.position.set(x,y,z);
  m.castShadow=true; m.receiveShadow=true;
  m.userData={n:opt.n||'',g:opt.g||'',r:opt.r||''};
  parent.add(m);
  return m;
}
/* 双点梁件：沿 a→b 方向放置断面 w×t 方木（榫卯止于构件表面，不穿模） */
function beamBetween(parent,a,b,w,t,material,opt){
  opt=opt||{};
  var va=new T.Vector3(a[0],a[1],a[2]), vb=new T.Vector3(b[0],b[1],b[2]);
  var vd=vb.clone().sub(va); var len=vd.length();
  var mesh=new T.Mesh(new T.BoxGeometry(w,len,t),material);
  mesh.position.copy(va).addScaledVector(vd,0.5);
  mesh.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),vd.normalize());
  mesh.castShadow=true; mesh.receiveShadow=true;
  mesh.userData={n:opt.n||'',g:opt.g||'',r:opt.r||''};
  parent.add(mesh);
  return mesh;
}
/* Canvas 文本标签 Sprite（零外部资源） */
function makeLabel(text,opt){
  opt=opt||{};
  var fs=opt.fs||40, padX=fs*0.6, fsSub=opt.subFs||Math.round(fs*0.52);
  var cv=document.createElement('canvas'), ctx=cv.getContext('2d');
  var font=opt.font||('600 '+fs+'px "Source Han Sans SC","Microsoft YaHei",sans-serif');
  var sub=opt.sub||'';
  var lines=text.split('\n');
  ctx.font=font; var mainW=ctx.measureText(lines.join('')).width;
  var subFont='400 '+fsSub+'px "Microsoft YaHei",sans-serif';
  ctx.font=subFont; var subW=sub?ctx.measureText(sub).width:0;
  var W=Math.ceil(Math.max(mainW,subW)+padX*2);
  var H=Math.ceil(fs*lines.length*1.28+(sub?fsSub*1.6:0)+fs*0.66);
  cv.width=W; cv.height=H;
  if(!opt.plain){
    ctx.fillStyle=opt.bg||'rgba(10,13,20,0.62)';
    var r=H*0.18;
    ctx.beginPath();
    ctx.moveTo(r,0); ctx.lineTo(W-r,0); ctx.quadraticCurveTo(W,0,W,r);
    ctx.lineTo(W,H-r); ctx.quadraticCurveTo(W,H,W-r,H); ctx.lineTo(r,H);
    ctx.quadraticCurveTo(0,H,0,H-r); ctx.lineTo(0,r); ctx.quadraticCurveTo(0,0,r,0);
    ctx.fill();
    ctx.strokeStyle=opt.border||'rgba(216,179,108,.4)'; ctx.lineWidth=2; ctx.stroke();
  }
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=font; ctx.fillStyle=opt.color||'#ffe9bd';
  var y0=H*0.5-(sub?fsSub*0.8:0)-(lines.length-1)*fs*0.6;
  for(var li=0;li<lines.length;li++) ctx.fillText(lines[li],W/2,y0+li*fs*1.22);
  if(sub){ ctx.font=subFont; ctx.fillStyle=opt.subColor||'#bfb493'; ctx.fillText(sub,W/2,y0+(lines.length-1)*fs*1.22+fsSub*1.5); }
  var tex=new T.CanvasTexture(cv); tex.minFilter=T.LinearFilter;
  var mat=new T.SpriteMaterial({map:tex,transparent:true,depthTest:(opt.depthTest!==false)});
  var spr=new T.Sprite(mat);
  var s=opt.size||0.5;
  spr.scale.set(s*W/H,s,1);
  spr.renderOrder=opt.order||(opt.depthTest===false?99:10);
  return spr;
}
/* 几何合并器：海量小盒（瓦垄/垂脊/望板）合成单网格，顶点着色 */
function Merger(){
  this.pos=[];this.nor=[];this.col=[];this.idx=[];this.v=0;
  var g=new T.BoxGeometry(1,1,1);
  this.tp=g.attributes.position.array;
  this.tn=g.attributes.normal.array;
  this.ti=g.index.array;
  this._p=new T.Vector3(); this._n=new T.Vector3(); this._nm=new T.Matrix3(); this._c=new T.Color();
}
Merger.prototype.add=function(matrix,sx,sy,sz,color,jitter,rnd){
  this._nm.getNormalMatrix(matrix);
  this._c.setHex(color);
  if(jitter){ var f=1+(rnd()*2-1)*jitter; this._c.multiplyScalar(f); }
  var p=this.tp,n=this.tn,i,v=this._p,nn=this._n,c=this._c;
  for(i=0;i<p.length;i+=3){
    v.set(p[i]*sx,p[i+1]*sy,p[i+2]*sz).applyMatrix4(matrix); this.pos.push(v.x,v.y,v.z);
    nn.set(n[i],n[i+1],n[i+2]).applyMatrix3(this._nm).normalize(); this.nor.push(nn.x,nn.y,nn.z);
    this.col.push(c.r,c.g,c.b);
  }
  var b=this.ti;
  for(i=0;i<b.length;i++) this.idx.push(this.v+b[i]);
  this.v+=24;
};
Merger.prototype.build=function(){
  var g=new T.BufferGeometry();
  g.setAttribute('position',new T.Float32BufferAttribute(this.pos,3));
  g.setAttribute('normal',new T.Float32BufferAttribute(this.nor,3));
  g.setAttribute('color',new T.Float32BufferAttribute(this.col,3));
  g.setIndex(this.idx);
  return g;
};

/* ============================================================
 * 五、分层装配 —— 九个结构层自下而上逐层搭接
 *  L0 台基 L1 柱础 L2 柱网 L3 额枋·普拍方 L4 斗栱铺作(+撩檐枋)
 *  L5 梁架 L6 椽望 L7 瓦作 L8 宝顶
 * ============================================================ */
var LAYER_NAMES=['① 台基','② 柱础','③ 柱网','④ 额枋·普拍方','⑤ 斗栱铺作','⑥ 梁架','⑦ 椽望','⑧ 瓦作','⑨ 宝顶'];

/* --- L0 台基（含阶条石、踏步） --- */
function buildPlatform(g,L,mats,P){
  var steps=L.platSteps, y=0.006, i;
  for(i=0;i<steps.length;i++){
    var hh=steps[i];
    var w=lerp(L.platW1,L.platW2,i/Math.max(steps.length-1,1));
    addBox(g,w,hh,w, 0,y+hh/2-0.01,0, i%2?mats.stone:mats.stoneDk,
      {n:i===0?'台基陡板':'台基层石',g:LAYER_NAMES[0],
       r:'承托全亭荷载：柱网压力经柱础均布传于台基，再散入大地'+(steps.length>2?'（清式多层台基，须弥座意趣）':'')});
    y+=hh;
  }
  var wt=L.platW2*0.035+0.12;
  addBox(g,L.platW2,0.055,wt, 0,y+0.02, L.platW2/2-wt/2, mats.stone,{n:'阶条石',g:LAYER_NAMES[0],r:'台缘压阑石，护边收口'});
  addBox(g,L.platW2,0.055,wt, 0,y+0.02,-L.platW2/2+wt/2, mats.stone,{n:'阶条石',g:LAYER_NAMES[0],r:'台缘压阑石，护边收口'});
  addBox(g,wt,0.055,L.platW2, -L.platW2/2+wt/2,y+0.02,0, mats.stone,{n:'阶条石',g:LAYER_NAMES[0],r:'台缘压阑石，护边收口'});
  addBox(g,wt,0.055,L.platW2,  L.platW2/2-wt/2,y+0.02,0, mats.stone,{n:'阶条石',g:LAYER_NAMES[0],r:'台缘压阑石，护边收口'});
  var sw=L.platW2*0.24;
  for(i=0;i<3;i++){
    addBox(g,sw,0.13,0.3, 0,y-0.065-i*0.115, L.platW2/2+0.15+i*0.3, mats.stoneDk,
      {n:'踏步',g:LAYER_NAMES[0],r:'登亭石阶'});
  }
}
/* --- L1 柱础 --- */
function buildChuzhu(g,L,mats,P,xs){
  var ornate=(P.key==='ming'||P.key==='qing');
  for(var i=0;i<4;i++){
    var x=xs[i][0], z=xs[i][1];
    var hB=0.11, rB=P.colR*1.78;
    addCyl(g,rB*0.92,rB,hB,10, x,L.platTop+hB/2-0.006,z, mats.stone,
      {n:ornate?'覆盆柱础':'鼓磴柱础',g:LAYER_NAMES[1],
       r:'柱下承重石：将柱身集中力扩散于台基，隔潮防蛀'});
    if(ornate){
      var tor=new T.Mesh(new T.TorusGeometry(rB*0.78,0.028,6,14),mats.stoneDk);
      tor.rotation.x=Math.PI/2; tor.position.set(x,L.platTop+hB-0.014,z);
      tor.castShadow=true;
      tor.userData={n:'覆盆莲瓣',g:LAYER_NAMES[1],r:'柱础雕饰：明清础面渐繁'};
      g.add(tor);
    }
  }
}
/* --- L2 柱网（四根檐柱：卷杀收分＋侧脚内倾） --- */
function buildColumns(g,L,mats,P,xs){
  var tilt=Math.atan2(P.ceJiao,P.colH);
  for(var i=0;i<4;i++){
    var x=xs[i][0], z=xs[i][1];
    var m=addCyl(g,P.colR*P.taper,P.colR,P.colH,10, x,L.colBot+P.colH/2,z, mats.column,
      {n:'檐柱',g:LAYER_NAMES[2],
       r:'竖向承重主干：上承额枋斗栱、下载柱础；径∶高 ≈ 1∶'+fmt(P.colH/(P.colR*2),1)+
         (P.key==='tang'?'（唐柱粗壮）':(P.key==='qing'?'（清柱修长）':''))+
         '，顶部内倾 '+fmt(P.ceJiao*1000,0)+'‰ 即「侧脚」'});
    if(tilt>0.001){
      var d=new T.Vector3(-x,0,-z).normalize();
      var axis=new T.Vector3(d.z,0,-d.x).normalize();
      m.quaternion.setFromAxisAngle(axis,tilt);
    }
  }
}
/* --- L3 阑额 / 由额垫板 / 小额枋 / 普拍方 --- */
function buildFang(g,L,mats,P){
  var hl=5.2*L.u, wl=2.6*L.u;
  var hs=hl*0.6, hp=hl*0.45;
  var faces=[
    {ax:'z',c: L.HS},{ax:'z',c:-L.HS},
    {ax:'x',c: L.HS},{ax:'x',c:-L.HS}
  ];
  for(var i=0;i<faces.length;i++){
    var f=faces[i];
    var len=2*L.HS+(P.eTouChu?1.2*L.u:-2*P.colR*0.9);
    var alongZ=(f.ax==='z');
    addBox(g, alongZ?len:wl, hl, alongZ?wl:len, alongZ?0:f.c, L.colTop-hl/2, alongZ?f.c:0, mats.wood,
      {n:'大额枋（阑额）',g:LAYER_NAMES[3],
       r:'柱间联络材：汇总柱头荷载整片传给斗栱；断面 '+fmt(wl,3)+'×'+fmt(hl,3)+
         '（随朝代模数递减）'+(P.eTouChu?'；唐式出头垂直截切':'')});
    if(P.shuangFang){
      addBox(g, alongZ?len*0.96:wl*0.9, hs, alongZ?wl*0.9:len*0.96,
        alongZ?0:f.c, L.colTop-hl-hp-hs/2, alongZ?f.c:0, mats.woodDk,
        {n:'小额枋',g:LAYER_NAMES[3],r:'与大额枋上下叠合，增强柱头联络刚度'});
      addBox(g, alongZ?len*0.96:wl*0.72, hp, alongZ?wl*0.72:len*0.96,
        alongZ?0:f.c, L.colTop-hl-hp/2, alongZ?f.c:0, mats.fascia,
        {n:'由额垫板',g:LAYER_NAMES[3],r:'填补两枋间空当（明清做法）'});
    }
  }
  if(P.puPai){
    var pw=2.9*L.u, ph=L.ppH, plen=2*L.HS+pw;
    addBox(g,plen,ph,pw, 0,L.colTop+ph/2, L.HS, mats.wood,{n:'普拍方',g:LAYER_NAMES[3],r:'柱头圈梁：宋代始盛，均匀分配柱头反力予铺作'});
    addBox(g,plen,ph,pw, 0,L.colTop+ph/2,-L.HS, mats.wood,{n:'普拍方',g:LAYER_NAMES[3],r:'柱头圈梁：宋代始盛，均匀分配柱头反力予铺作'});
    addBox(g,pw,ph,plen,-L.HS,L.colTop+ph/2,0, mats.wood,{n:'普拍方',g:LAYER_NAMES[3],r:'柱头圈梁：宋代始盛，均匀分配柱头反力予铺作'});
    addBox(g,pw,ph,plen, L.HS,L.colTop+ph/2,0, mats.wood,{n:'普拍方',g:LAYER_NAMES[3],r:'柱头圈梁：宋代始盛，均匀分配柱头反力予铺作'});
  }
}
/* --- 人字栱（唐·补间） --- */
function buildRenzi(g,L,mats,cx,cz,yaw){
  var u=L.u, spread=0.85*u, hgt=3.4*u;
  var grp=new T.Group(); grp.position.set(cx,L.colTop,cz); grp.rotation.y=yaw;
  beamBetween(grp,[spread,0,0],[0,hgt,0],0.55*u,0.55*u,mats.dg,
    {n:'人字栱·左腿',g:LAYER_NAMES[4],r:'唐代补间典型：人字形斜撑托举檐部荷载'});
  beamBetween(grp,[-spread,0,0],[0,hgt,0],0.55*u,0.55*u,mats.dg,
    {n:'人字栱·右腿',g:LAYER_NAMES[4],r:'唐代补间典型：人字形斜撑托举檐部荷载'});
  addCyl(grp,0.42*u,0.5*u,0.5*u,8, 0,hgt+0.22*u,0, mats.dgDk,
    {n:'人字栱顶斗',g:LAYER_NAMES[4],r:'脊上小斗承联络'});
  g.add(grp);
}

/* --- 斗栱铺作（十字栱：坐斗→逐跳出跳→令栱→昂或耍头） ---
 * 局部坐标：原点在坐斗底（世界标高 D0），+Z 为外跳方向 */
function buildDougongSet(g,L,mats,P,cx,cz,yaw,kind){
  var u=L.u, jl=L.jl;
  var grp=new T.Group(); grp.position.set(cx,L.D0-0.004,cz); grp.rotation.y=yaw;
  var douH=L.douH, armH=L.armH, armW=L.armW, tp=L.tp, shengH=L.shengH;
  var lbLoc=L.lb-L.D0, yLastLoc=L.yLast-L.D0;
  var G4=LAYER_NAMES[4];
  function sheng(px,py,pz){
    addBox(grp,1.5*u,shengH,1.5*u, px,py+shengH/2,pz, mats.dgDk,
      {n:'升',g:G4,r:'小型斗：置于栱头，承上一层构件'});
  }
  addBox(grp,2.6*u,douH,2.6*u, 0,douH/2,0, mats.dgDk,
    {n:kind==='jiao'?'角科坐斗':(kind==='ping'?'平身科坐斗':'柱头科坐斗'),g:G4,
     r:'铺作基座：汇聚上部檐载，经其底传于柱头／普拍方／额枋'});
  var y=douH;
  for(var j=0;j<P.jumps;j++){
    var outR=(j+1)*jl, latR=1.35*u+0.5*u*j, isTop=(j===P.jumps-1);
    /* 横栱：沿墙面方向（顶层即令栱），两端升直接承撩檐枋 */
    addBox(grp,latR*2,armH,armW, 0,y+armH/2,0, mats.dg,
      {n:isTop?'令栱':(j===0?'瓜子栱':'万栱'),g:G4,
       r:isTop?'最上横栱：外端升与昂尖共同托起撩檐枋':'横栱：横向分配荷载串联诸跳'});
    sheng( latR,y+armH,0);
    sheng(-latR,y+armH,0);
    if(isTop){
      if(kind==='jiao'){
        /* 角科：纵臂缩短，斜向构件在 diagGrp 中单独施加 */
        var innC=1.15*u;
        addBox(grp,armW,armH,innC*2, 0,y+armH/2,0, mats.dg,
          {n:'角科华栱',g:G4,r:'角部十字栱纵臂'});
        sheng(0,y+armH,innC*0.9);
      }else if(P.ang){
        /* 下昂：根嵌铺作内部、昂尖顶起撩檐枋外端（角度由几何自然生成） */
        var pivY=(P.jumps>=2)?(douH+tp*(P.jumps-2)+armH*0.55):douH;
        var tipZ=outR*0.99, tipY=lbLoc-armH*0.46-0.006;
        beamBetween(grp,[0,pivY,0.3*u],[0,tipY,tipZ],armW,armH*0.92,mats.dg,
          {n:'下昂',g:G4,r:'斜置斜木：昂尖承撩檐枋、昂尾压于铺作层内，将檐口荷载斜传回正心'+
            (P.key==='ming'?'（明清昂嘴趋于装饰）':'（唐宋昂势雄健）')});
        addBox(grp,1.3*u,0.5*u,1.3*u, 0,lbLoc-0.006+0.24*u,tipZ-0.1*u, mats.dgDk,
          {n:'昂头升斗',g:G4,r:'昂尖之上直接座枋的小斗'});
      }else{
        var innR=1.15*u;
        addBox(grp,armW,armH,innR+outR, 0,y+armH/2,(outR-innR)/2, mats.dg,
          {n:'华栱（翘）',g:G4,r:'纵向悬挑臂：逐跳向外悬出，是「出跳」的本体——本例出 '+P.jumps+' 跳'});
        sheng(0,y+armH,outR);
        addBox(grp,0.85*u,0.55*u,outR*0.5, 0,lbLoc-0.02-0.275*u, 0.35*u+outR*0.78, mats.dgDk,
          {n:'耍头',g:G4,r:'清代废昂：纵材平出头成蚂蚱头，纯作承托联络'});
      }
    }else{
      var inn2=0.9*u+j*0.35*u;
      addBox(grp,armW,armH,inn2+outR, 0,y+armH/2,(outR-inn2)/2, mats.dg,
        {n:'华栱（翘）',g:G4,r:'纵向悬挑臂：逐跳向外悬出'});
      sheng(0,y+armH,outR);
    }
    y+=tp;
  }
  /* 正心枋：填充正心空当直至撩檐枋底 */
  addBox(grp,1.35*u,lbLoc-(yLastLoc+armH),1.35*u,
    0,yLastLoc+armH+(lbLoc-yLastLoc-armH)/2,0, mats.dgDk,
    {n:'正心枋',g:G4,r:'正心竖板：层层填实，使斗栱中心连成整片传力带'});
  /* 角科 45° 斜向构件（老角梁落座位） */
  if(kind==='jiao'){
    var dg2=new T.Group(); dg2.rotation.y=Math.PI/4; grp.add(dg2);
    var outD=P.jumps*jl*0.92+0.7*u;
    var tipDY=lbLoc-armH*0.46-0.006;
    if(P.ang){
      var pivDY=(P.jumps>=2)?(douH+tp*(P.jumps-2)*0.5+armH*0.5):douH;
      beamBetween(dg2,[0,pivDY,0.28*u],[0,tipDY,outD],armW*1.15,armH*0.95,mats.dgDk,
        {n:'斜昂（角昂）',g:G4,r:'角科 45° 斜置构件：承托老角梁后尾，把翼角荷载折返正心'});
    }else{
      addBox(dg2,armW*1.1,0.55*u,outD*0.62, 0,lbLoc-0.02-0.275*u,outD*0.36, mats.dgDk,
        {n:'角科耍头',g:G4,r:'清代角科斜向平出头，承托老角梁'});
    }
  }
  g.add(grp);
  return grp;
}
/* --- L4 铺作装配：四角科 + 平身科/人字栱 --- */
function buildSets(g,L,mats,P){
  var cs=[[1,1],[1,-1],[-1,-1],[-1,1]];
  for(var i=0;i<4;i++){
    var cx=cs[i][0]*L.HS, cz=cs[i][1]*L.HS;
    buildDougongSet(g,L,mats,P,cx,cz,Math.atan2(cx,cz),'jiao');
  }
  var offs=P.pingKe===2?[-0.44,0.44]:(P.pingKe===1?[0]:[]);
  var bases=[[0,L.HS],[0,-L.HS],[L.HS,0],[-L.HS,0]];
  var yaws=[0,Math.PI,Math.PI/2,-Math.PI/2];
  for(var f=0;f<4;f++){
    for(var o=0;o<offs.length;o++){
      var t=offs[o]*L.HS;
      var px=bases[f][0]+(f<2?t:0), pz=bases[f][1]+(f<2?0:t);
      buildDougongSet(g,L,mats,P,px,pz,yaws[f],'ping');
    }
    if(P.renzi) buildRenzi(g,L,mats,bases[f][0],bases[f][1],yaws[f]);
  }
}
/* --- L4b 撩檐枋（挑檐桁）：环形承接檐椽 --- */
function buildLiaoyan(g,L,mats){
  var sw=L.sw, len=2*L.rf+sw, cy=L.lb+sw/2-0.004;
  var meta={n:'撩檐枋（挑檐桁）',g:LAYER_NAMES[4],
    r:'搁置于斗栱外跳令栱升／昂尖之上：檐口第一道承椽横木，斗栱出跳由此化为可用檐深'};
  addBox(g,len,sw,sw, 0,cy, L.rf,mats.woodDk,meta);
  addBox(g,len,sw,sw, 0,cy,-L.rf,mats.woodDk,meta);
  addBox(g,sw,sw,len, L.rf,cy,0,mats.woodDk,meta);
  addBox(g,sw,sw,len,-L.rf,cy,0,mats.woodDk,meta);
}
/* --- L5 梁架：井字梁（刻半搭交）＋太平墩＋雷公柱＋老/仔角梁 --- */
function buildLiangjia(g,L,mats,P){
  var bs=L.bs, reach=L.HS-0.3*L.u, yC=L.yBeam+bs/2;
  addBox(g,reach*2,bs,bs, 0,yC,0, mats.wood,
    {n:'井字长梁',g:LAYER_NAMES[5],
     r:'趴于平身科斗栱里跳升顶：两梁刻半搭交成「井」字，是收束雷公柱的空间刚架'});
  addBox(g,bs,bs,reach*2, 0,yC,0, mats.wood,
    {n:'井字长梁',g:LAYER_NAMES[5],
     r:'趴于平身科斗栱里跳升顶：两梁刻半搭交成「井」字，是收束雷公柱的空间刚架'});
  addBox(g,1.9*L.u,bs*0.82,1.9*L.u, 0,L.postBase+bs*0.41-0.01,0, mats.woodDk,
    {n:'太平梁·墩',g:LAYER_NAMES[5],r:'压于井字梁交点并盖住搭交缝：将雷公柱集中力分散给两梁'});
  var pedTop=L.postBase+bs*0.82-0.02;
  var hPost=Math.max(L.apexY-pedTop,0.2);
  addCyl(g,0.8*L.u,0.95*L.u,hPost,8, 0,pedTop+hPost/2,0, mats.column,
    {n:'雷公柱',g:LAYER_NAMES[5],
     r:'攒尖顶心脏：四垂脊汇交处的中心柱，上承宝顶、下经太平墩－井字梁传于斗栱圈'});
  var cs=[[1,1],[1,-1],[-1,-1],[-1,1]];
  var postR=0.95*L.u;
  for(var i=0;i<4;i++){
    var cx=cs[i][0]*L.HS, cz=cs[i][1]*L.HS;
    var A=[cx,L.yLast+L.armH*0.55,cz];
    var joinY=L.apexY-0.55*L.u;
    var dv=new T.Vector3(-cx,joinY-A[1],-cz);
    var full=dv.length(); dv.normalize();
    var stop=postR*1.15;
    var B=[A[0]+dv.x*(full-stop), A[1]+dv.y*(full-stop), A[2]+dv.z*(full-stop)];
    beamBetween(g,A,B,1.35*L.u,1.05*L.u,mats.wood,
      {n:'老角梁',g:LAYER_NAMES[5],
       r:'自角科斜昂起、汇于雷公柱柱身：攒尖垂脊骨架，翼角荷载由此折返中心'});
    var a2=[lerp(A[0],B[0],0.42),lerp(A[1],B[1],0.42)+0.1*L.u,lerp(A[2],B[2],0.42)];
    var b2=[B[0]+cs[i][0]*0.5*L.u,B[1]+0.18*L.u,B[2]+cs[i][1]*0.5*L.u];
    beamBetween(g,a2,b2,0.9*L.u,0.66*L.u,mats.wood,
      {n:'仔角梁',g:LAYER_NAMES[5],r:'叠于老角梁之上并向外冲出：塑造翼角起翘的骨架基准'});
  }
}
/* --- 屋面剖面：举折／举架曲线 ＋ 翼角起翘 --- */
function makeProfile(L,P){
  return function(r,az){
    var tt=clamp((L.rLy-r)/(L.rLy-L.rTop),0,1);
    var y=L.yEave+L.roofH*Math.pow(tt,P.k);
    var q=Math.floor(az/(Math.PI/2)), azC=Math.PI/4+q*Math.PI/2;
    var s=clamp(1-angDist(az,azC)/L.wingSpan,0,1);
    s=s*s*(3-2*s);
    y+=P.upLift*s*Math.pow(1-tt,2.1);
    return y;
  };
}
function slopeAt(prof,r,az){
  var e=0.02;
  return (prof(r-e,az)-prof(r+e,az))/(2*e);
}
/* --- L6 椽望：檐椽放射扇 ＋ 飞椽 ＋ 封檐板 --- */
function buildRafters(g,L,mats,P,prof){
  var nQ=P.nQ, slot=Math.PI/2/nQ, rh=0.62*L.u;
  for(var q=0;q<4;q++){
    for(var i=0;i<nQ;i++){
      var az=q*Math.PI/2+(i+0.5)*slot;
      var azC=Math.PI/4+q*Math.PI/2;
      if(angDist(az,azC)<slot*0.92) continue;      // 角部让位于角梁与垂脊
      var wing=clamp(1-angDist(az,azC)/L.wingSpan,0,1);
      wing=wing*wing*(3-2*wing);
      var rOut=L.rLy+L.sw*0.28+wing*P.fei*0.35;
      var rIn=L.rTop+0.10;
      var segs=3;
      for(var s2=0;s2<segs;s2++){
        var ra=lerp(rOut,rIn,s2/segs), rb=lerp(rOut,rIn,(s2+1)/segs);
        var rm=(ra+rb)/2;
        var ya=prof(ra,az), yb=prof(rb,az);
        var len=Math.sqrt((ra-rb)*(ra-rb)+(yb-ya)*(yb-ya))+0.015;
        var pitch=Math.atan2(ya-yb,ra-rb);
        addBox(g,rh,len,rh, rm*Math.sin(az),(ya+yb)/2-rh/2-0.004,rm*Math.cos(az), mats.wood,
          {n:s2===0?'檐椽':'脑椽',g:LAYER_NAMES[6],
           r:'放射承瓦构件：下搁撩檐枋、上向雷公柱收束，把瓦面荷载导入斗栱圈'},
          {yaw:az,pitch:pitch});
      }
      /* 飞椽：叠于檐椽背出跳，坡度放缓形成檐口反宇上翘 */
      var r0=L.rLy+L.sw*0.28;
      var fl=P.fei*(1+wing*1.5);
      var yBase=prof(r0,az)+rh*0.55;
      var yTip=yBase-slopeAt(prof,r0,az)*fl*0.35+wing*P.upLift*0.6;
      var r1=r0+fl;
      addBox(g,rh*0.72,Math.sqrt(fl*fl+(yBase-yTip)*(yBase-yTip)),rh*0.72,
        (r0+r1)/2*Math.sin(az),(yBase+yTip)/2+rh*0.36,(r0+r1)/2*Math.cos(az),
        mats.woodDk,
        {n:'飞椽',g:LAYER_NAMES[6],r:'第二层出檐：坡度骤然放缓使檐尖上扬——“飞椽”之名由此'},
        {yaw:az,pitch:Math.atan2(yTip-yBase,fl)});
    }
  }
  /* 封檐板：围合椽头 */
  var fy=L.yEave-0.1, flen=2*L.rf+L.sw;
  addBox(g,flen,0.34,0.05, 0,fy, L.rf,mats.fascia,{n:'封檐板',g:LAYER_NAMES[6],r:'护住椽头断面的檐口木板'});
  addBox(g,flen,0.34,0.05, 0,fy,-L.rf,mats.fascia,{n:'封檐板',g:LAYER_NAMES[6],r:'护住椽头断面的檐口木板'});
  addBox(g,0.05,0.34,flen, L.rf,fy,0,mats.fascia,{n:'封檐板',g:LAYER_NAMES[6],r:'护住椽头断面的檐口木板'});
  addBox(g,0.05,0.34,flen,-L.rf,fy,0,mats.fascia,{n:'封檐板',g:LAYER_NAMES[6],r:'护住椽头断面的檐口木板'});
}
/* --- L7 瓦作：筒板瓦垄 ＋ 望板衬层 ＋ 垂脊 ＋ 嫁兽（合并网格·顶点色） --- */
function buildTiles(g,L,mats,P,prof){
  var mg=new Merger(), rnd=mulberry32(777+Math.round(P.u*1e6));
  var C_PAN=0x4a5560, C_TON=0x5d6b78, C_RID=0x39424d, C_BOARD=0x51473c;
  var nQ=P.nQ, slot=Math.PI/2/nQ, courses=5;
  var panW=slot*L.rLy*0.62, tonW=slot*L.rLy*0.34;
  var rs=[]; for(var c2=0;c2<=courses;c2++) rs.push(lerp(L.rLy+L.sw*0.3,L.rTop+0.05,c2/courses));
  var tmpM=new T.Matrix4(), tmpQ=new T.Quaternion(), tmpE=new T.Euler(),
      tmpV=new T.Vector3(), one=new T.Vector3(1,1,1);
  function putBox(w,h,d, x,y,z, yaw,pitch,color,jit){
    tmpE.set(pitch,yaw,0,'YXZ'); tmpQ.setFromEuler(tmpE);
    tmpV.set(x,y,z);
    tmpM.compose(tmpV,tmpQ,one);
    mg.add(tmpM,w,h,d,color,jit,rnd);
  }
  var total=0, q, i;
  for(q=0;q<4;q++){
    for(i=0;i<nQ;i++){
      var az=q*Math.PI/2+(i+0.5)*slot;
      var azC=Math.PI/4+q*Math.PI/2;
      if(angDist(az,azC)<slot*0.92) continue;
      var tong=(total%2===0);          // 板瓦／筒瓦垄交替
      total++;
      var th=tong?0.075:0.045, wid=tong?tonW:panW;
      for(var s3=0;s3<courses;s3++){
        var ra=rs[s3], rb=rs[s3+1], rm=(ra+rb)/2;
        var ya=prof(ra,az), yb=prof(rb,az);
        var len=Math.sqrt((ra-rb)*(ra-rb)+(yb-ya)*(yb-ya))+0.012;
        var pitch=Math.atan2(ya-yb,ra-rb);
        putBox(wid,th,len, rm*Math.sin(az),prof(rm,az)+th/2+0.004,rm*Math.cos(az),
          az,pitch, tong?C_TON:C_PAN, 0.10);
      }
      if(!tong){                        // 滴水（板瓦垄檐口）
        putBox(panW*1.25,0.05,0.26, rs[0]*Math.sin(az),prof(rs[0],az)+0.035,rs[0]*Math.cos(az),
          az,0.16,C_TON,0.06);
      }
    }
  }
  /* 望板衬层：每象限随坡整片（檐口露明处可见） */
  for(q=0;q<4;q++){
    for(i=0;i<courses;i++){
      var ra2=rs[i], rb2=rs[i+1], rm2=(ra2+rb2)/2;
      var azm=q*Math.PI/2+Math.PI/4;
      var ya2=prof(ra2,azm), yb2=prof(rb2,azm);
      var len2=Math.sqrt((ra2-rb2)*(ra2-rb2)+(yb2-ya2)*(yb2-ya2));
      putBox(rm2*(Math.PI/2)*0.98,0.05,len2*0.99,
        rm2*Math.sin(azm),prof(rm2,azm)-0.085,rm2*Math.cos(azm), azm,Math.atan2(ya2-yb2,ra2-rb2),
        C_BOARD,0.05);
    }
  }
  /* 垂脊 ×4 ＋ 嫁兽 */
  for(q=0;q<4;q++){
    var azC2=q*Math.PI/2+Math.PI/4;
    var rEnd=Math.SQRT2*(L.rf+L.sw/2)*0.985;
    var N=7;
    for(i=0;i<N;i++){
      var t=i/(N-1);
      var rr=lerp(L.rTop+0.2,rEnd,t);
      var hh=lerp(0.09,0.4,t), ww=lerp(0.15,0.42,t);
      putBox(ww,hh,ww*1.25, rr*Math.sin(azC2),prof(rr,azC2)+hh/2-0.03,rr*Math.cos(azC2),
        azC2,Math.atan2(prof(rr-0.02,azC2)-prof(rr+0.02,azC2),0.04),C_RID,0.05);
    }
    var xr=rEnd*Math.sin(azC2), zr=rEnd*Math.cos(azC2), yr=prof(rEnd,azC2);
    putBox(0.16,0.15,0.2, xr,yr+0.1,zr, azC2,0.25,C_RID,0);
    putBox(0.09,0.14,0.09, xr+Math.sin(azC2)*0.1,yr+0.2,zr+Math.cos(azC2)*0.1, azC2,-0.5,C_RID,0);
  }
  var mesh=new T.Mesh(mg.build(),
    new T.MeshPhongMaterial({vertexColors:true,flatShading:true,shininess:10,specular:0x18181c}));
  mesh.castShadow=true; mesh.receiveShadow=true;
  mesh.userData={n:'筒板瓦垄 · 垂脊',g:LAYER_NAMES[7],
    r:'瓦垄随椽呈放射状：板瓦仰置、筒瓦覆扣交替成垄；四条垂脊自宝顶沿角部下垂收于嫁兽——瓦面荷载顺瓦→椽→撩檐枋→斗栱而下'};
  g.add(mesh);
}
/* --- L8 宝顶 --- */
function buildBaoding(g,L,mats,P){
  var u=L.u, y=L.apexY;
  addCyl(g,u*0.95,u*1.05,u*0.8,8, 0,y+u*0.4-0.004,0, mats.stoneDk,
    {n:'宝顶座',g:LAYER_NAMES[8],r:'压固雷公柱顶、收束四组垂脊'});
  addCyl(g,u*0.62,u*0.8,u*0.7,8, 0,y+u*1.1,0, mats.gold,
    {n:'宝顶须弥座',g:LAYER_NAMES[8],r:'座与珠之间的过渡段'});
  var ball=new T.Mesh(new T.IcosahedronGeometry(u*0.95,1),mats.gold);
  ball.position.set(0,y+u*1.95,0);
  ball.castShadow=true;
  ball.userData={n:'宝珠',g:LAYER_NAMES[8],r:'铜鎏金宝珠：全亭构图焦点，亦为雷公柱顶端保护冠'};
  g.add(ball);
  addCyl(g,0.001,u*0.3,u*0.8,6, 0,y+u*2.75,0, mats.gold,

}

/* ============================================================
 * 六、整亭装配
 * ============================================================ */
function buildPavilion(P,x){
  var L=computeLayout(P);
  var root=new T.Group(); root.position.set(x,0,0);
  var mats=makePalette();
  var layers=[], i;
  for(i=0;i<9;i++){ var lg=new T.Group(); lg.userData.idx=i; root.add(lg); layers.push(lg); }

  var xs=[[L.HS,L.HS],[L.HS,-L.HS],[-L.HS,-L.HS],[-L.HS,L.HS]];
  buildPlatform(layers[0],L,mats,P);
  buildChuzhu(layers[1],L,mats,P,xs);
  buildColumns(layers[2],L,mats,P,xs);
  buildFang(layers[3],L,mats,P);
  buildSets(layers[4],L,mats,P);
  buildLiaoyan(layers[4],L,mats);
  var prof=makeProfile(L,P);
  buildLiangjia(layers[5],L,mats,P);
  buildRafters(layers[6],L,mats,P,prof);
  buildTiles(layers[7],L,mats,P,prof);
  buildBaoding(layers[8],L,mats,P);

  var meshes=[], matsList=[];
  root.traverse(function(o){ if(o.isMesh){ meshes.push(o); if(matsList.indexOf(o.material)<0)matsList.push(o.material);} });

  /* 层级标注（随层解构联动） */
  var labelSprites=[];
  var ly=[0.32,0.58,L.colBot+P.colH*0.5,L.colTop-0.1,L.D0+(L.lb-L.D0)*0.5,
          (L.yBeam+L.apexY)/2,(L.yEave+L.apexY)/2,(L.yEave+L.apexY)/2+0.14,L.apexY+0.5];
  for(i=0;i<9;i++){
    var spr=makeLabel(LAYER_NAMES[i],{fs:34,size:0.34,bg:'rgba(10,13,20,0.5)'});
    spr.position.set(L.platW2/2+0.75,ly[i],0);
    layers[i].add(spr); labelSprites.push(spr);
  }
  var title=makeLabel(P.name,{sub:P.years+' · '+P.motto,fs:64,subFs:26,size:1.05,color:'#ffd98f'});
  title.position.set(0,L.apexY+1.55,0);
  root.add(title);

  /* 承托受力链：宝顶→雷公柱→井字梁→角科→柱→础→台基→地面 */
  var chain=new T.Group();
  var spine=[[0,L.apexY+0.55,0],[0,L.postBase+L.bs*0.8,0],[0,L.yBeam+L.bs/2,0]];
  for(i=0;i<4;i++){
    var cx2=csOf(i)[0]*L.HS, cz2=csOf(i)[1]*L.HS;
    var pts=spine.concat([
      [cx2*0.55,lerp(L.yBeam,L.apexY,0.5),cz2*0.55],
      [cx2,L.yLast+L.armH,cz2],
      [cx2,L.colTop,cz2],
      [cx2,L.colBot,cz2],
      [cx2,L.platTop+0.055,cz2],
      [cx2*1.04,0.03,cz2*1.04]
    ]);
    var geo=new T.BufferGeometry().setFromPoints(
      pts.map(function(p){return new T.Vector3(p[0],p[1],p[2]);}));
    chain.add(new T.Line(geo,new T.LineBasicMaterial({color:0xffcf6e,transparent:true,opacity:0.5})));
    chain.userData['branch'+i]=pts;
  }
  var dotMat=new T.MeshBasicMaterial({color:0xffe08a}), dots=[];
  for(i=0;i<16;i++){
    var d=new T.Mesh(new T.SphereGeometry(0.05,8,6),dotMat);
    chain.add(d); dots.push(d);
  }
  chain.userData.dots=dots;
  root.add(chain);

  scene.add(root);
  return {P:P,L:L,root:root,layers:layers,meshes:meshes,matsList:matsList,
          labelSprites:labelSprites,titleSprite:title,chain:chain,
          profile:prof,ghosted:false};
}
function csOf(i){ return [[1,1],[1,-1],[-1,-1],[-1,1]][i]; }

var pavilions=[];
for(var pi=0;pi<ERAS.length;pi++) pavilions.push(buildPavilion(ERAS[pi],PAV_X[pi]));

/* 朝代间演变注脚（地面箭头 + 文案） */
for(pi=0;pi<3;pi++){
  (function(idx){
    var xm=(PAV_X[idx]+PAV_X[idx+1])/2;
    var arrMat=new T.MeshBasicMaterial({color:0x8d7a4e});
    var cone=new T.Mesh(new T.ConeGeometry(0.09,0.34,4),arrMat);
    cone.rotation.z=-Math.PI/2; cone.position.set(xm+0.6,0.06,0); scene.add(cone);
    var stem=new T.Mesh(new T.BoxGeometry(0.9,0.02,0.05),arrMat);
    stem.position.set(xm-0.05,0.06,0); scene.add(stem);
    var spr=makeLabel(TRANS[idx],{fs:26,size:0.42,bg:'rgba(10,13,20,0.55)',order:11});
    spr.position.set(xm,0.85,0); scene.add(spr);
  })(pi);
}

/* ============================================================
 * 七、相机控制（自研轨道：旋转/平移/缩放 + 阻尼 + 自动环视）
 * ============================================================ */
var cam={theta:-0.85,phi:1.08,r:26,tgt:new T.Vector3(0,2.1,0)};
var camGoal={theta:cam.theta,phi:cam.phi,r:cam.r,tgt:cam.tgt.clone()};
var lastUser=performance.now();
var dom=renderer.domElement;
dom.style.touchAction='none';
var pointers=new Map(), pinchD0=0, mode=null,lastX=0,lastY=0;

dom.addEventListener('contextmenu',function(e){ e.preventDefault(); });
dom.addEventListener('pointerdown',function(e){
  dom.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    var ps=Array.from(pointers.values());
    pinchD0=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);
  }
  mode=(e.button===2||e.shiftKey)?'pan':'rot';
  lastX=e.clientX; lastY=e.clientY;
  lastUser=performance.now();
});
dom.addEventListener('pointermove',function(e){
  mouseNX=(e.clientX/window.innerWidth)*2-1;
  mouseNY=-(e.clientY/window.innerHeight)*2+1;
  mousePX=e.clientX; mousePY=e.clientY; mouseMoved=true;
  var p=pointers.get(e.pointerId);
  if(!p) return;
  var dx=e.clientX-p.x, dy=e.clientY-p.y;
  p.x=e.clientX; p.y=e.clientY;
  lastUser=performance.now();
  if(pointers.size===2){
    var ps2=Array.from(pointers.values());
    var dd=Math.hypot(ps2[0].x-ps2[1].x,ps2[0].y-ps2[1].y);
    if(pinchD0>0&&dd>0) camGoal.r=clamp(camGoal.r*pinchD0/dd,4.5,60);
    pinchD0=dd;
    return;
  }
  if(mode==='rot'){
    camGoal.theta-=dx*0.0052;
    camGoal.phi=clamp(camGoal.phi-dy*0.0042,0.14,1.5);
  }else{
    var right=new T.Vector3().setFromMatrixColumn(camera.matrix,0);
    var upv=new T.Vector3().setFromMatrixColumn(camera.matrix,1);
    camGoal.tgt.addScaledVector(right,-dx*camGoal.r*0.0011);
    camGoal.tgt.addScaledVector(upv,dy*camGoal.r*0.0011);
    camGoal.tgt.x=clamp(camGoal.tgt.x,-30,30);
    camGoal.tgt.z=clamp(camGoal.tgt.z,-30,30);
    camGoal.tgt.y=clamp(camGoal.tgt.y,0.2,9);
  }
});
dom.addEventListener('pointerup',function(e){ pointers.delete(e.pointerId); if(pointers.size===0)mode=null; });
dom.addEventListener('pointercancel',function(e){ pointers.delete(e.pointerId); if(pointers.size===0)mode=null; });
dom.addEventListener('wheel',function(e){
  e.preventDefault();
  camGoal.r=clamp(camGoal.r*Math.exp(e.deltaY*0.0011),4.5,60);
  lastUser=performance.now();
},{passive:false});

/* 补间动画管理 */
var tweens=[];
function tween(dur,upd,done){ tweens.push({t0:performance.now(),dur:dur,upd:upd,done:done}); }
function stepTweens(now){
  for(var i=tweens.length-1;i>=0;i--){
    var tw=tweens[i], k=clamp((now-tw.t0)/tw.dur,0,1);
    tw.upd(easeIO(k));
    if(k>=1){ tweens.splice(i,1); if(tw.done)tw.done(); }
  }
}
function tweenCamera(tgt,r){
  var t0=camGoal.tgt.clone(), r0=camGoal.r;
  tween(900,function(k){ camGoal.tgt.lerpVectors(t0,tgt,k); camGoal.r=lerp(r0,r,k); });
}

/* ============================================================
 * 八、交互：朝代聚焦 / 幽灵化 / 分层解构 / 构件拾取
 * ============================================================ */
var focusIdx=-1, explodeT=0, GAP=0.42;
var labelsOn=true, chainOn=true, autoRot=true;

function applyExplode(){
  pavilions.forEach(function(pv){
    for(var i=0;i<pv.layers.length;i++)
      pv.layers[i].position.y=explodeT*i*GAP;
    pv.chain.visible=chainOn&&explodeT<0.02&&!pv.ghosted;
  });
}
function setGhost(pv,on){
  if(pv.ghosted===on) return;
  pv.ghosted=on;
  pv.matsList.forEach(function(m){
    m.transparent=on; m.opacity=on?0.085:1; m.depthWrite=!on; m.needsUpdate=true;
  });
  pv.meshes.forEach(function(m){ m.castShadow=!on; });
  pv.labelSprites.forEach(function(s){ s.material.opacity=on?0.12:(labelsOn?1:0); });
  pv.titleSprite.material.opacity=on?0.15:1;
  pv.chain.visible=chainOn&&!on&&explodeT<0.02;
}
function focusEra(i){
  focusIdx=i;
  var btns=document.querySelectorAll('.ebtn');
  btns.forEach(function(b,bi){ b.classList.toggle('on',bi===(i<0?4:i)); });
  pavilions.forEach(function(pv,pi){ setGhost(pv,i>=0&&pi!==i); });
  if(i>=0){ tweenCamera(new T.Vector3(PAV_X[i],2.3,0),8.8); showSpec(i); }
  else    { tweenCamera(new T.Vector3(0,2.1,0),26);        showSpec(-1); }
}

/* ---- 制度规格面板 ---- */
var specTitle=document.getElementById('specTitle'),
    specSub=document.getElementById('specSub'),
    specBody=document.getElementById('specBody');
function row(label,val,delta){
  var d='';
  if(delta!==undefined&&delta!==null){
    var cls=delta>0.05?'up':(delta<-0.05?'dn':'eq');
    var arrow=delta>0.05?'▲':(delta<-0.05?'▼':'◆');
    d='<span class="delta '+cls+'">'+arrow+' 较前代 '+(delta>0?'+':'')+fmt(delta,0)+'%</span>';
  }
  return '<tr><td>'+label+'</td><td>'+val+d+'</td></tr>';
}
function pct(cur,prev){ return prev?((cur-prev)/prev*100):null; }
function jumpName(E){ return E.jumps===3?'三跳（七铺作）':E.jumps===2?'双跳（五铺作）':'单翘'; }
function showSpec(i){
  compCard.style.display='none';
  if(i<0){
    specTitle.textContent='营造制度 · 总览';
    specSub.textContent='同堂四式，横向比对木作之变';
    var html='<table class="spec">';
    html+='<tr><td>同场对比</td><td>唐→宋→明→清 四亭并列（自左向右），地面箭头标注各阶段演变要点</td></tr>';
    html+=row('模数走向','材分 → 斗口；用材逐代递减约 '+fmt(-pct(ERAS[3].u,ERAS[0].u),0)+'%');
    html+=row('斗栱','出跳 '+ERAS[0].jumps+' → '+ERAS[3].jumps+' 跳；下昂由雄健而装饰、终至废除');
    html+=row('屋面','举高 '+(ERAS[0].rise*100)+'% → '+(ERAS[3].rise*100)+'%；曲线由「举折」和缓转「举架」陡峻');
    html+=row('操作','点击左侧朝代聚焦比对 · 悬停/点击构件查看营造细节 · 拖动「分层解构」拆解层间');
    html+='</table>';
    specBody.innerHTML=html;
    return;
  }
  var E=ERAS[i], L=computeLayout(E);
  var dgH=(L.lb-L.D0)+L.sw;
  var dgRatio=dgH/E.colH*100;
  var slend=E.colH/(E.colR*2);
  var prev=i>0?ERAS[i-1]:null, Lp=prev?computeLayout(prev):null;
  var html='<table class="spec">';
  html+='<tr><td>用材权衡</td><td>'+E.caiNote+'</td></tr>';
  html+=row('铺作出跳',jumpName(E)+' · 出 '+E.jumps+' 跳'+(E.ang?' · 带下昂':' · 耍头平出（无昂）'),
    prev?pct(E.jumps,prev.jumps):null);
  html+=row('斗栱高∶柱高',fmt(dgRatio,0)+'%',prev?(dgRatio-((computeLayout(prev).lb-prev.D0)+prev.sw)/prev.colH*100):null);
  html+=row('举高比率',(E.rise*100)+'%（'+(E.key==='tang'||E.key==='song'?'举折':'举架')+'）',prev?pct(E.rise,prev.rise):null);
  var curExt=L.rLy-E.HS, prevExt=Lp?(Lp.rLy-prev.HS):null;
  html+=row('出檐距离',fmt(curExt,2)+' 米（含斗栱出跳 '+fmt(L.reach,2)+'）',prev?pct(curExt,prevExt):null);
  html+=row('柱长细比','径∶高 ＝ 1∶'+fmt(slend,1),prev?pct(slend,prev.colH/(prev.colR*2)):null);
  html+=row('侧脚',fmt(E.ceJiao*1000,0)+'‰',prev?pct(E.ceJiao,prev.ceJiao):null);
  html+='<tr><td>柱头联络</td><td>'+(E.puPai?'普拍方':'无普拍方（阑额'+(E.eTouChu?'出头截切':'')+'）')+
    (E.shuangFang?' ＋ 小额枋／由额垫板':'')+'</td></tr>';
  html+='<tr><td>补间装配</td><td>'+(E.pingKe===0?'人字栱（唐制）':(E.pingKe+' 攒平身科'))+'</td></tr>';
  html+='<tr><td>形制特征</td><td style="line-height:1.7">'+E.feat+'</td></tr>';
  html+='</table>';
  specBody.innerHTML=html;
}

/* ---- 悬浮拾取 ---- */
var raycaster=new T.Raycaster();
var mouseNX=0,mouseNY=0,mousePX=0,mousePY=0,mouseMoved=false;
var hovered=null;
var tip=document.getElementById('tip'), compCard=document.getElementById('compCard');

function pickables(){
  if(focusIdx>=0) return pavilions[focusIdx].meshes;
  var all=[];
  pavilions.forEach(function(pv){ if(!pv.ghosted) all=all.concat(pv.meshes); });
  return all;
}
function setHover(mesh,on){
  if(on){
    if(!mesh.userData._orig) mesh.userData._orig=mesh.material;
    var c=mesh.userData._orig.clone();
    if(c.emissive)c.emissive=new T.Color(0x4a3208);
    mesh.material=c;
  }else if(mesh.userData._orig){
    if(mesh.material&&mesh.material.dispose)mesh.material.dispose();
    mesh.material=mesh.userData._orig;
    mesh.userData._orig=null;
  }
}
function updatePick(){
  if(!mouseMoved)return;
  mouseMoved=false;
  raycaster.setFromCamera({x:mouseNX,y:mouseNY},camera);
  var hits=raycaster.intersectObjects(pickables(),false);
  var hit=hits.length?hits[0].object:null;
  if(hit!==hovered){
    if(hovered)setHover(hovered,false);
    hovered=hit;
    if(hit){
      setHover(hit,true);
      var ud=hit.userData;
      tip.innerHTML='<b>'+ud.n+'</b><i>'+ud.g+'</i>'+
        (ud.r?('<span style="display:block;margin-top:3px">'+ud.r+'</span>'):'');
      tip.style.display='block';
    }else{
      tip.style.display='none';
    }
  }
  if(hovered){
    tip.style.left=clamp(mousePX+16,4,window.innerWidth-270)+'px';
    tip.style.top=clamp(mousePY+18,4,window.innerHeight-120)+'px';
  }
}
dom.addEventListener('click',function(){
  if(!hovered)return;
  var ud=hovered.userData;
  compCard.style.display='block';
  compCard.innerHTML='<h3>'+ud.n+'</h3>'+
    '<span class="tag">'+ud.g+'</span><span class="tag">'+(focusIdx>=0?ERAS[focusIdx].name+' · '+ERAS[focusIdx].years:'全景对照')+'</span>'+
    '<p>'+ud.r+'</p>';
});

/* ============================================================
 * 九、UI 装配
 * ============================================================ */
(function(){
  var wrap=document.getElementById('eraBtns');
  ERAS.forEach(function(E,i){
    var b=document.createElement('button');
    b.className='ebtn';
    b.innerHTML=E.name+'<small>'+E.years+' · '+E.motto+'</small>';
    b.onclick=function(){ focusEra(i); };
    wrap.appendChild(b);
  });
  var all=document.createElement('button');
  all.className='ebtn';
  all.innerHTML='全景对照<small>四朝同堂 · 演变通览</small>';
  all.onclick=function(){ focusEra(-1); };
  wrap.appendChild(all);
})();
document.querySelectorAll('.ebtn')[4].classList.add('on');

(function(){
  var colors={col:'#8f4a30',wood:'#a9744a',dg:'#cf9a5c',stone:'#a9aeae',tile:'#4a5560',gold:'#d9a93f'};
  var items=[['col','檐柱'],['wood','大木枋梁'],['dg','斗栱铺作'],['stone','石作'],['tile','瓦作'],['gold','宝顶']];
  var html='<div class="grp"><span>构 件 图 例</span><div style="display:flex;gap:10px;flex-wrap:wrap">';
  items.forEach(function(it){
    html+='<span class="lg"><i style="background:'+colors[it[0]]+'"></i>'+it[1]+'</span>';
  });
  html+='</div></div>';
  html+='<div class="grp"><span>快 捷 键</span><div style="font-size:11px;opacity:.8">1-4 聚焦朝代 · 0 全景 · E 解构开关</div></div>';
  document.getElementById('dock').innerHTML=html;
})();

document.getElementById('tgLabel').addEventListener('change',function(){
  labelsOn=this.checked;
  pavilions.forEach(function(pv){
    pv.labelSprites.forEach(function(s){
      s.visible=labelsOn;
      if(labelsOn)s.material.opacity=pv.ghosted?0.12:1;
    });
  });
});
document.getElementById('tgChain').addEventListener('change',function(){ chainOn=this.checked; applyExplode(); });
document.getElementById('tgRotate').addEventListener('change',function(){ autoRot=this.checked; });
document.getElementById('tgShadow').addEventListener('change',function(){
  renderer.shadowMap.enabled=this.checked;
  scene.traverse(function(o){ if(o.material)o.material.needsUpdate=true; });
});
var explodeEl=document.getElementById('explode'), explodeVal=document.getElementById('explodeVal');
explodeEl.addEventListener('input',function(){
  explodeT=this.value/100;
  explodeVal.textContent=this.value+'%';
  applyExplode();
});
window.addEventListener('keydown',function(e){
  if(e.key>='1'&&e.key<='4') focusEra(parseInt(e.key,10)-1);
  else if(e.key==='0') focusEra(-1);
  else if(e.key==='e'||e.key==='E'){
    explodeT=explodeT>0.02?0:0.999;
    explodeEl.value=Math.round(explodeT*100);
    explodeVal.textContent=explodeEl.value+'%';
    applyExplode();
  }
});
window.addEventListener('resize',function(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
showSpec(-1);
applyExplode();

/* ============================================================
 * 十、主循环
 * ============================================================ */
var clock=new T.Clock();
var frames=0,fpsT=performance.now(),fps=60,statT=0;
var statsEl=document.getElementById('stats');
var overlay=document.getElementById('ov');
var TOTAL_MESHES=0;
pavilions.forEach(function(pv){ TOTAL_MESHES+=pv.meshes.length; });

function animate(){
  requestAnimationFrame(animate);
  var dt=Math.min(clock.getDelta(),0.05);
  var now=performance.now();
  stepTweens(now);

  if(autoRot&&now-lastUser>4500&&tweens.length===0) camGoal.theta+=dt*0.055;

  var kk=1-Math.exp(-dt*9);
  cam.theta+=(camGoal.theta-cam.theta)*kk;
  cam.phi+=(camGoal.phi-cam.phi)*kk;
  cam.r+=(camGoal.r-cam.r)*kk;
  cam.tgt.lerp(camGoal.tgt,kk);
  camera.position.set(
    cam.tgt.x+cam.r*Math.sin(cam.phi)*Math.sin(cam.theta),
    cam.tgt.y+cam.r*Math.cos(cam.phi),
    cam.tgt.z+cam.r*Math.sin(cam.phi)*Math.cos(cam.theta));
  camera.lookAt(cam.tgt);

  /* 受力链脉冲：荷载自宝顶向下流动 */
  var t=clock.elapsedTime;
  pavilions.forEach(function(pv){
    if(!pv.chain.visible)return;
    var dots=pv.chain.userData.dots, speed=0.16;
    for(var i=0;i<dots.length;i++){
      var pts=pv.chain.userData['branch'+(i%4)];
      var off=(((i>>2)/4)+t*speed)%1;
      var segs=pts.length-1;
      var f=off*segs, si=Math.min(Math.floor(f),segs-1), fr=f-si;
      dots[i].position.set(
        lerp(pts[si][0],pts[si+1][0],fr),
        lerp(pts[si][1],pts[si+1][1],fr),
        lerp(pts[si][2],pts[si+1][2],fr));
    }
  });

  updatePick();
  renderer.render(scene,camera);

  frames++;
  if(now-fpsT>500){ fps=Math.round(frames*1000/(now-fpsT)); frames=0; fpsT=now; }
  statT+=dt;
  if(statT>0.5){
    statT=0;
    var info=renderer.info.render;
    statsEl.innerHTML='构件 '+TOTAL_MESHES+' 件 · 三角面 '+info.triangles.toLocaleString()+
      ' · 绘制 '+info.calls+' 次 · '+fps+' FPS';
  }
}

overlay.style.opacity='0';
setTimeout(function(){ if(overlay.parentNode)overlay.parentNode.removeChild(overlay); },750);
animate();

}catch(err){
  fatal('初始化异常：'+err.message);
  if(window.console&&console.error)console.error(err);
}
}
/*JS>>*/
})();
