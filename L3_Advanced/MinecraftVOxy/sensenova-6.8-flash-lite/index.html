<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VOXY CRAFT</title>
<style>
  :root{
    --bg:#0d0f12; --panel:#15191f; --panel2:#1b2028; --line:#2a313a; --fg:#c8d0da;
    --dim:#6b7684; --accent:#4fa3e0; --good:#5fb878; --warn:#d8a13a; --bad:#d85a4a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;color:var(--fg)}
  #app{position:fixed;inset:0}
  canvas{display:block}

  /* ---- 面板基类 ---- */
  .panel{background:rgba(13,15,18,.88);border:1px solid var(--line)}

  /* ---- HUD ---- */
  #hud{position:fixed;top:8px;left:8px;z-index:10;pointer-events:none;
    padding:8px 10px;font-size:12px;line-height:1.55;min-width:200px}
  #hud .row{display:flex;justify-content:space-between;gap:14px}
  #hud .k{color:var(--dim)} #hud .v{color:var(--fg)} #hud .fps{color:var(--good)}
  #hud .title{color:var(--accent);letter-spacing:1px;margin-bottom:4px;
    border-bottom:1px solid var(--line);padding-bottom:3px}

  /* ---- 准星 ---- */
  #cross{position:fixed;left:50%;top:50%;width:18px;height:18px;z-index:9;
    transform:translate(-50%,-50%);pointer-events:none;opacity:.75}
  #cross:before,#cross:after{content:"";position:absolute;background:var(--fg)}
  #cross:before{left:50%;top:0;width:1px;height:100%;transform:translateX(-.5px)}
  #cross:after{top:50%;left:0;height:1px;width:100%;transform:translateY(-.5px)}

  /* ---- 快捷栏 ---- */
  #hotbar{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:10;
    display:flex;gap:3px;pointer-events:none}
  #hotbar .slot{width:44px;height:44px;border:1px solid var(--line);background:rgba(13,15,18,.8);
    display:flex;align-items:center;justify-content:center;position:relative}
  #hotbar .slot.sel{border-color:var(--accent);background:rgba(30,42,56,.9)}
  #hotbar .slot img{width:34px;height:34px;image-rendering:pixelated}
  #hotbar .slot .num{position:absolute;top:1px;left:3px;font-size:9px;color:var(--dim)}

  /* ---- 模态（物品栏 / 设置）---- */
  .modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
    background:rgba(5,7,10,.55)}
  .modal.open{display:flex}
  .modal .box{width:min(760px,92vw);max-height:84vh;display:flex;flex-direction:column;padding:14px}
  .modal h2{font-size:14px;letter-spacing:2px;color:var(--accent);
    border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px;font-weight:600}
  .tabs{display:flex;gap:2px;margin-bottom:10px;flex-wrap:wrap}
  .tabs button{background:var(--panel2);border:1px solid var(--line);color:var(--dim);
    font:inherit;font-size:12px;padding:5px 12px;cursor:pointer}
  .tabs button.on{color:var(--accent);border-color:var(--accent)}
  .modal input[type=text]{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    font:inherit;font-size:12px;padding:6px 8px;width:220px;margin-bottom:10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,52px);gap:4px;overflow-y:auto;
    padding:4px;flex:1;align-content:flex-start}
  .cell{width:52px;height:52px;border:1px solid var(--line);background:var(--panel2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
  .cell:hover{border-color:var(--accent)}
  .cell img{width:40px;height:40px;image-rendering:pixelated}
  .cell .nm{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
    background:var(--bg);border:1px solid var(--line);color:var(--fg);font-size:11px;
    padding:2px 6px;white-space:nowrap;z-index:5}
  .cell:hover .nm{display:block}
  .hint{color:var(--dim);font-size:11px;margin-top:8px}

  /* ---- 设置 ---- */
  .setrow{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:12px}
  .setrow label{width:110px;color:var(--dim)}
  .setrow input[type=range]{flex:1;accent-color:var(--accent)}
  .setrow .val{width:64px;text-align:right;color:var(--fg)}
  .setrow input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}

  /* ---- F3 调试 ---- */
  #debug{position:fixed;top:8px;right:8px;z-index:10;pointer-events:none;padding:8px 10px;
    font-size:11px;line-height:1.5;min-width:210px;display:none}
  #debug.open{display:block}
  #debug .row{display:flex;justify-content:space-between;gap:12px}
  #debug .k{color:var(--dim)} #debug .v{color:var(--fg)}
  #debug .title{color:var(--warn);letter-spacing:1px;margin-bottom:4px;
    border-bottom:1px solid var(--line);padding-bottom:3px}

  /* ---- 启动 ---- */
  #boot{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;gap:8px;
    align-items:center;justify-content:center;background:var(--bg);color:var(--dim);
    font-size:13px;letter-spacing:1px}
  #boot.hide{display:none}
  #boot .big{color:var(--accent);font-size:18px;letter-spacing:4px}
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
</head>
<body>
  <div id="app"></div>

  <div id="hud" class="panel">
    <div class="title">VOXY CRAFT</div>
    <div class="row"><span class="k">FPS</span><span class="v fps" id="h-fps">--</span></div>
    <div class="row"><span class="k">FRAME</span><span class="v" id="h-frame">--</span></div>
    <div class="row"><span class="k">DRAW</span><span class="v" id="h-draw">--</span></div>
    <div class="row"><span class="k">TRI</span><span class="v" id="h-tri">--</span></div>
    <div class="row"><span class="k">POS</span><span class="v" id="h-pos">--</span></div>
    <div class="row"><span class="k">群系</span><span class="v" id="h-biome">--</span></div>
    <div class="row"><span class="k">区块</span><span class="v" id="h-chunks">--</span></div>
  </div>

  <div id="debug" class="panel">
    <div class="title">DEBUG // F3</div>
    <div class="row"><span class="k">已加载区块</span><span class="v" id="d-loaded">--</span></div>
    <div class="row"><span class="k">待处理任务</span><span class="v" id="d-pending">--</span></div>
    <div class="row"><span class="k">LOD 级</span><span class="v" id="d-lod">--</span></div>
    <div class="row"><span class="k">提交/安装</span><span class="v" id="d-sub">--</span></div>
    <div class="row"><span class="k">长帧(&gt;16ms)</span><span class="v" id="d-long">--</span></div>
    <div class="row"><span class="k">视距</span><span class="v" id="d-view">--</span></div>
    <div class="row"><span class="k">时刻</span><span class="v" id="d-time">--</span></div>
  </div>

  <div id="cross"></div>
  <div id="hotbar"></div>

  <!-- 创造物品栏 -->
  <div id="inventory" class="modal">
    <div class="box panel">
      <h2>创造模式物品栏</h2>
      <input type="text" id="inv-search" placeholder="搜索物品…" />
      <div class="tabs" id="inv-tabs"></div>
      <div class="grid" id="inv-grid"></div>
      <div class="hint">点击物品放入当前快捷栏格 · 1-9 / 滚轮切换 · E 关闭</div>
    </div>
  </div>

  <!-- 设置 -->
  <div id="settings" class="modal">
    <div class="box panel" style="width:min(520px,92vw)">
      <h2>设置</h2>
      <div class="setrow"><label>视距 (格)</label><input type="range" id="s-view" min="256" max="8192" step="128" value="1024"><span class="val" id="s-view-v">1024</span></div>
      <div class="setrow"><label>FOV</label><input type="range" id="s-fov" min="60" max="110" step="1" value="72"><span class="val" id="s-fov-v">72</span></div>
      <div class="setrow"><label>鼠标灵敏度</label><input type="range" id="s-sens" min="5" max="40" step="1" value="22"><span class="val" id="s-sens-v">2.2</span></div>
      <div class="setrow"><label>时刻</label><input type="range" id="s-time" min="0" max="100" step="1" value="32"><span class="val" id="s-time-v">0.32</span></div>
      <div class="setrow"><label>自动昼夜</label><input type="checkbox" id="s-dayauto"><span class="val"></span></div>
      <div class="hint">Esc 关闭 · 改动即时生效</div>
    </div>
  </div>

  <div id="boot"><div class="big">VOXY CRAFT</div><div id="boot-msg">正在生成世界…</div></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
