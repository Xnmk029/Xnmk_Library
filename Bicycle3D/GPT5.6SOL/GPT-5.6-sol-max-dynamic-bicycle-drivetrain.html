<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#05080a">
  <title>VeloLab — Dynamic Drivetrain</title>
  <style>
    :root{color-scheme:dark;--ink:#eaffff;--muted:#78949b;--cyan:#55f6ff;--line:rgba(147,234,241,.2);--panel:rgba(6,13,16,.79)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#05080a;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}canvas{display:block}
    body:before{content:"";position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(circle at 50% 42%,transparent 30%,rgba(0,0,0,.42) 92%),linear-gradient(rgba(255,255,255,.016) 1px,transparent 1px);background-size:auto,100% 4px;mix-blend-mode:soft-light}
    #stage{position:fixed;inset:0;touch-action:none}
    .brand{position:fixed;z-index:5;top:30px;left:34px;display:flex;align-items:center;gap:13px;pointer-events:none}.mark{width:32px;height:32px;border:1px solid rgba(85,246,255,.55);border-radius:50%;position:relative;box-shadow:0 0 24px rgba(85,246,255,.18),inset 0 0 14px rgba(85,246,255,.08)}.mark:before,.mark:after{content:"";position:absolute;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}.mark:before{width:15px;height:1px;left:8px;top:15px}.mark:after{width:1px;height:15px;left:15px;top:8px}.eyebrow{margin:0 0 3px;font:700 10px/1.2 ui-monospace,monospace;letter-spacing:.23em;color:var(--cyan)}.brand h1{margin:0;font-size:16px;font-weight:620;letter-spacing:.035em}
    .hud{position:fixed;z-index:6;top:26px;right:28px;width:min(318px,calc(100vw - 32px));padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:0 18px 60px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.04);backdrop-filter:blur(18px) saturate(1.3)}.hud-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.hud-label{font:700 10px/1 ui-monospace,monospace;color:var(--muted);letter-spacing:.18em;text-transform:uppercase}.status{display:inline-flex;gap:7px;align-items:center;font:700 10px/1 ui-monospace,monospace;letter-spacing:.1em;color:#92f7d2}.status-dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor;animation:pulse 1.7s ease-in-out infinite}.paused .status{color:#ffb178}.paused .status-dot{animation:none}@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}
    .readout{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;padding:15px 0 17px;border-top:1px solid rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.06)}.gear-title{margin:0;font-size:12px;font-weight:600;color:var(--muted)}#gear{margin-top:3px;font:500 34px/1 ui-monospace,monospace;letter-spacing:-.06em}#ratio{padding-bottom:3px;font:650 12px/1 ui-monospace,monospace;color:var(--cyan)}.track{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:13px 0 16px}.seg{height:3px;border-radius:3px;background:rgba(130,175,180,.16);transition:.25s}.seg.active{background:var(--cyan);box-shadow:0 0 10px rgba(85,246,255,.7)}
    .buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{appearance:none;border:1px solid rgba(139,217,224,.2);border-radius:10px;background:rgba(255,255,255,.045);color:var(--ink);min-height:42px;padding:0 14px;font:650 11px/1 ui-monospace,monospace;letter-spacing:.06em;cursor:pointer;transition:.16s}button:hover{border-color:rgba(85,246,255,.55);background:rgba(85,246,255,.1);box-shadow:0 0 22px rgba(85,246,255,.08)}button:active{transform:translateY(1px) scale(.985)}button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button:disabled{opacity:.35;cursor:not-allowed}#motor{grid-column:1/-1;border-color:rgba(85,246,255,.38);background:rgba(85,246,255,.09);color:#caffff}.hint{position:fixed;z-index:5;left:34px;bottom:28px;display:flex;align-items:center;gap:10px;color:#6d898f;font:650 10px/1.4 ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;pointer-events:none}.hint i{width:26px;height:1px;background:rgba(85,246,255,.55);box-shadow:0 0 8px rgba(85,246,255,.4)}.loading{position:fixed;z-index:10;inset:0;display:grid;place-items:center;background:#05080a;transition:opacity .8s,visibility .8s}.loading.done{opacity:0;visibility:hidden}.loading span{font:700 11px/1 ui-monospace,monospace;color:var(--cyan);letter-spacing:.25em;animation:pulse 1.2s infinite}
    @media(max-width:700px){.brand{top:18px;left:18px}.brand h1{font-size:14px}.hud{top:auto;right:16px;left:16px;bottom:16px;width:auto;padding:15px}.hud-head{margin-bottom:10px}.readout{padding:10px 0 11px}#gear{font-size:26px}.track{margin:10px 0 12px}.hint{display:none}button{min-height:40px}}
  </style>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.164.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.164.1/examples/jsm/"}}</script>
</head>
<body>
  <div id="stage" aria-label="Interactive 3D bicycle drivetrain demonstration"></div>
  <header class="brand"><div class="mark" aria-hidden="true"></div><div><p class="eyebrow">VELOLAB / 07</p><h1>Dynamic Drivetrain</h1></div></header>
  <aside class="hud" aria-label="Drivetrain controls">
    <div class="hud-head"><span class="hud-label">Drive control</span><span class="status"><i class="status-dot"></i><span id="statusText">Motor live</span></span></div>
    <div class="readout" aria-live="polite"><div><p class="gear-title">Current transmission</p><div id="gear">Gear 3 / 7</div></div><div id="ratio">1.42×</div></div>
    <div class="track" aria-hidden="true"><i class="seg"></i><i class="seg"></i><i class="seg"></i><i class="seg"></i><i class="seg"></i><i class="seg"></i><i class="seg"></i></div>
    <div class="buttons"><button id="motor" type="button" aria-pressed="true">Pause motor</button><button id="down" type="button">− Shift down</button><button id="up" type="button">Shift up +</button></div>
  </aside>
  <div class="hint"><i></i>Drag to orbit · Scroll to zoom · Right-drag to pan</div>
  <div class="loading"><span>INITIALIZING DRIVE</span></div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene=new THREE.Scene();scene.background=new THREE.Color(0x05080a);scene.fog=new THREE.FogExp2(0x05080a,.032);
    const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);camera.position.set(8.8,4.7,11.8);
    const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.querySelector("#stage").appendChild(renderer.domElement);
    const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.055;controls.target.set(0,-.15,0);controls.minDistance=7;controls.maxDistance=24;controls.maxPolarAngle=Math.PI*.83;
    const world=new THREE.Group();world.rotation.y=-.08;scene.add(world);

    const dark=new THREE.MeshStandardMaterial({color:0x151a1c,roughness:.72,metalness:.68,flatShading:true}),black=new THREE.MeshStandardMaterial({color:0x080b0c,roughness:.62,metalness:.78,flatShading:true}),silver=new THREE.MeshStandardMaterial({color:0xc9d2d2,roughness:.26,metalness:.96,flatShading:true}),chrome=new THREE.MeshStandardMaterial({color:0xe8ffff,roughness:.17,metalness:1,flatShading:true}),rubber=new THREE.MeshStandardMaterial({color:0x111314,roughness:.96,metalness:.03,flatShading:true}),accent=new THREE.MeshStandardMaterial({color:0x0a626d,emissive:0x21e8f2,emissiveIntensity:2.3,roughness:.38,metalness:.35}),hot=new THREE.MeshStandardMaterial({color:0xa82d17,emissive:0xff4a26,emissiveIntensity:1.8,roughness:.45,metalness:.2}),glass=new THREE.MeshPhysicalMaterial({color:0x37dce7,transparent:true,opacity:.18,roughness:.12,metalness:.05,transmission:.72,thickness:.7,ior:1.32,clearcoat:1,clearcoatRoughness:.08,side:THREE.DoubleSide}),chainMat=new THREE.MeshStandardMaterial({color:0xc9d6d6,metalness:.98,roughness:.22,flatShading:true});
    const shadow=(m,c=true,r=true)=>{m.castShadow=c;m.receiveShadow=r;return m};
    function box(w,h,d,mat,x,y,z,rx=0,ry=0,rz=0){const m=shadow(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat));m.position.set(x,y,z);m.rotation.set(rx,ry,rz);return m}
    function cyl(rad,len,mat,x,y,z,segments=12){const m=shadow(new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,len,segments),mat));m.rotation.x=Math.PI/2;m.position.set(x,y,z);return m}
    function cogGeo(teeth,outer,root,depth){const s=new THREE.Shape();for(let i=0;i<teeth*2;i++){const a=i/(teeth*2)*Math.PI*2,r=i%2?root:outer;i?s.lineTo(Math.cos(a)*r,Math.sin(a)*r):s.moveTo(Math.cos(a)*r,Math.sin(a)*r)}s.closePath();const hole=new THREE.Path();hole.absarc(0,0,Math.max(.12,root*.28),0,Math.PI*2);s.holes.push(hole);const g=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:false,curveSegments:1});g.translate(0,0,-depth/2);g.computeVertexNormals();return g}
    const cog=(t,o,r,d,m)=>shadow(new THREE.Mesh(cogGeo(t,o,r,d),m));

    const floor=new THREE.Mesh(new THREE.PlaneGeometry(42,32),new THREE.MeshStandardMaterial({color:0x060a0c,roughness:.86,metalness:.18}));floor.rotation.x=-Math.PI/2;floor.position.y=-2.55;floor.receiveShadow=true;scene.add(floor);
    const grid=new THREE.GridHelper(38,38,0x2bbbc2,0x12434a);grid.position.y=-2.535;grid.material.transparent=true;grid.material.opacity=.28;grid.material.blending=THREE.AdditiveBlending;scene.add(grid);
    const plinth=new THREE.Group();plinth.add(box(9.8,.22,3.25,dark,0,-2.36,0),box(9.25,.025,2.72,black,0,-2.23,0),box(5.4,.035,.07,accent,-1.3,-2.22,1.36),box(1.3,.035,.07,hot,3,-2.22,1.36));world.add(plinth);
    const stand=new THREE.Group();stand.add(box(.32,3.35,.75,glass,-3,-.62,-.72,0,0,-.11),box(.32,3.25,.75,glass,3,-.62,-.72,0,0,.1),box(6.15,.25,.75,glass,0,-2,-.72),box(5.9,.16,.42,glass,0,-1.08,-.74,0,0,-.02),cyl(.28,1.25,glass,-3,.35,-.25,16),cyl(.24,1.35,glass,3,.35,-.25,16),box(.09,2.55,.12,accent,-3.17,-.75,-1.14,0,0,-.11),box(.09,2.45,.12,accent,3.17,-.75,-1.14,0,0,.1));world.add(stand);

    const front=new THREE.Vector3(-3,.35,.18),rear=new THREE.Vector3(3,.35,0),drive=new THREE.Group();world.add(drive);
    const ringGroup=new THREE.Group();ringGroup.position.copy(front);ringGroup.add(cog(34,1.28,1.12,.13,silver),cyl(.36,.34,dark,0,0,0,14));
    for(let i=0;i<5;i++){const a=i/5*Math.PI*2;ringGroup.add(box(.17,.87,.11,dark,Math.cos(a)*.47,Math.sin(a)*.47,.1,0,0,a-Math.PI/2))}
    const crankA=box(.2,1.7,.2,black,0,.83,.23,0,0,-.12);crankA.geometry.translate(0,.78,0);ringGroup.add(crankA,box(.72,.16,.34,rubber,.19,2.35,.23,0,0,-.12),cyl(.07,.52,silver,.1,2.28,.23,10));const crankB=box(.18,1.62,.18,dark,0,-.79,-.18,0,0,-.12);crankB.geometry.translate(0,-.76,0);ringGroup.add(crankB,box(.68,.15,.31,rubber,-.18,-2.27,-.18,0,0,-.12));drive.add(ringGroup);

    const teeth=[30,27,24,21,18,15,13],radii=[.93,.84,.76,.68,.59,.51,.45],zs=[-.48,-.32,-.16,0,.16,.32,.48];
    const cassette=new THREE.Group();cassette.position.copy(rear);cassette.add(cyl(.31,1.45,dark,0,0,0,16),cyl(.16,1.82,chrome,0,0,0,12));radii.forEach((r,i)=>{const c=cog(teeth[i],r,r*.87,.075,i===2?chrome:silver);c.position.z=zs[i];cassette.add(c,cyl(Math.max(.2,r*.31),.08,dark,0,0,zs[i]+.055,12))});drive.add(cassette,cyl(.27,.22,black,3,.35,-.87,12),cyl(.27,.22,black,3,.35,.87,12));

    const derailleur=new THREE.Group(),mount=new THREE.Group();mount.position.set(3.25,-.22,0);mount.add(cyl(.19,.22,dark,0,0,0,12),box(.2,.78,.19,dark,.17,-.32,0,0,0,-.48),cyl(.14,.25,hot,.34,-.65,0,10));derailleur.add(mount);const cage=new THREE.Group();cage.position.set(3.63,-.95,zs[2]);const upper=new THREE.Group(),lower=new THREE.Group();lower.position.set(-.26,-1.08,0);upper.add(cog(12,.34,.28,.11,silver),cyl(.11,.22,black,0,0,0,10));lower.add(cog(12,.36,.29,.11,silver),cyl(.11,.22,black,0,0,0,10));cage.add(upper,lower,box(.14,1.15,.12,dark,-.27,-.52,-.1,0,0,-.24),box(.14,1.15,.12,dark,.02,-.52,.1,0,0,-.24));derailleur.add(cage);const spring=new THREE.Mesh(new THREE.TorusGeometry(.25,.035,5,18,Math.PI*1.5),hot);spring.position.set(3.38,-.87,0);spring.rotation.z=-.35;derailleur.add(spring);drive.add(derailleur);

    const chainGroup=new THREE.Group(),links=[],linkGeo=new THREE.BoxGeometry(.15,.055,.085);drive.add(chainGroup);for(let i=0;i<74;i++){const link=shadow(new THREE.Mesh(linkGeo,i%2?chrome:chainMat),true,false);links.push(link);chainGroup.add(link)}
    let chainTube,curve,gear=2,smoothZ=zs[2],phase=0,shiftPulse=0;
    function makeCurve(z){const rr=radii[gear]+.02;return new THREE.CatmullRomCurve3([new THREE.Vector3(-3.03,1.6,.18),new THREE.Vector3(-1.3,1.6,THREE.MathUtils.lerp(.18,z,.3)),new THREE.Vector3(2.88,.35+rr,z),new THREE.Vector3(3.48,.2,z),new THREE.Vector3(3.63,-.95,z),new THREE.Vector3(3.37,-2.03,z),new THREE.Vector3(2.82,-1.77,THREE.MathUtils.lerp(z,.18,.25)),new THREE.Vector3(-2.92,-.9,.18),new THREE.Vector3(-4.24,.35,.18)],true,"centripetal",.4)}
    function updateChain(){curve=makeCurve(smoothZ);const g=new THREE.TubeGeometry(curve,144,.026,5,true);if(chainTube){chainTube.geometry.dispose();chainTube.geometry=g}else{chainTube=shadow(new THREE.Mesh(g,chainMat),true,false);chainGroup.add(chainTube)}}
    function updateLinks(){const tng=new THREE.Vector3(),look=new THREE.Matrix4(),up=new THREE.Vector3(0,0,1);links.forEach((l,i)=>{const t=(i/links.length+phase)%1;curve.getPointAt(t,l.position);curve.getTangentAt(t,tng).normalize();look.lookAt(new THREE.Vector3(),tng,up);l.quaternion.setFromRotationMatrix(look);l.rotateY(Math.PI/2)})}updateChain();updateLinks();

    const markerMat=new THREE.MeshBasicMaterial({color:0x59eff7,transparent:true,opacity:.65});[[-3,.35,1.1],[3,.35,1.25],[3.5,-1.45,.8]].forEach(p=>{const m=new THREE.Mesh(new THREE.TorusGeometry(.11,.012,4,18),markerMat);m.position.set(...p);m.rotation.x=Math.PI/2;world.add(m)});
    scene.add(new THREE.HemisphereLight(0x8bd6dd,0x080a0b,1.2));const key=new THREE.SpotLight(0xe6fbff,115,32,Math.PI/6,.55,1.1);key.position.set(-3.5,9,7);key.target.position.set(0,0,0);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.bias=-.0002;scene.add(key,key.target);const rim=new THREE.PointLight(0x22eaf5,20,14,2);rim.position.set(4,1.6,-4);scene.add(rim);const warm=new THREE.PointLight(0xff5533,7,8,2);warm.position.set(-4,-1.2,2.5);scene.add(warm);

    const hud=document.querySelector(".hud"),gearEl=document.querySelector("#gear"),ratioEl=document.querySelector("#ratio"),statusText=document.querySelector("#statusText"),motorBtn=document.querySelector("#motor"),upBtn=document.querySelector("#up"),downBtn=document.querySelector("#down"),segs=[...document.querySelectorAll(".seg")];let motor=true;
    function updateHUD(){gearEl.textContent=`Gear ${gear+1} / 7`;ratioEl.textContent=`${(34/teeth[gear]).toFixed(2)}×`;segs.forEach((s,i)=>s.classList.toggle("active",i===gear));downBtn.disabled=gear===0;upBtn.disabled=gear===6}
    function shift(d){const n=THREE.MathUtils.clamp(gear+d,0,6);if(n===gear)return;gear=n;shiftPulse=1;updateHUD()}
    motorBtn.addEventListener("click",()=>{motor=!motor;hud.classList.toggle("paused",!motor);motorBtn.textContent=motor?"Pause motor":"Start motor";motorBtn.setAttribute("aria-pressed",String(motor));statusText.textContent=motor?"Motor live":"Motor paused"});upBtn.addEventListener("click",()=>shift(1));downBtn.addEventListener("click",()=>shift(-1));addEventListener("keydown",e=>{if(e.key==="ArrowUp"||e.key==="ArrowRight")shift(1);if(e.key==="ArrowDown"||e.key==="ArrowLeft")shift(-1);if(e.code==="Space"){e.preventDefault();motorBtn.click()}});updateHUD();

    const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04),old=smoothZ;smoothZ=THREE.MathUtils.damp(smoothZ,zs[gear],7.2,dt);cage.position.z=smoothZ;mount.children.forEach((p,i)=>{if(i)p.position.z=smoothZ*.22});if(Math.abs(smoothZ-old)>.00002)updateChain();if(motor){const speed=1.08;ringGroup.rotation.z-=speed*dt;const rearSpeed=speed*(34/teeth[gear]);cassette.rotation.z-=rearSpeed*dt;upper.rotation.z-=rearSpeed*1.5*dt;lower.rotation.z-=rearSpeed*1.65*dt;phase=(phase+dt*.092)%1}updateLinks();shiftPulse=Math.max(0,shiftPulse-dt*2.4);accent.emissiveIntensity=2.25+shiftPulse*1.8+Math.sin(performance.now()*.002)*.12;hot.emissiveIntensity=1.55+shiftPulse*2.3;controls.update();renderer.render(scene,camera)}
    addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});requestAnimationFrame(()=>{document.querySelector(".loading").classList.add("done");animate()});
  </script>
</body>
</html>
