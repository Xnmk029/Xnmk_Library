<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>Custom Bicycle Builder & Assembly Simulator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:#0a0a0f;color:#e0e0e0}
#canvas-container{width:100vw;height:100vh;position:fixed;top:0;left:0}
canvas{display:block}
#ui-panel{position:fixed;top:0;right:0;width:320px;height:100vh;background:rgba(10,10,20,0.92);backdrop-filter:blur(12px);border-left:1px solid rgba(100,140,255,0.2);overflow-y:auto;padding:16px;z-index:100;scrollbar-width:thin;scrollbar-color:#334 #111}
#ui-panel::-webkit-scrollbar{width:6px}
#ui-panel::-webkit-scrollbar-track{background:#111}
#ui-panel::-webkit-scrollbar-thumb{background:#446;border-radius:3px}
.panel-title{font-size:18px;font-weight:700;color:#7af;text-align:center;margin-bottom:12px;text-transform:uppercase;letter-spacing:2px;text-shadow:0 0 10px rgba(100,170,255,0.5)}
.section{margin-bottom:14px;padding:12px;background:rgba(30,35,60,0.6);border-radius:8px;border:1px solid rgba(80,120,255,0.15)}
.section h3{font-size:12px;color:#8bf;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid rgba(80,120,255,0.2)}
.ctrl-row{display:flex;align-items:center;margin-bottom:8px;gap:8px}
.ctrl-row label{font-size:11px;color:#aab;min-width:90px;flex-shrink:0}
.ctrl-row input[type=range]{flex:1;height:4px;-webkit-appearance:none;background:linear-gradient(90deg,#235,#48f);border-radius:2px;outline:none;cursor:pointer}
.ctrl-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#7af;box-shadow:0 0 6px rgba(100,170,255,0.6);cursor:pointer}
.ctrl-row .val{font-size:10px;color:#7af;min-width:36px;text-align:right;font-family:monospace}
.color-row{display:flex;align-items:center;margin-bottom:8px;gap:8px}
.color-row label{font-size:11px;color:#aab;min-width:70px}
.color-row input[type=color]{width:32px;height:24px;border:1px solid #446;border-radius:4px;background:none;cursor:pointer}
.color-row select{flex:1;background:#1a1a2e;color:#ccd;border:1px solid #335;border-radius:4px;padding:3px 6px;font-size:11px}
.btn{width:100%;padding:8px;margin-top:6px;background:linear-gradient(135deg,#234,#346);border:1px solid rgba(100,150,255,0.3);border-radius:6px;color:#9cf;font-size:12px;cursor:pointer;transition:all .2s}
.btn:hover{background:linear-gradient(135deg,#346,#458);border-color:rgba(100,170,255,0.6);box-shadow:0 0 12px rgba(80,140,255,0.3)}
#hud{position:fixed;top:16px;left:16px;background:rgba(10,12,25,0.88);backdrop-filter:blur(8px);border:1px solid rgba(80,130,255,0.25);border-radius:10px;padding:14px 18px;z-index:100;min-width:220px}
#hud h2{font-size:13px;color:#7af;margin-bottom:8px;letter-spacing:1px}
#hud .spec{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;padding:2px 0}
#hud .spec .k{color:#889}
#hud .spec .v{color:#adf;font-family:monospace;font-weight:600}
#mode-indicator{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(10,15,30,0.9);border:1px solid rgba(100,160,255,0.3);border-radius:20px;padding:8px 24px;font-size:12px;color:#8cf;z-index:100;letter-spacing:1px}
#loading{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a0f;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:16px}
#loading .spinner{width:50px;height:50px;border:3px solid #223;border-top-color:#7af;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{color:#7af;font-size:14px;letter-spacing:2px}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><p>INITIALIZING WORKSHOP...</p></div>
<div id="canvas-container"></div>
<div id="hud">
  <h2>⚙ BIKE SPECS</h2>
  <div class="spec"><span class="k">Total Weight</span><span class="v" id="sp-weight">--</span></div>
  <div class="spec"><span class="k">Wheelbase</span><span class="v" id="sp-wb">--</span></div>
  <div class="spec"><span class="k">Stack</span><span class="v" id="sp-stack">--</span></div>
  <div class="spec"><span class="k">Reach</span><span class="v" id="sp-reach">--</span></div>
  <div class="spec"><span class="k">HT Angle</span><span class="v" id="sp-hta">--</span></div>
  <div class="spec"><span class="k">ST Angle</span><span class="v" id="sp-sta">--</span></div>
  <div class="spec"><span class="k">Chainstay</span><span class="v" id="sp-cs">--</span></div>
  <div class="spec"><span class="k">Components</span><span class="v">24 / 24</span></div>
</div>
<div id="ui-panel">
  <div class="panel-title">🚲 Bike Builder</div>
  <div class="section"><h3>📐 Frame Geometry</h3>
    <div class="ctrl-row"><label>Stack</label><input type="range" id="geo-stack" min="520" max="620" value="570" step="5"><span class="val" id="v-stack">570</span></div>
    <div class="ctrl-row"><label>Reach</label><input type="range" id="geo-reach" min="350" max="420" value="385" step="5"><span class="val" id="v-reach">385</span></div>
    <div class="ctrl-row"><label>HT Angle</label><input type="range" id="geo-hta" min="70" max="75" value="72.5" step="0.5"><span class="val" id="v-hta">72.5</span></div>
    <div class="ctrl-row"><label>ST Angle</label><input type="range" id="geo-sta" min="72" max="76" value="73.5" step="0.5"><span class="val" id="v-sta">73.5</span></div>
    <div class="ctrl-row"><label>ST Length</label><input type="range" id="geo-stl" min="440" max="560" value="500" step="10"><span class="val" id="v-stl">500</span></div>
    <div class="ctrl-row"><label>Chainstay</label><input type="range" id="geo-cs" min="395" max="435" value="410" step="5"><span class="val" id="v-cs">410</span></div>
  </div>
  <div class="section"><h3>💥 Assembly Mode</h3>
    <div class="ctrl-row"><label>Explode</label><input type="range" id="explode" min="0" max="100" value="0" step="1"><span class="val" id="v-explode">0%</span></div>
    <button class="btn" id="btn-assemble">⚡ Toggle Assembly Animation</button>
  </div>
  <div class="section"><h3>🎨 Color & Finish</h3>
    <div class="color-row"><label>Frame</label><input type="color" id="col-frame" value="#1a5fb4"><select id="fin-frame"><option>Gloss</option><option>Matte</option><option>Metallic</option><option>Carbon</option></select></div>
    <div class="color-row"><label>Fork</label><input type="color" id="col-fork" value="#222222"><select id="fin-fork"><option>Matte</option><option>Gloss</option><option>Metallic</option><option>Carbon</option></select></div>
    <div class="color-row"><label>Wheels</label><input type="color" id="col-wheels" value="#333333"><select id="fin-wheels"><option>Metallic</option><option>Gloss</option><option>Matte</option></select></div>
    <div class="color-row"><label>Components</label><input type="color" id="col-comp" value="#444444"><select id="fin-comp"><option>Metallic</option><option>Gloss</option><option>Matte</option></select></div>
    <div class="color-row"><label>Accents</label><input type="color" id="col-accent" value="#ff4444"><select id="fin-accent"><option>Gloss</option><option>Metallic</option><option>Matte</option></select></div>
  </div>
  <div class="section"><h3>🔧 Options</h3>
    <button class="btn" id="btn-wireframe">Toggle Wireframe</button>
    <button class="btn" id="btn-rotate">Toggle Auto-Rotate</button>
    <button class="btn" id="btn-reset">Reset Camera</button>
  </div>
</div>
<div id="mode-indicator">ASSEMBLY MODE — Drag to Orbit | Scroll to Zoom</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// === GLOBALS ===
let scene, camera, renderer, controls, bikeGroup;
let explodeAmount = 0, animatingExplode = false, explodeDir = 1;
let wireframeMode = false;
const components = {};
const explodeOffsets = {};
const clock = new THREE.Clock();

// Geometry params (mm, converted to meters via S)
const geo = {stack:570, reach:385, hta:72.5, sta:73.5, stl:500, cs:410};
const S = 0.001; // mm to meters (scene units: 1 unit = 1 meter)

// === INIT ===
function init(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0c0c14);
  scene.fog = new THREE.Fog(0x0c0c14, 8, 20);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.01, 100);
  camera.position.set(1.6, 0.9, 2.0);

  renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(0.15, 0.45, 0);
  controls.minDistance = 0.5;
  controls.maxDistance = 8;

  setupLighting();
  setupFloor();
  buildBicycle();
  setupUI();
  updateHUD();

  document.getElementById('loading').style.display = 'none';
  animate();
}

// === LIGHTING ===
function setupLighting(){
  const amb = new THREE.AmbientLight(0x334466, 0.4);
  scene.add(amb);
  // Key light (softbox)
  const key = new THREE.DirectionalLight(0xffffff, 2.5);
  key.position.set(3, 5, 2);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.near = 0.5; key.shadow.camera.far = 15;
  key.shadow.camera.left = -4; key.shadow.camera.right = 4;
  key.shadow.camera.top = 4; key.shadow.camera.bottom = -4;
  key.shadow.bias = -0.0005;
  scene.add(key);
  // Fill light
  const fill = new THREE.DirectionalLight(0x6688cc, 0.8);
  fill.position.set(-3, 3, -2);
  scene.add(fill);
  // Rim light
  const rim = new THREE.SpotLight(0x88aaff, 3, 12, Math.PI/6, 0.5);
  rim.position.set(-2, 4, -3);
  scene.add(rim);
  // Ground bounce
  const bounce = new THREE.PointLight(0x223344, 0.5, 6);
  bounce.position.set(0, 0.1, 0);
  scene.add(bounce);
  // Additional accent lights for workshop feel
  const accent1 = new THREE.PointLight(0x4488ff, 1.0, 8);
  accent1.position.set(2, 2, 3);
  scene.add(accent1);
  const accent2 = new THREE.PointLight(0xff6644, 0.4, 6);
  accent2.position.set(-2, 1, 2);
  scene.add(accent2);
}

// === FLOOR ===
function setupFloor(){
  const floorGeo = new THREE.PlaneGeometry(20, 20);
  const floorMat = new THREE.MeshStandardMaterial({
    color:0x1a1a22, roughness:0.3, metalness:0.6,
    envMapIntensity:0.5
  });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.receiveShadow = true;
  scene.add(floor);
  // Grid
  const grid = new THREE.GridHelper(10, 40, 0x222244, 0x151530);
  grid.position.y = 0.001;
  scene.add(grid);
}

// === MATERIAL HELPERS ===
function makeMat(color, finish='Gloss'){
  const params = {color: new THREE.Color(color)};
  switch(finish){
    case 'Matte': params.roughness=0.9; params.metalness=0.1; break;
    case 'Metallic': params.roughness=0.2; params.metalness=0.95; break;
    case 'Carbon': params.roughness=0.4; params.metalness=0.3; break;
    default: params.roughness=0.35; params.metalness=0.4; // Gloss
  }
  return new THREE.MeshStandardMaterial(params);
}

function tubeBetween(p1, p2, r1, r2, mat, segs=12){
  const dir = new THREE.Vector3().subVectors(p2, p1);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(r2||r1, r1, len, segs);
  const mesh = new THREE.Mesh(geo, mat);
  const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
  mesh.position.copy(mid);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
  mesh.castShadow = true;
  return mesh;
}

// === BUILD BICYCLE ===
function buildBicycle(){
  if(bikeGroup) scene.remove(bikeGroup);
  bikeGroup = new THREE.Group();
  scene.add(bikeGroup);

  const bbPos = new THREE.Vector3(0, 0.27, 0); // BB center ~270mm from ground
  const htaRad = geo.hta * Math.PI/180;
  const staRad = geo.sta * Math.PI/180;
  const stackM = geo.stack * S;
  const reachM = geo.reach * S;
  const stlM = geo.stl * S;
  const csM = geo.cs * S;

  // Head tube top position from BB
  const htTop = new THREE.Vector3(reachM, bbPos.y + stackM, 0);
  const htLen = 0.15;
  const htBot = htTop.clone().add(new THREE.Vector3(-Math.cos(htaRad)*htLen, -Math.sin(htaRad)*htLen, 0));

  // Seat tube top (goes up and slightly back from BB)
  const stTop = new THREE.Vector3(
    -Math.cos(staRad) * stlM,
    bbPos.y + Math.sin(staRad) * stlM,
    0
  );

  // Rear axle at wheel radius height, behind BB by chainstay length
  const wheelR = 0.335;
  const rearAxle = new THREE.Vector3(-csM, wheelR, 0);

  // Front axle: project from head tube bottom along HTA, then add fork rake
  const forkAxleLen = 0.37;
  const rake = 0.045;
  const frontAxle = new THREE.Vector3(
    htBot.x + Math.cos(htaRad) * forkAxleLen + rake,
    wheelR,
    0
  );

  const frameMat = makeMat(document.getElementById('col-frame').value, document.getElementById('fin-frame').value);
  const forkMat = makeMat(document.getElementById('col-fork').value, document.getElementById('fin-fork').value);
  const wheelMat = makeMat(document.getElementById('col-wheels').value, document.getElementById('fin-wheels').value);
  const compMat = makeMat(document.getElementById('col-comp').value, document.getElementById('fin-comp').value);
  const accentMat = makeMat(document.getElementById('col-accent').value, document.getElementById('fin-accent').value);
  const rubberMat = new THREE.MeshStandardMaterial({color:0x111111, roughness:0.95, metalness:0});
  const chromeMat = new THREE.MeshStandardMaterial({color:0xcccccc, roughness:0.1, metalness:1.0});

  // --- 1. FRAME ---
  const frame = new THREE.Group(); frame.name = 'Frame';
  const tubeR = 0.024;
  // Down tube: BB -> HT bottom (oversized)
  frame.add(tubeBetween(bbPos, htBot, tubeR, tubeR*1.3, frameMat, 16));
  // Top tube: ST top area -> HT top (starts near seat tube junction)
  const ttStart = new THREE.Vector3(stTop.x * 0.97, stTop.y - 0.015, 0);
  frame.add(tubeBetween(ttStart, htTop.clone().add(new THREE.Vector3(0,-0.005,0)), tubeR*0.8, tubeR*0.8, frameMat, 14));
  // Seat tube: BB -> ST top
  frame.add(tubeBetween(bbPos, stTop, tubeR*0.9, tubeR*0.85, frameMat, 14));
  // Head tube (wider)
  frame.add(tubeBetween(htBot, htTop, tubeR*1.4, tubeR*1.4, frameMat, 16));
  // Chainstays: BB -> rear axle (both sides)
  for(let s of [-1,1]){
    const csEnd = rearAxle.clone(); csEnd.z = s*0.065;
    const csStart = bbPos.clone(); csStart.z = s*0.025;
    frame.add(tubeBetween(csStart, csEnd, tubeR*0.6, tubeR*0.55, frameMat, 10));
  }
  // Seatstays: ST top -> rear axle
  for(let s of [-1,1]){
    const ssEnd = rearAxle.clone(); ssEnd.z = s*0.065;
    const ssStart = stTop.clone(); ssStart.y -= 0.03; ssStart.z = s*0.018;
    frame.add(tubeBetween(ssStart, ssEnd, tubeR*0.55, tubeR*0.45, frameMat, 10));
  }
  // BB shell
  const bbShell = new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.028,0.075,16), frameMat);
  bbShell.rotation.x = Math.PI/2; bbShell.position.copy(bbPos);
  frame.add(bbShell);
  bikeGroup.add(frame);
  components['frame'] = frame;
  explodeOffsets['frame'] = new THREE.Vector3(0,0,0);

  // --- 21. FORK ---
  const fork = new THREE.Group(); fork.name = 'Fork';
  // Steerer tube
  const steererTop = htTop.clone().add(new THREE.Vector3(0, 0.04, 0));
  fork.add(tubeBetween(htBot, steererTop, 0.016, 0.016, forkMat, 12));
  // Fork blades (curved via midpoint offset)
  for(let s of [-1,1]){
    const bladeTop = htBot.clone(); bladeTop.z = s*0.018;
    const bladeBot = frontAxle.clone(); bladeBot.z = s*0.05;
    const bladeMid = bladeTop.clone().lerp(bladeBot, 0.5);
    bladeMid.x += 0.02; // slight curve forward
    const bladeCurve = new THREE.CatmullRomCurve3([bladeTop, bladeMid, bladeBot]);
    const bladeGeo = new THREE.TubeGeometry(bladeCurve, 12, 0.013, 8, false);
    const blade = new THREE.Mesh(bladeGeo, forkMat);
    blade.castShadow = true;
    fork.add(blade);
    // Dropout
    const drop = new THREE.Mesh(new THREE.BoxGeometry(0.018,0.028,0.01), forkMat);
    drop.position.copy(bladeBot); fork.add(drop);
  }
  // Fork crown
  const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.024,0.025,16), forkMat);
  crown.position.copy(htBot); crown.position.y -= 0.012;
  fork.add(crown);
  bikeGroup.add(fork);
  components['fork'] = fork;
  explodeOffsets['fork'] = new THREE.Vector3(0.4, 0.2, 0);

  // --- 24. HEADSET ---
  const headset = new THREE.Group(); headset.name = 'Headset';
  const cupGeo = new THREE.TorusGeometry(0.024, 0.006, 8, 24);
  const cupTop = new THREE.Mesh(cupGeo, chromeMat);
  cupTop.position.copy(htTop); cupTop.rotation.x = Math.PI/2;
  headset.add(cupTop);
  const cupBot = new THREE.Mesh(cupGeo.clone(), chromeMat);
  cupBot.position.copy(htBot); cupBot.rotation.x = Math.PI/2;
  headset.add(cupBot);
  bikeGroup.add(headset);
  components['headset'] = headset;
  explodeOffsets['headset'] = new THREE.Vector3(0.2, 0.5, 0);

  // --- 9. STEM ---
  const stem = new THREE.Group(); stem.name = 'Stem';
  const stemBase = steererTop.clone();
  const stemEnd = stemBase.clone().add(new THREE.Vector3(0.1, 0.015, 0));
  stem.add(tubeBetween(stemBase, stemEnd, 0.016, 0.016, compMat, 10));
  // Clamp
  const clamp = new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.03,12), compMat);
  clamp.position.copy(stemBase); clamp.rotation.x = Math.PI/2;
  stem.add(clamp);
  // Faceplate
  const faceplate = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.025, 0.012), compMat);
  faceplate.position.copy(stemEnd);
  stem.add(faceplate);
  bikeGroup.add(stem);
  components['stem'] = stem;
  explodeOffsets['stem'] = new THREE.Vector3(0.3, 0.5, 0);

  // --- 8. HANDLEBAR (Dropbar) ---
  const handlebar = new THREE.Group(); handlebar.name = 'Handlebar';
  const barCenter = stemEnd.clone();
  // Main bar
  const barCurve = new THREE.CatmullRomCurve3([
    barCenter.clone().add(new THREE.Vector3(0,0,-0.21)),
    barCenter.clone().add(new THREE.Vector3(0,0,-0.1)),
    barCenter.clone(),
    barCenter.clone().add(new THREE.Vector3(0,0,0.1)),
    barCenter.clone().add(new THREE.Vector3(0,0,0.21))
  ]);
  const barGeo = new THREE.TubeGeometry(barCurve, 20, 0.012, 10, false);
  const barMesh = new THREE.Mesh(barGeo, compMat);
  barMesh.castShadow = true;
  handlebar.add(barMesh);
  // Drops
  for(let s of [-1,1]){
    const dropCurve = new THREE.CatmullRomCurve3([
      barCenter.clone().add(new THREE.Vector3(0,0,s*0.21)),
      barCenter.clone().add(new THREE.Vector3(0.02,-0.03,s*0.22)),
      barCenter.clone().add(new THREE.Vector3(0.04,-0.08,s*0.22)),
      barCenter.clone().add(new THREE.Vector3(0.01,-0.12,s*0.21)),
      barCenter.clone().add(new THREE.Vector3(-0.03,-0.11,s*0.20))
    ]);
    const dGeo = new THREE.TubeGeometry(dropCurve, 16, 0.010, 8, false);
    handlebar.add(new THREE.Mesh(dGeo, compMat));
  }
  bikeGroup.add(handlebar);
  components['handlebar'] = handlebar;
  explodeOffsets['handlebar'] = new THREE.Vector3(0.4, 0.6, 0);

  // --- 17. BAR TAPE ---
  const barTape = new THREE.Group(); barTape.name = 'BarTape';
  for(let s of [-1,1]){
    const tapeCurve = new THREE.CatmullRomCurve3([
      barCenter.clone().add(new THREE.Vector3(0,0,s*0.12)),
      barCenter.clone().add(new THREE.Vector3(0,0,s*0.21)),
      barCenter.clone().add(new THREE.Vector3(0.02,-0.04,s*0.22)),
      barCenter.clone().add(new THREE.Vector3(0.03,-0.09,s*0.21))
    ]);
    const tGeo = new THREE.TubeGeometry(tapeCurve, 20, 0.013, 8, false);
    barTape.add(new THREE.Mesh(tGeo, accentMat));
  }
  bikeGroup.add(barTape);
  components['barTape'] = barTape;
  explodeOffsets['barTape'] = new THREE.Vector3(0.4, 0.7, 0);

  // --- 14. SHIFTERS / BRAKE LEVERS ---
  const shifters = new THREE.Group(); shifters.name = 'Shifters';
  for(let s of [-1,1]){
    const shPos = barCenter.clone().add(new THREE.Vector3(0.01,-0.02,s*0.19));
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.025,0.04,0.02), compMat);
    body.position.copy(shPos); shifters.add(body);
    // Lever blade
    const lever = new THREE.Mesh(new THREE.BoxGeometry(0.008,0.06,0.012), chromeMat);
    lever.position.copy(shPos.clone().add(new THREE.Vector3(0.01,-0.04,0)));
    lever.rotation.z = 0.2;
    shifters.add(lever);
    // Hood (rubber)
    const hood = new THREE.Mesh(new THREE.SphereGeometry(0.016,8,8,0,Math.PI*2,0,Math.PI/2), rubberMat);
    hood.position.copy(shPos.clone().add(new THREE.Vector3(0,0.02,0)));
    shifters.add(hood);
  }
  bikeGroup.add(shifters);
  components['shifters'] = shifters;
  explodeOffsets['shifters'] = new THREE.Vector3(0.5, 0.5, 0.2);

  // --- 7. SEATPOST ---
  const seatpost = new THREE.Group(); seatpost.name = 'Seatpost';
  const spTop = stTop.clone().add(new THREE.Vector3(-0.01, 0.12, 0));
  seatpost.add(tubeBetween(stTop, spTop, 0.013, 0.013, compMat));
  // Clamp head
  const spClamp = new THREE.Mesh(new THREE.CylinderGeometry(0.016,0.014,0.02,10), compMat);
  spClamp.position.copy(spTop); seatpost.add(spClamp);
  bikeGroup.add(seatpost);
  components['seatpost'] = seatpost;
  explodeOffsets['seatpost'] = new THREE.Vector3(-0.2, 0.6, 0);

  // --- 4. SADDLE ---
  const saddle = new THREE.Group(); saddle.name = 'Saddle';
  const sadPos = spTop.clone().add(new THREE.Vector3(0, 0.02, 0));
  // Saddle shape using lathe/extrude
  const sadShape = new THREE.Shape();
  sadShape.moveTo(0, 0);
  sadShape.bezierCurveTo(0.06, 0.015, 0.1, 0.04, 0.13, 0.035);
  sadShape.bezierCurveTo(0.14, 0.03, 0.14, -0.03, 0.13, -0.035);
  sadShape.bezierCurveTo(0.1, -0.04, 0.06, -0.015, 0, 0);
  const sadExtGeo = new THREE.ExtrudeGeometry(sadShape, {depth:0.015, bevelEnabled:true, bevelThickness:0.005, bevelSize:0.005, bevelSegments:3});
  const sadMesh = new THREE.Mesh(sadExtGeo, new THREE.MeshStandardMaterial({color:0x1a1a1a, roughness:0.8}));
  sadMesh.position.copy(sadPos); sadMesh.rotation.y = Math.PI/2;
  sadMesh.rotation.z = -0.05;
  saddle.add(sadMesh);
  // Rails
  for(let s of [-1,1]){
    const railCurve = new THREE.CatmullRomCurve3([
      sadPos.clone().add(new THREE.Vector3(-0.04,-0.01,s*0.015)),
      sadPos.clone().add(new THREE.Vector3(0,-0.02,s*0.015)),
      sadPos.clone().add(new THREE.Vector3(0.06,-0.015,s*0.015))
    ]);
    saddle.add(new THREE.Mesh(new THREE.TubeGeometry(railCurve,8,0.002,6), chromeMat));
  }
  bikeGroup.add(saddle);
  components['saddle'] = saddle;
  explodeOffsets['saddle'] = new THREE.Vector3(-0.2, 0.8, 0);

  // --- 15. BOTTOM BRACKET ---
  const bb = new THREE.Group(); bb.name = 'BottomBracket';
  const bbCyl = new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,0.08,16), chromeMat);
  bbCyl.rotation.x = Math.PI/2; bbCyl.position.copy(bbPos);
  bb.add(bbCyl);
  // Spindle
  const spindle = new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.008,0.12,8), chromeMat);
  spindle.rotation.x = Math.PI/2; spindle.position.copy(bbPos);
  bb.add(spindle);
  bikeGroup.add(bb);
  components['bb'] = bb;
  explodeOffsets['bb'] = new THREE.Vector3(0, -0.3, 0);

  // --- 2. CRANKARMS ---
  const crankset = new THREE.Group(); crankset.name = 'Crankset';
  for(let s of [-1,1]){
    const crankTop = bbPos.clone(); crankTop.z = s*0.055;
    const crankBot = crankTop.clone().add(new THREE.Vector3(0, -0.17, 0));
    const crank = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.17, 0.012), compMat);
    crank.position.copy(crankTop.clone().add(crankBot).multiplyScalar(0.5));
    crankset.add(crank);
    // --- 20. PEDALS ---
    const pedal = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.015, 0.06), 
      new THREE.MeshStandardMaterial({color:0x222222, roughness:0.7, metalness:0.3}));
    pedal.position.copy(crankBot.clone().add(new THREE.Vector3(0,-0.01,s*0.02)));
    crankset.add(pedal);
    // Pedal spindle
    const pSpindle = new THREE.Mesh(new THREE.CylinderGeometry(0.004,0.004,0.04,6), chromeMat);
    pSpindle.rotation.x = Math.PI/2;
    pSpindle.position.copy(crankBot.clone().add(new THREE.Vector3(0,0,s*0.01)));
    crankset.add(pSpindle);
  }
  // --- 3. CHAINRING ---
  const chainringGeo = new THREE.TorusGeometry(0.065, 0.004, 6, 48);
  const chainring = new THREE.Mesh(chainringGeo, chromeMat);
  chainring.position.copy(bbPos.clone().add(new THREE.Vector3(0,0,0.055)));
  crankset.add(chainring);
  // Teeth
  for(let i=0; i<36; i++){
    const a = (i/36)*Math.PI*2;
    const tooth = new THREE.Mesh(new THREE.BoxGeometry(0.004,0.008,0.003), chromeMat);
    tooth.position.set(bbPos.x + Math.cos(a)*0.07, bbPos.y + Math.sin(a)*0.07, 0.055);
    tooth.rotation.z = a;
    crankset.add(tooth);
  }
  // Spider arms
  for(let i=0; i<5; i++){
    const a = (i/5)*Math.PI*2;
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.008,0.055,0.005), compMat);
    arm.position.set(bbPos.x + Math.cos(a)*0.035, bbPos.y + Math.sin(a)*0.035, 0.05);
    arm.rotation.z = a;
    crankset.add(arm);
  }
  bikeGroup.add(crankset);
  components['crankset'] = crankset;
  explodeOffsets['crankset'] = new THREE.Vector3(0, -0.4, 0.3);

  // --- 16. CHAIN ---
  const chain = new THREE.Group(); chain.name = 'Chain';
  const chainPath = new THREE.CatmullRomCurve3([
    new THREE.Vector3(bbPos.x + 0.065, bbPos.y, 0.055),
    new THREE.Vector3((bbPos.x + rearAxle.x)/2, bbPos.y - 0.04, 0.045),
    new THREE.Vector3(rearAxle.x + 0.03, rearAxle.y, 0.04),
    new THREE.Vector3(rearAxle.x, rearAxle.y + 0.03, 0.04),
    new THREE.Vector3(rearAxle.x - 0.02, rearAxle.y, 0.04),
    new THREE.Vector3((bbPos.x + rearAxle.x)/2, bbPos.y + 0.03, 0.05),
    new THREE.Vector3(bbPos.x - 0.02, bbPos.y + 0.06, 0.055),
    new THREE.Vector3(bbPos.x + 0.065, bbPos.y, 0.055)
  ], true);
  const chainGeo = new THREE.TubeGeometry(chainPath, 64, 0.004, 6, true);
  chain.add(new THREE.Mesh(chainGeo, new THREE.MeshStandardMaterial({color:0x333333, roughness:0.5, metalness:0.8})));
  bikeGroup.add(chain);
  components['chain'] = chain;
  explodeOffsets['chain'] = new THREE.Vector3(0, -0.5, 0.4);

  // --- 10. WHEELSET (Front & Rear) ---
  function createWheel(pos, name){
    const wheel = new THREE.Group(); wheel.name = name;
    const wheelR = 0.31;
    // Rim
    const rim = new THREE.Mesh(new THREE.TorusGeometry(wheelR, 0.012, 12, 48), wheelMat);
    rim.position.copy(pos); wheel.add(rim);
    // Rim inner
    const rimInner = new THREE.Mesh(new THREE.TorusGeometry(wheelR-0.015, 0.006, 8, 48), wheelMat);
    rimInner.position.copy(pos); wheel.add(rimInner);
    // Hub
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,0.1,12), chromeMat);
    hub.rotation.x = Math.PI/2; hub.position.copy(pos);
    wheel.add(hub);
    // Spokes
    for(let i=0; i<24; i++){
      const a = (i/24)*Math.PI*2;
      const spokeStart = pos.clone().add(new THREE.Vector3(Math.cos(a)*0.015, Math.sin(a)*0.015, (i%2?0.03:-0.03)));
      const spokeEnd = pos.clone().add(new THREE.Vector3(Math.cos(a)*(wheelR-0.015), Math.sin(a)*(wheelR-0.015), (i%2?0.008:-0.008)));
      const sGeo = new THREE.CylinderGeometry(0.001,0.001, spokeStart.distanceTo(spokeEnd), 4);
      const spoke = new THREE.Mesh(sGeo, chromeMat);
      spoke.position.copy(spokeStart.clone().add(spokeEnd).multiplyScalar(0.5));
      spoke.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), spokeEnd.clone().sub(spokeStart).normalize());
      wheel.add(spoke);
    }
    // --- 18. TIRE ---
    const tire = new THREE.Mesh(new THREE.TorusGeometry(wheelR+0.012, 0.016, 12, 48), rubberMat);
    tire.position.copy(pos); wheel.add(tire);
    // --- 19. INNER TUBE (valve) ---
    const valve = new THREE.Mesh(new THREE.CylinderGeometry(0.003,0.003,0.03,6), chromeMat);
    valve.position.copy(pos.clone().add(new THREE.Vector3(0, -(wheelR+0.01), 0.01)));
    wheel.add(valve);
    const valveCap = new THREE.Mesh(new THREE.SphereGeometry(0.004,6,6), accentMat);
    valveCap.position.copy(valve.position.clone().add(new THREE.Vector3(0,-0.016,0)));
    wheel.add(valveCap);
    return wheel;
  }
  const frontWheel = createWheel(frontAxle, 'FrontWheel');
  bikeGroup.add(frontWheel);
  components['frontWheel'] = frontWheel;
  explodeOffsets['frontWheel'] = new THREE.Vector3(0.5, 0, 0.5);

  const rearWheel = createWheel(rearAxle, 'RearWheel');
  bikeGroup.add(rearWheel);
  components['rearWheel'] = rearWheel;
  explodeOffsets['rearWheel'] = new THREE.Vector3(-0.5, 0, 0.5);

  // --- 6. ROTORS ---
  const rotors = new THREE.Group(); rotors.name = 'Rotors';
  for(let [wp, s] of [[frontAxle,1],[rearAxle,-1]]){
    const rotor = new THREE.Mesh(new THREE.TorusGeometry(0.08, 0.003, 6, 32), chromeMat);
    rotor.position.copy(wp.clone().add(new THREE.Vector3(0,0,-0.04)));
    rotors.add(rotor);
    // Perforations (small holes represented by dark circles)
    for(let i=0; i<12; i++){
      const a = (i/12)*Math.PI*2;
      const hole = new THREE.Mesh(new THREE.CircleGeometry(0.005, 6), new THREE.MeshBasicMaterial({color:0x111111}));
      hole.position.copy(wp.clone().add(new THREE.Vector3(Math.cos(a)*0.06, Math.sin(a)*0.06, -0.041)));
      rotors.add(hole);
    }
    // Rotor disc
    const disc = new THREE.Mesh(new THREE.RingGeometry(0.02, 0.078, 32), 
      new THREE.MeshStandardMaterial({color:0xaaaaaa, roughness:0.2, metalness:0.9, side:THREE.DoubleSide}));
    disc.position.copy(wp.clone().add(new THREE.Vector3(0,0,-0.04)));
    rotors.add(disc);
  }
  bikeGroup.add(rotors);
  components['rotors'] = rotors;
  explodeOffsets['rotors'] = new THREE.Vector3(0, 0, -0.5);

  // --- 11. CASSETTE ---
  const cassette = new THREE.Group(); cassette.name = 'Cassette';
  for(let i=0; i<11; i++){
    const r = 0.02 + i*0.004;
    const cog = new THREE.Mesh(new THREE.TorusGeometry(r, 0.002, 6, 24+i*2), chromeMat);
    cog.position.copy(rearAxle.clone().add(new THREE.Vector3(0,0,0.02+i*0.004)));
    cassette.add(cog);
  }
  bikeGroup.add(cassette);
  components['cassette'] = cassette;
  explodeOffsets['cassette'] = new THREE.Vector3(-0.4, 0, 0.5);

  // --- 5. BRAKES (Disc Calipers) ---
  const brakes = new THREE.Group(); brakes.name = 'Brakes';
  for(let wp of [frontAxle, rearAxle]){
    const caliper = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.04, 0.02), compMat);
    caliper.position.copy(wp.clone().add(new THREE.Vector3(0.06, 0.06, -0.04)));
    brakes.add(caliper);
    // Piston detail
    const piston = new THREE.Mesh(new THREE.CylinderGeometry(0.005,0.005,0.015,8), chromeMat);
    piston.rotation.x = Math.PI/2;
    piston.position.copy(wp.clone().add(new THREE.Vector3(0.06, 0.06, -0.03)));
    brakes.add(piston);
  }
  bikeGroup.add(brakes);
  components['brakes'] = brakes;
  explodeOffsets['brakes'] = new THREE.Vector3(0, 0.3, -0.4);

  // --- 12. FRONT DERAILLEUR ---
  const frontDer = new THREE.Group(); frontDer.name = 'FrontDerailleur';
  const fdPos = bbPos.clone().add(new THREE.Vector3(0.02, 0.08, 0.04));
  const fdCage = new THREE.Mesh(new THREE.BoxGeometry(0.005, 0.04, 0.03), compMat);
  fdCage.position.copy(fdPos); frontDer.add(fdCage);
  const fdArm = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.008, 0.008), compMat);
  fdArm.position.copy(fdPos.clone().add(new THREE.Vector3(-0.01, 0.02, 0)));
  frontDer.add(fdArm);
  // Clamp band
  const fdClamp = new THREE.Mesh(new THREE.TorusGeometry(0.016, 0.003, 6, 12), compMat);
  fdClamp.position.copy(fdPos.clone().add(new THREE.Vector3(-0.02, 0.01, 0)));
  frontDer.add(fdClamp);
  bikeGroup.add(frontDer);
  components['frontDer'] = frontDer;
  explodeOffsets['frontDer'] = new THREE.Vector3(0.2, -0.2, 0.4);

  // --- 13. REAR DERAILLEUR ---
  const rearDer = new THREE.Group(); rearDer.name = 'RearDerailleur';
  const rdPos = rearAxle.clone().add(new THREE.Vector3(0.01, -0.02, 0.04));
  // B-knuckle
  const rdBody = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.025, 0.015), compMat);
  rdBody.position.copy(rdPos); rearDer.add(rdBody);
  // Parallelogram linkage
  const link = new THREE.Mesh(new THREE.BoxGeometry(0.008, 0.035, 0.008), compMat);
  link.position.copy(rdPos.clone().add(new THREE.Vector3(0.005, -0.03, 0)));
  link.rotation.z = 0.3;
  rearDer.add(link);
  // Pulley wheels
  for(let dy of [-0.02, -0.05]){
    const pulley = new THREE.Mesh(new THREE.TorusGeometry(0.008, 0.002, 6, 12), compMat);
    pulley.position.copy(rdPos.clone().add(new THREE.Vector3(0.005, dy-0.03, 0)));
    rearDer.add(pulley);
  }
  // Cage plate
  const cagePlate = new THREE.Mesh(new THREE.BoxGeometry(0.004, 0.06, 0.012), compMat);
  cagePlate.position.copy(rdPos.clone().add(new THREE.Vector3(0.005, -0.045, 0)));
  rearDer.add(cagePlate);
  bikeGroup.add(rearDer);
  components['rearDer'] = rearDer;
  explodeOffsets['rearDer'] = new THREE.Vector3(-0.3, -0.3, 0.5);

  // --- 22. CABLES & HOUSING ---
  const cables = new THREE.Group(); cables.name = 'Cables';
  const cableMat = new THREE.MeshStandardMaterial({color:0x111111, roughness:0.6, metalness:0.2});
  // Front brake cable
  const fbCurve = new THREE.CatmullRomCurve3([
    barCenter.clone().add(new THREE.Vector3(0.01,-0.03,0.18)),
    barCenter.clone().add(new THREE.Vector3(0.05,-0.1,0.1)),
    htTop.clone().add(new THREE.Vector3(0.02,-0.05,0.02)),
    frontAxle.clone().add(new THREE.Vector3(0.06,0.08,-0.03))
  ]);
  cables.add(new THREE.Mesh(new THREE.TubeGeometry(fbCurve, 24, 0.003, 6), cableMat));
  // Rear brake cable
  const rbCurve = new THREE.CatmullRomCurve3([
    barCenter.clone().add(new THREE.Vector3(0.01,-0.03,-0.18)),
    htTop.clone().add(new THREE.Vector3(-0.02,-0.02,0)),
    ttStart.clone().add(new THREE.Vector3(-0.05,-0.02,0)),
    stTop.clone().add(new THREE.Vector3(-0.02,-0.05,0.02)),
    rearAxle.clone().add(new THREE.Vector3(0.06,0.08,-0.03))
  ]);
  cables.add(new THREE.Mesh(new THREE.TubeGeometry(rbCurve, 32, 0.003, 6), cableMat));
  // Rear derailleur cable
  const rdCable = new THREE.CatmullRomCurve3([
    barCenter.clone().add(new THREE.Vector3(0.01,-0.04,-0.17)),
    htTop.clone().add(new THREE.Vector3(-0.01,-0.04,0.01)),
    bbPos.clone().add(new THREE.Vector3(-0.05,0.02,0.03)),
    rdPos.clone().add(new THREE.Vector3(0.01,0.02,0))
  ]);
  cables.add(new THREE.Mesh(new THREE.TubeGeometry(rdCable, 28, 0.002, 6), cableMat));
  // Front derailleur cable
  const fdCable = new THREE.CatmullRomCurve3([
    barCenter.clone().add(new THREE.Vector3(0.01,-0.04,0.17)),
    htTop.clone().add(new THREE.Vector3(0.01,-0.06,0.01)),
    fdPos.clone().add(new THREE.Vector3(0,0.03,0))
  ]);
  cables.add(new THREE.Mesh(new THREE.TubeGeometry(fdCable, 20, 0.002, 6), cableMat));
  bikeGroup.add(cables);
  components['cables'] = cables;
  explodeOffsets['cables'] = new THREE.Vector3(0, 0.4, -0.3);

  // --- 23. BOLTS & SCCREWS ---
  const bolts = new THREE.Group(); bolts.name = 'Bolts';
  const boltPositions = [
    stemBase, // stem bolt
    stTop.clone().add(new THREE.Vector3(0.015,0,0)), // seat clamp
    bbPos.clone().add(new THREE.Vector3(0,0,0.06)), // BB bolt R
    bbPos.clone().add(new THREE.Vector3(0,0,-0.06)), // BB bolt L
    htTop.clone().add(new THREE.Vector3(0,0.02,0)), // top cap
  ];
  for(let bp of boltPositions){
    // Hex socket head
    const boltHead = new THREE.Mesh(new THREE.CylinderGeometry(0.005,0.005,0.006,6), chromeMat);
    boltHead.position.copy(bp);
    bolts.add(boltHead);
    // Socket
    const socket = new THREE.Mesh(new THREE.CylinderGeometry(0.003,0.003,0.004,6), 
      new THREE.MeshBasicMaterial({color:0x222222}));
    socket.position.copy(bp.clone().add(new THREE.Vector3(0,0.003,0)));
    bolts.add(socket);
  }
  bikeGroup.add(bolts);
  components['bolts'] = bolts;
  explodeOffsets['bolts'] = new THREE.Vector3(0, 0.3, 0.3);

  // Store base positions for explode
  for(let key in components){
    components[key].userData.basePos = components[key].position.clone();
  }
}

// === EXPLODE VIEW ===
function updateExplode(amount){
  explodeAmount = amount;
  const t = amount / 100;
  for(let key in components){
    const comp = components[key];
    const offset = explodeOffsets[key] || new THREE.Vector3();
    comp.position.copy(comp.userData.basePos.clone().add(offset.clone().multiplyScalar(t)));
  }
}

// === HUD UPDATE ===
function updateHUD(){
  const htaR = geo.hta * Math.PI/180;
  const htBotX = geo.reach*S - Math.cos(htaR)*0.15;
  const faX = htBotX + Math.cos(htaR)*0.37 + 0.045;
  const wb = ((faX + geo.cs*S) * 1000).toFixed(0);
  const weight = (7.2 + (geo.stl - 500)*0.003 + (geo.cs - 410)*0.002).toFixed(2);
  document.getElementById('sp-weight').textContent = weight + ' kg';
  document.getElementById('sp-wb').textContent = wb + ' mm';
  document.getElementById('sp-stack').textContent = geo.stack + ' mm';
  document.getElementById('sp-reach').textContent = geo.reach + ' mm';
  document.getElementById('sp-hta').textContent = geo.hta + '°';
  document.getElementById('sp-sta').textContent = geo.sta + '°';
  document.getElementById('sp-cs').textContent = geo.cs + ' mm';
}

// === UI SETUP ===
function setupUI(){
  // Geometry sliders
  const geoSliders = [
    ['geo-stack','v-stack','stack'],['geo-reach','v-reach','reach'],
    ['geo-hta','v-hta','hta'],['geo-sta','v-sta','sta'],
    ['geo-stl','v-stl','stl'],['geo-cs','v-cs','cs']
  ];
  for(let [id, vid, param] of geoSliders){
    const el = document.getElementById(id);
    el.addEventListener('input', ()=>{
      geo[param] = parseFloat(el.value);
      document.getElementById(vid).textContent = el.value;
      buildBicycle();
      updateExplode(explodeAmount);
      updateHUD();
    });
  }
  // Explode slider
  document.getElementById('explode').addEventListener('input', (e)=>{
    updateExplode(parseFloat(e.target.value));
    document.getElementById('v-explode').textContent = e.target.value + '%';
  });
  // Assembly animation
  document.getElementById('btn-assemble').addEventListener('click', ()=>{
    animatingExplode = !animatingExplode;
  });
  // Color/Finish
  const colorTargets = ['frame','fork','wheels','comp','accent'];
  for(let t of colorTargets){
    document.getElementById('col-'+t).addEventListener('input', ()=>{ rebuildColors(); });
    document.getElementById('fin-'+t).addEventListener('change', ()=>{ rebuildColors(); });
  }
  // Buttons
  document.getElementById('btn-wireframe').addEventListener('click', ()=>{
    wireframeMode = !wireframeMode;
    bikeGroup.traverse(child=>{
      if(child.isMesh && child.material) child.material.wireframe = wireframeMode;
    });
  });
  document.getElementById('btn-rotate').addEventListener('click', ()=>{
    controls.autoRotate = !controls.autoRotate;
    controls.autoRotateSpeed = 1.5;
  });
  document.getElementById('btn-reset').addEventListener('click', ()=>{
    camera.position.set(1.6, 0.9, 2.0);
    controls.target.set(0.15, 0.45, 0);
  });
}

function rebuildColors(){
  buildBicycle();
  updateExplode(explodeAmount);
  if(wireframeMode){
    bikeGroup.traverse(child=>{
      if(child.isMesh && child.material) child.material.wireframe = true;
    });
  }
}

// === ANIMATION LOOP ===
function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  controls.update();

  if(animatingExplode){
    let val = parseFloat(document.getElementById('explode').value);
    val += explodeDir * dt * 40;
    if(val >= 100){ val = 100; explodeDir = -1; }
    if(val <= 0){ val = 0; explodeDir = 1; }
    document.getElementById('explode').value = val;
    document.getElementById('v-explode').textContent = Math.round(val) + '%';
    updateExplode(val);
  }

  renderer.render(scene, camera);
}

// === RESIZE ===
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// === START ===
init();
</script>
</body>
</html>
