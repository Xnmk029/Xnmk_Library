<!DOCTYPE html>

<html lang="en">
	<head>
		<meta charset="UTF-8">
		<style>
			body{
				color: white;
			}
			body, html{
				overflow-x: hidden;
				overflow-y: hidden;
			}
			img{
				position: absolute;
				top: 0px;
				left: 0px;
			}
			#cold{
				z-index:0;
			}
			#glow_1{
				z-index:1;
			}
			#glow_2{
				z-index:2;
			}
			#glow_3{
				z-index:3;
			}
		</style>
	</head>
	<body>
		<img id="glow_1" src="ccf_innocent_brake_glow_1.png" width="512" height="512">
		<img id="glow_2" src="ccf_innocent_brake_glow_2.png" width="512" height="512">
		<img id="glow_3" src="ccf_innocent_brake_glow_3.png" width="512" height="512">
	</body>
	
	<!--top part mostly by aljowen-->
	<script>
		var Brakeglow1;
		var Brakeglow2;
		var Brakeglow3;
		
		function init(){
			Brakeglow1 = document.getElementById('glow_1');
			Brakeglow2 = document.getElementById('glow_2');
			Brakeglow3 = document.getElementById('glow_3');

			Brakeglow1.style.opacity = 0;
			Brakeglow2.style.opacity = 0;
			Brakeglow3.style.opacity = 0;
		}
		function update(brakeGlow_fl){
			Brakeglow1 = document.getElementById('glow_1');
			Brakeglow2 = document.getElementById('glow_2');
			Brakeglow3 = document.getElementById('glow_3');
		
			Brakeglow1.style.opacity = 0;
			Brakeglow2.style.opacity = 0;
			Brakeglow3.style.opacity = 0;
			
			var opacityGlow1 = (brakeGlow_fl - 450)/100; //450 is where the glow starts 
			var opacityGlow2 = (brakeGlow_fl - 550)/100;
			var opacityGlow3 = (brakeGlow_fl - 650)/71;

			if (opacityGlow1 < 0){opacityGlow1 = 0;} 
			if (opacityGlow2 < 0){opacityGlow2 = 0;} 
			if (opacityGlow3 < 0){opacityGlow3 = 0;} 

			if (brakeGlow_fl > 550){opacityGlow1 = 1;} //locks this layer to 1
			if (brakeGlow_fl > 650){opacityGlow2 = 1;} //locks this layer to 1
			if (brakeGlow_fl > 721){opacityGlow3 = 1;} //locks this layer to 1

			Brakeglow1.style.opacity = opacityGlow1;
			Brakeglow2.style.opacity = opacityGlow2;
			Brakeglow3.style.opacity = opacityGlow3;
		}
	</script>
</html>
