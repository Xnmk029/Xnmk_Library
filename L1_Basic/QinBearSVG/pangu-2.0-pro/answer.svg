<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#c8c8c8"/>
    </linearGradient>
    <linearGradient id="bear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f0"/>
      <stop offset="100%" stop-color="#d8d8d0"/>
    </linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="800" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="80" cy="60" r="1.5"/><circle cx="200" cy="100" r="1"/>
    <circle cx="350" cy="40" r="2"/><circle cx="500" cy="80" r="1.5"/>
    <circle cx="620" cy="50" r="1"/><circle cx="720" cy="110" r="2"/>
    <circle cx="150" cy="180" r="1"/><circle cx="450" cy="150" r="1.5"/>
    <circle cx="680" cy="160" r="1"/><circle cx="100" cy="250" r="1"/>
    <circle cx="380" cy="220" r="1.5"/><circle cx="580" cy="200" r="1"/>
  </g>

  <!-- Moon -->
  <circle cx="650" cy="120" r="40" fill="#f0f0e8" opacity="0.9"/>
  <circle cx="670" cy="110" r="35" fill="#1a1a2e" opacity="0.3"/>

  <!-- Snow ground -->
  <rect y="500" width="800" height="300" fill="url(#ground)"/>
  <path d="M0 500 Q100 480 200 500 T400 500 T600 500 T800 500" fill="#e0e0d8" opacity="0.5"/>

  <!-- Palace silhouette -->
  <g fill="#0d0d1a" opacity="0.4">
    <rect x="100" y="350" width="120" height="150"/>
    <rect x="110" y="320" width="100" height="30"/>
    <polygon points="110,320 160,280 210,320"/>
    <rect x="130" y="270" width="60" height="10"/>
    <rect x="230" y="380" width="80" height="120"/>
    <rect x="240" y="360" width="60" height="20"/>
    <polygon points="240,360 270,330 300,360"/>
    <rect x="450" y="360" width="100" height="140"/>
    <rect x="460" y="330" width="80" height="30"/>
    <polygon points="460,330 500,290 540,330"/>
    <rect x="560" y="390" width="70" height="110"/>
  </g>

  <!-- Terracotta hint -->
  <g fill="#3d2b1f" opacity="0.3">
    <rect x="300" y="460" width="20" height="40"/>
    <rect x="330" y="460" width="20" height="40"/>
    <rect x="360" y="460" width="20" height="40"/>
    <rect x="420" y="460" width="20" height="40"/>
    <rect x="450" y="460" width="20" height="40"/>
    <rect x="480" y="460" width="20" height="40"/>
  </g>

  <!-- QIN SHI HUANG (being ridden) -->
  <g id="qin">
    <!-- Body - black robe -->
    <path d="M300 520 L280 620 L290 680 L340 690 L380 640 L370 560 Z" fill="url(#robe)"/>
    <!-- Robe lower hem detail -->
    <path d="M290 680 L340 690 L380 640" fill="none" stroke="#8b0000" stroke-width="3"/>
    <!-- Red sash/belt -->
    <rect x="285" y="590" width="80" height="8" fill="#8b0000" rx="2"/>
    <!-- Sash tails -->
    <path d="M320 598 L310 630 L325 630 Z" fill="#8b0000"/>
    <!-- Legs -->
    <rect x="300" y="640" width="18" height="40" fill="#0a0a0a"/>
    <rect x="340" y="640" width="18" height="40" fill="#0a0a0a"/>
    <!-- Boots -->
    <ellipse cx="309" cy="682" rx="12" ry="6" fill="#1a1a1a"/>
    <ellipse cx="349" cy="682" rx="12" ry="6" fill="#1a1a1a"/>
    <!-- Arms -->
    <path d="M280 560 L240 540 L230 570" fill="none" stroke="#0a0a0a" stroke-width="10" stroke-linecap="round"/>
    <path d="M370 560 L400 540 L410 570" fill="none" stroke="#0a0a0a" stroke-width="10" stroke-linecap="round"/>
    <!-- Hands on ground (struggling) -->
    <ellipse cx="228" cy="572" rx="8" ry="5" fill="#c8a882"/>
    <ellipse cx="408" cy="572" rx="8" ry="5" fill="#c8a882"/>
    <!-- Torso/chest -->
    <rect x="280" y="520" width="90" height="70" fill="#0a0a0a"/>
    <!-- Collar/inner robe red -->
    <path d="M300 520 L325 550 L350 520" fill="#8b0000"/>
    <!-- Neck -->
    <rect x="310" y="500" width="30" height="25" fill="#c8a882"/>
    <!-- Head -->
    <ellipse cx="325" cy="480" rx="28" ry="30" fill="#c8a882"/>
    <!-- Hair/beard base -->
    <path d="M295 470 Q325 440 355 470 L340 490 Q325 470 310 490 Z" fill="#1a1a1a"/>
    <!-- Crown (mianliu) -->
    <rect x="290" y="445" width="70" height="12" fill="#1a1a1a"/>
    <!-- Crown beads panel -->
    <rect x="295" y="435" width="60" height="12" fill="#0a0a0a"/>
    <g fill="#ffffff" opacity="0.9">
      <circle cx="305" cy="441" r="2"/><circle cx="315" cy="441" r="2"/>
      <circle cx="325" cy="441" r="2"/><circle cx="335" cy="441" r="2"/>
      <circle cx="345" cy="441" r="2"/>
    </g>
    <!-- Crown top -->
    <rect x="315" y="430" width="20" height="10" fill="#1a1a1a"/>
    <!-- Beard -->
    <path d="M310 495 Q325 515 340 495 L330 500 Q325 492 320 500 Z" fill="#1a1a1a"/>
    <!-- Eyes (sharp, annoyed) -->
    <ellipse cx="310" cy="475" rx="5" ry="3" fill="#ffffff"/>
    <ellipse cx="340" cy="475" rx="5" ry="3" fill="#ffffff"/>
    <circle cx="312" cy="475" r="2" fill="#000000"/>
    <circle cx="342" cy="475" r="2" fill="#000000"/>
    <!-- Eyebrows (angry) -->
    <path d="M305 468 Q310 463 315 468" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
    <path d="M335 468 Q340 463 345 468" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
    <!-- Mouth (grimacing) -->
    <path d="M315 490 Q325 495 335 490" fill="none" stroke="#8b0000" stroke-width="2"/>
    <!-- Mustache -->
    <path d="M310 485 L300 482" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M340 485 L350 482" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  </g>

  <!-- POLAR BEAR (riding on top) -->
  <g id="bear">
    <!-- Hind legs (straddling) -->
    <path d="M280 430 L260 490 L290 500 L310 460 Z" fill="url(#bear)"/>
    <path d="M370 430 L390 490 L360 500 L340 460 Z" fill="url(#bear)"/>
    <!-- Paw pads on hind feet -->
    <ellipse cx="270" cy="495" rx="12" ry="6" fill="#d0d0c8"/>
    <ellipse cx="380" cy="495" rx="12" ry="6" fill="#d0d0c8"/>
    <!-- Body -->
    <ellipse cx="325" cy="380" rx="75" ry="90" fill="url(#bear)"/>
    <!-- Belly -->
    <ellipse cx="325" cy="400" rx="45" ry="55" fill="#f8f8f0"/>
    <!-- Front legs (gripping/grounded on Qin's shoulders) -->
    <path d="M270 340 L230 380 L240 430 L275 420 Z" fill="url(#bear)"/>
    <path d="M380 340 L420 380 L410 430 L375 420 Z" fill="url(#bear)"/>
    <!-- Front paws -->
    <ellipse cx="235" cy="400" rx="18" ry="12" fill="#f0f0e8"/>
    <ellipse cx="415" cy="400" rx="18" ry="12" fill="#f0f0e8"/>
    <!-- Paw pads -->
    <ellipse cx="238" cy="403" rx="10" ry="6" fill="#d0d0c8"/>
    <ellipse cx="418" cy="403" rx="10" ry="6" fill="#d0d0c8"/>
    <!-- Claws on paws -->
    <g fill="#a0a098">
      <path d="M228 395 L225 388 L232 390 Z"/><path d="M235 392 L234 384 L240 388 Z"/>
      <path d="M242 395 L244 387 L248 392 Z"/>
      <path d="M410 395 L407 388 L414 390 Z"/><path d="M417 392 L416 384 L422 388 Z"/>
      <path d="M424 395 L426 387 L430 392 Z"/>
    </g>
    <!-- Neck -->
    <ellipse cx="325" cy="310" rx="35" ry="30" fill="url(#bear)"/>
    <!-- Head -->
    <ellipse cx="325" cy="240" rx="55" ry="45" fill="url(#bear)"/>
    <!-- Ears -->
    <ellipse cx="280" cy="205" rx="14" ry="18" fill="url(#bear)"/>
    <ellipse cx="370" cy="205" rx="14" ry="18" fill="url(#bear)"/>
    <ellipse cx="282" cy="207" rx="8" ry="10" fill="#d0d0c8"/>
    <ellipse cx="372" cy="207" rx="8" ry="10" fill="#d0d0c8"/>
    <!-- Snout -->
    <ellipse cx="325" cy="255" rx="20" ry="14" fill="#f0f0e8"/>
    <!-- Nose -->
    <ellipse cx="325" cy="250" rx="10" ry="7" fill="#1a1a1a"/>
    <!-- Eyes (smug, looking down) -->
    <g>
      <ellipse cx="305" cy="232" rx="8" ry="5" fill="#ffffff"/>
      <ellipse cx="345" cy="232" rx="8" ry="5" fill="#ffffff"/>
      <circle cx="307" cy="232" r="3" fill="#000000"/>
      <circle cx="347" cy="232" r="3" fill="#000000"/>
      <circle cx="308" cy="230" r="1" fill="#ffffff"/>
      <circle cx="348" cy="230" r="1" fill="#ffffff"/>
    </g>
    <!-- Eyebrows (satisfied) -->
    <path d="M298 225 L312 228" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M338 228 L352 225" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <!-- Mouth (smug grin) -->
    <path d="M310 262 Q325 270 340 262" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <!-- Whiskers -->
    <g fill="none" stroke="#a0a098" stroke-width="1">
      <path d="M305 255 L280 253"/><path d="M305 258 L280 259"/>
      <path d="M345 255 L370 253"/><path d="M345 258 L370 259"/>
    </g>
    <!-- Bear shadow/volume -->
    <ellipse cx="325" cy="240" rx="55" ry="45" fill="#000000" opacity="0.05"/>
  </g>

  <!-- Reins/ropes (bear holding) -->
  <path d="M240 400 Q280 380 300 400" fill="none" stroke="#8b4513" stroke-width="2"/>
  <path d="M410 400 Q370 380 350 400" fill="none" stroke="#8b4513" stroke-width="2"/>

  <!-- Caption -->
  <text x="400" y="760" text-anchor="middle" font-family="serif" font-size="20" fill="#ffffff" opacity="0.5">
    The Polar Bear Emperor
  </text>
</svg>
