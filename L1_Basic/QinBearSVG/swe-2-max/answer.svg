<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img" aria-labelledby="title desc">
  <title id="title">北极熊骑秦始皇</title>
  <desc id="desc">一幅幽默扁平矢量插画：一只成年北极熊跨坐在趴地前行的秦始皇背上，揪着冕旒珠串当缰绳，秦始皇身着玄衣纁裳、头戴冕冠，在雪原上被骑乘，远处可见咸阳宫剪影与兵马俑。</desc>

  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe4f2"/>
      <stop offset="1" stop-color="#f2f9fd"/>
    </linearGradient>
    <linearGradient id="robeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c36"/>
      <stop offset="1" stop-color="#15151b"/>
    </linearGradient>
    <linearGradient id="bearGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffef9"/>
      <stop offset="1" stop-color="#ece6d4"/>
    </linearGradient>
  </defs>

  <!-- ======== 背景 ======== -->
  <rect x="0" y="0" width="900" height="900" fill="url(#skyGrad)"/>

  <!-- 日轮 -->
  <circle cx="742" cy="138" r="82" fill="#f6dfa8" opacity="0.16"/>
  <circle cx="742" cy="138" r="56" fill="#f6dfa8" opacity="0.6"/>

  <!-- 云 -->
  <g fill="#ffffff" opacity="0.8">
    <ellipse cx="150" cy="132" rx="62" ry="20"/>
    <ellipse cx="198" cy="148" rx="52" ry="16"/>
    <ellipse cx="108" cy="150" rx="44" ry="14"/>
  </g>
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="610" cy="86" rx="48" ry="15"/>
    <ellipse cx="652" cy="98" rx="40" ry="13"/>
  </g>

  <!-- 飞鸟 -->
  <g fill="none" stroke="#8aa4b8" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <path d="M 336 128 Q 345 119 354 128 Q 363 119 372 128"/>
    <path d="M 628 186 Q 635 179 642 186 Q 649 179 656 186" stroke-width="2"/>
  </g>

  <!-- 咸阳宫剪影 -->
  <g fill="#7d97b1" opacity="0.7">
    <polygon points="56,586 304,586 292,558 68,558"/>
    <rect x="102" y="500" width="156" height="58"/>
    <polygon points="84,504 276,504 250,468 110,468"/>
    <rect x="150" y="428" width="62" height="42"/>
    <polygon points="134,432 226,432 202,404 158,404"/>
    <rect x="176" y="388" width="8" height="18"/>
  </g>

  <!-- 兵马俑阵列暗示 -->
  <g fill="#6d7f93" opacity="0.8">
    <rect x="706" y="584" width="150" height="5" rx="2"/>
    <g>
      <circle cx="730" cy="540" r="7.5"/>
      <circle cx="730" cy="529" r="3"/>
      <path d="M 721 548 Q 730 543 739 548 L 743 584 L 717 584 Z"/>
    </g>
    <g>
      <circle cx="774" cy="534" r="7.5"/>
      <circle cx="774" cy="523" r="3"/>
      <path d="M 765 542 Q 774 537 783 542 L 787 584 L 761 584 Z"/>
    </g>
    <g>
      <circle cx="818" cy="541" r="7.5"/>
      <circle cx="818" cy="530" r="3"/>
      <path d="M 809 549 Q 818 544 827 549 L 831 584 L 805 584 Z"/>
    </g>
    <path d="M 764 512 L 759 502 M 784 512 L 789 502" stroke="#6d7f93" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 雪原 -->
  <path d="M 0 585 C 150 570 300 578 430 582 C 580 586 760 572 900 584 L 900 900 L 0 900 Z" fill="#fbfdfe"/>
  <g fill="none" stroke="#e0ebf3" stroke-width="3" stroke-linecap="round">
    <path d="M 40 648 Q 160 634 282 648"/>
    <path d="M 620 668 Q 760 652 884 668"/>
    <path d="M 470 792 Q 580 780 700 794"/>
  </g>

  <!-- 拖行痕迹(爬过来的手印/膝印) -->
  <g fill="#bccddd" opacity="0.4">
    <ellipse cx="706" cy="700" rx="15" ry="6"/>
    <ellipse cx="748" cy="707" rx="15" ry="6"/>
    <ellipse cx="792" cy="712" rx="15" ry="6"/>
    <ellipse cx="836" cy="716" rx="15" ry="6"/>
  </g>

  <!-- 主体投影 -->
  <ellipse cx="440" cy="724" rx="292" ry="26" fill="#c9d9e6" opacity="0.75"/>

  <!-- ======== 秦始皇(被骑乘,四足跪地前行) ======== -->
  <g stroke-linejoin="round" stroke-linecap="round">

    <!-- 后侧(远)手臂 -->
    <path d="M 338 505 C 330 550 326 600 328 655 L 372 658 C 376 605 380 555 384 510 Z"
          fill="#191920" stroke="#101014" stroke-width="3.5"/>
    <path d="M 330 655 Q 318 661 318 675 Q 318 689 334 692 L 368 693 Q 382 689 381 675 Q 380 662 367 657 Z"
          fill="#d9a87c" stroke="#101014" stroke-width="3.5"/>
    <path d="M 328 676 Q 338 680 348 678 M 330 686 Q 340 689 350 687"
          fill="none" stroke="#a97a52" stroke-width="2"/>

    <!-- 后侧(远)脚 -->
    <path d="M 570 676 Q 622 668 652 680 Q 662 688 650 695 Q 600 702 572 692 Z"
          fill="#0e0e12" stroke="#101014" stroke-width="3"/>

    <!-- 飘起的绶带尾(动感) -->
    <path d="M 596 468 C 652 444 698 450 732 418 C 724 456 682 482 640 492 C 620 497 604 490 596 468 Z"
          fill="#8a2f27" stroke="#5e1b15" stroke-width="3"/>
    <path d="M 606 494 C 652 484 690 494 716 476 C 702 504 656 516 616 512 Z"
          fill="#a13d2d" stroke="#5e1b15" stroke-width="3"/>

    <!-- 躯干:玄色帝袍(背部被压得下沉) -->
    <path d="M 300 462
             C 340 492 400 512 458 512
             C 520 512 556 496 584 462
             C 606 440 632 452 638 488
             C 644 522 636 570 624 610
             C 618 630 612 645 604 652
             C 540 676 400 678 336 656
             C 314 646 300 620 296 585
             C 290 545 290 500 300 462 Z"
          fill="url(#robeGrad)" stroke="#101014" stroke-width="4.5"/>

    <!-- 背部受压的凹陷褶线 -->
    <g fill="none" stroke="#0c0c10" stroke-width="3" opacity="0.7">
      <path d="M 412 522 Q 440 534 468 524"/>
      <path d="M 486 526 Q 514 536 542 524"/>
    </g>

    <!-- 袍服团纹 -->
    <g fill="none" stroke="#3d3d4b" opacity="0.85">
      <circle cx="478" cy="590" r="34" stroke-width="3"/>
      <circle cx="478" cy="590" r="19" stroke-width="2.5"/>
      <circle cx="478" cy="590" r="5" fill="#3d3d4b" stroke="none"/>
    </g>
    <path d="M 312 632 Q 460 664 612 634" fill="none" stroke="#3d3d4b" stroke-width="2.5" opacity="0.8"/>

    <!-- 熊臀拍出的红掌印(幽默细节) -->
    <g fill="#c96a5a" opacity="0.5">
      <ellipse cx="606" cy="472" rx="11" ry="9"/>
      <circle cx="592" cy="458" r="4"/>
      <circle cx="603" cy="452" r="4"/>
      <circle cx="615" cy="452" r="4"/>
      <circle cx="624" cy="459" r="4"/>
    </g>

    <!-- 纁裳(赤色下裳,盖住跪地的腿) -->
    <path d="M 322 630 C 400 658 540 660 616 626
             C 632 650 640 676 636 700
             C 560 724 400 726 332 704
             C 314 682 312 654 322 630 Z"
          fill="#93392b" stroke="#5e2318" stroke-width="3.5"/>
    <g fill="none" stroke="#6e2a1f" stroke-width="2.5">
      <path d="M 382 662 Q 378 688 386 706"/>
      <path d="M 472 668 Q 470 696 474 714"/>
      <path d="M 562 656 Q 568 684 562 706"/>
    </g>

    <!-- 前侧(近)脚:上翘履尖的黑舄 -->
    <path d="M 598 686 Q 655 678 696 690 Q 716 684 718 698 Q 716 712 700 712
             L 636 714 Q 602 710 598 686 Z"
          fill="#141419" stroke="#101014" stroke-width="3.5"/>
    <path d="M 606 708 Q 660 716 704 706" fill="none" stroke="#8a8a92" stroke-width="2" opacity="0.7"/>

    <!-- 腹下垂落的绶带(像马肚带,暗示被当坐骑) -->
    <path d="M 425 640 Q 448 650 472 642 L 470 676 Q 448 686 426 676 Z"
          fill="#7d2a22" stroke="#4e1b15" stroke-width="3"/>
    <circle cx="449" cy="668" r="12" fill="#d4af37" stroke="#7a5c14" stroke-width="3"/>
    <circle cx="449" cy="668" r="4.5" fill="#8a2f27"/>

    <!-- 前侧(近)手臂:宽袖+撑地的手 -->
    <path d="M 306 492 C 290 520 272 565 260 620 C 256 640 254 652 254 660
             L 310 664 C 316 640 324 600 332 560 C 338 528 336 505 332 494 Z"
          fill="url(#robeGrad)" stroke="#101014" stroke-width="4"/>
    <path d="M 252 646 L 312 650 L 310 666 L 250 662 Z"
          fill="#93392b" stroke="#5e2318" stroke-width="3"/>
    <path d="M 254 658 Q 238 662 234 676 Q 230 692 246 697 L 286 699 Q 302 695 300 680
             Q 298 666 286 660 Z"
          fill="#f2c9a2" stroke="#22222a" stroke-width="3.5"/>
    <path d="M 240 678 Q 250 682 260 680 M 240 688 Q 251 691 261 689"
          fill="none" stroke="#c68f5e" stroke-width="2"/>
    <!-- 吃力发抖的小记号 -->
    <g fill="none" stroke="#8aa4b8" stroke-width="2.5" opacity="0.85">
      <path d="M 222 656 l -8 -10"/>
      <path d="M 232 646 l -5 -11"/>
    </g>

    <!-- 颈与交领 -->
    <path d="M 272 478 L 314 484 L 320 546 L 278 546 Z" fill="#e5b184"/>
    <path d="M 298 456 L 268 502 L 283 513 L 316 470 Z" fill="#101015" stroke="#101014" stroke-width="3"/>
    <path d="M 316 470 L 289 515 L 304 526 L 332 484 Z" fill="#1d1d25" stroke="#101014" stroke-width="3"/>
    <path d="M 308 468 L 292 490" stroke="#93392b" stroke-width="3.5" fill="none"/>

    <!-- 头部(左侧面,帝王相:剑眉、厉目、短须) -->
    <path d="M 296 352
             C 268 346 238 356 226 382
             C 219 395 216 406 216 416
             L 204 440
             Q 198 448 206 452
             L 218 458
             Q 212 464 220 468
             Q 210 474 220 482
             C 224 496 242 504 262 504
             C 286 504 302 488 306 462
             C 309 425 306 385 296 352 Z"
          fill="#f2c9a2" stroke="#22222a" stroke-width="4"/>
    <!-- 耳朵 -->
    <ellipse cx="292" cy="432" rx="10" ry="14" fill="#f2c9a2" stroke="#22222a" stroke-width="3"/>
    <path d="M 288 426 Q 294 432 289 440" fill="none" stroke="#c68f5e" stroke-width="2"/>
    <!-- 剑眉 -->
    <path d="M 222 402 L 256 391 Q 263 393 259 400 L 226 411 Z" fill="#26262c"/>
    <!-- 厉目(斜睨背上之熊) -->
    <path d="M 228 417 Q 240 408 254 414 Q 242 423 228 417 Z" fill="#ffffff" stroke="#22222a" stroke-width="3"/>
    <circle cx="247" cy="413" r="3.6" fill="#1a1a20"/>
    <!-- 法令纹/咬牙 -->
    <path d="M 226 448 Q 223 462 230 472" fill="none" stroke="#d99c6f" stroke-width="2.5"/>
    <path d="M 218 476 Q 230 480 240 477" fill="none" stroke="#22222a" stroke-width="3"/>
    <path d="M 226 477 l 0 5 M 233 478 l 0 5" stroke="#22222a" stroke-width="1.6" fill="none"/>
    <!-- 髭须与颔下短须 -->
    <path d="M 210 456 C 200 458 192 467 190 479 C 199 475 207 467 213 460 Z" fill="#26262c"/>
    <path d="M 213 461 C 205 458 196 460 190 467 C 198 469 207 466 213 461 Z" fill="#26262c"/>
    <path d="M 224 486 C 218 500 222 516 234 522 C 242 514 242 498 236 486 Z" fill="#26262c"/>
    <path d="M 238 502 Q 266 510 292 496" fill="none" stroke="#26262c" stroke-width="3.5"/>
    <!-- 汗珠:吃力但威严 -->
    <path d="M 212 390 C 206 398 206 405 212 408 C 218 405 218 398 212 390 Z" fill="#8ec6e8"/>
    <path d="M 200 424 C 195 431 195 437 200 440 C 205 437 205 431 200 424 Z" fill="#8ec6e8"/>

    <!-- 冕冠 -->
    <path d="M 216 394 C 218 362 250 344 292 346 C 322 348 336 370 334 396
             L 308 402 C 304 382 288 372 264 372 C 244 372 228 382 216 394 Z"
          fill="#17171d" stroke="#22222a" stroke-width="3.5"/>
    <!-- 冕板(前低后高) -->
    <polygon points="200,340 336,318 344,342 208,364" fill="#20202a" stroke="#101014" stroke-width="3.5"/>
    <path d="M 200 340 L 336 318" stroke="#54545f" stroke-width="2" fill="none"/>
    <circle cx="238" cy="339" r="2.2" fill="#d4af37"/>
    <circle cx="278" cy="331" r="2.2" fill="#d4af37"/>
    <circle cx="316" cy="324" r="2.2" fill="#d4af37"/>
    <!-- 下颌纮带 -->
    <path d="M 232 402 Q 238 476 258 498" fill="none" stroke="#26262c" stroke-width="2.5"/>

    <!-- 垂旒(剩余珠串) -->
    <g stroke="#9a8f74" stroke-width="2">
      <line x1="196" y1="362" x2="193" y2="428"/>
      <line x1="204" y1="363" x2="202" y2="430"/>
      <line x1="212" y1="364" x2="211" y2="430"/>
      <line x1="220" y1="365" x2="220" y2="428"/>
      <line x1="334" y1="344" x2="336" y2="402"/>
      <line x1="342" y1="343" x2="345" y2="400"/>
      <line x1="350" y1="342" x2="354" y2="398"/>
      <line x1="358" y1="342" x2="363" y2="396"/>
    </g>
    <g fill="#f4efe0" stroke="#a89f86" stroke-width="0.8">
      <circle cx="195" cy="372" r="3.5"/><circle cx="194" cy="388" r="3.5"/>
      <circle cx="193" cy="404" r="3.5"/><circle cx="193" cy="420" r="3.5"/>
      <circle cx="203" cy="373" r="3.5"/><circle cx="203" cy="389" r="3.5"/>
      <circle cx="202" cy="405" r="3.5"/><circle cx="202" cy="421" r="3.5"/>
      <circle cx="212" cy="374" r="3.5"/><circle cx="211" cy="390" r="3.5"/>
      <circle cx="211" cy="406" r="3.5"/><circle cx="211" cy="422" r="3.5"/>
      <circle cx="220" cy="375" r="3.5"/><circle cx="220" cy="391" r="3.5"/>
      <circle cx="220" cy="407" r="3.5"/><circle cx="220" cy="421" r="3.5"/>
      <circle cx="334" cy="354" r="3.5"/><circle cx="335" cy="370" r="3.5"/>
      <circle cx="335" cy="386" r="3.5"/><circle cx="336" cy="398" r="3.5"/>
      <circle cx="343" cy="353" r="3.5"/><circle cx="344" cy="369" r="3.5"/>
      <circle cx="344" cy="385" r="3.5"/><circle cx="345" cy="397" r="3.5"/>
      <circle cx="351" cy="352" r="3.5"/><circle cx="352" cy="368" r="3.5"/>
      <circle cx="353" cy="384" r="3.5"/><circle cx="354" cy="396" r="3.5"/>
      <circle cx="359" cy="352" r="3.5"/><circle cx="360" cy="368" r="3.5"/>
      <circle cx="361" cy="384" r="3.5"/><circle cx="362" cy="394" r="3.5"/>
    </g>
  </g>

  <!-- ======== 北极熊(骑乘者,踞坐背上) ======== -->
  <g stroke-linejoin="round" stroke-linecap="round">

    <!-- 短尾 -->
    <circle cx="654" cy="492" r="13" fill="#e9e3d1" stroke="#22222a" stroke-width="3.5"/>

    <!-- 远侧后腿(从帝臀另一侧探出的脚掌) -->
    <ellipse cx="664" cy="544" rx="30" ry="18" fill="#e8e2d0" stroke="#22222a" stroke-width="3.5"/>
    <ellipse cx="672" cy="546" rx="13" ry="7" fill="#57525e"/>

    <!-- 身躯 -->
    <path d="M 452 478
             C 416 446 400 392 410 340
             C 418 296 446 266 486 254
             C 528 242 580 252 612 282
             C 646 314 662 368 658 422
             C 655 466 638 500 610 518
             C 566 540 498 540 462 518
             C 448 508 444 492 452 478 Z"
          fill="url(#bearGrad)" stroke="#22222a" stroke-width="4.5"/>
    <!-- 体侧阴影 -->
    <path d="M 612 288 C 646 322 660 372 656 424 C 652 468 634 500 606 516
             L 592 500 C 620 482 636 448 636 404 C 636 362 624 322 600 296 Z"
          fill="#e2dbc8" opacity="0.9"/>
    <ellipse cx="518" cy="430" rx="64" ry="76" fill="#f5f0e2" opacity="0.55"/>
    <ellipse cx="522" cy="288" rx="52" ry="15" fill="#e2dbc8" opacity="0.8"/>

    <!-- 近侧后腿:跨过帝躯,脚掌垂在腹侧 -->
    <path d="M 478 486 C 438 492 410 522 402 562 C 396 596 408 622 438 628
             C 468 634 494 614 500 582 C 506 546 502 512 478 486 Z"
          fill="url(#bearGrad)" stroke="#22222a" stroke-width="4"/>
    <ellipse cx="448" cy="596" rx="26" ry="18" fill="#57525e" stroke="#22222a" stroke-width="3"/>
    <ellipse cx="420" cy="568" rx="7" ry="5" fill="#57525e"/>
    <ellipse cx="448" cy="560" rx="8" ry="6" fill="#57525e"/>
    <ellipse cx="476" cy="566" rx="7" ry="5" fill="#57525e"/>

    <!-- 左前肢:前伸抓"缰"(冕旒珠串) -->
    <path d="M 470 330 C 442 340 418 364 402 392 C 396 402 400 414 412 414
             C 430 414 458 394 480 372 C 492 360 492 338 470 330 Z"
          fill="url(#bearGrad)" stroke="#22222a" stroke-width="4"/>
    <circle cx="404" cy="400" r="17" fill="url(#bearGrad)" stroke="#22222a" stroke-width="4"/>
    <path d="M 394 392 Q 402 398 412 397 M 396 406 Q 404 410 413 408"
          fill="none" stroke="#d5cfbd" stroke-width="2.5"/>

    <!-- 右前肢:高举挥赶 -->
