             C 719 268 706 296 678 316 C 652 334 618 328 610 296 Z"
          fill="url(#bearGrad)" stroke="#22222a" stroke-width="4"/>
    <circle cx="700" cy="246" r="19" fill="url(#bearGrad)" stroke="#22222a" stroke-width="4"/>
    <ellipse cx="700" cy="250" rx="9" ry="11" fill="#57525e"/>
    <circle cx="688" cy="232" r="4.5" fill="#57525e"/>
    <circle cx="700" cy="227" r="4.5" fill="#57525e"/>
    <circle cx="712" cy="231" r="4.5" fill="#57525e"/>
    <g fill="none" stroke="#9aa7b5" stroke-width="3">
      <path d="M 732 236 Q 743 252 735 270"/>
      <path d="M 748 222 Q 764 246 752 268"/>
    </g>

    <!-- 头颈 -->
    <circle cx="464" cy="142" r="23" fill="url(#bearGrad)" stroke="#22222a" stroke-width="4"/>
    <circle cx="464" cy="144" r="11" fill="#d9d2c0"/>
    <circle cx="584" cy="138" r="23" fill="url(#bearGrad)" stroke="#22222a" stroke-width="4"/>
    <circle cx="584" cy="140" r="11" fill="#d9d2c0"/>
    <circle cx="522" cy="205" r="80" fill="url(#bearGrad)" stroke="#22222a" stroke-width="4.5"/>
    <!-- 颊边毛茬 -->
    <path d="M 438 216 l -12 6 l 12 4 M 606 214 l 12 6 l -12 4"
          fill="none" stroke="#e0d9c6" stroke-width="3"/>
    <!-- 吻部 -->
    <ellipse cx="506" cy="228" rx="40" ry="31" fill="#f8f4ea" stroke="#22222a" stroke-width="3"/>
    <path d="M 492 210 Q 492 200 506 200 Q 520 200 520 210 Q 518 220 506 222
             Q 494 220 492 210 Z" fill="#26262c"/>
    <path d="M 506 222 Q 506 237 523 240 M 506 237 Q 496 242 488 237"
          fill="none" stroke="#22222a" stroke-width="3"/>
    <!-- 得意的半阖眼 -->
    <path d="M 474 172 Q 486 166 498 172" fill="none" stroke="#22222a" stroke-width="3"/>
    <path d="M 538 170 Q 550 164 562 170" fill="none" stroke="#22222a" stroke-width="3"/>
    <ellipse cx="486" cy="182" rx="6.5" ry="7.5" fill="#26262c"/>
    <ellipse cx="550" cy="180" rx="6.5" ry="7.5" fill="#26262c"/>
    <circle cx="484" cy="180" r="2" fill="#ffffff"/>
    <circle cx="548" cy="178" r="2" fill="#ffffff"/>
  </g>

  <!-- ======== 被熊抓作缰绳的旒串(压在最上层) ======== -->
  <g>
    <g fill="none" stroke="#978b6d" stroke-width="2.2">
      <path d="M 204 356 Q 298 366 396 392"/>
      <path d="M 207 362 Q 300 380 398 398"/>
      <path d="M 210 368 Q 302 394 400 404"/>
    </g>
    <g fill="#f4efe0" stroke="#8f8570" stroke-width="1">
      <circle cx="240" cy="362" r="4"/><circle cx="282" cy="369" r="4"/>
      <circle cx="325" cy="378" r="4"/><circle cx="365" cy="386" r="4"/>
      <circle cx="244" cy="370" r="4"/><circle cx="286" cy="380" r="4"/>
      <circle cx="330" cy="389" r="4"/><circle cx="370" cy="395" r="4"/>
      <circle cx="248" cy="379" r="4"/><circle cx="290" cy="390" r="4"/>
      <circle cx="334" cy="398" r="4"/><circle cx="372" cy="402" r="4"/>
    </g>
    <!-- 握珠的爪趾压线 -->
    <path d="M 388 392 Q 402 385 414 394" fill="none" stroke="#22222a" stroke-width="3"/>
  </g>

  <!-- 溅起的雪雾与滚落的玉珠 -->
  <g>
    <ellipse cx="216" cy="700" rx="26" ry="10" fill="#ffffff" stroke="#dfe9f2" stroke-width="2.5"/>
    <ellipse cx="560" cy="722" rx="30" ry="10" fill="#ffffff" stroke="#dfe9f2" stroke-width="2.5"/>
    <ellipse cx="706" cy="714" rx="24" ry="9" fill="#ffffff" stroke="#dfe9f2" stroke-width="2.5"/>
    <circle cx="306" cy="712" r="3.5" fill="#f4efe0" stroke="#a89f86" stroke-width="0.8"/>
    <circle cx="330" cy="719" r="3" fill="#f4efe0" stroke="#a89f86" stroke-width="0.8"/>
    <circle cx="356" cy="712" r="3.5" fill="#f4efe0" stroke="#a89f86" stroke-width="0.8"/>
  </g>
</svg>
