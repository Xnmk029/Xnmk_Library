<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-label="Polar bear riding Qin Shi Huang">
  <title>北极熊骑秦始皇</title>
  <desc>A cartoon polar bear riding on the back/shoulders of Qin Shi Huang.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe3f5"/>
      <stop offset="100%" stop-color="#eaf6fb"/>
    </linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0392b"/>
      <stop offset="100%" stop-color="#7b1f14"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dfe7ee"/>
    </linearGradient>
    <radialGradient id="ground" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#f4f7fa"/>
      <stop offset="100%" stop-color="#c9d6e2"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="url(#sky)"/>
  <ellipse cx="450" cy="620" rx="420" ry="90" fill="url(#ground)"/>

  <!-- Snowflakes -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="120" cy="80" r="3"/>
    <circle cx="260" cy="140" r="2"/>
    <circle cx="700" cy="60" r="3"/>
    <circle cx="820" cy="130" r="2"/>
    <circle cx="60" cy="260" r="2"/>
    <circle cx="780" cy="300" r="3"/>
  </g>

  <!-- Qin Shi Huang (rider's mount) -->
  <g id="qin">
    <!-- Legs -->
    <rect x="385" y="500" width="34" height="110" rx="12" fill="#2c2418"/>
    <rect x="435" y="500" width="34" height="110" rx="12" fill="#2c2418"/>
    <rect x="378" y="600" width="48" height="18" rx="6" fill="#1a140d"/>
    <rect x="428" y="600" width="48" height="18" rx="6" fill="#1a140d"/>

    <!-- Robe body -->
    <path d="M330,360 Q320,430 350,510 L500,510 Q530,430 520,360 Q450,330 330,360 Z" fill="url(#robe)" stroke="#5a140a" stroke-width="2"/>
    <!-- Robe trim -->
    <path d="M330,360 Q425,335 520,360" fill="none" stroke="#f1c40f" stroke-width="4"/>
    <path d="M350,510 L500,510" fill="none" stroke="#f1c40f" stroke-width="3"/>

    <!-- Belt -->
    <rect x="345" y="430" width="160" height="18" rx="4" fill="#f1c40f" stroke="#b7950b" stroke-width="1.5"/>
    <rect x="418" y="428" width="18" height="22" rx="3" fill="#8e44ad" stroke="#5e2a7a" stroke-width="1"/>

    <!-- Torso / chest -->
    <ellipse cx="425" cy="345" rx="78" ry="55" fill="url(#robe)" stroke="#5a140a" stroke-width="2"/>

    <!-- Arms -->
    <path d="M352,335 Q300,360 290,420" fill="none" stroke="#c0392b" stroke-width="26" stroke-linecap="round"/>
    <path d="M498,335 Q550,360 560,420" fill="none" stroke="#c0392b" stroke-width="26" stroke-linecap="round"/>
    <!-- Hands -->
    <circle cx="288" cy="424" r="14" fill="#f1c8a0"/>
    <circle cx="562" cy="424" r="14" fill="#f1c8a0"/>

    <!-- Neck -->
    <rect x="405" y="270" width="38" height="40" rx="10" fill="#f1c8a0" stroke="#b97a4a" stroke-width="1.5"/>

    <!-- Head -->
    <ellipse cx="424" cy="245" rx="52" ry="58" fill="#f1c8a0" stroke="#b97a4a" stroke-width="2"/>

    <!-- Crown (mianguan) -->
    <rect x="372" y="188" width="104" height="16" rx="4" fill="#f1c40f" stroke="#b7950b" stroke-width="1.5"/>
    <rect x="392" y="172" width="64" height="18" rx="4" fill="#f1c40f" stroke="#b7950b" stroke-width="1.5"/>
    <!-- Hanging bead strings -->
    <g stroke="#f1c40f" stroke-width="1.2">
      <line x1="380" y1="204" x2="372" y2="235"/>
      <line x1="400" y1="204" x2="394" y2="240"/>
      <line x1="424" y1="204" x2="424" y2="245"/>
      <line x1="448" y1="204" x2="454" y2="240"/>
      <line x1="468" y1="204" x2="476" y2="235"/>
    </g>
    <g fill="#8e44ad">
      <circle cx="372" cy="238" r="3"/>
      <circle cx="394" cy="243" r="3"/>
      <circle cx="424" cy="248" r="3"/>
      <circle cx="454" cy="243" r="3"/>
      <circle cx="476" cy="238" r="3"/>
    </g>

    <!-- Face details -->
    <path d="M398,232 Q408,226 420,232" fill="none" stroke="#3b2a1a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M428,232 Q438,226 450,232" fill="none" stroke="#3b2a1a" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="409" cy="240" rx="5" ry="3" fill="#2c1a0f"/>
    <ellipse cx="439" cy="240" rx="5" ry="3" fill="#2c1a0f"/>
    <!-- mustache -->
    <path d="M405,262 Q424,270 443,262" fill="none" stroke="#2c1a0f" stroke-width="3" stroke-linecap="round"/>
    <path d="M400,268 Q390,280 385,275" fill="none" stroke="#2c1a0f" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M448,268 Q458,280 463,275" fill="none" stroke="#2c1a0f" stroke-width="2.5" stroke-linecap="round"/>
    <!-- beard -->
    <path d="M396,278 Q424,310 452,278" fill="#2c1a0f" opacity="0.85"/>
  </g>

  <!-- Polar bear riding on Qin's back/shoulders -->
  <g id="bear">
    <!-- Hind legs dangling -->
    <ellipse cx="372" cy="290" rx="16" ry="40" fill="url(#fur)" stroke="#a8b4c0" stroke-width="1.5" transform="rotate(-20 372 290)"/>
    <ellipse cx="476" cy="290" rx="16" ry="40" fill="url(#fur)" stroke="#a8b4c0" stroke-width="1.5" transform="rotate(20 476 290)"/>
    <ellipse cx="368" cy="325" rx="12" ry="8" fill="#2c1a0f"/>
    <ellipse cx="480" cy="325" rx="12" ry="8" fill="#2c1a0f"/>

    <!-- Body -->
    <ellipse cx="424" cy="175" rx="95" ry="70" fill="url(#fur)" stroke="#a8b4c0" stroke-width="2"/>

    <!-- Front paws gripping shoulders -->
    <path d="M345,205 Q320,250 318,320" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
    <path d="M503,205 Q528,250 530,320" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
    <ellipse cx="318" cy="326" rx="15" ry="11" fill="#e8edf2" stroke="#a8b4c0" stroke-width="1.5"/>
    <ellipse cx="530" cy="326" rx="15" ry="11" fill="#e8edf2" stroke="#a8b4c0" stroke-width="1.5"/>
    <g fill="#2c1a0f">
      <circle cx="310" cy="328" r="3"/>
      <circle cx="326" cy="328" r="3"/>
      <circle cx="522" cy="328" r="3"/>
      <circle cx="538" cy="328" r="3"/>
    </g>

    <!-- Head -->
    <ellipse cx="424" cy="100" rx="62" ry="55" fill="url(#fur)" stroke="#a8b4c0" stroke-width="2"/>

    <!-- Ears -->
    <ellipse cx="378" cy="62" rx="16" ry="20" fill="#ffffff" stroke="#a8b4c0" stroke-width="1.5"/>
    <ellipse cx="470" cy="62" rx="16" ry="20" fill="#ffffff" stroke="#a8b4c0" stroke-width="1.5"/>
    <ellipse cx="378" cy="64" rx="9" ry="12" fill="#f2b6c6"/>
    <ellipse cx="470" cy="64" rx="9" ry="12" fill="#f2b6c6"/>

    <!-- Snout -->
    <ellipse cx="424" cy="118" rx="34" ry="26" fill="#ffffff" stroke="#a8b4c0" stroke-width="1.5"/>
    <ellipse cx="424" cy="124" rx="14" ry="10" fill="#2c1a0f"/>
    <ellipse cx="424" cy="116" rx="9" ry="6" fill="#f2b6c6"/>

    <!-- Eyes -->
    <ellipse cx="400" cy="92" rx="9" ry="11" fill="#1a1a1a"/>
    <ellipse cx="448" cy="92" rx="9" ry="11" fill="#1a1a1a"/>
    <circle cx="403" cy="89" r="3" fill="#ffffff"/>
    <circle cx="451" cy="89" r="3" fill="#ffffff"/>

    <!-- Smile -->
    <path d="M408,138 Q424,148 440,138" fill="none" stroke="#2c1a0f" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Caption -->
  <text x="450" y="50" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#2c3e50">北极熊骑秦始皇</text>
</svg>
