<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dce8f5"/>
      <stop offset="100%" stop-color="#e8edf3"/>
    </linearGradient>
    <linearGradient id="snowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f7fa"/>
      <stop offset="100%" stop-color="#e2e8ef"/>
    </linearGradient>
    <linearGradient id="bearFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#e8edf1"/>
      <stop offset="100%" stop-color="#cfd6dc"/>
    </linearGradient>
    <linearGradient id="robeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="40%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="goldSash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="50%" stop-color="#a8852e"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
    <radialGradient id="noseGrad" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#2d2d2d"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#skyGrad)"/>

  <!-- Distant mountains / palace silhouette -->
  <g opacity="0.25">
    <polygon points="0,520 150,380 280,460 400,340 520,450 650,370 800,490 800,800 0,800" fill="#7a8a9a"/>
    <polygon points="100,520 200,420 300,480 400,400 500,470 600,410 700,480 800,520 800,800 0,800" fill="#8a9aaa"/>
  </g>

  <!-- Snowfield -->
  <rect y="580" width="800" height="220" fill="url(#snowGrad)"/>
  <path d="M0,580 Q200,540 400,570 Q600,600 800,560 L800,800 L0,800 Z" fill="#e8edf3"/>

  <!-- Snow particles -->
  <g opacity="0.6">
    <circle cx="100" cy="600" r="1.5" fill="#fff"/>
    <circle cx="250" cy="590" r="1" fill="#fff"/>
    <circle cx="400" cy="610" r="1.5" fill="#fff"/>
    <circle cx="550" cy="595" r="1" fill="#fff"/>
    <circle cx="700" cy="605" r="1.5" fill="#fff"/>
    <circle cx="150" cy="650" r="1" fill="#fff"/>
    <circle cx="350" cy="640" r="1.5" fill="#fff"/>
    <circle cx="600" cy="645" r="1" fill="#fff"/>
    <circle cx="750" cy="635" r="1.5" fill="#fff"/>
  </g>

  <!-- Terracotta warrior hints (faint) -->
  <g opacity="0.15" transform="translate(50,620)">
    <rect x="0" y="0" width="18" height="40" fill="#b85c3a" rx="3"/>
    <rect x="14" y="-8" width="16" height="14" fill="#c86c4a" rx="3"/>
    <rect x="40" y="0" width="18" height="40" fill="#b85c3a" rx="3"/>
    <rect x="54" y="-8" width="16" height="14" fill="#c86c4a" rx="3"/>
    <rect x="80" y="0" width="18" height="40" fill="#b85c3a" rx="3"/>
    <rect x="94" y="-8" width="16" height="14" fill="#c86c4a" rx="3"/>
  </g>
  <g opacity="0.12" transform="translate(550,610)">
    <rect x="0" y="0" width="16" height="45" fill="#a84c2a" rx="3"/>
    <rect x="12" y="-10" width="14" height="16" fill="#b85c3a" rx="3"/>
    <rect x="35" y="0" width="16" height="45" fill="#a84c2a" rx="3"/>
    <rect x="47" y="-10" width="14" height="16" fill="#b85c3a" rx="3"/>
  </g>

  <!-- Qin Shi Huang - Body (being ridden, lower) -->
  <g filter="url(#softShadow)">
    <!-- Torso - black robe -->
    <path d="M280,420 C280,420 260,500 250,560 C245,590 240,620 250,640 C260,660 290,670 320,660 C350,670 380,660 390,640 C400,620 395,590 390,560 C380,500 360,420 360,420 Z" fill="url(#robeGrad)"/>

    <!-- Robe details - upper body folds -->
    <path d="M285,440 C290,460 300,480 310,500 C320,520 330,540 340,560" stroke="#0a0a14" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M282,480 C295,500 310,520 325,540" stroke="#0a0a14" stroke-width="1" fill="none" opacity="0.3"/>

    <!-- Waist sash / belt -->
    <path d="M265,540 Q320,555 375,540" stroke="url(#goldSash)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M265,540 Q320,555 375,540" stroke="#8b6914" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.3"/>

    <!-- Jade ornaments on sash -->
    <circle cx="290" cy="542" r="4" fill="#4a8a6a" opacity="0.7"/>
    <circle cx="350" cy="542" r="4" fill="#4a8a6a" opacity="0.7"/>

    <!-- Lower robe (纁裳 - reddish-brown lower) -->
    <path d="M255,560 C250,580 248,600 252,620 C256,640 265,655 275,660 C285,665 295,660 300,655 C305,660 315,665 325,660 C335,655 344,640 348,620 C352,600 350,580 345,560 Z" fill="#5a2a1a"/>
    <path d="M260,580 C280,595 300,600 320,595 C340,590 355,580 360,570" stroke="#3a1a0a" stroke-width="1" fill="none" opacity="0.4"/>

    <!-- Legs (kneeling, being ridden) -->
    <path d="M270,660 C265,680 260,700 258,720 C256,735 255,745 255,750 L265,750 C266,740 268,720 270,700 C272,680 275,665 280,660 Z" fill="#1a1a2e"/>
    <path d="M340,660 C345,680 350,700 352,720 C354,735 355,745 355,750 L345,750 C344,740 342,720 340,700 C338,680 335,665 330,660 Z" fill="#1a1a2e"/>

    <!-- Feet (on snow) -->
    <ellipse cx="260" cy="752" rx="12" ry="6" fill="#0a0a14"/>
    <ellipse cx="340" cy="752" rx="12" ry="6" fill="#0a0a14"/>

    <!-- Arms (extended, being gripped) -->
    <path d="M255,480 C240,490 220,500 205,510 C190,520 180,530 175,540" stroke="#1a1a2e" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M375,480 C390,490 410,500 425,510 C440,520 450,530 455,540" stroke="#1a1a2e" stroke-width="14" fill="none" stroke-linecap="round"/>

    <!-- Hands -->
    <circle cx="172" cy="542" r="10" fill="#2a1a0a"/>
    <circle cx="458" cy="542" r="10" fill="#2a1a0a"/>
  </g>

  <!-- Qin Shi Huang - Head & Crown -->
  <g filter="url(#softShadow)">
    <!-- Head/face -->
    <ellipse cx="318" cy="395" rx="42" ry="46" fill="#d4a87c"/>
    <ellipse cx="318" cy="395" rx="42" ry="46" fill="url(#robeGrad)" opacity="0.15"/>

    <!-- Face shading -->
    <path d="M290,400 C285,410 283,425 285,440 C287,450 292,455 295,450" fill="#b89060" opacity="0.4"/>

    <!-- Forehead -->
    <ellipse cx="318" cy="375" rx="30" ry="18" fill="#c4986c"/>

    <!-- Eyes - sharp, imperial -->
    <g>
      <!-- Left eye -->
      <ellipse cx="300" cy="390" rx="6" ry="5.5" fill="#1a0a02"/>
      <circle cx="301" cy="389" r="2" fill="#3a2a10"/>
      <circle cx="302" cy="388" r="0.8" fill="#fff"/>
      <!-- Right eye -->
      <ellipse cx="336" cy="390" rx="6" ry="5.5" fill="#1a0a02"/>
      <circle cx="337" cy="389" r="2" fill="#3a2a10"/>
      <circle cx="338" cy="388" r="0.8" fill="#fff"/>
    </g>

    <!-- Eyebrows - sharp, imperial -->
    <path d="M288,380 Q300,374 312,380" stroke="#2a1a08" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M324,380 Q336,374 348,380" stroke="#2a1a08" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M318,395 L315,408 L321,408 Z" fill="#a07040"/>

    <!-- Mouth - stern/serious -->
    <path d="M305,415 Q318,422 331,415" stroke="#6a3020" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Short beard (秦国帝王须) -->
    <path d="M300,420 Q318,430 336,420 Q338,428 318,432 Q298,428 300,420 Z" fill="#3a2010"/>
    <path d="M295,422 Q318,435 341,422 Q343,428 318,435 Q293,428 295,422 Z" fill="#2a1808" opacity="0.6"/>

    <!-- Mustache -->
    <path d="M295,408 Q318,415 341,408 Q340,412 318,415 Q296,412 295,408 Z" fill="#2a1808"/>

    <!-- 冕旒冠 (Imperial Crown with Beads) -->
    <!-- Crown base -->
    <path d="M270,355 L270,365 L366,365 L366,355 Z" fill="#1a1a2e" stroke="#2a2a3e" stroke-width="1"/>
    <!-- Crown front plate -->
    <path d="M275,355 L275,365 L361,365 L361,355 Z" fill="#0a0a14"/>
    <!-- Crown top ornament -->
    <rect x="270" y="348" width="96" height="10" fill="#1a1a2e" rx="2"/>
    <!-- Jade ornaments on crown -->
    <rect x="280" y="350" width="8" height="6" fill="#4a8a6a" rx="1"/>
    <rect x="312" y="350" width="8" height="6" fill="#4a8a6a" rx="1"/>
    <rect x="344" y="350" width="8" height="6" fill="#4a8a6a" rx="1"/>

    <!-- 旒 (bead pendants) - front -->
    <g>
      <!-- Left pendant -->
      <line x1="282" y1="365" x2="280" y2="410" stroke="#c9a84c" stroke-width="1.5" opacity="0.8"/>
      <circle cx="280" cy="375" r="2" fill="#c9a84c"/>
      <circle cx="280" cy="385" r="2" fill="#c9a84c"/>
      <circle cx="280" cy="395" r="2" fill="#c9a84c"/>
      <circle cx="280" cy="405" r="2" fill="#c9a84c"/>
      <!-- Center pendant -->
      <line x1="316" y1="365" x2="314" y2="410" stroke="#c9a84c" stroke-width="1.5" opacity="0.8"/>
      <circle cx="314" cy="375" r="2" fill="#c9a84c"/>
      <circle cx="314" cy="385" r="2" fill="#c9a84c"/>
      <circle cx="314" cy="395" r="2" fill="#c9a84c"/>
      <circle cx="314" cy="405" r="2" fill="#c9a84c"/>
      <!-- Right pendant -->
      <line x1="348" y1="365" x2="350" y2="410" stroke="#c9a84c" stroke-width="1.5" opacity="0.8"/>
      <circle cx="350" cy="375" r="2" fill="#c9a84c"/>
      <circle cx="350" cy="385" r="2" fill="#c9a84c"/>
      <circle cx="350" cy="395" r="2" fill="#c9a84c"/>
      <circle cx="350" cy="405" r="2" fill="#c9a84c"/>
    </g>

    <!-- Crown side wings -->
    <path d="M270,355 L260,350 L260,360 L270,365 Z" fill="#1a1a2e"/>
    <path d="M366,355 L376,350 L376,360 L366,365 Z" fill="#1a1a2e"/>
  </g>

  <!-- Polar Bear - Body (riding on top) -->
  <g filter="url(#softShadow)">
    <!-- Bear body - main torso -->
    <ellipse cx="315" cy="300" rx="75" ry="55" fill="url(#bearFur)"/>
    <ellipse cx="315" cy="295" rx="70" ry="48" fill="#f8fafc" opacity="0.6"/>

    <!-- Bear body shading (volume) -->
    <path d="M260,280 C255,290 253,310 255,330 C257,345 262,350 265,348 C268,350 272,345 274,330 C276,310 274,290 270,280 Z" fill="#d0d8e0" opacity="0.4"/>
    <path d="M360,280 C365,290 367,310 365,330 C363,345 358,350 355,348 C352,350 348,345 346,330 C344,310 346,290 350,280 Z" fill="#d0d8e0" opacity="0.4"/>

    <!-- Bear back (where Qin Shi Huang is being ridden from) -->
    <path d="M255,310 Q315,270 375,310 Q380,330 375,340 Q315,360 255,340 Q250,330 255,310 Z" fill="url(#bearFur)"/>

    <!-- Bear belly (visible below body) -->
    <path d="M280,330 Q315,370 350,330 Q355,340 315,360 Q275,340 280,330 Z" fill="#f0f4f8"/>

    <!-- Bear legs (gripping Qin Shi Huang) -->
    <!-- Front left leg (gripping shoulder) -->
    <path d="M265,320 C255,330 240,340 230,350 C220,360 215,370 218,375 C222,378 228,372 235,362 C242,352 250,340 255,330 Z" fill="url(#bearFur)"/>
    <!-- Front right leg (gripping other shoulder) -->
    <path d="M365,320 C375,330 390,340 400,350 C410,360 415,370 412,375 C408,378 402,372 395,362 C388,352 380,340 375,330 Z" fill="url(#bearFur)"/>

    <!-- Bear paws (on Qin Shi Huang's shoulders) -->
    <g>
      <!-- Left paw -->
      <ellipse cx="225" cy="370" rx="18" ry="10" fill="#e8edf1" transform="rotate(-15, 225, 370)"/>
      <ellipse cx="220" cy="368" rx="14" ry="7" fill="#dce4ec" transform="rotate(-15, 220, 368)"/>
      <!-- Paw pads -->
      <ellipse cx="222" cy="370" rx="6" ry="3" fill="#c8d0d8" transform="rotate(-15, 222, 370)"/>
      <ellipse cx="230" cy="367" rx="4" ry="2.5" fill="#c8d0d8" transform="rotate(-15, 230, 367)"/>
      <ellipse cx="226" cy="373" rx="4" ry="2.5" fill="#c8d0d8" transform="rotate(-15, 226, 373)"/>
      <!-- Claws -->
      <path d="M210,362 L214,360" stroke="#a0a8b0" stroke-width="1" fill="none"/>
      <path d="M212,368 L216,366" stroke="#a0a8b0" stroke-width="1" fill="none"/>
      <path d="M214,374 L218,372" stroke="#a0a8b0" stroke-width="1" fill="none"/>

      <!-- Right paw -->
      <ellipse cx="405" cy="370" rx="18" ry="10" fill="#e8edf1" transform="rotate(15, 405, 370)"/>
      <ellipse cx="410" cy="368" rx="14" ry="7" fill="#dce4ec" transform="rotate(15, 410, 368)"/>
      <!-- Paw pads -->
      <ellipse cx="408" cy="370" rx="6" ry="3" fill="#c8d0d8" transform="rotate(15, 408, 370)"/>
      <ellipse cx="400" cy="367" rx="4" ry="2.5" fill="#c8d0d8" transform="rotate(15, 400, 367)"/>
      <ellipse cx="404" cy="373" rx="4" ry="2.5" fill="#c8d0d8" transform="rotate(15, 404, 373)"/>
      <!-- Claws -->
      <path d="M420,362 L416,360" stroke="#a0a8b0" stroke-width="1" fill="none"/>
      <path d="M418,368 L414,366" stroke="#a0a8b0" stroke-width="1" fill="none"/>
      <path d="M416,374 L412,372" stroke="#a0a8b0" stroke-width="1" fill="none"/>
    </g>

    <!-- Back legs (wrapped around) -->
    <path d="M270,340 C260,360 245,380 235,400 C225,415 220,425 222,430 C225,432 230,428 238,415 C246,400 255,380 260,365 Z" fill="url(#bearFur)"/>
    <path d="M360,340 C370,360 385,380 395,400 C405,415 410,425 408,430 C405,432 400,428 392,415 C384,400 375,380 370,365 Z" fill="url(#bearFur)"/>

    <!-- Bear feet (on snow, visible) -->
    <ellipse cx="230" cy="430" rx="14" ry="8" fill="#e8edf1" transform="rotate(-10, 230, 430)"/>
    <ellipse cx="400" cy="430" rx="14" ry="8" fill="#e8edf1" transform="rotate(10, 400, 430)"/>
  </g>

  <!-- Polar Bear - Head (upper, dominant) -->
  <g filter="url(#softShadow)">
    <!-- Bear head -->
    <ellipse cx="315" cy="230" rx="55" ry="50" fill="url(#bearFur)"/>
    <ellipse cx="315" cy="228" rx="50" ry="44" fill="#f8fafc" opacity="0.5"/>

    <!-- Ears -->
    <ellipse cx="285" cy="190" rx="14" ry="16" fill="url(#bearFur)"/>
    <ellipse cx="285" cy="192" rx="10" ry="12" fill="#d8dde4"/>
    <ellipse cx="345" cy="190" rx="14" ry="16" fill="url(#bearFur)"/>
    <ellipse cx="345" cy="192" rx="10" ry="12" fill="#d8dde4"/>

    <!-- Ear inner -->
    <ellipse cx="285" cy="192" rx="6" ry="7" fill="#e8d0c0" opacity="0.6"/>
    <ellipse cx="345" cy="192" rx="6" ry="7" fill="#e8d0c0" opacity="0.6"/>

    <!-- Snout -->
    <ellipse cx="315" cy="250" rx="28" ry="22" fill="#f0f4f8"/>
    <ellipse cx="315" cy="252" rx="24" ry="18" fill="#f8fafc"/>

    <!-- Nose -->
    <ellipse cx="315" cy="258" rx="10" ry="7" fill="url(#noseGrad)"/>

    <!-- Mouth -->
    <path d="M308,262 Q315,268 322,262" stroke="#5a4a3a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M310,266 Q315,270 320,266" stroke="#5a4a3a" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.5"/>

    <!-- Eyes - bear eyes, slightly mischievous -->
    <g>
      <ellipse cx="295" cy="225" rx="5" ry="5.5" fill="#1a1a1a"/>
      <circle cx="296" cy="224" r="1.8" fill="#3a3a3a"/>
      <circle cx="297" cy="223" r="0.7" fill="#fff"/>
      <ellipse cx="335" cy="225" rx="5" ry="5.5" fill="#1a1a1a"/>
      <circle cx="336" cy="224" r="1.8" fill="#3a3a3a"/>
      <circle cx="337" cy="223" r="0.7" fill="#fff"/>
    </g>

    <!-- Eyebrows (fur above eyes) -->
    <path d="M285,212 Q295,206 305,212" fill="#d0d8e0"/>
    <path d="M325,212 Q335,206 345,212" fill="#d0d8e0"/>

    <!-- Cheeks -->
    <ellipse cx="280" cy="245" rx="10" ry="7" fill="#f0d8c8" opacity="0.4"/>
    <ellipse cx="350" cy="245" rx="10" ry="7" fill="#f0d8c8" opacity="0.4"/>

    <!-- Forehead fur texture -->
    <path d="M275,210 Q285,200 295,208" stroke="#c8d0d8" stroke-width="0.8" fill="none"/>
    <path d="M295,205 Q305,195 315,203" stroke="#c8d0d8" stroke-width="0.8" fill="none"/>
    <path d="M315,203 Q325,195 335,203" stroke="#c8d0d8" stroke-width="0.8" fill="none"/>
    <path d="M335,208 Q345,200 355,210" stroke="#c8d0d8" stroke-width="0.8" fill="none"/>
  </g>

  <!-- Bear arm (reaching down to grip crown) -->
  <g>
    <!-- Left arm reaching down -->
    <path d="M270,250 C255,260 235,275 215,295 C195,315 180,335 175,350" stroke="url(#bearFur)" stroke-width="22" fill="none" stroke-linecap="round"/>
    <path d="M270,250 C255,260 235,275 215,295 C195,315 180,335 175,350" stroke="#dce4ec" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.4"/>
    <!-- Hand gripping crown -->
    <ellipse cx="172" cy="352" rx="14" ry="10" fill="url(#bearFur)" transform="rotate(-10, 172, 352)"/>
    <ellipse cx="172" cy="352" rx="10" ry="7" fill="#e8edf1" transform="rotate(-10, 172, 352)"/>
  </g>

  <!-- Bear's other arm (visible, raised) -->
  <g>
    <path d="M360,240 C375,250 395,265 410,280 C425,295 435,310 438,320" stroke="url(#bearFur)" stroke-width="20" fill="none" stroke-linecap="round"/>
    <path d="M360,240 C375,250 395,265 410,280 C425,295 435,310 438,320" stroke="#dce4ec" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.4"/>
    <ellipse cx="438" cy="322" rx="12" ry="8" fill="url(#bearFur)"/>
  </g>

  <!-- Bear neck (long, connecting head to body) -->
  <path d="M270,240 C265,260 260,280 258,300 C256,315 258,325 260,328 C262,330 265,328 265,320 C267,310 268,290 270,270 C272,250 275,235 278,230 Z" fill="url(#bearFur)"/>
  <path d="M360,240 C365,260 370,280 372,300 C374,315 372,325 370,328 C368,330 365,328 365,320 C363,310 362,290 360,270 C358,250 355,235 352,230 Z" fill="url(#bearFur)"/>

  <!-- Shadow on Qin Shi Huang from bear -->
  <ellipse cx="315" cy="420" rx="80" ry="20" fill="#000" opacity="0.1"/>

  <!-- Snow on bear's shoulders/back -->
  <path d="M255,300 Q315,280 375,300 Q380,310 375,315 Q315,330 255,315 Q250,310 255,300 Z" fill="#fff" opacity="0.3"/>
  <ellipse cx="315" cy="295" rx="50" ry="15" fill="#fff" opacity="0.2"/>

  <!-- Snow on bear's head -->
  <ellipse cx="315" cy="215" rx="40" ry="10" fill="#fff" opacity="0.25"/>

  <!-- Title / label (subtle) -->
  <g opacity="0.5">
    <text x="315" y="760" text-anchor="middle" font-family="serif" font-size="14" fill="#4a5a6a" letter-spacing="2">北极熊骑秦始皇 · Polar Bear Rides Qin Shi Huang</text>
  </g>

  <!-- Decorative border -->
  <rect x="5" y="5" width="790" height="790" fill="none" stroke="#c0c8d0" stroke-width="1" rx="4" opacity="0.3"/>
  <rect x="10" y="10" width="780" height="780" fill="none" stroke="#c0c8d0" stroke-width="0.5" rx="3" opacity="0.2"/>
</svg>
