<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="北极熊骑秦始皇">
  <title>北极熊骑秦始皇</title>
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#81d4fa"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcedc8"/>
      <stop offset="100%" stop-color="#aed581"/>
    </linearGradient>
    <linearGradient id="robeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset in="blur" dx="2" dy="4" result="offsetBlur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 天空 -->
  <rect width="800" height="600" fill="url(#skyGrad)"/>

  <!-- 太阳 -->
  <circle cx="720" cy="75" r="52" fill="#fff59d" opacity="0.95"/>
  <circle cx="720" cy="75" r="20" fill="white" opacity="0.6"/>

  <!-- 云朵 -->
  <g fill="rgba(255,255,255,0.75)">
    <ellipse cx="180" cy="130" rx="55" ry="28"/>
    <ellipse cx="230" cy="115" rx="50" ry="25"/>
    <ellipse cx="270" cy="130" rx="55" ry="28"/>
    <ellipse cx="520" cy="160" rx="60" ry="30"/>
    <ellipse cx="580" cy="150" rx="55" ry="28"/>
    <ellipse cx="630" cy="165" rx="60" ry="30"/>
  </g>

  <!-- 远山 -->
  <path d="M 0,430 L 150,300 L 300,430 L 500,320 L 650,430 L 800,430" fill="#cfd8dc" opacity="0.55"/>

  <!-- 地面 -->
  <rect x="0" y="430" width="800" height="170" fill="url(#groundGrad)"/>
  <path d="M 0,430 Q 200,424 400,430 T 800,430" fill="none" stroke="#8bc34a" stroke-width="4"/>

  <!-- 草丛 -->
  <g fill="#8bc34a" opacity="0.9">
    <path d="M 120,430 Q 125,418 132,430 Q 138,418 145,430 Z"/>
    <path d="M 660,430 Q 665,418 672,430 Q 678,418 685,430 Z"/>
    <path d="M 300,430 Q 306,420 314,430 Z"/>
  </g>

  <!-- 秦始皇（作为“座驾”，面向左，四肢着地） -->
  <g filter="url(#shadow)">
    <!-- 黑袍躯干 -->
    <path d="M 315,398 Q 315,325 375,315 Q 440,305 505,315 Q 545,325 545,398 L 540,408 Q 540,422 525,427 Q 510,432 500,427 L 490,420 Q 485,408 485,398 L 400,398 L 380,408 Q 375,422 360,427 Q 345,432 335,427 L 330,420 Q 325,408 325,398 Z"
          fill="url(#robeGrad)" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>
    <!-- 胸前金龙纹 -->
    <path d="M 395,360 Q 405,340 422,350 Q 440,360 452,345 Q 470,330 485,340"
          stroke="#fbbf24" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="422" cy="350" r="2.5" fill="#fbbf24"/>
    <circle cx="452" cy="345" r="2.5" fill="#fbbf24"/>
    <!-- 后腿左 -->
    <path d="M 455,395 L 462,440 Q 462,448 452,448 L 445,440 Z" fill="#0f172a" stroke="#334155" stroke-width="3" stroke-linejoin="round"/>
    <!-- 后腿右 -->
    <path d="M 495,395 L 502,442 Q 502,450 492,450 L 485,442 Z" fill="#0f172a" stroke="#334155" stroke-width="3" stroke-linejoin="round"/>
    <!-- 前腿左 -->
    <path d="M 345,398 L 352,440 Q 352,448 342,448 L 335,440 Z" fill="#0f172a" stroke="#334155" stroke-width="3" stroke-linejoin="round"/>
    <!-- 前腿右 -->
    <path d="M 378,398 L 385,442 Q 385,450 375,450 L 368,442 Z" fill="#0f172a" stroke="#334155" stroke-width="3" stroke-linejoin="round"/>
    <!-- 尾巴 -->
    <path d="M 505,330 Q 535,330 530,355 Q 520,360 515,350" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
    <!-- 头 -->
    <path d="M 375,335 Q 350,330 330,305 L 305,285 Q 285,280 285,305 Q 295,335 315,345 L 350,350 Z"
          fill="url(#robeGrad)" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>
    <!-- 发髻 -->
    <circle cx="348" cy="290" r="14" fill="#0f172a"/>
    <!-- 冕冠冠板 -->
    <rect x="280" y="252" width="80" height="26" rx="4" fill="#111827" stroke="#334155" stroke-width="3"/>
    <rect x="290" y="250" width="60" height="4" fill="#fbbf24"/>
    <!-- 垂饰 -->
    <line x1="315" y1="278" x2="315" y2="322" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="315" cy="326" r="5" fill="#ef4444"/>
    <!-- 额饰 -->
    <circle cx="315" cy="293" r="3" fill="#fbbf24"/>
  </g>

  <!-- 北极熊骑手 -->
  <g filter="url(#shadow)">
    <!-- 躯体 -->
    <ellipse cx="410" cy="275" rx="52" ry="42" fill="#fff" stroke="#e5e7eb" stroke-width="3"/>
    <!-- 左前爪搭在背上 -->
    <ellipse cx="368" cy="292" rx="20" ry="12" fill="#fff" stroke="#e5e7eb" stroke-width="3" transform="rotate(-15 368 292)"/>
    <!-- 右前爪搭在背上 -->
    <ellipse cx="452" cy="292" rx="20" ry="12" fill="#fff" stroke="#e5e7eb" stroke-width="3" transform="rotate(15 452 292)"/>
    <!-- 头 -->
    <circle cx="410" cy="212" r="34" fill="#fff" stroke="#e5e7eb" stroke-width="3"/>
    <!-- 耳朵 -->
    <circle cx="380" cy="188" r="15" fill="#fff" stroke="#e5e7eb" stroke-width="3"/>
    <circle cx="380" cy="188" r="7" fill="#ffcdd2"/>
    <circle cx="440" cy="188" r="15" fill="#fff" stroke="#e5e7eb" stroke-width="3"/>
    <circle cx="440" cy="188" r="7" fill="#ffcdd2"/>
    <!-- 口鼻 -->
    <ellipse cx="410" cy="220" rx="15" ry="11" fill="#fff" stroke="#e5e7eb" stroke-width="2.5"/>
    <ellipse cx="410" cy="229" rx="8" ry="6" fill="#374151"/>
    <path d="M 404,234 Q 410,237 416,234" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <!-- 闭眼笑眯眯 -->
    <path d="M 396,207 Q 400,211 404,207" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 416,207 Q 420,211 424,207" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 手中的红色垂饰 -->
    <line x1="444" y1="296" x2="452" y2="212" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="454" cy="208" r="7" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
    <circle cx="452" cy="206" r="2" fill="white"/>
  </g>

  <!-- 喜庆点缀 -->
  <g fill="#ef4444" opacity="0.85">
    <circle cx="150" cy="350" r="4"/>
    <circle cx="700" cy="360" r="4"/>
    <circle cx="100" cy="520" r="3"/>
    <circle cx="760" cy="530" r="3"/>
    <circle cx="430" cy="445" r="3"/>
  </g>
</svg>
