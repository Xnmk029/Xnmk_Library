<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000"
     font-family="KaiTi, STKaiti, 'Noto Serif SC', serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe0f2"/>
      <stop offset="0.55" stop-color="#dff0fa"/>
      <stop offset="1" stop-color="#f3fafd"/>
    </linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2547"/>
      <stop offset="1" stop-color="#151126"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c56a"/>
      <stop offset="1" stop-color="#b8892f"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dce9f2"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f8df9a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f8df9a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===== background ===== -->
  <rect x="0" y="0" width="800" height="1000" fill="url(#sky)"/>
  <circle cx="630" cy="150" r="130" fill="url(#sun)"/>
  <circle cx="630" cy="150" r="62" fill="#f3d488" opacity="0.55"/>

  <!-- distant mountains -->
  <path d="M 0 820 L 120 716 L 220 800 L 340 686 L 470 812 L 560 748 L 700 830 L 800 776 L 800 900 L 0 900 Z"
        fill="#cfe2ef" opacity="0.85"/>

  <!-- snowy ground -->
  <path d="M 0 878 Q 200 858 400 872 Q 600 886 800 866 L 800 1000 L 0 1000 Z" fill="#ffffff"/>
  <path d="M 0 878 Q 200 858 400 872 Q 600 886 800 866" fill="none" stroke="#cfe0ec" stroke-width="3"/>
  <ellipse cx="400" cy="902" rx="235" ry="20" fill="#b9cfdd" opacity="0.45"/>

  <!-- auspicious clouds -->
  <path d="M 52 246 C 48 224 74 210 94 222 C 102 200 138 200 148 224 C 174 216 194 238 182 258 C 172 274 128 278 104 270 C 76 280 54 268 52 246 Z"
        fill="#ffffff" opacity="0.8" stroke="#bcd4e4" stroke-width="2.5"/>
  <path d="M 620 300 C 616 282 638 270 655 280 C 662 262 692 262 700 282 C 722 276 738 294 728 310 C 720 324 684 327 664 320 C 640 328 622 318 620 300 Z"
        fill="#ffffff" opacity="0.75" stroke="#bcd4e4" stroke-width="2.5"/>

  <!-- back snow -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="80" cy="120" r="4"/><circle cx="160" cy="300" r="3"/><circle cx="240" cy="180" r="5"/>
    <circle cx="320" cy="90" r="3"/><circle cx="480" cy="150" r="4"/><circle cx="600" cy="260" r="3"/>
    <circle cx="700" cy="120" r="5"/><circle cx="740" cy="320" r="3"/><circle cx="100" cy="450" r="3"/>
    <circle cx="420" cy="250" r="2.5"/><circle cx="560" cy="420" r="3"/><circle cx="90" cy="350" r="2.5"/>
  </g>

  <!-- ===== polar bear (sitting on the emperor's shoulders) ===== -->
  <!-- ears -->
  <circle cx="352" cy="302" r="20" fill="url(#fur)" stroke="#8fa6b8" stroke-width="3"/>
  <circle cx="448" cy="302" r="20" fill="url(#fur)" stroke="#8fa6b8" stroke-width="3"/>
  <circle cx="352" cy="304" r="9" fill="#f2c6ce"/>
  <circle cx="448" cy="304" r="9" fill="#f2c6ce"/>

  <!-- body -->
  <path d="M 400 530 C 348 530 322 508 320 472 C 316 424 352 396 400 396 C 448 396 484 424 480 472 C 478 508 452 530 400 530 Z"
        fill="url(#fur)" stroke="#8fa6b8" stroke-width="3.5"/>
  <!-- head -->
  <ellipse cx="400" cy="342" rx="60" ry="56" fill="url(#fur)" stroke="#8fa6b8" stroke-width="3.5"/>
  <!-- muzzle -->
  <ellipse cx="400" cy="374" rx="30" ry="21" fill="#f8fcff" stroke="#b9c9d6" stroke-width="2"/>
  <!-- nose -->
  <path d="M 389 356 Q 400 348 411 356 Q 409 368 400 371 Q 391 368 389 356 Z" fill="#2b2b33"/>
  <!-- mouth -->
  <path d="M 400 371 Q 393 379 385 373 M 400 371 Q 407 379 415 373"
        fill="none" stroke="#2b2b33" stroke-width="2.5" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="374" cy="322" r="7" fill="#1c1c24"/>
  <circle cx="426" cy="322" r="7" fill="#1c1c24"/>
  <circle cx="376.5" cy="319.5" r="2.2" fill="#ffffff"/>
  <circle cx="428.5" cy="319.5" r="2.2" fill="#ffffff"/>
  <!-- blush -->
  <ellipse cx="350" cy="352" rx="10" ry="6" fill="#f7c9cf" opacity="0.55"/>
  <ellipse cx="450" cy="352" rx="10" ry="6" fill="#f7c9cf" opacity="0.55"/>
  <!-- hind paws splayed on the shoulders -->
  <g stroke="#8fa6b8" stroke-width="3">
    <ellipse cx="310" cy="540" rx="30" ry="19" fill="url(#fur)" transform="rotate(-25 310 540)"/>
    <ellipse cx="490" cy="540" rx="30" ry="19" fill="url(#fur)" transform="rotate(25 490 540)"/>
  </g>
  <ellipse cx="310" cy="544" rx="15" ry="9" fill="#e5c3c9" transform="rotate(-25 310 544)"/>
  <ellipse cx="490" cy="544" rx="15" ry="9" fill="#e5c3c9" transform="rotate(25 490 544)"/>

  <!-- ===== Qin Shi Huang ===== -->
  <!-- robe body -->
  <path d="M 400 526 C 350 526 318 548 302 580 C 264 656 216 776 184 894 L 616 894 C 584 776 536 656 498 580 C 482 548 450 526 400 526 Z"
        fill="url(#robe)" stroke="#0d0a1a" stroke-width="3.5"/>
  <!-- sleeves -->
  <path d="M 320 562 C 276 574 244 614 226 664 C 212 704 220 732 252 736 C 284 740 304 712 310 678 C 320 628 328 588 336 566 Z"
        fill="url(#robe)" stroke="#0d0a1a" stroke-width="3.5"/>
  <path d="M 480 562 C 524 574 556 614 574 664 C 588 704 580 732 548 736 C 516 740 496 712 490 678 C 480 628 472 588 464 566 Z"
        fill="url(#robe)" stroke="#0d0a1a" stroke-width="3.5"/>
  <!-- gold cuff trim -->
  <path d="M 216 696 Q 240 724 268 712" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 584 696 Q 560 724 532 712" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
  <!-- gold sleeve embroidery -->
  <path d="M 268 618 C 250 632 248 658 266 668 C 280 675 293 663 288 650"
        fill="none" stroke="#c9a24a" stroke-width="2.5"/>
  <path d="M 532 618 C 550 632 552 658 534 668 C 520 675 507 663 512 650"
        fill="none" stroke="#c9a24a" stroke-width="2.5"/>
  <!-- gold hem -->
  <path d="M 184 872 Q 400 848 616 872 L 616 894 L 184 894 Z" fill="url(#gold)" stroke="#8a6a28" stroke-width="2"/>
  <!-- collar -->
  <path d="M 400 540 L 362 596 L 400 634 L 438 596 Z" fill="#efe7d2" stroke="#c9b98a" stroke-width="2"/>
  <path d="M 398 534 L 350 598 L 366 608 L 400 552 Z" fill="url(#gold)"/>
  <path d="M 402 534 L 450 598 L 434 608 L 400 552 Z" fill="url(#gold)"/>
  <!-- belt with jade plaques -->
  <path d="M 268 662 Q 400 642 532 662 L 538 700 Q 400 678 262 700 Z" fill="url(#gold)" stroke="#8a6a28" stroke-width="2.5"/>
  <ellipse cx="330" cy="682" rx="13" ry="12" fill="#7fae8f" stroke="#4e7a5e" stroke-width="2"/>
  <ellipse cx="400" cy="675" rx="13" ry="12" fill="#7fae8f" stroke="#4e7a5e" stroke-width="2"/>
  <ellipse cx="470" cy="682" rx="13" ry="12" fill="#7fae8f" stroke="#4e7a5e" stroke-width="2"/>
  <circle cx="365" cy="680" r="4" fill="#8a6a28"/>
  <circle cx="435" cy="680" r="4" fill="#8a6a28"/>
  <!-- jade pendant -->
  <line x1="330" y1="694" x2="330" y2="714" stroke="#8a6a28" stroke-width="2.5"/>
  <circle cx="330" cy="724" r="11" fill="#7fae8f" stroke="#4e7a5e" stroke-width="2"/>
  <circle cx="330" cy="745" r="5" fill="#7fae8f" stroke="#4e7a5e" stroke-width="1.5"/>
  <!-- centre placket -->
  <line x1="400" y1="634" x2="400" y2="858" stroke="#c9a24a" stroke-width="2"/>
  <circle cx="400" cy="700" r="3.5" fill="#c9a24a"/>
  <circle cx="400" cy="760" r="3.5" fill="#c9a24a"/>
  <circle cx="400" cy="820" r="3.5" fill="#c9a24a"/>

  <!-- neck and head -->
  <rect x="376" y="500" width="48" height="46" fill="#dfae87"/>
  <ellipse cx="400" cy="478" rx="44" ry="52" fill="#f2cba6" stroke="#c69a72" stroke-width="2"/>
  <ellipse cx="356" cy="484" rx="8" ry="13" fill="#f2cba6" stroke="#c69a72" stroke-width="2"/>
  <ellipse cx="444" cy="484" rx="8" ry="13" fill="#f2cba6" stroke="#c69a72" stroke-width="2"/>
  <!-- sideburns -->
  <path d="M 358 446 L 355 488 L 367 468 Z" fill="#1a1a1a"/>
  <path d="M 442 446 L 445 488 L 433 468 Z" fill="#1a1a1a"/>
  <!-- eyes -->
  <ellipse cx="382" cy="474" rx="6" ry="7" fill="#1a1a1a"/>
  <ellipse cx="418" cy="474" rx="6" ry="7" fill="#1a1a1a"/>
  <circle cx="384" cy="471.5" r="1.8" fill="#ffffff"/>
  <circle cx="420" cy="471.5" r="1.8" fill="#ffffff"/>
  <!-- eyebrows -->
  <path d="M 370 458 Q 382 451 394 457" fill="none" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 430 458 Q 418 451 406 457" fill="none" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- nose -->
  <path d="M 400 480 L 395 494 Q 400 499 405 494" fill="none" stroke="#b57f5a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- moustache -->
  <path d="M 378 504 Q 389 512 400 506 Q 411 512 422 504" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <!-- mouth -->
  <path d="M 392 514 Q 400 518 408 514" fill="none" stroke="#a06a4e" stroke-width="2" stroke-linecap="round"/>
  <!-- goatee -->
  <path d="M 382 526 Q 400 518 418 526 Q 414 560 400 572 Q 386 560 382 526 Z" fill="#1c1c26"/>

  <!-- mian guan (imperial crown) -->
  <path d="M 354 452 C 352 422 372 414 400 414 C 428 414 448 422 446 452 C 424 460 376 460 354 452 Z"
        fill="#171226" stroke="#3a3355" stroke-width="2.5"/>
  <rect x="336" y="402" width="128" height="14" rx="3" fill="#0f0c1c" stroke="#4a4270" stroke-width="2"/>
  <line x1="338" y1="405" x2="462" y2="405" stroke="#c9a24a" stroke-width="2"/>
  <!-- bead strands (mian liu) -->
  <g stroke="#8a6a28" stroke-width="1">
    <line x1="348" y1="416" x2="348" y2="462"/>
    <line x1="368" y1="416" x2="368" y2="462"/>
    <line x1="388" y1="416" x2="388" y2="462"/>
    <line x1="408" y1="416" x2="408" y2="462"/>
    <line x1="428" y1="416" x2="428" y2="462"/>
    <line x1="448" y1="416" x2="448" y2="462"/>
  </g>
  <g>
    <circle cx="348" cy="420" r="2.6" fill="#e8c56a"/><circle cx="348" cy="432" r="2.6" fill="#7fae8f"/>
    <circle cx="348" cy="444" r="2.6" fill="#e8c56a"/><circle cx="348" cy="456" r="2.6" fill="#7fae8f"/>
    <circle cx="368" cy="420" r="2.6" fill="#7fae8f"/><circle cx="368" cy="432" r="2.6" fill="#e8c56a"/>
    <circle cx="368" cy="444" r="2.6" fill="#7fae8f"/><circle cx="368" cy="456" r="2.6" fill="#e8c56a"/>
    <circle cx="388" cy="420" r="2.6" fill="#e8c56a"/><circle cx="388" cy="432" r="2.6" fill="#7fae8f"/>
    <circle cx="388" cy="444" r="2.6" fill="#e8c56a"/><circle cx="388" cy="456" r="2.6" fill="#7fae8f"/>
    <circle cx="408" cy="420" r="2.6" fill="#7fae8f"/><circle cx="408" cy="432" r="2.6" fill="#e8c56a"/>
    <circle cx="408" cy="444" r="2.6" fill="#7fae8f"/><circle cx="408" cy="456" r="2.6" fill="#e8c56a"/>
    <circle cx="428" cy="420" r="2.6" fill="#e8c56a"/><circle cx="428" cy="432" r="2.6" fill="#7fae8f"/>
    <circle cx="428" cy="444" r="2.6" fill="#e8c56a"/><circle cx="428" cy="456" r="2.6" fill="#7fae8f"/>
    <circle cx="448" cy="420" r="2.6" fill="#7fae8f"/><circle cx="448" cy="432" r="2.6" fill="#e8c56a"/>
    <circle cx="448" cy="444" r="2.6" fill="#7fae8f"/><circle cx="448" cy="456" r="2.6" fill="#e8c56a"/>
  </g>

  <!-- bear's front paws hanging over the chest (in front of robe and head) -->
  <path d="M 316 452 C 304 480 300 520 306 548 C 312 568 342 570 348 550 C 352 524 348 484 342 454 Z"
        fill="url(#fur)" stroke="#8fa6b8" stroke-width="3"/>
  <path d="M 484 452 C 496 480 500 520 494 548 C 488 568 458 570 452 550 C 448 524 452 484 458 454 Z"
        fill="url(#fur)" stroke="#8fa6b8" stroke-width="3"/>
  <ellipse cx="327" cy="552" rx="13" ry="10" fill="#e5c3c9"/>
  <ellipse cx="473" cy="552" rx="13" ry="10" fill="#e5c3c9"/>
  <circle cx="316" cy="542" r="4.5" fill="#e5c3c9"/>
  <circle cx="327" cy="538" r="4.5" fill="#e5c3c9"/>
  <circle cx="338" cy="542" r="4.5" fill="#e5c3c9"/>
  <circle cx="484" cy="542" r="4.5" fill="#e5c3c9"/>
  <circle cx="473" cy="538" r="4.5" fill="#e5c3c9"/>
  <circle cx="462" cy="542" r="4.5" fill="#e5c3c9"/>

  <!-- front snow -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="200" cy="560" r="4"/><circle cx="60" cy="650" r="3"/><circle cx="700" cy="520" r="4"/>
    <circle cx="760" cy="620" r="3"/><circle cx="280" cy="760" r="3"/><circle cx="520" cy="820" r="4"/>
    <circle cx="650" cy="900" r="3"/><circle cx="150" cy="880" r="3"/>
  </g>
  <g stroke="#ffffff" stroke-width="2.5" opacity="0.9">
    <line x1="238" y1="420" x2="262" y2="420"/><line x1="250" y1="408" x2="250" y2="432"/>
    <line x1="608" y1="700" x2="632" y2="700"/><line x1="620" y1="688" x2="620" y2="712"/>
  </g>

  <!-- title and seal -->
  <text x="56" y="92" font-size="44" fill="#3b2f22">北极熊骑秦始皇</text>
  <rect x="56" y="112" width="48" height="48" rx="5" fill="#b8352c"/>
  <text x="80" y="148" font-size="30" fill="#ffffff" text-anchor="middle">御</text>
</svg>
