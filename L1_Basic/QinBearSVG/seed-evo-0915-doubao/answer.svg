<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960" role="img" aria-label="北极熊骑秦始皇">
  <title>北极熊骑秦始皇</title>
  <desc>A polar bear rides Qin Shi Huang, who crawls on all fours as the mount. Flat vector illustration.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe6f4"/>
      <stop offset="0.62" stop-color="#e6f1f8"/>
      <stop offset="1" stop-color="#f5f9fc"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f9fd"/>
      <stop offset="1" stop-color="#e4eef7"/>
    </linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d424f"/>
      <stop offset="1" stop-color="#232733"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2c14e" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f2c14e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- ============ 背景 ============ -->
  <rect x="0" y="0" width="960" height="960" fill="url(#sky)"/>
  <circle cx="724" cy="196" r="110" fill="url(#sun)"/>
  <circle cx="724" cy="196" r="46" fill="#f5cd66"/>

  <!-- 咸阳宫剪影（右） -->
  <g fill="#8ca9bd" opacity="0.55">
    <rect x="706" y="556" width="158" height="74"/>
    <rect x="732" y="500" width="106" height="58"/>
    <rect x="762" y="452" width="52" height="50"/>
    <polygon points="694,560 876,560 856,534 714,534"/>
    <polygon points="722,504 848,504 830,478 740,478"/>
    <polygon points="752,456 824,456 812,432 764,432"/>
    <rect x="782" y="410" width="8" height="24"/>
    <circle cx="786" cy="404" r="7" fill="#f2c14e" opacity="0.85"/>
  </g>

  <!-- 兵马俑列队剪影（左） -->
  <g fill="#7f9cb1" opacity="0.6">
    <g transform="translate(86,536)">
      <rect x="0" y="26" width="20" height="56" rx="6"/>
      <circle cx="10" cy="14" r="13"/>
      <rect x="6" y="-6" width="8" height="12" rx="2"/>
      <rect x="-14" y="30" width="8" height="46" rx="3"/>
    </g>
    <g transform="translate(148,516)">
      <rect x="0" y="30" width="22" height="66" rx="6"/>
      <circle cx="11" cy="15" r="14"/>
      <rect x="7" y="-6" width="8" height="13" rx="2"/>
      <rect x="24" y="34" width="8" height="56" rx="3"/>
    </g>
    <g transform="translate(210,544)">
      <rect x="0" y="24" width="19" height="50" rx="6"/>
      <circle cx="9.5" cy="13" r="12"/>
      <rect x="6" y="-5" width="7" height="11" rx="2"/>
    </g>
  </g>

  <!-- 雪原 -->
  <path d="M0,648 C140,622 320,636 480,640 C660,644 820,628 960,646 L960,960 L0,960 Z" fill="url(#ground)"/>
  <path d="M60,842 Q200,830 340,840" stroke="#c8dcec" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M600,862 Q740,850 880,860" stroke="#c8dcec" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M420,892 Q520,884 620,890" stroke="#cfdfee" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- 雪花 -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="120" cy="140" r="4"/><circle cx="240" cy="90" r="3"/><circle cx="360" cy="160" r="3.5"/>
    <circle cx="520" cy="80" r="3"/><circle cx="620" cy="180" r="4"/><circle cx="840" cy="120" r="3.5"/>
    <circle cx="70" cy="300" r="3"/><circle cx="880" cy="300" r="4"/><circle cx="440" cy="60" r="2.5"/>
    <circle cx="300" cy="230" r="2.5"/><circle cx="760" cy="70" r="2.5"/><circle cx="160" cy="420" r="3"/>
    <circle cx="890" cy="480" r="3"/><circle cx="560" cy="300" r="2.5"/>
  </g>

  <!-- 角色接触阴影 -->
