  <!-- ============ 秦始皇（被骑，四足爬行，面朝左） ============ -->
  <g id="qin">
    <!-- 后左腿（膝跪地，在躯干后方） -->
    <path d="M628,606 C676,634 706,676 700,716 C697,742 678,760 648,762 L616,762 C610,736 616,712 610,690 C602,664 592,636 600,612 Z" fill="#252a35"/>
    <path d="M606,752 C634,746 668,748 690,754 L690,772 L604,772 Z" fill="#1d212b"/>
    <path d="M596,744 C626,738 664,740 688,746 L688,758 L598,758 Z" fill="#b03a3a"/>

    <!-- 躯干：黑帝袍，背平供骑乘 -->
    <path d="M282,560 C322,520 400,506 480,510 C560,514 640,530 668,566 C692,598 688,652 660,690 C600,720 480,726 380,714 C322,706 284,676 272,634 C264,606 266,580 282,560 Z" fill="url(#robe)"/>
    <!-- 袍摆垂布 -->
    <path d="M420,700 C460,714 540,716 600,704 C596,726 588,744 576,756 C520,768 452,764 410,748 C406,730 410,714 420,700 Z" fill="#2a2f3b"/>
    <path d="M430,724 C470,736 540,738 588,728 L584,744 C534,754 470,752 426,740 Z" fill="#b03a3a"/>
    <path d="M448,742 L452,754 M490,748 L492,760 M532,748 L532,760 M570,742 L568,754" stroke="#d8a24a" stroke-width="3" stroke-linecap="round"/>

    <!-- 袍服缘饰（领口/肩侧红缘 + 金线） -->
    <path d="M286,566 C318,532 386,514 452,512" stroke="#b03a3a" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M286,566 C318,532 386,514 452,512" stroke="#d8a24a" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="14 10"/>
    <path d="M560,516 C612,524 650,540 668,566" stroke="#b03a3a" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M560,516 C612,524 650,540 668,566" stroke="#d8a24a" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="12 9"/>

    <!-- 前右腿（近侧，撑地） -->
    <path d="M606,596 C648,612 672,652 668,700 C665,732 654,756 640,762 L594,762 C586,736 590,712 584,688 C576,656 574,620 606,596 Z" fill="#2e3340"/>
    <path d="M590,748 C620,742 652,744 672,750 L672,770 L586,770 Z" fill="#232733"/>
    <path d="M584,738 C614,732 648,734 670,740 L670,752 L586,752 Z" fill="#b03a3a"/>

    <!-- 绶带 + 玉佩（腰部，悬于体侧） -->
    <circle cx="408" cy="540" r="13" fill="none" stroke="#d8a24a" stroke-width="4"/>
    <circle cx="408" cy="540" r="4" fill="#d8a24a"/>
    <path d="M404,552 C398,584 402,622 396,652" stroke="#b03a3a" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M416,552 C414,588 420,624 414,656" stroke="#962f2f" stroke-width="11" fill="none" stroke-linecap="round"/>
    <path d="M404,552 C398,584 402,622 396,652" stroke="#d8a24a" stroke-width="3" fill="none" stroke-dasharray="10 8"/>
    <path d="M416,552 C414,588 420,624 414,656" stroke="#d8a24a" stroke-width="2.5" fill="none" stroke-dasharray="8 8"/>
    <circle cx="405" cy="670" r="14" fill="#7fb69e" stroke="#d8a24a" stroke-width="4"/>
    <circle cx="405" cy="670" r="4.5" fill="#e9f3ee"/>
    <path d="M398,684 L396,700 M405,686 L405,704 M412,684 L414,700" stroke="#d8a24a" stroke-width="3" stroke-linecap="round"/>

    <!-- 前左臂（远侧） -->
    <path d="M316,606 C288,640 266,686 260,724 C257,742 264,756 280,758 L310,758 C314,728 322,700 332,672 C340,648 342,622 316,606 Z" fill="#252a35"/>
    <ellipse cx="288" cy="758" rx="26" ry="12" fill="#d9a877"/>
    <!-- 前右臂（近侧，撑地） -->
    <path d="M336,590 C300,616 272,660 260,704 C252,732 254,752 268,758 L306,758 C312,724 324,696 338,668 C350,640 356,608 336,590 Z" fill="#333947"/>
    <path d="M306,610 C284,634 268,668 260,700" stroke="#b03a3a" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="286" cy="760" rx="30" ry="13" fill="#e0b184"/>
    <path d="M262,758 Q270,748 282,746 M292,746 Q304,748 312,756" stroke="#b98a5e" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- 头部（面朝左，下脸受力） -->
    <g id="head">
      <circle cx="252" cy="500" r="48" fill="#e0b184"/>
      <!-- 耳朵（右后侧） -->
      <ellipse cx="288" cy="508" rx="10" ry="14" fill="#d9a877"/>
      <!-- 眉：锐利下压 -->
      <path d="M212,478 L246,470" stroke="#2c2418" stroke-width="7" stroke-linecap="round"/>
      <path d="M258,468 L282,476" stroke="#2c2418" stroke-width="7" stroke-linecap="round"/>
      <!-- 眼：锐目 -->
      <path d="M214,492 Q230,484 246,490 Q230,498 214,492 Z" fill="#fdfdfd"/>
      <circle cx="229" cy="490" r="5" fill="#1c1a16"/>
      <circle cx="231" cy="488" r="1.6" fill="#ffffff"/>
      <path d="M256,488 Q268,482 280,488 Q268,494 256,488 Z" fill="#fdfdfd"/>
      <circle cx="267" cy="487" r="4.5" fill="#1c1a16"/>
      <!-- 鼻 -->
      <path d="M212,502 Q204,512 212,518" stroke="#c08d5f" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- 胡须（短须） -->
      <path d="M214,524 C204,534 202,546 208,556 C216,566 234,570 248,566 C240,556 232,544 230,532 Z" fill="#2c2418"/>
      <path d="M222,518 Q214,522 212,530" stroke="#2c2418" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M246,522 Q254,528 254,538" stroke="#2c2418" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- 嘴：咬牙用力 -->
      <path d="M216,532 Q230,540 246,536" stroke="#7c4a2d" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- 汗珠 -->
      <path d="M296,478 C300,486 303,492 297,496 C291,492 293,486 296,478 Z" fill="#7fc4e8"/>
      <path d="M306,502 C310,509 312,514 307,517 C302,514 303,508 306,502 Z" fill="#8fd0ef"/>
      <!-- 发际线 -->
      <path d="M214,464 C226,446 262,438 286,452 C292,456 296,462 298,468 C280,458 246,456 228,466 Z" fill="#221d15"/>
    </g>

    <!-- 冕冠（板向后倾） -->
    <g id="mian" transform="rotate(-16 252 452)">
      <rect x="190" y="428" width="128" height="18" rx="5" fill="#191d24" stroke="#d8a24a" stroke-width="2.5"/>
      <rect x="190" y="428" width="128" height="6" rx="3" fill="#b03a3a"/>
      <rect x="196" y="446" width="8" height="8" fill="#191d24"/>
      <rect x="304" y="446" width="8" height="8" fill="#191d24"/>
      <!-- 旒：前 -->
      <g stroke-linecap="round">
        <line x1="200" y1="430" x2="200" y2="474" stroke="#d8a24a" stroke-width="2"/>
        <line x1="212" y1="430" x2="212" y2="478" stroke="#d8a24a" stroke-width="2"/>
        <line x1="224" y1="430" x2="224" y2="480" stroke="#d8a24a" stroke-width="2"/>
        <line x1="236" y1="430" x2="236" y2="478" stroke="#d8a24a" stroke-width="2"/>
        <line x1="248" y1="430" x2="248" y2="476" stroke="#d8a24a" stroke-width="2"/>
        <line x1="260" y1="430" x2="260" y2="472" stroke="#d8a24a" stroke-width="2"/>
      </g>
      <g fill="#f4f0e4">
        <circle cx="200" cy="438" r="2.6"/><circle cx="200" cy="448" r="2.6"/><circle cx="200" cy="458" r="2.6"/><circle cx="200" cy="470" r="3"/>
        <circle cx="212" cy="438" r="2.6"/><circle cx="212" cy="448" r="2.6"/><circle cx="212" cy="458" r="2.6"/><circle cx="212" cy="470" r="2.6"/><circle cx="212" cy="478" r="3"/>
        <circle cx="224" cy="438" r="2.6"/><circle cx="224" cy="449" r="2.6"/><circle cx="224" cy="460" r="2.6"/><circle cx="224" cy="471" r="2.6"/><circle cx="224" cy="480" r="3"/>
        <circle cx="236" cy="438" r="2.6"/><circle cx="236" cy="448" r="2.6"/><circle cx="236" cy="458" r="2.6"/><circle cx="236" cy="468" r="2.6"/><circle cx="236" cy="478" r="3"/>
        <circle cx="248" cy="438" r="2.6"/><circle cx="248" cy="447" r="2.6"/><circle cx="248" cy="456" r="2.6"/><circle cx="248" cy="465" r="2.6"/><circle cx="248" cy="476" r="3"/>
        <circle cx="260" cy="438" r="2.6"/><circle cx="260" cy="446" r="2.6"/><circle cx="260" cy="454" r="2.6"/><circle cx="260" cy="462" r="2.6"/><circle cx="260" cy="472" r="3"/>
      </g>
      <!-- 旒：后 -->
      <g stroke-linecap="round">
        <line x1="272" y1="430" x2="272" y2="470" stroke="#d8a24a" stroke-width="2"/>
        <line x1="284" y1="430" x2="284" y2="472" stroke="#d8a24a" stroke-width="2"/>
        <line x1="296" y1="430" x2="296" y2="472" stroke="#d8a24a" stroke-width="2"/>
        <line x1="308" y1="430" x2="308" y2="468" stroke="#d8a24a" stroke-width="2"/>
      </g>
      <g fill="#f4f0e4">
        <circle cx="272" cy="438" r="2.6"/><circle cx="272" cy="447" r="2.6"/><circle cx="272" cy="456" r="2.6"/><circle cx="272" cy="470" r="3"/>
        <circle cx="284" cy="438" r="2.6"/><circle cx="284" cy="447" r="2.6"/><circle cx="284" cy="456" r="2.6"/><circle cx="284" cy="465" r="2.6"/><circle cx="284" cy="472" r="3"/>
        <circle cx="296" cy="438" r="2.6"/><circle cx="296" cy="447" r="2.6"/><circle cx="296" cy="456" r="2.6"/><circle cx="296" cy="465" r="2.6"/><circle cx="296" cy="472" r="3"/>
        <circle cx="308" cy="438" r="2.6"/><circle cx="308" cy="446" r="2.6"/><circle cx="308" cy="454" r="2.6"/><circle cx="308" cy="468" r="3"/>
      </g>
    </g>

    <!-- 领口铜环（拴缰绳） -->
    <path d="M300,556 C314,540 336,532 356,536" stroke="#b03a3a" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="344" cy="546" r="11" fill="none" stroke="#c98f3b" stroke-width="6"/>
  </g>

  <!-- ============ 北极熊（骑乘者，跨坐背上） ============ -->
  <g id="bear">
    <!-- 压痕（重量感） -->
    <ellipse cx="470" cy="522" rx="120" ry="18" fill="#141821" opacity="0.45"/>

    <!-- 远侧后腿（在躯干背侧） -->
    <path d="M560,470 C610,478 648,506 662,542 C670,564 666,584 650,592 C618,600 580,586 556,560 C540,540 536,500 560,470 Z" fill="#e3e8ee"/>
    <path d="M620,556 C640,562 654,574 656,588 C640,596 614,592 600,580 C606,568 612,560 620,556 Z" fill="#eef2f6"/>

    <!-- 臀部/躯干团块（坐在背上） -->
    <path d="M368,470 C352,420 366,370 410,340 C460,306 540,300 600,326 C656,350 688,398 684,452 C680,506 640,540 580,552 C510,566 420,548 388,514 C374,498 366,486 368,470 Z" fill="#f4f6f8"/>
    <!-- 躯干体积阴影（腹部、背缘） -->
    <path d="M392,496 C440,528 540,540 610,516 C590,540 530,556 470,548 C428,542 400,524 392,496 Z" fill="#dde3ea"/>
    <path d="M596,330 C646,352 680,394 682,446 C664,420 630,392 590,378 C576,354 580,340 596,330 Z" fill="#e2e7ee"/>
    <path d="M372,452 C366,420 378,384 404,360 C392,392 390,428 398,458 C388,462 378,458 372,452 Z" fill="#e2e7ee"/>

    <!-- 远侧前腿（绕过躯干另一侧） -->
    <path d="M320,472 C296,502 284,540 288,576 C290,596 300,608 316,608 C340,606 356,584 360,556 C364,526 358,496 340,476 Z" fill="#dfe5ec"/>
    <!-- 远侧脚掌（踩地） -->
    <ellipse cx="306" cy="612" rx="42" ry="17" fill="#e8edf2"/>
    <ellipse cx="290" cy="606" rx="7" ry="5" fill="#c9a35a" opacity="0.9"/>
    <ellipse cx="306" cy="610" rx="7" ry="5" fill="#c9a35a" opacity="0.9"/>
    <ellipse cx="322" cy="606" rx="7" ry="5" fill="#c9a35a" opacity="0.9"/>

    <!-- 近侧后腿（踏在胯侧） -->
    <path d="M588,486 C630,496 664,524 676,560 C684,584 678,606 658,612 C624,618 584,600 562,570 C546,548 548,508 588,486 Z" fill="#f0f3f7"/>
    <path d="M642,584 C664,588 678,600 678,614 C660,622 632,616 618,602 C624,592 632,586 642,584 Z" fill="#f7f9fb"/>
    <!-- 近侧后掌 -->
    <ellipse cx="648" cy="620" rx="44" ry="18" fill="#f2f5f9"/>
    <ellipse cx="630" cy="614" rx="7.5" ry="5.5" fill="#c9a35a"/>
    <ellipse cx="648" cy="618" rx="7.5" ry="5.5" fill="#c9a35a"/>
    <ellipse cx="666" cy="614" rx="7.5" ry="5.5" fill="#c9a35a"/>

    <!-- 尾巴 -->
    <circle cx="668" cy="470" r="18" fill="#eef1f5"/>
    <circle cx="668" cy="470" r="9" fill="#e2e7ee"/>

    <!-- 颈（长，伸向前上方后回头） -->
    <path d="M404,376 C380,340 362,300 356,258 C352,226 358,200 378,188 C402,176 430,186 442,210 C452,232 450,262 444,292 C438,326 430,356 420,382 Z" fill="#f4f6f8"/>
    <path d="M424,230 C436,256 438,288 432,318 C428,342 420,364 412,380 C404,344 404,300 412,262 C416,246 420,236 424,230 Z" fill="#e2e7ee"/>

    <!-- 头（回头左望，圆耳） -->
    <g id="bear-head">
      <circle cx="368" cy="178" r="58" fill="#f7f9fb"/>
      <!-- 耳 -->
      <circle cx="330" cy="132" r="17" fill="#f2f5f9"/>
      <circle cx="330" cy="132" r="8" fill="#d8dee6"/>
      <circle cx="404" cy="128" r="17" fill="#f2f5f9"/>
      <circle cx="404" cy="128" r="8" fill="#d8dee6"/>
      <!-- 吻部 -->
      <ellipse cx="330" cy="204" rx="30" ry="22" fill="#f2f5f9"/>
      <ellipse cx="312" cy="196" rx="10" ry="8" fill="#2b2b30"/>
      <path d="M314,208 Q324,218 338,214" stroke="#2b2b30" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M314,208 Q306,214 302,222" stroke="#2b2b30" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- 眼：得意俯视 -->
      <path d="M340,166 Q354,158 368,164" stroke="#2b2b30" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <circle cx="354" cy="172" r="6" fill="#26262b"/>
      <circle cx="356" cy="170" r="2" fill="#ffffff"/>
      <circle cx="396" cy="168" r="6" fill="#26262b"/>
      <circle cx="398" cy="166" r="2" fill="#ffffff"/>
      <path d="M384,158 Q398,152 410,158" stroke="#2b2b30" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <!-- 咧嘴 -->
      <path d="M306,228 Q330,242 356,232" stroke="#2b2b30" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>

    <!-- 近侧前腿：垂落胸前，大掌踩始皇肩甲 -->
    <path d="M396,398 C372,428 356,468 352,506 C350,528 356,544 372,548 C396,552 414,532 420,504 C426,472 424,436 416,410 Z" fill="#f0f3f7"/>
    <!-- 大厚掌 -->
    <ellipse cx="364" cy="552" rx="46" ry="26" fill="#f4f6f9" transform="rotate(-14 364 552)"/>
    <ellipse cx="336" cy="540" rx="8" ry="6" fill="#c9a35a"/>
    <ellipse cx="352" cy="532" rx="8" ry="6" fill="#c9a35a"/>
    <ellipse cx="370" cy="530" rx="8" ry="6" fill="#c9a35a"/>
    <ellipse cx="388" cy="536" rx="8" ry="6" fill="#c9a35a"/>
    <path d="M330,566 Q360,578 396,566" stroke="#d3dae2" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- 右前肢：高扬抓缰 -->
    <path d="M560,360 C590,332 606,296 604,258 C602,236 594,222 578,220 C556,218 540,238 536,266 C532,298 538,334 548,362 Z" fill="#f0f3f7"/>
    <path d="M576,224 C596,222 610,236 612,256 C614,278 606,300 594,316 C584,296 578,264 576,224 Z" fill="#e6ebf1"/>
    <!-- 抓握的爪 -->
    <g transform="rotate(18 588 218)">
