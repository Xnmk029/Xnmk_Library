<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>蒙娜丽莎 - 纯SVG笔触复刻</title>
<style>
body{margin:0;background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh}
svg{max-height:98vh;box-shadow:0 0 60px rgba(0,0,0,.8)}
</style>
</head>
<body>
<svg id="canvas" xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<rect width="1200" height="1600" fill="#2A1F14"/>
</svg>
<script>
const svg=document.getElementById('canvas');
const NS='http://www.w3.org/2000/svg';
// Seeded random for reproducibility
let seed=42;
function rng(){seed=(seed*16807+0)%2147483647;return(seed-1)/2147483646;}
function rr(a,b){return a+(b-a)*rng();}
function pick(arr){return arr[Math.floor(rng()*arr.length)];}

// Brush stroke: tapered curved path
function stroke(x,y,len,angle,width,color,opacity){
  const dx=Math.cos(angle),dy=Math.sin(angle);
  const cx=x+dx*len*0.5+rr(-3,3),cy=y+dy*len*0.5+rr(-3,3);
  const ex=x+dx*len+rr(-2,2),ey=y+dy*len+rr(-2,2);
  const w=width*(0.6+rng()*0.8);
  const p=document.createElementNS(NS,'path');
  p.setAttribute('d',`M${x.toFixed(1)},${y.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}`);
  p.setAttribute('stroke',color);
  p.setAttribute('stroke-width',w.toFixed(2));
  p.setAttribute('stroke-linecap','round');
  p.setAttribute('fill','none');
  p.setAttribute('opacity',(opacity*(0.5+rng()*0.5)).toFixed(3));
  svg.appendChild(p);
}

// Color jitter: shift hue/lightness slightly
function jitter(hex,dl,dr,dg,db){
  let r=parseInt(hex.slice(1,3),16)+rr(-dr,dr);
  let g=parseInt(hex.slice(3,5),16)+rr(-dg,dg);
  let b=parseInt(hex.slice(5,7),16)+rr(-db,db);
  r=Math.max(0,Math.min(255,r+rr(-dl,dl)));
  g=Math.max(0,Math.min(255,g+rr(-dl,dl)));
  b=Math.max(0,Math.min(255,b+rr(-dl,dl)));
  return`#${(r|0).toString(16).padStart(2,'0')}${(g|0).toString(16).padStart(2,'0')}${(b|0).toString(16).padStart(2,'0')}`;
}

// Paint a region with directional strokes
function paintRegion(points,colors,angleFn,density,lenRange,widthRange,opacity){
  const minX=Math.min(...points.map(p=>p[0])),maxX=Math.max(...points.map(p=>p[0]));
  const minY=Math.min(...points.map(p=>p[1])),maxY=Math.max(...points.map(p=>p[1]));
  const area=(maxX-minX)*(maxY-minY)*0.5;
  const count=Math.floor(area*density);
  for(let i=0;i<count;i++){
    const x=rr(minX,maxX),y=rr(minY,maxY);
    if(!inPoly(x,y,points))continue;
    const angle=angleFn(x,y);
    const color=jitter(pick(colors),8,12,12,10);
    stroke(x,y,rr(lenRange[0],lenRange[1]),angle+rr(-0.3,0.3),rr(widthRange[0],widthRange[1]),color,opacity);
  }
}

function inPoly(x,y,pts){
  let inside=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];
    if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))inside=!inside;
  }
  return inside;
}

// Ellipse region painter
function paintEllipse(cx,cy,rx,ry,colors,angleFn,density,lenRange,widthRange,opacity,rot=0){
  const count=Math.floor(Math.PI*rx*ry*density);
  for(let i=0;i<count;i++){
    const a=rr(0,Math.PI*2),r=Math.sqrt(rng());
    let px=r*rx*Math.cos(a),py=r*ry*Math.sin(a);
    if(rot){const c=Math.cos(rot),s=Math.sin(rot);const nx=px*c-py*s;py=px*s+py*c;px=nx;}
    const x=cx+px,y=cy+py;
    const angle=angleFn(x,y);
    const color=jitter(pick(colors),8,12,12,10);
    stroke(x,y,rr(lenRange[0],lenRange[1]),angle+rr(-0.25,0.25),rr(widthRange[0],widthRange[1]),color,opacity);
  }
}

// === LAYER 1: BACKGROUND - Sky and distant mountains ===
// Sky gradient (top to horizon)
for(let y=0;y<620;y+=4){
  const t=y/620;
  const colors=t<0.4?['#4A5A52','#3E5048','#526258','#48584E']:
    t<0.7?['#5A6B5A','#6B7B62','#4E6050','#5E7058']:
    ['#6B7B5E','#7A8A62','#5E7048','#6E8055'];
  for(let x=0;x<1200;x+=rr(6,10)){
    const angle=rr(-0.2,0.2)+Math.sin(x*0.005)*0.1;
    const c=jitter(pick(colors),6,8,8,6);
    stroke(x,y+rr(-2,2),rr(12,22),angle,rr(2.5,4.5),c,0.55+t*0.15);
  }
}

// Distant mountains (blue-green, atmospheric)
function mountain(baseY,peakY,x1,x2,colors){
  for(let y=peakY;y<baseY;y+=3){
    const t=(y-peakY)/(baseY-peakY);
    const w=(x2-x1)*(0.3+t*0.7);
    const cx=(x1+x2)/2;
    for(let x=cx-w/2;x<cx+w/2;x+=rr(5,8)){
      const angle=rr(-0.4,0.4)+(x-cx)*0.001;
      const c=jitter(pick(colors),5,6,8,8);
      stroke(x,y+rr(-1,1),rr(8,16),angle,rr(2,3.5),c,0.5+t*0.2);
    }
  }
}
mountain(580,280,50,350,['#5A7A72','#4A6A65','#6A8A80','#527268','#4E6E62']);
mountain(560,320,300,550,['#5E7E70','#4E7068','#6A8878','#567A6E','#4A6E60']);
mountain(590,250,700,1000,['#547470','#4A6A68','#628278','#507068','#486862']);
mountain(570,300,950,1180,['#5A7A6E','#4E7264','#668674','#527262','#4A6A5C']);

// Mid-ground landscape with winding path and river
// Left side: winding path
for(let i=0;i<400;i++){
  const t=rng();
  const px=180+Math.sin(t*4)*80+t*60;
  const py=450+t*150;
  const c=jitter(pick(['#7A7A52','#8A8858','#6A6A48','#929060']),6,10,10,6);
  stroke(px+rr(-15,15),py+rr(-5,5),rr(8,14),rr(-0.5,0.5)+t*0.3,rr(1.5,3),c,0.5);
}
// Right side: river
for(let i=0;i<350;i++){
  const t=rng();
  const px=850+Math.sin(t*3)*60+t*40;
  const py=420+t*180;
  const c=jitter(pick(['#5A8A82','#4A7A75','#6A9A90','#528278']),5,6,8,8);
  stroke(px+rr(-20,20),py+rr(-4,4),rr(10,18),0.2+rr(-0.3,0.3),rr(1.5,2.5),c,0.45);
}
// Arched bridge (right side)
for(let a=0;a<Math.PI;a+=0.08){
  const bx=920+Math.cos(a)*50;
  const by=520-Math.sin(a)*30;
  const c=jitter(pick(['#6A5A3A','#7A6A42','#5A4A30','#8A7A50']),5,8,8,5);
  stroke(bx,by,rr(6,10),a+Math.PI/2,rr(2,3),c,0.6);
}

// Near background (olive/brown transition)
paintRegion([[0,550],[1200,550],[1200,750],[0,750]],
  ['#4A4028','#5A5030','#3E3820','#6A5E38','#4E4428'],
  (x,y)=>rr(-0.3,0.3),0.012,[10,20],[2.5,4],0.6);

// === LAYER 2: FIGURE - Body/Clothing ===
// Dark clothing - main body shape
const bodyPts=[[420,520],[780,520],[820,700],[850,1100],[830,1350],[370,1350],[350,1100],[380,700]];
paintRegion(bodyPts,
  ['#2A2015','#332818','#1E1810','#3A2E1C','#251C12','#2E2416'],
  (x,y)=>{const cx=600;return Math.atan2(y-700,x-cx)*0.3+Math.PI/2+rr(-0.2,0.2);},
  0.008,[12,24],[2.5,5],0.7);

// Neckline/chest area with slight skin showing
paintEllipse(600,560,80,40,['#B08050','#C09060','#A07848','#C89868'],
  (x,y)=>rr(-0.3,0.3),0.04,[8,14],[2,3.5],0.6);

// === LAYER 3: NECK ===
paintEllipse(600,500,45,55,['#C09058','#B88850','#C89860','#A88048','#D0A068'],
  (x,y)=>Math.PI/2+rr(-0.3,0.3),0.05,[8,14],[2,3.5],0.7);

// === LAYER 4: FACE - Base skin layers ===
// Face oval
const faceCX=595,faceCY=370,faceRX=95,faceRY=120;
// Base warm ochre layer
paintEllipse(faceCX,faceCY,faceRX,faceRY,
  ['#C89858','#C09050','#D0A060','#B88848','#D8A868','#C49458'],
  (x,y)=>{
    const dx=x-faceCX,dy=y-faceCY;
    return Math.atan2(dy,dx)+Math.PI/2+rr(-0.2,0.2);
  },0.035,[7,14],[2,3.5],0.65);

// Forehead highlight
paintEllipse(faceCX,faceCY-50,60,45,
  ['#D8B070','#E0B878','#D0A868','#E8C080','#CCA460'],
  (x,y)=>rr(-0.4,0.4),0.04,[6,12],[1.8,3],0.5);

// Cheek warmth (left)
paintEllipse(faceCX-40,faceCY+20,35,30,
  ['#D0A060','#C89858','#D8A868','#C49050','#CC9C5C'],
  (x,y)=>0.3+rr(-0.3,0.3),0.04,[6,11],[1.8,3],0.5);

// Cheek warmth (right)
paintEllipse(faceCX+35,faceCY+25,30,28,
  ['#C89858','#C09050','#D0A060','#BC8C4C','#C89454'],
  (x,y)=>-0.3+rr(-0.3,0.3),0.04,[6,11],[1.8,3],0.5);

// Shadow under cheekbones
paintEllipse(faceCX-50,faceCY+45,25,15,
  ['#A07840','#987038','#A88048','#906830'],
  (x,y)=>0.5+rr(-0.2,0.2),0.04,[5,10],[1.5,2.5],0.45);
paintEllipse(faceCX+48,faceCY+48,22,14,
  ['#987038','#906830','#A07840','#886028'],
  (x,y)=>-0.5+rr(-0.2,0.2),0.04,[5,10],[1.5,2.5],0.45);

// Jaw/chin shadow
paintEllipse(faceCX,faceCY+95,40,25,
  ['#B08048','#A87840','#B88850','#A07038'],
  (x,y)=>Math.PI/2+rr(-0.3,0.3),0.035,[6,11],[1.8,3],0.5);

// Nose
paintEllipse(faceCX-2,faceCY+5,12,35,
  ['#D0A868','#C8A060','#D8B070','#C49858'],
  (x,y)=>Math.PI/2+rr(-0.2,0.2),0.06,[5,10],[1.5,2.5],0.55);
// Nose shadow (right side)
paintEllipse(faceCX+10,faceCY+10,8,25,
  ['#A88048','#A07840','#B08850'],
  (x,y)=>Math.PI/2+0.3,0.05,[4,8],[1.2,2],0.4);
// Nose tip highlight
paintEllipse(faceCX-2,faceCY+25,7,6,
  ['#E0B878','#D8B070','#E8C080'],
  (x,y)=>rr(-0.5,0.5),0.06,[4,7],[1.5,2.5],0.5);

// === EYES ===
// Eye sockets shadow
paintEllipse(faceCX-35,faceCY-15,25,14,
  ['#A08050','#987848','#A88858','#907040'],
  (x,y)=>rr(-0.3,0.3),0.05,[5,9],[1.5,2.5],0.45);
paintEllipse(faceCX+30,faceCY-12,23,13,
  ['#987848','#907040','#A08050','#886838'],
  (x,y)=>rr(-0.3,0.3),0.05,[5,9],[1.5,2.5],0.45);

// Left eye
paintEllipse(faceCX-35,faceCY-15,16,8,
  ['#F0E8D8','#E8E0D0','#F8F0E0'],
  (x,y)=>rr(-0.1,0.1),0.08,[4,7],[1.2,2],0.6);
// Iris
paintEllipse(faceCX-35,faceCY-14,7,7,
  ['#4A3820','#3A2A15','#5A4830','#2E2010'],
  (x,y)=>rr(0,Math.PI*2),0.12,[3,5],[1,1.8],0.7);
// Pupil
paintEllipse(faceCX-35,faceCY-14,3,3,
  ['#1A1008','#0E0A05','#221810'],
  (x,y)=>rr(0,6),0.15,[2,4],[1,1.5],0.8);
// Upper eyelid line
for(let i=0;i<25;i++){
  const t=i/25;
  const ex=faceCX-35-16+t*32;
  const ey=faceCY-15-Math.sin(t*Math.PI)*7;
  stroke(ex,ey,rr(4,7),rr(-0.2,0.2),rr(1,1.8),jitter('#3A2815',4,6,5,4),0.6);
}

// Right eye
paintEllipse(faceCX+30,faceCY-12,15,7.5,
  ['#F0E8D8','#E8E0D0','#F8F0E0'],
  (x,y)=>rr(-0.1,0.1),0.08,[4,7],[1.2,2],0.6);
paintEllipse(faceCX+30,faceCY-11,6.5,6.5,
  ['#4A3820','#3A2A15','#5A4830','#2E2010'],
  (x,y)=>rr(0,Math.PI*2),0.12,[3,5],[1,1.8],0.7);
paintEllipse(faceCX+30,faceCY-11,2.8,2.8,
  ['#1A1008','#0E0A05','#221810'],
  (x,y)=>rr(0,6),0.15,[2,4],[1,1.5],0.8);
for(let i=0;i<25;i++){
  const t=i/25;
  const ex=faceCX+30-15+t*30;
  const ey=faceCY-12-Math.sin(t*Math.PI)*6.5;
  stroke(ex,ey,rr(4,7),rr(-0.2,0.2),rr(1,1.8),jitter('#3A2815',4,6,5,4),0.6);
}

// === MOUTH - Mysterious smile ===
// Upper lip
for(let i=0;i<40;i++){
  const t=i/40;
  const mx=faceCX-25+t*50;
  const my=faceCY+58-Math.sin(t*Math.PI)*3+(t>0.4&&t<0.6?-2:0);
  const c=jitter(pick(['#8A5040','#7A4535','#96584A','#6E3E30']),4,8,6,6);
  stroke(mx,my,rr(4,8),rr(-0.15,0.15),rr(1.5,2.5),c,0.6);
}
// Lower lip
paintEllipse(faceCX,faceCY+65,20,8,
  ['#B07060','#A06858','#B87868','#986050','#C08070'],
  (x,y)=>rr(-0.2,0.2),0.06,[4,8],[1.5,2.5],0.55);
// Smile corners (sfumato - very soft)
for(let i=0;i<15;i++){
  const side=i<8?-1:1;
  const sx=faceCX+side*25+rr(-3,3);
  const sy=faceCY+58+rr(-2,3);
  stroke(sx,sy,rr(4,7),side*0.4+rr(-0.2,0.2),rr(1,2),jitter('#9A7050',5,8,8,6),0.35);
}
// Lip line
for(let i=0;i<30;i++){
  const t=i/30;
  const mx=faceCX-22+t*44;
  const my=faceCY+60+Math.sin(t*Math.PI)*1.5;
  stroke(mx,my,rr(3,6),rr(-0.1,0.1),rr(0.8,1.5),jitter('#5A3025',3,5,4,4),0.5);
}

// === HAIR ===
// Dark hair framing face
const hairColors=['#1A1008','#221510','#2A1A0E','#181008','#301E12','#141008','#261810'];
// Left hair
paintRegion([[480,250],[560,240],[555,300],[540,420],[520,500],[480,520],[460,450],[465,320]],
  hairColors,(x,y)=>Math.PI/2+0.3+rr(-0.2,0.2),0.02,[14,28],[2,4],0.75);
// Right hair
paintRegion([[640,240],[720,250],[735,320],[740,450],[720,520],[680,500],[660,420],[645,300]],
  hairColors,(x,y)=>Math.PI/2-0.3+rr(-0.2,0.2),0.02,[14,28],[2,4],0.75);
// Top hair
paintRegion([[500,220],[700,220],[720,260],[680,240],[600,230],[520,240],[480,260]],
  hairColors,(x,y)=>rr(-0.5,0.5),0.025,[12,24],[2,4],0.75);
// Hair over forehead (soft edge)
paintEllipse(faceCX,faceCY-95,85,35,hairColors,
  (x,y)=>rr(-0.6,0.6),0.025,[10,20],[2,3.5],0.65);

// Veil over hair (thin translucent strokes)
for(let i=0;i<300;i++){
  const a=rr(-1.2,1.2);
  const r=rr(60,110);
  const vx=faceCX+Math.sin(a)*r;
  const vy=faceCY-60+Math.cos(a)*r*0.7;
  if(vy>faceCY-20)continue;
  stroke(vx,vy,rr(10,20),a+Math.PI/2+rr(-0.2,0.2),rr(0.8,1.5),
    jitter(pick(['#3A3020','#4A4030','#2E2818','#443A28']),4,6,6,5),0.3);
}

// === LAYER 5: HANDS ===
// Right hand (viewer's left, on top)
paintEllipse(560,1120,70,35,
  ['#C89858','#D0A060','#C49458','#D8A868','#BC8C4C'],
  (x,y)=>rr(-0.4,0.4),0.03,[8,14],[2,3.5],0.65);
// Fingers
for(let f=0;f<4;f++){
  const fx=520+f*25,fy=1110+rr(-5,5);
  paintEllipse(fx,fy,10,22,
    ['#D0A060','#C89858','#D8A868','#C49458'],
    (x,y)=>Math.PI/2+rr(-0.2,0.2),0.05,[5,10],[1.5,2.5],0.6);
}
// Left hand (below)
paintEllipse(620,1140,65,30,
  ['#C09050','#B88848','#C89858','#BC8C4C','#D0A060'],
  (x,y)=>rr(-0.3,0.3),0.03,[8,14],[2,3.5],0.6);
// Wrist connection
paintEllipse(600,1080,50,30,
  ['#C09050','#C89858','#B88848','#D0A060'],
  (x,y)=>Math.PI/2+rr(-0.3,0.3),0.03,[8,13],[2,3],0.6);

// === LAYER 6: Additional sfumato layers ===
// Soft shadow transitions on face edges
for(let i=0;i<200;i++){
  const a=rr(0,Math.PI*2);
  const rx=faceRX*rr(0.85,1.05),ry=faceRY*rr(0.85,1.05);
  const x=faceCX+Math.cos(a)*rx;
  const y=faceCY+Math.sin(a)*ry;
  stroke(x,y,rr(6,12),a+Math.PI/2,rr(1.5,3),
    jitter(pick(['#8A6838','#7A5830','#9A7840','#6A4828']),5,8,8,6),0.3);
}

// Temple shadows
paintEllipse(faceCX-70,faceCY-30,20,35,
  ['#9A7840','#8A6838','#A08048','#7A5830'],
  (x,y)=>Math.PI/2+0.4,0.04,[6,11],[1.5,2.5],0.4);
paintEllipse(faceCX+68,faceCY-25,18,33,
  ['#8A6838','#7A5830','#9A7840','#705028'],
  (x,y)=>Math.PI/2-0.4,0.04,[6,11],[1.5,2.5],0.4);

// Under-eye softness (sfumato)
paintEllipse(faceCX-35,faceCY-5,18,6,
  ['#B08850','#A88048','#B89058'],
  (x,y)=>rr(-0.2,0.2),0.05,[4,7],[1,2],0.3);
paintEllipse(faceCX+30,faceCY-3,16,5.5,
  ['#A88048','#A07840','#B08850'],
  (x,y)=>rr(-0.2,0.2),0.05,[4,7],[1,2],0.3);

// === LAYER 7: Clothing details ===
// Neckline embroidery/edge
for(let i=0;i<80;i++){
  const t=i/80;
  const nx=520+t*160;
  const ny=530+Math.sin(t*Math.PI)*15;
  stroke(nx,ny,rr(5,9),rr(-0.3,0.3),rr(1.5,2.5),
    jitter(pick(['#4A3A20','#3A2E18','#5A4A28','#332815']),4,6,6,4),0.6);
}

// Sleeve folds (left)
for(let i=0;i<150;i++){
  const t=rng();
  const sx=420+t*80;
  const sy=600+t*400+rr(-20,20);
  stroke(sx,sy,rr(10,20),Math.PI/2+0.5+rr(-0.3,0.3),rr(2,4),
    jitter(pick(['#2A2015','#332818','#1E1810','#3A2E1C']),4,6,5,4),0.55);
}
// Sleeve folds (right)
for(let i=0;i<150;i++){
  const t=rng();
  const sx=700+t*80;
  const sy=600+t*400+rr(-20,20);
  stroke(sx,sy,rr(10,20),Math.PI/2-0.5+rr(-0.3,0.3),rr(2,4),
    jitter(pick(['#2A2015','#332818','#1E1810','#3A2E1C']),4,6,5,4),0.55);
}

// === LAYER 8: Armrest ===
paintRegion([[350,1200],[850,1200],[870,1350],[330,1350]],
  ['#4A3820','#3E3018','#5A4828','#332815','#4E3E22'],
  (x,y)=>rr(-0.15,0.15),0.01,[12,22],[2.5,4.5],0.65);

// === LAYER 9: Final glazing passes ===
// Warm glaze over entire figure
for(let i=0;i<500;i++){
  const x=rr(400,800),y=rr(250,1300);
  if(inPoly(x,y,bodyPts)||Math.hypot((x-faceCX)/faceRX,(y-faceCY)/faceRY)<1){
    stroke(x,y,rr(8,16),rr(-0.5,0.5),rr(1.5,3),
      jitter(pick(['#C89040','#B08038','#D0A050']),3,5,5,3),0.1);
  }
}

// Dark vignette edges
for(let i=0;i<400;i++){
  const side=pick([0,1,2,3]);
  let x,y;
  if(side===0){x=rr(0,80);y=rr(0,1600);}
  else if(side===1){x=rr(1120,1200);y=rr(0,1600);}
  else if(side===2){x=rr(0,1200);y=rr(0,60);}
  else{x=rr(0,1200);y=rr(1500,1600);}
  stroke(x,y,rr(15,30),rr(0,Math.PI),rr(3,6),
    jitter(pick(['#1A1008','#0E0A05','#221510']),3,4,4,3),0.5);
}

// Column bases (hints of parapet)
paintRegion([[0,620],[180,620],[180,780],[0,780]],
  ['#3A3020','#4A4028','#2E2818','#443A25'],
  (x,y)=>rr(-0.2,0.2),0.015,[10,18],[2.5,4],0.6);
paintRegion([[1020,620],[1200,620],[1200,780],[1020,780]],
  ['#3A3020','#4A4028','#2E2818','#443A25'],
  (x,y)=>rr(-0.2,0.2),0.015,[10,18],[2.5,4],0.6);

// === LAYER 10: Enhanced sfumato face modeling ===
// Multiple glazing passes for three-dimensional face
for(let pass=0;pass<3;pass++){
  // Light from upper-left
  for(let i=0;i<250;i++){
    const a=rr(0,Math.PI*2),r=Math.sqrt(rng());
    const x=faceCX+Math.cos(a)*faceRX*r*0.9;
    const y=faceCY+Math.sin(a)*faceRY*r*0.9;
    const lightFactor=1-((x-faceCX+40)/faceRX)*0.3-((y-faceCY+30)/faceRY)*0.2;
    const colors=lightFactor>0.6?['#E0B878','#D8B070','#E8C080','#D0A868']:
      lightFactor>0.3?['#C89858','#C09050','#D0A060','#B88848']:
      ['#A07840','#987038','#906830','#886028'];
    stroke(x,y,rr(5,11),Math.atan2(y-faceCY,x-faceCX)+Math.PI/2+rr(-0.3,0.3),
      rr(1.5,3),jitter(pick(colors),6,10,10,8),0.25);
  }
}

// Nasolabial fold (very subtle)
for(let i=0;i<20;i++){
  const t=i/20;
  const nx=faceCX-28+t*8;
  const ny=faceCY+20+t*35;
  stroke(nx,ny,rr(4,7),Math.PI/2+0.2,rr(1,1.8),jitter('#A07840',4,6,6,5),0.3);
}
for(let i=0;i<18;i++){
  const t=i/18;
  const nx=faceCX+26-t*6;
  const ny=faceCY+22+t*33;
  stroke(nx,ny,rr(4,7),Math.PI/2-0.2,rr(1,1.8),jitter('#987038',4,6,6,5),0.28);
}

// Chin definition
paintEllipse(faceCX,faceCY+85,22,15,
  ['#D0A868','#C8A060','#D8B070'],
  (x,y)=>rr(-0.3,0.3),0.04,[5,9],[1.5,2.5],0.4);

// Philtrum (subtle)
for(let i=0;i<10;i++){
  const py=faceCY+42+i*1.5;
  stroke(faceCX-2+rr(-1,1),py,rr(3,5),Math.PI/2,rr(0.8,1.5),jitter('#C09050',4,6,6,5),0.3);
}

// === LAYER 11: Enhanced background landscape ===
// Winding path (left, more detailed S-curve)
for(let i=0;i<250;i++){
  const t=rng();
  const px=120+Math.sin(t*5)*70+t*100;
  const py=480+t*130;
  const c=jitter(pick(['#8A8458','#7A7648','#9A9262','#6A6640','#8E8A5C']),5,8,8,5);
  stroke(px+rr(-10,10),py+rr(-4,4),rr(6,12),Math.sin(t*5)*0.5+rr(-0.2,0.2),rr(1.5,2.5),c,0.45);
}

// Rocky cliffs (right background)
for(let i=0;i<300;i++){
  const t=rng();
  const rx2=900+rr(-80,100);
  const ry2=380+t*200;
  const c=jitter(pick(['#5A6A50','#4E5E45','#667658','#526248','#5E6E52']),5,7,8,6);
  stroke(rx2,ry2,rr(8,15),rr(-0.6,0.6),rr(2,3.5),c,0.5);
}

// Additional atmospheric haze layers
for(let i=0;i<200;i++){
  const x=rr(0,1200),y=rr(350,600);
  stroke(x,y,rr(15,30),rr(-0.1,0.1),rr(2,4),
    jitter(pick(['#7A9A8A','#8AAA98','#6A8A7A','#9ABAA8']),4,5,6,6),0.2);
}

// === LAYER 12: Hair strand details ===
for(let i=0;i<200;i++){
  const side=rng()>0.5?1:-1;
  const startA=side>0?-0.8:Math.PI+0.8;
  const a=startA+rr(-0.5,0.5);
  const r0=rr(70,100);
  const hx=faceCX+Math.cos(a)*r0;
  const hy=faceCY-40+Math.sin(a)*r0*0.6;
  const flowDir=Math.PI/2+side*0.4+rr(-0.15,0.15);
  stroke(hx,hy,rr(18,35),flowDir,rr(1,2.5),
    jitter(pick(['#1A1008','#221510','#2A1A0E','#181008','#201410']),3,4,4,3),0.6);
}

// === LAYER 13: Veil detail (gossamer thin) ===
for(let i=0;i<150;i++){
  const a=rr(-1.5,1.5);
  const r=rr(75,105);
  const vx=faceCX+Math.sin(a)*r;
  const vy=faceCY-50+Math.cos(a)*r*0.65;
  if(vy>faceCY)continue;
  stroke(vx,vy,rr(12,25),a*0.3+Math.PI/2+rr(-0.15,0.15),rr(0.5,1.2),
    jitter(pick(['#4A4030','#3A3422','#544A38','#2E2A1C']),3,5,5,4),0.22);
}

// === LAYER 14: Hand details - finger separations ===
for(let f=0;f<4;f++){
  const fx=525+f*24;
  for(let i=0;i<8;i++){
    const fy=1095+i*5;
    stroke(fx+12,fy,rr(3,6),Math.PI/2,rr(0.8,1.5),jitter('#A07840',4,6,6,5),0.4);
  }
}
// Knuckle highlights
for(let f=0;f<4;f++){
  paintEllipse(520+f*25,1105,5,4,['#D8B070','#E0B878','#D0A868'],
    (x,y)=>rr(-0.3,0.3),0.08,[3,5],[1,1.8],0.45);
}

// === LAYER 15: Final unifying glaze ===
// Overall warm tone unification
for(let i=0;i<300;i++){
  const x=rr(100,1100),y=rr(100,1500);
  stroke(x,y,rr(10,25),rr(-0.3,0.3),rr(2,4),
    jitter('#8A6830',3,5,5,4),0.06);
}

// Craquelure hint (aged varnish effect - very subtle)
for(let i=0;i<50;i++){
  const x=rr(200,1000),y=rr(200,1400);
  stroke(x,y,rr(3,8),rr(0,Math.PI),rr(0.3,0.6),
    jitter('#3A2A15',2,3,3,2),0.15);
}

console.log('Mona Lisa SVG brush stroke painting complete. Total strokes:',svg.querySelectorAll('path').length);
</script>
