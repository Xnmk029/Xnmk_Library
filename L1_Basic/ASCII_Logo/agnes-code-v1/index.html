<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgnesCode Benchmark — ASCII Logo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e08;color:#33ff33;font-family:'Courier New',Consolas,'Lucida Console',monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:32px 16px;overflow-x:auto}
#frame{border:2px solid #1a5c1a;border-radius:4px;padding:20px;background:#070b05;max-width:96vw;position:relative;box-shadow:0 0 30px rgba(51,255,51,.08)}
pre{font-size:clamp(7px,1.3vw,14px;line-height:1.18;white-space:pre;margin:0}
.toolbar{display:flex;gap:12px;margin-top:16px;justify-content:center;flex-wrap:wrap}
.btn{background:#0d1f0d;color:#33ff33;border:1px solid #33ff33;padding:8px 18px;cursor:pointer;font-family:inherit;font-size:13px;border-radius:3px;transition:all .15s;text-transform:none;user-select:none}
.btn:hover{background:#33ff33;color:#070b05}
.btn:active{transform:scale(.97)}
.toast{position:absolute;top:-36px;left:50%;transform:translateX(-50%);background:#33ff33;color:#070b05;padding:6px 18px;border-radius:3px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.status{color:#1a8a1a;font-size:11px;text-align:center;margin-top:8px;letter-spacing:.5px}
</style>
</head>
<body>

<div id="frame"><div class="toast" id="toast"></div><pre id="art"></pre></div>
<div class="toolbar">
  <button class="btn" id="copyBtn" title="复制到剪贴板">📋 复制全部</button>
  <button class="btn" id="dlBtn" title="下载到本地">💾 下载 .txt</button>
</div>
<div class="status">AGNES-CODE v1 · Benchmark Runner · Pure ASCII Terminal Art</div>

<script>
const art = [
"                                                                                                                    ",
"           ████████████████████████████████████████████████████████████████████████████████████████                    ",
"           ██                                                                  ██                                        ",
"           ██          ╔══════════════════════════════════════════╗              ██                                        ",
"           ██          ║        AGNES-CODE v1.0 · BENCHMARK      ║              ██                                        ",
"           ██          ╚══════════════════════════════════════════╝              ██                                        ",
"           ██                                                                  ██                                        ",
"           ██   @@@@     @@@@@@    @@@@@   %%%%%   %%%%       %%@@@@%%         ██                                        ",
"           ██  @@  @@   @@                %@@@%@  @@          @@               ██                                        ",
"           ██  @@  @@   @@      @@        %@@@%@  @@          @@               ██                                        ",
"           ██  @@  @@   @@@@@@  @@        %@@@%@  %%%%        @@               ██                                        ",
"           ██  @@  @@   @@      @@        %@@@%@  @@          @@               ██                                        ",
"           ██  @@  @@   @@      @@        %@@@%@  @@          @@               ██                                        ",
"           ██  @@  @@   @@       @@       %@@@%@  @@          @@               ██                                        ",
"           ██  @@@@@@    @@@@@@  @@        %%%%   %%%%        %%@@@@%%         ██                                        ",
"           ██                                                                  ██                                        ",
"           ██            ▄▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀              ██                                        ",
"           ██          ▐▌                                              ▜▌              ██                                        ",
"           ██          ▐▌     ╭────────────────────────────╮             ▜▌              ██                                        ",
"           ██          ▐▌     │                            │             ▜▌              ██                                        ",
"           ██          ▐▌     │    ◄►                       │             ▜▌              ██                                        ",
"           ██          ▐▌     │     <>     CODE INTEL       │             ▜▌              ██                                        ",
"           ██          ▐▌     │        AI    AGENT          │             ▜▌              ██                                        ",
"           ██          ▐▌     │     </>                     │             ▜▌              ██                                        ",
"           ██          ▐▌     │                            │             ▜▌              ██                                        ",
"           ██          ▐▌     ╰────────────────────────────╯             ▜▌              ██                                        ",
"           ██          ▐▌                                              ▜▌              ██                                        ",
"           ██            ▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀               ██                                        ",
"           ██                                                                  ██                                        ",
"           ██          ┌───────┬───────┬───────┬───────┬───────┬───────┐      ██                                        ",
"           ██          │ SAPIENS│ SAPIENS│ SAPIENS│ SAPIENS│ SAPIENS│ SAPIENS│      ██                                        ",
"           ██          │ ─AI── │ ─AI── │ ─AI── │ ─AI── │ ─AI── │ ─AI── │      ██                                        ",
"           ██          └───────┴───────┴───────┴───────┴───────┴───────┘      ██                                        ",
"           ██                                                                  ██                                        ",
"           ██          ~~~~  ~~~~~~~  ~~~~~~~  ~~~~~~~  ~~~~~~~  ~~~~~~~  ~      ██                                        ",
"           ██          ::::::::::::BENCHMARK::RUNNER:::::::::::::::::::::::::  ~      ██                                        ",
"           ██          ~~~~~~~~~~~~~~~~v1~~~~~~~~~~~~~~~READY~~~~~~~~~~~~~~~~  ~      ██                                        ",
"           ██                                                                  ██                                        ",
"           ╚═══════════════════════════════════════════════════════════════════════╝                                        "
].map((line,i) => {
  // Use pure ASCII fallback for all unicode block chars
  const asciiMap = {'█':'@','▀':'\\','▄':'/','▐':'|','▌':'|','┌':'+','┬':'+','┐':'+','└':'+','┴':'+','┘':'+','├':'#','─':'-','│':'|'};
  return line.split('').map(ch => asciiMap[ch] || ch).join('');
}).join('\n');

document.getElementById('art').textContent = art;

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);}

document.getElementById('copyBtn').addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(art);showToast('✔ 已复制到剪贴板');}
  catch(e){showToast('✖ 复制失败，请手动选择文本');}});

document.getElementById('dlBtn').addEventListener('click',()=>{
  const blob=new Blob([art],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='agnescode-benchmark-ascii.txt';a.click();URL.revokeObjectURL(a.href);});
</script>
</body>
</html>
