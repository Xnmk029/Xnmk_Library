<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>USP Match — Retro 90s Low-Poly Exploded View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#b9bcc2;
    font-family:'Press Start 2P','Courier New',monospace}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:#b9bcc2;image-rendering:pixelated;image-rendering:crisp-edges;cursor:grab;touch-action:none;
    box-shadow:0 0 0 3px rgba(23,24,28,.28),0 30px 70px rgba(0,0,0,.28)}
  canvas:active{cursor:grabbing}
  #hud{position:fixed;inset:0;pointer-events:none;color:#14151a;user-select:none}
  .tl{position:fixed;top:16px;left:18px}
  .tl h1{margin:0;font-size:15px;letter-spacing:1px}
  .tl span{display:block;margin-top:9px;font-size:7px;color:#3f4249;letter-spacing:1px;line-height:1.9}
  .tr{position:fixed;top:16px;right:18px;text-align:right;font-size:9px;line-height:2;color:#2b2e35}
  .bl{position:fixed;bottom:14px;left:18px;font-size:8px;line-height:2.1;color:#54585f}
  .br{position:fixed;bottom:14px;right:18px;text-align:right;font-size:8px;line-height:2.1;color:#54585f}
  b{color:#0c0d11}
  #phaseBar{position:fixed;bottom:17px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
  #phaseBar i{width:22px;height:4px;background:#8a8e96;display:block}
  #phaseBar i.on{background:#14151a}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hud">
  <div class="tl"><h1>USP MATCH</h1><span>RETRO 90s LOW-POLY //<br>EXPLODED ASSEMBLY VIEW</span></div>
  <div class="tr"><span id="fps">60</span> FPS<br>PHASE : <b id="phase">EXPLODED VIEW</b></div>
  <div class="bl"><b>DRAG</b> ORBIT<br><b>WHEEL</b> ZOOM</div>
  <div class="br">HK-STYLE PISTOL<br>FLAT-SHADED MESH</div>
  <div id="phaseBar"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

var canvas = document.getElementById('c');
var RW = 480, RH = 360;                       // PS1-style low internal resolution
canvas.width = RW; canvas.height = RH;

var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false });
var scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9bcc2);

var camera = new THREE.OrthographicCamera(-18, 18, 13.5, -13.5, 0.1, 300);

scene.add(new THREE.HemisphereLight(0xd8dee6, 0x5f636b, 0.9));
var key = new THREE.DirectionalLight(0xffffff, 1.0); key.position.set(-6, 10, 8); scene.add(key);
var fill = new THREE.DirectionalLight(0xc9d4e2, 0.4); fill.position.set(8, -3, -6); scene.add(fill);

/* ---------- pixelated 32x32 canvas textures (NearestFilter = chunky 90s texels) ---------- */
function makeTex(draw) {
  var s = 32, cv = document.createElement('canvas');
  cv.width = cv.height = s;
  var g = cv.getContext('2d');
  draw(g, s);
  var t = new THREE.CanvasTexture(cv);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  return t;
}
function noiseTex(g, s, base, n, white, band) {
  g.fillStyle = base; g.fillRect(0, 0, s, s);
  for (var i = 0; i < n; i++) {
    g.fillStyle = white;
    g.fillRect((Math.random() * s) | 0, (Math.random() * s) | 0, 1, 1);
  }
  for (i = 0; i < s; i++) {
    if (Math.random() < 0.5) { g.fillStyle = band; g.fillRect(0, i, s, 1); }
  }
}
var TEX = {
  slide: makeTex(function(g, s) { noiseTex(g, s, '#1d1e24', 30, 'rgba(255,255,255,0.10)', 'rgba(150,156,170,0.10)'); }),
  frame: makeTex(function(g, s) { noiseTex(g, s, '#2a2b31', 20, 'rgba(255,255,255,0.06)', 'rgba(10,10,14,0.35)'); }),
  barrel: makeTex(function(g, s) {
    g.fillStyle = '#c9ced6'; g.fillRect(0, 0, s, s);
    for (var i = 0; i < s; i++) {
      if (Math.random() < 0.6) { g.fillStyle = 'rgba(255,255,255,0.30)'; g.fillRect((Math.random() * s) | 0, i, 1, 1); }
      if (Math.random() < 0.3) { g.fillStyle = 'rgba(70,74,84,0.30)'; g.fillRect((Math.random() * s) | 0, i, 1, 1); }
    }
  }),
  comp: makeTex(function(g, s) { noiseTex(g, s, '#23242a', 10, 'rgba(120,126,140,0.10)', 'rgba(0,0,0,0.5)'); }),
  mag: makeTex(function(g, s) { noiseTex(g, s, '#26272d', 10, 'rgba(255,255,255,0.05)', 'rgba(0,0,0,0.4)'); })
};

function mat(color, map) { return new THREE.MeshLambertMaterial({ color: color, map: map, flatShading: true }); }
var M = {
  slide: mat(0xffffff, TEX.slide),
  frame: mat(0xffffff, TEX.frame),
  barrel: mat(0xffffff, TEX.barrel),
  comp: mat(0xffffff, TEX.comp),
  mag: mat(0xffffff, TEX.mag),
  base: mat(0x191a1f, null),
  dark: mat(0x121317, null),
  steel: mat(0x9aa1ab, null),
  front: new THREE.MeshBasicMaterial({ color: 0x4dff77 }),
  rear: new THREE.MeshBasicMaterial({ color: 0xff4747 })
};

function box(w, h, d, m, x, y, z, rx, ry, rz) {
  var b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  b.position.set(x, y, z);
  if (rx) b.rotation.x = rx;
  if (ry) b.rotation.y = ry;
  if (rz) b.rotation.z = rz;
  return b;
}
function cyl(r1, r2, h, seg, m, x, y, z) {
  var c = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, seg, 1), m);
  c.position.set(x, y, z);
  c.rotation.x = Math.PI / 2;
  return c;
}

/* ---------------- MODEL ---------------- */
/* axis: muzzle = -Z, rear = +Z, up = +Y. 1 unit ~ 1 cm */
var gun = new THREE.Group();
var frameG = new THREE.Group();
var slideG = new THREE.Group();
var barrelG = new THREE.Group();
var compG = new THREE.Group();
var magG = new THREE.Group();
gun.add(frameG, slideG, barrelG, compG, magG);
scene.add(gun);

/* --- polymer frame (static) --- */
frameG.add(
  box(2.6, 2.6, 11.5, M.frame, 0, 0.3, 2.75),                 // main block
  box(2.2, 1.1, 1.7, M.frame, 0, 1.25, 8.2),                  // beavertail
  box(2.3, 5.6, 3.4, M.frame, 0, -3.3, 8.6, -0.30),           // grip (angled)
  box(2.5, 0.8, 3.6, M.frame, 0, -6.0, 9.1, -0.30),           // grip base cap
  box(1.8, 0.6, 2.6, M.dark, 0, -0.9, 7.9),                   // magwell
  box(2.4, 1.7, 0.4, M.frame, 0, -1.85, 2.9),                 // trigger guard front
  box(2.4, 0.35, 2.2, M.frame, 0, -2.55, 2.15),               // trigger guard bottom
  box(2.2, 0.35, 0.9, M.frame, 0, -1.25, 3.8),                // guard rear link
  box(2.2, 0.4, 1.8, M.frame, 0, -1.45, 5.0),                 // underside panel
  box(0.65, 1.05, 0.22, M.steel, 0, -1.75, 3.45, 0, 0.12),    // trigger
  box(2.2, 0.3, 1.2, M.dark, 0, 1.66, -2.45),                 // accessory rail slot
  box(0.2, 0.28, 10.5, M.steel, 1.24, 1.72, 2.6),             // slide rail L
  box(0.2, 0.28, 10.5, M.steel, -1.24, 1.72, 2.6),            // slide rail R
  box(1.7, 0.26, 0.2, M.steel, 1.2, 1.42, 4.6),               // slide stop lever
  box(0.4, 1.0, 0.4, M.steel, 1.25, 1.35, 8.0),               // safety lever
  box(0.7, 0.3, 0.3, M.steel, -1.3, 1.5, 4.2)                 // takedown lever
);

/* --- dark metal slide (racks +Z, explodes rear/up) --- */
slideG.add(
  box(3.1, 1.9, 13.4, M.slide, 0, 2.55, 5.9),                 // main body
  box(3.1, 0.4, 0.9, M.slide, 0, 3.3, -0.85),                 // nose step
  box(2.6, 0.35, 0.5, M.slide, 0, 3.32, -1.35),               // nose tip
  box(0.3, 1.0, 2.4, M.dark, 1.72, 2.55, 1.6),                // ejection port
  box(0.22, 0.5, 0.5, M.dark, 1.68, 2.75, 0.7),               // deflector
  box(1.2, 0.55, 0.6, M.dark, 0, 3.62, 11.3),                 // rear sight base
  box(0.18, 0.5, 0.2, M.dark, 0.55, 3.85, 11.3),              // rear post R
  box(0.18, 0.5, 0.2, M.dark, -0.55, 3.85, 11.3),             // rear post L
  box(0.55, 0.5, 0.4, M.dark, 0, 3.55, 0.5),                  // front sight base
  box(0.8, 0.95, 0.6, M.steel, 0, 2.1, 12.9)                  // hammer
);
var rearFiber = box(1.05, 0.17, 0.15, M.rear, 0, 4.05, 11.3); // red rear fiber
var frontFiber = box(0.32, 0.5, 0.18, M.front, 0, 3.85, 0.5); // green front fiber
var i;
for (i = 0; i < 4; i++) {
  slideG.add(box(0.14, 1.1, 0.18, M.dark, 1.64, 2.55, 10.0 + i * 0.45));
  slideG.add(box(0.14, 1.1, 0.18, M.dark, -1.64, 2.55, 10.0 + i * 0.45));
}
for (i = 0; i < 2; i++) {
  slideG.add(box(0.14, 1.0, 0.18, M.dark, 1.64, 2.55, -0.55 - i * 0.4));
  slideG.add(box(0.14, 1.0, 0.18, M.dark, -1.64, 2.55, -0.55 - i * 0.4));
}

/* --- bright silver barrel (hexagonal = 6 facets) --- */
barrelG.add(
  cyl(0.62, 0.62, 9.6, 6, M.barrel, 0, 2.0, -1.8),            // tube
  cyl(0.72, 0.72, 0.5, 6, M.barrel, 0, 2.0, -6.35),           // muzzle ring
  box(1.05, 0.8, 1.5, M.barrel, 0, 1.62, 2.4)                 // chamber block
);

/* --- front Match compensator weight (attached to frame rail) --- */
compG.add(
  box(0.5, 1.2, 4.9, M.comp, 1.55, 1.85, -3.3),               // side plate R
  box(0.5, 1.2, 4.9, M.comp, -1.55, 1.85, -3.3),              // side plate L
  box(2.6, 0.4, 5.2, M.comp, 0, 1.2, -3.15),                  // bottom bar
  box(1.7, 0.45, 3.4, M.comp, 0, 2.92, -3.3),                 // top rail (U-cutout over barrel)
  box(2.4, 1.0, 0.3, M.comp, 0, 1.9, -5.85)                   // front cap
);
for (i = 0; i < 3; i++) {
  compG.add(box(0.14, 0.8, 0.25, M.dark, 1.82, 1.95, -4.9 + i * 1.5));
  compG.add(box(0.14, 0.8, 0.25, M.dark, -1.82, 1.95, -4.9 + i * 1.5));
}

/* --- detached magazine (angles with grip) --- */
magG.rotation.x = -0.30;
magG.add(
  box(1.6, 4.6, 2.4, M.mag, 0, -4.5, 8.6),                    // body
  box(1.2, 1.4, 0.7, M.mag, 0, -3.3, 7.7, 0, 0.15),           // front taper
  box(1.9, 0.5, 2.7, M.base, 0, -7.0, 9.0),                   // baseplate
  box(1.5, 0.14, 2.2, M.steel, 0, -6.8, 9.0),                 // floor plate strip
  box(0.12, 3.2, 1.8, M.dark, 0.86, -4.5, 8.6),               // groove R
  box(0.12, 3.2, 1.8, M.dark, -0.86, -4.5, 8.6)               // groove L
);

/* ---------------- ANIMATION ---------------- */
var Z = new THREE.Vector3();
slideG.userData = { explode: new THREE.Vector3(0, 2.8, 1.8), rack: new THREE.Vector3(0, 0, 4.6) };
barrelG.userData = { explode: new THREE.Vector3(0, 2.4, -3.4), rack: Z };
compG.userData = { explode: new THREE.Vector3(0, -1.8, -2.8), rack: Z };
magG.userData = { explode: new THREE.Vector3(0, -3.0, 0.5), rack: Z };

var T = 18; // seconds per seamless loop
var PHASES = [
  'EXPLODED VIEW', 'ASSEMBLING', 'ASSEMBLED', 'SLIDE RACKING BACK',
  'LOCKED BACK - BARREL EXPOSED', 'EXPLODING', 'EXPLODED VIEW'
];
function easeIO(u) { return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; }
function phaseAt(t) {
  if (t < 2)  return { e: 1, r: 1, i: 0 };
  if (t < 5)  { var u = (t - 2) / 3; return { e: 1 - easeIO(u), r: 1 - easeIO(u), i: 1 }; }
  if (t < 7)  return { e: 0, r: 0, i: 2 };
  if (t < 10) { var v = (t - 7) / 3; return { e: 0, r: easeIO(v), i: 3 }; }
  if (t < 13) return { e: 0, r: 1, i: 4 };
  if (t < 16) { var w = (t - 13) / 3; return { e: easeIO(w), r: 1, i: 5 }; }
  return { e: 1, r: 1, i: 6 };
}

/* ---------------- CAMERA / INPUT ---------------- */
var target = new THREE.Vector3(0, -0.5, 4);
var yaw = 0.55, pitch = 0.26, zoom = 1, dragging = false, px = 0, py = 0;

canvas.addEventListener('pointerdown', function(e) {
  dragging = true; px = e.clientX; py = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', function(e) {
  if (!dragging) return;
  yaw += (e.clientX - px) * 0.008;
  pitch = Math.max(-0.25, Math.min(0.75, pitch + (e.clientY - py) * 0.005));
  px = e.clientX; py = e.clientY;
});
canvas.addEventListener('pointerup', function() { dragging = false; });
canvas.addEventListener('wheel', function(e) {
  e.preventDefault();
  zoom = Math.max(0.75, Math.min(2.2, zoom * (e.deltaY > 0 ? 0.94 : 1.06)));
  camera.zoom = zoom;
  camera.updateProjectionMatrix();
}, { passive: false });
canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });

function fit() {
  var s = Math.min(window.innerWidth, window.innerHeight * 4 / 3);
  canvas.style.width = s + 'px';
  canvas.style.height = (s * 0.75) + 'px';
}
window.addEventListener('resize', fit);
fit();

/* ---------------- LOOP ---------------- */
var clock = new THREE.Clock();
var fps = 60, frames = 0, last = performance.now();
var fpsEl = document.getElementById('fps');
var phaseEl = document.getElementById('phase');
var bar = Array.prototype.slice.call(document.querySelectorAll('#phaseBar i'));

function animate() {
  requestAnimationFrame(animate);
  var dt = Math.min(clock.getDelta(), 0.05);
  var t = clock.elapsedTime % T;
  var st = phaseAt(t);

  if (!dragging) yaw += dt * 0.12;

  slideG.position.set(st.r * 4.6, st.e * 2.8, st.e * 1.8);
  barrelG.position.set(0, st.e * 2.4, -st.e * 3.4);
  compG.position.set(0, -st.e * 1.8, -st.e * 2.8);
  magG.position.set(0, -st.e * 3.0, st.e * 0.5);

  var pulse = 0.92 + 0.12 * (0.5 + 0.5 * Math.sin(t * 3.0));
  frontFiber.scale.setScalar(pulse);
  rearFiber.scale.setScalar(pulse);

  camera.position.set(
    target.x + 26 * Math.sin(yaw) * Math.cos(pitch),
    target.y + 26 * Math.sin(pitch),
    target.z + 26 * Math.cos(yaw) * Math.cos(pitch)
  );
  camera.lookAt(target);

  renderer.render(scene, camera);

  frames++;
  var now = performance.now();
  if (now - last >= 1000) {
    fps = frames * 1000 / (now - last);
    frames = 0; last = now;
    fpsEl.textContent = String(Math.min(60, Math.round(fps)));
  }
  phaseEl.textContent = PHASES[st.i];
  for (var k = 0; k < bar.length; k++) bar[k].className = (k === st.i) ? 'on' : '';
}
animate();
})();
</script>
</body>
</html>
