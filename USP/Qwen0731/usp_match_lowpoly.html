<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>USP Match - Low-Poly PS1 Style</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #c8c8c8; overflow: hidden; font-family: 'Courier New', monospace; }
canvas { display: block; image-rendering: pixelated; }
#info {
  position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
  color: #333; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
  background: rgba(200,200,200,0.8); padding: 4px 12px;
}
</style>
</head>
<body>
<div id="info">USP MATCH .45 — PS1 LOW-POLY — EXPLODE/ASSEMBLE LOOP</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

// === SCENE SETUP ===
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc8c8c8);

const aspect = window.innerWidth / window.innerHeight;
const frustum = 5.5;
const camera = new THREE.OrthographicCamera(
  -frustum * aspect, frustum * aspect, frustum, -frustum, 0.1, 100
);
camera.position.set(6, 4, 8);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(0.75); // PS1 low-res feel
document.body.appendChild(renderer.domElement);

// === LIGHTING (flat, high-contrast) ===
const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
dirLight.position.set(3, 5, 4);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
fillLight.position.set(-3, -1, -2);
scene.add(fillLight);
scene.add(new THREE.AmbientLight(0xffffff, 0.3));

// === MATERIALS (flat shading, PS1 aesthetic) ===
const matSlide = new THREE.MeshLambertMaterial({ color: 0x1a1a1e, flatShading: true });
const matBarrel = new THREE.MeshLambertMaterial({ color: 0xd4d4d8, flatShading: true });
const matFrame = new THREE.MeshLambertMaterial({ color: 0x2a2a2e, flatShading: true });
const matGrip = new THREE.MeshLambertMaterial({ color: 0x222226, flatShading: true });
const matComp = new THREE.MeshLambertMaterial({ color: 0x111114, flatShading: true });
const matMag = new THREE.MeshLambertMaterial({ color: 0x18181c, flatShading: true });
const matMagBase = new THREE.MeshLambertMaterial({ color: 0x333338, flatShading: true });
const matSightGreen = new THREE.MeshBasicMaterial({ color: 0x39ff14 });
const matSightRed = new THREE.MeshBasicMaterial({ color: 0xff2020 });
const matTrigger = new THREE.MeshLambertMaterial({ color: 0x3a3a3e, flatShading: true });
const matRail = new THREE.MeshLambertMaterial({ color: 0x202024, flatShading: true });

// === GEOMETRY HELPERS ===
function box(w, h, d) { return new THREE.BoxGeometry(w, h, d); }

// === BUILD PARTS ===
const gunGroup = new THREE.Group();
scene.add(gunGroup);

// --- SLIDE GROUP ---
const slideGroup = new THREE.Group();
const slideBody = new THREE.Mesh(box(3.6, 0.42, 0.52), matSlide);
slideBody.position.set(0.2, 0.55, 0);
slideGroup.add(slideBody);
// Slide top serrations (rear)
for (let i = 0; i < 5; i++) {
  const serr = new THREE.Mesh(box(0.06, 0.44, 0.54), matSlide);
  serr.position.set(-1.2 + i * 0.14, 0.55, 0);
  slideGroup.add(serr);
}
// Slide front serrations
for (let i = 0; i < 3; i++) {
  const serr = new THREE.Mesh(box(0.06, 0.44, 0.54), matSlide);
  serr.position.set(1.4 + i * 0.14, 0.55, 0);
  slideGroup.add(serr);
}
// Ejection port
const ejPort = new THREE.Mesh(box(0.5, 0.2, 0.3), matBarrel);
ejPort.position.set(0.4, 0.62, 0.14);
slideGroup.add(ejPort);

// --- FRONT SIGHT (green fiber optic) ---
const frontSightPost = new THREE.Mesh(box(0.08, 0.18, 0.06), matSlide);
frontSightPost.position.set(1.85, 0.82, 0);
slideGroup.add(frontSightPost);
const frontFiber = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.07, 6), matSightGreen);
frontFiber.rotation.x = Math.PI / 2;
frontFiber.position.set(1.85, 0.88, 0);
slideGroup.add(frontFiber);

// --- REAR SIGHT (red fiber optic) ---
const rearSightL = new THREE.Mesh(box(0.1, 0.16, 0.06), matSlide);
rearSightL.position.set(-1.5, 0.8, -0.1);
slideGroup.add(rearSightL);
const rearSightR = new THREE.Mesh(box(0.1, 0.16, 0.06), matSlide);
rearSightR.position.set(-1.5, 0.8, 0.1);
slideGroup.add(rearSightR);
const rearFiberL = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.06, 6), matSightRed);
rearFiberL.rotation.x = Math.PI / 2;
rearFiberL.position.set(-1.5, 0.85, -0.1);
slideGroup.add(rearFiberL);
const rearFiberR = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.06, 6), matSightRed);
rearFiberR.rotation.x = Math.PI / 2;
rearFiberR.position.set(-1.5, 0.85, 0.1);
slideGroup.add(rearFiberR);

gunGroup.add(slideGroup);

// --- BARREL GROUP ---
const barrelGroup = new THREE.Group();
const barrelMain = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 3.2, 8), matBarrel);
barrelMain.rotation.z = Math.PI / 2;
barrelMain.position.set(0.4, 0.42, 0);
barrelGroup.add(barrelMain);
const barrelLug = new THREE.Mesh(box(0.3, 0.15, 0.2), matBarrel);
barrelLug.position.set(-0.6, 0.32, 0);
barrelGroup.add(barrelLug);
const chamber = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.14, 0.8, 8), matBarrel);
chamber.rotation.z = Math.PI / 2;
chamber.position.set(-0.5, 0.42, 0);
barrelGroup.add(chamber);
gunGroup.add(barrelGroup);

// --- COMPENSATOR GROUP ---
const compGroup = new THREE.Group();
const compBody = new THREE.Mesh(box(0.7, 0.48, 0.56), matComp);
compBody.position.set(2.2, 0.5, 0);
compGroup.add(compBody);
const compSlot1 = new THREE.Mesh(box(0.08, 0.5, 0.2), matBarrel);
compSlot1.position.set(2.05, 0.5, 0);
compGroup.add(compSlot1);
const compSlot2 = new THREE.Mesh(box(0.08, 0.5, 0.2), matBarrel);
compSlot2.position.set(2.35, 0.5, 0);
compGroup.add(compSlot2);
const compWeight = new THREE.Mesh(box(0.65, 0.12, 0.5), matComp);
compWeight.position.set(2.2, 0.22, 0);
compGroup.add(compWeight);
gunGroup.add(compGroup);

// --- FRAME GROUP ---
const frameGroup = new THREE.Group();
const frameRail = new THREE.Mesh(box(3.2, 0.18, 0.48), matFrame);
frameRail.position.set(0.1, 0.28, 0);
frameGroup.add(frameRail);
const dustCover = new THREE.Mesh(box(1.4, 0.1, 0.44), matRail);
dustCover.position.set(1.0, 0.16, 0);
frameGroup.add(dustCover);
for (let i = 0; i < 4; i++) {
  const slot = new THREE.Mesh(box(0.06, 0.12, 0.46), matFrame);
  slot.position.set(0.5 + i * 0.3, 0.16, 0);
  frameGroup.add(slot);
}
// Trigger guard
const tgFront = new THREE.Mesh(box(0.08, 0.35, 0.12), matFrame);
tgFront.position.set(0.35, -0.02, 0);
frameGroup.add(tgFront);
const tgBottom = new THREE.Mesh(box(0.55, 0.08, 0.12), matFrame);
tgBottom.position.set(0.05, -0.18, 0);
frameGroup.add(tgBottom);
const tgBack = new THREE.Mesh(box(0.08, 0.3, 0.12), matFrame);
tgBack.position.set(-0.22, -0.04, 0);
frameGroup.add(tgBack);
// Trigger
const triggerMesh = new THREE.Mesh(box(0.06, 0.22, 0.08), matTrigger);
triggerMesh.position.set(0.1, -0.02, 0);
triggerMesh.rotation.z = 0.15;
frameGroup.add(triggerMesh);
// Grip
const gripMain = new THREE.Mesh(box(0.55, 1.1, 0.48), matGrip);
gripMain.position.set(-0.7, -0.45, 0);
gripMain.rotation.z = 0.22;
frameGroup.add(gripMain);
// Grip texture
const gripTexL = new THREE.Mesh(box(0.5, 0.8, 0.02), matFrame);
gripTexL.position.set(-0.72, -0.42, 0.25);
gripTexL.rotation.z = 0.22;
frameGroup.add(gripTexL);
const gripTexR = new THREE.Mesh(box(0.5, 0.8, 0.02), matFrame);
gripTexR.position.set(-0.72, -0.42, -0.25);
gripTexR.rotation.z = 0.22;
frameGroup.add(gripTexR);
// Beaver tail
const beavertail = new THREE.Mesh(box(0.3, 0.15, 0.42), matFrame);
beavertail.position.set(-1.1, 0.2, 0);
beavertail.rotation.z = -0.3;
frameGroup.add(beavertail);
// Hammer
const hammerMesh = new THREE.Mesh(box(0.12, 0.25, 0.1), matSlide);
hammerMesh.position.set(-1.35, 0.35, 0);
hammerMesh.rotation.z = -0.4;
frameGroup.add(hammerMesh);
// Mag well
const magWell = new THREE.Mesh(box(0.4, 0.15, 0.4), matFrame);
magWell.position.set(-0.65, -0.95, 0);
magWell.rotation.z = 0.22;
frameGroup.add(magWell);
gunGroup.add(frameGroup);

// --- MAGAZINE GROUP ---
const magGroup = new THREE.Group();
const magBody = new THREE.Mesh(box(0.32, 1.0, 0.4), matMag);
magBody.position.set(-0.7, -0.5, 0);
magBody.rotation.z = 0.22;
magGroup.add(magBody);
const magBase = new THREE.Mesh(box(0.36, 0.12, 0.44), matMagBase);
magBase.position.set(-0.82, -1.0, 0);
magBase.rotation.z = 0.22;
magGroup.add(magBase);
const magLip = new THREE.Mesh(box(0.28, 0.06, 0.34), matBarrel);
magLip.position.set(-0.58, 0.0, 0);
magLip.rotation.z = 0.22;
magGroup.add(magLip);
gunGroup.add(magGroup);

// === ANIMATION ===
const explodedPos = {
  slide: new THREE.Vector3(0, 1.6, 0),
  barrel: new THREE.Vector3(0.5, 0.7, 0),
  comp: new THREE.Vector3(2.0, 0.4, 0),
  frame: new THREE.Vector3(0, 0, 0),
  mag: new THREE.Vector3(-0.5, -1.8, 0)
};
const zeroV = new THREE.Vector3(0, 0, 0);

function easeInOutCubic(t) {
  return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
}

const CYCLE = 6.0;
const HOLD_A = 1.0, TRANS = 1.5, HOLD_E = 1.0;

function getProgress(elapsed) {
  const t = elapsed % CYCLE;
  if (t < HOLD_A) return 0;
  if (t < HOLD_A + TRANS) return easeInOutCubic((t - HOLD_A) / TRANS);
  if (t < HOLD_A + TRANS + HOLD_E) return 1;
  return 1 - easeInOutCubic((t - HOLD_A - TRANS - HOLD_E) / TRANS);
}

function lerpV3(a, b, t) {
  return new THREE.Vector3(a.x+(b.x-a.x)*t, a.y+(b.y-a.y)*t, a.z+(b.z-a.z)*t);
}

const clock = new THREE.Clock();
let angle = 0;

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  const p = getProgress(elapsed);

  slideGroup.position.copy(lerpV3(zeroV, explodedPos.slide, p));
  barrelGroup.position.copy(lerpV3(zeroV, explodedPos.barrel, p));
  compGroup.position.copy(lerpV3(zeroV, explodedPos.comp, p));
  frameGroup.position.copy(zeroV);
  magGroup.position.copy(lerpV3(zeroV, explodedPos.mag, p));

  slideGroup.rotation.z = p * 0.05;
  barrelGroup.rotation.z = p * -0.03;
  magGroup.rotation.z = p * 0.08;

  angle += 0.003;
  gunGroup.rotation.y = Math.sin(angle) * 0.4;

  const pulse = 0.7 + 0.3 * Math.sin(elapsed * 4);
  matSightGreen.color.setRGB(0.22*pulse, 1.0*pulse, 0.08*pulse);
  matSightRed.color.setRGB(1.0*pulse, 0.12*pulse, 0.12*pulse);

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  const a = window.innerWidth / window.innerHeight;
  camera.left = -frustum * a;
  camera.right = frustum * a;
  camera.top = frustum;
  camera.bottom = -frustum;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
