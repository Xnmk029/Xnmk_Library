<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HK USP Match — High-Fidelity Retro 3D Model & Exploded View</title>
  
  <!-- Google Fonts: Share Tech Mono & Chakra Petch -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <!-- Three.js and OrbitControls -->
  <script src="./three.min.js"></script>
  <script src="./OrbitControls.js"></script>
  <script>
    if (typeof THREE === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
      document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"><\/script>');
    }
  </script>

  <style>
    :root {
      --bg-color: #222528;
      --panel-bg: rgba(14, 18, 20, 0.94);
      --panel-border: #3b4b50;
      --accent-green: #00ff55;
      --accent-amber: #ff9900;
      --accent-red: #ff2244;
      --accent-cyan: #00e5ff;
      --text-main: #e2f1f5;
      --text-dim: #8297a0;
      --hud-font: 'Share Tech Mono', monospace;
      --title-font: 'Chakra Petch', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      font-family: var(--hud-font);
      color: var(--text-main);
    }

    #webgl-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* SVG Overlay for Exploded View Labels & Guide Lines */
    #svg-hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Retro 90s FPS HUD Elements */
    .hud-header {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: var(--panel-bg);
      border: 2px solid var(--panel-border);
      padding: 14px 20px;
      border-radius: 4px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6), inset 0 0 12px rgba(0,229,255,0.08);
      backdrop-filter: blur(8px);
      max-width: 440px;
    }

    .hud-title {
      font-family: var(--title-font);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .hud-title .tag {
      font-size: 10px;
      font-family: var(--hud-font);
      background: #ff5500;
      color: #000;
      padding: 2px 6px;
      font-weight: bold;
      border-radius: 2px;
    }

    .hud-subtitle {
      font-size: 12px;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
    }

    /* Top Right Controls & Aesthetic Settings */
    .hud-top-right {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
    }

    .hud-badge-group {
      display: flex;
      gap: 8px;
    }

    .badge {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      padding: 6px 12px;
      font-size: 11px;
      color: var(--text-dim);
      border-radius: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge.active {
      color: var(--accent-green);
      border-color: var(--accent-green);
    }

    .badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }

    /* Interactive Control Panel */
    .hud-bottom-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: var(--panel-bg);
      border: 2px solid var(--panel-border);
      border-radius: 6px;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      min-width: 680px;
      max-width: 90vw;
    }

    .panel-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .slider-label {
      font-size: 12px;
      color: var(--text-dim);
      width: 110px;
      text-transform: uppercase;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: #141c1f;
      height: 8px;
      border-radius: 4px;
      border: 1px solid var(--panel-border);
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 2px;
      background: var(--accent-cyan);
      cursor: pointer;
      box-shadow: 0 0 10px var(--accent-cyan);
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      background: #182226;
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 8px 14px;
      font-family: var(--hud-font);
      font-size: 12px;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
    }

    .btn:hover {
      background: #25353b;
      border-color: var(--accent-cyan);
      color: #fff;
    }

    .btn.active {
      background: rgba(0, 229, 255, 0.18);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
    }

    .btn.danger {
      border-color: var(--accent-red);
      color: var(--accent-red);
    }

    .btn.danger:hover {
      background: rgba(255, 34, 68, 0.2);
    }

    /* Part Inspector Modal Card */
    .part-card {
      position: absolute;
      bottom: 120px;
      left: 20px;
      z-index: 10;
      background: var(--panel-bg);
      border: 2px solid var(--accent-cyan);
      padding: 16px;
      border-radius: 4px;
      width: 320px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    .part-card.visible {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .part-card-title {
      font-family: var(--title-font);
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-cyan);
      margin-bottom: 6px;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }

    .part-card-desc {
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.5;
    }

    /* Center Crosshair */
    .crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 24px;
      height: 24px;
      pointer-events: none;
      z-index: 5;
      opacity: 0.2;
    }

    .crosshair::before, .crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.4);
    }

    .crosshair::before {
      top: 11px; left: 0; width: 24px; height: 2px;
    }
    .crosshair::after {
      top: 0; left: 11px; width: 2px; height: 24px;
    }

    /* CRT scanlines */
    .scanlines {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 4;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.12) 50%
      );
      background-size: 100% 4px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .scanlines.active {
      opacity: 1;
    }

    /* Callout Pin Labels */
    .hud-callout {
      position: absolute;
      background: var(--panel-bg);
      border: 1px solid var(--accent-cyan);
      color: var(--text-main);
      padding: 4px 8px;
      font-size: 10px;
      border-radius: 2px;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transform: translate(-50%, -100%);
      transition: opacity 0.2s ease;
    }

    .hud-callout .sub {
      color: var(--accent-green);
      font-size: 8px;
      display: block;
    }

    @media (max-width: 768px) {
      .hud-bottom-panel {
        min-width: 95vw;
        padding: 12px;
      }
      .hud-header {
        max-width: calc(100vw - 40px);
      }
    }
  </style>
</head>
<body>

  <!-- WebGL Canvas Container -->
  <div id="webgl-container"></div>

  <!-- SVG Overlay for Exploded View Lines & Annotations -->
  <svg id="svg-hud"></svg>

  <!-- CRT Scanline Effect Overlay -->
  <div id="scanlines" class="scanlines"></div>

  <!-- Center Crosshair -->
  <div class="crosshair"></div>

  <!-- Header Panel -->
  <div class="hud-header">
    <div class="hud-title">
      HK USP MATCH
      <span class="tag">HALF-LIFE / PS1</span>
    </div>
    <div class="hud-subtitle">
      <span>CALIBER: .45 ACP / 9mm</span>
      <span>HIGH-FIDELITY 3D ASSET</span>
    </div>
  </div>

  <!-- Top Right Badges -->
  <div class="hud-top-right">
    <div class="hud-badge-group">
      <div class="badge active" id="badge-fps"><div class="dot"></div> 60 FPS</div>
      <div class="badge" id="badge-shading"><div class="dot"></div> FLAT SHADING</div>
      <div class="badge" id="badge-mode"><div class="dot"></div> AUTO LOOP</div>
    </div>
  </div>

  <!-- Hover/Click Part Inspector -->
  <div id="part-card" class="part-card">
    <div class="part-card-title">
      <span id="part-name">FRONT MATCH COMPENSATOR</span>
      <span id="part-id" style="font-size: 10px; color: var(--accent-green)">#04</span>
    </div>
    <div class="part-card-desc" id="part-desc">
      Iconic USP Match barrel weight extension with 5 diagonal bottom venting ports and rail lock screws.
    </div>
  </div>

  <!-- Callout Labels container -->
  <div id="callout-container"></div>

  <!-- Bottom Control Panel -->
  <div class="hud-bottom-panel">
    <!-- Explode Slider Row -->
    <div class="panel-row">
      <div class="slider-container">
        <span class="slider-label">EXPLODE VIEW:</span>
        <input type="range" id="explode-slider" min="0" max="100" value="0">
        <span id="explode-val" style="width: 40px; font-size: 12px; color: var(--accent-cyan); text-align: right;">0%</span>
      </div>

      <div class="btn-group">
        <button class="btn active" id="btn-loop-toggle">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.13 15.57a10 10 0 1 0 3.73-10.87l5.64-5.64"/></svg>
          AUTO LOOP
        </button>
        <button class="btn" id="btn-sound-toggle">
          🔊 AUDIO SFX
        </button>
      </div>
    </div>

    <!-- Actions & Views Row -->
    <div class="panel-row">
      <div class="btn-group">
        <span class="slider-label" style="line-height: 30px;">ACTIONS:</span>
        <button class="btn" id="btn-rack">RACK SLIDE</button>
        <button class="btn danger" id="btn-fire">FIRE SHOT</button>
        <button class="btn" id="btn-reload">EJECT MAG</button>
      </div>

      <div class="btn-group">
        <span class="slider-label" style="line-height: 30px;">CAMERA:</span>
        <button class="btn active" id="btn-cam-ortho">ORTHO SIDE</button>
        <button class="btn" id="btn-cam-iso">3/4 PERSPECTIVE</button>
        <button class="btn" id="btn-cam-front">FRONT MATCH</button>
      </div>
    </div>

    <!-- Aesthetic Toggles Row -->
    <div class="panel-row" style="border-top: 1px dashed var(--panel-border); padding-top: 10px; margin-top: 2px;">
      <span class="slider-label">BACKGROUND:</span>
      <div class="btn-group" style="flex: 1;">
        <button class="btn active" id="btn-bg-toggle">BG: DARK ISOLATED</button>
        <button class="btn" id="btn-ps1-wobble">VERTEX JITTER: OFF</button>
        <button class="btn" id="btn-wireframe">WIREFRAME: OFF</button>
        <button class="btn" id="btn-scanlines">CRT SCANLINES</button>
        <button class="btn" id="btn-reset-cam">RESET CAMERA</button>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================================
       HK USP MATCH — HIGH-FIDELITY RETRO 90S PS1 3D ENGINE
       ========================================================================= */

    // Sound FX Generator using Web Audio API
    class RetroSoundFX {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
      }

      playRack() {
        if (!this.enabled) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(90, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.12);

        setTimeout(() => {
          if (!this.ctx) return;
          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(750, this.ctx.currentTime);
          osc2.frequency.exponentialRampToValueAtTime(140, this.ctx.currentTime + 0.08);
          gain2.gain.setValueAtTime(0.4, this.ctx.currentTime);
          gain2.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);
          osc2.start();
          osc2.stop(this.ctx.currentTime + 0.08);
        }, 110);
      }

      playFire() {
        if (!this.enabled) return;
        this.init();
        const bufferSize = this.ctx.sampleRate * 0.25;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(2800, this.ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(180, this.ctx.currentTime + 0.25);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.75, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();
      }

      playMagClick() {
        if (!this.enabled) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(480, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.09);
        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.09);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.09);
      }
    }

    const audioFX = new RetroSoundFX();

    // Scene & Renderer Setup
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    
    // Default Light Neutral Background for high contrast & silhouette clarity
    let isDarkBg = false;
    scene.background = new THREE.Color(0xd0d7da);

    // Dual Cameras (Perspective & Orthographic)
    const aspect = window.innerWidth / window.innerHeight;
    const orthoSize = 2.2; // Large model framing filling upper 70% of viewport
    const cameraOrtho = new THREE.OrthographicCamera(
      -orthoSize * aspect, orthoSize * aspect,
      orthoSize, -orthoSize,
      0.1, 1000
    );
    // Ortho side elevation view (looking straight down +Z axis at side of gun)
    cameraOrtho.position.set(0, 0.45, 10);
    cameraOrtho.lookAt(0, 0.45, 0);

    const cameraPersp = new THREE.PerspectiveCamera(40, aspect, 0.1, 1000);
    cameraPersp.position.set(5.0, 2.5, 5.5);
    cameraPersp.lookAt(0, 0.45, 0);

    // Orthographic Camera as DEFAULT to match reference image 1:1!
    let activeCamera = cameraOrtho;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0xd0d7da, 1.0);
    container.appendChild(renderer.domElement);

    const OrbitControlsClass = (typeof THREE !== 'undefined' && THREE.OrbitControls) ? THREE.OrbitControls : (window.OrbitControls || OrbitControls);
    const controls = new OrbitControlsClass(activeCamera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.maxDistance = 25;
    controls.minDistance = 1.2;

    // Studio Lighting (Calibrated for HK Gun Metal & Matte Polymer)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
    keyLight.position.set(6, 8, 10);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x80a0c0, 0.45);
    fillLight.position.set(-6, -4, 6);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffffff, 0.6);
    rimLight.position.set(-5, 6, -8);
    scene.add(rimLight);


    // =========================================================================
    // ACCURATE PBR MATERIALS (HK FACTORY COLOR & ROUGHNESS PALETTE)
    // =========================================================================

    const matPolymerFrame = new THREE.MeshStandardMaterial({
      color: 0x1c1e21, // HK Dark Polymer
      roughness: 0.75,
      metalness: 0.12,
      flatShading: true
    });

    const matGripStipple = new THREE.MeshStandardMaterial({
      color: 0x141618,
      roughness: 0.9,
      metalness: 0.05,
      flatShading: true
    });

    const matDarkSteelSlide = new THREE.MeshStandardMaterial({
      color: 0x282b2f, // HK Dark Nitride Nitro-Carburized Steel
      roughness: 0.35,
      metalness: 0.78,
      flatShading: true
    });

    const matSilverBarrel = new THREE.MeshStandardMaterial({
      color: 0xf0f0f0, // Polished Chrome Match Barrel
      roughness: 0.15,
      metalness: 0.95,
      flatShading: true
    });

    const matMatchWeight = new THREE.MeshStandardMaterial({
      color: 0x24272a, // Satin Anodized Aluminum Compensator
      roughness: 0.4,
      metalness: 0.75,
      flatShading: true
    });

    const matSteelControls = new THREE.MeshStandardMaterial({
      color: 0x16181a,
      roughness: 0.35,
      metalness: 0.85,
      flatShading: true
    });

    const matMagBody = new THREE.MeshStandardMaterial({
      color: 0x32363a,
      roughness: 0.3,
      metalness: 0.9,
      flatShading: true
    });

    const matBrassRound = new THREE.MeshStandardMaterial({
      color: 0xd4af37,
      roughness: 0.2,
      metalness: 0.9,
      flatShading: true
    });

    // Emissive Fiber Optic Sight Materials
    const matFiberGreen = new THREE.MeshStandardMaterial({
      color: 0x00ff44,
      emissive: 0x00ff44,
      emissiveIntensity: 1.0,
      roughness: 0.1,
      flatShading: true
    });

    const matFiberRed = new THREE.MeshStandardMaterial({
      color: 0xff1133,
      emissive: 0xff1133,
      emissiveIntensity: 1.0,
      roughness: 0.1,
      flatShading: true
    });


    // Master Pistol Group & Subgroups for Exploded View
    const uspPistolGroup = new THREE.Group();
    scene.add(uspPistolGroup);

    const partFrame = new THREE.Group();
    const partSlide = new THREE.Group();
    const partBarrel = new THREE.Group();
    const partMatchComp = new THREE.Group();
    const partMagazine = new THREE.Group();
    const partRecoilSpring = new THREE.Group();
    const partFrontSight = new THREE.Group();
    const partRearSight = new THREE.Group();

    uspPistolGroup.add(partFrame);
    uspPistolGroup.add(partSlide);
    uspPistolGroup.add(partBarrel);
    uspPistolGroup.add(partMatchComp);
    uspPistolGroup.add(partMagazine);
    uspPistolGroup.add(partRecoilSpring);

    const partSpecs = {
      'frame': {
        name: 'POLYMER FRAME & GRIP',
        id: '#01',
        desc: 'HK high-strength glass-fiber reinforced polymer frame with checkering, accessory rail, ambidextrous mag release, and low-poly trigger assembly.'
      },
      'slide': {
        name: 'DARK STEEL SLIDE',
        id: '#02',
        desc: 'Nitro-carburized dark steel slide with rear cocking serrations, ejection port, and dovetail sight cuts.'
      },
      'barrel': {
        name: 'EXPOSED SILVER BARREL',
        id: '#03',
        desc: 'Bright chrome-plated 5.09" Match barrel with polygonal rifling, locking block, and chamber extractor.'
      },
      'compensator': {
        name: 'FRONT MATCH COMPENSATOR',
        id: '#04',
        desc: 'Iconic USP Match barrel weight extension with 5 diagonal bottom venting ports for muzzle flip reduction.'
      },
      'magazine': {
        name: '12-ROUND .45 ACP MAGAZINE',
        id: '#05',
        desc: 'Steel magazine body with extended polymer bumper basepad and loaded brass cartridges.'
      },
      'recoil': {
        name: 'RECOIL SPRING ASSEMBLY',

    // --- 3. FRONT MATCH COMPENSATOR WEIGHT (USP MATCH SIGNATURE) ---

    // --- 5. FIBER OPTIC SIGHTS ---

    const frontSightBaseGeo = new THREE.BoxGeometry(0.28, 0.2, 0.14);

    const frontFiberGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.26, 8);

    const frontFiberMesh = tagMesh(new THREE.Mesh(frontFiberGeo, matFiberGreen), 'sights');
    frontFiberMesh.position.set(2.32, 0.92, 0);
    partFrontSight.add(frontFiberMesh);
    partMatchComp.add(partFrontSight);

    // Rear Sight Base (on rear of Slide)
    const rearSightBaseGeo = new THREE.BoxGeometry(0.38, 0.22, 0.44);
    const rearSightBase = tagMesh(new THREE.Mesh(rearSightBaseGeo, matSteelControls), 'sights');
    rearSightBase.position.set(-1.4, 0.88, 0);
    partRearSight.add(rearSightBase);

    // Dual Glowing Red Rear Fiber Optic Dots
    for (let z of [-0.13, 0.13]) {

      rearFiberGeo.rotateZ(Math.PI / 2);
      const rearFiberMesh = tagMesh(new THREE.Mesh(rearFiberGeo, matFiberRed), 'sights');
      rearFiberMesh.position.set(-1.4, 0.92, z);

    }
    partSlide.add(partRearSight);


    // --- 6. RECOIL SPRING & GUIDE ROD ---
    const guideRodGeo = new THREE.CylinderGeometry(0.085, 0.085, 2.5, 8);

    guideRodMesh.position.set(0.85, -0.05, 0);

    const springCoilGeo = new THREE.CylinderGeometry(0.13, 0.13, 2.0, 12);

    springCoilMesh.position.set(0.75, -0.05, 0);

    // --- 7. DETACHED / REMOVABLE MAGAZINE ---
    // Steel Mag Body
    const magBodyGeo = new THREE.BoxGeometry(0.9, 2.1, 0.52);
    const magBodyMesh = tagMesh(new THREE.Mesh(magBodyGeo, matMagBody), 'magazine');
    magBodyMesh.position.set(-0.8, -1.3, 0);
    magBodyMesh.rotation.z = 0.22;
    partMagazine.add(magBodyMesh);

    // Extended Polymer Basepad Bumper
    const magBaseGeo = new THREE.BoxGeometry(1.15, 0.28, 0.64);
    const magBaseMesh = tagMesh(new THREE.Mesh(magBaseGeo, matPolymerFrame), 'magazine');
    magBaseMesh.position.set(-1.08, -2.3, 0);
    magBaseMesh.rotation.z = 0.22;
    partMagazine.add(magBaseMesh);

    // Loaded Brass Cartridges at top of Mag
    for (let x of [-0.9, -0.7]) {
      const bulletGeo = new THREE.CylinderGeometry(0.13, 0.13, 0.68, 10);
      bulletGeo.rotateZ(Math.PI / 2);
      const bulletMesh = tagMesh(new THREE.Mesh(bulletGeo, matBrassRound), 'magazine');
      bulletMesh.position.set(x, -0.2, 0);
      partMagazine.add(bulletMesh);
    }

    // Center pistol in world coordinates
    uspPistolGroup.position.set(-0.2, 0.45, 0);


    // =========================================================================
    // EXPLODED VIEW POSITIONS & ANIMATION ENGINE
    // =========================================================================

    const explodedOffsets = {
      frame:        { x: 0,    y: -0.5, z: 0 },
      slide:        { x: -1.6, y: 1.2,  z: 0 },
      barrel:       { x: 1.2,  y: 0.9,  z: 0 },
      compensator:  { x: 2.8,  y: 0.1,  z: 0 },
      magazine:     { x: -0.5, y: -2.6, z: 0 },
      recoilSpring: { x: 1.5,  y: 0.2,  z: 0 }
    };

    let explodeProgress = 0; // 0.0 (Assembled) to 1.0 (Exploded)
    let autoLoop = true;
    let loopTime = 0;
    let ps1WobbleActive = false;
    let wireframeActive = false;

    let isRackingSlide = false;
    let rackProgress = 0;
    let isFiring = false;
    let fireTime = 0;

    function updateExplodePositions(progress) {
      const ease = progress < 0.5 ? 2 * progress * progress : -1 + (4 - 2 * progress) * progress;

      partFrame.position.set(
        explodedOffsets.frame.x * ease,
        explodedOffsets.frame.y * ease,
        explodedOffsets.frame.z * ease
      );

      partSlide.position.set(
        explodedOffsets.slide.x * ease,
        explodedOffsets.slide.y * ease,
        explodedOffsets.slide.z * ease
      );

      partBarrel.position.set(
        explodedOffsets.barrel.x * ease,
        explodedOffsets.barrel.y * ease,
        explodedOffsets.barrel.z * ease
      );

      partMatchComp.position.set(
        explodedOffsets.compensator.x * ease,
        explodedOffsets.compensator.y * ease,
        explodedOffsets.compensator.z * ease
      );

      partMagazine.position.set(
        explodedOffsets.magazine.x * ease,
        explodedOffsets.magazine.y * ease,
        explodedOffsets.magazine.z * ease
      );

      partRecoilSpring.position.set(
        explodedOffsets.recoilSpring.x * ease,
        explodedOffsets.recoilSpring.y * ease,
        explodedOffsets.recoilSpring.z * ease
      );

      document.getElementById('explode-slider').value = Math.round(progress * 100);
      document.getElementById('explode-val').innerText = `${Math.round(progress * 100)}%`;

      updateHUDCallouts();
    }


    // =========================================================================
    // SVG HUD ANNOTATIONS & CALLOUT PIN LABELS
    // =========================================================================

    const calloutContainer = document.getElementById('callout-container');
    const svgHud = document.getElementById('svg-hud');

    const calloutParts = [
      { group: partMatchComp, title: 'MATCH COMPENSATOR', sub: 'WEIGHT & 5-PORT VENTS', key: 'compensator' },
      { group: partBarrel,    title: 'SILVER MATCH BARREL', sub: 'POLYGONAL RIFLING .45', key: 'barrel' },
      { group: partSlide,     title: 'DARK STEEL SLIDE', sub: 'FIBER OPTIC SIGHTS', key: 'slide' },
      { group: partFrame,     title: 'POLYMER FRAME', sub: 'STIPPLED GRIP & RAIL', key: 'frame' },
      { group: partMagazine,  title: '12-RD MAGAZINE', sub: 'EXTENDED BASEPAD', key: 'magazine' }
    ];

    calloutParts.forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = 'hud-callout';
      div.id = `callout-${idx}`;
      div.innerHTML = `<strong>${item.title}</strong><span class="sub">${item.sub}</span>`;
      calloutContainer.appendChild(div);
    });

    function projectToScreen(position, camera) {
      const vector = position.clone();
      vector.project(camera);
      const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
      const y = (-(vector.y * 0.5) + 0.5) * window.innerHeight;
      return { x, y, visible: vector.z < 1.0 };
    }

    function updateHUDCallouts() {
      try {
        if (!calloutContainer || !svgHud) return;
        if (explodeProgress < 0.25) {
          calloutContainer.style.opacity = '0';
          svgHud.innerHTML = '';
          return;
        }
        calloutContainer.style.opacity = '1';

        let svgLines = '';
        calloutParts.forEach((item, idx) => {
          const el = document.getElementById(`callout-${idx}`);
          if (!el || !item.group) return;

          const worldPos = new THREE.Vector3();
          item.group.getWorldPosition(worldPos);

          const screenPos = projectToScreen(worldPos, activeCamera);

          if (screenPos.visible && !isNaN(screenPos.x) && !isNaN(screenPos.y)) {
            el.style.left = `${screenPos.x}px`;
            el.style.top = `${screenPos.y - 30}px`;
            el.style.display = 'block';

            svgLines += `
              <circle cx="${screenPos.x}" cy="${screenPos.y}" r="4" fill="#00e5ff" />
              <line x1="${screenPos.x}" y1="${screenPos.y}" x2="${screenPos.x}" y2="${screenPos.y - 30}" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="3,3" />
            `;
          } else {
            el.style.display = 'none';
          }
        });
        svgHud.innerHTML = svgLines;
      } catch (err) {
        // Silently catch HUD errors
      }
    }


    // =========================================================================
    // RAYCASTING / PART INSPECTOR (HOVER & CLICK)
    // =========================================================================

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const partCard = document.getElementById('part-card');

    window.addEventListener('pointermove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, activeCamera);
      const intersects = raycaster.intersectObjects(uspPistolGroup.children, true);

      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj && !obj.userData.partKey && obj.parent) {
          obj = obj.parent;
        }
        const key = obj ? obj.userData.partKey : null;

        if (key && partSpecs[key]) {
          document.body.style.cursor = 'pointer';
        } else {
          document.body.style.cursor = 'default';
        }
      } else {
        document.body.style.cursor = 'default';
      }
    });

    window.addEventListener('click', (e) => {
      if (e.target.closest('.hud-bottom-panel') || e.target.closest('.hud-header')) return;

      raycaster.setFromCamera(mouse, activeCamera);
      const intersects = raycaster.intersectObjects(uspPistolGroup.children, true);

      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj && !obj.userData.partKey && obj.parent) {
          obj = obj.parent;
        }
        const key = obj ? obj.userData.partKey : null;

        if (key && partSpecs[key]) {
          const spec = partSpecs[key];
          document.getElementById('part-name').innerText = spec.name;
          document.getElementById('part-id').innerText = spec.id;
          document.getElementById('part-desc').innerText = spec.desc;
          partCard.classList.add('visible');
          audioFX.playMagClick();
          return;
        }
      }
      partCard.classList.remove('visible');
    });


    // =========================================================================
    // UI CONTROLS & EVENT LISTENERS
    // =========================================================================

    const slider = document.getElementById('explode-slider');
    slider.addEventListener('input', (e) => {
      autoLoop = false;
      document.getElementById('btn-loop-toggle').classList.remove('active');
      document.getElementById('badge-mode').innerText = 'MANUAL SLIDER';
      explodeProgress = parseFloat(e.target.value) / 100;
      updateExplodePositions(explodeProgress);
    });

    const btnLoop = document.getElementById('btn-loop-toggle');
    btnLoop.addEventListener('click', () => {
      autoLoop = !autoLoop;
      btnLoop.classList.toggle('active', autoLoop);
      document.getElementById('badge-mode').innerText = autoLoop ? 'AUTO LOOP' : 'MANUAL SLIDER';
    });

    const btnSound = document.getElementById('btn-sound-toggle');
    btnSound.addEventListener('click', () => {
      audioFX.enabled = !audioFX.enabled;
      btnSound.innerText = audioFX.enabled ? '🔊 AUDIO SFX' : '🔇 AUDIO OFF';
    });

    document.getElementById('btn-rack').addEventListener('click', () => {
      isRackingSlide = true;
      rackProgress = 0;
      audioFX.playRack();
    });

    document.getElementById('btn-fire').addEventListener('click', () => {
      isFiring = true;
      fireTime = 0;
      audioFX.playFire();
    });

    document.getElementById('btn-reload').addEventListener('click', () => {
      audioFX.playMagClick();
      autoLoop = false;
      btnLoop.classList.remove('active');
      let t = 0;
      const magAnim = setInterval(() => {
        t += 0.05;
        partMagazine.position.y = -1.3 - Math.sin(t * Math.PI) * 2.2;
        if (t >= 1) {
          clearInterval(magAnim);
          partMagazine.position.y = 0;
        }
      }, 16);
    });

    function setCameraPreset(type) {
      document.querySelectorAll('.btn-group .btn').forEach(b => {
        if (b.id.startsWith('btn-cam-')) b.classList.remove('active');
      });

      if (type === 'ortho') {
        activeCamera = cameraOrtho;
        cameraOrtho.position.set(0, 0, 10);
        cameraOrtho.lookAt(0, 0, 0);
        document.getElementById('btn-cam-ortho').classList.add('active');
      } else if (type === 'iso') {
        activeCamera = cameraPersp;
        cameraPersp.position.set(5.5, 2.8, 6.0);
        cameraPersp.lookAt(0, 0, 0);
        document.getElementById('btn-cam-iso').classList.add('active');
      } else if (type === 'front') {
        activeCamera = cameraPersp;
        cameraPersp.position.set(7.5, 0.8, 0);
        cameraPersp.lookAt(0, 0.4, 0);
        document.getElementById('btn-cam-front').classList.add('active');
      }
      controls.object = activeCamera;
      controls.update();
    }

    document.getElementById('btn-cam-ortho').addEventListener('click', () => setCameraPreset('ortho'));
    document.getElementById('btn-cam-iso').addEventListener('click', () => setCameraPreset('iso'));
    document.getElementById('btn-cam-front').addEventListener('click', () => setCameraPreset('front'));
    document.getElementById('btn-reset-cam').addEventListener('click', () => setCameraPreset('ortho'));

    // Toggle Background (Dark Isolated vs Light Neutral)
    document.getElementById('btn-bg-toggle').addEventListener('click', (e) => {
      isDarkBg = !isDarkBg;
      scene.background = new THREE.Color(isDarkBg ? 0x141719 : 0xc4ccce);
      document.body.style.backgroundColor = isDarkBg ? '#141719' : '#c4ccce';
      e.target.innerText = isDarkBg ? 'BG: DARK ISOLATED' : 'BG: LIGHT NEUTRAL';
    });

    document.getElementById('btn-ps1-wobble').addEventListener('click', (e) => {
      ps1WobbleActive = !ps1WobbleActive;
      e.target.classList.toggle('active', ps1WobbleActive);
      e.target.innerText = ps1WobbleActive ? 'VERTEX JITTER: ON' : 'VERTEX JITTER: OFF';
    });

    document.getElementById('btn-wireframe').addEventListener('click', (e) => {
      wireframeActive = !wireframeActive;
      e.target.classList.toggle('active', wireframeActive);
      e.target.innerText = wireframeActive ? 'WIREFRAME: ON' : 'WIREFRAME: OFF';

      uspPistolGroup.traverse((child) => {
        if (child.isMesh && child.material) {
          child.material.wireframe = wireframeActive;
        }
      });
    });

    document.getElementById('btn-scanlines').addEventListener('click', (e) => {
      const scanlines = document.getElementById('scanlines');
      scanlines.classList.toggle('active');
      e.target.classList.toggle('active', scanlines.classList.contains('active'));
    });


    // =========================================================================
    // MAIN RENDER & ANIMATION LOOP
    // =========================================================================

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      loopTime += delta;

      if (autoLoop) {
        const cycle = (Math.sin(loopTime * 0.8) + 1) / 2;
        explodeProgress = cycle;
        updateExplodePositions(explodeProgress);
      }

      if (isRackingSlide) {
        rackProgress += delta * 4;
        if (rackProgress < 1.0) {
          partSlide.position.x = -Math.sin(rackProgress * Math.PI) * 1.2;
          partBarrel.position.x = -Math.sin(rackProgress * Math.PI) * 0.25;
        } else {
          isRackingSlide = false;
          partSlide.position.x = 0;
          partBarrel.position.x = 0;
        }
      }

      if (isFiring) {
        fireTime += delta * 10;
        if (fireTime < 1.0) {
          uspPistolGroup.rotation.z = Math.sin(fireTime * Math.PI) * 0.12;
          uspPistolGroup.position.x = -Math.sin(fireTime * Math.PI) * 0.2;
        } else {
          isFiring = false;
          uspPistolGroup.rotation.z = 0;
          uspPistolGroup.position.x = -0.4;
        }
      }

      if (ps1WobbleActive) {
        const wobbleFactor = 0.008;
        uspPistolGroup.rotation.y = Math.sin(loopTime * 3) * wobbleFactor;
        uspPistolGroup.rotation.x = Math.cos(loopTime * 2.5) * wobbleFactor;
      } else if (!isFiring) {
        uspPistolGroup.rotation.y = 0;
        uspPistolGroup.rotation.x = 0;
      }

      try {
        controls.update();
        renderer.render(scene, activeCamera);
      } catch (renderErr) {
        console.error('Render error:', renderErr);
      }
      updateHUDCallouts();
    }

    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const newAspect = w / h;

      cameraOrtho.left = -orthoSize * newAspect;
      cameraOrtho.right = orthoSize * newAspect;
      cameraOrtho.top = orthoSize;
      cameraOrtho.bottom = -orthoSize;
      cameraOrtho.updateProjectionMatrix();

      cameraPersp.aspect = newAspect;
      cameraPersp.updateProjectionMatrix();

      renderer.setSize(w, h);
      updateHUDCallouts();
    });

    animate();
  </script>
</body>
</html>
