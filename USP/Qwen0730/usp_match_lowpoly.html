<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>USP Match - Low-Poly PS1 Style</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #c8c8c8; overflow: hidden; font-family: 'Courier New', monospace; }
canvas { display: block; image-rendering: pixelated; }
#info {
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
  color: #333; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
}
#title {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  color: #222; font-size: 14px; font-weight: bold; letter-spacing: 2px;
}
</style>
</head>
<body>
<div id="title">USP MATCH .45 ACP // PS1-STYLE</div>
<div id="info">EXPLODED VIEW - ASSEMBLY ANIMATION LOOP</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

// === SCENE SETUP ===
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc8c8c8);

const aspect = window.innerWidth / window.innerHeight;
const frustum = 5.5;
const camera = new THREE.OrthographicCamera(
  -frustum * aspect, frustum * aspect, frustum, -frustum, 0.1, 100
);
camera.position.set(6, 4, 8);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(0.5); // PS1 low-res look
renderer.shadowMap.enabled = false;
document.body.appendChild(renderer.domElement);

// === LIGHTING (flat/harsh PS1 style) ===
const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
dirLight.position.set(3, 5, 4);
scene.add(dirLight);
const ambLight = new THREE.AmbientLight(0x666666, 1.0);
scene.add(ambLight);
const fillLight = new THREE.DirectionalLight(0x8888aa, 0.4);
fillLight.position.set(-3, -1, -2);
scene.add(fillLight);

// === MATERIALS (flat shading, PS1 aesthetic) ===
const matSlide = new THREE.MeshLambertMaterial({ color: 0x1a1a1e, flatShading: true });
const matBarrel = new THREE.MeshLambertMaterial({ color: 0xd0d0d8, flatShading: true });
const matFrame = new THREE.MeshLambertMaterial({ color: 0x2a2a2e, flatShading: true });
const matGrip = new THREE.MeshLambertMaterial({ color: 0x1e1e22, flatShading: true });
const matComp = new THREE.MeshLambertMaterial({ color: 0x222228, flatShading: true });
const matMag = new THREE.MeshLambertMaterial({ color: 0x18181c, flatShading: true });
const matTrigger = new THREE.MeshLambertMaterial({ color: 0x3a3a40, flatShading: true });
const matSightGreen = new THREE.MeshBasicMaterial({ color: 0x00ff44 });
const matSightRed = new THREE.MeshBasicMaterial({ color: 0xff2200 });
const matSilver = new THREE.MeshLambertMaterial({ color: 0xaaaabc, flatShading: true });

// === HELPER: Create low-poly box ===
function lowBox(w, h, d, mat) {
  const geo = new THREE.BoxGeometry(w, h, d, 1, 1, 1);
  return new THREE.Mesh(geo, mat);
}

// === BUILD PARTS ===
const gunGroup = new THREE.Group();
scene.add(gunGroup);

// -- SLIDE GROUP --
const slideGroup = new THREE.Group();
// Main slide body
const slideBody = lowBox(3.6, 0.42, 0.48, matSlide);
slideBody.position.set(0.2, 0.55, 0);
slideGroup.add(slideBody);
// Slide top rail
const slideTop = lowBox(3.2, 0.08, 0.36, matSlide);
slideTop.position.set(0.2, 0.78, 0);
slideGroup.add(slideTop);
// Slide serrations (rear)
for (let i = 0; i < 6; i++) {
  const serr = lowBox(0.04, 0.36, 0.50, matSlide);
  serr.position.set(-1.2 + i * 0.12, 0.55, 0);
  slideGroup.add(serr);
}
// Slide front serrations
for (let i = 0; i < 4; i++) {
  const serr = lowBox(0.04, 0.30, 0.50, matSlide);
  serr.position.set(1.4 + i * 0.12, 0.55, 0);
  slideGroup.add(serr);
}
// Ejection port
const ejPort = lowBox(0.5, 0.20, 0.10, matBarrel);
ejPort.position.set(0.3, 0.62, 0.24);
slideGroup.add(ejPort);
// Front sight (GREEN fiber optic)
const frontSight = lowBox(0.06, 0.14, 0.06, matSightGreen);
frontSight.position.set(1.7, 0.88, 0);
slideGroup.add(frontSight);
// Rear sight (RED fiber optic)
const rearSightBase = lowBox(0.18, 0.12, 0.30, matSlide);
rearSightBase.position.set(-1.3, 0.84, 0);
slideGroup.add(rearSightBase);
const rearSightL = lowBox(0.06, 0.10, 0.05, matSightRed);
rearSightL.position.set(-1.3, 0.92, -0.08);
slideGroup.add(rearSightL);
const rearSightR = lowBox(0.06, 0.10, 0.05, matSightRed);
rearSightR.position.set(-1.3, 0.92, 0.08);
slideGroup.add(rearSightR);
// Muzzle end
const slideMuzzle = lowBox(0.15, 0.34, 0.40, matSlide);
slideMuzzle.position.set(2.0, 0.52, 0);
slideGroup.add(slideMuzzle);

// -- BARREL GROUP --
const barrelGroup = new THREE.Group();
const barrelMain = new THREE.Mesh(
  new THREE.CylinderGeometry(0.12, 0.12, 3.0, 6),
  matBarrel
);
barrelMain.rotation.z = Math.PI / 2;
barrelMain.position.set(0.4, 0.42, 0);
barrelGroup.add(barrelMain);
// Barrel lug
const barrelLug = lowBox(0.3, 0.18, 0.22, matBarrel);
barrelLug.position.set(-0.6, 0.32, 0);
barrelGroup.add(barrelLug);
// Barrel tip
const barrelTip = new THREE.Mesh(
  new THREE.CylinderGeometry(0.14, 0.12, 0.2, 6),
  matSilver
);
barrelTip.rotation.z = Math.PI / 2;
barrelTip.position.set(1.95, 0.42, 0);
barrelGroup.add(barrelTip);

// -- FRAME GROUP --
const frameGroup = new THREE.Group();
// Main frame rail
const frameRail = lowBox(3.0, 0.16, 0.44, matFrame);
frameRail.position.set(0.1, 0.30, 0);
frameGroup.add(frameRail);
// Dust cover / accessory rail
const dustCover = lowBox(1.4, 0.12, 0.40, matFrame);
dustCover.position.set(0.9, 0.20, 0);
frameGroup.add(dustCover);
// Grip
const gripMain = lowBox(0.52, 1.1, 0.44, matGrip);
gripMain.position.set(-1.0, -0.35, 0);
gripMain.rotation.z = 0.18;
frameGroup.add(gripMain);
// Grip texture panels
const gripTexL = lowBox(0.02, 0.8, 0.36, matFrame);
gripTexL.position.set(-1.0, -0.35, 0.23);
gripTexL.rotation.z = 0.18;
frameGroup.add(gripTexL);
const gripTexR = lowBox(0.02, 0.8, 0.36, matFrame);
gripTexR.position.set(-1.0, -0.35, -0.23);
gripTexR.rotation.z = 0.18;
frameGroup.add(gripTexR);
// Trigger guard
const tgFront = lowBox(0.06, 0.40, 0.10, matFrame);
tgFront.position.set(0.1, 0.0, 0);
frameGroup.add(tgFront);
const tgBottom = lowBox(0.65, 0.06, 0.10, matFrame);
tgBottom.position.set(-0.2, -0.20, 0);
frameGroup.add(tgBottom);
const tgBack = lowBox(0.06, 0.30, 0.10, matFrame);
tgBack.position.set(-0.52, -0.05, 0);
frameGroup.add(tgBack);
// Trigger
const trigger = lowBox(0.04, 0.28, 0.08, matTrigger);
trigger.position.set(-0.15, 0.05, 0);
trigger.rotation.z = 0.15;
frameGroup.add(trigger);
// Beaver tail
const beavertail = lowBox(0.3, 0.14, 0.38, matFrame);
beavertail.position.set(-1.45, 0.32, 0);
beavertail.rotation.z = -0.2;
frameGroup.add(beavertail);
// Safety lever
const safety = lowBox(0.22, 0.06, 0.08, matTrigger);
safety.position.set(-1.3, 0.42, 0.24);
frameGroup.add(safety);
// Mag release
const magRelease = lowBox(0.10, 0.08, 0.06, matTrigger);
magRelease.position.set(-0.55, -0.05, 0.24);
frameGroup.add(magRelease);
// Hammer
const hammer = lowBox(0.08, 0.20, 0.10, matTrigger);
hammer.position.set(-1.55, 0.48, 0);
hammer.rotation.z = -0.4;
frameGroup.add(hammer);

// -- COMPENSATOR GROUP --
const compGroup = new THREE.Group();
const compBody = lowBox(0.7, 0.38, 0.46, matComp);
compBody.position.set(2.3, 0.42, 0);
compGroup.add(compBody);
// Comp ports (slots)
for (let i = 0; i < 3; i++) {
  const port = lowBox(0.06, 0.42, 0.20, matSlide);
  port.position.set(2.1 + i * 0.2, 0.52, 0);
  compGroup.add(port);
}
// Comp bottom weight
const compWeight = lowBox(0.6, 0.14, 0.42, matComp);
compWeight.position.set(2.3, 0.18, 0);
compGroup.add(compWeight);

// -- MAGAZINE GROUP --
const magGroup = new THREE.Group();
const magBody = lowBox(0.36, 1.0, 0.38, matMag);
magBody.position.set(-1.0, -1.2, 0);
magGroup.add(magBody);
// Mag baseplate
const magBase = lowBox(0.40, 0.10, 0.42, matTrigger);
magBase.position.set(-1.0, -1.72, 0);
magGroup.add(magBase);
// Mag feed lips
const magLips = lowBox(0.30, 0.08, 0.32, matSilver);
magLips.position.set(-1.0, -0.68, 0);
magGroup.add(magLips);
// Mag witness holes
for (let i = 0; i < 3; i++) {
  const hole = lowBox(0.04, 0.06, 0.04, matFrame);
  hole.position.set(-0.81, -1.0 - i * 0.22, 0);
  magGroup.add(hole);
}

// Add all groups to gun
gunGroup.add(slideGroup);
gunGroup.add(barrelGroup);
gunGroup.add(frameGroup);
gunGroup.add(compGroup);
gunGroup.add(magGroup);

// Center the gun
gunGroup.position.set(0, 0.3, 0);
gunGroup.rotation.y = -0.3;

// === WIREFRAME OVERLAY (PS1 mesh look) ===
function addWireframe(group, color) {
  group.traverse((child) => {
    if (child.isMesh && child.material !== matSightGreen && child.material !== matSightRed) {
      const wire = new THREE.LineSegments(
        new THREE.WireframeGeometry(child.geometry),
        new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.08 })
      );
      child.add(wire);
    }
  });
}
addWireframe(gunGroup, 0x444444);

// === ANIMATION STATE ===
// Exploded offsets for each part
const explodedPositions = {
  slide: new THREE.Vector3(0, 1.8, 0),
  barrel: new THREE.Vector3(0.8, 0.9, 0),
  frame: new THREE.Vector3(0, 0, 0),
  comp: new THREE.Vector3(2.2, 0.6, 0),
  mag: new THREE.Vector3(-0.5, -2.0, 0)
};
const assembledPositions = {
  slide: new THREE.Vector3(0, 0, 0),
  barrel: new THREE.Vector3(0, 0, 0),
  frame: new THREE.Vector3(0, 0, 0),
  comp: new THREE.Vector3(0, 0, 0),
  mag: new THREE.Vector3(0, 0, 0)
};

// Animation timeline (seconds)
const CYCLE = 8.0; // total loop time
// 0-2: assembled hold
// 2-4: explode
// 4-6: exploded hold (rotate)
// 6-8: assemble

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function lerpV3(a, b, t) {
  return new THREE.Vector3().lerpVectors(a, b, t);
}

const clock = new THREE.Clock();
let slowRotate = 0;

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  const t = elapsed % CYCLE;

  let explodeT = 0;
  if (t < 2.0) {
    explodeT = 0; // assembled
  } else if (t < 4.0) {
    explodeT = easeInOutCubic((t - 2.0) / 2.0); // exploding
  } else if (t < 6.0) {
    explodeT = 1; // exploded
  } else {
    explodeT = 1.0 - easeInOutCubic((t - 6.0) / 2.0); // assembling
  }

  // Apply positions
  slideGroup.position.copy(lerpV3(assembledPositions.slide, explodedPositions.slide, explodeT));
  barrelGroup.position.copy(lerpV3(assembledPositions.barrel, explodedPositions.barrel, explodeT));
  frameGroup.position.copy(lerpV3(assembledPositions.frame, explodedPositions.frame, explodeT));
  compGroup.position.copy(lerpV3(assembledPositions.comp, explodedPositions.comp, explodeT));
  magGroup.position.copy(lerpV3(assembledPositions.mag, explodedPositions.mag, explodeT));

  // Slide lock-back animation during assembly
  if (t >= 6.0 && t < 8.0) {
    const slideRack = Math.sin((t - 6.0) / 2.0 * Math.PI) * 0.3;
    slideGroup.position.x += slideRack;
  }

  // Magazine slide-up during assembly
  if (t >= 7.0 && t < 8.0) {
    const magSlide = easeInOutCubic((t - 7.0) / 1.0);
    magGroup.position.y = THREE.MathUtils.lerp(-2.0, 0, magSlide);
  }

  // Slow rotation when exploded
  if (explodeT > 0.5) {
    slowRotate += 0.004;
  }
  gunGroup.rotation.y = -0.3 + slowRotate + Math.sin(elapsed * 0.3) * 0.05;

  // Slight bob
  gunGroup.position.y = 0.3 + Math.sin(elapsed * 0.8) * 0.03;

  renderer.render(scene, camera);
}
animate();

// === RESIZE ===
window.addEventListener('resize', () => {
  const a = window.innerWidth / window.innerHeight;
  camera.left = -frustum * a;
  camera.right = frustum * a;
  camera.top = frustum;
  camera.bottom = -frustum;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// === MOUSE ORBIT (simple) ===
let isDragging = false, prevX = 0, prevY = 0;
let rotY = -0.3, rotX = 0;
renderer.domElement.addEventListener('pointerdown', (e) => {
  isDragging = true; prevX = e.clientX; prevY = e.clientY;
});
window.addEventListener('pointerup', () => isDragging = false);
window.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  rotY += (e.clientX - prevX) * 0.005;
  rotX += (e.clientY - prevY) * 0.003;
  rotX = Math.max(-0.5, Math.min(0.5, rotX));
  prevX = e.clientX; prevY = e.clientY;
  gunGroup.rotation.y = rotY;
  gunGroup.rotation.x = rotX;
});
</script>
</body>
</html>
