<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>H&amp;K USP MATCH // LOW-POLY RETRO RENDER</title>
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#b7b7bb; }
  #view { position:fixed; inset:0; }
  #view canvas { display:block; width:100vw; height:100vh; image-rendering:pixelated; image-rendering:crisp-edges; }
  .hud { position:fixed; font-family:"Courier New",Courier,monospace; color:#d8d8dc; z-index:10; user-select:none; -webkit-user-select:none; }
  #title { top:14px; left:50%; transform:translateX(-50%); background:rgba(16,16,20,0.80); border:2px solid #3a3a42; padding:8px 14px; font-size:13px; line-height:1.5; letter-spacing:1px; text-align:center; }
  #title b { color:#8ff08f; font-weight:bold; }
  #title .dim { color:#90909a; }
  #btns { top:14px; right:16px; display:flex; gap:6px; }
  .btn { background:rgba(16,16,20,0.80); color:#c9c9d0; border:2px solid #3a3a42; font-family:"Courier New",monospace; font-size:11px; letter-spacing:1px; padding:6px 9px; cursor:pointer; }
  .btn:hover { background:#2a2a32; color:#fff; }
  .btn.on { color:#101014; background:#8ff08f; border-color:#8ff08f; }
  #controls { bottom:14px; left:16px; background:rgba(16,16,20,0.80); border:2px solid #3a3a42; padding:6px 10px; font-size:11px; letter-spacing:1px; color:#a9a9b2; line-height:1.6; }
  #controls kbd { color:#e8e8ee; }
  #status { bottom:14px; right:16px; text-align:right; background:rgba(16,16,20,0.80); border:2px solid #3a3a42; padding:6px 10px; font-size:11px; letter-spacing:1px; color:#c9c9d0; }
  #labels { position:fixed; inset:0; pointer-events:none; z-index:9; }
  .plabel { position:absolute; padding:2px 6px; font:bold 10px/1.2 "Courier New",monospace; letter-spacing:1px; color:#16161a; background:rgba(244,244,248,0.72); border:1px solid rgba(20,20,26,0.35); white-space:nowrap; }
  #lines { position:fixed; inset:0; width:100%; height:100%; z-index:8; pointer-events:none; }
  #lines line { stroke:#16161a; stroke-width:1; }
  #err { position:fixed; inset:0; display:none; align-items:center; justify-content:center; font:14px monospace; color:#b00; background:#e8e8ec; z-index:99; text-align:center; padding:30px; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="view"></div>
<svg id="lines" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="labels"></div>
<div id="title" class="hud">
  <b>// H&amp;K USP MATCH</b><br>
  <span class="dim">LOW-POLY RETRO RENDER // PS1 / HALF-LIFE</span><br>
  <span class="dim">EXPLODE &amp; ASSEMBLE LOOP // ORTHO VIEW</span>
</div>
<div id="btns" class="hud">
  <button class="btn on" id="bPIX">[P] PIXELS</button>
  <button class="btn" id="bSPIN">[S] SPIN</button>
  <button class="btn on" id="bLAB">[L] LABELS</button>
  <button class="btn" id="bX">[X] MODE: LOOP</button>
</div>
<div id="controls" class="hud">
  DRAG — ORBIT &nbsp;·&nbsp; WHEEL — ZOOM<br>
  <kbd>P</kbd> PIXELS &nbsp; <kbd>S</kbd> SPIN &nbsp; <kbd>L</kbd> LABELS &nbsp; <kbd>X</kbd> MODE
</div>
<div id="status" class="hud">WAIT // USP MATCH</div>
<div id="err"></div>
<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script>
"use strict";
window.addEventListener('error', function(e){
  var el=document.getElementById('err');
  el.style.display='flex';
  el.textContent='RUNTIME ERROR:\n'+(e.message||e);
  try{ document.title='ERR: '+(e.message||''); }catch(_){}
});

if (!window.THREE) { document.getElementById('err').style.display='flex'; document.getElementById('err').textContent='ERROR: three.js failed to load'; }
else {

var P = { pixel:4, spin:false, labels:true, mode:0 };
var MODES = ['LOOP','HOLD EXPLODED','HOLD ASSEMBLED','FIXED POSE'];

/* ---------------- renderer / scene ---------------- */
var view = document.getElementById('view');
var renderer = new THREE.WebGLRenderer({antialias:false, preserveDrawingBuffer:true});
renderer.setPixelRatio(1);
view.appendChild(renderer.domElement);

var scene = new THREE.Scene();
scene.background = new THREE.Color(0xb7b7bb);

var camera = new THREE.OrthographicCamera(-1,1,1,-1,0.1,200);
var TARGET = new THREE.Vector3(7.0,2.5,0);
camera.position.set(20.0,10.5,16);
camera.lookAt(TARGET);

var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minZoom = 0.65;
controls.maxZoom = 1.9;
controls.enablePan = false;

var W=0,H=0;
function fitCam(){
  var aspect = W/H || 1.6;
  var s = Math.max(8.4, 40.5/(2*aspect)) + 0.7;
  camera.left = -s*aspect; camera.right = s*aspect;
  camera.top = s; camera.bottom = -s;
  camera.updateProjectionMatrix();
}
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  renderer.setSize(Math.max(2,Math.floor(W/P.pixel)), Math.max(2,Math.floor(H/P.pixel)), false);
  fitCam();
}
window.addEventListener('resize', resize);

/* lights */
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a90, 0.55));
var key = new THREE.DirectionalLight(0xffffff, 0.78); key.position.set(14,16,12); scene.add(key);
var fill = new THREE.DirectionalLight(0xffffff, 0.32); fill.position.set(-10,4,8); scene.add(fill);
var rim = new THREE.DirectionalLight(0xffffff, 0.28); rim.position.set(-6,-8,-10); scene.add(rim);

/* ---------------- pixelated 90s textures ---------------- */
function pxTex(w,h,fn){
  var c=document.createElement('canvas'); c.width=w; c.height=h;
  fn(c.getContext('2d'),w,h);
  var t=new THREE.CanvasTexture(c);
  t.magFilter=THREE.NearestFilter; t.minFilter=THREE.NearestFilter; t.generateMipmaps=false;
  return t;
}
var T = {};
T.dark = pxTex(32,16,function(g,w,h){
  g.fillStyle='#2a2a31'; g.fillRect(0,0,w,h);
  for(var i=0;i<260;i++){ var x=(Math.random()*w)|0,y=(Math.random()*h)|0;
    g.fillStyle = Math.random()<0.5 ? 'rgba(0,0,0,0.40)' : 'rgba(255,255,255,0.09)';
    g.fillRect(x,y,1,1); }
  for(var i=0;i<6;i++){ var y=(Math.random()*h)|0, x0=(Math.random()*w)|0, len=2+((Math.random()*6)|0);
    g.fillStyle='rgba(255,255,255,0.13)';
    for(var j=0;j<len;j++) g.fillRect((x0+j)%w,y,1,1); }
  g.fillStyle='rgba(0,0,0,0.38)'; g.fillRect(0,0,w,1); g.fillRect(0,h-1,w,1);
});
T.poly = pxTex(32,32,function(g,w,h){
  g.fillStyle='#24242a'; g.fillRect(0,0,w,h);
  for(var i=0;i<380;i++){ var x=(Math.random()*w)|0,y=(Math.random()*h)|0;
    g.fillStyle = Math.random()<0.5 ? 'rgba(0,0,0,0.32)' : 'rgba(255,255,255,0.07)';
    g.fillRect(x,y,1,1); }
});
T.silver = pxTex(32,16,function(g,w,h){
  g.fillStyle='#c3c8cf'; g.fillRect(0,0,w,h);
  for(var x=0;x<w;x++){ var a=0.05+0.07*Math.sin(x*0.8); g.fillStyle='rgba(0,0,0,'+a.toFixed(3)+')'; g.fillRect(x,0,1,h); }
  for(var i=0;i<10;i++){ var x=(Math.random()*w)|0; g.fillStyle='rgba(255,255,255,'+(0.10+Math.random()*0.15).toFixed(2)+')'; g.fillRect(x,0,1,h); }
  for(var i=0;i<14;i++){ var x=(Math.random()*w)|0; g.fillStyle='rgba(0,0,0,0.10)'; g.fillRect(x,0,1,h); }
});
T.mag = pxTex(16,32,function(g,w,h){
  g.fillStyle='#222227'; g.fillRect(0,0,w,h);
  for(var x=0;x<w;x++){ var a=0.05+0.05*Math.sin(x*1.2); g.fillStyle='rgba(0,0,0,'+a.toFixed(3)+')'; g.fillRect(x,0,1,h); }
  g.fillStyle='rgba(220,220,225,0.5)';
  for(var i=0;i<6;i++) g.fillRect(11,4+i*4,2,1);
  for(var i=0;i<40;i++){ g.fillStyle = Math.random()<0.5 ? 'rgba(0,0,0,0.30)' : 'rgba(255,255,255,0.06)'; g.fillRect((Math.random()*w)|0,(Math.random()*h)|0,1,1); }
});
T.weight = pxTex(32,16,function(g,w,h){
  g.fillStyle='#2e2e36'; g.fillRect(0,0,w,h);
  for(var i=0;i<220;i++){ var x=(Math.random()*w)|0,y=(Math.random()*h)|0;
    g.fillStyle = Math.random()<0.5 ? 'rgba(0,0,0,0.35)' : 'rgba(255,255,255,0.08)';
    g.fillRect(x,y,1,1); }
  g.fillStyle='rgba(0,0,0,0.40)'; g.fillRect(0,h-2,w,2);
});
T.text = pxTex(256,48,function(g,w,h){
  g.fillStyle='#2a2a31'; g.fillRect(0,0,w,h);
  g.fillStyle='#e8e8ee'; g.font='bold 30px monospace'; g.fillText('USP MATCH',10,36);
  g.fillStyle='rgba(255,255,255,0.12)'; g.fillRect(0,42,w,2);
  for(var i=0;i<120;i++){ g.fillStyle=Math.random()<0.5?'rgba(0,0,0,0.25)':'rgba(255,255,255,0.06)'; g.fillRect((Math.random()*w)|0,(Math.random()*h)|0,1,1); }
});
T.glow = function(tint){
  return pxTex(64,64,function(g,w,h){
    var r=g.createRadialGradient(32,32,2,32,32,32);
    r.addColorStop(0,'rgba(255,255,255,0.95)');
    r.addColorStop(0.35,tint(0.55));
    r.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=r; g.fillRect(0,0,w,h);
  });
};
T.glowG = T.glow(function(a){ return 'rgba(80,255,90,'+a+')'; });
T.glowR = T.glow(function(a){ return 'rgba(255,60,50,'+a+')'; });

/* ---------------- materials ---------------- */
var M = {
  slide:  new THREE.MeshLambertMaterial({map:T.dark,   flatShading:true}),
  slideT: new THREE.MeshLambertMaterial({map:T.text,   flatShading:true}),
  frame:  new THREE.MeshLambertMaterial({map:T.poly,   flatShading:true}),
  barrel: new THREE.MeshLambertMaterial({map:T.silver, flatShading:true}),
  mag:    new THREE.MeshLambertMaterial({map:T.mag,    flatShading:true}),
  weight: new THREE.MeshLambertMaterial({map:T.weight, flatShading:true}),
  dark:   new THREE.MeshLambertMaterial({color:0x19191d, flatShading:true}),
  darker: new THREE.MeshLambertMaterial({color:0x101013, flatShading:true}),
  pin:    new THREE.MeshLambertMaterial({color:0xd5dae0, flatShading:true}),
  green:  new THREE.MeshBasicMaterial({color:0x45ff4a}),
  red:    new THREE.MeshBasicMaterial({color:0xff3324})
};

/* ---------------- geometry helpers ---------------- */
function box(w,h,d,x,y,z,mat){
  var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z); return m;
}
function cyl(rTop,rBottom,len,seg,x,y,z,mat){
  var m=new THREE.Mesh(new THREE.CylinderGeometry(rTop,rBottom,len,seg,1,false),mat);
  m.position.set(x,y,z); m.rotation.z=Math.PI/2; return m;
}
function pinZ(r,len,x,y,z,mat){
  var m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,8,1,false),mat);
  m.position.set(x,y,z); m.rotation.x=Math.PI/2; return m;
}
function glowSprite(tex,s){
  var m=new THREE.Sprite(new THREE.SpriteMaterial({map:tex, blending:THREE.AdditiveBlending, depthWrite:false, transparent:true}));
  m.scale.set(s,s,1); return m;
}

/* ---------------- build USP MATCH ---------------- */
var gun = new THREE.Group(); scene.add(gun);
var frameG  = new THREE.Group(); gun.add(frameG);
var slideG  = new THREE.Group(); gun.add(slideG);
var barrelG = new THREE.Group(); gun.add(barrelG);
var weightG = new THREE.Group(); gun.add(weightG);
var magG    = new THREE.Group(); gun.add(magG);

/* ---- FRAME (dark polymer) ---- */
frameG.add(box(17.0,1.5,2.8,  8.5,1.65,0,  M.frame));   /* main body  x0..17  y0.9..2.4 */
frameG.add(box(4.5,0.9,2.4,   19.25,1.75,0,M.frame));   /* front rail x17..21.5 y1.3..2.2 */
frameG.add(box(1.3,0.18,1.6,  18.0,1.19,0, M.darker));  /* rail bumps */
frameG.add(box(1.3,0.18,1.6,  19.4,1.19,0, M.darker));
var grip = box(2.6,4.8,2.4, 6.8,-1.35,0, M.frame); grip.rotation.z=-0.35; frameG.add(grip);
var gripB = box(1.5,1.1,2.4, 4.3,0.55,0, M.frame); gripB.rotation.z=-0.15; frameG.add(gripB);
/* trigger guard (chunky low-poly ring) */
frameG.add(box(0.55,2.6,2.3, 8.3,1.3,0,  M.frame));   /* rear bar  */
frameG.add(box(0.55,2.6,2.3, 10.7,1.3,0, M.frame));   /* front bar */
frameG.add(box(2.85,0.55,2.3,9.5,0.25,0, M.frame));   /* bottom bar */
var c1=box(0.55,0.55,2.3, 8.3,0.25,0, M.frame); c1.rotation.z=Math.PI/4; frameG.add(c1);
var c2=box(0.55,0.55,2.3, 10.7,0.25,0, M.frame); c2.rotation.z=Math.PI/4; frameG.add(c2);
var trig = box(0.3,1.5,0.5, 9.4,1.5,0, M.dark); trig.rotation.z=0.2; frameG.add(trig);
/* hammer (pivots; cocks as the slide racks) */
var hammerPivot = new THREE.Group(); hammerPivot.position.set(0.7,2.75,0);
var hammer = box(0.9,0.8,1.5, -0.35,0.4,0, M.dark);
hammerPivot.add(hammer); hammerPivot.rotation.z=0.35; frameG.add(hammerPivot);
/* controls on left side */
frameG.add(box(0.5,0.45,0.35, 1.9,2.2,-1.55, M.dark));   /* decocker lever */
frameG.add(box(1.6,0.35,0.4,  12.6,2.3,-1.55, M.dark));   /* extended slide stop */
frameG.add(box(0.5,0.95,0.35, 6.4,1.3,-1.5,  M.dark));    /* mag release */

/* ---- SLIDE (dark blued metal, locked back) ---- */
var slideMain = new THREE.Mesh(new THREE.BoxGeometry(19.6,2.6,3.0),
  [M.slide,M.slide,M.slide,M.slide,M.slide,M.slideT]);
slideMain.position.set(8.8,3.75,0);   /* x-1..18.6  y2.45..5.05 */
slideG.add(slideMain);
slideG.add(box(3.2,1.5,0.12, 11.5,3.5,1.55, M.darker));   /* ejection port (right) */
slideG.add(box(1.4,0.35,0.12, 2.6,4.15,1.55, M.darker));  /* extractor groove */
for(var i=0;i<4;i++){ var sx=4.6+i*0.5;
  slideG.add(box(0.22,1.15,0.12, sx,2.75,-1.56, M.darker));
  slideG.add(box(0.22,1.15,0.12, sx,2.75, 1.56, M.darker)); }
/* fiber optic sights */
slideG.add(box(0.5,0.8,0.9, 17.3,5.35,0, M.dark));        /* front blade */
slideG.add(box(1.0,0.36,0.34, 17.3,5.9,0, M.green));      /* GREEN fiber */
slideG.add(box(1.7,0.75,1.0, 1.1,5.38,0, M.dark));        /* rear blade */
slideG.add(box(1.5,0.34,0.32, 1.1,5.9,0, M.red));         /* RED fiber */
var gFront = glowSprite(T.glowG,1.6); gFront.position.set(17.3,6.1,0);  slideG.add(gFront);
var gRear  = glowSprite(T.glowR,1.8); gRear.position.set(1.1,6.1,0);    slideG.add(gRear);

/* ---- BARREL (bright silver, exposed) ---- */
barrelG.add(cyl(0.95,0.95,2.6,8, 10.1,3.55,0, M.barrel));  /* chamber  x8.8..11.4 */
barrelG.add(cyl(0.72,0.72,15.2,8,16.4,3.55,0, M.barrel));  /* tube     x8.8..24   */
barrelG.add(box(0.85,1.15,1.0, 11.5,3.0,0, M.dark));       /* locking lug */
var bore = new THREE.Mesh(new THREE.CircleGeometry(0.68,8), M.darker);
bore.rotation.y=Math.PI/2; bore.position.set(23.96,3.55,0); barrelG.add(bore);

/* ---- MATCH COMPENSATOR WEIGHT (dark steel + silver pins) ---- */
weightG.add(box(7.0,1.2,2.2, 18.5,0.85,0, M.weight));   /* main block x15..22 */
weightG.add(box(1.2,0.95,2.1, 22.6,0.7,0, M.weight));   /* front nose x22..23.2 */
weightG.add(box(3.0,0.4,2.3, 16.5,1.45,0, M.weight));   /* top clamp bracket */
weightG.add(pinZ(0.17,3.2, 18.0,1.15,0, M.pin));        /* silver cross pins */
weightG.add(pinZ(0.17,3.2, 21.0,1.15,0, M.pin));

/* ---- MAGAZINE (detached, slides down) ---- */
var magBody = box(2.2,3.6,1.9, 6.8,-1.5,0, M.mag); magBody.rotation.z=-0.35; magG.add(magBody);
var magPlate = box(2.4,0.5,2.1, 6.8,-3.45,0, M.darker); magPlate.rotation.z=-0.35; magG.add(magPlate);

/* ---------------- explode offsets ---------------- */
var OFF = {
  slide:  new THREE.Vector3(-9.0, 3.0, 0),
  barrel: new THREE.Vector3( 3.0, 1.6, 0),
  weight: new THREE.Vector3( 3.5,-1.8, 0),
  mag:    new THREE.Vector3(-0.343,-0.94,0).multiplyScalar(5.0)
};

/* ---------------- animation timeline ---------------- */
var DUR = 12;
var E0=0.10, E1=0.44, A0=0.58, A1=0.90;
function ease(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
function win(t,a,b){ return Math.min(1,Math.max(0,(t-a)/(b-a))); }
function phaseK(t){
  var slide=0,barrel=0,weight=0,mag=0;
  if(t>=E0 && t<=E1){ var u=win(t,E0,E1);
    mag    = ease(win(u,0.00,0.50));
    slide  = ease(win(u,0.20,0.75));
    barrel = ease(win(u,0.35,0.90));
    weight = ease(win(u,0.50,1.00));
  } else if(t>E1 && t<A0){ slide=1;barrel=1;weight=1;mag=1; }
  else if(t>=A0 && t<=A1){ var u=win(t,A0,A1);
    weight = 1-ease(win(u,0.00,0.50));
    barrel = 1-ease(win(u,0.15,0.70));
    slide  = 1-ease(win(u,0.30,0.85));
    mag    = 1-ease(win(u,0.45,1.00));
  }
  return {slide:slide,barrel:barrel,weight:weight,mag:mag};
}
function applyPose(t,mode){
  var k;
  if(mode===1) k={slide:1,barrel:1,weight:1,mag:1};
  else if(mode===2) k={slide:0,barrel:0,weight:0,mag:0};
  else if(mode===3) k=phaseK(P.mid);
  else k=phaseK(t);
  slideG.position.copy(OFF.slide).multiplyScalar(k.slide);
  barrelG.position.copy(OFF.barrel).multiplyScalar(k.barrel);
  weightG.position.copy(OFF.weight).multiplyScalar(k.weight);
  magG.position.copy(OFF.mag).multiplyScalar(k.mag);
  hammerPivot.rotation.z = 0.35 + (-0.85-0.35)*k.slide;
  window.__k = k;
}

/* ---------------- labels ---------------- */
var labelDefs = [
  {id:'frame', part:frameG,  anchor:[8.5,1.65,0], name:'FRAME',        col:'#333', always:true, dir:'down',  off:[0,10]},
  {id:'slide', part:slideG,  anchor:[8.8,3.75,0], name:'SLIDE',        col:'#222', kfn:function(k){return k.slide;},  dir:'up', off:[0,-8]},
  {id:'barrel',part:barrelG, anchor:[16.4,3.55,0],name:'BARREL',       col:'#5a5f66',kfn:function(k){return k.barrel;},dir:'up', off:[0,-6]},
  {id:'weight',part:weightG, anchor:[18.5,0.85,0],name:'MATCH WEIGHT', col:'#333', kfn:function(k){return k.weight;},dir:'down', off:[0,12]},
  {id:'mag',  part:magG,     anchor:[6.8,-1.5,0], name:'MAGAZINE',     col:'#333', kfn:function(k){return k.mag;},   dir:'down', off:[0,12]},
  {id:'gf',   part:slideG,   anchor:[17.3,5.8,0], name:'GREEN FIBER',  col:'#0a8a0a',kfn:function(k){return k.slide;},dir:'up', off:[0,-6]},
  {id:'rf',   part:slideG,   anchor:[1.1,5.75,0], name:'RED FIBER',    col:'#a00', kfn:function(k){return k.slide;},  dir:'up', off:[0,-6]}
];
var labelsEl=document.getElementById('labels');
var svgEl=document.getElementById('lines');
var SVGNS='http://www.w3.org/2000/svg';
var labels = labelDefs.map(function(d){
  var el=document.createElement('div'); el.className='plabel'; el.textContent=d.name; el.style.color=d.col;
  el.style.transform = d.dir==='up' ? 'translate(-50%,-100%)' : 'translate(-50%,6px)';
  labelsEl.appendChild(el);
  var line=document.createElementNS(SVGNS,'line'); svgEl.appendChild(line);
  return {d:d, el:el, line:line, v:new THREE.Vector3()};
});
function updateLabels(){
  var w=window.innerWidth, h=window.innerHeight;
  var k=window.__k || {slide:0,barrel:0,weight:0,mag:0};
  for(var i=0;i<labels.length;i++){
    var L=labels[i], d=L.d;
    var op = d.always ? 0.92 : Math.min(1,(d.kfn(k)||0)*1.8)*0.92;
    if(op<0.03 || !P.labels){ L.el.style.opacity=0; L.line.style.opacity=0; continue; }
    d.part.localToWorld(L.v.set(d.anchor[0],d.anchor[1],d.anchor[2]));
    L.v.project(camera);
    if(L.v.z>1){ L.el.style.opacity=0; L.line.style.opacity=0; continue; }
    var x=(L.v.x*0.5+0.5)*w, y=(-L.v.y*0.5+0.5)*h;
    var ox=d.off[0], oy=d.off[1];
    L.el.style.left=(x+ox)+'px'; L.el.style.top=(y+oy)+'px';
    L.el.style.opacity=op.toFixed(2);
    L.line.setAttribute('x1',x.toFixed(1)); L.line.setAttribute('y1',y.toFixed(1));
    L.line.setAttribute('x2',(x+ox*0.6).toFixed(1)); L.line.setAttribute('y2',(y+oy*0.6).toFixed(1));
    L.line.style.opacity=(op*0.5).toFixed(2);
  }
}

/* ---------------- UI ---------------- */
var bPIX=document.getElementById('bPIX'), bSPIN=document.getElementById('bSPIN'),
    bLAB=document.getElementById('bLAB'), bX=document.getElementById('bX'),
    statusEl=document.getElementById('status');
bPIX.onclick=function(){ P.pixel = P.pixel===4 ? 1 : 4; resize(); bPIX.classList.toggle('on',P.pixel===4); };
bSPIN.onclick=function(){ P.spin=!P.spin; bSPIN.classList.toggle('on',P.spin); };
bLAB.onclick=function(){ P.labels=!P.labels; bLAB.classList.toggle('on',P.labels); };
bX.onclick=function(){ P.mode=(P.mode+1)%3; bX.textContent='[X] MODE: '+MODES[P.mode]; };
document.addEventListener('keydown',function(e){
  var k=(e.key||'').toLowerCase();
  if(k==='p') bPIX.onclick();
  else if(k==='s') bSPIN.onclick();
  else if(k==='l') bLAB.onclick();
  else if(k==='x') bX.onclick();
});
if(location.hash==='#exploded'){ P.mode=1; bX.textContent='[X] MODE: '+MODES[P.mode]; }
if(location.hash==='#assembled'){ P.mode=2; bX.textContent='[X] MODE: '+MODES[P.mode]; }
var midm = location.hash.match(/#mid=([\d.]+)/);
if(midm){ P.mode=3; P.mid=parseFloat(midm[1]); }

/* ---------------- main loop ---------------- */
var spinY=0, frames=0, fpsT=0;
function fps(){
  frames++; var now=performance.now();
  if(now-fpsT>500){ var f=frames*1000/(now-fpsT); frames=0; fpsT=now;
    statusEl.textContent=f.toFixed(0)+' FPS // USP MATCH // '+MODES[P.mode].toUpperCase();
  }
}
function animate(now){
  requestAnimationFrame(animate);
  var t=(now/1000 % DUR)/DUR;
  var time=now/1000;
  applyPose(t,P.mode);
  gun.position.y = Math.sin(time*1.1)*0.10;
  if(P.spin){ spinY += 0.012; gun.rotation.y = spinY; }
  else { gun.rotation.y = Math.sin(time*0.5)*0.10; }
  controls.update();
  renderer.render(scene,camera);
  updateLabels();
  fps();
}
resize();
requestAnimationFrame(animate);
window.__ready=true;
document.title='USP MATCH OK';
}
</script>
