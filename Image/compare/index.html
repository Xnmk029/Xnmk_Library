<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同一画面，观察变化 · 图像对照</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="#"><span class="mark">▦</span> 像素干涉 <span class="edition">/ 图像观察室</span></a><div class="toptools"><button id="replay">重播动效</button><button id="motion">暂停动效</button><label class="sr" for="palette">配色</label><select id="palette"><option value="iris">鸢紫 / 浅柠</option><option value="mineral">靛蓝 / 矿绿</option><option value="ember">深紫 / 琥珀</option></select><button id="fullscreen" title="切换全屏 · Alt + F">全屏 · Alt + F ↗</button></div></header>
<div class="workspace">
<main id="review"><div id="stage" class="stage" tabindex="0" aria-label="图片对比视窗，拖动平移，滚轮缩放"><canvas id="canvas"></canvas><div id="loading" role="status">正在载入图片…</div><button id="divider" role="slider" aria-label="对比分界线" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"></button><span id="blinkLabel" class="blinkbadge">A</span></div>
<div class="transport"><span id="motionPhase">条带揭幕</span><label class="timeline">预设动效 <input id="motionTime" type="range" min="0" max="8" value="0" step="0.01" aria-label="动效时间"><output id="motionClock">0.00 / 8.00</output></label><span>10 / 双画面对照</span></div><details class="taskdrawer"><summary>选择题目 <span id="currentTask"></span></summary><aside><div class="sidehead">题目索引 <span id="count"></span></div><input id="search" type="search" placeholder="搜索题目" aria-label="搜索题目"><div id="tasks"></div><p class="sidehint">历史版本独立分组。<br>没有原图的文生图题，可直接比较模型。</p><a href="README.md">使用说明 ↗</a></aside></details><div class="sectionhead"><div><span id="kind" class="eyebrow"></span><h2 id="title"></h2></div><div id="frames" class="frames"></div></div>
<div class="selectors"><label><span>A / 左侧</span><select id="left" aria-label="左侧图片"></select></label><button id="swap" title="交换 A B">⇄</button><label><span>B / 右侧</span><select id="right" aria-label="右侧图片"></select></label></div>
<div class="toolbar"><div class="modes" role="group" aria-label="对比模式"><button data-mode="wipe" class="active">划线对比</button><button data-mode="side">并排</button><button data-mode="blink">A/B 闪切</button></div><button id="original">A 设为原图</button><button id="auto">重播分界运动</button><span class="spacer"></span><label>缩放 <input id="zoom" type="range" min="1" max="6" value="1" step=".05"><output id="zoomLabel">1.0×</output></label><button id="fit">适应画面</button></div>
<div id="notice" role="status"></div>
<div class="captions"><div><span class="letter">A</span><strong id="labelA"></strong><small id="infoA"></small><a id="openA" target="_blank" rel="noopener">打开原始文件 ↗</a></div><div><span class="letter">B</span><strong id="labelB"></strong><small id="infoB"></small><a id="openB" target="_blank" rel="noopener">打开原始文件 ↗</a></div></div>
<div class="foottools"><span id="help">拖动分界线 · 滚轮缩放 · 拖动画面平移</span><button id="share">复制当前对比链接</button></div>
<section class="candidates"><div class="sectionhead"><h3>切换右侧结果</h3><span id="available"></span></div><div id="variants"></div></section>
<details><summary>临时导入 / 对比记录</summary><div class="imports"><label>替换 A <input type="file" id="uploadA" accept="image/*"></label><label>替换 B <input type="file" id="uploadB" accept="image/*"></label></div><p>导入仅在当前页面有效。尺寸不同时各图按比例完整显示，未自动配准；像素位置差异不等同于编辑错误。</p><div id="provenance"></div></details>
</main></div><footer>像素干涉 / 双画面对照 · Motion Kit v03 <span>图片保持原色，不套用界面配色。</span></footer>
<script src="catalog.js?v=20260910-recovery"></script><script type="module" src="app.js"></script></body></html>
