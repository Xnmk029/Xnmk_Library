<!doctype html><meta charset="utf-8"><title>原预设 · 双画面对照</title><style>body{margin:0;background:#17152f;color:#e6edb4;font:14px sans-serif}canvas{width:100%;display:block}button,input{margin:12px}</style><canvas id="c"></canvas><button id="play">播放 / 暂停</button><input id="seek" type="range" min="0" max="8" step=".01" value="0"><output id="clock"></output><script type="module">import{makeMotionRenderer}from './reference/renderer.mjs';import{SCENES}from './reference/catalog.mjs';const r=makeMotionRenderer(document.querySelector('canvas')),i=SCENES.findIndex(s=>s.id==='compare');let t=0,playing=true,last=0;function draw(){r.draw(i,t);document.querySelector('output').value=t.toFixed(2);document.querySelector('input').value=t}document.querySelector('button').onclick=()=>playing=!playing;document.querySelector('input').oninput=e=>{t=Number(e.target.value);playing=false;draw()};function tick(now){if(last&&playing)t=(t+Math.min((now-last)/1000,.1))%8;last=now;draw();requestAnimationFrame(tick)}requestAnimationFrame(tick)</script>
