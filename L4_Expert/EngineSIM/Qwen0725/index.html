<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V8 Engine Sim - Cross-Plane Muscle Car</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loading-screen">
        <div class="loading-content">
            <h1>V8 ENGINE SIMULATOR</h1>
            <p>Cross-Plane Crankshaft | Equal-Length Headers</p>
            <div class="loading-bar"><div class="loading-fill"></div></div>
            <p id="loading-text">初始化音频引擎...</p>
        </div>
    </div>

    <canvas id="game-canvas"></canvas>

    <div id="hud">
        <div id="speed-display">
            <span id="speed-value">0</span>
            <span class="unit">KM/H</span>
        </div>
        <div id="rpm-display">
            <div id="rpm-bar-container">
                <div id="rpm-bar"></div>
                <div id="rpm-redline"></div>
            </div>
            <span id="rpm-value">800</span>
            <span class="unit">RPM</span>
        </div>
        <div id="gear-display">
            <span id="gear-value">N</span>
        </div>
        <div id="throttle-display">
            <div id="throttle-bar"></div>
            <span class="label">THR</span>
        </div>
    </div>

    <div id="controls-help">
        <p>W/↑ 油门 | S/↓ 刹车 | A/↑ D/→ 转向</p>
        <p>Space 手刹 | Shift 换挡升 | Ctrl 换挡降</p>
        <p>I 点火 | R 重置车辆 | C 切换视角</p>
    </div>

    <div id="engine-info">
        <span>6.2L Cross-Plane V8 | 等长排气芭蕉 | 混响优化</span>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
