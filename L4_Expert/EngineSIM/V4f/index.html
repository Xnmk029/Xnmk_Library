<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V4f EngineSIM</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 30%, #1a2029 0%, #0c0f14 70%);
      color: #dfe5ec;
      font: 15px/1.6 "Segoe UI", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .home { width: min(880px, 92vw); padding: 40px 20px; text-align: center; }
    h1 { font-size: 34px; letter-spacing: 3px; margin: 0 0 8px; }
    .sub { color: #8b95a5; margin-bottom: 36px; font-size: 13.5px; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 720px) { .cards { grid-template-columns: 1fr; } }
    .card {
      display: block;
      text-decoration: none;
      color: #dfe5ec;
      background: #181d25;
      border: 1px solid #2b3542;
      border-radius: 14px;
      padding: 30px 26px;
      transition: transform .15s, border-color .15s, background .15s;
    }
    .card:hover { transform: translateY(-3px); border-color: #e0582e; background: #1e2530; }
    .card .icon { font-size: 30px; }
    .card h2 { margin: 12px 0 6px; font-size: 19px; color: #f2f5f9; }
    .card p { margin: 0; color: #8b95a5; font-size: 13px; }
    .card .tag {
      display: inline-block;
      margin-top: 14px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      background: rgba(224, 88, 46, 0.16);
      color: #e08a4f;
      border: 1px solid rgba(224, 88, 46, 0.35);
    }
    .footer { margin-top: 34px; color: #5f6a7a; font-size: 12px; }
    .footer code { color: #9aa7b8; }
  </style>
</head>
<body>
  <div class="home">
    <h1>V4F ENGINESIM</h1>
    <p class="sub">6.4L Cross-Plane V8 · 前中置 · 等长芭蕉 · 程序化引擎声 + 四轮双轨驾驶模拟</p>
    <div class="cards">
      <a class="card" href="./sim.html">
        <div class="icon">🏎️</div>
        <h2>驾驶模拟（Three.js 场景）</h2>
        <p>赛道 · 低多边形肌肉车 · 魔术公式轮胎 · 程序化天空 · 实时引擎声</p>
        <span class="tag">启动驾驶</span>
      </a>
      <a class="card" href="./audio-lab.html">
        <div class="icon">🔊</div>
        <h2>音频实验室</h2>
        <p>扫频 / 断油 / 回火 / 8 组混响空间 / 实时频谱与 DSP 占用</p>
        <span class="tag">听音调参</span>
      </a>
    </div>
    <div class="footer">
      操作提示：<code>W/S</code> 油门/刹车 · <code>A/D</code> 转向 · <code>Space</code> 手刹 ·
      <code>Shift</code> 离合 · <code>Q/E</code> 换挡 · <code>I</code> 点火 · <code>H</code> 帮助
    </div>
  </div>
</body>
</html>
