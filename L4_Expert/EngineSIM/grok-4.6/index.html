<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Front-Mid Cross-Plane V8 — EngineSIM</title>
  <style>
    :root {
      --panel: rgba(8, 10, 14, 0.78);
      --line: rgba(224, 112, 48, 0.55);
      --text: #f3efe8;
      --dim: #9aa3b0;
      --accent: #e07030;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b0d12;
      color: var(--text);
      font-family: "Segoe UI", "DIN Alternate", sans-serif;
    }
    #view {
      display: block;
      width: 100%;
      height: 100%;
    }
    #hud {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 16px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 16px;
      pointer-events: none;
      align-items: end;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 16px;
      backdrop-filter: blur(8px);
    }
    .readout {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }
    .metric label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.16em;
      color: var(--dim);
    }
    .metric b {
      font-size: 28px;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      line-height: 1.1;
    }
    .metric small {
      color: var(--dim);
      margin-left: 4px;
      font-size: 12px;
    }
    #hud-status[data-mode="CUT"] { color: #ff5a4a; }
    #hud-status[data-mode="IDLE"] { color: #7dcea0; }
    #hud-status[data-mode="WOT"] { color: #ffb347; }
    #hud-status[data-mode="BRAKE"] { color: #6cb6ff; }
    #hud-spec {
      grid-column: 1 / -1;
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--dim);
      text-align: center;
    }
    #spec {
      width: 280px;
      height: 86px;
      display: block;
      border-radius: 6px;
      background: #0b0d12;
    }
    #help {
      position: absolute;
      top: 16px;
      left: 18px;
      font-size: 12px;
      line-height: 1.55;
      color: var(--dim);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 14px;
      pointer-events: none;
    }
    #start-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(6, 8, 12, 0.55);
      cursor: pointer;
      z-index: 5;
    }
    #start-overlay.hidden { display: none; }
    #start-overlay .card {
      text-align: center;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 28px 40px;
      border-radius: 14px;
    }
    #start-overlay h1 {
      margin: 0 0 8px;
      font-size: 22px;
      letter-spacing: 0.08em;
    }
    #start-overlay p { margin: 0; color: var(--dim); }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="help">
    W / ↑ 油门 · S / ↓ 制动 · A D / ← → 转向<br />
    C / Shift 断油切断 · Space 手刹 · R 复位
  </div>
  <div id="hud">
    <div class="panel readout">
      <div class="metric">
        <label>RPM</label>
        <b id="hud-rpm">800</b>
      </div>
      <div class="metric">
        <label>SPEED</label>
        <b id="hud-speed">0</b><small>km/h</small>
      </div>
      <div class="metric">
        <label>GEAR</label>
        <b id="hud-gear">1</b>
      </div>
      <div class="metric">
        <label>THROTTLE</label>
        <b id="hud-throttle">0%</b>
      </div>
      <div class="metric">
        <label>LOAD</label>
        <b id="hud-load">0%</b>
      </div>
      <div class="metric">
        <label>STATUS</label>
        <b id="hud-status" data-mode="IDLE">IDLE</b>
      </div>
    </div>
    <div class="panel">
      <label style="font-size:10px;letter-spacing:0.16em;color:var(--dim)">ORDER SPECTRUM</label>
      <canvas id="spec" width="280" height="86"></canvas>
    </div>
    <div></div>
    <div id="hud-spec">FRONT-MID  ·  CROSS-PLANE V8  ·  EQUAL-LENGTH HEADERS</div>
  </div>
  <div id="start-overlay" tabindex="0">
    <div class="card">
      <h1>START ENGINE</h1>
      <p>点击以创建 AudioContext 并开始驾驶</p>
    </div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="./main.mjs"></script>
</body>
</html>
