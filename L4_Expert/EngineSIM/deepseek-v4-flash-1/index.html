<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>V4f — 程序化 V8 引擎声音 · 驾驶模拟</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e13; font-family: system-ui, sans-serif; color: #dfe7f0; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; width: 100%; height: 100%; }
    .v4f-hud { position: absolute; inset: 0; pointer-events: none; user-select: none; }
    .diag { position: absolute; top: 10px; left: 10px; font-size: 12px; background: rgba(10,14,20,.55); padding: 6px 10px; border-radius: 6px; white-space: nowrap; }
    .lap { position: absolute; top: 10px; right: 12px; font-size: 16px; font-weight: 700; background: rgba(10,14,20,.55); padding: 6px 12px; border-radius: 6px; }
    .indicators { position: absolute; top: 46px; left: 10px; display: flex; gap: 6px; font-size: 11px; }
    .indicators i { background: rgba(20,26,34,.7); padding: 3px 7px; border-radius: 4px; font-style: normal; opacity: .45; }
    .indicators i.on { opacity: 1; background: #1d4ed8; }
    .indicators i.on.warn { background: #b45309; }
    .indicators i.on.bad { background: #b91c1c; }
    .gauges { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); width: 340px; height: 190px; background: linear-gradient(180deg, rgba(8,12,18,.72), rgba(8,12,18,.88)); border-radius: 14px; border: 1px solid rgba(120,140,170,.25); }
    .rpm-canvas { position: absolute; left: 12px; top: -24px; width: 170px; height: 170px; }
    .shift-lights { position: absolute; top: 8px; right: 26px; display: flex; gap: 5px; }
    .shift-lights i { width: 12px; height: 12px; border-radius: 50%; background: #2a3340; }
    .shift-lights i.on { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
    .speed-box { position: absolute; right: 30px; top: 42px; text-align: center; }
    .speed-box b { font-size: 38px; font-weight: 800; color: #fff; }
    .speed-box span { font-size: 12px; color: #8fa0b5; display: block; }
    .gear-box { position: absolute; right: 38px; top: 104px; font-size: 30px; font-weight: 800; color: #fbbf24; }
    .pedals { position: absolute; left: 130px; bottom: 12px; width: 130px; height: 14px; display: flex; gap: 6px; }
    .pedals div { flex: 1; border-radius: 4px; background: #1e2733; overflow: hidden; position: relative; }
    .pedals .throttle::after { content: ''; position: absolute; inset: 0; background: #22c55e; width: 0; }
    .pedals .brake::after { content: ''; position: absolute; inset: 0; background: #ef4444; width: 0; }
    .pedals .throttle { width: 100%; }
    .pedals .throttle::after { width: var(--thr, 0); }
    .pedals .brake::after { width: var(--brk, 0); }
    .help { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: rgba(8,12,18,.85); padding: 10px 16px; border-radius: 8px; font-size: 12px; text-align: center; max-width: 90%; }
    .hidden { display: none; }
    .touch-bar { position: absolute; inset: auto 0 0 0; height: 120px; display: flex; gap: 8px; justify-content: center; align-items: flex-end; padding-bottom: 10px; pointer-events: none; }
    .touch-bar button { pointer-events: auto; width: 74px; height: 48px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25); background: rgba(30,40,55,.55); color: #fff; font-size: 14px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="vendor/three/three.classic.js"></script>
  <script src="vendor/three/addons/loaders/OBJLoader.js"></script>
  <script src="vendor/three/addons/loaders/MTLLoader.js"></script>
  <script src="src/engine-dsp.js"></script>
  <script src="sim.bundle.js"></script>
</body>
</html>
