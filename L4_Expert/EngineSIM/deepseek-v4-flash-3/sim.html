<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EngineSIM · 驾驶场景</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0e14; }
    #app { width: 100%; height: 100%; }
    #hud { position: fixed; left: 16px; bottom: 16px; color: #e8f0ff; font: 14px/1.6 "Consolas", monospace; pointer-events: none; text-shadow: 0 1px 3px #000; }
    #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(8, 12, 18, .92); color: #e8f0ff; font-family: system-ui, sans-serif; z-index: 10; }
    #overlay h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: 2px; }
    #overlay p { margin: 4px 0; color: #9fb2c8; }
    #overlay button { margin-top: 18px; padding: 12px 44px; font-size: 18px; border: 1px solid #3d6bff; background: #1b2b55; color: #fff; border-radius: 8px; cursor: pointer; }
    #overlay button:hover { background: #2a3f7d; }
    #overlay .err { color: #ff7a7a; white-space: pre-wrap; max-width: 720px; text-align: left; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud"></div>
  <div id="overlay">
    <h1>ENGINESIM · V8 驾驶模拟</h1>
    <p>前中置引擎 · 等长芭蕉 · 十字曲轴 V8</p>
    <p id="overlay-msg">点击开始后进入驾驶场景（首次点击同时解锁音频）</p>
    <p id="overlay-err" class="err" style="display:none"></p>
    <button id="start-btn">开始驾驶</button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
