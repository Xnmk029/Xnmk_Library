<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCF2 Vehicle Physics Pipeline - NPR Stylization System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app-container">
        <canvas id="main-canvas"></canvas>
        <div id="loading-screen">
            <div class="loading-content">
                <h1>CCF2 VEHICLE SIMULATION</h1>
                <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
                <p id="loading-status">Initializing systems...</p>
            </div>
        </div>
        <!-- FR-Legends Style HUD -->
        <div id="hud" class="hidden">
            <div id="hud-speed" class="hud-panel angled-panel">
                <div class="speed-value" id="speed-value">0</div>
                <div class="speed-unit">KM/H</div>
            </div>
            <div id="hud-rpm" class="hud-panel angled-panel">
                <canvas id="rpm-canvas" width="220" height="220"></canvas>
            </div>
            <div id="hud-pedals" class="hud-panel">
                <div class="pedal-bar throttle"><div class="pedal-fill" id="throttle-bar"></div><span>THR</span></div>
                <div class="pedal-bar brake"><div class="pedal-fill" id="brake-bar"></div><span>BRK</span></div>
                <div class="pedal-bar handbrake"><div class="pedal-fill" id="handbrake-bar"></div><span>HBK</span></div>
            </div>
            <div id="hud-gear" class="hud-panel angled-panel">
                <div class="gear-value" id="gear-value">N</div>
            </div>
            <div id="hud-telemetry" class="hud-panel">
                <div class="telemetry-title">SUSPENSION TELEMETRY</div>
                <div class="telemetry-grid">
                    <div class="telemetry-item">FL: <span id="sus-fl">0.0</span>mm</div>
                    <div class="telemetry-item">FR: <span id="sus-fr">0.0</span>mm</div>
                    <div class="telemetry-item">RL: <span id="sus-rl">0.0</span>mm</div>
                    <div class="telemetry-item">RR: <span id="sus-rr">0.0</span>mm</div>
                </div>
            </div>
            <div id="hud-minimap" class="hud-panel">
                <canvas id="minimap-canvas" width="180" height="180"></canvas>
            </div>
            <div id="hud-mode" class="hud-panel angled-panel">
                <span id="mode-label">PROVING GROUND</span>
            </div>
            <div id="hud-controls" class="hud-panel">
                <div class="controls-hint">WASD/Arrows: Drive | Space: Handbrake | C: Camera | M: Map | T: City</div>
            </div>
        </div>
        <!-- Diagnostic Console -->
        <div id="diag-console" class="hidden">
            <div class="diag-header">DIAGNOSTIC LOG <button id="diag-close">X</button></div>
            <div id="diag-log"></div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
