<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPH FLUID DYNAMICS BENCHMARK v1.0</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a1a;
  color: #c8c8c8;
  font-family: 'Consolas', 'Courier New', monospace;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
}
#canvas-container {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}
canvas { display: block; }

/* 左上角数据面板 */
#hud-panel {
  position: absolute;
  top: 12px; left: 12px;
  background: rgba(20, 20, 20, 0.92);
  border: 1px solid #3a3a3a;
  padding: 14px 18px;
  min-width: 240px;
  z-index: 100;
  user-select: none;
}
#hud-panel .hud-title {
  font-size: 11px;
  letter-spacing: 2px;
  color: #6a6a6a;
  border-bottom: 1px solid #333;
  padding-bottom: 8px;
  margin-bottom: 10px;
  text-transform: uppercase;
}
#hud-panel .hud-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
  font-size: 12px;
}
#hud-panel .hud-label { color: #7a7a7a; }
#hud-panel .hud-value { color: #00e5ff; font-weight: bold; font-size: 13px; }
#hud-panel .hud-value.warn { color: #ff5252; }

/* 右侧控制面板 */
#ctrl-panel {
  position: absolute;
  top: 12px; right: 12px;
  background: rgba(20, 20, 20, 0.92);
  border: 1px solid #3a3a3a;
  padding: 14px 18px;
  min-width: 220px;
  z-index: 100;
  user-select: none;
}
#ctrl-panel .ctrl-title {
  font-size: 11px;
  letter-spacing: 2px;
  color: #6a6a6a;
  border-bottom: 1px solid #333;
  padding-bottom: 8px;
  margin-bottom: 12px;
  text-transform: uppercase;
}
.ctrl-group {
  margin-bottom: 14px;
}
.ctrl-group label {
  display: block;
  font-size: 11px;
  color: #8a8a8a;
  margin-bottom: 5px;
}
.ctrl-group input[type="range"] {
  width: 100%;
  height: 3px;
  -webkit-appearance: none;
  appearance: none;
  background: #3a3a3a;
  outline: none;
  cursor: pointer;
}
.ctrl-group input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px; height: 12px;
  background: #00e5ff;
  border: none;
  cursor: pointer;
}
.ctrl-group .ctrl-val {
  font-size: 11px;
  color: #00e5ff;
  margin-top: 3px;
  text-align: right;
}
#btn-reset {
  width: 100%;
  padding: 8px 0;
  background: #2a2a2a;
  border: 1px solid #4a4a4a;
  color: #c8c8c8;
  font-family: inherit;
  font-size: 12px;
  letter-spacing: 1px;
  cursor: pointer;
  text-transform: uppercase;
  transition: background 0.15s;
}
#btn-reset:hover { background: #3a3a3a; border-color: #00e5ff; color: #00e5ff; }
#btn-reset:active { background: #00e5ff; color: #111; }

/* 底部状态栏 */
#status-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 24px;
  background: rgba(15, 15, 15, 0.95);
  border-top: 1px solid #2a2a2a;
  display: flex;
  align-items: center;
  padding: 0 12px;
  font-size: 10px;
  color: #555;
  letter-spacing: 1px;
  z-index: 100;
}
</style>
</head>
<body>
<div id="canvas-container"></div>

<div id="hud-panel">
  <div class="hud-title">Performance Monitor</div>
  <div class="hud-row"><span class="hud-label">FPS</span><span class="hud-value" id="hud-fps">--</span></div>
  <div class="hud-row"><span class="hud-label">PARTICLES</span><span class="hud-value" id="hud-particles">--</span></div>
  <div class="hud-row"><span class="hud-label">PHYSICS</span><span class="hud-value" id="hud-physics">--</span></div>
  <div class="hud-row"><span class="hud-label">FRAME</span><span class="hud-value" id="hud-frame">--</span></div>
</div>

<div id="ctrl-panel">
  <div class="ctrl-title">Simulation Control</div>
  <div class="ctrl-group">
    <label>GRAVITY: <span id="val-gravity">-9.81</span> m/s2</label>
    <input type="range" id="slider-gravity" min="0" max="30" step="0.1" value="9.81">
  </div>
  <div class="ctrl-group">
    <label>VISCOSITY: <span id="val-viscosity">0.12</span></label>
    <input type="range" id="slider-viscosity" min="0.01" max="0.6" step="0.01" value="0.12">
  </div>
  <div class="ctrl-group">
    <label>PARTICLE COUNT: <span id="val-count">3000</span></label>
    <input type="range" id="slider-count" min="2500" max="4000" step="100" value="3000">
  </div>
  <button id="btn-reset">Reset Simulation</button>
</div>

<div id="status-bar">SPH FLUID DYNAMICS BENCHMARK // THREE.js WEBGL // SPATIAL HASH GRID // SINGLE-FILE BUILD</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  'use strict';

  // === CONFIGURATION ===
  var CONFIG = {
    particleCount: 3000,
    gravity: -9.81,
    viscosity: 0.12,
    containerSize: 4.0,
    smoothingRadius: 0.35,
    restDensity: 1.0,
    gasConstant: 8.0,
    dt: 0.008,
    boundaryDamping: 0.35,
    frictionDamping: 0.98,
    particleMass: 1.0
  };

  // === THREE.JS SETUP ===
  var container = document.getElementById('canvas-container');
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a1a);

  var camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(6.5, 5.0, 6.5);
  camera.lookAt(0, 0, 0);

  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  // === GLASS CONTAINER ===
  var halfSize = CONFIG.containerSize / 2;
  var boxGeo = new THREE.BoxGeometry(CONFIG.containerSize, CONFIG.containerSize, CONFIG.containerSize);
  var edgesGeo = new THREE.EdgesGeometry(boxGeo);
  var edgesMat = new THREE.LineBasicMaterial({ color: 0x4a4a4a, linewidth: 1 });
  var wireBox = new THREE.LineSegments(edgesGeo, edgesMat);
  scene.add(wireBox);

  // 半透明玻璃面
  var glassMat = new THREE.MeshBasicMaterial({
    color: 0x2a3a4a,
    transparent: true,
    opacity: 0.06,
    side: THREE.DoubleSide,
    depthWrite: false
  });
  var glassBox = new THREE.Mesh(boxGeo, glassMat);
  scene.add(glassBox);

  // 底部网格
  var gridHelper = new THREE.GridHelper(CONFIG.containerSize, 8, 0x333333, 0x262626);
  gridHelper.position.y = -halfSize;
  scene.add(gridHelper);

  // === SPH PARTICLE SYSTEM ===
  var positions, velocities, densities, pressures, forces;
  var particleGeometry, particleMaterial, particleSystem;
  var colorArray;

  // 空间哈希网格
  var gridCellSize = CONFIG.smoothingRadius;
  var gridMap = {};

  function hashKey(cx, cy, cz) {
    return cx * 73856093 ^ cy * 19349663 ^ cz * 83492791;
  }

  function initParticles() {
    var N = CONFIG.particleCount;
    positions = new Float32Array(N * 3);
    velocities = new Float32Array(N * 3);
    densities = new Float32Array(N);
    pressures = new Float32Array(N);
    forces = new Float32Array(N * 3);
    colorArray = new Float32Array(N * 3);

    // 初始排列：在容器上半部分形成水块
    var cols = Math.ceil(Math.cbrt(N));
    var spacing = (CONFIG.containerSize * 0.7) / cols;
    var startX = -CONFIG.containerSize * 0.35;
    var startZ = -CONFIG.containerSize * 0.35;
    var startY = 0.0;

    for (var i = 0; i < N; i++) {
      var ix = i % cols;
      var iy = Math.floor(i / cols) % cols;
      var iz = Math.floor(i / (cols * cols));

      positions[i * 3]     = startX + ix * spacing + (Math.random() - 0.5) * spacing * 0.3;
      positions[i * 3 + 1] = startY + iy * spacing + (Math.random() - 0.5) * spacing * 0.3;
      positions[i * 3 + 2] = startZ + iz * spacing + (Math.random() - 0.5) * spacing * 0.3;

      velocities[i * 3]     = 0;
      velocities[i * 3 + 1] = 0;
      velocities[i * 3 + 2] = 0;

      colorArray[i * 3]     = 0.0;
      colorArray[i * 3 + 1] = 0.3;
      colorArray[i * 3 + 2] = 0.8;
    }

    if (particleSystem) {
      scene.remove(particleSystem);
      particleGeometry.dispose();
      particleMaterial.dispose();
    }

    particleGeometry = new THREE.BufferGeometry();
    particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));

    particleMaterial = new THREE.PointsMaterial({
      size: 0.07,
      vertexColors: true,
      transparent: true,
      opacity: 0.88,
      sizeAttenuation: true,
      depthWrite: true
    });

    particleSystem = new THREE.Points(particleGeometry, particleMaterial);
    scene.add(particleSystem);
  }

  // === SPH KERNELS ===
  var H = CONFIG.smoothingRadius;
  var H2 = H * H;
  var POLY6_COEFF = 315.0 / (64.0 * Math.PI * Math.pow(H, 9));
  var SPIKY_GRAD_COEFF = -45.0 / (Math.PI * Math.pow(H, 6));
  var VISC_LAP_COEFF = 45.0 / (Math.PI * Math.pow(H, 6));

  function poly6(r2) {
    if (r2 >= H2) return 0.0;
    var diff = H2 - r2;
    return POLY6_COEFF * diff * diff * diff;
  }

  function spikyGrad(r) {
    if (r >= H || r < 1e-6) return 0.0;
    var diff = H - r;
    return SPIKY_GRAD_COEFF * diff * diff;
  }

  function viscLaplacian(r) {
    if (r >= H) return 0.0;
    return VISC_LAP_COEFF * (H - r);
  }

  // === SPATIAL HASH GRID ===
  function buildGrid() {
    gridMap = {};
    var N = CONFIG.particleCount;
    var invCell = 1.0 / gridCellSize;
    for (var i = 0; i < N; i++) {
      var cx = Math.floor(positions[i * 3] * invCell);
      var cy = Math.floor(positions[i * 3 + 1] * invCell);
      var cz = Math.floor(positions[i * 3 + 2] * invCell);
      var key = hashKey(cx, cy, cz);
      if (!gridMap[key]) gridMap[key] = [];
      gridMap[key].push(i);
    }
  }

  function getNeighbors(i) {
    var invCell = 1.0 / gridCellSize;
    var cx = Math.floor(positions[i * 3] * invCell);
    var cy = Math.floor(positions[i * 3 + 1] * invCell);
    var cz = Math.floor(positions[i * 3 + 2] * invCell);
    var neighbors = [];
    for (var dx = -1; dx <= 1; dx++) {
      for (var dy = -1; dy <= 1; dy++) {
        for (var dz = -1; dz <= 1; dz++) {
          var key = hashKey(cx + dx, cy + dy, cz + dz);
          var cell = gridMap[key];
          if (cell) {
            for (var k = 0; k < cell.length; k++) {
              neighbors.push(cell[k]);
            }
          }
        }
      }
    }
    return neighbors;
  }

  // === SPH SOLVER ===
  function computeDensityPressure() {
    var N = CONFIG.particleCount;
    var mass = CONFIG.particleMass;
    for (var i = 0; i < N; i++) {
      var density = 0.0;
      var neighbors = getNeighbors(i);
      var px = positions[i * 3];
      var py = positions[i * 3 + 1];
      var pz = positions[i * 3 + 2];

      for (var n = 0; n < neighbors.length; n++) {
        var j = neighbors[n];
        var dx = px - positions[j * 3];
        var dy = py - positions[j * 3 + 1];
        var dz = pz - positions[j * 3 + 2];
        var r2 = dx * dx + dy * dy + dz * dz;
        density += mass * poly6(r2);
      }

      densities[i] = Math.max(density, CONFIG.restDensity * 0.5);
      pressures[i] = CONFIG.gasConstant * (densities[i] - CONFIG.restDensity);
    }
  }

  function computeForces() {
    var N = CONFIG.particleCount;
    var mass = CONFIG.particleMass;
    var visc = CONFIG.viscosity;

    for (var i = 0; i < N; i++) {
      var fpx = 0, fpy = 0, fpz = 0;
      var fvx = 0, fvy = 0, fvz = 0;
      var neighbors = getNeighbors(i);
      var px = positions[i * 3];
      var py = positions[i * 3 + 1];
      var pz = positions[i * 3 + 2];
      var pi = pressures[i];
      var di = densities[i];

      for (var n = 0; n < neighbors.length; n++) {
        var j = neighbors[n];
        if (i === j) continue;

        var dx = px - positions[j * 3];
        var dy = py - positions[j * 3 + 1];
        var dz = pz - positions[j * 3 + 2];
        var r2 = dx * dx + dy * dy + dz * dz;
        if (r2 >= H2 || r2 < 1e-8) continue;

        var r = Math.sqrt(r2);
        var dj = densities[j];
        var invR = 1.0 / r;

        // 压力力 (Spiky gradient)
        var pAvg = (pi + pressures[j]) * 0.5;
        var sGrad = spikyGrad(r);
        var pScale = -mass * pAvg / dj * sGrad * invR;
        fpx += pScale * dx;
        fpy += pScale * dy;
        fpz += pScale * dz;

        // 粘滞力 (Viscosity Laplacian)
        var vLap = viscLaplacian(r);
        var vScale = visc * mass / dj * vLap;
        fvx += vScale * (velocities[j * 3] - velocities[i * 3]);
        fvy += vScale * (velocities[j * 3 + 1] - velocities[i * 3 + 1]);
        fvz += vScale * (velocities[j * 3 + 2] - velocities[i * 3 + 2]);
      }

      // 总力 = 压力 + 粘滞 + 重力
      forces[i * 3]     = fpx + fvx;
      forces[i * 3 + 1] = fpy + fvy + CONFIG.gravity * di;
      forces[i * 3 + 2] = fpz + fvz;
    }
  }

  function integrate() {
    var N = CONFIG.particleCount;
    var dt = CONFIG.dt;
    var bound = halfSize - 0.05;
    var damp = CONFIG.boundaryDamping;
    var fric = CONFIG.frictionDamping;

    for (var i = 0; i < N; i++) {
      var idx = i * 3;
      var invDensity = 1.0 / densities[i];

      // 半隐式欧拉积分
      velocities[idx]     += forces[idx] * invDensity * dt;
      velocities[idx + 1] += forces[idx + 1] * invDensity * dt;
      velocities[idx + 2] += forces[idx + 2] * invDensity * dt;

      positions[idx]     += velocities[idx] * dt;
      positions[idx + 1] += velocities[idx + 1] * dt;
      positions[idx + 2] += velocities[idx + 2] * dt;

      // 边界碰撞检测与响应
      // X轴
      if (positions[idx] < -bound) {
        positions[idx] = -bound;
        velocities[idx] *= -damp;
        velocities[idx + 1] *= fric;
        velocities[idx + 2] *= fric;
      } else if (positions[idx] > bound) {
        positions[idx] = bound;
        velocities[idx] *= -damp;
        velocities[idx + 1] *= fric;
        velocities[idx + 2] *= fric;
      }
      // Y轴
      if (positions[idx + 1] < -bound) {
        positions[idx + 1] = -bound;
        velocities[idx + 1] *= -damp;
        velocities[idx] *= fric;
        velocities[idx + 2] *= fric;
      } else if (positions[idx + 1] > bound) {
        positions[idx + 1] = bound;
        velocities[idx + 1] *= -damp;
        velocities[idx] *= fric;
        velocities[idx + 2] *= fric;
      }
      // Z轴
      if (positions[idx + 2] < -bound) {
        positions[idx + 2] = -bound;
        velocities[idx + 2] *= -damp;
        velocities[idx] *= fric;
        velocities[idx + 1] *= fric;
      } else if (positions[idx + 2] > bound) {
        positions[idx + 2] = bound;
        velocities[idx + 2] *= -damp;
        velocities[idx] *= fric;
        velocities[idx + 1] *= fric;
      }
    }
  }

  // === COLOR MAPPING ===
  function updateColors() {
    var N = CONFIG.particleCount;
    var maxSpeed = 4.0;
    for (var i = 0; i < N; i++) {
      var vx = velocities[i * 3];
      var vy = velocities[i * 3 + 1];
      var vz = velocities[i * 3 + 2];
      var speed = Math.sqrt(vx * vx + vy * vy + vz * vz);
      var t = Math.min(speed / maxSpeed, 1.0);

      // 低速: 深蓝 (0.05, 0.15, 0.6)
      // 中速: 亮青 (0.0, 0.9, 1.0)
      // 高速: 亮红 (1.0, 0.2, 0.1)
      var r, g, b;
      if (t < 0.5) {
        var s = t * 2.0;
        r = 0.05 * (1 - s) + 0.0 * s;
        g = 0.15 * (1 - s) + 0.85 * s;
        b = 0.6 * (1 - s) + 1.0 * s;
      } else {
        var s2 = (t - 0.5) * 2.0;
        r = 0.0 * (1 - s2) + 1.0 * s2;
        g = 0.85 * (1 - s2) + 0.2 * s2;
        b = 1.0 * (1 - s2) + 0.1 * s2;
      }
      colorArray[i * 3] = r;
      colorArray[i * 3 + 1] = g;
      colorArray[i * 3 + 2] = b;
    }
    particleGeometry.attributes.color.needsUpdate = true;
  }

  // === PHYSICS STEP ===
  function physicsStep() {
    buildGrid();
    computeDensityPressure();
    computeForces();
    integrate();
    updateColors();
    particleGeometry.attributes.position.needsUpdate = true;
  }

  // === CAMERA ORBIT ===
  var cameraAngle = 0.6;
  var cameraElevation = 0.5;
  var cameraDistance = 9.0;
  var isDragging = false;
  var lastMouseX = 0, lastMouseY = 0;

  renderer.domElement.addEventListener('mousedown', function(e) {
    isDragging = true;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
  });
  window.addEventListener('mouseup', function() { isDragging = false; });
  window.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    var dx = e.clientX - lastMouseX;
    var dy = e.clientY - lastMouseY;
    cameraAngle += dx * 0.005;
    cameraElevation = Math.max(0.1, Math.min(1.4, cameraElevation + dy * 0.005));
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
  });
  renderer.domElement.addEventListener('wheel', function(e) {
    e.preventDefault();
    cameraDistance = Math.max(5, Math.min(16, cameraDistance + e.deltaY * 0.01));
  }, { passive: false });

  function updateCamera() {
    camera.position.x = Math.cos(cameraAngle) * Math.cos(cameraElevation) * cameraDistance;
    camera.position.y = Math.sin(cameraElevation) * cameraDistance;
    camera.position.z = Math.sin(cameraAngle) * Math.cos(cameraElevation) * cameraDistance;
    camera.lookAt(0, -0.3, 0);
  }

  // === HUD UPDATE ===
  var frameCount = 0;
  var fpsAccum = 0;
  var lastFpsTime = performance.now();
  var displayFps = 0;

  function updateHUD(physicsMs) {
    frameCount++;
    var now = performance.now();
    fpsAccum += now - lastFpsTime;
    lastFpsTime = now;

    if (frameCount >= 15) {
      displayFps = Math.round(1000 / (fpsAccum / frameCount));
      frameCount = 0;
      fpsAccum = 0;
    }

    var fpsEl = document.getElementById('hud-fps');
    fpsEl.textContent = displayFps;
    fpsEl.className = 'hud-value' + (displayFps < 30 ? ' warn' : '');
    document.getElementById('hud-particles').textContent = CONFIG.particleCount;
    document.getElementById('hud-physics').textContent = physicsMs.toFixed(2) + ' ms';
    document.getElementById('hud-frame').textContent = (1000 / Math.max(displayFps, 1)).toFixed(1) + ' ms';
  }

  // === CONTROLS ===
  document.getElementById('slider-gravity').addEventListener('input', function() {
    CONFIG.gravity = -parseFloat(this.value);
    document.getElementById('val-gravity').textContent = CONFIG.gravity.toFixed(2);
  });
  document.getElementById('slider-viscosity').addEventListener('input', function() {
    CONFIG.viscosity = parseFloat(this.value);
    document.getElementById('val-viscosity').textContent = CONFIG.viscosity.toFixed(2);
  });
  document.getElementById('slider-count').addEventListener('input', function() {
    CONFIG.particleCount = parseInt(this.value);
    document.getElementById('val-count').textContent = CONFIG.particleCount;
  });
  document.getElementById('btn-reset').addEventListener('click', function() {
    initParticles();
  });

  // === RESIZE ===
  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // === MAIN LOOP ===
  function animate() {
    requestAnimationFrame(animate);

    var t0 = performance.now();
    physicsStep();
    var physicsMs = performance.now() - t0;

    updateCamera();
    renderer.render(scene, camera);
    updateHUD(physicsMs);
  }

  // === INIT ===
  initParticles();
  animate();

})();
</script>
</body>
</html>
