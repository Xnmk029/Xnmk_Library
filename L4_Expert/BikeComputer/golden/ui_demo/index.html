<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>BikeComputer UI Demo — 240×240</title>
<style>
  body{background:#111;display:flex;flex-direction:column;align-items:center;
       font-family:system-ui,sans-serif;color:#aaa;margin:24px 0}
  #scr{width:240px;height:240px;border-radius:50%;background:#000;
       box-shadow:0 0 0 6px #222,0 8px 40px #0009;image-rendering:pixelated}
  p{font-size:12px;max-width:360px;text-align:center;line-height:1.6}
  kbd{background:#333;border-radius:4px;padding:1px 6px;color:#eee}
</style>
</head>
<body>
<canvas id="scr" width="240" height="240"></canvas>
<p>编码器模拟：<kbd>←</kbd><kbd>→</kbd> 旋转切页 / 选择，<kbd>Enter</kbd> 短按确认，<kbd>M</kbd> 长按菜单。本 demo 为 golden 最小样例（4 页）。</p>
<script>
const c = document.getElementById('scr').getContext('2d');
const W = 240, R = 120;
let page = 0, sel = 0, t0 = performance.now();

// ---------- 模拟数据 ----------
const D = { spd: 27.4, dst: 42.13, tm: "01:23:45", alt: 312, clb: 486,
            kcal: 812, hdg: 152, bat: 76, sat: 14, steps: 1024 };
const track = [];   // 伪轨迹
for (let i = 0; i < 90; i++) track.push([i * 2.4,
  60 + 40 * Math.sin(i / 9) * Math.cos(i / 23)]);

function roundRect(x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function txt(s, x, y, size, color, align = "center", bold = true) {
  c.fillStyle = color; c.textAlign = align; c.textBaseline = "middle";
  c.font = (bold ? "700 " : "") + size + "px system-ui"; c.fillText(s, x, y);
}
function statusBar() {
  c.fillStyle = "#000a"; roundRect(30, 14, 180, 20, 10); c.fill();
  txt("GPS " + D.sat + "    " + D.bat + "%", 120, 24, 11, "#8f8", false);
  txt("10:24", 120, 24, 11, "#ccc");
}

// ---------- 页面 ----------
const pages = [
  { name: "表盘", draw() {
      const t = (performance.now() - t0) / 1000;
      c.strokeStyle = "#2af"; c.lineWidth = 3; c.beginPath();
      c.arc(R, R, 108, -Math.PI / 2, -Math.PI / 2 + t * 0.6 % (2 * Math.PI)); c.stroke();
      for (let i = 0; i < 60; i++) {
        const a = i / 60 * 2 * Math.PI, r1 = i % 5 ? 100 : 94, r2 = 104;
        c.strokeStyle = i % 5 ? "#444" : "#aaa"; c.lineWidth = i % 5 ? 1 : 2;
        c.beginPath();
        c.moveTo(R + r1 * Math.cos(a), R + r1 * Math.sin(a));
        c.lineTo(R + r2 * Math.cos(a), R + r2 * Math.sin(a)); c.stroke();
      }
      txt("10:24", R, R - 14, 44, "#fff");
      txt("SUN 09-13", R, R + 18, 13, "#777", "center", false);
      txt("♥ 计步 " + D.steps, R, R + 44, 12, "#f88", "center", false);
      statusBar();
  }},
  { name: "骑行数据", draw() {
      txt("27.4", 120, 74, 56, "#0f6"); txt("km/h", 120, 108, 13, "#0a5", "center", false);
      const grid = [["DIST", D.dst + " km"], ["TIME", D.tm],
                    ["ALT", D.alt + " m"], ["CLIMB", "+" + D.clb + " m"],
                    ["KCAL", D.kcal], ["HDG", D.hdg + "°"]];
      grid.forEach((g, i) => {
        const x = 36 + (i % 2) * 90, y = 138 + ((i / 2) | 0) * 30;
        txt(g[0], x + 32, y, 10, "#567", "center", false);
        txt(String(g[1]), x + 32, y + 13, 13, "#eee");
      });
      statusBar();
  }},
  { name: "地图", draw() {
      c.save(); c.beginPath(); c.arc(R, R, 108, 0, 7); c.clip();
      c.fillStyle = "#1a1f1a"; c.fillRect(0, 0, W, W);
      c.strokeStyle = "#2c332c"; c.lineWidth = 8;
      for (let i = -4; i < 5; i++) {
        c.beginPath(); c.moveTo(0, R + i * 40); c.lineTo(W, R + i * 40 + 30); c.stroke();
        c.beginPath(); c.moveTo(R + i * 40, 0); c.lineTo(R + i * 40 - 30, W); c.stroke();
      }
      c.strokeStyle = "#4cf"; c.lineWidth = 3; c.beginPath();
      track.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]));
      c.stroke();
      const p = track[track.length - 1];
      c.fillStyle = "#fff"; c.beginPath(); c.arc(p[0], p[1], 6, 0, 7); c.fill();
      c.fillStyle = "#2af"; c.beginPath(); c.arc(p[0], p[1], 4, 0, 7); c.fill();
      c.restore(); txt("z14 · 离线瓦片", 120, 214, 11, "#789", "center", false);
      statusBar();
  }},
  { name: "菜单", draw() {
      const items = ["开始记录", "轨迹回放", "计步详情", "罗盘校准", "系统设置", "关于本机"];
      items.forEach((it, i) => {
        const y = 56 + i * 26;
        if (i === sel) { c.fillStyle = "#234"; roundRect(40, y - 11, 160, 22, 8); c.fill(); }
        txt(it, 120, y, 13, i === sel ? "#8cf" : "#bbb");
      });
      statusBar();
  }},
];

function draw() {
  c.clearRect(0, 0, W, W); c.fillStyle = "#000"; c.fillRect(0, 0, W, W);
  pages[page].draw();
  requestAnimationFrame(draw);
}
addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { if (page === 3) sel = Math.min(sel + 1, 5); else page = (page + 1) % 4; }
  if (e.key === "ArrowLeft")  { if (page === 3) sel = Math.max(sel - 1, 0); else page = (page + 3) % 4; }
  if (e.key === "Enter")      { /* 确认 */ }
  if (e.key.toLowerCase() === "m") page = 3;
});
draw();
</script>
</body>
</html>
