<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>星渊 · 2048 — 融合圣所</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#04060e;color:#dff3ff;
  font-family:'Rajdhani','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
#stage{position:fixed;inset:0;z-index:1}
#stage canvas{display:block}
.vignette{position:fixed;inset:0;z-index:5;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%,transparent 52%,rgba(0,0,8,.58) 100%)}
#flashRed{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at center,rgba(255,45,70,.30),rgba(90,0,18,.48))}
#flashWhite{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;background:#fff}
#hud{position:fixed;top:14px;left:14px;right:14px;z-index:20;pointer-events:none;
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.panel{background:rgba(8,13,28,.58);border:1px solid rgba(110,190,255,.16);
  border-radius:14px;padding:10px 12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 8px 30px rgba(0,0,0,.35)}
#leftHud{display:flex;flex-direction:column;gap:7px;min-width:230px}
#floorTag{font-family:'Orbitron',sans-serif;font-size:13px;letter-spacing:2px;color:#8fe6ff;
  text-shadow:0 0 12px rgba(70,190,255,.6)}
#hpWrap{position:relative}
#hpBar{height:14px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden;
  border:1px solid rgba(255,255,255,.14)}
#hpFill{height:100%;width:100%;border-radius:7px;transition:width .38s cubic-bezier(.22,1,.36,1)}
#hpText{position:absolute;right:4px;top:-2px;font-size:11px;font-weight:700;color:#eafcff;
  text-shadow:0 1px 3px rgba(0,0,0,.8)}
#shieldPips{display:flex;gap:4px;margin-top:3px;min-height:10px}
#shieldPips .pip{width:9px;height:9px;transform:rotate(45deg);border-radius:2px;
  background:linear-gradient(135deg,#8fe6ff,#3aa0ff);box-shadow:0 0 8px rgba(90,190,255,.9)}
.miniRow{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:#ffe9a8}
.miniRow .lbl{font-size:11px;color:#9fb8d8;letter-spacing:1px}
#comboRow{display:none;align-items:center;gap:8px}
#comboRow.on{display:flex}
#comboBar{width:110px;height:8px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
#comboFill{height:100%;width:0%;border-radius:5px;
  background:linear-gradient(90deg,#ffd23d,#ff7a3d,#ff3d6e);box-shadow:0 0 12px rgba(255,120,60,.8);
  transition:width .25s ease}
#comboText{font-family:'Orbitron',sans-serif;font-size:13px;color:#ffd23d;font-weight:800;
  text-shadow:0 0 10px rgba(255,170,40,.8)}
#rightHud{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#relicChips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:380px}
.chip{position:relative;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:19px;background:linear-gradient(145deg,rgba(40,70,140,.55),rgba(15,22,48,.7));
  border:1px solid rgba(130,180,255,.28);box-shadow:0 4px 14px rgba(0,0,0,.4),inset 0 0 12px rgba(90,140,255,.12);
  animation:chipIn .3s cubic-bezier(.34,1.56,.64,1) both}
.chip b{position:absolute;top:-6px;right:-6px;font-size:10px;background:#ffd23d;color:#221400;
  border-radius:8px;padding:0 5px;font-weight:800}
@keyframes chipIn{from{opacity:0;transform:scale(.3) rotate(-15deg)}to{opacity:1;transform:none}}
#synergyRow{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.synergy{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;color:#bffcff;
  background:rgba(40,220,220,.14);border:1px solid rgba(80,230,255,.35);text-shadow:0 0 8px rgba(80,220,255,.7)}
#btnRow{display:flex;gap:8px;pointer-events:auto}
.ibtn{width:40px;height:40px;border-radius:12px;font-size:17px;display:flex;align-items:center;justify-content:center;
  background:rgba(12,20,42,.6);border:1px solid rgba(120,190,255,.22);transition:transform .12s,background .2s}
.ibtn:hover{background:rgba(30,60,120,.7);transform:scale(1.06)}
.ibtn:active{transform:scale(.92)}
#dpad{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:20;
  display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,60px);gap:7px}
.dbtn{grid-area:auto;border-radius:15px;font-size:20px;color:#cfeaff;
  background:rgba(10,18,40,.55);border:1px solid rgba(110,190,255,.22);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 6px 18px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .08s,background .15s;touch-action:none}
.dbtn:hover{background:rgba(30,70,140,.65)}
.dbtn:active{transform:scale(.88);background:rgba(50,110,220,.75)}
#dUp{grid-column:2;grid-row:1}#dLeft{grid-column:1;grid-row:2}
#dDown{grid-column:2;grid-row:2}#dRight{grid-column:3;grid-row:2}
.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(5,9,22,.70),rgba(2,3,10,.92));
  opacity:0;pointer-events:none;transition:opacity .38s ease;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.overlay.show{opacity:1;pointer-events:auto}
.startBox{max-width:720px;width:92%;text-align:center;padding:34px 28px;border-radius:24px;
  background:linear-gradient(160deg,rgba(14,24,52,.82),rgba(6,10,26,.88));
  border:1px solid rgba(110,190,255,.22);box-shadow:0 24px 80px rgba(0,0,0,.55),inset 0 0 60px rgba(60,110,255,.08)}
.titleGlow{font-family:'Orbitron',sans-serif;font-size:46px;font-weight:800;letter-spacing:5px;color:#eafaff;
  animation:pulseGlow 3.2s ease-in-out infinite}
.sub{font-family:'Orbitron',sans-serif;font-size:13px;letter-spacing:8px;color:#7fd4ff;margin-top:6px;opacity:.85}
.tagline{margin:14px 0 20px;font-size:16px;color:#cfe6ff;letter-spacing:2px}
@keyframes pulseGlow{0%,100%{text-shadow:0 0 16px rgba(70,180,255,.55),0 0 56px rgba(120,80,255,.35)}
  50%{text-shadow:0 0 30px rgba(70,220,255,.95),0 0 92px rgba(140,90,255,.6)}}
.how{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.howItem{flex:1;min-width:180px;max-width:220px;padding:14px 12px;border-radius:16px;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);text-align:center}
.howItem span{font-size:26px;display:block;margin-bottom:6px}
.howItem b{display:block;font-size:15px;color:#bff2ff;margin-bottom:4px}
.howItem i{font-style:normal;font-size:12.5px;color:#8fa8cc;line-height:1.45}
.controls{margin-bottom:18px;font-size:12.5px;color:#7f9bc4;letter-spacing:1px}
.btn{display:inline-block;padding:13px 38px;border-radius:999px;font-size:18px;font-weight:800;letter-spacing:4px;
  color:#05121f;background:linear-gradient(135deg,#7ff3ff,#3aa0ff 55%,#8a6cff);
  box-shadow:0 8px 28px rgba(60,150,255,.45),inset 0 1px 0 rgba(255,255,255,.6);
  transition:transform .15s,box-shadow .2s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 12px 36px rgba(80,170,255,.6)}
.btn:active{transform:scale(.95)}
.floorBox{text-align:center;animation:fadeIn .5s ease both}
#floorBig{font-family:'Orbitron',sans-serif;font-size:64px;font-weight:800;letter-spacing:10px;color:#eafcff;
  text-shadow:0 0 30px rgba(80,190,255,.9),0 0 90px rgba(120,90,255,.6)}
#floorName{font-size:22px;letter-spacing:6px;color:#9fd6ff;margin-top:10px;text-shadow:0 0 16px rgba(80,170,255,.7)}
.centerCol{text-align:center;padding:24px}
.oh{font-family:'Orbitron',sans-serif;font-size:30px;letter-spacing:5px;margin-bottom:22px;color:#cdf5ff;
  text-shadow:0 0 22px rgba(90,200,255,.8)}
.cards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.rcard{width:215px;min-height:225px;padding:20px 16px;border-radius:20px;text-align:center;cursor:pointer;
  background:linear-gradient(165deg,rgba(20,32,68,.85),rgba(8,12,30,.92));
  border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 40px rgba(0,0,0,.5);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .2s,border-color .2s;
  animation:riseIn .45s cubic-bezier(.22,1.2,.4,1) both}
.rcard:nth-child(2){animation-delay:.07s}.rcard:nth-child(3){animation-delay:.14s}
.rcard:hover{transform:translateY(-8px) scale(1.045);box-shadow:0 22px 56px rgba(0,0,0,.6)}
.rcard:active{transform:scale(.96)}
.rcard.r1{border-color:rgba(120,220,255,.55)}
.rcard.r2{border-color:rgba(190,140,255,.6);box-shadow:0 14px 44px rgba(120,60,220,.28)}
.rcard.r3{border-color:rgba(255,200,90,.65);box-shadow:0 14px 48px rgba(255,150,40,.3)}
.rcard .ricon{font-size:42px;display:block;margin-bottom:8px;filter:drop-shadow(0 0 12px rgba(255,255,255,.25))}
.rcard .rfam{font-size:11px;letter-spacing:2px;color:#8fb4e0;margin-bottom:6px}
.rcard .rname{font-size:19px;font-weight:800;color:#eafcff;margin-bottom:8px;letter-spacing:1px}
.rcard .rdesc{font-size:13px;color:#b8cbe8;line-height:1.5}
.rcard .rrar{font-size:10px;margin-top:10px;letter-spacing:2px}
.rcard.r1 .rrar{color:#7fd4ff}.rcard.r2 .rrar{color:#c69bff}.rcard.r3 .rrar{color:#ffce6b}
@keyframes riseIn{from{opacity:0;transform:translateY(28px) scale(.92)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.endBox{text-align:center;padding:36px 44px;border-radius:24px;max-width:520px;width:92%;
  background:linear-gradient(160deg,rgba(26,14,32,.88),rgba(8,6,18,.94));
  border:1px solid rgba(255,110,140,.3);box-shadow:0 24px 80px rgba(0,0,0,.6)}
.endBox.win{border-color:rgba(255,210,90,.45);background:linear-gradient(160deg,rgba(20,30,56,.9),rgba(8,10,24,.95))}
.bigEmoji{font-size:58px;margin-bottom:6px;animation:floaty 2.6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.endBox h2{font-family:'Orbitron',sans-serif;font-size:30px;letter-spacing:4px;margin-bottom:18px}
.endBox h2.lose{color:#ff7d8f;text-shadow:0 0 24px rgba(255,60,90,.7)}
.endBox h2.win2{color:#ffe79a;text-shadow:0 0 24px rgba(255,190,60,.8)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 24px}
.stat{background:rgba(255,255,255,.05);border-radius:12px;padding:10px 6px;border:1px solid rgba(255,255,255,.08)}
.stat b{display:block;font-family:'Orbitron',sans-serif;font-size:20px;color:#bff2ff}
.stat i{font-style:normal;font-size:11px;color:#88a2c8;letter-spacing:1px}
#toasts{position:fixed;left:16px;bottom:150px;z-index:25;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:9px 16px;border-radius:12px;font-size:14px;font-weight:700;color:#eaffff;
  background:rgba(12,22,48,.78);border:1px solid rgba(120,200,255,.3);backdrop-filter:blur(8px);
  box-shadow:0 8px 24px rgba(0,0,0,.4);animation:toastIn .28s cubic-bezier(.22,1.2,.4,1) both}
@keyframes toastIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
#bootError{display:none;margin-top:16px;color:#ff9db0;font-size:13px}
@media (max-width:720px){
  .titleGlow{font-size:32px;letter-spacing:3px}
  #floorBig{font-size:44px}
  .startBox{padding:24px 16px}
  .howItem{min-width:150px}
  #leftHud{min-width:170px}
  #relicChips{max-width:240px}
  .rcard{width:170px;min-height:190px}
}
</style>
</head>
<body>
<div id="stage"></div>
<div class="vignette"></div>
<div id="flashRed"></div>
<div id="flashWhite"></div>

<div id="hud">
  <div class="panel" id="leftHud">
    <div id="floorTag">第 1 层 · 迷雾长廊</div>
    <div id="hpWrap">
      <div id="hpBar"><div id="hpFill"></div></div>
      <div id="hpText">20/20</div>
      <div id="shieldPips"></div>
    </div>
    <div class="miniRow"><span class="lbl">星髓</span>💎<span id="essenceVal">0</span></div>
    <div id="comboRow">
      <div id="comboBar"><div id="comboFill"></div></div>
      <span id="comboText"></span>
    </div>
  </div>
  <div id="rightHud">
    <div id="relicChips"></div>
    <div id="synergyRow"></div>
    <div id="btnRow">
      <button id="ibtnSound" class="ibtn" title="音效开关">🔊</button>
      <button id="ibtnRestart" class="ibtn" title="重新开始">↻</button>
    </div>
  </div>
</div>

<div id="dpad">
  <button class="dbtn" id="dUp" data-dir="0">▲</button>
  <button class="dbtn" id="dLeft" data-dir="2">◀</button>
  <button class="dbtn" id="dDown" data-dir="1">▼</button>
  <button class="dbtn" id="dRight" data-dir="3">▶</button>
</div>

<div id="toasts"></div>

<div id="startScreen" class="overlay show">
  <div class="startBox">
    <div class="titleGlow">星渊 · 2048</div>
    <div class="sub">STAR ABYSS SANCTUM</div>
    <p class="tagline">融合晶核 · 构筑遗物 · 抵御深渊</p>
    <div class="how">
      <div class="howItem"><span>🪄</span><b>合并即攻击</b><i>滑动合并方块，晶核能量将化作光束轰击魔物</i></div>
      <div class="howItem"><span>⚔️</span><b>魔物逼近</b><i>每次滑动它们都会前进，抵达圣所将反噬你的生命</i></div>
      <div class="howItem"><span>💠</span><b>遗物构筑</b><i>每层平定后选择遗物，打造属于你的 Build 流派</i></div>
    </div>
    <div class="controls">操作：方向键 / WASD / 滑动屏幕 / 下方按键</div>
    <button id="startBtn" class="btn">进入深渊</button>
    <div id="bootError">⚠️ 3D 库加载失败，请检查网络后刷新页面</div>
  </div>
</div>

<div id="floorScreen" class="overlay">
  <div class="floorBox">
    <div id="floorBig">第 1 层</div>
    <div id="floorName">迷雾长廊</div>
  </div>
</div>

<div id="rewardScreen" class="overlay">
  <div class="centerCol">
    <h2 class="oh">深渊已平定</h2>
    <div class="cards" id="rewardCards"></div>
  </div>
</div>

<div id="endScreen" class="overlay">
  <div class="endBox">
    <div class="bigEmoji">💀</div>
    <h2 class="lose">圣所崩毁</h2>
    <div class="stats" id="endStats"></div>
    <button id="restartBtn" class="btn">再入深渊</button>
  </div>
</div>

<div id="victoryScreen" class="overlay">
  <div class="endBox win">
    <div class="bigEmoji">🏆</div>
    <h2 class="win2">深渊核心已寂灭</h2>
    <div class="stats" id="winStats"></div>
    <button id="continueBtn" class="btn">继续无尽深渊</button>

</div>

<script>
'use strict';
/* ============================================================
   星渊 · 2048 — 融合圣所
   Three.js 3D 渲染 + 2048 合并 + Roguelike 深渊爬塔
   ============================================================ */

// ---------- 基础工具 ----------
const SIZE=4, CELL=1.06, TILE=0.9, TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}
const easeOutCubic=t=>1-Math.pow(1-t,3);
const easeInOutCubic=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const easeInQuad=t=>t*t;
const easeOutElastic=t=>{const c4=(2*Math.PI)/3;return t===0?0:t===1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*c4)+1;};
function easeOutBounce(t){const n1=7.5625,d1=2.75;if(t<1/d1)return n1*t*t;if(t<2/d1)return n1*(t-=1.5/d1)*t+.75;if(t<2.5/d1)return n1*(t-=2.25/d1)*t+.9375;return n1*(t-=2.625/d1)*t+.984375;}

function cellX(gx){return (gx-1.5)*CELL;}
function cellZ(gy){return (gy-1.5)*CELL;}
function wait(ms){return new Promise(res=>setTimeout(res,ms));}
function hexCss(n){return '#'+n.toString(16).padStart(6,'0');}
function hexToRgb(n){return [(n>>16)&255,(n>>8)&255,n&255];}
function mixHex(a,b,t){const r=Math.round(lerp((a>>16)&255,(b>>16)&255,t));const g=Math.round(lerp((a>>8)&255,(b>>8)&255,t));const bl=Math.round(lerp(a&255,b&255,t));return (r<<16)|(g<<8)|bl;}

// ---------- 数值配色 ----------
const PALETTE=[
  {v:2,c:0x7fd8ff,e:0x1fa6ff},
  {v:4,c:0x6fe8e0,e:0x14c9bd},
  {v:8,c:0x86f0a2,e:0x2fce6a},
  {v:16,c:0xffe38a,e:0xffb520},
  {v:32,c:0xffb46b,e:0xff7a1a},
  {v:64,c:0xff8b75,e:0xff4d3d},
  {v:128,c:0xff6f8f,e:0xff2d5e},
  {v:256,c:0xff86d9,e:0xf33cc8},
  {v:512,c:0xd39bff,e:0x9c4dff},
  {v:1024,c:0x9aa6ff,e:0x5f5cff},
  {v:2048,c:0xfff3b0,e:0xffd23d},
  {v:4096,c:0xf2f6ff,e:0x9fb4ff}
];
function getStyle(v){
  let st=PALETTE[0];
  for(const p of PALETTE){ if(v>=p.v) st=p; }
  if(v>=8192) st={v:v,c:0x0c0e1e,e:0x66e0ff};
  return st;
}

// ---------- Canvas 贴图工具 ----------
function makeCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
const texCache={radial:{},labels:{},streak:null};
function radialTexture(hex){
  const key=hex.toString(16);
  if(texCache.radial[key]) return texCache.radial[key];
  const c=makeCanvas(128,128),x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,0,64,64,64);
  const rgb=hexToRgb(hex);
  g.addColorStop(0,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',1)');

function roundRectPath(x,px,py,w,h,r){
  x.beginPath();
  x.moveTo(px+r,py);x.lineTo(px+w-r,py);x.quadraticCurveTo(px+w,py,px+w,py+r);
  x.lineTo(px+w,py+h-r);x.quadraticCurveTo(px+w,py+h,px+w-r,py+h);
  x.lineTo(px+r,py+h);x.quadraticCurveTo(px,py+h,px,py+h-r);
  x.lineTo(px,py+r);x.quadraticCurveTo(px,py,px+r,py);x.closePath();

// ---------- 程序化音效 ----------
const SFX={
  ctx:null,master:null,muted:false,noiseBuf:null,
  init(){
    if(this.ctx)return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      this.ctx=new AC();
      this.master=this.ctx.createGain();
      this.master.gain.value=0.42;
      this.master.connect(this.ctx.destination);
    }catch(e){}
  },
  tone(f,dur,type,vol,slideTo){
    if(!this.ctx||this.muted)return;
    try{
      const t=this.ctx.currentTime;
      const o=this.ctx.createOscillator();
      const g=this.ctx.createGain();
      o.type=type||'sine';
      o.frequency.setValueAtTime(Math.max(20,f),t);
      if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t+dur);
      g.gain.setValueAtTime(vol||0.25,t);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g);g.connect(this.master);
      o.start(t);o.stop(t+dur+0.03);
    }catch(e){}
  },
  noise(dur,vol,freq){
    if(!this.ctx||this.muted)return;
    try{
      if(!this.noiseBuf){
        const len=Math.floor(this.ctx.sampleRate*0.4);
        this.noiseBuf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
        const d=this.noiseBuf.getChannelData(0);
        for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      }
      const t=this.ctx.currentTime;
      const src=this.ctx.createBufferSource();
      src.buffer=this.noiseBuf;
      const f=this.ctx.createBiquadFilter();
      f.type='lowpass';f.frequency.value=freq||1200;
      const g=this.ctx.createGain();
      g.gain.setValueAtTime(vol||0.3,t);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      src.connect(f);f.connect(g);g.connect(this.master);
      src.start(t);src.stop(t+dur+0.03);
    }catch(e){}
  },
  merge(v){
    const p=Math.log2(Math.max(2,v));
    this.tone(150+p*72,0.12,'triangle',0.22,120+p*46);
    this.tone(300+p*110,0.17,'sine',0.13,220+p*70);
  },
  spawn(){this.tone(520,0.09,'sine',0.11,140);},
  hit(){this.noise(0.11,0.22,900);this.tone(170,0.11,'sawtooth',0.09,-70);},
  crit(){this.tone(900,0.16,'square',0.1,240);this.noise(0.17,0.2,2200);},
  kill(){this.noise(0.3,0.32,520);this.tone(110,0.28,'sawtooth',0.18,-55);},
  strike(){this.noise(0.34,0.4,330);this.tone(70,0.4,'sawtooth',0.28,-25);},
  ui(){this.tone(660,0.06,'sine',0.13,90);},
  relic(){[523,659,784].forEach((f,i)=>this.tone(f,0.22,'triangle',0.15,0));},
  over(){[392,311,233,155].forEach(f=>this.tone(f,0.4,'sawtooth',0.13,0));},
  victory(){[523,659,784,1046,1318].forEach(f=>this.tone(f,0.32,'triangle',0.15,0));},
  combo(n){this.tone(430+n*95,0.08,'square',0.07,140);},
  void(){this.tone(300,0.4,'sine',0.2,900);},
  freeze(){this.tone(1200,0.18,'sine',0.14,300);}
};

// ---------- 通用补间 ----------
const tweens=[];
function addTween(dur,ease,onUpdate,onDone){
  const tw={t:0,dur:Math.max(0.001,dur),ease,onUpdate,onDone};
  tweens.push(tw);
  return tw;
}
function updateTweens(dt){
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i];
    tw.t+=dt;
    const k=clamp(tw.t/tw.dur,0,1);
    tw.onUpdate(tw.ease(k),k);
    if(k>=1){
      tweens.splice(i,1);
      if(tw.onDone)tw.onDone();
    }
  }
}

// ---------- 方块体系 ----------
let tileGeo=null;
function getTileGeo(){
  if(tileGeo)return tileGeo;
  const s=TILE*0.88/2,r=0.16;
  const shape=new THREE.Shape();
  shape.moveTo(-s+r,-s);
  shape.lineTo(s-r,-s);
  shape.quadraticCurveTo(s,-s,s,-s+r);
  shape.lineTo(s,s-r);
  shape.quadraticCurveTo(s,s,s-r,s);
  shape.lineTo(-s+r,s);
  shape.quadraticCurveTo(-s,s,-s,s-r);
  shape.lineTo(-s,-s+r);
  shape.quadraticCurveTo(-s,-s,-s+r,-s);
  tileGeo=new THREE.ExtrudeGeometry(shape,{depth:0.16,bevelEnabled:true,bevelThickness:0.05,bevelSize:0.05,bevelSegments:2,steps:1});
  tileGeo.rotateX(-Math.PI/2);
  tileGeo.computeVertexNormals();
  return tileGeo;
}
const tileMats={};
function tileMaterial(style){
  const key=style.c;
  if(!tileMats[key])tileMats[key]=new THREE.MeshStandardMaterial({
    color:style.c,emissive:style.e,emissiveIntensity:0.5,roughness:0.24,metalness:0.42
  });
  return tileMats[key];
}

  const sp=new THREE.Sprite(mat);
  sp.scale.set(0.58,0.58,1);
  sp.position.y=0.3;
  sp.renderOrder=10;
  return sp;
}
function makeGlowSprite(value){
  const st=getStyle(value);
  const mat=new THREE.SpriteMaterial({
    map:radialTexture(st.e),color:st.e,transparent:true,
    opacity:0.36+Math.min(0.5,Math.log2(Math.max(2,value))*0.055),
    blending:THREE.AdditiveBlending,depthWrite:false
  });
  const sp=new THREE.Sprite(mat);
  sp.scale.set(1.35+Math.min(1.2,Math.log2(Math.max(2,value))*0.16),1.35+Math.min(1.2,Math.log2(Math.max(2,value))*0.16),1);
  sp.position.y=0.15;

function createTileMesh(value,gx,gy){
  const st=getStyle(value);

function disposeTileMesh(t){
  if(!t.mesh)return;
  scene.remove(t.mesh.group);
  t.mesh.label.material.dispose();

let grid=[],tiles=[],nextTileId=1;
function emptyGrid(){grid=Array.from({length:SIZE},()=>Array(SIZE).fill(null));}
function makeTileRecord(value,gx,gy){
  const t={id:nextTileId++,value,gx,gy,mesh:null,bob:rand(TAU)};
  grid[gy][gx]=t;
  tiles.push(t);

function materializeTile(t,opts){
  opts=opts||{};
  if(t.mesh)return;
  t.mesh=createTileMesh(t.value,t.gx,t.gy);
  const g=t.mesh.group;
  if(opts.drop){
    g.userData.frozenY=true;
    const fromY=0.24+1.15;
    addTween(0.34,easeOutBounce,k=>{
      g.position.y=lerp(fromY,0.24,k);
      if(k>=1)g.userData.frozenY=false;
    });
    popAnim(g,0.5);
  }else if(opts.pop!==false){
    popAnim(g,0.45);
  }else{
    g.scale.setScalar(1);
  }
}
function popAnim(obj,dur){
  obj.userData.popDur=dur;
  obj.userData.popT=0;
  addTween(dur,easeOutElastic,k=>{
    obj.userData.popT=k;
    obj.scale.setScalar(Math.max(0.001,k));
  });
}
function shrinkTile(t,dur){
  return new Promise(res=>{
    const g=t.mesh.group;
    addTween(dur||0.09,easeInQuad,k=>{
      g.scale.setScalar(Math.max(0.001,1-k));
    },()=>{
      disposeTileMesh(t);
      res();
    });
  });
}
function tweenMove(group,toX,toZ,dur,onDone){
  addTween(dur,easeOutCubic,k=>{
    group.position.x=lerp(group.userData.fx,toX,k);
    group.position.z=lerp(group.userData.fz,toZ,k);
  },onDone);
}
function tweenZ(group,toZ,dur,ease,onDone){
  addTween(dur,ease||easeOutCubic,k=>{
    group.position.z=lerp(group.userData.fz,toZ,k);
  },onDone);
}

    pVel[idx*3]=Math.cos(a)*sp;
    pVel[idx*3+1]=up;
    pVel[idx*3+2]=Math.sin(a)*sp;
    pPos[idx*3]=pos.x;
    pPos[idx*3+1]=pos.y;
    pPos[idx*3+2]=pos.z;
    const w=rand(0.75,1);
    pCol[idx*3]=clamp(rgb[0]/255*w,0,1);
    pCol[idx*3+1]=clamp(rgb[1]/255*w,0,1);
    pCol[idx*3+2]=clamp(rgb[2]/255*w,0,1);
    pLife[idx]=pMax[idx]=rand(0.35,0.8);
    pGrav[idx]=-3.2;
    pSize[idx]=(0.9+Math.random())*(sizeMul||1);
  }
}
function updateParticles(dt){
  if(!pSys)return;
  let any=false;
  for(let i=0;i<P_MAX;i++){
    if(pPos[i*3+1]<-500)continue;
    any=true;
    pLife[i]-=dt;
    if(pLife[i]<=0){
      pPos[i*3+1]=-999;
      continue;
    }
    pVel[i*3+1]+=pGrav[i]*dt;
    const drag=Math.max(0,1-dt*1.5);
    pVel[i*3]*=drag;pVel[i*3+1]*=drag;pVel[i*3+2]*=drag;
    pPos[i*3]+=pVel[i*3]*dt;
    pPos[i*3+1]+=pVel[i*3+1]*dt;
    pPos[i*3+2]+=pVel[i*3+2]*dt;
  }
  pSys.geometry.attributes.position.needsUpdate=true;
  pSys.geometry.attributes.color.needsUpdate=true;
  pSys.material.opacity=0.8+0.15*Math.sin(performance.now()*0.004);
}

function spawnRing(pos,hex,sizeMul){
  const m=rings.find(r=>!r.visible)||rings[0];
  m.visible=true;
  m.position.copy(pos);
  m.material.color.setHex(hex);
  m.userData={t:0,dur:0.5,max:(3.0+Math.log2(Math.max(2,sizeMul||1))*0.5)*1.4,from:0.3};
  m.scale.setScalar(0.3);
  m.material.opacity=0.85;
}
function updateRings(dt){
  for(const m of rings){
    if(!m.visible)continue;
    const u=m.userData;
    u.t+=dt;
    const k=clamp(u.t/u.dur,0,1);
    const s=lerp(u.from,u.max,easeOutCubic(k));
    m.scale.setScalar(s);
    m.material.opacity=0.85*(1-k);
    if(k>=1)m.visible=false;
  }
}

const projs=[];
function initProjectiles(){
  const geo=new THREE.OctahedronGeometry(0.09,0);
  for(let i=0;i<16;i++){
    const g=new THREE.Group();
    const mat=new THREE.MeshBasicMaterial({color:0xffffff});
    const m=new THREE.Mesh(geo,mat);
    const glow=new THREE.Sprite(new THREE.SpriteMaterial({
      map:radialTexture(0xffffff),color:0xffffff,transparent:true,opacity:0.9,
      blending:THREE.AdditiveBlending,depthWrite:false
    }));
    glow.scale.set(0.5,0.5,1);
    const trail=new THREE.Sprite(new THREE.SpriteMaterial({
      map:streakTexture(),color:0xffffff,transparent:true,opacity:0.75,
      blending:THREE.AdditiveBlending,depthWrite:false
    }));
    g.add(m,glow,trail);
    g.visible=false;
    scene.add(g);
    g.userData={mesh:m,glow,trail};
    projs.push(g);
  }
}
function launchProjectile(from,to,dur,onHit){
  return new Promise(res=>{
    const p=projs.find(x=>!x.visible)||projs[0];
    p.visible=true;
    p.position.copy(from);
    const ud=p.userData;
    ud.mesh.material.color.setHex(0xffffff);
    ud.glow.material.color.setHex(0xffffff);
    ud.trail.material.color.setHex(0xffffff);
    ud.from=from.clone();
    ud.to=to.clone();
    const dx=to.x-from.x,dz=to.z-from.z;
    const len=Math.hypot(dx,dz);
    ud.angle=Math.atan2(dz,dx);
    ud.len=len;
    addTween(dur,easeInOutCubic,k=>{
      p.position.set(lerp(from.x,to.x,k),lerp(from.y,to.y,k)+Math.sin(k*Math.PI)*0.25,lerp(from.z,to.z,k));
      ud.trail.position.set(
        lerp(from.x,p.position.x,0.55),
        lerp(from.y,p.position.y,0.55),
        lerp(from.z,p.position.z,0.55)
      );
      ud.trail.material.rotation=ud.angle;
      ud.trail.scale.set(Math.max(0.2,len*1.15*(1-k*0.55)),0.16,1);
    },()=>{
      p.visible=false;
      if(onHit)onHit();
      res();
    });
  });
}

function getEnemyGeo(key){

function makeHpTexture(ratio,w){

function buildEnemyMesh(e){

    const ring=new THREE.Mesh(
      new THREE.TorusGeometry(0.72*e.scale,0.05,8,28),
      new THREE.MeshStandardMaterial({color:0xff3d4d,emissive:0xff3d4d,emissiveIntensity:1.2,roughness:0.3,metalness:0.4})

  g.position.set(e.laneX,y,zFor(e.dist));

}
function entranceAnim(e){
  const g=e.group;
  const baseY=enemyBaseY(e.scale);
  g.userData.frozenY=true;
  g.userData.baseY=baseY;
  addTween(0.5,easeOutBounce,k=>{
    g.position.y=lerp(baseY+1.7,baseY,k);
    if(k>=1)g.userData.frozenY=false;
  });
  addTween(0.42,easeOutElastic,k=>{
    g.scale.setScalar(Math.max(0.001,k));
  });
}
function updateEnemyAnim(dt,t){
  for(const e of enemies){
    if(e.dead||!e.group)continue;
    const g=e.group;
    if(!g.userData.frozenY){
      g.position.y=enemyBaseY(e.scale)+Math.sin(t*3.1+e.bob)*0.07*e.scale;
    }
    g.rotation.y+=e.spin*dt;
    e.flash=Math.max(0,e.flash-dt*5);
    if(e.flash>0.01){
      e.mat.emissive.setHex(0xffffff);
      e.mat.emissiveIntensity=0.5+e.flash*2.2;
    }else if(e.frozen>0){
      e.mat.emissive.setHex(0x66e0ff);
      e.mat.emissiveIntensity=0.7;
    }else{
      e.mat.emissive.setHex(e.baseEmissive);
      e.mat.emissiveIntensity=0.3+Math.sin(t*2+e.bob)*0.12;
    }
    e.aura.material.opacity=0.2+0.12*Math.sin(t*2.8+e.bob);
    if(e.ring)e.ring.rotation.z=t*0.7+e.bob;

  }
}

      const gx=(dir===2||dir===3)?b:a;
      const gy=(dir===0||dir===1)?b:a;
      const t=grid[gy][gx];
      if(t)lane.push({t,gx,gy});
    }
    if(dir===1||dir===3)lane.reverse();
    const out=[];
    for(const item of lane){
      const last=out[out.length-1];
      if(last&&last.t.value===item.t.value&&!last.merged){
        last.merged=true;
        last.b=item.t;
      }else{
        out.push({t:item.t,gx:item.gx,gy:item.gy,merged:false,b:null});
      }
    }
    for(let i=0;i<out.length;i++){
      const o=out[i];
      let toX,toY;
      if(dir===0){toX=a;toY=i;}
      else if(dir===1){toX=a;toY=SIZE-1-i;}
      else if(dir===2){toX=i;toY=a;}
      else{toX=SIZE-1-i;toY=a;}
      if(o.merged){
        merges.push({a:o.t,b:o.b,toX,toY,value:o.t.value*2});
        if(o.t.gx!==toX||o.t.gy!==toY||o.b.gx!==toX||o.b.gy!==toY)moved=true;
      }else{
        records.push({tile:o.t,fromX:o.gx,fromY:o.gy,toX,toY});
        if(o.t.gx!==toX||o.t.gy!==toY)moved=true;
      }
    }
  }
  return {moved,records,merges};
}
function applyPlanGrid(plan){
  for(const rec of plan.records)grid[rec.tile.gy][rec.tile.gx]=null;
  for(const m of plan.merges){
    grid[m.a.gy][m.a.gx]=null;
    grid[m.b.gy][m.b.gx]=null;
  }
  for(const rec of plan.records){
    rec.tile.gx=rec.toX;
    rec.tile.gy=rec.toY;
    grid[rec.toY][rec.toX]=rec.tile;
  }
  for(const m of plan.merges){
    m.mergedTile=makeTileRecord(m.value,m.toX,m.toY);
  }
}
function animatePlan(plan){
  return new Promise(res=>{
    let pending=0;
    const fin=()=>{pending--;if(pending<=0)res();};
    const run=(tile,fromX,fromY,toX,toY)=>{
      if(!tile.mesh){fin();return;}
      const g=tile.mesh.group;
      const dist=Math.abs(toX-fromX)+Math.abs(toY-fromY);
      const dur=(120+dist*32)/1000;
      g.userData.fx=g.position.x;
      g.userData.fz=g.position.z;
      tweenMove(g,cellX(toX),cellZ(toY),dur,fin);
      pending++;
    };
    for(const rec of plan.records)run(rec.tile,rec.fromX,rec.fromY,rec.toX,rec.toY);
    for(const m of plan.merges){
      run(m.a,m.a.gx,m.a.gy,m.toX,m.toY);
      run(m.b,m.b.gx,m.b.gy,m.toX,m.toY);
    }
    if(pending===0)res();
  });
}
function randomEmptyCell(){
  const cells=[];
  for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++)if(!grid[y][x])cells.push({x,y});
  if(!cells.length)return null;
  return pick(cells);
}
function worldOf(tile){
  return new THREE.Vector3(cellX(tile.gx),0.45,cellZ(tile.gy));
}
async function resolveMerge(m){
  const tok=RUN_TOKEN;
  const a=m.a,b=m.b;
  await Promise.all([shrinkTile(a,0.1),shrinkTile(b,0.1)]);
  if(!alive(tok))return null;
  const t=m.mergedTile;
  materializeTile(t,{pop:true});
  const st=getStyle(t.value);
  const pos=worldOf(t);
  spawnBurst(pos,st.e,9+Math.min(16,Math.log2(Math.max(2,t.value))*3),2.6);
  spawnRing(pos,st.e,Math.log2(Math.max(2,t.value)));
  SFX.merge(t.value);
  if(t.value>=128){
    addShake(0.16);
    doHitStop(0.045);
    boardPulse=1;
  }
  S.merges++;
  S.maxTile=Math.max(S.maxTile,t.value);
  S.essenceFloat+=t.value*0.06*S.essenceMult;
  S.essence=Math.floor(S.essenceFloat);
  if(R.quantum>0&&Math.random()<R.quantum){
    t.value*=4;
    updateTileVisual(t);
    showFloatingText(pos,'量子跃迁!','#e2b8ff',1.1);
    SFX.crit();
    S.maxTile=Math.max(S.maxTile,t.value);
  }
  if(R.twin+R.twinBonus>0&&Math.random()<(R.twin+R.twinBonus)){
    const c=randomEmptyCell();
    if(c){
      const tw=makeTileRecord(Math.min(4096,t.value),c.x,c.y);
      materializeTile(tw,{pop:true,drop:true});
      showFloatingText(worldOf(tw),'双生','#bffcff',0.85);
    }
  }
  if(R.regen>0){
    R.regenCount++;
    if(R.regenCount>=3){
      R.regenCount=0;
      healPlayer(R.regen);
    }
  }
  if(R.greed>0){
    while(S.essenceFloat>=40){
      S.essenceFloat-=40;
      S.maxHp++;
      S.hp=Math.min(S.maxHp,S.hp+1);
      showFloatingText(coreWorldPos,'+1 最大生命','#a8ffd0',0.9);
    }
    S.essence=Math.floor(S.essenceFloat);
  }
  R.overloadCount++;
  if(R.frost>0){
    R.frostCount++;
    if(R.frostCount>=5){
      R.frostCount=0;
      const fe=frontEnemy();
      if(fe){
        fe.frozen=2;
        showFloatingText(fe.group.position.clone().add(new THREE.Vector3(0,0.8*fe.scale,0)),'冻结!','#9fe8ff',1);
        spawnBurst(fe.group.position.clone().add(new THREE.Vector3(0,0.3,0)),0x9fe8ff,8,1.6);
        SFX.freeze();
      }
    }
  }
  showFloatingText(pos,'+'+t.value,hexCss(st.e),0.9);
  return t;
}
function updateTileVisual(t){
  const st=getStyle(t.value);
  const mesh=t.mesh;
  mesh.body.material=tileMaterial(st);
  mesh.style=st;
  mesh.label.material.dispose();
  mesh.label.material=new THREE.SpriteMaterial({map:labelTexture(t.value),transparent:true,depthWrite:false});
  mesh.label.scale.set(0.58,0.58,1);
  mesh.glow.material.dispose();
  mesh.glow.material=new THREE.SpriteMaterial({
    map:radialTexture(st.e),color:st.e,transparent:true,
    opacity:0.36+Math.min(0.5,Math.log2(Math.max(2,t.value))*0.055),
    blending:THREE.AdditiveBlending,depthWrite:false
  });
  mesh.glow.scale.set(1.35+Math.min(1.2,Math.log2(Math.max(2,t.value))*0.16),1.35+Math.min(1.2,Math.log2(Math.max(2,t.value))*0.16),1);
}
function spawnRandomTile(){
  const c=randomEmptyCell();
  if(!c)return null;
  const v=Math.random()<0.88?2:4;
  const t=makeTileRecord(v,c.x,c.y);
  materializeTile(t,{pop:true,drop:true});
  SFX.spawn();
  return t;
}
async function doMove(dir){
  if(!S||S.state!=='playing'||S.busy)return;
  const tok=RUN_TOKEN;
  const plan=computeMove(dir);
  if(!plan.moved){
    nudgeBoard(dir);
    return;
  }
  S.busy=true;
  S.turns++;
  if(plan.merges.length>0){
    S.combo=Math.min(12,S.combo+1);
    updateCombo();
    if(S.combo>=2)SFX.combo(S.combo);
    if(S.combo>=3){
      showFloatingText(new THREE.Vector3(0,2.3,0),'COMBO ×'+S.combo,'#ffd23d',1.2);
    }
  }else{
    S.combo=0;
    updateCombo();
  }
  applyPlanGrid(plan);
  await animatePlan(plan);
  if(!alive(tok))return;
  const mergedTiles=[];
  for(const m of plan.merges){
    const mt=await resolveMerge(m);
    if(!alive(tok))return;
    if(mt)mergedTiles.push(mt);
  }
  spawnRandomTile();
  await wait(90);
  if(!alive(tok))return;
  for(const mv of mergedTiles){
    const info=calcDamage(mv);
    await launchAttack(mv,info);
    if(!alive(tok))return;
    if(R.splash>0)await splashAttack(info);
    await wait(55);
    if(!alive(tok))return;
  }
  await wait(70);
  if(!alive(tok))return;
  if(S.state==='playing'&&enemies.length>0)await enemyTurn();
  if(!alive(tok))return;
  if(S.state==='playing')checkNoMoves();
  updateHud();
  S.busy=false;
  if(S.state==='playing'&&S.waveCleared){
    await onWaveCleared();
    if(!alive(tok))return;
  }
}
function nudgeBoard(dir){
  const base=boardGroup.rotation.z;
  const sign=(dir===1)?-1:(dir===0)?1:0;
  const rs=(dir===2)?1:(dir===3)?-1:0;
  const cur={rz:base};
  addTween(0.16,k=>{
    boardGroup.rotation.z=sign*Math.sin(k*Math.PI)*0.018;
    boardGroup.rotation.x=rs*Math.sin(k*Math.PI)*0.018;
  },()=>{boardGroup.rotation.z=0;boardGroup.rotation.x=0;});
  SFX.ui();
}

// ---------- 战斗结算 ----------
function frontEnemy(){
  let best=null;
  for(const e of enemies){
    if(e.dead)continue;
    if(!best||e.dist<best.dist)best=e;
  }
  return best;
}
function calcDamage(mv){
  let d=mv.value*0.9;
  d*=1+Math.min(S.combo,10)*0.08;
  d*=R.dmgMult;
  if(R.family.fury>=2)d*=1.15;
  let crit=false;
  if(R.critChance>0&&Math.random()<R.critChance){
    d*=3;
    crit=true;
  }
  if(R.overload>0&&R.overloadCount>=3){
    R.overloadCount=0;
    d*=2*R.overload;
    showFloatingText(worldOf(mv),'元素过载 ×2','#ff9a3d',1.05);
  }
  if(R.giant>0&&mv.value%8===0){
    d+=mv.value*1.5*R.giant;
    showFloatingText(worldOf(mv),'巨人血脉','#ff7d6b',0.9);
  }
  const final=Math.max(1,Math.round(d));
  S.damageDealt+=final;
  return {dmg:final,crit};
}
function fireProjectile(from,target,onHit){
  const dest=target.group.position.clone();
  dest.y+=0.55*target.scale;
  return launchProjectile(from,dest,0.15,onHit);
}
async function launchAttack(mv,info){
  const tok=RUN_TOKEN;
  const target=frontEnemy();
  if(!target)return;
  const from=worldOf(mv);
  await fireProjectile(from,target,()=>resolveHit(target,info.dmg,info.crit));
  if(!alive(tok))return;
  if(R.blackHole>0&&mv.value>=128){
    const t2=frontEnemy();
    if(t2){
      await fireProjectile(worldOf(mv),t2,()=>resolveHit(t2,Math.round(mv.value*0.5*R.blackHole),false));
      if(!alive(tok))return;
      showFloatingText(t2.group.position.clone().add(new THREE.Vector3(0,0.8*t2.scale,0)),'黑洞','#cbb6ff',1);
    }
  }
  if(R.echo>0&&Math.random()<R.echo){
    const t3=frontEnemy();
    if(t3){
      await fireProjectile(worldOf(mv),t3,()=>resolveHit(t3,Math.round(info.dmg*0.5),false));
      if(!alive(tok))return;
    }
  }
}
async function splashAttack(info){
  const tok=RUN_TOKEN;
  const others=enemies.filter(e=>!e.dead);
  for(const e of others){
    if(e.dead)continue;
    const dmg=Math.max(1,Math.round(info.dmg*0.08));
    dealDamage(e,dmg,false);
    spawnBurst(e.group.position.clone().add(new THREE.Vector3(0,0.3,0)),0xffd23d,3,1.4);
    await wait(30);
    if(!alive(tok))return;
  }
}
function resolveHit(enemy,amount,crit){
  let dmg=amount;
  let victim=enemy;
  while(victim&&!victim.dead&&dmg>0){
    const r=dealDamage(victim,dmg,crit);
    if(r.dead&&r.leftover>0&&R.chainEff>0){
      dmg=Math.round(r.leftover*R.chainEff);
      const from=victim.group?victim.group.position.clone():null;
      victim=frontEnemy();
      if(victim&&from){
        const next=victim;
        fireProjectile(from,next,()=>resolveHit(next,dmg,false));
        break;
      }
    }else break;
  }
}
function dealDamage(enemy,amount,crit){
  if(enemy.dead)return {dead:true,leftover:0};
  const raw=Math.max(1,amount);
  const dealt=Math.max(1,raw-enemy.armor);
  enemy.hp-=dealt;
  enemy.flash=1;
  SFX.hit();
  if(crit)SFX.crit();
  showFloatingText(enemy.group.position.clone().add(new THREE.Vector3(0,0.9*enemy.scale,0)),'-'+dealt,crit?'#ffd23d':'#ffffff',crit?1.15:0.82);
  spawnBurst(enemy.group.position.clone().add(new THREE.Vector3(0,0.3,0)),ENEMY_TYPES[enemy.type].color,4,1.6);
  updateHpBar(enemy);
  if(enemy.hp<=0){
    const leftover=Math.max(0,raw-enemy.armor-enemy.maxHp);
    killEnemy(enemy);
    return {dead:true,leftover};
  }
  return {dead:false,leftover:0};
}
function killEnemy(e){
  if(e.dead)return;
  e.dead=true;
  const i=enemies.indexOf(e);
  if(i>=0)enemies.splice(i,1);
  S.kills++;
  if(R.siphon>0)healPlayer(e.atk*R.siphon);
  if(e.type==='splitter'&&S.floor>=3)spawnSplitMinis(e);
  deathFx(e);
  SFX.kill();
  if(e.type==='boss'||e.type==='boss2'){
    addShake(0.5);
    doHitStop(0.12);
  }else{
    addShake(0.18);
  }
  if(enemies.length===0)S.waveCleared=true;
}
function deathFx(e){
  const pos=e.group.position.clone().add(new THREE.Vector3(0,0.2,0));
  spawnBurst(pos,ENEMY_TYPES[e.type].color,26,3.4,1.3);
  spawnRing(pos,ENEMY_TYPES[e.type].color,3);
  const g=e.group;
  addTween(0.18,easeInQuad,k=>{
    g.scale.setScalar(Math.max(0.001,(1-k)*0.001));
    g.position.y-=0.6*k;
  },()=>{
    scene.remove(g);
    e.mat.dispose();
    e.hpTex&&e.hpTex.dispose();
    e.hpSpr.material.dispose();
    e.aura.material.dispose();
  });
}
function spawnSplitMinis(e){
  for(const side of [-1,1]){
    const mini=spawnEnemy('wisp',S.floor,{mini:true,dist:e.dist,name:'孢体幼崽'});
    mini.group.position.x=e.group.position.x+side*0.75;
    mini.group.position.z=e.group.position.z+0.15;
  }
}

// ---------- 敌人回合 ----------
function getInterval(e){
  return Math.max(1,e.speed+R.timeSlow);
}
async function enemyTurn(){
  const tok=RUN_TOKEN;
  const acting=[];
  for(const e of enemies){
    if(e.dead)continue;
    if(e.frozen>0){
      e.frozen--;
      spawnBurst(e.group.position.clone().add(new THREE.Vector3(0,0.3,0)),0x9fe8ff,5,1.2);
      SFX.freeze();
      continue;
    }
    e.turnsLeft--;
    if(e.turnsLeft<=0){
      e.turnsLeft=getInterval(e);
      acting.push(e);
    }
  }
  for(const e of acting){
    if(!alive(tok))return;
    if(e.dead)continue;
    await advanceEnemy(e);
    await wait(75);
    if(!alive(tok))return;
    if(S.state!=='playing')return;
  }
}
async function advanceEnemy(e){
  const tok=RUN_TOKEN;
  if(e.dead)return;
  if(e.dist<=0){
    await enemyStrike(e);
    return;
  }
  e.dist--;
  const g=e.group;
  g.userData.fz=g.position.z;
  await new Promise(res=>{
    tweenZ(g,zFor(e.dist),0.22,easeOutCubic,res);
  });
  if(!alive(tok))return;
  if(e.dist===0&&!e.dead)await enemyStrike(e);
}
async function enemyStrike(e){
  if(e.dead)return;
  const pos=e.group.position.clone();
  if(R.voidWalker&&!R.voidUsed){
    R.voidUsed=true;
    showFloatingText(pos.clone().add(new THREE.Vector3(0,0.8*e.scale,0)),'虚空放逐','#9fd8ff',1.1);
    spawnRing(pos,0x8fb4ff,2.5);
    SFX.void();
    killEnemy(e);
    return;
  }
  let dmg=e.atk;
  const absorbed=Math.min(S.shield,dmg);
  S.shield-=absorbed;
  dmg-=absorbed;
  dmg=Math.max(0,dmg-R.armor-(R.family.aegis>=2?1:0));
  const finalDmg=dmg>0?Math.max(1,dmg):0;
  S.hp-=finalDmg;
  redFlash();
  addShake(0.45);
  doHitStop(0.06);
  SFX.strike();
  coreFlash=1;
  const from=pos.clone().add(new THREE.Vector3(0,0.4,0));
  fireProjectile(from,{group:coreGroup,scale:1},()=>{});
  spawnRing(coreWorldPos,0xff3d5e,2.6);
  if(finalDmg>0)showFloatingText(coreWorldPos.clone().add(new THREE.Vector3(0,0.7,0)),'-'+finalDmg,'#ff5a6e',1.15);
  else showFloatingText(coreWorldPos.clone().add(new THREE.Vector3(0,0.7,0)),'格挡','#8fe6ff',0.9);
  if(absorbed>0){
    showFloatingText(coreWorldPos.clone().add(new THREE.Vector3(0,1.5,0)),'护盾 -'+absorbed,'#8fe6ff',0.9);
  }
  if(R.thorns>0)dealDamage(e,2*R.thorns,false);
  updateHud();
  if(S.hp<=0){
    S.hp=0;
    updateHud();
    gameOver();
    return;
  }
  if(e.dead&&enemies.length===0)S.waveCleared=true;
}
// ---------- 层数与波浪 ----------
const FLOOR_NAMES=['迷雾长廊','回声墓穴','星尘裂隙','深红祭坛','深渊守卫','噬星荒原','无光之城','熵变深渊','黑曜王座','深渊核心'];
function buildWave(floor){
  if(floor===5)return ['wisp','wisp','boss'];
  if(floor===10)return ['splitter','raptor','wisp','boss2'];
  const pool=['wisp'];
  if(floor>=2)pool.push('raptor');
  if(floor>=3)pool.push('sentinel');
  if(floor>=4)pool.push('splitter');
  const count=Math.min(3+Math.ceil(floor*0.8),7);
  const wave=[];
  for(let i=0;i<count;i++)wave.push(pick(pool));
  return wave;
}
async function spawnWave(floor){
  const tok=RUN_TOKEN;
  const wave=buildWave(floor);
  const ents=[];
  for(let i=0;i<wave.length;i++){
    const e=spawnEnemy(wave[i],floor,{elite:(floor>=6&&floor%3===0&&i===0)});
    ents.push(e);
    await wait(175);
    if(!alive(tok))return;
  }
  ents.sort((a,b)=>b.dist-a.dist);
  for(let i=0;i<ents.length;i++){
    ents[i].laneX=(i-(ents.length-1)/2)*1.28;
    ents[i].group.position.x=ents[i].laneX;
  }
}
function showFloorIntro(floor){

async function startFloor(){

  if(R.shieldField>0)S.shield+=2*R.shieldField;

  await wait(850);
  if(!alive(tok))return;
  await spawnWave(S.floor);

  if(!alive(tok))return;

  updateHud();
}
async function onWaveCleared(){
  const tok=RUN_TOKEN;
  S.waveCleared=false;
  await wait(550);
  if(!alive(tok))return;
  const cleared=S.floor;
  S.floor++;

function checkNoMoves(){
  for(let y=0;y<SIZE;y++){
    for(let x=0;x<SIZE;x++){
      if(!grid[y][x])return;
      if(x+1<SIZE&&grid[y][x+1]&&grid[y][x+1].value===grid[y][x].value)return;
      if(y+1<SIZE&&grid[y+1][x]&&grid[y+1][x].value===grid[y][x].value)return;
    }
  }
  gameOver();
}

// ---------- 遗物抉择与结算 ----------
function pickRelic(){
  let pool=RELICS.filter(r=>!S.owned.includes(r.id));
  if(pool.length<2)pool=RELICS.slice();
  const w=pool.map(r=>r.rarity===1?5:r.rarity===2?2.8:1.2);
  const total=w.reduce((a,b)=>a+b,0);
  let roll=Math.random()*total;
  for(let i=0;i<pool.length;i++){
    roll-=w[i];
    if(roll<=0)return pool[i];
  }
  return pool[pool.length-1];
}
function showRewards(pendingVictory){
  S.state='reward';
  S.pendingVictory=!!pendingVictory;
  S.victoryShown=S.pendingVictory;
  const cards=[
    {id:'heal',icon:'💠',family:'',rarity:0,name:'圣所疗愈',desc:'回复 4 点生命'}
  ];
  const r1=pickRelic();
  let r2=pickRelic();
  if(r2.id===r1.id){
    const alt=RELICS.filter(r=>r.id!==r1.id&&!S.owned.includes(r.id));
    r2=alt.length?pick(alt):r1;
  }
  cards.push(r1,r2);
  const box=document.getElementById('rewardCards');
  box.innerHTML=cards.map((c,i)=>{
    const rar=c.rarity?'r'+c.rarity:'r0';
    return '<div class="rcard '+rar+'" data-id="'+c.id+'" style="animation-delay:'+(i*0.08)+'s">'+
      '<span class="ricon">'+c.icon+'</span>'+
      '<div class="rfam">'+(c.family?FAMILY_LABEL[c.family]:'治愈')+'</div>'+
      '<div class="rname">'+c.name+'</div>'+
      '<div class="rdesc">'+c.desc+'</div>'+
      '<div class="rrar">'+(c.rarity===3?'★ 传说':c.rarity===2?'★ 稀有':c.rarity===1?'◆ 普通':'')+'</div>'+
      '</div>';
  }).join('');
  document.getElementById('rewardScreen').classList.add('show');
  box.querySelectorAll('.rcard').forEach(el=>{
    el.addEventListener('click',()=>applyChoice(el.dataset.id));
  });
}
function applyChoice(id){
  document.getElementById('rewardScreen').classList.remove('show');
  if(id==='heal'){
    healPlayer(4);
    toast('💠 圣所疗愈：回复 4 点生命');
  }else{
    applyRelic(id);
  }
  if(S.pendingVictory)showVictory();
  else startFloor();
}
function applyRelic(id){
  const r=RELICS_BY_ID[id];
  if(!r)return;
  S.owned.push(id);
  R.family[r.family]++;
  r.apply(R);
  refreshPassives();
  updateRelicHud();
  toast(r.icon+' 获得遗物：'+r.name);
  SFX.relic();
}
function refreshPassives(){
  if(!S)return;
  S.essenceMult=1+(R.family.trick>=2?0.25:0)+0.5*R.greed;
  R.twinBonus=R.family.trick>=2?0.1:0;
}
function showVictory(){
  fillStats(document.getElementById('winStats'));
  document.getElementById('victoryScreen').classList.add('show');
  SFX.victory();
  whiteFlash();
}
function gameOver(){
  if(S.state==='over')return;
  S.state='over';
  S.busy=false;
  fillStats(document.getElementById('endStats'));
  document.getElementById('endScreen').classList.add('show');
  SFX.over();
  redFlash();
}
function fillStats(el){
  el.innerHTML=[
    ['到达层数',S.victoryShown?Math.max(1,S.floor-1):S.floor],['击败魔物',S.kills],['总合并',S.merges],
    ['最大方块',S.maxTile],['造成伤害',S.damageDealt],['遗物数量',S.owned.length]
  ].map(s=>'<div class="stat"><b>'+s[1]+'</b><i>'+s[0]+'</i></div>').join('');
}
function healPlayer(n,silent){
  if(!S)return;
  const before=S.hp;
  S.hp=Math.min(S.maxHp,S.hp+n);
  if(S.hp>before&&!silent){
    showFloatingText(coreWorldPos.clone().add(new THREE.Vector3(0,1.1,0)),'+'+(S.hp-before),'#8fffc8',0.9);
  }
  updateHud();
}
function hideOverlays(){
  document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('show'));
}
function clearEntities(){
  for(const t of tiles)disposeTileMesh(t);
  tiles=[];
  emptyGrid();
  for(const e of enemies){
    if(e.group){
      scene.remove(e.group);
      if(e.mat)e.mat.dispose();
      if(e.hpTex)e.hpTex.dispose();
      if(e.hpSpr)e.hpSpr.material.dispose();
      if(e.aura)e.aura.material.dispose();
    }
  }
  enemies=[];
  tweens.length=0;
  for(const m of rings)m.visible=false;
  for(const sp of texts)sp.visible=false;
  for(const p of projs)p.visible=false;
  if(pPos)for(let i=0;i<P_MAX;i++)pPos[i*3+1]=-999;
  shakeTrauma=0;hitStop=0;timeScale=1;coreFlash=0;boardPulse=0;
}
function restartRun(){
  RUN_TOKEN={};
  hideOverlays();
  clearEntities();
  R=resetRelics();
  S=newRunState();
  refreshPassives();
  const c1=randomEmptyCell();
  const t1=makeTileRecord(Math.random()<0.9?2:4,c1.x,c1.y);
  materializeTile(t1,{pop:false});
  const c2=randomEmptyCell();
  if(c2){
    const t2=makeTileRecord(Math.random()<0.9?2:4,c2.x,c2.y);
    materializeTile(t2,{pop:false});
  }
  updateHud();
  updateRelicHud();
  updateCombo();
  S.state='playing';
  startFloor();
}

// ---------- HUD ----------
function updateHud(){
  if(!S)return;
  const pct=clamp(S.hp/S.maxHp,0,1);
  const fill=document.getElementById('hpFill');
  fill.style.width=(pct*100)+'%';
  fill.style.background='linear-gradient(90deg,hsl('+(pct*125)+',78%,52%),hsl('+(pct*125+22)+',88%,64%))';
  document.getElementById('hpText').textContent=S.hp+'/'+S.maxHp;
  const pips=document.getElementById('shieldPips');
  pips.innerHTML='';
  for(let i=0;i<Math.min(S.shield,10);i++){
    const p=document.createElement('i');
    p.className='pip';
    pips.appendChild(p);
  }
  document.getElementById('essenceVal').textContent=S.essence;
  document.getElementById('floorTag').textContent='第 '+S.floor+' 层 · '+FLOOR_NAMES[Math.min(S.floor-1,FLOOR_NAMES.length-1)];
}
function updateCombo(){
  const row=document.getElementById('comboRow');
  if(S.combo>=2){
    row.classList.add('on');
    document.getElementById('comboFill').style.width=Math.min(100,S.combo/12*100)+'%';
    document.getElementById('comboText').textContent='×'+S.combo;
  }else{
    row.classList.remove('on');
  }
}
function updateRelicHud(){
  if(!S)return;
  const counts={};
  for(const id of S.owned)counts[id]=(counts[id]||0)+1;
  const box=document.getElementById('relicChips');
  box.innerHTML=Object.keys(counts).map(id=>{
    const r=RELICS_BY_ID[id];
    if(!r)return '';
    return '<div class="chip" title="'+r.name+'：'+r.desc+'">'+r.icon+(counts[id]>1?'<b>'+counts[id]+'</b>':'')+'</div>';
  }).join('');
  const syn=document.getElementById('synergyRow');
  const badges=[];
  if(R.family.fury>=2)badges.push('⚔ 怒火共鸣 · 伤害+15%');
  if(R.family.aegis>=2)badges.push('🛡 壁垒共鸣 · 护甲+1');
  if(R.family.trick>=2)badges.push('🎭 诡术共鸣 · 双生+10% / 星髓+25%');
  syn.innerHTML=badges.map(b=>'<span class="synergy">'+b+'</span>').join('');
}
function toast(msg){
  const box=document.getElementById('toasts');
  const el=document.createElement('div');
  el.className='toast';
  el.textContent=msg;
  box.appendChild(el);
  setTimeout(()=>{
    el.style.transition='opacity .4s,transform .4s';
    el.style.opacity='0';
    el.style.transform='translateX(-18px)';
    setTimeout(()=>el.remove(),420);
  },2400);
  while(box.children.length>5)box.firstChild.remove();
}

// ---------- 输入 ----------
function bindInput(){
  const keyMap={arrowup:0,w:0,arrowdown:1,s:1,arrowleft:2,a:2,arrowright:3,d:3};
  window.addEventListener('keydown',e=>{
    if(e.repeat)return;
    const k=e.key.toLowerCase();
    if(keyMap[k]!==undefined){
      e.preventDefault();
      doMove(keyMap[k]);
    }
  });
  let sx=0,sy=0;
  stageEl.addEventListener('pointerdown',e=>{
    sx=e.clientX;sy=e.clientY;
  });
  stageEl.addEventListener('pointerup',e=>{
    if(!S||S.state!=='playing')return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.hypot(dx,dy)<24)return;
    if(Math.abs(dx)>Math.abs(dy))doMove(dx>0?3:2);
    else doMove(dy>0?1:0);
  });
  document.querySelectorAll('.dbtn').forEach(b=>{
    b.addEventListener('pointerdown',e=>{
      e.preventDefault();
      doMove(+b.dataset.dir);
    });
  });
  document.getElementById('startBtn').addEventListener('click',()=>{
    SFX.init();
    SFX.ui();
    document.getElementById('startScreen').classList.remove('show');
    restartRun();
  });
  document.getElementById('restartBtn').addEventListener('click',()=>{
    SFX.init();
    SFX.ui();
    restartRun();
  });
  document.getElementById('continueBtn').addEventListener('click',()=>{
    SFX.ui();
    S.victoryShown=true;
    document.getElementById('victoryScreen').classList.remove('show');
    startFloor();
  });
  document.getElementById('ibtnSound').addEventListener('click',e=>{
    SFX.init();
    SFX.muted=!SFX.muted;
    e.currentTarget.textContent=SFX.muted?'🔇':'🔊';
  });
  document.getElementById('ibtnRestart').addEventListener('click',()=>{
    SFX.init();
    SFX.ui();
    restartRun();
  });
  window.addEventListener('contextmenu',e=>e.preventDefault());
}

// ---------- 主循环 ----------
let lastT=performance.now();
function updateBoardAnim(t){
  const glow=boardGroup.userData.glow;
  boardPulse=Math.max(0,boardPulse-0.045);
  glow.material.opacity=0.28+boardPulse*0.55+Math.sin(t*1.3)*0.04;
  for(const ch of boardGroup.children){
    if(ch.userData.phase!==undefined){
      ch.position.y=0.34+Math.sin(t*1.8+ch.userData.phase)*0.05;
      ch.rotation.y=t*0.8;
    }
  }
}
function updateCore(t,rdt){
  coreOct.rotation.y=t*0.7;
  coreOct.rotation.z=Math.sin(t*0.5)*0.15;
  coreRing.rotation.z=t*0.5;
  coreRing.rotation.x=Math.PI/2+Math.sin(t*0.6)*0.08;
  coreFlash=Math.max(0,coreFlash-rdt*2.2);
  if(coreFlash>0.01){
    coreOct.material.emissive.setHex(0xff4d5e);
    coreOct.material.emissiveIntensity=1.1+coreFlash*2.6;
  }else{
    coreOct.material.emissive.setHex(0x25c7ff);
    coreOct.material.emissiveIntensity=1.1+Math.sin(t*1.4)*0.18;
  }
  coreGroup.userData.aura.material.opacity=0.36+0.1*Math.sin(t*1.9);
}
function updateCamera(t){
  const orbit=Math.sin(t*0.045)*0.55;
  const s=shakeTrauma*shakeTrauma;
  const sx=(Math.sin(t*53.7)*0.5+Math.sin(t*29.3)*0.5)*0.42*s;
  const sy=(Math.cos(t*47.3)*0.5+Math.sin(t*37.7)*0.5)*0.32*s;
  camera.position.set(orbit+sx,6.4+sy,8.2+Math.cos(t*0.037)*0.35+Math.sin(t*0.05)*0.2);
  camera.lookAt(0.35+Math.sin(t*0.03)*0.15,0.35,0);
  shakeTrauma=Math.max(0,shakeTrauma-0.9/60);
}
function frame(){
  requestAnimationFrame(frame);
  const now=performance.now();
  const rdt=Math.min(0.05,(now-lastT)/1000);
  lastT=now;
  if(hitStop>0){
    hitStop-=rdt;
    timeScale=0.12;
  }else{
    timeScale=Math.min(1,timeScale+rdt*3);
  }
  const dt=rdt*timeScale;
  const t=now/1000;
  updateTweens(dt);
  for(const tile of tiles){
    if(!tile.mesh)continue;
    const g=tile.mesh.group;
    if(!g.userData.frozenY)g.position.y=0.24+Math.sin(t*2.4+tile.bob)*0.035;
  }
  updateParticles(dt);
  updateRings(dt);
  updateTexts(dt);
  updateEnemyAnim(dt,t);
  updateBoardAnim(t);
  updateCore(t,rdt);
  updateCamera(t);
  renderer.render(scene,camera);
}

// ---------- 启动 ----------
function startGame(){
  if(window.__STARTED__)return;
  window.__STARTED__=true;
  initRenderer();
  initParticles();
  initRings();
  initTexts();
  initProjectiles();
  bindInput();
  requestAnimationFrame(frame);
  toast('圣所已苏醒，点击「进入深渊」开始');
}
window.__START__=startGame;
</script>
