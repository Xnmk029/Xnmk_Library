<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VOID MERGE - 虚空融合</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  overflow: hidden;
  background: #050510;
  font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
  color: #e0e0e0;
  user-select: none;
  -webkit-user-select: none;
}
#game-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

/* UI Overlay */
#ui-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 10; pointer-events: none;
}
#ui-overlay > * { pointer-events: auto; }

/* Top Bar */
#top-bar {
  position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 24px;
  background: rgba(10,10,30,0.85); border: 1px solid rgba(0,255,255,0.2);
  border-radius: 12px; padding: 10px 28px;
  backdrop-filter: blur(8px);
}
#top-bar .stat { text-align: center; }
#top-bar .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: #6af; }
#top-bar .stat-value { font-size: 22px; font-weight: 700; color: #fff; text-shadow: 0 0 10px rgba(100,170,255,0.5); }

/* HP Bars */
.hp-container {
  position: absolute; top: 80px; width: 220px;
  background: rgba(10,10,30,0.85); border-radius: 10px; padding: 12px 16px;
  border: 1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(8px);
}
#player-hp-container { left: 16px; }
#enemy-hp-container { right: 16px; }
.hp-label { font-size: 11px; letter-spacing: 1px; margin-bottom: 6px; display: flex; justify-content: space-between; }
.hp-bar-bg {
  width: 100%; height: 14px; background: rgba(255,255,255,0.08);
  border-radius: 7px; overflow: hidden; position: relative;
}
.hp-bar-fill {
  height: 100%; border-radius: 7px; transition: width 0.4s cubic-bezier(0.25,0.8,0.25,1);
  position: relative;
}
#player-hp-fill { background: linear-gradient(90deg, #0f8, #0cf); box-shadow: 0 0 12px rgba(0,255,150,0.4); }
#enemy-hp-fill { background: linear-gradient(90deg, #f44, #f80); box-shadow: 0 0 12px rgba(255,80,0,0.4); }
.hp-text { font-size: 12px; margin-top: 4px; text-align: right; color: #aaa; }

/* Enemy Info */
#enemy-info {
  position: absolute; top: 140px; right: 16px; width: 220px;
  background: rgba(10,10,30,0.85); border-radius: 10px; padding: 12px 16px;
  border: 1px solid rgba(255,100,50,0.2);
  backdrop-filter: blur(8px); font-size: 12px;
}
#enemy-info .enemy-name { font-size: 14px; font-weight: 700; color: #f84; margin-bottom: 4px; }
#enemy-info .enemy-desc { color: #999; line-height: 1.4; }
#enemy-info .enemy-atk { color: #f66; margin-top: 6px; font-weight: 600; }

/* Relics Display */
#relics-bar {
  position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 500px;
}
.relic-icon {
  width: 40px; height: 40px; border-radius: 8px;
  background: rgba(20,20,50,0.9); border: 1px solid rgba(180,120,255,0.4);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; cursor: default; position: relative;
  transition: transform 0.2s, box-shadow 0.2s;
}
.relic-icon:hover { transform: scale(1.2); box-shadow: 0 0 15px rgba(180,120,255,0.5); }
.relic-tooltip {
  position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
  background: rgba(10,10,30,0.95); border: 1px solid rgba(180,120,255,0.4);
  border-radius: 8px; padding: 8px 12px; width: 180px; font-size: 11px;
  display: none; z-index: 100; color: #ccc; line-height: 1.4;
}
.relic-icon:hover .relic-tooltip { display: block; }

/* Damage Numbers */
.damage-number {
  position: fixed; z-index: 50; font-weight: 900; pointer-events: none;
  text-shadow: 0 0 10px currentColor; animation: floatUp 1s ease-out forwards;
}
@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-60px) scale(0.6); }
}

/* Modals */
.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(5,5,16,0.9); z-index: 100;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
}
.modal-overlay.hidden { display: none; }
.modal-box {
  background: rgba(15,15,40,0.98); border: 1px solid rgba(100,170,255,0.3);
  border-radius: 20px; padding: 40px; max-width: 600px; width: 90%;
  text-align: center; box-shadow: 0 0 60px rgba(50,100,255,0.15);
}
.modal-title {
  font-size: 32px; font-weight: 900; margin-bottom: 12px;
  background: linear-gradient(135deg, #0cf, #a6f);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.modal-subtitle { font-size: 14px; color: #888; margin-bottom: 30px; line-height: 1.6; }

/* Relic Selection */
#relic-choices { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
.relic-card {
  width: 160px; padding: 20px 14px; border-radius: 14px;
  background: rgba(30,20,60,0.9); border: 2px solid rgba(180,120,255,0.3);
  cursor: pointer; transition: all 0.25s cubic-bezier(0.25,0.8,0.25,1);
}
.relic-card:hover {
  transform: translateY(-8px) scale(1.05);
  border-color: rgba(180,120,255,0.8);
  box-shadow: 0 12px 40px rgba(150,80,255,0.3);
}
.relic-card .rc-icon { font-size: 36px; margin-bottom: 10px; }
.relic-card .rc-name { font-size: 14px; font-weight: 700; color: #d8b4fe; margin-bottom: 8px; }
.relic-card .rc-desc { font-size: 11px; color: #999; line-height: 1.5; }

/* Buttons */
.btn-primary {
  padding: 14px 40px; border: none; border-radius: 10px;
  background: linear-gradient(135deg, #0af, #60f);
  color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
  transition: all 0.2s; letter-spacing: 1px;
}
.btn-primary:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(50,150,255,0.4); }

/* Game Over Stats */
.go-stats { display: flex; gap: 20px; justify-content: center; margin: 20px 0; flex-wrap: wrap; }
.go-stat { text-align: center; }
.go-stat-val { font-size: 28px; font-weight: 900; color: #0cf; }
.go-stat-label { font-size: 11px; color: #777; margin-top: 4px; }

/* Floor Transition */
#floor-banner {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  z-index: 80; font-size: 48px; font-weight: 900; color: #fff;
  text-shadow: 0 0 30px rgba(100,200,255,0.8); pointer-events: none;
  opacity: 0;
}

/* Combo indicator */
#combo-display {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-size: 24px; font-weight: 900; color: #ff0; pointer-events: none;
  text-shadow: 0 0 20px rgba(255,255,0,0.6); opacity: 0; z-index: 60;
}

/* Turn indicator */
#turn-hint {
  position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
  font-size: 12px; color: #556; letter-spacing: 1px;
}

/* Shield indicator */
#shield-display {
  position: absolute; top: 118px; left: 16px; width: 220px;
  font-size: 11px; color: #4cf; padding: 0 16px;
}

/* Mobile controls hint */
#mobile-hint {
  position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
  font-size: 11px; color: #445;
}
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>

<div id="ui-overlay">
  <div id="top-bar">
    <div class="stat"><div class="stat-label">Floor</div><div class="stat-value" id="floor-num">1</div></div>
    <div class="stat"><div class="stat-label">Score</div><div class="stat-value" id="score-num">0</div></div>
    <div class="stat"><div class="stat-label">Merges</div><div class="stat-value" id="merge-num">0</div></div>
  </div>

  <div class="hp-container" id="player-hp-container">
    <div class="hp-label"><span style="color:#0f8">◆ 生命值</span><span id="player-hp-text">100/100</span></div>
    <div class="hp-bar-bg"><div class="hp-bar-fill" id="player-hp-fill" style="width:100%"></div></div>
  </div>
  <div id="shield-display"></div>

  <div class="hp-container" id="enemy-hp-container">
    <div class="hp-label"><span style="color:#f84">◆ 敌人</span><span id="enemy-hp-text">50/50</span></div>
    <div class="hp-bar-bg"><div class="hp-bar-fill" id="enemy-hp-fill" style="width:100%"></div></div>
  </div>
  <div id="enemy-info">
    <div class="enemy-name" id="enemy-name">数据碎片</div>
    <div class="enemy-desc" id="enemy-desc">最基础的损坏数据体</div>
    <div class="enemy-atk" id="enemy-atk">攻击力: 5</div>
  </div>

  <div id="relics-bar"></div>
  <div id="combo-display"></div>
  <div id="floor-banner"></div>
  <div id="turn-hint">方向键 / WASD / 滑动 操作</div>
</div>

<!-- Start Modal -->
<div class="modal-overlay" id="start-modal">
  <div class="modal-box">
    <div class="modal-title">VOID MERGE</div>
    <div class="modal-subtitle">
      虚空融合 — 在数字深渊中融合数据核心<br>
      击败层层敌人，收集遗物，构建你的 Build<br><br>
      <span style="color:#6af">合并方块 = 对敌人造成伤害</span><br>
      <span style="color:#f66">每次操作后敌人会反击</span><br>
      <span style="color:#a6f">击杀敌人后选择遗物强化</span>
    </div>
    <button class="btn-primary" id="btn-start">进入虚空</button>
  </div>
</div>

<!-- Relic Selection Modal -->
<div class="modal-overlay hidden" id="relic-modal">
  <div class="modal-box">
    <div class="modal-title" style="font-size:24px">选择遗物</div>
    <div class="modal-subtitle">敌人已被消灭，选择一个强化继续深入</div>
    <div id="relic-choices"></div>
  </div>
</div>

<!-- Game Over Modal -->
<div class="modal-overlay hidden" id="gameover-modal">
  <div class="modal-box">
    <div class="modal-title" style="background:linear-gradient(135deg,#f44,#f80);-webkit-background-clip:text;background-clip:text;">系统崩溃</div>
    <div class="modal-subtitle">你的数据体已被虚空吞噬...</div>
    <div class="go-stats">
      <div class="go-stat"><div class="go-stat-val" id="go-floor">1</div><div class="go-stat-label">到达层数</div></div>
      <div class="go-stat"><div class="go-stat-val" id="go-score">0</div><div class="go-stat-label">总分</div></div>
      <div class="go-stat"><div class="go-stat-val" id="go-merges">0</div><div class="go-stat-label">合并次数</div></div>
      <div class="go-stat"><div class="go-stat-val" id="go-kills">0</div><div class="go-stat-label">击杀数</div></div>
    </div>
    <button class="btn-primary" id="btn-restart">重新连接</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function() {
'use strict';

// ==================== GAME CONFIG ====================
const GRID_SIZE = 4;
const CELL_SIZE = 1.2;
const CELL_GAP = 0.15;
const CUBE_HEIGHT = 0.5;
const TILE_COLORS = {
  2:    { base: 0x1a4a5a, emissive: 0x0a2a3a, glow: '#1a6a8a' },
  4:    { base: 0x1a5a6a, emissive: 0x0a3a4a, glow: '#2a8aaa' },
  8:    { base: 0x2a7a8a, emissive: 0x1a5a6a, glow: '#3aaaca' },
  16:   { base: 0x3a9aaa, emissive: 0x2a7a8a, glow: '#4acaea' },
  32:   { base: 0x4abaca, emissive: 0x3a9aaa, glow: '#6aeafa' },
  64:   { base: 0x6acaea, emissive: 0x4abaca, glow: '#8afaff' },
  128:  { base: 0x7a6afa, emissive: 0x5a4ada, glow: '#9a8aff' },
  256:  { base: 0x9a4afa, emissive: 0x7a2ada, glow: '#ba6aff' },
  512:  { base: 0xba3afa, emissive: 0x9a1ada, glow: '#da5aff' },
  1024: { base: 0xea2afa, emissive: 0xca0ada, glow: '#fa4aff' },
  2048: { base: 0xffaa00, emissive: 0xdd8800, glow: '#ffcc44' },
  4096: { base: 0xff6600, emissive: 0xdd4400, glow: '#ff8844' },
};

// ==================== RELIC DEFINITIONS ====================
const ALL_RELICS = [
  { id:'overclock', icon:'⚡', name:'超频核心', desc:'合并伤害 +50%', effect:{ dmgMult: 0.5 } },
  { id:'nanoshield', icon:'🛡️', name:'纳米护盾', desc:'每回合获得 8 点护盾', effect:{ shieldPerTurn: 8 } },
  { id:'vampire', icon:'🩸', name:'吸血协议', desc:'造成伤害的 20% 转化为生命', effect:{ lifesteal: 0.2 } },
  { id:'critcore', icon:'💥', name:'暴击核心', desc:'20% 概率造成 3 倍伤害', effect:{ critChance: 0.2, critMult: 3 } },
  { id:'regen', icon:'💚', name:'再生模块', desc:'每次合并恢复 4 点生命', effect:{ healPerMerge: 4 } },
  { id:'fortify', icon:'🏰', name:'结构强化', desc:'最大生命值 +30', effect:{ maxHpBonus: 30 } },
  { id:'momentum', icon:'🌀', name:'动量积蓄', desc:'连续合并同方向伤害递增 15%', effect:{ momentumBonus: 0.15 } },
  { id:'thorns', icon:'🌹', name:'荆棘反馈', desc:'受到攻击时反弹 30% 伤害', effect:{ thorns: 0.3 } },
  { id:'efficiency', icon:'🔋', name:'高效融合', desc:'合并 4+ 的方块额外造成 50% 伤害', effect:{ highMergeBonus: 0.5 } },
  { id:'dodge', icon:'💨', name:'相位闪避', desc:'25% 概率完全闪避敌人攻击', effect:{ dodgeChance: 0.25 } },
  { id:'chain', icon:'⛓️', name:'链式反应', desc:'每次合并有 15% 概率触发连锁（额外一次伤害）', effect:{ chainChance: 0.15 } },
  { id:'berserk', icon:'🔥', name:'狂暴模式', desc:'生命低于 30% 时伤害翻倍', effect:{ berserkThreshold: 0.3, berserkMult: 2 } },
];

// ==================== ENEMY DEFINITIONS ====================
const ENEMY_TEMPLATES = [
  { name:'数据碎片', desc:'最基础的损坏数据体', baseHp: 40, baseAtk: 4, icon:'◇' },
  { name:'病毒蠕虫', desc:'会持续侵蚀你的系统', baseHp: 55, baseAtk: 6, icon:'🐛' },
  { name:'防火墙守卫', desc:'高防御的数字看门犬', baseHp: 80, baseAtk: 5, icon:'🔥' },
  { name:'内存溢出体', desc:'不稳定的数据堆积物', baseHp: 60, baseAtk: 8, icon:'💀' },
  { name:'逻辑炸弹', desc:'每次攻击伤害递增', baseHp: 50, baseAtk: 4, icon:'💣', scaling: true },
  { name:'量子纠缠体', desc:'攻击时可能双倍打击', baseHp: 70, baseAtk: 6, icon:'⚛️', doubleStrike: true },
  { name:'深渊守望者', desc:'虚空深处的强大存在', baseHp: 120, baseAtk: 10, icon:'👁️' },
  { name:'熵增化身', desc:'你的护盾效果减半', baseHp: 90, baseAtk: 7, icon:'🌑', antiShield: true },
];

// ==================== GAME STATE ====================
let gameState = {
  grid: [],
  score: 0,
  merges: 0,
  floor: 1,
  kills: 0,
  playerHp: 100,
  playerMaxHp: 100,
  shield: 0,
  enemy: null,
  relics: [],
  lastDirection: -1,
  momentumStacks: 0,
  enemyAtkScale: 1,
  isAnimating: false,
  gameOver: false,
  started: false,
};

// ==================== THREE.JS SETUP ====================
const canvas = document.getElementById('game-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050510, 0.035);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 9, 7);
camera.lookAt(0, 0, 0);

// Lighting
const ambientLight = new THREE.AmbientLight(0x334466, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0x88aaff, 0.8);
dirLight.position.set(5, 10, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(1024, 1024);
scene.add(dirLight);

const pointLight1 = new THREE.PointLight(0x0088ff, 0.5, 20);
pointLight1.position.set(-4, 4, -4);
scene.add(pointLight1);

const pointLight2 = new THREE.PointLight(0xff4400, 0.3, 20);
pointLight2.position.set(4, 3, 4);
scene.add(pointLight2);

// Grid Platform
const platformGeo = new THREE.BoxGeometry(
  GRID_SIZE * (CELL_SIZE + CELL_GAP) + 0.4,
  0.2,
  GRID_SIZE * (CELL_SIZE + CELL_GAP) + 0.4
);
const platformMat = new THREE.MeshStandardMaterial({
  color: 0x0a0a2a, metalness: 0.8, roughness: 0.3,
  emissive: 0x050520, emissiveIntensity: 0.3
});
const platform = new THREE.Mesh(platformGeo, platformMat);
platform.position.y = -0.35;
platform.receiveShadow = true;
scene.add(platform);

// Grid lines
const gridGroup = new THREE.Group();
const lineMat = new THREE.LineBasicMaterial({ color: 0x1a3a6a, transparent: true, opacity: 0.5 });
for (let i = 0; i <= GRID_SIZE; i++) {
  const offset = (i - GRID_SIZE / 2) * (CELL_SIZE + CELL_GAP);
  const half = (GRID_SIZE * (CELL_SIZE + CELL_GAP)) / 2;
  const pts1 = [new THREE.Vector3(offset - CELL_GAP/2, -0.24, -half), new THREE.Vector3(offset - CELL_GAP/2, -0.24, half)];
  const pts2 = [new THREE.Vector3(-half, -0.24, offset - CELL_GAP/2), new THREE.Vector3(half, -0.24, offset - CELL_GAP/2)];
  gridGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts1), lineMat));
  gridGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts2), lineMat));
}
scene.add(gridGroup);

// Background particles
const particleCount = 200;
const particleGeo = new THREE.BufferGeometry();
const particlePositions = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount; i++) {
  particlePositions[i*3] = (Math.random() - 0.5) * 30;
  particlePositions[i*3+1] = (Math.random() - 0.5) * 20;
  particlePositions[i*3+2] = (Math.random() - 0.5) * 30;
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
const particleMat = new THREE.PointsMaterial({ color: 0x3366aa, size: 0.05, transparent: true, opacity: 0.6 });
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// ==================== TILE MANAGEMENT ====================
let tileMeshes = {};
let tileIdCounter = 0;

function gridToWorld(row, col) {
  const totalSize = GRID_SIZE * (CELL_SIZE + CELL_GAP);
  const x = col * (CELL_SIZE + CELL_GAP) - totalSize / 2 + CELL_SIZE / 2;
  const z = row * (CELL_SIZE + CELL_GAP) - totalSize / 2 + CELL_SIZE / 2;
  return { x, z };
}

function createTileTexture(value) {
  const size = 256;
  const cvs = document.createElement('canvas');
  cvs.width = size; cvs.height = size;
  const ctx = cvs.getContext('2d');
  
  const colors = TILE_COLORS[value] || TILE_COLORS[4096];
  const glowColor = colors.glow;
  
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, size, size);
  
  ctx.strokeStyle = glowColor;
  ctx.lineWidth = 4;
  ctx.strokeRect(8, 8, size-16, size-16);
  
  ctx.shadowColor = glowColor;
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#ffffff';
  ctx.font = value >= 1024 ? 'bold 60px Segoe UI' : value >= 128 ? 'bold 72px Segoe UI' : 'bold 88px Segoe UI';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(value.toString(), size/2, size/2);
  
  const texture = new THREE.CanvasTexture(cvs);
  texture.needsUpdate = true;
  return texture;
}

function createTileMesh(value, row, col) {
  const colors = TILE_COLORS[value] || TILE_COLORS[4096];
  const geo = new THREE.BoxGeometry(CELL_SIZE * 0.9, CUBE_HEIGHT, CELL_SIZE * 0.9);
  const texture = createTileTexture(value);
  
  const materials = [
    new THREE.MeshStandardMaterial({ color: colors.base, emissive: colors.emissive, emissiveIntensity: 0.4, metalness: 0.6, roughness: 0.3 }),
    new THREE.MeshStandardMaterial({ color: colors.base, emissive: colors.emissive, emissiveIntensity: 0.4, metalness: 0.6, roughness: 0.3 }),
    new THREE.MeshStandardMaterial({ map: texture, emissive: colors.emissive, emissiveIntensity: 0.2, metalness: 0.4, roughness: 0.4 }),
    new THREE.MeshStandardMaterial({ color: colors.base, emissive: colors.emissive, emissiveIntensity: 0.3, metalness: 0.6, roughness: 0.3 }),
    new THREE.MeshStandardMaterial({ color: colors.base, emissive: colors.emissive, emissiveIntensity: 0.4, metalness: 0.6, roughness: 0.3 }),
    new THREE.MeshStandardMaterial({ color: colors.base, emissive: colors.emissive, emissiveIntensity: 0.4, metalness: 0.6, roughness: 0.3 }),
  ];
  
  const mesh = new THREE.Mesh(geo, materials);
  const pos = gridToWorld(row, col);
  mesh.position.set(pos.x, 0, pos.z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  
  return mesh;
}

function spawnTile(row, col, value, animate) {
  const id = ++tileIdCounter;
  const mesh = createTileMesh(value, row, col);
  tileMeshes[id] = { mesh, value, row, col, animating: animate };
  gameState.grid[row][col] = id;
  
  if (animate) {
    mesh.scale.set(0, 0, 0);
    gsap.to(mesh.scale, { x: 1, y: 1, z: 1, duration: 0.35, ease: 'back.out(2)', onComplete: () => { tileMeshes[id].animating = false; } });
    gsap.from(mesh.position, { y: 1.5, duration: 0.35, ease: 'power2.out' });
  }
  return id;
}

function removeTileMesh(id) {
  if (tileMeshes[id]) {
    const mesh = tileMeshes[id].mesh;
    scene.remove(mesh);
    mesh.geometry.dispose();
    mesh.material.forEach(m => { if(m.map) m.map.dispose(); m.dispose(); });
    delete tileMeshes[id];
  }
}

function updateTileMesh(id, value, row, col) {
  const tile = tileMeshes[id];
  if (!tile) return;
  const mesh = tile.mesh;
  const colors = TILE_COLORS[value] || TILE_COLORS[4096];
  const texture = createTileTexture(value);
  
  mesh.material[2].map = texture;
  mesh.material[2].needsUpdate = true;
  mesh.material.forEach((m, i) => {
    if (i !== 2) {
      m.color.setHex(colors.base);
      m.emissive.setHex(colors.emissive);
    }
  });
  tile.value = value;
  tile.row = row;
  tile.col = col;
}

// ==================== PARTICLE EFFECTS ====================
let mergeParticles = [];

function createMergeParticles(row, col, value) {
  const pos = gridToWorld(row, col);
  const colors = TILE_COLORS[value] || TILE_COLORS[4096];
  const count = Math.min(12 + Math.log2(value) * 3, 30);
  
  for (let i = 0; i < count; i++) {
    const geo = new THREE.SphereGeometry(0.04 + Math.random() * 0.04, 6, 6);
    const mat = new THREE.MeshBasicMaterial({
      color: new THREE.Color(colors.glow),
      transparent: true, opacity: 1
    });
    const p = new THREE.Mesh(geo, mat);
    p.position.set(pos.x, 0.3, pos.z);
    scene.add(p);
    
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 2.5;
    const vy = 2 + Math.random() * 3;
    
    gsap.to(p.position, {
      x: pos.x + Math.cos(angle) * speed,
      y: 0.3 + vy * 0.3,
      z: pos.z + Math.sin(angle) * speed,
      duration: 0.6 + Math.random() * 0.3,
      ease: 'power2.out'
    });
    gsap.to(p.material, {
      opacity: 0, duration: 0.7, ease: 'power1.in',
      onComplete: () => { scene.remove(p); p.geometry.dispose(); p.material.dispose(); }
    });
    gsap.to(p.scale, { x: 0, y: 0, z: 0, duration: 0.7, ease: 'power2.in' });
  }
}

// ==================== CAMERA SHAKE ====================
function cameraShake(intensity, duration) {
  const origX = camera.position.x;
  const origZ = camera.position.z;
  const shakeObj = { t: 0 };
  gsap.to(shakeObj, {
    t: 1, duration: duration || 0.4, ease: 'power2.out',
    onUpdate: () => {
      const decay = 1 - shakeObj.t;
      camera.position.x = origX + (Math.random() - 0.5) * intensity * decay;
      camera.position.z = origZ + (Math.random() - 0.5) * intensity * decay;
    },
    onComplete: () => { camera.position.x = origX; camera.position.z = origZ; }
  });
}

// ==================== 2048 GAME LOGIC ====================
function initGrid() {
  gameState.grid = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(0));
  Object.keys(tileMeshes).forEach(id => removeTileMesh(parseInt(id)));
  tileMeshes = {};
}

function getEmptyCells() {
  const cells = [];
  for (let r = 0; r < GRID_SIZE; r++)
    for (let c = 0; c < GRID_SIZE; c++)
      if (gameState.grid[r][c] === 0) cells.push({ r, c });
  return cells;
}

function addRandomTile() {
  const empty = getEmptyCells();
  if (empty.length === 0) return;
  const cell = empty[Math.floor(Math.random() * empty.length)];
  const value = Math.random() < 0.9 ? 2 : 4;
  spawnTile(cell.r, cell.c, value, true);
}

function canMove() {
  for (let r = 0; r < GRID_SIZE; r++)
    for (let c = 0; c < GRID_SIZE; c++) {
      if (gameState.grid[r][c] === 0) return true;
      const val = tileMeshes[gameState.grid[r][c]]?.value;
      if (c < GRID_SIZE - 1 && tileMeshes[gameState.grid[r][c+1]]?.value === val) return true;
      if (r < GRID_SIZE - 1 && tileMeshes[gameState.grid[r+1][c]]?.value === val) return true;
    }
  return false;
}

function move(direction) {
  if (gameState.isAnimating || gameState.gameOver || !gameState.started) return;
  
  gameState.isAnimating = true;
  let moved = false;
  let mergeDamage = 0;
  let mergeCount = 0;
  const animations = [];
  const merges = [];
  
  const vectors = [
    { dr: -1, dc: 0 }, // up
    { dr: 1, dc: 0 },  // down
    { dr: 0, dc: -1 }, // left
    { dr: 0, dc: 1 },  // right
  ];
  const vec = vectors[direction];
  
  const traversals = { rows: [], cols: [] };
  for (let i = 0; i < GRID_SIZE; i++) { traversals.rows.push(i); traversals.cols.push(i); }
  if (vec.dr === 1) traversals.rows.reverse();
  if (vec.dc === 1) traversals.cols.reverse();
  
  const merged = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(false));
  
  traversals.rows.forEach(row => {
    traversals.cols.forEach(col => {
      const id = gameState.grid[row][col];
      if (id === 0) return;
      
      let newRow = row, newCol = col;
      while (true) {
        const nextRow = newRow + vec.dr;
        const nextCol = newCol + vec.dc;
        if (nextRow < 0 || nextRow >= GRID_SIZE || nextCol < 0 || nextCol >= GRID_SIZE) break;
        if (gameState.grid[nextRow][nextCol] === 0) {
          newRow = nextRow; newCol = nextCol;
        } else if (!merged[nextRow][nextCol] && tileMeshes[gameState.grid[nextRow][nextCol]]?.value === tileMeshes[id]?.value) {
          newRow = nextRow; newCol = nextCol;
          break;
        } else break;
      }
      
      if (newRow !== row || newCol !== col) {
        moved = true;
        const targetId = gameState.grid[newRow][newCol];
        gameState.grid[row][col] = 0;
        
        if (targetId !== 0) {
          // Merge
          const newVal = tileMeshes[id].value * 2;
          merged[newRow][newCol] = true;
          merges.push({ fromId: id, targetId, newRow, newCol, newVal });
          mergeDamage += newVal;
          mergeCount++;
        } else {
          gameState.grid[newRow][newCol] = id;
          tileMeshes[id].row = newRow;
          tileMeshes[id].col = newCol;
          const pos = gridToWorld(newRow, newCol);
          animations.push({ mesh: tileMeshes[id].mesh, x: pos.x, z: pos.z });
        }
      }
    });
  });
  
  if (!moved) {
    gameState.isAnimating = false;
    return;
  }
  
  // Animate slides
  const slideDuration = 0.15;
  animations.forEach(a => {
    gsap.to(a.mesh.position, { x: a.x, z: a.z, duration: slideDuration, ease: 'power2.out' });
  });
  
  // Animate merges
  let mergeAnimDelay = slideDuration;
  merges.forEach((m, i) => {
    const fromMesh = tileMeshes[m.fromId].mesh;
    const targetPos = gridToWorld(m.newRow, m.newCol);
    
    gsap.to(fromMesh.position, {
      x: targetPos.x, z: targetPos.z, duration: slideDuration, ease: 'power2.in',
      onComplete: () => {
        removeTileMesh(m.fromId);
        removeTileMesh(m.targetId);
        const newId = spawnTile(m.newRow, m.newCol, m.newVal, false);
        const mesh = tileMeshes[newId].mesh;
        tileMeshes[newId].animating = true;
        mesh.scale.set(1.3, 0.6, 1.3);
        gsap.to(mesh.scale, { x: 1, y: 1, z: 1, duration: 0.3, ease: 'elastic.out(1.2, 0.5)', onComplete: () => { tileMeshes[newId].animating = false; } });
        createMergeParticles(m.newRow, m.newCol, m.newVal);
        
        if (m.newVal >= 64) cameraShake(0.15 + Math.log2(m.newVal) * 0.02, 0.3);
      }
    });
  });
  
  const totalAnimTime = merges.length > 0 ? mergeAnimDelay + 0.35 : slideDuration + 0.05;
  
  setTimeout(() => {
    if (mergeCount > 0) {
      gameState.merges += mergeCount;
      gameState.score += mergeDamage;
      
      // Momentum
      if (direction === gameState.lastDirection) {
        gameState.momentumStacks++;
      } else {
        gameState.momentumStacks = 0;
      }
      gameState.lastDirection = direction;
      
      // Apply damage to enemy
      applyDamageToEnemy(mergeDamage, mergeCount);
      
      // Relic: heal per merge
      const healPerMerge = getRelicValue('healPerMerge');
      if (healPerMerge > 0) {
        healPlayer(healPerMerge * mergeCount);
      }
      
      // Relic: lifesteal
      const lifesteal = getRelicValue('lifesteal');
      if (lifesteal > 0) {
        healPlayer(Math.floor(mergeDamage * lifesteal));
      }
      
      updateUI();
    }
    
    // Enemy turn
    if (!gameState.gameOver && gameState.enemy && gameState.enemy.hp > 0) {
      setTimeout(() => enemyTurn(), 200);
    }
    
    // Spawn new tile
    addRandomTile();
    
    // Check game over (no moves)
    if (!canMove()) {
      setTimeout(() => {
        if (!gameState.gameOver) triggerGameOver();
      }, 500);
    }
    
    gameState.isAnimating = false;
    updateUI();
  }, totalAnimTime * 1000 + 50);
}

// ==================== COMBAT SYSTEM ====================
function applyDamageToEnemy(baseDamage, mergeCount) {
  if (!gameState.enemy || gameState.enemy.hp <= 0) return;
  
  let damage = baseDamage;
  
  // Relic: damage multiplier
  const dmgMult = getRelicValue('dmgMult');
  if (dmgMult > 0) damage *= (1 + dmgMult);
  
  // Relic: momentum
  const momentumBonus = getRelicValue('momentumBonus');
  if (momentumBonus > 0 && gameState.momentumStacks > 0) {
    damage *= (1 + momentumBonus * gameState.momentumStacks);
  }
  
  // Relic: high merge bonus
  const highMergeBonus = getRelicValue('highMergeBonus');
  if (highMergeBonus > 0 && baseDamage >= 4 * mergeCount) {
    damage *= (1 + highMergeBonus);
  }
  
  // Relic: berserk
  const berserkThreshold = getRelicValue('berserkThreshold');
  const berserkMult = getRelicValue('berserkMult');
  if (berserkThreshold > 0 && gameState.playerHp / gameState.playerMaxHp < berserkThreshold) {
    damage *= berserkMult;
  }
  
  // Relic: crit
  const critChance = getRelicValue('critChance');
  const critMult = getRelicValue('critMult');
  let isCrit = false;
  if (critChance > 0 && Math.random() < critChance) {
    damage *= critMult;
    isCrit = true;
  }
  
  damage = Math.floor(damage);
  gameState.enemy.hp = Math.max(0, gameState.enemy.hp - damage);
  
  // Show damage number
  showDamageNumber(damage, isCrit);
  
  // Relic: chain reaction
  const chainChance = getRelicValue('chainChance');
  if (chainChance > 0 && Math.random() < chainChance) {
    const chainDmg = Math.floor(damage * 0.5);
    gameState.enemy.hp = Math.max(0, gameState.enemy.hp - chainDmg);
    setTimeout(() => showDamageNumber(chainDmg, false, true), 200);
  }
  
  // Combo display
  if (mergeCount >= 2) {
    showCombo(mergeCount);
  }
  
  // Check enemy death
  if (gameState.enemy.hp <= 0) {
    setTimeout(() => enemyDefeated(), 400);
  }
  
  updateUI();
}

function enemyTurn() {
  if (!gameState.enemy || gameState.enemy.hp <= 0 || gameState.gameOver) return;
  
  let atk = gameState.enemy.atk;
  
  // Scaling enemy
  if (gameState.enemy.scaling) {
    gameState.enemyAtkScale += 0.15;
    atk = Math.floor(atk * gameState.enemyAtkScale);
  }
  
  // Double strike
  let strikes = 1;
  if (gameState.enemy.doubleStrike && Math.random() < 0.35) {
    strikes = 2;
  }
  
  let totalDamage = 0;
  for (let i = 0; i < strikes; i++) {
    let dmg = atk + Math.floor(Math.random() * 3);
    
    // Relic: dodge
    const dodgeChance = getRelicValue('dodgeChance');
    if (dodgeChance > 0 && Math.random() < dodgeChance) {
      showDamageNumber(0, false, false, true);
      continue;
    }
    
    // Shield
    let shieldEff = 1;
    if (gameState.enemy.antiShield) shieldEff = 0.5;
    const effectiveShield = Math.floor(gameState.shield * shieldEff);
    
    if (effectiveShield > 0) {
      const absorbed = Math.min(effectiveShield, dmg);
      dmg -= absorbed;
      gameState.shield -= Math.floor(absorbed / shieldEff);
    }
    
    totalDamage += dmg;
  }
  
  if (totalDamage > 0) {
    gameState.playerHp -= totalDamage;
    cameraShake(0.1, 0.25);
    
    // Relic: thorns
    const thorns = getRelicValue('thorns');
    if (thorns > 0 && gameState.enemy.hp > 0) {
      const thornDmg = Math.floor(totalDamage * thorns);
      gameState.enemy.hp = Math.max(0, gameState.enemy.hp - thornDmg);
      if (gameState.enemy.hp <= 0) setTimeout(() => enemyDefeated(), 300);
    }
    
    if (gameState.playerHp <= 0) {
      gameState.playerHp = 0;
      triggerGameOver();
    }
  }
  
  // Relic: shield per turn
  const shieldPerTurn = getRelicValue('shieldPerTurn');
  if (shieldPerTurn > 0) {
    gameState.shield += shieldPerTurn;
  }
  
  updateUI();
}

function enemyDefeated() {
  if (gameState.gameOver) return;
  gameState.kills++;
  gameState.score += gameState.floor * 100;
  
  // Heal on kill
  healPlayer(Math.floor(gameState.playerMaxHp * 0.15));
  
  // Show relic selection
  showRelicSelection();
}

function spawnEnemy() {
  const floor = gameState.floor;
  const templatePool = ENEMY_TEMPLATES.filter((_, i) => {
    if (floor <= 2) return i < 3;
    if (floor <= 4) return i < 5;
    if (floor <= 6) return i < 7;
    return true;
  });
  
  const template = templatePool[Math.floor(Math.random() * templatePool.length)];
  const hpScale = 1 + (floor - 1) * 0.4 + Math.random() * 0.2;
  const atkScale = 1 + (floor - 1) * 0.25 + Math.random() * 0.1;
  
  gameState.enemy = {
    name: template.name,
    desc: template.desc,
    icon: template.icon,
    hp: Math.floor(template.baseHp * hpScale),
    maxHp: Math.floor(template.baseHp * hpScale),
    atk: Math.floor(template.baseAtk * atkScale),
    scaling: template.scaling || false,
    doubleStrike: template.doubleStrike || false,
    antiShield: template.antiShield || false,
  };
  gameState.enemyAtkScale = 1;
  
  updateUI();
  showFloorBanner();
}

// ==================== RELIC SYSTEM ====================
function getRelicValue(key) {
  let total = 0;
  gameState.relics.forEach(r => {
    if (r.effect[key] !== undefined) total += r.effect[key];
  });
  return total;
}

function showRelicSelection() {
  const available = ALL_RELICS.filter(r => !gameState.relics.find(gr => gr.id === r.id));
  const choices = [];
  const pool = [...available];
  for (let i = 0; i < Math.min(3, pool.length); i++) {
    const idx = Math.floor(Math.random() * pool.length);
    choices.push(pool.splice(idx, 1)[0]);
  }
  
  if (choices.length === 0) {
    nextFloor();
    return;
  }
  
  const container = document.getElementById('relic-choices');
  container.innerHTML = '';
  choices.forEach(relic => {
    const card = document.createElement('div');
    card.className = 'relic-card';
    card.innerHTML = `
      <div class="rc-icon">${relic.icon}</div>
      <div class="rc-name">${relic.name}</div>
      <div class="rc-desc">${relic.desc}</div>
    `;
    card.addEventListener('click', () => selectRelic(relic));
    container.appendChild(card);
  });
  
  document.getElementById('relic-modal').classList.remove('hidden');
}

function selectRelic(relic) {
  gameState.relics.push(relic);
  
  // Apply immediate effects
  if (relic.effect.maxHpBonus) {
    gameState.playerMaxHp += relic.effect.maxHpBonus;
    gameState.playerHp += relic.effect.maxHpBonus;
  }
  
  document.getElementById('relic-modal').classList.add('hidden');
  updateRelicsBar();
  updateUI();
  
  setTimeout(() => nextFloor(), 300);
}

function nextFloor() {
  gameState.floor++;
  // Clear board partially for new challenge
  const tiles = Object.keys(tileMeshes);
  if (tiles.length > 8) {
    // Remove some tiles to keep game fresh
    const toRemove = tiles.slice(0, Math.floor(tiles.length * 0.3));
    toRemove.forEach(id => {
      const tile = tileMeshes[parseInt(id)];
      if (tile) {
        gameState.grid[tile.row][tile.col] = 0;
        gsap.to(tile.mesh.scale, {
          x: 0, y: 0, z: 0, duration: 0.3, ease: 'back.in(2)',
          onComplete: () => removeTileMesh(parseInt(id))
        });
      }
    });
  }
  
  setTimeout(() => {
    addRandomTile();
    spawnEnemy();
  }, 400);
}

// ==================== UI FUNCTIONS ====================
function updateUI() {
  document.getElementById('floor-num').textContent = gameState.floor;
  document.getElementById('score-num').textContent = gameState.score;
  document.getElementById('merge-num').textContent = gameState.merges;
  
  // Player HP
  const hpPct = Math.max(0, gameState.playerHp / gameState.playerMaxHp * 100);
  document.getElementById('player-hp-fill').style.width = hpPct + '%';
  document.getElementById('player-hp-text').textContent = `${Math.max(0,gameState.playerHp)}/${gameState.playerMaxHp}`;
  
  // Shield
  const shieldEl = document.getElementById('shield-display');
  shieldEl.textContent = gameState.shield > 0 ? `🛡️ 护盾: ${gameState.shield}` : '';
  
  // Enemy
  if (gameState.enemy) {
    const eHpPct = Math.max(0, gameState.enemy.hp / gameState.enemy.maxHp * 100);
    document.getElementById('enemy-hp-fill').style.width = eHpPct + '%';
    document.getElementById('enemy-hp-text').textContent = `${Math.max(0,gameState.enemy.hp)}/${gameState.enemy.maxHp}`;
    document.getElementById('enemy-name').textContent = `${gameState.enemy.icon} ${gameState.enemy.name}`;
    document.getElementById('enemy-desc').textContent = gameState.enemy.desc;
    document.getElementById('enemy-atk').textContent = `攻击力: ${gameState.enemy.atk}${gameState.enemy.scaling ? ' (递增)' : ''}${gameState.enemy.doubleStrike ? ' (双击)' : ''}`;
  }
}

function updateRelicsBar() {
  const bar = document.getElementById('relics-bar');
  bar.innerHTML = '';
  gameState.relics.forEach(r => {
    const el = document.createElement('div');
    el.className = 'relic-icon';
    el.innerHTML = `${r.icon}<div class="relic-tooltip"><b>${r.name}</b><br>${r.desc}</div>`;
    bar.appendChild(el);
  });
}

function showDamageNumber(amount, isCrit, isChain, isDodge) {
  const el = document.createElement('div');
  el.className = 'damage-number';
  
  if (isDodge) {
    el.textContent = 'MISS';
    el.style.color = '#88f';
    el.style.fontSize = '18px';
  } else {
    el.textContent = (isCrit ? '暴击! ' : isChain ? '连锁 ' : '-') + amount;
    el.style.color = isCrit ? '#ff0' : isChain ? '#f80' : '#f44';
    el.style.fontSize = isCrit ? '28px' : '20px';
  }
  
  const enemyBox = document.getElementById('enemy-hp-container');
  const rect = enemyBox.getBoundingClientRect();
  el.style.left = (rect.left + Math.random() * 60 - 30) + 'px';
  el.style.top = (rect.top + 30 + Math.random() * 20) + 'px';
  
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function showCombo(count) {
  const el = document.getElementById('combo-display');
  el.textContent = `${count}x COMBO!`;
  gsap.killTweensOf(el);
  gsap.fromTo(el, { opacity: 1, scale: 1.5 }, { opacity: 0, scale: 1, duration: 1, ease: 'power2.out' });
}

function showFloorBanner() {
  const el = document.getElementById('floor-banner');
  el.textContent = `FLOOR ${gameState.floor}`;
  gsap.killTweensOf(el);
  gsap.fromTo(el, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(2)' });
  gsap.to(el, { opacity: 0, scale: 1.2, duration: 0.5, delay: 1.2, ease: 'power2.in' });
}

function healPlayer(amount) {
  gameState.playerHp = Math.min(gameState.playerMaxHp, gameState.playerHp + amount);
}

// ==================== GAME FLOW ====================
function startGame() {
  gameState = {
    grid: [], score: 0, merges: 0, floor: 1, kills: 0,
    playerHp: 100, playerMaxHp: 100, shield: 0,
    enemy: null, relics: [], lastDirection: -1,
    momentumStacks: 0, enemyAtkScale: 1,
    isAnimating: false, gameOver: false, started: true,
  };
  
  initGrid();
  addRandomTile();
  addRandomTile();
  spawnEnemy();
  updateRelicsBar();
  updateUI();
  
  document.getElementById('start-modal').classList.add('hidden');
  document.getElementById('gameover-modal').classList.add('hidden');
}

function triggerGameOver() {
  gameState.gameOver = true;
  document.getElementById('go-floor').textContent = gameState.floor;
  document.getElementById('go-score').textContent = gameState.score;
  document.getElementById('go-merges').textContent = gameState.merges;
  document.getElementById('go-kills').textContent = gameState.kills;
  
  setTimeout(() => {
    document.getElementById('gameover-modal').classList.remove('hidden');
  }, 600);
  
  // Death animation
  cameraShake(0.4, 0.8);
  Object.values(tileMeshes).forEach((t, i) => {
    t.mesh.material.forEach(m => { m.transparent = true; });
    gsap.to(t.mesh.rotation, { x: Math.random() * 3 - 1.5, z: Math.random() * 3 - 1.5, duration: 1.2, ease: 'power2.in' });
    gsap.to(t.mesh.position, { y: -4, duration: 1.4, delay: i * 0.03, ease: 'power2.in' });
    gsap.to(t.mesh.scale, { x: 0.1, y: 0.1, z: 0.1, duration: 1.2, delay: i * 0.03, ease: 'power2.in' });
    t.mesh.material.forEach(m => {
      gsap.to(m, { opacity: 0, duration: 1, delay: 0.3 + i * 0.03 });
    });
  });
}

// ==================== INPUT HANDLING ====================
document.addEventListener('keydown', (e) => {
  if (!gameState.started || gameState.gameOver) return;
  switch(e.key) {
    case 'ArrowUp': case 'w': case 'W': e.preventDefault(); move(0); break;
    case 'ArrowDown': case 's': case 'S': e.preventDefault(); move(1); break;
    case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); move(2); break;
    case 'ArrowRight': case 'd': case 'D': e.preventDefault(); move(3); break;
  }
});

// Touch/Swipe
let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchend', (e) => {
  if (!gameState.started || gameState.gameOver) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);
  
  if (Math.max(absDx, absDy) < 30) return;
  
  if (absDx > absDy) {
    move(dx > 0 ? 3 : 2);
  } else {
    move(dy > 0 ? 1 : 0);
  }
}, { passive: true });

// Buttons
document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-restart').addEventListener('click', startGame);

// ==================== RENDER LOOP ====================
let time = 0;
function animate() {
  requestAnimationFrame(animate);
  time += 0.016;
  
  // Animate background particles
  particles.rotation.y += 0.0003;
  const positions = particleGeo.attributes.position.array;
  for (let i = 0; i < particleCount; i++) {
    positions[i*3+1] += Math.sin(time + i) * 0.002;
  }
  particleGeo.attributes.position.needsUpdate = true;
  
  // Subtle platform glow pulse
  platformMat.emissiveIntensity = 0.3 + Math.sin(time * 2) * 0.1;
  
  // Tile idle animation (rotation only to avoid conflicting with GSAP position tweens)
  Object.values(tileMeshes).forEach((t, i) => {
    if (t.mesh && !t.animating) {
      t.mesh.rotation.y = Math.sin(time * 0.5 + i) * 0.015;
      t.mesh.rotation.x = Math.sin(time * 0.7 + i * 0.3) * 0.008;
    }
  });
  
  // Point light animation
  pointLight1.position.x = Math.sin(time * 0.5) * 5;
  pointLight1.position.z = Math.cos(time * 0.5) * 5;
  pointLight2.position.x = Math.cos(time * 0.3) * 4;
  pointLight2.position.z = Math.sin(time * 0.3) * 4;
  
  renderer.render(scene, camera);
}
animate();

// ==================== RESIZE ====================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Initial UI
updateUI();

})();
</script>
