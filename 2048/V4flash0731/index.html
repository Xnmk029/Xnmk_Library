<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/geometries/RoundedBoxGeometry.js';

/* ============================================================
   星核远征 · NEBULA 2048 —— 2048 融合 × Roguelike
   引擎：Three.js（CDN）+ 自研补间/物理反馈动画 + WebAudio 合成音效
   ============================================================ */

/* ---------- 工具 ---------- */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const randInt=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const EASE={
  linear:t=>t,
  outQuad:t=>1-(1-t)*(1-t),
  outCubic:t=>1-Math.pow(1-t,3),
  outQuint:t=>1-Math.pow(1-t,5),
  inQuad:t=>t*t,
  inCubic:t=>t*t*t,
  inBack:t=>{const c=1.70158;return (c+1)*t*t*t-c*t*t;},
  outBackS:t=>{const s=2.6,u=t-1;return 1+(s+1)*u*u*u+s*u*u;},
};

/* ---------- WebAudio 合成音效引擎 ---------- */
const AudioSys={
  ctx:null, master:null, delay:null, muted:false, _np:3,
  init(){
    if(this.ctx) return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      this.ctx=new AC();
      this.master=this.ctx.createGain();
      this.master.gain.value=0.5;
      this.master.connect(this.ctx.destination);
      const d=this.ctx.createDelay(1); d.delayTime.value=0.42;
      const fb=this.ctx.createGain(); fb.gain.value=0.35;
      const wet=this.ctx.createGain(); wet.gain.value=0.26;
      d.connect(fb); fb.connect(d); d.connect(wet); wet.connect(this.master);
      this.delay=d;
    }catch(e){/* 音频不可用时静默降级 */}
  },
  resume(){ if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); },
  tone(o={}){
    if(!this.ctx||this.muted) return;
    const t0=this.ctx.currentTime+(o.at||0);
    const dur=o.dur||0.2;
    const osc=this.ctx.createOscillator();
    const g=this.ctx.createGain();
    osc.type=o.type||'sine';
    osc.frequency.setValueAtTime(o.f||440,t0);
    if(o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(o.g||0.2,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(g); g.connect(this.master);
    if(this.delay&&o.echo){ const s=this.ctx.createGain(); s.gain.value=1; g.connect(s); s.connect(this.delay); }
    osc.start(t0); osc.stop(t0+dur+0.06);
  },
  noise(o={}){
    if(!this.ctx||this.muted) return;
    const t0=this.ctx.currentTime+(o.at||0);
    const len=o.dur||0.15;
    const buf=this.ctx.createBuffer(1,Math.max(1,(len*this.ctx.sampleRate)|0),this.ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const f=this.ctx.createBiquadFilter(); f.type=o.type||'bandpass'; f.frequency.value=o.f||1200; f.Q.value=o.q||0.9;
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(o.g||0.2,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+len);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0+len+0.05);
  },
  sfx:{
    ui:()=>AudioSys.tone({f:660,dur:0.06,type:'triangle',g:0.1}),
    swipe:()=>AudioSys.noise({dur:0.1,f:1400,type:'highpass',g:0.07}),
    spawn:()=>AudioSys.tone({f:520,dur:0.09,type:'sine',g:0.09,f2:780}),
    merge:v=>{
      const f=180*Math.pow(2,Math.log2(v)*0.32);
      AudioSys.tone({f,dur:0.13,type:'triangle',g:0.15,f2:f*1.5});
      if(v>=32) AudioSys.tone({f:110,dur:0.2,type:'sine',g:0.2,f2:55});
      if(v>=128) AudioSys.tone({f:220,dur:0.28,type:'sawtooth',g:0.09,f2:80});
      AudioSys.noise({dur:0.07,f:3000,type:'highpass',g:0.05});
    },
    crit:()=>AudioSys.tone({f:880,dur:0.14,type:'square',g:0.1,f2:1320}),

  const mat=new THREE.PointsMaterial({size,sizeAttenuation:true,vertexColors:true,transparent:true,opacity:op,depthWrite:false});

/* ---------- 自研补间引擎（帧驱动，支持慢动作） ---------- */
const tweens=new Set();
const T={
  add(obj,props,dur,ease=EASE.outCubic,delay=0,real=false){
    return new Promise(res=>{
      const from={},to={};
      for(const k in props){from[k]=obj[k];to[k]=props[k];}
      tweens.add({obj,from,to,dur,ease,el:0,delay,res,done:false,real});
    });
  },
  wait(ms){ return T.add({v:0},{v:1},ms,EASE.linear); },
  waitReal(ms){ return T.add({v:0},{v:1},ms,EASE.linear,0,true); },
  step(dt,rawDt){
    const done=[];
    const dms=dt*1000, rdms=rawDt*1000; // 补间内部统一使用毫秒
    for(const tw of tweens){
      if(tw.done) continue;
      tw.el+=(tw.real?rdms:dms);
      const t0=clamp((tw.el-tw.delay)/tw.dur,0,1);
      const t=tw.ease(t0);
      for(const k in tw.to) tw.obj[k]=tw.from[k]+(tw.to[k]-tw.from[k])*t;
      if(t0>=1){tw.done=true;done.push(tw);}
    }
    for(const tw of done){ tweens.delete(tw); if(tw.res) tw.res(); }
  },
  clear(){
    for(const tw of tweens){ if(tw.res) tw.res(); }
    tweens.clear();
  },
};

function refreshTileVisual(tile){

const aliveTiles=()=>S.tiles.filter(t=>!t.dead);
const aliveEnemies=()=>S.enemies.filter(e=>!e.dead);
const tileAt=cell=>aliveTiles().find(t=>t.cell.r===cell.r&&t.cell.c===cell.c);
const enemyAt=cell=>S.enemies.find(e=>!e.dead&&e.cell.r===cell.r&&e.cell.c===cell.c);
const emptyCells=()=>{
  const out=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){ if(!tileAt({r,c})&&!enemyAt({r,c})) out.push({r,c}); }
  return out;
};
function spawnTile(value,doFall=true,cell=null){
  const empty=emptyCells();
  if(!empty.length) return false;
  let c=cell;
  if(!c||tileAt(c)||enemyAt(c)) c=pick(empty); // 指定格被占时回退随机空格
  const p=cellToWorld(c.r,c.c);
  const mesh=createTileMesh(value);
  const tile={id:S.tileId++,value,cell:c,mesh,dead:false,fallToken:null};
  S.tiles.push(tile);
  if(doFall){
    const token={cancelled:false};
    tile.fallToken=token;
    mesh.position.set(p.x,2.7,p.z);
    mesh.scale.setScalar(0.5);
    T.add(mesh.position,{y:TY},290,EASE.inQuad).then(async ()=>{
      if(token.cancelled) return;
      await T.add(mesh.position,{y:TY+0.34},90,EASE.outQuad);
      if(token.cancelled) return;
      T.add(mesh.position,{y:TY},150,EASE.outCubic);
      if(token.cancelled) return;
      await T.add(mesh.scale,{x:1.16,y:1.16,z:1.16},110,EASE.outQuad);
      if(token.cancelled) return;
      T.add(mesh.scale,{x:1,y:1,z:1},180,EASE.outBackS);
      if(token.cancelled) return;
      burst(p,tileColor(value),5,2.2,3);
      AudioSys.sfx.spawn();
    });
  }else{
    mesh.position.set(p.x,TY,p.z);
    mesh.scale.setScalar(0.01);
    T.add(mesh.scale,{x:1.15,y:1.15,z:1.15},140,EASE.outQuad)
      .then(()=>T.add(mesh.scale,{x:1,y:1,z:1},170,EASE.outBackS));
  }
  return true;
}

}
function simulateSwipe(dir,tiles,enemies){
  const moves=[],merges=[];
  const hasEnemy=(r,c)=>enemies.some(e=>e.cell.r===r&&e.cell.c===c);
  for(let i=0;i<N;i++){
    const cells=lineCells(i,dir);
    // 收集槽位：敌人=墙，方块=tile，空格=null
    const slots=cells.map(cell=>{
      if(hasEnemy(cell.r,cell.c)) return {wall:true};
      const t=tiles.find(x=>x.cell.r===cell.r&&x.cell.c===cell.c);
      return t?{tile:t}:null;
    });
    // 按墙分段，段内经典两两融合，目标 = 段内靠前空格
    let out=[],segStart=-1;
    const flush=(end)=>{
      if(segStart<0) return;
      for(let k=0;k<out.length;k++){
        const e=out[k], target=cells[segStart+k];
        if(e.tile.cell.r!==target.r||e.tile.cell.c!==target.c) moves.push({tile:e.tile,to:target});
        if(e.merged){
          merges.push({alive:e.tile,dead:e.dead,to:target,value:e.toVal});
          if(e.dead.cell.r!==target.r||e.dead.cell.c!==target.c) moves.push({tile:e.dead,to:target});
        }
      }
      out=[]; segStart=-1;
    };
    for(let s=0;s<slots.length;s++){
      const slot=slots[s];
      if(slot&&slot.wall){ flush(s); continue; }
      if(segStart<0) segStart=s;
      if(!slot) continue;
      const prev=out[out.length-1];
      if(prev&&!prev.merged&&prev.tile.value===slot.tile.value){
        prev.merged=true; prev.dead=slot.tile; prev.toVal=slot.tile.value*2;
      }else{
        out.push({tile:slot.tile,merged:false,dead:null,toVal:0});
      }
    }
    flush(slots.length);
  }
  return {moves,merges,moved:moves.length>0||merges.length>0};
}
// ====SIM_END====

function applySwipeState(sim){
  for(const m of sim.moves) m.tile.cell=m.to;
  for(const mg of sim.merges){ mg.alive.value=mg.value; mg.alive.cell=mg.to; mg.dead.dead=true; }
}
function hasMoves(){
  if(emptyCells().length) return true;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const t=tileAt({r,c});
    if(!t) continue;
    if(r+1<N){ const t2=tileAt({r:r+1,c}); if(t2&&t2.value===t.value) return true; }
    if(c+1<N){ const t2=tileAt({r,c:c+1}); if(t2&&t2.value===t.value) return true; }
  }
  return false;
}

function roundRect(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function drawHp(cv,cur,max){
  const g=cv.getContext('2d');
  const pct=clamp(cur/max,0,1);
  g.clearRect(0,0,128,18);
  g.fillStyle='rgba(4,8,20,0.72)';
  roundRect(g,1,1,126,16,4); g.fill();
  g.fillStyle='hsl('+Math.round(pct*120)+',85%,52%)';
  roundRect(g,3,3,122*pct,12,3); g.fill();
  g.strokeStyle='rgba(255,255,255,0.35)'; g.lineWidth=1;
  roundRect(g,1,1,126,16,4); g.stroke();
}
function makeHpSprite(cur,max,boss){
  const cv=document.createElement('canvas'); cv.width=128; cv.height=18;
  const tex=new THREE.CanvasTexture(cv); tex.colorSpace=THREE.SRGBColorSpace;
  drawHp(cv,cur,max);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthWrite:false,transparent:true}));
  sp.scale.set(boss?1.7:1.05,boss?0.19:0.13,1);
  sp.userData={cv,tex};
  return sp;
}
function updateHpBar(e){
  drawHp(e.hpSp.userData.cv,e.hp,e.maxHp);
  e.hpSp.userData.tex.needsUpdate=true;
}
const enemyTopPos=e=>({x:e.group.position.x,y:TY+e.size*0.85+0.55,z:e.group.position.z});

function spawnEnemy(type,cell){
  const def=ENEMY_DEFS[type];
  const mul=hpMul(S.floor)*(def.boss?0.85:1);
  const maxHp=Math.max(1,Math.round(def.hp*mul));
  const atkFinal=Math.max(1,Math.ceil(def.atk*atkMul(S.floor)));
  const built=buildEnemyMesh(type);
  const p=cellToWorld(cell.r,cell.c);
  built.group.position.set(p.x,TY,p.z);
  built.group.scale.setScalar(0.01);
  scene.add(built.group);
  const hpSp=makeHpSprite(maxHp,maxHp,!!def.boss);
  hpSp.position.y=def.size*0.75+0.4;
  built.group.add(hpSp);
  const e={
    id:S.enId++, type, cell, hp:maxHp, maxHp, atkFinal, def, size:def.size,
    group:built.group, bob:built.bob, hpSp, flashMats:built.mats, pulse:built.pulse,
    rot:built.rot, rotSpeed:built.rotSpeed,
    emissiveBase:built.mats.map(m=>({hex:m.emissive.getHex(),int:m.emissiveIntensity})),
    frozen:false, poison:0, dmgAcc:0, hits:0, crit:false, dead:false, removed:false,
    animT:rand(0,6.28),
  };
  S.enemies.push(e);
  T.add(built.group.scale,{x:def.size,y:def.size,z:def.size},280,EASE.outBackS,rand(0,80));
  burst(p,ENEMY_COLORS[type]||'#ffffff',8,2.5);
  return e;
}
function removeEnemyMesh(e){
  if(!e.group.parent) return;
  scene.remove(e.group);
  e.group.children.forEach(ch=>{
    if(ch.material){
      if(ch.material.map) ch.material.map.dispose();
      ch.material.dispose();
    }
  });
}
function flashEnemy(e){
  for(let i=0;i<e.flashMats.length;i++){
    const m=e.flashMats[i];
    const base=e.emissiveBase[i];
    m.emissive.setHex(0xff4040);
    m.emissiveIntensity=2.2;
    T.add(m,{emissiveIntensity:0.12},300,EASE.outCubic).then(()=>{
      m.emissive.setHex(base.hex); m.emissiveIntensity=base.int;
    });
  }
  T.add(e.group.scale,{x:e.size*0.9,y:e.size*0.9,z:e.size*0.9},70,EASE.outQuad);
  T.add(e.group.scale,{x:e.size,y:e.size,z:e.size},190,EASE.outBackS,70);
}
function freezeEnemy(e){
  e.frozen=true;
  e.flashMats.forEach(m=>{ m.emissive.setHex(0x66ccff); m.emissiveIntensity=0.9; });
}
function unfreezeEnemy(e){
  e.frozen=false;
  e.flashMats.forEach((m,i)=>{ m.emissive.setHex(e.emissiveBase[i].hex); m.emissiveIntensity=e.emissiveBase[i].int; });
}

const armorBonus=()=>(hasR('armor1')?1:0)+(hasR('armor2')?2:0);

function relicPool(){
  const pool=[];
  const owned=new Set(S.relics);
  for(const id in RELICS){
    const r=RELICS[id];
    if(r.heal||r.score) continue;
    if(owned.has(id)) continue;
    const w={common:3,rare:1.4,epic:0.6}[r.rarity]||1;
    for(let i=0;i<Math.round(w*10);i++) pool.push(id);
  }
  return pool;
}
function rollRelics(){
  const pool=relicPool();
  const out=[];
  for(let i=0;i<3;i++){
    let id=null;
    if(pool.length&&Math.random()<0.82){
      id=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    }else{
      const healCards=[];
      if(!hasR('healc')) healCards.push('healc');
      healCards.push('star');
      id=pick(healCards);
    }
    if(!id&&pool.length) id=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    if(!id) id='star';
    out.push(id);
  }
  return out;
}
function addRelicChip(id){

  s.className='relic-ic';
  s.textContent=r.emoji;
  s.dataset.tip=r.name+'：'+r.desc;
  el.relicBar.appendChild(s);

    d.className='card r-'+r.rarity;
    d.style.setProperty('--i',i);
    const rn=r.rarity==='common'?'普通':r.rarity==='rare'?'稀有':'史诗';
    d.innerHTML='<div class="rt">'+rn+'</div><div class="ic">'+r.emoji+'</div><div class="nm">'+r.name+'</div><div class="ds">'+r.desc+'</div>';
    d.addEventListener('pointermove',ev=>{
      const b=d.getBoundingClientRect();
      const x=(ev.clientX-b.left)/b.width-0.5, y=(ev.clientY-b.top)/b.height-0.5;
      d.style.transform='perspective(700px) rotateY('+(x*16).toFixed(1)+'deg) rotateX('+(-y*14).toFixed(1)+'deg) translateY(-6px)';
    });
    d.addEventListener('pointerleave',()=>{ d.style.transform=''; });
    d.addEventListener('click',()=>{ AudioSys.sfx.ui(); applyRelic(id); });
    el.relicCards.appendChild(d);
  });
  el.relicModal.classList.add('show');
}
async function applyRelic(id){
  if(S.state!=='clear') return; // 防止重复领取
  const r=RELICS[id];
  S.relics.push(id);
  el.relicModal.classList.remove('show');
  if(r.heal) heal(r.heal);
  if(r.score){ S.score+=r.score; }
  if(r.heart){ S.maxHP+=25; heal(25); }
  addRelicChip(id);
  AudioSys.sfx.relic();
  await T.wait(340);
  startFloor(S.floor+1);
}

/* ============================================================
   战斗流程
   ============================================================ */
function mergeDamageFor(value,idxMult,e){
  let d=value+flatBonus();
  if(hasR('rage')) d+=Math.floor(Math.max(0,S.maxHP-S.hp)*0.15);
  d*=idxMult;
  if(hasR('bomb')&&S.mergeSeq%3===0) d*=2;
  let crit=false;
  if(hasR('crit')&&Math.random()<0.15){ d*=3; crit=true; }
  if(e.def.armor) d=Math.max(1,Math.floor(d*0.5));
  return {d:Math.round(d),crit};
}
async function mergeAnim(mg,i){
  const {alive,dead,to,value}=mg;
  const p=cellToWorld(to.r,to.c);
  refreshTileVisual(alive); // 融合后刷新数字与颜色
  const ms=alive.mesh.scale;
  await T.add(ms,{x:1.36,y:1.36,z:1.36},60,EASE.outQuad);
  await T.add(ms,{x:1,y:1,z:1},180,EASE.outBackS);
  const ds=dead.mesh.scale;
  T.add(ds,{x:0.02,y:0.02,z:0.02},150,EASE.inCubic).then(()=>removeTileMesh(dead));
  const col=tileColor(value);
  ring(p,col,value);
  burst(p,col,Math.min(16,8+Math.log2(value)),2.6+Math.log2(value)*0.22);
  lightPulse(value);
  shake(0.08+Math.min(0.4,Math.log2(value)*0.03));
  AudioSys.sfx.merge(value);
  spawnText3D(p,'+'+value,col,0.45+Math.min(0.3,Math.log2(value)*0.028));
  if(value>S.maxTile){
    S.maxTile=value;
    spawnText3D(p,'★ 新纪录 ★','#ffd75e',0.62);
    AudioSys.sfx.crit();
  }
  S.merges++; S.mergeSeq++;
  const idxMult=1+0.1*Math.min(9,i);
  for(const e of aliveEnemies()){
    const r=mergeDamageFor(value,idxMult,e);
    if(r.d>0){
      e.dmgAcc+=r.d; e.hits++;
      if(r.crit) e.crit=true;
      if(hasR('venom')) e.poison=Math.min(20,e.poison+2);
      if(e.def.reflect) S.reflectAcc+=Math.max(1,e.def.reflect-armorBonus());
      if(hasR('vamp')) S.healAcc+=r.d*0.1;
    }
  }
  if(hasR('twin')&&Math.random()<0.25) S.pendingTwin.push(value);
  S.score+=value;
}
async function processDeaths(deaths){
  while(deaths.length){
    const e=deaths.shift();
    if(e.removed) continue;
    e.removed=true;
    e.dead=true;
    const def=e.def;
    const p=enemyTopPos(e);
    const col=ENEMY_COLORS[e.type]||'#ffffff';
    burst(p,col,def.boss?36:20,def.boss?7:4.6);
    ring(p,col,def.boss?128:32);
    shake(def.boss?0.55:0.28);
    AudioSys.sfx.kill(!!def.boss);
    if(def.boss) spawnText3D(p,'首领击破!','#ffd75e',0.75);
    await T.add(e.group.scale,{x:0.02,y:0.02,z:0.02},200,EASE.inCubic);
    removeEnemyMesh(e);
    S.kills++;
    S.score+=def.boss?100:10;
    updateEnemyChip();
    if(def.boss&&e.hp<=0) AudioSys.sfx.boom();
    if(def.split){
      const es=emptyCells();
      for(let i=0;i<2&&es.length;i++){
        const c=es.splice(Math.floor(Math.random()*es.length),1)[0];
        spawnEnemy('wurm',c);
      }
    }
    if(def.boom){ damagePlayer(def.boom,'自爆波及'); if(S.state==='dead') return; }
    if(hasR('splash')){
      const next=[];
      for(const o of aliveEnemies()){
        o.hp-=5; flashEnemy(o); updateHpBar(o);
        if(o.hp<=0&&!o.removed) next.push(o);
      }
      deaths.push(...next);
    }
  }
}
async function applyMergeDamage(){
  const deaths=[];
  for(const e of aliveEnemies()){
    if(e.dmgAcc>0){
      flashEnemy(e);
      e.hp-=e.dmgAcc;
      S.dmgDealt+=e.dmgAcc;
      spawnText3D(enemyTopPos(e),'-'+e.dmgAcc+(e.crit?'!':''),e.crit?'#ffd75e':'#ff7a7a',e.crit?0.6:0.48);
      if(e.crit) AudioSys.sfx.crit();
      e.dmgAcc=0; e.crit=false;
      updateHpBar(e);
      if(e.hp<=0&&!e.removed) deaths.push(e);
    }
  }
  await processDeaths(deaths);
  if(S.state==='dead') return;
  if(hasR('aura')){
    const ds2=[];
    for(const e of aliveEnemies()){
      e.hp-=2; flashEnemy(e); updateHpBar(e);
      if(e.hp<=0&&!e.removed) ds2.push(e);
    }
    if(ds2.length) await processDeaths(ds2);
  }
  if(S.reflectAcc>0){
    const d=S.reflectAcc; S.reflectAcc=0;
    damagePlayer(d,'荆棘反噬');
    if(S.state==='dead') return;
  }
  if(S.healAcc>0){ heal(Math.max(1,Math.round(S.healAcc))); S.healAcc=0; }
}
async function attackAnim(e,delay=0){
  const g=e.group;
  const baseZ=g.position.z;
  await T.add(g.position,{z:baseZ+0.55},100,EASE.outQuad,delay);
  T.add(g.scale,{x:e.size*1.12,y:e.size*1.12,z:e.size*1.12},100,EASE.outQuad,delay);
  await T.add(g.position,{z:baseZ},180,EASE.outBackS,delay+100);
  T.add(g.scale,{x:e.size,y:e.size,z:e.size},160,EASE.outBackS,delay+100);
}
async function enemyTurn(){
  const poisons=[];
  for(const e of aliveEnemies()){
    if(e.poison>0){
      e.hp-=e.poison;
      spawnText3D(enemyTopPos(e),'-'+e.poison+' 毒','#b28aff',0.42);
      updateHpBar(e);
      e.poison=0;
      if(e.hp<=0&&!e.removed) poisons.push(e);
    }
  }
  if(poisons.length) await processDeaths(poisons);
  if(S.state==='dead'||aliveEnemies().length===0) return;
  if(S.poison>0){
    S.hp-=S.poison; S.dmgTaken+=S.poison;
    hpFloater('-'+S.poison+' 毒','#b28aff',16);
    el.vignette.classList.add('on'); clearTimeout(vigTO); vigTO=setTimeout(()=>el.vignette.classList.remove('on'),300);
    AudioSys.sfx.poison();
    S.poison--;
    setHp();
    if(S.hp<=0){ S.deathReason='剧毒蚀心'; deathFlow(); return; }
  }
  /* 攻击阶段：所有敌人并行冲锋（小幅错峰），然后统一结算 */
  const atkList=aliveEnemies();
  const anims=[];
  for(let i=0;i<atkList.length;i++){
    const e=atkList[i];
    if(e.frozen){
      unfreezeEnemy(e);
      spawnText3D(enemyTopPos(e),'❄ 冻结','#8fd8ff',0.5);
    }else{
      anims.push(attackAnim(e,i*55));
    }
  }
  await Promise.all(anims);
  if(S.state==='dead') return;
  for(const e of atkList){
    if(e.frozen||e.dead) continue;
    const dmg=Math.max(1,e.atkFinal-armorBonus());
    damagePlayer(dmg);
    if(e.def.poison) S.poison=Math.min(20,S.poison+e.def.poison);
    if(e.def.bossPoison) S.poison=Math.min(20,S.poison+e.def.bossPoison);
    if(e.def.summon&&aliveEnemies().length<6){
      const es=emptyCells();
      if(es.length){
        const s=spawnEnemy('wurm',pick(es));
        spawnText3D(enemyTopPos(s),'召唤!','#c98aff',0.45);
      }
    }
    if(S.state==='dead') return;
  }
}

/* 主流程：一次滑动 = 移动动画 → 融合动画/伤害累积 → 伤害结算 → 清层判定 → 敌人回合 → 生成方块 */
async function resolveSwipe(dir,rid){
  const sim=simulateSwipe(dir,aliveTiles(),S.enemies);
  if(!sim.moved) return;
  const alive=()=>S.state==='playing'&&S.runId===rid;
  AudioSys.sfx.swipe();
  applySwipeState(sim);
  const lean=dir==='l'?{z:0.1}:dir==='r'?{z:-0.1}:dir==='u'?{x:0.1}:{x:-0.1};
  const movePs=[];
  for(const m of sim.moves){
    const p=cellToWorld(m.to.r,m.to.c);
    if(m.tile.fallToken) m.tile.fallToken.cancelled=true; // 取消坠落动画，避免位置冲突
    movePs.push(T.add(m.tile.mesh.position,{x:p.x,y:p.y,z:p.z},MOVE_MS,EASE.outCubic));
    if(!m.tile.dead){
      T.add(m.tile.mesh.rotation,lean,70,EASE.outQuad);
      T.add(m.tile.mesh.rotation,{x:0,z:0},130,EASE.outCubic,70);
      if(m.tile.fallToken){
        m.tile.fallToken=null;
        T.add(m.tile.mesh.scale,{x:1,y:1,z:1},140,EASE.outBackS);
      }
    }
  }
  await Promise.all(movePs);
  if(!alive()) return;
  /* 融合动画并行播放，全部完成后统一结算伤害 */
  await Promise.all(sim.merges.map((mg,i)=>mergeAnim(mg,i)));
  if(!alive()) return;
  /* 双生之核：在所有融合结束后再生成（避免占位冲突） */
  if(S.pendingTwin.length){
    for(const v of S.pendingTwin){
      const es=emptyCells();
      if(es.length) spawnTile(v,false,pick(es));
    }
    S.pendingTwin=[];
  }
  await applyMergeDamage();
  if(!alive()||S.state==='dead') return;
  if(sim.merges.length>=2) comboShow(sim.merges.length);
  if(aliveEnemies().length===0){
    await floorClearFlow();
    return;
  }
  await enemyTurn();
  if(!alive()||S.state==='dead') return;
  if(aliveEnemies().length===0){
    await floorClearFlow();
    return;
  }
  spawnTile(Math.random()<0.9?2:4);
  updateBoardWarn();
  if(!hasMoves()){
    S.deathReason='棋盘枯竭，无路可走';
    deathFlow();
  }
}
function doSwipe(dir){
  if(S.state!=='playing') return;
  if(S.busy){ if(S.pendingQueue.length<3) S.pendingQueue.push(dir); return; }
  S.busy=true;
  const rid=S.runId;
  resolveSwipe(dir,rid).then(()=>{
    if(S.runId!==rid) return;
    S.busy=false;
    if(S.tiles.length>64) S.tiles=S.tiles.filter(t=>!t.dead);
    if(S.state==='playing'&&S.pendingQueue.length){
      doSwipe(S.pendingQueue.shift());
    }
  }).catch(err=>{
    if(S.runId===rid) S.busy=false;
    console.error(err);
  });
}

/* ============================================================
   楼层生命周期（Roguelike 循环）
   ============================================================ */
function rollRegular(n){
  const opts=[];
  for(const t in ENEMY_DEFS){
    const d=ENEMY_DEFS[t];
    if(!d.boss&&d.minFloor<=n){ for(let i=0;i<d.w;i++) opts.push(t); }
  }
  return pick(opts);
}
function spawnEnemiesForFloor(){
  const n=S.floor;
  const bossFloor=n%5===0;
  const list=[];
  if(bossFloor){
    const bosses=['golem','eye','void'];
    list.push(bosses[Math.floor(n/5-1)%3]);
    list.push(rollRegular(n)); list.push(rollRegular(n));
  }else{
    const count=clamp(2+Math.floor((n-1)/2),2,6);
    for(let i=0;i<count;i++) list.push(rollRegular(n));
  }
  let empties=shuffle(emptyCells());
  let k=Math.min(list.length,Math.max(0,empties.length-4));
  /* 极端情况：棋盘几乎占满时强制腾出一格并确保至少 1 只敌人 */
  if(k===0&&list.length){
    const tiles=aliveTiles().sort((a,b)=>a.value-b.value);
    if(tiles.length){
      const victim=tiles[0];
      victim.dead=true;
      T.add(victim.mesh.scale,{x:0.02,y:0.02,z:0.02},160,EASE.inCubic).then(()=>removeTileMesh(victim));
      burst(cellToWorld(victim.cell.r,victim.cell.c),tileColor(victim.value),8,3);
      empties=shuffle(emptyCells()); // 重新计算空位
      k=Math.min(1,empties.length);
    }
  }
  k=Math.min(k,empties.length);
  for(let i=0;i<k;i++) spawnEnemy(list[i],empties[i]);
}
function enemySummary(){
  const cnt={};
  for(const e of aliveEnemies()) cnt[e.type]=(cnt[e.type]||0)+1;
  return Object.entries(cnt).map(([t,n])=>ENEMY_DEFS[t].emoji+'×'+n).join(' ');
}
async function startFloor(n){
  S.state='playing';
  S.floor=n;
  /* 空棋盘时生成 2 个初始方块（经典开局） */
  if(aliveTiles().length===0){
    spawnTile(Math.random()<0.9?2:4);
    spawnTile(Math.random()<0.9?2:4);
  }
  const bossFloor=n%5===0;
  el.floorChip.textContent='第 '+n+' 层';
  el.floorChip.classList.toggle('boss',bossFloor);
  el.hint.classList.add('gone');
  spawnEnemiesForFloor();
  updateEnemyChip();
  if(bossFloor){
    banner('第 '+n+' 层',bossName(n),'bossT');
    AudioSys.sfx.boss();
    rimMat.color.set(0xff3344); rimMat.opacity=0.4;
  }else{
    banner('第 '+n+' 层',enemySummary());
    rimMat.color.set(0x2f7fff); rimMat.opacity=0.16;
  }
  if(hasR('frost')){
    const es=aliveEnemies();
    if(es.length){
      const strongest=es.reduce((a,b)=>a.hp>=b.hp?a:b);
      freezeEnemy(strongest);
      spawnText3D(enemyTopPos(strongest),'❄ 已冻结','#8fd8ff',0.55);
    }
  }
  updateBoardWarn();
}
async function floorClearFlow(){
  S.state='clear';
  const bossFloor=S.floor%5===0;
  let healAmt=8+(bossFloor?4:0)+(hasR('spring')?10:0);
  AudioSys.sfx.clear();
  banner('第 '+S.floor+' 层 清除!',bossFloor?'首领已被击破':'准备迎接下一层',bossFloor?'bossT':'');
  burst({x:0,y:0.6,z:0},'#ffd75e',26,6);
  burst({x:0,y:0.6,z:0},'#6fd8ff',26,6);
  setTimeout(()=>burst({x:0,y:0.6,z:0},'#c05cff',22,5),150);
  heal(healAmt);
  S.score+=bossFloor?150:50;
  await T.wait(1000);
  if(S.state!=='clear') return;
  openRelicModal();
}

/* ============================================================
   玩家状态
   ============================================================ */
let lastHpPct=100;
function setHp(ghost=true){
  const pct=Math.max(0,S.hp/S.maxHP*100);
  if(ghost&&pct<lastHpPct){
    el.hpGhost.style.transition='none';
    el.hpGhost.style.width=lastHpPct+'%';
    void el.hpGhost.offsetWidth;
    el.hpGhost.style.transition='width .55s ease .5s';
    el.hpGhost.style.width=pct+'%';
  }else{
    el.hpGhost.style.transition='none';
    el.hpGhost.style.width=pct+'%';
  }
  lastHpPct=pct;
  el.hpFill.style.width=pct+'%';
  const low=pct<=25;
  el.vignette.classList.toggle('low',low);
  el.hpFill.style.background=low?'linear-gradient(90deg,#ff5a5a,#ff9d6b)':'linear-gradient(90deg,#2fd6a8,#7ef0c8)';
  el.hpText.textContent=Math.max(0,S.hp)+'/'+S.maxHP;
}
function heal(amt){
  const before=S.hp;
  S.hp=Math.min(S.maxHP,S.hp+amt);
  const real=S.hp-before;
  if(real>0){ hpFloater('+'+real,'#6ff0c0',17); setHp(); AudioSys.sfx.heal(); }
  else setHp(false);
}
function damagePlayer(d,reason){
  d=Math.max(1,Math.round(d));
  S.hp-=d; S.dmgTaken+=d;
  hpFloater('-'+d,'#ff6b6b',19);
  el.vignette.classList.add('on'); clearTimeout(vigTO); vigTO=setTimeout(()=>el.vignette.classList.remove('on'),340);
  shake(0.22);
  AudioSys.sfx.hurt();
  setHp();
  if(S.hp<=0){ S.deathReason=reason||'被虚空之力吞噬'; deathFlow(); }
}
function updateBoardWarn(){
  el.floorChip.classList.toggle('warn',emptyCells().length<=2&&aliveEnemies().length>0);
}

/* ---------- 重置 / 开始 / 死亡 ---------- */
function resetRun(){
  for(const t of S.tiles) removeTileMesh(t);
  for(const e of S.enemies) removeEnemyMesh(e);
  S.tiles=[]; S.enemies=[];
  S.floor=0; S.score=0; S.dispScore=0; S.dmgDealt=0; S.dmgTaken=0; S.kills=0; S.maxTile=2; S.merges=0;
  S.hp=S.maxHP=50; S.poison=0; S.reflectAcc=0; S.healAcc=0;
  S.relics=[]; S.pendingQueue=[]; S.deathReason=''; S.mergeSeq=0; S.busy=false; S.pendingTwin=[];
  S.runId++; // 世代标记：旧滑动链在新对局中立即失效
  el.relicBar.innerHTML='';
  el.floorChip.classList.remove('boss','warn');
  el.hint.classList.remove('gone');
  for(const ind of indicators) ind.material.opacity=0;
  T.clear();
  setHp(false);
  setScore(true);
  updateEnemyChip();
}
function startRun(){

  resetRun();
  el.menuModal.classList.remove('show');
  el.deathModal.classList.remove('show');
  el.relicModal.classList.remove('show');
  el.sceneWrap.classList.remove('dead');
  timeScaleTarget=1;
  S.state='playing';
  startFloor(1);
}
async function deathFlow(){
  if(S.state==='dead'||S.state==='menu') return;
  S.state='dead';
  S.deathReason=S.deathReason||'被虚空之力吞噬';
  AudioSys.sfx.death();
  trauma=1.2;
  burst({x:0,y:0.6,z:0},'#ff4d5e',50,8);
  el.sceneWrap.classList.add('dead');
  timeScaleTarget=0.18;
  await T.waitReal(1250);
  if(S.state!=='dead') return;
  el.deathReason.textContent='—— '+S.deathReason+' ——';
  el.deathStats.innerHTML=
    '<div class="dstat"><b>'+S.floor+'</b><span>到达层数</span></div>'+
    '<div class="dstat"><b>'+S.maxTile+'</b><span>最高方块</span></div>'+
    '<div class="dstat"><b>'+S.kills+'</b><span>击杀敌人</span></div>'+
    '<div class="dstat"><b>'+S.dmgDealt+'</b><span>总伤害</span></div>'+
    '<div class="dstat"><b>'+S.merges+'</b><span>融合次数</span></div>'+
    '<div class="dstat"><b>'+S.score+'</b><span>星尘积分</span></div>';
  el.deathModal.classList.add('show');
  timeScaleTarget=1;
  saveRecords();
}
function toMenu(){
  resetRun();
  S.state='menu';
  el.deathModal.classList.remove('show');
  el.sceneWrap.classList.remove('dead');
  timeScaleTarget=1;
  renderMenu();
  el.menuModal.classList.add('show');
  placeDemoTiles();
}
function placeDemoTiles(){
  const cells=shuffle(emptyCells());
  const vals=[2,4,8,16,32,64,128];
  for(let i=0;i<Math.min(7,cells.length);i++) spawnTile(vals[i],true,cells[i]);
}

/* ============================================================
   输入：触摸 / 鼠标拖拽 / 键盘
   ============================================================ */
const ptr={down:false,x:0,y:0,swiped:false};
const sway={x:0,y:0,tx:0,ty:0};
function setupInput(){
  const cv=el.scene;
  cv.addEventListener('pointerdown',e=>{
    AudioSys.init(); AudioSys.resume();
    if(S.state!=='playing') return;
    ptr.down=true; ptr.swiped=false; ptr.x=e.clientX; ptr.y=e.clientY;
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  });
  cv.addEventListener('pointermove',e=>{
    if(!ptr.down) return;
    const dx=e.clientX-ptr.x, dy=e.clientY-ptr.y;
    sway.tx=clamp(dx*0.0018,-0.5,0.5);
    sway.ty=clamp(dy*0.0016,-0.4,0.4);
    if(!ptr.swiped&&Math.hypot(dx,dy)>24){
      ptr.swiped=true;
      const dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u');
      doSwipe(dir);
    }
  });
  const end=()=>{ ptr.down=false; ptr.swiped=false; sway.tx=0; sway.ty=0; };
  cv.addEventListener('pointerup',end);
  cv.addEventListener('pointercancel',end);
  window.addEventListener('keydown',e=>{
    AudioSys.init();
    const map={'ArrowLeft':'l','ArrowRight':'r','ArrowUp':'u','ArrowDown':'d','a':'l','d':'r','w':'u','s':'d','A':'l','D':'r','W':'u','S':'d'};
    if(map[e.key]){ e.preventDefault(); doSwipe(map[e.key]); }
  });
}

/* ---------- 按钮 ---------- */
let restartArmed=false, restartTO=null;
function wireButtons(){
  $('startBtn').addEventListener('click',()=>{ AudioSys.sfx.ui(); startRun(); });
  $('againBtn').addEventListener('click',()=>{ AudioSys.sfx.ui(); startRun(); });
  $('menuBtn').addEventListener('click',()=>{ AudioSys.sfx.ui(); toMenu(); });
  $('muteBtn').addEventListener('click',()=>{
    muted=!muted; AudioSys.muted=muted;
    $('muteBtn').textContent=muted?'🔇':'🔊';
    try{ localStorage.setItem('neb2048mute',muted?'1':'0'); }catch(e){}
  });
  $('restartBtn').addEventListener('click',()=>{
    if(S.state==='menu') return;
    if(!restartArmed){
      restartArmed=true;
      const b=$('restartBtn'); b.textContent='确认?'; b.style.borderColor='#ff5a5a'; b.style.color='#ff9d9d';
      clearTimeout(restartTO);
      restartTO=setTimeout(()=>{ restartArmed=false; b.textContent='↺'; b.style.borderColor=''; b.style.color=''; },2400);
    }else{
      clearTimeout(restartTO); restartArmed=false;
      const b=$('restartBtn'); b.textContent='↺'; b.style.borderColor=''; b.style.color='';
      startRun();
    }
  });
}
let muted=false;
try{ muted=localStorage.getItem('neb2048mute')==='1'; }catch(e){}
AudioSys.muted=muted;
$('muteBtn').textContent=muted?'🔇':'🔊';

/* ============================================================
   主循环
   ============================================================ */
let last=performance.now();
let timeScale=1, timeScaleTarget=1;
function loop(t){
  requestAnimationFrame(loop);
  const raw=Math.min(0.05,(t-last)/1000);
  last=t;
  timeScale+=(timeScaleTarget-timeScale)*Math.min(1,raw*7);
  const dt=raw*timeScale;
  T.step(dt,raw);
  /* 相机：拖拽视差 + 震屏 */
  trauma=Math.max(0,trauma-dt*1.9);
  const tsq=trauma*trauma;
  sway.x+=(sway.tx-sway.x)*Math.min(1,raw*9);
  sway.y+=(sway.ty-sway.y)*Math.min(1,raw*9);
  if(S.state==='menu'){
    const a=t*0.00012;
    camera.position.set(
      Math.sin(a)*13.5+tsq*0.3*Math.sin(t*0.057),
      9.2+tsq*0.25*Math.sin(t*0.063+2),
      Math.cos(a)*13.5+tsq*0.3*Math.sin(t*0.061+1.7));
  }else{
    camera.position.set(
      CAM_BASE.x+sway.x*2.4+tsq*0.42*Math.sin(t*0.061+1.7),
      CAM_BASE.y-sway.y*1.8+tsq*0.32*Math.sin(t*0.057+0.6),
      CAM_BASE.z+tsq*0.3*Math.sin(t*0.067+2.9));
  }
  camera.lookAt(tsq*0.08*Math.sin(t*0.05),0.15,0);
  /* 融合闪光灯光 */
  lightFlash=Math.max(0,lightFlash-dt*3.2);
  lightA.intensity=0.7+lightFlash*5;
  lightB.intensity=0.7+lightFlash*4;
  /* 星空缓旋 */
  stars1.rotation.y+=dt*0.006;
  stars2.rotation.y-=dt*0.004;
  /* 粒子 */
  for(const p of particles){
    if(p.life<=0) continue;
    p.life-=dt;
    const i=p.i;
    if(p.life>0){
      p.vy-=p.grav*dt;
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
      const a=clamp(p.life/p.max,0,1);
      pPos[i*3]=p.x; pPos[i*3+1]=p.y; pPos[i*3+2]=p.z;
      pCol[i*3]=p.r*a; pCol[i*3+1]=p.g*a; pCol[i*3+2]=p.b*a;
    }else{
      pPos[i*3+1]=-99;
    }
  }
  pGeo.attributes.position.needsUpdate=true;
  pGeo.attributes.color.needsUpdate=true;
  /* 冲击波环 */
  for(const r of rings){
    if(r.t>=1) continue;
    r.t+=dt/r.dur;
    const k=EASE.outCubic(clamp(r.t,0,1));
    r.mesh.scale.set(r.max*k,r.max*k,1);
    r.mesh.material.opacity=(1-k)*0.85;
    if(r.t>=1) r.mesh.visible=false;
  }
  /* 3D 浮动文字 */
  for(let i=text3Ds.length-1;i>=0;i--){
    const ft=text3Ds[i];
    ft.life-=dt;
    if(ft.life<=0){
      scene.remove(ft.sp); ft.sp.material.dispose();
      text3Ds.splice(i,1);
      continue;
    }
    ft.sp.position.y+=ft.vy*dt;
    ft.sp.position.x+=ft.drift*dt;
    ft.sp.material.opacity=ft.life>0.35?1:clamp(ft.life/0.35,0,1);
  }
  /* 敌人占位警示（红格脉冲） */
  for(let i=0;i<indicators.length;i++){
    const r=Math.floor(i/N), c=i%N;
    const on=enemyAt({r,c})?1:0;
    const target=on?(0.24+0.13*Math.sin(t*0.004+i)):0;
    indicators[i].material.opacity+=(target-indicators[i].material.opacity)*Math.min(1,raw*10);
  }
  /* 敌人待机动画 */
  for(const e of aliveEnemies()){
    e.animT+=dt;
    if(e.bob) e.bob.position.y=0.06*Math.sin(e.animT*2.1+e.id*1.3);
    if(e.rot) e.rot.rotation.y+=dt*e.rotSpeed;
    if(e.pulse) for(const m of e.pulse) m.emissiveIntensity=1.2+0.9*Math.sin(e.animT*5);
  }
  /* 高数值方块呼吸光 */
  for(const tt of aliveTiles()){
    if(tt.value>=128) tt.mesh.material.emissiveIntensity=1+0.3*Math.sin(t*0.004+tt.id);
  }
  /* 漂浮星尘 */
  for(let i=0;i<dustN;i++){
    dpos[i*3]+=dvel[i].x*dt; dpos[i*3+1]+=dvel[i].y*dt; dpos[i*3+2]+=dvel[i].z*dt;
    if(dpos[i*3+1]>5.2) dpos[i*3+1]=0.2;
    if(Math.abs(dpos[i*3])>12) dvel[i].x*=-1;
    if(Math.abs(dpos[i*3+2])>12) dvel[i].z*=-1;
  }
  dustGeo.attributes.position.needsUpdate=true;
  /* 积分滚动 */
  S.dispScore+=(S.score-S.dispScore)*Math.min(1,raw*8);
  if(Math.abs(S.dispScore-S.score)<0.5) S.dispScore=S.score;
  el.score.textContent=Math.round(S.dispScore).toLocaleString();
  /* 环境音 */
  AudioSys.tick(dt);
  renderer.render(scene,camera);
}

/* ---------- 启动 ---------- */
function boot(){
  window.__gameBooted=true;
  renderMenu();
  el.menuModal.classList.add('show');
  placeDemoTiles();
  setupInput();
  wireButtons();
  setHp(false);
  [2,4,8,16,32,64,128,256,512,1024,2048].forEach(makeNumberTexture);
  requestAnimationFrame(loop);
}
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
window.addEventListener('error',ev=>{
  el.errMsg.textContent='资源加载失败：'+(ev.message||'未知错误')+'\n请确认网络可访问 jsdelivr CDN（Three.js），然后刷新页面重试。';
  el.errMsg.classList.add('show');
});
boot();
