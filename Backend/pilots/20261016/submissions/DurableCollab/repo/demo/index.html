<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Durable Collab · 双进程协同</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#e6edf8;background:#101623;color-scheme:dark}*{box-sizing:border-box}body{max-width:1260px;margin:auto;padding:36px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:24px}h1{font-size:30px;margin:8px 0}h2{font-size:19px;margin:0}p{color:#a9b7ce;line-height:1.7}small{color:#97a8c1}button,input{font:inherit;padding:10px 13px;border-radius:8px;border:1px solid #43516a;background:#1c2940;color:inherit}button{cursor:pointer}button:hover{background:#2b4265}button.primary{background:#3875dd;border-color:#3875dd}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:24px 0}.toolbar input{width:170px}#panes{display:grid;grid-template-columns:1fr 1fr;gap:20px}.pane{background:#182234;border:1px solid #33415a;border-radius:14px;padding:22px}.title{display:flex;justify-content:space-between;gap:12px}.status{color:#ffc984}.status.online{color:#83dfbb}textarea{width:100%;height:180px;resize:vertical;border:1px solid #43516a;border-radius:9px;background:#0f192a;color:#fff;font:18px/1.6 system-ui;padding:14px;margin:16px 0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.metric{padding:12px;background:#101a2a;border-radius:8px}.metric b{display:block;font-size:22px;margin-top:5px}.actual{white-space:pre-wrap;overflow-wrap:anywhere;min-height:55px;padding:12px;background:#101a2a;border-radius:8px}#verdict{color:#83dfbb}#timeline{font:13px/1.7 ui-monospace,monospace;max-height:270px;overflow:auto;padding:18px;background:#0c1422;border-radius:12px;white-space:pre-wrap}code{color:#bad2ff}@media(max-width:800px){#panes{grid-template-columns:1fr}header{display:block}}
  </style>
</head>
<body>
  <header><div><small>YJS / SQLITE WAL / TWO PROCESSES</small><h1>双进程 · 持久协同</h1><p>两份独立文档，两个服务端口，同一个持久日志。</p></div><strong id="verdict">等待连接</strong></header>
  <div class="toolbar"><label>Room <input id="room" value="demo" maxlength="64"></label><label>A 端口 <input id="port-a" type="number" value="1234"></label><label>B 端口 <input id="port-b" type="number" value="1235"></label><button id="open" class="primary">连接此房间</button><button id="offline">两边断网</button><button id="online">两边重连</button></div>
  <div id="panes"></div>
  <p>操作：先连接 → 两边断网 → 在两个编辑器分别修改 → 两边重连。压缩后，在运行 <code>npm run demo</code> 的终端输入 <code>r</code>，强制重启两进程并校验重启前后的已提交内容。编辑期间请勿切换房间，以保留未同步的本地修改。</p>
  <h2>操作时间线</h2><pre id="timeline" aria-live="polite"></pre>
  <script type="module" src="/demo.js"></script>
</body>
</html>
