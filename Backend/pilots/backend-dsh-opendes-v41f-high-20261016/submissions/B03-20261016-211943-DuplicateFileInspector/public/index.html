<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>目录重复文件检测器</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>目录重复文件检测器</h1>
      <p class="muted">
        只读扫描：只读取普通文件并计算真实 SHA-256，不删除、不移动、不清理。符号链接与
        junction 会被跳过。单文件上限 8 MiB。
      </p>
    </header>

    <main>
      <section class="card">
        <h2>扫描</h2>
        <div class="row">
          <button id="scan-button" type="button">开始扫描</button>
          <span id="scan-state" class="badge idle">空闲</span>
          <span id="scan-elapsed" class="muted"></span>
        </div>
        <div class="progress">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <dl id="progress-stats" class="stats"></dl>
        <p id="scan-message" class="muted">尚未扫描。</p>
      </section>

      <section class="card">
        <h2>重复文件分组 <span id="group-count" class="muted"></span></h2>
        <p class="muted">
          只有字节完全相同且至少两份的文件才会归组。路径相对扫描根目录，按字典序排序。
        </p>
        <div id="groups"></div>
      </section>

      <section class="card">
        <h2>整体信息</h2>
        <dl id="summary" class="stats"></dl>
        <h3>跳过明细</h3>
        <ul id="errors" class="errors"></ul>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
