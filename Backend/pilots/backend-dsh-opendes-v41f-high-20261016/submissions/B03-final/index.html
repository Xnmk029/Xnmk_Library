<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>目录重复文件检测器</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --line: #d9dde3;
    --text: #1d2129;
    --muted: #5c6470;
    --accent: #1a5fd0;
    --accent-text: #ffffff;
    --warn: #a53b00;
    --ok: #146c43;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --panel: #1f2228;
      --line: #343941;
      --text: #e6e8eb;
      --muted: #a4acb8;
      --accent: #5b9bff;
      --accent-text: #0d1117;
      --warn: #ffb184;
      --ok: #7ee2a8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 64px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  main { max-width: 920px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input[type=text] {
    width: 100%;
    padding: 8px 10px;
    font: 14px/1.4 var(--mono);
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .field-root { flex: 1 1 340px; }
  button {
    padding: 9px 18px;
    font-size: 14px;
    color: var(--accent-text);
    background: var(--accent);
    border: 1px solid transparent;
    border-radius: 6px;
    cursor: pointer;
  }
  button.secondary {
    color: var(--text);
    background: transparent;
    border-color: var(--line);
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .bar {
    height: 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
    margin: 12px 0 8px;
  }
  .bar > i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--accent);
    transition: width .2s ease;
  }
  .status { font-size: 14px; }
  .status.err { color: var(--warn); }
  .status.ok { color: var(--ok); }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px 16px;
    margin-top: 12px;
    font-size: 13px;
  }
  .stats b { font-family: var(--mono); font-weight: 600; }
  .stats span { color: var(--muted); }
  .group {
    border: 1px solid var(--line);
    border-radius: 6px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .group > summary {
    cursor: pointer;
    padding: 10px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 16px;
    align-items: baseline;
    background: var(--bg);
    font-size: 13px;
  }
  .group > summary::marker { color: var(--muted); }
  .hash { font-family: var(--mono); word-break: break-all; }
  .meta { color: var(--muted); }
  .paths { margin: 0; padding: 10px 12px 12px 28px; }
  .paths li { font-family: var(--mono); font-size: 13px; word-break: break-all; }
  .empty { color: var(--muted); font-size: 14px; margin: 0; }
  footer { color: var(--muted); font-size: 12px; text-align: center; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<main>
  <h1>目录重复文件检测器</h1>
  <p class="sub">只读检测：仅扫描根目录内的普通文件，不跟随符号链接与 junction，不删除、不移动、不清理任何文件。</p>

  <section>
    <h2>扫描</h2>
    <form id="scan-form">
      <div class="row">
        <div class="field-root">
          <label for="root">扫描根目录（由启动参数 --root 决定，只读）</label>
          <input type="text" id="root" name="root" readonly autocomplete="off" spellcheck="false" placeholder="启动时使用 --root <工作目录> 指定">
        </div>
        <button type="submit" id="start">启动扫描</button>
        <button type="button" class="secondary" id="refresh">刷新上次结果</button>
      </div>
    </form>
    <div class="bar" aria-hidden="true"><i id="progress"></i></div>
    <p class="status" id="status">尚未扫描。</p>
    <div class="stats" id="stats"></div>
    <p class="hint">扫描为只读操作；并发扫描请求会合并到同一次运行。单文件上限 8 MiB，超过上限或无法读取的文件计入 skipped。</p>
  </section>

  <section>
    <h2>最近一次完整结果</h2>
    <p class="status" id="result-summary">正在读取…</p>
    <div id="groups"></div>
  </section>

  <footer>数据来自本机服务端接口 /api/scan、/api/result；页面不做任何本地缓存。</footer>
</main>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const el = {
    form: $('scan-form'), root: $('root'), start: $('start'), refresh: $('refresh'),
    status: $('status'), stats: $('stats'), progress: $('progress'),
    resultSummary: $('result-summary'), groups: $('groups'),
  };

  let serverRoot = '';
  let polling = false;
  let scanning = false;

  function text(node, value) { node.textContent = value; }

  async function api(pathname, options) {
    const res = await fetch(pathname, Object.assign({ cache: 'no-store' }, options || {}));
    let data = null;
    try { data = await res.json(); } catch { data = null; }
    if (!res.ok) {
      const reason = data && typeof data.error === 'string' ? data.error : ('HTTP ' + res.status);
      throw new Error(reason);
    }
    return data;
  }

  function fmtTime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return Number.isNaN(d.getTime()) ? iso : d.toLocaleString();
  }

  function fmtSize(bytes) {
    if (typeof bytes !== 'number' || bytes < 0) return '—';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KiB';
    return (bytes / (1024 * 1024)).toFixed(2) + ' MiB';
  }

  function stat(label, valueNode) {
    const wrap = document.createElement('div');
    const b = document.createElement('b');
    b.textContent = String(valueNode);
    const s = document.createElement('span');
    s.textContent = ' ' + label;
    wrap.appendChild(b);
    wrap.appendChild(s);
    return wrap;
  }

  function renderStats(s) {
    el.stats.replaceChildren(
      stat('已读取文件（scanned）', s.scanned ?? 0),
      stat('跳过文件（skipped）', s.skipped ?? 0),
      stat('重复分组', s.groupCount ?? 0),
      stat('候选文件', (s.hashed ?? 0) + ' / ' + (s.total ?? 0)),
      stat('无法读取', s.unreadable ?? 0),
      stat('超过 8 MiB', s.oversize ?? 0),
      stat('大小独一份', s.uniqueSize ?? 0),
      stat('内容独一份', s.uniqueHash ?? 0),
    );
  }

  function renderStatusState(s) {
    let line;
    let cls = '';
    if (s.error) {
      line = '上次扫描失败：' + s.error;
      cls = 'err';
    } else if (s.running) {
      line = s.phase === 'walking'
        ? ('正在遍历目录，已发现 ' + (s.files || 0) + ' 个普通文件…')
        : ('正在计算 SHA-256：' + (s.hashed || 0) + ' / ' + (s.total || 0) + '…');
    } else if (s.finishedAt && s.groupCount > 0) {
      line = '上次扫描完成于 ' + fmtTime(s.finishedAt) + '，共 ' + s.groupCount + ' 个重复分组。';
      cls = 'ok';
    } else if (s.finishedAt) {
      line = '上次扫描完成于 ' + fmtTime(s.finishedAt) + '，没有发现重复文件。';
      cls = 'ok';
    } else {
      line = '尚未扫描。';
    }
    el.status.className = 'status ' + cls;
    text(el.status, line);
  }

  function renderProgress(s) {
    let pct = 0;
    if (!s.running) pct = s.finishedAt ? 100 : 0;
    else if (s.phase === 'walking') pct = 8;
    else if (s.total > 0) pct = 8 + Math.round(92 * Math.min(1, (s.hashed || 0) / s.total));
    else pct = 92;
    el.progress.style.width = pct + '%';
  }

  function groupEl(g) {
    const details = document.createElement('details');
    details.className = 'group';
    const summary = document.createElement('summary');

    const size = document.createElement('span');
    size.textContent = fmtSize(g.size);
    const copies = document.createElement('span');
    copies.className = 'meta';
    copies.textContent = g.paths.length + ' 份';
    const hash = document.createElement('span');
    hash.className = 'hash';
    hash.textContent = 'SHA-256 ' + g.sha256;

    summary.append(size, copies, hash);
    details.appendChild(summary);

    const ul = document.createElement('ul');
    ul.className = 'paths';
    for (const p of g.paths) {
      const li = document.createElement('li');
      li.textContent = './' + p;
      ul.appendChild(li);
    }
    details.appendChild(ul);
    return details;
  }

  function renderResult(data) {
    const groups = (data && Array.isArray(data.groups)) ? data.groups : [];
    const scanned = (data && data.scanned) || 0;
    const skipped = (data && data.skipped) || 0;
    el.resultSummary.className = 'status';
    text(el.resultSummary,
      '完成时间 ' + fmtTime(data && data.finishedAt) +
      ' ｜ scanned ' + scanned + ' ｜ skipped ' + skipped +
      ' ｜ 重复分组 ' + groups.length);

    el.groups.replaceChildren();
    if (groups.length === 0) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = '没有重复文件。';
      el.groups.appendChild(p);
      return;
    }
    for (const g of groups) el.groups.appendChild(groupEl(g));
  }

  function resultEmpty(message) {
    el.resultSummary.className = 'status';
    text(el.resultSummary, message);
    el.groups.replaceChildren();
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // 扫描期间轮询 /api/scan 展示真实进度
  async function poll() {
    if (polling) return;
    polling = true;
    try {
      while (scanning) {
        try {
          const s = await api('/api/scan');
          renderStats(s);
          renderStatusState(s);
          renderProgress(s);
        } catch { /* 轮询失败不打断扫描 */ }
        await sleep(400);
      }
    } finally {
      polling = false;
    }
  }

  async function loadStatus() {
    try {
      const s = await api('/api/scan');
      if (s.root) { el.root.value = s.root; serverRoot = s.root; }
      scanning = !!s.running;
      renderStats(s);
      renderStatusState(s);
      renderProgress(s);
      if (s.running) void poll();
      return s;
    } catch (err) {
      el.status.className = 'status err';
      text(el.status, '无法读取扫描状态：' + err.message);
      return null;
    }
  }

  async function loadResult() {
    try {
      const data = await api('/api/result');
      renderResult(data);
    } catch (err) {
      resultEmpty('尚无完整结果：' + err.message);
    }
  }

  async function loadAll() {
    const s = await loadStatus();
    if (!s || !s.running) await loadResult();
    else resultEmpty('扫描进行中，下面是最近一次完整结果（如有）。');
  }

  el.form.addEventListener('submit', async (evt) => {
    evt.preventDefault();
    if (scanning) return;
    scanning = true;
    el.start.disabled = true;
    el.status.className = 'status';
    text(el.status, '正在启动扫描…');
    void poll();

    try {
      const result = await api('/api/scan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}',
      });
      renderResult(Object.assign({ finishedAt: new Date().toISOString() }, result));
      text(el.status, '扫描完成：' + result.groups.length + ' 个重复分组。');
      el.status.className = 'status ok';
      el.progress.style.width = '100%';
    } catch (err) {
      el.status.className = 'status err';
      text(el.status, '扫描失败：' + err.message);
    } finally {
      scanning = false;
      el.start.disabled = false;
      await loadStatus();
      await loadResult();
    }
  });

  el.refresh.addEventListener('click', () => { void loadAll(); });

  void loadAll();
})();
</script>
</body>
</html>
