<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Poolrooms (池核) - 阈限空间模拟器</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030807;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #e0f2fe;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    /* UI Overlay */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
    }
    .vignette-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 55%, rgba(2, 10, 8, 0.75) 100%);
      z-index: 2;
    }
    .hud-title {
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(208, 245, 238, 0.4);
      font-weight: 300;
    }
    .fps-counter {
      font-family: monospace;
      font-size: 12px;
      color: rgba(208, 245, 238, 0.6);
      background: rgba(4, 20, 17, 0.5);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(208, 245, 238, 0.1);
      padding: 6px 12px;
      border-radius: 4px;
    }
    /* Start Screen / Instructions Overlay */
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      background: rgba(3, 10, 8, 0.88);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #start-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .start-card {
      max-width: 540px;
      text-align: center;
      background: rgba(8, 26, 23, 0.6);
      border: 1px solid rgba(208, 245, 238, 0.15);
      border-radius: 12px;
      padding: 40px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(60, 180, 160, 0.05);
    }
    .start-title {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 8px;
      color: #e0f8f3;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .start-subtitle {
      font-size: 12px;
      letter-spacing: 3px;
      color: #60a598;
      margin-bottom: 28px;
    }
    .start-desc {
      font-size: 14px;
      line-height: 1.7;
      color: #94b8b1;
      margin-bottom: 32px;
    }
    .btn-start {
      display: inline-block;
      padding: 12px 36px;
      background: linear-gradient(135deg, rgba(30, 90, 80, 0.8), rgba(15, 50, 45, 0.8));
      border: 1px solid rgba(208, 245, 238, 0.3);
      color: #d0f5ee;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-radius: 6px;
      transition: all 0.3s ease;
    }
    .start-card:hover .btn-start {
      background: linear-gradient(135deg, rgba(40, 120, 105, 0.9), rgba(20, 70, 60, 0.9));
      box-shadow: 0 0 20px rgba(100, 230, 200, 0.2);
    }
    .controls-hint {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 12px;
      color: #527a72;
    }
    .key-badge {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 3px;
      color: #a0ccc2;
    }
  </style>
  <!-- Three.js and PostProcessing standard modules -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="vignette-overlay"></div>

  <div id="ui-layer">
    <div class="hud-title">THE POOLROOMS · LIMINAL SPACE ENGINE</div>
    <div style="display: flex; gap: 10px; align-self: flex-end;">
      <div id="fps-val" class="fps-counter">FPS: --</div>
    </div>
  </div>

  <div id="start-screen">
    <div class="start-card">
      <div class="start-title">POOLROOMS</div>
      <div class="start-subtitle">PROCEDURAL LIMINAL SPACE SIMULATOR</div>
      <p class="start-desc">
        进入无限生成的白瓷砖水池空间。<br>
        建议戴上耳机以体验微弱的空间回声与沉浸感。
      </p>
      <div class="btn-start">点击进入探索</div>
      <div class="controls-hint">
        <span><span class="key-badge">W A S D</span> 移动</span>
        <span><span class="key-badge">鼠标</span> 视角</span>
        <span><span class="key-badge">ESC</span> 释放视角</span>
      </div>
    </div>
  </div>

  <script>
    /**
     * ------------------------------------------------------------------
     * 3D Poolrooms (池核) - 核心引擎架构与着色器管线实现
     * ------------------------------------------------------------------
     */

    // 1. Procedural Texture Generator (生成高质量白瓷砖 PBR 贴图)
    function createTileTextures() {
      const size = 1024;
      
      // Albedo + Dirt Canvas
      const albedoCanvas = document.createElement('canvas');
      albedoCanvas.width = size;
      albedoCanvas.height = size;
      const ctx = albedoCanvas.getContext('2d');

      // Base off-white tile color
      ctx.fillStyle = '#e4ece9';
      ctx.fillRect(0, 0, size, size);

      const tileSize = size / 8; // 8x8 tiles per texture
      const seamSize = 4;

      // Draw Tile Grids & Seams
      ctx.fillStyle = '#687874'; // Darker grout
      for (let i = 0; i <= size; i += tileSize) {
        ctx.fillRect(i - seamSize/2, 0, seamSize, size);
        ctx.fillRect(0, i - seamSize/2, size, seamSize);
      }

      // Add subtle stain gradients & moisture variations
      for (let x = 0; x < size; x += 16) {
        for (let y = 0; y < size; y += 16) {
          const noise = (Math.sin(x * 0.05) * Math.cos(y * 0.05) + Math.random() * 0.2);
          if (noise > 0.3) {
            ctx.fillStyle = `rgba(140, 165, 158, ${noise * 0.08})`;
            ctx.fillRect(x, y, 16, 16);
          }
        }
      }

      const albedoTex = new THREE.CanvasTexture(albedoCanvas);
      albedoTex.wrapS = THREE.RepeatWrapping;
      albedoTex.wrapT = THREE.RepeatWrapping;

      // Roughness Map Canvas (Non-uniform wet spots and high specular variance)
      const roughCanvas = document.createElement('canvas');
      roughCanvas.width = size;
      roughCanvas.height = size;
      const rCtx = roughCanvas.getContext('2d');

      // Base ceramic glossiness (low roughness ~0.2)
      rCtx.fillStyle = 'rgb(50, 50, 50)';
      rCtx.fillRect(0, 0, size, size);

      // Rougher seams (grout)
      rCtx.fillStyle = 'rgb(180, 180, 180)';
      for (let i = 0; i <= size; i += tileSize) {
        rCtx.fillRect(i - seamSize/2, 0, seamSize, size);
        rCtx.fillRect(0, i - seamSize/2, size, seamSize);
      }

      // Water stain high-gloss wet patches (roughness ~0.05)
      for (let i = 0; i < 20; i++) {
        const rx = Math.random() * size;
        const ry = Math.random() * size;
        const rad = 40 + Math.random() * 80;
        const grad = rCtx.createRadialGradient(rx, ry, 5, rx, ry, rad);
        grad.addColorStop(0, 'rgb(10, 10, 10)'); // Ultra wet patch
        grad.addColorStop(1, 'rgba(50, 50, 50, 0)');
        rCtx.fillStyle = grad;
        rCtx.beginPath();
        rCtx.arc(rx, ry, rad, 0, Math.PI * 2);
        rCtx.fill();
      }

      const roughTex = new THREE.CanvasTexture(roughCanvas);
      roughTex.wrapS = THREE.RepeatWrapping;
      roughTex.wrapT = THREE.RepeatWrapping;

      // Normal Map Canvas (Beveled tile edges)
      const normCanvas = document.createElement('canvas');
      normCanvas.width = size;
      normCanvas.height = size;
      const nCtx = normCanvas.getContext('2d');

      // Flat normal (128, 128, 255)
      nCtx.fillStyle = 'rgb(128, 128, 255)';
      nCtx.fillRect(0, 0, size, size);

      // Bevel borders
      for (let x = 0; x < size; x += tileSize) {
        for (let y = 0; y < size; y += tileSize) {
          // Inner tile borders
          nCtx.fillStyle = 'rgb(200, 128, 255)'; // Right edge slope
          nCtx.fillRect(x + tileSize - 4, y, 4, tileSize);
          nCtx.fillStyle = 'rgb(50, 128, 255)'; // Left edge slope
          nCtx.fillRect(x, y, 4, tileSize);
          nCtx.fillStyle = 'rgb(128, 200, 255)'; // Bottom edge slope
          nCtx.fillRect(x, y + tileSize - 4, tileSize, 4);
          nCtx.fillStyle = 'rgb(128, 50, 255)'; // Top edge slope
          nCtx.fillRect(x, y, tileSize, 4);
        }
      }

      const normTex = new THREE.CanvasTexture(normCanvas);
      normTex.wrapS = THREE.RepeatWrapping;
      normTex.wrapT = THREE.RepeatWrapping;

      return { albedoTex, roughTex, normTex };
    }

    // 2. Custom Water Shader Material (Depth Absorption + SSR Distortion + Micro Ripples + Caustics)
    const WaterShader = {
      uniforms: {
        time: { value: 0 },
        waterColorShallow: { value: new THREE.Color(0xb8f3ed) },
        waterColorDeep: { value: new THREE.Color(0x073530) },
        cameraPosition: { value: new THREE.Vector3() },
        normalMap: { value: null }
      },
      vertexShader: `
        varying vec3 vWorldPosition;
        varying vec2 vUv;
        varying vec3 vNormal;
        
        void main() {
          vUv = uv * 12.0;
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPos.xyz;
          vNormal = normalize(normalMatrix * normal);
          gl_Position = projectionMatrix * viewMatrix * worldPos;
        }
      `,
      fragmentShader: `
        uniform float time;
        uniform vec3 waterColorShallow;
        uniform vec3 waterColorDeep;
        uniform vec3 cameraPosition;
        
        varying vec3 vWorldPosition;
        varying vec2 vUv;
        varying vec3 vNormal;

        // Procedural Wave Normal Noise
        vec2 waveNormal(vec2 p, float t) {
          float w1 = sin(p.x * 3.0 + t * 1.5) * cos(p.y * 2.5 + t * 1.2);
          float w2 = cos(p.x * 4.5 - t * 1.8) * sin(p.y * 4.0 + t * 1.6);
          float w3 = sin((p.x + p.y) * 2.0 + t * 0.8);
          return vec2(w1 + w2 + w3) * 0.04;
        }

        // Procedural Caustics Pattern
        float causticsPattern(vec2 p, float t) {
          vec2 p1 = p * 1.5 + vec2(t * 0.3, t * 0.2);
          vec2 p2 = p * 2.2 - vec2(t * 0.25, -t * 0.35);
          float c1 = sin(p1.x + sin(p1.y * 1.3));
          float c2 = cos(p2.y + sin(p2.x * 1.4));
          return pow(clamp(c1 + c2, 0.0, 2.0), 3.0) * 0.15;
        }

        void main() {
          vec3 viewDir = normalize(cameraPosition - vWorldPosition);

          // Micro-ripple perturbation
          vec2 wave = waveNormal(vWorldPosition.xz, time);
          vec3 n = normalize(vNormal + vec3(wave.x, 0.0, wave.y));

          // Fresnel Effect for Water Reflection vs Transmission
          float fresnel = pow(1.0 - max(dot(viewDir, n), 0.0), 4.0);
          fresnel = clamp(fresnel, 0.15, 0.85);

          // Depth-based color gradient (simulated depth = 1.8m)
          float depthFactor = clamp((1.8 - vWorldPosition.y) / 2.5, 0.0, 1.0);
          vec3 baseWaterColor = mix(waterColorShallow, waterColorDeep, depthFactor);

          // Simulated ceiling fluorescent light reflection
          vec3 lightDir = normalize(vec3(0.1, 0.9, 0.2));
          float spec = pow(max(dot(reflect(-lightDir, n), viewDir), 0.0), 64.0);
          vec3 specColor = vec3(0.85, 0.98, 0.95) * spec * 1.8;

          // Animated underwater caustics brightness
          float caustic = causticsPattern(vWorldPosition.xz, time);

          vec3 finalColor = mix(baseWaterColor + vec3(caustic), vec3(0.7, 0.95, 0.9) * 0.8, fresnel) + specColor;

          gl_FragColor = vec4(finalColor, 0.88);
        }
      `
    };

    // 3. Post-Processing Shaders (Chromatic Aberration + Lo-Fi Film Grain Shader)
    const LiminalPostShader = {
      uniforms: {
        tDiffuse: { value: null },
        time: { value: 0 },
        chromaticAmount: { value: 0.0025 },
        grainAmount: { value: 0.035 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float time;
        uniform float chromaticAmount;
        uniform float grainAmount;
        varying vec2 vUv;

        // Pseudo-random noise for film grain
        float rand(vec2 co) {
          return fract(sin(dot(co.xy, vec2(12.9898, 78.233))) * 43758.5453);
        }

        void main() {
          vec2 uv = vUv;
          vec2 distFromCenter = uv - vec2(0.5);
          float dist = length(distFromCenter);

          // Radial Chromatic Aberration
          float r = texture2D(tDiffuse, uv + distFromCenter * chromaticAmount).r;
          float g = texture2D(tDiffuse, uv).g;
          float b = texture2D(tDiffuse, uv - distFromCenter * chromaticAmount).b;
          vec3 color = vec3(r, g, b);

          // Dynamic film grain
          float noise = (rand(uv + time * 0.1) - 0.5) * grainAmount;
          color += noise;

          // Subtle analog camera CRT vignette
          color *= smoothstep(0.8, 0.2, dist * 0.75);

          gl_FragColor = vec4(color, 1.0);
        }
      `
    };

    // ------------------------------------------------------------------
    // Core Engine Setup
    // ------------------------------------------------------------------
    let scene, camera, renderer, composer;
    let controls;
    let clock = new THREE.Clock();
    let waterMaterial, postPass;
    let tilesPBR;

    // Movement state
    const moveState = { forward: false, backward: false, left: false, right: false };
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    let headBobTime = 0;

    // Grid & Chunk Generation System
    const CHUNK_SIZE = 12; // 12x12 grid units per chunk
    const UNIT_SIZE = 3.0; // 3 meters per tile cell
    const loadedChunks = new Map();

    // Sound Synthesizer (Footsteps & Echo Reverb)
    let audioCtx = null;
    let lastStepTime = 0;

    function initAudio() {
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
    }

    function playWetFootstepSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      // Slosh click oscillator
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1200, now);

      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.15);
    }

    function initEngine() {
      const container = document.getElementById('canvas-container');

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.95;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // Scene & Atmospheric Volumetric Fog
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x061412);
      // Exponential Squared Volumetric Fog (Cyan-teal liminal mist)
      scene.fog = new THREE.FogExp2(0x0a221f, 0.035);

      // Camera
      camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.7, 0); // 固定视界高度 1.7m

      // Controls
      controls = new THREE.PointerLockControls(camera, document.body);

      // Lighting System (Enclosed GI & Cold Ceiling Lights)
      const ambientLight = new THREE.AmbientLight(0xd0f5ee, 0.65); // Soft cold bouncing ambient
      scene.add(ambientLight);

      // Materials
      tilesPBR = createTileTextures();
      
      const wallTileMat = new THREE.MeshStandardMaterial({
        map: tilesPBR.albedoTex,
        roughnessMap: tilesPBR.roughTex,
        normalMap: tilesPBR.normTex,
        roughness: 0.2,
        metalness: 0.05
      });
      wallTileMat.map.repeat.set(1, 2);
      wallTileMat.roughnessMap.repeat.set(1, 2);
      wallTileMat.normalMap.repeat.set(1, 2);

      // Custom Water Material
      waterMaterial = new THREE.ShaderMaterial({
        uniforms: THREE.UniformsUtils.clone(WaterShader.uniforms),
        vertexShader: WaterShader.vertexShader,
        fragmentShader: WaterShader.fragmentShader,
        transparent: true,
        side: THREE.DoubleSide
      });

      // Post-Processing Stack (Bloom + Chromatic Aberration + Film Grain)
      composer = new THREE.EffectComposer(renderer);
      const renderPass = new THREE.RenderPass(scene, camera);
      composer.addPass(renderPass);

      // Unreal Bloom Pass (Diffusion bloom for fluorescent lights)
      const bloomPass = new THREE.UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.65, // Strength
        0.8,  // Radius
        0.82  // Threshold
      );
      composer.addPass(bloomPass);

      // Liminal Camera Post Shader
      postPass = new THREE.ShaderPass(LiminalPostShader);
      composer.addPass(postPass);

      // Event Listeners
      setupEvents();

      // Initial Chunks Load around origin
      updateProceduralChunks(0, 0);
    }

    // 4. Procedural Architecture Generator (Wave Function / Grid Maze)
    function generateChunkMesh(chunkX, chunkZ) {
      const group = new THREE.Group();
      group.position.set(chunkX * CHUNK_SIZE * UNIT_SIZE, 0, chunkZ * CHUNK_SIZE * UNIT_SIZE);

      const wallGeo = new THREE.BoxGeometry(UNIT_SIZE, 4.0, UNIT_SIZE);
      const tileMat = new THREE.MeshStandardMaterial({
        map: tilesPBR.albedoTex,
        roughnessMap: tilesPBR.roughTex,
        normalMap: tilesPBR.normTex,
        roughness: 0.18,
        metalness: 0.02
      });

      const ceilLightMat = new THREE.MeshBasicMaterial({
        color: 0xebffff,
        side: THREE.DoubleSide
      });

      // Simple deterministic noise for maze layout based on grid seed
      function getCellType(gx, gz) {
        if (gx === 0 && gz === 0) return 0; // Empty starting pool
        const val = Math.sin(gx * 12.9898 + gz * 78.233) * 43758.5453;
        const rand = val - Math.floor(val);
        if (rand < 0.32) return 1; // Solid Tile Pillar/Wall
        if (rand < 0.45) return 2; // Deep Pool Trench
        return 0; // Shallow Pool Corridor
      }

      // Geometries for Instanced Rendering Optimization
      const wallPositions = [];
      const lightPositions = [];

      for (let x = 0; x < CHUNK_SIZE; x++) {
        for (let z = 0; z < CHUNK_SIZE; z++) {
          const globalX = chunkX * CHUNK_SIZE + x;
          const globalZ = chunkZ * CHUNK_SIZE + z;
          const type = getCellType(globalX, globalZ);

          const px = x * UNIT_SIZE;
          const pz = z * UNIT_SIZE;

          if (type === 1) {
            // Wall / Column
            wallPositions.push(new THREE.Vector3(px, 2.0, pz));
          } else {
            // Ceiling Light (Place every 3 cells)
            if ((globalX % 3 === 0) && (globalZ % 3 === 0)) {
              const lightPanel = new THREE.Mesh(new THREE.PlaneGeometry(UNIT_SIZE * 0.6, UNIT_SIZE * 0.6), ceilLightMat);
              lightPanel.rotation.x = Math.PI / 2;
              lightPanel.position.set(px, 3.98, pz);
              group.add(lightPanel);

              // Soft Area Light for ceiling glow
              const pLight = new THREE.PointLight(0xd0f5ee, 0.8, 12);
              pLight.position.set(px, 3.5, pz);
              group.add(pLight);
            }
          }
        }
      }

      // Build Instanced Walls
      if (wallPositions.length > 0) {
        const instancedWall = new THREE.InstancedMesh(wallGeo, tileMat, wallPositions.length);
        const dummy = new THREE.Object3D();
        wallPositions.forEach((pos, idx) => {
          dummy.position.copy(pos);
          dummy.updateMatrix();
          instancedWall.setMatrixAt(idx, dummy.matrix);
        });
        instancedWall.receiveShadow = true;
        instancedWall.castShadow = true;
        group.add(instancedWall);
      }

      // Continuous Tile Floor & Deep Pool Floors
      const floorGeo = new THREE.PlaneGeometry(CHUNK_SIZE * UNIT_SIZE, CHUNK_SIZE * UNIT_SIZE);
      const floorMesh = new THREE.Mesh(floorGeo, tileMat);
      floorMesh.rotation.x = -Math.PI / 2;
      floorMesh.position.set((CHUNK_SIZE * UNIT_SIZE)/2 - UNIT_SIZE/2, 0, (CHUNK_SIZE * UNIT_SIZE)/2 - UNIT_SIZE/2);
      group.add(floorMesh);

      // Tile Ceiling
      const ceilMesh = new THREE.Mesh(floorGeo, tileMat);
      ceilMesh.rotation.x = Math.PI / 2;
      ceilMesh.position.set((CHUNK_SIZE * UNIT_SIZE)/2 - UNIT_SIZE/2, 4.0, (CHUNK_SIZE * UNIT_SIZE)/2 - UNIT_SIZE/2);
      group.add(ceilMesh);

      // Water Surface Mesh
      const waterGeo = new THREE.PlaneGeometry(CHUNK_SIZE * UNIT_SIZE, CHUNK_SIZE * UNIT_SIZE, 16, 16);
      const waterMesh = new THREE.Mesh(waterGeo, waterMaterial);
      waterMesh.rotation.x = -Math.PI / 2;
      waterMesh.position.set((CHUNK_SIZE * UNIT_SIZE)/2 - UNIT_SIZE/2, 0.45, (CHUNK_SIZE * UNIT_SIZE)/2 - UNIT_SIZE/2);
      group.add(waterMesh);

      return group;
    }

    // Dynamic Chunk Loading/Unloading System
    function updateProceduralChunks(playerChunkX, playerChunkZ) {
      const radius = 2; // Load 5x5 chunks surrounding player
      const activeKeys = new Set();

      for (let dx = -radius; dx <= radius; dx++) {
        for (let dz = -radius; dz <= radius; dz++) {
          const cx = playerChunkX + dx;
          const cz = playerChunkZ + dz;
          const key = `${cx}_${cz}`;
          activeKeys.add(key);

          if (!loadedChunks.has(key)) {
            const chunkGroup = generateChunkMesh(cx, cz);
            scene.add(chunkGroup);
            loadedChunks.set(key, chunkGroup);
          }
        }
      }

      // Unload distant chunks to ensure stable 60FPS
      for (const [key, group] of loadedChunks.entries()) {
        if (!activeKeys.has(key)) {
          scene.remove(group);
          loadedChunks.delete(key);
        }
      }
    }

    // Controls & Interactions
    function setupEvents() {
      const startScreen = document.getElementById('start-screen');
      startScreen.addEventListener('click', () => {
        initAudio();
        controls.lock();
      });

      controls.addEventListener('lock', () => {
        startScreen.classList.add('hidden');
      });

      controls.addEventListener('unlock', () => {
        startScreen.classList.remove('hidden');
      });

      window.addEventListener('keydown', (e) => {
        switch (e.code) {
          case 'KeyW': moveState.forward = true; break;
          case 'KeyS': moveState.backward = true; break;
          case 'KeyA': moveState.left = true; break;
          case 'KeyD': moveState.right = true; break;
        }
      });

      window.addEventListener('keyup', (e) => {
        switch (e.code) {
          case 'KeyW': moveState.forward = false; break;
          case 'KeyS': moveState.backward = false; break;
          case 'KeyA': moveState.left = false; break;
          case 'KeyD': moveState.right = false; break;
        }
      });

      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    }

    // 5. Main Render & Physics Loop
    let lastTime = performance.now();
    let frameCount = 0;
    let lastFpsUpdate = performance.now();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Update FPS counter UI
      frameCount++;
      const now = performance.now();
      if (now - lastFpsUpdate >= 500) {
        const fps = Math.round((frameCount * 1000) / (now - lastFpsUpdate));
        document.getElementById('fps-val').innerText = `FPS: ${fps}`;
        frameCount = 0;
        lastFpsUpdate = now;
      }

      // Update Shaders Uniforms
      if (waterMaterial) {
        waterMaterial.uniforms.time.value = time;
        waterMaterial.uniforms.cameraPosition.value.copy(camera.position);
      }
      if (postPass) {
        postPass.uniforms.time.value = time;
      }

      // FPS Player Movement Physics & Head Bobbing
      if (controls.isLocked) {
        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;

        direction.z = Number(moveState.forward) - Number(moveState.backward);
        direction.x = Number(moveState.right) - Number(moveState.left);
        direction.normalize();

        const speed = 4.2; // Slow liminal movement speed
        if (moveState.forward || moveState.backward) velocity.z -= direction.z * speed * 10.0 * delta;
        if (moveState.left || moveState.right) velocity.x -= direction.x * speed * 10.0 * delta;

        controls.moveRight(-velocity.x * delta);
        controls.moveForward(-velocity.z * delta);

        // Fixed eye height 1.7m with subtle sinusoidal head bobbing
        const isMoving = moveState.forward || moveState.backward || moveState.left || moveState.right;
        if (isMoving) {
          headBobTime += delta * 7.5;
          camera.position.y = 1.7 + Math.sin(headBobTime) * 0.045;

          // Trigger wet footstep audio echo
          if (time - lastStepTime > 0.48) {
            playWetFootstepSound();
            lastStepTime = time;
          }
        } else {
          camera.position.y = THREE.MathUtils.lerp(camera.position.y, 1.7, delta * 5.0);
        }

        // Dynamic Chunk Loading based on Player Grid Position
        const pX = Math.floor(camera.position.x / (CHUNK_SIZE * UNIT_SIZE));
        const pZ = Math.floor(camera.position.z / (CHUNK_SIZE * UNIT_SIZE));
        updateProceduralChunks(pX, pZ);
      }

      // Composer Render Call
      composer.render();
    }

    // Start Engine
    window.addEventListener('DOMContentLoaded', () => {
      initEngine();
      animate();
    });
  </script>
</body>
</html>
