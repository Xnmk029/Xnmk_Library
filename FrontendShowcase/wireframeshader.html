<!--
  WIRE·FRAME — a purely stylized Three.js wireframe shader
  ────────────────────────────────────────────────────────
  Single-file demo. One custom ShaderMaterial renders everything:
  anti-aliased barycentric wire lines, hidden-line fills, fresnel rims,
  pulse rings, hologram scanlines, hemispheric clay shading, distance
  and radial fades. No lights, no textures, no post-processing.

  Six material presets × four scenes show how the same shader adapts.
  Open the console and try:  WF.setMaterial('neon'); WF.setObject('city')
-->

<script type="module">
import * as THREE from 'three';

/* ════════════════════════════════════════════════════════════════════
   1 · THE SHADER
   One material, purely stylized. Everything is a uniform, so any
   "material" here is just a parameter set (see PRESETS below).

   HOW TO REUSE IN YOUR OWN SCENE
     const geo  = wireGeometry(anyBufferGeometry, { quads: true|false });
     const mat  = createWireMaterial(PRESETS.blueprint);   // or your own
     scene.add(new THREE.Mesh(geo, mat));
   · wireGeometry() adds the `aBary` barycentric attribute the shader
     needs; pass { quads:true } for quad-built geometry (Plane, Box,
     Torus, TorusKnot…) to hide triangulation diagonals.
   · Adapting the material = swapping uniforms: line/fill/glow colors,
     opacity, pulse, scan, dots, backDim, hemispheric shade, fades.
   ════════════════════════════════════════════════════════════════════ */

const VERT = /* glsl */`
  uniform float uTime;
  uniform float uBreath;      // organic swell, fraction of bounding radius
  uniform float uRadius;
  attribute vec3 aBary;
  varying vec3 vBary;
  varying vec3 vNv;           // view-space normal   (fresnel)
  varying vec3 vNw;           // world-space normal  (clay shading)
  varying vec3 vVp;           // view-space position
  varying vec3 vWp;           // world-space position

  void main () {
    vBary = aBary;
    vec3 p = position;
    if (uBreath > 0.0) {
      float ph = (position.x * 0.9 + position.y * 1.7 + position.z * 1.2) / max(uRadius, 1e-4);
      p += normal * (uBreath * uRadius * (0.5 + 0.5 * sin(uTime * 1.35 + ph * 3.0)));
    }
    vec4 wp = modelMatrix * vec4(p, 1.0);
    vec4 vp = viewMatrix * wp;
    vWp = wp.xyz;
    vVp = vp.xyz;
    vNv = normalMatrix * normal;
    vNw = normalize(mat3(modelMatrix) * normal);
    gl_Position = projectionMatrix * vp;
  }
`;

const FRAG = /* glsl */`
  uniform float uTime;
  uniform vec3  uLineColor;
  uniform vec3  uFillColor;
  uniform vec3  uGlowColor;   // fresnel rim + pulse tint
  uniform vec3  uFogColor;
  uniform vec3  uLightDir;    // for stylized hemispheric shading
  uniform vec3  uCenter;      // world center of the piece (pulse origin)
  uniform float uLineWidth;   // px
  uniform float uLineOpacity;
  uniform float uFillOpacity;
  uniform float uGlow;        // fresnel strength
  uniform float uGlowPower;
  uniform float uShade;       // 0 flat · 1 hemispheric clay
  uniform float uBackDim;     // back-face multiplier (x-ray depth cue)
  uniform float uPulse;       // travelling radial ring
  uniform float uScan;        // hologram scanlines + flicker
  uniform float uDots;        // vertex dots, px (triangle meshes only)
  uniform float uReveal;      // 0→1 bottom-up construction sweep
  uniform float uRadius;
  uniform vec2  uYRange;      // world-y extent (reveal normalisation)
  uniform vec2  uFog;         // view-distance fade  (near, far)
  uniform vec2  uRadial;      // world-radial fade   (start, end)
  varying vec3 vBary; varying vec3 vNv; varying vec3 vNw;
  varying vec3 vVp;  varying vec3 vWp;

  float hash (float n) { return fract(sin(n) * 43758.5453123); }

  void main () {
    /* wire — anti-aliased distance to triangle edge in barycentric space */
    vec3 d = fwidth(vBary);
    vec3 s = smoothstep(d * (uLineWidth - 0.5), d * (uLineWidth + 0.5), vBary);
    float line = 1.0 - min(min(s.x, s.y), s.z);

    /* vertex dots (ink style) */
    if (uDots > 0.01) {
      float m  = max(max(vBary.x, vBary.y), vBary.z);
      float dm = max(max(d.x, d.y), d.z);
      line = max(line, 1.0 - smoothstep(dm * (uDots - 0.5), dm * (uDots + 0.5), 1.0 - m));
    }

    /* sub-pixel density fade — distant / grazing cells dissolve instead of
       collapsing into moiré mush when triangles get smaller than a pixel */
    line *= 1.0 - smoothstep(0.35, 0.95, max(d.x, max(d.y, d.z)));

    /* fresnel rim */
    vec3 V = normalize(-vVp);
    float fres = pow(clamp(1.0 - abs(dot(normalize(vNv), V)), 0.0, 1.0), uGlowPower);
    float rim  = fres * uGlow;

    /* travelling pulse ring, radial from the piece's center */
    float pulse = 0.0;
    if (uPulse > 0.01) {
      float pr = distance(vWp, uCenter) / max(uRadius, 1e-4);
      float pw = fract(pr * 0.9 - uTime * 0.21);
      pulse = uPulse * smoothstep(0.0, 0.12, pw) * (1.0 - smoothstep(0.12, 0.38, pw));
    }

    /* stylized hemispheric shading (clay) */
    float shadeF = 1.0;
    if (uShade > 0.01) {
      float hemi = 0.5 + 0.5 * dot(vNw, uLightDir);
      shadeF = mix(1.0, 0.42 + 0.68 * hemi, uShade);
    }

    /* compose */
    vec3  lineCol = mix(uLineColor, uGlowColor, clamp(rim * 0.85 + pulse, 0.0, 1.0));
    float lineA   = clamp(uLineOpacity * line * (1.0 + rim * 0.9 + pulse * 1.2), 0.0, 1.0);
    vec3  faceCol = mix(uFillColor * shadeF, uGlowColor, clamp(rim * 0.6, 0.0, 1.0));
    float faceA   = clamp(uFillOpacity + rim * 0.35, 0.0, 1.0);

    vec3  rgb = mix(faceCol, lineCol, line);
    float a   = max(faceA, lineA);

    /* hologram scanlines + flicker */
    if (uScan > 0.01) {
      float sl = 0.72 + 0.28 * sin(vWp.y * 70.0 - uTime * 5.0);
      float fl = 1.0 - uScan * 0.22 * step(0.96, hash(floor(uTime * 13.0)));
      a *= mix(1.0, sl, uScan) * fl;
    }

    /* back faces dimmed → depth cue in transparent styles */
    a *= gl_FrontFacing ? 1.0 : uBackDim;

    /* construction reveal, bottom-up */
    float ny = clamp((vWp.y - uYRange.x) / max(uYRange.y - uYRange.x, 1e-4), 0.0, 1.0);
    a *= smoothstep(ny, ny + 0.22, uReveal * 1.35);

    /* distance fog + radial dissolve */
    float fade = (1.0 - smoothstep(uFog.x, uFog.y, length(vVp)))
               * (1.0 - smoothstep(uRadial.x, uRadial.y, length(vWp.xz)));
    rgb = mix(uFogColor, rgb, fade);
    a  *= fade;

    if (a < 0.004) discard;
    gl_FragColor = vec4(clamp(rgb, 0.0, 1.0), a);
  }
`;

/* ════════════════════════════════════════════════════════════════════
   2 · MATERIAL PRESETS — six looks, one shader
   ════════════════════════════════════════════════════════════════════ */

const PRESETS = {
  blueprint: {
    label: 'BLUEPRINT', bg: '#0a192c', ui: '#a8cfec', acc: '#54a8ff', vig: .48,
    lineColor: '#a5d3f5', lineOpacity: 1.0, lineWidth: 1.0,
    fillColor: '#0e2138', fillOpacity: 1.0, depthWrite: true, additive: false,
    glowColor: '#54a8ff', glow: 0.35, glowPower: 2.6,
    shade: 0, backDim: 1.0, pulse: 0, scan: 0, dots: 0, breath: 0,
    fog: [7, 26], fogColor: '#0a192c',
  },
  ghost: {
    label: 'GHOST', bg: '#0a0b0d', ui: '#e8ecf1', acc: '#ffffff', vig: .55,
    lineColor: '#dfe6ee', lineOpacity: 0.62, lineWidth: 1.0,
    fillColor: '#aebdcd', fillOpacity: 0.05, depthWrite: false, additive: false,
    glowColor: '#ffffff', glow: 1.15, glowPower: 2.4,
    shade: 0, backDim: 0.28, pulse: 0, scan: 0, dots: 0, breath: 0.012,
    fog: [6, 22], fogColor: '#0a0b0d',
  },
  neon: {
    label: 'NEON', bg: '#060310', ui: '#7df9e4', acc: '#ff3ed8', vig: .6,
    lineColor: '#19f5c8', lineOpacity: 0.9, lineWidth: 1.15,
    fillColor: '#000000', fillOpacity: 0.0, depthWrite: false, additive: true,
    glowColor: '#ff3ed8', glow: 1.0, glowPower: 2.0,
    shade: 0, backDim: 0.45, pulse: 0.85, scan: 0, dots: 0, breath: 0,
    fog: [7, 24], fogColor: '#000000',                 // additive: fog to black
  },
  ink: {
    label: 'INK', bg: '#f2efe6', ui: '#26221b', acc: '#26221b', vig: .13,
    lineColor: '#211d16', lineOpacity: 1.0, lineWidth: 1.15,
    fillColor: '#f7f5ee', fillOpacity: 1.0, depthWrite: true, additive: false,
    glowColor: '#8a8474', glow: 0, glowPower: 2.0,
    shade: 0, backDim: 1.0, pulse: 0, scan: 0, dots: 2.4, breath: 0,
    fog: [8, 30], fogColor: '#f2efe6',
  },
  clay: {
    label: 'CLAY', bg: '#d6d2c8', ui: '#3a362e', acc: '#8c5a32', vig: .15,
    lineColor: '#4a453c', lineOpacity: 0.85, lineWidth: 1.0,
    fillColor: '#eae6dc', fillOpacity: 1.0, depthWrite: true, additive: false,
    glowColor: '#8c5a32', glow: 0.12, glowPower: 2.4,
    shade: 0.9, backDim: 1.0, pulse: 0, scan: 0, dots: 0, breath: 0,
    fog: [8, 28], fogColor: '#d6d2c8',
  },
  holo: {
    label: 'HOLOGRAM', bg: '#02070b', ui: '#8fe8ff', acc: '#31d2ff', vig: .55,
    lineColor: '#3fd9ff', lineOpacity: 0.85, lineWidth: 1.0,
    fillColor: '#0a3d52', fillOpacity: 0.16, depthWrite: false, additive: false,
    glowColor: '#bdf3ff', glow: 0.85, glowPower: 2.2,
    shade: 0, backDim: 0.35, pulse: 0.5, scan: 1, dots: 0, breath: 0.008,
    fog: [6, 22], fogColor: '#02070b',
  },
};

function createWireMaterial (p, patch = {}) {
  const o = { ...p, ...patch };
  const mat = new THREE.ShaderMaterial({
    vertexShader: VERT,
    fragmentShader: FRAG,
    uniforms: {
      uTime:        { value: 0 },
      uLineColor:   { value: new THREE.Color(o.lineColor) },
      uFillColor:   { value: new THREE.Color(o.fillColor) },
      uGlowColor:   { value: new THREE.Color(o.glowColor) },
      uFogColor:    { value: new THREE.Color(o.fogColor) },
      uLightDir:    { value: new THREE.Vector3(0.55, 0.9, 0.4).normalize() },
      uCenter:      { value: new THREE.Vector3(...(o.center ?? [0, 0, 0])) },
      uLineWidth:   { value: o.lineWidth },
      uLineOpacity: { value: o.lineOpacity },
      uFillOpacity: { value: o.fillOpacity },
      uGlow:        { value: o.glow },
      uGlowPower:   { value: o.glowPower },
      uShade:       { value: o.shade },
      uBackDim:     { value: o.backDim },
      uPulse:       { value: o.pulse },
      uScan:        { value: o.scan },
      uDots:        { value: o.dots },
      uBreath:      { value: o.breath },
      uReveal:      { value: 1 },
      uRadius:      { value: o.radius ?? 1 },
      uYRange:      { value: new THREE.Vector2(...(o.yRange ?? [-40, 40])) },
      uFog:         { value: new THREE.Vector2(...o.fog) },
      uRadial:      { value: new THREE.Vector2(...(o.radial ?? [1e5, 1e5 + 1])) },
    },
    side: THREE.DoubleSide,
    transparent: true,
    depthWrite: false,                       // enabled after the reveal sweep
    blending: o.additive ? THREE.AdditiveBlending : THREE.NormalBlending,
  });
  mat.userData.wantsDepthWrite = o.depthWrite;
  return mat;
}

/* ════════════════════════════════════════════════════════════════════
   3 · GEOMETRY — barycentric attribute + quad-diagonal removal
   ════════════════════════════════════════════════════════════════════ */

function wireGeometry (src, { quads = false } = {}) {
  const geo = src.index ? src.toNonIndexed() : src.clone();
  if (src !== geo) src.dispose();
  const n = geo.attributes.position.count;
  const bary = new Float32Array(n * 3);
  if (!quads) {
    for (let i = 0; i < n; i += 3) bary.set([1,0,0, 0,1,0, 0,0,1], i * 3);
  } else {
    /* Quad-built geometry arrives as triangle pairs (a,b,d)(b,c,d) sharing
       the diagonal b–d. An edge shows where one barycentric component → 0,
       so we pin that component to 1 along the diagonal and it disappears. */
    for (let i = 0; i + 5 < n; i += 6) {
      bary.set([1,0,0, 1,1,0, 1,0,1], i * 3);        // hide edge v1–v2
      bary.set([1,1,0, 0,1,0, 0,1,1], (i + 3) * 3);  // hide edge v0–v2
    }
    geo.userData.quads = true;
  }
  geo.setAttribute('aBary', new THREE.BufferAttribute(bary, 3));
  return geo;
}

function mergeWireGeos (geos) {
  let total = 0;
  for (const g of geos) total += g.attributes.position.count;
  const out = new THREE.BufferGeometry();
  for (const name of ['position', 'normal', 'aBary']) {
    const arr = new Float32Array(total * 3);
    let off = 0;
    for (const g of geos) { arr.set(g.attributes[name].array, off); off += g.attributes[name].array.length; }
    out.setAttribute(name, new THREE.BufferAttribute(arr, 3));
  }
  out.userData.quads = geos.some(g => g.userData.quads);
  geos.forEach(g => g.dispose());
  return out;
}

/* deterministic helpers — the page renders identically on every load */
let seed = 20260726;
const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
const vhash = (i, j) => { const t = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return t - Math.floor(t); };
function noise2 (x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return vhash(xi, yi) * (1 - u) * (1 - v) + vhash(xi + 1, yi) * u * (1 - v)
       + vhash(xi, yi + 1) * (1 - u) * v   + vhash(xi + 1, yi + 1) * u * v;
}
function fbm (x, y) {
  let a = 0, amp = 0.5, f = 1;
  for (let o = 0; o < 4; o++) { a += amp * noise2(x * f, y * f); amp *= 0.5; f *= 2.03; }
  return a / 0.9375;
}

/* ════════════════════════════════════════════════════════════════════
   4 · SCENES
   ════════════════════════════════════════════════════════════════════ */

function buildTerrain () {
  const g = new THREE.PlaneGeometry(9, 9, 68, 68);
  g.rotateX(-Math.PI / 2);
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    let h = (fbm(x * 0.34 + 11.7, z * 0.34 + 3.2) - 0.5) * 2.0;
    h = Math.sign(h) * Math.pow(Math.abs(h), 1.15) * 1.25;
    pos.setY(i, h);
  }
  g.computeVertexNormals();
  return wireGeometry(g, { quads: true });
}

function buildCity () {
  seed = 20260726;
  const geos = [], N = 9, cell = 1.05, half = (N - 1) / 2;
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const dx = i - half, dz = j - half;
    if (rnd() < 0.24) continue;                                  // vacant lots
    const bias = Math.max(0, 1 - Math.hypot(dx, dz) / (half * 1.25));
    const h = 0.35 + Math.pow(rnd(), 1.7) * (0.8 + 3.0 * bias);
    const w = 0.58 + rnd() * 0.2;
    const g = new THREE.BoxGeometry(w, h, w, 1, Math.max(1, Math.round(h / 0.55)), 1);
    g.translate(dx * cell + (rnd() - 0.5) * 0.12, h / 2, dz * cell + (rnd() - 0.5) * 0.12);
    geos.push(wireGeometry(g, { quads: true }));
  }
  return mergeWireGeos(geos);
}

const OBJECTS = {
  knot:    { label: 'TORUS KNOT', breath: true,  spin: 0.14,
             cam: { r: 5.2, phi: 1.12, ty: 0 },     groundY: -1.85, groundSpin: false,
             build: () => wireGeometry(new THREE.TorusKnotGeometry(0.95, 0.3, 220, 28), { quads: true }) },
  sphere:  { label: 'ICOSPHERE',  breath: true,  spin: 0.10,
             cam: { r: 4.7, phi: 1.15, ty: 0 },     groundY: -1.85, groundSpin: false,
             build: () => wireGeometry(new THREE.IcosahedronGeometry(1.35, 2)) },
  terrain: { label: 'TERRAIN',    breath: false, spin: 0.045, fogMul: 1.35,
             cam: { r: 8.6, phi: 1.06, ty: -0.25 }, groundY: null,
             radial: [3.0, 4.4], build: buildTerrain },
  city:    { label: 'CITY',       breath: false, spin: 0.07,  fogMul: 1.35,
             cam: { r: 12.6, phi: 0.98, ty: 0.35 }, groundY: 0.002, groundSpin: true,
             ground: { size: 26.25, seg: 25 },      // cell 1.05 → aligned streets
             build: buildCity },
};

/* ════════════════════════════════════════════════════════════════════
   5 · APP
   ════════════════════════════════════════════════════════════════════ */

THREE.ColorManagement.enabled = false;   // stylized pipeline: raw colors as authored

const state = {
  material: 'blueprint',
  object:   'knot',
  spin: true,
  speed: 1,
  tweak: null,          // { line, fill, glow, pulse } — live slider values
};

let renderer, scene, camera, spinGroup, staticGroup;
let objMesh = null, groundMesh = null, liveMats = [];
let simT = 0, revealT0 = 0, lastNow = 0;
const bgCur = new THREE.Color(PRESETS.blueprint.bg);
const bgTarget = bgCur.clone();

function init () {
  renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('view'),
    antialias: true, powerPreference: 'high-performance',
  });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(bgCur);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 120);
  spinGroup = new THREE.Group();
  staticGroup = new THREE.Group();
  scene.add(spinGroup, staticGroup);

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

/* ── orbit — tiny damped camera, drag / wheel / pinch ──────────────── */
const orbit = {
  theta: 0.55, phi: 1.12, r: 5.2, ty: 0,
  cur: { theta: 0.55 - 0.9, phi: 1.3, r: 8.5, ty: 0 },   // start pulled back → eases in
};
function setupOrbit (canvas) {
  const ptrs = new Map();
  let pinchD = 0;
  canvas.addEventListener('pointerdown', e => { ptrs.set(e.pointerId, [e.clientX, e.clientY]); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointerup',   e => ptrs.delete(e.pointerId));
  canvas.addEventListener('pointercancel', e => ptrs.delete(e.pointerId));
  canvas.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    const prev = ptrs.get(e.pointerId);
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptrs.size === 1) {
      orbit.theta -= (e.clientX - prev[0]) * 0.005;
      orbit.phi    = Math.min(1.52, Math.max(0.12, orbit.phi - (e.clientY - prev[1]) * 0.005));
    } else if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (pinchD > 0) orbit.r = Math.min(18, Math.max(2.2, orbit.r * pinchD / d));
      pinchD = d;
    }
  });
  canvas.addEventListener('pointerup', () => { pinchD = 0; });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    orbit.r = Math.min(18, Math.max(2.2, orbit.r * Math.exp(e.deltaY * 0.001)));
  }, { passive: false });
}
function updateCamera (dt) {
  const c = orbit.cur, k = 1 - Math.exp(-dt * 4.5);
  c.theta += (orbit.theta - c.theta) * k;
  c.phi   += (orbit.phi   - c.phi)   * k;
  c.r     += (orbit.r     - c.r)     * k;
  c.ty    += (orbit.ty    - c.ty)    * k;
  const sp = Math.sin(c.phi);
  camera.position.set(c.r * sp * Math.sin(c.theta), c.r * Math.cos(c.phi), c.r * sp * Math.cos(c.theta));
  camera.position.y += c.ty;
  camera.lookAt(0, c.ty, 0);
}

/* ── scene / material wiring ───────────────────────────────────────── */
function disposeMesh (m) {
  if (!m) return;
  m.parent?.remove(m);
  m.geometry.dispose();
  m.material.dispose();
}

function rebuildScene () {
  disposeMesh(objMesh); disposeMesh(groundMesh);
  objMesh = groundMesh = null;
  spinGroup.rotation.y = 0;

  const def = OBJECTS[state.object];
  objMesh = new THREE.Mesh(def.build());
  spinGroup.add(objMesh);

  if (def.groundY !== null) {
    const gs = def.ground ?? { size: 26, seg: 26 };
    const g = wireGeometry(new THREE.PlaneGeometry(gs.size, gs.size, gs.seg, gs.seg).rotateX(-Math.PI / 2), { quads: true });
    groundMesh = new THREE.Mesh(g);
    groundMesh.position.y = def.groundY;
    (def.groundSpin ? spinGroup : staticGroup).add(groundMesh);
  }

  const cam = def.cam;
  orbit.r = cam.r; orbit.phi = cam.phi; orbit.ty = cam.ty;

  applyMaterials();
}

function applyMaterials () {
  const p = PRESETS[state.material];
  const def = OBJECTS[state.object];
  liveMats.forEach(m => m.dispose());
  liveMats = [];

  /* metrics of the piece, for reveal / pulse / breath normalisation */
  const bb = new THREE.Box3().setFromObject(objMesh);
  const sph = bb.getBoundingSphere(new THREE.Sphere());
  const fogMul = def.fogMul ?? 1;

  objMesh.material = createWireMaterial(p, {
    radius: sph.radius,
    center: [0, (bb.min.y + bb.max.y) / 2, 0],
    yRange: [bb.min.y, bb.max.y],
    radial: def.radial,
    fog: [p.fog[0] * fogMul, p.fog[1] * fogMul],
    dots:   objMesh.geometry.userData.quads ? 0 : p.dots,
    breath: def.breath ? p.breath : 0,
  });
  liveMats.push(objMesh.material);

  if (groundMesh) {
    groundMesh.material = createWireMaterial(p, {
      lineOpacity: p.lineOpacity * 0.32, lineWidth: 1,
      fillOpacity: 0, glow: 0, shade: 0, dots: 0, breath: 0,
      pulse: p.pulse * 0.25, scan: p.scan * 0.4,
      depthWrite: false, backDim: 1,
      radial: [4.5, 8.0],
      fog: [p.fog[0] * fogMul, p.fog[1] * fogMul],
    });
    liveMats.push(groundMesh.material);
  }

  applyTweaks();
  revealT0 = lastNow;                     // run the construction sweep
  bgTarget.set(p.bg);
  setUiTheme(p);
}

function applyTweaks () {
  const t = state.tweak, u = objMesh.material.uniforms;
  u.uLineWidth.value   = t.line;
  u.uFillOpacity.value = t.fill;
  u.uGlow.value        = t.glow;
  u.uPulse.value       = t.pulse;
}

function setUiTheme (p) {
  const rs = document.documentElement.style;
  rs.setProperty('--bg', p.bg);
  rs.setProperty('--ink', p.ui);
  rs.setProperty('--acc', p.acc);
  document.getElementById('vig').style.opacity = p.vig;
}

/* ── minimal UI ────────────────────────────────────────────────────── */
const SLIDERS = [
  { key: 'line',  label: 'LINE',  min: 0.5, max: 3,   step: 0.05 },
  { key: 'fill',  label: 'FILL',  min: 0,   max: 1,   step: 0.01 },
  { key: 'glow',  label: 'GLOW',  min: 0,   max: 1.6, step: 0.02 },
  { key: 'pulse', label: 'PULSE', min: 0,   max: 1,   step: 0.02 },
  { key: 'speed', label: 'SPEED', min: 0,   max: 2.5, step: 0.05 },
];

function defaultsFor (p) {
  return { line: p.lineWidth, fill: p.fillOpacity, glow: p.glow, pulse: p.pulse };
}

function buildUi () {
  const mats = document.getElementById('matChips');
  const objs = document.getElementById('objChips');
  for (const [k, p] of Object.entries(PRESETS)) {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = p.label; b.dataset.k = k;
    b.onclick = () => setMaterial(k);
    mats.appendChild(b);
  }
  for (const [k, o] of Object.entries(OBJECTS)) {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = o.label; b.dataset.k = k;
    b.onclick = () => setObject(k);
    objs.appendChild(b);
  }

  const holder = document.getElementById('sliders');
  for (const s of SLIDERS) {
    const row = document.createElement('div'); row.className = 'srow';
    row.innerHTML = `<span>${s.label}</span>
      <input type="range" id="sl_${s.key}" min="${s.min}" max="${s.max}" step="${s.step}">
      <span class="val" id="v_${s.key}"></span>`;
    holder.appendChild(row);
    row.querySelector('input').addEventListener('input', e => {
      const v = parseFloat(e.target.value);
      if (s.key === 'speed') state.speed = v;
      else { state.tweak[s.key] = v; applyTweaks(); }
      document.getElementById('v_' + s.key).textContent = v.toFixed(2);
    });
  }

  document.getElementById('spinBtn').onclick = toggleSpin;

  addEventListener('keydown', e => {
    if (e.repeat) return;
    const mk = Object.keys(PRESETS), ok = Object.keys(OBJECTS);
    const i = '123456'.indexOf(e.key), j = '7890'.indexOf(e.key);
    if (i >= 0 && mk[i]) setMaterial(mk[i]);
    else if (j >= 0 && ok[j]) setObject(ok[j]);
    else if (e.key === ' ') { e.preventDefault(); toggleSpin(); }
  });
}

function syncUi () {
  for (const b of document.querySelectorAll('#matChips .chip')) b.classList.toggle('on', b.dataset.k === state.material);
  for (const b of document.querySelectorAll('#objChips .chip')) b.classList.toggle('on', b.dataset.k === state.object);
  const all = { ...state.tweak, speed: state.speed };
  for (const s of SLIDERS) {
    document.getElementById('sl_' + s.key).value = all[s.key];
    document.getElementById('v_' + s.key).textContent = all[s.key].toFixed(2);
  }
}

function toggleSpin () {
  state.spin = !state.spin;
  document.getElementById('spinBtn').classList.toggle('on', state.spin);
}

function setMaterial (k) {
  if (!PRESETS[k]) return;
  state.material = k;
  state.tweak = defaultsFor(PRESETS[k]);
  applyMaterials();
  syncUi();
}

function setObject (k) {
  if (!OBJECTS[k]) return;
  state.object = k;
  rebuildScene();
  syncUi();
}

/* ── frame loop ────────────────────────────────────────────────────── */
const clock = new THREE.Clock();
let frames = 0;

function tick () {
  requestAnimationFrame(tick);
  const rawDt = clock.getDelta();            // wall time: camera / bg easing
  const dt = Math.min(rawDt, 0.05);          // clamped:   animation stepping
  lastNow = clock.elapsedTime;
  simT += dt * state.speed;

  if (state.spin && objMesh) {
    spinGroup.rotation.y += dt * state.speed * OBJECTS[state.object].spin;
  }

  const r = Math.min(1, (lastNow - revealT0) / 1.15);
  const reveal = 1 - Math.pow(1 - r, 3);
  for (const m of liveMats) {
    m.uniforms.uTime.value = simT;
    m.uniforms.uReveal.value = reveal;
    m.depthWrite = m.userData.wantsDepthWrite && reveal >= 1 && state.tweak.fill > 0.55;
  }

  bgCur.lerp(bgTarget, 1 - Math.exp(-rawDt * 5));
  renderer.setClearColor(bgCur);

  updateCamera(rawDt);
  renderer.render(scene, camera);
  frames++; WF.frames = frames; WF.ready = true;
}

/* ── boot ──────────────────────────────────────────────────────────── */
const WF = { ready: false, frames: 0, setMaterial, setObject, state, PRESETS, OBJECTS };
window.WF = WF;

try {
  init();
  setupOrbit(renderer.domElement);
  buildUi();
  state.tweak = defaultsFor(PRESETS[state.material]);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { state.speed = 0; state.spin = false; document.getElementById('spinBtn').classList.remove('on'); }
  rebuildScene();
  syncUi();
  tick();
} catch (err) {
  const el = document.getElementById('err');
  el.style.display = 'grid';
  el.textContent = 'WEBGL UNAVAILABLE — ' + err.message;
  throw err;
}
</script>
</body>
</html>
