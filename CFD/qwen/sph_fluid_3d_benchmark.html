<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>SPH 3D Fluid Dynamics Benchmark</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#141414;color:#8a8a8a;font:11px/1.6 'Consolas','Courier New',monospace}
#cv{position:fixed;inset:0}
.pn{position:fixed;background:rgba(16,16,16,0.94);border:1px solid #2a2a2a;padding:14px 16px;z-index:10;user-select:none}
#st{top:16px;left:16px;min-width:210px}
#ct{top:16px;right:16px;width:226px}
.tt{font-size:10px;letter-spacing:3px;color:#4a4a4a;border-bottom:1px solid #2a2a2a;padding-bottom:6px;margin-bottom:10px;text-transform:uppercase}
.rw{display:flex;justify-content:space-between;padding:2px 0}
.lb{color:#4a4a4a}.vl{color:#b0b0b0;font-variant-numeric:tabular-nums}
.hl{color:#c8c8c8}
.sp{border-top:1px solid #222;margin:8px 0}
button{display:block;width:100%;background:#1a1a1a;border:1px solid #2e2e2e;color:#7a7a7a;
padding:7px 0;font:11px 'Consolas',monospace;cursor:pointer;letter-spacing:2px;margin-bottom:10px;transition:background .1s}
button:hover{background:#242424;color:#b0b0b0}button:active{background:#2a2a2a}
.sg{margin-bottom:10px}
.sh{display:flex;justify-content:space-between;font-size:10px;margin-bottom:3px}
.sh .lb{color:#4a4a4a}.sh .vl{color:#9a9a9a}
input[type=range]{-webkit-appearance:none;width:100%;height:2px;background:#2a2a2a;outline:none;margin:4px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:14px;background:#5a5a5a;cursor:pointer;border:none}
input[type=range]::-moz-range-thumb{width:8px;height:14px;background:#5a5a5a;cursor:pointer;border:none;border-radius:0}
</style>
</head>
<body>
<div id="cv"></div>
<div id="st" class="pn">
<div class="tt">Performance Monitor</div>
<div class="rw"><span class="lb">FPS</span><span class="vl" id="dFps">--</span></div>
<div class="rw"><span class="lb">PARTICLES</span><span class="vl" id="dCnt">--</span></div>
<div class="rw"><span class="lb">PHYSICS</span><span class="vl" id="dPhy">-- ms</span></div>
<div class="sp"></div>
<div class="rw"><span class="lb">SUBSTEPS</span><span class="vl">3</span></div>
<div class="rw"><span class="lb">INTEGRATOR</span><span class="vl">SYMPL. EULER</span></div>
<div class="rw"><span class="lb">KERNEL</span><span class="vl">P6 / SP / VL</span></div>
</div>
<div id="ct" class="pn">
<div class="tt">Simulation Control</div>
<button id="bRst">RESET FLUID STATE</button>
<div class="sg">
<div class="sh"><span class="lb">GRAVITY</span><span class="vl" id="vG">9.81</span></div>
<input type="range" id="sG" min="0" max="30" step="0.1" value="9.81">
</div>
<div class="sg">
<div class="sh"><span class="lb">VISCOSITY</span><span class="vl" id="vV">50</span></div>
<input type="range" id="sV" min="0" max="500" step="1" value="50">
</div>
<div class="sg">
<div class="sh"><span class="lb">STIFFNESS</span><span class="vl" id="vK">200</span></div>
<input type="range" id="sK" min="10" max="2000" step="10" value="200">
</div>
<div class="sp"></div>
<div class="sg">
<div class="sh"><span class="lb">PARTICLE COUNT</span><span class="vl" id="vN">2000</span></div>
<input type="range" id="sN" min="500" max="4000" step="100" value="2000">
</div>
<button id="bApp">APPLY &amp; REBUILD</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var BOX=2.0,HF=1.0,SR=0.28,MASS=1.0,RHO0=80.0,DT=0.002,SUB=3,MXV=10.0,WD=0.35,WF=0.92;
var gv=9.81,vi=50.0,kk=200.0,NP=2000;
var h2=SR*SR,p6C=315.0/(64.0*Math.PI*Math.pow(SR,9));
var spC=-45.0/(Math.PI*Math.pow(SR,6));
var vlC=45.0/(Math.PI*Math.pow(SR,6));
var px,py,pz,vx,vy,vz,ax_,ay_,az_,dn,pr;
var gMap,gHd,gNx,cCnt,gDim;
function initGrid(){
gDim=Math.ceil(BOX*2/SR)+2;cCnt=gDim*gDim*gDim;
gMap=new Int32Array(cCnt);gHd=new Int32Array(cCnt);gNx=new Int32Array(NP+500);
}
function initParts(){
px=new Float32Array(NP);py=new Float32Array(NP);pz=new Float32Array(NP);
vx=new Float32Array(NP);vy=new Float32Array(NP);vz=new Float32Array(NP);
ax_=new Float32Array(NP);ay_=new Float32Array(NP);az_=new Float32Array(NP);
dn=new Float32Array(NP);pr=new Float32Array(NP);
var sx=BOX*1.7,sy=BOX*0.55,sz=BOX*1.7;
var sp=Math.pow(sx*sy*sz/NP,1/3);
var nx=Math.max(1,Math.floor(sx/sp)),nz=Math.max(1,Math.floor(sz/sp)),ny=Math.max(1,Math.ceil(NP/(nx*nz)));
var rsy=ny*sp;if(rsy>BOX*1.8){ny=Math.floor(BOX*1.8/sp);ny=Math.max(1,ny)}
var idx=0;
for(var iy=0;iy<ny&&idx<NP;iy++)
for(var ix=0;ix<nx&&idx<NP;ix++)
for(var iz=0;iz<nz&&idx<NP;iz++,idx++){
px[idx]=-sx/2+(ix+0.5)*sp+(Math.random()-0.5)*sp*0.08;
py[idx]=-HF+0.08+(iy+0.5)*sp+(Math.random()-0.5)*sp*0.08;
pz[idx]=-sz/2+(iz+0.5)*sp+(Math.random()-0.5)*sp*0.08;
vx[idx]=vy[idx]=vz[idx]=0;
}}
function buildGrid(){
gMap.fill(-1);
for(var i=0;i<NP;i++){
var cx=((px[i]+HF)/SR)|0,cy=((py[i]+HF)/SR)|0,cz=((pz[i]+HF)/SR)|0;
cx=cx<0?0:cx>=gDim?gDim-1:cx;cy=cy<0?0:cy>=gDim?gDim-1:cy;cz=cz<0?0:cz>=gDim?gDim-1:cz;
var c=cx+cy*gDim+cz*gDim*gDim;gNx[i]=gMap[c];gMap[c]=i;
}}
function solve(){
buildGrid();
var i,j,cx,cy,cz,x0,x1,y0,y1,z0,z1,ci,ddx,ddy,ddz,r2,q,o1;
for(i=0;i<NP;i++){
dn[i]=0;
cx=((px[i]+HF)/SR)|0;cy=((py[i]+HF)/SR)|0;cz=((pz[i]+HF)/SR)|0;
x0=cx>0?cx-1:0;x1=cx<gDim-1?cx+1:gDim-1;
y0=cy>0?cy-1:0;y1=cy<gDim-1?cy+1:gDim-1;
z0=cz>0?cz-1:0;z1=cz<gDim-1?cz+1:gDim-1;
for(ci=x0;ci<=x1;ci++)for(cy=y0;cy<=y1;cy++)for(cz=z0;cz<=z1;cz++){
j=gMap[ci+cy*gDim+cz*gDim*gDim];
while(j!==-1){
ddx=px[i]-px[j];ddy=py[i]-py[j];ddz=pz[i]-pz[j];
r2=ddx*ddx+ddy*ddy+ddz*ddz;
if(r2<h2){q=1-r2/h2;dn[i]+=MASS*p6C*q*q*q}
j=gNx[j];
}}
if(dn[i]<0.01)dn[i]=0.01;
pr[i]=kk*dn[i]*dn[i];
}
for(i=0;i<NP;i++){
ax_[i]=0;ay_[i]=-gv;az_[i]=0;
cx=((px[i]+HF)/SR)|0;cy=((py[i]+HF)/SR)|0;cz=((pz[i]+HF)/SR)|0;
x0=cx>0?cx-1:0;x1=cx<gDim-1?cx+1:gDim-1;
y0=cy>0?cy-1:0;y1=cy<gDim-1?cy+1:gDim-1;
z0=cz>0?cz-1:0;z1=cz<gDim-1?cz+1:gDim-1;
for(ci=x0;ci<=x1;ci++)for(cy=y0;cy<=y1;cy++)for(cz=z0;cz<=z1;cz++){
j=gMap[ci+cy*gDim+cz*gDim*gDim];
while(j!==-1){
if(j!==i){
ddx=px[i]-px[j];ddy=py[i]-py[j];ddz=pz[i]-pz[j];
r2=ddx*ddx+ddy*ddy+ddz*ddz;
if(r2<h2&&r2>1e-10){
var rr=Math.sqrt(r2),df=SR-rr;
var invR=1/rr,nx_=ddx*invR,ny_=ddy*invR,nz_=ddz*invR;
var pt=pr[i]/(dn[i]*dn[i])+pr[j]/(dn[j]*dn[j]);
var gm=spC*df*df;
ax_[i]+=-MASS*pt*gm*nx_;ay_[i]+=-MASS*pt*gm*ny_;az_[i]+=-MASS*pt*gm*nz_;
var rh=dn[j]>0.001?dn[j]:0.001;
var lp=vlC*df;
o1=MASS*vi*dn[i]/rh*lp;
ax_[i]+=o1*(vx[j]-vx[i])/dn[i];
ay_[i]+=o1*(vy[j]-vy[i])/dn[i];
az_[i]+=o1*(vz[j]-vz[i])/dn[i];
}}
j=gNx[j];
}}}
for(i=0;i<NP;i++){
vx[i]+=ax_[i]*DT;vy[i]+=ay_[i]*DT;vz[i]+=az_[i]*DT;
var spd2=vx[i]*vx[i]+vy[i]*vy[i]+vz[i]*vz[i];
if(spd2>MXV*MXV){var sc=MXV/Math.sqrt(spd2);vx[i]*=sc;vy[i]*=sc;vz[i]*=sc}
px[i]+=vx[i]*DT;py[i]+=vy[i]*DT;pz[i]+=vz[i]*DT;
var w=HF-0.005;
if(px[i]<-w){px[i]=-w;vx[i]*=-WD;vy[i]*=WF;vz[i]*=WF}
if(px[i]>w){px[i]=w;vx[i]*=-WD;vy[i]*=WF;vz[i]*=WF}
if(py[i]<-w){py[i]=-w;vy[i]*=-WD;vx[i]*=WF;vz[i]*=WF}
if(py[i]>w){py[i]=w;vy[i]*=-WD;vx[i]*=WF;vz[i]*=WF}
if(pz[i]<-w){pz[i]=-w;vz[i]*=-WD;vx[i]*=WF;vy[i]*=WF}
if(pz[i]>w){pz[i]=w;vz[i]*=-WD;vx[i]*=WF;vy[i]*=WF}
}}
var scene,cam,ren,pts,posA,colA;
var sph={theta:0.6,phi:1.05,r:5.8,drag:0,lx:0,ly:0};
function initScene(){
scene=new THREE.Scene();
cam=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,100);
updCam();
ren=new THREE.WebGLRenderer({antialias:true,alpha:false});
ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));
ren.setClearColor(0x141414);
document.getElementById('cv').appendChild(ren.domElement);
scene.add(new THREE.AmbientLight(0x505050));
var dl=new THREE.DirectionalLight(0xffffff,0.5);dl.position.set(4,6,3);scene.add(dl);
var eg=new THREE.EdgesGeometry(new THREE.BoxGeometry(BOX*2,BOX*2,BOX*2));
scene.add(new THREE.LineSegments(eg,new THREE.LineBasicMaterial({color:0x3a3a3a})));
var fm=new THREE.MeshBasicMaterial({color:0x2a4a5a,transparent:true,opacity:0.045,side:THREE.DoubleSide,depthWrite:false});
scene.add(new THREE.Mesh(new THREE.BoxGeometry(BOX*2,BOX*2,BOX*2),fm));
var gr=new THREE.GridHelper(BOX*2,8,0x222222,0x1c1c1c);gr.position.y=-HF;scene.add(gr);
var bg=new THREE.BufferGeometry();
posA=new THREE.BufferAttribute(new Float32Array(NP*3),3);
colA=new THREE.BufferAttribute(new Float32Array(NP*3),3);
bg.setAttribute('position',posA);bg.setAttribute('color',colA);
var pm=new THREE.PointsMaterial({size:3.5,vertexColors:true,sizeAttenuation:true,transparent:true,opacity:0.88});
pts=new THREE.Points(bg,pm);scene.add(pts);
var el=ren.domElement;
el.addEventListener('mousedown',function(e){sph.drag=1;sph.lx=e.clientX;sph.ly=e.clientY});
addEventListener('mouseup',function(){sph.drag=0});
addEventListener('mousemove',function(e){
if(!sph.drag)return;
sph.theta-=(e.clientX-sph.lx)*0.006;
sph.phi=Math.max(0.15,Math.min(Math.PI-0.15,sph.phi+(e.clientY-sph.ly)*0.006));
sph.lx=e.clientX;sph.ly=e.clientY;updCam();
});
el.addEventListener('wheel',function(e){sph.r=Math.max(2.5,Math.min(14,sph.r+e.deltaY*0.006));updCam();e.preventDefault()},{passive:false});
addEventListener('resize',function(){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
}
function updCam(){
cam.position.set(sph.r*Math.sin(sph.phi)*Math.sin(sph.theta),sph.r*Math.cos(sph.phi),sph.r*Math.sin(sph.phi)*Math.cos(sph.theta));
cam.lookAt(0,-0.15,0);
}
function mapCol(i,a){
var spd=Math.sqrt(vx[i]*vx[i]+vy[i]*vy[i]+vz[i]*vz[i]);
var t=spd/5.5;if(t>1)t=1;
var i3=i*3;
if(t<0.45){var s=t/0.45;a[i3]=0.03+s*0.07;a[i3+1]=0.08+s*0.52;a[i3+2]=0.32+s*0.48}
else{var s=(t-0.45)/0.55;a[i3]=0.10+s*0.65;a[i3+1]=0.60+s*0.35;a[i3+2]=0.80+s*0.20}
}
var fC=0,fT=performance.now(),cFps=0,cPhy=0;
document.getElementById('dCnt').textContent=NP;
function loop(){
requestAnimationFrame(loop);
var t0=performance.now();
for(var s=0;s<SUB;s++)solve();
cPhy=performance.now()-t0;
var pa=posA.array,ca=colA.array;
for(var i=0;i<NP;i++){
var i3=i*3;pa[i3]=px[i];pa[i3+1]=py[i];pa[i3+2]=pz[i];mapCol(i,ca);
}
posA.needsUpdate=true;colA.needsUpdate=true;
fC++;var now=performance.now();
if(now-fT>=500){
cFps=Math.round(fC*1000/(now-fT));fC=0;fT=now;
document.getElementById('dFps').textContent=cFps;
document.getElementById('dPhy').textContent=cPhy.toFixed(1)+' ms';
document.getElementById('dCnt').textContent=NP;
}
ren.render(scene,cam);
}
function bind(){
document.getElementById('bRst').onclick=function(){initParts()};
document.getElementById('sG').oninput=function(){gv=+this.value;document.getElementById('vG').textContent=(+this.value).toFixed(1)};
document.getElementById('sV').oninput=function(){vi=+this.value;document.getElementById('vV').textContent=this.value};
document.getElementById('sK').oninput=function(){kk=+this.value;document.getElementById('vK').textContent=this.value};
document.getElementById('sN').oninput=function(){document.getElementById('vN').textContent=this.value};
document.getElementById('bApp').onclick=function(){
var nv=+document.getElementById('sN').value;
scene.remove(pts);pts.geometry.dispose();pts.material.dispose();
NP=nv;initGrid();initParts();
var bg=new THREE.BufferGeometry();
posA=new THREE.BufferAttribute(new Float32Array(NP*3),3);
colA=new THREE.BufferAttribute(new Float32Array(NP*3),3);
bg.setAttribute('position',posA);bg.setAttribute('color',colA);
var pm=new THREE.PointsMaterial({size:3.5,vertexColors:true,sizeAttenuation:true,transparent:true,opacity:0.88});
pts=new THREE.Points(bg,pm);scene.add(pts);
};
}
initGrid();initParts();initScene();bind();loop();
})();
</script>
</body>
</html>
