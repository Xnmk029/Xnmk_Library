<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>深渊熔炉 // 2048 x Roguelike</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08090b;--panel:#0e1014;--panel-hi:#131519;--border:#1a1d24;--border-hi:#262a34;
  --text:#b0b8c8;--text-dim:#4a5060;--text-bright:#e8ecf4;
  --amber:#c87f0a;--amber-hi:#f0a020;--amber-dim:#7a5008;
  --red:#b03020;--red-hi:#e04838;--green:#20a050;--green-hi:#30d070;
  --blue:#2878b8;--purple:#7838a8;--cyan:#18a088;
  --cell:#101218;--cell-border:#1a1e26;
  --font:'Cascadia Code','Consolas','SF Mono','JetBrains Mono',monospace;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--text);-webkit-font-smoothing:antialiased}
#app{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}

/* Ambient background grid */
#app::before{content:'';position:absolute;inset:0;background:
  repeating-linear-gradient(0deg,transparent,transparent 59px,rgba(30,34,44,0.3) 59px,rgba(30,34,44,0.3) 60px),
  repeating-linear-gradient(90deg,transparent,transparent 59px,rgba(30,34,44,0.3) 59px,rgba(30,34,44,0.3) 60px);
  pointer-events:none;opacity:0.4}

/* HEADER HUD */
#hud{width:460px;max-width:94vw;display:flex;justify-content:space-between;align-items:stretch;margin-bottom:6px;gap:4px}
.hud-box{background:var(--panel);border:1px solid var(--border);padding:5px 10px;flex:1;text-align:center;position:relative;overflow:hidden}
.hud-box::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--border-hi),transparent)}
.hud-label{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);margin-bottom:1px}
.hud-value{font-size:15px;font-weight:700;color:var(--text-bright);transition:transform 0.15s}
.hud-value.amber{color:var(--amber-hi)}
.hud-value.red{color:var(--red-hi)}
.hud-value.green{color:var(--green-hi)}
.hud-bump{animation:hudBump 0.2s ease}
@keyframes hudBump{50%{transform:scale(1.2)}}

/* HP BAR */
#hp-bar-wrap{width:460px;max-width:94vw;height:5px;background:var(--panel);border:1px solid var(--border);margin-bottom:6px;position:relative;overflow:hidden}
#hp-bar{position:relative;height:100%;background:var(--green);width:100%;transition:width 0.5s cubic-bezier(0.22,1,0.36,1),background-color 0.5s}
#hp-bar.low{background:var(--red)}
#hp-bar.mid{background:var(--amber)}
#hp-bar-ghost{position:absolute;top:0;left:0;height:100%;background:rgba(224,72,56,0.4);width:100%;transition:width 1.2s ease 0.3s}

/* ENEMY PANEL */
#enemy-panel{width:460px;max-width:94vw;background:var(--panel);border:1px solid var(--border);margin-bottom:6px;padding:7px 12px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden}
#enemy-panel::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(176,48,32,0.03),transparent);pointer-events:none}
#enemy-icon{width:28px;height:28px;border:1px solid var(--border-hi);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--red-hi);background:var(--cell)}
#enemy-info{flex:1}
#enemy-name{font-size:10px;font-weight:700;color:var(--red-hi);letter-spacing:1.5px}
#enemy-hp-text{font-size:8px;color:var(--text-dim);margin-top:1px}
#enemy-hp-wrap{height:4px;background:#140a0c;border:1px solid #241418;margin-top:3px;position:relative;overflow:hidden}
#enemy-hp-bar{height:100%;background:var(--red);width:100%;transition:width 0.35s cubic-bezier(0.22,1,0.36,1)}
#enemy-timer-box{text-align:center;min-width:40px}
#enemy-timer{font-size:22px;font-weight:700;color:var(--amber-hi);line-height:1}
#enemy-timer-label{font-size:7px;color:var(--text-dim);letter-spacing:1.5px;margin-top:1px}
#enemy-timer.danger{color:var(--red-hi);animation:timerPulse 0.5s ease infinite}
@keyframes timerPulse{50%{opacity:0.5}}
.enemy-hit{animation:enemyHit 0.25s ease}
@keyframes enemyHit{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}}

/* BOARD */
#board-wrap{position:relative;width:460px;height:460px;max-width:94vw;max-height:94vw}
#board{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:7px;background:var(--panel);border:1px solid var(--border)}
.cell{background:var(--cell);border:1px solid var(--cell-border);position:relative}
.cell::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at center,rgba(200,127,10,0.02),transparent);pointer-events:none}
#tile-layer{position:absolute;inset:7px;pointer-events:none}
.tile{position:absolute;top:0;left:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:var(--text-bright);border:1px solid var(--border-hi);will-change:transform;user-select:none;line-height:1}
.tile-inner{display:flex;align-items:center;justify-content:center;width:100%;height:100%}

/* PARTICLE CANVAS */
#particles{position:absolute;inset:0;pointer-events:none;z-index:100}

/* RELIC BAR */
#relic-bar{width:460px;max-width:94vw;margin-top:6px;display:flex;gap:3px;flex-wrap:wrap;min-height:20px;align-items:center}
.relic-tag{font-size:8px;padding:2px 5px;border:1px solid var(--border-hi);letter-spacing:0.5px;background:var(--panel);white-space:nowrap}
.relic-tag.fire{color:var(--red-hi);border-color:rgba(224,72,56,0.3)}
.relic-tag.ice{color:var(--blue);border-color:rgba(40,120,184,0.3)}
.relic-tag.thunder{color:var(--amber-hi);border-color:rgba(240,160,32,0.3)}
.relic-tag.void{color:var(--purple);border-color:rgba(120,56,168,0.3)}

/* DEPTH + LOG */
#bottom-bar{width:460px;max-width:94vw;margin-top:5px;display:flex;align-items:center;gap:8px}
#depth-track{flex:1;height:2px;background:var(--panel);border:1px solid var(--border);position:relative;overflow:hidden}
#depth-progress{height:100%;background:var(--amber);width:0%;transition:width 0.5s cubic-bezier(0.22,1,0.36,1)}
#depth-label{font-size:8px;color:var(--text-dim);letter-spacing:1px;white-space:nowrap}
#log{width:460px;max-width:94vw;margin-top:4px;height:14px;overflow:hidden}
#log-text{font-size:8px;color:var(--text-dim);letter-spacing:0.5px;opacity:0;transition:opacity 0.3s}

/* OVERLAYS */
.overlay{position:fixed;inset:0;background:rgba(4,5,7,0.94);display:none;align-items:center;justify-content:center;z-index:1000;flex-direction:column;backdrop-filter:blur(2px)}
.overlay.active{display:flex}
.overlay-title{font-size:13px;letter-spacing:4px;color:var(--text-bright);margin-bottom:14px;text-transform:uppercase;font-weight:700}
.overlay-sub{font-size:10px;color:var(--text-dim);margin-bottom:20px;text-align:center;line-height:1.8;max-width:360px}

/* RELIC SELECTION */
#relic-choices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.relic-card{width:130px;padding:12px 8px;background:var(--panel);border:1px solid var(--border);cursor:pointer;text-align:center;transition:border-color 0.2s,transform 0.15s,background 0.2s}
.relic-card:hover{border-color:var(--amber);transform:translateY(-2px);background:var(--panel-hi)}
.relic-card:active{transform:translateY(0) scale(0.97)}
.relic-card .rc-school{font-size:7px;letter-spacing:2px;text-transform:uppercase;margin-bottom:5px}
.relic-card .rc-name{font-size:11px;font-weight:700;color:var(--text-bright);margin-bottom:5px}
.relic-card .rc-desc{font-size:8px;color:var(--text-dim);line-height:1.5}
.school-fire .rc-school{color:var(--red-hi)}
.school-ice .rc-school{color:var(--blue)}
.school-thunder .rc-school{color:var(--amber-hi)}
.school-void .rc-school{color:var(--purple)}

/* DEATH SCREEN */
#death-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:20px}
.death-stat{background:var(--panel);border:1px solid var(--border);padding:8px 10px;text-align:center}
.death-stat .ds-val{font-size:16px;font-weight:700;color:var(--amber-hi)}
.death-stat .ds-label{font-size:7px;color:var(--text-dim);letter-spacing:1px;margin-top:2px}
.btn-action{padding:9px 28px;background:transparent;border:1px solid var(--amber);color:var(--amber-hi);font-family:var(--font);font-size:11px;letter-spacing:2px;cursor:pointer;transition:background 0.2s,color 0.2s,transform 0.1s}
.btn-action:hover{background:var(--amber);color:var(--bg)}
.btn-action:active{transform:scale(0.96)}

/* START SCREEN */
#start-screen .overlay-title{font-size:18px;color:var(--amber-hi);letter-spacing:6px}

/* COMBO POPUP */
#combo-popup{position:absolute;top:45%;left:50%;font-size:24px;font-weight:700;color:var(--amber-hi);pointer-events:none;opacity:0;z-index:200;letter-spacing:2px}

/* DAMAGE FLASH */
#damage-flash{position:fixed;inset:0;pointer-events:none;z-index:999;opacity:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(176,48,32,0.35) 100%)}

/* HEAL FLASH */
#heal-flash{position:fixed;inset:0;pointer-events:none;z-index:999;opacity:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(32,160,80,0.2) 100%)}

/* SCREEN SHAKE */
.shake{animation:screenShake 0.25s ease}
@keyframes screenShake{0%,100%{transform:translate(0)}15%{transform:translate(-2px,1px)}35%{transform:translate(2px,-1px)}55%{transform:translate(-1px,2px)}75%{transform:translate(1px,-1px)}}
.shake-heavy{animation:screenShakeHeavy 0.35s ease}
@keyframes screenShakeHeavy{0%,100%{transform:translate(0)}10%{transform:translate(-5px,3px)}25%{transform:translate(5px,-3px)}40%{transform:translate(-4px,4px)}55%{transform:translate(4px,-2px)}70%{transform:translate(-3px,2px)}85%{transform:translate(2px,-1px)}}

/* KILL FLASH */
.kill-flash{animation:killFlash 0.6s ease}
@keyframes killFlash{0%{box-shadow:inset 0 0 40px rgba(200,127,10,0.3)}100%{box-shadow:none}}

/* FORGE GLOW - intensifies with combo */
#forge-glow{position:absolute;inset:0;pointer-events:none;z-index:50;opacity:0;background:radial-gradient(circle at center,rgba(200,127,10,0.08),transparent 70%);transition:opacity 0.5s}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hud-box"><div class="hud-label">分数</div><div class="hud-value amber" id="hud-score">0</div></div>
    <div class="hud-box"><div class="hud-label">深度</div><div class="hud-value" id="hud-depth">1</div></div>
    <div class="hud-box"><div class="hud-label">回合</div><div class="hud-value" id="hud-turns">0</div></div>
    <div class="hud-box"><div class="hud-label">生命</div><div class="hud-value green" id="hud-hp">100</div></div>
  </div>
  <div id="hp-bar-wrap"><div id="hp-bar-ghost"></div><div id="hp-bar"></div></div>
  <div id="enemy-panel">
    <div id="enemy-icon">&#9670;</div>
    <div id="enemy-info">
      <div id="enemy-name">锈蚀史莱姆</div>
      <div id="enemy-hp-text">60 / 60</div>
      <div id="enemy-hp-wrap"><div id="enemy-hp-bar"></div></div>
    </div>
    <div id="enemy-timer-box">
      <div id="enemy-timer">5</div>
      <div id="enemy-timer-label">攻击倒计时</div>
    </div>
  </div>
  <div id="board-wrap">
    <div id="board"></div>
    <div id="tile-layer"></div>
    <div id="forge-glow"></div>
    <canvas id="particles"></canvas>
    <div id="combo-popup"></div>
  </div>
  <div id="relic-bar"></div>
  <div id="bottom-bar">
    <div id="depth-label">深度 1 // 0%</div>
    <div id="depth-track"><div id="depth-progress"></div></div>
  </div>
  <div id="log"><div id="log-text"></div></div>
</div>

<div id="damage-flash"></div>
<div id="heal-flash"></div>

<!-- START -->
<div class="overlay active" id="start-screen">
  <div class="overlay-title">深渊熔炉</div>
  <div class="overlay-sub">
    ABYSS FORGE // 2048 x ROGUELIKE<br><br>
    合并矿石，锻造伤害，击杀深渊生物。<br>
    每次击杀后选择遗物，构建你的流派。<br>
    敌人会在倒计时归零时攻击你。<br>
    生命归零，熔炉熄灭。<br><br>
    [方向键 / WASD / 滑动操作]
  </div>
  <button class="btn-action" id="btn-start">点燃熔炉</button>
</div>

<!-- RELIC SELECT -->
<div class="overlay" id="relic-screen">
  <div class="overlay-title">获得遗物</div>
  <div class="overlay-sub">击杀确认 // 选择一项遗物强化熔炉</div>
  <div id="relic-choices"></div>
</div>

<!-- DEATH -->
<div class="overlay" id="death-screen">
  <div class="overlay-title" style="color:var(--red-hi)">熔炉熄灭</div>
  <div class="overlay-sub">深渊吞噬了一切。</div>
  <div id="death-stats"></div>
  <button class="btn-action" id="btn-restart">重新点燃</button>
</div>

<script>
'use strict';
/* ═══════════════════════════════════════════════════
   ABYSS FORGE — 2048 x Roguelike
   Single-file game with GSAP animation pipeline
   ═══════════════════════════════════════════════════ */

// ─── CONSTANTS ───
const SIZE = 4;
const GAP = 7;
const SLIDE_DUR = 0.13;
const MERGE_DUR = 0.2;

// ─── TILE PALETTE ───
const TILE_BG = {
  2:'#141824',4:'#161e30',8:'#241808',16:'#301e08',
  32:'#3c2408',64:'#482c08',128:'#2c1430',256:'#381a3c',
  512:'#143030',1024:'#1e3c1e',2048:'#3c3c14',4096:'#3c1414'
};
const TILE_FG = {
  2:'#6a7080',4:'#7a8aa0',8:'#c87f0a',16:'#e89818',
  32:'#d06818',64:'#e87828',128:'#a850a8',256:'#c060c0',
  512:'#30b090',1024:'#50c050',2048:'#c0c030',4096:'#e03030'
};

// ─── ENEMIES ───
const ENEMIES = [
  {name:'锈蚀史莱姆',   hp:50,  atk:8, timer:5, icon:'\u25C7'},
  {name:'熔渣巨像',     hp:110, atk:13,timer:5, icon:'\u25A0'},
  {name:'炽焰亡魂',     hp:190, atk:19,timer:4, icon:'\u25B2'},
  {name:'虚空哨卫',     hp:300, atk:26,timer:4, icon:'\u25C6'},
  {name:'深渊执政官',   hp:460, atk:35,timer:3, icon:'\u2605'},
  {name:'熵裂之颚',     hp:700, atk:46,timer:3, icon:'\u2736'},
  {name:'虚无泰坦',     hp:1050,atk:60,timer:3, icon:'\u2726'},
  {name:'熔炉吞噬者',   hp:1500,atk:80,timer:2, icon:'\u2738'},
];

// ─── RELICS ───
const RELICS = [
  {id:'f1',school:'fire',schoolZh:'烈焰',name:'余烬核心',desc:'合并伤害 +30%'},
  {id:'f2',school:'fire',schoolZh:'烈焰',name:'岩浆脉络',desc:'每次合并附加 10 灼烧'},
  {id:'f3',school:'fire',schoolZh:'烈焰',name:'爆裂引爆',desc:'合并值>=64 时溅射 50% 伤害'},
  {id:'i1',school:'ice',schoolZh:'寒冰',name:'霜冻甲片',desc:'敌人攻击间隔 +1'},
  {id:'i2',school:'ice',schoolZh:'寒冰',name:'冰川外壳',desc:'每次合并 +3 护盾'},
  {id:'i3',school:'ice',schoolZh:'寒冰',name:'绝对零度',desc:'敌人生命<25% 时冻结 1 回合'},
  {id:'t1',school:'thunder',schoolZh:'雷霆',name:'弧光导体',desc:'15% 暴击 (2倍伤害)'},
  {id:'t2',school:'thunder',schoolZh:'雷霆',name:'连锁闪电',desc:'20% 连锁 (额外 50% 伤害)'},
  {id:'t3',school:'thunder',schoolZh:'雷霆',name:'过载充能',desc:'连击>=3 时伤害 x2'},
  {id:'v1',school:'void',schoolZh:'虚空',name:'虚无步',desc:'20% 跳过敌人计时'},
  {id:'v2',school:'void',schoolZh:'虚空',name:'熵能虹吸',desc:'每次合并恢复 2 生命'},
  {id:'v3',school:'void',schoolZh:'虚空',name:'裂隙撕裂',desc:'每 6 回合消除最低值方块'},
];

// ─── STATE ───
let G = null;
let tileEls = new Map();
let uid = 0;
let tileW = 0, tileH = 0;
let particles = [];
let audioCtx = null;

function freshState(){
  return {
    grid: Array.from({length:SIZE},()=>Array(SIZE).fill(null)),
    score:0, depth:1, turns:0, hp:100, maxHp:100, shield:0,
    combo:0, maxCombo:0, merges:0, dmgTotal:0, kills:0,
    relics:[], enemy:null, eTimer:0, eMaxTimer:0, frozen:false,
    running:false, busy:false
  };
}

// ─── DOM ───
const $ = id => document.getElementById(id);
const boardEl = $('board'), tileLayer = $('tile-layer'), cvs = $('particles');
const ctx = cvs.getContext('2d');

// ─── AUDIO (tiny synth SFX) ───
function initAudio(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
}
function playTone(freq, dur, type='square', vol=0.06){
  if(!audioCtx) return;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type=type; osc.frequency.value=freq;
  gain.gain.setValueAtTime(vol,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime+dur);
}
function sfxMove(){ playTone(220,0.06,'sine',0.03); }
function sfxMerge(val){ playTone(300+Math.min(val,2048)/4,0.12,'square',0.05); }
function sfxHit(){ playTone(120,0.15,'sawtooth',0.06); }
function sfxKill(){ playTone(520,0.3,'square',0.07); setTimeout(()=>playTone(660,0.3,'square',0.06),100); }
function sfxDeath(){ playTone(80,0.6,'sawtooth',0.08); }

// ─── BOARD INIT ───
function initBoard(){
  boardEl.innerHTML='';
  for(let i=0;i<SIZE*SIZE;i++){
    const c=document.createElement('div'); c.className='cell'; boardEl.appendChild(c);
  }
  const rect=boardEl.getBoundingClientRect();
  const inner=rect.width-14; // padding 7*2
  tileW=tileH=(inner-GAP*(SIZE-1))/SIZE;
  cvs.width=rect.width; cvs.height=rect.height;
}

function pos(r,c){ return { x: c*(tileW+GAP), y: r*(tileH+GAP) }; }

// ─── TILE ELEMENT ───
function makeTileEl(tile, spawn){
  const el=document.createElement('div');
  el.className='tile';
  el.style.width=tileW+'px'; el.style.height=tileH+'px';
  styleTile(el, tile.val);
  const p=pos(tile.r,tile.c);
  gsap.set(el,{x:p.x, y:p.y});
  if(spawn){
    gsap.fromTo(el,{scale:0,opacity:0},{scale:1,opacity:1,duration:0.22,ease:'back.out(2.5)'});
  }
  tileLayer.appendChild(el);
  tileEls.set(tile.id, el);
  tile.el=el;
  return el;
}

function styleTile(el,val){
  el.style.background=TILE_BG[val]||'#3c1414';
  el.style.color=TILE_FG[val]||'#e03030';
  el.style.fontSize=val>=1024?'15px':val>=128?'17px':'20px';
  el.style.borderColor=val>=128?'rgba(200,127,10,0.35)':'var(--border-hi)';
  el.textContent=val;
}

function killTileEl(tile){
  const el=tileEls.get(tile.id);
  if(el){ el.remove(); tileEls.delete(tile.id); }
}

// ─── SPAWN ───
function emptyCells(){
  const out=[];
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(!G.grid[r][c]) out.push({r,c});
  return out;
}

function spawnTile(){
  const cells=emptyCells();
  if(!cells.length) return null;
  const {r,c}=cells[(Math.random()*cells.length)|0];
  const val=Math.random()<0.88?2:4;
  const t={id:++uid, val, r, c};
  G.grid[r][c]=t;
  makeTileEl(t, true);
  return t;
}

// ─── MOVE LOGIC ───
function move(dir){
  if(G.busy||!G.running) return;
  initAudio();
  const vec={up:[-1,0],down:[1,0],left:[0,-1],right:[0,1]}[dir];
  const [dr,dc]=vec;
  const rows=[...Array(SIZE).keys()], cols=[...Array(SIZE).keys()];
  if(dr===1) rows.reverse();
  if(dc===1) cols.reverse();

  let moved=false;
  const anims=[];
  const merged=new Set();
  let turnDmg=0, mergeCnt=0;

  for(const r of rows) for(const c of cols){
    const tile=G.grid[r][c];
    if(!tile) continue;
    let nr=r, nc=c;
    while(true){
      const tr=nr+dr, tc=nc+dc;
      if(tr<0||tr>=SIZE||tc<0||tc>=SIZE) break;
      if(G.grid[tr][tc]){
        if(G.grid[tr][tc].val===tile.val && !merged.has(G.grid[tr][tc].id)){ nr=tr; nc=tc; }
        break;
      }
      nr=tr; nc=tc;
    }
    if(nr===r&&nc===c) continue;
    moved=true;
    G.grid[r][c]=null;
    const target=G.grid[nr][nc];
    if(target && target.val===tile.val){
      merged.add(target.id);
      const nv=tile.val*2;
      G.score+=nv;
      mergeCnt++;
      let dmg=calcDamage(nv);
      turnDmg+=dmg;
      anims.push({tile, from:{r,c}, to:{r:nr,c:nc}, target, nv, dmg});
      G.grid[nr][nc]={id:++uid, val:nv, r:nr, c:nc};
    } else {
      G.grid[nr][nc]=tile;
      tile.r=nr; tile.c=nc;
      anims.push({tile, from:{r,c}, to:{r:nr,c:nc}, target:null});
    }
  }

  if(!moved) return;
  G.busy=true;
  G.turns++;
  if(mergeCnt>0){ G.combo++; G.maxCombo=Math.max(G.maxCombo,G.combo); G.merges+=mergeCnt; sfxMerge(anims.find(a=>a.nv)?.nv||4); }
  else { G.combo=0; sfxMove(); }

  runAnimations(anims, ()=>{
    if(turnDmg>0) hitEnemy(turnDmg);
    applyTurnRelics(mergeCnt);
    tickEnemy();
    spawnTile();
    if(emptyCells().length>2 && Math.random()<0.12) spawnTile();
    // Deadlock: board full, no merges possible → enemy free attack
    if(!hasMoves()){
      log('棋盘锁定 // 敌人获得额外攻击');
      tickEnemy();
    }
    if(G.hp<=0){ gameOver(); return; }
    updateHUD();
    G.busy=false;
  });
}

function hasMoves(){
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    if(!G.grid[r][c]) return true;
    const v=G.grid[r][c].val;
    if(c<SIZE-1&&G.grid[r][c+1]&&G.grid[r][c+1].val===v) return true;
    if(r<SIZE-1&&G.grid[r+1][c]&&G.grid[r+1][c].val===v) return true;
  }
  return false;
}

function calcDamage(mergeVal){
  let d=mergeVal;
  for(const rl of G.relics){
    if(rl.id==='f1') d+=mergeVal*0.3;
    if(rl.id==='f2') d+=10;
    if(rl.id==='f3'&&mergeVal>=64) d+=mergeVal*0.5;
    if(rl.id==='t1'&&Math.random()<0.15){ d*=2; popup('暴击'); }
    if(rl.id==='t2'&&Math.random()<0.2) d+=mergeVal*0.5;
    if(rl.id==='t3'&&G.combo>=3) d*=2;
  }
  return Math.round(d);
}

function applyTurnRelics(mc){
  if(mc<=0) return;
  let healed=false;
  for(const rl of G.relics){
    if(rl.id==='i2') G.shield+=3*mc;
    if(rl.id==='v2'){ G.hp=Math.min(G.maxHp,G.hp+2*mc); healed=true; }
  }
  if(healed) flashHeal();
  // Rift tear
  if(G.relics.some(r=>r.id==='v3') && G.turns%6===0) riftTear();
}

function riftTear(){
  let low=null;
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    const t=G.grid[r][c];
    if(t&&(!low||t.val<low.val)) low=t;
  }
  if(!low) return;
  G.grid[low.r][low.c]=null;
  const el=tileEls.get(low.id);
  if(el){
    burst(low.c*(tileW+GAP)+tileW/2+7, low.r*(tileH+GAP)+tileH/2+7, '#7838a8', 10);
    gsap.to(el,{scale:0,opacity:0,duration:0.2,onComplete:()=>el.remove()});
    tileEls.delete(low.id);
  }
  log('裂隙撕裂 // 虚空吞噬了一个方块');
}

// ─── ANIMATION PIPELINE ───
function runAnimations(anims, done){
  if(!anims.length){ done(); return; }
  let pending=anims.length;
  const fin=()=>{ if(--pending<=0) done(); };

  for(const a of anims){
    const el=tileEls.get(a.tile.id);
    if(!el){ fin(); continue; }
    const tp=pos(a.to.r, a.to.c);

    gsap.to(el,{
      x:tp.x, y:tp.y, duration:SLIDE_DUR, ease:'power2.out',
      onComplete(){
        if(a.target){
          killTileEl(a.tile);
          killTileEl(a.target);
          const nt=G.grid[a.to.r][a.to.c];
          if(nt){
            const nel=makeTileEl(nt, false);
            // Squash-stretch merge pop
            gsap.fromTo(nel,
              {scaleX:1.3,scaleY:0.7},
              {scaleX:1,scaleY:1,duration:MERGE_DUR,ease:'elastic.out(1.2,0.5)'}
            );
            // Particles
            const px=tp.x+tileW/2+7, py=tp.y+tileH/2+7;
            burst(px, py, TILE_FG[a.nv]||'#f0a020', Math.min(24, 6+a.nv/8));
            // Shake
            if(a.nv>=64) shake(a.nv>=256?'heavy':'light');
            // Combo popup
            if(G.combo>=2) popup('x'+G.combo);
          }
        }
        fin();
      }
    });
  }
}

function shake(level){
  const w=$('board-wrap');
  w.classList.remove('shake','shake-heavy');
  void w.offsetWidth;
  w.classList.add(level==='heavy'?'shake-heavy':'shake');
  setTimeout(()=>w.classList.remove('shake','shake-heavy'),400);
}

function popup(txt){
  const el=$('combo-popup');
  el.textContent=txt;
  gsap.killTweensOf(el);
  gsap.fromTo(el,
    {opacity:1,scale:0.6,xPercent:-50,yPercent:-50,y:0},
    {opacity:0,scale:1.3,xPercent:-50,yPercent:-50,y:-25,duration:0.7,ease:'power2.out'}
  );
}

// ─── PARTICLES ───
function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    const sp=2+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,decay:0.025+Math.random()*0.025,size:1.5+Math.random()*3,color});
  }
}

function particleLoop(){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life-=p.decay;
    if(p.life<=0){ particles.splice(i,1); continue; }
    ctx.globalAlpha=p.life*0.9;
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(particleLoop);
}

// ─── ENEMY ───
function spawnEnemy(){
  const idx=Math.min(G.depth-1, ENEMIES.length-1);
  const d=ENEMIES[idx];
  const scale=1+Math.max(0,G.depth-ENEMIES.length)*0.6;
  const atkScale=1+Math.max(0,G.depth-ENEMIES.length)*0.35;
  G.enemy={
    name:d.name, icon:d.icon,
    hp:Math.round(d.hp*scale), maxHp:Math.round(d.hp*scale),
    atk:Math.round(d.atk*atkScale),
    timer:d.timer
  };
  // Ice relic: +1 timer
  if(G.relics.some(r=>r.id==='i1')) G.enemy.timer+=1;
  G.eTimer=G.enemy.timer;
  G.eMaxTimer=G.enemy.timer;
  G.frozen=false;
  updateEnemyUI();
}

function hitEnemy(dmg){
  if(!G.enemy||G.enemy.hp<=0) return;
  G.enemy.hp=Math.max(0,G.enemy.hp-dmg);
  G.dmgTotal+=dmg;
  sfxHit();
  // Panel shake
  const ep=$('enemy-panel');
  ep.classList.remove('enemy-hit'); void ep.offsetWidth; ep.classList.add('enemy-hit');
  // Freeze check
  if(G.relics.some(r=>r.id==='i3') && G.enemy.hp>0 && G.enemy.hp/G.enemy.maxHp<=0.25 && !G.frozen){
    G.frozen=true; log('绝对零度 // 敌人冻结');
  }
  if(G.enemy.hp<=0) killEnemy();
  updateEnemyUI();
}

function killEnemy(){
  G.kills++;
  sfxKill();
  log(G.enemy.name+' 已击杀');
  shake('heavy');
  burst(cvs.width/2, cvs.height/2, '#f0a020', 50);
  const bw=$('board-wrap');
  bw.classList.remove('kill-flash'); void bw.offsetWidth; bw.classList.add('kill-flash');
  G.depth++;
  G.running=false;
  setTimeout(showRelicPick, 700);
}

function tickEnemy(){
  if(!G.enemy||G.enemy.hp<=0) return;
  // Void skip
  if(G.relics.some(r=>r.id==='v1') && Math.random()<0.2){
    log('虚无步 // 时间扭曲'); return;
  }
  if(G.frozen){ G.frozen=false; log('敌人解冻'); return; }
  G.eTimer--;
  if(G.eTimer<=0){
    let dmg=G.enemy.atk;
    if(G.shield>0){
      const abs=Math.min(G.shield,dmg);
      G.shield-=abs; dmg-=abs;
      if(abs>0) log('护盾吸收 '+abs);
    }
    if(dmg>0){
      G.hp-=dmg;
      flashDamage();
      shake('heavy');
      log(G.enemy.name+' 攻击 // -'+dmg+' 生命');
    }
    G.eTimer=G.eMaxTimer;
  }
  updateEnemyUI();
}

function flashDamage(){
  gsap.killTweensOf($('damage-flash'));
  gsap.fromTo($('damage-flash'),{opacity:0.9},{opacity:0,duration:0.5,ease:'power2.out'});
}
function flashHeal(){
  gsap.killTweensOf($('heal-flash'));
  gsap.fromTo($('heal-flash'),{opacity:0.6},{opacity:0,duration:0.4,ease:'power2.out'});
}

// ─── RELIC PICK ───
function showRelicPick(){
  const screen=$('relic-screen'), box=$('relic-choices');
  box.innerHTML='';
  const owned=new Set(G.relics.map(r=>r.id));
  let pool=RELICS.filter(r=>!owned.has(r.id));
  if(pool.length<3) pool=RELICS.filter(r=>!owned.has(r.id)||true); // allow re-picks if exhausted
  const picks=[];
  const p2=[...pool];
  while(picks.length<3&&p2.length) picks.push(p2.splice((Math.random()*p2.length)|0,1)[0]);
  while(picks.length<3) picks.push(RELICS[(Math.random()*RELICS.length)|0]);

  for(const rl of picks){
    const card=document.createElement('div');
    card.className='relic-card school-'+rl.school;
    card.innerHTML=`<div class="rc-school">${rl.schoolZh}</div><div class="rc-name">${rl.name}</div><div class="rc-desc">${rl.desc}</div>`;
    card.onclick=()=>{
      initAudio();
      playTone(440,0.15,'sine',0.05);
      G.relics.push(rl);
      screen.classList.remove('active');
      updateRelicBar();
      log('遗物获取 // '+rl.name);
      spawnEnemy();
      G.running=true;
      updateHUD();
    };
    box.appendChild(card);
  }
  screen.classList.add('active');
}

function updateRelicBar(){
  const bar=$('relic-bar');
  bar.innerHTML='';
  for(const r of G.relics){
    const t=document.createElement('span');
    t.className='relic-tag '+r.school;
    t.textContent=r.name;
    bar.appendChild(t);
  }
}

// ─── HUD ───
function updateHUD(){
  bumpVal($('hud-score'), G.score);
  bumpVal($('hud-depth'), G.depth);
  bumpVal($('hud-turns'), G.turns);
  $('hud-hp').textContent=Math.max(0,G.hp)+(G.shield>0?' +'+G.shield:'');

  const pct=Math.max(0,G.hp/G.maxHp*100);
  $('hp-bar').style.width=pct+'%';
  $('hp-bar').className=pct<=25?'low':pct<=50?'mid':'';
  $('hp-bar-ghost').style.width=pct+'%';

  // Forge glow based on combo
  const glow=$('forge-glow');
  glow.style.opacity=Math.min(0.6, G.combo*0.12);

  if(G.enemy){
    const prog=Math.max(0,(1-G.enemy.hp/G.enemy.maxHp)*100);
    $('depth-progress').style.width=prog+'%';
    $('depth-label').textContent='深度 '+G.depth+' // '+Math.round(prog)+'%';
  }
}

function bumpVal(el,val){
  const old=el.textContent;
  el.textContent=val;
  if(String(val)!==old){
    el.classList.remove('hud-bump'); void el.offsetWidth; el.classList.add('hud-bump');
  }
}

function updateEnemyUI(){
  if(!G.enemy) return;
  $('enemy-icon').textContent=G.enemy.icon;
  $('enemy-name').textContent=G.enemy.name+(G.frozen?' [冻结]':'');
  $('enemy-hp-text').textContent=Math.max(0,G.enemy.hp)+' / '+G.enemy.maxHp;
  $('enemy-hp-bar').style.width=Math.max(0,G.enemy.hp/G.enemy.maxHp*100)+'%';
  const te=$('enemy-timer');
  te.textContent=G.eTimer;
  te.className=G.eTimer<=1?'danger':'';
}

function log(msg){
  const el=$('log-text');
  el.style.opacity='0';
  setTimeout(()=>{ el.textContent='> '+msg; el.style.opacity='1'; },120);
}

// ─── GAME OVER ───
function gameOver(){
  G.running=false;
  sfxDeath();
  shake('heavy');
  $('death-stats').innerHTML=`
    <div class="death-stat"><div class="ds-val">${G.score}</div><div class="ds-label">分数</div></div>
    <div class="death-stat"><div class="ds-val">${G.depth}</div><div class="ds-label">深度</div></div>
    <div class="death-stat"><div class="ds-val">${G.kills}</div><div class="ds-label">击杀</div></div>
    <div class="death-stat"><div class="ds-val">${G.merges}</div><div class="ds-label">合并</div></div>
    <div class="death-stat"><div class="ds-val">${G.maxCombo}x</div><div class="ds-label">最大连击</div></div>
    <div class="death-stat"><div class="ds-val">${G.dmgTotal}</div><div class="ds-label">总伤害</div></div>
  `;
  setTimeout(()=>$('death-screen').classList.add('active'),600);
}

// ─── START / RESTART ───
function startGame(){
  tileEls.forEach(el=>el.remove());
  tileEls.clear();
  particles=[];
  G=freshState();
  initBoard();
  spawnTile(); spawnTile(); spawnTile();
  spawnEnemy();
  updateRelicBar();
  updateHUD();
  G.running=true;
  log('熔炉点燃 // 深渊在等待');
}

// ─── INPUT ───
document.addEventListener('keydown',e=>{
  const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
  const dir=m[e.key];
  if(dir){ e.preventDefault(); move(dir); }
});

let tx=0,ty=0;
document.addEventListener('touchstart',e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; },{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.max(Math.abs(dx),Math.abs(dy))<30) return;
  if(Math.abs(dx)>Math.abs(dy)) move(dx>0?'right':'left');
  else move(dy>0?'down':'up');
},{passive:true});

$('btn-start').onclick=()=>{ initAudio(); $('start-screen').classList.remove('active'); startGame(); };
$('btn-restart').onclick=()=>{ $('death-screen').classList.remove('active'); startGame(); };

// Resize
window.addEventListener('resize',()=>{
  if(!G) return;
  initBoard();
  tileEls.forEach(el=>el.remove());
  tileEls.clear();
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    const t=G.grid[r][c];
    if(t) makeTileEl(t,false);
  }
});

// Boot
particleLoop();
</script>
