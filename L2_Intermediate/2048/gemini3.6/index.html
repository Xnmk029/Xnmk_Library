<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>符文魔塔 3D：2048 炼金地牢 | Rune Alchemist 3D</title>
    
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Three.js & GSAP CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --bg-dark: #070913;
            --panel-bg: rgba(15, 20, 38, 0.75);
            --panel-border: rgba(0, 240, 255, 0.25);
            --primary-cyan: #00f0ff;
            --primary-gold: #ffd700;
            --primary-crimson: #ff2a5f;
            --primary-purple: #a855f7;
            --primary-emerald: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --font-title: 'Cinzel', serif;
            --font-body: 'Outfit', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: var(--font-body);
            color: var(--text-main);
        }

        /* 3D Canvas Viewport */
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* HUD & UI Container Overlay */
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
        }

        .interactive {
            pointer-events: auto;
        }

        /* Glassmorphism Panel Common */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4), inset 0 0 12px rgba(0, 240, 255, 0.05);
        }

        /* Header Bar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .stats-group {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .stat-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .stat-badge i {
            font-size: 1.1rem;
        }

        .hp-bar-container {
            width: 160px;
            height: 14px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 7px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .hp-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff3366, #ff6b8b);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .shield-bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00f0ff, #7000ff);
            opacity: 0.85;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hp-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.7rem;
            font-weight: 800;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* Enemy Banner & Intent */
        .enemy-hud {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 320px;
            padding: 10px 16px;
            text-align: center;
        }

        .enemy-name {
            font-family: var(--font-title);
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: #ffa0a0;
            text-shadow: 0 0 10px rgba(255, 50, 50, 0.5);
        }

        .enemy-hp-container {
            width: 100%;
            height: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid rgba(255,50,50,0.3);
            position: relative;
        }

        .enemy-hp-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #dc2626, #f87171);
            transition: width 0.3s ease;
        }

        .intent-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--primary-gold);
            background: rgba(0,0,0,0.4);
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        /* Bottom Controls & Skills & Relics Bar */
        .bottom-hud {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .relics-bar {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            min-height: 48px;
            padding: 6px 14px;
        }

        .relic-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--primary-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: var(--primary-gold);
            position: relative;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .relic-icon:hover {
            transform: translateY(-4px) scale(1.1);
            box-shadow: 0 0 12px var(--primary-gold);
        }

        .skills-bar {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
        }

        .skill-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 12px;
            background: rgba(20, 25, 45, 0.85);
            border: 1px solid var(--primary-cyan);
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .skill-btn:hover:not(:disabled) {
            transform: translateY(-4px);
            background: rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 16px var(--primary-cyan);
        }

        .skill-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #4b5563;
        }

        .skill-btn i {
            font-size: 1.3rem;
            margin-bottom: 2px;
            color: var(--primary-cyan);
        }

        .skill-btn .cost {
            font-size: 0.65rem;
            color: var(--primary-gold);
            font-weight: 700;
        }

        /* Floating Tooltip */
        #tooltip {
            position: absolute;
            z-index: 1000;
            background: rgba(10, 14, 28, 0.95);
            border: 1px solid var(--primary-gold);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.8rem;
            color: var(--text-main);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            max-width: 220px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        /* Modals & Overlays */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 6, 14, 0.85);
            backdrop-filter: blur(12px);
            z-index: 500;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            width: 90%;
            max-width: 520px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 20px;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-title {
            font-family: var(--font-title);
            font-size: 1.8rem;
            color: var(--primary-gold);
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .btn-action {
            background: linear-gradient(135deg, #00f0ff, #0077ff);
            color: #000;
            font-weight: 800;
            font-family: var(--font-body);
            padding: 12px 32px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.8);
        }

        /* Card Select Modal */
        .cards-container {
            display: flex;
            gap: 16px;
            width: 100%;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .reward-card {
            flex: 1;
            min-width: 130px;
            max-width: 150px;
            background: rgba(20, 28, 55, 0.9);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .reward-card:hover {
            transform: translateY(-8px) scale(1.05);
            border-color: var(--primary-gold);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .reward-card .icon {
            font-size: 2rem;
            color: var(--primary-gold);
        }

        .reward-card .name {
            font-weight: 700;
            font-size: 0.9rem;
        }

        .reward-card .desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.3;
        }

        /* Map Node Grid */
        .map-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            align-items: center;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .map-row {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .map-node {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 2px solid var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .map-node.available {
            border-color: var(--primary-cyan);
            color: var(--primary-cyan);
            box-shadow: 0 0 15px var(--primary-cyan);
            animation: pulse-node 1.5s infinite alternate;
        }

        .map-node.completed {
            border-color: var(--primary-emerald);
            background: rgba(16, 185, 129, 0.2);
            color: var(--primary-emerald);
            cursor: default;
        }

        .map-node.boss {
            border-color: var(--primary-crimson);
            color: var(--primary-crimson);
            width: 64px;
            height: 64px;
            font-size: 1.5rem;
        }

        @keyframes pulse-node {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        /* Damage Floating Text Overlay */
        .dmg-float {
            position: absolute;
            font-family: var(--font-title);
            font-weight: 900;
            pointer-events: none;
            z-index: 100;
            text-shadow: 0 0 8px rgba(0,0,0,0.9);
            animation: floatUp 0.8s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
            50% { transform: translate(-50%, -30px) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -60px) scale(1); }
        }

        /* Mobile Swipe Hints */
        .mobile-hint {
            display: none;
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            color: var(--text-muted);
            opacity: 0.6;
            pointer-events: none;
        }

        @media (max-height: 700px) {
            .enemy-hud { top: 60px; scale: 0.9; }
            .skill-btn { width: 52px; height: 52px; }
        }
        @media (max-width: 600px) {
            .mobile-hint { display: block; }
            header { padding: 8px 12px; }
            .hp-bar-container { width: 110px; }
            .stats-group { gap: 10px; }
            .stat-badge { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <!-- 3D WebGL Canvas Viewport -->
    <div id="webgl-container"></div>

    <!-- UI Overlay Layer -->
    <div id="ui-overlay">
        <!-- Top Navigation Header -->
        <header class="glass-panel interactive">
            <div class="stats-group">
                <div class="stat-badge" style="color: #ff3366;">
                    <i class="fa-solid fa-heart"></i>
                    <div class="hp-bar-container">
                        <div id="player-hp-fill" class="hp-bar-fill"></div>
                        <div id="player-shield-fill" class="shield-bar-fill"></div>
                        <span id="player-hp-text" class="hp-text">100 / 100</span>
                    </div>
                </div>
                <div class="stat-badge" style="color: var(--primary-gold);">
                    <i class="fa-solid fa-coins"></i>
                    <span id="gold-val">50</span>
                </div>
            </div>

            <div class="stats-group">
                <div class="stat-badge" style="color: var(--primary-cyan);">
                    <i class="fa-solid fa-dungeon"></i>
                    <span id="floor-val">第 1 层</span>
                </div>
                <button id="btn-sound" class="skill-btn" style="width: 36px; height: 36px; border-radius: 50%; border-color: rgba(255,255,255,0.2);">
                    <i class="fa-solid fa-volume-high" style="font-size: 0.9rem;"></i>
                </button>
            </div>
        </header>

        <!-- Enemy HUD Banner (3D Overlay) -->
        <div class="enemy-hud glass-panel">
            <div id="enemy-name" class="enemy-name">古木守护者</div>
            <div class="enemy-hp-container">
                <div id="enemy-hp-fill" class="enemy-hp-fill"></div>
            </div>
            <div class="intent-badge">
                <i id="intent-icon" class="fa-solid fa-swords"></i>
                <span id="intent-text">准备攻击 (12 伤害)</span>
            </div>
        </div>

        <div class="mobile-hint"><i class="fa-solid fa-hand-pointer"></i> 滑动屏幕或按方向键移动方块</div>

        <!-- Bottom Controls & Skills & Relics Bar -->
        <div class="bottom-hud">
            <!-- Active Relics Bar -->
            <div class="relics-bar glass-panel interactive">
                <span style="font-size: 0.75rem; color: var(--text-muted); margin-right: 4px;">遗物:</span>
                <div id="relics-list" style="display: flex; gap: 8px;"></div>
            </div>

            <!-- Active Spells Hotbar -->
            <div class="skills-bar interactive">
                <button class="skill-btn" id="skill-purify" data-tip="净化：消除任意一个低级方块">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>净化</span>
                    <span class="cost">20G</span>
                </button>
                <button class="skill-btn" id="skill-double" data-tip="炼金术：提升随机方块数值">
                    <i class="fa-solid fa-bolt"></i>
                    <span>提纯</span>
                    <span class="cost">35G</span>
                </button>
                <button class="skill-btn" id="skill-shield" data-tip="圣盾：获得 30 点临时护盾">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>圣盾</span>
                    <span class="cost">15G</span>
                </button>
                <button class="skill-btn" id="skill-shuffle" data-tip="引力重组：重组盘面上所有方块">
                    <i class="fa-solid fa-shuffle"></i>
                    <span>重组</span>
                    <span class="cost">25G</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Floating Tooltip -->
    <div id="tooltip"></div>

    <!-- Start / Title Screen Modal -->
    <div id="modal-start" class="modal-overlay active">
        <div class="modal-box glass-panel">
            <div class="modal-title"><i class="fa-solid fa-hat-wizard" style="color: var(--primary-cyan);"></i><br>符文魔塔 3D</div>
            <p style="color: var(--text-muted); font-size: 0.9rem; line-height: 1.5;">
                滑动合成 2048 符文方块释放魔法力量！<br>
                构建遗物 Synergies，击败各层地牢领主！
            </p>
            <button id="btn-start-game" class="btn-action">开启炼金之旅</button>
        </div>
    </div>

    <!-- Card Reward Select Modal -->
    <div id="modal-reward" class="modal-overlay">
        <div class="modal-box glass-panel">
            <div class="modal-title">战胜强敌！选择战利品</div>
            <div id="reward-cards-list" class="cards-container"></div>
        </div>
    </div>

    <!-- Merchant Shop Modal -->
    <div id="modal-shop" class="modal-overlay">
        <div class="modal-box glass-panel">
            <div class="modal-title"><i class="fa-solid fa-store" style="color: var(--primary-gold);"></i> 神秘炼金黑市</div>
            <div id="shop-items-list" class="cards-container"></div>
            <button id="btn-leave-shop" class="btn-action" style="margin-top: 10px; background: linear-gradient(135deg, #4b5563, #1f2937); color: #fff;">离开商店</button>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="modal-gameover" class="modal-overlay">
        <div class="modal-box glass-panel">
            <div class="modal-title" style="color: var(--primary-crimson);">符文崩解 (失败)</div>
            <div id="run-stats" style="font-size: 0.9rem; color: var(--text-muted); line-height: 1.6;"></div>
            <button id="btn-restart" class="btn-action">重新开始契约</button>
        </div>
    </div>

    <!-- Victory Modal -->
    <div id="modal-victory" class="modal-overlay">
        <div class="modal-box glass-panel">
            <div class="modal-title" style="color: var(--primary-gold);"><i class="fa-solid fa-trophy"></i> 登顶成功！</div>
            <p style="color: var(--text-muted);">你击败了魔塔核心的虚空龙皇，获得了终极符文！</p>
            <button id="btn-victory-restart" class="btn-action">再来一局</button>
        </div>
    </div>

    <script>
    /* ==========================================================================
       1. PROCEDURAL WEB AUDIO SYNTHESIZER (No External Assets)
       ========================================================================== */
    class SoundManager {
        constructor() {
            this.ctx = null;
            this.enabled = true;
        }

        init() {
            if (!this.ctx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioCtx();
            }
            if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        }

        playMove() {
            if (!this.enabled) return;
            this.init();
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.08);
        }

        playMerge(val = 2) {
            if (!this.enabled) return;
            this.init();
            const baseFreq = 220 * Math.pow(1.06, Math.log2(val) * 2);
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(baseFreq, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, this.ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.15);
        }

        playHit() {
            if (!this.enabled) return;
            this.init();
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.2);
        }

        playCast() {
            if (!this.enabled) return;
            this.init();
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.25);
        }

        playVictory() {
            if (!this.enabled) return;
            this.init();
            const notes = [261.63, 329.63, 392.00, 523.25];
            notes.forEach((freq, i) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.1);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime + i * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.1 + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(this.ctx.currentTime + i * 0.1);
                osc.stop(this.ctx.currentTime + i * 0.1 + 0.4);
            });
        }
    }

    /* ==========================================================================
       2. THREE.JS 3D ENGINE & SCENE SETUP
       ========================================================================== */
    class ThreeScene {
        constructor(containerEl) {
            this.container = containerEl;
            this.scene = new THREE.Scene();
            this.scene.fog = new THREE.FogExp2(0x070913, 0.035);

            this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            this.camera.position.set(0, 9.5, 9.5);
            this.camera.lookAt(0, 0, -0.5);

            this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            this.renderer.shadowMap.enabled = true;
            this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
            this.container.appendChild(this.renderer.domElement);

            this.initLights();
            this.initBoard3D();
            this.initParticles();
            this.initEnemyMesh();

            window.addEventListener('resize', () => this.onWindowResize());
            window.addEventListener('mousemove', (e) => this.onMouseMove(e));
        }

        initLights() {
            const ambient = new THREE.AmbientLight(0xddeeff, 0.8);
            this.scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0x00f0ff, 1.2);
            dirLight.position.set(5, 12, 8);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            this.scene.add(dirLight);

            const pointLight = new THREE.PointLight(0xff2a5f, 1.5, 15);
            pointLight.position.set(-4, 3, 2);
            this.scene.add(pointLight);

            this.boardLight = new THREE.PointLight(0x00f0ff, 2, 8);
            this.boardLight.position.set(0, 4, 1);
            this.scene.add(this.boardLight);
        }

        initBoard3D() {
            // Glassmorphism Board Base
            const boardGeo = new THREE.BoxGeometry(4.6, 0.3, 4.6);
            const boardMat = new THREE.MeshStandardMaterial({
                color: 0x0c1226,
                roughness: 0.2,
                metalness: 0.8,
                emissive: 0x003344,
                emissiveIntensity: 0.2
            });
            this.boardMesh = new THREE.Mesh(boardGeo, boardMat);
            this.boardMesh.position.set(0, -0.15, 1.2);
            this.boardMesh.receiveShadow = true;
            this.scene.add(this.boardMesh);

            // 4x4 Grid Slot Outlines
            this.slotMeshes = [];
            const slotGeo = new THREE.BoxGeometry(0.95, 0.05, 0.95);
            const slotMat = new THREE.MeshStandardMaterial({
                color: 0x161e38,
                roughness: 0.5,
                metalness: 0.5
            });

            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const slot = new THREE.Mesh(slotGeo, slotMat);
                    const pos = this.gridToWorld(r, c);
                    slot.position.set(pos.x, 0.02, pos.z);
                    slot.receiveShadow = true;
                    this.scene.add(slot);
                    this.slotMeshes.push(slot);
                }
            }
        }

        gridToWorld(r, c) {
            const startX = -1.575;
            const startZ = -0.375;
            const step = 1.05;
            return {
                x: startX + c * step,
                z: startZ + r * step
            };
        }

        initEnemyMesh() {
            this.enemyGroup = new THREE.Group();
            this.enemyGroup.position.set(0, 2.5, -2.5);

            // Procedural Core Crystal Monster
            const coreGeo = new THREE.OctahedronGeometry(0.8, 1);
            this.enemyMat = new THREE.MeshStandardMaterial({
                color: 0xff3366,
                roughness: 0.1,
                metalness: 0.9,
                emissive: 0x880022,
                emissiveIntensity: 0.6
            });
            this.enemyCore = new THREE.Mesh(coreGeo, this.enemyMat);
            this.enemyCore.castShadow = true;
            this.enemyGroup.add(this.enemyCore);

            // Orbiting Rings
            const ringGeo = new THREE.TorusGeometry(1.2, 0.04, 16, 64);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true });
            this.ring1 = new THREE.Mesh(ringGeo, ringMat);
            this.ring2 = new THREE.Mesh(ringGeo, ringMat);
            this.ring2.rotation.x = Math.PI / 2;
            this.enemyGroup.add(this.ring1);
            this.enemyGroup.add(this.ring2);

            this.scene.add(this.enemyGroup);
        }

        initParticles() {
            const particleCount = 120;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 15;
                positions[i+1] = Math.random() * 8;
                positions[i+2] = (Math.random() - 0.5) * 15;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({
                color: 0x00f0ff,
                size: 0.06,
                transparent: true,
                opacity: 0.6
            });
            this.particles = new THREE.Points(geo, mat);
            this.scene.add(this.particles);
        }

        onMouseMove(e) {
            const mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            const mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
            gsap.to(this.camera.position, {
                x: mouseX * 0.4,
                y: 9.5 + mouseY * 0.2,
                duration: 0.5,
                ease: "power1.out"
            });
        }

        onWindowResize() {
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
        }

        triggerCameraShake() {
            gsap.to(this.camera.position, {
                x: "+=" + (Math.random() * 0.3 - 0.15),
                z: "+=" + (Math.random() * 0.3 - 0.15),
                duration: 0.05,
                yoyo: true,
                repeat: 3
            });
        }

        triggerEnemyHitEffect() {
            this.enemyMat.emissive.setHex(0xffffff);
            this.enemyMat.emissiveIntensity = 1;
            gsap.to(this.enemyGroup.scale, { x: 1.25, y: 1.25, z: 1.25, duration: 0.1, yoyo: true, repeat: 1 });
            gsap.to(this.enemyMat, { emissiveIntensity: 0.6, duration: 0.3, onComplete: () => {
                this.enemyMat.emissive.setHex(0x880022);
            }});
        }

        update(time) {
            if (this.enemyCore) {
                this.enemyCore.rotation.y = time * 0.001;
                this.enemyCore.rotation.x = Math.sin(time * 0.0015) * 0.3;
                this.enemyGroup.position.y = 2.5 + Math.sin(time * 0.002) * 0.15;
            }
            if (this.ring1 && this.ring2) {
                this.ring1.rotation.z = time * 0.0012;
                this.ring2.rotation.y = -time * 0.0015;
            }
            if (this.particles) {
                this.particles.rotation.y = time * 0.0001;
            }
            this.renderer.render(this.scene, this.camera);
        }
    }

    /* ==========================================================================
       3. 3D TILE MESH GENERATOR (Canvas Dynamic Textures)
       ========================================================================== */
    const TILE_STYLES = {
        2:    { bg: '#1e293b', border: '#38bdf8', text: '#f8fafc', symbol: 'ᚠ' },
        4:    { bg: '#0f3a4a', border: '#00f0ff', text: '#ffffff', symbol: 'ᚢ' },
        8:    { bg: '#064e3b', border: '#10b981', text: '#ffffff', symbol: 'ᚦ' },
        16:   { bg: '#701a75', border: '#c084fc', text: '#ffffff', symbol: 'ᚨ' },
        32:   { bg: '#831843', border: '#f43f5e', text: '#ffffff', symbol: 'ᚱ' },
        64:   { bg: '#7c2d12', border: '#fb923c', text: '#ffffff', symbol: 'ᚲ' },
        128:  { bg: '#713f12', border: '#facc15', text: '#ffffff', symbol: 'ᚷ' },
        256:  { bg: '#312e81', border: '#818cf8', text: '#ffffff', symbol: 'ᚹ' },
        512:  { bg: '#4c1d95', border: '#a855f7', text: '#ffffff', symbol: 'ᚺ' },
        1024: { bg: '#881337', border: '#fda4af', text: '#ffffff', symbol: 'ᛏ' },
        2048: { bg: '#451a03', border: '#ffd700', text: '#ffffff', symbol: 'ᛋ' }
    };

    function createTileTexture(val) {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        const info = TILE_STYLES[val] || { bg: '#111827', border: '#ffd700', text: '#fff', symbol: '★' };

        // Background
        ctx.fillStyle = info.bg;
        ctx.fillRect(0, 0, 256, 256);

        // Border Glow
        ctx.strokeStyle = info.border;
        ctx.lineWidth = 12;
        ctx.strokeRect(6, 6, 244, 244);

        // Rune Symbol Background
        ctx.fillStyle = info.border;
        ctx.globalAlpha = 0.15;
        ctx.font = '100px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(info.symbol, 128, 110);
        ctx.globalAlpha = 1.0;

        // Number Text
        ctx.fillStyle = info.text;
        ctx.font = 'bold 72px Outfit, sans-serif';
        ctx.shadowColor = info.border;
        ctx.shadowBlur = 12;
        ctx.fillText(val.toString(), 128, 140);

        const texture = new THREE.CanvasTexture(canvas);
        texture.needsUpdate = true;
        return texture;
    }

    class Tile3D {
        constructor(val, r, c, scene3D) {
            this.val = val;
            this.r = r;
            this.c = c;
            this.scene3D = scene3D;

            const geo = new THREE.BoxGeometry(0.92, 0.4, 0.92);
            this.texture = createTileTexture(val);
            const mat = new THREE.MeshStandardMaterial({
                map: this.texture,
                roughness: 0.3,
                metalness: 0.4
            });
            this.mesh = new THREE.Mesh(geo, mat);
            this.mesh.castShadow = true;
            this.mesh.receiveShadow = true;

            const worldPos = scene3D.gridToWorld(r, c);
            this.mesh.position.set(worldPos.x, 0.22, worldPos.z);
            this.mesh.scale.set(0.01, 0.01, 0.01);
            scene3D.scene.add(this.mesh);

            // Pop Spawn Animation
            gsap.to(this.mesh.scale, { x: 1, y: 1, z: 1, duration: 0.25, ease: "back.out(1.7)" });
        }

        updateValue(newVal) {
            this.val = newVal;
            this.texture = createTileTexture(newVal);
            this.mesh.material.map = this.texture;
            this.mesh.material.needsUpdate = true;

            // Elastic Impact Animation
            gsap.timeline()
                .to(this.mesh.scale, { x: 1.3, y: 1.4, z: 1.3, duration: 0.12 })
                .to(this.mesh.scale, { x: 1, y: 1, z: 1, duration: 0.18, ease: "elastic.out(1.2, 0.4)" });
        }

        moveTo(r, c) {
            this.r = r;
            this.c = c;
            const worldPos = this.scene3D.gridToWorld(r, c);
            gsap.to(this.mesh.position, {
                x: worldPos.x,
                z: worldPos.z,
                duration: 0.18,
                ease: "power2.out"
            });
        }

        destroy() {
            gsap.to(this.mesh.scale, {
                x: 0.01, y: 0.01, z: 0.01, duration: 0.15, onComplete: () => {
                    this.scene3D.scene.remove(this.mesh);
                    if (this.mesh.geometry) this.mesh.geometry.dispose();
                }
            });
        }
    }

    /* ==========================================================================
       4. GAME STATE & ROGUELIKE SYSTEM LOGIC
       ========================================================================== */
    const RELICS_DB = [
        { id: 'vampire', name: '吸血晶石', icon: 'fa-droplet', desc: '合成 16 及以上方块时，恢复 6 点 HP' },
        { id: 'thunder', name: '雷霆核心', icon: 'fa-bolt-lightning', desc: '每次合成额外造成 8 点雷电伤害' },
        { id: 'alchemist', name: '炼金印章', icon: 'fa-coins', desc: '合成 32 及以上方块时，获得 +15 金币' },
        { id: 'frost', name: '霜冻新星', icon: 'fa-snowflake', desc: '消除/合成方块时有概率减免敌人伤害' },
        { id: 'aegis', name: '庇护圣徽', icon: 'fa-shield', desc: '每层战斗开始时自动获得 20 点护盾' }
    ];

    const ENEMIES_DB = [
        { name: '古木守护者', hp: 80, atk: 10, type: 'normal' },
        { name: '炼金毒蜘蛛', hp: 120, atk: 14, type: 'normal' },
        { name: '炼狱魔像', hp: 180, atk: 18, type: 'elite' },
        { name: '虚空龙皇 (BOSS)', hp: 350, atk: 25, type: 'boss' }
    ];

    class GameEngine {
        constructor() {
            this.scene3D = new ThreeScene(document.getElementById('webgl-container'));
            this.grid = Array(4).fill(null).map(() => Array(4).fill(null));

            // Player Stats
            this.playerMaxHp = 100;
            this.playerHp = 100;
            this.playerShield = 0;
            this.gold = 50;
            this.floor = 1;
            this.relics = [];

            // Enemy Stats
            this.currentEnemy = null;
            this.enemyHp = 100;
            this.enemyMaxHp = 100;
            this.enemyIntent = { type: 'attack', val: 12 };

            // Input Lock
            this.isBusy = false;

            this.initEvents();
        }

        startNewRun() {
            this.playerHp = this.playerMaxHp;
            this.playerShield = 0;
            this.gold = 50;
            this.floor = 1;
            this.relics = [];

            this.clearGrid();
            this.spawnEnemyForFloor();
            this.spawnRandomTile();
            this.spawnRandomTile();
            this.updateUI();
        }

        clearGrid() {
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (this.grid[r][c]) {
                        this.grid[r][c].destroy();
                        this.grid[r][c] = null;
                    }
                }
            }
        }

        spawnEnemyForFloor() {
            let enemyData;
            if (this.floor >= 5) enemyData = ENEMIES_DB[3];
            else if (this.floor % 2 === 0) enemyData = ENEMIES_DB[2];
            else enemyData = ENEMIES_DB[(this.floor - 1) % 2];

            this.currentEnemy = enemyData;
            this.enemyMaxHp = enemyData.hp + (this.floor - 1) * 20;
            this.enemyHp = this.enemyMaxHp;
            this.generateEnemyIntent();
        }

        generateEnemyIntent() {
            const types = ['attack', 'defense', 'curse'];
            const rand = types[Math.floor(Math.random() * types.length)];
            if (rand === 'attack') {
                this.enemyIntent = { type: 'attack', val: this.currentEnemy.atk + Math.floor(Math.random() * 4) };
            } else if (rand === 'defense') {
                this.enemyIntent = { type: 'defense', val: 15 };
            } else {
                this.enemyIntent = { type: 'curse', val: 0 };
            }
            this.updateEnemyUI();
        }

        spawnRandomTile() {
            const emptySlots = [];
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (!this.grid[r][c]) emptySlots.push({ r, c });
                }
            }
            if (emptySlots.length === 0) return;
            const slot = emptySlots[Math.floor(Math.random() * emptySlots.length)];
            const val = Math.random() < 0.85 ? 2 : 4;
            this.grid[slot.r][slot.c] = new Tile3D(val, slot.r, slot.c, this.scene3D);
        }

        /* 2048 Movement Logic */
        move(dir) {
            if (this.isBusy) return;
            let moved = false;
            let totalDamageDealt = 0;
            this.isBusy = true;

            sounds.playMove();

            const isRow = dir === 'LEFT' || dir === 'RIGHT';
            const isReverse = dir === 'RIGHT' || dir === 'DOWN';

            for (let i = 0; i < 4; i++) {
                let line = [];
                for (let j = 0; j < 4; j++) {
                    const r = isRow ? i : (isReverse ? 3 - j : j);
                    const c = isRow ? (isReverse ? 3 - j : j) : i;
                    if (this.grid[r][c]) line.push(this.grid[r][c]);
                }

                // Merge Calculation
                let mergedLine = [];
                let skip = false;
                for (let k = 0; k < line.length; k++) {
                    if (skip) { skip = false; continue; }
                    if (k + 1 < line.length && line[k].val === line[k + 1].val) {
                        const newVal = line[k].val * 2;
                        line[k].updateValue(newVal);
                        line[k + 1].destroy();
                        mergedLine.push(line[k]);
                        skip = true;
                        moved = true;

                        // Deal Combat Damage
                        let dmg = newVal;
                        if (this.hasRelic('thunder')) dmg += 8;
                        totalDamageDealt += dmg;

                        // Relic Triggers
                        if (this.hasRelic('vampire') && newVal >= 16) {
                            this.healPlayer(6);
                        }
                        if (this.hasRelic('alchemist') && newVal >= 32) {
                            this.gold += 15;
                        }

                        sounds.playMerge(newVal);
                    } else {
                        mergedLine.push(line[k]);
                    }
                }

                // Write Back to Grid & Move Tiles 3D
                for (let j = 0; j < 4; j++) {
                    const r = isRow ? i : (isReverse ? 3 - j : j);
                    const c = isRow ? (isReverse ? 3 - j : j) : i;
                    const targetTile = mergedLine[j] || null;

                    if (this.grid[r][c] !== targetTile) moved = true;
                    this.grid[r][c] = targetTile;
                    if (targetTile) targetTile.moveTo(r, c);
                }
            }

            if (moved) {
                this.scene3D.triggerCameraShake();
                if (totalDamageDealt > 0) {
                    this.damageEnemy(totalDamageDealt);
                }

                setTimeout(() => {
                    this.spawnRandomTile();
                    this.processEnemyTurn();
                    this.isBusy = false;
                    this.checkGameState();
                }, 220);
            } else {
                this.isBusy = false;
            }
        }

        damageEnemy(amount) {
            this.enemyHp = Math.max(0, this.enemyHp - amount);
            this.scene3D.triggerEnemyHitEffect();
            sounds.playHit();
            this.spawnFloatingText(`-${amount}`, '#ff3366', window.innerWidth / 2, window.innerHeight * 0.25);
            this.updateEnemyUI();

            if (this.enemyHp <= 0) {
                setTimeout(() => this.onEnemyDefeated(), 400);
            }
        }

        processEnemyTurn() {
            if (this.enemyHp <= 0) return;

            if (this.enemyIntent.type === 'attack') {
                let dmg = this.enemyIntent.val;
                if (this.playerShield > 0) {
                    const absorbed = Math.min(this.playerShield, dmg);
                    this.playerShield -= absorbed;
                    dmg -= absorbed;
                }
                if (dmg > 0) {
                    this.playerHp = Math.max(0, this.playerHp - dmg);
                    this.spawnFloatingText(`-${dmg} HP`, '#ff2a5f', window.innerWidth / 2, window.innerHeight * 0.7);
                }
            } else if (this.enemyIntent.type === 'defense') {
                this.enemyHp = Math.min(this.enemyMaxHp, this.enemyHp + 10);
            }

            this.generateEnemyIntent();
            this.updateUI();
        }

        healPlayer(amount) {
            this.playerHp = Math.min(this.playerMaxHp, this.playerHp + amount);
            this.spawnFloatingText(`+${amount} HP`, '#10b981', window.innerWidth * 0.3, window.innerHeight * 0.1);
            this.updateUI();
        }

        onEnemyDefeated() {
            sounds.playVictory();
            this.gold += 30 + this.floor * 10;
            this.showRewardModal();
        }

        hasRelic(id) {
            return this.relics.some(r => r.id === id);
        }

        checkGameState() {
            if (this.playerHp <= 0) {
                this.showGameOverModal();
                return;
            }

            // Check grid full & no merges available
            let hasMove = false;
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (!this.grid[r][c]) { hasMove = true; break; }
                    if (r < 3 && this.grid[r+1][c] && this.grid[r+1][c].val === this.grid[r][c].val) hasMove = true;
                    if (c < 3 && this.grid[r][c+1] && this.grid[r][c+1].val === this.grid[r][c].val) hasMove = true;
                }
            }

            if (!hasMove) {
                this.showGameOverModal('无可用移动步数！');
            }
        }

        /* Active Skills Implementation */
        castSkill(type) {
            sounds.playCast();
            if (type === 'shield') {
                if (this.gold < 15) return;
                this.gold -= 15;
                this.playerShield += 30;
                this.spawnFloatingText('+30 护盾', '#00f0ff', window.innerWidth * 0.3, window.innerHeight * 0.1);
                this.updateUI();
            } else if (type === 'shuffle') {
                if (this.gold < 25) return;
                this.gold -= 25;
                const tiles = [];
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        if (this.grid[r][c]) {
                            tiles.push(this.grid[r][c].val);
                            this.grid[r][c].destroy();
                            this.grid[r][c] = null;
                        }
                    }
                }
                tiles.forEach(val => {
                    const empty = [];
                    for (let r = 0; r < 4; r++) {
                        for (let c = 0; c < 4; c++) if (!this.grid[r][c]) empty.push({r, c});
                    }
                    if (empty.length > 0) {
                        const spot = empty[Math.floor(Math.random() * empty.length)];
                        this.grid[spot.r][spot.c] = new Tile3D(val, spot.r, spot.c, this.scene3D);
                    }
                });
                this.updateUI();
            } else if (type === 'purify') {
                if (this.gold < 20) return;
                // Find lowest value tile and destroy it
                let lowestTile = null, lowestVal = Infinity, lr = -1, lc = -1;
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        if (this.grid[r][c] && this.grid[r][c].val < lowestVal) {
                            lowestVal = this.grid[r][c].val;
                            lowestTile = this.grid[r][c];
                            lr = r; lc = c;
                        }
                    }
                }
                if (lowestTile) {
                    this.gold -= 20;
                    lowestTile.destroy();
                    this.grid[lr][lc] = null;
                    this.spawnFloatingText('已净化', '#a855f7', window.innerWidth * 0.5, window.innerHeight * 0.5);
                    this.updateUI();
                }
            } else if (type === 'double') {
                if (this.gold < 35) return;
                let lowestTile = null, lowestVal = Infinity;
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        if (this.grid[r][c] && this.grid[r][c].val < lowestVal) {
                            lowestVal = this.grid[r][c].val;
                            lowestTile = this.grid[r][c];
                        }
                    }
                }
                if (lowestTile) {
                    this.gold -= 35;
                    lowestTile.updateValue(lowestTile.val * 2);
                    this.spawnFloatingText('提纯完成', '#ffd700', window.innerWidth * 0.5, window.innerHeight * 0.5);
                    this.updateUI();
                }
            }
        }

        /* Floating Damage Text */
        spawnFloatingText(str, color, x, y) {
            const el = document.createElement('div');
            el.className = 'dmg-float';
            el.innerText = str;
            el.style.color = color;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        /* UI Sync Methods */
        updateUI() {
            document.getElementById('player-hp-fill').style.width = `${(this.playerHp / this.playerMaxHp) * 100}%`;
            document.getElementById('player-shield-fill').style.width = `${Math.min(100, (this.playerShield / this.playerMaxHp) * 100)}%`;
            document.getElementById('player-hp-text').innerText = `${this.playerHp} / ${this.playerMaxHp} (${this.playerShield} 盾)`;
            document.getElementById('gold-val').innerText = this.gold;
            document.getElementById('floor-val').innerText = `第 ${this.floor} 层`;

            // Relics Render
            const relicListEl = document.getElementById('relics-list');
            relicListEl.innerHTML = '';
            this.relics.forEach(r => {
                const icon = document.createElement('div');
                icon.className = 'relic-icon';
                icon.innerHTML = `<i class="fa-solid ${r.icon}"></i>`;
                icon.dataset.tip = `${r.name}: ${r.desc}`;
                relicListEl.appendChild(icon);
            });

            this.updateEnemyUI();
        }

        updateEnemyUI() {
            if (!this.currentEnemy) return;
            document.getElementById('enemy-name').innerText = this.currentEnemy.name;
            document.getElementById('enemy-hp-fill').style.width = `${(this.enemyHp / this.enemyMaxHp) * 100}%`;

            const intentText = document.getElementById('intent-text');
            const intentIcon = document.getElementById('intent-icon');
            if (this.enemyIntent.type === 'attack') {
                intentText.innerText = `准备攻击 (${this.enemyIntent.val} 伤害)`;
                intentIcon.className = 'fa-solid fa-swords';
            } else if (this.enemyIntent.type === 'defense') {
                intentText.innerText = `坚守防线 (回复 HP)`;
                intentIcon.className = 'fa-solid fa-shield-virus';
            } else {
                intentText.innerText = `施加诅咒`;
                intentIcon.className = 'fa-solid fa-skull';
            }
        }

        showRewardModal() {
            const modal = document.getElementById('modal-reward');
            const cardsContainer = document.getElementById('reward-cards-list');
            cardsContainer.innerHTML = '';

            const options = RELICS_DB.filter(r => !this.hasRelic(r.id)).slice(0, 3);
            if (options.length === 0) {
                options.push({ id: 'heal', name: '恢复结界', icon: 'fa-heart-pulse', desc: '恢复 40 点生命值' });
            }

            options.forEach(opt => {
                const card = document.createElement('div');
                card.className = 'reward-card';
                card.innerHTML = `
                    <div class="icon"><i class="fa-solid ${opt.icon}"></i></div>
                    <div class="name">${opt.name}</div>
                    <div class="desc">${opt.desc}</div>
                `;
                card.onclick = () => {
                    if (opt.id === 'heal') this.healPlayer(40);
                    else this.relics.push(opt);
                    modal.classList.remove('active');
                    this.floor++;
                    if (this.floor > 5) {
                        this.showVictoryModal();
                    } else {
                        this.spawnEnemyForFloor();
                        this.updateUI();
                    }
                };
                cardsContainer.appendChild(card);
            });
            modal.classList.add('active');
        }

        showGameOverModal(reason = '') {
            const modal = document.getElementById('modal-gameover');
            document.getElementById('run-stats').innerHTML = `
                ${reason ? `<p style="color: #ff3366; margin-bottom: 10px;">${reason}</p>` : ''}
                到达层数: 第 ${this.floor} 层<br>
                收集遗物: ${this.relics.length} 个<br>
                持有金币: ${this.gold} G
            `;
            modal.classList.add('active');
        }

        showVictoryModal() {
            document.getElementById('modal-victory').classList.add('active');
        }

        /* Touch & Keyboard Event Handlers */
        initEvents() {
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') this.move('UP');
                if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') this.move('DOWN');
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') this.move('LEFT');
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') this.move('RIGHT');
            });

            // Touch Swipe Support
            let startX = 0, startY = 0;
            window.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, { passive: true });

            window.addEventListener('touchend', (e) => {
                const diffX = e.changedTouches[0].clientX - startX;
                const diffY = e.changedTouches[0].clientY - startY;
                if (Math.abs(diffX) > Math.abs(diffY)) {
                    if (Math.abs(diffX) > 30) this.move(diffX > 0 ? 'RIGHT' : 'LEFT');
                } else {
                    if (Math.abs(diffY) > 30) this.move(diffY > 0 ? 'DOWN' : 'UP');
                }
            }, { passive: true });

            // Buttons
            document.getElementById('btn-start-game').onclick = () => {
                document.getElementById('modal-start').classList.remove('active');
                this.startNewRun();
            };

            document.getElementById('btn-restart').onclick = () => {
                document.getElementById('modal-gameover').classList.remove('active');
                this.startNewRun();
            };

            document.getElementById('btn-victory-restart').onclick = () => {
                document.getElementById('modal-victory').classList.remove('active');
                this.startNewRun();
            };

            document.getElementById('skill-purify').onclick = () => this.castSkill('purify');
            document.getElementById('skill-double').onclick = () => this.castSkill('double');
            document.getElementById('skill-shield').onclick = () => this.castSkill('shield');
            document.getElementById('skill-shuffle').onclick = () => this.castSkill('shuffle');

            // Sound Toggle
            const soundBtn = document.getElementById('btn-sound');
            soundBtn.onclick = () => {
                sounds.enabled = !sounds.enabled;
                soundBtn.innerHTML = `<i class="fa-solid fa-volume-${sounds.enabled ? 'high' : 'xmark'}" style="font-size: 0.9rem;"></i>`;
            };

            // Tooltip Hover Delegation
            document.addEventListener('mouseover', (e) => {
                const target = e.target.closest('[data-tip]');
                if (target) {
                    const tooltip = document.getElementById('tooltip');
                    tooltip.innerText = target.dataset.tip;
                    tooltip.style.opacity = '1';
                    const rect = target.getBoundingClientRect();
                    tooltip.style.left = `${rect.left + rect.width / 2 - 100}px`;
                    tooltip.style.top = `${rect.top - 40}px`;
                }
            });
            document.addEventListener('mouseout', (e) => {
                if (e.target.closest('[data-tip]')) {
                    document.getElementById('tooltip').style.opacity = '0';
                }
            });
        }
    }

    // Initialize Game Engine and Main Render Loop
    window.addEventListener('DOMContentLoaded', () => {
        const game = new GameEngine();

        function animate(time) {
            requestAnimationFrame(animate);
            game.scene3D.update(time);
        }
        requestAnimationFrame(animate);
    });
    </script>
</body>
</html>
