<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>深渊熔炉 · ABYSS FORGE — 2048 Roguelike</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root{
    --gold:#f6c86a; --cyan:#59e3ff; --magenta:#ff5ad1; --red:#ff4d5e;
    --ink:#06030f; --panel:rgba(16,10,34,.72); --edge:rgba(150,110,255,.28);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#fff;user-select:none}
  /* ===== 背景星空 ===== */
  #bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;
    background:radial-gradient(120% 90% at 50% 12%, #241244 0%, #120a2a 42%, #060312 100%);}
  #bg::before,#bg::after{content:"";position:absolute;top:0;left:0;width:100%;height:100%;
    background-image:radial-gradient(1.6px 1.6px at 20px 30px,#fff,transparent),
      radial-gradient(1px 1px at 90px 120px,#bfe6ff,transparent),
      radial-gradient(1.4px 1.4px at 160px 60px,#ffd9a0,transparent),
      radial-gradient(1px 1px at 220px 180px,#c9a0ff,transparent),
      radial-gradient(1.2px 1.2px at 300px 90px,#fff,transparent);
    background-size:340px 240px;opacity:.55;animation:drift 90s linear infinite;}
  #bg::after{background-size:520px 380px;opacity:.3;animation-duration:160s;animation-direction:reverse}
  @keyframes drift{from{transform:translateY(0)}to{transform:translateY(-340px)}}
  #scene{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;display:block}

  /* ===== 通用 UI ===== */
  #ui{position:fixed;top:0;left:0;width:100%;height:100%;z-index:5;pointer-events:none}
  .panel{background:var(--panel);border:1px solid var(--edge);border-radius:14px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 8px 32px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06)}
  .lbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9a8fd0}

  /* 顶栏 */
  #topbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);
    display:flex;gap:12px;align-items:stretch;width:min(92vw,760px)}
  #floor-badge{display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:8px 16px;min-width:92px}
  #floor-num{font-size:30px;font-weight:800;color:var(--gold);text-shadow:0 0 18px rgba(246,200,106,.55);line-height:1}
  #enemy-panel{flex:1;padding:8px 16px;display:flex;flex-direction:column;gap:5px}
  #enemy-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  #enemy-name{font-size:15px;font-weight:700;color:#fff;text-shadow:0 0 12px rgba(255,90,120,.4)}
  #enemy-atk{font-size:12px;color:#ffb0b8;background:rgba(255,77,94,.14);border:1px solid rgba(255,77,94,.4);
    padding:2px 9px;border-radius:999px;white-space:nowrap}
  .bar{position:relative;height:12px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden}
  .bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;display:block;transition:width .3s cubic-bezier(.22,1,.36,1)}
  #enemy-hpfill{background:linear-gradient(90deg,#ff5a6e,#ff9a4d);width:100%;box-shadow:0 0 12px rgba(255,90,110,.6)}
  #player-hpfill{background:linear-gradient(90deg,#43e08a,#8ff0c0);width:100%;box-shadow:0 0 12px rgba(80,230,150,.5)}
  #enemy-hptext,#player-hptext{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  #score-panel{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding:8px 16px;min-width:110px}
  #score{font-size:22px;font-weight:800;color:#fff;line-height:1}
  #best{font-size:11px;color:#9a8fd0;margin-top:3px}

  /* 底栏 */
  #bottombar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    display:flex;gap:12px;align-items:stretch;width:min(92vw,760px)}
  #player-panel{flex:1;padding:8px 16px;display:flex;flex-direction:column;gap:5px}
  #player-top{display:flex;justify-content:space-between;align-items:center}
  #shield-txt{font-size:12px;color:#8fd9ff}
  #relics-panel{display:flex;align-items:center;gap:6px;padding:8px 12px;max-width:300px;flex-wrap:wrap;justify-content:flex-end}
  .relic-ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:19px;background:rgba(120,90,255,.16);border:1px solid rgba(160,130,255,.4);
    box-shadow:0 0 10px rgba(140,110,255,.25);cursor:default;pointer-events:auto}

  /* 浮动伤害数字 */
  #dmg-layer{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;pointer-events:none}
  .dmg{position:absolute;font-weight:900;font-size:26px;color:#ffd24d;
    text-shadow:0 0 12px rgba(255,150,40,.8),0 2px 4px rgba(0,0,0,.6);
    transform:translate(-50%,0);animation:dmgfly .9s cubic-bezier(.2,.8,.3,1) forwards}
  .dmg.hurt{color:#ff5a6e;text-shadow:0 0 12px rgba(255,60,80,.8),0 2px 4px rgba(0,0,0,.6)}
  .dmg.heal{color:#7df0a8;text-shadow:0 0 12px rgba(80,240,150,.8)}
  @keyframes dmgfly{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}
    15%{opacity:1;transform:translate(-50%,-6px) scale(1.15)}
    100%{opacity:0;transform:translate(-50%,-64px) scale(1)}}

  /* ===== 遗物三选一 ===== */
  #modal-relics{position:fixed;top:0;left:0;width:100%;height:100%;z-index:30;display:none;align-items:center;justify-content:center;
    background:rgba(4,2,12,.7);backdrop-filter:blur(6px)}
  #modal-relics.show{display:flex}
  .modal-box{text-align:center;animation:popin .45s cubic-bezier(.2,1.4,.35,1)}
  @keyframes popin{from{opacity:0;transform:scale(.85) translateY(20px)}to{opacity:1;transform:none}}
  .modal-box h2{font-size:26px;color:var(--gold);text-shadow:0 0 22px rgba(246,200,106,.5);margin-bottom:6px}
  .modal-box p{color:#b3a8e0;margin-bottom:22px;font-size:14px}
  .cards{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;padding:0 16px}
  .card{width:210px;padding:22px 18px 24px;border-radius:18px;cursor:pointer;pointer-events:auto;
    background:linear-gradient(160deg,rgba(40,26,80,.95),rgba(18,12,40,.95));
    border:1px solid rgba(160,130,255,.35);position:relative;overflow:hidden;
    transition:transform .22s cubic-bezier(.2,1.4,.4,1),box-shadow .22s,border-color .22s}
  .card:hover{transform:translateY(-10px) scale(1.04);border-color:var(--gold);
    box-shadow:0 18px 44px rgba(120,80,255,.4),0 0 24px rgba(246,200,106,.25)}
  .card .ic{font-size:44px;margin-bottom:12px;filter:drop-shadow(0 0 14px rgba(255,255,255,.35))}
  .card .nm{font-size:17px;font-weight:800;color:#fff;margin-bottom:8px}
  .card .ds{font-size:12.5px;line-height:1.55;color:#c9c0ea}
  .card::before{content:"";position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(60% 40% at 50% 0%,rgba(255,255,255,.12),transparent);pointer-events:none}

  /* ===== 开始 / 结束 屏 ===== */
  .screen{position:fixed;top:0;left:0;width:100%;height:100%;z-index:40;display:flex;align-items:center;justify-content:center;
    background:rgba(5,2,14,.82);backdrop-filter:blur(8px)}
  .screen .inner{text-align:center;max-width:640px;padding:32px;animation:popin .5s cubic-bezier(.2,1.4,.35,1)}
  .title{font-size:clamp(34px,7vw,58px);font-weight:900;letter-spacing:.04em;line-height:1.05;
    background:linear-gradient(120deg,#f6c86a,#ff5ad1 45%,#59e3ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 26px rgba(255,120,200,.35))}
  .subtitle{color:#b3a8e0;margin:16px 0 4px;font-size:15px;line-height:1.7}
  .subtitle b{color:var(--gold)}
  .btn{display:inline-block;margin-top:26px;padding:15px 46px;border-radius:999px;border:none;cursor:pointer;
    font-size:18px;font-weight:800;letter-spacing:.06em;color:#1a0e2e;
    background:linear-gradient(120deg,#f6c86a,#ff9a4d);
    box-shadow:0 10px 30px rgba(246,160,80,.4),inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .18s cubic-bezier(.2,1.4,.4,1),box-shadow .18s}
  .btn:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 16px 40px rgba(246,160,80,.55)}
  .btn:active{transform:translateY(1px) scale(.98)}
  .keys{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
  .keycap{font-size:12px;color:#c9c0ea;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
    padding:6px 12px;border-radius:8px}
  #stat-grid{display:flex;gap:14px;justify-content:center;margin:22px 0;flex-wrap:wrap}
  .stat{min-width:120px;padding:14px 20px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12)}
  .stat .v{font-size:26px;font-weight:800;color:var(--gold)}
  .stat .k{font-size:11px;color:#9a8fd0;letter-spacing:.14em;margin-top:4px}
  #go-title{background:linear-gradient(120deg,#ff5a6e,#ff9a4d)}
  .hidden{display:none!important}

  /* 命中红闪 / 回复绿闪 */
  #flash{position:fixed;top:0;left:0;width:100%;height:100%;z-index:20;pointer-events:none;opacity:0}
  #flash.hurt{background:radial-gradient(80% 80% at 50% 50%,transparent 30%,rgba(255,40,60,.4));animation:fl .5s}
  #flash.heal{background:radial-gradient(80% 80% at 50% 50%,transparent 30%,rgba(60,255,150,.3));animation:fl .5s}
  @keyframes fl{0%{opacity:0}20%{opacity:1}100%{opacity:0}}

  #hint{position:absolute;bottom:78px;left:50%;transform:translateX(-50%);
    font-size:12px;color:#8a7fc0;letter-spacing:.1em;opacity:.8;white-space:nowrap}
  @media (max-width:620px){
    #topbar,#bottombar{width:94vw}
    #score-panel{display:none}
    .card{width:46%;min-width:150px}
  }
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="scene"></canvas>
<div id="flash"></div>

<div id="ui">
  <div id="topbar">
    <div id="floor-badge" class="panel"><span class="lbl">深渊层数</span><span id="floor-num">1</span></div>
    <div id="enemy-panel" class="panel">
      <div id="enemy-top"><span id="enemy-name">石像守卫</span><span id="enemy-atk">⚔ 5 步后攻击</span></div>
      <div class="bar"><i id="enemy-hpfill"></i><span id="enemy-hptext">40 / 40</span></div>
    </div>
    <div id="score-panel" class="panel"><span class="lbl">熔炼值</span><span id="score">0</span><span id="best">最佳 0</span></div>
  </div>

  <div id="bottombar">
    <div id="player-panel" class="panel">
      <div id="player-top"><span class="lbl">炼金生命</span><span id="shield-txt"></span></div>
      <div class="bar"><i id="player-hpfill"></i><span id="player-hptext"></span></div>
    </div>
    <div id="relics-panel" class="panel"></div>
  </div>

  <div id="hint">滑动 / 方向键 融合元素立方 · 合并即是对守卫的攻击</div>
  <div id="dmg-layer"></div>
</div>

<!-- 遗物三选一 -->
<div id="modal-relics">
  <div class="modal-box">
    <h2>深渊的馈赠</h2>
    <p>守卫已陨落 · 选择一枚遗物，它将永久改变你的熔炉法则</p>
    <div class="cards" id="cards"></div>
  </div>
</div>

<!-- 开始屏 -->
<div id="screen-start" class="screen">
  <div class="inner">
    <div class="title">深渊熔炉<br><span style="font-size:.42em;letter-spacing:.3em">ABYSS FORGE</span></div>
    <div class="subtitle">
      你是坠入深渊的炼金术士。滑动融合<b>元素立方</b>，每一次合并都会化作轰向<b>层主守卫</b>的烈焰。<br>
      击败守卫、拾取<b>遗物</b>、构筑流派，向更深处坠落——直到生命燃尽。
    </div>
    <div class="keys">
      <span class="keycap">↑ ↓ ← → / WASD 移动</span>
      <span class="keycap">触屏滑动</span>
      <span class="keycap">合并 = 攻击</span>
      <span class="keycap">血量归零 = 陨落</span>
    </div>
    <button class="btn" id="btn-start">点燃熔炉</button>
  </div>
</div>

<!-- 结束屏 -->
<div id="screen-over" class="screen hidden">
  <div class="inner">
    <div class="title" id="go-title">炼金术士陨落</div>
    <div class="subtitle" id="go-sub">深渊吞噬了你的火焰……</div>
    <div id="stat-grid"></div>
    <button class="btn" id="btn-restart">重燃 · 再入深渊</button>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   深渊熔炉 ABYSS FORGE — 3D 2048 × Roguelike
   ============================================================ */

/* ---------- 常量 ---------- */
const SIZE = 4;
const CELL = 2.15;                 // 单元格世界尺寸
const SLIDE_MS = 0.13;             // 滑动时长(秒)
const TILE_COLORS = {
  2:0x5e6a8a, 4:0x3f9d8a, 8:0x2ec4b6, 16:0x3a86ff, 32:0x8338ec,
  64:0xd62ad0, 128:0xff4d6d, 256:0xff7b2e, 512:0xffb703,
  1024:0xffd166, 2048:0xfff3b0, 4096:0xffffff, 8192:0xffffff
};
const tileColor = v => TILE_COLORS[v] || 0xffffff;

/* ---------- DOM ---------- */
const $ = id => document.getElementById(id);
const el = {
  floor:$("floor-num"), enemyName:$("enemy-name"), enemyAtk:$("enemy-atk"),
  enemyFill:$("enemy-hpfill"), enemyHpTxt:$("enemy-hptext"),
  score:$("score"), best:$("best"),
  playerFill:$("player-hpfill"), playerHpTxt:$("player-hptext"), shieldTxt:$("shield-txt"),
  relics:$("relics-panel"), dmgLayer:$("dmg-layer"),
  modal:$("modal-relics"), cards:$("cards"),
  start:$("screen-start"), over:$("screen-over"),
  goTitle:$("go-title"), goSub:$("go-sub"), statGrid:$("stat-grid"),
  flash:$("flash"), hint:$("hint")
};

/* ============================================================
   Three.js 场景
   ============================================================ */
const canvas = $("scene");
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0618, 0.028);

const camera = new THREE.PerspectiveCamera(66, 1, 0.1, 100); // 66° 广角：46° 时守卫主体被屏幕顶部截断
const CAM_BASE = new THREE.Vector3(0, 8.6, 8.2);
camera.position.copy(CAM_BASE);
camera.lookAt(0, 0.3, 0);

/* 灯光 */
scene.add(new THREE.AmbientLight(0x8a7fc0, 0.75));
const key = new THREE.DirectionalLight(0xfff2d8, 1.05);
key.position.set(5, 11, 6); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left=-7;key.shadow.camera.right=7;key.shadow.camera.top=7;key.shadow.camera.bottom=-7;
scene.add(key);
const rim = new THREE.DirectionalLight(0x6a4dff, 0.6); rim.position.set(-6, 6, -6); scene.add(rim);
const under = new THREE.PointLight(0xff7b2e, 0.9, 16); under.position.set(0, -2.2, 0); scene.add(under);

/* 棋盘底座 */
const boardGroup = new THREE.Group(); scene.add(boardGroup);
(function buildBoard(){
  const base = new THREE.Mesh(
    new THREE.BoxGeometry(CELL*SIZE+0.9, 0.55, CELL*SIZE+0.9),
    new THREE.MeshStandardMaterial({color:0x171033, roughness:.7, metalness:.25,
      emissive:0x241650, emissiveIntensity:.4}));
  base.position.y = -0.35; base.receiveShadow = true; boardGroup.add(base);
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    const s=new THREE.Mesh(new THREE.BoxGeometry(CELL*0.93,0.12,CELL*0.93),
      new THREE.MeshStandardMaterial({color:0x241a4d,roughness:.6,metalness:.2,
        emissive:0x2a1e66,emissiveIntensity:.3,transparent:true,opacity:.75}));
    s.position.set(cellX(c),-0.02,cellZ(r)); s.receiveShadow=true; boardGroup.add(s);
  }
})();

/* 星空粒子背景 */
(function stars(){
  const g=new THREE.BufferGeometry(), N=420, pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*70;pos[i*3+1]=Math.random()*40-8;pos[i*3+2]=-Math.random()*50-6;}
  g.setAttribute("position",new THREE.BufferAttribute(pos,3));
  const m=new THREE.PointsMaterial({color:0xbfaaff,size:.09,transparent:true,opacity:.7,depthWrite:false});
  scene.add(new THREE.Points(g,m));
})();

/* 敌人 3D 模型 */
const enemyGroup=new THREE.Group(); enemyGroup.position.set(0,3.4,-4.6); scene.add(enemyGroup);
let enemyMesh=null;
function buildEnemyMesh(color){
  if(enemyMesh){enemyGroup.remove(enemyMesh);enemyMesh.geometry.dispose();}
  const geo=new THREE.IcosahedronGeometry(1.35,0);
  const mat=new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.55,roughness:.3,metalness:.35,flatShading:true});
  enemyMesh=new THREE.Mesh(geo,mat); enemyGroup.add(enemyMesh);
  const wire=new THREE.Mesh(new THREE.IcosahedronGeometry(1.6,0),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:.22,wireframe:true}));
  enemyMesh.add(wire); enemyMesh.userData.wire=wire;
}

/* 坐标换算 */
function cellX(c){return (c-(SIZE-1)/2)*CELL;}
function cellZ(r){return (r-(SIZE-1)/2)*CELL;}
function tileHeight(v){return 0.55 + Math.min(Math.log2(v),13)*0.045;}

/* ============================================================
   数字纹理
   ============================================================ */
const texCache={};
function numberTexture(v){
  if(texCache[v])return texCache[v];
  const cv=document.createElement("canvas");cv.width=cv.height=256;
  const x=cv.getContext("2d");
  x.clearRect(0,0,256,256);
  const s=v>=1024?92:(v>=128?118:150);
  x.font=`900 ${s}px "Segoe UI",Arial`;
  x.textAlign="center";x.textBaseline="middle";
  x.shadowColor="rgba(0,0,0,.55)";x.shadowBlur=14;x.shadowOffsetY=4;
  x.fillStyle=v>=2048?"#3a2a05":"#ffffff";
  x.fillText(v,128,138);
  const t=new THREE.CanvasTexture(cv);t.anisotropy=4;texCache[v]=t;return t;
}

/* ============================================================
   游戏状态
   ============================================================ */
const G={
  running:false, animLock:false,
  grid:null, tiles:new Set(),
  floor:1, score:0, best:0, moves:0,
  player:{hp:60,maxhp:60,shield:0},
  enemy:null, relics:[],
  burn:0, mergesSinceNova:0, regenSteps:0,
  spawnBoost:false
};

/* ---------- 遗物定义(切实改变规则) ---------- */
const RELICS=[
 {ic:"🔥",nm:"烈焰余烬",ds:"每次合并附加 3 层灼烧。敌人每次行动时受灼烧伤害后层数减半。",
   onMerge(){G.burn+=3;}},
 {ic:"🛡️",nm:"圣光壁垒",ds:"每击败一名守卫，获得 18 点护盾，优先抵挡伤害。",
   onKill(){G.player.shield+=18;}},
 {ic:"⚡",nm:"连锁闪电",ds:"单次滑动触发 2 次及以上合并时，追加 12 点雷击伤害。",
   onMoveEnd(n){if(n>=2)dealToEnemy(12,"⚡");}},
 {ic:"💧",nm:"生命涌泉",ds:"每移动 6 步，回复 5 点生命。",
   onMove(){if(++G.regenSteps>=6){G.regenSteps=0;healPlayer(5);}}},
 {ic:"💣",nm:"湮灭核心",ds:"每 5 次合并，引爆一次：对敌人造成等同当前最大方块的伤害。",
   onMerge(){if(++G.mergesSinceNova>=5){G.mergesSinceNova=0;dealToEnemy(maxTileValue(),"💣");}}},
 {ic:"⏳",nm:"时之沙",ds:"敌人的攻击间隔 +2 步，为你争取更多熔炼时间。",
   intervalMod:n=>n+2},
 {ic:"🩸",nm:"吸血獠牙",ds:"对敌人造成伤害时，回复该次伤害 20% 的生命（至多 8）。",
   onDamage(d){healPlayer(Math.min(8,Math.max(1,Math.round(d*0.2))));}},
 {ic:"👑",nm:"迈达斯之触",ds:"合并出 64 及以上的方块时，该次伤害 +50%。",
   dmgMod:(d,v)=>v>=64?Math.round(d*1.5):d},
 {ic:"🎲",nm:"混沌棱镜",ds:"新生成的方块有 30% 概率直接以更高一级出现。",
   spawnMod:()=>Math.random()<0.3},
 {ic:"🌪️",nm:"风暴之核",ds:"击败守卫时回复 12 生命，并清除棋盘上一切障碍石块。",
   onKill(){healPlayer(12);clearBlockers();}}
];

/* ---------- 敌人定义 ---------- */
function makeEnemy(floor){
  const isBoss=floor%3===0;
  const pool=isBoss?["深渊领主"]:["石像守卫","暗影刺客","熔岩巨兽","虚空法师"];
  const name=pool[Math.floor(Math.random()*pool.length)];
  const hp=Math.round(44*Math.pow(1.62,floor-1));
  const base={floor,name,hp,maxhp:hp,atkCd:0,interval:5,atk:Math.round(6+floor*2.6),dead:false,
    color:0xff5a6e,ability:null,abilityCd:0};
  switch(name){
    case "石像守卫": base.interval=6;base.color=0x9aa7c7; break;
    case "暗影刺客": base.interval=3;base.atk=Math.round(8+floor*2.8);base.color=0xb44dff;break;
    case "熔岩巨兽": base.interval=5;base.ability="blocker";base.abilityCd=4;base.color=0xff7b2e;break;
    case "虚空法师": base.interval=5;base.ability="freeze";base.abilityCd=5;base.color=0x59e3ff;break;
    case "深渊领主": base.interval=4;base.atk=Math.round(9+floor*3);base.ability=Math.random()<.5?"blocker":"freeze";base.abilityCd=4;base.color=0xff2e6c;break;
  }
  base.atkCd=base.interval;
  return base;
}

/* ============================================================
   方块对象与网格
   ============================================================ */
function newGrid(){return Array.from({length:SIZE},()=>Array(SIZE).fill(null));}

function makeTile(r,c,v,opts={}){
  const h=tileHeight(v), col=tileColor(v);
  const grp=new THREE.Group();
  const box=new THREE.Mesh(new THREE.BoxGeometry(CELL*0.86,h,CELL*0.86),
    new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.32,roughness:.34,metalness:.12}));
  box.castShadow=true;box.position.y=h/2;grp.add(box);
  const label=new THREE.Mesh(new THREE.PlaneGeometry(CELL*0.82,CELL*0.82),
    new THREE.MeshBasicMaterial({map:numberTexture(v),transparent:true,depthWrite:false}));
  label.rotation.x=-Math.PI/2;label.position.y=h+0.02;grp.add(label);
  if(opts.frozen){
    const ice=new THREE.Mesh(new THREE.BoxGeometry(CELL*0.95,h+0.1,CELL*0.95),
      new THREE.MeshStandardMaterial({color:0x9fdcff,transparent:true,opacity:.4,roughness:.1,metalness:.5,emissive:0x4db8ff,emissiveIntensity:.4}));
    ice.position.y=h/2;grp.add(ice);grp.userData.ice=ice;
  }
  grp.position.set(cellX(c),0,cellZ(r));
  scene.add(grp);
  const t={type:"tile",r,c,v,frozen:opts.frozen?opts.frozenTurns||3:0,mesh:grp,box,label};
  G.grid[r][c]=t; G.tiles.add(t);
  if(opts.spawn){ gsap.from(grp.scale,{x:0,y:0,z:0,duration:.3,ease:"back.out(2.2)"}); }
  return t;
}

function makeBlocker(r,c){
  const grp=new THREE.Group();
  const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(CELL*0.44,0),
    new THREE.MeshStandardMaterial({color:0x4a4358,roughness:.9,metalness:.1,flatShading:true}));
  rock.castShadow=true;rock.position.y=CELL*0.44;grp.add(rock);
  grp.position.set(cellX(c),0,cellZ(r));scene.add(grp);
  const b={type:"blocker",r,c,hp:1,mesh:grp};
  G.grid[r][c]=b;
  gsap.from(grp.scale,{x:0,y:0,z:0,duration:.35,ease:"back.out(2)"});
  return b;
}

function removeMesh(obj){
  scene.remove(obj.mesh);
  obj.mesh.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){if(o.material.map)o.material.map.dispose();o.material.dispose();}});
}

function maxTileValue(){let m=0;G.tiles.forEach(t=>{if(t.v>m)m=t.v;});return m;}

/* ============================================================
   2048 移动 + 合并核心
   ============================================================ */
function inBounds(r,c){return r>=0&&r<SIZE&&c>=0&&c<SIZE;}

function move(dir){ // dir: {dr,dc}
  if(!G.running||G.animLock)return;
  const dr=dir.dr,dc=dir.dc;
  let moved=false, merges=[], damage=0, mergeCount=0;
  const toRemove=[];

  // 构建遍历顺序
  const rows=[...Array(SIZE).keys()], cols=[...Array(SIZE).keys()];
  if(dr===1)rows.reverse(); if(dc===1)cols.reverse();

  for(const r of rows){
    for(const c of cols){
      const cell=G.grid[r][c];
      if(!cell||cell.type!=="tile"||cell.frozen>0)continue;
      // 沿方向找最远可落点
      let nr=r,nc=c;
      while(true){
        const tr=nr+dr,tc=nc+dc;
        if(!inBounds(tr,tc))break;
        const tgt=G.grid[tr][tc];
        if(!tgt){nr=tr;nc=tc;continue;}
        if(tgt.type==="tile"&&tgt.frozen<=0&&tgt.v===cell.v&&!tgt.mergedThis&& !cell.mergedThis){
          nr=tr;nc=tc; // 合并目标
        }
        break;
      }
      if(nr===r&&nc===c)continue;
      moved=true;
      G.grid[r][c]=null;
      const target=G.grid[nr][nc];
      if(target&&target.type==="tile"&&target.v===cell.v){
        // 合并
        target.mergedThis=true;cell.mergedThis=true;
        const nv=cell.v*2;
        merges.push({src:cell,dst:target,r:nr,c:nc,nv});
        damage+=nv; mergeCount++;
        G.grid[nr][nc]=target; // 暂存，稍后升级
        cell.mergeInto=target;
        G.tiles.delete(cell);
      }else{
        G.grid[nr][nc]=cell;cell.r=nr;cell.c=nc;
      }
    }
  }

  if(!moved)return;
  G.animLock=true; G.moves++;

  // 滑动动画
  G.tiles.forEach(t=>{gsap.to(t.mesh.position,{x:cellX(t.c),z:cellZ(t.r),duration:SLIDE_MS,ease:"power2.out"});});
  merges.forEach(m=>{
    gsap.to(m.src.mesh.position,{x:cellX(m.c),z:cellZ(m.r),duration:SLIDE_MS,ease:"power2.out"});
  });

  setTimeout(()=>{
    // 结算合并
    merges.forEach(m=>{
      m.dst.v=m.nv;
      upgradeTileVisual(m.dst,m.nv);
      toRemove.push(m.src);
      burst(cellX(m.c),tileHeight(m.nv)*0.6,cellZ(m.r),tileColor(m.nv),m.nv);
    });
    toRemove.forEach(removeMesh);
    G.tiles.forEach(t=>{t.mergedThis=false;});

    // 伤害结算(遗物加成)
    let total=0;
    merges.forEach(m=>{let d=m.nv;G.relics.forEach(R=>{if(R.dmgMod)d=R.dmgMod(d,m.nv);});total+=d;});
    if(total>0){dealToEnemy(total);G.relics.forEach(R=>{if(R.onDamage)R.onDamage(total);});}
    G.relics.forEach(R=>{if(R.onMerge)merges.forEach(()=>R.onMerge());});
    if(mergeCount>0)G.score+=total;
    G.relics.forEach(R=>{if(R.onMoveEnd)R.onMoveEnd(mergeCount);});

    // 障碍:相邻合并伤害石块
    merges.forEach(m=>damageAdjacentBlockers(m.r,m.c));

    updateHUD();

    // 敌人回合推进
    enemyTurnTick();
    G.relics.forEach(R=>{if(R.onMove)R.onMove();});

    // 新方块
    spawnRandom();
    checkStuck();

    G.animLock=false;
    if(G.enemy&&!G.enemy.dead&&G.enemy.hp<=0)killEnemy();
  }, SLIDE_MS*1000+8);
}

function upgradeTileVisual(t,v){
  const h=tileHeight(v),col=tileColor(v);
  t.box.material.color.setHex(col);t.box.material.emissive.setHex(col);
  gsap.to(t.box.scale,{x:1,y:1,z:1,duration:.01});
  t.box.geometry.dispose();t.box.geometry=new THREE.BoxGeometry(CELL*0.86,h,CELL*0.86);
  t.box.position.y=h/2;
  t.label.material.map=numberTexture(v);t.label.material.needsUpdate=true;
  t.label.position.y=h+0.02;
  gsap.fromTo(t.mesh.scale,{x:1.22,y:1.22,z:1.22},{x:1,y:1,z:1,duration:.42,ease:"elastic.out(1.1,0.4)"});
}

function spawnRandom(){
  const empties=[];
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(!G.grid[r][c])empties.push([r,c]);
  if(!empties.length)return;
  const [r,c]=empties[Math.floor(Math.random()*empties.length)];
  let v=Math.random()<0.9?2:4;
  if(G.relics.some(R=>R.spawnMod&&R.spawnMod()))v*=2;
  makeTile(r,c,v,{spawn:true});
}

function damageAdjacentBlockers(r,c){
  [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([rr,cc])=>{
    if(inBounds(rr,cc)){
      const n=G.grid[rr][cc];
      if(n&&n.type==="blocker"){
        n.hp--;
        if(n.hp<=0){G.grid[rr][cc]=null;burst(cellX(cc),0.8,cellZ(rr),0x8a7fc0,8);removeMesh(n);shake(0.12);}
      }
    }
  });
}

function clearBlockers(){
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    const n=G.grid[r][c];
    if(n&&n.type==="blocker"){G.grid[r][c]=null;burst(cellX(c),0.8,cellZ(r),0x8a7fc0,8);removeMesh(n);}
  }
}

/* 无棋可走 → 深渊侵蚀:掉血并清除最低两块,而非直接死亡 */
function checkStuck(){
  if(hasMove())return;
  hurtPlayer(12,"深渊侵蚀");
  const arr=[...G.tiles].sort((a,b)=>a.v-b.v).slice(0,2);
  arr.forEach(t=>{G.grid[t.r][t.c]=null;G.tiles.delete(t);burst(cellX(t.c),0.5,cellZ(t.r),0xff4d5e,10);removeMesh(t);});
  shake(0.35);
}
function hasMove(){
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    const n=G.grid[r][c];
    if(!n)return true;
    if(n.type==="tile"){
      const right=inBounds(r,c+1)?G.grid[r][c+1]:null;
      const down=inBounds(r+1,c)?G.grid[r+1][c]:null;
      if(!right||!down)return true;
      if(right.type==="tile"&&right.v===n.v)return true;
      if(down.type==="tile"&&down.v===n.v)return true;
    }
  }
  return false;
}

/* ============================================================
   敌人回合 / 战斗
   ============================================================ */
function enemyTurnTick(){
  const e=G.enemy;if(!e||e.dead||e.hp<=0)return;
  // 灼烧
  if(G.burn>0){dealToEnemy(G.burn,"🔥",true);G.burn=Math.floor(G.burn/2);if(e.hp<=0)return;}
  // 障碍能力计时
  if(e.ability){ if(--e.abilityCd<=0){e.abilityCd=4;useAbility(e);} }
  // 攻击计时
  if(--e.atkCd<=0){
    e.atkCd=effectiveInterval(e);
    enemyAttack(e);
  }
  updateEnemyHUD();
}
function effectiveInterval(e){let n=e.interval;G.relics.forEach(R=>{if(R.intervalMod)n=R.intervalMod(n);});return n;}

function enemyAttack(e){
  hurtPlayer(e.atk,e.name);
  if(enemyMesh){gsap.fromTo(enemyGroup.scale,{x:1.18,y:1.18,z:1.18},{x:1,y:1,z:1,duration:.4,ease:"elastic.out(1,.4)"});}
}
function useAbility(e){
  const empties=[];
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(!G.grid[r][c])empties.push([r,c]);
  if(e.ability==="blocker"&&empties.length){
    const [r,c]=empties[Math.floor(Math.random()*empties.length)];makeBlocker(r,c);
    toastMsg("熔岩巨兽投下了障碍巨石");
  }else if(e.ability==="freeze"){
    const arr=[...G.tiles];if(!arr.length)return;
    const t=arr[Math.floor(Math.random()*arr.length)];
    t.frozen=3;
    const h=tileHeight(t.v);
    const ice=new THREE.Mesh(new THREE.BoxGeometry(CELL*0.95,h+0.1,CELL*0.95),
      new THREE.MeshStandardMaterial({color:0x9fdcff,transparent:true,opacity:.42,roughness:.1,metalness:.5,emissive:0x4db8ff,emissiveIntensity:.45}));
    ice.position.y=h/2;t.mesh.add(ice);t.ice=ice;
    toastMsg("虚空法师冻结了一个方块");
  }
}
function thawTick(){
  G.tiles.forEach(t=>{
    if(t.frozen>0){t.frozen--;if(t.frozen<=0&&t.ice){t.mesh.remove(t.ice);t.ice.geometry.dispose();t.ice.material.dispose();t.ice=null;}}
  });
}

function dealToEnemy(d,tag,silent){
  const e=G.enemy;if(!e||e.dead)return;
  e.hp=Math.max(0,e.hp-d);
  showDmg((tag?tag+" ":"")+"-"+d,false);
  if(!silent){
    if(enemyMesh){
      gsap.fromTo(enemyMesh.material,{emissiveIntensity:1.4},{emissiveIntensity:.55,duration:.4});
      gsap.fromTo(enemyGroup.rotation,{y:enemyGroup.rotation.y+0.3},{y:enemyGroup.rotation.y,duration:.3,ease:"power2.out"});
    }
    shake(Math.min(0.3,d/260));
  }
  updateEnemyHUD();
}

function hurtPlayer(d,src){
  const p=G.player;
  let rem=d;
  if(p.shield>0){const s=Math.min(p.shield,rem);p.shield-=s;rem-=s;}
  p.hp=Math.max(0,p.hp-rem);
  showDmg("-"+d,true);
  flash("hurt");shake(0.3);
  updateHUD();
  if(p.hp<=0)gameOver();
}
function healPlayer(n){
  const p=G.player;if(p.hp>=p.maxhp)return;
  p.hp=Math.min(p.maxhp,p.hp+n);
  showDmg("+"+n,false,"heal");flash("heal");updateHUD();
}

function killEnemy(){
  const e=G.enemy;e.dead=true;
  G.score+=e.floor*120;
  if(enemyMesh){
    burst(enemyGroup.position.x,enemyGroup.position.y,enemyGroup.position.z,e.color,60);
    gsap.to(enemyGroup.scale,{x:0,y:0,z:0,duration:.5,ease:"back.in(1.6)"});
  }
  shake(0.4);
  G.relics.forEach(R=>{if(R.onKill)R.onKill();});
  updateHUD();
  setTimeout(showRelicChoice,650);
}

/* ============================================================
   遗物选择 / 层数推进
   ============================================================ */
let offered=[];
function showRelicChoice(){
  const pool=RELICS.filter(R=>!G.relics.includes(R));
  offered=[];const shuffled=[...pool].sort(()=>Math.random()-.5);

  offered.forEach(R=>{
    const d=document.createElement("div");d.className="card";
    d.innerHTML=`<div class="ic">${R.ic}</div><div class="nm">${R.nm}</div><div class="ds">${R.ds}</div>`;
    d.onclick=()=>pickRelic(R);
    el.cards.appendChild(d);
  });
  el.modal.classList.add("show");
}
function pickRelic(R){
  G.relics.push(R);
  el.modal.classList.remove("show");
  renderRelics();
  nextFloor();
}
function renderRelics(){
  el.relics.innerHTML="";
  G.relics.forEach(R=>{
    const s=document.createElement("span");s.className="relic-ic";s.textContent=R.ic;s.title=R.nm+" — "+R.ds;
    el.relics.appendChild(s);
  });
}
function nextFloor(){
  G.floor++;
  healPlayer(10);
  startFloor();
}
function startFloor(){
  G.enemy=makeEnemy(G.floor);
  buildEnemyMesh(G.enemy.color);
  gsap.from(enemyGroup.scale,{x:0,y:0,z:0,duration:.6,ease:"elastic.out(1,.5)"});
  clearBoard();
  spawnRandom();spawnRandom();
  G.burn=0;G.mergesSinceNova=0;
  updateHUD();updateEnemyHUD();
}
function clearBoard(){
  G.tiles.forEach(t=>removeMesh(t));G.tiles.clear();
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    const n=G.grid[r][c];if(n&&n.type==="blocker")removeMesh(n);
    G.grid[r][c]=null;
  }
}

   HUD / 特效

function updateHUD(){

function showDmg(txt,hurt,kind){

function flash(type){el.flash.className="";void el.flash.offsetWidth;el.flash.className=type;}
function toastMsg(msg){

  setTimeout(()=>{el.hint.style.color="#8a7fc0";el.hint.textContent="滑动 / 方向键 融合元素立方 · 合并即是对守卫的攻击";},1800);
}

/* ---------- 粒子系统 ---------- */
const particleSystems=[];
function burst(x,y,z,color,count){
  const g=new THREE.BufferGeometry(),pos=new Float32Array(count*3),vel=[];
  for(let i=0;i<count;i++){
    pos[i*3]=x;pos[i*3+1]=y;pos[i*3+2]=z;
    const a=Math.random()*Math.PI*2,sp=1.5+Math.random()*3.5;
    vel.push([Math.cos(a)*sp,(Math.random()*3+1.2),Math.sin(a)*sp]);
  }
  g.setAttribute("position",new THREE.BufferAttribute(pos,3));
  const m=new THREE.PointsMaterial({color,size:.22,transparent:true,opacity:.95,
    blending:THREE.AdditiveBlending,depthWrite:false});
  const p=new THREE.Points(g,m);scene.add(p);
  particleSystems.push({p,vel,life:1});
}
function updateParticles(dt){
  for(let i=particleSystems.length-1;i>=0;i--){
    const s=particleSystems[i];s.life-=dt*1.6;
    const arr=s.p.geometry.attributes.position.array;
    for(let j=0;j<s.vel.length;j++){
      s.vel[j][1]-=6*dt;
      arr[j*3]+=s.vel[j][0]*dt;arr[j*3+1]+=s.vel[j][1]*dt;arr[j*3+2]+=s.vel[j][2]*dt;
    }
    s.p.geometry.attributes.position.needsUpdate=true;
    s.p.material.opacity=Math.max(0,s.life);
    if(s.life<=0){scene.remove(s.p);s.p.geometry.dispose();s.p.material.dispose();particleSystems.splice(i,1);}
  }
}

/* ---------- 屏幕震动 ---------- */
let shakeAmt=0;
function shake(a){shakeAmt=Math.max(shakeAmt,a);}

/* ============================================================
   游戏流程
   ============================================================ */
function startGame(){
  G.running=true;G.floor=1;G.score=0;G.moves=0;G.burn=0;G.mergesSinceNova=0;G.regenSteps=0;
  G.player={hp:60,maxhp:60,shield:0};G.relics=[];renderRelics();
  G.grid=newGrid();G.tiles.clear();
  loadBest();
  startFloor();
  el.start.classList.add("hidden");el.over.classList.add("hidden");
}
function gameOver(){
  G.running=false;
  saveBest();
  el.goTitle.textContent="炼金术士陨落";
  el.goSub.textContent="深渊吞噬了你的火焰——但你已抵达第 "+G.floor+" 层。";
  el.statGrid.innerHTML=
    `<div class="stat"><div class="v">${G.floor}</div><div class="k">抵达层数</div></div>`+
    `<div class="stat"><div class="v">${G.score}</div><div class="k">熔炼值</div></div>`+
    `<div class="stat"><div class="v">${G.relics.length}</div><div class="k">遗物收集</div></div>`+
    `<div class="stat"><div class="v">${G.moves}</div><div class="k">总滑动</div></div>`;
  el.over.classList.remove("hidden");
}
function loadBest(){try{G.best=parseInt(localStorage.getItem("abyss_best")||"0",10);}catch(e){G.best=0;}}
function saveBest(){if(G.score>G.best)G.best=G.score;try{localStorage.setItem("abyss_best",String(G.best));}catch(e){}}

/* ============================================================
   输入
   ============================================================ */
const DIRS={up:{dr:-1,dc:0},down:{dr:1,dc:0},left:{dr:0,dc:-1},right:{dr:0,dc:1}};
function tryDir(name){
  if(!G.running)return;
  if(el.modal.classList.contains("show"))return;
  thawTick(); move(DIRS[name]);
}

window.addEventListener("keydown",e=>{
  const map={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",
    w:"up",s:"down",a:"left",d:"right",W:"up",S:"down",A:"left",D:"right"};
  const d=map[e.key];if(!d)return;e.preventDefault();tryDir(d);
});

/* 触屏滑动 */
let tX=0,tY=0;
canvas.addEventListener("touchstart",e=>{tX=e.touches[0].clientX;tY=e.touches[0].clientY;},{passive:true});
canvas.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-tX,dy=e.changedTouches[0].clientY-tY;
  if(Math.abs(dx)<26&&Math.abs(dy)<26)return;
  if(Math.abs(dx)>Math.abs(dy))tryDir(dx>0?"right":"left");else tryDir(dy>0?"down":"up");
},{passive:true});
/* 鼠标拖拽(桌面可选) */
let mDown=false,mX=0,mY=0;
canvas.addEventListener("mousedown",e=>{mDown=true;mX=e.clientX;mY=e.clientY;});
window.addEventListener("mouseup",e=>{
  if(!mDown)return;mDown=false;
  const dx=e.clientX-mX,dy=e.clientY-mY;
  if(Math.abs(dx)<26&&Math.abs(dy)<26)return;
  if(Math.abs(dx)>Math.abs(dy))tryDir(dx>0?"right":"left");else tryDir(dy>0?"down":"up");
});

$("btn-start").onclick=startGame;
$("btn-restart").onclick=startGame;

/* ============================================================
   自适应 & 渲染循环
   ============================================================ */
function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
window.addEventListener("resize",resize);resize();

const clock=new THREE.Clock();
let idleT=0;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05);idleT+=dt;
  updateParticles(dt);
  // 敌人漂浮脉动
  if(enemyMesh&&!G.enemy?.dead){
    enemyGroup.position.y=3.4+Math.sin(idleT*1.8)*0.25;
    enemyGroup.rotation.y+=dt*0.5;
    const p=1+Math.sin(idleT*3)*0.03;
    enemyMesh.userData.wire.rotation.y-=dt*0.9;
    enemyMesh.scale.setScalar(p);
  }
  // 棋盘轻微呼吸 & 相机视差
  boardGroup.position.y=Math.sin(idleT*1.1)*0.04;
  shakeAmt*=Math.pow(0.001,dt); // 快速衰减
  const sx=(Math.random()-.5)*shakeAmt,sy=(Math.random()-.5)*shakeAmt;
  camera.position.set(CAM_BASE.x+sx,CAM_BASE.y+sy,CAM_BASE.z);
  camera.lookAt(0,0.3,0);
  renderer.render(scene,camera);
}
loop();
</script>
