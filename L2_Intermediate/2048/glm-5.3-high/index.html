<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>晶渊远征 · Crystal Abyss 2048 Roguelike</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 30 16 16 30 2 16Z' fill='%237ee8fa'/%3E%3Cpath d='M16 7 25 16 16 25 7 16Z' fill='%23123'/%3E%3C/svg%3E">
<style>
/* ============================================================
   晶渊远征 Crystal Abyss — 2048 x Roguelike
   单文件交付：全部 CSS / JS 内联，无外部依赖
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  background: #05060e;
  color: #dfe8ff;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
body::before {
  content: "";
  position: fixed; inset: -20%;
  background:
    radial-gradient(60% 50% at 18% 12%, rgba(46, 108, 220, .22), transparent 60%),
    radial-gradient(50% 44% at 84% 20%, rgba(150, 64, 220, .18), transparent 62%),
    radial-gradient(70% 60% at 50% 108%, rgba(20, 160, 190, .16), transparent 60%),
    #05060e;
  animation: abyssDrift 26s ease-in-out infinite alternate;
  z-index: 0;
}
@keyframes abyssDrift {
  0%   { transform: translate3d(-1.5%, -1%, 0) scale(1.02); filter: hue-rotate(0deg); }
  100% { transform: translate3d(1.5%, 1.5%, 0) scale(1.06); filter: hue-rotate(28deg); }
}
#fx { position: fixed; inset: 0; z-index: 3; pointer-events: none; }

#app {
  position: relative; z-index: 4;
  height: 100%;
  display: flex; flex-direction: column;
  align-items: center;
  padding: 10px 14px;
  gap: 8px;
}
header {
  width: 100%; max-width: 1180px;
  display: flex; align-items: center; justify-content: space-between;
  flex: 0 0 auto;
}
.logo { display: flex; align-items: baseline; gap: 12px; }
.logo h1 {
  font-size: clamp(19px, 3vw, 26px);
  letter-spacing: 4px;
  background: linear-gradient(100deg, #8be9ff, #d08cff 55%, #ffd76b);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  font-weight: 900;
}
.logo .sub {
  font-size: 11px; letter-spacing: 3px; color: rgba(160, 190, 255, .55);
  text-transform: uppercase;
}
.hbtns { display: flex; gap: 8px; }
.btn {
  cursor: pointer; border: 1px solid rgba(140, 180, 255, .25);
  background: rgba(20, 30, 60, .55); color: #cfe0ff;
  padding: 7px 14px; border-radius: 10px;
  font-size: 13px; letter-spacing: 1px;
  transition: transform .15s cubic-bezier(.3,1.6,.4,1), box-shadow .15s, background .15s;
  backdrop-filter: blur(4px);
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(80, 140, 255, .25); background: rgba(40, 60, 110, .6); }
.btn:active { transform: translateY(1px) scale(.97); }
.btn.primary {
  background: linear-gradient(120deg, #2a7ce0, #7a4ae0);
  border-color: rgba(180, 200, 255, .5); color: #fff; font-weight: 700;
}
.btn.danger { border-color: rgba(255, 120, 140, .4); color: #ffc9d2; }

main {
  flex: 1 1 auto; min-height: 0;
  width: 100%; max-width: 1180px;
  display: grid;
  grid-template-columns: 250px minmax(0, 1fr) 250px;
  gap: 16px;
  align-items: center;
}
.panel {
  background: rgba(12, 17, 38, .62);
  border: 1px solid rgba(130, 160, 255, .14);
  border-radius: 16px;
  padding: 14px;
  backdrop-filter: blur(8px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
  display: flex; flex-direction: column; gap: 10px;
  max-height: 100%;
}
.panel h3 {
  font-size: 12px; letter-spacing: 3px; color: rgba(150, 180, 255, .65);
  border-bottom: 1px solid rgba(130, 160, 255, .15);
  padding-bottom: 6px; font-weight: 600;
}
.stat { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: #a9b8e8; }
.stat b { font-size: 17px; color: #eef3ff; font-variant-numeric: tabular-nums; }

#hpwrap { position: relative; }
#hpbar {
  height: 16px; border-radius: 8px; overflow: hidden;
  background: rgba(255, 255, 255, .08);
  border: 1px solid rgba(255, 255, 255, .12);
}
#hpfill {
  height: 100%; width: 100%;
  background: linear-gradient(90deg, #35e08a, #8be9ff);
  transition: width .45s cubic-bezier(.3, 1, .4, 1), background .4s;
  box-shadow: 0 0 12px rgba(90, 240, 190, .5);
}
#hpfill.low { background: linear-gradient(90deg, #ff5c6b, #ff9d5c); box-shadow: 0 0 12px rgba(255, 90, 100, .6); }
#hptext {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; letter-spacing: 1px;
  text-shadow: 0 1px 3px rgba(0, 0, 0, .8); color: #fff;
}
#bosswrap { display: none; }
#bossbar {
  height: 12px; border-radius: 6px; overflow: hidden;
  background: rgba(255, 255, 255, .07);
  border: 1px solid rgba(255, 110, 140, .35);
}
#bossfill {
  height: 100%; width: 100%;
  background: linear-gradient(90deg, #b02a55, #ff6b9e);
  transition: width .4s;
  box-shadow: 0 0 10px rgba(255, 90, 140, .55);
}
#bossname { font-size: 12px; color: #ffb3c8; font-weight: 700; letter-spacing: 1px; }

#relics { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; }
.relic {
  width: 34px; height: 34px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; cursor: default;
  background: linear-gradient(150deg, rgba(90, 60, 180, .55), rgba(30, 40, 100, .65));
  border: 1px solid rgba(210, 160, 255, .45);
  box-shadow: 0 0 10px rgba(160, 90, 255, .25), inset 0 0 8px rgba(255, 255, 255, .08);
  animation: relicIn .4s cubic-bezier(.3, 1.6, .4, 1);
  position: relative;
}
@keyframes relicIn { from { transform: scale(0) rotate(-30deg); } to { transform: scale(1) rotate(0); } }
.relic .tip {
  visibility: hidden; opacity: 0;
  position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%);
  width: 168px; padding: 8px 10px; border-radius: 8px;
  background: rgba(8, 10, 26, .97); border: 1px solid rgba(180, 140, 255, .4);
  font-size: 12px; color: #e0d8ff; z-index: 60;
  transition: opacity .15s;
  pointer-events: none; text-align: left; line-height: 1.5;
}
.relic .tip b { color: #d9b3ff; display: block; margin-bottom: 2px; }
.relic:hover .tip { visibility: visible; opacity: 1; }
.empty-hint { font-size: 12px; color: rgba(150, 165, 210, .5); }

#log { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 4px; min-height: 60px; scrollbar-width: thin; }
#log p { font-size: 12px; line-height: 1.45; color: #9fb0dd; animation: logIn .25s ease-out; }
@keyframes logIn { from { opacity: 0; transform: translateX(-8px); } }
#log .good { color: #7dedb0; }
#log .bad { color: #ff9aac; }
#log .gold { color: #ffd76b; }
#log .info { color: #8be9ff; }
.seedbox { font-size: 12px; color: #93a8e6; word-break: break-all; }
.seedbox b { color: #cfe0ff; }
.help { font-size: 12px; color: rgba(155, 175, 225, .75); line-height: 1.7; }
.help em { color: #8be9ff; font-style: normal; }

/* ---------- 3D 舞台 ---------- */
#stage-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; min-height: 0; }
#scene {
  perspective: 1300px;
  perspective-origin: 50% 42%;
  touch-action: none;
  flex: 0 0 auto;
}
#scene.shake { animation: shakeAnim .38s linear; }
@keyframes shakeAnim {
  0%, 100% { transform: translate(0, 0); }
  15% { transform: translate(-9px, 4px) rotate(-.6deg); }
  30% { transform: translate(8px, -5px) rotate(.5deg); }
  45% { transform: translate(-6px, 3px) rotate(-.4deg); }
  60% { transform: translate(5px, -3px) rotate(.3deg); }
  80% { transform: translate(-3px, 2px); }
}
#board3d {
  transform-style: preserve-3d;
  transform: rotateX(15deg);
  transition: transform .3s cubic-bezier(.25, 1.4, .4, 1);
  position: relative;
}
#board {
  position: relative;
  width: var(--bs); height: var(--bs);
  --bs: min(460px, 92vw, 56vh);
  border-radius: 18px;
  background: linear-gradient(155deg, #101736, #0a0e26 60%, #0c122e);
  border: 1px solid rgba(130, 170, 255, .22);
  box-shadow:
    0 24px 50px rgba(0, 0, 0, .6),
    0 8px 0 #070a1c,
    0 0 60px rgba(60, 100, 220, .12),
    inset 0 1px 0 rgba(200, 220, 255, .12);
}
#cells { position: absolute; inset: 0; padding: 3.2%; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 3.2%; }
.cell {
  border-radius: 12%;
  background: rgba(255, 255, 255, .028);
  box-shadow: inset 0 2px 8px rgba(0, 0, 0, .55), inset 0 -1px 0 rgba(160, 190, 255, .06);
}
#tiles { position: absolute; inset: 0; pointer-events: none; z-index: 5; }

/* ---------- 方块 ---------- */
.tile {
  position: absolute; left: 0; top: 0;
  transition: transform 130ms cubic-bezier(.25, .9, .28, 1);
  will-change: transform;
  z-index: 2;
}
.tile.front { z-index: 3; }
.tile .inner {
  width: 100%; height: 100%;
  border-radius: 12%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative;
  transform: translateZ(0);
  box-shadow: 0 5px 0 var(--dk, #123), 0 12px 22px rgba(0, 0, 0, .5), 0 0 18px var(--gl, transparent);
}
.tile.gem .inner { background: linear-gradient(158deg, var(--c1), var(--c2)); border: 1px solid rgba(255, 255, 255, .22); }
.tile .g-val { font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; text-shadow: 0 2px 4px rgba(0, 0, 0, .45); }
.tile .g-name { font-size: 10px; letter-spacing: 2px; opacity: .82; margin-top: 7%; text-shadow: 0 1px 2px rgba(0, 0, 0, .5); }

/* 各阶配色 */
.t2    { --c1:#9ff3ff; --c2:#38aee6; --dk:#175f8a; --gl:rgba(90,200,255,.4); }
.t4    { --c1:#9ff5e2; --c2:#25bda9; --dk:#0d6b60; --gl:rgba(80,230,200,.4); }
.t8    { --c1:#b4f7a4; --c2:#4fc44f; --dk:#2a7a2e; --gl:rgba(120,230,110,.4); }
.t16   { --c1:#f8f190; --c2:#d8b532; --dk:#8a6f14; --gl:rgba(240,220,110,.42); }
.t32   { --c1:#ffd897; --c2:#f09a3e; --dk:#8f5714; --gl:rgba(255,180,90,.45); }
.t64   { --c1:#ffb497; --c2:#f0704a; --dk:#8f3418; --gl:rgba(255,130,90,.45); }
.t128  { --c1:#ffa8c5; --c2:#e5558f; --dk:#8f1f4a; --gl:rgba(255,110,160,.45); }
.t256  { --c1:#eab8ff; --c2:#a055e8; --dk:#5a268f; --gl:rgba(200,110,255,.5); }
.t512  { --c1:#c0b3ff; --c2:#7055e8; --dk:#39268f; --gl:rgba(140,110,255,.5); }
.t1024 { --c1:#ffffff; --c2:#a8ccff; --dk:#39628f; --gl:rgba(200,230,255,.6); }
.t2048 { --c1:#ffe9a3; --c2:#ff9d2e; --dk:#8f4d0a; --gl:rgba(255,200,90,.65); }
.t4096 { --c1:#b8ffe8; --c2:#00d998; --dk:#046e50; --gl:rgba(0,255,190,.6); }
.t8192 { --c1:#ffb8c8; --c2:#ff2e62; --dk:#8f0a28; --gl:rgba(255,70,110,.65); }
.tmax  { --c1:#ffffff; --c2:#66f2ff; --dk:#0a5a8f; --gl:rgba(255,255,255,.7); }

.tile.spawn .inner { animation: spawnIn .28s cubic-bezier(.3, 1.7, .5, 1) backwards; }
@keyframes spawnIn {
  0% { transform: scale(.1) rotate(-8deg); opacity: 0; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}
.tile.merged .inner { animation: mergePop .36s cubic-bezier(.3, 1.6, .4, 1); }
@keyframes mergePop {
  0% { transform: scale(1); }
  42% { transform: scale(1.32) translateZ(24px); filter: brightness(1.6); }
  72% { transform: scale(.94); }
  100% { transform: scale(1); }
}
.tile.gone { transition: opacity .18s; opacity: 0; }

/* 怪物 */
.tile.monster { z-index: 2; }
.tile.monster .inner {
  background: linear-gradient(155deg, #351540, #1b0b26 65%, #241033);
  border: 1px solid rgba(255, 110, 150, .4);
  box-shadow: 0 5px 0 #0d0517, 0 12px 22px rgba(0, 0, 0, .55), 0 0 20px rgba(255, 70, 120, .18);
  animation: mBreathe 2.6s ease-in-out infinite;
}
@keyframes mBreathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.045); }
}
.m-face { width: 52%; aspect-ratio: 1; position: relative; display: flex; align-items: center; justify-content: center; }
.m-eye {
  width: 88%; height: 88%; border-radius: 50%;
  background: radial-gradient(circle at 42% 38%, #fff5f0 0%, #ffb35c 18%, #ff4d3d 46%, #5c0a1e 74%, #2b0410 100%);
  box-shadow: 0 0 14px rgba(255, 90, 70, .55), inset 0 -3px 8px rgba(0, 0, 0, .5);
  animation: eyePulse 2.2s ease-in-out infinite;
  position: relative;
}
.m-eye::after {
  content: ""; position: absolute; top: 16%; left: 20%;
  width: 22%; height: 22%; border-radius: 50%;
  background: rgba(255, 255, 255, .85);
  filter: blur(1px);
}
@keyframes eyePulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(.9); }
}
.m-hp {
  font-size: clamp(12px, 2.6vw, 17px); font-weight: 900; color: #ffd7de;
  text-shadow: 0 0 8px rgba(255, 60, 90, .8), 0 2px 3px #000;
  margin-top: 6%; font-variant-numeric: tabular-nums;
}
.m-tag {
  position: absolute; top: -9px; font-size: 9px; letter-spacing: 1px;
  background: linear-gradient(90deg, #ff4d6d, #b02a55);
  color: #fff; padding: 2px 7px; border-radius: 6px; font-weight: 800;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .5);
}
.tile.monster.warn .inner {
  animation: warnPulse .8s ease-in-out infinite;
  border-color: rgba(255, 60, 60, .95);
}
@keyframes warnPulse {
  0%, 100% { box-shadow: 0 5px 0 #0d0517, 0 0 12px rgba(255, 60, 60, .35); }
  50% { box-shadow: 0 5px 0 #0d0517, 0 0 34px rgba(255, 60, 60, .95); }
}
.tile.monster.attack .inner { animation: mStrike .34s cubic-bezier(.3, 1.5, .5, 1); }
@keyframes mStrike {
  0% { transform: scale(1); }
  40% { transform: scale(1.3) translateZ(26px); filter: brightness(1.8) saturate(1.6); }
  100% { transform: scale(1); }
}
.tile.monster.die .inner { animation: mDie .5s cubic-bezier(.4, 0, .8, .4) forwards; }
@keyframes mDie {
  0% { transform: scale(1); opacity: 1; }
  35% { transform: scale(1.28) translateZ(30px); filter: brightness(2.2); }
  100% { transform: scale(.2) rotate(22deg); opacity: 0; }
}

/* 漂浮文字 */
.floaty {
  position: fixed; z-index: 30; pointer-events: none;
  font-weight: 900; font-size: 17px; letter-spacing: 1px;
  text-shadow: 0 2px 6px rgba(0, 0, 0, .7);
  animation: floatUp .95s cubic-bezier(.2, .7, .3, 1) forwards;
  white-space: nowrap;
}
@keyframes floatUp {
  0% { transform: translate(-50%, -50%) scale(.6); opacity: 0; }
  18% { transform: translate(-50%, -70%) scale(1.15); opacity: 1; }
  100% { transform: translate(-50%, -190%) scale(.95); opacity: 0; }
}
.floaty.score { color: #ffd76b; }
.floaty.hurt { color: #ff5c6b; font-size: 20px; }
.floaty.heal { color: #7dedb0; }
.floaty.info { color: #8be9ff; }

/* 伤害红晕 */
#vignette {
  position: fixed; inset: 0; z-index: 20; pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse at center, transparent 52%, rgba(255, 20, 50, .55) 100%);
  transition: opacity .12s;
}
#vignette.hit { opacity: 1; transition: opacity .05s; }
body.lowhp #vignette { opacity: .35; animation: lowPulse 1.6s ease-in-out infinite; }
@keyframes lowPulse { 50% { opacity: .6; } }

/* 横幅 */
#banner {
  position: fixed; left: 50%; top: 40%;
  transform: translate(-50%, -50%);
  z-index: 40; pointer-events: none; opacity: 0;
  text-align: center;
}
#banner.show { animation: bannerAnim 1.5s cubic-bezier(.2, 1, .3, 1) forwards; }
#banner .b1 {
  font-size: clamp(28px, 6vw, 52px); font-weight: 900; letter-spacing: 8px;
  background: linear-gradient(100deg, #8be9ff, #ffd76b 60%, #ff8d6b);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  filter: drop-shadow(0 4px 18px rgba(120, 180, 255, .5));
}
#banner .b2 { font-size: 14px; letter-spacing: 5px; color: rgba(200, 220, 255, .8); margin-top: 8px; }
@keyframes bannerAnim {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(2.4); filter: blur(8px); }
  18% { opacity: 1; transform: translate(-50%, -50%) scale(.96); filter: blur(0); }
  30% { transform: translate(-50%, -50%) scale(1.03); }
  75% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -62%) scale(1); }
}

/* D-Pad */
#dpad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 44px); gap: 6px; }
#dpad .btn { display: flex; align-items: center; justify-content: center; font-size: 17px; padding: 0; }
#dpad .btn[data-dir="up"] { grid-column: 2; grid-row: 1; }
#dpad .btn[data-dir="left"] { grid-column: 1; grid-row: 2; }
#dpad .btn[data-dir="down"] { grid-column: 2; grid-row: 2; }
#dpad .btn[data-dir="right"] { grid-column: 3; grid-row: 2; }

/* 模态层 */
#overlay {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(3, 5, 14, .74);
  backdrop-filter: blur(7px);
  display: none;
  align-items: center; justify-content: center;
  padding: 18px;
}
#overlay.show { display: flex; }
.modal {
  width: min(620px, 96vw);
  max-height: 92vh; overflow-y: auto;
  background: linear-gradient(160deg, rgba(22, 30, 62, .97), rgba(10, 13, 32, .97));
  border: 1px solid rgba(140, 180, 255, .3);
  border-radius: 20px;
  padding: 26px 26px 22px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, .7), 0 0 50px rgba(80, 120, 255, .12);
  animation: modalIn .38s cubic-bezier(.25, 1.5, .4, 1);
  text-align: center;
}
@keyframes modalIn {
  from { transform: translateY(46px) scale(.9); opacity: 0; }
  to { transform: translateY(0) scale(1); opacity: 1; }
}
.modal h2 {
  font-size: 22px; letter-spacing: 3px; margin-bottom: 6px;
  background: linear-gradient(100deg, #8be9ff, #d08cff);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.modal .mdesc { font-size: 13px; color: #a9b8e8; line-height: 1.8; margin-bottom: 16px; }
.cards { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 14px 0 6px; }
.card {
  flex: 1 1 150px; max-width: 190px;
  background: linear-gradient(155deg, rgba(40, 55, 110, .5), rgba(18, 24, 55, .8));
  border: 1px solid rgba(150, 180, 255, .28);
  border-radius: 14px;
  padding: 16px 12px;
  cursor: pointer;
  transition: transform .18s cubic-bezier(.3, 1.6, .4, 1), box-shadow .18s, border-color .18s;
}
.card:hover {
  transform: translateY(-7px) scale(1.03);
  border-color: rgba(210, 160, 255, .7);
  box-shadow: 0 16px 34px rgba(90, 60, 220, .35);
}
.card .gly { font-size: 30px; margin-bottom: 8px; filter: drop-shadow(0 0 8px rgba(200, 140, 255, .6)); }
.card .cname { font-weight: 800; font-size: 15px; color: #e8ecff; margin-bottom: 6px; letter-spacing: 1px; }
.card .cdesc { font-size: 12px; color: #9db0e0; line-height: 1.6; }
.card .hint { font-size: 11px; color: #7dedb0; margin-top: 6px; }
.statgrid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px 22px;
  margin: 14px auto; max-width: 400px; text-align: left;
}
.statgrid div { display: flex; justify-content: space-between; font-size: 13px; color: #a9b8e8; border-bottom: 1px dashed rgba(130, 160, 255, .15); padding: 5px 0; }
.statgrid b { color: #f0f4ff; font-variant-numeric: tabular-nums; }
.seed-input {
  background: rgba(10, 15, 35, .8); border: 1px solid rgba(140, 180, 255, .35);
  color: #dfe8ff; border-radius: 9px; padding: 8px 12px; font-size: 14px;
  width: 200px; text-align: center; letter-spacing: 2px; outline: none;
}
.seed-input:focus { border-color: #8be9ff; box-shadow: 0 0 14px rgba(120, 220, 255, .3); }
.mrow { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
.titleglow {
  font-size: clamp(30px, 6vw, 46px); font-weight: 900; letter-spacing: 10px; margin: 4px 0 2px;
  background: linear-gradient(100deg, #8be9ff, #d08cff 55%, #ffd76b);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  filter: drop-shadow(0 6px 24px rgba(130, 160, 255, .45));
}
.titlesub { letter-spacing: 14px; font-size: 12px; color: rgba(170, 200, 255, .6); text-indent: 14px; }
.crystal-mark { font-size: 40px; color: #8be9ff; filter: drop-shadow(0 0 16px rgba(120, 220, 255, .8)); animation: markFloat 3.2s ease-in-out infinite; }
@keyframes markFloat { 50% { transform: translateY(-8px) rotate(6deg); } }

@media (max-width: 980px) {
  body { overflow-y: auto; }
  #app { height: auto; min-height: 100%; }
  main { grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
  .panel { order: 3; }
  #stage-wrap { order: 1; }
  #panel-left { order: 2; }
  #board { --bs: min(88vw, 66vh); }
  #log { max-height: 130px; }
}
</style>
</head>
<body>

        怪物每 3 回合袭你一次，<em>领主</em>被击碎即可攻破本层。

<div id="overlay"><div class="modal" id="modal-box"></div></div>

<script>
'use strict';
/* ============================================================
   晶渊远征 Crystal Abyss
   2048 合并 × Roguelike（遗物 / 怪物 / 随机事件 / 楼层递进 / 种子随机）
   纯原生实现：CSS 3D 舞台 + Canvas 粒子 + WebAudio 合成音效
   ============================================================ */
var HAS_DOM = (typeof document !== 'undefined' && typeof document.getElementById === 'function');

/* ---------------- 种子随机（mulberry32） ---------------- */
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(1);
function randInt(min, max) { return min + Math.floor(rng() * (max - min + 1)); }
function pick(arr) { return arr[Math.floor(rng() * arr.length)]; }

/* ---------------- 常量与数据表 ---------------- */
var SIZE = 4;
var BASE_HP = 30;
var MOVE_MS = 130;
var VICTORY_FLOOR = 10;

var GEM_NAMES = { 2: '微光', 4: '辉晶', 8: '耀石', 16: '星髓', 32: '月辉', 64: '日冕', 128: '星核', 256: '穹顶', 512: '超新星', 1024: '奇点', 2048: '创世', 4096: '永昼', 8192: '弦' };
function gemName(v) { return GEM_NAMES[v] || '彼岸'; }
function tierClass(v) { return 't' + Math.min(v, 8192); }

var MONSTER_NAMES = { 2: '晶屑爬虫', 4: '荆晶蠕虫', 8: '深渊之眼', 16: '蚀光水母', 32: '裂隙魔像', 64: '虚空暴君', 128: '渊主残影', 256: '寂灭之种', 512: '星噬巨口' };
function monsterName(tier) { return MONSTER_NAMES[tier] || '无名深渊体'; }

var BOSS_NAMES = ['深渊监视者', '晶窟暴君', '蚀月水母后', '裂隙主宰', '虚空吞噬者', '渊底之影', '星骸巨龙', '湮灭之心', '终焉歌者', '创世残响', '无名之渊', '万物归寂'];

var RELICS = [
  { id: 'overforge', gly: '⇈', name: '超载熔炉', desc: '合并产生的新晶石额外升一阶（数值 ×2 叠乘）。' },
  { id: 'fangs', gly: '◈', name: '吸血獠牙', desc: '击碎怪物时回复 2 点生命。' },
  { id: 'fortune', gly: '✦', name: '财富星纹', desc: '所有得分翻倍。' },
  { id: 'lucky', gly: '❋', name: '幸运菌丝', desc: '新生成的晶石有 25% 概率升一阶。' },
  { id: 'hammer', gly: '⚒', name: '巨匠重锤', desc: '晶石价值 ≥ 怪物生命的一半即可将其击碎。' },
  { id: 'shield', gly: '⛨', name: '星鳞护盾', desc: '每承受 3 次伤害，自动格挡 1 次。' },
  { id: 'siphon', gly: '∿', name: '虹吸律动', desc: '每次合并回复 1 点生命。' },
  { id: 'hourglass', gly: '⧖', name: '缓时沙漏', desc: '所有怪物的攻击间隔增加 2 回合。' },
  { id: 'cluster', gly: '✳', name: '晶簇增殖', desc: '每次生成晶石时，30% 概率额外多生成一颗。' },
  { id: 'echo', gly: '↻', name: '弃子回响', desc: '晶石击碎怪物后，30% 概率在随机空格重生一颗同阶晶石。' }
];
var RELIC_MAP = {};
for (var ri = 0; ri < RELICS.length; ri++) RELIC_MAP[RELICS[ri].id] = RELICS[ri];
var STEW = { id: 'stew', gly: '✚', name: '星尘蜜饵', desc: '立即回复 10 点生命。（可重复获取）' };

var EVENTS = [
  {
    id: 'altar', title: '血晶祭坛',
    desc: '猩红的祭坛矗立在晶脉交汇处，低声索求着生命的祭品。',
    choices: [
      { label: '献祭 6 点生命', hint: '获得一件未拥有的随机遗物', fn: function () { state.hp = Math.max(1, state.hp - 6); grantRandomRelic(); } },
      { label: '默默离开', hint: '无事发生', fn: function () { V.log('你转身离开了祭坛。', 'info'); } }
    ]
  },
  {
    id: 'vein', title: '晶脉涌动',
    desc: '地底传来脉动，温热的晶能顺着裂隙涌上地面。',
    choices: [
      { label: '采撷晶脉', hint: '棋盘空格生成两颗 8 阶晶石', fn: function () { spawnGem(8); spawnGem(8); V.log('晶脉凝结出两颗耀石。', 'good'); } },
      { label: '汲取温热', hint: '回复 10 点生命', fn: function () { heal(10, '晶脉温热'); } }
    ]
  },
  {
    id: 'whisper', title: '深渊低语',
    desc: '耳畔响起粘稠的低语，它许诺力量，也索要代价。',
    choices: [
      { label: '接受咒缚', hint: '本层怪物伤害减半', fn: function () { state.buff.dmgMult = 0.5; V.log('咒缚生效：本层怪物伤害减半。', 'good'); } },
      { label: '汲取荣光', hint: '本层得分翻倍', fn: function () { state.buff.scoreMult = 2; V.log('荣光加身：本层得分翻倍。', 'gold'); } }
    ]
  },
  {
    id: 'merchant', title: '谜之商人',
    desc: '兜帽下的商人不发一语，只摊开手掌：分数，或者生命。',
    choices: [
      { label: '出售分数', hint: '失去 40% 得分，回复 12 点生命', fn: function () { state.score = Math.floor(state.score * 0.6); heal(12, '商人灵药'); } },
      { label: '摇头拒绝', hint: '保持现状', fn: function () { V.log('商人耸耸肩，消失在黑暗里。', 'info'); } }
    ]
  },
  {
    id: 'forge', title: '远古锻炉',
    desc: '一座残破的锻炉仍在燃烧，炉火舔舐着周围的晶壁。',
    choices: [
      { label: '投入晶石', hint: '棋盘上所有晶石升一阶', fn: function () { forEachGem(function (g) { g.v *= 2; if (g.v > state.largest) state.largest = g.v; V.tileRefresh(g); }); V.log('锻炉轰鸣：全场晶石升阶！', 'gold'); } },
      { label: '以炉暖身', hint: '回复 8 点生命', fn: function () { heal(8, '炉火暖意'); } }
    ]
  }
];

/* ---------------- 游戏状态 ---------------- */
var board = null;       // 4x4，实体或 null
var state = null;
var busy = false;
var nextId = 1;
var draftChoices = [];
var currentEvent = null;

function emptyBoard() {
  var b = [];
  for (var r = 0; r < SIZE; r++) { b.push([null, null, null, null]); }
  return b;
}
function entities() {
  var out = [];
  if (!board) return out;
  for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) if (board[r][c]) out.push(board[r][c]);
  return out;
}
function forEachGem(fn) { var es = entities(); for (var i = 0; i < es.length; i++) if (es[i].kind === 'gem') fn(es[i]); }
function forEachMonster(fn) { var es = entities(); for (var i = 0; i < es.length; i++) if (es[i].kind === 'monster') fn(es[i]); }
function emptyCells() {
  var out = [];
  if (!board) return out;
  for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) if (!board[r][c]) out.push([r, c]);
  return out;
}
function bossEntity() {
  var found = null;
  forEachMonster(function (m) { if (m.boss) found = m; });
  return found;
}

/* ---------------- 数值公式 ---------------- */
function mergedValue(v) { var n = v * 2; if (state && state.relics && state.relics.overforge) n *= 2; return n; }
function requiredValue(m) { return (state && state.relics && state.relics.hammer) ? Math.ceil(m.hp / 2) : m.hp; }
function attackPeriod(m) { return ((m && m.boss) ? 4 : 3) + ((state && state.relics && state.relics.hourglass) ? 2 : 0); }
function monsterInterval() { return Math.max(4, 7 - Math.floor((state.floor - 1) / 3)); }
function monsterCap() { return Math.min(6, 3 + Math.floor(state.floor / 2)); }
function bossHPFor(floor) { return Math.round(16 * Math.pow(1.45, floor - 1)); }
function monsterDamage(m) {
  var d = m.boss ? (3 + Math.floor(state.floor / 2)) : (1 + Math.ceil(m.tier / 2));
  d = Math.round(d * state.buff.dmgMult);
  return Math.max(1, d);
}
function scoreMult() { return ((state && state.relics && state.relics.fortune) ? 2 : 1) * ((state && state.buff && state.buff.scoreMult) || 1); }
function addScore(n) { state.score += Math.round(n * scoreMult()); }
function heal(n, why) {
  if (state.hp >= state.maxHp) return;
  var real = Math.min(n, state.maxHp - state.hp);
  state.hp += real;
  V.log((why || '回复') + ' +' + real + ' 生命', 'good');
  V.hpFloat('+' + real, 'heal');
  V.updateHUD();
}

/* ---------------- 生成 ---------------- */
function placeAt(e, r, c) { e.r = r; e.c = c; board[r][c] = e; }

function spawnGem(fixedVal) {
  var cells = emptyCells();
  if (!cells.length) return null;
  var cell = cells[Math.floor(rng() * cells.length)];
  var v = fixedVal || (rng() < 0.85 ? 2 : 4);
  if (state.relics.lucky && rng() < 0.25) v *= 2;
  var g = { id: nextId++, kind: 'gem', v: v, r: 0, c: 0, el: null };
  placeAt(g, cell[0], cell[1]);
  if (g.v > state.largest) state.largest = g.v;
  V.tileCreate(g, true);
  return g;
}

function spawnMonster() {
  var cells = emptyCells();
  var count = 0; forEachMonster(function () { count++; });
  if (!cells.length || count >= monsterCap()) return null;
  var cell = cells[Math.floor(rng() * cells.length)];
  var tBase = 2 + Math.floor((state.floor - 1) / 2);
  var tier = Math.min(10, tBase + randInt(0, 2));
  var m = {
    id: nextId++, kind: 'monster', boss: false, tier: tier,
    hp: Math.pow(2, tier), maxHp: Math.pow(2, tier),
    cd: attackPeriod(null), r: 0, c: 0, el: null
  };
  m.cd = 3 + (state.relics.hourglass ? 2 : 0);
  m.name = monsterName(tier);
  placeAt(m, cell[0], cell[1]);
  V.tileCreate(m, true);
  V.log(m.name + '（生命 ' + m.hp + '）自深渊浮现。', 'bad');
  return m;
}

function spawnBoss() {
  var cells = emptyCells();
  if (!cells.length) return null;
  var cell = cells[Math.floor(rng() * cells.length)];
  var hp = bossHPFor(state.floor);
  var m = {
    id: nextId++, kind: 'monster', boss: true, tier: Math.ceil(Math.log2(hp)),
    hp: hp, maxHp: hp, cd: 6 + (state.relics.hourglass ? 2 : 0),
    r: 0, c: 0, el: null, name: BOSS_NAMES[(state.floor - 1) % BOSS_NAMES.length]
  };
  placeAt(m, cell[0], cell[1]);
  V.tileCreate(m, true);
  V.log('领主「' + m.name + '」苏醒了（生命 ' + hp + '）。', 'bad');
  return m;
}

/* ---------------- 移动解算（纯数据，可模拟） ---------------- */
function computeMove(bd, dir) {
  var ev = { moves: [], merges: [], kills: [], changed: false };
  for (var r0 = 0; r0 < SIZE; r0++) for (var c0 = 0; c0 < SIZE; c0++) {
    var ent = bd[r0][c0]; if (ent) ent.dead = false;
  }
  for (var i = 0; i < SIZE; i++) {
    var idxs = [];
    for (var k = 0; k < SIZE; k++) {
      if (dir === 'left') idxs.push([i, k]);
      else if (dir === 'right') idxs.push([i, SIZE - 1 - k]);
      else if (dir === 'up') idxs.push([k, i]);
      else idxs.push([SIZE - 1 - k, i]);
    }
    var seg = [];
    var boundary = null;
    var flush = function (cells, bmon) {
      var gems = [];
      var gi;
      for (gi = 0; gi < cells.length; gi++) if (cells[gi].e) gems.push(cells[gi]);
      if (!gems.length) return;
      /* 1. 压缩 + 合并 */
      var placed = [];
      for (gi = 0; gi < cells.length; gi++) {
        var e = cells[gi].e;
        if (!e) continue;
        var last = placed[placed.length - 1];
        if (last && last.g.v === e.v && !last.merged) {
          last.g.v = mergedValue(e.v);
          last.merged = true;
          e.dead = true;
          ev.merges.push({ g: last.g, old: e, v: last.g.v });
        } else {
          placed.push({ g: e, merged: false });
        }
      }
      /* 2. 清空区间 */
      for (gi = 0; gi < cells.length; gi++) bd[cells[gi].r][cells[gi].c] = null;
      /* 3. 领头晶石撞击边界怪物 */
      var start = 0;
      if (bmon && !bmon.dead && placed.length > 0) {
        var lead = placed[0].g;
        if (lead.v >= requiredValue(bmon)) {
          ev.kills.push({ m: bmon, g: lead });
          lead.dead = true; bmon.dead = true;
          lead.r = bmon.r; lead.c = bmon.c; /* 动画：晶石冲入怪物格 */
          start = 1;
          ev.moves.push({ g: lead });
        }
      }
      /* 4. 落位 */
      var n = 0;
      for (var s = start; s < placed.length; s++, n++) {
        var g = placed[s].g;
        var cell = cells[n];
        bd[cell.r][cell.c] = g;
        if (g.r !== cell.r || g.c !== cell.c) {
          g.r = cell.r; g.c = cell.c;
          ev.moves.push({ g: g });
          ev.changed = true;
        }
      }
      /* 5. 被合并者滑向幸存者后消散 */
      for (var mi = 0; mi < ev.merges.length; mi++) {
        var me = ev.merges[mi];
        if (me.g.r === null) continue;
      }
      if (ev.merges.length && placed.length) {
        for (var mj = 0; mj < ev.merges.length; mj++) {
          var me2 = ev.merges[mj];
          if (bd[me2.g.r] && bd[me2.g.r][me2.g.c] === me2.g) {
            me2.old.r = me2.g.r; me2.old.c = me2.g.c;
            ev.moves.push({ g: me2.old });
          }
        }
        ev.changed = true;
      }
      if (start === 1) ev.changed = true;
    };
    for (var q = 0; q < idxs.length; q++) {
      var rr = idxs[q][0], cc = idxs[q][1];
      var cellEnt = bd[rr][cc];
      if (cellEnt && cellEnt.kind === 'monster') {
        flush(seg, boundary);
        seg = [];
        boundary = cellEnt;
      } else {
        seg.push({ r: rr, c: cc, e: cellEnt });
      }
    }
    flush(seg, boundary);
  }
  return ev;
}

function canMove() {
  if (!board || !state) return false;
  for (var d = 0; d < 4; d++) {
    var dir = ['up', 'down', 'left', 'right'][d];
    var sim = [];
    for (var r = 0; r < SIZE; r++) {
      var row = [];
      for (var c = 0; c < SIZE; c++) { var e = board[r][c]; row.push(e ? { kind: e.kind, v: e.v, hp: e.hp, boss: e.boss, tier: e.tier, r: r, c: c, dead: false } : null); }
      sim.push(row);
    }
    if (computeMove(sim, dir).changed) return true;
  }
  return false;
}

function sleep(ms) {
  if (!HAS_DOM) return Promise.resolve();
  return new Promise(function (res) { setTimeout(res, ms); });
}

/* ---------------- 出手 ---------------- */
function doMove(dir) {
  if (!state || state.phase !== 'play' || busy) return Promise.resolve(false);
  var res = computeMove(board, dir);
  if (!res.changed) {
    V.bump(dir);
    Sound.play('deny');
    return Promise.resolve(false);
  }
  busy = true;
  state.moves++;
  Sound.play('move');
  V.tilt(dir);
  for (var i = 0; i < res.moves.length; i++) V.tileMove(res.moves[i].g);
  return sleep(MOVE_MS).then(function () {
    /* 合并结算 */
    for (var mi = 0; mi < res.merges.length; mi++) {
      var me = res.merges[mi];
      V.tileRemove(me.old);
      V.tileMergePop(me.g);
      addScore(me.v);
      state.merges++;
      if (me.v > state.largest) state.largest = me.v;
      if (state.relics.siphon) heal(1, '虹吸律动');
    }
    /* 击杀结算 */
    var bossKilled = false;
    for (var ki = 0; ki < res.kills.length; ki++) {
      var ke = res.kills[ki];
      V.tileRemove(ke.g);
      V.tileDie(ke.m);
      /* 从棋盘数据中移除被击碎的怪物与耗损的晶石（避免幽灵实体残留） */
      if (board[ke.g.r] && board[ke.g.r][ke.g.c] === ke.g) board[ke.g.r][ke.g.c] = null;
      if (board[ke.m.r] && board[ke.m.r][ke.m.c] === ke.m) board[ke.m.r][ke.m.c] = null;
      addScore(ke.m.hp * 5);
      state.kills++;
      if (state.relics.fangs) heal(2, '吸血獠牙');
      V.log(ke.g.v + ' 阶晶石击碎了 ' + (ke.m.boss ? '领主「' + ke.m.name + '」' : ke.m.name) + '（+' + Math.round(ke.m.hp * 5 * scoreMult()) + '分）', 'gold');
      if (ke.m.boss) bossKilled = true;
      if (state.relics.echo && rng() < 0.3 && emptyCells().length) {
        spawnGem(ke.g.v);
        V.log('弃子回响：一颗 ' + ke.g.v + ' 阶晶石重新凝结。', 'info');
      }
    }
    if (res.merges.length) V.microShake(res.merges.length);
    V.updateHUD();
    return sleep(160).then(function () {
      /* 生成晶石 */
      spawnGem();
      if (state.relics.cluster && rng() < 0.3) spawnGem();
      /* 怪物刷新 */
      state.monsterTimer--;
      if (state.monsterTimer <= 0) {
        state.monsterTimer = monsterInterval();
        spawnMonster();
      }
      /* 怪物行动 */
      var attackers = [];
      forEachMonster(function (m) {
        m.cd--;
        if (m.cd <= 0) { m.cd = attackPeriod(m); attackers.push(m); }
      });
      return attackSequence(attackers, 0).then(function () {
        forEachMonster(function (m) { V.tileWarn(m, m.cd === 1); });
        V.updateHUD();
        busy = false;
        if (state.hp <= 0) { gameOver('slain'); return true; }
        if (bossKilled) { floorClear(); return true; }
        if (!canMove()) { gameOver('exhaust'); return true; }
        return true;
      });
    });
  }).then(function (ok) { return ok && true; }, function (err) { busy = false; throw err; });
}

function attackSequence(list, idx) {
  if (idx >= list.length) return Promise.resolve();
  var m = list[idx];
  return attackPlayer(m).then(function () {
    return sleep(110).then(function () { return attackSequence(list, idx + 1); });
  });
}

function attackPlayer(m) {
  return sleep(70).then(function () {
    var dmg = monsterDamage(m);
    V.tileAttack(m);
    state.dmgTaken++;
    if (state.relics.shield && state.dmgTaken % 3 === 0) {
      Sound.play('shield');
      V.hpFloat('格挡！', 'info');
      V.log('星鳞护盾挡下了 ' + m.name + ' 的袭击。', 'info');
      return Promise.resolve();
    }
    state.hp -= dmg;
    Sound.play('hurt');
    V.vignetteHit();
    V.shake();
    V.hpFloat('-' + dmg, 'hurt');
    V.log(m.name + ' 袭击了你 -' + dmg, 'bad');
    V.updateHUD();
    return Promise.resolve();
  });
}

/* ---------------- 楼层流转 ---------------- */
function floorClear() {
  state.phase = 'clearing';
  Sound.play('clear');
  addScore(state.floor * 50);
  state.maxHp += 5;
  state.hp = Math.min(state.maxHp, state.hp + 10);
  V.banner('第 ' + state.floor + ' 层 · 攻破', '晶能恢复 +10 · 生命上限 +5 · 择取一件遗物');
  V.log('攻破第 ' + state.floor + ' 层！（+' + Math.round(state.floor * 50 * scoreMult()) + '分）', 'gold');
  V.updateHUD();
  sleep(1000).then(function () { openDraft(); });
}

function openDraft() {
  var pool = [];
  for (var i = 0; i < RELICS.length; i++) if (!state.relics[RELICS[i].id]) pool.push(RELICS[i]);
  /* 洗牌（种子随机） */
  for (var j = pool.length - 1; j > 0; j--) {
    var t = Math.floor(rng() * (j + 1));
    var tmp = pool[j]; pool[j] = pool[t]; pool[t] = tmp;
  }
  draftChoices = pool.slice(0, 3);
  while (draftChoices.length < 3) draftChoices.push(STEW);
  state.phase = 'draft';
  V.showDraft(draftChoices);
}

function chooseDraft(i) {
  if (state.phase !== 'draft' || busy) return;
  var relic = draftChoices[i];
  if (!relic) return;
  applyRelic(relic);
  Sound.play('relic');
  advanceFloor();
}

function applyRelic(relic) {
  if (relic.id === 'stew') { heal(10, '星尘蜜饵'); V.log('获得了 星尘蜜饵（+10 生命）。', 'good'); return; }
  state.relics[relic.id] = true;
  V.log('获得遗物「' + relic.name + '」。', 'gold');
  V.addRelicIcon(relic);
}

function grantRandomRelic() {
  var unowned = [];
  for (var i = 0; i < RELICS.length; i++) if (!state.relics[RELICS[i].id]) unowned.push(RELICS[i]);
  if (!unowned.length) { heal(6, '祭坛余温'); return; }
  applyRelic(unowned[Math.floor(rng() * unowned.length)]);
}

function advanceFloor() {
  state.floor++;
  state.buff = { dmgMult: 1, scoreMult: 1 };
  state.monsterTimer = monsterInterval();
  V.clearTiles();
  board = emptyBoard();
  spawnBoss();
  spawnGem(2);
  spawnGem(rng() < 0.4 ? 4 : 2);
  V.banner('第 ' + state.floor + ' 层', BOSS_NAMES[(state.floor - 1) % BOSS_NAMES.length] + ' 之域');
  V.updateHUD();
  sleep(700).then(function () {
    if (rng() < 0.35) {
      currentEvent = pick(EVENTS);
      state.phase = 'event';
      V.showEvent(currentEvent);
    } else {
      finishFloorEntry();
    }
  });
}

function chooseEvent(i) {
  if (state.phase !== 'event') return;
  var evn = currentEvent;
  currentEvent = null;
  V.closeModal();
  if (evn && evn.choices[i]) {
    V.log('【' + evn.title + '】选择了「' + evn.choices[i].label + '」。', 'info');
    evn.choices[i].fn();
  }
  V.updateHUD();
  finishFloorEntry();
}

function finishFloorEntry() {
  if (state.floor === VICTORY_FLOOR && !state.victoryShown) {
    state.phase = 'victory';
    V.showVictory();
    return;
  }
  state.phase = 'play';
  V.updateHUD();
  if (!canMove()) gameOver('exhaust');
}

function continueEndless() {
  if (state.phase !== 'victory') return;
  state.victoryShown = true;
  V.closeModal();
  state.phase = 'play';
  V.log('远征继续——深渊之下仍有未名之物。', 'gold');
  V.updateHUD();
}

/* ---------------- 终局 ---------------- */
function gameOver(reason) {
  state.phase = 'dead';
  state.overReason = reason;
  Sound.play('over');
  V.shake();
  V.log(reason === 'exhaust' ? '晶能枯竭，无处可去……' : '生命耗尽，坠入深渊……', 'bad');
  V.showGameOver(reason);
}

function newRun(seed) {
  rng = mulberry32(seed);
  nextId = 1;
  busy = false;
  draftChoices = [];
  currentEvent = null;
  state = {
    seed: seed, floor: 1, hp: BASE_HP, maxHp: BASE_HP, score: 0, moves: 0,
    kills: 0, merges: 0, largest: 0, relics: {}, dmgTaken: 0,
    buff: { dmgMult: 1, scoreMult: 1 }, monsterTimer: monsterInterval(),
    phase: 'play', victoryShown: false, overReason: ''
  };
  V.clearTiles();
  V.clearRelics();
  V.clearLog();
  board = emptyBoard();
  spawnBoss();
  spawnGem(2);
  spawnGem(rng() < 0.4 ? 4 : 2);
  V.log('远征开始：种子 ' + seed + '。击碎领主即可攻破本层。', 'info');
  V.updateHUD();
}

  },
  tierGlow: function (v) {

    return map[v] || '#7dffd4';
  },
  tileRemove: function (e) {

    var rect = el.getBoundingClientRect();

    FX.burst(rect.left + rect.width / 2, rect.top + rect.height / 2, '#ffd0a0', 12, 3);

  clearTiles: function () {

    var box = this.showModal('<h2>远征陨落</h2><div class="mdesc">' + msg + '</div>' + this.statGrid() +
      '<div class="mrow"><button class="btn primary" id="mb-again">新的种子 · 再战</button><button class="btn" id="mb-same">同种子复现</button></div>');
    box.querySelector('#mb-again').addEventListener('click', function () {
      View.closeModal();
      var s = (Math.floor(Math.random() * 900000) + 100000);
      newRun(s);
    });
    box.querySelector('#mb-same').addEventListener('click', function () {
      View.closeModal();
      newRun(state.seed);
    });
  },
  showVictory: function () {
    var self = this;
    var box = this.showModal('<h2>创世残响 · 通关</h2><div class="mdesc">你击碎了第十层的领主，抵达了晶渊之心。深渊之下仍有未名之物，是否继续下潜？</div>' + this.statGrid() +
      '<div class="mrow"><button class="btn primary" id="mb-more">继续下潜（无尽）</button><button class="btn" id="mb-new">重新远征</button></div>');
    box.querySelector('#mb-more').addEventListener('click', function () { continueEndless(); });
    box.querySelector('#mb-new').addEventListener('click', function () {
      self.closeModal();
      View.showStart();
    });
  },
  showStart: function () {
    if (state) state.phase = 'start';
    var defaultSeed = Math.floor(Math.random() * 900000) + 100000;
    var box = this.showModal(
      '<div class="crystal-mark">◈</div>' +
      '<div class="titleglow">晶渊远征</div>' +
      '<div class="titlesub">CRYSTAL ABYSS · 2048 ROGUELIKE</div>' +
      '<div class="mdesc">你是一名星痕术士，深入活化的晶渊。以 2048 之法熔炼晶石，用高阶晶能击碎深渊怪物与领主；' +
      '每一层都会馈赠改写法则的遗物，而渊底之物也在逐层苏醒。生命耗尽或晶能枯竭，远征终结。<br>' +
      '方向键 / WASD / 滑动 / 按钮 操控。同阶晶石相合升阶；晶石价值 ≥ 怪物生命即可将其击碎（晶石随之耗损）。</div>' +
      '<div class="mdesc" style="margin-bottom:8px">输入远征种子（相同种子 = 相同深渊）</div>' +
      '<input class="seed-input" id="seed-input" value="' + defaultSeed + '" maxlength="9" inputmode="numeric">' +
      '<div class="mrow"><button class="btn primary" id="mb-start">开始远征</button><button class="btn" id="mb-rand">随机种子</button></div>'
    );
    var input = box.querySelector('#seed-input');
    var begin = function () {
      var raw = parseInt(String(input.value).replace(/[^0-9]/g, ''), 10);
      var seed = (isNaN(raw) || raw <= 0) ? (Math.floor(Math.random() * 900000) + 100000) : raw;
      View.closeModal();
      newRun(seed);
      Sound.ensure();
      Sound.play('relic');
    };
    box.querySelector('#mb-start').addEventListener('click', begin);
    box.querySelector('#mb-rand').addEventListener('click', function () {
      input.value = Math.floor(Math.random() * 900000) + 100000;
    });
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') begin(); });
    setTimeout(function () { input.focus(); input.select(); }, 120);
  }
};

var V = HAS_DOM ? View : NoView;

/* ---------------- 粒子 / 星幕（Canvas） ---------------- */
function createFX() {
  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var parts = [];
  var stars = [];
  var W = 0, H = 0;
  function resize() {
    W = canvas.width = window.innerWidth * (window.devicePixelRatio || 1);
    H = canvas.height = window.innerHeight * (window.devicePixelRatio || 1);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    stars = [];
    var n = Math.round((window.innerWidth * window.innerHeight) / 16000);
    for (var i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        r: (Math.random() * 1.4 + 0.4) * (window.devicePixelRatio || 1),
        p: Math.random() * Math.PI * 2,
        s: 0.4 + Math.random() * 1.2,
        hue: [200, 220, 260, 45][Math.floor(Math.random() * 4)]
      });
    }
  }
  window.addEventListener('resize', resize);
  resize();
  var dpr = window.devicePixelRatio || 1;
  function burst(x, y, color, n, speed) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = (Math.random() * 0.7 + 0.3) * (speed || 3) * dpr;
      parts.push({
        x: x * dpr, y: y * dpr,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.2 * dpr,
        g: 0.12 * dpr, life: 0, ttl: 42 + Math.random() * 30,
        size: (Math.random() * 2.6 + 1.2) * dpr, color: color
      });
    }
  }
  function frame() {
    ctx.clearRect(0, 0, W, H);
    var t = performance.now() / 1000;
    ctx.globalCompositeOperation = 'source-over';
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      var tw = 0.35 + 0.4 * (0.5 + 0.5 * Math.sin(t * st.s + st.p));
      ctx.globalAlpha = tw;
      ctx.fillStyle = 'hsl(' + st.hue + ',80%,' + (62 + st.r * 6) + '%)';
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'lighter';
    for (var p = parts.length - 1; p >= 0; p--) {
      var pt = parts[p];
      pt.life++;
      pt.x += pt.vx; pt.y += pt.vy; pt.vy += pt.g;
      pt.vx *= 0.985; pt.vy *= 0.985;
      var k = 1 - pt.life / pt.ttl;
      if (k <= 0) { parts.splice(p, 1); continue; }
      ctx.globalAlpha = k;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size * k + 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  return { burst: burst };
}

/* ---------------- 音效（WebAudio 合成） ---------------- */
var Sound = {
  ctx: null, on: true,
  ensure: function () {
    if (!HAS_DOM) return;
    try {
      if (!this.ctx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { this.ctx = null; }
  },
  tone: function (f, dur, type, vol, slideTo) {
    if (!HAS_DOM || !this.on || !this.ctx) return;
    try {
      var c = this.ctx, o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(f, c.currentTime);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), c.currentTime + dur);
      g.gain.setValueAtTime(vol || 0.12, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      o.connect(g); g.connect(c.destination);
      o.start(); o.stop(c.currentTime + dur + 0.03);
    } catch (e) { /* 音频失败不影响游戏 */ }
  },
  seq: function (notes, step, type, vol) {
    if (!HAS_DOM || !this.on || !this.ctx) return;
    var self = this;
    for (var i = 0; i < notes.length; i++) {
      (function (f, d) { setTimeout(function () { self.tone(f, 0.14, type || 'triangle', vol || 0.1); }, d); })(notes[i], i * step);
    }
  },
  play: function (name, param) {
    if (!HAS_DOM || !this.on) return;
    this.ensure();
    if (!this.ctx) return;
    switch (name) {
      case 'move': this.tone(220, 0.05, 'triangle', 0.06); break;
      case 'deny': this.tone(120, 0.12, 'sawtooth', 0.07, 70); break;
      case 'merge': this.tone(300 + (param || 1) * 36, 0.16, 'sine', 0.13, 500 + (param || 1) * 46); break;
      case 'kill': this.tone(260, 0.3, 'sawtooth', 0.13, 60); this.tone(520, 0.18, 'square', 0.05, 130); break;
      case 'hurt': this.tone(110, 0.24, 'square', 0.15, 55); break;
      case 'shield': this.tone(660, 0.12, 'sine', 0.11, 880); break;
      case 'heal': this.tone(520, 0.12, 'sine', 0.09, 700); break;
      case 'relic': this.seq([440, 554, 659, 880], 70, 'triangle', 0.1); break;
      case 'clear': this.seq([392, 494, 587, 784, 988], 85, 'triangle', 0.11); break;
      case 'over': this.seq([392, 311, 247, 185, 139], 130, 'sawtooth', 0.1); break;
    }
  }
};

/* ---------------- 输入 ---------------- */
function bindInput() {
  var KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right'
  };
  window.addEventListener('keydown', function (e) {
    Sound.ensure();
    var dir = KEYMAP[e.key];
    if (dir) {
      e.preventDefault();
      doMove(dir);
    }
  });
  var dpad = document.getElementById('dpad');
  var btns = dpad.querySelectorAll('button');
  for (var i = 0; i < btns.length; i++) {
    (function (b) {
      b.addEventListener('click', function () {
        Sound.ensure();
        doMove(b.getAttribute('data-dir'));
      });
    })(btns[i]);
  }
  var scene = document.getElementById('scene');
  var sx = 0, sy = 0, tracking = false;
  scene.addEventListener('pointerdown', function (e) {
    Sound.ensure();
    tracking = true; sx = e.clientX; sy = e.clientY;
  });
  window.addEventListener('pointerup', function (e) {
    if (!tracking) return;
    tracking = false;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
    if (Math.abs(dx) > Math.abs(dy)) doMove(dx > 0 ? 'right' : 'left');
    else doMove(dy > 0 ? 'down' : 'up');
  });
  scene.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.getElementById('btn-sound').addEventListener('click', function () {
    Sound.on = !Sound.on;
    this.textContent = '音效：' + (Sound.on ? '开' : '关');
    if (Sound.on) { Sound.ensure(); Sound.play('shield'); }
  });
  document.getElementById('btn-restart').addEventListener('click', function () {
    View.showStart();
  });
}

/* ---------------- 测试接口 ---------------- */
var ABYSS = {
  newRun: newRun,
  doMove: doMove,
  chooseDraft: chooseDraft,
  chooseEvent: chooseEvent,
  continueEndless: continueEndless,
  grantRelic: function (id) { if (RELIC_MAP[id]) applyRelic(RELIC_MAP[id]); },
  debugSet: function (spec) {
    V.clearTiles();
    board = emptyBoard();
    for (var i = 0; i < spec.length; i++) {
      var s = spec[i]; // [r, c, 'gem'|'monster', value, boss]
      if (s[2] === 'gem') {
        var g = { id: nextId++, kind: 'gem', v: s[3], r: 0, c: 0, el: null };
        placeAt(g, s[0], s[1]);
        V.tileCreate(g, false);
      } else {
        var m = {
          id: nextId++, kind: 'monster', boss: !!s[4], tier: Math.ceil(Math.log2(s[3])),
          hp: s[3], maxHp: s[3], cd: 99, r: 0, c: 0, el: null, name: '测试体'
        };
        placeAt(m, s[0], s[1]);
        V.tileCreate(m, false);
      }
    }
  },
  canMove: canMove
};
if (typeof window !== 'undefined') window.ABYSS = ABYSS;
else if (typeof globalThis !== 'undefined') globalThis.ABYSS = ABYSS;

/* ---------------- 启动 ---------------- */
if (HAS_DOM) {
  /* 状态必须先于视图初始化：View.init() → layoutTiles() → entities() 会读取全局 board */
  board = emptyBoard();
  state = { phase: 'start' };
  View.init();
  bindInput();
  View.showStart();
}
</script>
