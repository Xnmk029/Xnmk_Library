<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<title>正在播放 — 沉浸式歌词 (Apple Music 风格)</title>
<style>
  /* ============================== Base ============================== */
  :root {
    color-scheme: dark;
    --c1: hsl(262 72% 56%);
    --c2: hsl(330 76% 56%);
    --c3: hsl(212 82% 52%);
    --c4: hsl(174 62% 44%);
    --line-ms: 3000ms;
    --ease-spring: cubic-bezier(0.32, 0.94, 0.32, 1.02);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
    background: #0b0b10;
    color: #fff;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, .lyric-line:focus-visible {
    outline: 2px solid rgba(255, 255, 255, 0.65);
    outline-offset: 3px;
    border-radius: 14px;
  }

  /* ================== Immersive fluid background ==================== */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #0b0b10; }
  .bg-art {
    position: absolute;
    left: 50%; top: 50%;
    width: 160vmax; height: 160vmax;
    margin: -80vmax 0 0 -80vmax;
    background: radial-gradient(circle at 30% 30%, var(--c1), transparent 60%),
                radial-gradient(circle at 70% 65%, var(--c2), #14141c 75%);
    background-size: cover;
    background-position: center;
    filter: blur(90px) saturate(165%) brightness(0.8);
    animation: bg-spin 90s linear infinite;
    will-change: transform;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.65;
    mix-blend-mode: screen;
    will-change: transform;
  }
  .b1 { width: 65vmax; height: 65vmax; left: -18vmax; top: -20vmax;
        background: radial-gradient(circle at 40% 40%, var(--c1), transparent 70%);
        animation: drift-a 26s ease-in-out infinite alternate; }
  .b2 { width: 60vmax; height: 60vmax; right: -20vmax; bottom: -22vmax;
        background: radial-gradient(circle at 55% 45%, var(--c2), transparent 70%);
        animation: drift-b 32s ease-in-out infinite alternate; }
  .b3 { width: 48vmax; height: 48vmax; right: -8vmax; top: -10vmax;
        background: radial-gradient(circle at 50% 50%, var(--c3), transparent 70%);
        animation: drift-c 23s ease-in-out infinite alternate; }
  .b4 { width: 44vmax; height: 44vmax; left: -6vmax; bottom: -16vmax;
        background: radial-gradient(circle at 50% 50%, var(--c4), transparent 70%);
        animation: drift-b 37s ease-in-out infinite alternate-reverse; }
  .bg-glass {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(8, 8, 12, 0.34), rgba(8, 8, 12, 0.52));
    backdrop-filter: blur(44px) saturate(150%);
    -webkit-backdrop-filter: blur(44px) saturate(150%);
  }
  @keyframes bg-spin { to { transform: rotate(360deg); } }
  @keyframes drift-a {
    0%   { transform: translate3d(0, 0, 0) rotate(0deg) scale(1); }
    50%  { transform: translate3d(14vmax, 10vmax, 0) rotate(72deg) scale(1.18); }
    100% { transform: translate3d(4vmax, 22vmax, 0) rotate(160deg) scale(0.92); }
  }
  @keyframes drift-b {
    0%   { transform: translate3d(0, 0, 0) rotate(0deg) scale(1); }
    45%  { transform: translate3d(-16vmax, -8vmax, 0) rotate(-80deg) scale(1.22); }
    100% { transform: translate3d(-5vmax, -20vmax, 0) rotate(-180deg) scale(1.05); }
  }
  @keyframes drift-c {
    0%   { transform: translate3d(0, 0, 0) rotate(0deg) scale(1); }
    55%  { transform: translate3d(-12vmax, 14vmax, 0) rotate(95deg) scale(0.85); }
    100% { transform: translate3d(6vmax, 6vmax, 0) rotate(200deg) scale(1.15); }
  }

  /* ========================= Split layout =========================== */
  .stage {
    position: relative; z-index: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: 100dvh;
  }
  .pane { min-width: 0; min-height: 0; }

  /* =========================== Left pane ============================ */
  .pane.left {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4vh 4vw;
  }
  .player-col {
    width: min(52vh, 34vw, 440px);
    display: flex;
    flex-direction: column;
    gap: 26px;
  }
  .artwork {
    width: 100%;
    aspect-ratio: 1 / 1;
    transform: scale(0.82);
    transition: transform 0.65s cubic-bezier(0.3, 1.35, 0.4, 1);
    will-change: transform;
  }
  body.playing .artwork { transform: scale(1); }
  .artwork img {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 14px;
    background: #1c1c26;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35),
                0 24px 70px rgba(0, 0, 0, 0.55),
                0 60px 130px rgba(0, 0, 0, 0.4);
  }
  .meta { text-align: left; }
  .meta h1 {
    font-size: clamp(17px, 1.5vw, 21px);
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .meta p {
    margin-top: 3px;
    font-size: clamp(14px, 1.25vw, 17px);
    font-weight: 500;
    color: rgba(255, 255, 255, 0.56);
  }

  /* Progress bar */
  .bar-hit { padding: 9px 0; cursor: pointer; touch-action: none; }
  .bar-track {
    position: relative;
    height: 7px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.22);
    overflow: hidden;
    transform: scaleY(1);
    transition: transform 0.25s ease;
    will-change: transform;
  }
  .bar-hit:hover .bar-track, .bar-hit.dragging .bar-track { transform: scaleY(1.45); }
  .bar-fill {
    position: absolute; inset: 0;
    background: rgba(255, 255, 255, 0.82);
    transform-origin: left center;
    transform: scaleX(0);
    will-change: transform;
  }
  .times {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.5);
    font-variant-numeric: tabular-nums;
  }

  /* Transport */
  .transport {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
    margin-top: -4px;
  }
  .transport button {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 56px; height: 56px;
    border-radius: 50%;
    transition: background-color 0.25s ease, transform 0.18s ease;
  }
  .transport button:hover { background: rgba(255, 255, 255, 0.12); }
  .transport button:active { transform: scale(0.88); background: rgba(255, 255, 255, 0.2); }
  .transport svg { width: 30px; height: 30px; fill: #fff; }
  #btn-play { width: 68px; height: 68px; }
  #btn-play svg { position: absolute; width: 38px; height: 38px; transition: opacity 0.18s ease, transform 0.22s ease; }
  body:not(.playing) #btn-play .ic-pause { opacity: 0; transform: scale(0.5); }
  body.playing        #btn-play .ic-play  { opacity: 0; transform: scale(0.5); }

  /* =========================== Right pane =========================== */
  .pane.right {
    display: flex;
    align-items: stretch;
    padding: 0 4vw 0 1vw;
  }
  .lyrics {
    position: relative;
    flex: 1;
    max-width: 700px;
    height: 100%;
    overflow: hidden;
    visibility: hidden; /* revealed by JS after first layout */
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 14%, #000 82%, transparent 100%);
            mask-image: linear-gradient(180deg, transparent 0%, #000 14%, #000 82%, transparent 100%);
  }
  .lyric-line {
    position: absolute;
    left: 0; top: 0;
    width: 100%;
    padding: 12px 18px;
    border-radius: 14px;
    font-size: clamp(26px, 2.55vw, 38px);
    font-weight: 700;
    line-height: 1.24;
    letter-spacing: -0.015em;
    text-wrap: balance;
    color: #fff;
    cursor: pointer;
    transform-origin: left center;
    transition: transform 0.85s var(--ease-spring),
                opacity 0.6s ease,
                filter 0.6s ease;
    will-change: transform, opacity, filter;
  }
  .lyric-line.active { cursor: default; }
  .lyric-line::before {
    content: "";
    position: absolute; inset: 0;
    z-index: -1;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.09);
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .lyric-line:not(.active):hover::before { opacity: 1; }

  .lyric-line .txt { display: inline-block; }
  /* Karaoke sweep on the active line while playing: gradient wipes white
     from left to right across the (otherwise dimmed) text over one line. */
  body.playing .lyric-line.active .txt {
    background-image: linear-gradient(90deg,
      #fff 0%, #fff 42%,
      rgba(255, 255, 255, 0.34) 58%, rgba(255, 255, 255, 0.34) 100%);
    background-size: 240% 100%;
    background-position: 100% 0;
    background-repeat: no-repeat;
    -webkit-background-clip: text;
            background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: sweep var(--line-ms) linear both;
  }
  @keyframes sweep { to { background-position: 0 0; } }

  /* Fast, non-staggered transitions while the user is wheel-scrolling */
  .lyrics.manual .lyric-line { transition: transform 0.28s ease-out, opacity 0.28s ease, filter 0.28s ease; }
  .lyrics.no-anim .lyric-line { transition: none !important; }

  /* ========================== Responsive =========================== */
  @media (max-width: 880px) {
    .stage { grid-template-columns: 1fr; grid-template-rows: minmax(0, 46%) minmax(0, 54%); }
    .pane.left { padding: 3vh 6vw 1vh; }
    .player-col { width: min(34vh, 70vw, 320px); gap: 16px; }
    .pane.right { padding: 0 6vw; }
    .lyric-line { font-size: clamp(21px, 5.4vw, 28px); padding: 9px 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bg-art, .blob { animation: none; }
    body.playing .lyric-line.active .txt {
      animation: none;
      background: none;
      color: #fff;
      -webkit-text-fill-color: currentColor;
    }
    .lyric-line, .artwork { transition-duration: 0.01s !important; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-art" id="bg-art"></div>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="blob b4"></div>
    <div class="bg-glass"></div>
  </div>

  <main class="stage">
    <section class="pane left">
      <div class="player-col">
        <figure class="artwork">
          <img id="cover" alt="Album artwork" draggable="false">
        </figure>
        <div class="meta">
          <h1 id="song-title">Midnight Signals</h1>
          <p id="song-artist">Aurora Lane — Neon Dreams</p>
        </div>
        <div class="progress-block">
          <div class="bar-hit" id="bar-hit" role="slider" aria-label="Playback position"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="bar-track"><div class="bar-fill" id="bar-fill"></div></div>
          </div>
          <div class="times"><span id="t-cur">0:00</span><span id="t-rem">-0:00</span></div>
        </div>
        <div class="transport">
          <button id="btn-prev" aria-label="上一句">
            <svg viewBox="0 0 24 24"><g transform="translate(24 0) scale(-1 1)">
              <path d="M2.6 6.1v11.8c0 .95 1.05 1.52 1.85 1L12 14.2v3.7c0 .95 1.05 1.52 1.85 1l8.6-5.9a1.2 1.2 0 0 0 0-2l-8.6-5.9c-.8-.52-1.85.05-1.85 1v3.7L4.45 5.1c-.8-.52-1.85.05-1.85 1z"/>
            </g></svg>
          </button>
          <button id="btn-play" aria-label="播放">
            <svg class="ic-play" viewBox="0 0 24 24">
              <path d="M7.2 4.9v14.2c0 1 1.1 1.6 1.95 1.05L20.5 13.1a1.3 1.3 0 0 0 0-2.2L9.15 3.85C8.3 3.3 7.2 3.9 7.2 4.9z"/>
            </svg>
            <svg class="ic-pause" viewBox="0 0 24 24">
              <rect x="5.6" y="4" width="4.6" height="16" rx="1.7"/>
              <rect x="13.8" y="4" width="4.6" height="16" rx="1.7"/>
            </svg>
          </button>
          <button id="btn-next" aria-label="下一句">
            <svg viewBox="0 0 24 24">
              <path d="M2.6 6.1v11.8c0 .95 1.05 1.52 1.85 1L12 14.2v3.7c0 .95 1.05 1.52 1.85 1l8.6-5.9a1.2 1.2 0 0 0 0-2l-8.6-5.9c-.8-.52-1.85.05-1.85 1v3.7L4.45 5.1c-.8-.52-1.85.05-1.85 1z"/>
            </svg>
          </button>
        </div>
      </div>
    </section>

    <section class="pane right">
      <div class="lyrics" id="lyrics" aria-label="Lyrics"></div>
    </section>
  </main>

<script>
(() => {
  "use strict";

  /* ------------------------------ Data ------------------------------ */
  const LINES = [
    "城市灯火在窗棂外低语吟唱",
    "每次心跳都如过往列车般回响",
    "我们源自静电，我们生于火花",
    "在天鹅绒般的夜色中追逐霓虹之河",
    "紧握这频率，永不让其消逝",
    "我们驾驭的浪潮，皆是彼此的誓言",
    "午夜的信号，终将引导我们重返家园",
  ];
  const LINE_MS = 3000;
  const TOTAL_MS = LINES.length * LINE_MS;
  const LINE_GAP = 14;

  const COVER_SOURCES = [
    "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=900&q=80",
    "https://picsum.photos/seed/aurora/900/900",
  ];
  const FALLBACK_COVER = "data:image/svg+xml;utf8," + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7b2ff7"/><stop offset=".55" stop-color="#e94b9c"/>
        <stop offset="1" stop-color="#2b59ff"/></linearGradient></defs>
      <rect width="900" height="900" fill="url(#g)"/>
      <circle cx="450" cy="450" r="215" fill="rgba(255,255,255,0.13)"/>
      <path d="M562 292v220a72 72 0 1 1-36-62V368l-172 46v152a72 72 0 1 1-36-62V322z"
            fill="rgba(255,255,255,0.88)"/></svg>`);

  /* ---------------------------- Elements ---------------------------- */
  const $ = (s) => document.querySelector(s);
  const body = document.body;
  const lyricsEl = $("#lyrics");
  const coverEl = $("#cover");
  const bgArtEl = $("#bg-art");
  const barHit = $("#bar-hit");
  const barFill = $("#bar-fill");
  const tCur = $("#t-cur");
  const tRem = $("#t-rem");

  document.documentElement.style.setProperty("--line-ms", LINE_MS + "ms");

  /* ------------------------------ State ----------------------------- */
  let lines = [];
  let heights = [];
  let offsets = [];
  let active = 0;
  let t = 0;                 // current playback time, ms
  let base = 0;              // time anchor for the rAF clock
  let anchor = 0;
  let playing = false;
  let raf = 0;
  let manualOffset = 0;      // user wheel-scroll displacement
  let manualIdle = 0;
  let contentH = 0;
  let lastShownSec = -1;

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  /* --------------------------- Lyrics DOM --------------------------- */
  for (let i = 0; i < LINES.length; i++) {
    const el = document.createElement("div");
    el.className = "lyric-line";
    el.setAttribute("role", "button");
    el.tabIndex = 0;
    const txt = document.createElement("span");
    txt.className = "txt";
    txt.textContent = LINES[i];
    el.appendChild(txt);
    el.addEventListener("click", () => seek(i * LINE_MS, true));
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); seek(i * LINE_MS, true); }
    });
    lyricsEl.appendChild(el);
    lines.push(el);
  }

  /* ------------------------- Layout engine --------------------------
     Each line is absolutely positioned and moved purely with
     translateY + scale. On every active-line change, lines below the
     active one receive an increasing transition-delay, producing the
     Apple Music staggered "spring cascade". */
  function measure() {
    heights = lines.map((el) => el.offsetHeight);
    offsets = [];
    let y = 0;
    for (let i = 0; i < lines.length; i++) { offsets[i] = y; y += heights[i] + LINE_GAP; }
    contentH = y - LINE_GAP;
  }

  function layout(stagger) {
    const ch = lyricsEl.clientHeight;
    const centerShift = ch / 2 - heights[active] / 2 - offsets[active];
    for (let i = 0; i < lines.length; i++) {
      const el = lines[i];
      const d = i - active;
      const ad = Math.abs(d);
      const yPos = offsets[i] + centerShift + manualOffset;
      el.style.transitionDelay = stagger && d > 0 ? Math.min(d * 55, 480) + "ms" : "0ms";
      el.style.transform = `translateY(${yPos}px) scale(${i === active ? 1 : 0.88})`;
      el.style.opacity = i === active ? 1 : clamp(0.5 - (ad - 1) * 0.06, 0.24, 0.5);
      el.style.filter = i === active ? "blur(0px)" : `blur(${Math.min(ad, 4)}px)`;
    }
  }

  function setActive(i, opts = {}) {
    const changed = i !== active;
    if (!changed && !opts.force) return;
    active = i;
    for (let k = 0; k < lines.length; k++) {
      lines[k].classList.toggle("active", k === i);
      if (k === i) lines[k].setAttribute("aria-current", "true");
      else lines[k].removeAttribute("aria-current");
    }
    layout(true);
    restartSweep();
  }

  /* Restart the karaoke sweep so it always reflects the position inside
     the current line (negative animation-delay = mid-line resume). */
  function restartSweep() {
    const txt = lines[active].querySelector(".txt");
    txt.style.animation = "none";
    void txt.offsetWidth; // force reflow so the animation truly restarts
    txt.style.animationDelay = "-" + (t % LINE_MS) + "ms";
    txt.style.animation = "";
  }

  /* ----------------------------- Clock ------------------------------ */
  function tick(now) {
    if (!playing) return;
    t = base + (now - anchor);
    if (t >= TOTAL_MS) {           // loop the track
      base = 0; anchor = now; t = 0;
      setActive(0, { force: true });
    }
    const idx = clamp(Math.floor(t / LINE_MS), 0, LINES.length - 1);
    if (idx !== active) setActive(idx);
    renderProgress();
    raf = requestAnimationFrame(tick);
  }

  function play() {
    if (playing) return;
    playing = true;
    body.classList.add("playing");
    $("#btn-play").setAttribute("aria-label", "Pause");
    anchor = performance.now();
    base = t;
    restartSweep();
    raf = requestAnimationFrame(tick);
  }

  function pause() {
    if (!playing) return;
    playing = false;
    body.classList.remove("playing");
    $("#btn-play").setAttribute("aria-label", "Play");
    cancelAnimationFrame(raf);
  }

  function seek(ms, forceSweep) {
    t = clamp(ms, 0, TOTAL_MS - 1);
    base = t;
    anchor = performance.now();
    manualOffset = 0;
    lyricsEl.classList.remove("manual");
    setActive(clamp(Math.floor(t / LINE_MS), 0, LINES.length - 1), { force: forceSweep });
    renderProgress(true);
  }

  /* --------------------------- Progress UI -------------------------- */
  const fmt = (ms) => {
    const s = Math.max(0, Math.round(ms / 1000));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  };

  function renderProgress(force) {
    barFill.style.transform = `scaleX(${clamp(t / TOTAL_MS, 0, 1)})`;
    const sec = Math.floor(t / 1000);
    if (force || sec !== lastShownSec) {
      lastShownSec = sec;
      tCur.textContent = fmt(t);
      tRem.textContent = "-" + fmt(TOTAL_MS - t);
      barHit.setAttribute("aria-valuenow", Math.round((t / TOTAL_MS) * 100));
    }
  }

  let dragging = false;
  function seekFromPointer(e) {
    const r = barHit.getBoundingClientRect();
    seek(clamp((e.clientX - r.left) / r.width, 0, 1) * TOTAL_MS, true);
  }
  barHit.addEventListener("pointerdown", (e) => {
    dragging = true;
    barHit.classList.add("dragging");
    barHit.setPointerCapture(e.pointerId);
    seekFromPointer(e);
  });
  barHit.addEventListener("pointermove", (e) => { if (dragging) seekFromPointer(e); });
  const endDrag = () => { dragging = false; barHit.classList.remove("dragging"); };
  barHit.addEventListener("pointerup", endDrag);
  barHit.addEventListener("pointercancel", endDrag);

  /* --------------------------- Transport ---------------------------- */
  $("#btn-play").addEventListener("click", () => (playing ? pause() : play()));
  $("#btn-prev").addEventListener("click", () => seek(clamp(active - 1, 0, LINES.length - 1) * LINE_MS, true));
  $("#btn-next").addEventListener("click", () => seek(clamp(active + 1, 0, LINES.length - 1) * LINE_MS, true));

  window.addEventListener("keydown", (e) => {
    if (e.target.closest("button, .lyric-line")) return;
    if (e.code === "Space") { e.preventDefault(); playing ? pause() : play(); }
    else if (e.key === "ArrowRight") seek((active + 1) * LINE_MS, true);
    else if (e.key === "ArrowLeft") seek((active - 1) * LINE_MS, true);
  });

  /* --------------- Free wheel-scroll with auto re-center ------------ */
  lyricsEl.addEventListener("wheel", (e) => {
    e.preventDefault();
    const limit = contentH * 0.9;
    manualOffset = clamp(manualOffset - e.deltaY, -limit, limit);
    lyricsEl.classList.add("manual");
    layout(false);
    clearTimeout(manualIdle);
    manualIdle = setTimeout(() => {
      manualOffset = 0;
      lyricsEl.classList.remove("manual");
      layout(true);
    }, 1800);
  }, { passive: false });

  /* ----------------------------- Resize ----------------------------- */
  let resizeRaf = 0;
  window.addEventListener("resize", () => {
    cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(() => {
      lyricsEl.classList.add("no-anim");
      measure();
      layout(false);
      void lyricsEl.offsetWidth;
      lyricsEl.classList.remove("no-anim");
    });
  });

  /* -------------- Album cover + palette-driven background ----------- */
  function applyCover(img, url) {
    coverEl.src = url;
    bgArtEl.style.backgroundImage = `url("${url}")`;
    if (!img) return;
    try {
      const N = 16;
      const cv = document.createElement("canvas");
      cv.width = cv.height = N;
      const cx = cv.getContext("2d", { willReadFrequently: true });
      cx.drawImage(img, 0, 0, N, N);
      const px = cx.getImageData(0, 0, N, N).data;
      const quads = [[0, 0], [N / 2, 0], [0, N / 2], [N / 2, N / 2]];
      quads.forEach(([qx, qy], q) => {
        let r = 0, g = 0, b = 0, n = 0;
        for (let y = qy; y < qy + N / 2; y++)
          for (let x = qx; x < qx + N / 2; x++) {
            const p = (y * N + x) * 4;
            r += px[p]; g += px[p + 1]; b += px[p + 2]; n++;
          }
        const [h, s, l] = rgbToHsl(r / n, g / n, b / n);
        document.documentElement.style.setProperty(
          "--c" + (q + 1),
          `hsl(${Math.round(h)} ${Math.round(clamp(s, 0.55, 0.95) * 100)}% ${Math.round(clamp(l, 0.36, 0.6) * 100)}%)`
        );
      });
    } catch (_) { /* CORS blocked — keep the default palette */ }
  }

  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    let h = 0;
    if (d) {
      if (mx === r) h = ((g - b) / d) % 6;
      else if (mx === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h = (h * 60 + 360) % 360;
    }
    const l = (mx + mn) / 2;
    const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
    return [h, s, l];
  }

  function loadCover(i) {
    if (i >= COVER_SOURCES.length) { applyCover(null, FALLBACK_COVER); return; }
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => applyCover(img, COVER_SOURCES[i]);
    img.onerror = () => loadCover(i + 1);
    img.src = COVER_SOURCES[i];
  }

  /* ------------------------------ Init ------------------------------ */
  function init() {
    measure();
    lines[0].classList.add("active");
    lines[0].setAttribute("aria-current", "true");
    lyricsEl.classList.add("no-anim");
    layout(false);
    renderProgress(true);
    requestAnimationFrame(() => {
      void lyricsEl.offsetWidth;
      lyricsEl.classList.remove("no-anim");
      lyricsEl.style.visibility = "visible";
    });
    loadCover(0);
  }
  init();
})();
</script>
</body>
</html>
