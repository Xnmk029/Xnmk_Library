<body>
    <!-- Model Name Watermark -->
<div style="position: fixed; top: 15px; left: 50%; transform: translateX(-50%); z-index: 9999999; pointer-events: none; opacity: 0.35; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 32px; font-weight: 700; color: #888; text-shadow: 1px 1px 0px rgba(255,255,255,0.8), -1px -1px 0px rgba(0,0,0,0.8); user-select: none; letter-spacing: 0.5px; white-space: nowrap;">Gemini3.5pro</div>
<canvas id="sim-canvas"></canvas>

    <div id="ui-layer">

                <button id="btn-anim-bump">自动跳动模拟 (Auto Bump)</button>

        <div class="panel">

<script>
/**
 * 工业级双叉臂悬挂物理与渲染引擎
 * 架构: 
 * 1. PBD (Position Based Dynamics) 核心解算器
 * 2. Three.js 渲染层联动
 * 3. K&C (Kinematics & Compliance) 数据实时计算
 */

// --- 1. PBD 物理求解器核心 ---
class PBDSystem {
    constructor() {
        this.nodes = [];
        this.constraints = [];
        this.iterations = 60; // 迭代次数，保证刚性
    }

    addNode(x, y, z, fixed = false) {
        const node = {
            pos: new THREE.Vector3(x, y, z),
            initPos: new THREE.Vector3(x, y, z),
            invMass: fixed ? 0 : 1
        };
        this.nodes.push(node);
        return this.nodes.length - 1;
    }

    addConstraint(p1, p2, targetLength = null) {
        let len = targetLength;
        if (len === null) {
            len = this.nodes[p1].pos.distanceTo(this.nodes[p2].pos);
        }
        const constraint = { p1, p2, len };
        this.constraints.push(constraint);
        return constraint;
    }

    solve() {
        for (let iter = 0; iter < this.iterations; iter++) {
            for (let i = 0; i < this.constraints.length; i++) {
                const c = this.constraints[i];
                const n1 = this.nodes[c.p1];
                const n2 = this.nodes[c.p2];
                
                const delta = new THREE.Vector3().subVectors(n2.pos, n1.pos);
                const dist = delta.length();
                if (dist === 0) continue;
                
                const diff = (dist - c.len) / dist;
                const w1 = n1.invMass;
                const w2 = n2.invMass;
                const wSum = w1 + w2;
                if (wSum === 0) continue;

                const correction = delta.multiplyScalar(diff / wSum);

                if (w1 > 0) n1.pos.add(new THREE.Vector3().copy(correction).multiplyScalar(w1));
                if (w2 > 0) n2.pos.sub(new THREE.Vector3().copy(correction).multiplyScalar(w2));
            }
        }
    }
}

// --- 2. 悬挂几何拓扑定义 (左前轮为例) ---
// 坐标系: X:横向(向右为正), Y:垂向(向上为正), Z:纵向(向后为正)
const sys = new PBDSystem();

// 底盘固定硬点 (Chassis Hardpoints)
const N_LCA_F = sys.addNode(-350, 200, -200, true); // 下摆臂前点
const N_LCA_R = sys.addNode(-350, 200,  200, true); // 下摆臂后点
const N_UCA_F = sys.addNode(-450, 450, -150, true); // 上摆臂前点
const N_UCA_R = sys.addNode(-450, 450,  150, true); // 上摆臂后点
const N_RACK  = sys.addNode(-400, 240, -150, true); // 转向齿条输出点 (此处设为可控的fixed点)
const N_SHOCK_TOP = sys.addNode(-450, 650, 0, true); // 避震塔顶

// 运动节点 (Moving Nodes)
const N_LBJ = sys.addNode(-750, 180, 0); // 下球头 (Lower Ball Joint)
const N_UBJ = sys.addNode(-700, 500, 0); // 上球头 (Upper Ball Joint) KPI内倾
const N_TIE = sys.addNode(-730, 240, -150); // 转向节拉杆连接点
const N_WC  = sys.addNode(-800, 340, 0); // 车轮中心 (Wheel Center)
const N_SHOCK_BOT = sys.addNode(-550, 190, 0); // 避震下止点(连接在下摆臂上)

// 定义拓扑约束 (刚性连杆)
// 1. 下控制臂 (LCA)
sys.addConstraint(N_LCA_F, N_LBJ);
sys.addConstraint(N_LCA_R, N_LBJ);
// 2. 上控制臂 (UCA)
sys.addConstraint(N_UCA_F, N_UBJ);
sys.addConstraint(N_UCA_R, N_UBJ);
// 3. 转向拉杆 (Tie Rod)
sys.addConstraint(N_RACK, N_TIE);

// 4. 转向节/羊角 (Knuckle/Upright) - 作为一个刚体，需要两两约束内部节点
// 节点: LBJ, UBJ, TIE, WC
const knuckleNodes = [N_LBJ, N_UBJ, N_TIE, N_WC];
for(let i=0; i<knuckleNodes.length; i++) {
    for(let j=i+1; j<knuckleNodes.length; j++) {
        sys.addConstraint(knuckleNodes[i], knuckleNodes[j]);
    }
}

// 5. 避震器下端固定在LCA面上
sys.addConstraint(N_SHOCK_BOT, N_LCA_F);
sys.addConstraint(N_SHOCK_BOT, N_LCA_R);
sys.addConstraint(N_SHOCK_BOT, N_LBJ);

// 6. 避震器主轴 (驱动悬挂跳动的可变约束)
const shockConstraint = sys.addConstraint(N_SHOCK_TOP, N_SHOCK_BOT);
const baseShockLength = shockConstraint.len;
const baseRackX = sys.nodes[N_RACK].initPos.x;
const baseWheelX = sys.nodes[N_WC].initPos.x;

// --- 3. Three.js 渲染引擎设置 ---
const canvas = document.getElementById('sim-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e0e10);

// 相机系统 (工业软件典型的等轴测/透视混合视角感觉)
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 10, 5000);
let camAngleX = 0.5, camAngleY = 0.4, camRadius = 1600;

// 环境辅助网格
const gridHelper = new THREE.GridHelper(2000, 40, 0x333333, 0x1a1a1a);
gridHelper.position.y = 0;
scene.add(gridHelper);
const axesHelper = new THREE.AxesHelper(300);
scene.add(axesHelper);

// 材质定义 (工业风纯色)
const matFixedNode = new THREE.MeshBasicMaterial({ color: 0x555555 });
const matMovingNode = new THREE.MeshBasicMaterial({ color: 0xeeeeee });
const matArm = new THREE.LineBasicMaterial({ color: 0x00d2ff, linewidth: 2 });
const matKnuckle = new THREE.LineBasicMaterial({ color: 0xcccccc });
const matTieRod = new THREE.LineBasicMaterial({ color: 0xffaa00 });
const matKingpin = new THREE.LineBasicMaterial({ color: 0xff3366 });
const matSpring = new THREE.LineBasicMaterial({ color: 0xaaff00 });
const matWheel = new THREE.LineBasicMaterial({ color: 0x444444, transparent: true, opacity: 0.8 });
const matTrace = new THREE.LineBasicMaterial({ color: 0x00d2ff, transparent: true, opacity: 0.5 });

// 几何体缓存
const sphereGeo = new THREE.SphereGeometry(12, 16, 16);
const boxGeo = new THREE.BoxGeometry(20, 20, 20);

// 创建视觉节点
const visualNodes = sys.nodes.map((n, i) => {
    const mesh = new THREE.Mesh(n.invMass === 0 ? boxGeo : sphereGeo, n.invMass === 0 ? matFixedNode : matMovingNode);
    scene.add(mesh);
    return mesh;
});

// 动态线条生成辅助函数
function createLineMesh(material) {
    const geo = new THREE.BufferGeometry();
    const mesh = new THREE.Line(geo, material);
    scene.add(mesh);
    return mesh;
}

// 创建视觉连杆
const meshLCA = createLineMesh(matArm); // 下摆臂三角
const meshUCA = createLineMesh(matArm); // 上摆臂三角
const meshKnuckle = createLineMesh(matKnuckle); // 羊角结构
const meshTieRod = createLineMesh(matTieRod); // 转向拉杆
const meshKingpin = createLineMesh(matKingpin); // 主销轴线 (延长显示)
const meshSpring = createLineMesh(matSpring); // 螺旋弹簧

// 车轮表示 (使用圆环边缘)
const wheelRadius = 320;
const wheelWidth = 220;
const wheelGeo = new THREE.EdgesGeometry(new THREE.CylinderGeometry(wheelRadius, wheelRadius, wheelWidth, 32));
const meshWheel = new THREE.LineSegments(wheelGeo, matWheel);
scene.add(meshWheel);

// 轨迹追踪
const MAX_TRACE = 150;
const tracePoints = [];
const traceGeo = new THREE.BufferGeometry();
const meshTrace = new THREE.Line(traceGeo, matTrace);
scene.add(meshTrace);
let isTracing = true;

// --- 4. 几何更新与数学计算 ---

// 更新弹簧几何体 (生成螺旋线)
function updateSpringVisual(pTop, pBot) {
    const points = [];
    const coils = 6;
    const radius = 40;
    const segments = 60;
    
    const dir = new THREE.Vector3().subVectors(pBot, pTop);
    const len = dir.length();
    dir.normalize();
    
    let up = new THREE.Vector3(0,1,0);
    if(Math.abs(dir.y) > 0.99) up.set(1,0,0);
    const right = new THREE.Vector3().crossVectors(dir, up).normalize();
    const fwd = new THREE.Vector3().crossVectors(right, dir).normalize();

    for(let i=0; i<=segments; i++) {
        const t = i / segments;
        const angle = t * coils * Math.PI * 2;
        const center = new THREE.Vector3().copy(pTop).addScaledVector(dir, t * len);
        
        center.addScaledVector(right, Math.cos(angle) * radius);
        center.addScaledVector(fwd, Math.sin(angle) * radius);
        points.push(center);
    }
    meshSpring.geometry.setFromPoints(points);
}

// 计算车轮姿态与K&C数据
function calculateDynamics() {
    const pLBJ = sys.nodes[N_LBJ].pos;
    const pUBJ = sys.nodes[N_UBJ].pos;
    const pTIE = sys.nodes[N_TIE].pos;
    const pWC = sys.nodes[N_WC].pos;

    // 1. 计算主销轴线 (Kingpin Vector)
    const kingpinVec = new THREE.Vector3().subVectors(pUBJ, pLBJ);
    
    // 2. 计算转向节局部坐标系 -> 确定车轮法线(Spindle)
    // 向上向量大致为主销方向
    const upVec = kingpinVec.clone().normalize();
    // 向前向量大致为拉杆点到下球头
    const fwdRough = new THREE.Vector3().subVectors(pTIE, pLBJ).normalize();
    // 叉乘得到向外(向右)的车轴向量 Spindle
    let spindleVec = new THREE.Vector3().crossVectors(fwdRough, upVec).normalize();
    
    // 确保车轴指向外侧(-X方向)
    if (spindleVec.x > 0) spindleVec.negate();

    // 更新车轮渲染姿态
    meshWheel.position.copy(pWC);
    // Cylinder默认沿Y轴，我们需要将其旋转对齐到spindleVec
    const defaultY = new THREE.Vector3(0, 1, 0);
    const quaternion = new THREE.Quaternion().setFromUnitVectors(defaultY, spindleVec);
    meshWheel.quaternion.copy(quaternion);

    // --- 数据提取 (Data Extraction) ---
    // 外倾角 Camber: 车轮平面与垂线的夹角，即Spindle向量与水平面(XZ)的夹角
    // Spindle向外(-X), 如果y为正(朝上)，则车轮顶部向内倾斜，即负外倾。
    const camberRad = Math.asin(spindleVec.y);
    const camberDeg = camberRad * 180 / Math.PI;

    // 前束角 Toe: Spindle在XZ面投影与X轴夹角
    // Spindle理论向左(-X)。如果向前偏(-Z)，则车轮前端向内，即Toe In(正)。
    const spindleXZ = new THREE.Vector3(spindleVec.x, 0, spindleVec.z).normalize();
    const toeRad = Math.atan2(-spindleXZ.z, -spindleXZ.x); 
    const toeDeg = toeRad * 180 / Math.PI;

    // KPI 主销内倾角 (投影在XY面的夹角)
    const kpiRad = Math.atan2(kingpinVec.x, kingpinVec.y);
    const kpiDeg = Math.abs(kpiRad * 180 / Math.PI); // 取绝对值表示倾斜度

    // Caster 主销后倾角 (投影在YZ面的夹角)
    const casterRad = Math.atan2(kingpinVec.z, kingpinVec.y);
    const casterDeg = casterRad * 180 / Math.PI;

    // 轮距变化 (Track Variation)相对于初始位置的X向位移
    const trackVar = pWC.x - baseWheelX;

    // 更新UI面板
    document.getElementById('data-camber').innerText = camberDeg.toFixed(2) + '°';
    document.getElementById('data-toe').innerText = toeDeg.toFixed(2) + '°';
    document.getElementById('data-kpi').innerText = kpiDeg.toFixed(2) + '°';
    document.getElementById('data-caster').innerText = casterDeg.toFixed(2) + '°';
    document.getElementById('data-track').innerText = trackVar.toFixed(1) + ' mm';

    // 绘制延长的主销轴线
    const kpEndTop = new THREE.Vector3().copy(pUBJ).addScaledVector(upVec, 300);
    const kpEndBot = new THREE.Vector3().copy(pLBJ).addScaledVector(upVec, -200);
    meshKingpin.geometry.setFromPoints([kpEndBot, kpEndTop]);
}

// 主渲染与物理更新循环
function updateScene() {
    // 1. 物理求解
    sys.solve();

    // 2. 更新节点网格位置
    for(let i=0; i<sys.nodes.length; i++) {
        visualNodes[i].position.copy(sys.nodes[i].pos);
    }

    // 3. 更新连杆线段
    const p = sys.nodes.map(n => n.pos);
    meshLCA.geometry.setFromPoints([p[N_LCA_F], p[N_LBJ], p[N_LCA_R], p[N_LCA_F]]);
    meshUCA.geometry.setFromPoints([p[N_UCA_F], p[N_UBJ], p[N_UCA_R], p[N_UCA_F]]);
    meshTieRod.geometry.setFromPoints([p[N_RACK], p[N_TIE]]);
    // 羊角网状结构
    meshKnuckle.geometry.setFromPoints([
        p[N_LBJ], p[N_UBJ], p[N_TIE], p[N_LBJ], p[N_WC], p[N_UBJ], p[N_WC], p[N_TIE]
    ]);

    // 4. 更新复杂几何与数据
    updateSpringVisual(p[N_SHOCK_TOP], p[N_SHOCK_BOT]);
    calculateDynamics();

    // 5. 更新轨迹
    if (isTracing) {
        tracePoints.push(p[N_WC].clone());
        if (tracePoints.length > MAX_TRACE) tracePoints.shift();
        traceGeo.setFromPoints(tracePoints);
    }
}

// --- 5. 交互控制与动画 ---
const sliderTravel = document.getElementById('slider-travel');
const sliderSteer = document.getElementById('slider-steer');
let animBump = false;
let animSteer = false;
let time = 0;

function handleInputs() {
    if (animBump) {
        sliderTravel.value = Math.sin(time * 3) * 50;
    }
    if (animSteer) {
        sliderSteer.value = Math.sin(time * 1.5) * 20;
    }

    const travel = parseFloat(sliderTravel.value);
    const steer = parseFloat(sliderSteer.value);

    document.getElementById('val-travel').innerText = travel.toFixed(1) + ' mm';
    document.getElementById('val-steer').innerText = steer.toFixed(1) + ' mm';

    // 驱动物理约束
    shockConstraint.len = baseShockLength - travel; // 缩短避震即悬挂压缩(Jounce)
    sys.nodes[N_RACK].pos.x = baseRackX + steer; // 移动齿条
}

// 自定义简易摄像机轨道控制 (防冲突)
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
canvas.addEventListener('mousedown', e => { isDragging = true; prevMouse.x = e.clientX; prevMouse.y = e.clientY; });
window.addEventListener('mouseup', () => { isDragging = false; });
window.addEventListener('mousemove', e => {
    if (isDragging) {
        camAngleX -= (e.clientX - prevMouse.x) * 0.005;
        camAngleY = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, camAngleY + (e.clientY - prevMouse.y) * 0.005));
        prevMouse.x = e.clientX; prevMouse.y = e.clientY;
    }
});
canvas.addEventListener('wheel', e => {
    camRadius = Math.max(500, Math.min(4000, camRadius + e.deltaY * 2));
});

function animate() {
    requestAnimationFrame(animate);
    
    time += 0.016;
    handleInputs();
    updateScene();

    // 更新相机位置
    camera.position.x = sys.nodes[N_WC].pos.x + camRadius * Math.cos(camAngleY) * Math.sin(camAngleX);
    camera.position.y = sys.nodes[N_WC].pos.y + camRadius * Math.sin(camAngleY);
    camera.position.z = sys.nodes[N_WC].pos.z + camRadius * Math.cos(camAngleY) * Math.cos(camAngleX);
    camera.lookAt(new THREE.Vector3(-550, 300, 0)); // 始终看向悬挂中央

    renderer.render(scene, camera);
}

// 绑定按钮事件
document.getElementById('btn-anim-bump').addEventListener('click', function() {
    animBump = !animBump;
    this.classList.toggle('active', animBump);
});
document.getElementById('btn-anim-steer').addEventListener('click', function() {
    animSteer = !animSteer;
    this.classList.toggle('active', animSteer);
});
document.getElementById('btn-trace').addEventListener('click', function() {
    isTracing = !isTracing;
    this.classList.toggle('active', isTracing);
    if (!isTracing) { tracePoints.length = 0; traceGeo.setFromPoints([]); }
});

// 窗口自适应
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// 启动
animate();

</script>
</body>
</html>
