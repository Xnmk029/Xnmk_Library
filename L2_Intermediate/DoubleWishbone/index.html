<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小丑牌 - Balatro</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d1a;--bg2:#151530;--bg3:#1e1e3a;
  --gold:#ffd93d;--red:#ff4757;--teal:#2ed573;
  --purple:#a855f7;--pink:#f472b6;
  --text:#e0e0e0;--text2:#8888aa;
  --card-bg:#faf3e0;--joker-bg:#2a1a4a;
  --border:#333355;
}
body{
  background:var(--bg);color:var(--text);
  font-family:'Courier New',Consolas,monospace;
  min-height:100vh;display:flex;justify-content:center;
  align-items:flex-start;padding:10px;
  background-image:
    repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px);
}
#game{
  width:100%;max-width:900px;
  background:var(--bg2);border:2px solid var(--border);
  border-radius:8px;padding:16px;
}
#top-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 12px;background:var(--bg3);border-radius:6px;
  margin-bottom:12px;border:1px solid var(--border);
}
#top-bar .round{font-size:15px;font-weight:bold;color:var(--gold)}
#top-bar .stats{display:flex;gap:16px;font-size:13px}
#top-bar .stats span{color:var(--text2)}
#top-bar .stats b{color:var(--teal)}
#money{color:var(--gold)!important;font-size:16px;font-weight:bold}

#score-area{
  background:var(--bg3);border:2px solid var(--border);
  border-radius:8px;padding:16px;margin-bottom:12px;
  text-align:center;position:relative;
}
#score-area .label{color:var(--text2);font-size:12px;text-transform:uppercase;letter-spacing:2px}
#score-area .target{color:var(--red);font-size:14px;margin-bottom:4px}
#score-area .current{font-size:48px;font-weight:bold;color:#fff;
  text-shadow:0 0 20px rgba(255,215,0,.5);line-height:1;
}
#score-area .breakdown{color:var(--text2);font-size:12px;margin-top:4px;min-height:18px}
#score-progress{height:4px;background:var(--bg);border-radius:2px;margin-top:8px;overflow:hidden}
#score-progress .fill{height:100%;background:var(--gold);transition:width .3s}

#boss-effect{
  color:var(--red);font-size:13px;margin-top:6px;
  padding:4px 8px;background:rgba(255,71,87,.1);
  border-radius:4px;display:inline-block;
}

#blind-select{
  display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:12px
}
.blind-card{
  background:var(--bg3);border:2px solid var(--border);
  border-radius:8px;padding:16px 20px;cursor:pointer;
  text-align:center;min-width:140px;transition:all .2s;
}
.blind-card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 4px 20px rgba(255,215,0,.2)}
.blind-card .bname{font-size:16px;font-weight:bold;margin-bottom:8px}
.blind-card .bname.small{color:var(--teal)}
.blind-card .bname.big{color:var(--gold)}
.blind-card .bname.boss{color:var(--red)}
.blind-card .binfo{font-size:12px;color:var(--text2);line-height:1.6}
.blind-card .breward{color:var(--gold);font-size:13px;margin-top:4px}
.blind-card.skipped{opacity:.3;pointer-events:none}

#hand-area{
  display:flex;justify-content:center;gap:6px;flex-wrap:wrap;
  min-height:130px;padding:8px 0;margin-bottom:8px;
}
.card{
  width:72px;height:104px;background:var(--card-bg);
  border:2px solid #ccc;border-radius:6px;cursor:pointer;
  position:relative;transition:transform .15s,box-shadow .15s,border-color .15s;
  user-select:none;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-weight:bold;
}
.card:hover{transform:translateY(-4px);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.card.selected{
  transform:translateY(-14px);border-color:var(--gold);
  box-shadow:0 8px 24px rgba(255,215,0,.4);
}
.card .rank{font-size:20px;line-height:1}
.card .suit{font-size:28px;line-height:1;margin-top:2px}
.card.red{color:#c0392b}
.card.black{color:#1a1a2e}
.card .enhance{position:absolute;bottom:4px;font-size:10px;opacity:.7}

#preview{
  text-align:center;font-size:13px;color:var(--text2);
  min-height:20px;margin-bottom:4px;
}
#preview b{color:var(--gold)}

#action-bar{
  display:flex;gap:10px;justify-content:center;margin-bottom:12px;flex-wrap:wrap;
}
.btn{
  padding:10px 24px;border:2px solid var(--border);
  border-radius:6px;background:var(--bg3);color:var(--text);
  font-family:inherit;font-size:14px;cursor:pointer;
  transition:all .15s;font-weight:bold;letter-spacing:1px;
}
.btn:hover{background:var(--border);border-color:var(--text2)}
.btn.primary{background:var(--gold);color:#1a1a2e;border-color:var(--gold)}
.btn.primary:hover{background:#ffe066}
.btn.danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn.danger:hover{background:#ff6b7a}
.btn:disabled{opacity:.3;pointer-events:none}

#joker-area{
  display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;
  min-height:80px;align-items:center;justify-content:flex-start;
  padding:8px;background:var(--bg3);border-radius:8px;
  border:1px dashed var(--border);
}
.joker{
  width:64px;height:90px;background:linear-gradient(135deg,#3a1a5a,#4a2068);
  border:2px solid var(--purple);border-radius:6px;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;position:relative;cursor:pointer;
  transition:transform .15s;color:#fff;font-size:10px;
  text-align:center;padding:4px;font-weight:bold;
}
.joker:hover{transform:scale(1.05)}
.joker .jname{font-size:9px;margin-bottom:2px;color:var(--pink)}
.joker .jdesc{font-size:10px;line-height:1.3;color:#ccc}
.joker .jprice{position:absolute;top:4px;right:6px;font-size:9px;color:var(--gold)}
.joker .edition{position:absolute;bottom:4px;font-size:8px;color:var(--gold)}
.joker.foil{border-color:#80d8ff;box-shadow:0 0 12px rgba(128,216,255,.4)}
.joker.holo{border-color:#ea80fc;box-shadow:0 0 12px rgba(234,128,252,.4)}
.joker.poly{border-color:#ff80ab;box-shadow:0 0 12px rgba(255,128,171,.4)}
.joker-empty{
  width:64px;height:90px;border:2px dashed var(--border);
  border-radius:6px;display:flex;align-items:center;
  justify-content:center;color:var(--text2);font-size:20px;
}

#consumable-area{
  display:flex;gap:8px;margin-bottom:12px;min-height:50px;align-items:center;
}
.consumable{
  width:56px;height:80px;background:linear-gradient(135deg,#1a3a3a,#204545);
  border:2px solid var(--teal);border-radius:6px;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;cursor:pointer;position:relative;
  transition:transform .15s;text-align:center;padding:4px;
  font-size:9px;color:#fff;
}
.consumable:hover{transform:scale(1.05)}
.consumable.tarot{border-color:#7c4dff;background:linear-gradient(135deg,#1a1a3a,#252550)}
.consumable .ctype{font-size:8px;margin-bottom:2px;color:var(--text2)}
.consumable .cname{font-size:10px;font-weight:bold;margin-bottom:2px}

#shop-area{
  background:var(--bg3);border:2px solid var(--border);
  border-radius:8px;padding:16px;margin-bottom:12px;display:none;
}
#shop-area h3{color:var(--gold);text-align:center;margin-bottom:12px;font-size:18px}
#shop-items{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.shop-item{
  background:var(--bg2);border:2px solid var(--border);border-radius:8px;
  padding:14px;width:170px;text-align:center;cursor:pointer;
  transition:all .2s;
}
.shop-item:hover{border-color:var(--gold);transform:translateY(-2px)}
.shop-item .tlabel{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:1px}
.shop-item .ititle{font-size:15px;font-weight:bold;margin:4px 0;color:#fff}
.shop-item .idesc{font-size:11px;color:var(--text2);margin-bottom:4px}
.shop-item .iprice{font-size:14px;font-weight:bold;color:var(--gold)}
.shop-item .jtype{color:var(--purple)}
.shop-item .ptype{color:var(--teal)}
.shop-item .ttype{color:var(--pink)}
#shop-actions{display:flex;gap:10px;justify-content:center}

#message{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);
  padding:10px 24px;border-radius:6px;font-weight:bold;
  font-size:14px;z-index:100;opacity:0;transition:opacity .2s;
  pointer-events:none;text-align:center;
}
#message.show{opacity:1}
#message.info{background:var(--bg3);border:2px solid var(--teal);color:var(--teal)}
#message.warn{background:var(--bg3);border:2px solid var(--gold);color:var(--gold)}
#message.error{background:var(--bg3);border:2px solid var(--red);color:var(--red)}
#message.score-pop{background:rgba(0,0,0,.9);border:2px solid var(--gold);color:var(--gold);font-size:20px}

#game-over-overlay{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.8);z-index:200;
  justify-content:center;align-items:center;flex-direction:column;
}
#game-over-overlay.active{display:flex}
#game-over-overlay h2{font-size:36px;color:var(--red);margin-bottom:8px}
#game-over-overlay p{color:var(--text);font-size:16px;margin-bottom:16px}

#hand-info{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;justify-content:center}
.hand-level{
  font-size:10px;color:var(--text2);padding:2px 6px;
  background:var(--bg3);border-radius:4px;border:1px solid var(--border)
}
.hand-level.upgraded{color:var(--teal);border-color:var(--teal)}

.modal-overlay{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.7);z-index:150;
  justify-content:center;align-items:center;
}
.modal-overlay.active{display:flex}
.modal{
  background:var(--bg2);border:2px solid var(--border);border-radius:12px;
  padding:24px;max-width:400px;width:90%;max-height:80vh;overflow-y:auto;
}
.modal h3{color:var(--gold);margin-bottom:12px;text-align:center}
.modal p{color:var(--text);font-size:13px;margin-bottom:8px;line-height:1.5}
.modal .card-grid{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.modal .mini-card{
  width:40px;height:56px;background:var(--card-bg);border-radius:3px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:10px;font-weight:bold;cursor:pointer;
}
.modal .mini-card.red{color:#c0392b}
.modal .mini-card.black{color:#1a1a2e}
.modal .mini-card:hover{transform:scale(1.1);box-shadow:0 2px 8px rgba(255,215,0,.3)}
.modal .mini-card.selected{border:2px solid var(--gold)}
.modal .btn{margin-top:12px;width:100%}

@keyframes popIn{
  0%{transform:scale(.8);opacity:0}
  50%{transform:scale(1.1)}
  100%{transform:scale(1);opacity:1}
}
@keyframes floatUp{
  0%{opacity:1;transform:translateY(0)}
  100%{opacity:0;transform:translateY(-40px)}
}
.score-float{
  position:absolute;font-size:16px;font-weight:bold;
  color:var(--gold);animation:floatUp 1s forwards;
  pointer-events:none;
}
.card.deal-anim{animation:popIn .3s ease-out}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<div id="game">
  <div id="top-bar">
    <span class="round" id="round-label">底注 1 — 选择盲注</span>
    <span class="stats">
      <span>出牌: <b id="hands-left">4</b></span>
      <span>弃牌: <b id="discards-left">3</b></span>
      <span>牌库: <b id="deck-count">52</b></span>
      <span id="money" style="margin-left:8px">$4</span>
    </span>
  </div>

  <div id="score-area">
    <div class="label">本回合目标</div>
    <div class="target" id="target-display">目标: 300</div>
    <div class="current" id="score-display">0</div>
    <div class="breakdown" id="score-breakdown"></div>
    <div id="score-progress"><div class="fill" id="score-fill" style="width:0%"></div></div>
    <div id="boss-effect"></div>
  </div>

  <div id="blind-select"></div>

  <div id="preview"></div>

  <div id="joker-area">
    <div class="joker-empty">+</div>
    <div class="joker-empty">+</div>
    <div class="joker-empty">+</div>
    <div class="joker-empty">+</div>
    <div class="joker-empty">+</div>
    <span style="font-size:10px;color:var(--text2);margin-left:4px">小丑槽位 (上限5)</span>
  </div>

  <div id="hand-area"></div>

  <div id="action-bar">
    <button class="btn primary" id="btn-play">🂡 打出手牌</button>
    <button class="btn" id="btn-discard">🗑 弃牌</button>
    <button class="btn danger" id="btn-end-round" style="display:none">结束回合</button>
  </div>

  <div id="hand-info"></div>

  <div id="shop-area">
    <h3>🏪 商店</h3>
    <div id="shop-items"></div>
    <div id="shop-actions">
      <button class="btn" id="btn-reroll">🔄 刷新商店 ($5)</button>
      <button class="btn primary" id="btn-skip-shop">跳过商店 →</button>
    </div>
  </div>
</div>

<div id="message"></div>
<div id="game-over-overlay">
  <h2>游戏结束</h2>
  <p id="game-over-text"></p>
  <button class="btn primary" onclick="restartGame()">重新开始</button>
</div>

<div class="modal-overlay" id="tarot-modal">
  <div class="modal">
    <h3 id="tarot-modal-title">选择目标牌</h3>
    <div id="tarot-modal-cards" class="card-grid"></div>
    <button class="btn primary" id="tarot-modal-confirm">确认</button>
    <button class="btn" id="tarot-modal-cancel">取消</button>
  </div>
</div>

const TAROT_DEFS = [

  {name:'墙',desc:'目标分数 +2000',effect:(g)=>g.targetScore+=2000},
  {name:'水',desc:'弃牌次数归零',effect:(g)=>g.discardsLeft=0},
  {name:'针',desc:'只有 1 次出牌',effect:(g)=>g.handsLeft=1},
  {name:'燧石',desc:'基础筹码和倍率减半',effect:(g)=>{g.bossHalve=true}},
  {name:'印记',desc:'所有人头牌失效',effect:(g)=>{g.bossFaceNerf=true}},
  {name:'嘴',desc:'手牌上限 -1',effect:(g)=>{g.handSize=Math.max(5,g.handSize-1)}},
  {name:'眼',desc:'不能重复出同牌型',effect:(g)=>{g.bossNoRepeat=true}},
];

function getAnteScores(ante){
  const base=[300,450,600, 800,1200,1600, 2000,3000,4000, 5000,7500,10000,
    11000,16500,22000, 20000,30000,40000, 35000,52500,70000, 50000,75000,100000];
  const i=(ante-1)*3;
  return {small:base[i]||base[base.length-3],big:base[i+1]||base[base.length-2],boss:base[i+2]||base[base.length-1]};
}

// ==================== GAME STATE ====================
let G={
  deck:[],hand:[],discardPile:[],playedCardsThisRound:[],playedHandTypesThisRound:[],
  selectedIndices:new Set(), jokers:[],consumables:[],handLevels:{},
  money:4,ante:1,blindIndex:0,phase:'blind_select',
  handsLeft:4,discardsLeft:3,handSize:8,maxJokers:5,maxConsumables:2,
  score:0,targetScore:300,blindReward:3,bossEffect:null,bossEffectDesc:'',
  bossHalve:false,bossFaceNerf:false,bossNoRepeat:false,
  shopItems:[],shopRerollCost:5,bossPreview:null,
  tarotPending:null,tarotCallback:null,
};
function initHandLevels(){
  G.handLevels={};
  for(const[k,v]of Object.entries(HAND_BASE)){
    G.handLevels[k]={level:1,chips:v.chips,mult:v.mult};
  }
}

// ==================== UTILITY FUNCTIONS ====================
function createCard(suit,rank){
  return {
    suit,rank,id:suit+'_'+rank+'_'+Math.random().toString(36).slice(2,6),
    chip: RANK_VALUES[rank], enhancement:null, edition:null
  };
}
function createDeck(){
  const d=[];
  for(const s of SUITS)for(const r of RANKS)d.push(createCard(s,r));
  return d;
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function getCardColor(suit){return SUIT_COLORS[suit]||'black';}
function drawCards(n){
  const drawn=[];
  for(let i=0;i<n;i++){
    if(G.deck.length===0){
      if(G.discardPile.length===0)break;
      G.deck=shuffle([...G.discardPile]);G.discardPile=[];
    }
    drawn.push(G.deck.pop());
  }
  return drawn;
}
function getChipValue(card){
  if(card.enhancement==='stone')return 50;
  let v=card.chip||RANK_VALUES[card.rank]||0;
  if(card.enhancement==='bonus')v+=30;
  return v;
}
function isFaceCard(card){return ['J','Q','K'].includes(card.rank)||card.enhancement==='face';}
function randInt(n){return Math.floor(Math.random()*n);}
function showMessage(text,type='info',duration=2000){
  const el=document.getElementById('message');
  el.textContent=text;el.className=`${type}`;
  el.classList.add('show');
  clearTimeout(el._timeout);
  el._timeout=setTimeout(()=>el.classList.remove('show'),duration);
}
function showScoreFloat(x,y,text){
  const el=document.createElement('div');el.className='score-float';
  el.textContent=text;el.style.left=x+'px';el.style.top=y+'px';
  document.getElementById('score-area').appendChild(el);
  setTimeout(()=>el.remove(),1200);
}

// ==================== HAND EVALUATION ====================
function checkStraight(vals){
  if(vals.length<5)return false;
  for(let i=0;i<=vals.length-5;i++){
    if(vals[i+4]-vals[i]===4)return true;
  }
  if(vals.includes(14)&&vals.includes(2)&&vals.includes(3)&&vals.includes(4)&&vals.includes(5))return true;
  return false;
}
function evaluateHand(cards){
  if(!cards||cards.length===0)return {type:'high_card',...HAND_BASE.high_card};
  const rankCounts={},suitCounts={};
  for(const c of cards){
    rankCounts[c.rank]=(rankCounts[c.rank]||0)+1;
    suitCounts[c.suit]=(suitCounts[c.suit]||0)+1;
  }
  const freqs=Object.values(rankCounts).sort((a,b)=>b-a);
  const vals=[...new Set(cards.map(c=>RANK_VALUES[c.rank]||0))].sort((a,b)=>a-b);
  const isFlush=cards.length>=5&&Object.values(suitCounts).some(c=>c>=5);
  const isStraight=cards.length>=5&&checkStraight(vals);

  if(freqs[0]>=5)return {type:'five_of_a_kind',...G.handLevels.five_of_a_kind};
  if(isFlush&&isStraight){
    const maxV=Math.max(...vals);const minV=Math.min(...vals);
    if(maxV===14&&minV===10&&!vals.some(v=>[2,3,4,5].includes(v)))return {type:'royal_flush',...G.handLevels.royal_flush};
    return {type:'straight_flush',...G.handLevels.straight_flush};
  }
  if(freqs[0]>=4)return {type:'four_of_a_kind',...G.handLevels.four_of_a_kind};
  if(freqs[0]===3&&freqs[1]>=2)return {type:'full_house',...G.handLevels.full_house};
  if(isFlush)return {type:'flush',...G.handLevels.flush};
  if(isStraight)return {type:'straight',...G.handLevels.straight};
  if(freqs[0]===3)return {type:'three_of_a_kind',...G.handLevels.three_of_a_kind};
  if(freqs[0]===2&&freqs[1]>=2)return {type:'two_pair',...G.handLevels.two_pair};
  if(freqs[0]===2)return {type:'pair',...G.handLevels.pair};
  return {type:'high_card',...G.handLevels.high_card};
}

// ==================== SCORING ====================
function calculateScore(cards,handInfo){
  let chips=handInfo.chips||0;
  let mult=handInfo.mult||0;
  if(G.bossHalve){chips=Math.floor(chips/2);mult=Math.floor(mult/2);}

  // Add card chip values
  for(const c of cards){
    if(G.bossFaceNerf&&isFaceCard(c))continue;
    chips+=getChipValue(c);
    if(c.enhancement==='mult')mult+=4;
  }

  // Apply joker effects
  for(const j of G.jokers){
    if(!j.def)continue;
    let v=j.def.val;
    if(j.edition==='foil')chips+=50;
    if(j.edition==='holo')mult+=10;
    switch(j.def.type){
      case'add_mult':mult+=v;break;
      case'add_mult_gros':mult+=v;break;
      case'suit_mult':
        for(const c of cards)if(c.suit===j.def.suit)mult+=v;
        break;
      case'face_chips':
        for(const c of cards)if(isFaceCard(c)&&!(G.bossFaceNerf&&isFaceCard(c)))chips+=v;
        break;
      case'face_mult':
        for(const c of cards)if(isFaceCard(c)&&!(G.bossFaceNerf&&isFaceCard(c)))mult+=v;
        break;
      case'hand_mult':if(handInfo.type===j.def.hand)mult+=v;break;
      case'hand_chips':if(handInfo.type===j.def.hand)chips+=v;break;
      case'discard_chips':chips+=G.discardsLeft*v;break;
      case'no_discard_mult':if(G.discardsLeft===0)mult+=v;break;
      case'half_mult':if(cards.length<=3)mult+=v;break;
      case'money_chips':chips+=Math.floor(G.money*v);break;
      case'joker_count_mult':mult+=G.jokers.length*v;break;
      case'ice_cream':chips+=(j.extra!=null?j.extra:v);j.extra=Math.max(0,(j.extra!=null?j.extra:v)-j.def.decay);break;
    }
  }
  // XMult effects
  for(const j of G.jokers){
    if(!j.def)continue;
    if(j.edition==='poly')mult=Math.floor(mult*1.5);
    switch(j.def.type){
      case'xmult_black':
        const handCards=G.hand.filter((_,i)=>!G.selectedIndices.has(i));
        const allBlack=handCards.length>0&&handCards.every(c=>['clubs','spades'].includes(c.suit));
        if(allBlack)mult=Math.floor(mult*j.def.val);
        break;
      case'xmult_repeat':
        if(G.playedHandTypesThisRound.includes(handInfo.type))mult=Math.floor(mult*j.def.val);
        break;
      case'xmult_final':
        if(G.handsLeft<=1)mult=Math.floor(mult*j.def.val);
        break;
    }
  }
  if(mult<1)mult=1;
  return Math.floor(chips*mult);
}

// ==================== GAME ACTIONS ====================
function selectBlind(index){
  if(G.phase!=='blind_select')return;
  const scores=getAnteScores(G.ante);
  const blinds=[{name:'小盲注',target:scores.small,reward:3,discards:3,hands:4},
                {name:'大盲注',target:scores.big,reward:4,discards:3,hands:4},
                {name:'Boss盲注',target:scores.boss,reward:5,discards:3,hands:4}];
  const b=blinds[index];
  G.targetScore=b.target;G.blindReward=b.reward;G.handsLeft=b.hands;
  G.discardsLeft=b.discards;G.blindIndex=index;G.score=0;
  G.selectedIndices=new Set();G.playedCardsThisRound=[];
  G.playedHandTypesThisRound=[];G.bossHalve=false;G.bossFaceNerf=false;
  G.bossNoRepeat=false;
  G.bossEffect=null;G.bossEffectDesc='';

  // Reset joker temp values
  for(const j of G.jokers){
    if(j.def&&j.def.type==='ice_cream')j.extra=j.def.val;
  }

  if(index===2){
    const be=G.bossPreview||BOSS_EFFECTS[randInt(BOSS_EFFECTS.length)];
    G.bossEffect=be.effect;G.bossEffectDesc=be.name+': '+be.desc;
    be.effect(G);
  }

  G.phase='playing';
  G.deck=shuffle(createDeck());G.discardPile=[];
  G.hand=drawCards(G.handSize);

  document.getElementById('blind-select').style.display='none';
  document.getElementById('shop-area').style.display='none';
  render();
}

function selectCard(index){
  if(G.phase!=='playing')return;
  if(G.handsLeft<=0)return;
  if(G.selectedIndices.has(index))G.selectedIndices.delete(index);
  else{
    if(G.selectedIndices.size>=5)return;
    G.selectedIndices.add(index);
  }
  render();
}

function playHand(){
  if(G.phase!=='playing')return;
  if(G.handsLeft<=0)return;
  if(G.selectedIndices.size===0){showMessage('请选择至少1张牌','warn');return;}

  const indices=Array.from(G.selectedIndices).sort((a,b)=>b-a);
  const cards=indices.map(i=>G.hand[i]);
  const handInfo=evaluateHand(cards);

  // Boss: no repeat hand types
  if(G.bossNoRepeat&&G.playedHandTypesThisRound.includes(handInfo.type)){
    showMessage('Boss 眼: 不能重复出相同牌型!','error',3000);
    return;
  }

  const score=calculateScore(cards,handInfo);
  G.score+=score;
  G.handsLeft--;
  G.playedHandTypesThisRound.push(handInfo.type);

  // Show score breakdown
  document.getElementById('score-breakdown').textContent=
    '上次出牌: '+handInfo.name+' → +'+score+' 分 (目标: '+G.targetScore+')';

  // Remove played cards
  for(const i of indices)G.discardPile.push(G.hand[i]);
  G.hand=G.hand.filter((_,i)=>!G.selectedIndices.has(i));
  G.selectedIndices=new Set();

  // Draw new cards
  const toDraw=G.handSize-G.hand.length;
  if(toDraw>0)G.hand.push(...drawCards(toDraw));

  // Score float
  const scoreArea=document.getElementById('score-area');
  const rect=scoreArea.getBoundingClientRect();
  showScoreFloat(rect.width/2-40,60,'+'+score+'  '+handInfo.name);

  render();

  if(G.score>=G.targetScore)return winRound();
  if(G.handsLeft<=0&&G.score<G.targetScore)return loseRound();
}

function discardCards(){
  if(G.phase!=='playing')return;
  if(G.discardsLeft<=0){showMessage('没有弃牌次数了','warn');return;}
  if(G.selectedIndices.size===0){showMessage('请选择要弃的牌','warn');return;}

  const indices=Array.from(G.selectedIndices).sort((a,b)=>b-a);
  for(const i of indices)G.discardPile.push(G.hand[i]);
  G.hand=G.hand.filter((_,i)=>!G.selectedIndices.has(i));
  G.discardsLeft--;
  G.selectedIndices=new Set();

  const toDraw=G.handSize-G.hand.length;
  if(toDraw>0)G.hand.push(...drawCards(toDraw));
  render();
}

function winRound(){
  const interest=Math.min(5,Math.floor(G.money/5));
  const handBonus=G.handsLeft;
  const extra=G.blindReward+interest+handBonus;
  G.money+=extra;

  // End-of-round joker effects
  const surviving=[];
  for(const j of G.jokers){
    if(!j.def){surviving.push(j);continue;}
    if(j.def.type==='end_money')G.money+=j.def.val;
    if(j.def.type==='add_mult_gros'&&Math.random()<1/6){
      showMessage(j.def.name+' 损毁了!','error');
      continue;
    }
    surviving.push(j);
  }
  G.jokers=surviving;
  G.phase='shop';

  showMessage('回合胜利! +$'+extra+' (奖励$'+G.blindReward+' +利息$'+interest+' +手牌$'+handBonus+')','info',4000);
  generateShop();
  document.getElementById('blind-select').style.display='none';
  document.getElementById('btn-end-round').style.display='none';
  render();
}

function loseRound(){
  G.phase='game_over';
  document.getElementById('game-over-text').textContent=
    '你在底注 '+G.ante+' 失败了\n最终分数: '+G.score+' / '+G.targetScore;
  document.getElementById('game-over-overlay').classList.add('active');
  render();
}

function nextBlind(){
  G.blindIndex++;
  if(G.blindIndex>=3){G.ante++;G.blindIndex=0;}
  G.phase='blind_select';
  G.score=0;G.targetScore=300;G.selectedIndices=new Set();
  G.playedCardsThisRound=[];G.playedHandTypesThisRound=[];
  G.hand=[];G.deck=[];G.discardPile=[];
  G.handsLeft=4;G.discardsLeft=3;G.handSize=8;
  G.bossEffect=null;G.bossEffectDesc='';G.bossHalve=false;G.bossFaceNerf=false;
  G.bossNoRepeat=false;G.bossPreview=null;
  document.getElementById('shop-area').style.display='none';
  document.getElementById('blind-select').style.display='flex';
  document.getElementById('btn-end-round').style.display='none';
  render();
}

// ==================== SHOP ====================
function generateShop(){
  G.shopItems=[];
  const count=2+randInt(2);
  for(let i=0;i<count;i++){
    const r=Math.random();
    if(r<0.45){
      const def=JOKER_DEFS[randInt(JOKER_DEFS.length)];
      let cost=def.cost;
      let edition=null;
      if(Math.random()<0.1)edition='foil';
      else if(Math.random()<0.05)edition='holo';
      else if(Math.random()<0.02)edition='poly';
      if(edition)cost+=2;
      G.shopItems.push({type:'joker',def,cost,edition});
    }else if(r<0.75){
      const handTypes=Object.keys(PLANET_DEFS);
      const ht=handTypes[randInt(handTypes.length)];
      const pd=PLANET_DEFS[ht];
      G.shopItems.push({type:'planet',handType:ht,name:pd.name,desc:pd.desc,cost:3});
    }else{
      const def=TAROT_DEFS[randInt(TAROT_DEFS.length)];
      G.shopItems.push({type:'tarot',def,cost:3});
    }
  }
}

function buyShopItem(index){
  if(G.phase!=='shop')return;
  if(document.getElementById('tarot-modal').classList.contains('active'))return;
  const item=G.shopItems[index];
  if(!item||G.money<item.cost){showMessage('金币不足!','error');return;}

  G.money-=item.cost;
  if(item.type==='joker'){
    if(G.jokers.length>=G.maxJokers){showMessage('小丑槽位已满!','error');G.money+=item.cost;return;}
    G.jokers.push({def:item.def,edition:item.edition||null,extra:item.def.type==='ice_cream'?item.def.val:0});
    showMessage('获得小丑: '+item.def.name,'info');
  }else if(item.type==='planet'){
    const hl=G.handLevels[item.handType];
    const hb=HAND_BASE[item.handType];
    if(hl){
      hl.level++;
      hl.chips+=hb.cUp;hl.mult+=hb.mUp;
      showMessage('升级 '+HAND_BASE[item.handType].name+' → Lv.'+hl.level,'info');
    }
  }else if(item.type==='tarot'){
    useTarot(item.def);
  }
  G.shopItems.splice(index,1);
  render();
}

function useTarot(def){
  if(def.effect==='double_money'){
    G.money=Math.min(40,G.money*2);
    showMessage('金钱翻倍! $'+G.money,'info');
  }else if(def.effect==='random_joker'){
    if(G.jokers.length>=G.maxJokers){showMessage('小丑槽位已满!','error');return;}
    const jd=JOKER_DEFS[randInt(JOKER_DEFS.length)];
    G.jokers.push({def:jd,edition:null,extra:jd.type==='ice_cream'?jd.val:0});
    showMessage('获得小丑: '+jd.name,'info');
  }else if(def.effect==='random_planet'){
    const ht=Object.keys(PLANET_DEFS)[randInt(Object.keys(PLANET_DEFS).length)];
    const hl=G.handLevels[ht];
    const hb=HAND_BASE[ht];
    if(hl){hl.level++;hl.chips+=hb.cUp;hl.mult+=hb.mUp;
      showMessage('获得星球: '+PLANET_DEFS[ht].name+' Lv.'+hl.level,'info');}
  }else if(def.effect==='wheel'){
    if(Math.random()<0.25&&G.jokers.length>0){
      const j=G.jokers[randInt(G.jokers.length)];
      const editions=['foil','holo','poly'];
      j.edition=editions[randInt(editions.length)];
      showMessage('命运之轮! '+j.def.name+' 获得版本','info');
    }else{showMessage('命运之轮... 没有效果','warn');}
  }else if(def.effect==='bonus'||def.effect==='mult'||def.effect==='wild'||def.effect==='gold'){
    // Need to select a card from deck
    showTarotCardSelect(def);
  }
}

function showTarotCardSelect(def){
  G.tarotPending=def;
  const modal=document.getElementById('tarot-modal');
  const title=document.getElementById('tarot-modal-title');
  const grid=document.getElementById('tarot-modal-cards');
  title.textContent='选择一张牌来增强 ('+def.name+')';
  grid.innerHTML='';

  const allCards=[...G.deck,...G.hand,...G.discardPile];
  const seen=new Set();
  const unique=[];
  for(const c of allCards){
    const key=c.suit+c.rank+(c.enhancement||'');
    if(!seen.has(key)&&!c.enhancement){seen.add(key);unique.push(c);}
  }
  const display=unique.slice(0,12);

  let selectedCard=null;
  for(const c of display){
    const el=document.createElement('div');
    el.className='mini-card '+getCardColor(c.suit);
    el.innerHTML='<span>'+c.rank+'</span><span>'+SUIT_SYMBOLS[c.suit]+'</span>';
    el.onclick=()=>{
      grid.querySelectorAll('.mini-card').forEach(e=>e.classList.remove('selected'));
      el.classList.add('selected');selectedCard=c;
    };
    grid.appendChild(el);
  }

  modal.classList.add('active');
  document.getElementById('tarot-modal-confirm').onclick=()=>{
    if(!selectedCard){showMessage('请选择一张牌','warn');return;}
    selectedCard.enhancement=def.effect;
    showMessage(selectedCard.rank+SUIT_SYMBOLS[selectedCard.suit]+' → '+def.name,'info');
    modal.classList.remove('active');
    G.tarotPending=null;
    render();
  };
  document.getElementById('tarot-modal-cancel').onclick=()=>{
    modal.classList.remove('active');
    G.tarotPending=null;
  };
}
// Close modal on overlay click
document.getElementById('tarot-modal').addEventListener('click',(e)=>{
  if(e.target===e.currentTarget){
    e.currentTarget.classList.remove('active');
    G.tarotPending=null;
  }
});

function skipShop(){
  if(G.phase!=='shop')return;
  if(document.getElementById('tarot-modal').classList.contains('active'))return;
  nextBlind();
}

function rerollShop(){
  if(G.phase!=='shop'||G.money<G.shopRerollCost)return;
  G.money-=G.shopRerollCost;
  generateShop();
  render();
}

// ==================== RENDERING ====================
function render(){
  // Top bar
  const roundLabel=document.getElementById('round-label');
  const blindNames=['小盲注','大盲注','Boss盲注'];
  if(G.phase==='blind_select')roundLabel.textContent='底注 '+G.ante+' — 选择盲注';
  else if(G.phase==='playing')roundLabel.textContent='底注 '+G.ante+' — '+blindNames[G.blindIndex]||'盲注';
  else if(G.phase==='shop')roundLabel.textContent='底注 '+G.ante+' — 商店';
  else roundLabel.textContent='游戏结束';

  document.getElementById('hands-left').textContent=G.handsLeft;
  document.getElementById('discards-left').textContent=G.discardsLeft;
  document.getElementById('deck-count').textContent=G.deck.length+G.discardPile.length;
  document.getElementById('money').textContent='$'+G.money;
  document.getElementById('target-display').textContent=
    G.phase==='playing'?'目标: '+G.targetScore:'';
  document.getElementById('score-display').textContent=G.score;
  const pct=G.targetScore>0?Math.min(100,(G.score/G.targetScore)*100):0;
  document.getElementById('score-fill').style.width=pct+'%';
  document.getElementById('boss-effect').textContent=
    G.bossEffectDesc?'⚠ '+G.bossEffectDesc:'';

  // Blind select
  const bsArea=document.getElementById('blind-select');
  if(G.phase==='blind_select'){
    bsArea.style.display='flex';
    const scores=getAnteScores(G.ante);
    if(!G.bossPreview)G.bossPreview=BOSS_EFFECTS[randInt(BOSS_EFFECTS.length)];
    const bl=[
      {n:'小盲注',t:scores.small,r:'$3',c:'small',d:'标准盲注'},
      {n:'大盲注',t:scores.big,r:'$4',c:'big',d:'标准盲注'},
      {n:'Boss盲注',t:scores.boss,r:'$5',c:'boss',d:G.bossPreview.name+': '+G.bossPreview.desc}];
    bsArea.innerHTML=bl.map((b,i)=>`
      <div class="blind-card" onclick="selectBlind(${i})">
        <div class="bname ${b.c}">${b.n}</div>
        <div class="binfo">目标: ${b.t}<br>${b.d}</div>
        <div class="breward">奖励: ${b.r}</div>
      </div>`).join('');
  }else bsArea.style.display='none';

  // Hand area
  renderHand();

  // Preview
  const preview=document.getElementById('preview');
  if(G.selectedIndices.size>0){
    const indices=Array.from(G.selectedIndices);
    const cards=indices.map(i=>G.hand[i]);
    const info=evaluateHand(cards);
    preview.innerHTML='<b>'+info.name+'</b>  '+info.chips+'筹码 × '+info.mult+'倍率';
  }else if(G.phase==='playing'&&G.playedHandTypesThisRound.length>0){
    preview.innerHTML='已出牌型: '+G.playedHandTypesThisRound.map(t=>HAND_BASE[t]?HAND_BASE[t].name:t).join(' → ');
  }else preview.innerHTML='';

  // Joker area
  renderJokers();

  // Hand info (levels)
  const hiArea=document.getElementById('hand-info');
  if(G.phase==='playing'){
    const types=['high_card','pair','two_pair','three_of_a_kind','straight','flush','full_house','four_of_a_kind','straight_flush'];
    hiArea.innerHTML=types.map(t=>{
      const hl=G.handLevels[t];const hb=HAND_BASE[t];
      const isUp=hl&&hl.level>1;
      return `<span class="hand-level${isUp?' upgraded':''}">${hb.name} Lv.${hl?hl.level:1}</span>`;
    }).join('');
  }else hiArea.innerHTML='';

  // Shop
  const shopArea=document.getElementById('shop-area');
  if(G.phase==='shop'){
    shopArea.style.display='block';
    const itemsDiv=document.getElementById('shop-items');
    itemsDiv.innerHTML=G.shopItems.map((item,i)=>`
      <div class="shop-item" onclick="buyShopItem(${i})">
        <div class="tlabel ${item.type==='joker'?'jtype':item.type==='planet'?'ptype':'ttype'}">${item.type==='joker'?'小丑':item.type==='planet'?'星球':'塔罗'}</div>
        <div class="ititle">${item.type==='joker'?item.def.name:item.name}</div>
        <div class="idesc">${item.type==='joker'?item.def.desc:item.desc}</div>
        <div class="iprice">$${item.cost}</div>
        ${item.edition?'<div style="font-size:10px;color:var(--gold);margin-top:2px">✨ '+item.edition+'</div>':''}
      </div>`).join('');
  }else shopArea.style.display='none';

  // Buttons
  document.getElementById('btn-play').style.display=G.phase==='playing'?'inline-block':'none';
  document.getElementById('btn-discard').style.display=G.phase==='playing'?'inline-block':'none';
  document.getElementById('btn-play').disabled=G.handsLeft<=0;
  document.getElementById('btn-discard').disabled=G.discardsLeft<=0;
}

function renderHand(){
  const area=document.getElementById('hand-area');
  if(G.phase!=='playing'){area.innerHTML='';return;}
  const cards=G.hand;
  if(cards.length===0){area.innerHTML='';return;}

  area.innerHTML=cards.map((c,i)=>{
    const color=getCardColor(c.suit);
    const sym=SUIT_SYMBOLS[c.suit]||c.suit;
    const sel=G.selectedIndices.has(i)?' selected':'';
    const enh=!c.enhancement?'':c.enhancement==='bonus'?'奖励':c.enhancement==='mult'?'倍率':c.enhancement==='wild'?'万能':c.enhancement==='gold'?'黄金':c.enhancement==='stone'?'石头':'';
    return `<div class="card ${color}${sel}" data-index="${i}">
      <span class="rank">${c.rank}</span>
      <span class="suit">${sym}</span>
      ${enh?`<span class="enhance" style="color:var(--gold)">${enh}</span>`:''}
    </div>`;
  }).join('');
}

function renderJokers(){
  const area=document.getElementById('joker-area');
  let html='';
  for(let i=0;i<G.maxJokers;i++){
    if(i<G.jokers.length){
      const j=G.jokers[i];
      if(!j.def){html+=`<div class="joker-empty">+</div>`;continue;}
      const edCls=j.edition||'';
      html+=`<div class="joker ${edCls}" title="${j.def.desc}">
        <span class="jname">${j.def.name}</span>
        <span class="jdesc">${j.def.desc}</span>
        ${j.edition?`<span class="edition">✨${j.edition}</span>`:''}
        </div>`;
    }else html+=`<div class="joker-empty">+</div>`;
  }
  html+='<span style="font-size:10px;color:var(--text2);margin-left:4px">小丑 ('+G.jokers.length+'/'+G.maxJokers+') | 点击出售</span>';
  area.innerHTML=html;
}

// ==================== EVENT HANDLERS ====================
document.getElementById('hand-area').addEventListener('click',(e)=>{
  const cardEl=e.target.closest('.card');
  if(!cardEl||G.phase!=='playing')return;
  const idx=parseInt(cardEl.dataset.index);
  if(!isNaN(idx))selectCard(idx);
});

document.getElementById('btn-play').addEventListener('click',playHand);
document.getElementById('btn-discard').addEventListener('click',discardCards);
document.getElementById('btn-skip-shop').addEventListener('click',skipShop);
document.getElementById('btn-reroll').addEventListener('click',()=>{
  if(G.phase!=='shop')return;
  if(G.money<G.shopRerollCost){showMessage('金币不足!','error');return;}
  G.money-=G.shopRerollCost;
  generateShop();
  render();
});

// Joker click to sell
function sellJoker(index){
  if(G.phase==='game_over')return;
  const j=G.jokers[index];
  if(!j||!j.def)return;
  const price=Math.floor(j.def.cost/2);
  G.money+=price;
  const name=j.def.name;
  G.jokers.splice(index,1);
  showMessage('出售 '+name+' → +$'+price,'info');
  render();
}
document.getElementById('joker-area').addEventListener('click',(e)=>{
  const jokerEl=e.target.closest('.joker');
  if(!jokerEl)return;
  const allJokers=document.querySelectorAll('#joker-area .joker');
  const idx=Array.from(allJokers).indexOf(jokerEl);
  if(idx>=0&&idx<G.jokers.length)sellJoker(idx);
});

// Keyboard shortcuts
document.addEventListener('keydown',(e)=>{
  if(G.phase==='shop'){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();skipShop();}
    return;
  }
  if(G.phase!=='playing')return;
  if(e.key==='Enter'||e.key===' '){e.preventDefault();playHand();}
  if(e.key==='d'||e.key==='D'){e.preventDefault();discardCards();}
  if(e.key>='1'&&e.key<='8'){
    const idx=parseInt(e.key)-1;
    if(idx<G.hand.length)selectCard(idx);
  }
});

function restartGame(){
  G={
    deck:[],hand:[],discardPile:[],playedCardsThisRound:[],playedHandTypesThisRound:[],
    selectedIndices:new Set(), jokers:[],consumables:[],handLevels:{},
    money:4,ante:1,blindIndex:0,phase:'blind_select',
    handsLeft:4,discardsLeft:3,handSize:8,maxJokers:5,maxConsumables:2,
    score:0,targetScore:300,blindReward:3,bossEffect:null,bossEffectDesc:'',
    bossHalve:false,bossFaceNerf:false,bossNoRepeat:false,
    shopItems:[],shopRerollCost:5,bossPreview:null,
    tarotPending:null,tarotCallback:null,
  };
  initHandLevels();
  document.getElementById('game-over-overlay').classList.remove('active');
  document.getElementById('blind-select').style.display='flex';
  document.getElementById('shop-area').style.display='none';
  document.getElementById('score-breakdown').textContent='';
  document.getElementById('boss-effect').textContent='';
  render();
}

// ==================== INITIALIZATION ====================
initHandLevels();
render();
// Start with blind select
document.getElementById('blind-select').style.display='flex';
</script>
</body>
</html>
