<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Wishbone Kinematics Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111111;
            color: #e0e0e0;
            font-family: 'Consolas', 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            height: 100vh;
            user-select: none;
        }
        .viewport {
            flex-grow: 1;
            position: relative;
            background-color: #151515;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        .overlay-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
        }
        .overlay-title {
            font-size: 16px;
            color: #888888;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .data-readout {
            font-size: 13px;
            color: #00ffcc;
            line-height: 1.6;
        }
        .sidebar {
            width: 320px;
            background-color: #1a1a1a;
            border-left: 1px solid #333333;
            display: flex;
            flex-direction: column;
            padding: 0;
            overflow-y: auto;
        }
        .sidebar-header {
            background-color: #222222;
            padding: 15px 20px;
            font-size: 14px;
            color: #aaaaaa;
            border-bottom: 1px solid #333333;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .control-group {
            padding: 20px;
            border-bottom: 1px solid #333333;
        }
        .control-group h3 {
            font-size: 12px;
            color: #666666;
            margin: 0 0 15px 0;
            font-weight: normal;
        }
        .input-row {
            margin-bottom: 20px;
        }
        .input-row:last-child {
            margin-bottom: 0;
        }
        .input-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #bbbbbb;
            margin-bottom: 8px;
        }
        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            background: #333333;
            height: 2px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 16px;
            background: #00ffcc;
            cursor: pointer;
            border: none;
        }
        button {
            width: 100%;
            background-color: #2a2a2a;
            color: #ffffff;
            border: 1px solid #444444;
            padding: 10px;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        button:hover {
            background-color: #00ffcc;
            color: #000000;
            border-color: #00ffcc;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            font-size: 12px;
            color: #aaaaaa;
            margin-bottom: 12px;
            cursor: pointer;
        }
        .checkbox-row input {
            margin-right: 10px;
            accent-color: #00ffcc;
        }
    </style>
</head>
<body>
    <!-- Model Name Watermark -->
<div style="position: fixed; top: 15px; left: 50%; transform: translateX(-50%); z-index: 9999999; pointer-events: none; opacity: 0.35; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 32px; font-weight: 700; color: #888; text-shadow: 1px 1px 0px rgba(255,255,255,0.8), -1px -1px 0px rgba(0,0,0,0.8); user-select: none; letter-spacing: 0.5px; white-space: nowrap;">Gemini3.1pro</div>
<div class="viewport">
        <canvas id="simCanvas"></canvas>
        <div class="overlay-panel">
            <div class="overlay-title">KINEMATICS SOLVER V1.0</div>
            <div class="data-readout" id="stats">
                LOADING SOLVER...
            </div>
        </div>
    </div>
    
    <div class="sidebar">
        <div class="sidebar-header">
            SYSTEM CONTROL
        </div>
        
        <div class="control-group">
            <h3>ACTUATION INPUT</h3>
            <div class="input-row">
                <div class="input-label">
                    <span>STEERING RACK</span>
                    <span id="valSteer">0.0</span>
                </div>
                <input type="range" id="steerSlider" min="-80" max="80" value="0" step="0.5">
            </div>
            
            <div class="input-row">
                <div class="input-label">
                    <span>SUSPENSION TRAVEL</span>
                    <span id="valBump">0.0</span>
                </div>
                <input type="range" id="bumpSlider" min="-100" max="100" value="0" step="0.5">
            </div>
            
            <button id="btnSweep" style="margin-top: 10px;">TOGGLE AUTO SWEEP</button>
        </div>
        
        <div class="control-group">
            <h3>VISUALIZATION SETTINGS</h3>
            <label class="checkbox-row">
                <input type="checkbox" id="chkPath" checked> SHOW KINGPIN PATH
            </label>
            <label class="checkbox-row">
                <input type="checkbox" id="chkNodes" checked> SHOW NODES
            </label>
            <label class="checkbox-row">
                <input type="checkbox" id="chkInternal"> SHOW INTERNAL LINKS
            </label>
            <label class="checkbox-row">
                <input type="checkbox" id="chkGrid" checked> SHOW GROUND GRID
            </label>
        </div>
        
        <div class="control-group">
            <h3>VIEWPORT INFO</h3>
            <div style="font-size: 11px; color: #666; line-height: 1.6;">
                DRAG to Rotate Camera<br>
                SCROLL to Zoom<br>
                Z-UP Coordinate System<br>
                Solver: 100 iterations/frame
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Node {
            constructor(x, y, z, isFixed = false) {
                this.x = x; this.y = y; this.z = z;
                this.isFixed = isFixed;
                this.baseX = x; this.baseY = y; this.baseZ = z;
            }
        }

        class Link {
            constructor(n1, n2, isRigid = true, isInternal = false, name = "") {
                this.n1 = n1;
                this.n2 = n2;
                this.isRigid = isRigid;
                this.isInternal = isInternal;
                this.name = name;
                this.targetLength = this.distance();
            }
            distance() {
                const dx = this.n1.x - this.n2.x;
                const dy = this.n1.y - this.n2.y;
                const dz = this.n1.z - this.n2.z;
                return Math.sqrt(dx*dx + dy*dy + dz*dz);
            }
            solve() {
                const dx = this.n2.x - this.n1.x;
                const dy = this.n2.y - this.n1.y;
                const dz = this.n2.z - this.n1.z;
                const currentLen = Math.sqrt(dx*dx + dy*dy + dz*dz);
                if (currentLen === 0) return;
                const diff = (currentLen - this.targetLength) / currentLen;
                
                const w1 = this.n1.isFixed ? 0 : 1;
                const w2 = this.n2.isFixed ? 0 : 1;
                const w = w1 + w2;
                if (w === 0) return;
                
                const offsetX = dx * diff / w;
                const offsetY = dy * diff / w;
                const offsetZ = dz * diff / w;
                
                if (!this.n1.isFixed) {
                    this.n1.x += offsetX * w1;
                    this.n1.y += offsetY * w1;
                    this.n1.z += offsetZ * w1;
                }
                if (!this.n2.isFixed) {
                    this.n2.x -= offsetX * w2;
                    this.n2.y -= offsetY * w2;
                    this.n2.z -= offsetZ * w2;
                }
            }
        }

        const nodes = [];
        const links = [];

        // Chassis points (X: Forward, Y: Left/Outboard, Z: Up)
        const UCF = new Node( 150, 200, 500, true);
        const UCR = new Node(-150, 200, 480, true);
        const LCF = new Node( 200, 200, 200, true);
        const LCR = new Node(-200, 200, 200, true);
        const Rack = new Node( 120, 250, 300, true); 

        // Upright/Knuckle points
        const UUP = new Node( -10, 450, 520);
        const LUP = new Node(  10, 480, 180);
        const TIE = new Node( 120, 460, 300);
        const WHL = new Node(   0, 550, 350);
        const WAX = new Node(   0, 650, 350); // Axle outboard reference

        // Shock Absorber Mounts
        const ShockTop = new Node(0, 250, 650, true);
        const L_SHOCK = new Node(0, 340, 190); 

        nodes.push(UCF, UCR, LCF, LCR, Rack, UUP, LUP, TIE, WHL, WAX, ShockTop, L_SHOCK);

        // Rigidly connect the knuckle components
        const knuckleNodes = [UUP, LUP, TIE, WHL, WAX];
        for(let i = 0; i < knuckleNodes.length; i++) {
            for(let j = i + 1; j < knuckleNodes.length; j++) {
                links.push(new Link(knuckleNodes[i], knuckleNodes[j], true, true));
            }
        }

        // Rigidly attach shock mount to lower arm
        links.push(new Link(LCF, L_SHOCK, true, true));
        links.push(new Link(LCR, L_SHOCK, true, true));
        links.push(new Link(LUP, L_SHOCK, true, true));

        // Suspension Arms
        links.push(new Link(UCF, UUP, true, false, "Upper A-Arm Front"));
        links.push(new Link(UCR, UUP, true, false, "Upper A-Arm Rear"));
        links.push(new Link(LCF, LUP, true, false, "Lower A-Arm Front"));
        links.push(new Link(LCR, LUP, true, false, "Lower A-Arm Rear"));
        links.push(new Link(Rack, TIE, true, false, "Steering Tie Rod"));
        
        // Deformable Shock Absorber
        const shock = new Link(ShockTop, L_SHOCK, false, false, "Coilover Shock");
        links.push(shock);

        let initialShockLength = shock.targetLength;
        let initialRackY = Rack.baseY;

        // Warmup Solver
        for(let i=0; i<500; i++) {
            for(let link of links) link.solve();
        }

        let camera = {
            azimuth: Math.PI / 4,
            elevation: Math.PI / 8,
            distance: 1200,
            fov: 1500,
            lookAt: {x: 0, y: 350, z: 350}
        };

        function getProjection() {
            let azi = camera.azimuth;
            let ele = camera.elevation;
            let cx = camera.lookAt.x + camera.distance * Math.cos(ele) * Math.cos(azi);
            let cy = camera.lookAt.y + camera.distance * Math.cos(ele) * Math.sin(azi);
            let cz = camera.lookAt.z + camera.distance * Math.sin(ele);
            
            let fx = camera.lookAt.x - cx;
            let fy = camera.lookAt.y - cy;
            let fz = camera.lookAt.z - cz;
            let fLen = Math.sqrt(fx*fx + fy*fy + fz*fz);
            fx/=fLen; fy/=fLen; fz/=fLen;
            
            let ux = 0, uy = 0, uz = 1;
            let rx = fy*uz - fz*uy;
            let ry = fz*ux - fx*uz;
            let rz = fx*uy - fy*ux;
            let rLen = Math.sqrt(rx*rx + ry*ry + rz*rz);
            rx/=rLen; ry/=rLen; rz/=rLen;
            
            let ux_r = ry*fz - rz*fy;
            let uy_r = rz*fx - rx*fz;
            let uz_r = rx*fy - ry*fx;
            
            return {
                project: function(x, y, z) {
                    let dx = x - cx;
                    let dy = y - cy;
                    let dz = z - cz;
                    let px = dx*rx + dy*ry + dz*rz;
                    let py = dx*ux_r + dy*uy_r + dz*uz_r;
                    let pz = dx*fx + dy*fy + dz*fz;
                    let scale = camera.fov / Math.max(0.1, pz);
                    return {
                        x: canvas.width/2 + px * scale,
                        y: canvas.height/2 - py * scale,
                        z: pz
                    };
                }
            }
        }

        // Controls state
        let targetSteer = 0;
        let targetBump = 0;
        let isSweeping = false;
        let sweepAngle = 0;
        let showPath = true;
        let showNodes = true;
        let showInternal = false;
        let showGrid = true;
        let kingpinTrail = [];
        let lastTrailUUP = {x: 0, y: 0, z: 0};

        document.getElementById('steerSlider').addEventListener('input', e => {
            targetSteer = parseFloat(e.target.value);
            document.getElementById('valSteer').innerText = targetSteer.toFixed(1);
        });
        document.getElementById('bumpSlider').addEventListener('input', e => {
            if(!isSweeping) {
                targetBump = parseFloat(e.target.value);
                document.getElementById('valBump').innerText = targetBump.toFixed(1);
            }
        });
        document.getElementById('btnSweep').addEventListener('click', () => {
            isSweeping = !isSweeping;
            if(isSweeping) kingpinTrail = [];
        });
        document.getElementById('chkPath').addEventListener('change', e => showPath = e.target.checked);
        document.getElementById('chkNodes').addEventListener('change', e => showNodes = e.target.checked);
        document.getElementById('chkInternal').addEventListener('change', e => showInternal = e.target.checked);
        document.getElementById('chkGrid').addEventListener('change', e => showGrid = e.target.checked);

        // Mouse interaction
        let isDragging = false;
        let lastMouse = {x: 0, y: 0};
        canvas.addEventListener('mousedown', e => { isDragging = true; lastMouse = {x: e.clientX, y: e.clientY}; });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', e => {
            if(!isDragging) return;
            let dx = e.clientX - lastMouse.x;
            let dy = e.clientY - lastMouse.y;
            camera.azimuth -= dx * 0.005;
            camera.elevation -= dy * 0.005;
            camera.elevation = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, camera.elevation));
            lastMouse = {x: e.clientX, y: e.clientY};
        });
        canvas.addEventListener('wheel', e => {
            camera.distance += e.deltaY * 0.5;
            camera.distance = Math.max(400, Math.min(3000, camera.distance));
        });

        function updateTrail() {
            let dx = UUP.x - lastTrailUUP.x;
            let dy = UUP.y - lastTrailUUP.y;
            let dz = UUP.z - lastTrailUUP.z;
            if (Math.sqrt(dx*dx + dy*dy + dz*dz) > 0.5) {
                kingpinTrail.push({
                    u: {x: UUP.x, y: UUP.y, z: UUP.z},
                    l: {x: LUP.x, y: LUP.y, z: LUP.z}
                });
                if (kingpinTrail.length > 200) kingpinTrail.shift();
                lastTrailUUP = {x: UUP.x, y: UUP.y, z: UUP.z};
            }
        }

        function drawLine(proj, p1_3d, p2_3d, color, width, dash = []) {
            let p1 = proj.project(p1_3d.x, p1_3d.y, p1_3d.z);
            let p2 = proj.project(p2_3d.x, p2_3d.y, p2_3d.z);
            if(p1.z <= 0 || p2.z <= 0) return;
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            if(dash.length > 0) ctx.setLineDash(dash);
            else ctx.setLineDash([]);
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawCircle(proj, center, xDir, zDir, radius, color, width) {
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.beginPath();
            let first = true;
            for(let i=0; i<=36; i++) {
                let theta = (i / 36) * Math.PI * 2;
                let wx = center.x + xDir.x * Math.cos(theta) * radius + zDir.x * Math.sin(theta) * radius;
                let wy = center.y + xDir.y * Math.cos(theta) * radius + zDir.y * Math.sin(theta) * radius;
                let wz = center.z + xDir.z * Math.cos(theta) * radius + zDir.z * Math.sin(theta) * radius;
                let p = proj.project(wx, wy, wz);
                if(p.z <= 0) continue;
                if(first) { ctx.moveTo(p.x, p.y); first = false; }
                else ctx.lineTo(p.x, p.y);
            }
            ctx.stroke();
        }

        function step() {
            if (isSweeping) {
                sweepAngle += 0.03;
                targetBump = Math.sin(sweepAngle) * 80;
                document.getElementById('bumpSlider').value = targetBump;
                document.getElementById('valBump').innerText = targetBump.toFixed(1);
            }
            
            Rack.y = initialRackY + targetSteer;
            shock.targetLength = initialShockLength - targetBump;

            for (let i = 0; i < 100; i++) {
                for (let link of links) link.solve();
            }
            
            updateTrail();
        }

        function updateStats() {
            let yDir = {x: WAX.x - WHL.x, y: WAX.y - WHL.y, z: WAX.z - WHL.z};
            let yLen = Math.sqrt(yDir.x*yDir.x + yDir.y*yDir.y + yDir.z*yDir.z);
            yDir.x /= yLen; yDir.y /= yLen; yDir.z /= yLen;
            
            let camber = Math.asin(yDir.z) * 180 / Math.PI;
            let toe = Math.asin(yDir.x) * 180 / Math.PI; 
            
            let kp = {x: UUP.x - LUP.x, y: UUP.y - LUP.y, z: UUP.z - LUP.z};
            let kpLen = Math.sqrt(kp.x*kp.x + kp.y*kp.y + kp.z*kp.z);
            kp.x /= kpLen; kp.y /= kpLen; kp.z /= kpLen;
            let kpi = Math.atan2(-kp.y, kp.z) * 180 / Math.PI;

            document.getElementById('stats').innerHTML = `
                SIMULATION STATUS : RUNNING<br><br>
                BUMP/DROOP  : ${(targetBump).toFixed(2)} mm<br>
                STEER RACK  : ${(targetSteer).toFixed(2)} mm<br>
                <br>
                CAMBER ANGLE: ${(camber).toFixed(3)}°<br>
                TOE ANGLE   : ${(toe).toFixed(3)}°<br>
                KPI ANGLE   : ${(kpi).toFixed(3)}°
            `;
        }

        function render() {
            step();
            updateStats();
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let proj = getProjection();

            if (showGrid) {
                ctx.strokeStyle = '#222222';
                ctx.lineWidth = 1;
                ctx.beginPath();
                for(let x = -600; x <= 600; x+=100) {
                    let p1 = proj.project(x, -200, 0);
                    let p2 = proj.project(x, 1000, 0);
                    if(p1.z > 0 && p2.z > 0) { ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); }
                }
                for(let y = -200; y <= 1000; y+=100) {
                    let p1 = proj.project(-600, y, 0);
                    let p2 = proj.project(600, y, 0);
                    if(p1.z > 0 && p2.z > 0) { ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); }
                }
                ctx.stroke();
            }

            if (showPath && kingpinTrail.length > 1) {
                ctx.strokeStyle = 'rgba(255, 51, 102, 0.5)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = 0; i < kingpinTrail.length; i++) {
                    let p = proj.project(kingpinTrail[i].u.x, kingpinTrail[i].u.y, kingpinTrail[i].u.z);
                    if (p.z > 0) { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); }
                }
                ctx.stroke();

                ctx.strokeStyle = 'rgba(0, 255, 204, 0.5)';
                ctx.beginPath();
                for (let i = 0; i < kingpinTrail.length; i++) {
                    let p = proj.project(kingpinTrail[i].l.x, kingpinTrail[i].l.y, kingpinTrail[i].l.z);
                    if (p.z > 0) { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); }
                }
                ctx.stroke();
            }

            for (let link of links) {
                if (link.isInternal && !showInternal) continue;
                let color = '#00ffcc';
                let width = 2;
                let dash = [];
                if (link === shock) {
                    color = '#ffcc00'; width = 2; dash = [4, 4];
                } else if (link.isInternal) {
                    color = '#333333'; width = 1;
                } else if (link.name === "Steering Tie Rod") {
                    color = '#ff3366'; width = 2;
                }
                drawLine(proj, link.n1, link.n2, color, width, dash);
            }

            // Kingpin explicit line
            drawLine(proj, UUP, LUP, '#ff3366', 2);
            
            // Ground intersection (Scrub radius projection)
            let kpVec = {x: LUP.x - UUP.x, y: LUP.y - UUP.y, z: LUP.z - UUP.z};
            let t = -UUP.z / kpVec.z;
            let groundP = {x: UUP.x + t*kpVec.x, y: UUP.y + t*kpVec.y, z: 0};
            drawLine(proj, LUP, groundP, 'rgba(255, 51, 102, 0.4)', 1, [4, 4]);

            // Draw Wheel
            let yDir = {x: WAX.x - WHL.x, y: WAX.y - WHL.y, z: WAX.z - WHL.z};
            let yLen = Math.sqrt(yDir.x*yDir.x + yDir.y*yDir.y + yDir.z*yDir.z);
            yDir.x /= yLen; yDir.y /= yLen; yDir.z /= yLen;
            
            let zDir = {x: UUP.x - LUP.x, y: UUP.y - LUP.y, z: UUP.z - LUP.z};
            let xDir = { x: yDir.y*zDir.z - yDir.z*zDir.y, y: yDir.z*zDir.x - yDir.x*zDir.z, z: yDir.x*zDir.y - yDir.y*zDir.x };
            let xLen = Math.sqrt(xDir.x*xDir.x + xDir.y*xDir.y + xDir.z*xDir.z);
            xDir.x /= xLen; xDir.y /= xLen; xDir.z /= xLen;
            
            let zDirPerp = { x: xDir.y*yDir.z - xDir.z*yDir.y, y: xDir.z*yDir.x - xDir.x*yDir.z, z: xDir.x*yDir.y - xDir.y*yDir.x };
            
            let tireW = 200;
            let outerC = {x: WHL.x + yDir.x*tireW/2, y: WHL.y + yDir.y*tireW/2, z: WHL.z + yDir.z*tireW/2};
            let innerC = {x: WHL.x - yDir.x*tireW/2, y: WHL.y - yDir.y*tireW/2, z: WHL.z - yDir.z*tireW/2};
            
            drawCircle(proj, outerC, xDir, zDirPerp, 260, '#555555', 2);
            drawCircle(proj, innerC, xDir, zDirPerp, 260, '#555555', 2);
            drawCircle(proj, WHL, xDir, zDirPerp, 180, '#333333', 1);

            let cpOut = outerC;
            let topOut = {x: outerC.x + zDirPerp.x*260, y: outerC.y + zDirPerp.y*260, z: outerC.z + zDirPerp.z*260};
            let frontOut = {x: outerC.x + xDir.x*260, y: outerC.y + xDir.y*260, z: outerC.z + xDir.z*260};
            drawLine(proj, cpOut, topOut, '#555555', 1);
            drawLine(proj, cpOut, frontOut, '#555555', 1);
            drawLine(proj, outerC, innerC, '#444444', 1); // Tread width connection

            if (showNodes) {
                ctx.fillStyle = '#ffffff';
                for (let n of nodes) {
                    let p = proj.project(n.x, n.y, n.z);
                    if(p.z > 0) ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
                }
            }

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
