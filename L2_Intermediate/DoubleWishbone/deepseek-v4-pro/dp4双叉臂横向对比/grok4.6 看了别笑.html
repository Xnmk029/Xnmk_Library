<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Wishbone Suspension Simulator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            position: relative;
        }
        canvas {
            background: #111;
            border: 1px solid #333;
            box-shadow: 0 0 0 1px #222;
        }
        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 20, 0.95);
            padding: 15px 20px;
            border: 1px solid #444;
            border-radius: 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            min-width: 280px;
        }
        .controls h3 {
            margin: 0 0 15px 0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
        }
        .control {
            margin-bottom: 18px;
        }
        .control label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #888;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #00ccff;
        }
        .value {
            text-align: right;
            font-size: 13px;
            color: #00ccff;
        }
        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(20, 20, 20, 0.9);
            padding: 10px 15px;
            font-size: 11px;
            line-height: 1.4;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="canvas" width="800" height="600"></canvas>
        <div class="controls">
            <h3>Suspension Controls</h3>
            <div class="control">
                <label>Suspension Travel (<span id="travelVal">0</span> px)</label>
                <input type="range" id="travel" min="-100" max="100" value="0">
            </div>
            <div class="control">
                <label>Steering Angle (<span id="steerVal">0</span>°)</label>
                <input type="range" id="steer" min="-20" max="20" value="0">
            </div>
            <div class="control">
                <label>Body Bounce (<span id="bounceVal">0</span> px)</label>
                <input type="range" id="bounce" min="-50" max="50" value="0">
            </div>
        </div>
        <div class="info">
            Rigid arms • Deformable springs • Joint nodes
        </div>
    </div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const travelSlider = document.getElementById('travel');
        const steerSlider = document.getElementById('steer');
        const bounceSlider = document.getElementById('bounce');
        const travelVal = document.getElementById('travelVal');
        const steerVal = document.getElementById('steerVal');
        const bounceVal = document.getElementById('bounceVal');
        let suspensionTravel = 0;
        let steeringAngle = 0;
        let bodyBounce = 0;
        const WIDTH = 800;
        const HEIGHT = 600;
        const CHASSIS_Y = 80;
        const LOWER_PIVOT_X = 160;
        const UPPER_PIVOT_X = 380;
        const SPINDLE_BASE_X = 260;
        const SPINDLE_BASE_Y = 320;
        function draw() {
            ctx.clearRect(0, 0, WIDTH, HEIGHT);
            // Fixed chassis
            ctx.strokeStyle = '#4a4a4a';
            ctx.lineWidth = 25;
            ctx.beginPath();
            ctx.moveTo(40, CHASSIS_Y);
            ctx.lineTo(760, CHASSIS_Y);
            ctx.stroke();
            // Chassis supports
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(40, CHASSIS_Y - 5);
            ctx.lineTo(40, CHASSIS_Y + 5);
            ctx.moveTo(760, CHASSIS_Y - 5);
            ctx.lineTo(760, CHASSIS_Y + 5);
            ctx.stroke();
            // Calculate positions
            let lowerPivotY = CHASSIS_Y;
            let spindleX = SPINDLE_BASE_X + Math.sin(steeringAngle * Math.PI / 180) * 18;
            let spindleY = SPINDLE_BASE_Y + bodyBounce + suspensionTravel;
            // Lower control arm (rigid)
            ctx.strokeStyle = '#999';
            ctx.lineWidth = 9;
            ctx.beginPath();
            ctx.moveTo(LOWER_PIVOT_X, lowerPivotY);
            ctx.lineTo(spindleX, spindleY);
            ctx.stroke();
            // Upper control arm (rigid)
            ctx.strokeStyle = '#999';
            ctx.lineWidth = 9;
            ctx.beginPath();
            ctx.moveTo(UPPER_PIVOT_X, lowerPivotY);
            ctx.lineTo(spindleX, spindleY);
            ctx.stroke();
            // Spindle / kingpin assembly
            ctx.fillStyle = '#444';
            ctx.fillRect(spindleX - 18, spindleY - 12, 36, 24);
            // Wheel
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 28;
            ctx.beginPath();
            ctx.arc(spindleX, spindleY + 38, 26, 0, Math.PI * 2);
            ctx.stroke();
            // Inner tire
            ctx.strokeStyle = '#111';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.arc(spindleX, spindleY + 38, 18, 0, Math.PI * 2);
            ctx.stroke();
            // Steering tie rod
            ctx.strokeStyle = '#ffdd44';
            ctx.lineWidth = 7;
            let tieRodX = spindleX + 55;
            let tieRodY = spindleY + 15;
            ctx.beginPath();
            ctx.moveTo(520, 60);
            ctx.lineTo(tieRodX, tieRodY);
            ctx.stroke();
            ctx.fillStyle = '#ffdd44';
            ctx.beginPath();
            ctx.arc(tieRodX, tieRodY, 4, 0, Math.PI*2);
            ctx.fill();
            // Suspension spring (deformable - dashed)
            ctx.setLineDash([4, 6]);
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(spindleX - 15, spindleY - 20);
            ctx.lineTo(250, CHASSIS_Y - 90);
            ctx.stroke();
            ctx.setLineDash([]);
            // Joint nodes
            ctx.fillStyle = '#ffdd44';
            ctx.beginPath();
            ctx.arc(LOWER_PIVOT_X, lowerPivotY, 5, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(UPPER_PIVOT_X, lowerPivotY, 5, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(spindleX, spindleY, 5, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#ffaa00';
            ctx.beginPath();
            ctx.arc(spindleX, spindleY + 38, 6, 0, Math.PI*2);
            ctx.fill();
            // Title
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 22px system-ui';
            ctx.textAlign = 'left';
            ctx.fillText('Double Wishbone Suspension', 30, 45);
            ctx.font = '12px system-ui';
            ctx.fillStyle = '#666';
            ctx.fillText('Industrial Simulation', 30, 65);
        }
        function animate() {
            suspensionTravel = parseInt(travelSlider.value);
            steeringAngle = parseInt(steerSlider.value);
            bodyBounce = parseInt(bounceSlider.value);
            travelVal.textContent = suspensionTravel;
            steerVal.textContent = steeringAngle;
            bounceVal.textContent = bodyBounce;
            draw();
            requestAnimationFrame(animate);
        }
        travelSlider.addEventListener('input', () => {
            suspensionTravel = parseInt(travelSlider.value);
            travelVal.textContent = suspensionTravel;
            draw();
        });
        steerSlider.addEventListener('input', () => {
            steeringAngle = parseInt(steerSlider.value);
            steerVal.textContent = steeringAngle;
            draw();
        });
        bounceSlider.addEventListener('input', () => {
            bodyBounce = parseInt(bounceSlider.value);
            bounceVal.textContent = bodyBounce;
            draw();
        });
        draw();
        animate();
    </script>
</body>
</html>
