<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双叉臂悬挂运动学模拟系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            background: #1a1a1a;
            color: #e0e0e0;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            height: 100vh;
        }
        
        .main-view {
            flex: 1;
            position: relative;
            background: #2a2a2a;
            border-right: 1px solid #444;
        }
        
        .side-panel {
            width: 320px;
            background: #252525;
            padding: 15px;
            overflow-y: auto;
        }
        
        .panel-section {
            margin-bottom: 20px;
            border: 1px solid #444;
            padding: 10px;
        }
        
        .panel-title {
            font-size: 12px;
            font-weight: bold;
            color: #888;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-label {
            font-size: 11px;
            color: #aaa;
            margin-bottom: 5px;
            display: block;
        }
        
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        input[type="range"] {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            background: #444;
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #666;
            cursor: pointer;
        }
        
        .value-display {
            min-width: 50px;
            text-align: right;
            font-size: 11px;
            color: #fff;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        input[type="checkbox"] {
            width: 14px;
            height: 14px;
            background: #444;
            border: 1px solid #666;
        }
        
        .data-display {
            font-size: 11px;
            color: #ccc;
            line-height: 1.6;
        }
        
        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        
        .data-label {
            color: #888;
        }
        
        .data-value {
            color: #fff;
            font-weight: bold;
        }
        
        canvas {
            display: block;
        }
        
        .view-controls {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            gap: 5px;
        }
        
        .view-btn {
            padding: 5px 10px;
            background: #333;
            border: 1px solid #555;
            color: #ccc;
            font-size: 11px;
            cursor: pointer;
        }
        
        .view-btn.active {
            background: #444;
            color: #fff;
        }
        
        .legend {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 10px;
            color: #888;
            background: rgba(0,0,0,0.7);
            padding: 8px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 3px;
        }
        
        .legend-color {
            width: 12px;
            height: 2px;
        }
    </style>
</head>
<body>
    <!-- Model Name Watermark -->
<div style="position: fixed; top: 15px; left: 50%; transform: translateX(-50%); z-index: 9999999; pointer-events: none; opacity: 0.35; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 32px; font-weight: 700; color: #888; text-shadow: 1px 1px 0px rgba(255,255,255,0.8), -1px -1px 0px rgba(0,0,0,0.8); user-select: none; letter-spacing: 0.5px; white-space: nowrap;">Longcat2.0p</div>
<div class="container">
        <div class="main-view">
            <canvas id="suspensionCanvas"></canvas>
            <div class="view-controls">
                <button class="view-btn active" data-view="front">前视图</button>
                <button class="view-btn" data-view="side">侧视图</button>
                <button class="view-btn" data-view="top">俯视图</button>
            </div>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: #ff6b6b;"></div>
                    <span>上控制臂</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #4ecdc4;"></div>
                    <span>下控制臂</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #ffe66d;"></div>
                    <span>转向拉杆</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #95e1d3;"></div>
                    <span>主销轴线</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #f38181;"></div>
                    <span>减震器</span>
                </div>
            </div>
        </div>
        
        <div class="side-panel">
            <div class="panel-section">
                <div class="panel-title">悬挂控制</div>
                
                <div class="control-group">
                    <label class="control-label">车轮跳动行程 (mm)</label>
                    <div class="slider-container">
                        <input type="range" id="wheelTravel" min="-50" max="50" value="0">
                        <span class="value-display" id="wheelTravelValue">0</span>
                    </div>
                </div>
                
                <div class="control-group">
                    <label class="control-label">转向角度 (°)</label>
                    <div class="slider-container">
                        <input type="range" id="steeringAngle" min="-30" max="30" value="0">
                        <span class="value-display" id="steeringAngleValue">0</span>
                    </div>
                </div>
                
                <div class="control-group">
                    <label class="control-label">减震器压缩 (mm)</label>
                    <div class="slider-container">
                        <input type="range" id="damperTravel" min="0" max="100" value="0">
                        <span class="value-display" id="damperTravelValue">0</span>
                    </div>
                </div>
            </div>
            
            <div class="panel-section">
                <div class="panel-title">显示选项</div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="showKingpin" checked>
                    <label for="showKingpin">显示主销轴线</label>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="showTrail" checked>
                    <label for="showTrail">显示运动轨迹</label>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="showForces">
                    <label for="showForces">显示受力方向</label>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="showDimensions">
                    <label for="showDimensions">显示尺寸标注</label>
                </div>
            </div>
            
            <div class="panel-section">
                <div class="panel-title">运动参数</div>
                
                <div class="data-display">
                    <div class="data-row">
                        <span class="data-label">车轮外倾角:</span>
                        <span class="data-value" id="camberAngle">0.0°</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">主销内倾角:</span>
                        <span class="data-value" id="kingpinAngle">12.5°</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">主销后倾角:</span>
                        <span class="data-value" id="casterAngle">3.2°</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">前束角:</span>
                        <span class="data-value" id="toeAngle">0.0°</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">轮距变化:</span>
                        <span class="data-value" id="trackChange">0 mm</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">悬架刚度:</span>
                        <span class="data-value" id="suspensionStiffness">25.6 N/mm</span>
                    </div>
                </div>
            </div>
            
            <div class="panel-section">
                <div class="panel-title">系统信息</div>
                
                <div class="data-display">
                    <div class="data-row">
                        <span class="data-label">上控制臂长度:</span>
                        <span class="data-value">280 mm</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">下控制臂长度:</span>
                        <span class="data-value">320 mm</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">转向拉杆长度:</span>
                        <span class="data-value">350 mm</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">减震器行程:</span>
                        <span class="data-value">120 mm</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">弹簧刚度:</span>
                        <span class="data-value">45 N/mm</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class DoubleWishboneSimulation {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                
                // 悬挂几何参数 (单位: mm)
                this.geometry = {
                    upperArmLength: 280,
                    lowerArmLength: 320,
                    tieRodLength: 350,
                    wheelRadius: 330,
                    trackWidth: 1600,
                    kingpinLength: 180,
                    damperLength: 400,
                    springFreeLength: 300
                };
                
                // 硬点坐标 (相对于车身坐标系)
                this.hardPoints = {
                    // 上控制臂
                    upperArmFront: { x: -140, y: 200, z: 0 },
                    upperArmRear: { x: 140, y: 200, z: 0 },
                    upperArmOuter: { x: 0, y: 480, z: 0 },
                    
                    // 下控制臂
                    lowerArmFront: { x: -160, y: -50, z: 0 },
                    lowerArmRear: { x: 160, y: -50, z: 0 },
                    lowerArmOuter: { x: 0, y: 520, z: 0 },
                    
                    // 转向拉杆
                    tieRodInner: { x: -180, y: 100, z: 0 },
                    tieRodOuter: { x: 0, y: 450, z: 0 },
                    
                    // 减震器
                    damperTop: { x: -50, y: 300, z: 0 },
                    damperBottom: { x: -30, y: 0, z: 0 },
                    
                    // 车轮中心
                    wheelCenter: { x: 0, y: 660, z: 0 }
                };
                
                // 运动状态
                this.state = {
                    wheelTravel: 0,
                    steeringAngle: 0,
                    damperCompression: 0
                };
                
                // 显示选项
                this.displayOptions = {
                    showKingpin: true,
                    showTrail: true,
                    showForces: false,
                    showDimensions: false
                };
                
                // 视图模式
                this.viewMode = 'front';
                
                // 轨迹历史
                this.trailHistory = [];
                this.maxTrailLength = 50;
                
                this.init();
            }
            
            init() {
                this.setupEventListeners();
                this.animate();
            }
            
            resize() {
                const dpr = window.devicePixelRatio || 1;
                this.canvas.width = this.canvas.parentElement.clientWidth * dpr;
                this.canvas.height = this.canvas.parentElement.clientHeight * dpr;
                this.canvas.style.width = this.canvas.parentElement.clientWidth + 'px';
                this.canvas.style.height = this.canvas.parentElement.clientHeight + 'px';
                this.ctx.scale(dpr, dpr);
            }
            
            setupEventListeners() {
                // 滑块控制
                document.getElementById('wheelTravel').addEventListener('input', (e) => {
                    this.state.wheelTravel = parseFloat(e.target.value);
                    document.getElementById('wheelTravelValue').textContent = e.target.value;
                    this.updateKinematics();
                });
                
                document.getElementById('steeringAngle').addEventListener('input', (e) => {
                    this.state.steeringAngle = parseFloat(e.target.value);
                    document.getElementById('steeringAngleValue').textContent = e.target.value;
                    this.updateKinematics();
                });
                
                document.getElementById('damperTravel').addEventListener('input', (e) => {
                    this.state.damperCompression = parseFloat(e.target.value);
                    document.getElementById('damperTravelValue').textContent = e.target.value;
                    this.updateKinematics();
                });
                
                // 复选框
                document.getElementById('showKingpin').addEventListener('change', (e) => {
                    this.displayOptions.showKingpin = e.target.checked;
                });
                
                document.getElementById('showTrail').addEventListener('change', (e) => {
                    this.displayOptions.showTrail = e.target.checked;
                });
                
                document.getElementById('showForces').addEventListener('change', (e) => {
                    this.displayOptions.showForces = e.target.checked;
                });
                
                document.getElementById('showDimensions').addEventListener('change', (e) => {
                    this.displayOptions.showDimensions = e.target.checked;
                });
                
                // 视图切换
                document.querySelectorAll('.view-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.viewMode = e.target.dataset.view;
                    });
                });
                
                // 窗口大小调整
                window.addEventListener('resize', () => {
                    this.resize();
                });
            }
            
            updateKinematics() {
                // 计算悬挂运动学
                const wheelTravel = this.state.wheelTravel;
                const steerAngle = this.state.steeringAngle * Math.PI / 180;
                
                // 更新硬点位置
                this.calculateHardPoints(wheelTravel, steerAngle);
                
                // 计算运动参数
                this.calculateSuspensionParameters();
                
                // 更新轨迹
                if (this.displayOptions.showTrail) {
                    this.updateTrail();
                }
            }
            
            calculateHardPoints(travel, steerAngle) {
                // 基于车轮跳动和转向角度计算各硬点位置
                const baseY = this.hardPoints.wheelCenter.y;
                const newY = baseY + travel;
                
                // 更新车轮中心位置
                this.hardPoints.wheelCenter.y = newY;
                
                // 计算转向节位置 (考虑转向)
                const kingpinLength = this.geometry.kingpinLength;
                const steerRad = steerAngle;
                
                // 主销上点 (上控制臂外端)
                const upperBallJoint = {
                    x: this.hardPoints.upperArmOuter.x,
                    y: this.hardPoints.upperArmOuter.y + travel * 0.7,
                    z: this.hardPoints.upperArmOuter.z
                };
                
                // 主销下点 (下控制臂外端)
                const lowerBallJoint = {
                    x: this.hardPoints.lowerArmOuter.x,
                    y: this.hardPoints.lowerArmOuter.y + travel * 0.8,
                    z: this.hardPoints.lowerArmOuter.z
                };
                
                // 更新转向拉杆外端位置 (随转向节运动)
                const tieRodOuter = {
                    x: lowerBallJoint.x + Math.sin(steerRad) * 50,
                    y: lowerBallJoint.y - 70,
                    z: lowerBallJoint.z
                };
                
                this.hardPoints.tieRodOuter = tieRodOuter;
                
                // 计算减震器位置
                const damperCompression = this.state.damperCompression;
                const damperBottom = {
                    x: this.hardPoints.damperBottom.x,
                    y: this.hardPoints.damperBottom.y + travel * 0.6 - damperCompression * 0.3,
                    z: this.hardPoints.damperBottom.z
                };
                
                this.hardPoints.damperBottom = damperBottom;
            }
            
            calculateSuspensionParameters() {
                // 计算车轮外倾角
                const upperPoint = this.hardPoints.upperArmOuter;
                const lowerPoint = this.hardPoints.lowerArmOuter;
                const camberAngle = Math.atan2(upperPoint.x - lowerPoint.x, lowerPoint.y - upperPoint.y) * 180 / Math.PI;
                
                // 计算主销内倾角
                const kingpinAngle = 12.5 - this.state.wheelTravel * 0.02;
                
                // 计算主销后倾角
                const casterAngle = 3.2 + this.state.wheelTravel * 0.01;
                
                // 计算前束角
                const toeAngle = this.state.steeringAngle * 0.15;
                
                // 计算轮距变化
                const trackChange = this.state.wheelTravel * 0.1;
                
                // 计算悬架刚度 (非线性)
                const baseStiffness = 25.6;
                const stiffnessVariation = Math.abs(this.state.wheelTravel) * 0.05;
                const suspensionStiffness = baseStiffness + stiffnessVariation;
                
                // 更新显示
                document.getElementById('camberAngle').textContent = camberAngle.toFixed(1) + '°';
                document.getElementById('kingpinAngle').textContent = kingpinAngle.toFixed(1) + '°';
                document.getElementById('casterAngle').textContent = casterAngle.toFixed(1) + '°';
                document.getElementById('toeAngle').textContent = toeAngle.toFixed(1) + '°';
                document.getElementById('trackChange').textContent = trackChange.toFixed(1) + ' mm';
                document.getElementById('suspensionStiffness').textContent = suspensionStiffness.toFixed(1) + ' N/mm';
            }
            
            updateTrail() {
                const wheelCenter = this.hardPoints.wheelCenter;
                this.trailHistory.push({ x: wheelCenter.x, y: wheelCenter.y });
                
                if (this.trailHistory.length > this.maxTrailLength) {
                    this.trailHistory.shift();
                }
            }
            
            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                // 绘制网格
                this.drawGrid();
                
                // 根据视图模式绘制
                switch (this.viewMode) {
                    case 'front':
                        this.drawFrontView();
                        break;
                    case 'side':
                        this.drawSideView();
                        break;
                    case 'top':
                        this.drawTopView();
                        break;
                }
                
                // 绘制轨迹
                if (this.displayOptions.showTrail) {
                    this.drawTrail();
                }
                
                // 绘制尺寸标注
                if (this.displayOptions.showDimensions) {
                    this.drawDimensions();
                }
            }
            
            drawGrid() {
                const ctx = this.ctx;
                const width = this.canvas.width / (window.devicePixelRatio || 1);
                const height = this.canvas.height / (window.devicePixelRatio || 1);
                
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 1;
                
                // 绘制网格线
                const gridSize = 50;
                for (let x = 0; x < width; x += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, height);
                    ctx.stroke();
                }
                
                for (let y = 0; y < height; y += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(width, y);
                    ctx.stroke();
                }
                
                // 绘制坐标轴
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(width / 2, 0);
                ctx.lineTo(width / 2, height);
                ctx.moveTo(0, height / 2);
                ctx.lineTo(width, height / 2);
                ctx.stroke();
            }
            
            drawFrontView() {
                const ctx = this.ctx;
                const centerX = this.canvas.width / (window.devicePixelRatio || 1) / 2;
                const centerY = this.canvas.height / (window.devicePixelRatio || 1) / 2;
                
                // 绘制车身参考线
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(centerX - 200, centerY - 100);
                ctx.lineTo(centerX + 200, centerY - 100);
                ctx.stroke();
                
                // 绘制上控制臂
                this.drawControlArm(
                    this.hardPoints.upperArmFront,
                    this.hardPoints.upperArmRear,
                    this.hardPoints.upperArmOuter,
                    '#ff6b6b',
                    centerX,
                    centerY
                );
                
                // 绘制下控制臂
                this.drawControlArm(
                    this.hardPoints.lowerArmFront,
                    this.hardPoints.lowerArmRear,
                    this.hardPoints.lowerArmOuter,
                    '#4ecdc4',
                    centerX,
                    centerY
                );
                
                // 绘制转向拉杆
                this.drawLine(
                    this.hardPoints.tieRodInner,
                    this.hardPoints.tieRodOuter,
                    '#ffe66d',
                    3,
                    centerX,
                    centerY
                );
                
                // 绘制减震器
                this.drawDamper(centerX, centerY);
                
                // 绘制主销轴线
                if (this.displayOptions.showKingpin) {
                    this.drawKingpinAxis(centerX, centerY);
                }
                
                // 绘制车轮
                this.drawWheel(centerX, centerY);
                
                // 绘制节点
                this.drawNodes(centerX, centerY);
            }
            
            drawSideView() {
                const ctx = this.ctx;
                const centerX = this.canvas.width / (window.devicePixelRatio || 1) / 2;
                const centerY = this.canvas.height / (window.devicePixelRatio || 1) / 2;
                
                // 绘制车身参考线
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(centerX - 200, centerY + 100);
                ctx.lineTo(centerX + 200, centerY + 100);
                ctx.stroke();
                
                // 绘制控制臂侧视图
                this.drawControlArmSide(
                    { x: -140, y: 200, z: 0 },
                    { x: 0, y: 480, z: 0 },
                    '#ff6b6b',
                    centerX,
                    centerY
                );
                
                this.drawControlArmSide(
                    { x: -160, y: -50, z: 0 },
                    { x: 0, y: 520, z: 0 },
                    '#4ecdc4',
                    centerX,
                    centerY
                );
                
                // 绘制减震器侧视图
                this.drawDamperSide(centerX, centerY);
                
                // 绘制主销后倾角
                if (this.displayOptions.showKingpin) {
                    this.drawCasterAngle(centerX, centerY);
                }
                
                // 绘制车轮侧视图
                this.drawWheelSide(centerX, centerY);
            }
            
            drawTopView() {
                const ctx = this.ctx;
                const centerX = this.canvas.width / (window.devicePixelRatio || 1) / 2;
                const centerY = this.canvas.height / (window.devicePixelRatio || 1) / 2;
                
                // 绘制车身参考线
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(centerX - 200, centerY);
                ctx.lineTo(centerX + 200, centerY);
                ctx.stroke();
                
                // 绘制控制臂俯视图
                this.drawControlArmTop(
                    { x: -140, y: 200, z: 0 },
                    { x: 140, y: 200, z: 0 },
                    { x: 0, y: 480, z: 0 },
                    '#ff6b6b',
                    centerX,
                    centerY
                );
                
                this.drawControlArmTop(
                    { x: -160, y: -50, z: 0 },
                    { x: 160, y: -50, z: 0 },
                    { x: 0, y: 520, z: 0 },
                    '#4ecdc4',
                    centerX,
                    centerY
                );
                
                // 绘制转向拉杆俯视图
                this.drawTieRodTop(centerX, centerY);
                
                // 绘制车轮俯视图
                this.drawWheelTop(centerX, centerY);
            }
            
            drawControlArm(frontPoint, rearPoint, outerPoint, color, offsetX, offsetY) {
                const ctx = this.ctx;
                ctx.strokeStyle = color;
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                
                // 绘制A字形控制臂
                ctx.beginPath();
                ctx.moveTo(offsetX + frontPoint.x, offsetY - frontPoint.y);
                ctx.lineTo(offsetX + outerPoint.x, offsetY - outerPoint.y);
                ctx.lineTo(offsetX + rearPoint.x, offsetY - rearPoint.y);
                ctx.stroke();
                
                // 绘制内外连接点
                this.drawCircle(offsetX + frontPoint.x, offsetY - frontPoint.y, 6, color);
                this.drawCircle(offsetX + rearPoint.x, offsetY - rearPoint.y, 6, color);
                this.drawCircle(offsetX + outerPoint.x, offsetY - outerPoint.y, 8, color);
            }
            
            drawControlArmSide(innerPoint, outerPoint, color, offsetX, offsetY) {
                const ctx = this.ctx;
                ctx.strokeStyle = color;
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                
                ctx.beginPath();
                ctx.moveTo(offsetX + innerPoint.x, offsetY - innerPoint.y);
                ctx.lineTo(offsetX + outerPoint.x, offsetY - outerPoint.y);
                ctx.stroke();
                
                this.drawCircle(offsetX + innerPoint.x, offsetY - innerPoint.y, 6, color);
                this.drawCircle(offsetX + outerPoint.x, offsetY - outerPoint.y, 8, color);
            }
            
            drawControlArmTop(frontPoint, rearPoint, outerPoint, color, offsetX, offsetY) {
                const ctx = this.ctx;
                ctx.strokeStyle = color;
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                
                ctx.beginPath();
                ctx.moveTo(offsetX + frontPoint.x, offsetY - frontPoint.z);
                ctx.lineTo(offsetX + outerPoint.x, offsetY - outerPoint.z);
                ctx.lineTo(offsetX + rearPoint.x, offsetY - rearPoint.z);
                ctx.stroke();
                
                this.drawCircle(offsetX + frontPoint.x, offsetY - frontPoint.z, 6, color);
                this.drawCircle(offsetX + rearPoint.x, offsetY - rearPoint.z, 6, color);
                this.drawCircle(offsetX + outerPoint.x, offsetY - outerPoint.z, 8, color);
            }
            
            drawLine(start, end, color, width, offsetX, offsetY) {
                const ctx = this.ctx;
                ctx.strokeStyle = color;
                ctx.lineWidth = width;
                ctx.lineCap = 'round';
                
                ctx.beginPath();
                ctx.moveTo(offsetX + start.x, offsetY - start.y);
                ctx.lineTo(offsetX + end.x, offsetY - end.y);
                ctx.stroke();
            }
            
            drawDamper(offsetX, offsetY) {
                const ctx = this.ctx;
                const top = this.hardPoints.damperTop;
                const bottom = this.hardPoints.damperBottom;
                
                // 绘制减震器筒
                ctx.strokeStyle = '#f38181';
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';
                
                ctx.beginPath();
                ctx.moveTo(offsetX + top.x, offsetY - top.y);
                ctx.lineTo(offsetX + bottom.x, offsetY - bottom.y);
                ctx.stroke();
                
                // 绘制弹簧
                this.drawSpring(offsetX + top.x, offsetY - top.y, offsetX + bottom.x, offsetY - bottom.y, 15, 8, '#f38181');
                
                // 绘制连接点
                this.drawCircle(offsetX + top.x, offsetY - top.y, 6, '#f38181');
                this.drawCircle(offsetX + bottom.x, offsetY - bottom.y, 6, '#f38181');
            }
            
            drawDamperSide(offsetX, offsetY) {
                const ctx = this.ctx;
                const top = { x: -50, y: 300, z: 0 };
                const bottom = { x: -30, y: 0, z: 0 };
                
                ctx.strokeStyle = '#f38181';
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';
                
                ctx.beginPath();
                ctx.moveTo(offsetX + top.x, offsetY - top.y);
                ctx.lineTo(offsetX + bottom.x, offsetY - bottom.y);
                ctx.stroke();
                
                this.drawSpring(offsetX + top.x, offsetY - top.y, offsetX + bottom.x, offsetY - bottom.y, 15, 8, '#f38181');
            }
            
            drawSpring(x1, y1, x2, y2, coils, amplitude, color) {
                const ctx = this.ctx;
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                
                const dx = x2 - x1;
                const dy = y2 - y1;
                const length = Math.sqrt(dx * dx + dy * dy);
                const angle = Math.atan2(dy, dx);
                
                ctx.beginPath();
                for (let i = 0; i <= coils * 2; i++) {
                    const t = i / (coils * 2);
                    const x = x1 + dx * t;
                    const y = y1 + dy * t;
                    const offset = Math.sin(t * Math.PI * coils) * amplitude;
                    
                    const rotX = x - Math.sin(angle) * offset;
                    const rotY = y + Math.cos(angle) * offset;
                    
                    if (i === 0) {
                        ctx.moveTo(rotX, rotY);
                    } else {
                        ctx.lineTo(rotX, rotY);
                    }
                }
                ctx.stroke();
            }
            
            drawKingpinAxis(offsetX, offsetY) {
                const ctx = this.ctx;
                const upper = this.hardPoints.upperArmOuter;
                const lower = this.hardPoints.lowerArmOuter;
                
                // 绘制主销轴线
                ctx.strokeStyle = '#95e1d3';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                
                ctx.beginPath();
                ctx.moveTo(offsetX + upper.x, offsetY - upper.y);
                ctx.lineTo(offsetX + lower.x, offsetY - lower.y);
                ctx.stroke();
                
                ctx.setLineDash([]);
                
                // 绘制主销上下点
                this.drawCircle(offsetX + upper.x, offsetY - upper.y, 6, '#95e1d3');
                this.drawCircle(offsetX + lower.x, offsetY - lower.y, 6, '#95e1d3');
            }
            
            drawCasterAngle(offsetX, offsetY) {
                const ctx = this.ctx;
                const upper = { x: 0, y: 480, z: 0 };
                const lower = { x: 0, y: 520, z: 0 };
                
                // 绘制主销后倾角指示
                ctx.strokeStyle = '#95e1d3';
                ctx.lineWidth = 2;
                ctx.setLineDash([3, 3]);
                
                ctx.beginPath();
                ctx.moveTo(offsetX + upper.x, offsetY - upper.y);
                ctx.lineTo(offsetX + lower.x, offsetY - lower.y);
                ctx.stroke();
                
                ctx.setLineDash([]);
                
                // 绘制角度标注
                ctx.fillStyle = '#95e1d3';
                ctx.font = '10px monospace';
                ctx.fillText('3.2°', offsetX + 10, offsetY - 500);
            }
            
            drawWheel(offsetX, offsetY) {
                const ctx = this.ctx;
                const center = this.hardPoints.wheelCenter;
                const radius = this.geometry.wheelRadius;
                
                // 绘制轮胎
                ctx.strokeStyle = '#888';
                ctx.lineWidth = 20;
                ctx.beginPath();
                ctx.arc(offsetX + center.x, offsetY - center.y, radius, 0, Math.PI * 2);
                ctx.stroke();
                
                // 绘制轮毂
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 10;
                ctx.beginPath();
                ctx.arc(offsetX + center.x, offsetY - center.y, radius * 0.7, 0, Math.PI * 2);
                ctx.stroke();
                
                // 绘制轮辐
                ctx.strokeStyle = '#777';
                ctx.lineWidth = 3;
                for (let i = 0; i < 5; i++) {
                    const angle = (i * Math.PI * 2) / 5;
                    ctx.beginPath();
                    ctx.moveTo(offsetX + center.x, offsetY - center.y);
                    ctx.lineTo(
                        offsetX + center.x + Math.cos(angle) * radius * 0.6,
                        offsetY - center.y + Math.sin(angle) * radius * 0.6
                    );
                    ctx.stroke();
                }
                
                // 绘制车轮中心点
                this.drawCircle(offsetX + center.x, offsetY - center.y, 4, '#fff');
            }
            
            drawWheelSide(offsetX, offsetY) {
                const ctx = this.ctx;
                const center = { x: 0, y: 660, z: 0 };
                const radius = this.geometry.wheelRadius;
                
                // 绘制轮胎侧视图
                ctx.strokeStyle = '#888';
                ctx.lineWidth = 20;
                ctx.beginPath();
                ctx.arc(offsetX + center.x, offsetY - center.y, radius, 0, Math.PI * 2);
                ctx.stroke();
                
                // 绘制轮毂侧视图
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 10;
                ctx.beginPath();
                ctx.arc(offsetX + center.x, offsetY - center.y, radius * 0.7, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            drawWheelTop(offsetX, offsetY) {
                const ctx = this.ctx;
                const center = { x: 0, y: 660, z: 0 };
                const width = 200;
                const height = this.geometry.wheelRadius * 2;
                
                // 绘制轮胎俯视图
                ctx.strokeStyle = '#888';
                ctx.lineWidth = 20;
                ctx.strokeRect(offsetX + center.x - width / 2, offsetY - center.z - height / 2, width, height);
                
                // 绘制轮毂俯视图
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 10;
                ctx.strokeRect(offsetX + center.x - width / 2 * 0.7, offsetY - center.z - height / 2 * 0.7, width * 0.7, height * 0.7);
            }
            
            drawTieRodTop(offsetX, offsetY) {
                const ctx = this.ctx;
                const inner = { x: -180, y: 100, z: 0 };
                const outer = { x: 0, y: 450, z: 0 };
                
                ctx.strokeStyle = '#ffe66d';
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                
                ctx.beginPath();
                ctx.moveTo(offsetX + inner.x, offsetY - inner.z);
                ctx.lineTo(offsetX + outer.x, offsetY - outer.z);
                ctx.stroke();
                
                this.drawCircle(offsetX + inner.x, offsetY - inner.z, 5, '#ffe66d');
                this.drawCircle(offsetX + outer.x, offsetY - outer.z, 5, '#ffe66d');
            }
            
            drawNodes(offsetX, offsetY) {
                const ctx = this.ctx;
                const nodes = [
                    this.hardPoints.upperArmFront,
                    this.hardPoints.upperArmRear,
                    this.hardPoints.upperArmOuter,
                    this.hardPoints.lowerArmFront,
                    this.hardPoints.lowerArmRear,
                    this.hardPoints.lowerArmOuter,
                    this.hardPoints.tieRodInner,
                    this.hardPoints.tieRodOuter,
                    this.hardPoints.damperTop,
                    this.hardPoints.damperBottom
                ];
                
                nodes.forEach(node => {
                    this.drawCircle(offsetX + node.x, offsetY - node.y, 3, '#fff');
                });
            }
            
            drawTrail() {
                const ctx = this.ctx;
                const centerX = this.canvas.width / (window.devicePixelRatio || 1) / 2;
                const centerY = this.canvas.height / (window.devicePixelRatio || 1) / 2;
                
                if (this.trailHistory.length < 2) return;
                
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                
                this.trailHistory.forEach((point, index) => {
                    const x = centerX + point.x;
                    const y = centerY - point.y;
                    
                    if (index === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                });
                
                ctx.stroke();
            }
            
            drawDimensions() {
                const ctx = this.ctx;
                const centerX = this.canvas.width / (window.devicePixelRatio || 1) / 2;
                const centerY = this.canvas.height / (window.devicePixelRatio || 1) / 2;
                
                ctx.fillStyle = '#aaa';
                ctx.font = '10px monospace';
                
                // 标注控制臂长度
                ctx.fillText('280mm', centerX + 150, centerY - 350);
                ctx.fillText('320mm', centerX + 170, centerY - 250);
                
                // 标注轮距
                ctx.fillText('1600mm', centerX - 100, centerY - 600);
            }
            
            drawCircle(x, y, radius, color) {
                const ctx = this.ctx;
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }
            
            animate() {
                this.draw();
                requestAnimationFrame(() => this.animate());
            }
        }
        
        // 初始化模拟
        const simulation = new DoubleWishboneSimulation('suspensionCanvas');
    </script>
</body>
