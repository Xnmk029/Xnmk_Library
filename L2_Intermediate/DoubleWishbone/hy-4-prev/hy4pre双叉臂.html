<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>SLA-KIN · 双叉臂悬架运动学仿真平台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;border-radius:0!important;box-shadow:none!important;text-shadow:none!important;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  font-size:12px;color:#16202a;background:#d3d8dd;
  -webkit-font-smoothing:antialiased;user-select:none;
}
.mono{font-family:"Consolas","Cascadia Mono","Courier New",monospace;}

/* ---------- layout ---------- */
#app{display:flex;flex-direction:column;height:100vh;}
#hdr{
  height:36px;flex:0 0 36px;background:#e9edf0;border-bottom:1px solid #b3bbc2;
  display:flex;align-items:center;padding:0 10px;gap:16px;
}
#hdr .logo{font-weight:700;letter-spacing:1px;font-size:13px;color:#0b3f6e;}
#hdr .sub{font-size:11px;color:#5a6672;letter-spacing:.3px;}
#hdr .spacer{flex:1;}
#hdr .badge{

}
#hdr .badge.on{background:#0b5fa5;border-color:#0b5fa5;color:#fff;}

#main{flex:1;display:flex;min-height:0;}
aside{
  background:#f2f5f7;border-right:1px solid #c3c9ce;overflow-y:auto;overflow-x:hidden;
  flex:0 0 auto;
}
aside#left{width:246px;}
aside#right{width:306px;border-right:none;border-left:1px solid #c3c9ce;}
#view{flex:1;position:relative;background:#fbfcfd;min-width:0;}

/* ---------- panel blocks ---------- */

/* ---------- controls ---------- */

input[type=range]::-moz-range-thumb{width:10px;height:14px;background:#0b5fa5;border:1px solid #08406f;border-radius:0;}

.chk input{width:12px;height:12px;accent-color:#0b5fa5;cursor:pointer;}

/* ---------- metric table ---------- */

table.met td{padding:2.5px 4px;border-bottom:1px solid #e4e9ed;vertical-align:middle;}

table.met td.v{text-align:right;font-family:"Consolas",monospace;color:#12222f;white-space:nowrap;}

  font-size:10px;letter-spacing:1px;color:#6b7885;padding:5px 4px 2px;border-bottom:1px solid #e4e9ed;
  background:#f7f9fa;
}

/* ---------- charts ---------- */
.chart{display:block;width:100%;height:96px;background:#fff;border:1px solid #d2d9df;margin-bottom:6px;}
.chart:last-child{margin-bottom:0;}
.ctitle{font-size:10px;color:#5a6672;margin:0 0 3px 1px;letter-spacing:.3px;}

/* ---------- hardpoint table ---------- */

}

/* ---------- status bar ---------- */

  height:24px;flex:0 0 24px;background:#e9edf0;border-top:1px solid #b3bbc2;
  display:flex;align-items:center;padding:0 10px;gap:16px;font-size:10.5px;color:#43505d;

/* ---------- view hud ---------- */

}

::-webkit-scrollbar-track{background:#e6eaed;}

<body>
<div id="app">

  <div id="hdr">
    <span class="logo">SLA&nbsp;KINEMATICS</span>
    <span class="sub">双叉臂独立悬架 · 刚体/可形变单元运动学仿真平台</span>
    <span class="spacer"></span>
    <span class="badge" id="bgMode">静止</span>
    <span class="badge" id="bgCoord">X 前 / Y 左 / Z 上 (mm)</span>
    <span class="badge" id="bgFps">-- FPS</span>
  </div>

  <div id="main">
    <!-- ================= LEFT ================= -->
    <aside id="left">

      <div class="blk">
        <h3><span class="t">视图 VIEW</span><span class="c" id="viewName">等轴测</span></h3>
        <div class="bd">
          <div class="btns grid3" style="margin-bottom:5px">
            <button class="btn" data-view="iso">等轴测</button>
            <button class="btn" data-view="front">前视</button>
            <button class="btn" data-view="side">侧视</button>
          </div>
          <div class="btns grid3">
            <button class="btn" data-view="top">俯视</button>
            <button class="btn" id="btnFit">适配</button>
            <button class="btn" id="btnResetAll">复位</button>
          </div>
        </div>

      <div class="blk">
        <h3><span class="t">仿真模式 MODE</span></h3>
        <div class="bd">
          <div class="btns grid3">
            <button class="btn on" data-mode="idle">静止</button>
            <button class="btn" data-mode="bounce">轮跳</button>

          </div>
          <div class="btns grid3" style="margin-top:4px">
            <button class="btn" data-mode="roll">侧倾</button>
            <button class="btn" data-mode="drive">路面行驶</button>

      <div class="blk">

          <div class="row"><label>转向角</label><input type="range" id="sSteer" min="-35" max="35" step="0.2" value="0"><span class="val mono" id="vSteer">0.0</span></div>
          <div class="row"><label>车身侧倾</label><input type="range" id="sRoll" min="-6" max="6" step="0.05" value="0"><span class="val mono" id="vRoll">0.0</span></div>

            <button class="btn" data-preset="comfort">舒适</button>

          </div>
          <div class="btns" style="margin-top:4px">
            <button class="btn sm" id="btnOptTie">优化转向拉杆内点（抑制跳动转向）</button>
          </div>

    </aside>

    <!-- ================= VIEW ================= -->
    <section id="view">
      <canvas id="cv"></canvas>
      <div id="hud">
        <div class="axis" id="hudAxis"></div>
      </div>
      <div id="legend"></div>
      <div id="tip">左键拖动=旋转 · 右键拖动=平移 · 滚轮=缩放 · 双击=等轴测</div>
    </section>

    <!-- ================= RIGHT ================= -->
    <aside id="right">
      <div class="blk">
        <h3><span class="t">实时输出 OUTPUT</span><span class="c" id="outTag">设计位置</span></h3>
        <div class="bd" id="metWrap"></div>
      </div>

        <h3><span class="t">特性曲线 CURVES</span><span class="c">vs 轮跳行程</span></h3>
        <div class="bd" id="charts"></div>
      </div>
      <div class="blk">
        <h3><span class="t">硬点参数 HARDPOINTS</span><span class="c">可编辑 (mm)</span></h3>

      </div>

  <div id="stb">
    <span>求解 <b id="stIter">0</b> it</span>
    <span>轮跳 <b id="stPad">0.0</b> mm</span>
    <span>转向 <b id="stSteer">0.0</b>°</span>
    <span>侧倾 <b id="stRoll">0.0</b>°</span>

    <span class="sp"></span>
    <span id="stMsg">就绪</span>

</div>

<script>
"use strict";
/* ============================================================================
   SLA-KIN  双叉臂悬架运动学仿真
   坐标系: X 车头方向(+前) / Y 车辆左侧(+外) / Z 垂直向上(+上)   单位 mm
   机构自由度: 下横臂绕轴转动 = 1 DOF; 上横臂转角由 |U-L|=const 约束;
              转向节绕主销(U-L)的转角由 |To-Ti|=const 约束;
              轮跳(接地点高度)作为驱动输入, 用 Illinois 法反解下横臂转角。
   ========================================================================== */

/* ------------------------------ 向量 ------------------------------ */
const V=(x,y,z)=>({x,y,z});
const add=(a,b)=>({x:a.x+b.x,y:a.y+b.y,z:a.z+b.z});
const sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y,z:a.z-b.z});
const mul=(a,s)=>({x:a.x*s,y:a.y*s,z:a.z*s});
const dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const crs=(a,b)=>({x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x});
const len=a=>Math.hypot(a.x,a.y,a.z);
const nrm=a=>{const l=Math.hypot(a.x,a.y,a.z)||1e-9;return{x:a.x/l,y:a.y/l,z:a.z/l};};
const dst=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z);
const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2,z:(a.z+b.z)/2});
const lerp3=(a,b,t)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,z:a.z+(b.z-a.z)*t});
const AX={x:V(1,0,0),y:V(0,1,0),z:V(0,0,1)};
const RAD=180/Math.PI, D2R=Math.PI/180;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);

function rotVec(d,k,ang){                      // 绕单位轴 k 旋转向量
  const c=Math.cos(ang),s=Math.sin(ang),kv=crs(k,d),kd=dot(k,d);
  return {x:d.x*c+kv.x*s+k.x*kd*(1-c), y:d.y*c+kv.y*s+k.y*kd*(1-c), z:d.z*c+kv.z*s+k.z*kd*(1-c)};
}
function rotPt(p,o,k,ang){ return add(o,rotVec(sub(p,o),k,ang)); }
/* 绕固定轴的转动圆参数化: p(theta)=C+R(cos·a+sin·b), 轴向分量恒定 */
function makeCirc(p,o,k){
  const d=sub(p,o), kd=dot(d,k), C=add(o,mul(k,kd)), r=sub(p,C);
  let R=len(r);
  let a = R>1e-7 ? mul(r,1/R) : nrm(Math.abs(k.z)<0.9?crs(k,AX.z):crs(k,AX.x));
  const b=crs(k,a);
  return {C:C,a:a,b:b,R:R,kd:kd,k:k};
}
function evalCirc(c,t){
  const co=Math.cos(t)*c.R, si=Math.sin(t)*c.R;
  return {x:c.C.x+co*c.a.x+si*c.b.x, y:c.C.y+co*c.a.y+si*c.b.y, z:c.C.z+co*c.a.z+si*c.b.z};
}
/* 圆-球相交: |C+R(cos t·a+sin t·b) - T| = rad  ->  A cos t + B sin t = K */
function circSolve(c,T,rad,hint){
  const P=sub(c.C,T);
  const A=2*c.R*dot(P,c.a), B=2*c.R*dot(P,c.b);
  const K=rad*rad-c.R*c.R-dot(P,P);
  const Rr=Math.hypot(A,B);
  if(Rr<1e-9) return null;
  let cc=clamp(K/Rr,-1,1);
  const psi=Math.atan2(B,A), dl=Math.acos(cc);
  const s1=psi+dl, s2=psi-dl;
  if(hint==null) return Math.abs(s1)<Math.abs(s2)?s1:s2;
  return Math.abs(s1-hint)<Math.abs(s2-hint)?s1:s2;
}
/* 由 a 旋转到 b 的 (轴,角) */
function axisAngle(a,b){
  const d=clamp(dot(a,b),-1,1);
  if(d>1-1e-12) return {k:AX.z,ang:0};
  if(d<-1+1e-12){ const t=Math.abs(a.z)<0.9?AX.z:AX.x; return {k:nrm(crs(a,t)),ang:Math.PI}; }
  return {k:nrm(crs(a,b)),ang:Math.acos(d)};
}

/* ------------------------------ 硬点方案 ------------------------------ */
/* 左侧前悬架硬点 (设计位置: 车轮接地, 车身处于设计高度) */
const PRESETS={
 comfort:{
  name:"舒适型轿车",
  hp:{ Lf:V(175,322,196), Lr:V(-175,322,178), Lo:V(10,728,150),
       Uf:V(132,382,506), Ur:V(-132,382,521), Uo:V(-22,683,470),
       W :V(0,778,317),   To:V(-146,690,258), Ti:V(-146,300,292),
       Sl:V(28,598,156),  Su:V(76,424,716),
       Ac:V(-236,430,246),Ae:V(-84,430,190), Al:V(62,430,170) },
  wheelR:317, tireW:216, rimR:196, kSpring:52, cBump:1.30, cReb:3.40,
  hcg:580, lcg:1410, kt:42
 },
 sport:{
  name:"运动型轿车",
  hp:{ Lf:V(170,320,196), Lr:V(-170,320,178), Lo:V(10,730,150),
       Uf:V(130,380,506), Ur:V(-130,380,521), Uo:V(-24,681,470),
       W :V(0,780,317),   To:V(-140,690,255), Ti:V(-140,300,297),
       Sl:V(30,600,155),  Su:V(80,420,720),
       Ac:V(-230,430,250),Ae:V(-80,430,190), Al:V(60,430,170) },
  wheelR:317, tireW:226, rimR:203, kSpring:110, cBump:2.20, cReb:5.50,
  hcg:550, lcg:1485, kt:62
 },
 race:{
  name:"竞技/赛车",
  hp:{ Lf:V(178,318,190), Lr:V(-178,318,170), Lo:V(6,742,132),
       Uf:V(126,372,528), Ur:V(-126,372,545), Uo:V(-34,672,486),
       W :V(0,790,317),   To:V(-152,700,250), Ti:V(-152,304,300),
       Sl:V(34,604,138),  Su:V(66,410,742),
       Ac:V(-244,432,244),Ae:V(-92,432,186), Al:V(66,432,152) },
  wheelR:317, tireW:246, rimR:229, kSpring:210, cBump:4.20, cReb:9.60,
  hcg:470, lcg:1520, kt:130
 }
};

const HP={};                 // 当前硬点
let PRM={};                  // 当前参数
const DEF={                  // 派生常量
  dUL:0, dTR:0, dDL:0, e10:null, vTo:null, vW:null, vSl:null, vAl:null,
  armL:0, armU:0, springFree:0, rc0:55
};

function applyPreset(key){
  const p=PRESETS[key];
  for(const k in p.hp) HP[k]=V(p.hp[k].x,p.hp[k].y,p.hp[k].z);
  PRM={wheelR:p.wheelR,tireW:p.tireW,rimR:p.rimR,kSpring:p.kSpring,
       cBump:p.cBump,cReb:p.cReb,hcg:p.hcg,lcg:p.lcg,kt:p.kt};
  rebuild();
}
function rebuild(){
  DEF.dUL=dst(HP.Uo,HP.Lo);
  DEF.dTR=dst(HP.To,HP.Ti);
  DEF.dDL=dst(HP.Ae,HP.Al);
  DEF.e10=nrm(sub(HP.Uo,HP.Lo));
  DEF.vTo=sub(HP.To,HP.Lo);
  DEF.vW =sub(HP.W ,HP.Lo);
  DEF.vSl=sub(HP.Sl,HP.Lo);
  DEF.vAl=sub(HP.Al,HP.Lo);
  DEF.armL=len(sub(HP.Ae,HP.Ac));
  DEF.armU=len(sub(HP.Uo,HP.Ur));
  DEF.springFree=dst(HP.Su,HP.Sl)+PRM.wheelR*0;          // 占位, 下面按静挠度修正
  // 设计位置的静态压缩量: 使轮上力 = 1/4 簧上质量(取 420kg)
  const r0=solvePose(0,0,0);
  const mr0=Math.max(0.2,motionRatio(0));
  const statF=420*9.81;                                   // N
  const defl=statF/(PRM.kSpring*mr0);                     // mm
  DEF.springFree=dst(HP.Su,HP.Sl)+defl;
  DEF.rc0=r0.m.rc;
  PREV=null;
  refreshAll();
}

/* ------------------------------ 状态 ------------------------------ */
const S={ pad:0, steer:0, roll:0, spin:0, dist:0, t:0 };
let PREV=null;                 // 上一帧解, 用于连续性选支
const TRAVEL=70;               // 图表/轨迹扫描半行程

/* 车身侧倾: 绕通过 (x, 0, rc0) 的 X 轴旋转 */
function rollPt(p){
  const r=S.roll; if(Math.abs(r)<1e-9) return p;
  const c=Math.cos(r), s=Math.sin(r), dy=p.y, dz=p.z-DEF.rc0;
  return {x:p.x, y:dy*c-dz*s, z:DEF.rc0+dy*s+dz*c};
}
function rollVecOnly(d){
  const r=S.roll; if(Math.abs(r)<1e-9) return d;
  const c=Math.cos(r), s=Math.sin(r);
  return {x:d.x, y:d.y*c-d.z*s, z:d.y*s+d.z*c};
}
function unrollPt(p){
  const r=S.roll; if(Math.abs(r)<1e-9) return p;
  const c=Math.cos(-r), s=Math.sin(-r), dy=p.y, dz=p.z-DEF.rc0;
  return {x:p.x, y:dy*c-dz*s, z:DEF.rc0+dy*s+dz*c};
}

/* 每一帧/每个姿态构建一次: 车身侧倾后的固定几何 + 转动圆 */
function buildFrame(){
  const Lf=rollPt(HP.Lf), Lr=rollPt(HP.Lr);
  const Uf=rollPt(HP.Uf), Ur=rollPt(HP.Ur);
  const nL=nrm(sub(Lf,Lr)), nU=nrm(sub(Uf,Ur));
  return {
    Lf,Lr,Uf,Ur,nL,nU,
    Ti:rollPt(HP.Ti), Su:rollPt(HP.Su),
    Ac:rollPt(HP.Ac), nArb:rollVecOnly(AX.y),
    cL :makeCirc(rollPt(HP.Lo),Lr,nL),
    cSl:makeCirc(rollPt(HP.Sl),Lr,nL),
    cAl:makeCirc(rollPt(HP.Al),Lr,nL),
    cU :makeCirc(rollPt(HP.Uo),Ur,nU),
    cAe:makeCirc(rollPt(HP.Ae),rollPt(HP.Ac),rollVecOnly(AX.y)),
    Lmid:V(0,(Lf.y+Lr.y)/2,(Lf.z+Lr.z)/2),
    Umid:V(0,(Uf.y+Ur.y)/2,(Uf.z+Ur.z)/2)
  };
}

/* 给定下横臂转角, 求解整个机构 (含转向节绕主销转角) */
function evalTheta(th,F,steerA,hint){
  const L=evalCirc(F.cL,th);
  const thU=circSolve(F.cU,L,DEF.dUL,hint?hint.thU:null);
  if(thU==null) return null;
  const U=evalCirc(F.cU,thU);

  /* 转向节: 先由 (U0-L0)->(U-L) 定向, 再绕主销转 steerA */
  const e1=nrm(sub(U,L));
  const aa=axisAngle(DEF.e10,e1);
  const vTo=rotVec(DEF.vTo,aa.k,aa.ang);
  const dAx=dot(vTo,e1);
  const Ct=add(L,mul(e1,dAx));                 // 转向节上 To 的转动圆心
  const perp=sub(vTo,mul(e1,dAx));
  const rp=len(perp);
  const a1=rp>1e-6?mul(perp,1/rp):AX.x;
  const b1=crs(e1,a1);
  const al=circSolve({C:Ct,a:a1,b:b1,R:rp}, F.Ti, DEF.dTR, hint?hint.al:null);
  if(al==null) return null;
  const To=add(Ct,add(mul(a1,Math.cos(al)*rp),mul(b1,Math.sin(al)*rp)));

  /* 转向节刚体变换: R = Rot(e1,al) · Rot(k,ang) */
  const rot=v=>rotVec(rotVec(v,aa.k,aa.ang),e1,al);
  const W  = add(L,rot(DEF.vW));
  const h  = rot(AX.y);                        // 轮毂外指方向
  const Sl = add(L,rot(DEF.vSl));
  const Al = add(L,rot(DEF.vAl));
  const cal= add(L,rot(sub(V(-215,690,400),HP.Lo)));

  /* 接地点: 轮平面上最低点 */
  const w = sub(AX.z,mul(h,dot(AX.z,h)));
  const wl= len(w)||1e-6;
  const contact = sub(W,mul(w,PRM.wheelR/wl));

  /* 齿条行程(输出): |To-(Ti+s·Y)| = dTR */
  const d=sub(To,F.Ti), L2=dot(d,d)-DEF.dTR*DEF.dTR;
  const disc=d.y*d.y-L2;
  let s = disc>0 ? d.y-Math.sqrt(disc) : d.y;
  if(hint&&hint.rack!=null && Math.abs(d.y+Math.sqrt(Math.max(disc,0))-hint.rack)<Math.abs(s-hint.rack))
    s=d.y+Math.sqrt(Math.max(disc,0));

  /* 稳定杆臂转角 */
  const arbA=circSolve(F.cAe,Al,DEF.dDL,hint?hint.arbA:null);

  return {th,thU,al,rack:s,L,U,To,W,h,Sl,Al,cal,contact,w,wl,arbA,
          F:F,e1:e1,kp:nrm(sub(U,L)),rot:rot,aa:aa};
}

/* 用 Illinois 法反解下横臂转角, 使接地点高度 = pad */
let LASTIT=0;
function solvePose(pad,steerA,rollA){
  const oldRoll=S.roll;
  S.roll=rollA;                                  // 侧倾姿态作用于所有车身硬点
  let out=null;
  try{
    const F=buildFrame();
    const h=(PREV&&Math.abs(rollA-oldRoll)<1e-9)?{thU:PREV.thU,al:PREV.al,rack:PREV.rack,arbA:PREV.arbA}:null;
    let a=(PREV?PREV.th:0)-0.05, b=a+0.10;
    let ra=evalTheta(a,F,steerA,h), rb=evalTheta(b,F,steerA,h);
    if(ra&&rb){
      let fa=ra.contact.z-pad, fb=rb.contact.z-pad;
      let g=0;
      while(fa*fb>0 && g<16){
        a-=0.06; b+=0.06;
        ra=evalTheta(a,F,steerA,h); rb=evalTheta(b,F,steerA,h);
        if(!ra||!rb) break;
        fa=ra.contact.z-pad; fb=rb.contact.z-pad; g++;
      }
      let best=ra, berr=Math.abs(fa), c=a, rc=ra, fc=fa;
      for(let i=0;i<30;i++){
        if(Math.abs(fb-fa)<1e-12) break;
        c=b-fb*(b-a)/(fb-fa);
        rc=evalTheta(c,F,steerA,h); if(!rc) break;
        fc=rc.contact.z-pad;
        if(Math.abs(fc)<berr){ berr=Math.abs(fc); best=rc; }
        if(fa*fc<0){ b=c; fb=fc; fa*=0.5; }
        else { a=c; fa=fc; }
        best=rc;
        if(i>2&&Math.abs(fc)<1e-6) break;
      }
      LASTIT=g+30;
      out=best?withMetrics(best,F,pad):null;
    }
  } finally { S.roll=oldRoll; }
  return out;
}

/* ------------------------------ 指标 ------------------------------ */
function withMetrics(r,F,pad){
  const {L,U,W,h,contact}=r;
  const kp=r.kp;

  /* 外倾 / 前束 */
  const camber = -Math.asin(clamp(dot(h,AX.z),-1,1));
  const fw=nrm(sub(AX.x,mul(h,dot(AX.x,h))));
  const toe = -Math.atan2(fw.y,fw.x);

  /* 主销后倾 / 内倾 */
  const caster = Math.atan2(-kp.x,kp.z);
  const kpi    = Math.atan2(-kp.y,kp.z);

  /* 主销接地点 / 磨胎半径 / 拖距 */
  const t = kp.z>1e-6 ? -L.z/kp.z : 0;
  const G = add(L,mul(kp,t));
  const scrub = contact.y-G.y;
  const trail = G.x-contact.x;

  /* 车身坐标系下的前视瞬时中心与侧倾中心 */
  const bL=unrollPt(L), bU=unrollPt(U), bC=unrollPt(contact);
  const bLm=V(0,(HP.Lf.y+HP.Lr.y)/2,(HP.Lf.z+HP.Lr.z)/2);
  const bUm=V(0,(HP.Uf.y+HP.Ur.y)/2,(HP.Uf.z+HP.Ur.z)/2);
  const ic=lineInt2(bLm.y,bLm.z,bL.y,bL.z, bUm.y,bUm.z,bU.y,bU.z);
  let rc=NaN;
  if(ic && Math.abs(ic.y-bC.y)>1e-6){
    const k=(0-bC.y)/(ic.y-bC.y);
    rc=bC.z+(ic.z-bC.z)*k;
  }
  r.ic=ic;

  /* 侧视瞬时中心 + 抗点头率 */
  const sv=lineInt2(HP.Lf.x,HP.Lf.z,HP.Lr.x,HP.Lr.z, HP.Uf.x,HP.Uf.z,HP.Ur.x,HP.Ur.z);
  let antidive=NaN;
  if(sv){
    const dx=Math.abs(sv.x-contact.x), hz=sv.z;
    const thSV=Math.atan2(hz,Math.max(dx,1));
    const thCG=Math.atan2(PRM.hcg,PRM.lcg);
    antidive=thSV/thCG*100;
  }
  r.sv=sv;

  /* 弹簧 / 减振器 (可形变单元) */
  const sl=r.Sl, su=F.Su;
  const axv=sub(su,sl);
  const slen=len(axv);
  const comp=DEF.springFree-slen;
  const Fspr=Math.max(0,PRM.kSpring*comp);

  const bContact=unrollPt(contact);
  r.m={camber,toe,caster,kpi,scrub,trail,rc,antidive,
       track:bContact.y-HP.W.y, travel:contact.z-(HP.W.z-PRM.wheelR),
       slen,comp,Fspr,mr:1,kw:0,arbA:r.arbA||0,pad:pad};
  r.ic=ic; r.sv=sv; r.spring={a:sl,b:su,ax:nrm(axv),len:slen};
  return r;
}
/* 2D 直线相交 (平面坐标 u,v) */
function lineInt2(u1,v1,u2,v2,u3,v3,u4,v4){
  const d=(u2-u1)*(v4-v3)-(v2-v1)*(u4-u3);
  if(Math.abs(d)<1e-9) return null;
  const t=((u3-u1)*(v4-v3)-(v3-v1)*(u4-u3))/d;
  return {y:u1+t*(u2-u1), z:v1+t*(v2-v1)};
}
/* 数值杠杆比 (弹簧位移 / 轮跳) */
function motionRatio(pad){
  const d=1.0;
  const A=solvePose(pad-d,0,S.roll), B=solvePose(pad+d,0,S.roll);
  if(!A||!B) return 0.65;
  return Math.abs((A.m.slen-B.m.slen)/(2*d));
}

/* ------------------------------ 扫描 ------------------------------ */
let SWEEP=[], TRACE=null, SWEEPKEY="";
function doSweep(){
  const key=[S.steer.toFixed(3),S.roll.toFixed(4),JSON.stringify(HP),JSON.stringify(PRM)].join("|");
  if(key===SWEEPKEY) return;
  SWEEPKEY=key;
  const n=29, out=[], tr={U:[],L:[],W:[],C:[],G:[],To:[],kp:[]};
  const save=PREV; let hint=PREV?{thU:PREV.thU,al:PREV.al,rack:PREV.rack,arbA:PREV.arbA}:null;
  for(let i=0;i<n;i++){
    const z=-TRAVEL+2*TRAVEL*i/(n-1);
    const r=solvePose(z,S.steer,S.roll);
    if(!r) continue;
    out.push(r);
    tr.U.push(r.U); tr.L.push(r.L); tr.W.push(r.W); tr.C.push(r.contact); tr.To.push(r.To);
    const kpz=r.kp.z||1e-6, tg=-r.L.z/kpz;
    tr.G.push(add(r.L,mul(r.kp,tg)));
    if(i%3===0) tr.kp.push([add(r.L,mul(r.kp,-0.30)),add(r.U,mul(r.kp,0.30))]);
    hint={thU:r.thU,al:r.al,rack:r.rack,arbA:r.arbA};
    PREV=r;
  }
  PREV=save;
  SWEEP=out; TRACE=tr;
}

/* ------------------------------ 相机 ------------------------------ */
const cam={yaw:62*D2R,pitch:20*D2R,scale:0.62,tx:0,ty:470,tz:330,
           right:V(1,0,0),up:V(0,0,1),dir:V(0,1,0),override:null};
function updateCam(){
  const cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  cam.dir=V(cp*Math.cos(cam.yaw),cp*Math.sin(cam.yaw),sp);
  if(Math.abs(cam.dir.z)>0.9995){
    cam.right=V(1,0,0); cam.up=V(0,1,0);
  }else{
    cam.right=nrm(crs(AX.z,cam.dir));
    cam.up=crs(cam.dir,cam.right);
  }
  if(cam.override){ cam.right=cam.override.r; cam.up=cam.override.u; }
}
const CT={x:0,y:0,z:0};
function project(p){
  const r=sub(p,CT);
  return {x:W2+dot(r,cam.right)*cam.scale, y:H2-dot(r,cam.up)*cam.scale, d:dot(r,cam.dir)};
}
const zd=p=>{const r=sub(p,CT);return -dot(r,cam.dir);};

const VIEWS={
  iso  :{yaw:62,pitch:20,ov:null},
  front:{yaw:0, pitch:0, ov:null},
  side :{yaw:-90,pitch:0,ov:null},
  top  :{yaw:0,pitch:89.99,ov:null}
};
let VIEWNAME="等轴测";
function setView(k){
  const v=VIEWS[k]; if(!v) return;
  cam.yaw=v.yaw*D2R; cam.pitch=v.pitch*D2R; cam.override=v.ov;
  VIEWNAME={iso:"等轴测",front:"前视 (Y-Z)",side:"侧视 (X-Z)",top:"俯视 (X-Y)"}[k];
  document.getElementById("viewName").textContent=VIEWNAME;
  updateCam(); fitView();
}
function fitView(){
  const c=document.getElementById("cv");
  const w=c.clientWidth||900, h=c.clientHeight||600;
  cam.scale=Math.min(w/1350,h/980)*1.05;
  cam.tx=0; cam.ty=470; cam.tz=330;
  CT.x=cam.tx; CT.y=cam.ty; CT.z=cam.tz;
}

/* ------------------------------ 显示列表 ------------------------------ */
let DL=[];
const push=(z,f)=>DL.push([z,f]);
function flush(){ DL.sort((a,b)=>b[0]-a[0]); for(let i=0;i<DL.length;i++) DL[i][1](); DL.length=0; }

const C={
  body:"#8d99a4", bodyD:"#5f6b76",
  lower:"#123a63", lowerF:"#2b6bb0",
  upper:"#123a63", upperF:"#3f83c4",
  knuck:"#2f353b", knuckF:"#cfd6dc",
  king:"#c0272d",
  tie:"#0f7b46", tieF:"#28a06a",
  spr:"#b4620a", sprF:"#e6923a",
  damp:"#5b6672", dampR:"#c8ced4",
  arb:"#6d3fa8", arbF:"#9a72cf",
  tire:"#22282e", rim:"#a7b0b8",
  trace:"#c0272d", trace2:"#0b5fa5", trace3:"#0f7b46",
  grid:"#e6eaee", gridM:"#d3dade",
  txt:"#33404d", dim:"#8b96a2", ground:"#eef2f5"
};

function nmz(v){ return -v; }
function line3(a,b,o){
  const A=project(a),B=project(b);
  const z=o&&o.z!=null?o.z:(zd(a)+zd(b))/2;
  push(z,()=>{
    ctx.save();
    ctx.strokeStyle=o.c||"#000"; ctx.lineWidth=o.w||1;
    ctx.lineCap="butt"; ctx.lineJoin="miter";
    if(o.dash) ctx.setLineDash(o.dash);
    if(o.alpha) ctx.globalAlpha=o.alpha;
    ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke();
    ctx.restore();
  });
}
function poly3(pts,o){
  if(pts.length<2) return;
  const P=pts.map(project);
  let z=0; pts.forEach(p=>z+=zd(p)); z/=pts.length;
  if(o.z!=null) z=o.z;
  push(z,()=>{
    ctx.save();
    ctx.beginPath(); ctx.moveTo(P[0].x,P[0].y);
    for(let i=1;i<P.length;i++) ctx.lineTo(P[i].x,P[i].y);
    if(o.close) ctx.closePath();
    if(o.fill){ ctx.fillStyle=o.fill; ctx.fill(); }
    if(o.c){ ctx.strokeStyle=o.c; ctx.lineWidth=o.w||1; ctx.lineJoin="miter"; ctx.lineCap="butt";
             if(o.dash)ctx.setLineDash(o.dash);
             if(o.alpha)ctx.globalAlpha=o.alpha;
             ctx.stroke(); }
    ctx.restore();
  });
}
/* 刚性杆件: 外描边 + 内填充, 形成实体杆的观感 */
function tube(a,b,w,co,ci,zb){
  const A=project(a),B=project(b);
  const z=zb!=null?zb:(zd(a)+zd(b))/2;
  push(z,()=>{
    ctx.save(); ctx.lineCap="butt";
    ctx.strokeStyle=co; ctx.lineWidth=w;
    ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke();
    ctx.strokeStyle=ci; ctx.lineWidth=Math.max(1,w-2.6);
    ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke();
    ctx.restore();
  });
}
function node(p,type,col,zb){
  const A=project(p);
  const z=zb!=null?zb:zd(p)-0.01;
  push(z,()=>{
    ctx.save();
    ctx.fillStyle="#fff"; ctx.strokeStyle=col||"#1a1a1a"; ctx.lineWidth=1.4;
    ctx.beginPath();
    const s=type==="tri"?4.6:3.6;
    if(type==="tri"){ ctx.moveTo(A.x,A.y-s); ctx.lineTo(A.x+s,A.y+s*0.8); ctx.lineTo(A.x-s,A.y+s*0.8); ctx.closePath(); }
    else if(type==="dia"){ ctx.moveTo(A.x,A.y-s); ctx.lineTo(A.x+s,A.y); ctx.lineTo(A.x,A.y+s); ctx.lineTo(A.x-s,A.y); ctx.closePath(); }
    else { ctx.rect(A.x-s,A.y-s,s*2,s*2); }
    ctx.fill(); ctx.stroke(); ctx.restore();
  });
}
function label(p,txt,dx,dy,col){
  const A=project(p);
  push(-1e9,()=>{
    ctx.save();
    ctx.font='10px Consolas,monospace'; ctx.fillStyle=col||C.txt;
    ctx.textBaseline="middle";
    if(dx||dy){
      ctx.strokeStyle="rgba(90,102,114,.75)"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(A.x+dx,A.y+dy); ctx.stroke();
    }
    ctx.fillText(txt,A.x+dx+(dx>=0?3:-3),A.y+dy);
    ctx.restore();
  });
}

/* 螺旋弹簧 (可形变单元) */
function drawSpring(a,b,coils,rad,phase){
  const ax=sub(b,a), L=len(ax), u=mul(ax,1/L);
  const t=Math.abs(u.z)<0.9?AX.z:AX.x;
  const e1=nrm(crs(u,t)), e2=crs(u,e1);
  const N=coils*20, pts=[];
  for(let i=0;i<=N;i++){
    const s=i/N, ang=s*coils*2*Math.PI+phase;
    let rr=rad;
    if(s<0.045) rr=rad*(0.35+0.65*s/0.045);          // 端部并紧
    if(s>0.955) rr=rad*(0.35+0.65*(1-s)/0.045);
    pts.push(add(add(a,mul(u,s*L)),add(mul(e1,Math.cos(ang)*rr),mul(e2,Math.sin(ang)*rr))));
  }
  let z=0; pts.forEach(p=>z+=zd(p)); z/=pts.length;
  push(z+0.02,()=>{
    ctx.save(); ctx.beginPath();
    const P=pts.map(project);
    ctx.moveTo(P[0].x,P[0].y);
    for(let i=1;i<P.length;i++) ctx.lineTo(P[i].x,P[i].y);
    ctx.strokeStyle=C.spr; ctx.lineWidth=2.4; ctx.lineJoin="round"; ctx.stroke();
    ctx.strokeStyle=C.sprF; ctx.lineWidth=1.0; ctx.stroke();
    ctx.restore();
  });
  /* 弹簧座 */
  const ring=(p,s)=>{
    const pts=[];
    for(let i=0;i<=16;i++){const an=i/16*2*Math.PI; pts.push(add(add(p,mul(e1,Math.cos(an)*s)),mul(e2,Math.sin(an)*s)));}
    poly3(pts,{c:C.spr,w:1.4,fill:"rgba(230,146,58,.18)",close:true});
  };
  ring(add(a,mul(u,2)),rad*1.18);
  ring(add(b,mul(u,-2)),rad*1.18);
  return u;
}
/* 减振器 (可形变单元: 筒身 + 活塞杆) */
function drawDamper(a,b,bodyLen){
  const ax=sub(b,a), L=len(ax), u=mul(ax,1/L);
  const bl=Math.min(bodyLen,L*0.9);
  const m=add(a,mul(u,bl));
  tube(a,m,15,C.damp,"#8a949f");
  tube(m,b,7,"#7d8892",C.dampR);
  /* 贮油缸端部 */
  const t=Math.abs(u.z)<0.9?AX.z:AX.x;
  const e1=nrm(crs(u,t)), e2=crs(u,e1);
  const cap=(p,s)=>{const pts=[];for(let i=0;i<=12;i++){const an=i/12*2*Math.PI;pts.push(add(add(p,mul(e1,Math.cos(an)*s)),mul(e2,Math.sin(an)*s)));}
    poly3(pts,{c:C.damp,w:1.2,fill:"#c8ced4",close:true});};
  cap(add(a,mul(u,3)),8); cap(m,8.5);
  return u;
}

const LAYERS={
  body:{n:"车身/副车架",on:1}, arm:{n:"上下叉臂",on:1}, knuckle:{n:"转向节/轮毂",on:1},
  king:{n:"主销轴线",on:1}, steer:{n:"转向系统",on:1}, spring:{n:"弹簧减振器",on:1},
  arb:{n:"横向稳定杆",on:1}, wheel:{n:"车轮/制动",on:1}, trace:{n:"运动轨迹",on:1},
  path:{n:"主销运动路径",on:1}, ic:{n:"瞬心/侧倾中心",on:1}, dim:{n:"硬点标注",on:0},
  grid:{n:"网格/地面",on:1}
};
function buildLayers(){
  const w=document.getElementById("layers"); w.innerHTML="";
  for(const k in LAYERS){
    const d=document.createElement("label"); d.className="chk";
    d.innerHTML='<input type="checkbox" '+(LAYERS[k].on?"checked":"")+' data-l="'+k+'"><span>'+LAYERS[k].n+'</span>';

  }
  w.addEventListener("change",e=>{
    const k=e.target.getAttribute("data-l"); if(k) LAYERS[k].on=e.target.checked?1:0;
  });
}

function drawGround(){

/* 车身/副车架参考 (刚性基准) */
function drawBody(F){
  if(!LAYERS.body.on) return;
  const t=(a,b,w)=>line3(a,b,{c:C.body,w:w||1.4});
  /* 纵梁 */
  const y1=300,y2=470;
  [[y1],[y2]].forEach(([y])=>{
    poly3([V(-420,y,180),V(420,y,180),V(420,y,250),V(-420,y,250)],
      {c:C.bodyD,w:1.2,fill:"rgba(141,153,164,.10)",close:true});
  });
  /* 副车架 */
  t(V(-330,300,180),V(330,300,180),2);
  t(V(-330,470,180),V(330,470,180),2);
  t(V(-330,300,180),V(-330,470,180),2);
  t(V(330,300,180),V(330,470,180),2);
  /* 塔座 */
  const su=F.Su;
  poly3([V(-140,su.y-70,su.z+8),V(200,su.y-70,su.z+8),V(200,su.y+70,su.z+8),V(-140,su.y+70,su.z+8)],
    {c:C.bodyD,w:1.2,fill:"rgba(141,153,164,.14)",close:true});
  t(F.Su,add(F.Su,V(0,0,60)),3);
  t(F.Su,V(F.Su.x+150,F.Su.y,F.Su.z+70),2);
  t(F.Su,V(F.Su.x-120,F.Su.y,F.Su.z+70),2);
  /* 叉臂支座 */
  [[F.Lf,F.Lr],[F.Uf,F.Ur]].forEach(([a,b])=>{
    t(a,add(a,V(0,0,-46)),3); t(b,add(b,V(0,0,-46)),3);
    t(add(a,V(0,0,-46)),add(b,V(0,0,-46)),1.6);
    t(add(a,V(0,0,-46)),V(a.x,a.y-120,a.z),1);
  });
  /* 转向器壳体 */
  if(LAYERS.steer.on){
    t(V(F.Ti.x,F.Ti.y-260,F.Ti.z),V(F.Ti.x,F.Ti.y+40,F.Ti.z),9);
  }
}

function drawArms(F,r){
  if(!LAYERS.arm.on) return;
  const {L,U}=r;
  /* 下叉臂: 两腿 + 横梁 + 枢轴 */
  tube(F.Lf,L,17,C.lower,C.lowerF);
  tube(F.Lr,L,17,C.lower,C.lowerF);
  const p1=lerp3(F.Lf,L,0.55), p2=lerp3(F.Lr,L,0.55);
  tube(p1,p2,9,C.lower,"#4d8ccb");
  tube(F.Lf,F.Lr,6,C.lower,"#7ba9d6");
  /* 弹簧座与稳定杆连杆座 (随臂运动) */
  if(LAYERS.spring.on){ tube(r.Sl,lerp3(r.Sl,mid(F.Lf,F.Lr),0.35),9,C.lower,"#4d8ccb"); }
  if(LAYERS.arb.on){ tube(r.Al,add(r.Al,V(0,0,-26)),7,C.lower,"#4d8ccb"); }
  node(L,"sq",C.lower);
  node(F.Lf,"tri",C.lower); node(F.Lr,"tri",C.lower);

  /* 上叉臂 */
  tube(F.Uf,U,14,C.upper,C.upperF);
  tube(F.Ur,U,14,C.upper,C.upperF);
  const q1=lerp3(F.Uf,U,0.5), q2=lerp3(F.Ur,U,0.5);
  tube(q1,q2,7,C.upper,"#7ba9d6");
  tube(F.Uf,F.Ur,5,C.upper,"#9dc2e2");
  node(U,"sq",C.upper);
  node(F.Uf,"tri",C.upper); node(F.Ur,"tri",C.upper);
}

function drawKnuckle(F,r){
  if(!LAYERS.knuckle.on) return;
  const {L,U,W,h}=r;
  /* 立柱本体 */
  tube(L,U,22,C.knuck,C.knuckF);
  /* 轮毂支架: 主销轴线上轮心高度 -> 轮心 */
  const axPt=add(L,mul(r.kp,dot(sub(W,L),r.kp)));
  tube(axPt,W,20,C.knuck,C.knuckF);
  /* 转向节臂 */
  const stPt=add(L,mul(r.kp,dot(sub(r.To,L),r.kp)));
  tube(stPt,r.To,13,C.knuck,"#b9c1c8");
  /* 制动钳支座 */
  tube(add(L,mul(r.kp,dot(sub(r.cal,L),r.kp))),r.cal,11,C.knuck,"#b9c1c8");
  /* 轮毂/轴头 */
  tube(add(W,mul(h,-45)),add(W,mul(h,72)),16,"#3a424a","#9aa3ab");
  node(L,"sq",C.knuck); node(U,"sq",C.knuck);
}

function drawSteer(F,r){
  if(!LAYERS.steer.on) return;
  const Ti=add(F.Ti,V(0,r.rack,0));
  tube(Ti,r.To,11,C.tie,C.tieF);
  node(Ti,"dia",C.tie); node(r.To,"dia",C.tie);
  /* 齿条(随侧倾运动) + 防尘套(可形变) */
  const a=V(Ti.x,Ti.y-260,Ti.z), b=Ti;
  tube(a,b,8,C.tie,"#5fbf8f");
  /* 波纹防尘套 */
  const n=9, ax=sub(b,a), L=len(ax), u=mul(ax,1/L);
  const t=Math.abs(u.z)<0.9?AX.z:AX.x;
  const e1=nrm(crs(u,t)), e2=crs(u,e1);
  for(let i=0;i<n;i++){
    const s0=(i+0.18)/n, s1=(i+0.82)/n, rr=11;
    const p0=add(add(a,mul(u,s0*L)),mul(e1,rr)), p1=add(add(a,mul(u,s1*L)),mul(e1,rr));
    const p2=add(add(a,mul(u,s1*L)),mul(e1,-rr)), p3=add(add(a,mul(u,s0*L)),mul(e1,-rr));
    poly3([p0,p1,p2,p3],{c:C.tie,w:1,close:true,alpha:.85});
  }
}

function drawARB(F,r){
  if(!LAYERS.arb.on) return;
  const end=F.cAe?evalCirc(F.cAe,r.arbA||0):r.Al;
  /* 稳定杆本体 (沿车宽方向) */
  const c=F.Ac, ny=F.nArb;
  const a1=add(c,mul(ny,300)), a2=add(c,mul(ny,-60));
  tube(a1,a2,13,C.arb,C.arbF);
  /* 安装衬套 */
  [180,60].forEach(d=>{
    const p=add(c,mul(ny,d));
    const t=Math.abs(ny.z)<0.9?AX.z:AX.x;
    const e1=nrm(crs(ny,t)), e2=crs(ny,e1);
    const pts=[];
    for(let i=0;i<=10;i++){const an=i/10*2*Math.PI;pts.push(add(add(p,mul(e1,Math.cos(an)*13)),mul(e2,Math.sin(an)*13)));}
    poly3(pts,{c:C.bodyD,w:1.2,fill:"rgba(141,153,164,.6)",close:true});

  tube(end,r.Al,7,C.arb,"#b99ae0");
  node(end,"dia",C.arb); node(r.Al,"dia",C.arb);
}

/* 车轮 / 制动盘 */
function drawWheel(r){
  if(!LAYERS.wheel.on) return;
  const {W,h,contact}=r;
  const w=sub(AX.z,mul(h,dot(AX.z,h)));
  const uw=mul(w,1/(len(w)||1));
  const fw=crs(h,uw);
  const R=PRM.wheelR, tw=PRM.tireW/2, rr=PRM.rimR;
  const spin=S.spin;
  const P=(ang,rad,off)=>add(add(W,mul(h,off)),add(mul(fw,Math.cos(ang)*rad),mul(uw,Math.sin(ang)*rad)));
  const circ=(rad,off,n)=>{const a=[];for(let i=0;i<=n;i++)a.push(P(i/n*2*Math.PI,rad,off));return a;};

  /* 内侧胎侧 */
  poly3(circ(R,-tw,44),{c:C.tire,w:1.6,close:true});
  /* 胎面块 */
  for(let i=0;i<30;i++){
    const an=spin+i/30*2*Math.PI;
    line3(P(an,R,-tw),P(an,R,tw),{c:C.tire,w:1.2});
  }
  /* 轮辋 */
  poly3(circ(rr,tw-14,40),{c:C.rim,w:1.6,close:true,fill:"rgba(167,176,184,.35)"});
  poly3(circ(rr*0.92,-tw*0.35,40),{c:"#97a1a9",w:1.2,close:true});
  for(let i=0;i<5;i++){
    const an=spin+i/5*2*Math.PI;
    const p0=add(W,mul(h,tw-14));
    const p1=P(an,rr*0.97,tw-14);
    tube(p0,p1,7,"#8d97a0","#b9c1c8");
  }
  /* 制动盘 */
  poly3(circ(rr*0.80,-6,32),{c:"#6d757d",w:1.3,close:true,fill:"rgba(109,117,125,.35)"});
  poly3(circ(rr*0.80,6,32),{c:"#6d757d",w:1.3,close:true});
  /* 制动钳 */
  const cal=r.cal;
  const perp=nrm(sub(cal,add(W,mul(h,dot(sub(cal,W),h)))));
  const up=uw;
  const b1=add(add(cal,mul(perp,26)),mul(up,52)), b2=add(add(cal,mul(perp,26)),mul(up,-52));
  const b3=add(add(cal,mul(perp,-26)),mul(up,-52)), b4=add(add(cal,mul(perp,-26)),mul(up,52));
  poly3([b1,b2,b3,b4],{c:"#8a2f2f",w:1.4,fill:"rgba(138,47,47,.55)",close:true});
  /* 外侧胎侧 */
  poly3(circ(R,tw,44),{c:C.tire,w:1.6,close:true});
  /* 接地印迹 */
  poly3([add(contact,mul(fw,70)),add(contact,mul(fw,-70)),
         add(add(contact,mul(fw,-70)),mul(h,tw*1.6)),add(add(contact,mul(fw,70)),mul(h,tw*1.6))],
        {c:"#b3261e",w:1,fill:"rgba(179,38,30,.16)",close:true,z:1e6});
  node(contact,"sq","#b3261e");
  /* 轮垫(跳动台) */
  const pad=r.m.pad;
  poly3([V(-260,contact.y-180,pad-6),V(260,contact.y-180,pad-6),V(260,contact.y+180,pad-6),V(-260,contact.y+180,pad-6)],
        {c:"#9aa4ac",w:1,fill:"rgba(154,164,172,.22)",close:true,z:1e6});
}

function drawIC(F,r){

    const bL=unrollPt(r.L), bU=unrollPt(r.U), bC=unrollPt(r.contact);
    const bLm=V(0,(HP.Lf.y+HP.Lr.y)/2,(HP.Lf.z+HP.Lr.z)/2);
    const bUm=V(0,(HP.Uf.y+HP.Ur.y)/2,(HP.Uf.z+HP.Ur.z)/2);
    const p=rollPt(V(0,r.ic.y,r.ic.z));
    line3(rollPt(V(0,bLm.y,bLm.z)),rollPt(V(0,bL.y,bL.z)),{c:"#0b5fa5",w:1,dash:[8,4],alpha:.8});
    line3(rollPt(V(0,bUm.y,bUm.z)),rollPt(V(0,bU.y,bU.z)),{c:"#0b5fa5",w:1,dash:[8,4],alpha:.8});
    node(p,"dia","#0b5fa5");
    const rcP=rollPt(V(0,0,r.m.rc));
    line3(p,rollPt(V(0,bC.y,bC.z)),{c:"#0b5fa5",w:1,dash:[3,3],alpha:.75});
    node(rcP,"tri","#0b5fa5");
    if(LAYERS.dim.on){
      label(p,"瞬心IC y="+r.ic.y.toFixed(0)+" z="+r.ic.z.toFixed(0),10,-12,"#0b5fa5");
      label(rcP,"RC "+r.m.rc.toFixed(1),12,-2,"#0b5fa5");
    }
  }
  if(r.sv && Math.abs(r.sv.x)<40000){
    const p=V(r.sv.x,0,r.sv.z);
    line3(V(HP.Lf.x,0,HP.Lf.z),V(HP.Lr.x,0,HP.Lr.z),{c:"#b4620a",w:1,dash:[8,4],alpha:.55});
    line3(V(HP.Uf.x,0,HP.Uf.z),V(HP.Ur.x,0,HP.Ur.z),{c:"#b4620a",w:1,dash:[8,4],alpha:.55});
    node(p,"dia","#b4620a");
    if(LAYERS.dim.on) label(p,"侧视瞬心 抗点头 "+r.m.antidive.toFixed(0)+"%",10,-12,"#b4620a");
  }
}

function drawChart(c,vals,cur){
  const g=c.getContext("2d"), w=c.width, h=c.height;
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,w,h);
  g.fillStyle="#fff"; g.fillRect(0,0,w,h);
  const P={l:38,r:8,t:8,b:20};
  let mn=Infinity,mx=-Infinity;
  vals.forEach(v=>{ if(!isFinite(v))return; if(v<mn)mn=v; if(v>mx)mx=v; });
  if(!isFinite(mn)){mn=-1;mx=1;}
  if(mx-mn<1e-6){mn-=1;mx+=1;}
  const pad=(mx-mn)*0.14; mn-=pad; mx+=pad;
  const X=v=>P.l+(v+TRAVEL)/(2*TRAVEL)*(w-P.l-P.r);
  const Y=v=>P.t+(1-(v-mn)/(mx-mn))*(h-P.t-P.b);
  /* 网格 */
  g.strokeStyle="#eef2f5"; g.lineWidth=1;
  for(let i=0;i<=5;i++){const y=P.t+i/5*(h-P.t-P.b);g.beginPath();g.moveTo(P.l,y);g.lineTo(w-P.r,y);g.stroke();}
  for(let i=0;i<=6;i++){const x=P.l+i/6*(w-P.l-P.r);g.beginPath();g.moveTo(x,P.t);g.lineTo(x,h-P.b);g.stroke();}
  /* 零线 */
  if(mn<0&&mx>0){ g.strokeStyle="#c6d0d8"; g.setLineDash([4,3]);
    g.beginPath(); g.moveTo(P.l,Y(0)); g.lineTo(w-P.r,Y(0)); g.stroke(); g.setLineDash([]); }
  /* 轴 */
  g.strokeStyle="#9aa4ac"; g.lineWidth=1;
  g.beginPath(); g.moveTo(P.l,P.t); g.lineTo(P.l,h-P.b); g.lineTo(w-P.r,h-P.b); g.stroke();
  /* 曲线 */
  g.strokeStyle="#0b5fa5"; g.lineWidth=2; g.beginPath();
  let st=false;
  for(let i=0;i<vals.length;i++){
    const x=-TRAVEL+2*TRAVEL*i/(vals.length-1);
    if(!isFinite(vals[i])) { st=false; continue; }
    const px=X(x),py=Y(vals[i]);
    if(!st){g.moveTo(px,py);st=true;} else g.lineTo(px,py);
  }
  g.stroke();
  /* 当前点 */
  if(isFinite(cur)){
    const px=X(S.pad),py=Y(cur);
    g.strokeStyle="#c0272d"; g.lineWidth=1; g.setLineDash([3,3]);
    g.beginPath(); g.moveTo(px,P.t); g.lineTo(px,h-P.b); g.stroke(); g.setLineDash([]);
    g.fillStyle="#c0272d"; g.fillRect(px-3,py-3,6,6);
  }
  /* 刻度 */
  g.fillStyle="#7d8892"; g.font='15px Consolas,monospace'; g.textBaseline="middle";
  g.textAlign="right";
  g.fillText(mx.toFixed(mx>99?0:2),P.l-4,P.t+4);
  g.fillText(mn.toFixed(mn>99||mn<-99?0:2),P.l-4,h-P.b-4);
  g.textAlign="center"; g.textBaseline="top";
  g.fillText("-"+TRAVEL,P.l,h-P.b+4);
  g.fillText("0",(P.l+w-P.r)/2,h-P.b+4);
  g.fillText("+"+TRAVEL,w-P.r-8,h-P.b+4);
  g.textAlign="left"; g.fillText("回弹",P.l+2,h-P.b+4);
}

/* ------------------------------ 硬点编辑器 ------------------------------ */
const HPROWS=[
 ["sec","下横臂 LOWER ARM"],
 ["Lf","前支点 Lf"],["Lr","后支点 Lr"],["Lo","下球头 Lo"],
 ["sec","上横臂 UPPER ARM"],
 ["Uf","前支点 Uf"],["Ur","后支点 Ur"],["Uo","上球头 Uo"],
 ["sec","转向节 KNUCKLE"],
 ["W","轮心 W"],["To","拉杆外点 To"],
 ["sec","转向器 STEERING"],
 ["Ti","齿条端 Ti"],
 ["sec","弹性元件 SPRING"],
 ["Sl","下座 Sl(随臂)"],["Su","上座 Su(车身)"],
 ["sec","稳定杆 ANTI-ROLL BAR"],
 ["Ac","杆轴心 Ac"],["Ae","摆臂端 Ae"],["Al","连杆下点 Al"]
];
const PRMROWS=[
 ["wheelR","轮胎半径","mm"],["tireW","轮胎宽度","mm"],["rimR","轮辋半径","mm"],
 ["kSpring","弹簧刚度","N/mm"],["cBump","压缩阻尼","N·s/mm"],["cReb","复原阻尼","N·s/mm"],
 ["hcg","质心高度","mm"],["lcg","质心距前轴","mm"],["kt","稳定杆刚度","N·m/deg"]
];
function buildHP(){
  const w=document.getElementById("hpWrap");
  let h='<table class="hp"><tr><th></th><th>X</th><th>Y</th><th>Z</th></tr>';
  HPROWS.forEach(rw=>{
    if(rw[0]==="sec"){ h+='<tr class="sec"><td colspan="4">'+rw[1]+'</td></tr>'; return; }
    const p=HP[rw[0]];
    h+='<tr><td class="n">'+rw[1]+'</td>'+
       ["x","y","z"].map(a=>'<td><input data-hp="'+rw[0]+'" data-a="'+a+'" value="'+p[a].toFixed(0)+'"></td>').join("")+
       '</tr>';
  });
  h+='<tr class="sec"><td colspan="4">全局参数 PARAMETERS</td></tr>';
  PRMROWS.forEach(rw=>{
    h+='<tr><td class="n">'+rw[1]+'</td><td colspan="3"><input data-prm="'+rw[0]+'" value="'+PRM[rw[0]]+'"></td></tr>';
  });
  h+="</table>";
  w.innerHTML=h;
  w.onchange=e=>{
    const k=e.target.getAttribute("data-hp"), a=e.target.getAttribute("data-a"), pk=e.target.getAttribute("data-prm");
    let v=parseFloat(e.target.value);
    if(!isFinite(v)){ buildHP(); return; }
    if(k){ HP[k][a]=v; rebuild(); PREV=null; SWEEPKEY=""; doSweep(); }
    if(pk){ PRM[pk]=v; rebuild(); PREV=null; SWEEPKEY=""; doSweep(); }
  };
}

/* ------------------------------ 动画模式 ------------------------------ */
let MODE="idle", MT=0;
const modeName={idle:"静止",bounce:"轮跳",steer:"转向",roll:"侧倾",drive:"路面行驶",knc:"K&C扫描"};

function stepAnim(dt){
  if(MODE==="idle") return;
  MT+=dt*parseFloat(document.getElementById("sRate").value);
  const A=Math.min(70,42+PRM.wheelR*0.06);
  if(MODE==="bounce"){
    S.pad=A*Math.sin(MT*1.6);
    S.steer=0; S.roll=0;
  }else if(MODE==="steer"){
    S.steer=32*D2R*Math.sin(MT*0.85);
    S.pad=0; S.roll=0;
  }else if(MODE==="roll"){
    S.roll=5*D2R*Math.sin(MT*0.9);
    S.pad=0; S.steer=0;
  }else if(MODE==="drive"){
    const v=parseFloat(document.getElementById("sSpd").value)/3.6*1000; // mm/s
    S.dist+=v*dt;
    S.spin+=v*dt/PRM.wheelR;
    S.pad=16*Math.sin(S.dist/2400)+7*Math.sin(S.dist/830+1.1)+3.5*Math.sin(S.dist/317+2.3);
    S.steer=(14*D2R)*Math.sin(MT*0.42)+6*D2R*Math.sin(MT*1.13);
    S.roll=(2.6*D2R)*Math.sin(MT*0.42+1.4);
  }else if(MODE==="knc"){
    S.pad=-TRAVEL+((MT*46)%(2*TRAVEL));
    S.steer=0; S.roll=0;
  }
  syncSliders();
}

/* ------------------------------ 主循环 ------------------------------ */
let lastT=performance.now(), fps=0, fpsN=0, fpsT=0;
let R=null, prevPad=0, prevT=0;
function frame(now){
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  stepAnim(dt);
  updateCam();

  const r=solvePose(S.pad,S.steer,S.roll);
  if(r){
    PREV=r; R=r;
    doSweep();
    /* 杠杆比 / 轮跳刚度 / 阻尼力 (数值微分) */
    const e=1.0;
    const A=solvePose(S.pad-e,S.steer,S.roll), B=solvePose(S.pad+e,S.steer,S.roll);
    if(A&&B){
      const mr=Math.abs((A.m.slen-B.m.slen)/(2*e));              // 弹簧杠杆比
      const dw=Math.abs((A.arbA||0)-(B.arbA||0))/(2*e);          // 稳定杆臂角速度 rad/mm
      r.m.mr=mr;
      r.m.karb=PRM.kt*1000*RAD*dw*0.268/DEF.armL;                // 稳定杆附加线刚度估算 N/mm
      r.m.kw=PRM.kSpring*mr*mr+(r.m.karb||0);                    // 轮跳刚度
    }else{ r.m.mr=0.65; r.m.kw=PRM.kSpring*0.4225; r.m.karb=0; }
    const vw=(S.pad-prevPad)/Math.max(dt,1e-3);                   // mm/s
    r.m.vw=vw;
    const vd=vw*r.m.mr;
    r.m.Fdamp = vd>0 ? PRM.cBump*vd : PRM.cReb*vd;
    prevPad=S.pad;

    /* 渲染 */
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle="#fbfcfd"; ctx.fillRect(0,0,W,H);
    DL=[];
    const F=r.F;
    drawGround(); drawBody(F);
    drawTrace(r);
    drawARB(F,r);
    drawSpringDamper(F,r);
    drawArms(F,r);
    drawSteer(F,r);
    drawKnuckle(F,r);
    drawWheel(r);
    drawKingpin(F,r);
    drawIC(F,r);
    drawDims(F,r);
    flush();
    drawAxisHud();
    updateMet(r);
    CHDEF.forEach((d,i)=>{
      const vals=SWEEP.map(d.f), cur=d.f(r);
      drawChart(CHCV[i],vals,cur);
    });
    document.getElementById("stIter").textContent=LASTIT;
    document.getElementById("stPad").textContent=S.pad.toFixed(1);
    document.getElementById("stSteer").textContent=(S.steer*RAD).toFixed(1);
    document.getElementById("stRoll").textContent=(S.roll*RAD).toFixed(2);
    document.getElementById("stRack").textContent=r.rack.toFixed(1);
  }
  fpsN++; fpsT+=dt;
  if(fpsT>0.5){ fps=Math.round(fpsN/fpsT); fpsN=0; fpsT=0;
    document.getElementById("bgFps").textContent=fps+" FPS"; }
  requestAnimationFrame(frame);
}

function drawAxisHud(){
  const e=document.getElementById("hudAxis");
  const o=V(-560,60,60);
  const ax=[["X",V(160,0,0),"#b3261e"],["Y",V(0,160,0),"#0f7b46"],["Z",V(0,0,160),"#0b5fa5"]];
  e.innerHTML="";
  ax.forEach(a=>{
    const p1=project(o),p2=project(add(o,a[1]));
    push(-1e9,()=>{
      ctx.save(); ctx.strokeStyle=a[2]; ctx.lineWidth=1.6;
      ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
      ctx.fillStyle=a[2]; ctx.font='11px Consolas,monospace';
      ctx.fillText(a[0],p2.x+3,p2.y+3); ctx.restore();
    });
  });
  flush();
}

/* ------------------------------ UI 绑定 ------------------------------ */
function syncSliders(){
  document.getElementById("sPad").value=S.pad;
  document.getElementById("vPad").textContent=S.pad.toFixed(1);
  document.getElementById("sSteer").value=(S.steer*RAD).toFixed(1);
  document.getElementById("vSteer").textContent=(S.steer*RAD).toFixed(1);
  document.getElementById("sRoll").value=(S.roll*RAD).toFixed(2);
  document.getElementById("vRoll").textContent=(S.roll*RAD).toFixed(2);
}
function bindUI(){
  document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>setView(b.dataset.view));
  document.getElementById("btnFit").onclick=()=>{updateCam();fitView();};
  document.getElementById("btnResetAll").onclick=()=>{
    MODE="idle"; MT=0; S.pad=0;S.steer=0;S.roll=0;S.spin=0;S.dist=0;
    document.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("on",x.dataset.mode==="idle"));
    cam.yaw=62*D2R;cam.pitch=20*D2R;cam.override=null;updateCam();fitView();
    syncSliders(); PREV=null;
    document.getElementById("bgMode").textContent=modeName.idle;
  };
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{
    MODE=b.dataset.mode; MT=0;
    document.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("on",x===b));
    document.getElementById("bgMode").textContent=modeName[MODE];
    document.getElementById("bgMode").classList.toggle("on",MODE!=="idle");
  });
  document.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>{
    document.querySelectorAll("[data-preset]").forEach(x=>x.classList.toggle("on",x===b));
    applyPreset(b.dataset.preset); buildHP(); PREV=null; SWEEPKEY=""; doSweep();
    document.getElementById("stMsg").textContent="已载入: "+PRESETS[b.dataset.preset].name;
  });
  document.getElementById("btnOptTie").onclick=()=>{
    document.getElementById("stMsg").textContent="正在优化转向拉杆内点...";
    setTimeout(optimizeTie,20);
  };
  const s=(id,fn)=>{const el=document.getElementById(id);el.addEventListener("input",()=>{
    const v=parseFloat(el.value); fn(v);
    MODE="idle"; document.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("on",x.dataset.mode==="idle"));
    document.getElementById("bgMode").textContent=modeName.idle;
    document.getElementById("bgMode").classList.remove("on");
  });};
  s("sPad",v=>{S.pad=v;document.getElementById("vPad").textContent=v.toFixed(1);});
  s("sSteer",v=>{S.steer=v*D2R;document.getElementById("vSteer").textContent=v.toFixed(1);});
  s("sRoll",v=>{S.roll=v*D2R;document.getElementById("vRoll").textContent=v.toFixed(2);});
  document.getElementById("sSpd").addEventListener("input",e=>{
    document.getElementById("vSpd").textContent=e.target.value;});
  document.getElementById("sRate").addEventListener("input",e=>{
    document.getElementById("vRate").textContent=parseFloat(e.target.value).toFixed(2);});

  /* 鼠标交互 */
  let drag=null;
  cv.addEventListener("mousedown",e=>{
    drag={x:e.clientX,y:e.clientY,b:e.button,yaw:cam.yaw,pitch:cam.pitch,tx:cam.tx,ty:cam.ty,tz:cam.tz};
    cv.classList.add("drag");
    if(e.button!==0) e.preventDefault();
  });
  window.addEventListener("mousemove",e=>{
    if(!drag) return;
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(drag.b===0){
      cam.yaw=drag.yaw-dx*0.006;
      cam.pitch=clamp(drag.pitch+dy*0.006,-1.553,1.553);
      cam.override=null;
      VIEWNAME="自定义"; document.getElementById("viewName").textContent=VIEWNAME;
    }else{
      const k=1/cam.scale;
      const mx=V(-cam.right.x*k,-cam.right.y*k,-cam.right.z*k);
      const my=V(cam.up.x*k,cam.up.y*k,cam.up.z*k);
      cam.tx=drag.tx+mx.x*dx+my.x*dy;
      cam.ty=drag.ty+mx.y*dx+my.y*dy;
      cam.tz=drag.tz+mx.z*dx+my.z*dy;
    }
    CT.x=cam.tx;CT.y=cam.ty;CT.z=cam.tz;
    updateCam();
  });
  window.addEventListener("mouseup",()=>{drag=null;cv.classList.remove("drag");});
  cv.addEventListener("contextmenu",e=>e.preventDefault());
  cv.addEventListener("wheel",e=>{
    e.preventDefault();
    cam.scale=clamp(cam.scale*(e.deltaY<0?1.12:1/1.12),0.12,4.5);
  },{passive:false});
  cv.addEventListener("dblclick",()=>setView("iso"));
}

/* 转向拉杆内点优化: 最小化跳动转向 RMS */
function optimizeTie(){
  const base={x:HP.Ti.x,y:HP.Ti.y,z:HP.Ti.z};
  let best={e:Infinity,p:base};
  const test=(x,z)=>{
    HP.Ti=V(x,base.y,z);
    DEF.dTR=dst(HP.To,HP.Ti);
    PREV=null; SWEEPKEY="";
    const pts=[];
    for(let i=0;i<=8;i++){
      const p=-60+15*i;
      const r=solvePose(p,0,0);
      if(!r) return Infinity;
      pts.push(r.m.toe*RAD);
    }
    const m=pts.reduce((a,b)=>a+b,0)/pts.length;
    return Math.sqrt(pts.reduce((a,b)=>a+(b-m)*(b-m),0)/pts.length);
  };
  let step=40;
  let cx=base.x, cz=base.z, ce=test(cx,cz);
  for(let it=0;it<7;it++){
    let improved=false;
    for(const [dx,dz] of [[step,0],[-step,0],[0,step],[0,-step],[step,step],[step,-step],[-step,step],[-step,-step]]){
      const e=test(cx+dx,cz+dz);
      if(e<ce-1e-6){ ce=e; cx+=dx; cz+=dz; improved=true; }
    }
    if(!improved) step*=0.5;
    if(step<0.4) break;
  }
  HP.Ti=V(cx,base.y,cz);
  DEF.dTR=dst(HP.To,HP.Ti);
  rebuild(); buildHP(); PREV=null; SWEEPKEY=""; doSweep();
  document.getElementById("stMsg").textContent=
    "优化完成: Ti=("+cx.toFixed(1)+", "+base.y.toFixed(0)+", "+cz.toFixed(1)+")  残余跳动转向 RMS="+ce.toFixed(3)+"°";
}
