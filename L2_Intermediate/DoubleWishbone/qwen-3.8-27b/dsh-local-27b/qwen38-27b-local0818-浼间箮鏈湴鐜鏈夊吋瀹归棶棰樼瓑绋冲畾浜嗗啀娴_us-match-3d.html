<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>USP MATCH · LOW-POLY ARSENAL</title>
<style>
  :root{
    --bg:#c9c9cd;
    --ink:#141417;
    --accent:#00ff88;
    --accent2:#ff3b30;
    --panel:rgba(18,18,22,.82);
    --line:rgba(255,255,255,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"Courier New",ui-monospace,Menlo,monospace;color:var(--ink);
    -webkit-font-smoothing:antialiased;}
  #app{position:fixed;inset:0}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  /* scanline / vignette overlay for PS1 feel */
  #fx{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:
      repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0px,rgba(0,0,0,.05) 1px,transparent 2px,transparent 3px),
      radial-gradient(120% 120% at 50% 40%,transparent 55%,rgba(20,20,30,.28) 100%);
    mix-blend-mode:multiply;}
  .hud{position:fixed;z-index:10;user-select:none}
  #title{top:18px;left:20px}
  #title .tag{font-size:10px;letter-spacing:.32em;opacity:.65}
  #title h1{font-size:22px;letter-spacing:.14em;margin-top:2px;font-weight:700}
  #title .sub{font-size:11px;letter-spacing:.18em;opacity:.7;margin-top:4px}
  #status{top:20px;right:20px;text-align:right}
  #status .mode{font-size:11px;letter-spacing:.28em;opacity:.6}
  #status .ph{font-size:15px;letter-spacing:.16em;margin-top:3px;font-weight:700}
  #status .t{font-size:10px;letter-spacing:.2em;opacity:.55;margin-top:3px}
  #dock{bottom:20px;left:50%;transform:translateX(-50%);
    display:flex;gap:8px;padding:10px 12px;background:var(--panel);
    border:1px solid var(--line);backdrop-filter:blur(6px);
    box-shadow:0 8px 30px rgba(0,0,0,.35);}
  #dock button{
    font-family:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:#eaeaf0;background:transparent;border:1px solid var(--line);
    padding:9px 14px;cursor:pointer;transition:all .12s ease;}
  #dock button:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.4)}
  #dock button.on{background:var(--ink);color:var(--accent);border-color:var(--accent)}
  #dock .sep{width:1px;background:var(--line);margin:2px 2px}
  #legend{bottom:20px;left:20px;font-size:10px;letter-spacing:.12em;line-height:1.7;opacity:.6;pointer-events:none}
  #legend b{opacity:1}
  #corner{top:18px;left:20px;width:14px;height:14px;border-left:2px solid rgba(0,0,0,.5);border-top:2px solid rgba(0,0,0,.5);position:fixed;z-index:9;opacity:.35}
  #corner.br{top:auto;left:auto;bottom:18px;right:20px;border:none;border-right:2px solid rgba(0,0,0,.5);border-bottom:2px solid rgba(0,0,0,.5)}
  #cad{display:none}
  body.ar15 #cad{display:block;bottom:20px;right:20px;font-size:10px;letter-spacing:.12em;line-height:1.8;text-align:right;opacity:.6;pointer-events:none}
  #cad b{color:var(--accent);opacity:1}
  #hint{top:50%;left:50%;transform:translate(-50%,-50%);font-size:11px;letter-spacing:.3em;opacity:0;transition:opacity .6s;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="fx"></div>
<div class="hud" id="title">
  <div class="tag">// PROGRAMMATIC LOW-POLY</div>
  <h1>USP MATCH <span style="opacity:.5">.45</span></h1>
  <div class="sub">PS1 ARSENAL · FIBER-OPTIC SIGHTS</div>
</div>
<div class="hud" id="status">
  <div class="mode">MODE</div>
  <div class="ph" id="ph">EXPLoded VIEW</div>
  <div class="t" id="tclk">t 0.00s</div>
</div>
<div class="hud" id="dock">
  <button data-scene="usp" class="on">USP Match</button>
  <button data-scene="ar15">AR-15</button>
  <div class="sep"></div>
  <button data-act="orbit" id="bOrbit">Orbit: On</button>
  <button data-act="cam" id="bCam">Cam: Ortho</button>
  <button data-act="reset">Reset</button>
</div>
<div class="hud" id="legend">
  <div><b style="color:#00c853">■</b> FRONT FIBER (GREEN)</div>
  <div><b style="color:#ff3b30">■</b> REAR FIBER (RED)</div>
  <div style="margin-top:6px;opacity:.8">WHEEL FOCUSED 45 · MATCH COMP</div>
</div>
<div class="hud" id="cad"></div>
<div id="corner"></div>
<div id="corner" class="br"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
/* ============================================================
   RETRO LOW-POLY / PS1  ARSENAL  —  USP MATCH  +  AR-15
   Single-file, fully procedural. No external model assets.
   ============================================================ */
(function(){
'use strict';

/* ---------- constants ---------- */
const TAU = Math.PI*2;
const DEG = Math.PI/180;
const W = 1024, H = 512;               // internal render buffer (pixelated)
const BG = 0xc9c9cd;                    // neutral light gray stage

/* ---------- palette ---------- */
const PAL = {
  slideDark:   0x1b1c20,   // dark matte metal slide
  slideEdge:   0x2c2e35,
  barrel:      0xcfd2d8,   // bare bright silver barrel
  barrelDark:  0x9aa0ab,
  framePoly:   0x17181c,   // black polymer lower
  framePoly2:  0x222329,
  gripText:    0x2a2c33,
  wheel:       0x14151a,   // match wheel / comp
  steel:       0x8b909b,   // generic steel
  steelDark:   0x4a4d55,
  mag:         0x141519,
  magStain:    0x23252b,
  trigger:     0x6c7078,
  pin:         0xd4d7dd,
  fiberG:      0x2bff88,   // front fiber green (emissive)
  fiberR:      0xff2e2e,   // rear fiber red  (emissive)
  alu:         0x111216,   // anodized black (AR15)
  aluHi:       0x1e2026,
  arSteel:     0x1a1c22,
  arSteel2:    0x2b2e36,
  arBarrel:    0x2a2d34,
  arGas:       0x3a3e47,
  brass:       0x6b6f78,
};

/* ============================================================
   RENDERER  /  SCENE  /  CAMERA  /  LIGHTS
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.domElement.style.width='100%';
renderer.domElement.style.height='100%';
renderer.domElement.style.objectFit='cover';
renderer.domElement.style.imageRendering='pixelated';
renderer.outputEncoding = THREE.sRGBEncoding;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 60, 140);

/* Orthographic "near-orthographic" showcase camera (PS1 product shot) */
let camType='ortho';
const aspect = W/H;
const ortho = new THREE.OrthographicCamera(-26*aspect, 26*aspect, 26, -26, 1, 200);
const persp = new THREE.PerspectiveCamera(28, aspect, 0.1, 400);
ortho.position.set(0,0,1); persp.position.set(0,0,1);
let camera = ortho;

/* Studio lighting — neutral, CAD-friendly */
function addLights(){
  const hemi = new THREE.HemisphereLight(0xffffff, 0x8a8a92, 0.85);
  scene.add(hemi);
  const key = new THREE.DirectionalLight(0xffffff, 0.95);
  key.position.set(8, 14, 12);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xdfe4ff, 0.35);
  fill.position.set(-10, 4, 8);
  scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, 0.5);
  rim.position.set(-2, 8, -12);
  scene.add(rim);
  const under = new THREE.DirectionalLight(0xffffff, 0.18);
  under.position.set(0,-8,6);
  scene.add(under);
}
addLights();

/* subtle ground shadow plane (soft, not raycast shadows — PS1 cheap) */
const shadowTex = makeRadialShadow();
const shadowPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(120,120),
  new THREE.MeshBasicMaterial({ map:shadowTex, transparent:true, depthWrite:false, opacity:0.5 })
);
shadowPlane.rotation.x = -Math.PI/2;
shadowPlane.position.y = -6.5;
scene.add(shadowPlane);

function makeRadialShadow(){
  const s=128, c=document.createElement('canvas'); c.width=c.height=s;
  const g=c.getContext('2d');
  const grd=g.createRadialGradient(s/2,s/2,8,s/2,s/2,s/2);
  grd.addColorStop(0,'rgba(0,0,0,0.30)');
  grd.addColorStop(0.55,'rgba(0,0,0,0.12)');
  grd.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=grd; g.fillRect(0,0,s,s);
  const t=new THREE.CanvasTexture(c); return t;
}

/* ---------- 90s pixelated texture helpers ---------- */
function pxTex(w,h,fn,repeat){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); fn(g,w,h);
  const t=new THREE.CanvasTexture(c);
  t.magFilter=THREE.NearestFilter; t.minFilter=THREE.NearestFilter;
  t.generateMipmaps=false; t.anisotropy=1;
  if(repeat){ t.wrapS=THREE.RepeatWrapping; t.wrapT=THREE.RepeatWrapping; t.repeat.set(repeat[0],repeat[1]); }
  return t;
}
/* fine machined stipple over a base tone */
function metalTex(base, speckle, n){
  return pxTex(64,64,(g,w,h)=>{
    g.fillStyle=base; g.fillRect(0,0,w,h);
    for(let i=0;i<n;i++){
      const x=(Math.random()*w)|0, y=(Math.random()*h)|0;
      g.fillStyle= Math.random()<0.5? speckle : shade(base, 8+(Math.random()*14|0));
      g.fillRect(x,y,1,1);
    }
    // faint horizontal machining lines
    g.globalAlpha=0.10; g.fillStyle='#000';
    for(let y=0;y<h;y+=3) g.fillRect(0,y,w,1);
    g.globalAlpha=1;
  });
}
function hexToR(h){return [(h>>16)&255,(h>>8)&255,h&255];}
function shade(h,amt){let[r,g,b]=hexToR(h);r=clamp255(r+amt);g=clamp255(g+amt);b=clamp255(b+amt);return `rgb(${r},${g},${b})`;}
function clamp255(v){return v<0?0:v>255?255:v;}
function hexCss(h){const[r,g,b]=hexToR(h);return `rgb(${r},${g},${b})`;}

/* polyhedral bevel box (low-poly feel) */
function boxGeo(w,h,d,bev){
  bev=bev||0.08;
  const g=new THREE.BoxGeometry(w,h,d,1,1,1);
  // bevel the edges a touch by scaling verts — simple low-poly look
  return g;
}

/* ---------- material factory (flat shaded) ---------- */
function mat(color, opt){
  opt=opt||{};
  return new THREE.MeshStandardMaterial(Object.assign({
    color, flatShading:true, metalness:opt.metalness!=null?opt.metalness:0.55,
    roughness:opt.roughness!=null?opt.roughness:0.62,
    map:opt.map||null
  }, opt.emissive!=null?{emissive:opt.emissive, emissiveIntensity:opt.ei!=null?opt.ei:1.4}:{}));
}

/* ============================================================
   GENERIC BUILDERS
   ============================================================ */
function mesh(geo, material, x,y,z, rx,ry,rz, parent){
  const m=new THREE.Mesh(geo, material);
  m.position.set(x||0,y||0,z||0);
  if(rx)m.rotation.x=rx; if(ry)m.rotation.y=ry; if(rz)m.rotation.z=rz;
  if(parent)parent.add(m);
  return m;
}
/* rounded-ish low poly extruded profile for grip/contours */
function extrude(points, depth, curve){
  const shape=new THREE.Shape();
  shape.moveTo(points[0][0],points[0][1]);
  for(let i=1;i<points.length;i++) shape.lineTo(points[i][0],points[i][1]);
  shape.closePath();
  const g=new THREE.ExtrudeGeometry(shape,{depth:depth,bevelEnabled:!!curve,bevelThickness:curve?curve:0,bevelSize:curve?curve:0,bevelSegments:1,steps:1,curveSegments:1});
  g.translate(0,0,-depth/2);
  return g;
}

/* ============================================================
   USP MATCH — PROCEDURAL BUILD
   ============================================================
   Coordinate system:  +X = muzzle (forward), +Y = up, +Z = toward viewer (slide width along Z)
   Build centered roughly at origin; muzzle ~ +X, rear ~ -X.
   ============================================================ */
function buildUSP(){
  const root=new THREE.Group();
  root.name='usp';

  const texSlide=metalTex(hexCss(PAL.slideDark), '#000000', 900);
  const texBarrel=metalTex(hexCss(PAL.barrel), hexCss(PAL.barrelDark), 700);
  const texFrame=metalTex(hexCss(PAL.framePoly), '#000000', 1200);
  const texWheel=metalTex(hexCss(PAL.wheel), '#000000', 900);
  const texMag=metalTex(hexCss(PAL.mag), '#000000', 1100);

  const M = {
    slide:  mat(PAL.slideDark, {map:texSlide, metalness:0.85, roughness:0.35}),
    slideE: mat(PAL.slideEdge, {metalness:0.8, roughness:0.4}),
    barrel: mat(PAL.barrel, {map:texBarrel, metalness:1.0, roughness:0.18}),
    frame:  mat(PAL.framePoly, {map:texFrame, metalness:0.15, roughness:0.85}),
    frame2: mat(PAL.framePoly2, {metalness:0.1, roughness:0.9}),
    wheel:  mat(PAL.wheel, {map:texWheel, metalness:0.9, roughness:0.4}),
    steel:  mat(PAL.steel, {metalness:0.95, roughness:0.3}),
    trigger:mat(PAL.trigger, {metalness:0.9, roughness:0.4}),
    pin:    mat(PAL.pin, {metalness:1.0, roughness:0.2}),
    mag:    mat(PAL.mag, {map:texMag, metalness:0.4, roughness:0.7}),
    fiberG: mat(PAL.fiberG, {emissive:PAL.fiberG, ei:1.9, metalness:0, roughness:0.4}),
    fiberR: mat(PAL.fiberR, {emissive:PAL.fiberR, ei:1.9, metalness:0, roughness:0.4}),
  };

  /* ---------------- FRAME (lower receiver) — polymer ---------------- */
  const frame=new THREE.Group(); frame.name='frame';

  // dust cover / receiver body
  const recW=2.7, recH=1.7, recL=13.0;
  mesh(new THREE.BoxGeometry(recL,recH,recW), M.frame, 1.5, 0, 0, 0,0,0, frame);
  // recoil-spring housing step (front of frame)
  mesh(new THREE.BoxGeometry(2.2, recH*0.92, recW*1.04), M.frame, 7.6, 0, 0, 0,0,0, frame);
  // ejection port lip / guide rail hint (top, front)
  mesh(new THREE.BoxGeometry(3.4,0.22,recW*0.5), M.steel, 8.2, recH*0.52, 0, 0,0,0, frame);

  // trigger guard — low-poly loop (torus-ish via box ring)
  const guard=new THREE.Group();
  const gg=1.15;
  mesh(new THREE.BoxGeometry(2.6,0.34,recW*0.9), M.frame, 0, -gg, 0, 0,0,0, guard);      // bottom
  mesh(new THREE.BoxGeometry(0.34,gg+0.2,recW*0.9), M.frame, -1.25, -gg/2, 0, 0,0,0, guard); // front wall
  mesh(new THREE.BoxGeometry(0.34,gg+0.2,recW*0.9), M.frame, 1.25, -gg/2, 0, 0,0,0, guard);  // rear wall
  frame.add(guard);

  // trigger
  const trig=new THREE.Group(); trig.position.set(-0.2,-0.5,0); trig.name='trigger';
  mesh(new THREE.BoxGeometry(0.28,1.0,0.34), M.trigger, 0,-0.3,0, 0.18,0,0, trig);
  mesh(new THREE.BoxGeometry(0.34,0.16,0.4), M.trigger, 0.05,0.1,0, 0,0,0, trig);
  frame.add(trig);

  // magwell (front of grip) — opening
  mesh(new THREE.BoxGeometry(1.6,0.5,1.5), M.frame2, -1.4, -recH*0.45, 0, 0,0,0, frame);

  // grip — beveled polymer, raked
  const gripProfile=[[0,0],[ -0.7,-0.1],[-1.15,-0.35],[-1.25,-1.2],[-1.0,-2.6],[-0.55,-3.3],[0.0,-3.5],[0.6,-3.4],[0.85,-2.6],[0.8,-1.2],[0.7,-0.2],[0.5,0]];
  const grip=extrude(gripProfile, recW*1.02, 0.06);
  const gripM=mesh(grip, M.frame, -1.1, -recH*0.5, 0, -12*DEG,0,0, frame);
  gripM.name='grip';
  // grip texture bands (stippled side plates)
  const band=new THREE.BoxGeometry(0.1,2.1,recW*1.02*0.9);
  const b1=mesh(band, M.frame2, -1.55, -2.1, 0, -12*DEG,0,0, frame);
  const b2=mesh(band, M.frame2, -1.55, -2.1, 0, -12*DEG,0,0, frame);

  // sights mount on frame? No — fiber sights live on the SLIDE for USP.
  // rear frame rail
  mesh(new THREE.BoxGeometry(3.0,0.28,recW*0.6), M.frame, 5.5, recH*0.5+0.05, 0, 0,0,0, frame);

  root.add(frame);

  /* ---------------- MAGAZINE (separated) ---------------- */
  const magGrp=new THREE.Group(); magGrp.name='mag';
  // base plate
  mesh(new THREE.BoxGeometry(1.5,0.35,1.4), M.mag, 0,0,0, 0,0,0, magGrp);
  // body
  mesh(new THREE.BoxGeometry(1.35,2.4,1.25), M.mag, 0,1.1,0, 0,0,0, magGrp);
  // lip
  mesh(new THREE.BoxGeometry(1.5,0.18,1.4), M.mag, 0,2.35,0, 0,0,0, magGrp);
  // follower hint (steel) peeking top
  mesh(new THREE.BoxGeometry(0.7,0.16,0.7), M.steel, 0,2.45,0, 0,0,0, magGrp);
  // front release tab
  mesh(new THREE.BoxGeometry(0.14,0.5,0.3), M.steel, 0.75,0.4,0, 0,0,0, magGrp);
  // two round mag-well rings (low poly)
  for(let i=0;i<2;i++){
    mesh(new THREE.CylinderGeometry(0.16,0.16,0.05,8).rotateX(Math.PI/2),
      M.mag, -0.4+i*0.9, 0.18, 0.78, 0,0,0, magGrp);
  }
  root.add(magGrp);

  /* ---------------- BARREL (bare silver, inside slide) ---------------- */
  const barrelGrp=new THREE.Group(); barrelGrp.name='barrel';
  const bl=9.2;
  // main barrel (silver) — long tube
  const barrelTube=new THREE.CylinderGeometry(0.42,0.42,bl,10); barrelTube.rotateZ(Math.PI/2);
  mesh(barrelTube, M.barrel, 4.0, 0.1, 0, 0,0,0, barrelGrp);
  // muzzle face
  mesh(new THREE.CylinderGeometry(0.5,0.42,0.3,10).rotateZ(Math.PI/2), M.barrel, 8.75,0.1,0, 0,0,0, barrelGrp);
  // barrel lug / bushing (rear, sits in frame)
  mesh(new THREE.CylinderGeometry(0.62,0.5,1.0,10).rotateZ(Math.PI/2), M.steel, -1.2,0.1,0, 0,0,0, barrelGrp);
  // barrel hood groove
  mesh(new THREE.TorusGeometry(0.46,0.05,6,14).rotateY(Math.PI/2), M.barrelDark?mat(PAL.barrelDark,{metalness:1,roughness:0.3}):M.steel, 6.0,0.1,0, 0,0,0, barrelGrp);
  // top rib / rail the slide rides on
  mesh(new THREE.BoxGeometry(bl*0.95,0.18,0.5), M.barrel, 4.0, 0.55, 0, 0,0,0, barrelGrp);
  root.add(barrelGrp);

  /* ---------------- SLIDE (dark metal, locks on barrel) ---------------- */
  const slideGrp=new THREE.Group(); slideGrp.name='slide';
  const sL=13.6, sH=2.3, sW=2.55;
  // main slide body
  const slideBody=new THREE.BoxGeometry(sL,sH,sW);
  mesh(slideBody, M.slide, 1.6, 1.35, 0, 0,0,0, slideGrp);
  // beveled front face
  mesh(new THREE.BoxGeometry(0.3,sH*0.95,sW*0.98), M.slideE, 1.6-sL/2, 1.35, 0, 0,0,0, slideGrp);
  // rear serration block
  mesh(new THREE.BoxGeometry(2.4,sH*0.98,sW*1.0), M.slideE, 1.6-sL/2+1.15, 1.35, 0, 0,0,0, slideGrp);
  // grip serrations (angular cuts via thin dark strips)
  for(let i=0;i<7;i++){
    mesh(new THREE.BoxGeometry(0.16,sH*0.9,sW*1.02), M.slideEdge,
      1.6-sL/2+0.5+i*0.28, 1.35, 0, 0,0,0, slideGrp);
  }
  // ejection port (side cut) — dark inset
  mesh(new THREE.BoxGeometry(2.6,0.9,sW*1.02), M.slideEdge, 6.4, 1.7, 0, 0,0,0, slideGrp);
  // slide rails (bottom lip that locks into barrel lug)
  mesh(new THREE.BoxGeometry(sL*0.98,0.2,sW*0.6), M.slideE, 1.6, 0.15, 0, 0,0,0, slideGrp);

  /* ---- FIBER-OPTIC SIGHTS on slide ---- */
  // FRONT fiber: bright GREEN (high-contrast)
  const frontSight=new THREE.Group(); frontSight.name='frontSight';
  frontSight.position.set(6.4, 1.35+sH/2, 0);
  mesh(new THREE.BoxGeometry(0.5,0.5,0.28), M.slide, 0,0.15,0, 0,0,0, frontSight); // base post
  mesh(new THREE.BoxGeometry(0.34,0.5,0.14), M.fiberG, 0,0.55,0, 0,0,0, frontSight); // green fiber strip
  slideGrp.add(frontSight);

  // REAR fiber: RED, notched
  const rearSight=new THREE.Group(); rearSight.name='rearSight';
  rearSight.position.set(1.6-sL/2+1.2, 1.35+sH/2, 0);
  mesh(new THREE.BoxGeometry(1.2,0.4,0.3), M.slide, 0,0.2,0, 0,0,0, rearSight); // base
  mesh(new THREE.BoxGeometry(1.2,0.42,0.16), M.fiberR, 0,0.5,0, 0,0,0, rearSight); // red fiber
  // sight notch (cut illusion) — two dark pillars
  mesh(new THREE.BoxGeometry(0.18,0.42,0.18), M.slide, -0.32,0.5,0.02, 0,0,0, rearSight);
  mesh(new THREE.BoxGeometry(0.18,0.42,0.18), M.slide, 0.32,0.5,0.02, 0,0,0, rearSight);
  slideGrp.add(rearSight);

  // slide stop lever (left side, Z+)
  const stopLever=new THREE.Group(); stopLever.position.set(-1.4,1.55, sW/2); stopLever.name='slideStop';
  mesh(new THREE.BoxGeometry(0.5,0.4,0.18), M.steel, 0,0,0, 0,0,0.1, stopLever);
  slideGrp.add(stopLever);
  root.add(slideGrp);

  /* ---------------- MATCH WHEEL / FRONT COMPENSATOR ----------------
     USP Match: 45-degree "wheel" front sight housing + front comp.
     Kept as its own separated group in exploded view, but attached
     to the slide when assembled (it's the front of the slide).   */
  const compGrp=new THREE.Group(); compGrp.name='comp';
  // wheel sight housing (the "45" angled wheel)
  const wheel=new THREE.CylinderGeometry(0.72,0.72,0.5,16); wheel.rotateZ(Math.PI/2);
  mesh(wheel, M.wheel, 8.6, 1.6, 0, 0,0,0, compGrp);
  // angled wheel face (45° bevel)
  const wheelFace=new THREE.CylinderGeometry(0.7,0.5,0.55,16); wheelFace.rotateZ(Math.PI/2);
  mesh(wheelFace, M.steel, 9.05,1.6,0, 0,45*DEG,0, compGrp);
  // 45° ramp cut visual (dark wedge)
  mesh(new THREE.BoxGeometry(0.7,0.5,0.7), M.wheel, 9.0,1.6,0, 0,45*DEG,0, compGrp);
  // front compensator body (slotted)
  mesh(new THREE.BoxGeometry(2.6,0.9,0.9), M.wheel, 9.6,1.55,0, 0,0,0, compGrp);
  for(let i=0;i<3;i++){
    // comp ports (dark slots, top)
    mesh(new THREE.BoxGeometry(0.3,0.3,0.92), M.slideEdge, 9.0+i*0.55, 2.0, 0, 0,0,0, compGrp);
    // comp side ports
    mesh(new THREE.BoxGeometry(0.3,0.3,0.2), M.slideEdge, 9.0+i*0.55, 1.55, 0.5, 0,0,0, compGrp);
    mesh(new THREE.BoxGeometry(0.3,0.3,0.2), M.slideEdge, 9.0+i*0.55, 1.55, -0.5, 0,0,0, compGrp);
  }
  // front fiber optic ring (green glow) around comp
  mesh(new THREE.TorusGeometry(0.4,0.06,6,16).rotateY(Math.PI/2), M.fiberG, 10.9,1.55,0, 0,0,0, compGrp);
  root.add(compGrp);

  /* ---------------- PIN / DETAIL ---------------- */
  const pins=new THREE.Group(); pins.name='pins';
  // takedown pin (top front)
  mesh(new THREE.CylinderGeometry(0.12,0.12,2.2,8).rotateX(Math.PI/2), M.pin, 5.0, 2.3, 0, 0,0,0, pins);
  // grip safety lever
  const gs=new THREE.Group(); gs.position.set(-2.6,1.1,-sW/2*0); gs.name='gripSafety';
  mesh(new THREE.BoxGeometry(0.5,0.9,0.2), M.frame2, 0,0,0, 0.2,0,0, gs);
  root.add(gs);
  root.add(pins);

  /* ---- store animation meta ---- */
  root.userData = {
    groups:{
      frame, mag:magGrp, barrel:barrelGrp, slide:slideGrp, comp:compGrp, pins
    },
    rest:{
      frame:  new THREE.Vector3(0,0,0),
      mag:    new THREE.Vector3(-1.4,-3.4,0),      // seated in grip (assembled)
      barrel: new THREE.Vector3(0,0,0),
      slide:  new THREE.Vector3(0,0,0),
      comp:   new THREE.Vector3(8.6,1.6,0),        // mounted at slide front (assembled)
      pins:   new THREE.Vector3(0,0,0)
    },
    expl:{
      frame:  new THREE.Vector3(0,-1.6,0),
      mag:    new THREE.Vector3(-3.4,-8.6,2.4),    // pulled out & down
      barrel: new THREE.Vector3(4.2,1.2,0),        // lifted out, silver shows
      slide:  new THREE.Vector3(-2.5,6.2,0),       // up & back, locked up
      comp:   new THREE.Vector3(8.5,5.4,0),        // forward-right
      pins:   new THREE.Vector3(2.5,3.2,-2.6)
    },
    compOnSlide:true, // comp parented to slide visually (front). Keep slide-follow offset.
  };
  // comp should travel with slide when assembled; store its relative offset
  compGrp.userData.slideOffset=new THREE.Vector3();
  return root;
}

/* ============================================================
   AR-15 — PROCEDURAL BUILD  (upper + lower + BCG + gas system)
   ============================================================ */
function buildAR(){
  const root=new THREE.Group(); root.name='ar15';

  const texAlu=metalTex(hexCss(PAL.alu), '#000000', 1400);
  const texAlu2=metalTex(hexCss(PAL.aluHi), '#000000', 1200);
  const texSteel=metalTex(hexCss(PAL.arSteel), '#000000', 1000);
  const texGas=metalTex(hexCss(PAL.arGas), '#000000', 800);

  const M={
    alu:    mat(PAL.alu, {map:texAlu, metalness:0.7, roughness:0.5}),
    aluHi:  mat(PAL.aluHi, {map:texAlu2, metalness:0.6, roughness:0.6}),
    steel:  mat(PAL.arSteel, {map:texSteel, metalness:0.95, roughness:0.35}),
    steel2: mat(PAL.arSteel2, {metalness:0.9, roughness:0.4}),
    gas:    mat(PAL.arGas, {map:texGas, metalness:0.85, roughness:0.4}),
    brass:  mat(PAL.brass, {metalness:1.0, roughness:0.3}),
    fib:    mat(0x2bff88,{emissive:0x2bff88,ei:1.8,metalness:0,roughness:0.4}),
  };

  /* -------- LOWER RECEIVER (matte black anodized) -------- */
  const lower=new THREE.Group(); lower.name='lower';
  // magwell
  mesh(new THREE.BoxGeometry(3.4,2.6,1.7), M.alu, 0.5,-1.4,0, 0,0,0, lower);
  mesh(new THREE.BoxGeometry(3.6,0.6,1.8), M.aluHi, 0.5,-2.7,0, 0,0,0, lower);
  // trigger guard
  const tg=new THREE.Group();
  mesh(new THREE.BoxGeometry(3.0,0.3,1.5), M.alu, 0.2,-3.3,0, 0,0,0, tg);
  mesh(new THREE.BoxGeometry(0.3,1.0,1.5), M.alu, -1.35,-3.8,0, 0,0,0, tg);
  mesh(new THREE.BoxGeometry(0.3,1.0,1.5), M.alu, 1.8,-3.8,0, 0,0,0, tg);
  lower.add(tg);
  // trigger (steel)
  const trg=new THREE.Group(); trg.position.set(0.4,-3.0,0);
  mesh(new THREE.BoxGeometry(0.3,1.1,0.3), M.steel, 0,-0.3,0, 0.2,0,0, trg);
  mesh(new THREE.BoxGeometry(0.36,0.16,0.36), M.steel, 0.05,0.1,0, 0,0,0, trg);
  lower.add(trg);
  // takedown pin FRONT (visible at pivot, bottom)
  mesh(new THREE.CylinderGeometry(0.16,0.16,2.0,8).rotateZ(Math.PI/2), M.brass, 2.6,-2.9,0, 0,0,0, lower);
  // mag release button
  mesh(new THREE.BoxGeometry(0.5,0.3,0.3), M.steel, 2.0,-1.0,0.95, 0,0,0, lower);
  // safety selector (small lever, left)
  mesh(new THREE.BoxGeometry(0.4,0.4,0.3), M.steel, 0.9,0.9,0.95, 0,0,0, lower);
  // bolt catch (front of lower)
  mesh(new THREE.BoxGeometry(0.6,0.4,0.4), M.steel, 2.4,0.4,0.9, 0,0,0, lower);
  // stock (collapsible, angled)
  const stock=new THREE.Group(); stock.position.set(-4.4,0.2,0); stock.name='stock';
  mesh(new THREE.BoxGeometry(4.5,0.9,1.0), M.alu, -1.6,0,0, -8*DEG,0,0, stock);
  mesh(new THREE.BoxGeometry(0.7,1.6,1.1), M.aluHi, -4.0,-0.2,0, 0,0,0, stock); // butt plate
  lower.add(stock);
  // handguard connection point (front lower rail)
  mesh(new THREE.BoxGeometry(4.0,1.2,2.2), M.alu, 6.5,-0.6,0, 0,0,0, lower);
  root.add(lower);

  /* -------- UPPER RECEIVER + barrel + gas -------- */
  const upper=new THREE.Group(); upper.name='upper';
  upper.position.set(0,1.0,0);
  // upper receiver body (rifle scope receiver)
  mesh(new THREE.BoxGeometry(4.6,2.4,2.0), M.steel, 4.0,0.4,0, 0,0,0, upper);
  // forward rail / handguard
  mesh(new THREE.BoxGeometry(7.0,1.6,2.0), M.aluHi, 11.0,0.2,0, 0,0,0, upper);
  // barrel (dark steel)
  const bl=8.5;
  const bTube=new THREE.CylinderGeometry(0.34,0.34,bl,10).rotateZ(Math.PI/2);
  mesh(bTube, M.steel2, 14.0,0.4,0, 0,0,0, upper);
  // muzzle brake (slotted)
  mesh(new THREE.CylinderGeometry(0.42,0.42,1.1,10).rotateZ(Math.PI/2), M.gas, 18.4,0.4,0, 0,0,0, upper);
  mesh(new THREE.BoxGeometry(1.2,0.2,0.2), M.gas, 18.4,0.75,0.3, 0,0,0, upper);
  mesh(new THREE.BoxGeometry(1.2,0.2,0.2), M.gas, 18.4,0.75,-0.3, 0,0,0, upper);
  // front sight post + green fiber
  mesh(new THREE.BoxGeometry(0.2,0.7,0.2), M.steel, 17.0,1.1,0, 0,0,0, upper);
  mesh(new THREE.BoxGeometry(0.14,0.4,0.14), M.fib, 17.0,1.4,0, 0,0,0, upper);

  /* ---- GAS SYSTEM (front gas block + tube + piston) ---- */
  const gas=new THREE.Group(); gas.name='gas';
  // front gas block
  mesh(new THREE.BoxGeometry(0.7,0.8,0.6), M.gas, 12.2,0.7,0, 0,0,0, gas);
  // gas block cap
  mesh(new THREE.CylinderGeometry(0.16,0.16,0.8,8).rotateZ(Math.PI/2), M.brass, 12.2,1.1,0, 0,0,0, gas);
  // gas tube (from front block up to buffer)
  const gt=new THREE.CylinderGeometry(0.16,0.16,5.2,8).rotateZ(Math.PI/2);
  mesh(gt, M.gas, 9.4,1.05,0, 0,0,0, gas);
  // gas piston (slightly larger, protrudes from tube)
  mesh(new THREE.CylinderGeometry(0.22,0.22,1.1,8).rotateZ(Math.PI/2), M.steel, 12.4,1.05,0, 0,0,0, gas);
  upper.add(gas);

  /* ---- BCG (bolt carrier group) — rear travel + bolt twist-unlock ---- */
  const bcg=new THREE.Group(); bcg.name='bcg';
  // carrier (long)
  mesh(new THREE.BoxGeometry(5.0,0.9,0.9), M.steel2, 7.0,0.4,0, 0,0,0, bcg);
  // front sight on carrier? no (upper). buffer tube opening
  mesh(new THREE.CylinderGeometry(0.5,0.5,1.4,10).rotateZ(Math.PI/2), M.steel, 4.3,0.4,0, 0,0,0, bcg);
  // BOLT (head) — rotates to unlock; positioned at front of carrier
  const bolt=new THREE.Group(); bolt.name='bolt'; bolt.position.set(9.0,0.4,0);
  const head=new THREE.CylinderGeometry(0.52,0.52,1.0,12).rotateZ(Math.PI/2);
  mesh(head, M.steel, 0,0,0, 0,0,0, bolt);
  // locking lugs (the 2+1) — visible on muzzle end
  mesh(new THREE.BoxGeometry(0.3,0.3,0.5), M.steel, 0.5,0.2,0.28, 0,0,0, bolt);
  mesh(new THREE.BoxGeometry(0.3,0.3,0.5), M.steel, 0.5,0.2,-0.28, 0,0,0, bolt);
  // firing pin
  mesh(new THREE.CylinderGeometry(0.08,0.08,1.0,6).rotateZ(Math.PI/2), M.brass, -0.4,0,0, 0,0,0, bolt);
  // extractor + ejector
  mesh(new THREE.BoxGeometry(0.3,0.25,0.3), M.steel2, 0.1,0.4,0.45, 0,0,0, bolt);
  bolt.rotation.z=0; // locked
  bcg.add(bolt);

  // CHARGING HANDLE (attaches to BCG, left side, slides rearward)
  const ch=new THREE.Group(); ch.name='chHandle'; ch.position.set(4.6,0.4,-1.1);
  mesh(new THREE.BoxGeometry(1.4,0.4,0.3), M.alu, 0,0,0, 0,0,0, ch);
  mesh(new THREE.BoxGeometry(0.4,0.8,0.2), M.aluHi, -0.7,0,0, 0,0,0, ch);
  bcg.add(ch);

  // EJECTION PORT / ejector seat + chamber opening (upper front)
  mesh(new THREE.BoxGeometry(1.6,1.0,2.0), M.steel, 9.0,0.4,0, 0,0,0, upper); // chamber ring
  mesh(new THREE.CylinderGeometry(0.6,0.6,1.8,10).rotateZ(Math.PI/2), M.steel, 9.0,0.4,0, 0,0,0, upper);
  upper.add(bcg);

  /* ---- BUFFER / spring (inside buffer tube, rear of upper) ---- */
  const buffer=new THREE.Group(); buffer.name='buffer'; buffer.position.set(2.6,0.4,0);
  // buffer tube
  const bt=new THREE.CylinderGeometry(0.45,0.45,3.6,10).rotateZ(Math.PI/2);
  mesh(bt, M.aluHi, 0,0,0, 0,0,0, buffer);
  // buffer block
  mesh(new THREE.CylinderGeometry(0.4,0.4,0.9,10).rotateZ(Math.PI/2), M.steel, -1.2,0,0, 0,0,0, buffer);
  // spring (coiled visual — series of thin rings, compressed/extended)
  const spring=new THREE.Group(); spring.name='spring';
  for(let i=0;i<6;i++){
    mesh(new THREE.TorusGeometry(0.42,0.05,5,12).rotateY(Math.PI/2), M.steel, 0.4-i*0.5,0,0, 0,0,0, spring);
  }
  buffer.add(spring);
  // spring plug (front)
  mesh(new THREE.CylinderGeometry(0.35,0.35,0.5,10).rotateZ(Math.PI/2), M.brass, 1.5,0,0, 0,0,0, buffer);
  upper.add(buffer);

  /* ---- FRONT PIVOT (takedown, front) + REAR TAKEOUT PIN (upper-rear) ---- */
  // front pivot axis = Z, at x≈2.6,y≈-2.9 (world) — lower group rotates about this.
  // Parent the lower to a fixed pivot group so it swings about the front pin (real takedown axis).
  const frontPivot=new THREE.Group(); frontPivot.name='frontPivot'; frontPivot.position.set(2.6,-2.9,0);
  mesh(new THREE.CylinderGeometry(0.2,0.2,2.2,10).rotateZ(Math.PI/2), M.brass, 0,0,0, 0,0,0, frontPivot);
  root.add(frontPivot);
  lower.position.copy(new THREE.Vector3(0,0,0).sub(frontPivot.position)); // pivot local
  frontPivot.add(lower);

  // rear takeout pin (upper-rear, vertical) — extracts straight up when opening
  const rearPin=new THREE.Group(); rearPin.name='rearPin'; rearPin.position.set(1.8,1.0,0);
  mesh(new THREE.CylinderGeometry(0.18,0.18,2.0,10), M.brass, 0,0,0, 0,0,0, rearPin);
  mesh(new THREE.CylinderGeometry(0.28,0.28,0.2,10), M.brass, 0,1.0,0, 0,0,0, rearPin); // head
  root.add(rearPin);

  // MAG (visible, rides in lower so it drops out of the opened lower — mechanical)
  const magA=new THREE.Group(); magA.name='mag'; magA.position.set(0.5,-1.4,0);
  mesh(new THREE.BoxGeometry(2.4,3.4,1.6), M.alu, 0,-1.0,0, 4*DEG,0,0, magA);
  mesh(new THREE.BoxGeometry(2.4,0.5,1.7), M.aluHi, 0,0.7,0, 0,0,0, magA); // base
  mesh(new THREE.BoxGeometry(1.8,0.2,1.2), M.steel, 0,0.9,0, 0,0,0, magA);   // follower
  lower.add(magA);

  root.userData={
    frontPivot, rearPin, lower, upper, bcg, bolt, chHandle: ch, buffer, spring, gas, mag:magA,
    rest:{
      lower:new THREE.Vector3(0,0,0),
      upper:new THREE.Vector3(0,0,0),
      bcg:new THREE.Vector3(0,0,0),
      boltR:0,
      rearPin:new THREE.Vector3(0,0,0),
      mag:new THREE.Vector3(0,0,0),
    },
    expl:{
      lowerOpen: 30*DEG,      // lower swings down about front pivot
      upper:new THREE.Vector3(0,0,0),
      rearPinOut: new THREE.Vector3(0,3.2,0), // extracts upward
      magOut: new THREE.Vector3(0,-3.0,2.2),  // drops & forward
    }
  };
  return root;
}

let current='usp';

      '<div class="tag">// PROGRAMMATIC LOW-POLY</div><h1>USP MATCH <span style="opacity:.5">.45</span></h1><div class="sub">PS1 ARSENAL · FIBER-OPTIC SIGHTS</div>';
  } else { ar.visible=true; ar.position.set(0,0,0); usp.visible=false;

  }

function frameCamera(){
  // re-frame both cameras to fit the active model
  const target=current==='usp'?usp:ar;
  const box=new THREE.Box3().setFromObject(target);
  const c=box.getCenter(new THREE.Vector3());
  const size=box.getSize(new THREE.Vector3()).length();
  const fit=Math.max(size*0.62, 18);
  if(camType==='ortho'){
    ortho.top=fit/2; ortho.bottom=-fit/2; ortho.left=-fit*aspect/2; ortho.right=fit*aspect/2;
    ortho.updateProjectionMatrix();
  } else {
    persp.position.copy(c).add(new THREE.Vector3(0,0,fit*1.4));
    persp.lookAt(c);
  }
  target.position.set(-c.x, -c.y, -c.z); // center in frame
}

/* ============================================================
   ANIMATION — smooth, seamless, looped
   ============================================================ */
const EASE = {
  inOut: t=> t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2,
  out:   t=> 1-Math.pow(1-t,3),
  in:    t=> t*t*t,
};

/* USP loop timeline (seconds)
   0.0–1.2  assemble: mag in, slide forward+lock, comp forward
   1.2–2.0  hold assembled (barrel silver peeks at rear)
   2.0–3.4  disassemble: slide recock back, barrel lift, mag pull, parts float
   3.4–4.2  hold exploded
   4.2–5.4  assemble back (mirror)  -> returns to start  (seamless)
   Total 5.4s; start & end at assembled => loops cleanly.
*/
const USP_CYCLE=5.4;
function animUSP(t){
  const u=usp.userData, g=u.groups;
  const p=(t % USP_CYCLE)/USP_CYCLE;
  let k; // 0=exploded, 1=assembled
  if(p<0.223) k=1;                                   // 0–1.2  assembled hold
  else if(p<0.370) k=1- EASE.inOut((p-0.223)/0.147); // disassemble
  else if(p<0.777) k=0;                              // exploded hold
  else if(p<0.907) k=EASE.inOut((p-0.777)/0.130);    // reassemble
  else k=1;
  const ek=EASE.inOut(k); // eased 0..1

  // frame settles slightly down
  g.frame.position.lerpVectors(u.rest.frame, u.expl.frame, ek);

  // mag slides UP into grip on assembly; pulled down/out on disassembly
  g.mag.position.lerpVectors(u.rest.mag, u.expl.mag, ek);
  g.mag.rotation.z = (1-ek)*(-18*DEG);

  // barrel lifts out on disassembly (reveals silver); seats on frame when assembled
  g.barrel.position.lerpVectors(u.rest.barrel, u.expl.barrel, ek);

  // slide: locked forward at rest; when exploded it recks up & back, and during
  // assembly it glides forward ON the silver barrel (mid-motion) before locking.
  const base=u.rest.slide.clone().lerp(u.expl.slide, ek);
  const travel=-3.2*Math.sin(ek*Math.PI);        // 0 at both ends, max mid = "riding" over barrel
  g.slide.position.copy(base);
  g.slide.position.x += travel;

  // comp travels with the slide (it IS the slide front); extra offset only when exploded
  const compRel=new THREE.Vector3(0,0,0).lerp(new THREE.Vector3(8.5,5.4,0).sub(new THREE.Vector3()), ek);
  // rest.comp already holds the assembled front position; add the delta for exploded
  g.comp.position.copy(u.rest.comp).lerp(u.expl.comp, ek);
  g.comp.position.x += travel; // keep it bolted to the slide front during motion

  // pins float free when exploded
  g.pins.position.lerpVectors(u.rest.pins, u.expl.pins, ek);
}

/* AR-15 sequence (slow-motion) — mechanical, pivot-based.
   Phase A: rear takeout pin exits UP, lower swings about front pivot (30°).
   Phase B: BCG travels rearward, bolt rotates 90° to unlock, buffer+spring extend.
   Phase C: mag drops out of lower.  Then reverse to reassemble.
*/
const AR_CYCLE=7.2;
function animAR(t){
  const u=ar.userData;
  const p=(t % AR_CYCLE)/AR_CYCLE;
  // 0–0.25   assembled hold
  // 0.25–0.5 open: pin up, lower rotates, mag drops
  // 0.5–0.75 BCG rear + bolt unlock + buffer extend
  // 0.75–1.0 close: reverse -> assembled (seamless)
  let open=0, bcg=0, mag=0;
  if(p<0.25) {open=0;bcg=0;mag=0;}
  else if(p<0.5) {const s=EASE.inOut((p-0.25)/0.25); open=s; mag=s;}
  else if(p<0.75) {const s=EASE.inOut((p-0.5)/0.25); open=1; bcg=s; mag=1;}
  else {const s=EASE.inOut((p-0.75)/0.25); open=1-s; bcg=1-s; mag=1-s;}

  // 1) rear pin extracts up
  u.rearPin.position.set(0,open*3.2,0);
  u.rearPin.rotation.z = open* 20*DEG;

  // 2) lower swings about FRONT pivot (real takedown axis) via fixed parent group
  u.frontPivot.rotation.z = open * (30*DEG);

  // 3) BCG travels rearward along receiver axis (X)
  u.bcg.position.x = -bcg*3.0;
  // 4) bolt twist-unlock: rotate about X (long axis) by 90°
  u.bolt.rotation.x = bcg * (90*DEG);
  // charging handle follows bcg (already child) - add slight slide
  u.chHandle.position.x = 4.6 - bcg*1.2;
  // 5) buffer + spring: extend (move rearward) with BCG
  u.buffer.position.x = 2.6 - bcg*2.4;
  // spring compresses visually: scale x
  u.spring.scale.x = 1 + bcg*0.5;
  // 6) gas piston moves rearward slightly with the cycle
  u.gas.position.x = -bcg*0.6;
  // 7) mag drops out of the opened lower (child of lower, so it rides with it + falls)
  u.mag.position.set(0.5 + mag*0.5, -1.4 - mag*2.2, mag*0.8);
  u.mag.rotation.x = mag * 10*DEG;
}

/* ============================================================
   ORBIT + RENDER LOOP
   ============================================================ */
const clock=new THREE.Clock();
function tick(){
  const dt=Math.min(clock.getDelta(),0.05);
  state.t+=dt;
  if(orbitOn){ orbitAngle+=dt*userOrbitSpeed; }

  const target=current==='usp'?usp:ar;
  // rotate model (or camera) for showcase; rotate camera around +Z for product turntable
  if(current==='usp'){
    animUSP(state.t);
  } else {
    animAR(state.t);
  }
  // turntable: rotate active model slowly (keeps ortho framing stable)
  target.rotation.y = orbitAngle*0.5;

  // camera
  camera.position.copy( (camType==='ortho'?ortho:persp).position );
  if(camType==='ortho'){ camera.lookAt(0,0,0); }

  // status HUD
  const p=(state.t % (current==='usp'?USP_CYCLE:AR_CYCLE))/(current==='usp'?USP_CYCLE:AR_CYCLE);
  let phaseTxt;
  if(current==='usp'){
    phaseTxt = p<0.223?'ASSEMBLED':p<0.370?'DISASSEMBLING':p<0.777?'EXPLODED':p<0.907?'ASSEMBLING':'ASSEMBLED';
  } else {
    phaseTxt = p<0.25?'ASSEMBLED':p<0.5?'OPEN / PIN':p<0.75?'BCG / BOLT':'CLOSING';
  }
  document.getElementById('ph').textContent=phaseTxt;
  document.getElementById('tclk').textContent='t '+(state.t%60).toFixed(2)+'s  ·  '+current.toUpperCase();

  // CAD overlay for AR
  if(current==='ar15'){
    const u=ar.userData;
    const open=Math.abs(u._pivotGroup?u._pivotGroup.rotation.z/(-(30*DEG)):0);
    document.getElementById('cad').innerHTML=
      'UPPER/LOWER PIVOT <b>'+((u.frontPivot.rotation.z/DEG).toFixed(1))+'°</b><br>'+
      'BCG TRAVEL <b>'+((-u.bcg.position.x).toFixed(2))+'</b><br>'+
      'BOLT ROT <b>'+((u.bolt.rotation.x/DEG).toFixed(1))+'°</b><br>'+
      'REAR PIN <b>'+(u.rearPin.position.y.toFixed(2))+'</b>';
  }

  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}

/* ============================================================
   UI WIRING
   ============================================================ */
function updateButtons(){
  document.querySelectorAll('#dock [data-scene]').forEach(b=>{
    b.classList.toggle('on', b.dataset.scene===current);
  });
}
document.querySelectorAll('#dock [data-scene]').forEach(b=>{
  b.addEventListener('click',()=>setScene(b.dataset.scene));
});
document.querySelector('[data-act=orbit]').addEventListener('click',e=>{
  orbitOn=!orbitOn; e.target.textContent='Orbit: '+(orbitOn?'On':'Off');
  e.target.classList.toggle('on',orbitOn);
});
document.querySelector('[data-act=cam]').addEventListener('click',e=>{
  camType = camType==='ortho'?'persp':'ortho';
  camera = camType==='ortho'?ortho:persp;
  e.target.textContent='Cam: '+(camType==='ortho'?'Ortho':'Persp');
  frameCamera();
});
document.querySelector('[data-act=reset]').addEventListener('click',()=>{
  orbitAngle=0; state.t=0; frameCamera();
});

/* keyboard: 1=usp 2=ar15 space=orbit r=reset c=cam */
window.addEventListener('keydown',e=>{
  if(e.key==='1')setScene('usp');
  else if(e.key==='2')setScene('ar15');
  else if(e.key===' '){e.preventDefault();orbitOn=!orbitOn;document.querySelector('[data-act=orbit]').textContent='Orbit: '+(orbitOn?'On':'Off');document.querySelector('[data-act=orbit]').classList.toggle('on',orbitOn);}
  else if(e.key==='r'||e.key==='R'){orbitAngle=0;state.t=0;frameCamera();}
  else if(e.key==='c'||e.key==='C'){camType=camType==='ortho'?'persp':'ortho';camera=camType==='ortho'?ortho:persp;document.querySelector('[data-act=cam]').textContent='Cam: '+(camType==='ortho'?'Ortho':'Persp');frameCamera();}
});

/* resize keeps internal buffer pixelated-stable */
window.addEventListener('resize',()=>{
  // keep fixed internal resolution for the PS1 look; CSS scales it
});

/* boot */
loadScenes();
setScene('usp');
requestAnimationFrame(tick);

})();
</script>
