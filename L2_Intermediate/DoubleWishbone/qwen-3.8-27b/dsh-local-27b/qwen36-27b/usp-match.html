<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USP Match Tactical — Low-Poly Exploded View</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #b0b0b0; overflow: hidden; font-family: 'Courier New', monospace; }
canvas { display: block; }
#overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 10;
}
#title {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  color: #1a1a1a; font-size: 18px; font-weight: bold; letter-spacing: 4px;
  text-transform: uppercase; z-index: 20; text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
  font-family: 'Courier New', monospace;
}
#phase-label {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  color: #1a1a1a; font-size: 14px; letter-spacing: 3px;
  z-index: 20; font-family: 'Courier New', monospace;
  background: rgba(176,176,176,0.8); padding: 6px 16px; border: 1px solid #555;
}
#scanlines {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.03) 2px,
    rgba(0,0,0,0.03) 4px

  pointer-events: none; z-index: 15;
}
#component-labels {
  position: fixed; top: 60px; right: 20px;
  color: #222; font-size: 11px; letter-spacing: 1px;
  z-index: 20; text-align: right;
  font-family: 'Courier New', monospace;
  line-height: 2;
}
.label-dot {
  display: inline-block; width: 8px; height: 8px; margin-right: 6px;
  vertical-align: middle; border: 1px solid #333;
}
</style>
</head>
<body>
<div id="title">SIG Sauer USP Match 9mm — Exploded View</div>
<div id="phase-label">ASSEMBLY SEQUENCE</div>
<div id="scanlines"></div>
<div id="component-labels">
  <div><span class="label-dot" style="background:#3a3a3a"></span> Slide Assembly</div>
  <div><span class="label-dot" style="background:#c0c0c0"></span> Barrel</div>
  <div><span class="label-dot" style="background:#555555"></span> Frame / Grip</div>
  <div><span class="label-dot" style="background:#444444"></span> Magazine</div>
  <div><span class="label-dot" style="background:#666666"></span> Match Compensator</div>
  <div><span class="label-dot" style="background:#00ff44"></span> Front Sight (FOG)</div>
  <div><span class="label-dot" style="background:#ff2200"></span> Rear Sight (FOG)</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
// USP MATCH TACTICAL — LOW-POLY EXPLODED VIEW
// Half-Life / PS1 Aesthetic
// ============================================================

// --- Scene Setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8b8b8);
scene.fog = new THREE.Fog(0xb8b8b8, 15, 30);

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.BasicShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

// --- Camera ---
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(3, 2.5, 5);
camera.lookAt(0, 0.3, 0);

// --- Lighting — Studio setup ---
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
keyLight.position.set(5, 8, 4);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(512, 512);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 20;
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -5;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xaabbff, 0.4);
fillLight.position.set(-4, 3, -2);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffeedd, 0.5);
rimLight.position.set(-2, 1, -5);
scene.add(rimLight);

// --- Materials ---
function createLowPolyMaterial(color, roughness) {
  return new THREE.MeshLambertMaterial({
    color: new THREE.Color(color),
    flatShading: true
  });
}

const matDarkSteel      = createLowPolyMaterial(0x2a2a2a, 1);
const matBluedSteel     = createLowPolyMaterial(0x1a1a2e, 1);
const matSilver         = createLowPolyMaterial(0xc8c8d0, 1);
const matPolymer        = createLowPolyMaterial(0x4a4a4a, 1);
const matPolymerDark    = createLowPolyMaterial(0x3a3a3a, 1);
const matMagazine       = createLowPolyMaterial(0x353535, 1);
const matCompensator    = createLowPolyMaterial(0x505050, 1);
const matFrogGreen      = createLowPolyMaterial(0x00ff44, 1);
const matFrogRed        = createLowPolyMaterial(0xff2200, 1);
const matSpring         = createLowPolyMaterial(0x888866, 1);
const matTrigger        = createLowPolyMaterial(0x222222, 1);
const matScrew          = createLowPolyMaterial(0x666666, 1);

// --- PS1 Vertex Snapping ---
function snapVertices(geometry, gridSize) {
  gridSize = gridSize || 0.005;
  const pos = geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setXYZ(
      i,
      Math.round(pos.getX(i) / gridSize) * gridSize,
      Math.round(pos.getY(i) / gridSize) * gridSize,
      Math.round(pos.getZ(i) / gridSize) * gridSize
    );
  }
  pos.needsUpdate = true;
  geometry.computeVertexNormals();
  return geometry;
}

// --- Helper: create box with low-poly snap ---
function createBox(w, h, d, mat, snap) {
  const geo = new THREE.BoxGeometry(w, h, d, 1, 1, 1);
  if (snap) snapVertices(geo, 0.008);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// --- Helper: create cylinder with low-poly look ---
function createCylinder(rt, rb, h, seg, mat, snap) {
  seg = seg || 8;
  const geo = new THREE.CylinderGeometry(rt, rb, h, seg, 1);
  if (snap) snapVertices(geo, 0.008);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  return mesh;
}

// ============================================================
// BUILD USP MATCH PISTOL COMPONENTS
// ============================================================

const pistolGroup = new THREE.Group();
scene.add(pistolGroup);

// --- Component Groups for Animation ---
const slideGroup = new THREE.Group();
const barrelGroup = new THREE.Group();
const frameGroup = new THREE.Group();
const magazineGroup = new THREE.Group();
const compensatorGroup = new THREE.Group();

// ============================================================
// FRAME / GRIP (Polymer lower receiver)
// ============================================================
function buildFrame() {
  // Main grip body — angled back slightly
  const gripBody = createBox(0.65, 1.1, 0.42, matPolymer, true);
  gripBody.position.set(-0.15, -0.55, 0);
  frameGroup.add(gripBody);

  // Grip angle — backstrap
  const backstrap = createBox(0.08, 0.9, 0.44, matPolymerDark, true);
  backstrap.position.set(-0.4, -0.5, 0);
  backstrap.rotation.z = 0.08;
  frameGroup.add(backstrap);

  // Front strap
  const frontStrap = createBox(0.15, 0.5, 0.42, matPolymer, true);
  frontStrap.position.set(0.2, -0.15, 0);
  frameGroup.add(frontStrap);

  // Grip texture panels (left and right)
  const gripTextureL = createBox(0.55, 0.7, 0.02, matPolymerDark, true);
  gripTextureL.position.set(-0.15, -0.55, 0.22);
  frameGroup.add(gripTextureL);

  const gripTextureR = createBox(0.55, 0.7, 0.02, matPolymerDark, true);
  gripTextureR.position.set(-0.15, -0.55, -0.22);
  frameGroup.add(gripTextureR);

  // Trigger guard
  const triggerGuardFront = createBox(0.04, 0.2, 0.38, matPolymer, true);
  triggerGuardFront.position.set(0.12, -0.38, 0.15);
  frameGroup.add(triggerGuardFront);

  const triggerGuardBack = createBox(0.04, 0.2, 0.38, matPolymer, true);
  triggerGuardBack.position.set(0.12, -0.38, -0.15);
  frameGroup.add(triggerGuardBack);

  const triggerGuardBottom = createBox(0.18, 0.04, 0.38, matPolymer, true);
  triggerGuardBottom.position.set(0.12, -0.28, 0);
  frameGroup.add(triggerGuardBottom);

  const triggerGuardCurve = createBox(0.18, 0.12, 0.04, matPolymer, true);
  triggerGuardCurve.position.set(0.12, -0.34, 0.18);
  frameGroup.add(triggerGuardCurve);
  
  const triggerGuardCurve2 = createBox(0.18, 0.12, 0.04, matPolymer, true);
  triggerGuardCurve2.position.set(0.12, -0.34, -0.18);
  frameGroup.add(triggerGuardCurve2);

  // Trigger
  const trigger = createBox(0.08, 0.18, 0.04, matTrigger, true);
  trigger.position.set(0.08, -0.35, 0);
  frameGroup.add(trigger);

  // Trigger bow (curved)
  const triggerBow = createBox(0.06, 0.06, 0.06, matTrigger, true);
  triggerBow.position.set(0.06, -0.3, 0);
  frameGroup.add(triggerBow);

  // Hammer
  const hammer = createBox(0.1, 0.14, 0.06, matDarkSteel, true);
  hammer.position.set(-0.45, 0.02, 0);
  hammer.rotation.z = -0.4;
  frameGroup.add(hammer);

  // Hammer spur
  const hammerSpur = createBox(0.06, 0.08, 0.07, matDarkSteel, true);
  hammerSpur.position.set(-0.52, -0.02, 0);
  hammerSpur.rotation.z = -0.3;
  frameGroup.add(hammerSpur);

  // Safety lever (left side)
  const safetyLever = createBox(0.12, 0.06, 0.08, matDarkSteel, true);
  safetyLever.position.set(-0.35, 0.0, 0.24);
  frameGroup.add(safetyLever);

  // Decock lever (right side)
  const decockLever = createBox(0.12, 0.06, 0.08, matDarkSteel, true);
  decockLever.position.set(-0.35, 0.0, -0.24);
  frameGroup.add(decockLever);

  // Magazine release
  const magRelease = createBox(0.08, 0.05, 0.06, matDarkSteel, true);
  magRelease.position.set(0.05, -0.22, 0.2);
  frameGroup.add(magRelease);

  // Dust cover area
  const dustCover = createBox(0.3, 0.06, 0.4, matPolymer, true);
  dustCover.position.set(0.35, -0.12, 0);
  frameGroup.add(dustCover);

  // Ejection port cover (right side)
  const ejectionPort = createBox(0.25, 0.15, 0.02, matPolymerDark, true);
  ejectionPort.position.set(-0.1, 0.08, -0.22);
  frameGroup.add(ejectionPort);

  // Slide rails (top of frame)
  const slideRailL = createBox(0.7, 0.04, 0.06, matPolymerDark, true);
  slideRailL.position.set(-0.1, 0.04, 0.16);
  frameGroup.add(slideRailL);

  const slideRailR = createBox(0.7, 0.04, 0.06, matPolymerDark, true);
  slideRailR.position.set(-0.1, 0.04, -0.16);
  frameGroup.add(slideRailR);

  // Takedown lever
  const takedownLever = createBox(0.04, 0.08, 0.1, matDarkSteel, true);
  takedownLever.position.set(-0.38, -0.05, 0);
  frameGroup.add(takedownLever);

  // Takedown pin
  const takedownPin = createCylinder(0.03, 0.03, 0.12, 6, matScrew, true);
  takedownPin.position.set(-0.38, -0.05, 0);
  takedownPin.rotation.x = Math.PI / 2;
  frameGroup.add(takedownPin);

  // Front grip screws
  for (let z of [-1, 1]) {
    const screw = createCylinder(0.025, 0.025, 0.03, 6, matScrew, true);
    screw.position.set(0.1, -0.5, z * 0.1);
    frameGroup.add(screw);
  }

  frameGroup.position.set(0, 0, 0);
  return frameGroup;
}

// ============================================================
// SLIDE (Locking block — dark steel)
// ============================================================
function buildSlide() {
  // Main slide body
  const slideBody = createBox(0.95, 0.2, 0.38, matBluedSteel, true);
  slideBody.position.set(-0.1, 0.12, 0);
  slideGroup.add(slideBody);

  // Slide top (flat)
  const slideTop = createBox(0.92, 0.03, 0.35, matDarkSteel, true);
  slideTop.position.set(-0.1, 0.23, 0);
  slideGroup.add(slideTop);

  // Slide front nose
  const slideNose = createBox(0.15, 0.22, 0.36, matBluedSteel, true);
  slideNose.position.set(0.42, 0.11, 0);
  slideGroup.add(slideNose);

  // Dust shroud front
  const dustShroud = createBox(0.12, 0.15, 0.34, matBluedSteel, true);
  dustShroud.position.set(0.3, -0.02, 0);
  slideGroup.add(dustShroud);

  // Rear serrations (6 serration blocks)
  for (let i = 0; i < 6; i++) {
    const serrL = createBox(0.015, 0.12, 0.38, matDarkSteel, true);
    serrL.position.set(-0.55 + i * 0.03, 0.12, 0);
    slideGroup.add(serrL);

    const serrR = createBox(0.015, 0.12, 0.38, matDarkSteel, true);
    serrR.position.set(-0.55 + i * 0.03, 0.12, 0);
    slideGroup.add(serrR);
  }

  // Front serrations
  for (let i = 0; i < 3; i++) {
    const fSerr = createBox(0.015, 0.08, 0.36, matDarkSteel, true);
    fSerr.position.set(0.2 + i * 0.03, 0.14, 0);
    slideGroup.add(fSerr);
  }

  // Ejection port (right side cutout representation)
  const ejectionPortInner = createBox(0.22, 0.12, 0.02, matPolymerDark, true);
  ejectionPortInner.position.set(-0.05, 0.1, -0.2);
  slideGroup.add(ejectionPortInner);

  // Extractor visible in ejection port
  const extractor = createBox(0.06, 0.04, 0.04, matTrigger, true);
  extractor.position.set(-0.02, 0.08, -0.18);
  slideGroup.add(extractor);

  // Firing pin channel
  const firingPin = createCylinder(0.02, 0.02, 0.15, 6, matSpring, true);
  firingPin.position.set(0.45, 0.12, 0);
  firingPin.rotation.z = Math.PI / 2;
  slideGroup.add(firingPin);

  // locking lugs (top rear of slide)
  const lugL = createBox(0.06, 0.04, 0.04, matDarkSteel, true);
  lugL.position.set(-0.15, 0.18, 0.12);
  slideGroup.add(lugL);
  const lugR = createBox(0.06, 0.04, 0.04, matDarkSteel, true);
  lugR.position.set(-0.15, 0.18, -0.12);
  slideGroup.add(lugR);

  // ============================================================
  // REAR SIGHT — Red Fiber Optic
  // ============================================================
  const rearSightBase = createBox(0.1, 0.06, 0.12, matDarkSteel, true);
  rearSightBase.position.set(-0.5, 0.24, 0);
  slideGroup.add(rearSightBase);

  // Rear sight notches
  const rearNotchL = createBox(0.02, 0.04, 0.02, matDarkSteel, true);
  rearNotchL.position.set(-0.5, 0.27, 0.05);
  slideGroup.add(rearNotchL);
  const rearNotchR = createBox(0.02, 0.04, 0.02, matDarkSteel, true);
  rearNotchR.position.set(-0.5, 0.27, -0.05);
  slideGroup.add(rearNotchR);

  // Red fiber optic post
  const rearFOG = createCylinder(0.015, 0.015, 0.06, 6, matFrogRed, true);
  rearFOG.position.set(-0.5, 0.28, 0);
  slideGroup.add(rearFOG);

  // Red glow
  const rearGlowMat = new THREE.MeshBasicMaterial({
    color: 0xff2200, transparent: true, opacity: 0.5
  });
  const rearGlow = createCylinder(0.025, 0.025, 0.08, 6, rearGlowMat, false);
  rearGlow.position.set(-0.5, 0.28, 0);
  slideGroup.add(rearGlow);

  // ============================================================
  // FRONT SIGHT — Green Fiber Optic
  // ============================================================
  const frontSightBase = createBox(0.06, 0.06, 0.08, matDarkSteel, true);
  frontSightBase.position.set(0.42, 0.24, 0);
  slideGroup.add(frontSightBase);

  // Green fiber optic post
  const frontFOG = createCylinder(0.018, 0.018, 0.07, 6, matFrogGreen, true);
  frontFOG.position.set(0.42, 0.28, 0);
  slideGroup.add(frontFOG);

  // Green glow
  const frontGlowMat = new THREE.MeshBasicMaterial({
    color: 0x00ff44, transparent: true, opacity: 0.5
  });
  const frontGlow = createCylinder(0.028, 0.028, 0.09, 6, frontGlowMat, false);
  frontGlow.position.set(0.42, 0.28, 0);
  slideGroup.add(frontGlow);

  // Repeller (left side of slide)
  const repeller = createBox(0.04, 0.08, 0.04, matDarkSteel, true);
  repeller.position.set(-0.05, 0.1, 0.2);
  slideGroup.add(repeller);

  slideGroup.position.set(0, 0, 0);
  return slideGroup;
}

// ============================================================
// BARREL (Bright silver — exposed)
// ============================================================
function buildBarrel() {
  // Main barrel
  const barrelMain = createCylinder(0.08, 0.09, 0.7, 8, matSilver, true);
  barrelMain.rotation.x = Math.PI / 2;
  barrelMain.position.set(0.05, 0.02, 0);
  barrelGroup.add(barrelMain);

  // Barrel hood / front
  const barrelHood = createCylinder(0.1, 0.08, 0.08, 8, matSilver, true);
  barrelHood.rotation.x = Math.PI / 2;
  barrelHood.position.set(0.4, 0.02, 0);
  barrelGroup.add(barrelHood);

  // Barrel profile (raised contour typical of USP)
  const barrelProfile = createCylinder(0.11, 0.11, 0.06, 8, matSilver, true);
  barrelProfile.rotation.x = Math.PI / 2;
  barrelProfile.position.set(0.38, 0.04, 0);
  barrelGroup.add(barrelProfile);

  // Barrel top ramp (tilted barrel system)
  const barrelRamp = createBox(0.2, 0.03, 0.14, matSilver, true);
  barrelRamp.position.set(-0.05, 0.1, 0);
  barrelRamp.rotation.z = 0.15;
  barrelGroup.add(barrelRamp);

  // Locking lugs on barrel
  const bLugL = createBox(0.05, 0.06, 0.05, matSilver, true);
  bLugL.position.set(-0.12, 0.1, 0.1);
  barrelGroup.add(bLugL);
  const bLugR = createBox(0.05, 0.06, 0.05, matSilver, true);
  bLugR.position.set(-0.12, 0.1, -0.1);
  barrelGroup.add(bLugR);

  // Chamber area
  const chamber = createCylinder(0.07, 0.07, 0.06, 8, matSilver, true);
  chamber.rotation.x = Math.PI / 2;
  chamber.position.set(-0.28, 0.02, 0);
  barrelGroup.add(chamber);

  // Barrel bushing
  const bushing = createCylinder(0.09, 0.1, 0.04, 8, matSilver, true);
  bushing.rotation.x = Math.PI / 2;
  bushing.position.set(0.35, 0.02, 0);
  barrelGroup.add(bushing);

  // Gas block / guide
  const gasBlock = createBox(0.06, 0.04, 0.12, matSilver, true);
  gasBlock.position.set(0.2, -0.02, 0);
  barrelGroup.add(gasBlock);

  barrelGroup.position.set(0, 0, 0);
  return barrelGroup;
}

// ============================================================
// RECOIL SPRING ASSEMBLY
// ============================================================
function buildRecoilSpring() {
  const springGroup = new THREE.Group();

  // Spring body — represented as a series of rings
  for (let i = 0; i < 6; i++) {
    const ringGeo = new THREE.TorusGeometry(0.06, 0.01, 4, 8);
    snapVertices(ringGeo, 0.01);
    const ring = new THREE.Mesh(ringGeo, matSpring);
    ring.position.set(-0.05 + i * 0.06, 0, 0);
    ring.rotation.y = Math.PI / 2;
    ring.castShadow = true;
    springGroup.add(ring);
  }

  // Spring guide rod
  const guideRod = createCylinder(0.03, 0.03, 0.45, 6, matSilver, true);
  guideRod.rotation.z = Math.PI / 2;
  guideRod.position.set(0.05, -0.01, 0);
  springGroup.add(guideRod);

  // Front lug on guide rod
  const frontLug = createBox(0.04, 0.06, 0.06, matSilver, true);
  frontLug.position.set(0.27, -0.01, 0);
  springGroup.add(frontLug);

  springGroup.position.set(0, 0, 0);
  return springGroup;
}

// ============================================================
// MATCH FRONT WEIGHT / COMPENSATOR
// ============================================================
function buildCompensator() {
  // Main weight body
  const weightBody = createBox(0.12, 0.16, 0.36, matCompensator, true);
  weightBody.position.set(0, 0, 0);
  compensatorGroup.add(weightBody);

  // Compensator top fin
  const topFin = createBox(0.1, 0.06, 0.32, matCompensator, true);
  topFin.position.set(0, 0.11, 0);
  compensatorGroup.add(topFin);

  // Compensator bottom fin
  const bottomFin = createBox(0.1, 0.06, 0.32, matCompensator, true);
  bottomFin.position.set(0, -0.11, 0);
  compensatorGroup.add(bottomFin);

  // Muzzle ports (holes represented as dark blocks)
  for (let i = 0; i < 3; i++) {
    const portT = createBox(0.02, 0.01, 0.06, matDarkSteel, true);
    portT.position.set(-0.03 + i * 0.03, 0.14, 0);
    compensatorGroup.add(portT);

    const portB = createBox(0.02, 0.01, 0.06, matDarkSteel, true);
    portB.position.set(-0.03 + i * 0.03, -0.14, 0);
    compensatorGroup.add(portB);
  }

  // Side texturing
  const sideTextL = createBox(0.1, 0.02, 0.34, matDarkSteel, true);
  sideTextL.position.set(0, 0, 0.18);
  compensatorGroup.add(sideTextL);
  const sideTextR = createBox(0.1, 0.02, 0.34, matDarkSteel, true);
  sideTextR.position.set(0, 0, -0.18);
  compensatorGroup.add(sideTextR);

  // Threads (represented as ring segments)
  for (let i = 0; i < 4; i++) {
    const thread = createBox(0.01, 0.17, 0.37, matDarkSteel, true);
    thread.position.set(-0.06 + i * 0.03, 0, 0);
    compensatorGroup.add(thread);
  }

  // Thread locking pin
  const threadPin = createCylinder(0.015, 0.015, 0.2, 6, matSilver, true);
  threadPin.rotation.x = Math.PI / 2;
  threadPin.position.set(0, 0.08, 0.15);
  compensatorGroup.add(threadPin);

  compensatorGroup.position.set(0.52, 0.02, 0);
  return compensatorGroup;
}

// ============================================================
// MAGAZINE (10-round Match magazine)
// ============================================================
function buildMagazine() {
  // Main magazine body
  const magBody = createBox(0.45, 0.7, 0.3, matMagazine, true);
  magBody.position.set(0, -0.1, 0);
  magazineGroup.add(magBody);

  // Magazine basepad
  const basepad = createBox(0.47, 0.06, 0.32, matPolymerDark, true);
  basepad.position.set(0, -0.48, 0);
  magazineGroup.add(basepad);

  // Magazine floor plate
  const floorPlate = createBox(0.43, 0.02, 0.28, matDarkSteel, true);
  floorPlate.position.set(0, -0.52, 0);
  magazineGroup.add(floorPlate);

  // Mag follower (top)
  const follower = createBox(0.4, 0.04, 0.25, matPolymerDark, true);
  follower.position.set(0, 0.28, 0);
  magazineGroup.add(follower);

  // Mag lips
  const magLipL = createBox(0.04, 0.08, 0.28, matDarkSteel, true);
  magLipL.position.set(0.22, 0.26, 0);
  magazineGroup.add(magLipL);
  const magLipR = createBox(0.04, 0.08, 0.28, matDarkSteel, true);
  magLipR.position.set(0.22, 0.26, 0);
  magazineGroup.add(magLipR);

  // Mag spine (rear reinforcement)
  const spine = createBox(0.03, 0.65, 0.02, matDarkSteel, true);
  spine.position.set(-0.21, -0.1, 0.15);
  magazineGroup.add(spine);

  const spine2 = createBox(0.03, 0.65, 0.02, matDarkSteel, true);
  spine2.position.set(-0.21, -0.1, -0.15);
  magazineGroup.add(spine2);

  // Finger grip indentations
  for (let i = 0; i < 3; i++) {
    const indent = createBox(0.02, 0.06, 0.26, matPolymerDark, true);
    indent.position.set(0, -0.1 + i * 0.12, 0.16);
    magazineGroup.add(indent);
  }

  magazineGroup.position.set(-0.15, -1.2, 0);
  return magazineGroup;
}

// ============================================================
// ASSEMBLE PISTOL
// ============================================================
const frame = buildFrame();
const slide = buildSlide();
const barrel = buildBarrel();
const compensator = buildCompensator();
const magazine = buildMagazine();
const recoilSpring = buildRecoilSpring();

// Position frame
pistolGroup.add(frame);

// Position slide above frame (initially assembled)
slide.position.set(0, 0.2, 0);
pistolGroup.add(slide);

// Position barrel inside slide
barrel.position.set(0, 0.1, 0);
pistolGroup.add(barrel);

// Position compensator at muzzle
pistolGroup.add(compensator);

// Position recoil spring under slide
recoilSpring.position.set(0, 0.0, 0);
pistolGroup.add(recoilSpring);

// Position magazine
pistolGroup.add(magazine);

// Tilt the whole pistol slightly for better viewing
pistolGroup.rotation.y = 0.3;
pistolGroup.rotation.x = -0.1;

// --- Ground Plane (shadow catcher) ---
const groundGeo = new THREE.PlaneGeometry(20, 20);
const groundMat = new THREE.MeshLambertMaterial({ color: 0xb0b0b0, flatShading: true });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -2.5;
ground.receiveShadow = true;
scene.add(ground);

// --- Grid reference lines (CAD style) ---
const gridHelper = new THREE.GridHelper(10, 20, 0x999999, 0xaaaaaa);
gridHelper.position.y = -2.49;
scene.add(gridHelper);

// ============================================================
// ANIMATION SYSTEM
// ============================================================

const clock = new THREE.Clock();
let animTime = 0;

// Phase durations (in seconds)
const PHASE_DURATION = 3.5;
const TOTAL_CYCLE = PHASE_DURATION * 4; // disassemble, hold, assemble, hold

// Easing functions
function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function easeOutBack(t) {
  const c1 = 1.70158;
  const c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

// Exploded positions for each component
const explodedPositions = {
  slide:       { x: 0, y: 1.8, z: 0 },
  barrel:      { x: 0, y: 0.8, z: 1.2 },
  frame:       { x: 0, y: 0, z: 0 },
  magazine:    { x: 0, y: -1.5, z: -0.8 },
  compensator: { x: 1.5, y: 1.2, z: 0 },
  recoilSpring:{ x: -1.2, y: 0.5, z: 0.5 }
};

const assembledPositions = {
  slide:       { x: 0, y: 0.2, z: 0 },
  barrel:      { x: 0, y: 0.1, z: 0 },
  frame:       { x: 0, y: 0, z: 0 },
  magazine:    { x: -0.15, y: -1.2, z: 0 },
  compensator: { x: 0.52, y: 0.02, z: 0 },
  recoilSpring:{ x: 0, y: 0.0, z: 0 }
};

// Rotation offsets for exploded view
const explodedRotations = {
  slide:       { x: 0, y: 0, z: 0 },
  barrel:      { x: 0.3, y: 0.5, z: 0 },
  frame:       { x: 0, y: 0, z: 0 },
  magazine:    { x: -0.2, y: 0, z: 0.1 },
  compensator: { x: 0.2, y: 0.8, z: 0 },
  recoilSpring:{ x: 0.5, y: 0.3, z: 0 }
};

// --- Floating animation for each part ---
function floatingOffset(time, index) {
  return Math.sin(time * 1.5 + index * 1.2) * 0.02;
}

// --- Component labels with lines ---
const labelGroup = new THREE.Group();
scene.add(labelGroup);

function updatePhaseLabel(phase) {
  const labels = ['DISASSEMBLING', 'EXPLODED VIEW', 'ASSEMBLING', 'ASSEMBLED'];
  document.getElementById('phase-label').textContent = labels[phase] || 'STANDBY';
}

function animate() {
  requestAnimationFrame(animate);

  const dt = clock.getDelta();
  animTime += dt;

  const cycleTime = animTime % TOTAL_CYCLE;
  let phase, phaseT;

  if (cycleTime < PHASE_DURATION) {
    phase = 0; // Disassembling
    phaseT = cycleTime / PHASE_DURATION;
  } else if (cycleTime < PHASE_DURATION * 2) {
    phase = 1; // Hold exploded
    phaseT = 1;
  } else if (cycleTime < PHASE_DURATION * 3) {
    phase = 2; // Assembling
    phaseT = 1 - (cycleTime - PHASE_DURATION * 2) / PHASE_DURATION;
  } else {
    phase = 3; // Hold assembled
    phaseT = 0;
  }

  updatePhaseLabel(phase);

  const easedT = easeInOutCubic(phaseT);

  // Apply positions to each component
  const components = [
    { mesh: slide, key: 'slide', index: 0 },
    { mesh: barrel, key: 'barrel', index: 1 },
    { mesh: frame, key: 'frame', index: 2 },
    { mesh: magazine, key: 'magazine', index: 3 },
    { mesh: compensator, key: 'compensator', index: 4 },
    { mesh: recoilSpring, key: 'recoilSpring', index: 5 }
  ];

  components.forEach((comp, i) => {
    const assembled = assembledPositions[comp.key];
    const exploded = explodedPositions[comp.key];
    const exRot = explodedRotations[comp.key];

    // Interpolate position
    comp.mesh.position.x = lerp(assembled.x, exploded.x, easedT);
    comp.mesh.position.y = lerp(assembled.y, exploded.y, easedT);
    comp.mesh.position.z = lerp(assembled.z, exploded.z, easedT);

    // Add floating offset when in exploded view
    const float = floatingOffset(animTime, comp.index) * easedT;
    comp.mesh.position.y += float;

    // Interpolate rotation
    comp.mesh.rotation.x = lerp(0, exRot.x, easedT);
    comp.mesh.rotation.y = lerp(0, exRot.y, easedT);
    comp.mesh.rotation.z = lerp(0, exRot.z, easedT);
  });

  // Subtle pistol group rotation for display
  const rotSpeed = 0.15;
  pistolGroup.rotation.y = 0.3 + Math.sin(animTime * rotSpeed) * 0.3;
  pistolGroup.rotation.x = -0.1 + Math.sin(animTime * rotSpeed * 0.7) * 0.05;

  // Fiber optic glow pulse
  const glowIntensity = 0.4 + Math.sin(animTime * 3) * 0.2;
  slide.children.forEach(child => {
    if (child.material && child.material.transparent) {
      child.material.opacity = glowIntensity;
    }
  });

  // Slow camera orbit
  const camRadius = 5.5;
  const camAngle = animTime * 0.12;
  camera.position.x = Math.sin(camAngle) * camRadius;
  camera.position.z = Math.cos(camAngle) * camRadius;
  camera.position.y = 2 + Math.sin(animTime * 0.08) * 0.5;
  camera.lookAt(0.1, 0.1, 0);

  renderer.render(scene, camera);
}

// --- Handle Resize ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Start Animation ---
animate();

console.log('USP Match Tactical — Low-Poly Exploded View loaded.');
console.log('Animation cycle: Disassemble → Hold → Assemble → Hold');
console.log('Camera orbits automatically.');
</script>
