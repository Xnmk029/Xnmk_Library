<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双叉臂悬挂运动学分析系统 | Double Wishbone Suspension Kinematics</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- Top Menu Bar -->
  <div id="menubar">
    <div class="menu-item">文件</div>
    <div class="menu-item">编辑</div>
    <div class="menu-item">视图</div>
    <div class="menu-item">分析</div>
    <div class="menu-item">导出</div>
    <div class="menu-item">帮助</div>
  </div>

  <!-- Toolbar -->
  <div id="toolbar">
    <button id="btn-reset" class="tool-btn" title="重置视图">重置</button>
    <button id="btn-pause" class="tool-btn" title="暂停/继续动画">暂停</button>
    <button id="btn-topview" class="tool-btn" title="俯视图">俯视图</button>
    <button id="btn-sideview" class="tool-btn active" title="侧视图">侧视图</button>
    <span class="toolbar-sep"></span>
    <button id="btn-show-kingpin" class="tool-btn active" title="显示主销">主销路径</button>
    <button id="btn-show-cg" class="tool-btn" title="显示瞬时转向中心">转向中心</button>
    <button id="btn-show-params" class="tool-btn active" title="显示参数标注">参数标注</button>
    <button id="btn-show-deform" class="tool-btn" title="显示弹性变形">弹性变形</button>
    <span class="toolbar-sep"></span>
    <button id="btn-export-svg" class="tool-btn" title="导出SVG">导出SVG</button>
  </div>

  <!-- Main Content -->
  <div id="main-area">
    <!-- Left Panel - Controls -->
    <div id="left-panel">
      <div class="panel-header">悬挂参数</div>
      <div class="panel-body">
        <div class="param-group">
          <div class="param-group-title">上控制臂</div>
          <div class="param-row">
            <label>长度 (mm)</label>
            <input type="number" id="upper-arm-len" value="320" step="1" min="200" max="500">
          </div>
          <div class="param-row">
            <label>安装点高度 (mm)</label>
            <input type="number" id="upper-arm-h" value="180" step="1" min="100" max="300">
          </div>
          <div class="param-row">
            <label>安装点横向偏移 (mm)</label>
            <input type="number" id="upper-arm-offset" value="-40" step="1">
          </div>
        </div>

        <div class="param-group">
          <div class="param-group-title">下控制臂</div>
          <div class="param-row">
            <label>长度 (mm)</label>
            <input type="number" id="lower-arm-len" value="480" step="1" min="300" max="650">
          </div>
          <div class="param-row">
            <label>安装点高度 (mm)</label>
            <input type="number" id="lower-arm-h" value="60" step="1" min="20" max="150">
          </div>
          <div class="param-row">
            <label>安装点横向偏移 (mm)</label>
            <input type="number" id="lower-arm-offset" value="20" step="1">
          </div>
        </div>

        <div class="param-group">
          <div class="param-group-title">转向拉杆</div>
          <div class="param-row">
            <label>连接点高度 (mm)</label>
            <input type="number" id="tierod-height" value="120" step="1">
          </div>
          <div class="param-row">
            <label>横拉杆长度 (mm)</label>
            <input type="number" id="tierod-length" value="400" step="1" min="200" max="600">
          </div>
        </div>

        <div class="param-group">
          <div class="param-group-title">车轮参数</div>
          <div class="param-row">
            <label>车轮半径 (mm)</label>
            <input type="number" id="wheel-radius" value="330" step="1" min="250" max="450">
          </div>
          <div class="param-row">
            <label>静态外倾角 (&deg;)</label>
            <input type="number" id="wheel-camber" value="-1.5" step="0.1" min="-5" max="5">
          </div>
          <div class="param-row">
            <label>静态前束角 (&deg;)</label>
            <input type="number" id="wheel-toe" value="0.2" step="0.1" min="-3" max="3">
          </div>
        </div>
      </div>
    </div>

    <!-- Center - Canvas -->
    <div id="canvas-container">
      <canvas id="main-canvas"></canvas>
      <div id="canvas-coords">X: 0.00  Y: 0.00</div>
    </div>

    <!-- Right Panel - Real-time Data -->
    <div id="right-panel">
      <div class="panel-header">实时运动学数据</div>
      <div class="panel-body">
        <div class="param-group">
          <div class="param-group-title">跳动控制</div>
          <div class="param-row">
            <label>跳动行程 (mm)</label>
            <input type="range" id="jump-slider" min="-80" max="80" value="0" step="1">
          </div>
          <div class="param-row">
            <label>行程: <span id="jump-value">0</span> mm</label>
          </div>
          <div class="param-row">
            <button id="btn-animate" class="param-btn">自动跳动演示</button>
          </div>
        </div>

        <div class="param-group">
          <div class="param-group-title">转向控制</div>
          <div class="param-row">
            <label>转向角 (&deg;)</label>
            <input type="range" id="steer-slider" min="-45" max="45" value="0" step="0.5">
          </div>
          <div class="param-row">
            <label>转角: <span id="steer-value">0.0</span>&deg;</label>
          </div>
          <div class="param-row">
            <button id="btn-steer-animate" class="param-btn">自动转向演示</button>
          </div>
        </div>

        <div class="param-group">
          <div class="param-group-title">计算结果</div>
          <div class="data-row">
            <label>外倾角:</label>
            <span id="data-camber">-1.50&deg;</span>
          </div>
          <div class="data-row">
            <label>前束角:</label>
            <span id="data-toe">0.20&deg;</span>
          </div>
          <div class="data-row">
            <label>主销后倾角:</label>
            <span id="data-caster">12.00&deg;</span>
          </div>
          <div class="data-row">
            <label>主销内倾角:</label>
            <span id="data-saia">8.50&deg;</span>
          </div>
          <div class="data-row">
            <label>跳动中心X:</label>
            <span id="data-jc-x">0.00</span> mm
          </div>
          <div class="data-row">
            <label>跳动中心Y:</label>
            <span id="data-jc-y">0.00</span> mm
          </div>
          <div class="data-row">
            <label>轮距变化:</label>
            <span id="data-track">0.00</span> mm
          </div>
          <div class="data-row">
            <label>跳动圆半径:</label>
            <span id="data-jump-radius">0.00</span> mm
          </div>
        </div>

        <div class="param-group">
          <div class="param-group-title">节点刚度 (N/mm)</div>
          <div class="param-row">
            <label>上臂前衬套</label>
            <input type="number" id="stiff-upper-f" value="5000" step="100">
          </div>
          <div class="param-row">
            <label>上臂后衬套</label>
            <input type="number" id="stiff-upper-r" value="5000" step="100">
          </div>
          <div class="param-row">
            <label>下臂前衬套</label>
            <input type="number" id="stiff-lower-f" value="8000" step="100">
          </div>
          <div class="param-row">
            <label>下臂后衬套</label>
            <input type="number" id="stiff-lower-r" value="8000" step="100">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Status Bar -->
  <div id="statusbar">
    <div id="status-left">就绪 | 双叉臂悬挂运动学分析 v1.0</div>
    <div id="status-center">视图: 侧视图 | 缩放: 100%</div>
    <div id="status-right">坐标系: 车身坐标 | 单位: SI</div>
  </div>
</div>

<script src="suspension.js"></script>
</body>
</html>
