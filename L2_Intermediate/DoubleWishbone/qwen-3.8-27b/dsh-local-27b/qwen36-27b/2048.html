<!DOCTYPE html>
<!-- Author: nolan -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>炼金之塔 Alchemist's Tower</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a14;font-family:'Segoe UI',system-ui,sans-serif;color:#e8e0d4;-webkit-user-select:none;user-select:none}
#bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:linear-gradient(180deg,rgba(10,10,20,.9) 0%,transparent 100%);pointer-events:none}
#hud>*{pointer-events:auto}
.hud-l,.hud-r{display:flex;align-items:center;gap:14px}
.hud-s{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;letter-spacing:.4px;color:#b8a88c}
.hud-s .ic{font-size:16px}
.hud-s .v{color:#ffd700;min-width:32px;text-align:right;font-variant-numeric:tabular-nums}
#floor-lbl{color:#ff9060;font-size:14px;font-weight:700}
#hp-wrap{width:120px;height:8px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
#hp-bar{height:100%;width:100%;background:linear-gradient(90deg,#e04040,#ff6060);border-radius:4px;transition:width .35s cubic-bezier(.4,0,.2,1)}
#relics-hud{display:flex;gap:5px}
.rel-badge{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:14px;background:rgba(255,200,50,.08);border:1px solid rgba(255,200,50,.2);position:relative;cursor:default}
.rel-badge:hover .rel-tip{display:block}
.rel-tip{display:none;position:absolute;bottom:32px;left:50%;transform:translateX(-50%);background:rgba(15,12,8,.96);border:1px solid rgba(200,170,80,.3);border-radius:6px;padding:5px 9px;white-space:nowrap;font-size:10px;color:#e0d0b8;z-index:60;pointer-events:none}

/* GRID */
#gc{position:fixed;top:50%;left:50%;transform:translate(-50%,-46%);z-index:2}
#gc-inner{position:relative;width:min(86vw,420px);height:min(86vw,420px);background:rgba(12,12,22,.78);border:2px solid rgba(100,80,50,.25);border-radius:14px;box-shadow:0 0 50px rgba(180,140,60,.06),inset 0 0 40px rgba(0,0,0,.35);backdrop-filter:blur(6px);overflow:hidden}
#grid-bg{position:absolute;inset:0;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:7px}
.cb{border-radius:9px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.03)}
#tl{position:absolute;inset:0;padding:8px}

/* TILES */
.tile{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:9px;font-weight:800;will-change:transform,top,left;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 6px rgba(0,0,0,.25),0 0 12px rgba(0,0,0,.15);transition:top .1s cubic-bezier(.33,.1,.68,.54),left .1s cubic-bezier(.33,.1,.68,.54)}
.tv{line-height:1}
.tn{font-size:8px;font-weight:600;opacity:.75;margin-top:1px;letter-spacing:.6px;text-transform:uppercase}
.tile-new{animation:tAppear .18s cubic-bezier(.34,1.56,.64,1) both}
.tile-merged{animation:tPop .22s cubic-bezier(.34,1.56,.64,1) both}
@keyframes tAppear{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes tPop{0%{transform:scale(1)}35%{transform:scale(1.25)}65%{transform:scale(.94)}100%{transform:scale(1)}}

/* OVERLAYS */
.ov{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,5,14,.93);backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .35s ease}
.ov.on{opacity:1;pointer-events:auto}
.ov h1{font-size:clamp(26px,6vw,46px);font-weight:900;margin-bottom:6px;text-align:center}
.ov h2{font-size:clamp(14px,3.2vw,22px);font-weight:600;color:#c8bfa8;margin-bottom:20px;text-align:center}
.ov p{font-size:13px;color:#887;font-align:center;max-width:340px;line-height:1.5;text-align:center;margin-bottom:5px}
.btn{padding:11px 34px;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease;margin-top:14px}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.95)}
.btn-g{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#1a1a2e;box-shadow:0 4px 18px rgba(255,180,0,.25)}
.btn-r{background:linear-gradient(135deg,#ff4444,#cc2222);color:#fff;box-shadow:0 4px 18px rgba(255,68,68,.25)}

/* RELIC */
#rel-ctr{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.rel-card{width:130px;padding:14px 10px;border-radius:11px;background:rgba(25,20,15,.92);border:1px solid rgba(200,170,80,.18);cursor:pointer;text-align:center;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.rel-card:hover{transform:translateY(-4px);border-color:rgba(255,200,50,.45);box-shadow:0 8px 22px rgba(255,180,0,.12)}
.rc-icon{font-size:30px;margin-bottom:6px}.rc-name{font-size:12px;font-weight:700;color:#ffd700;margin-bottom:3px}.rc-desc{font-size:10px;color:#a09080;line-height:1.35}

/* COMBAT */
#ci{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:20;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s ease}
#ci.on{opacity:1}
#e-spr{font-size:44px;animation:eIdle 1.4s ease-in-out infinite}
@keyframes eIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
#e-nm{font-size:13px;font-weight:700;color:#ff9060}
#e-hp-w{width:110px;height:7px;background:rgba(255,255,255,.08);border-radius:4px;margin:3px auto;overflow:hidden}
#e-hp-b{height:100%;width:100%;background:linear-gradient(90deg,#ff4060,#ff8060);border-radius:4px;transition:width .25s ease}
#e-log{font-size:11px;color:#c0b098;margin-top:5px;min-height:16px}

/* EFFECTS */
#particles{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.particle{position:absolute;border-radius:50%;pointer-events:none;will-change:transform,opacity}
.shake{animation:shk .12s ease-out}
@keyframes shk{0%{transform:translate(-50%,-46%)}25%{transform:translate(calc(-50% - 3px),calc(-46% + 2px))}50%{transform:translate(calc(-50% + 3px),calc(-46% - 2px))}75%{transform:translate(calc(-50% - 2px),calc(-46% + 3px))}100%{transform:translate(-50%,-46%)}}
#dmg-flash{position:fixed;inset:0;z-index:70;pointer-events:none;background:radial-gradient(ellipse,rgba(255,0,0,.22),rgba(255,0,0,.04));opacity:0;transition:opacity .08s}
#dmg-flash.on{opacity:1}
#fb{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%);z-index:80;font-size:clamp(22px,5vw,38px);font-weight:900;color:#ffd700;text-shadow:0 0 30px rgba(255,180,0,.35);opacity:0;pointer-events:none;white-space:nowrap}
#fb.on{animation:fbPop .75s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes fbPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}50%{transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
.toast{position:fixed;top:58px;left:50%;transform:translateX(-50%) translateY(-16px);z-index:60;padding:7px 18px;border-radius:7px;background:rgba(25,20,12,.94);border:1px solid rgba(255,200,50,.25);font-size:12px;font-weight:600;color:#ffd700;opacity:0;pointer-events:none;box-shadow:0 4px 14px rgba(255,180,0,.12);transition:opacity .25s ease,transform .25s ease;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.ft{position:absolute;font-weight:900;pointer-events:none;text-shadow:0 0 8px rgba(255,180,0,.4);animation:ftUp .7s ease-out forwards;z-index:30}
@keyframes ftUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-36px) scale(1.15)}}
.stats{display:flex;gap:20px;margin:14px 0}.sb{text-align:center}.sv{font-size:26px;font-weight:900;color:#ffd700}.sl{font-size:10px;color:#887;text-transform:uppercase}
#title-h1{background:linear-gradient(135deg,#ffd700,#ff8c00,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 18px rgba(255,180,0,.25))}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div id="hud">
  <div class="hud-l">
    <div id="floor-lbl">🗼 1</div>
    <div class="hud-s"><span class="ic">❤️</span><div id="hp-wrap"><div id="hp-bar"></div></div></div>
  </div>
  <div class="hud-r">
    <div id="relics-hud"></div>
    <div class="hud-s"><span class="ic">⭐</span><span class="v" id="score-v">0</span></div>
  </div>
</div>

<div id="gc"><div id="gc-inner"><div id="grid-bg"></div><div id="tl"></div></div></div>

<div id="ci">
  <div id="e-spr">👾</div>
  <div id="e-nm">Enemy</div>
  <div id="e-hp-w"><div id="e-hp-b"></div></div>
  <div id="e-log"></div>
</div>

<div id="particles"></div>
<div id="dmg-flash"></div>
<div id="fb"></div>
<div class="toast" id="toast"></div>

<div class="ov on" id="ov-title">
  <h1 id="title-h1">⚗️ 炼金之塔</h1>
  <h2>Alchemist's Tower</h2>
  <p>合并元素方块，释放炼金力量<br>击败各层守卫，攀登塔顶第10层</p>
  <p style="color:#665;font-size:11px;margin-top:8px">← → ↑ ↓ / WASD / 触屏滑动</p>
  <button class="btn btn-g" id="btn-go">开始攀登</button>
</div>

<div class="ov" id="ov-relic">
  <h2 style="color:#ffd700">选择一件遗物</h2>
  <p>遗物将永久增强你的炼金之力</p>
  <div id="rel-ctr"></div>
</div>

<div class="ov" id="ov-over">
  <h1 style="color:#ff4444">💀 陨落</h1>
  <h2 id="go-floor">倒在第 3 层</h2>
  <div class="stats">
    <div class="sb"><div class="sv" id="go-score">0</div><div class="sl">分数</div></div>
    <div class="sb"><div class="sv" id="go-max">0</div><div class="sl">最大方块</div></div>
    <div class="sb"><div class="sv" id="go-merge">0</div><div class="sl">融合</div></div>
  </div>
  <button class="btn btn-g" id="btn-retry">再次挑战</button>
</div>

<div class="ov" id="ov-win">
  <h1 style="color:#ffd700">🏆 登顶成功！</h1>
  <h2>你征服了炼金之塔！</h2>
  <div class="stats">
    <div class="sb"><div class="sv" id="win-score">0</div><div class="sl">分数</div></div>
    <div class="sb"><div class="sv" id="win-max">0</div><div class="sl">最大方块</div></div>
  </div>
  <button class="btn btn-g" id="btn-restart">再来一局</button>
</div>

<script>
(function(){
"use strict";

// ============================================================
// CONSTANTS
// ============================================================
const TILE_INFO = [
  {v:2,   nm:'水',  bg:['#142838','#1a3a50'], fg:'#5bc0de', sz:30},
  {v:4,   nm:'火',  bg:['#381414','#501a1a'], fg:'#ff6b4a', sz:30},
  {v:8,   nm:'风',  bg:['#142814','#1a401a'], fg:'#90ee90', sz:30},
  {v:16,  nm:'土',  bg:['#282010','#3a2e18'], fg:'#daa520', sz:30},
  {v:32,  nm:'雷',  bg:['#282810','#3a3a18'], fg:'#ffe040', sz:26},
  {v:64,  nm:'暗',  bg:['#1a0828','#2a1040'], fg:'#cc88ff', sz:26},
  {v:128, nm:'霜',  bg:['#082038','#0a3050'], fg:'#88ddff', sz:24},
  {v:256, nm:'光',  bg:['#282808','#404010'], fg:'#ffee88', sz:24},
  {v:512, nm:'混沌',bg:['#2a0818','#401028'], fg:'#ff88aa', sz:24},
  {v:1024,nm:'虚空',bg:['#08081a','#101038'], fg:'#aabbff', sz:20},
  {v:2048,nm:'起源',bg:['#1a1a08','#303010'], fg:'#ffd700', sz:20},
  {v:4096,nm:'永恒',bg:['#2a0828','#401040'], fg:'#ff66ff', sz:18},
  {v:8192,nm:'创世',bg:['#081a08','#103010'], fg:'#66ff66', sz:18},
];

function tileInfo(val){
  let res=TILE_INFO[0];
  for(const t of TILE_INFO) if(val>=t.v) res=t;
  return res;
}

const RELICS=[
  {id:'r_double', ic:'✨',nm:'双倍符文', ds:'合并概率+25%', fx:'mergeBonus',  val:.25},
  {id:'r_regen',  ic:'🧪',nm:'生命药剂', ds:'每回合回复1HP',  fx:'regen',     val:1},
  {id:'r_str',    ic:'🧤',nm:'力量手套', ds:'攻击力+50%',     fx:'atkMul',    val:1.5},
  {id:'r_shield', ic:'💍',nm:'护盾戒指', ds:'受到伤害-30%',   fx:'dmgMul',    val:.7},
  {id:'r_mag',    ic:'🧲',nm:'元素磁铁', ds:'30%概率生成高级方块', fx:'spawnHi', val:1},
  {id:'r_time',   ic:'💎',nm:'时光水晶', ds:'每回合额外移动一次', fx:'extraMov', val:1},
  {id:'r_berserk',ic:'⚔️',nm:'狂战士',   ds:'HP<30%时攻击翻倍',  fx:'berserk',   val:1},
  {id:'r_gold',   ic:'👑',nm:'点金手',   ds:'合并额外获得2倍分数', fx:'scoreMul', val:2},
  {id:'r_ghost',  ic:'👻',nm:'幽灵步',   ds:'15%概率闪避攻击',  fx:'dodge',     val:.15},
  {id:'r_crit',   ic:'💥',nm:'暴击宝石', ds:'12%概率造成3倍伤害', fx:'crit',    val:.12},
  {id:'r_poison', ic:'☠️',nm:'毒素精华', ds:'每次攻击+累积毒伤',  fx:'poison',  val:2},
  {id:'r_lifesteal',ic:'🩸',nm:'生命窃取',ds:'击杀敌人回复2HP', fx:'lifesteal',val:2},
];

const ENEMIES=[
  {sp:'🦠',nm:'黏液怪',   hp:12,  dmg:2,  fl:1},
  {sp:'🐺',nm:'暗影狼',   hp:22,  dmg:3,  fl:2},
  {sp:'🦇',nm:'蝙蝠群',   hp:18,  dmg:4,  fl:3},
  {sp:'👹',nm:'石像鬼',   hp:35,  dmg:5,  fl:4},
  {sp:'🐉',nm:'幼龙',     hp:50,  dmg:7,  fl:5},
  {sp:'🧙',nm:'黑魔法师',  hp:42,  dmg:9,  fl:6},
  {sp:'👿',nm:'恶魔',     hp:65,  dmg:11, fl:7},
  {sp:'🦑',nm:'克苏鲁',   hp:85,  dmg:13, fl:8},
  {sp:'💀',nm:'死亡领主',  hp:100, dmg:15, fl:9},
  {sp:'👑',nm:'塔主',     hp:160, dmg:18, fl:10},
];

function makeEnemy(floor){
  const idx=Math.min(floor-1,ENEMIES.length-1);
  const t=ENEMIES[idx];
  const s=1+(floor-1)*.08;
  return{sp:t.sp,nm:t.nm,hp:Math.floor(t.hp*s),mhp:Math.floor(t.hp*s),dmg:Math.floor(t.dmg*s)};
}

// ============================================================
// DOM REFS
// ============================================================
const $=id=>document.getElementById(id);
const $gc=$('gc'),$gci=$('gc-inner'),$gbg=$('grid-bg'),$tl=$('tl');
const $sv=$('score-v'),$fl=$('floor-lbl'),$hpb=$('hp-bar');
const $rhd=$('relics-hud'),$pts=$('particles'),$df=$('dmg-flash'),$fb=$('fb'),$toast=$('toast');
const $ci=$('ci'),$es=$('e-spr'),$en=$('e-nm'),$ehb=$('e-hp-b'),$elog=$('e-log');
const $ovT=$('ov-title'),$ovR=$('ov-relic'),$ovO=$('ov-over'),$ovW=$('ov-win');

// ============================================================
// GRID BG
// ============================================================
for(let i=0;i<16;i++){const d=document.createElement('div');d.className='cb';$gbg.appendChild(d);}

// ============================================================
// THREE.JS BACKGROUND
// ============================================================
(function(){
  const c=$('bg-canvas');
  const R=new THREE.WebGLRenderer({canvas:c,antialias:true,alpha:true});
  R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));
  const S=new THREE.Scene();S.fog=new THREE.FogExp2(0x0a0a14,.03);
  const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,80);
  cam.position.set(0,5,11);cam.lookAt(0,3,0);
  S.add(new THREE.AmbientLight(0x222244,.5));
  const dl=new THREE.DirectionalLight(0xffd080,.35);dl.position.set(4,10,4);S.add(dl);
  const pl=new THREE.PointLight(0xff8c00,.7,25);pl.position.set(0,7,3);S.add(pl);

  // Tower wireframe
  const tg=new THREE.CylinderGeometry(1.2,2.2,16,8,4,true);
  const tm=new THREE.MeshBasicMaterial({color:0x3a3050,wireframe:true,transparent:true,opacity:.15});
  const tw=new THREE.Mesh(tg,tm);tw.position.y=6;S.add(tw);

  // Rings
  const rg=new THREE.TorusGeometry(1.8,.04,6,32);
  for(let i=0;i<6;i++){
    const rm=new THREE.MeshBasicMaterial({color:0xffd700,transparent:true,opacity:.25+i*.04});
    const rn=new THREE.Mesh(rg,rm);rn.position.y=2+i*2.4;rn.rotation.x=Math.PI/2;S.add(rn);
  }

  // Stars
  const sc=250,sg=new THREE.BufferGeometry(),sp=new Float32Array(sc*3),sc2=new Float32Array(sc*3);
  for(let i=0;i<sc;i++){
    sp[i*3]=(Math.random()-.5)*28;sp[i*3+1]=Math.random()*18;sp[i*3+2]=(Math.random()-.5)*28;
    const col=new THREE.Color().setHSL(.08+Math.random()*.12,.7,.4+Math.random()*.3);
    sc2[i*3]=col.r;sc2[i*3+1]=col.g;sc2[i*3+2]=col.b;
  }
  sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
  sg.setAttribute('color',new THREE.BufferAttribute(sc2,3));
  const sm=new THREE.PointsMaterial({size:.05,vertexColors:true,transparent:true,opacity:.7});
  const stars=new THREE.Points(sg,sm);S.add(stars);

  // Orbs
  const orbs=[];
  for(let i=0;i<6;i++){
    const og=new THREE.SphereGeometry(.1+Math.random()*.12,10,10);
    const oc=new THREE.Color().setHSL(Math.random()*.12+.06,.85,.45);
    const om=new THREE.MeshBasicMaterial({color:oc,transparent:true,opacity:.6});
    const ob=new THREE.Mesh(og,om);
    ob.da={a:Math.random()*6.28,s:.15+Math.random()*.25,r:2+Math.random()*1.8,yb:2+Math.random()*7,ys:.2+Math.random()*.3};
    S.add(ob);orbs.push(ob);
  }

  const clk=new THREE.Clock();
  (function anim(){requestAnimationFrame(anim);const t=clk.getElapsedTime();
    orbs.forEach(o=>{const d=o.da;o.position.x=Math.cos(d.a+t*d.s)*d.r;o.position.z=Math.sin(d.a+t*d.s)*d.r;o.position.y=d.yb+Math.sin(t*d.ys)*.4;});
    stars.rotation.y=t*.015;tw.rotation.y=t*.03;R.render(S,cam);
  })();
  addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
})();

// ============================================================
// GAME STATE
// ============================================================
let G,tileEls={},animating=false,mergeCellsThisMove=0,enemyHits=0;

function reset(){
  G={
    gr:Array.from({length:4},()=>Array(4).fill(0)),
    sc:0,hp:15,mhp:15,fl:1,mfl:10,mt:2,tm:0,
    relics:[],inCombat:false,enemy:null,over:false,paused:false,
    mf:0,mfc:10,
    // relic stats
    mergeBonus:0,regen:false,atkMul:1,dmgMul:1,spawnHi:false,
    extraMov:false,berserk:false,scoreMul:0,dodgeCh:0,critCh:0,
    poison:false,poisonDmg:0,lifestealAmt:0,
  };
  tileEls={};animating=false;mergeCellsThisMove=0;enemyHits=0;
}

// ============================================================
// TILE HELPERS
// ============================================================
function cellSize(){
  const w=$gci.getBoundingClientRect().width-16;
  return{cs:(w-7*3)/4,g:7,p:8};
}
function tileXY(r,c){const{cs,g,p}=cellSize();return{x:p+c*(cs+g),y:p+r*(cs+g),s:cs};}

function mkTile(r,c,val,cls){
  const info=tileInfo(val),xy=tileXY(r,c);
  const el=document.createElement('div');
  el.className='tile'+(cls?' '+cls:'');
  Object.assign(el.style,{top:xy.y+'px',left:xy.x+'px',width:xy.s+'px',height:xy.s+'px',
    background:'linear-gradient(135deg,'+info.bg[0]+','+info.bg[1]+')',
    fontSize:info.sz+'px',color:info.fg});
  el.innerHTML='<span class="tv">'+val+'</span>'+(val>=32?'<span class="tn">'+info.nm+'</span>':'');
  $tl.appendChild(el);tileEls[r+','+c]=el;return el;
}
function rmTile(r,c){const k=r+','+c;if(tileEls[k]){tileEls[k].remove();delete tileEls[k];}}
function clearTiles(){$tl.innerHTML='';tileEls={};}
function renderAll(){
  clearTiles();
  for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(G.gr[r][c]>0) mkTile(r,c,G.gr[r][c],'');
}

function emptyCells(){
  const a=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!G.gr[r][c])a.push([r,c]);return a;
}

function spawnTile(){
  const e=emptyCells();if(!e.length)return null;
  const[r,c]=e[Math.random()*e.length|0];
  let v=2;
  if(G.spawnHi&&Math.random()<.3) v=Math.random()<.5?4:8;
  G.gr[r][c]=v;if(v>G.mt)G.mt=v;
  mkTile(r,c,v,'tile-new');
  // Subtle particle burst on spawn
  const xy=tileXY(r,c),info=tileInfo(v);
  const rect=$gci.getBoundingClientRect();
  for(let i=0;i<4;i++){
    const p=document.createElement('div');p.className='particle';
    const sz=2+Math.random()*3;p.style.cssText=`width:${sz}px;height:${sz}px;background:${info.fg};left:${rect.left+xy.x+xy.s/2}px;top:${rect.top+xy.y+xy.s/2}px;box-shadow:0 0 ${sz}px ${info.fg};`;
    $pts.appendChild(p);
    const ang=Math.random()*6.28,spd=20+Math.random()*40;
    gsap.to(p,{x:Math.cos(ang)*spd,y:Math.sin(ang)*spd,opacity:0,scale:0,duration:.3+.2*Math.random(),ease:'power2.out',onComplete:()=>p.remove()});
  }
  return{r,c,v};
}

// ============================================================
// MOVE LOGIC — computes new grid + animation info
// ============================================================
function slideLine(line){
  // Returns {result:[4 vals], merges:[{pos,idx1,idx2,val}], moves:[{from,to}]}
  const compact=line.map((v,i)=>({v,i})).filter(x=>x.v>0);
  const result=[],merges=[];
  let i=0;
  while(i<compact.length){
    if(i+1<compact.length&&compact[i].v===compact[i+1].v){
      const nv=compact[i].v*2;
      result.push(nv);merges.push({at:result.length-1});
      i+=2;
    }else{result.push(compact[i].v);i++;}
  }
  while(result.length<4)result.push(0);

  // Build move list: match compact entries to result positions
  const moves=[];
  let ri=0,ci=0;
  const mergeSources=new Set();
  for(let mi=0;mi<merges.length;mi++){
    const mPos=merges[mi].at;
    // Find the two source indices in compact
  }

  // Simpler approach: build move map
  // For each result slot, find which compact index maps to it
  const slotSources=[]; // for each result slot, array of compact indices
  ri=0;ci=0;
  while(ri<4){
    if(result[ri]===0){ri++;continue;}
    // Check if this is a merge position
    const isMerge=merges.some(m=>m.at===ri);
    if(isMerge&&ci+1<compact.length&&compact[ci].v+compact[ci+1].v===result[ri]){
      slotSources.push([compact[ci].i,compact[ci+1].i]);
      ci+=2;
    }else{
      slotSources.push([compact[ci].i]);
      ci++;
    }
    ri++;
  }
  return{result,slotSources,merges};
}

function computeMove(dir){
  const old=G.gr.map(r=>[...r]);
  const animList=[];let totalMerges=0;

  // For each line in the move direction, slide
  if(dir==='left'||dir==='right'){
    for(let r=0;r<4;r++){
      const line=dir==='left'?[old[r][0],old[r][1],old[r][2],old[r][3]]:[old[r][3],old[r][2],old[r][1],old[r][0]];
      const{result,slotSources}=slideLine(line);
      for(let i=0;i<4;i++){
        const toC=dir==='left'?i:3-i;
        const sources=slotSources[i]||[];
        sources.forEach(si=>{
          const fromC=dir==='left'?si:3-si;
          if(fromC!==toC||sources.length>1){
            animList.push({fromR:r,fromC,toR:r,toC,isMerge:sources.length>1});
            if(sources.length>1)totalMerges++;
          }
        });
        if(dir==='left') G.gr[r][i]=result[i];
        else G.gr[r][3-i]=result[i];
      }
    }
  }else{
    for(let c=0;c<4;c++){
      const line=dir==='up'?[old[0][c],old[1][c],old[2][c],old[3][c]]:[old[3][c],old[2][c],old[1][c],old[0][c]];
      const{result,slotSources}=slideLine(line);
      for(let i=0;i<4;i++){
        const toR=dir==='up'?i:3-i;
        const sources=slotSources[i]||[];
        sources.forEach(si=>{
          const fromR=dir==='up'?si:3-si;
          if(fromR!==toR||sources.length>1){
            animList.push({fromR,fromC:c,toR,toC:c,isMerge:sources.length>1});
            if(sources.length>1)totalMerges++;
          }
        });
        if(dir==='up') G.gr[i][c]=result[i];
        else G.gr[3-i][c]=result[i];
      }
    }
  }

  // Check if grid changed
  const changed = (old,r,c)=>old[r][c]!==G.gr[r][c];
  let hasChange=false;
  for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(old[r][c]!==G.gr[r][c])hasChange=true;
  return{animList,totalMerges,changed:hasChange};
}

function isFull(){
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    if(!G.gr[r][c])return false;
    if(c<3&&G.gr[r][c]===G.gr[r][c+1])return false;
    if(r<3&&G.gr[r][c]===G.gr[r+1][c])return false;
  }return true;
}

// ============================================================
// MAIN MOVE
// ============================================================
function doMove(dir){
  if(G.paused||G.over||animating) return;

  const{animList,totalMerges,changed}=computeMove(dir);
  if(!changed) return;

  animating=true;
  mergeCellsThisMove=totalMerges;
  G.tm+=totalMerges;

  // Score from merges
  const mergedPos=new Set();
  animList.forEach(a=>{if(a.isMerge){
    mergedPos.add(a.toR+','+a.toC);
    const val=G.gr[a.toR][a.toC];
    G.sc+=val+Math.floor((G.scoreMul||0)*val);
    if(val>G.mt)G.mt=val;
  }});

  // --- ANIMATION Phase 1: slide tiles ---
  // For merges, we need to handle overlapping tiles specially
  // Group merge pairs that go to same destination
  const mergeGroups={};
  animList.forEach(a=>{
    if(a.isMerge){
      const key=a.toR+','+a.toC;
      if(!mergeGroups[key])mergeGroups[key]=[];
      mergeGroups[key].push(a);
    }
  });

  // Animate each tile to its destination
  animList.forEach(a=>{
    const key=a.fromR+','+a.fromC;
    const el=tileEls[key];
    if(!el) return;
    const dest=tileXY(a.toR,a.toC);
    // If merge, offset one tile slightly to show both before merge
    if(a.isMerge){
      const group=mergeGroups[a.toR+','+a.toC];
      const idx=group.indexOf(a);
      if(idx===0){
        el.style.top=(dest.y-3)+'px';
        el.style.left=(dest.x-3)+'px';
      }else{
        el.style.top=(dest.y+3)+'px';
        el.style.left=(dest.x+3)+'px';
      }
    }else{
      el.style.top=dest.y+'px';
      el.style.left=dest.x+'px';
    }
    delete tileEls[key];
  });

  // --- Phase 2: resolve merges ---
  setTimeout(()=>{
    clearTiles();
    for(let r=0;r<4;r++)for(let c=0;c<4;c++){
      if(G.gr[r][c]>0) mkTile(r,c,G.gr[r][c],'');
    }
    mergedPos.forEach(k=>{const el=tileEls[k];if(el)el.classList.add('tile-merged');});

    // Particles
    const rect=$gci.getBoundingClientRect();
    mergedPos.forEach(k=>{
      const[r,c]=k.split(',').map(Number);
      const xy=tileXY(r,c),info=tileInfo(G.gr[r][c]);
      const px=rect.left+xy.x+xy.s/2,py=rect.top+xy.y+xy.s/2;
      for(let i=0;i<14;i++){
        const p=document.createElement('div');p.className='particle';
        const sz=3+Math.random()*5;p.style.cssText=`width:${sz}px;height:${sz}px;background:${info.fg};left:${px}px;top:${py}px;box-shadow:0 0 ${sz+2}px ${info.fg};`;
        $pts.appendChild(p);
        const ang=Math.random()*6.28,spd=50+Math.random()*100;
        gsap.to(p,{x:Math.cos(ang)*spd,y:Math.sin(ang)*spd,opacity:0,scale:.1,duration:.35+Math.random()*.35,ease:'power2.out',onComplete:()=>p.remove()});
      }
    });

    // Float text
    mergedPos.forEach(k=>{
      const[r,c]=k.split(',').map(Number);
      const ft=document.createElement('div');ft.className='ft';
      ft.textContent='+'+G.gr[r][c];ft.style.color=tileInfo(G.gr[r][c]).fg;
      ft.style.fontSize='18px';ft.style.left='50%';ft.style.top='35%';ft.style.transform='translateX(-50%)';
      $gci.appendChild(ft);setTimeout(()=>ft.remove(),700);
    });

    if(totalMerges>0){$gc.classList.add('shake');setTimeout(()=>$gc.classList.remove('shake'),120);}

    // Phase 3: spawn & continue
    setTimeout(()=>{
      spawnTile();updateHUD();animating=false;
      if(G.regen&&G.hp<G.mhp){G.hp=Math.min(G.mhp,G.hp+1);updateHUD();}
      G.mf++;if(G.extraMov)G.mf++;
      if(G.inCombat&&mergeCellsThisMove>0) playerAttack();
      if(G.inCombat){enemyHits++;if(enemyHits>=4)enemyAttack();}
      if(G.mf>=G.mfc&&!G.inCombat&&!G.over) startCombat();
      if(isFull()) triggerGameOver();
    },200);
  },120);
}

// ============================================================
// COMBAT
// ============================================================
function startCombat(){
  G.inCombat=true;G.mf=0;enemyHits=0;
  G.enemy=makeEnemy(G.fl);
  G.poisonDmg=0;
  $es.textContent=G.enemy.sp;
  $en.textContent=G.enemy.nm+' Lv.'+G.fl;
  $ehb.style.width='100%';
  $elog.textContent='合并方块来攻击！';
  $ci.classList.add('on');
  showToast('⚔️ 遭遇 '+G.enemy.nm+'！');
}

function playerAttack(){
  if(!G.inCombat||!G.enemy) return;
  let atk=Math.max(2,Math.floor(G.mt/2)*mergeCellsThisMove)*G.atkMul;
  if(G.berserk&&G.hp<G.mhp*.3) atk*=2;
  let crit=false;
  if(G.critCh>0&&Math.random()<G.critCh){atk*=3;crit=true;}
  if(G.poison){G.poisonDmg+=2;atk+=G.poisonDmg;}
  G.enemy.hp-=atk;if(G.enemy.hp<0)G.enemy.hp=0;
  $ehb.style.width=(G.enemy.hp/G.enemy.mhp*100)+'%';
  let msg='造成 '+atk+' 伤害';
  if(crit) msg='💥 暴击！'+msg;
  if(G.poison&&G.poisonDmg>0) msg+=' (毒素+'+G.poisonDmg+')';
  $elog.textContent=msg;
  showFloat('-'+atk,'#ff4466');

  if(G.enemy.hp<=0) defeatEnemy();
}

function enemyAttack(){
  if(!G.inCombat||!G.enemy) return;
  if(G.dodgeCh>0&&Math.random()<G.dodgeCh){
    $elog.textContent='👻 闪避！';return;
  }
  let dmg=Math.max(1,Math.floor(G.enemy.dmg*G.dmgMul));
  G.hp-=dmg;if(G.hp<0)G.hp=0;
  updateHUD();
  $df.classList.add('on');setTimeout(()=>$df.classList.remove('on'),180);
  $elog.textContent=G.enemy.nm+' 造成 '+dmg+' 伤害！';
  if(G.hp<=0){G.inCombat=false;$ci.classList.remove('on');triggerGameOver();}
}

function defeatEnemy(){
  G.inCombat=false;
  const bonus=G.enemy.mhp;G.sc+=bonus;
  if(G.lifestealAmt>0) G.hp=Math.min(G.mhp,G.hp+G.lifestealAmt);
  $elog.textContent='🎉 击败 '+G.enemy.nm+'！+'+bonus+'分';
  setTimeout(()=>{
    $ci.classList.remove('on');
    G.mf=0;G.fl++;updateHUD();
    if(G.fl>G.mfl){triggerWin();return;}
    $fb.textContent='🗼 第 '+G.fl+' 层';
    $fb.className='on';setTimeout(()=>$fb.className='',750);
    if((G.fl-1)%2===0) setTimeout(()=>showRelics(),500);
  },1000);
}

// ============================================================
// RELICS
// ============================================================
function showRelics(){
  G.paused=true;
  const $c=$('rel-ctr');$c.innerHTML='';
  const avail=RELICS.filter(r=>!G.relics.find(e=>e.id===r.id));
  const pool=[];const used=new Set();
  const poolArr=avail.length<3?avail:[...avail];
  while(pool.length<3&&pool.length<poolArr.length){
    const r=poolArr[Math.random()*poolArr.length|0];
    if(!used.has(r.id)){used.add(r.id);pool.push(r);}
  }
  pool.forEach(r=>{
    const d=document.createElement('div');d.className='rel-card';
    d.innerHTML='<div class="rc-icon">'+r.ic+'</div><div class="rc-name">'+r.nm+'</div><div class="rc-desc">'+r.ds+'</div>';
    d.addEventListener('click',()=>pickRelic(r));
    $c.appendChild(d);
  });
  $ovR.classList.add('on');
}

function pickRelic(r){
  G.relics.push(r);
  switch(r.fx){
    case'mergeBonus':G.mergeBonus+=r.val;break;
    case'regen':G.regen=true;break;
    case'atkMul':G.atkMul*=r.val;break;
    case'dmgMul':G.dmgMul*=r.val;break;
    case'spawnHi':G.spawnHi=true;break;
    case'extraMov':G.extraMov=true;break;
    case'berserk':G.berserk=true;break;
    case'scoreMul':G.scoreMul+=r.val;break;
    case'dodge':G.dodgeCh+=r.val;break;
    case'crit':G.critCh+=r.val;break;
    case'poison':G.poison=true;break;
    case'lifesteal':G.lifestealAmt+=r.val;break;
  }
  $ovR.classList.remove('on');
  showToast('获得 '+r.ic+' '+r.nm);
  updRelics();G.paused=false;
}

function updRelics(){
  $rhd.innerHTML='';
  G.relics.forEach(r=>{
    const d=document.createElement('div');d.className='rel-badge';
    d.innerHTML=r.ic+'<div class="rel-tip">'+r.nm+': '+r.ds+'</div>';
    $rhd.appendChild(d);
  });
}

// ============================================================
// HUD
// ============================================================
function updateHUD(){
  $sv.textContent=G.sc;
  $fl.textContent='🗼 '+G.fl;
  const pct=G.hp/G.mhp*100;
  $hpb.style.width=pct+'%';
  $hpb.style.background=pct<30?'linear-gradient(90deg,#cc0000,#ff2020)':'linear-gradient(90deg,#e04040,#ff6060)';
}

// ============================================================
// EFFECTS
// ============================================================
function showFloat(t,c){
  const d=document.createElement('div');d.className='ft';d.textContent=t;d.style.color=c;
  d.style.fontSize='20px';d.style.left='50%';d.style.top='38%';d.style.transform='translateX(-50%)';
  $gci.appendChild(d);setTimeout(()=>d.remove(),700);
}

let toastTimer=null;
function showToast(m){
  $toast.textContent=m;$toast.className='toast on';
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>$toast.className='toast',2200);
}

// ============================================================
// GAME OVER / WIN
// ============================================================
function triggerGameOver(){
  G.over=true;G.paused=true;$ci.classList.remove('on');
  $('go-floor').textContent='倒在第 '+G.fl+' 层';
  $('go-score').textContent=G.sc;
  $('go-max').textContent=G.mt;
  $('go-merge').textContent=G.tm;
  setTimeout(()=>$ovO.classList.add('on'),400);
}

function triggerWin(){
  G.over=true;G.paused=true;$ci.classList.remove('on');
  $('win-score').textContent=G.sc;
  $('win-max').textContent=G.mt;
  setTimeout(()=>$ovW.classList.add('on'),400);
}

// ============================================================
// START
// ============================================================
function startGame(){
  reset();clearTiles();
  $ci.classList.remove('on');
  $ovT.classList.remove('on');$ovO.classList.remove('on');$ovW.classList.remove('on');$ovR.classList.remove('on');
  $rhd.innerHTML='';
  spawnTile();spawnTile();
  updateHUD();updRelics();
}

$('btn-go').addEventListener('click',startGame);
$('btn-retry').addEventListener('click',startGame);
$('btn-restart').addEventListener('click',startGame);

// ============================================================
// INPUT
// ============================================================
const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
document.addEventListener('keydown',e=>{
  const d=KEYMAP[e.key];if(d){e.preventDefault();doMove(d);}
});

let tX=0,tY=0;
document.addEventListener('touchstart',e=>{tX=e.touches[0].clientX;tY=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tX,dy=e.changedTouches[0].clientY-tY;
  if(Math.max(Math.abs(dx),Math.abs(dy))<25) return;
  const d=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');
  doMove(d);
},{passive:true});

// ============================================================
// RESIZE
// ============================================================
let resizeTimer;
addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(!G.over)renderAll();},200);});

})();
</script>
