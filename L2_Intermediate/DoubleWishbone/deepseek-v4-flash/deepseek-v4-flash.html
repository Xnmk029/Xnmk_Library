<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双叉臂独立悬挂运动学模拟系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; color: #c0c0c0; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; user-select: none; }

#app { display: flex; flex-direction: column; width: 100%; height: 100%; }

#header { display: flex; justify-content: space-between; align-items: center; height: 34px; min-height: 34px; padding: 0 14px; background: #141414; border-bottom: 1px solid #2a2a2a; }
#header .title { font-size: 13px; color: #d0d0d0; letter-spacing: 1px; }
#header .info { display: flex; gap: 20px; font-size: 11px; color: #777; }
#header .info .val { color: #bbb; }

#canvas-wrap { flex: 1; position: relative; overflow: hidden; background: #0d0d0d; }
#canvas-wrap canvas { display: block; width: 100%; height: 100%; }

#status-bar { display: flex; justify-content: space-between; align-items: center; height: 22px; min-height: 22px; padding: 0 14px; background: #141414; border-top: 1px solid #2a2a2a; font-size: 10px; color: #555; }
#status-bar .status-right { display: flex; gap: 14px; }

#controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 8px 14px; background: #121212; border-top: 1px solid #222; }
#controls .ctrl-group { display: flex; align-items: center; gap: 5px; }
#controls label { font-size: 11px; color: #777; min-width: 32px; letter-spacing: 0.5px; }
#controls input[type=range] { -webkit-appearance: none; appearance: none; width: 120px; height: 2px; background: #333; outline: none; }
#controls input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 9px; height: 16px; background: #888; border: none; cursor: pointer; }
#controls input[type=range]::-moz-range-thumb { width: 9px; height: 16px; background: #888; border: none; cursor: pointer; border-radius: 0; }
#controls .range-val { font-size: 11px; color: #999; min-width: 32px; text-align: right; }

#controls .chk-group { display: flex; align-items: center; gap: 3px; }
#controls input[type=checkbox] { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border: 1px solid #555; background: #1a1a1a; cursor: pointer; margin: 0; }
#controls input[type=checkbox]:checked { background: #888; border-color: #888; }
#controls input[type=checkbox]:checked::after { content: ''; display: block; width: 6px; height: 6px; margin: 2px; background: #1a1a1a; }
#controls .chk-label { font-size: 11px; color: #777; cursor: pointer; }

#controls .btn { padding: 2px 10px; background: #1a1a1a; border: 1px solid #444; color: #999; cursor: pointer; font-family: inherit; font-size: 11px; }
#controls .btn:hover { background: #222; border-color: #666; color: #ccc; }
</style>
</head>
<body>
    <!-- Model Name Watermark -->
<div style="position: fixed; top: 15px; left: 50%; transform: translateX(-50%); z-index: 9999999; pointer-events: none; opacity: 0.35; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 32px; font-weight: 700; color: #888; text-shadow: 1px 1px 0px rgba(255,255,255,0.8), -1px -1px 0px rgba(0,0,0,0.8); user-select: none; letter-spacing: 0.5px; white-space: nowrap;">DeepSeekV4f</div>
<div id="app">
  <div id="header">
    <span class="title">DOUBLE-WISHBONE SUSPENSION KINEMATICS SIMULATOR</span>
    <div class="info" id="infoBar">
      <span>TRAVEL <span class="val" id="infoBounce">0.0</span> mm</span>
      <span>STEER <span class="val" id="infoSteer">0.0</span> deg</span>
      <span>CAMBER <span class="val" id="infoCamber">0.00</span> deg</span>
      <span>KPI <span class="val" id="infoKPI">0.00</span> deg</span>
    </div>
  </div>
  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
  </div>
  <div id="controls">
    <div class="ctrl-group">
      <label>BOUNCE</label>
      <input type="range" id="bounceSlider" min="-100" max="100" value="0">
      <span class="range-val" id="bounceVal">0.0</span>
    </div>
    <div class="ctrl-group">
      <label>STEER</label>
      <input type="range" id="steerSlider" min="-100" max="100" value="0">
      <span class="range-val" id="steerVal">0.0</span>
    </div>
    <div class="chk-group">
      <input type="checkbox" id="chkTrace" checked>
      <label class="chk-label" for="chkTrace">KINGPIN PATH</label>
    </div>
    <div class="chk-group">
      <input type="checkbox" id="chkLabels" checked>
      <label class="chk-label" for="chkLabels">LABELS</label>
    </div>
    <div class="chk-group">
      <input type="checkbox" id="chkAuto">
      <label class="chk-label" for="chkAuto">AUTO BOUNCE</label>
    </div>
    <button class="btn" id="resetViewBtn">RESET</button>
  </div>
  <div id="status-bar">
    <span>DOUBLE WISHBONE | LEFT FRONT | DRAG TO ROTATE | SCROLL TO ZOOM</span>
    <span class="status-right">
      <span id="fpsDisplay">FPS: --</span>
      <span id="ptDisplay">TRACE: --</span>
    </span>
  </div>
</div>

<script>
(function() {
'use strict';

// ============================================================
// CONSTANTS
// ============================================================
var DEG = Math.PI / 180;
var RAD = 180 / Math.PI;

var COLORS = {
    bg:          '#0d0d0d',
    grid:        '#161616',
    chassis:     '#4a4a4a',
    lowerArm:    '#e8a040',
    lowerArmDim: '#4a3518',
    upperArm:    '#40a8e8',
    upperArmDim: '#18354a',
    knuckle:     '#b0b0b0',
    wheelRim:    '#555',
    tireOuter:   '#444',
    tireInner:   '#333',
    spring:      '#d4c840',
    springDim:   '#4a4418',
    tieRod:      '#40c860',
    steerArm:    '#40c860',
    ballJoint:   '#d0d0d0',
    text:        '#666',
    textBright:  '#aaa',
    textHighlight:'#ddd',
    pathTrace:   '#604080',
    kingpinLine: '#706090',
    rack:        '#555',
};

// ============================================================
// GEOMETRY
// ============================================================
// X: longitudinal (+ rearward), Y: vertical (+ up), Z: lateral (+ right)

// Lower wishbone
var LP_Y = 0.20;
var LP_Z = -0.35;
var LLEN = 0.52;
var L_ANGLE_RIDE = 6 * DEG;
var L_ANGLE_MIN = -6 * DEG;
var L_ANGLE_MAX = 20 * DEG;
var L_FRONT_X = 0.28;
var L_REAR_X = -0.28;

// Upper wishbone
var UP_Y = 0.76;
var UP_Z = -0.35;
var ULEN = 0.36;
var U_ANGLE_RIDE = -7 * DEG;
var U_FRONT_X = 0.22;
var U_REAR_X = -0.22;

// Steering
var STEER_ARM_LEN = 0.16;
var STEER_ARM_FRAC = 0.50;
var RACK_Z = -0.28;
var RACK_X = -0.18;

// Spring
var SPR_TOP = { x: 0.08, y: 0.80, z: -0.38 };
var SPR_ARM_FRAC = 0.50;

// Wheel
var WHL_R = 0.28;

// Computed
var KNUCKLE_LEN = 0;

// ============================================================
// STATE
// ============================================================
var state = {
    bounce: 0,
    steer: 0,
    tracePath: true,
    showLabels: true,
    autoBounce: false,
};

var pathPoints = [];
var MAX_PATH = 300;

var canvas, ctx, W, H;
var scale = 1, cx = 0, cy = 0;
var viewRotY = 0.45;
var viewRotX = -0.28;

var frameCount = 0;
var lastFpsTime = 0;
var fps = 0;

// Current geometry (updated each frame)
var geo = {};

// ============================================================
// UTILITY: 3D ROTATION
// ============================================================
function rotatePt(pt, axisDir, axisPt, angle) {
    var ca = Math.cos(angle);
    var sa = Math.sin(angle);
    var px = pt.x - axisPt.x;
    var py = pt.y - axisPt.y;
    var pz = pt.z - axisPt.z;
    var dx = axisDir.x, dy = axisDir.y, dz = axisDir.z;
    var dot = px * dx + py * dy + pz * dz;
    var crx = py * dz - pz * dy;
    var cry = pz * dx - px * dz;
    var crz = px * dy - py * dx;
    return {
        x: axisPt.x + px * ca + crx * sa + dx * dot * (1 - ca),
        y: axisPt.y + py * ca + cry * sa + dy * dot * (1 - ca),
        z: axisPt.z + pz * ca + crz * sa + dz * dot * (1 - ca),
    };
}

// ============================================================
// 3D PROJECTION
// ============================================================
function project(x, y, z) {
    var cosY = Math.cos(viewRotY), sinY = Math.sin(viewRotY);
    var cosX = Math.cos(viewRotX), sinX = Math.sin(viewRotX);
    var xr = x * cosY - z * sinY;
    var zr = x * sinY + z * cosY;
    var yr = y;
    var yr2 = yr * cosX - zr * sinX;
    var zr2 = yr * sinX + zr * cosX;
    return { sx: xr * scale + cx, sy: -yr2 * scale + cy, depth: zr2 };
}

// ============================================================
// KINEMATICS
// ============================================================
function calcKnuckleLen() {
    var lbj = {
        x: 0,
        y: LP_Y + LLEN * Math.sin(L_ANGLE_RIDE),
        z: LP_Z - LLEN * Math.cos(L_ANGLE_RIDE),
    };
    var ubj = {
        x: 0,
        y: UP_Y + ULEN * Math.sin(U_ANGLE_RIDE),
        z: UP_Z - ULEN * Math.cos(U_ANGLE_RIDE),
    };
    var dy = ubj.y - lbj.y;
    var dz = ubj.z - lbj.z;
    return Math.sqrt(dy * dy + dz * dz);
}

function solveUpper(lowerAngle) {
    var lbjY = LP_Y + LLEN * Math.sin(lowerAngle);
    var lbjZ = LP_Z - LLEN * Math.cos(lowerAngle);
    var K = KNUCKLE_LEN;

    function f(theta) {
        var uy = UP_Y + ULEN * Math.sin(theta);
        var uz = UP_Z - ULEN * Math.cos(theta);
        var dy = uy - lbjY;
        var dz = uz - lbjZ;
        return Math.sqrt(dy * dy + dz * dz) - K;
    }

    var lo = -40 * DEG, hi = 25 * DEG;
    var fl = f(lo), fh = f(hi);
    if (fl * fh > 0) return (Math.abs(fl) < Math.abs(fh)) ? lo : hi;

    for (var i = 0; i < 50; i++) {
        var mid = (lo + hi) * 0.5;
        var fm = f(mid);
        if (fm === 0) return mid;
        if (fl * fm < 0) { hi = mid; fh = fm; }
        else { lo = mid; fl = fm; }
    }
    return (lo + hi) * 0.5;
}

function compute() {
    var bounce = state.bounce;
    var steerVal = state.steer;

    var lAngle = L_ANGLE_RIDE + bounce * 0.13;
    lAngle = Math.max(L_ANGLE_MIN, Math.min(L_ANGLE_MAX, lAngle));
    var uAngle = solveUpper(lAngle);

    var lbj = {
        x: 0,
        y: LP_Y + LLEN * Math.sin(lAngle),
        z: LP_Z - LLEN * Math.cos(lAngle),
    };
    var ubj = {
        x: 0,
        y: UP_Y + ULEN * Math.sin(uAngle),
        z: UP_Z - ULEN * Math.cos(uAngle),
    };

    // Knuckle direction (lower -> upper)
    var kmY = ubj.y - lbj.y;
    var kmZ = ubj.z - lbj.z;
    var kLen = Math.sqrt(kmY * kmY + kmZ * kmZ);
    var kuY = kmY / kLen;
    var kuZ = kmZ / kLen;

    var steerAngle = steerVal * 35 * DEG;

    // Wheel center
    var wc = {
        x: 0,
        y: lbj.y + STEER_ARM_FRAC * kmY,
        z: lbj.z + STEER_ARM_FRAC * kmZ - 0.07,
    };

    // Steer arm base (at midpoint of knuckle, before steering)
    var steerBase = {
        x: 0,
        y: lbj.y + STEER_ARM_FRAC * kmY,
        z: lbj.z + STEER_ARM_FRAC * kmZ,
    };

    // Kingpin axis direction
    var kpDir = { x: 0, y: kuY, z: kuZ };

    // Steering arm end (local direction: -X, slightly +Z)
    var sLen = Math.sqrt(1 + 0.3 * 0.3);
    var su = { x: -1 / sLen, y: 0, z: 0.3 / sLen };
    var steerEnd = rotatePt(
        { x: steerBase.x + su.x * STEER_ARM_LEN, y: steerBase.y + su.y * STEER_ARM_LEN, z: steerBase.z + su.z * STEER_ARM_LEN },
        kpDir, steerBase, steerAngle
    );

    // Apply steering to wheel center and ball joints
    var wcS = rotatePt(wc, kpDir, steerBase, steerAngle);
    var lbjS = rotatePt(lbj, kpDir, steerBase, steerAngle);
    var ubjS = rotatePt(ubj, kpDir, steerBase, steerAngle);

    var rackPt = { x: RACK_X, y: steerBase.y, z: RACK_Z };

    // Spring mounts
    var sprBot = {
        x: 0.08,
        y: LP_Y + LLEN * SPR_ARM_FRAC * Math.sin(lAngle),
        z: LP_Z - LLEN * SPR_ARM_FRAC * Math.cos(lAngle),
    };
    var sprTop = SPR_TOP;

    // Ride height wheel center Y (for travel calculation)
    var rideY = LP_Y + LLEN * Math.sin(L_ANGLE_RIDE)
        + STEER_ARM_FRAC * ((UP_Y + ULEN * Math.sin(U_ANGLE_RIDE)) - (LP_Y + LLEN * Math.sin(L_ANGLE_RIDE)));
    var bounceMM = (wcS.y - rideY) * 1000;

    // Camber: angle of wheel plane from vertical (in front view YZ)
    var camber = Math.atan2(ubjS.z - lbjS.z, ubjS.y - lbjS.y) * RAD + 90;
    // Kingpin inclination
    var kpi = Math.atan2(ubjS.z - lbjS.z, ubjS.y - lbjS.y) * RAD;

    // Chassis mounts
    var lFM = { x: L_FRONT_X, y: LP_Y, z: LP_Z };
    var lRM = { x: L_REAR_X, y: LP_Y, z: LP_Z };
    var uFM = { x: U_FRONT_X, y: UP_Y, z: UP_Z };
    var uRM = { x: U_REAR_X, y: UP_Y, z: UP_Z };

    // Generate wheel points (circle in XY plane, will be rotated)
    var wheelPts3D = [];
    var spokes3D = [];
    var nW = 32;
    for (var i = 0; i < nW; i++) {
        var a = (i / nW) * Math.PI * 2;
        var pt = { x: WHL_R * Math.cos(a), y: WHL_R * Math.sin(a), z: 0 };
        var rt = rotatePt(pt, kpDir, steerBase, steerAngle);
        wheelPts3D.push({ x: rt.x + wcS.x, y: rt.y + wcS.y, z: rt.z + wcS.z });
    }
    // Tire inner edge
    var tireInner = [];
    var innerR = WHL_R * 0.82;
    for (var i = 0; i < nW; i++) {
        var a = (i / nW) * Math.PI * 2;
        var pt = { x: innerR * Math.cos(a), y: innerR * Math.sin(a), z: 0 };
        var rt = rotatePt(pt, kpDir, steerBase, steerAngle);
        tireInner.push({ x: rt.x + wcS.x, y: rt.y + wcS.y, z: rt.z + wcS.z });
    }
    // Spokes
    for (var i = 0; i < 6; i++) {
        var a = (i / 6) * Math.PI * 2 + Math.PI / 2;
        var p1 = { x: innerR * 0.6 * Math.cos(a), y: innerR * 0.6 * Math.sin(a), z: 0 };
        var p2 = { x: innerR * 0.95 * Math.cos(a), y: innerR * 0.95 * Math.sin(a), z: 0 };
        var r1 = rotatePt(p1, kpDir, steerBase, steerAngle);
        var r2 = rotatePt(p2, kpDir, steerBase, steerAngle);
        spokes3D.push({ x1: r1.x + wcS.x, y1: r1.y + wcS.y, z1: r1.z + wcS.z,
                        x2: r2.x + wcS.x, y2: r2.y + wcS.y, z2: r2.z + wcS.z });
    }
    // Hub
    var hubPts = [];
    for (var i = 0; i < 16; i++) {
        var a = (i / 16) * Math.PI * 2;
        var pt = { x: innerR * 0.4 * Math.cos(a), y: innerR * 0.4 * Math.sin(a), z: 0 };
        var rt = rotatePt(pt, kpDir, steerBase, steerAngle);
        hubPts.push({ x: rt.x + wcS.x, y: rt.y + wcS.y, z: rt.z + wcS.z });
    }

    geo = {
        lAngle: lAngle,
        uAngle: uAngle,
        lbj: lbjS,
        ubj: ubjS,
        wc: wcS,
        steerBase: steerBase,
        steerEnd: steerEnd,
        rackPt: rackPt,
        sprTop: sprTop,
        sprBot: sprBot,
        wheelPts: wheelPts3D,
        tireInner: tireInner,
        spokes: spokes3D,
        hubPts: hubPts,
        camber: camber,
        kpi: kpi,
        bounceMM: bounceMM,
        steerAngleDeg: steerAngle * RAD,
        lFM: lFM, lRM: lRM, uFM: uFM, uRM: uRM,
        kpDir: kpDir,
        steerAngle: steerAngle,
    };

    // Record path trace
    if (state.tracePath && pathPoints.length < MAX_PATH) {
        var last = pathPoints.length > 0 ? pathPoints[pathPoints.length - 1] : null;
        var rec = {
            ubj: { x: ubjS.x, y: ubjS.y, z: ubjS.z },
            lbj: { x: lbjS.x, y: lbjS.y, z: lbjS.z },
            wc: { x: wcS.x, y: wcS.y, z: wcS.z },
        };
        if (!last || Math.abs(rec.ubj.y - last.ubj.y) > 0.001 || Math.abs(steerVal) > 0.01) {
            pathPoints.push(rec);
        }
    }
}

// ============================================================
// RENDERING
// ============================================================
function proj(p) { return project(p.x, p.y, p.z); }

function drawLine(p1, p2, color, w, dash) {
    var a = proj(p1);
    var b = proj(p2);
    ctx.strokeStyle = color;
    ctx.lineWidth = w || 1.5;
    ctx.setLineDash(dash || []);
    ctx.beginPath();
    ctx.moveTo(a.sx, a.sy);
    ctx.lineTo(b.sx, b.sy);
    ctx.stroke();
    ctx.setLineDash([]);
}

function drawNode(p, color, r) {
    var pp = proj(p);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(pp.sx, pp.sy, r || 3, 0, Math.PI * 2);
    ctx.fill();
}

function drawText(p, txt, color, size, ox, oy) {
    var pp = proj(p);
    ctx.fillStyle = color || COLORS.text;
    ctx.font = (size || 10) + 'px Consolas, monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(txt, pp.sx + (ox || 5), pp.sy + (oy || 0));
}

function drawPoly(pts, color, w, closed, fillColor) {
    if (pts.length < 2) return;
    var projPts = pts.map(function(p) { return proj(p); });
    ctx.strokeStyle = color;
    ctx.lineWidth = w || 1.5;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(projPts[0].sx, projPts[0].sy);
    for (var i = 1; i < projPts.length; i++) {
        ctx.lineTo(projPts[i].sx, projPts[i].sy);
    }
    if (closed) { ctx.closePath(); }
    if (fillColor) { ctx.fillStyle = fillColor; ctx.fill(); }
    ctx.stroke();
}

function drawSpring(p1, p2, color, nCoils) {
    var a = proj(p1);
    var b = proj(p2);
    var dx = b.sx - a.sx;
    var dy = b.sy - a.sy;
    var len = Math.sqrt(dx * dx + dy * dy);
    if (len < 1) return;
    var nx = -dy / len;
    var ny = dx / len;
    var amp = Math.min(7, len * 0.16);
    var n = nCoils || 7;
    var steps = n * 2;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(a.sx, a.sy);
    for (var i = 1; i <= steps; i++) {
        var t = i / steps;
        var lx = a.sx + dx * t;
        var ly = a.sy + dy * t;
        var side = (i % 2 === 0) ? 1 : -1;
        ctx.lineTo(lx + nx * amp * side, ly + ny * amp * side);
    }
    ctx.stroke();
}

function render() {
    W = canvas.width;
    H = canvas.height;

    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, W, H);

    // Grid
    ctx.strokeStyle = COLORS.grid;
    ctx.lineWidth = 0.5;
    for (var i = -20; i <= 20; i++) {
        var p1 = project(i * 0.1, 0, -0.35);
        var p2 = project(i * 0.1, 0.9, -0.35);
        if (p1.sx > -200 && p1.sx < W + 200) {
            ctx.beginPath(); ctx.moveTo(p1.sx, p1.sy); ctx.lineTo(p2.sx, p2.sy); ctx.stroke();
        }
        var p3 = project(0, i * 0.05, -0.35);
        var p4 = project(0.4, i * 0.05, -0.35);
        if (p3.sy > -200 && p3.sy < H + 200) {
            ctx.beginPath(); ctx.moveTo(p3.sx, p3.sy); ctx.lineTo(p4.sx, p4.sy); ctx.stroke();
        }
    }

    var g = geo;

    // Kingpin path trace (drawn behind suspension)
    if (state.tracePath && pathPoints.length > 1) {
        for (var i = 1; i < pathPoints.length; i++) {
            var prev = pathPoints[i - 1];
            var curr = pathPoints[i];
            var a = 0.2 + 0.8 * (i / pathPoints.length);
            var col = 'rgba(96,64,128,' + a.toFixed(2) + ')';
            drawLine(prev.ubj, curr.ubj, col, 1);
            drawLine(prev.lbj, curr.lbj, col, 1);
        }
    }

    // Chassis frame
    drawLine({ x: -0.4, y: 0.78, z: -0.35 }, { x: 0.4, y: 0.78, z: -0.35 }, COLORS.chassis, 2);
    drawLine({ x: 0.4, y: 0.78, z: -0.35 }, { x: 0.4, y: 0.18, z: -0.35 }, COLORS.chassis, 2);
    drawLine({ x: 0.4, y: 0.18, z: -0.35 }, { x: -0.4, y: 0.18, z: -0.35 }, COLORS.chassis, 2);
    drawLine({ x: -0.4, y: 0.18, z: -0.35 }, { x: -0.4, y: 0.78, z: -0.35 }, COLORS.chassis, 2);
    // Chassis cross bracing
    drawLine({ x: 0.4, y: 0.18, z: -0.35 }, { x: 0.35, y: 0.18, z: -0.20 }, COLORS.chassis, 1);
    drawLine({ x: -0.4, y: 0.18, z: -0.35 }, { x: -0.35, y: 0.18, z: -0.20 }, COLORS.chassis, 1);
    drawLine({ x: 0.4, y: 0.78, z: -0.35 }, { x: 0.35, y: 0.78, z: -0.20 }, COLORS.chassis, 1);

    // Spring
    drawSpring(g.sprTop, g.sprBot, COLORS.spring, 7);
    drawLine(g.sprTop, { x: g.sprTop.x, y: g.sprTop.y + 0.04, z: g.sprTop.z }, COLORS.springDim, 1.5);

    // Lower wishbone (A-arm)
    drawLine(g.lFM, g.lbj, COLORS.lowerArm, 2.5);
    drawLine(g.lRM, g.lbj, COLORS.lowerArm, 2.5);
    drawLine(g.lFM, g.lRM, COLORS.lowerArmDim, 1);
    drawLine({ x: L_FRONT_X, y: LP_Y, z: LP_Z - 0.02 },
             { x: L_REAR_X, y: LP_Y, z: LP_Z - 0.02 }, COLORS.lowerArmDim, 0.8, [3, 3]);

    // Upper wishbone (A-arm)
    drawLine(g.uFM, g.ubj, COLORS.upperArm, 2.5);
    drawLine(g.uRM, g.ubj, COLORS.upperArm, 2.5);
    drawLine(g.uFM, g.uRM, COLORS.upperArmDim, 1);
    drawLine({ x: U_FRONT_X, y: UP_Y, z: UP_Z - 0.02 },
             { x: U_REAR_X, y: UP_Y, z: UP_Z - 0.02 }, COLORS.upperArmDim, 0.8, [3, 3]);

    // Knuckle
    drawLine(g.lbj, g.ubj, COLORS.knuckle, 2);

    // Kingpin axis (dashed)
    drawLine(g.lbj, g.ubj, COLORS.kingpinLine, 0.8, [4, 4]);

    // Steering rack
    var rLen = 0.08;
    drawLine({ x: g.rackPt.x - 0.03, y: g.rackPt.y - 0.02, z: g.rackPt.z - rLen },
             { x: g.rackPt.x - 0.03, y: g.rackPt.y - 0.02, z: g.rackPt.z + rLen }, COLORS.rack, 1.5);
    drawLine({ x: g.rackPt.x + 0.03, y: g.rackPt.y + 0.02, z: g.rackPt.z - rLen },
             { x: g.rackPt.x + 0.03, y: g.rackPt.y + 0.02, z: g.rackPt.z + rLen }, COLORS.rack, 1.5);

    // Tie rod
    drawLine(g.rackPt, g.steerEnd, COLORS.tieRod, 2);
    // Steering arm
    drawLine(g.steerBase, g.steerEnd, COLORS.steerArm, 2);

    // Wheel - tire outer
    drawPoly(g.wheelPts, COLORS.tireOuter, 2, true, '#1a1a1a');
    // Tire inner edge
    if (g.tireInner) drawPoly(g.tireInner, '#333', 1.5, true);
    // Spokes
    if (g.spokes) {
        for (var i = 0; i < g.spokes.length; i++) {
            var s = g.spokes[i];
            drawLine({ x: s.x1, y: s.y1, z: s.z1 }, { x: s.x2, y: s.y2, z: s.z2 }, COLORS.wheelRim, 1);
        }
    }
    // Hub
    if (g.hubPts) drawPoly(g.hubPts, COLORS.wheelRim, 1.5, true, '#222');

    // Ball joint nodes
    drawNode(g.lbj, COLORS.ballJoint, 3.5);
    drawNode(g.ubj, COLORS.ballJoint, 3.5);
    drawNode(g.wc, COLORS.ballJoint, 2.5);
    drawNode(g.steerEnd, COLORS.ballJoint, 2);
    drawNode(g.rackPt, COLORS.ballJoint, 2);

    // Labels
    if (state.showLabels) {
        drawText(g.ubj, 'UBJ', COLORS.textBright, 9, 4, -7);
        drawText(g.lbj, 'LBJ', COLORS.textBright, 9, 4, 5);
        drawText(g.wc, 'WHL', COLORS.textBright, 9, 6, -5);
        drawText(g.steerEnd, 'TR', COLORS.textBright, 8, 4, 0);
        drawText({ x: g.uFM.x, y: g.uFM.y, z: g.uFM.z - 0.02 }, 'UCA', COLORS.upperArm, 8, 2, -8);
        drawText({ x: g.lFM.x, y: g.lFM.y, z: g.lFM.z - 0.02 }, 'LCA', COLORS.lowerArm, 8, 2, -8);
        drawText(g.sprTop, 'SPR', COLORS.spring, 8, 2, -8);
        drawText(g.rackPt, 'RACK', COLORS.rack, 8, 4, 0);

        // Info panel (top-left)
        ctx.fillStyle = COLORS.text;
        ctx.font = '9px Consolas, monospace';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        var ix = 10, iy = 8;
        ctx.fillText('TRAVEL: ' + g.bounceMM.toFixed(1) + ' mm', ix, iy); iy += 13;
        ctx.fillText('STEER: ' + (state.steer * 35).toFixed(1) + ' deg', ix, iy); iy += 13;
        ctx.fillText('CAMBER: ' + g.camber.toFixed(2) + ' deg', ix, iy); iy += 13;
        ctx.fillText('KPI: ' + g.kpi.toFixed(2) + ' deg', ix, iy); iy += 13;
        ctx.fillText('L-ARM: ' + (g.lAngle * RAD).toFixed(1) + ' deg', ix, iy); iy += 13;
        ctx.fillText('U-ARM: ' + (g.uAngle * RAD).toFixed(1) + ' deg', ix, iy);

        // Legend (bottom-left)
        var ly = H - 85;
        function legendItem(color, label) {
            ctx.fillStyle = color;
            ctx.fillRect(10, ly, 10, 2);
            ctx.fillStyle = COLORS.text;
            ctx.font = '9px Consolas, monospace';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, 24, ly);
            ly += 12;
        }
        legendItem(COLORS.lowerArm, 'LOWER WISHBONE');
        legendItem(COLORS.upperArm, 'UPPER WISHBONE');
        legendItem(COLORS.knuckle, 'KNUCKLE');
        legendItem(COLORS.spring, 'SPRING');
        legendItem(COLORS.tieRod, 'TIE ROD');
        legendItem(COLORS.kingpinLine, 'KINGPIN AXIS');
    }
}

// ============================================================
// MAIN LOOP
// ============================================================
function resize() {
    var wrap = document.getElementById('canvas-wrap');
    var cw = wrap.clientWidth;
    var ch = wrap.clientHeight;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = cw;
    H = ch;
    scale = Math.min(W, H) * 0.62;
    cx = W * 0.55;
    cy = H * 0.55;
}

function tick(timestamp) {
    frameCount++;
    if (timestamp - lastFpsTime >= 1000) {
        fps = frameCount;
        frameCount = 0;
        lastFpsTime = timestamp;
        document.getElementById('fpsDisplay').textContent = 'FPS: ' + fps;
        document.getElementById('ptDisplay').textContent = 'TRACE: ' + pathPoints.length;
    }

    if (state.autoBounce) {
        state.bounce = Math.sin(timestamp * 0.002) * 0.75;
        document.getElementById('bounceSlider').value = (state.bounce * 100).toFixed(0);
        document.getElementById('bounceVal').textContent = (state.bounce * 100).toFixed(0);
    }

    compute();

    document.getElementById('infoBounce').textContent = geo.bounceMM.toFixed(1);
    document.getElementById('infoSteer').textContent = (state.steer * 35).toFixed(1);
    document.getElementById('infoCamber').textContent = geo.camber.toFixed(2);
    document.getElementById('infoKPI').textContent = geo.kpi.toFixed(2);

    render();
    requestAnimationFrame(tick);
}

// ============================================================
// UI SETUP
// ============================================================
function setupUI() {
    var bounceSlider = document.getElementById('bounceSlider');
    var steerSlider = document.getElementById('steerSlider');
    var chkTrace = document.getElementById('chkTrace');
    var chkLabels = document.getElementById('chkLabels');
    var chkAuto = document.getElementById('chkAuto');
    var resetBtn = document.getElementById('resetViewBtn');

    bounceSlider.addEventListener('input', function() {
        state.bounce = this.value / 100;
        document.getElementById('bounceVal').textContent = (state.bounce * 100).toFixed(0);
        if (state.autoBounce) { state.autoBounce = false; chkAuto.checked = false; }
    });

    steerSlider.addEventListener('input', function() {
        state.steer = this.value / 100;
        document.getElementById('steerVal').textContent = (state.steer * 100).toFixed(0);
    });

    chkTrace.addEventListener('change', function() {
        state.tracePath = this.checked;
        if (!this.checked) pathPoints = [];
    });

    chkLabels.addEventListener('change', function() {
        state.showLabels = this.checked;
    });

    chkAuto.addEventListener('change', function() {
        state.autoBounce = this.checked;
        if (this.checked) { pathPoints = []; }
    });

    resetBtn.addEventListener('click', function() {
        bounceSlider.value = 0;
        steerSlider.value = 0;
        state.bounce = 0;
        state.steer = 0;
        state.autoBounce = false;
        chkAuto.checked = false;
        pathPoints = [];
        document.getElementById('bounceVal').textContent = '0';
        document.getElementById('steerVal').textContent = '0';
    });

    var isDragging = false;
    var lastMX = 0, lastMY = 0;

    canvas.addEventListener('mousedown', function(e) {
        isDragging = true;
        lastMX = e.clientX;
        lastMY = e.clientY;
    });

    window.addEventListener('mousemove', function(e) {
        if (!isDragging) return;
        var dx = e.clientX - lastMX;
        var dy = e.clientY - lastMY;
        viewRotY += dx * 0.005;
        viewRotX += dy * 0.005;
        viewRotX = Math.max(-1.0, Math.min(0.6, viewRotX));
        lastMX = e.clientX;
        lastMY = e.clientY;
    });

    window.addEventListener('mouseup', function() { isDragging = false; });

    canvas.addEventListener('wheel', function(e) {
        e.preventDefault();
        scale *= (e.deltaY > 0 ? 0.94 : 1.06);
        scale = Math.max(40, Math.min(2000, scale));
    }, { passive: false });
}

// ============================================================
// INIT
// ============================================================
function init() {
    canvas = document.getElementById('canvas');
    ctx = canvas.getContext('2d');
    KNUCKLE_LEN = calcKnuckleLen();
    resize();
    window.addEventListener('resize', resize);
    setupUI();
    requestAnimationFrame(tick);
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}

})();
</script>
