<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Wishbone Suspension Kinematics</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1c1c1c; color: #cccccc; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; overflow: hidden; height: 100vh; width: 100vw; }
#app { display: flex; height: 100vh; width: 100vw; }
#sidebar { width: 320px; min-width: 320px; background: #252525; border-right: 1px solid #3a3a3a; display: flex; flex-direction: column; padding: 16px; gap: 10px; overflow-y: auto; user-select: none; }
#sidebar h1 { font-size: 13px; font-weight: 700; color: #cccccc; letter-spacing: 1px; border-bottom: 1px solid #3a3a3a; padding-bottom: 10px; margin-bottom: 2px; }
.section { border-bottom: 1px solid #2a2a2a; padding-bottom: 10px; }
.section-label { font-size: 10px; color: #888888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.view-buttons { display: flex; gap: 4px; }
.view-btn { flex: 1; padding: 6px 4px; background: #1c1c1c; border: 1px solid #3a3a3a; color: #888888; cursor: pointer; font-size: 10px; letter-spacing: 1px; text-align: center; }
.view-btn:hover { background: #2a2a2a; color: #cccccc; }
.view-btn.active { background: #3a3a3a; color: #4fc3f7; border-color: #4fc3f7; }
.slider-group { display: flex; flex-direction: column; gap: 2px; }
.slider-row { display: flex; align-items: center; gap: 8px; }
.slider-label { font-size: 10px; color: #888888; letter-spacing: 1px; width: 90px; flex-shrink: 0; }
.slider-value { font-size: 11px; color: #cccccc; width: 75px; text-align: right; font-family: "Consolas", "Courier New", monospace; flex-shrink: 0; }
input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 4px; background: #3a3a3a; outline: none; cursor: pointer; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 18px; background: #4fc3f7; border: 1px solid #2a2a2a; cursor: pointer; }
input[type=range]::-moz-range-thumb { width: 12px; height: 18px; background: #4fc3f7; border: 1px solid #2a2a2a; cursor: pointer; border-radius: 0; }
.toggle-row { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 10px; color: #888888; letter-spacing: 1px; }
.toggle-box { width: 14px; height: 14px; border: 1px solid #3a3a3a; background: #1c1c1c; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.toggle-box.on { background: #4fc3f7; border-color: #4fc3f7; }
.toggle-box.on::after { content: ""; display: block; width: 6px; height: 6px; background: #1c1c1c; }
.animate-btn { padding: 8px; background: #1c1c1c; border: 1px solid #3a3a3a; color: #888888; cursor: pointer; font-size: 11px; letter-spacing: 1px; text-align: center; }
.animate-btn:hover { background: #2a2a2a; color: #cccccc; }
.animate-btn.active { background: #ef5350; color: #1c1c1c; border-color: #ef5350; font-weight: 700; }
.measurement { display: flex; justify-content: space-between; font-size: 11px; padding: 2px 0; font-family: "Consolas", "Courier New", monospace; }
.measurement .label { color: #888888; }
.measurement .value { color: #cccccc; }
#main { flex: 1; position: relative; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
    <!-- Model Name Watermark -->
<div style="position: fixed; top: 15px; left: 50%; transform: translateX(-50%); z-index: 9999999; pointer-events: none; opacity: 0.35; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 32px; font-weight: 700; color: #888; text-shadow: 1px 1px 0px rgba(255,255,255,0.8), -1px -1px 0px rgba(0,0,0,0.8); user-select: none; letter-spacing: 0.5px; white-space: nowrap;">DeeoSeekV4P正式</div>
<div id="app">
<div id="sidebar">
<h1>DOUBLE WISHBONE<br>SUSPENSION KINEMATICS</h1>
<div class="section">
    <div class="section-label">VIEW</div>
    <div class="view-buttons">
        <button class="view-btn active" data-view="front">FRONT</button>
        <button class="view-btn" data-view="top">TOP</button>

        <button class="view-btn" data-view="iso">ISO</button>

</div>
<div class="section">
    <div class="section-label">BUMP / REBOUND</div>
    <div class="slider-group">
        <div class="slider-row">
            <span class="slider-label">TRAVEL</span>
            <input type="range" id="bump-slider" min="-50" max="50" value="0" step="0.5">

        <button class="animate-btn" id="animate-btn">ANIMATE</button>
    </div>
</div>
<div class="section">

    <div class="slider-group">
        <div class="slider-row">
            <span class="slider-label">ANGLE</span>
            <input type="range" id="steer-slider" min="-30" max="30" value="0" step="0.1">
            <span class="slider-value" id="steer-val">0.0 deg</span>
        </div>
    </div>
</div>
<div class="section">
    <div class="section-label">DISPLAY</div>
    <div class="toggle-row" id="toggle-kingpin">
        <div class="toggle-box on"></div>
        <span>SHOW KINGPIN AXIS</span>
    </div>
    <div class="toggle-row" id="toggle-trace">
        <div class="toggle-box"></div>
        <span>SHOW PATH TRACE</span>
    </div>
    <div class="toggle-row" id="toggle-measurements">
        <div class="toggle-box on"></div>
        <span>SHOW MEASUREMENTS</span>
    </div>
    <div class="toggle-row" id="toggle-spring">
        <div class="toggle-box on"></div>
        <span>SHOW SPRING</span>

</div>
<div class="section">
    <div class="section-label">MEASUREMENTS</div>
    <div class="measurement"><span class="label">CAMBER</span><span class="value" id="m-camber">0.00 deg</span></div>
    <div class="measurement"><span class="label">KPI / SAI</span><span class="value" id="m-kpi">23.50 deg</span></div>
    <div class="measurement"><span class="label">TOE</span><span class="value" id="m-toe">0.00 deg</span></div>
    <div class="measurement"><span class="label">BUMP TRAVEL</span><span class="value" id="m-bump">0.0 mm</span></div>
    <div class="measurement"><span class="label">RACK POS</span><span class="value" id="m-rack">300.0 mm</span></div>
</div>
</div>
<div id="main">
    <canvas id="canvas"></canvas>
</div>
</div>
<script>
(function() {
var canvas = document.getElementById("canvas");
var ctx = canvas.getContext("2d");
var PI = Math.PI;

var UCA_FRONT = { x: 350, y: 450, z: 120 };
var UCA_REAR  = { x: 350, y: 450, z: -120 };
var LCA_FRONT = { x: 320, y: 180, z: 120 };
var LCA_REAR  = { x: 320, y: 180, z: -120 };
var LBJ_DESIGN = { x: 680, y: 200, z: 0 };
var UBJ_DESIGN = { x: 580, y: 430, z: 0 };
var WC_DESIGN  = { x: 720, y: 310, z: 0 };
var RACK_DESIGN_X = 300;
var RACK_Y = 180;
var RACK_Z = 80;
var TIRE_RADIUS = 300;
var RIM_RADIUS = 200;

var UCA_R, LCA_R, KNUCKLE_LEN, TIE_ROD_LEN;
var LCA_ANGLE_DESIGN;
var WC_LOCAL_I, WC_LOCAL_J, WC_LOCAL_K;
var TR_LOCAL_I, TR_LOCAL_J, TR_LOCAL_K;
var SPINDLE_LOCAL_I, SPINDLE_LOCAL_J, SPINDLE_LOCAL_K;
var PATH_TRACE = [];

var bumpSliderVal = 0;
var steerSliderVal = 0;
var animate = false;
var showKingpin = true;
var showTrace = false;
var showMeasurements = true;
var showSpring = true;
var azimuth = 0;
var elevation = 0;
var zoom = 0.8;
var currentView = "front";
var animTime = 0;
var lastTime = 0;
var currentLBJ, currentUBJ, currentWC;
var currentTR_World, currentRackX, currentSpindle;
var camberDeg = 0, kpiDeg = 0, toeDeg = 0;
var actualTravel = 0;
var mouseDown = false;
var mouseX = 0, mouseY = 0;
var dragStartAz = 0, dragStartEl = 0;

function vec3(x, y, z) { return { x: x, y: y, z: z }; }
function vsub(a, b) { return { x: a.x - b.x, y: a.y - b.y, z: a.z - b.z }; }
function vadd(a, b) { return { x: a.x + b.x, y: a.y + b.y, z: a.z + b.z }; }
function vscale(v, s) { return { x: v.x * s, y: v.y * s, z: v.z * s }; }
function vdot(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }
function vcross(a, b) { return { x: a.y * b.z - a.z * b.y, y: a.z * b.x - a.x * b.z, z: a.x * b.y - a.y * b.x }; }
function vlen(v) { return Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z); }
function vnorm(v) { var l = vlen(v); if (l < 1e-12) return { x: 0, y: 0, z: 0 }; return { x: v.x / l, y: v.y / l, z: v.z / l }; }
function vdist(a, b) { return vlen(vsub(a, b)); }
function circleIntersection2D(cx1, cy1, r1, cx2, cy2, r2) {
    var dx = cx2 - cx1, dy = cy2 - cy1;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d > r1 + r2 + 1e-6) return null;
    if (d < Math.abs(r1 - r2) - 1e-6) return null;
    if (d < 1e-6) return null;
    var a = (r1 * r1 - r2 * r2 + d * d) / (2 * d);
    var h2 = r1 * r1 - a * a;
    var h = h2 > 0 ? Math.sqrt(h2) : 0;
    var px = cx1 + a * dx / d;
    var py = cy1 + a * dy / d;
    var rx = -h * dy / d, ry = h * dx / d;
    return [{ x: px + rx, y: py + ry }, { x: px - rx, y: py - ry }];
}

function initGeometry() {
    var lcaAxisX = LCA_FRONT.x, lcaAxisY = LCA_FRONT.y;
    LCA_R = Math.sqrt((LBJ_DESIGN.x-lcaAxisX)*(LBJ_DESIGN.x-lcaAxisX)+(LBJ_DESIGN.y-lcaAxisY)*(LBJ_DESIGN.y-lcaAxisY));
    LCA_ANGLE_DESIGN = Math.atan2(LBJ_DESIGN.y - lcaAxisY, LBJ_DESIGN.x - lcaAxisX);
    var ucaAxisX = UCA_FRONT.x, ucaAxisY = UCA_FRONT.y;
    UCA_R = Math.sqrt((UBJ_DESIGN.x-ucaAxisX)*(UBJ_DESIGN.x-ucaAxisX)+(UBJ_DESIGN.y-ucaAxisY)*(UBJ_DESIGN.y-ucaAxisY));
    var lbj = { x:LBJ_DESIGN.x, y:LBJ_DESIGN.y, z:0 };
    var ubj = { x:UBJ_DESIGN.x, y:UBJ_DESIGN.y, z:0 };
    KNUCKLE_LEN = vdist(ubj, lbj);
    var Kd = vnorm(vsub(ubj, lbj));
    var worldUp = vec3(0, 1, 0);
    var jTemp = vcross(Kd, worldUp);
    if (vlen(jTemp) < 1e-6) jTemp = vcross(Kd, vec3(0, 0, 1));
    var Jd = vnorm(jTemp);
    var Id = vcross(Jd, Kd);
    var wc = { x:WC_DESIGN.x, y:WC_DESIGN.y, z:0 };
    var wcRel = vsub(wc, lbj);
    WC_LOCAL_I = vdot(wcRel, Id); WC_LOCAL_J = vdot(wcRel, Jd); WC_LOCAL_K = vdot(wcRel, Kd);
    var trWorld = vec3(650, 202, 35);
    var trRel = vsub(trWorld, lbj);
    TR_LOCAL_I = vdot(trRel, Id); TR_LOCAL_J = vdot(trRel, Jd); TR_LOCAL_K = vdot(trRel, Kd);
    var spindleWorld = vnorm(vec3(1, 0, 0));
    SPINDLE_LOCAL_I = vdot(spindleWorld, Id);
    SPINDLE_LOCAL_J = vdot(spindleWorld, Jd);
    SPINDLE_LOCAL_K = vdot(spindleWorld, Kd);
    var spLen = Math.sqrt(SPINDLE_LOCAL_I*SPINDLE_LOCAL_I+SPINDLE_LOCAL_J*SPINDLE_LOCAL_J+SPINDLE_LOCAL_K*SPINDLE_LOCAL_K);
    SPINDLE_LOCAL_I/=spLen; SPINDLE_LOCAL_J/=spLen; SPINDLE_LOCAL_K/=spLen;
    TIE_ROD_LEN = Math.sqrt((trWorld.x-RACK_DESIGN_X)*(trWorld.x-RACK_DESIGN_X)+(trWorld.y-RACK_Y)*(trWorld.y-RACK_Y)+(trWorld.z-RACK_Z)*(trWorld.z-RACK_Z));
    computePathTrace();
}
function computePathTrace() {
    PATH_TRACE = [];
    for (var i = 0; i <= 100; i++) {
        var b = -50 + i;
        var res = computeKinematics(b, 0);
        if (res) PATH_TRACE.push({ lbj: res.lbj, ubj: res.ubj, wc: res.wc });
    }
}

function computeKinematics(bump, steerDeg) {
    var thetaLCA = LCA_ANGLE_DESIGN + bump / LCA_R;
    var lbjx = LCA_FRONT.x + LCA_R * Math.cos(thetaLCA);
    var lbjy = LCA_FRONT.y + LCA_R * Math.sin(thetaLCA);
    var lbj = vec3(lbjx, lbjy, 0);
    var intersections = circleIntersection2D(UCA_FRONT.x, UCA_FRONT.y, UCA_R, lbjx, lbjy, KNUCKLE_LEN);
    if (!intersections) return null;
    var i0 = intersections[0], i1 = intersections[1];
    var ubj = (i0.y > i1.y) ? vec3(i0.x, i0.y, 0) : vec3(i1.x, i1.y, 0);
    var K_axis = vnorm(vsub(ubj, lbj));
    var jTemp = vcross(K_axis, vec3(0, 1, 0));
    if (vlen(jTemp) < 1e-6) jTemp = vcross(K_axis, vec3(0, 0, 1));
    var J_axis = vnorm(jTemp);
    var I_axis = vcross(J_axis, K_axis);
    var sR = steerDeg * PI / 180;
    var cosS = Math.cos(sR), sinS = Math.sin(sR);
    var wcLi = WC_LOCAL_I*cosS - WC_LOCAL_J*sinS;
    var wcLj = WC_LOCAL_I*sinS + WC_LOCAL_J*cosS;
    var wcx = lbjx + wcLi*I_axis.x + wcLj*J_axis.x + WC_LOCAL_K*K_axis.x;
    var wcy = lbjy + wcLi*I_axis.y + wcLj*J_axis.y + WC_LOCAL_K*K_axis.y;
    var wcz = wcLi*I_axis.z + wcLj*J_axis.z + WC_LOCAL_K*K_axis.z;
    var wc = vec3(wcx, wcy, wcz);
    var trLi = TR_LOCAL_I*cosS - TR_LOCAL_J*sinS;
    var trLj = TR_LOCAL_I*sinS + TR_LOCAL_J*cosS;
    var trx = lbjx + trLi*I_axis.x + trLj*J_axis.x + TR_LOCAL_K*K_axis.x;
    var try_ = lbjy + trLi*I_axis.y + trLj*J_axis.y + TR_LOCAL_K*K_axis.y;
    var trz = trLi*I_axis.z + trLj*J_axis.z + TR_LOCAL_K*K_axis.z;
    var trWorld = vec3(trx, try_, trz);
    var spLi = SPINDLE_LOCAL_I*cosS - SPINDLE_LOCAL_J*sinS;
    var spLj = SPINDLE_LOCAL_I*sinS + SPINDLE_LOCAL_J*cosS;
    var spx = spLi*I_axis.x + spLj*J_axis.x + SPINDLE_LOCAL_K*K_axis.x;
    var spy = spLi*I_axis.y + spLj*J_axis.y + SPINDLE_LOCAL_K*K_axis.y;
    var spz = spLi*I_axis.z + spLj*J_axis.z + SPINDLE_LOCAL_K*K_axis.z;
    var spLen = Math.sqrt(spx*spx+spy*spy+spz*spz);
    var spindle = vec3(spx/spLen, spy/spLen, spz/spLen);
    var dRemain = TIE_ROD_LEN*TIE_ROD_LEN - (RACK_Y-try_)*(RACK_Y-try_) - (RACK_Z-trz)*(RACK_Z-trz);
    var rackX = RACK_DESIGN_X;
    if (dRemain >= 0) {
        var sD = Math.sqrt(dRemain);
        var rx1 = trx - sD, rx2 = trx + sD;
        rackX = (Math.abs(rx1-RACK_DESIGN_X) < Math.abs(rx2-RACK_DESIGN_X)) ? rx1 : rx2;
    } else { rackX = trx; }
    return {lbj:lbj,ubj:ubj,wc:wc,trWorld:trWorld,rackX:rackX,spindle:spindle,I_axis:I_axis,J_axis:J_axis,K_axis:K_axis};
}
function project3D(p, az, el, z, cx, cy) {
    var azR = az * PI / 180, elR = el * PI / 180;
    var ca = Math.cos(azR), sa = Math.sin(azR);
    var ce = Math.cos(elR), se = Math.sin(elR);
    var x1 = p.x * ca - p.z * sa;
    var z1 = p.x * sa + p.z * ca;
    var y2 = p.y * ce - z1 * se;
    return { x: x1 * z + cx, y: -y2 * z + cy };
}

function depthOf(p, az, el) {
    var azR = az * PI / 180, elR = el * PI / 180;
    var vx = -Math.cos(elR) * Math.sin(azR);
    var vy = -Math.sin(elR);
    var vz = -Math.cos(elR) * Math.cos(azR);
    return p.x * vx + p.y * vy + p.z * vz;
}

function avgDepth(pts, az, el) {
    var sum = 0;
    for (var i = 0; i < pts.length; i++) sum += depthOf(pts[i], az, el);
    return sum / pts.length;
}

function toScreen(p) { return project3D(p, azimuth, elevation, zoom, canvas.width/2, canvas.height/2); }

function perpendicularBasis(normal) {
    var nx = normal.x, ny = normal.y, nz = normal.z;
    var ux, uy, uz;
    if (Math.abs(ny) < 0.999) { ux = ny; uy = -nx; uz = 0; }
    else { ux = -nz; uy = 0; uz = nx; }
    var ul = Math.sqrt(ux*ux+uy*uy+uz*uz);
    ux/=ul; uy/=ul; uz/=ul;
    var vx = ny*uz - nz*uy, vy = nz*ux - nx*uz, vz = nx*uy - ny*ux;
    return { u: vec3(ux,uy,uz), v: vec3(vx,vy,vz) };
}

function drawLine3D(p1, p2, color, dash, lw) {
    var s1 = toScreen(p1), s2 = toScreen(p2);
    ctx.strokeStyle = color;
    ctx.lineWidth = lw || 1;
    if (dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(s1.x, s1.y);
    ctx.lineTo(s2.x, s2.y);
    ctx.stroke();
    ctx.setLineDash([]);
}

function drawFilledTriangle(p1, p2, p3, fillColor, strokeColor) {
    var s1 = toScreen(p1), s2 = toScreen(p2), s3 = toScreen(p3);
    ctx.beginPath();
    ctx.moveTo(s1.x, s1.y);
    ctx.lineTo(s2.x, s2.y);
    ctx.lineTo(s3.x, s3.y);
    ctx.closePath();
    if (fillColor) { ctx.fillStyle = fillColor; ctx.fill(); }
    if (strokeColor) { ctx.strokeStyle = strokeColor; ctx.lineWidth = 1.5; ctx.stroke(); }
}

function fillCircle3D(center, normal, radius, fillColor, strokeColor, segments) {
    segments = segments || 64;
    var b = perpendicularBasis(normal), u = b.u, v = b.v;
    ctx.beginPath();
    var first = true;
    for (var i = 0; i <= segments; i++) {
        var a = 2*PI*i/segments;
        var px = center.x + radius*(Math.cos(a)*u.x + Math.sin(a)*v.x);
        var py = center.y + radius*(Math.cos(a)*u.y + Math.sin(a)*v.y);
        var pz = center.z + radius*(Math.cos(a)*u.z + Math.sin(a)*v.z);
        var s = toScreen(vec3(px, py, pz));
        if (first) { ctx.moveTo(s.x, s.y); first = false; }
        else ctx.lineTo(s.x, s.y);
    }
    ctx.closePath();
    if (fillColor) { ctx.fillStyle = fillColor; ctx.fill(); }
    if (strokeColor) { ctx.strokeStyle = strokeColor; ctx.lineWidth = 1; ctx.stroke(); }
}

function drawPoint3D(p, color, radius) {
    radius = radius || 4;
    var s = toScreen(p);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, radius, 0, 2*PI);
    ctx.fill();
}
function drawSpringZigzag(pLower, pUpper, segs) {
    segs = segs || 8;
    ctx.strokeStyle = "#ef5350";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    var s0 = toScreen(pLower);
    ctx.moveTo(s0.x, s0.y);
    var zigAmp = 8;
    for (var i = 1; i < segs; i++) {
        var t = i / segs;
        var p = vec3(pLower.x+(pUpper.x-pLower.x)*t, pLower.y+(pUpper.y-pLower.y)*t, pLower.z+(pUpper.z-pLower.z)*t);
        var s = toScreen(p);
        if (i % 2 === 0) s.x += zigAmp; else s.x -= zigAmp;
        ctx.lineTo(s.x, s.y);
    }
    var sN = toScreen(pUpper);
    ctx.lineTo(sN.x, sN.y);
    ctx.stroke();
}

function drawKingpinExt(ubj, lbj) {
    var ext = vnorm(vsub(ubj, lbj));
    var extUp = vec3(ubj.x+ext.x*80, ubj.y+ext.y*80, ubj.z+ext.z*80);
    var extDown = vec3(lbj.x-ext.x*80, lbj.y-ext.y*80, lbj.z-ext.z*80);
    drawLine3D(extDown, extUp, "#ffeb3b", [8, 5], 1.5);
}

function drawWheel(center, spindle) {
    fillCircle3D(center, spindle, TIRE_RADIUS, "rgba(60,60,60,0.5)", "#666666", 72);
    fillCircle3D(center, spindle, RIM_RADIUS, "rgba(80,80,80,0.4)", "#888888", 48);
    var b = perpendicularBasis(spindle), u = b.u, v = b.v;
    var numSpokes = 5;
    ctx.strokeStyle = "#999999";
    ctx.lineWidth = 1;
    for (var i = 0; i < numSpokes; i++) {
        var a = 2*PI*i/numSpokes;
        var rx = center.x + RIM_RADIUS*(Math.cos(a)*u.x+Math.sin(a)*v.x);
        var ry = center.y + RIM_RADIUS*(Math.cos(a)*u.y+Math.sin(a)*v.y);
        var rz = center.z + RIM_RADIUS*(Math.cos(a)*u.z+Math.sin(a)*v.z);
        drawLine3D(center, vec3(rx,ry,rz), "#999999");
    }
    drawPoint3D(center, "#cccccc", 5);
}

function updateMeasurements() {
    document.getElementById("m-camber").textContent = camberDeg.toFixed(2) + " deg";
    document.getElementById("m-kpi").textContent = Math.abs(kpiDeg).toFixed(2) + " deg";
    document.getElementById("m-toe").textContent = toeDeg.toFixed(2) + " deg";
    document.getElementById("m-bump").textContent = actualTravel.toFixed(1) + " mm";
    document.getElementById("m-rack").textContent = currentRackX.toFixed(1) + " mm";
    document.getElementById("bump-val").textContent = (animate ? (50*Math.sin(animTime*2)) : bumpSliderVal).toFixed(1) + " mm";
    document.getElementById("steer-val").textContent = steerSliderVal.toFixed(1) + " deg";
}

function drawMeasurementAnnotations() {
    if (!currentWC || !currentLBJ || !currentUBJ || !currentSpindle) return;
    var sWC = toScreen(currentWC);
    var sLBJ = toScreen(currentLBJ);
    var hRef = vadd(currentWC, vscale(vec3(0,-1,0), 60));
    drawLine3D(currentWC, hRef, "rgba(79,195,247,0.6)", [3,3], 1);
    var spEnd = vadd(currentWC, vscale(currentSpindle, 60));
    drawLine3D(currentWC, spEnd, "rgba(79,195,247,0.6)", null, 1);
    ctx.fillStyle = "#4fc3f7";
    ctx.font = "10px Consolas, monospace";
    ctx.fillText("CAMBER " + camberDeg.toFixed(1) + " deg", sWC.x+10, sWC.y-10);
    var vertRef = vadd(currentLBJ, vec3(0, 60, 0));
    drawLine3D(currentLBJ, vertRef, "rgba(255,235,59,0.6)", [3,3], 1);
    ctx.fillStyle = "#ffeb3b";
    ctx.fillText("KPI " + Math.abs(kpiDeg).toFixed(1) + " deg", sLBJ.x+10, sLBJ.y-10);
}
function render() {
    var w = canvas.width = canvas.clientWidth;
    var h = canvas.height = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#1c1c1c";
    ctx.fillRect(0, 0, w, h);

    var effBump = animate ? (50 * Math.sin(animTime * 2)) : bumpSliderVal;
    var kin = computeKinematics(effBump, steerSliderVal);
    if (!kin) return;

    currentLBJ = kin.lbj; currentUBJ = kin.ubj; currentWC = kin.wc;
    currentTR_World = kin.trWorld; currentRackX = kin.rackX; currentSpindle = kin.spindle;

    actualTravel = currentWC.y - WC_DESIGN.y;
    camberDeg = Math.atan2(currentSpindle.y, Math.sqrt(currentSpindle.x*currentSpindle.x+currentSpindle.z*currentSpindle.z))*180/PI;
    kpiDeg = Math.atan2(currentLBJ.x-currentUBJ.x, currentUBJ.y-currentLBJ.y)*180/PI;
    toeDeg = Math.atan2(currentSpindle.z, currentSpindle.x)*180/PI;

    if (animate) document.getElementById("bump-slider").value = effBump;
    updateMeasurements();

    var elList = [];
    drawGrid(elList);

    if (showTrace) drawPathTrace(elList);
    if (showSpring) {
        var lowerP = vec3((LCA_FRONT.x+currentLBJ.x)/2, (LCA_FRONT.y+currentLBJ.y)/2, (LCA_FRONT.z+currentLBJ.z)/2);
        var upperP = vec3(500, 390, 60);
        elList.push({ depth: avgDepth([lowerP,upperP],azimuth,elevation), draw: function(){ drawSpringZigzag(lowerP,upperP,10); }});
    }

    elList.push({ depth: avgDepth([UCA_FRONT,UCA_REAR,LCA_FRONT,LCA_REAR],azimuth,elevation), draw: function(){
        drawLine3D(UCA_FRONT,UCA_REAR,"#5a5a6a"); drawLine3D(LCA_FRONT,LCA_REAR,"#5a5a6a");
        drawLine3D(UCA_FRONT,LCA_FRONT,"#5a5a6a"); drawLine3D(UCA_REAR,LCA_REAR,"#5a5a6a");
        drawPoint3D(UCA_FRONT,"#5a5a6a",4); drawPoint3D(UCA_REAR,"#5a5a6a",4);
        drawPoint3D(LCA_FRONT,"#5a5a6a",4); drawPoint3D(LCA_REAR,"#5a5a6a",4);
    }});

    elList.push({ depth: avgDepth([UCA_FRONT,UCA_REAR,currentUBJ],azimuth,elevation), draw: function(){
        drawFilledTriangle(UCA_FRONT,UCA_REAR,currentUBJ,"rgba(0,188,212,0.12)","#00bcd4");
    }});

    elList.push({ depth: avgDepth([LCA_FRONT,LCA_REAR,currentLBJ],azimuth,elevation), draw: function(){
        drawFilledTriangle(LCA_FRONT,LCA_REAR,currentLBJ,"rgba(255,152,0,0.12)","#ff9800");
    }});

    elList.push({ depth: avgDepth([currentUBJ,currentLBJ,currentWC],azimuth,elevation), draw: function(){
        drawLine3D(currentUBJ,currentLBJ,"#e0e0e0",null,2);
        drawLine3D(currentLBJ,currentWC,"#e0e0e0",null,2);
        drawLine3D(currentWC,currentUBJ,"#e0e0e0",null,1);
    }});

    var rackPos = vec3(currentRackX,RACK_Y,RACK_Z);
    elList.push({ depth: avgDepth([currentTR_World,rackPos],azimuth,elevation), draw: function(){
        drawLine3D(currentTR_World,rackPos,"#4caf50",null,2);
        drawPoint3D(currentTR_World,"#4caf50",4); drawPoint3D(rackPos,"#888888",4);
    }});

    if (showKingpin) {
        elList.push({ depth: avgDepth([currentUBJ,currentLBJ],azimuth,elevation), draw: function(){ drawKingpinExt(currentUBJ,currentLBJ); }});
    }

    elList.push({ depth: avgDepth([currentWC],azimuth,elevation), draw: function(){ drawWheel(currentWC,currentSpindle); }});
    elList.push({ depth: avgDepth([currentUBJ,currentLBJ,currentWC],azimuth,elevation), draw: function(){
        drawPoint3D(currentUBJ,"#00bcd4",6); drawPoint3D(currentLBJ,"#ff9800",6); drawPoint3D(currentWC,"#e0e0e0",4);
    }});

    if (showMeasurements) {
        elList.push({ depth: 1e9, draw: function(){ drawMeasurementAnnotations(); }});
    }

    elList.sort(function(a,b){ return a.depth - b.depth; });
    for (var ei = 0; ei < elList.length; ei++) elList[ei].draw();
}
function drawGrid(elList) {
    var gridSize = 12, spacing = 100;
    elList.push({ depth: -1e9, draw: function(){
        ctx.strokeStyle = "#2a2a2a"; ctx.lineWidth = 0.5;
        for (var i = -gridSize; i <= gridSize; i++) {
            var x = i*spacing;
            var s1 = toScreen(vec3(x, 0, -gridSize*spacing)), s2 = toScreen(vec3(x, 0, gridSize*spacing));
            ctx.beginPath(); ctx.moveTo(s1.x,s1.y); ctx.lineTo(s2.x,s2.y); ctx.stroke();
        }
        for (var j = -gridSize; j <= gridSize; j++) {
            var z = j*spacing;
            var s1 = toScreen(vec3(-gridSize*spacing, 0, z)), s2 = toScreen(vec3(gridSize*spacing, 0, z));
            ctx.beginPath(); ctx.moveTo(s1.x,s1.y); ctx.lineTo(s2.x,s2.y); ctx.stroke();
        }
        ctx.strokeStyle = "#444444"; ctx.lineWidth = 1.5;
        var g1 = toScreen(vec3(-200,0,-600)), g2 = toScreen(vec3(1000,0,600));
        ctx.beginPath(); ctx.moveTo(g1.x,g1.y); ctx.lineTo(g2.x,g2.y); ctx.stroke();
        ctx.fillStyle = "#555555"; ctx.font = "9px Consolas, monospace";
        var xl = toScreen(vec3(200,0,0)), yl = toScreen(vec3(0,200,0)), zl = toScreen(vec3(0,0,200));
        ctx.fillText("X",xl.x+3,xl.y); ctx.fillText("Y",yl.x+3,yl.y); ctx.fillText("Z",zl.x+3,zl.y);
    }});
}

function drawPathTrace(elList) {
    if (PATH_TRACE.length < 2) return;
    var allPts = [];
    for (var i = 0; i < PATH_TRACE.length; i++) { allPts.push(PATH_TRACE[i].lbj); allPts.push(PATH_TRACE[i].ubj); }
    elList.push({ depth: avgDepth(allPts,azimuth,elevation), draw: function(){
        ctx.strokeStyle = "rgba(255,235,59,0.4)"; ctx.lineWidth = 1; ctx.setLineDash([2,4]);
        ctx.beginPath();
        for (var i = 0; i < PATH_TRACE.length; i++) {
            var s = toScreen(PATH_TRACE[i].ubj);
            if (i===0) ctx.moveTo(s.x,s.y); else ctx.lineTo(s.x,s.y);
        }
        ctx.stroke();
        ctx.strokeStyle = "rgba(255,152,0,0.4)";
        ctx.beginPath();
        for (var i = 0; i < PATH_TRACE.length; i++) {
            var s = toScreen(PATH_TRACE[i].lbj);
            if (i===0) ctx.moveTo(s.x,s.y); else ctx.lineTo(s.x,s.y);
        }
        ctx.stroke();
        ctx.setLineDash([]);
        for (var i = 0; i < PATH_TRACE.length; i += 5) {
            drawPoint3D(PATH_TRACE[i].ubj, "rgba(255,235,59,0.5)", 2);
            drawPoint3D(PATH_TRACE[i].lbj, "rgba(255,152,0,0.5)", 2);
        }
    }});
}
function setView(viewName) {
    currentView = viewName;
    switch (viewName) {
        case "front": azimuth = 0; elevation = 0; break;
        case "top": azimuth = 0; elevation = 90; break;
        case "side": azimuth = 90; elevation = 0; break;
        case "iso": azimuth = 30; elevation = 25; break;
    }
    var btns = document.querySelectorAll(".view-btn");
    for (var i = 0; i < btns.length; i++) {
        btns[i].classList.remove("active");
        if (btns[i].getAttribute("data-view") === viewName) btns[i].classList.add("active");
    }
}

function onMouseDown(e) { mouseDown = true; mouseX = e.clientX; mouseY = e.clientY; dragStartAz = azimuth; dragStartEl = elevation; }
function onMouseMove(e) {
    if (!mouseDown) return;
    var dx = e.clientX - mouseX, dy = e.clientY - mouseY;
    azimuth = dragStartAz + dx * 0.3;
    elevation = dragStartEl - dy * 0.3;
    if (elevation > 89) elevation = 89;
    if (elevation < -89) elevation = -89;
    currentView = "free";
    var btns = document.querySelectorAll(".view-btn");
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove("active");
}
function onMouseUp() { mouseDown = false; }
function onWheel(e) { e.preventDefault(); zoom *= (e.deltaY > 0) ? 0.93 : 1.07; if (zoom<0.2) zoom=0.2; if (zoom>5) zoom=5; }

function animateLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    var dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    if (animate) animTime += dt;
    render();
    if (animate) {
        var effB = 50 * Math.sin(animTime * 2);
        document.getElementById("bump-slider").value = effB;
        document.getElementById("bump-val").textContent = effB.toFixed(1) + " mm";
    }
    requestAnimationFrame(animateLoop);
}

document.getElementById("bump-slider").addEventListener("input", function(){
    if (animate) { animate = false; document.getElementById("animate-btn").classList.remove("active"); document.getElementById("animate-btn").textContent = "ANIMATE"; }
    bumpSliderVal = parseFloat(this.value);
});
document.getElementById("steer-slider").addEventListener("input", function(){ steerSliderVal = parseFloat(this.value); });
document.getElementById("animate-btn").addEventListener("click", function(){
    animate = !animate;
    if (animate) { this.classList.add("active"); this.textContent = "STOP"; animTime = Math.asin(bumpSliderVal/50)/2; if (isNaN(animTime)) animTime = 0; }
    else { this.classList.remove("active"); this.textContent = "ANIMATE"; bumpSliderVal = parseFloat(document.getElementById("bump-slider").value); }
});
var viewBtns = document.querySelectorAll(".view-btn");
for (var i = 0; i < viewBtns.length; i++) {
    viewBtns[i].addEventListener("click", function(){ setView(this.getAttribute("data-view")); });
}

document.getElementById("toggle-kingpin").addEventListener("click", function(){
    showKingpin = !showKingpin; this.querySelector(".toggle-box").classList.toggle("on", showKingpin);
});
document.getElementById("toggle-trace").addEventListener("click", function(){
    showTrace = !showTrace; this.querySelector(".toggle-box").classList.toggle("on", showTrace);
});
document.getElementById("toggle-measurements").addEventListener("click", function(){
    showMeasurements = !showMeasurements; this.querySelector(".toggle-box").classList.toggle("on", showMeasurements);
});
document.getElementById("toggle-spring").addEventListener("click", function(){
    showSpring = !showSpring; this.querySelector(".toggle-box").classList.toggle("on", showSpring);
});

canvas.addEventListener("mousedown", onMouseDown);
canvas.addEventListener("mousemove", onMouseMove);
canvas.addEventListener("mouseup", onMouseUp);
canvas.addEventListener("mouseleave", onMouseUp);
canvas.addEventListener("wheel", onWheel, { passive: false });
canvas.addEventListener("contextmenu", function(e){ e.preventDefault(); });
window.addEventListener("resize", function(){ render(); });

setView("front");
initGeometry();
requestAnimationFrame(animateLoop);

})();
</script>
</body>
</html>
