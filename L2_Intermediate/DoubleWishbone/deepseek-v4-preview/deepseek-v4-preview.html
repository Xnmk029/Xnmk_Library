<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双叉臂悬挂运动学模拟 - 工业版</title>
    <style>
        :root {
            --bg: #1a1c1e;
            --panel-bg: #212529;
            --border: #3a3d42;
            --text: #bcc2c8;
            --text-bright: #e8eaed;
            --accent: #4a9eff;
            --accent2: #ff6b5b;
            --accent3: #f0a040;
            --grid: #272a2e;
            --grid-major: #32363b;
            --control-bg: #26292e;
            --input-bg: #1d1f22;
            --input-border: #3e4248;
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', 'DejaVu Sans Mono', monospace;
            --font-sans: 'Inter', 'Segoe UI', 'Helvetica Neue', 'Arial', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* 标题栏 */
        #titlebar {
            height: 36px;
            min-height: 36px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 14px;
            gap: 12px;
            z-index: 10;
        }
        #titlebar .title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-bright);
            letter-spacing: 0.4px;
        }
        #titlebar .sep {
            width: 1px;
            height: 18px;
            background: var(--border);
        }
        #titlebar .info-tag {
            font-size: 10px;
            font-family: var(--font-mono);
            color: #7a8290;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        /* 主布局 */
        #main-container {
            display: flex;
            flex: 1;
            min-height: 0;
            position: relative;
        }

        /* 画布区域 */
        #canvas-area {
            flex: 1;
            position: relative;
            background: var(--bg);
            cursor: default;
            min-width: 0;
        }
        #canvas-area.dragging {
            cursor: grabbing;
        }
        #canvas-area.hover-wheel {
            cursor: ns-resize;
        }
        canvas#mainCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 右侧面板 */
        #side-panel {
            width: 340px;
            min-width: 340px;
            background: var(--panel-bg);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            z-index: 5;
        }
        #side-panel .section {
            border-bottom: 1px solid var(--border);
            padding: 14px 16px;
        }
        #side-panel .section-header {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #7a8290;
            margin-bottom: 10px;
            font-family: var(--font-mono);
        }
        #side-panel .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            font-size: 12px;
            font-family: var(--font-mono);
        }
        #side-panel .data-label {
            color: #8a929d;
            font-size: 11px;
        }
        #side-panel .data-value {
            color: var(--text-bright);
            font-weight: 500;
            font-size: 12px;
            letter-spacing: 0.2px;
        }
        #side-panel .data-value.highlight {
            color: var(--accent);
        }
        #side-panel .data-value.warn {
            color: var(--accent2);
        }
        #side-panel .data-value.amber {
            color: var(--accent3);
        }

        /* 俯视图小画布 */
        #topview-container {
            width: 100%;
            aspect-ratio: 1.6/1;
            background: #1a1c1f;
            border: 1px solid var(--border);
            position: relative;
            margin-top: 4px;
        }
        canvas#topviewCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #topview-container .view-label {
            position: absolute;
            top: 6px;
            left: 8px;
            font-size: 9px;
            font-family: var(--font-mono);
            color: #5a6270;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            pointer-events: none;
        }

        /* 底部控制栏 */
        #control-bar {
            height: 50px;
            min-height: 50px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 20px;
            z-index: 10;
        }
        #control-bar .ctrl-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #control-bar label {
            font-size: 10px;
            font-family: var(--font-mono);
            color: #8a929d;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            white-space: nowrap;
        }
        #control-bar input[type="range"] {
            -webkit-appearance: none;
            width: 120px;
            height: 4px;
            background: var(--input-border);
            outline: none;
            cursor: pointer;
        }
        #control-bar input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--accent);
            border: 1px solid #5fb0ff;
            cursor: pointer;
        }
        #control-bar .btn {
            height: 28px;
            padding: 0 12px;
            font-size: 10px;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            background: var(--control-bg);
            border: 1px solid var(--input-border);
            color: var(--text);
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.1s;
        }
        #control-bar .btn:hover {
            background: #30343a;
            border-color: #555;
        }
        #control-bar .btn.active {
            background: #1a3350;
            border-color: var(--accent);
            color: var(--accent);
        }
        #control-bar .btn-group {
            display: flex;
            gap: 0;
        }
        #control-bar .btn-group .btn {
            border-right: none;
        }
        #control-bar .btn-group .btn:last-child {
            border-right: 1px solid var(--input-border);
        }

        /* 图例指示器 */
        .legend-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-right: 4px;
            flex-shrink: 0;
        }

        /* 滚动条 */
        #side-panel::-webkit-scrollbar {
            width: 4px;
        }
        #side-panel::-webkit-scrollbar-track {
            background: transparent;
        }
        #side-panel::-webkit-scrollbar-thumb {
            background: #3a3d42;
        }

        @media (max-width: 900px) {
            #side-panel {
                width: 260px;
                min-width: 260px;
            }
            #control-bar input[type="range"] {
                width: 70px;
            }
            #control-bar {
                gap: 8px;
                padding: 0 8px;
            }
        }
        @media (max-width: 650px) {
            #main-container {
                flex-direction: column;
            }
            #side-panel {
                width: 100%;
                min-width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                max-height: 180px;
                overflow-y: auto;
            }
            #side-panel .section {
                flex: 1;
                min-width: 140px;
                border-bottom: none;
                border-right: 1px solid var(--border);
            }
            #topview-container {
                aspect-ratio: 2/1;
            }
        }
    </style>
</head>

<div style="position: fixed; top: 15px; left: 50%; transform: translateX(-50%); z-index: 9999999; pointer-events: none; opacity: 0.35; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 32px; font-weight: 700; color: #888; text-shadow: 1px 1px 0px rgba(255,255,255,0.8), -1px -1px 0px rgba(0,0,0,0.8); user-select: none; letter-spacing: 0.5px; white-space: nowrap;">DeepSeekV4P预览</div>
<!-- 标题栏 -->
    <div id="titlebar">

    <div id="control-bar">
        <div class="ctrl-group">
            <label>悬挂行程</label>
            <input type="range" id="sliderTravel" min="0" max="100" value="50" title="拖动调整悬挂行程">

            <input type="range" id="sliderSteer" min="-100" max="100" value="0" title="拖动调整转向角度">

        <div class="btn-group">
            <button class="btn" id="btnShowPath" title="显示/隐藏运动路径">路径</button>
            <button class="btn" id="btnShowKingpin" title="显示/隐藏主销轴线">主销</button>

        <span style="font-size:9px;color:#5a6270;font-family:var(--font-mono);margin-left:auto;">
            拖动车轮 ↑↓ 调整悬挂 &nbsp;|&nbsp; 滚轮调整转向

    <script>
        (function() {
            // ==================== DOM 元素 ====================
            const mainCanvas = document.getElementById('mainCanvas');
            const mainCtx = mainCanvas.getContext('2d');
            const topviewCanvas = document.getElementById('topviewCanvas');
            const topviewCtx = topviewCanvas.getContext('2d');
            const canvasArea = document.getElementById('canvas-area');
            const sliderTravel = document.getElementById('sliderTravel');
            const sliderSteer = document.getElementById('sliderSteer');
            const travelPercentEl = document.getElementById('travelPercent');
            const steerPercentEl = document.getElementById('steerPercent');
            const statusTag = document.getElementById('statusTag');

            // 显示选项
            let showPath = true;
            let showKingpin = true;
            let showSpring = true;
            let showGrid = true;
            let autoDemo = false;

            // 按钮状态
            const btnShowPath = document.getElementById('btnShowPath');
            const btnShowKingpin = document.getElementById('btnShowKingpin');
            const btnShowSpring = document.getElementById('btnShowSpring');
            const btnShowGrid = document.getElementById('btnShowGrid');
            const btnAutoDemo = document.getElementById('btnAutoDemo');
            const btnReset = document.getElementById('btnReset');

            function updateButtonStates() {
                btnShowPath.classList.toggle('active', showPath);
                btnShowKingpin.classList.toggle('active', showKingpin);
                btnShowSpring.classList.toggle('active', showSpring);
                btnShowGrid.classList.toggle('active', showGrid);
                btnAutoDemo.classList.toggle('active', autoDemo);
            }
            updateButtonStates();

            btnShowPath.addEventListener('click', () => { showPath = !showPath;
                updateButtonStates(); });
            btnShowKingpin.addEventListener('click', () => { showKingpin = !showKingpin;
                updateButtonStates(); });
            btnShowSpring.addEventListener('click', () => { showSpring = !showSpring;
                updateButtonStates(); });
            btnShowGrid.addEventListener('click', () => { showGrid = !showGrid;
                updateButtonStates(); });
            btnAutoDemo.addEventListener('click', () => { autoDemo = !autoDemo;
                updateButtonStates();
                statusTag.textContent = autoDemo ? '自动演示中' : '就绪'; });
            btnReset.addEventListener('click', resetAll);

            // ==================== 几何参数定义 ====================
            // 所有尺寸单位：像素（在750px参考高度下）
            // 车架固定铰接点（前视图）
            const U_FRAME_Y = 0.19; // 上控制臂车架支点Y（归一化，0=顶部）
            const L_FRAME_Y = 0.48; // 下控制臂车架支点Y
            const FRAME_X = 0.25; // 车架支点X位置（归一化，0=左侧）

            // 上控制臂参数
            const UPPER_ARM_LEN = 0.195; // 上控制臂长度（归一化）
            const UPPER_MOUNT_SPREAD = 0.028; // 上控制臂两车架支点在前视图中的展开

            // 下控制臂参数
            const LOWER_ARM_LEN = 0.235; // 下控制臂长度（归一化）
            const LOWER_MOUNT_SPREAD = 0.036; // 下控制臂两车架支点在前视图中的展开

            // 主销（转向节）长度
            const KINGPIN_LEN = 0.215;

            // 车轮参数
            const WHEEL_RADIUS = 0.155;
            const WHEEL_OFFSET_X = 0.055; // 车轮中心相对于主销中点向外偏移

            // 弹簧连接点
            const SPRING_FRAME_Y = 0.23; // 弹簧车架连接点Y
            const SPRING_LOWER_RATIO = 0.55; // 弹簧在下控制臂上的连接位置（从车架支点到球头的比例）

            // 转向拉杆参数（俯视图）
            const TIE_ROD_LEN = 0.18;
            const STEERING_ARM_LEN = 0.065; // 转向节臂长度
            const RACK_Y_OFFSET = 0.08; // 转向机在俯视图中的Y偏移

            // 悬挂行程范围
            const TRAVEL_RANGE_DEG = 28; // 上控制臂角度变化范围（度）
            const NEUTRAL_UPPER_ANGLE_DEG = 18; // 上控制臂中性角度（从水平向下，度）

            // ==================== 状态变量 ====================
            let travelParam = 0.5; // 0=完全伸展(下垂), 1=完全压缩(上跳)
            let steerAngle = 0; // 转向角度（度），正=右转
            let targetTravelParam = 0.5;
            let targetSteerAngle = 0;

            // 路径追踪
            const pathHistoryUBJ = [];
            const pathHistoryLBJ = [];
            const pathHistoryWC = [];
            const maxPathPoints = 200;

            // ==================== 几何求解 ====================
            function getCanvasDimensions() {
                const rect = mainCanvas.getBoundingClientRect();
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                return {
                    width: rect.width,
                    height: rect.height,
                    dpr: dpr,
                    cx: rect.width * FRAME_X,
                    cy_u: rect.height * U_FRAME_Y,
                    cy_l: rect.height * L_FRAME_Y,
                    cy_spring_frame: rect.height * SPRING_FRAME_Y,
                    scale: rect.height,
                };
            }

            function solveGeometry(dims, travelParamLocal, steerAngleLocal) {
                const { cx, cy_u, cy_l, cy_spring_frame, scale } = dims;

                // 上控制臂车架支点（两个，在前视图中水平展开）
                const uf1 = { x: cx - UPPER_MOUNT_SPREAD * scale * 0.5, y: cy_u };
                const uf2 = { x: cx + UPPER_MOUNT_SPREAD * scale * 0.5, y: cy_u };
                const uf_center = { x: cx, y: cy_u };

                // 下控制臂车架支点
                const lf1 = { x: cx - LOWER_MOUNT_SPREAD * scale * 0.5, y: cy_l };
                const lf2 = { x: cx + LOWER_MOUNT_SPREAD * scale * 0.5, y: cy_l };
                const lf_center = { x: cx, y: cy_l };

                // 上控制臂角度（从水平线向下测量）
                const upperAngleMin = (NEUTRAL_UPPER_ANGLE_DEG + TRAVEL_RANGE_DEG * 0.5) * Math.PI / 180;
                const upperAngleMax = (NEUTRAL_UPPER_ANGLE_DEG - TRAVEL_RANGE_DEG * 0.5) * Math.PI / 180;
                const upperAngle = upperAngleMin + (upperAngleMax - upperAngleMin) * travelParamLocal;

                const r_upper = UPPER_ARM_LEN * scale;
                const r_lower = LOWER_ARM_LEN * scale;
                const d_kingpin = KINGPIN_LEN * scale;

                // 上球头位置
                const ubj = {
                    x: uf_center.x + r_upper * Math.cos(upperAngle),
                    y: uf_center.y + r_upper * Math.sin(upperAngle),
                };

                // 求解下球头：以ubj为圆心、d_kingpin为半径的圆 与 以lf_center为圆心、r_lower为半径的圆的交点
                const dx = ubj.x - lf_center.x;
                const dy = ubj.y - lf_center.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                let lbj;
                if (dist > r_lower + d_kingpin || dist < Math.abs(r_lower - d_kingpin)) {
                    // 无解，使用近似
                    const approxAngle = upperAngle + 1.2;
                    lbj = {
                        x: ubj.x + d_kingpin * Math.cos(approxAngle + Math.PI * 0.45),
                        y: ubj.y + d_kingpin * Math.sin(approxAngle + Math.PI * 0.45),
                    };
                } else {
                    // 使用余弦定理
                    const a = (r_lower * r_lower + dist * dist - d_kingpin * d_kingpin) / (2 * dist);
                    const h = Math.sqrt(Math.max(0, r_lower * r_lower - a * a));
                    const px = lf_center.x + (a * dx) / dist;
                    const py = lf_center.y + (a * dy) / dist;
                    const hx = (-h * dy) / dist;
                    const hy = (h * dx) / dist;

                    const candidate1 = { x: px + hx, y: py + hy };
                    const candidate2 = { x: px - hx, y: py - hy };

                    // 选择下方（Y值更大）的交点
                    if (candidate1.y > candidate2.y) {
                        lbj = candidate1;
                    } else {
                        lbj = candidate2;
                    }
                }

                // 主销中点
                const kpMid = {
                    x: (ubj.x + lbj.x) / 2,
                    y: (ubj.y + lbj.y) / 2,
                };

                // 主销方向（从LBJ到UBJ）
                const kpDx = ubj.x - lbj.x;
                const kpDy = ubj.y - lbj.y;
                const kpLen = Math.sqrt(kpDx * kpDx + kpDy * kpDy);
                const kpNx = kpLen > 0.001 ? kpDx / kpLen : 0;
                const kpNy = kpLen > 0.001 ? kpDy / kpLen : -1;

                // 主销内倾角（KIA）- 主销相对于垂直线的角度
                const kia = Math.atan2(Math.abs(kpNx), Math.abs(kpNy)) * 180 / Math.PI;
                const kiaSigned = Math.atan2(kpNx, -kpNy) * 180 / Math.PI;

                // 车轮中心（在主销中点外侧）
                const perpOutX = -kpNy; // 向外（右侧）的垂直方向
                const perpOutY = kpNx;
                if (perpOutX < 0) {
                    // 确保向外
                }
                const wc = {
                    x: kpMid.x + Math.abs(perpOutX) * WHEEL_OFFSET_X * scale,
                    y: kpMid.y + (perpOutY >= 0 ? perpOutY : -Math.abs(perpOutY)) * WHEEL_OFFSET_X * scale * 0.6,
                };

                // 调整：确保WC在合理位置
                const wcDx = wc.x - kpMid.x;
                const wcDy = wc.y - kpMid.y;
                const wcDist = Math.sqrt(wcDx * wcDx + wcDy * wcDy);
                if (wcDist > 0.001) {
                    const targetDist = WHEEL_OFFSET_X * scale;
                    wc.x = kpMid.x + (wcDx / wcDist) * targetDist;
                    wc.y = kpMid.y + (wcDy / wcDist) * targetDist;
                }

                // 车轮外倾角（camber）- 车轮相对于垂直线的角度
                const camber = Math.atan2(wc.x - kpMid.x, -(wc.y - kpMid.y)) * 180 / Math.PI;
                const camberFromKP = Math.atan2(-kpNx, -kpNy) * 180 / Math.PI;

                // 弹簧连接点
                const springLower = {
                    x: lf_center.x + (lbj.x - lf_center.x) * SPRING_LOWER_RATIO,
                    y: lf_center.y + (lbj.y - lf_center.y) * SPRING_LOWER_RATIO,
                };
                const springUpper = {
                    x: cx - 0.015 * scale,
                    y: cy_spring_frame,
                };

                // 转向节（连接UBJ和LBJ）
                const knuckleTop = ubj;
                const knuckleBottom = lbj;

                // 车轮接地点
                const wheelBottom = {
                    x: wc.x,
                    y: wc.y + WHEEL_RADIUS * scale,
                };

                return {
                    uf1,
                    uf2,
                    uf_center,
                    lf1,
                    lf2,
                    lf_center,
                    ubj,
                    lbj,
                    kpMid,
                    kpNx,
                    kpNy,
                    kpLen,
                    kia,
                    kiaSigned,
                    wc,
                    camber,
                    camberFromKP,
                    springLower,
                    springUpper,
                    knuckleTop,
                    knuckleBottom,
                    wheelBottom,
                    r_upper,
                    r_lower,
                    d_kingpin,
                    wheelRadius: WHEEL_RADIUS * scale,
                };
            }

            // ==================== 渲染：前视图 ====================
            function renderMainView(dims, geo) {
                const ctx = mainCtx;
                const { width, height, scale } = dims;
                const dpr = dims.dpr;

                mainCanvas.width = width * dpr;
                mainCanvas.height = height * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                // 背景
                ctx.fillStyle = '#1a1c1e';
                ctx.fillRect(0, 0, width, height);

                // 网格
                if (showGrid) {
                    const gridSpacing = scale * 0.04;
                    ctx.strokeStyle = '#25282c';
                    ctx.lineWidth = 0.5;
                    for (let x = gridSpacing; x < width; x += gridSpacing) {
                        ctx.beginPath();
                        ctx.moveTo(x, 0);
                        ctx.lineTo(x, height);
                        ctx.stroke();
                    }
                    for (let y = gridSpacing; y < height; y += gridSpacing) {
                        ctx.beginPath();
                        ctx.moveTo(0, y);
                        ctx.lineTo(width, y);
                        ctx.stroke();
                    }
                    // 粗网格
                    const majorGrid = gridSpacing * 5;
                    ctx.strokeStyle = '#2d3136';
                    ctx.lineWidth = 0.7;
                    for (let x = majorGrid; x < width; x += majorGrid) {
                        ctx.beginPath();
                        ctx.moveTo(x, 0);
                        ctx.lineTo(x, height);
                        ctx.stroke();
                    }
                    for (let y = majorGrid; y < height; y += majorGrid) {
                        ctx.beginPath();
                        ctx.moveTo(0, y);
                        ctx.lineTo(width, y);
                        ctx.stroke();
                    }
                }

                // 地面参考线
                const groundY = geo.wheelBottom.y;
                ctx.strokeStyle = '#3a3d44';
                ctx.lineWidth = 1;
                ctx.setLineDash([8, 12]);
                ctx.beginPath();
                ctx.moveTo(0, groundY);
                ctx.lineTo(width, groundY);
                ctx.stroke();
                ctx.setLineDash([]);
                // 地面标签
                ctx.fillStyle = '#5a6270';
                ctx.font = '9px "SF Mono","Consolas",monospace';
                ctx.fillText('GROUND', 8, groundY - 6);

                // 车架阴影区域（示意车体）
                ctx.fillStyle = 'rgba(40,44,50,0.6)';
                ctx.fillRect(0, 0, geo.uf_center.x + scale * 0.06, height);
                ctx.strokeStyle = '#3a3d44';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(geo.uf_center.x + scale * 0.06, 0);
                ctx.lineTo(geo.uf_center.x + scale * 0.06, height);
                ctx.stroke();
                ctx.fillStyle = '#6a7280';
                ctx.font = '9px "SF Mono","Consolas",monospace';
                ctx.fillText('CHASSIS', geo.uf_center.x - scale * 0.1, geo.uf_center.y - scale * 0.03);

                // 车架铰接点标记
                function drawFrameMount(x, y, label) {
                    ctx.fillStyle = '#5a6270';
                    ctx.beginPath();
                    ctx.arc(x, y, 4.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#7a8290';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(x, y, 4.5, 0, Math.PI * 2);
                    ctx.stroke();
                    // 十字标记
                    ctx.strokeStyle = '#1a1c1e';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(x - 3, y);
                    ctx.lineTo(x + 3, y);
                    ctx.moveTo(x, y - 3);
                    ctx.lineTo(x, y + 3);
                    ctx.stroke();
                    if (label) {
                        ctx.fillStyle = '#8a929d';
                        ctx.font = '8px "SF Mono","Consolas",monospace';
                        ctx.fillText(label, x + 8, y - 8);
                    }
                }
                drawFrameMount(geo.uf1.x, geo.uf1.y, 'UF1');
                drawFrameMount(geo.uf2.x, geo.uf2.y, 'UF2');
                drawFrameMount(geo.lf1.x, geo.lf1.y, 'LF1');
                drawFrameMount(geo.lf2.x, geo.lf2.y, 'LF2');

                // 弹簧车架连接点
                ctx.fillStyle = '#5a6270';
                ctx.beginPath();
                ctx.arc(geo.springUpper.x, geo.springUpper.y, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#7a8290';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.arc(geo.springUpper.x, geo.springUpper.y, 3.5, 0, Math.PI * 2);
                ctx.stroke();

                // 上控制臂（A臂 - V形线条）
                ctx.strokeStyle = '#5b9cf5';
                ctx.lineWidth = 2.2;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(geo.uf1.x, geo.uf1.y);
                ctx.lineTo(geo.ubj.x, geo.ubj.y);
                ctx.lineTo(geo.uf2.x, geo.uf2.y);
                ctx.stroke();
                // 上控制臂细轮廓线
                ctx.strokeStyle = 'rgba(91,156,245,0.35)';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(geo.uf1.x, geo.uf1.y);
                ctx.lineTo(geo.ubj.x, geo.ubj.y);
                ctx.lineTo(geo.uf2.x, geo.uf2.y);
                ctx.stroke();

                // 下控制臂（A臂 - V形线条）
                ctx.strokeStyle = '#4a85d0';
                ctx.lineWidth = 2.4;
                ctx.beginPath();
                ctx.moveTo(geo.lf1.x, geo.lf1.y);
                ctx.lineTo(geo.lbj.x, geo.lbj.y);
                ctx.lineTo(geo.lf2.x, geo.lf2.y);
                ctx.stroke();
                ctx.strokeStyle = 'rgba(74,133,208,0.35)';
                ctx.lineWidth = 5.5;
                ctx.beginPath();
                ctx.moveTo(geo.lf1.x, geo.lf1.y);
                ctx.lineTo(geo.lbj.x, geo.lbj.y);
                ctx.lineTo(geo.lf2.x, geo.lf2.y);
                ctx.stroke();

                // 弹簧/减震器
                if (showSpring) {
                    const sx1 = geo.springUpper.x;
                    const sy1 = geo.springUpper.y;
                    const sx2 = geo.springLower.x;
                    const sy2 = geo.springLower.y;
                    const sdx = sx2 - sx1;
                    const sdy = sy2 - sy1;
                    const sLen = Math.sqrt(sdx * sdx + sdy * sdy);
                    const snx = sLen > 0.001 ? sdx / sLen : 0;
                    const sny = sLen > 0.001 ? sdy / sLen : 1;

                    // 减震器外筒（下部）
                    const outerLen = sLen * 0.5;
                    const outerStartX = sx2 - snx * outerLen;
                    const outerStartY = sy2 - sny * outerLen;
                    ctx.strokeStyle = '#8cc265';
                    ctx.lineWidth = 4.5;
                    ctx.lineCap = 'butt';
                    ctx.beginPath();
                    ctx.moveTo(outerStartX, outerStartY);
                    ctx.lineTo(sx2, sy2);
                    ctx.stroke();

                    // 减震器活塞杆（上部）
                    ctx.strokeStyle = '#b8d9a0';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(sx1, sy1);
                    ctx.lineTo(outerStartX, outerStartY);
                    ctx.stroke();

                    // 弹簧螺旋示意
                    const springStart = 0.15;
                    const springEnd = 0.7;
                    const coils = 7;
                    const springAmp = scale * 0.014;
                    ctx.strokeStyle = '#f0d060';
                    ctx.lineWidth = 1.3;
                    ctx.beginPath();
                    for (let i = 0; i <= coils * 2; i++) {
                        const t = springStart + (springEnd - springStart) * (i / (coils * 2));
                        const px = sx1 + snx * t * sLen;
                        const py = sy1 + sny * t * sLen;
                        const perpX = -sny;
                        const perpY = snx;
                        const offset = (i % 2 === 0 ? springAmp : -springAmp) * (i < coils * 2 ? 1 : 0);
                        const waveX = px + perpX * offset;
                        const waveY = py + perpY * offset;
                        if (i === 0) ctx.moveTo(waveX, waveY);
                        else ctx.lineTo(waveX, waveY);
                    }
                    ctx.stroke();

                    // 弹簧连接点小圆
                    ctx.fillStyle = '#f0d060';
                    ctx.beginPath();
                    ctx.arc(geo.springLower.x, geo.springLower.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 转向节（连接UBJ和LBJ的刚体）
                const knuckleWidth = scale * 0.022;
                const kdx = geo.lbj.x - geo.ubj.x;
                const kdy = geo.lbj.y - geo.ubj.y;
                const kLen = Math.sqrt(kdx * kdx + kdy * kdy);
                const knx = kLen > 0.001 ? kdx / kLen : 0;
                const kny = kLen > 0.001 ? kdy / kLen : 1;
                const kPerpX = -kny;
                const kPerpY = knx;

                // 转向节主体
                ctx.strokeStyle = '#c0c8d4';
                ctx.lineWidth = 3.5;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(
                    geo.ubj.x + kPerpX * knuckleWidth * 0.5,
                    geo.ubj.y + kPerpY * knuckleWidth * 0.5
                );
                ctx.lineTo(
                    geo.lbj.x + kPerpX * knuckleWidth * 0.5,
                    geo.lbj.y + kPerpY * knuckleWidth * 0.5
                );
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(
                    geo.ubj.x - kPerpX * knuckleWidth * 0.5,
                    geo.ubj.y - kPerpY * knuckleWidth * 0.5
                );
                ctx.lineTo(
                    geo.lbj.x - kPerpX * knuckleWidth * 0.5,
                    geo.lbj.y - kPerpY * knuckleWidth * 0.5
                );
                ctx.stroke();

                // 转向节横梁（在球头附近）
                ctx.strokeStyle = '#b0b8c4';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(
                    geo.ubj.x - kPerpX * knuckleWidth,
                    geo.ubj.y - kPerpY * knuckleWidth
                );
                ctx.lineTo(
                    geo.ubj.x + kPerpX * knuckleWidth,
                    geo.ubj.y + kPerpY * knuckleWidth
                );
                ctx.stroke();

                // 主销轴线
                if (showKingpin) {
                    const kpExtend = scale * 0.06;
                    ctx.strokeStyle = '#ff6b5b';
                    ctx.lineWidth = 1.5;
                    ctx.setLineDash([7, 5]);
                    ctx.beginPath();
                    ctx.moveTo(
                        geo.ubj.x - knx * kpExtend,
                        geo.ubj.y - kny * kpExtend
                    );
                    ctx.lineTo(
                        geo.lbj.x + knx * kpExtend,
                        geo.lbj.y + kny * kpExtend
                    );
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // 主销标签
                    const kpLabelX = (geo.ubj.x + geo.lbj.x) / 2 + kPerpX * scale * 0.04;
                    const kpLabelY = (geo.ubj.y + geo.lbj.y) / 2 + kPerpY * scale * 0.04;
                    ctx.fillStyle = '#ff6b5b';
                    ctx.font = '9px "SF Mono","Consolas",monospace';
                    ctx.fillText('KINGPIN', kpLabelX - 18, kpLabelY - 6);
                }

                // 球头节点
                function drawBallJoint(x, y, color, size) {
                    // 外圈
                    ctx.fillStyle = '#1a1c1e';
                    ctx.beginPath();
                    ctx.arc(x, y, size + 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(x, y, size + 2, 0, Math.PI * 2);
                    ctx.stroke();
                    // 内核
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                    // 高光
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.beginPath();
                    ctx.arc(x - size * 0.25, y - size * 0.25, size * 0.35, 0, Math.PI * 2);
                    ctx.fill();
                }
                drawBallJoint(geo.ubj.x, geo.ubj.y, '#5b9cf5', 6);
                drawBallJoint(geo.lbj.x, geo.lbj.y, '#4a85d0', 6.5);

                // 车轮
                const wc = geo.wc;
                const wr = geo.wheelRadius;

                // 轮胎外轮廓
                ctx.strokeStyle = '#555b65';
                ctx.lineWidth = 3.5;
                ctx.beginPath();
                ctx.arc(wc.x, wc.y, wr, 0, Math.PI * 2);
                ctx.stroke();

                // 轮胎内圈
                ctx.strokeStyle = '#3d4249';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(wc.x, wc.y, wr - 8, 0, Math.PI * 2);
                ctx.stroke();

                // 轮毂
                const hubRadius = wr * 0.35;
                ctx.fillStyle = '#3d4249';
                ctx.beginPath();
                ctx.arc(wc.x, wc.y, hubRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#555b65';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(wc.x, wc.y, hubRadius, 0, Math.PI * 2);
                ctx.stroke();

                // 轮辐（5根）
                for (let i = 0; i < 5; i++) {
                    const angle = (i / 5) * Math.PI * 2;
                    ctx.strokeStyle = '#4a5059';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(wc.x + hubRadius * 0.35 * Math.cos(angle), wc.y + hubRadius * 0.35 * Math.sin(angle));
                    ctx.lineTo(wc.x + (wr - 6) * Math.cos(angle), wc.y + (wr - 6) * Math.sin(angle));
                    ctx.stroke();
                }
                // 中心螺母
                ctx.fillStyle = '#6a7280';
                ctx.beginPath();
                ctx.arc(wc.x, wc.y, hubRadius * 0.2, 0, Math.PI * 2);
                ctx.fill();

                // 车轮中心标记
                ctx.fillStyle = '#e8eaed';
                ctx.beginPath();
                ctx.arc(wc.x, wc.y, 3, 0, Math.PI * 2);
                ctx.fill();

                // 车轮外倾指示线
                const camberLineLen = wr + scale * 0.04;
                const camberTopX = wc.x - Math.sin(geo.camber * Math.PI / 180) * camberLineLen;
                const camberTopY = wc.y - Math.cos(geo.camber * Math.PI / 180) * camberLineLen;
                const camberBotX = wc.x + Math.sin(geo.camber * Math.PI / 180) * camberLineLen;
                const camberBotY = wc.y + Math.cos(geo.camber * Math.PI / 180) * camberLineLen;
                ctx.strokeStyle = 'rgba(255,255,255,0.25)';
                ctx.lineWidth = 1;
                ctx.setLineDash([3, 6]);
                ctx.beginPath();
                ctx.moveTo(camberTopX, camberTopY);
                ctx.lineTo(camberBotX, camberBotY);
                ctx.stroke();
                ctx.setLineDash([]);

                // 垂直参考线（经过车轮中心）
                ctx.strokeStyle = 'rgba(255,255,255,0.12)';
                ctx.lineWidth = 0.8;
                ctx.setLineDash([2, 8]);
                ctx.beginPath();
                ctx.moveTo(wc.x, wc.y - wr - scale * 0.03);
                ctx.lineTo(wc.x, wc.y + wr + scale * 0.03);
                ctx.stroke();
                ctx.setLineDash([]);

                // 运动路径
                if (showPath && pathHistoryUBJ.length > 1) {
                    // UBJ路径
                    ctx.strokeStyle = 'rgba(91,156,245,0.5)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([2, 4]);
                    ctx.beginPath();
                    ctx.moveTo(pathHistoryUBJ[0].x, pathHistoryUBJ[0].y);
                    for (let i = 1; i < pathHistoryUBJ.length; i++) {
                        ctx.lineTo(pathHistoryUBJ[i].x, pathHistoryUBJ[i].y);
                    }
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // LBJ路径
                    ctx.strokeStyle = 'rgba(74,133,208,0.5)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([2, 4]);
                    ctx.beginPath();
                    ctx.moveTo(pathHistoryLBJ[0].x, pathHistoryLBJ[0].y);
                    for (let i = 1; i < pathHistoryLBJ.length; i++) {
                        ctx.lineTo(pathHistoryLBJ[i].x, pathHistoryLBJ[i].y);
                    }
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // WC路径
                    ctx.strokeStyle = 'rgba(200,200,210,0.45)';
                    ctx.lineWidth = 1.2;
                    ctx.setLineDash([3, 5]);
                    ctx.beginPath();
                    ctx.moveTo(pathHistoryWC[0].x, pathHistoryWC[0].y);
                    for (let i = 1; i < pathHistoryWC.length; i++) {
                        ctx.lineTo(pathHistoryWC[i].x, pathHistoryWC[i].y);
                    }
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                // 标注箭头和尺寸
                // 主销内倾角标注
                if (showKingpin) {
                    const arcCenter = geo.lbj;
                    const arcR = scale * 0.06;
                    const verticalAngle = -Math.PI / 2;
                    const kpAngle = Math.atan2(-(geo.ubj.y - geo.lbj.y), geo.ubj.x - geo.lbj.x);
                    const startAngle = verticalAngle;
                    const endAngle = kpAngle;
                    ctx.strokeStyle = 'rgba(255,107,91,0.7)';
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.arc(arcCenter.x, arcCenter.y, arcR, startAngle, endAngle, endAngle < startAngle);
                    ctx.stroke();
                    const midA = (startAngle + endAngle) / 2;
                    ctx.fillStyle = '#ff6b5b';
                    ctx.font = '9px "SF Mono","Consolas",monospace';
                    const alx = arcCenter.x + (arcR + 14) * Math.cos(midA);
                    const aly = arcCenter.y + (arcR + 14) * Math.sin(midA);
                    ctx.fillText('KIA', alx - 8, aly + 4);
                }

                // 坐标轴指示器（右下角）
                const axisX = width - 50;
                const axisY = height - 50;
                ctx.strokeStyle = '#e8eaed';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(axisX, axisY);
                ctx.lineTo(axisX + 30, axisY);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(axisX, axisY);
                ctx.lineTo(axisX, axisY - 30);
                ctx.stroke();
                ctx.fillStyle = '#e8eaed';
                ctx.font = 'bold 10px "SF Mono","Consolas",monospace';
                ctx.fillText('X', axisX + 34, axisY + 4);
                ctx.fillText('Z', axisX - 4, axisY - 34);
                ctx.fillStyle = '#7a8290';
                ctx.font = '8px "SF Mono","Consolas",monospace';
                ctx.fillText('FRONT VIEW', axisX - 10, axisY + 18);
            }

            // ==================== 渲染：俯视图 ====================
            function renderTopView(dims, geo, steerAngleLocal) {
                const container = document.getElementById('topview-container');
                const rect = container.getBoundingClientRect();
                const tw = rect.width;
                const th = rect.height;
                const dpr = Math.min(window.devicePixelRatio || 1, 2);

                topviewCanvas.width = tw * dpr;
                topviewCanvas.height = th * dpr;
                const ctx = topviewCtx;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                // 背景
                ctx.fillStyle = '#1a1c1f';
                ctx.fillRect(0, 0, tw, th);

                // 网格
                const gs = tw * 0.04;
                ctx.strokeStyle = '#24272b';
                ctx.lineWidth = 0.4;
                for (let x = gs; x < tw; x += gs) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, th);
                    ctx.stroke();
                }
                for (let y = gs; y < th; y += gs) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(tw, y);
                    ctx.stroke();
                }

                const cx = tw * 0.35;
                const cy = th * 0.5;
                const sc = th * 0.75;

                // 车架参考线
                ctx.strokeStyle = '#3a3d44';
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 8]);
                ctx.beginPath();
                ctx.moveTo(cx - sc * 0.15, cy - sc * 0.5);
                ctx.lineTo(cx - sc * 0.15, cy + sc * 0.5);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = '#5a6270';
                ctx.font = '8px "SF Mono","Consolas",monospace';
                ctx.fillText('CHASSIS', cx - sc * 0.2, cy - sc * 0.5 - 4);

                // 上控制臂俯视投影
                const uf1_t = { x: cx - sc * 0.08, y: cy - sc * 0.22 };
                const uf2_t = { x: cx - sc * 0.08, y: cy + sc * 0.22 };
                const ubj_t = { x: cx + sc * 0.22, y: cy };
                ctx.strokeStyle = '#5b9cf5';
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.moveTo(uf1_t.x, uf1_t.y);
                ctx.lineTo(ubj_t.x, ubj_t.y);
                ctx.lineTo(uf2_t.x, uf2_t.y);
                ctx.stroke();
                ctx.fillStyle = '#5b9cf5';
                ctx.beginPath();
                ctx.arc(ubj_t.x, ubj_t.y, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#5a6270';
                ctx.beginPath();
                ctx.arc(uf1_t.x, uf1_t.y, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(uf2_t.x, uf2_t.y, 2.5, 0, Math.PI * 2);
                ctx.fill();

                // 下控制臂俯视投影
                const lf1_t = { x: cx - sc * 0.06, y: cy - sc * 0.28 };
                const lf2_t = { x: cx - sc * 0.06, y: cy + sc * 0.28 };
                const lbj_t = { x: cx + sc * 0.27, y: cy };
                ctx.strokeStyle = '#4a85d0';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(lf1_t.x, lf1_t.y);
                ctx.lineTo(lbj_t.x, lbj_t.y);
                ctx.lineTo(lf2_t.x, lf2_t.y);
                ctx.stroke();
                ctx.fillStyle = '#4a85d0';
                ctx.beginPath();
                ctx.arc(lbj_t.x, lbj_t.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#5a6270';
                ctx.beginPath();
                ctx.arc(lf1_t.x, lf1_t.y, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(lf2_t.x, lf2_t.y, 2.5, 0, Math.PI * 2);
                ctx.fill();

                // 主销（俯视图中UBJ和LBJ几乎重叠）
                const kpTopX = (ubj_t.x + lbj_t.x) / 2;
                const kpTopY = (ubj_t.y + lbj_t.y) / 2;
                ctx.fillStyle = '#ff6b5b';
                ctx.beginPath();
                ctx.arc(kpTopX, kpTopY, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,107,91,0.5)';
                ctx.lineWidth = 0.8;
                ctx.setLineDash([2, 3]);
                ctx.beginPath();
                ctx.arc(kpTopX, kpTopY, 6, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);

                // 转向节臂（从主销位置向前或向后伸出）
                const armDirX = 0;
                const armDirY = -1;
                const armTipX = kpTopX + armDirX * sc * 0.1;
                const armTipY = kpTopY + armDirY * sc * 0.1;
                ctx.strokeStyle = '#c0c8d4';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(kpTopX, kpTopY);
                ctx.lineTo(armTipX, armTipY);
                ctx.stroke();

                // 转向机（rack）
                const rackX = cx - sc * 0.12;
                const rackHalfLen = sc * 0.2;
                const rackY = cy;
                ctx.strokeStyle = '#8a929d';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(rackX, rackY - rackHalfLen);
                ctx.lineTo(rackX, rackY + rackHalfLen);
                ctx.stroke();
                ctx.fillStyle = '#8a929d';
                ctx.font = '7px "SF Mono","Consolas",monospace';
                ctx.fillText('RACK', rackX + 8, rackY + rackHalfLen + 12);

                // 转向拉杆连接点（在rack上的滑块位置）
                const rackSliderY = rackY + (steerAngleLocal / 40) * rackHalfLen * 0.8;
                const rackSliderX = rackX;

                // 转向拉杆（从rack滑块到转向节臂尖端）
                ctx.strokeStyle = '#f0a040';
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.moveTo(rackSliderX, rackSliderY);
                ctx.lineTo(armTipX, armTipY);
                ctx.stroke();
                // 拉杆两端
                ctx.fillStyle = '#f0a040';
                ctx.beginPath();
                ctx.arc(rackSliderX, rackSliderY, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(armTipX, armTipY, 3, 0, Math.PI * 2);
                ctx.fill();

                // 车轮俯视轮廓（随转向旋转）
                const wheelLen = sc * 0.32;
                const wheelWid = sc * 0.09;
                const wheelBaseX = kpTopX + sc * 0.06;
                const wheelBaseY = kpTopY;
                const steerRad = steerAngleLocal * Math.PI / 180;

                ctx.save();
                ctx.translate(wheelBaseX, wheelBaseY);
                ctx.rotate(steerRad);
                ctx.strokeStyle = '#555b65';
                ctx.lineWidth = 2.5;
                ctx.strokeRect(-wheelLen * 0.5, -wheelWid * 0.5, wheelLen, wheelWid);
                ctx.fillStyle = 'rgba(60,65,72,0.5)';
                ctx.fillRect(-wheelLen * 0.5, -wheelWid * 0.5, wheelLen, wheelWid);
                // 轮胎中心线
                ctx.strokeStyle = '#6a7280';
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(-wheelLen * 0.5, 0);
                ctx.lineTo(wheelLen * 0.5, 0);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.restore();

                // 转向角度指示
                const indicatorLen = sc * 0.18;
                const indX = wheelBaseX + Math.cos(steerRad) * indicatorLen;
                const indY = wheelBaseY + Math.sin(steerRad) * indicatorLen;
                ctx.strokeStyle = 'rgba(240,160,64,0.6)';
                ctx.lineWidth = 1;
                ctx.setLineDash([3, 5]);
                ctx.beginPath();
                ctx.moveTo(wheelBaseX, wheelBaseY);
                ctx.lineTo(indX, indY);
                ctx.stroke();
                ctx.setLineDash([]);

                // 标签
                ctx.fillStyle = '#f0a040';
                ctx.font = '8px "SF Mono","Consolas",monospace';
                ctx.fillText('TIE ROD', rackSliderX + (armTipX - rackSliderX) * 0.4,
                    rackSliderY + (armTipY - rackSliderY) * 0.4 - 6);
                ctx.fillStyle = '#7a8290';
                ctx.fillText('STEERING', tw * 0.55, th * 0.25);

                // 图例
                ctx.fillStyle = '#8a929d';
                ctx.font = '7px "SF Mono","Consolas",monospace';
                ctx.fillText('TOP VIEW', tw - 60, th - 8);
            }

            // ==================== 主渲染循环 ====================
            function renderAll() {
                const dims = getCanvasDimensions();
                const geo = solveGeometry(dims, travelParam, steerAngle);
                renderMainView(dims, geo);

                const topDims = getCanvasDimensions();
                renderTopView(topDims, geo, steerAngle);

                // 更新数据面板
                updateDataPanel(geo);
            }

            function updateDataPanel(geo) {
                document.getElementById('valKIA').textContent = geo.kiaSigned.toFixed(1) + '°';
                document.getElementById('valCamber').textContent = geo.camberFromKP.toFixed(1) + '°';
                const travelMM = ((travelParam - 0.5) * 2 * 80).toFixed(0);
                document.getElementById('valTravel').textContent = travelMM + ' mm';
                document.getElementById('valSteer').textContent = steerAngle.toFixed(1) + '°';
                document.getElementById('valUBJ').textContent =
                    '(' + (geo.ubj.x / dims.scale * 1000).toFixed(0) + ', ' + ((geo.ubj.y / dims.scale) * 1000 - 300)
                    .toFixed(0) + ')';
                document.getElementById('valLBJ').textContent =
                    '(' + (geo.lbj.x / dims.scale * 1000).toFixed(0) + ', ' + ((geo.lbj.y / dims.scale) * 1000 - 300)
                    .toFixed(0) + ')';
                document.getElementById('valKingpinLen').textContent = (geo.kpLen / dims.scale * 1000).toFixed(0) + ' mm';
            }

            // 全局dims引用用于数据面板
            let dims = null;

            function fullRender() {
                dims = getCanvasDimensions();
                const geo = solveGeometry(dims, travelParam, steerAngle);
                renderMainView(dims, geo);
                renderTopView(dims, geo, steerAngle);
                updateDataPanel(geo);

                // 更新路径历史
                if (showPath) {
                    pathHistoryUBJ.push({ x: geo.ubj.x, y: geo.ubj.y });
                    pathHistoryLBJ.push({ x: geo.lbj.x, y: geo.lbj.y });
                    pathHistoryWC.push({ x: geo.wc.x, y: geo.wc.y });
                    while (pathHistoryUBJ.length > maxPathPoints) pathHistoryUBJ.shift();
                    while (pathHistoryLBJ.length > maxPathPoints) pathHistoryLBJ.shift();
                    while (pathHistoryWC.length > maxPathPoints) pathHistoryWC.shift();
                } else {
                    if (pathHistoryUBJ.length > 0) {
                        pathHistoryUBJ.length = 0;
                        pathHistoryLBJ.length = 0;
                        pathHistoryWC.length = 0;
                    }
                }
            }

            // ==================== 动画循环 ====================
            function animate(timestamp) {
                // 平滑过渡
                const lerpSpeed = 0.25;
                travelParam += (targetTravelParam - travelParam) * lerpSpeed;
                steerAngle += (targetSteerAngle - steerAngle) * lerpSpeed;

                // 自动演示
                if (autoDemo) {
                    const demoPeriod = 4000;
                    const phase = (timestamp % demoPeriod) / demoPeriod;
                    targetTravelParam = 0.5 + 0.48 * Math.sin(phase * Math.PI * 2);
                    targetSteerAngle = Math.sin(phase * Math.PI * 2 + 1.2) * 28;
                    sliderTravel.value = Math.round(targetTravelParam * 100);
                    sliderSteer.value = Math.round(targetSteerAngle / 40 * 100);
                    travelPercentEl.textContent = Math.round(targetTravelParam * 100) + '%';
                    steerPercentEl.textContent = targetSteerAngle.toFixed(0) + '°';
                }

                fullRender();

                // 更新滑块显示
                if (!autoDemo) {
                    travelPercentEl.textContent = Math.round(travelParam * 100) + '%';
                    steerPercentEl.textContent = steerAngle.toFixed(0) + '°';
                }

                requestAnimationFrame(animate);
            }

            // ==================== 交互处理 ====================
            let isDraggingWheel = false;
            let dragStartY = 0;
            let dragStartTravel = 0;
            let isHoveringWheel = false;

            function getCanvasPos(e) {
                const rect = mainCanvas.getBoundingClientRect();
                return {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top,
                };
            }

            function isNearWheel(pos, geo) {
                if (!geo) return false;
                const dx = pos.x - geo.wc.x;
                const dy = pos.y - geo.wc.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                return dist < geo.wheelRadius + 20;
            }

            mainCanvas.addEventListener('mousedown', (e) => {
                const pos = getCanvasPos(e);
                const dimsLocal = getCanvasDimensions();
                const geo = solveGeometry(dimsLocal, travelParam, steerAngle);
                if (isNearWheel(pos, geo)) {
                    isDraggingWheel = true;
                    dragStartY = pos.y;
                    dragStartTravel = targetTravelParam;
                    canvasArea.classList.add('dragging');
                    e.preventDefault();
                }
            });

            window.addEventListener('mousemove', (e) => {
                const pos = getCanvasPos(e);
                const dimsLocal = getCanvasDimensions();
                const geo = solveGeometry(dimsLocal, travelParam, steerAngle);
                const nearWheel = isNearWheel(pos, geo);

                if (nearWheel !== isHoveringWheel) {
                    isHoveringWheel = nearWheel;
                    if (nearWheel) {
                        canvasArea.classList.add('hover-wheel');
                    } else {
                        canvasArea.classList.remove('hover-wheel');
                    }
                }

                if (isDraggingWheel) {
                    const dy = pos.y - dragStartY;
                    const sensitivity = dimsLocal.scale * 0.002;
                    targetTravelParam = Math.max(0.02, Math.min(0.98, dragStartTravel + dy * sensitivity));
                    sliderTravel.value = Math.round(targetTravelParam * 100);
                }
            });

            window.addEventListener('mouseup', () => {
                if (isDraggingWheel) {
                    isDraggingWheel = false;
                    canvasArea.classList.remove('dragging');
                }
            });

            // 滚轮调整转向
            mainCanvas.addEventListener('wheel', (e) => {
                if (isDraggingWheel) return;
                e.preventDefault();
                targetSteerAngle = Math.max(-40, Math.min(40, targetSteerAngle - e.deltaY * 0.08));
                sliderSteer.value = Math.round(targetSteerAngle / 40 * 100);
            }, { passive: false });

            // 触摸事件
            mainCanvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    const pos = { x: e.touches[0].clientX - mainCanvas.getBoundingClientRect().left,
                        y: e.touches[0].clientY - mainCanvas.getBoundingClientRect().top };
                    const dimsLocal = getCanvasDimensions();
                    const geo = solveGeometry(dimsLocal, travelParam, steerAngle);
                    if (isNearWheel(pos, geo)) {
                        isDraggingWheel = true;
                        dragStartY = pos.y;
                        dragStartTravel = targetTravelParam;
                        e.preventDefault();
                    }
                }
            }, { passive: false });

            mainCanvas.addEventListener('touchmove', (e) => {
                if (isDraggingWheel) {
                    const pos = { x: e.touches[0].clientX - mainCanvas.getBoundingClientRect().left,
                        y: e.touches[0].clientY - mainCanvas.getBoundingClientRect().top };
                    const dimsLocal = getCanvasDimensions();
                    const dy = pos.y - dragStartY;
                    const sensitivity = dimsLocal.scale * 0.002;
                    targetTravelParam = Math.max(0.02, Math.min(0.98, dragStartTravel + dy * sensitivity));
                    sliderTravel.value = Math.round(targetTravelParam * 100);
                    e.preventDefault();
                }
            }, { passive: false });

            mainCanvas.addEventListener('touchend', () => {
                isDraggingWheel = false;
                canvasArea.classList.remove('dragging');
            });

            // 滑块事件
            sliderTravel.addEventListener('input', () => {
                if (autoDemo) return;
                targetTravelParam = parseInt(sliderTravel.value) / 100;
            });

            sliderSteer.addEventListener('input', () => {
                if (autoDemo) return;
                targetSteerAngle = parseInt(sliderSteer.value) / 100 * 40;
            });

            // 键盘快捷键
            window.addEventListener('keydown', (e) => {
                switch (e.key.toLowerCase()) {
                    case 'r':
                        resetAll();
                        break;
                    case 'a':
                        autoDemo = !autoDemo;
                        updateButtonStates();
                        statusTag.textContent = autoDemo ? '自动演示中' : '就绪';
                        break;
                    case 'g':
                        showGrid = !showGrid;
                        updateButtonStates();
                        break;
                    case 'k':
                        showKingpin = !showKingpin;
                        updateButtonStates();
                        break;
                    case 'p':
                        showPath = !showPath;
                        updateButtonStates();
                        break;
                    case 's':
                        showSpring = !showSpring;
                        updateButtonStates();
                        break;
                    case 'arrowup':
                        e.preventDefault();
                        targetTravelParam = Math.min(0.98, targetTravelParam + 0.04);
                        sliderTravel.value = Math.round(targetTravelParam * 100);
                        break;
                    case 'arrowdown':
                        e.preventDefault();
                        targetTravelParam = Math.max(0.02, targetTravelParam - 0.04);
                        sliderTravel.value = Math.round(targetTravelParam * 100);
                        break;
                    case 'arrowleft':
                        e.preventDefault();
                        targetSteerAngle = Math.max(-40, targetSteerAngle - 3);
                        sliderSteer.value = Math.round(targetSteerAngle / 40 * 100);
                        break;
                    case 'arrowright':
                        e.preventDefault();
                        targetSteerAngle = Math.min(40, targetSteerAngle + 3);
                        sliderSteer.value = Math.round(targetSteerAngle / 40 * 100);
                        break;
                }
            });

            function resetAll() {
                targetTravelParam = 0.5;
                targetSteerAngle = 0;
                travelParam = 0.5;
                steerAngle = 0;
                sliderTravel.value = 50;
                sliderSteer.value = 0;
                pathHistoryUBJ.length = 0;
                pathHistoryLBJ.length = 0;
                pathHistoryWC.length = 0;
                autoDemo = false;
                updateButtonStates();
                statusTag.textContent = '就绪';
            }

            // ==================== 窗口大小调整 ====================
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    pathHistoryUBJ.length = 0;
                    pathHistoryLBJ.length = 0;
                    pathHistoryWC.length = 0;
                    fullRender();
                }, 150);
            });

            // ==================== 启动 ====================
            function init() {
                sliderTravel.value = 50;
                sliderSteer.value = 0;
                targetTravelParam = 0.5;
                targetSteerAngle = 0;
                travelParam = 0.5;
                steerAngle = 0;
                updateButtonStates();
                fullRender();
                requestAnimationFrame(animate);
            }

            init();
        })();
    </script>
</body>
</html>
