<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bilibili - M3 重构</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- M3 Top App Bar (Small) -->
  <header class="m3-top-app-bar">
    <div class="top-app-bar__leading">
      <button class="m3-icon-button" aria-label="菜单">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <div class="brand-logo">
        <svg viewBox="0 0 120 36" class="logo-svg" aria-label="bilibili">
          <text x="0" y="28" class="logo-text">bilibili</text>
        </svg>
      </div>
    </div>
    <div class="top-app-bar__center">
      <!-- M3 Search Bar -->
      <div class="m3-search-bar">
        <span class="material-symbols-outlined search-icon">search</span>
        <input type="text" class="search-input" placeholder="搜索视频、番剧、UP主">
        <button class="m3-icon-button search-btn" aria-label="搜索">
          <span class="material-symbols-outlined">arrow_forward</span>
        </button>
      </div>
    </div>
    <div class="top-app-bar__trailing">
      <button class="m3-icon-button" aria-label="上传">
        <span class="material-symbols-outlined">add_circle</span>
      </button>
      <button class="m3-icon-button" aria-label="消息">
        <span class="material-symbols-outlined">notifications</span>
        <span class="badge">3</span>
      </button>
      <button class="m3-icon-button" aria-label="动态">
        <span class="material-symbols-outlined">dynamic_feed</span>
      </button>
      <button class="m3-avatar-button" aria-label="用户">
        <div class="avatar-placeholder">
          <span class="material-symbols-outlined">person</span>
        </div>
      </button>
    </div>
  </header>

  <!-- M3 Navigation Drawer (Modal - for mobile) -->
  <div class="m3-scrim" id="navScrim"></div>
  <nav class="m3-nav-drawer" id="navDrawer">
    <div class="nav-drawer__header">
      <div class="avatar-placeholder large">
        <span class="material-symbols-outlined">person</span>
      </div>
      <div class="user-info">
        <span class="user-name">未登录用户</span>
        <span class="user-id">点击登录</span>
      </div>
    </div>
    <div class="nav-drawer__content">
      <a class="m3-nav-item active" href="#">
        <span class="material-symbols-outlined">home</span>
        <span>首页</span>
      </a>
      <a class="m3-nav-item" href="#">
        <span class="material-symbols-outlined">local_fire_department</span>
        <span>热门</span>
      </a>
      <a class="m3-nav-item" href="#">
        <span class="material-symbols-outlined">subscriptions</span>
        <span>频道</span>
      </a>
      <a class="m3-nav-item" href="#">
        <span class="material-symbols-outlined">history</span>
        <span>历史</span>
      </a>
      <a class="m3-nav-item" href="#">
        <span class="material-symbols-outlined">favorite</span>
        <span>收藏</span>
      </a>
      <div class="nav-divider"></div>
      <a class="m3-nav-item" href="#">
        <span class="material-symbols-outlined">live_tv</span>
        <span>直播</span>
      </a>
      <a class="m3-nav-item" href="#">
        <span class="material-symbols-outlined">movie</span>
        <span>番剧</span>
      </a>
      <a class="m3-nav-item" href="#">
        <span class="material-symbols-outlined">sports_esports</span>
        <span>游戏中心</span>
      </a>
      <a class="m3-nav-item" href="#">
        <span class="material-symbols-outlined">shopping_bag</span>
        <span>会员购</span>
      </a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <!-- M3 Filter Chips -->
    <section class="filter-chips-section">
      <div class="m3-chip-set">
        <button class="m3-chip m3-chip--filter selected" data-category="recommend">
          <span class="chip-check"><span class="material-symbols-outlined">check</span></span>
          <span class="chip-label">推荐</span>
        </button>
        <button class="m3-chip m3-chip--filter" data-category="anime">
          <span class="chip-check"><span class="material-symbols-outlined">check</span></span>
          <span class="chip-label">动画</span>
        </button>
        <button class="m3-chip m3-chip--filter" data-category="gaming">
          <span class="chip-check"><span class="material-symbols-outlined">check</span></span>
          <span class="chip-label">游戏</span>
        </button>
        <button class="m3-chip m3-chip--filter" data-category="tech">
          <span class="chip-check"><span class="material-symbols-outlined">check</span></span>
          <span class="chip-label">科技</span>
        </button>
        <button class="m3-chip m3-chip--filter" data-category="music">
          <span class="chip-check"><span class="material-symbols-outlined">check</span></span>
          <span class="chip-label">音乐</span>
        </button>
        <button class="m3-chip m3-chip--filter" data-category="dance">
          <span class="chip-check"><span class="material-symbols-outlined">check</span></span>
          <span class="chip-label">舞蹈</span>
        </button>
        <button class="m3-chip m3-chip--filter" data-category="food">
          <span class="chip-check"><span class="material-symbols-outlined">check</span></span>
          <span class="chip-label">美食</span>
        </button>
        <button class="m3-chip m3-chip--filter" data-category="life">
          <span class="chip-check"><span class="material-symbols-outlined">check</span></span>
          <span class="chip-label">生活</span>
        </button>
        <button class="m3-chip m3-chip--filter" data-category="knowledge">
          <span class="chip-check"><span class="material-symbols-outlined">check</span></span>
          <span class="chip-label">知识</span>
        </button>
        <button class="m3-chip m3-chip--filter" data-category="fashion">
          <span class="chip-check"><span class="material-symbols-outlined">check</span></span>
          <span class="chip-label">时尚</span>
        </button>
      </div>
    </section>

    <!-- Video Grid -->
    <section class="video-grid-section">
      <div class="video-grid" id="videoGrid">
        <!-- Cards injected by JS -->
      </div>
    </section>

    <!-- M3 FAB -->
    <button class="m3-fab" aria-label="回到顶部" id="fabTop">
      <span class="material-symbols-outlined">arrow_upward</span>
    </button>
  </main>

  <!-- M3 Navigation Bar (Bottom - Mobile) -->
  <nav class="m3-nav-bar">
    <a class="m3-nav-bar__item active" href="#">
      <div class="nav-bar__indicator">
        <span class="material-symbols-outlined">home</span>
      </div>
      <span class="nav-bar__label">首页</span>
    </a>
    <a class="m3-nav-bar__item" href="#">
      <div class="nav-bar__indicator">
        <span class="material-symbols-outlined">local_fire_department</span>
      </div>
      <span class="nav-bar__label">热门</span>
    </a>
    <a class="m3-nav-bar__item" href="#">
      <div class="nav-bar__indicator">
        <span class="material-symbols-outlined">subscriptions</span>
      </div>
      <span class="nav-bar__label">频道</span>
    </a>
    <a class="m3-nav-bar__item" href="#">
      <div class="nav-bar__indicator">
        <span class="material-symbols-outlined">person</span>
      </div>
      <span class="nav-bar__label">我的</span>
    </a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
