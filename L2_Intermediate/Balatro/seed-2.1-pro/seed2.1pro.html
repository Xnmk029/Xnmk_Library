/* 小丑牌 Shader */
.joker-card {
  width: clamp(55px, 10vw, 75px);
  height: clamp(77px, 14vw, 105px);
  border-radius: clamp(6px, 1vw, 10px);
  position: relative;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  overflow: hidden;
  background: linear-gradient(135deg, #3d3266 0%, #241e40 100%);
  border: 2px solid #5a4d8a;
  transform-origin: bottom center;
}

.joker-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: 
    radial-gradient(ellipse at 30% 20%, rgba(255, 255, 255, 0.15) 0%, transparent 50%),
    linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.08) 50%, transparent 60%);
  background-size: 100% 100%, 200% 200%;
  animation: joker-holo 4s linear infinite;
  pointer-events: none;
}

@keyframes joker-holo {
  0% { background-position: 0 0, 200% 200%; }
  100% { background-position: 0 0, -200% -200%; }
}

.joker-card::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: inherit;
  background: conic-gradient(from 0deg, transparent, rgba(155, 89, 182, 0.3), transparent, rgba(254, 95, 85, 0.3), transparent, rgba(0, 157, 255, 0.3), transparent);
  opacity: 0;
  transition: opacity 0.3s;
  z-index: -1;
  animation: joker-rotate 4s linear infinite;
}

@keyframes joker-rotate {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.joker-card:hover {
  transform: translateY(-8px) scale(1.05);
  border-color: var(--gold);
}

.joker-card:hover::after {
  opacity: 1;
}

.joker-card.activating {
  animation: joker-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  border-color: var(--gold);
  box-shadow: 0 0 30px var(--gold), 0 0 60px var(--mult-red);
  z-index: 10;
}

.joker-card.activating::after {
  opacity: 1;
  animation-duration: 0.5s;
}

@keyframes joker-pop {
  0% { transform: scale(1) translateY(0); }
  40% { transform: scale(1.25) translateY(-15px); }
  70% { transform: scale(1.15) translateY(-10px); }
  100% { transform: scale(1) translateY(0); }
}

.joker-emoji {
  font-size: clamp(24px, 5vw, 34px);
  z-index: 1;
  transition: transform 0.2s;
}

.joker-card.activating .joker-emoji {
  animation: emoji-spin 0.5s ease-out;
}

@keyframes emoji-spin {
  0% { transform: scale(1) rotate(0); }
  50% { transform: scale(1.5) rotate(15deg); }
  100% { transform: scale(1) rotate(0); }
}

.joker-name {
  font-size: clamp(6px, 1vw, 8px);
  color: #c8bfe0;
  z-index: 1;
  text-align: center;
  line-height: 1.2;

}

.joker-popup {
  position: absolute;
  top: -25px;

}

@keyframes popup-float {
  0% { opacity: 0; transform: translateX(-50%) translateY(10px) scale(0.5); }
  20% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.2); }
  100% { opacity: 0; transform: translateX(-50%) translateY(-40px) scale(1); }
}

/* ==================== 卡牌 Shader 效果 ==================== */
.game-card {
  width: clamp(60px, 11vw, 85px);
  height: clamp(84px, 15.4vw, 119px);
  border-radius: clamp(5px, 0.8vw, 8px);
  position: relative;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  background: var(--card-white);
  overflow: hidden;
  flex-shrink: 0;
  transform-style: preserve-3d;
  will-change: transform;
}

/* 卡牌基础 - 纸张纹理 */
.game-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: 
    /* 纸张纹理 */
    repeating-linear-gradient(
      45deg,
      transparent 0px,
      rgba(0, 0, 0, 0.015) 1px,
      transparent 2px,
      transparent 4px
    ),
    /* 边缘阴影 */
    radial-gradient(ellipse at 30% 20%, rgba(255, 255, 255, 0.5) 0%, transparent 50%),
    /* 基础颜色 */
    linear-gradient(145deg, #faf6ec 0%, #e8e0cc 100%);
  border-radius: inherit;
  z-index: 0;
}

/* 卡牌光泽 Shader - 随鼠标移动 */
.card-shine {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  z-index: 2;
  pointer-events: none;
  background: radial-gradient(
    ellipse at var(--mx, 50%) var(--my, 50%),
    rgba(255, 255, 255, 0.4) 0%,
    rgba(255, 255, 255, 0.1) 20%,
    transparent 50%
  );
  opacity: 0;
  transition: opacity 0.2s;
}

.game-card:hover .card-shine {
  opacity: 1;
}

/* 全息箔面效果 */
.card-holo {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(
    115deg,
    transparent 20%,
    rgba(255, 0, 128, 0.1) 30%,
    rgba(0, 255, 255, 0.1) 40%,
    rgba(255, 255, 0, 0.1) 50%,
    rgba(0, 255, 128, 0.1) 60%,
    transparent 70%
  );
  background-size: 300% 300%;
  opacity: 0;
  transition: opacity 0.3s;
  mix-blend-mode: color-dodge;
  animation: holo-shift 3s linear infinite;
}

.game-card:hover .card-holo,
.game-card.selected .card-holo {
  opacity: 0.6;
}

@keyframes holo-shift {
  0% { background-position: 0% 0%; }
  100% { background-position: 300% 300%; }
}

/* 卡牌边框 */
.card-border {
  position: absolute;
  inset: 2px;
  border-radius: calc(clamp(5px, 0.8vw, 8px) - 2px);
  border: 1px solid rgba(0, 0, 0, 0.1);
  z-index: 3;
  pointer-events: none;
}

.game-card.selected .card-border {
  border-color: var(--gold);
  box-shadow: inset 0 0 15px rgba(240, 192, 64, 0.3);
}

/* 选中光环 */
.game-card.selected::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: clamp(8px, 1.2vw, 12px);
  background: linear-gradient(135deg, var(--gold), var(--mult-red), var(--chips-blue), var(--gold));
  background-size: 400% 400%;
  z-index: -1;
  animation: selected-glow 2s linear infinite;
}

@keyframes selected-glow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.game-card.red { color: var(--red-card); }
.game-card.black { color: var(--black-card); }

.card-corner {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1;
  z-index: 5;
  font-weight: bold;
}

.card-corner.tl { top: 5px; left: 6px; }
.card-corner.br { bottom: 5px; right: 6px; transform: rotate(180deg); }

.card-rank {
  font-size: clamp(11px, 2vw, 15px);
}

.card-suit-sm {
  font-size: clamp(10px, 1.8vw, 13px);
}

.card-center-suit {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: clamp(22px, 4.5vw, 34px);
  z-index: 4;
  opacity: 0.9;
}

/* 卡牌状态 */
.game-card {
  transform-origin: bottom center;
}

.game-card.wobble {
  animation: card-idle 4s ease-in-out infinite;
  animation-delay: var(--wobble-delay, 0s);
}

@keyframes card-idle {
  0%, 100% { transform: translateY(0) rotate(-0.5deg); }
  25% { transform: translateY(-2px) rotate(0.3deg); }
  50% { transform: translateY(-1px) rotate(0.5deg); }
  75% { transform: translateY(-2px) rotate(-0.3deg); }
}

.game-card:hover {
  transform: translateY(-15px) scale(1.1);
  z-index: 20;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
}

.game-card.selected {
  transform: translateY(-28px) scale(1.15);
  z-index: 30;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
}

/* 发牌动画 */
.game-card.deal-anim {
  animation: deal-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
}

@keyframes deal-in {
  0% { 
    transform: translateY(-120%) rotate(-25deg) scale(0.3); 
    opacity: 0; 
  }
  60% { 
    transform: translateY(10px) rotate(5deg) scale(1.05); 
    opacity: 1;
  }
  80% { 
    transform: translateY(-5px) rotate(-2deg) scale(0.98); 
  }
  100% { 
    transform: translateY(0) rotate(var(--rot, 0deg)) scale(1); 
    opacity: 1; 
  }
}

/* 弃牌动画 */
.game-card.discard-anim {
  animation: discard-out 0.4s ease-in forwards;
}

@keyframes discard-out {
  0% { transform: translateY(0) scale(1) rotate(0); opacity: 1; }
  100% { transform: translateY(200%) rotate(20deg) scale(0.4); opacity: 0; }
}

/* 计分卡牌动画 */
.game-card.score-anim {
  animation: score-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
}

@keyframes score-in {
  0% { 
    transform: translateY(100px) scale(0.6) rotate(-10deg); 
    opacity: 0; 
  }
  60% { 
    transform: translateY(-12px) scale(1.08) rotate(3deg); 
    opacity: 1;
  }
  100% { 
    transform: translateY(0) scale(1) rotate(0); 
    opacity: 1; 
  }
}

.game-card.scored {
  animation: card-score-pulse 0.3s ease-out;
}

@keyframes card-score-pulse {
  0% { box-shadow: 0 0 0 var(--chips-blue); }
  50% { box-shadow: 0 0 40px var(--chips-blue), 0 0 60px var(--chips-blue); filter: brightness(1.3); }

}

.action-btn {

  border-radius: 10px;

}

.action-btn:active:not(:disabled) {

}

.btn-play:active:not(:disabled) {
  box-shadow: 0 2px 0 #004c80, 0 4px 10px rgba(0, 157, 255, 0.3);
}

.btn-discard:active:not(:disabled) {
  box-shadow: 0 2px 0 #8b2c27, 0 4px 10px rgba(254, 95, 85, 0.3);
}

.action-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  filter: grayscale(0.5);
  transform: none !important;
}

.btn-badge {
  position: absolute;
  top: -8px;
  right: -8px;

  justify-content: center;

.deck-counter {

  bottom: 16px;
  left: 16px;
  font-size: clamp(8px, 1.2vw, 10px);
  color: #444;

/* ==================== 结算遮罩 ==================== */
.result-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.9);
  backdrop-filter: blur(10px);
  display: flex;
  flex-direction: column;
  align-items: center;

  z-index: 500;
  opacity: 0;
  pointer-events: none;

}

.result-overlay.show {

  pointer-events: all;
}

.result-overlay.show .result-content {
  animation: result-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes result-pop {

// ==================== 音频系统 ====================
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playSound(freq, dur, type = 'square', vol = 0.08) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

  lose: () => { [400, 350, 280, 200].forEach((f, i) => setTimeout(() => playSound(f, 0.25, 'sawtooth', 0.07), i * 150)); },

// ==================== 工具函数 ====================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function makeDeck() {
  const d = [];
  let id = 0;
  for (const s of SUITS) for (const r of RANKS) {
    d.push({ id: id++, suit: s, rank: r, val: RANK_VALUE[r], sel: false, bonus: 0, m: 1 });
  }
  return shuffle(d);
}

function randomJokers(n) {
  return shuffle([...JOKER_DATA]).slice(0, n).map(j => ({ ...j, iid: Math.random() }));
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ==================== 牌型检测 ====================
function evalHand(cards) {
  if (!cards.length) return null;
  const sorted = [...cards].sort((a, b) => RANK_VALUE[b.rank] - RANK_VALUE[a.rank]);
  const ranks = sorted.map(c => c.rank);
  const suits = sorted.map(c => c.suit);
  const rc = {};
  ranks.forEach(r => rc[r] = (rc[r] || 0) + 1);
  const counts = Object.values(rc).sort((a, b) => b - a);
  
  const isFlush = cards.length >= 5 && suits.every(s => s === suits[0]);
  const rn = sorted.map(c => RANKS.indexOf(c.rank));
  const un = [...new Set(rn)].sort((a, b) => a - b);
  let isStraight = false;
  if (un.length === 5) {
    if (un[4] - un[0] === 4) isStraight = true;
    if (un.join(',') === '0,1,2,3,12') isStraight = true;
  }
  const isRoyal = isStraight && isFlush && sorted[0].rank === 'A' && sorted[1].rank === 'K';
  
  let type, scoring;
  if (isRoyal) { type = 'Royal Flush'; scoring = sorted; }
  else if (isStraight && isFlush) { type = 'Straight Flush'; scoring = sorted; }
  else if (counts[0] === 4) {
    type = 'Four of a Kind';
    const r4 = Object.keys(rc).find(r => rc[r] === 4);
    scoring = sorted.filter(c => c.rank === r4);
  }
  else if (counts[0] === 3 && counts[1] === 2) { type = 'Full House'; scoring = sorted; }
  else if (isFlush) { type = 'Flush'; scoring = sorted; }
  else if (isStraight) { type = 'Straight'; scoring = sorted; }
  else if (counts[0] === 3) {
    type = 'Three of a Kind';
    const r3 = Object.keys(rc).find(r => rc[r] === 3);
    scoring = sorted.filter(c => c.rank === r3);
  }
  else if (counts[0] === 2 && counts[1] === 2) {
    type = 'Two Pair';
    const ps = Object.keys(rc).filter(r => rc[r] === 2);
    scoring = sorted.filter(c => ps.includes(c.rank));
  }
  else if (counts[0] === 2) {
    type = 'Pair';
    const p = Object.keys(rc).find(r => rc[r] === 2);
    scoring = sorted.filter(c => c.rank === p);
  }
  else { type = 'High Card'; scoring = [sorted[0]]; }
  
  const hd = HAND_DATA[type];
  const lv = G.handLevels[type] || 0;
  return {
    type, cn: HAND_CN[type], color: HAND_COLOR[type],
    scoring, cards: sorted,
    chips: hd.chips + lv * hd.cpl,
    mult: hd.mult + lv * hd.mpl
  };
}

function updatePreview() {
  const sel = G.hand.filter(c => c.sel);
  const el = document.getElementById('handPreview');
  if (sel.length < 1) { el.className = 'hand-preview'; el.textContent = ''; return; }
  const res = evalHand(sel);
  if (res) {
    el.textContent = res.cn;
    el.style.color = res.color;
    el.className = 'hand-preview show';
  }
}

// ==================== DOM更新 ====================
function $(id) { return document.getElementById(id); }

function renderCardHTML(card, idx, total, inHand) {
  const delay = inHand ? idx * 0.07 : 0;
  const rot = inHand ? (idx - (total - 1) / 2) * 2.5 : (Math.random() - 0.5) * 5;
  const ty = inHand ? Math.abs(idx - (total - 1) / 2) * 3 : 0;
  const wDelay = inHand ? `${idx * 0.25}s` : '0s';
  const selCls = card.sel ? 'selected' : '';
  const colorCls = SUIT_COLOR[card.suit];
  const animCls = inHand ? 'deal-anim' : 'score-anim';
  const idleCls = inHand && !card.sel ? 'wobble' : '';
  
  return `
    <div class="game-card ${colorCls} ${selCls} ${idleCls} ${animCls}"
         data-cid="${card.id}"
         style="--wobble-delay: ${wDelay}; --rot: ${rot}deg; animation-delay: ${delay}s; transform: rotate(${rot}deg) translateY(${ty}px);"
         ontouchstart="handleCardTouch(event, ${card.id})"
         onmousedown="handleCardDown(event, ${card.id})"
         onmousemove="handleCardMove(event, this)"
         onmouseleave="resetCardTilt(this)"
         onmouseenter="showCardTT(event, '${card.rank}${card.suit}', ${card.val}, ${card.bonus}, ${card.m})"
         onmouseleave="hideTT(); resetCardTilt(this)">
      <div class="card-shine" id="shine-${card.id}"></div>
      <div class="card-holo"></div>
      <div class="card-border"></div>
      <div class="card-corner tl">
        <div class="card-rank">${card.rank}</div>
        <div class="card-suit-sm">${card.suit}</div>
      </div>
      <div class="card-center-suit">${card.suit}</div>
      <div class="card-corner br">
        <div class="card-rank">${card.rank}</div>
        <div class="card-suit-sm">${card.suit}</div>
      </div>
    </div>
  `;
}

function renderJokerHTML(joker, idx) {
  return `
    <div class="joker-card" data-jid="${joker.iid}"
         style="animation-delay: ${idx * 0.08}s;"
         onmouseenter="showJokerTT(event, '${joker.name}', '${joker.desc}', '${joker.rarity}')"
         onmouseleave="hideTT()">
      <div class="joker-emoji">${joker.emoji}</div>
      <div class="joker-name">${joker.name}</div>
    </div>
  `;
}

function render() {
  $('handContainer').innerHTML = G.hand.map((c, i) => renderCardHTML(c, i, G.hand.length, true)).join('');
  $('jokersContainer').innerHTML = G.jokers.map((j, i) => renderJokerHTML(j, i)).join('');
  updateUI();
  updatePreview();
}

function updateUI() {
  $('uiScore').textContent = Math.floor(G.roundScore);
  $('uiTarget').textContent = G.target;
  $('uiAnte').textContent = G.ante;
  $('uiMoney').textContent = G.money;
  $('uiBlindName').textContent = BLINDS[G.blindIdx].name;
  $('deckCounter').textContent = `牌堆: ${G.deck.length}`;
  
  const selCount = G.hand.filter(c => c.sel).length;
  $('btnPlay').disabled = selCount < 1 || selCount > 5 || G.plays <= 0 || G.playing;
  $('btnDiscard').disabled = selCount < 1 || G.discards <= 0 || G.playing;
  $('playsLeft').textContent = G.plays;
  $('discardsLeft').textContent = G.discards;
  
  const pct = Math.min(100, (G.roundScore / G.target) * 100);
  $('uiBlindFill').style.width = `${pct}%`;
}

function bump(el) {
  el.classList.add('score-bump');
  setTimeout(() => el.classList.remove('score-bump'), 200);
}

function animateNum(el, to) {
  const from = parseInt(el.textContent) || 0;
  if (from === to) return;
  const dur = 400;
  const start = performance.now();
  const diff = to - from;
  function step(t) {
    const p = Math.min(1, (t - start) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.floor(from + diff * e);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// ==================== 卡牌交互 ====================
function handleCardDown(e, cid) {
  e.preventDefault();
  toggleCard(cid);
}

function handleCardTouch(e, cid) {
  e.preventDefault();
  toggleCard(cid);
}

function handleCardMove(e, el) {
  const rect = el.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * 100;
  const y = ((e.clientY - rect.top) / rect.height) * 100;
  const cx = 50 - (x - 50) * 0.15;
  const cy = 50 - (y - 50) * 0.15;
  el.style.setProperty('--mx', `${x}%`);
  el.style.setProperty('--my', `${y}%`);
  if (!el.classList.contains('selected')) {
    const rx = ((y - 50) / 50) * -8;
    const ry = ((x - 50) / 50) * 8;
    el.style.transform = `perspective(600px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-15px) scale(1.1)`;
  }
}

function resetCardTilt(el) {
  if (!el.classList.contains('selected')) {
    el.style.transform = '';
  }
}

function toggleCard(cid) {
  if (G.playing) return;
  const c = G.hand.find(x => x.id === cid);
  if (!c) return;
  const selN = G.hand.filter(x => x.sel).length;
  if (!c.sel && selN >= 5) return;
  c.sel = !c.sel;
  c.sel ? SFX.select() : SFX.deselect();
  render();
}

// ==================== Tooltip ====================
function showCardTT(e, name, val, bonus, mult) {
  const tt = $('tooltip');
  let eff = '';
  if (bonus > 0) eff += `<div class="tt-effect">+${bonus} 筹码</div>`;
  if (mult > 1) eff += `<div class="tt-effect">×${mult} 倍率</div>`;
  tt.innerHTML = `<div class="tt-title">${name}</div><div class="tt-desc">基础筹码: ${val}</div>${eff}`;
  posTT(e);
  tt.classList.add('visible');
}

function showJokerTT(e, name, desc, rarity) {
  const tt = $('tooltip');
  tt.innerHTML = `<div class="tt-title">${name}</div><div class="tt-desc">${desc}</div><div class="tt-rarity" style="color:${RARITY_COLOR[rarity]}">[${rarity}]</div>`;
  posTT(e);
  tt.classList.add('visible');
}

function posTT(e) {
  const tt = $('tooltip');
  let x = e.clientX + 15, y = e.clientY + 15;
  if (x + 240 > window.innerWidth) x = e.clientX - 240;
  if (y + 120 > window.innerHeight) y = e.clientY - 120;
  tt.style.left = x + 'px';
  tt.style.top = y + 'px';
}

function hideTT() { $('tooltip').classList.remove('visible'); }

// ==================== 粒子系统 ====================
function spawnParticles(x, y, type, count) {
  const area = $('playArea');
  const cls = { chips: 'particle-chip', mult: 'particle-mult', gold: 'particle-gold' }[type];
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = `particle ${cls}`;
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    const ang = (Math.PI * 2 * i) / count + Math.random() * 0.6;
    const dist = 40 + Math.random() * 80;
    p.style.setProperty('--tx', `${Math.cos(ang) * dist}px`);
    p.style.setProperty('--ty', `${Math.sin(ang) * dist}px`);
    p.style.animation = `particle-fly 0.9s ease-out forwards`;
    area.appendChild(p);
    setTimeout(() => p.remove(), 900);
  }
}

const particleStyle = document.createElement('style');
particleStyle.textContent = `
  @keyframes particle-fly {
    0% { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
  }
`;
document.head.appendChild(particleStyle);

function spawnScorePop(x, y, text, color) {
  const area = $('playArea');
  const el = document.createElement('div');
  el.className = 'score-pop';
  el.textContent = text;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.color = color;
  area.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function shake(score) {
  const c = document.querySelector('.game-root');
  let cls = 'shake-sm';
  if (score > 8000) cls = 'shake-xl';
  else if (score > 2500) cls = 'shake-lg';
  else if (score > 600) cls = 'shake-md';
  c.classList.add(cls);
  setTimeout(() => c.classList.remove(cls), 700);
}

function flash() {
  const f = $('screenFlash');
  f.classList.add('flash');
  setTimeout(() => f.classList.remove('flash'), 400);
}

// ==================== 游戏逻辑 ====================
function startGame() {
  initAudio();
  SFX.button();
  doTransition(() => {
    newGame();
    initRound();
    $('startScene').classList.remove('active');
    $('gameScene').classList.add('active');
  });
}

function doTransition(callback) {
  const t = $('sceneTransition');
  t.classList.add('animate-in');
  setTimeout(() => {
    callback();
    setTimeout(() => t.classList.remove('animate-in'), 400);
  }, 400);
}

function initRound() {
  G.deck = makeDeck();
  G.hand = [];
  G.roundScore = 0;
  G.plays = 4;
  G.discards = 3;
  G.playing = false;
  
  const blind = BLINDS[G.blindIdx];
  G.target = Math.floor(300 * Math.pow(1.65, G.ante - 1) * blind.m);
  
  if (!G.jokers.length) G.jokers = randomJokers(2);
  Object.keys(HAND_DATA).forEach(k => { if (!G.handLevels[k]) G.handLevels[k] = 0; });
  
  drawCards(8);
  $('uiChips').textContent = '0';
  $('uiMult').textContent = '0';
  $('scoringCards').innerHTML = '';
  $('handTypeLabel').classList.remove('show');
  $('scoringDetail').classList.remove('show');
  hideResult();
  render();
}

function drawCards(n) {
  for (let i = 0; i < n; i++) {
    if (!G.deck.length) G.deck = makeDeck();
    if (G.hand.length < 8) {
      const c = G.deck.pop();
      c.sel = false;
      G.hand.push(c);
      setTimeout(() => SFX.deal(), i * 70);
    }
  }
}

async function playHand() {
  const selected = G.hand.filter(c => c.sel);
  if (selected.length < 1 || selected.length > 5 || G.plays <= 0 || G.playing) return;
  
  G.playing = true;
  G.plays--;
  SFX.button();
  updateUI();
  
  const scoreEl = $('scoringCards');
  G.hand = G.hand.filter(c => !c.sel);
  scoreEl.innerHTML = selected.map((c, i) => renderCardHTML(c, i, selected.length, false)).join('');
  
  const res = evalHand(selected);
  const typeLbl = $('handTypeLabel');
  typeLbl.textContent = res.cn;
  typeLbl.style.color = res.color;
  typeLbl.classList.add('show');
  
  const det = $('scoringDetail');
  const detC = $('detailChips');
  const detM = $('detailMult');
  detC.textContent = res.chips;
  detM.textContent = res.mult;
  det.classList.add('show');
  
  await sleep(550);
  
  let chips = res.chips;
  let mult = res.mult;
  
  for (let i = 0; i < res.scoring.length; i++) {
    const c = res.scoring[i];
    const el = document.querySelector(`.scoring-cards-container .game-card[data-cid="${c.id}"]`);
    if (el) {
      el.classList.add('scored');
      const r = el.getBoundingClientRect();
      const pr = $('playArea').getBoundingClientRect();
      spawnParticles(r.left - pr.left + r.width/2, r.top - pr.top + r.height/2, 'chips', 8);
    }
    chips += c.val + c.bonus;
    mult *= c.m;
    detC.textContent = Math.floor(chips);
    detM.textContent = mult.toFixed(1);
    bump(detC);
    SFX.chip();
    await sleep(160);
  }
  
  for (let i = 0; i < G.jokers.length; i++) {
    const j = G.jokers[i];
    const jel = document.querySelector(`.joker-card[data-jid="${j.iid}"]`);
    if (jel) {
      jel.classList.add('activating');
      SFX.joker();
      
      const eff = j.fn(res.type, selected);
      if (eff) {
        const r = jel.getBoundingClientRect();
        const pr = $('playArea').getBoundingClientRect();
        const pop = document.createElement('div');
        pop.className = 'joker-popup';
        if (eff.chips) {
          pop.textContent = `+${eff.chips}`;
          pop.style.color = 'var(--chips-blue)';
          pop.style.textShadow = '0 0 10px var(--chips-blue)';
          spawnParticles(r.left - pr.left + r.width/2, r.top - pr.top, 'chips', 10);
          chips += eff.chips;
          SFX.chip();
          bump(detC);
        }
        if (eff.mult) {
          pop.textContent = `+${eff.mult}`;
          pop.style.color = 'var(--mult-red)';
          pop.style.textShadow = '0 0 10px var(--mult-red)';
          spawnParticles(r.left - pr.left + r.width/2, r.top - pr.top, 'mult', 10);
          mult += eff.mult;
          SFX.mult();
          bump(detM);
        }
        jel.appendChild(pop);
        detC.textContent = Math.floor(chips);
        detM.textContent = mult.toFixed(1);
        setTimeout(() => pop.remove(), 900);
      }
      await sleep(320);
      jel.classList.remove('activating');
    }
  }
  
  const handScore = Math.floor(chips * mult);
  
  animateNum($('uiChips'), Math.floor(chips));
  animateNum($('uiMult'), Math.floor(mult));
  bump($('uiChips'));
  await sleep(150);
  bump($('uiMult'));
  
  const sr = scoreEl.getBoundingClientRect();
  const pr = $('playArea').getBoundingClientRect();
  spawnParticles(sr.left - pr.left + sr.width/2, sr.top - pr.top + sr.height/2, 'gold', 20);
  
  shake(handScore);
  if (handScore > 1500) flash();
  if (handScore > 1000) SFX.bigScore();
  
  const oldScore = G.roundScore;
  G.roundScore += handScore;
  animateNum($('uiScore'), Math.floor(G.roundScore));
  bump($('uiScore'));
  
  spawnScorePop(
    sr.left - pr.left + sr.width/2 - 20,
    sr.top - pr.top - 20,
    `+${handScore}`,
    '#f0c040'
  );
  
  await sleep(650);
  
  scoreEl.innerHTML = '';
  typeLbl.classList.remove('show');
  det.classList.remove('show');
  
  if (G.roundScore >= G.target) {
    await sleep(400);
    showResult(true);
    return;
  }
  
  drawCards(selected.length);
  render();
  
  G.playing = false;
  updateUI();
  
  if (G.plays <= 0) {
    await sleep(500);
    if (G.roundScore < G.target) showResult(false);
  }
}

async function discardCards() {
  const selected = G.hand.filter(c => c.sel);
  if (selected.length < 1 || G.discards <= 0 || G.playing) return;
  
  G.playing = true;
  G.discards--;
  SFX.button();
  
  selected.forEach((c, i) => {
    const el = document.querySelector(`.hand-cards-row .game-card[data-cid="${c.id}"]`);
    if (el) {
      el.classList.remove('deal-anim', 'wobble');
      el.classList.add('discard-anim');
      el.style.animationDelay = `${i * 0.04}s`;
    }
  });
  
  await sleep(450);
  
  G.hand = G.hand.filter(c => !c.sel);
  drawCards(selected.length);
  render();
  
  G.playing = false;
  updateUI();
}

function showResult(won) {
  const ov = $('resultOverlay');
  const title = $('resultTitle');
  const score = $('resultScore');
  const reward = $('resultReward');
  const btn = $('resultBtn');
  
  if (won) {
    ov.className = 'result-overlay show';
    title.className = 'result-title win';
    title.textContent = '胜 利！';
    const rw = 3 + G.blindIdx * 2;
    score.textContent = `得分: ${Math.floor(G.roundScore)} / ${G.target}`;
    reward.textContent = `获得 $${rw}`;
    G.money += rw;
    
    const keys = Object.keys(HAND_DATA).slice(0, 8);
    G.handLevels[keys[Math.floor(Math.random() * keys.length)]]++;
    
    btn.textContent = G.blindIdx >= 2 ? '下一底注' : '下一个盲注';
    btn.onclick = nextRound;
    SFX.win();
  } else {
    ov.className = 'result-overlay show';
    title.className = 'result-title lose';
    title.textContent = '失 败';
    score.textContent = `得分: ${Math.floor(G.roundScore)} / ${G.target}`;
    reward.textContent = '';
    btn.textContent = '重新开始';
    btn.onclick = restartGame;
    SFX.lose();
  }
}

function hideResult() {
  $('resultOverlay').className = 'result-overlay';
}

function nextRound() {
  SFX.button();
  doTransition(() => {
    G.blindIdx++;
    if (G.blindIdx >= 3) {
      G.blindIdx = 0;
      G.ante++;
      if (G.jokers.length < 5) {
        const avail = JOKER_DATA.filter(j => !G.jokers.some(gj => gj.id === j.id));
        if (avail.length) G.jokers.push({ ...avail[Math.floor(Math.random() * avail.length)], iid: Math.random() });
      }
    }
    initRound();
  });
}

function restartGame() {
  SFX.button();
  doTransition(() => {
    newGame();
    initRound();
  });
}

// ==================== 事件绑定 ====================
document.addEventListener('DOMContentLoaded', () => {
  $('startBtn').addEventListener('click', startGame);
  $('btnPlay').addEventListener('click', playHand);
  $('btnDiscard').addEventListener('click', discardCards);
  
  // 小丑牌鼠标视差
  document.addEventListener('mousemove', (e) => {
    if (G && G.playing) return;
    document.querySelectorAll('.joker-card:not(.activating)').forEach((jel, i) => {
      const r = jel.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const dx = (e.clientX - cx) / 60;
      const dy = (e.clientY - cy) / 60;
      const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
      if (dist < 250) {
        jel.style.transform = `translate(${dx * (i % 2 ? -1 : 1)}px, ${dy}px) scale(1.02)`;
      } else {
        jel.style.transform = '';
      }
    });
  });
});
</script>
