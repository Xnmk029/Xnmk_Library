/* ===== styles/main.css ===== */
/* Layout, HUD and screens. Colours mirror Balatro's G.C palette.
   The @font-face lives in fonts.css, which is loaded first. */

:root {
  --mult: #fe5f55;
  --chips: #009dff;
  --money: #f3b958;
  --attention: #ff9a00;
  --green: #4bc292;
  --purple: #8867a5;
  --gold: #eac058;
  --black: #374244;
  --l-black: #4f6367;
  --grey: #5f7377;
  --inactive: #7c8b90;
  --panel: #374244;
  --panel-dark: #2b3438;
  --panel-light: #4f6367;
  --white: #ffffff;

  --card-w: 84px;
  --card-h: 113px;

  --radius: 9px;
  --radius-sm: 6px;
  --font: 'Pixelify', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #0d1416;
  font-family: var(--font);
  color: #fff;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: manipulation;
}

#bg-canvas,
#particle-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
#bg-canvas {
  z-index: 0;
  /* The shader renders at half resolution; nearest-neighbour upscaling keeps
     the chunky pixel edges instead of blurring them away. */
  image-rendering: pixelated;
}
#particle-canvas { z-index: 40; pointer-events: none; }

#stage {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  pointer-events: none;
}

#playfield {
  position: relative;
  width: 1280px;
  height: 720px;
  transform-origin: center center;
  pointer-events: auto;
  /* Perspective makes the card hover-tilt read as real 3D. */
  perspective: 1400px;
  perspective-origin: 50% 45%;
}

/* Scrim that pulls the shader background down behind the UI, so cards and
   text keep their contrast no matter what the swirl is doing. */
#playfield::before {
  content: '';
  position: absolute;
  inset: -80px;
  background: radial-gradient(ellipse 62% 58% at 50% 46%,
    rgba(6, 12, 14, 0.30) 0%,
    rgba(6, 12, 14, 0.62) 58%,
    rgba(5, 10, 12, 0.85) 100%);
  pointer-events: none;
  z-index: 0;
}
#sidebar, #main-area { z-index: 1; }

/* ------------------------------------------------------------- primitives */

.panel {
  background: var(--panel);
  border-radius: var(--radius);
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.32), inset 0 2px 0 rgba(255, 255, 255, 0.06);
}

.btn {
  font-family: var(--font);
  font-weight: 700;
  color: #fff;
  border: 0;
  border-radius: var(--radius);
  padding: 10px 16px;
  font-size: 19px;
  cursor: pointer;
  background: var(--l-black);
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
  transition: transform 90ms cubic-bezier(.2,.9,.3,1.4), box-shadow 90ms, filter 120ms;
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.28);
  line-height: 1.1;
}
.btn:hover:not(:disabled) { transform: translateY(-2px) scale(1.035); filter: brightness(1.12); }
.btn:active:not(:disabled) { transform: translateY(2px) scale(0.98); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.btn:disabled { filter: saturate(.25) brightness(.62); cursor: default; }
.btn-blue { background: var(--chips); }
.btn-red { background: var(--mult); }
.btn-orange { background: var(--attention); }
.btn-green { background: var(--green); }
.btn-gold { background: var(--money); color: #3a2c07; text-shadow: none; }
.btn-slate { background: var(--l-black); }
.btn-purple { background: var(--purple); }
.btn-small { padding: 7px 12px; font-size: 15px; }
.btn-tiny { padding: 4px 10px; font-size: 13px; border-radius: var(--radius-sm); box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.btn-wide { width: 100%; }

.chip-icon {
  display: inline-block;
  width: 15px; height: 15px;
  border-radius: 50%;
  background: var(--chips);
  box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.85), 0 2px 0 rgba(0,0,0,.3);
  vertical-align: -2px;
  margin-right: 5px;
}
.chip-icon.big { width: 20px; height: 20px; }

/* --------------------------------------------------------------- sidebar */

#sidebar {
  position: absolute;
  left: 0; top: 0;
  width: 268px; height: 720px;
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  background: rgba(21, 30, 33, 0.55);
  border-right: 3px solid rgba(0, 0, 0, 0.3);
}

.blind-panel { padding: 8px; background: var(--panel-dark); }
.blind-panel-head { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
.blind-chip {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--l-black);
  display: grid; place-items: center;
  font-size: 22px;
  box-shadow: inset 0 0 0 4px rgba(0, 0, 0, 0.22), 0 3px 0 rgba(0,0,0,.3);
  flex: none;
  transition: background-color 400ms;
}
.blind-name { font-size: 19px; font-weight: 700; line-height: 1.05; }
.blind-panel-body { background: rgba(0,0,0,.22); border-radius: var(--radius-sm); padding: 7px 8px; text-align: center; }
.blind-goal-label { font-size: 13px; color: #b9c6ca; }
.blind-goal { font-size: 26px; font-weight: 700; color: var(--mult); line-height: 1.15; }
.blind-reward { font-size: 13px; color: #b9c6ca; margin-top: 2px; }
.blind-reward span { color: var(--money); letter-spacing: 1px; }
.blind-desc { font-size: 12px; color: #d8e2e5; margin-top: 4px; line-height: 1.25; }

.score-panel {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 12px;
  background: var(--panel-dark);
}
.score-label { font-size: 15px; color: #cfd9dc; line-height: 1; text-align: right; flex: none; }
.score-value-wrap {
  flex: 1;
  background: rgba(0,0,0,.3);
  border-radius: var(--radius-sm);
  padding: 5px 8px;
  text-align: center;
  display: flex; align-items: center; justify-content: center; gap: 4px;
  min-height: 40px;
}
.score-value { font-size: 30px; font-weight: 700; line-height: 1; }

.hand-panel { padding: 8px; background: var(--panel-dark); }
.hand-name-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 6px; min-height: 24px; }
.hand-name { font-size: 19px; font-weight: 700; }
.hand-level {
  font-size: 13px; padding: 1px 7px; border-radius: 4px;
  background: var(--chips); color: #fff;
}
.hand-level:empty { display: none; }

.calc-row { display: flex; align-items: stretch; gap: 5px; }
.calc-chips, .calc-mult {
  flex: 1;
  border-radius: var(--radius-sm);
  padding: 6px 4px;
  font-size: 27px; font-weight: 700;
  text-align: center;
  line-height: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.calc-chips { background: var(--chips); text-align: right; padding-right: 9px; }
.calc-mult { background: var(--mult); text-align: left; padding-left: 9px; }
.calc-x { font-size: 20px; color: var(--mult); align-self: center; font-weight: 700; }

.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}
.stat { padding: 5px 6px; text-align: center; background: var(--panel-dark); }
.stat-label { font-size: 12px; color: #c3cfd3; line-height: 1; }
.stat-value { font-size: 24px; font-weight: 700; line-height: 1.1; }
.stat-value.blue { color: var(--chips); }
.stat-value.red { color: var(--mult); }
.stat-value.orange { color: var(--attention); }
.stat-value.money { color: var(--money); font-size: 27px; }
.stat-money { grid-column: 1 / -1; padding: 6px; }
.stat-sub { font-size: 14px; color: #9fadb2; margin-left: 3px; }

.sidebar-buttons { display: flex; gap: 7px; margin-top: auto; }
.sidebar-buttons .btn { flex: 1; }

/* ------------------------------------------------------------- main area */

#main-area { position: absolute; left: 268px; top: 0; width: 1012px; height: 720px; }

.slot-row {
  position: absolute;
  left: 22px; top: 14px;
  right: 22px;
  height: 132px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.slot-area {
  position: relative;
  height: 128px;
  border-radius: var(--radius);
  border: 2px dashed rgba(255, 255, 255, 0.16);
  background: rgba(0, 0, 0, 0.16);
}
#joker-area { width: 486px; }
#consumable-area { width: 200px; }
.slot-count {
  position: absolute;
  right: 6px; bottom: -4px;
  font-size: 13px;
  color: #cbd6da;
  background: rgba(0,0,0,.45);
  border-radius: 4px;
  padding: 0 5px;
}

#table-area { position: absolute; left: 0; top: 150px; width: 1012px; height: 330px; }
#screen-host { position: absolute; inset: 0; }

#hand-region { position: absolute; left: 0; bottom: 0; width: 1012px; height: 232px; }
.hand-label {
  position: absolute; left: 0; right: 0; top: 6px;
  text-align: center; font-size: 13px; color: #cdd8db;
}

#action-bar {
  position: absolute;
  left: 50%; bottom: 12px;
  transform: translateX(-50%);
  display: flex; align-items: center; gap: 14px;
  transition: opacity 240ms ease, transform 280ms cubic-bezier(.2,.9,.3,1.3);
}
/* The play controls only belong on the table while a blind is in progress. */
#playfield:not([data-phase='playing']) #action-bar,
#playfield:not([data-phase='playing']) .hand-label {
  opacity: 0;
  pointer-events: none;
  transform: translateX(-50%) translateY(26px);
}
#playfield:not([data-phase='playing']) .hand-label { transform: translateY(10px); }
.hand-label { transition: opacity 240ms ease, transform 280ms ease; }

/* The blind readout only matters once a blind is live. */
#playfield[data-phase='shop'] .score-panel,
#playfield[data-phase='shop'] .hand-panel { opacity: .45; }
.score-panel, .hand-panel { transition: opacity 300ms ease; }
.sort-group { text-align: center; }
.sort-label { font-size: 12px; color: #c3cfd3; margin-bottom: 3px; }
.sort-buttons { display: flex; gap: 5px; }
#btn-play, #btn-discard { width: 128px; }

.deck-pile {
  position: absolute;
  right: 18px; bottom: 96px;
  width: 96px; height: 124px;
  pointer-events: auto;
  cursor: pointer;
  transition: transform 160ms cubic-bezier(.2,.9,.3,1.4);
}
.deck-pile:hover { transform: translateY(-4px) scale(1.04); }

/* A stack of card backs drawn with two offset pseudo-elements plus the
   element itself, so the deck reads as a physical pile. */
.deck-pile::before,
.deck-pile::after,
.deck-pile > .deck-face {
  content: '';
  position: absolute;
  width: var(--card-w);
  height: var(--card-h);
  right: 4px;
  bottom: 6px;
  border-radius: 8px;
  background: repeating-linear-gradient(45deg, #b0333b 0 6px, #9c2b33 6px 12px);
  box-shadow: 0 0 0 2px rgba(0,0,0,.55), inset 0 0 0 4px #f2ece0, inset 0 0 0 6px #8c2029;
}
/* Explicit z-index: ::after would otherwise paint over the real children. */
.deck-pile::before { transform: translate(-5px, -5px) rotate(-2.5deg); filter: brightness(.8); z-index: 1; }
.deck-pile::after { transform: translate(-2.5px, -2.5px) rotate(-1deg); filter: brightness(.9); z-index: 2; }
.deck-pile > .deck-face { z-index: 3; }
.deck-pile > .deck-face::after {
  content: '';
  position: absolute; inset: 14px;
  border-radius: 4px;
  border: 2px solid rgba(255,255,255,.35);
  background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.22), transparent 62%);
}
.deck-count {
  position: absolute; left: 0; right: 0; bottom: -22px;
  text-align: center; font-size: 15px; color: #dfe8ea;
  text-shadow: 0 2px 0 rgba(0,0,0,.5);
  z-index: 4;
}

/* card + tag + fx layers */
#card-layer, #fx-layer, #tag-layer {
  position: absolute; inset: 0;
  pointer-events: none;
  transform-style: preserve-3d;
}
#card-layer { z-index: 20; }
#tag-layer { z-index: 18; }
#fx-layer { z-index: 30; }

/* ------------------------------------------------------------ skip tags */

.tag-chip {
  position: absolute;
  display: flex; align-items: center; gap: 4px;
  height: 30px; padding: 0 9px;
  border-radius: 15px;
  font-size: 14px; font-weight: 700;
  color: #141c1e;
  box-shadow: 0 3px 0 rgba(0,0,0,.35);
  pointer-events: auto;
  cursor: help;
  transition: transform 130ms cubic-bezier(.2,.9,.3,1.4);
}
.tag-chip:hover { transform: scale(1.12) translateY(-2px); }

/* ------------------------------------------------------------- screens */

.screen {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  gap: 14px;
}
.screen.leaving { pointer-events: none; }

/* ---- blind select ----
   Sized to stay clear of the joker row above: the whole card, including the
   raised state and the skip chip, has to fit inside #table-area. */
.blind-cards { display: flex; gap: 16px; align-items: stretch; }
.blind-card {
  width: 206px;
  background: var(--panel);
  border-radius: 12px;
  padding: 8px;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  box-shadow: 0 6px 0 rgba(0,0,0,.34);
  transition: transform 220ms cubic-bezier(.2,.9,.3,1.35), filter 220ms, box-shadow 220ms;
  position: relative;
}
.blind-card.current { transform: translateY(-10px) scale(1.04); box-shadow: 0 12px 0 rgba(0,0,0,.34); }
.blind-card.done { filter: saturate(.3) brightness(.62); }
.blind-card-title {
  width: 100%; text-align: center; font-size: 16px; font-weight: 700;
  border-radius: 7px; padding: 3px 0;
  background: rgba(0,0,0,.28);
}
.blind-card.current .blind-card-title { background: var(--attention); color: #2a1a00; }
.blind-big-chip {
  width: 74px; height: 74px; border-radius: 50%;
  display: grid; place-items: center; font-size: 34px;
  box-shadow: inset 0 0 0 6px rgba(0,0,0,.2), 0 5px 0 rgba(0,0,0,.3);
}
.blind-card.current .blind-big-chip { animation: chip-bob 2.4s ease-in-out infinite; }
.blind-card-req { font-size: 12px; color: #cdd8db; text-align: center; line-height: 1.2; }
.blind-card-req b { display: block; font-size: 22px; color: var(--mult); }
.blind-card-reward { font-size: 14px; color: var(--money); letter-spacing: 2px; line-height: 1; }
.blind-card-desc {
  font-size: 12px; color: #e2eaec; text-align: center; line-height: 1.25;
  min-height: 26px;
}
.blind-card .btn { width: 100%; padding: 7px 12px; font-size: 17px; }
/* Sits under the Select button rather than above the card, where it would
   collide with the joker row. */
.blind-skip {
  width: 100%; text-align: center;
  background: var(--panel-dark); border-radius: 7px; padding: 3px 8px;
  font-size: 12px; box-shadow: 0 3px 0 rgba(0,0,0,.35);
  cursor: pointer;
  transition: transform 130ms cubic-bezier(.2,.9,.3,1.4), filter 130ms;
}
.blind-skip:hover { transform: translateY(-2px) scale(1.04); filter: brightness(1.25); }

/* ---- shop ---- */
.shop-wrap {
  width: 950px; height: 320px;
  display: flex; gap: 12px;
  align-items: stretch;
}
.shop-side {
  width: 168px;
  display: flex; flex-direction: column; gap: 9px; justify-content: center;
}
.shop-main {
  flex: 1;
  background: rgba(20, 28, 31, 0.55);
  border-radius: 12px;
  padding: 8px 10px;
  display: flex; flex-direction: column; gap: 6px;
  border: 3px solid rgba(0,0,0,.28);
}
.shop-title {
  text-align: center; font-size: 15px; color: #cfd9dc;
  letter-spacing: 1px;
}
.shop-slots { position: relative; height: 132px; }
.shop-lower { position: relative; height: 142px; display: flex; gap: 10px; padding-bottom: 4px; }
.shop-voucher-zone, .shop-booster-zone {
  position: relative;
  border-radius: 9px;
  border: 2px dashed rgba(255,255,255,.14);
  background: rgba(0,0,0,.16);
}
.shop-voucher-zone { width: 200px; }
.shop-booster-zone { flex: 1; }
/* Sits at the bottom so it never collides with the price tag that floats
   above each card. */
.zone-label {
  position: absolute; bottom: 2px; left: 0; right: 0;
  text-align: center; font-size: 11px; color: #93a2a7; letter-spacing: 1px;
}

/* ---- cash out ---- */
.cashout {
  width: 470px;
  background: var(--panel);
  border-radius: 12px;
  padding: 14px;
  box-shadow: 0 8px 0 rgba(0,0,0,.34);
  display: flex; flex-direction: column; gap: 9px;
}
.cashout-head {
  text-align: center; font-size: 25px; font-weight: 700;
  color: var(--money);
}
.cashout-rows { display: flex; flex-direction: column; gap: 5px; max-height: 176px; overflow: hidden; }
.cashout-row {
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(0,0,0,.24); border-radius: 7px; padding: 5px 10px;
  font-size: 15px;
  animation: row-in 320ms cubic-bezier(.2,.9,.3,1.35) backwards;
}
.cashout-row .amt { color: var(--money); font-weight: 700; letter-spacing: 2px; }

/* ---- booster overlay ---- */
.pack-screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  padding-top: 6px; gap: 8px;
}
.pack-title { font-size: 23px; font-weight: 700; text-shadow: 0 3px 0 rgba(0,0,0,.4); }
.pack-sub { font-size: 14px; color: #cdd8db; }
.pack-slots { position: relative; width: 100%; height: 150px; }

/* ------------------------------------------------------------- overlays */

#overlay-layer {
  position: fixed; inset: 0; z-index: 60;
  pointer-events: none;
}
.overlay {
  position: absolute; inset: 0;
  background: rgba(6, 12, 14, 0.78);
  display: flex; align-items: center; justify-content: center;
  pointer-events: auto;
  animation: fade-in 200ms ease-out;
  backdrop-filter: blur(2px);
}
.dialog {
  background: var(--panel);
  border-radius: 14px;
  padding: 20px 22px;
  box-shadow: 0 10px 0 rgba(0,0,0,.4);
  min-width: 380px;
  max-width: 720px;
  max-height: 86vh;
  overflow-y: auto;
  animation: dialog-in 280ms cubic-bezier(.2,.9,.3,1.35);
}
.dialog h2 { margin: 0 0 12px; font-size: 27px; text-align: center; }
.dialog h3 { margin: 14px 0 7px; font-size: 18px; color: var(--attention); }
.dialog-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 7px 0; font-size: 16px; }
.dialog-actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }

.slider {
  -webkit-appearance: none; appearance: none;
  width: 180px; height: 8px; border-radius: 4px;
  background: var(--panel-dark); outline: none;
}
.slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--attention); cursor: pointer;
  box-shadow: 0 2px 0 rgba(0,0,0,.4);
}
.slider::-moz-range-thumb {
  width: 18px; height: 18px; border-radius: 50%; border: 0;
  background: var(--attention); cursor: pointer;
}

.toggle {
  width: 52px; height: 26px; border-radius: 13px;
  background: var(--panel-dark); position: relative; cursor: pointer;
  transition: background 160ms;
}
.toggle.on { background: var(--green); }
.toggle::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 20px; height: 20px; border-radius: 50%; background: #fff;
  transition: transform 180ms cubic-bezier(.2,.9,.3,1.4);
}
.toggle.on::after { transform: translateX(26px); }

/* run info tables */
.hand-table { width: 100%; border-collapse: separate; border-spacing: 0 4px; font-size: 15px; }
.hand-table td { background: rgba(0,0,0,.22); padding: 5px 9px; }
.hand-table tr td:first-child { border-radius: 6px 0 0 6px; }
.hand-table tr td:last-child { border-radius: 0 6px 6px 0; text-align: right; }
.lvl-pill { display: inline-block; min-width: 34px; text-align: center; border-radius: 4px; padding: 0 5px; font-size: 13px; color: #10171a; }

/* ----------------------------------------------------------- title menu */

.title-screen {
  display: flex; flex-direction: column; align-items: center; gap: 16px;
  text-align: center;
}
.title-logo {
  font-size: 76px; font-weight: 700; letter-spacing: 4px;
  color: var(--money);
  text-shadow: 0 6px 0 rgba(0,0,0,.45), 0 0 30px rgba(243,185,88,.35);
  animation: logo-bob 3.6s ease-in-out infinite;
}
.title-sub { font-size: 16px; color: #cdd8db; margin-top: -12px; }
.title-buttons { display: flex; flex-direction: column; gap: 10px; width: 260px; }
.title-buttons .btn { font-size: 22px; padding: 12px; }

.deck-picker { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 620px; }
.deck-option {
  width: 132px; padding: 8px; border-radius: 9px;
  background: rgba(0,0,0,.26); cursor: pointer; text-align: center;
  border: 2px solid transparent;
  transition: transform 140ms cubic-bezier(.2,.9,.3,1.4), border-color 140ms;
}
.deck-option:hover { transform: translateY(-3px) scale(1.04); }
.deck-option.sel { border-color: var(--attention); background: rgba(255,154,0,.16); }
.deck-option .d-emoji { font-size: 30px; }
.deck-option .d-name { font-size: 14px; font-weight: 700; }
.deck-option .d-text { font-size: 11px; color: #c7d2d6; line-height: 1.25; margin-top: 3px; }

.seed-input {
  font-family: var(--font); font-size: 18px; text-transform: uppercase;
  background: var(--panel-dark); border: 2px solid rgba(255,255,255,.15);
  color: #fff; border-radius: 7px; padding: 6px 10px; width: 160px; text-align: center;
  letter-spacing: 2px;
}

.noscript {
  position: fixed; inset: 0; display: grid; place-items: center;
  background: #162325; color: #fff; font-size: 22px; z-index: 999;
}

/* --------------------------------------------------------------- motion */

@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes dialog-in {
  from { opacity: 0; transform: translateY(26px) scale(.94); }
  to { opacity: 1; transform: none; }
}
@keyframes row-in {
  from { opacity: 0; transform: translateX(-22px); }
  to { opacity: 1; transform: none; }
}
@keyframes chip-bob {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-7px) rotate(2deg); }
}
@keyframes logo-bob {
  0%, 100% { transform: translateY(0) rotate(-1deg); }
  50% { transform: translateY(-9px) rotate(1deg); }
}

@media (prefers-reduced-motion: reduce) {
  .blind-card.current .blind-big-chip,
  .title-logo { animation: none; }
}


/* ===== styles/cards.css ===== */
/* Card rendering: faces, enhancements, editions, seals. */

.card {
  position: absolute;
  left: 0; top: 0;
  width: var(--card-w);
  height: var(--card-h);
  transform-origin: 50% 50%;
  will-change: transform;
  pointer-events: auto;
  cursor: pointer;
  /* Set by the JS transform sync each frame. */
  transform: translate3d(0, 0, 0);
}
.card.no-interact { pointer-events: none; }

.card-3d {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  will-change: transform;
}

.card-face {
  position: absolute;
  inset: 0;
  border-radius: 8px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: hidden;
  box-shadow:
    0 0 0 2px rgba(0, 0, 0, 0.55),
    inset 0 0 0 2px rgba(255, 255, 255, 0.55);
  background: #f4f1e8;
}

.card-shadow {
  position: absolute;
  left: 3px; top: 7px;
  width: 100%; height: 100%;
  border-radius: 9px;
  background: rgba(0, 0, 0, 0.34);
  filter: blur(2px);
  transform: translateZ(-1px);
  pointer-events: none;
}

/* ---------------------------------------------------------- playing card */

.pc-corner {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 0.9;
  font-weight: 700;
}
.pc-corner.tl { left: 4px; top: 2px; }
.pc-corner.br { right: 4px; bottom: 2px; transform: rotate(180deg); }
.pc-rank { font-size: 21px; }
.pc-suit { font-size: 15px; margin-top: -1px; }

.pc-pips {
  position: absolute;
  left: 21px; right: 21px;
  top: 8px; bottom: 8px;
}
.pip {
  position: absolute;
  transform: translate(-50%, -50%);
  font-size: 15px;
  line-height: 1;
}
.pip.flip { transform: translate(-50%, -50%) rotate(180deg); }
.pip.big { font-size: 40px; }

.pc-face-art {
  position: absolute;
  left: 15px; right: 15px; top: 15px; bottom: 15px;
  border-radius: 4px;
  border: 2px solid currentColor;
  display: grid;
  place-items: center;
  font-size: 30px;
  background: rgba(0, 0, 0, 0.05);
}
.pc-face-art .fa-letter {
  position: absolute;
  font-size: 12px;
  font-weight: 700;
  opacity: 0.75;
}
.pc-face-art .fa-letter.a { top: 1px; left: 3px; }
.pc-face-art .fa-letter.b { bottom: 1px; right: 3px; transform: rotate(180deg); }

/* ---------------------------------------------------------- enhancements */

.card-face[data-enh='bonus']  { background: linear-gradient(160deg, #cfe0f2, #9fbcd8); }
.card-face[data-enh='mult']   { background: linear-gradient(160deg, #f0b3ac, #d4675e); }
.card-face[data-enh='wild']   { background: linear-gradient(160deg, #efc9b6, #c0806f); }
.card-face[data-enh='glass']  {
  background: linear-gradient(150deg, rgba(220, 245, 255, .82), rgba(150, 205, 230, .55));
  box-shadow: 0 0 0 2px rgba(0,0,0,.4), inset 0 0 0 2px rgba(255,255,255,.85), inset 0 0 18px rgba(255,255,255,.7);
}
.card-face[data-enh='steel']  { background: linear-gradient(150deg, #d6dae0, #8d97a3 60%, #b9c1c9); }
.card-face[data-enh='gold']   { background: linear-gradient(155deg, #f7dd8a, #d7a327 65%, #f0cd68); }
.card-face[data-enh='lucky']  { background: linear-gradient(160deg, #bfe8bf, #6fae6f); }
.card-face[data-enh='stone']  {
  background:
    radial-gradient(circle at 30% 28%, rgba(255,255,255,.24), transparent 40%),
    radial-gradient(circle at 70% 70%, rgba(0,0,0,.18), transparent 45%),
    linear-gradient(150deg, #a9a49c, #77726b);
}

.enh-badge {
  position: absolute;
  left: 0; right: 0; top: 50%;
  transform: translateY(-50%);
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  color: rgba(0, 0, 0, 0.55);
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* ----------------------------------------------------------------- seals */

.card-seal {
  position: absolute;
  left: 50%; bottom: 8px;
  width: 20px; height: 20px;
  margin-left: -10px;
  border-radius: 50%;
  box-shadow: inset 0 0 0 3px rgba(0, 0, 0, 0.25), 0 1px 2px rgba(0,0,0,.35);
  display: grid; place-items: center;
  font-size: 10px; color: rgba(0,0,0,.5);
}
.card-seal[data-seal='gold'] { background: #e0b64a; }
.card-seal[data-seal='red'] { background: #fe5f55; }
.card-seal[data-seal='blue'] { background: #009dff; }
.card-seal[data-seal='purple'] { background: #8867a5; }

/* --------------------------------------------------------------- jokers */

.joker-art {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(165deg, var(--jbg, #c0392b), color-mix(in srgb, var(--jbg, #c0392b) 55%, #101418));
}
.joker-art::before {
  /* Faint pixel grid, so the flat colour reads as sprite art. */
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
  background-size: 4px 4px;
  pointer-events: none;
}
.joker-emoji {
  font-size: 40px;
  line-height: 1;
  filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.4));
  margin-bottom: 12px;
  margin-top: -6px;
}
.joker-name {
  position: absolute;
  left: 3px; right: 3px; bottom: 3px;
  background: rgba(10, 14, 16, 0.78);
  border-radius: 5px;
  font-size: 10px;
  line-height: 1.1;
  text-align: center;
  padding: 3px 2px;
  color: #f2f6f7;
  font-weight: 700;
}
.joker-rarity {
  position: absolute;
  left: 3px; right: 3px; bottom: 3px;
  height: 3px;
  border-radius: 2px;
}

.card[data-kind='joker'] .card-face { background: #2f3a40; box-shadow: 0 0 0 2px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.3); }

.sticker {
  position: absolute;
  top: 3px; left: 3px;
  font-size: 11px;
  padding: 0 3px;
  border-radius: 3px;
  font-weight: 700;
  color: #fff;
  background: #c75985;
}
.sticker.perishable { background: #4f5da3; top: 3px; left: auto; right: 3px; }
.sticker.rental { background: #b18f43; top: 18px; left: 3px; }

/* ---------------------------------------------------------- consumables */

.consumable-art {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: linear-gradient(165deg, var(--cbg, #a782d1), color-mix(in srgb, var(--cbg, #a782d1) 50%, #12161c));
}
.consumable-numeral {
  position: absolute; top: 3px; left: 0; right: 0;
  text-align: center; font-size: 11px; color: rgba(255,255,255,.85);
  letter-spacing: 1px;
}
.consumable-emoji { font-size: 36px; filter: drop-shadow(0 3px 0 rgba(0,0,0,.35)); }
.consumable-name {
  position: absolute; left: 2px; right: 2px; bottom: 3px;
  text-align: center; font-size: 10px; line-height: 1.05;
  background: rgba(10, 14, 16, .72);
  border-radius: 4px; padding: 2px 1px;
  font-weight: 700;
}

/* -------------------------------------------------------------- boosters */

.booster-art {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(165deg, var(--bbg, #646eb7), color-mix(in srgb, var(--bbg, #646eb7) 45%, #10141c));
}
.booster-emoji { font-size: 34px; }
.booster-name {
  position: absolute; left: 2px; right: 2px; bottom: 3px;
  text-align: center; font-size: 9px; line-height: 1.05;
  background: rgba(10,14,16,.72); border-radius: 4px; padding: 2px 1px; font-weight: 700;
}

/* ------------------------------------------------------------ card back */

.card-back {
  transform: rotateY(180deg);
  background:
    repeating-linear-gradient(45deg, #b0333b 0 6px, #9c2b33 6px 12px);
  box-shadow: 0 0 0 2px rgba(0,0,0,.55), inset 0 0 0 4px #f2ece0, inset 0 0 0 6px #8c2029;
}
.card-back::after {
  content: '';
  position: absolute;
  inset: 14px;
  border-radius: 4px;
  border: 2px solid rgba(255, 255, 255, 0.35);
  background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.22), transparent 62%);
}

/* --------------------------------------------------------------- states */

.card.selected .card-face { box-shadow: 0 0 0 3px var(--attention), inset 0 0 0 2px rgba(255,255,255,.55); }
.card.debuffed .card-face { filter: grayscale(1) brightness(.55); }
.card.debuffed::after {
  content: '';
  position: absolute; inset: 0;
  border-radius: 8px;
  background: repeating-linear-gradient(45deg, rgba(255,0,0,.16) 0 6px, transparent 6px 12px);
  pointer-events: none;
}
.card.disabled-joker .card-face { filter: grayscale(.85) brightness(.6); }
.card.unaffordable .card-face { filter: brightness(.62) saturate(.5); }
.card.dying { pointer-events: none; }

.card-price {
  position: absolute;
  left: 50%; top: -19px;
  transform: translateX(-50%);
  font-size: 15px; font-weight: 700;
  color: var(--money);
  text-shadow: 0 2px 0 rgba(0,0,0,.6);
  white-space: nowrap;
}
.card-price.free { color: var(--green); }

/* -------------------------------------------------------------- editions */

.edition-fx {
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: 8px;
  overflow: hidden;
}

/* Foil: cool metallic sheen that slides with the card's tilt. */
.edition-fx[data-ed='foil']::before {
  content: '';
  position: absolute; inset: -40%;
  background: linear-gradient(115deg,
    transparent 20%, rgba(180, 226, 255, .0) 34%,
    rgba(190, 235, 255, .75) 46%, rgba(255, 255, 255, .9) 50%,
    rgba(150, 210, 255, .7) 54%, rgba(180, 226, 255, 0) 66%, transparent 80%);
  mix-blend-mode: screen;
  transform: translateX(calc(var(--sheen, 0) * 46%));
  opacity: .85;
}
.edition-fx[data-ed='foil']::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(160deg, rgba(120,190,255,.22), rgba(255,255,255,.08));
  mix-blend-mode: overlay;
}

/* Holographic: rainbow banding driven by tilt. */
.edition-fx[data-ed='holo']::before {
  content: '';
  position: absolute; inset: -30%;
  background: repeating-linear-gradient(
    calc(112deg + var(--sheen, 0) * 26deg),
    rgba(255, 0, 122, .48) 0px, rgba(255, 214, 0, .48) 16px,
    rgba(0, 255, 170, .48) 32px, rgba(0, 170, 255, .48) 48px,
    rgba(190, 0, 255, .48) 64px, rgba(255, 0, 122, .48) 80px);
  mix-blend-mode: color-dodge;
  opacity: .5;
  transform: translateX(calc(var(--sheen, 0) * 12%));
}
.edition-fx[data-ed='holo']::after {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(circle at calc(50% + var(--sheen, 0) * 40%) 35%, rgba(255,255,255,.5), transparent 58%);
  mix-blend-mode: screen;
}

/* Polychrome: heavier, animated rainbow. */
.edition-fx[data-ed='polychrome']::before {
  content: '';
  position: absolute; inset: -50%;
  background: conic-gradient(from calc(var(--sheen, 0) * 180deg),
    #ff005e, #ffbe0b, #3bf4a5, #00b4ff, #b14aff, #ff005e);
  mix-blend-mode: overlay;
  opacity: .78;
  animation: poly-spin 5.5s linear infinite;
}
.edition-fx[data-ed='polychrome']::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(120deg, rgba(255,255,255,.42), transparent 40%, rgba(255,255,255,.3));
  mix-blend-mode: screen;
  transform: translateX(calc(var(--sheen, 0) * 30%));
}
@keyframes poly-spin { to { transform: rotate(360deg); } }

/* Negative: inverted, with a dark halo. */
.card.edition-negative .card-face { filter: invert(1) hue-rotate(175deg) saturate(1.35); }
.card.edition-negative .card-shadow { background: rgba(120, 60, 190, 0.45); }
.edition-fx[data-ed='negative']::before {
  content: '';
  position: absolute; inset: 0;
  box-shadow: inset 0 0 16px rgba(160, 90, 240, .8);
}

/* Glass cards get a permanent glint. */
.card-face[data-enh='glass']::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(125deg, transparent 40%, rgba(255,255,255,.55) 48%, transparent 56%);
  pointer-events: none;
}

/* Slot outline shown under empty joker/consumable positions. */
.slot-ghost {
  position: absolute;
  width: var(--card-w); height: var(--card-h);
  border-radius: 8px;
  border: 2px dashed rgba(255, 255, 255, 0.12);
  pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
  .edition-fx[data-ed='polychrome']::before { animation: none; }
}


/* ===== styles/fx.css ===== */
/* Floating text, tooltips and one-off effects. */

/* -------------------------------------------------------- floating text */

.float-text {
  position: absolute;
  transform-origin: 50% 50%;
  font-size: 21px;
  font-weight: 700;
  white-space: nowrap;
  pointer-events: none;
  text-shadow: 0 3px 0 rgba(0, 0, 0, 0.55);
  will-change: transform, opacity;
  animation: float-up 0.85s cubic-bezier(.16,.9,.3,1) forwards;
}
.float-text.big { font-size: 30px; }
.float-text.chip-pill,
.float-text.mult-pill {
  padding: 2px 9px;
  border-radius: 7px;
  color: #fff;
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
}
.float-text.chip-pill { background: var(--chips); }
.float-text.mult-pill { background: var(--mult); }

@keyframes float-up {
  0%   { opacity: 0; transform: translate(-50%, 6px) scale(.55); }
  18%  { opacity: 1; transform: translate(-50%, -12px) scale(1.22); }
  32%  { transform: translate(-50%, -18px) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -54px) scale(.92); }
}

/* The score box numbers pop when they change. */
.pop { animation: pop 0.28s cubic-bezier(.2,.9,.3,1.6); }
@keyframes pop {
  0% { transform: scale(1); }
  38% { transform: scale(1.28); }
  100% { transform: scale(1); }
}
.pop-big { animation: pop-big 0.42s cubic-bezier(.2,.9,.3,1.6); }
@keyframes pop-big {
  0% { transform: scale(1); }
  30% { transform: scale(1.55) rotate(-2deg); }
  100% { transform: scale(1); }
}

/* Big centred announcements ("Blind defeated!", "Game Over"). */
.banner {
  position: absolute;
  left: 50%; top: 46%;
  transform: translate(-50%, -50%);
  font-size: 54px;
  font-weight: 700;
  text-align: center;
  text-shadow: 0 6px 0 rgba(0, 0, 0, 0.5);
  pointer-events: none;
  white-space: nowrap;
}
.banner .ch {
  display: inline-block;
  animation: banner-letter 0.62s cubic-bezier(.2,.9,.3,1.5) backwards;
}
@keyframes banner-letter {
  0% { opacity: 0; transform: translateY(-38px) rotate(-14deg) scale(.4); }
  60% { opacity: 1; transform: translateY(4px) rotate(3deg) scale(1.14); }
  100% { opacity: 1; transform: none; }
}
.banner.out { animation: banner-out .34s ease-in forwards; }
@keyframes banner-out {
  to { opacity: 0; transform: translate(-50%, -50%) scale(1.28); }
}

/* Letters that wobble forever, used for the win screen. */
.dyn-text .ch {
  display: inline-block;
  animation: dyn-wobble 1.6s ease-in-out infinite;
}
@keyframes dyn-wobble {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-5px) rotate(-3.5deg); }
  75% { transform: translateY(5px) rotate(3.5deg); }
}

/* --------------------------------------------------------------- tooltip */

#tooltip-layer {
  position: fixed;
  inset: 0;
  z-index: 70;
  pointer-events: none;
}
.tooltip {
  position: absolute;
  min-width: 168px;
  max-width: 268px;
  background: #4f6367;
  border-radius: 10px;
  padding: 6px;
  box-shadow: 0 6px 0 rgba(0, 0, 0, 0.4);
  transform-origin: 50% 100%;
  animation: tip-in 0.16s cubic-bezier(.2,.9,.3,1.4);
}
@keyframes tip-in {
  from { opacity: 0; transform: translateY(8px) scale(.9); }
  to { opacity: 1; transform: none; }
}
.tip-title {
  text-align: center;
  font-size: 16px;
  font-weight: 700;
  background: #374244;
  border-radius: 6px;
  padding: 3px 8px;
  margin-bottom: 5px;
}
.tip-body {
  background: #d7e5e6;
  color: #2c3538;
  border-radius: 6px;
  padding: 6px 8px;
  font-size: 14px;
  line-height: 1.3;
  text-align: center;
}
.tip-body + .tip-body { margin-top: 4px; }
.tip-line { min-height: 15px; }
.tip-foot {
  display: flex; justify-content: space-between; gap: 6px;
  margin-top: 5px; font-size: 13px;
}
.tip-tag {
  border-radius: 5px; padding: 2px 8px; font-weight: 700;
  background: #374244;
}
.tip-tag.rarity-1 { background: #009dff; }
.tip-tag.rarity-2 { background: #4bc292; }
.tip-tag.rarity-3 { background: #fe5f55; }
.tip-tag.rarity-4 { background: #b26cbb; }
.tip-tag.money { background: #f3b958; color: #3a2c07; }

/* Inline markup produced by format.js */
.mk { font-weight: 700; }
.mk-chip {
  border-radius: 4px;
  padding: 0 4px;
  color: #fff;
  display: inline-block;
  line-height: 1.22;
}

/* --------------------------------------------------------- misc effects */

.screen-flash {
  position: fixed;
  inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
  z-index: 55;
}
.screen-flash.on { animation: flash 0.34s ease-out; }
@keyframes flash {
  0% { opacity: .55; }
  100% { opacity: 0; }
}

.deny-shake { animation: deny 0.32s ease-in-out; }
@keyframes deny {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-7px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(3px); }
}

.toast {
  position: absolute;
  left: 50%;
  top: 8px;
  transform: translateX(-50%);
  background: rgba(20, 26, 29, 0.92);
  border-radius: 9px;
  padding: 7px 15px;
  font-size: 16px;
  pointer-events: none;
  animation: toast 1.6s ease-out forwards;
  z-index: 80;
}
@keyframes toast {
  0% { opacity: 0; transform: translate(-50%, -14px); }
  14% { opacity: 1; transform: translate(-50%, 0); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -8px); }
}

/* Glow behind a card that is about to score. */
.score-glow {
  position: absolute;
  border-radius: 12px;
  pointer-events: none;
  box-shadow: 0 0 26px 8px rgba(255, 214, 120, 0.55);
  opacity: 0;
}
.score-glow.on { animation: glow 0.5s ease-out; }
@keyframes glow {
  0% { opacity: 0; transform: scale(.85); }
  35% { opacity: 1; transform: scale(1.05); }
  100% { opacity: 0; transform: scale(1.15); }
}

@media (prefers-reduced-motion: reduce) {
  .dyn-text .ch,
  .banner .ch { animation-duration: 0.01ms; animation-iteration-count: 1; }
}

</style>

    <div id="playfield">

            <div class="calc-chips" id="calc-chips">0</div>
            <div class="calc-x">X</div>
            <div class="calc-mult" id="calc-mult">0</div>
          </div>
        </div>

        <div class="stat-grid">
          <div class="panel stat stat-hands">
            <div class="stat-label">Hands</div>
            <div class="stat-value blue" id="stat-hands">4</div>

          <div class="panel stat stat-discards">

            <div class="stat-value red" id="stat-discards">3</div>
          </div>

        <div class="sidebar-buttons">

            <div class="slot-count" id="consumable-count">0/2</div>
          </div>

        <div id="table-area">
          <div id="screen-host"></div>

        <div id="hand-region">
          <div class="hand-label" id="hand-count-label"></div>
          <div id="action-bar">

            <div class="sort-group">
              <div class="sort-label">Sort Hand</div>

        c.zIndex = 900;
        m.tiltT.y = clamp(m.vel.x * 0.02, -18, 18);
        m.tiltT.x = clamp(-m.vel.y * 0.014, -14, 14);
        continue;
      }
      if (c === this.hover && !this.drag) {
        m.T.scale = HOVER_SCALE;
        m.liftT = HOVER_LIFT;
        c.zIndex = 800;
        // Tilt toward the pointer: the point under the cursor comes forward.
        const local = this.pointerLocal();
        const cx = m.VT.x + CARD_W / 2;
        const cy = m.VT.y + CARD_H / 2;
        m.tiltT.y = clamp(((local.x - cx) / (CARD_W / 2)) * 13, -16, 16);
        m.tiltT.x = clamp((-(local.y - cy) / (CARD_H / 2)) * 11, -14, 14);
      } else {
        if (!c.selected) m.liftT = 0;
        else m.liftT = 0;
        m.tiltT.y = 0;
        m.tiltT.x = 0;
      }
    }
  }

  pointerLocal() {
    const rect = this.playfield.getBoundingClientRect();
    return {
      x: (this.pointer.x - rect.left) / this.scale,
      y: (this.pointer.y - rect.top) / this.scale,
    };
  }

  // -------------------------------------------------------------------- HUD

  updateHUD() {
    const g = this.game;
    const s = g?.state;
    if (!s) return;
    const h = this.hud;
    const set = (node, key, value) => {
      if (!node) return;
      if (this.lastHud[key] === value) return;
      this.lastHud[key] = value;
      node.textContent = value;
    };

    const blind = s.blind;
    const showBlind = s.phase === PHASE.PLAYING || s.phase === PHASE.ROUND_END;
    if (blind && showBlind) {
      set(h.blindName, 'bn', blind.name);
      set(h.blindGoal, 'bg', formatNumber(s.requirement));
      set(h.blindReward, 'br', '$'.repeat(Math.max(0, blind.dollars)));
      if (this.lastHud.bc !== blind.color) {
        this.lastHud.bc = blind.color;
        h.blindChip.style.background = blind.color;
        h.blindChip.textContent = blind.glyph || '●';
      }
    } else {
      const next = s.nextBlindSlot();
      const def = next ? s.blindDef(next) : s.blindDef('small');
      set(h.blindName, 'bn', def.name);
      set(h.blindGoal, 'bg', formatNumber(next ? s.blindRequirement(next) : 0));
      set(h.blindReward, 'br', '$'.repeat(Math.max(0, def.dollars)));
      if (this.lastHud.bc !== def.color) {
        this.lastHud.bc = def.color;
        h.blindChip.style.background = def.color;
        h.blindChip.textContent = def.glyph || '●';
      }
    }

    if (this.lastHud.ph !== s.phase) {
      this.lastHud.ph = s.phase;
      this.playfield.dataset.phase = s.phase;
    }

    set(h.roundScore, 'rs', formatNumber(s.round.score));
    set(h.hands, 'hl', String(s.round.handsLeft));
    set(h.discards, 'dl', String(s.round.discardsLeft));
    set(h.money, 'mn', s.money < 0 ? `-$${Math.abs(s.money)}` : `$${s.money}`);
    set(h.ante, 'an', String(s.ante));
    set(h.round, 'rn', String(s.roundNumber));
    // Between rounds the draw pile is empty; show the full deck instead.
    const remaining = s.phase === PHASE.PLAYING ? s.drawPile.length : s.fullDeck.length;
    set(h.deckRemaining, 'dr', String(remaining));
    set(h.deckTotal, 'dt', String(s.fullDeck.length));
    set(h.jokerCount, 'jc', `${s.jokers.length}/${s.jokerSlots()}`);
    set(h.consumableCount, 'cc', `${s.consumables.length}/${s.consumableSlots()}`);

    // Live preview of the selected hand.
    if (s.phase === PHASE.PLAYING && !sequencer.busy) {
      const preview = g.previewHand();
      if (preview) {
        this.setHandDisplay(preview.handKey, preview.level);
        const base = handBase(s, preview.handKey);
        this.setChips(base.chips, true);
        this.setMult(base.mult, true);
      } else if (this.lastPreview !== null) {
        this.setHandDisplay('', 0);
        this.setChips(0, true);
        this.setMult(0, true);
      }
      this.lastPreview = preview;
    }

    const sel = s.phase === PHASE.PLAYING ? g.selectedCards().length : 0;
    set(h.handCount, 'hc', sel ? `${sel} card${sel === 1 ? '' : 's'} selected` : '');

    const canPlay = s.phase === PHASE.PLAYING && !sequencer.busy && g.canPlay();
    const canDiscard = s.phase === PHASE.PLAYING && !sequencer.busy && sel > 0 && s.round.discardsLeft > 0;
    if (h.btnPlay.disabled === canPlay) h.btnPlay.disabled = !canPlay;
    if (h.btnDiscard.disabled === canDiscard) h.btnDiscard.disabled = !canDiscard;

    // Shop prices.
    const inShop = s.phase === PHASE.SHOP;
    for (const v of this.views.values()) {
      const c = v.card;
      const forSale = inShop && (g.shop.items.includes(c) || g.shop.boosters.includes(c) || g.shop.vouchers.includes(c));
      c.inShop = forSale;
      if (forSale) {
        const cost = c.cost(s);
        v.setPrice(c.free ? 'FREE' : `$${cost}`, c.free);
        v.el.classList.toggle('unaffordable', !g.canAfford(c));
      } else {
        v.setPrice(null);
        v.el.classList.remove('unaffordable');
      }
    }
  }

  setHandDisplay(key, level) {
    const h = this.hud;
    if (this.lastHud.hn !== key) {
      this.lastHud.hn = key;
      h.handName.textContent = key || ' ';
    }
    const lv = key && level ? `lvl.${level}` : '';
    if (this.lastHud.hlv !== lv) {
      this.lastHud.hlv = lv;
      h.handLevel.textContent = lv;
      if (level) h.handLevel.style.background = levelColor(level);
    }
  }

  setChips(n, immediate = false) {
    const h = this.hud;
    const text = formatNumber(Math.round(n * 100) / 100);
    if (h.chips.textContent === text) return;
    h.chips.textContent = text;
    this.displayChips = n;
    if (!immediate) this.popNode(h.chips, n > 999);
  }

  setMult(n, immediate = false) {
    const h = this.hud;
    const text = formatMult(n);
    if (h.mult.textContent === text) return;
    h.mult.textContent = text;
    this.displayMult = n;
    if (!immediate) this.popNode(h.mult, n > 40);
  }

  popNode(node, big = false) {
    node.classList.remove('pop', 'pop-big');
    void node.offsetWidth;
    node.classList.add(big ? 'pop-big' : 'pop');
  }

  pulseMoney() {
    this.popNode(this.hud.money, true);
  }

  pulseHandPanel() {
    this.popNode(this.hud.handName);
  }

  /** Float text over the sidebar score box (for jokers with no card anchor). */
  floatOverScoreBox(text, colour) {
    const rect = localRect(document.getElementById('hand-panel'), this.playfield, this.scale);
    if (!rect) return;
    this.fx.float(rect.cx, rect.y - 4, text, { colour });
  }

  /** Chips x Mult -> round score. */
  async playFinalScore(result) {
    const h = this.hud;
    audio.buildup(0.45);
    this.popNode(h.chips, true);
    this.popNode(h.mult, true);
    background.pulse(1.4);
    await wait(0.34);

    const magnitude = Math.log10(Math.max(10, result.score));
    this.fx.shake(4 + magnitude * 2.4);
    audio.explode();
    if (result.score > 5000) this.fx.flash();

    const rect = localRect(document.getElementById('hand-panel'), this.playfield, this.scale);
    if (rect) {
      this.fx.float(rect.cx, rect.y + 20, formatNumber(result.score), { colour: '#fff', big: true });
      particles.burst(rect.cx, rect.y + 30, {
        count: 18, color: [C.CHIPS, C.MULT, '#ffffff'], speed: 300, size: 6, gravity: 500,
      });
    }

    const s = this.game.state;
    const from = s.round.score;
    const to = from + result.score;
    await countUp(h.roundScore, from, to, 0.55);
    this.popNode(h.roundScore, true);
    await wait(0.28);

    this.setChips(0, true);
    this.setMult(0, true);
  }

  // ------------------------------------------------------- game view hooks

  refresh() {
    this.dirty = true;
    if (this.game?.state) this.reconcile();
    this.syncScreens();
  }

  syncScreens() {
    const s = this.game?.state;
    if (!s) return;
    const want =
      s.phase === PHASE.BLIND_SELECT ? 'blindSelect'
      : s.phase === PHASE.SHOP ? 'shop'
      : s.phase === PHASE.BOOSTER ? 'pack'
      : null;
    if (want === 'blindSelect' && this.screens.current !== 'blindSelect') this.screens.showBlindSelect();
    if (want === 'shop' && this.screens.current !== 'shop') this.screens.showShop();
    if (want === 'pack' && this.screens.current !== 'pack' && this.game.pack) this.screens.showPack(this.game.pack);
    if (!want && this.screens.current && this.screens.current !== 'cashOut') this.screens.clear();
    if (this.screens.current === 'pack') this.screens.updatePackSub(this.game.pack);
    if (this.screens.current === 'shop' && this.screens.rerollBtn) {
      const cost = this.game.shop.currentRerollCost();
      const label = `Reroll $${cost}`;
      if (this.screens.rerollBtn.textContent !== label) this.screens.rerollBtn.textContent = label;
      const off = s.money - cost < s.debtLimit();
      if (this.screens.rerollBtn.disabled !== off) this.screens.rerollBtn.disabled = off;
    }
    this.renderTags();
  }

  renderTags() {
    const s = this.game.state;
    // Rebuild only when the tag list actually changes — this runs every frame.
    const sig = s.tags.map((t) => t.key).join(',');
    if (sig === this._tagSig) return;
    this._tagSig = sig;
    this.tagLayer.textContent = '';
    s.tags.forEach((tag, i) => {
      const chip = el('div', 'tag-chip', this.tagLayer);
      chip.style.background = tag.def?.color || C.IMPORTANT;
      chip.style.left = `${16}px`;
      chip.style.top = `${150 + i * 36}px`;
      chip.textContent = `${tag.def?.emoji || '🏷'} ${tag.def?.name || tag.key}`;
      chip.dataset.tag = tag.key;
    });
  }

  setPalette(name) {
    background.setPalette(name);
  }

  onRunStart() {
    this.screens.clear();
    this.lastHud = {};
    this.refresh();
  }

  async onBlindSelected(blind) {
    this.screens.clear();
    this.fx.banner(blind.name, { duration: 0.95, colour: blind.color });
    this.fx.shake(6);
    await wait(0.85);
  }

  async onBlindDefeated() {
    this.fx.banner('Blind defeated!', { duration: 1.2, colour: C.MONEY });
    this.fx.shake(10);
    particles.confetti(PLAYFIELD_W, PLAYFIELD_H, 70);
    await wait(1.1);
  }

  async onCashOut(payouts) {
    this.screens.showCashOut(payouts, () => this.game.finishCashOut(payouts));
  }

  async onShopEnter() {
    this.screens.showShop();
    await wait(0.15);
  }

  async onShopExit() {
    // Don't clear here — the phase has already moved to blind select and
    // syncScreens() owns what is on screen.
    this.selectedItem = null;
    this.hideActionMenu();
  }

  async onPackOpened(pack) {
    this.screens.showPack(pack);
    this.fx.shake(4);
    await wait(0.2);
  }

  async onPackClosed() {
    this.hideActionMenu();
    this.selectedItem = null;
    this.refresh();
  }

  async onGameOver(reason) {
    await wait(0.4);
    this.screens.showGameOver(this.game.state, reason, {
      onNewRun: () => this.startNewRunFlow(),
      onMenu: () => this.showTitle(),
    });
  }

  async onWin() {
    this.fx.banner('YOU WIN!', { duration: 2, colour: C.MONEY, size: 74 });
    particles.confetti(PLAYFIELD_W, PLAYFIELD_H, 200);
    this.fx.shake(14);
    await wait(1.8);
    this.screens.showWin(this.game.state, {
      onEndless: () => this.game.continueEndless(),
      onNewRun: () => this.startNewRunFlow(),
      onMenu: () => this.showTitle(),
    });
  }

  async jokerMessage(card, effect) {
    if (!effect) return;
    if (card?.move) card.move.juiceUp(0.36);
    const text = effect.message || (effect.dollars ? `+$${effect.dollars}` : null);
    if (text) {
      if (card?.move) this.fx.floatOver(card, text, { colour: effect.colour || C.IMPORTANT });
      else this.floatOverScoreBox(text, effect.colour || C.IMPORTANT);
    }
    await wait(0.16);
  }

  onCardDealt(card) {
    card.spawnAt = { x: LAYOUT.deck.x, y: LAYOUT.deck.y };
  }

  onGlassShatter(card) {
    particles.shatter(card.move.renderX + CARD_W / 2, card.move.renderY + CARD_H / 2);
    this.fx.shake(5);
  }

  onMrBones(joker) {
    this.fx.banner('Saved!', { duration: 1, colour: C.BLUE });
    if (joker?.move) particles.burst(joker.move.renderX + CARD_W / 2, joker.move.renderY + CARD_H / 2, { count: 22, color: ['#fff', C.BLUE] });
  }

  onHandLevelUp(key, n) {
    this.fx.toast(`${key} upgraded to level ${this.game.state.handLevels[key].level}`);
  }

  onConsumableUsed(card) {
    if (card?.move) {
      particles.sparkle(card.move.renderX + CARD_W / 2, card.move.renderY + CARD_H / 2, 14, card.def?.bg || '#fff');
    }
  }

  onMoney() {
    this.pulseMoney();
  }

  onReroll() {
    this.fx.shake(3);
  }

  deny(card, reason) {
    const v = card && this.views.get(card.id);
    if (v) {
      v.el.classList.remove('deny-shake');
      void v.el.offsetWidth;
      v.el.classList.add('deny-shake');
    }
    this.fx.toast(reason);
    audio.tone(160, { type: 'square', dur: 0.12, gain: 0.08, bend: 0.7 });
  }

  // ------------------------------------------------------------------ input

  bindInput() {
    const layer = document.body;

    layer.addEventListener('pointermove', (e) => {
      this.pointer.x = e.clientX;
      this.pointer.y = e.clientY;
      if (this.drag) this.updateDrag(e);
      else this.updateHoverTarget(e);
    });

    layer.addEventListener('pointerdown', (e) => {
      audio.unlock();
      this.pointer.x = e.clientX;
      this.pointer.y = e.clientY;
      this.pointer.down = true;
      const card = this.cardFromEvent(e);
      if (!card) {
        if (!e.target.closest('.card-action')) this.clearSelection();
        return;
      }
      if (this.isDraggable(card)) {
        this.drag = {
          card,
          list: this.listFor(card),
          startX: e.clientX,
          startY: e.clientY,
          moved: false,
          offX: 0,
          offY: 0,
          x: card.move.T.x,
          y: card.move.T.y,
        };
        const local = this.pointerLocal();
        this.drag.offX = local.x - card.move.VT.x;
        this.drag.offY = local.y - card.move.VT.y;
      } else {
        this.drag = { card, list: null, startX: e.clientX, startY: e.clientY, moved: false, noDrag: true };
      }
    });

    layer.addEventListener('pointerup', (e) => {
      this.pointer.down = false;
      const d = this.drag;
      this.drag = null;
      if (!d) return;
      if (d.moved && d.list) {
        this.commitDrag(d);
      } else {
        this.clickCard(d.card, e);
      }
      for (const v of this.views.values()) {
        v.card.dragging = false;
      }
    });

    layer.addEventListener('pointercancel', () => {
      this.drag = null;
    });

    layer.addEventListener('contextmenu', (e) => {
      const card = this.cardFromEvent(e);
      if (card) e.preventDefault();
    });

    window.addEventListener('keydown', (e) => this.onKey(e));
    window.addEventListener('blur', () => { this.drag = null; });
  }

  bindButtons() {
    document.getElementById('btn-play').onclick = () => {
      audio.button();
      this.game.playHand();
    };
    document.getElementById('btn-discard').onclick = () => {
      audio.button();
      this.game.discard();
    };
    document.getElementById('btn-sort-rank').onclick = () => this.game.sortHand('rank');
    document.getElementById('btn-sort-suit').onclick = () => this.game.sortHand('suit');
    document.getElementById('btn-run-info').onclick = () => {
      audio.button();
      this.screens.showRunInfo(this.game.state);
    };
    document.getElementById('btn-options').onclick = () => {
      audio.button();
      this.openOptions();
    };
    document.getElementById('deck-pile').onclick = () => {
      audio.button();
      this.screens.showRunInfo(this.game.state);
    };
  }

  onKey(e) {
    const s = this.game?.state;
    if (!s) return;
    if (e.key === 'Escape') {
      if (this.screens.overlay) this.screens.closeOverlay();
      else this.openOptions();
      return;
    }
    if (this.screens.overlay) return;
    if (s.phase === PHASE.PLAYING) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        this.game.playHand();
      } else if (e.key === 'x' || e.key === 'X' || e.key === 'Backspace') {
        this.game.discard();
      } else if (e.key >= '1' && e.key <= '9') {
        const idx = Number(e.key) - 1;
        if (s.hand[idx]) this.game.toggleSelect(s.hand[idx]);
      } else if (e.key === 'r' || e.key === 'R') {
        this.game.sortHand('rank');
      } else if (e.key === 't' || e.key === 'T') {
        this.game.sortHand('suit');
      }
    }
    if (e.key === 'i' || e.key === 'I') this.screens.showRunInfo(s);
  }

  cardFromEvent(e) {
    const node = e.target.closest?.('.card');
    if (!node) return null;
    return this.views.get(node.dataset.cardId)?.card || null;
  }

  listFor(card) {
    const s = this.game.state;
    if (s.hand.includes(card)) return s.hand;
    if (s.jokers.includes(card)) return s.jokers;
    if (s.consumables.includes(card)) return s.consumables;
    return null;
  }

  isDraggable(card) {
    if (sequencer.busy) return false;
    const s = this.game.state;
    return s.hand.includes(card) || s.jokers.includes(card) || s.consumables.includes(card);
  }

  updateHoverTarget(e) {
    const card = this.cardFromEvent(e);
    if (card === this.hover) return;
    if (this.hover) this.hover.hovered = false;
    this.hover = card;
    if (card) {
      card.hovered = true;
      audio.unlock();
    }
  }

  updateDrag(e) {
    const d = this.drag;
    if (!d) return;
    const dist = Math.hypot(e.clientX - d.startX, e.clientY - d.startY);
    if (!d.moved && dist > DRAG_THRESHOLD) {
      if (d.noDrag) return;
      d.moved = true;
      d.card.dragging = true;
      audio.select(true);
      this.hideActionMenu();
    }
    if (!d.moved) return;
    const local = this.pointerLocal();
    d.x = local.x - d.offX;
    d.y = local.y - d.offY;
  }

  commitDrag(d) {
    const list = d.list;
    const idx = d.dropIndex ?? list.indexOf(d.card);
    const from = list.indexOf(d.card);
    if (from >= 0 && idx >= 0 && idx !== from) {
      list.splice(from, 1);
      list.splice(idx, 0, d.card);
      audio.card(0);
    }
    d.card.dragging = false;
    d.card.move.juiceUp(0.18);
  }

  clickCard(card, e) {
    const g = this.game;
    const s = g.state;
    if (sequencer.busy) return;

    if (g.pack && g.pack.cards.includes(card)) {
      g.pickFromPack(card);
      return;
    }
    if (s.phase === PHASE.SHOP) {
      if (g.shop.items.includes(card) || g.shop.boosters.includes(card) || g.shop.vouchers.includes(card)) {
        this.selectItem(card);
        return;
      }
    }
    if (s.hand.includes(card)) {
      if (s.phase === PHASE.PLAYING || s.phase === PHASE.BOOSTER) g.toggleSelect(card);
      return;
    }
    if (s.jokers.includes(card) || s.consumables.includes(card)) {
      this.selectItem(card);
    }
  }

  // ------------------------------------------------------- card action menu

  clearSelection() {
    if (this.selectedItem) {
      this.selectedItem = null;
      this.hideActionMenu();
    }
  }

  selectItem(card) {
    if (this.selectedItem === card) {
      this.clearSelection();
      return;
    }
    this.selectedItem = card;
    card.move.juiceUp(0.2);
    audio.select(true);
    this.buildActionMenu(card);
  }

  buildActionMenu(card) {
    this.hideActionMenu();
    const g = this.game;
    const s = g.state;
    const actions = [];

    const inShop = s.phase === PHASE.SHOP &&
      (g.shop.items.includes(card) || g.shop.boosters.includes(card) || g.shop.vouchers.includes(card));

    if (inShop) {
      if (card.kind === 'booster') {
        actions.push({ label: 'Open', cls: 'btn-blue', fn: () => g.openBooster(card) });
      } else if (card.kind === 'voucher') {
        actions.push({ label: 'Redeem', cls: 'btn-gold', fn: () => g.buy(card) });
      } else {
        actions.push({ label: 'Buy', cls: 'btn-blue', fn: () => g.buy(card) });
        if (card.isConsumable()) {
          actions.push({ label: 'Buy & Use', cls: 'btn-green', fn: () => g.buy(card, true) });
        }
      }
    } else if (s.jokers.includes(card)) {
      if (!card.eternal) actions.push({ label: `Sell $${card.sellValue()}`, cls: 'btn-gold', fn: () => g.sell(card) });
    } else if (s.consumables.includes(card)) {
      actions.push({ label: 'Use', cls: 'btn-green', fn: () => g.useConsumable(card) });
      actions.push({ label: `Sell $${card.sellValue()}`, cls: 'btn-gold', fn: () => g.sell(card) });
    }
    if (!actions.length) return;

    const menu = el('div', 'card-action', this.fxLayer);
    menu.style.position = 'absolute';
    menu.style.display = 'flex';
    menu.style.gap = '5px';
    menu.style.pointerEvents = 'auto';
    for (const a of actions) {
      const b = el('button', `btn btn-tiny ${a.cls}`, menu);
      b.textContent = a.label;
      b.onclick = (ev) => {
        ev.stopPropagation();
        audio.button();
        this.clearSelection();
        a.fn();
      };
    }
    this.actionMenu = { node: menu, card };
  }

  updateActionMenu() {
    const m = this.actionMenu;
    if (!m) return;
    const s = this.game.state;
    const stillThere = this.views.has(m.card.id) && !m.card.dying;
    if (!stillThere || sequencer.busy) {
      this.hideActionMenu();
      this.selectedItem = null;
      return;
    }
    const move = m.card.move;
    m.node.style.left = `${move.renderX + CARD_W / 2}px`;

    this.layer = document.getElementById('tooltip-layer');
    this.node = null;
    this.currentKey = null;
    this.enabled = true;
  }

  hide() {
    if (this.node) {
      this.node.remove();
      this.node = null;
    }
    this.currentKey = null;
  }

  /**
   * @param {GCard} card
   * @param {GameState} state
   * @param {DOMRect} screenRect  the card's on-screen box
   */
  show(card, state, screenRect) {
    if (!this.enabled || !card) return this.hide();
    const key = `${card.id}:${JSON.stringify(card.ability || {})}:${card.enhancement}:${card.edition}:${card.seal}`;
    if (key === this.currentKey && this.node) {
      this.position(screenRect);
      return;
    }
    this.hide();
    this.currentKey = key;

    const tip = el('div', 'tooltip');
    const title = el('div', 'tip-title', tip);
    title.textContent = card.name() || card.def?.name || '';

    const sections = this.sectionsFor(card, state);
    for (const sec of sections) {
      const body = el('div', 'tip-body', tip);
      if (sec.heading) {
        const h = el('div', 'tip-line', body);
        h.style.fontWeight = '700';
        h.style.color = sec.headingColour || C.IMPORTANT;
        h.textContent = sec.heading;
      }
      body.appendChild(formatLines(sec.lines, sec.vars || [], sec.varColours || []));
    }

    const foot = this.footFor(card, state);
    if (foot) tip.appendChild(foot);

    this.layer.appendChild(tip);
    this.node = tip;
    this.position(screenRect);
  }

  sectionsFor(card, state) {
    const out = [];
    if (card.kind === 'joker' || card.isConsumable?.() || card.kind === 'voucher') {
      const def = card.def;
      if (def) {
        const vars = def.vars ? def.vars(card.ability, state, helperBag(state)) : [];
        const varColours = def.varColours ? def.varColours(card.ability, state) : [];
        out.push({ lines: def.text || [], vars, varColours });
      }
    } else if (card.kind === 'booster') {
      const d = card.def;
      out.push({
        lines: [`Choose {C:attention}${d.picks}{} of {C:attention}${d.cards ?? d.size}{}`, kindLabel(d.kind)],
      });
    } else if (card.kind === 'playing') {
      if (card.enhancement) {
        const e = ENHANCEMENTS[card.enhancement];
        out.push({ heading: e.name, lines: e.text });
      }
      const chips = card.chipValue(state);
      if (card.enhancement !== 'stone') {
        out.push({ lines: [`{C:chips}+${chips}{} Chips`] });
      }
    }

    if (card.edition && EDITIONS[card.edition]) {
      const e = EDITIONS[card.edition];
      out.push({ heading: e.name, headingColour: '#b58cd8', lines: e.text });
    }
    if (card.seal && SEALS[card.seal]) {
      const s = SEALS[card.seal];
      out.push({ heading: s.name, headingColour: s.color, lines: s.text });
    }
    if (card.eternal) out.push({ heading: 'Eternal', headingColour: C.ETERNAL, lines: ['Can never be sold or destroyed'] });
    if (card.perishable) out.push({ heading: 'Perishable', headingColour: C.PERISHABLE, lines: [`Debuffed after {C:attention}${card.perishTimer}{} more rounds`] });
    if (card.rental) out.push({ heading: 'Rental', headingColour: C.RENTAL, lines: ['Costs {C:money}$3{} per round'] });
    if (card.disabled) out.push({ heading: 'Disabled', headingColour: C.RED, lines: ['This Joker is disabled', 'by the Boss Blind'] });
    if (card.kind === 'playing' && state?.isDebuffed?.(card)) {
      out.push({ heading: 'Debuffed', headingColour: C.RED, lines: ['Scores no chips or mult'] });
    }
    return out;
  }

  footFor(card, state) {
    const bits = [];
    if (card.kind === 'joker' && card.def) {
      const r = el('span', `tip-tag rarity-${card.def.rarity}`);
      r.textContent = C.RARITY_NAME[card.def.rarity];
      bits.push(r);
    }
    if (card.inShop) {
      const p = el('span', 'tip-tag money');
      p.textContent = card.free ? 'FREE' : `$${card.cost(state)}`;
      bits.push(p);
    } else if (card.kind === 'joker' || card.isConsumable?.()) {
      const p = el('span', 'tip-tag money');
      p.textContent = `Sell $${card.sellValue()}`;
      bits.push(p);
    }
    if (!bits.length) return null;
    const foot = el('div', 'tip-foot');
    for (const b of bits) foot.appendChild(b);
    return foot;
  }

  position(rect) {
    if (!this.node || !rect) return;
    const tw = this.node.offsetWidth;
    const th = this.node.offsetHeight;
    let x = rect.left + rect.width / 2 - tw / 2;
    let y = rect.top - th - 10;
    // Flip below the card if there is no room above.
    if (y < 6) y = rect.bottom + 10;
    x = Math.max(6, Math.min(window.innerWidth - tw - 6, x));
    y = Math.max(6, Math.min(window.innerHeight - th - 6, y));
    this.node.style.left = `${x}px`;
    this.node.style.top = `${y}px`;
  }
}

function kindLabel(kind) {
  switch (kind) {
    case 'arcana': return '{C:tarot}Tarot{} cards';
    case 'celestial': return '{C:planet}Planet{} cards';
    case 'spectral': return '{C:spectral}Spectral{} cards';
    case 'buffoon': return '{C:red}Joker{} cards';
    default: return 'Playing cards';
  }
}

/** The small helper bag joker `vars()` functions expect. */
function helperBag(state) {
  return {
    rankName: (r) => ({ 11: 'Jack', 12: 'Queen', 13: 'King', 14: 'Ace' }[r] || String(r)),
    suitName: (s) => ({ S: 'Spades', H: 'Hearts', D: 'Diamonds', C: 'Clubs' }[s] || s),
    handName: (h) => h,
  };
}

return { HANDS, Tooltip };

// Poker hand table.
//
// `chips`/`mult` are the level-1 values; `lChips`/`lMult` are added per level.
// Order matters: `HAND_ORDER` is strongest-first and evaluation returns the
// first match, so Flush Five must be tested before Five of a Kind, and so on.

const HANDS = {
  'Flush Five':      { chips: 160, mult: 16, lChips: 50, lMult: 3, example: 5, planet: 'Eris' },
  'Flush House':     { chips: 140, mult: 14, lChips: 40, lMult: 4, example: 5, planet: 'Ceres' },
  'Five of a Kind':  { chips: 120, mult: 12, lChips: 35, lMult: 3, example: 5, planet: 'Planet X' },
  'Straight Flush':  { chips: 100, mult: 8,  lChips: 40, lMult: 4, example: 5, planet: 'Neptune' },
  'Four of a Kind':  { chips: 60,  mult: 7,  lChips: 30, lMult: 3, example: 4, planet: 'Mars' },
  'Full House':      { chips: 40,  mult: 4,  lChips: 25, lMult: 2, example: 5, planet: 'Earth' },
  'Flush':           { chips: 35,  mult: 4,  lChips: 15, lMult: 2, example: 5, planet: 'Jupiter' },
  'Straight':        { chips: 30,  mult: 4,  lChips: 30, lMult: 3, example: 5, planet: 'Saturn' },
  'Three of a Kind': { chips: 30,  mult: 3,  lChips: 20, lMult: 2, example: 3, planet: 'Venus' },
  'Two Pair':        { chips: 20,  mult: 2,  lChips: 20, lMult: 1, example: 4, planet: 'Uranus' },
  'Pair':            { chips: 10,  mult: 2,  lChips: 15, lMult: 1, example: 2, planet: 'Mercury' },
  'High Card':       { chips: 5,   mult: 1,  lChips: 10, lMult: 1, example: 1, planet: 'Pluto' },
};

/** Strongest to weakest. Evaluation walks this list in order. */
const HAND_ORDER = [
  'Flush Five', 'Flush House', 'Five of a Kind', 'Straight Flush', 'Four of a Kind',
  'Full House', 'Flush', 'Straight', 'Three of a Kind', 'Two Pair', 'Pair', 'High Card',
];

/**
 * Only these appear in the run-info panel until unlocked by being played —
 * the three "secret" hands stay hidden, exactly as in the real game.
 */
const SECRET_HANDS = new Set(['Flush Five', 'Flush House', 'Five of a Kind']);

/** Fresh per-run level/play-count bookkeeping. */
function makeHandLevels() {
  const out = {};
  for (const k of HAND_ORDER) out[k] = { level: 1, played: 0 };
  return out;
}

/** Chips and mult for a hand at its current level. */
function handValues(handKey, levels) {
  const base = HANDS[handKey];
  const lvl = Math.max(1, levels?.[handKey]?.level ?? 1);
  const steps = lvl - 1;
  return {
    chips: base.chips + base.lChips * steps,
    mult: base.mult + base.lMult * steps,
    level: lvl,
  };
}

/** Level pill colours, matching the game's blue -> orange -> red ramp. */
const LEVEL_COLORS = [
  '#8b9bb4', '#009dff', '#4bc292', '#a3d94b', '#f3d558',
  '#f3b958', '#fd8a2a', '#fe5f55', '#e0435c', '#c33fa7', '#8867a5',
];
function levelColor(level) {
  return LEVEL_COLORS[Math.min(LEVEL_COLORS.length - 1, Math.max(0, level - 1))];
}

return { HANDS, HAND_ORDER, SECRET_HANDS, LEVEL_COLORS, makeHandLevels, handValues, levelColor };
});

        }
      }

        if (gift && !card.edition) {

      cards: generatePackContents(s, def),

    // old "are we mid-blind?" test would misread a shop pack as a live round.
    this.packReturnPhase = s.phase === PHASE.PLAYING ? PHASE.PLAYING : PHASE.SHOP;

  }

          return;
        }
        s.addJoker(card);

        const sel = card.def.select;
        const chosen = s.hand.filter((c) => c.selected);

          // Room to keep it, and no targets picked — take it for later.
          s.consumables.push(card);
        } else if (sel) {
          // No room (or the player picked targets): use it right now.
          if (chosen.length < sel.min) {

          }

          s.consumables.push(card);
        } else {

        }

        s.fullDeck.push(card);
        s.notifyCardAdded(card);
        if (s.phase === PHASE.PLAYING) s.hand.push(card);
      }

      audio.select(true);
      removeFrom(this.pack.cards, card);
      this.pack.picksLeft--;
      this.view.refresh?.();
      await wait(0.25);
      if (this.pack.picksLeft <= 0) await this.closePack(false);
    });
  }

  skipPack() {
    return sequencer.run(async () => {
      await this.closePack(true);
    });
  }

  async closePack(skipped) {
    const s = this.state;
    if (skipped) {
      for (const { joker, effect } of s.fireJokerHook('onSkipBooster')) {
        await this.view.jokerMessage?.(joker, effect);
      }
    }
    for (const c of this.pack?.cards || []) {
      c.dying = true;
      s.dyingCards.push(c);
    }
    this.pack = null;

    // Return the hand we dealt purely so pack cards had something to target.
    if (this.packHandDealt) {
      this.packHandDealt = false;
      for (const c of s.hand) c.selected = false;
      s.hand = [];
      s.drawPile = [];
    }

    s.phase = this.packReturnPhase || PHASE.SHOP;
    this.packReturnPhase = null;
    this.view.refresh?.();
    await this.view.onPackClosed?.();
  }

  // ------------------------------------------------------------ consumables

  canUseConsumable(card) {
    const s = this.state;
    const def = card.def;
    if (def.requiresHand && !s.hand.length) return false;
    if (def.select) {
      const n = s.hand.filter((c) => c.selected).length;
      if (n < def.select.min || n > def.select.max) return false;
    }
    if (def.canUse) {
      s._hookSelf = card;
      if (!def.canUse({ ...s.makeHelpers(), self: card, state: s })) return false;
    }
    return true;
  }

  useConsumable(card, fromShop = false) {
    return sequencer.run(async () => {
      if (!this.canUseConsumable(card)) {
        this.view.deny?.(card, 'Cannot use');
        return;
      }
      const chosen = this.state.hand.filter((c) => c.selected);
      await this.applyConsumable(card, chosen, fromShop);
    });
  }

  async applyConsumable(card, selected, fromShop = false) {
    const s = this.state;
    s._hookSelf = card;
    const ctx = {
      ...s.makeHelpers(),
      self: card,
      selected,
      state: s,
      chance: (n, d, k) => s.rollChance(n, d, k),
    };

    if (card.kind === 'tarot') audio.tarot();
    else if (card.kind === 'planet') audio.planet();
    else audio.spectral();

    card.move.juiceUp(0.5);
    this.view.onConsumableUsed?.(card);
    const res = await card.def.use(ctx);
    if (res?.message) await this.view.jokerMessage?.(card, res);

    for (const c of selected) c.selected = false;
    s.stats[card.kind === 'tarot' ? 'tarotsUsed' : card.kind === 'planet' ? 'planetsUsed' : 'spectralsUsed']++;
    if (card.def.key !== 'fool') s.lastConsumableUsed = card.def;

    for (const { joker, effect } of s.fireJokerHook('onConsumableUsed', { consumable: card })) {
      await this.view.jokerMessage?.(joker, effect);
    }

    if (!fromShop) s.destroyConsumable(card);
    else {
      card.dying = true;
      s.dyingCards.push(card);
    }
    this.view.refresh?.();
    await wait(0.2);
  }

  // ------------------------------------------------------------------ misc

  rerollBossBlind() {
    return sequencer.run(async () => {
      const s = this.state;
      const unlimited = s.hasFlag('bossRerollUnlimited');
      const allowed = unlimited || (s.vouchers.has('directors_cut') && s.bossRerollsUsed < 1);
      if (!allowed || s.money < 10) return;
      s.addMoney(-10, 'boss reroll');
      s.bossRerollsUsed++;
      s.rerollBoss();
      audio.whoosh();
      this.view.refresh?.();
    });
  }

  autoSave() {
    try {
      if (this.state && this.state.phase !== PHASE.GAME_OVER) saveRun(this.state.serialize());
    } catch (e) {
      console.warn('[save] failed', e);
    }
  }
}

    'Straight Flush': 'Neptune', 'Five of a Kind': 'Planet X', 'Flush House': 'Ceres', 'Flush Five': 'Eris',

        break;
      }
      case 'buffoon': {

        out.push(s.makeJoker(jdef, { edition: shop.rollEdition() }));
        break;

      case 'standard':
      default: {
        const enh = s.rng.chance(2, 5, 'pack_enh')
          ? s.rng.choice(['bonus', 'mult', 'wild', 'glass', 'steel', 'stone', 'gold', 'lucky'], 'pack_enh2')
          : null;

          ? s.rng.choice(['gold', 'red', 'blue', 'purple'], 'pack_seal2')
          : null;

          ? s.rng.weighted([['foil', 20], ['holo', 14], ['polychrome', 4]], 'pack_edition2')
          : null;

    'Straight Flush': 'Neptune', 'Five of a Kind': 'Planet X', 'Flush House': 'Ceres', 'Flush Five': 'Eris',
  };

}

//
// Order is the whole game, so it is spelled out explicitly here:
//
//   1. evaluate the hand
//   2. boss "before" effects (The Arm drops the hand level)
//   3. joker `onBefore` hooks (Space Joker levels up, DNA copies, ...)
//   4. read base chips/mult from the hand level, then boss `modifyBase` (Flint)
//   5. each scoring card, left to right, repeated for retriggers:
//        rank chips -> enhancement -> seal -> edition -> every joker
//   6. each card held in hand, left to right, with its own retriggers
//   7. every joker, left to right: its own effect, then its edition
//   8. joker `onAfter` hooks, then chips x mult

const { C } = __require("src/data/constants.js");

  handName() {},
  setChips() {},
  setMult() {},

  jokerBeat() {},
  message() {},

  money() {},
  finalScore() {},
  chipSound() {},

 * Resolve what a joker actually does this trigger. Blueprint and Brainstorm
 * point at another joker; chains are allowed but depth-limited so a pair of
 * Blueprints facing each other can't loop.

  const def = joker.def;
  if (!def?.copies || depth > 6) return { def, self: joker, host: joker };
  const target = def.copies(state, joker);
  if (!target || target.disabled) return { def: null, self: joker, host: joker };

  if (!inner.def) return { def: null, self: joker, host: joker };

  for (const h of COPYABLE_HOOKS) if (inner.def[h]) copied[h] = inner.def[h];

      await applyEffect(state, { xmult: 2 }, card, card, fx, ctxBase, acc);

        lucky = true;
        await applyEffect(state, { mult: 20 }, card, card, fx, ctxBase, acc);

      if (state.rollChance(1, 15, 'lucky_money')) {

  if (eff.xchips) {
    acc.chips *= eff.xchips;
    fx.cardBeat(anchor, { text: `X${fmt(eff.xchips)}`, colour: C.CHIPS, kind: 'xchips', source });

    beat = true;

    fx.cardBeat(anchor, { text: `+${fmt(eff.mult)}`, colour: C.MULT, kind: 'mult', source });

}

  if (Number.isInteger(n)) return String(n);
  return String(Math.round(n * 100) / 100);
}

return { nullFx, resolveJoker, scoreHand, ScoreContext };

// localStorage persistence: settings, the in-progress run, and lifetime stats.

const KEY_RUN = 'balatro-web:run';
const KEY_SETTINGS = 'balatro-web:settings';
const KEY_PROFILE = 'balatro-web:profile';

// Touching localStorage throws outright in some sandboxed contexts, so probe
// it once behind a try rather than trusting a typeof check.
const hasStorage = (() => {
  try {
    const k = '__balatro_probe__';
    localStorage.setItem(k, '1');
    localStorage.removeItem(k);
    return true;
  } catch {
    return false;
  }
})();

const safe = (fn, fallback = null) => {
  if (!hasStorage) return fallback;
  try {
    return fn();
  } catch (e) {
    console.warn('[storage]', e);
    return fallback;
  }
};

function saveRun(data) {
  return safe(() => localStorage.setItem(KEY_RUN, JSON.stringify(data)));
}

function loadRun() {
  return safe(() => {
    const raw = localStorage.getItem(KEY_RUN);
    return raw ? JSON.parse(raw) : null;
  });
}

function clearRun() {
  return safe(() => localStorage.removeItem(KEY_RUN));
}

function hasRun() {
  return !!loadRun();
}

const DEFAULT_SETTINGS = {
  sfx: 0.7,
  music: 0.3,
  muted: false,
  highContrast: false,
  motion: 1,
  speed: 1,
  screenShake: true,
  showTooltips: true,
  pixelBackground: true,
};

function loadSettings() {
  const stored = safe(() => {
    const raw = localStorage.getItem(KEY_SETTINGS);
    return raw ? JSON.parse(raw) : null;
  });
  return { ...DEFAULT_SETTINGS, ...(stored || {}) };
}

function saveSettings(s) {
  return safe(() => localStorage.setItem(KEY_SETTINGS, JSON.stringify(s)));
}

const DEFAULT_PROFILE = {
  runs: 0,
  wins: 0,
  bestAnte: 0,
  bestHandScore: 0,
  handsPlayed: 0,
  discoveredHands: [],
};

function loadProfile() {
  const stored = safe(() => {
    const raw = localStorage.getItem(KEY_PROFILE);
    return raw ? JSON.parse(raw) : null;
  });
  return { ...DEFAULT_PROFILE, ...(stored || {}) };
}

function saveProfile(p) {
  return safe(() => localStorage.setItem(KEY_PROFILE, JSON.stringify(p)));
}

/** Fold a finished run into the lifetime profile. */
function recordRunEnd(state, won) {
  const p = loadProfile();
  p.runs++;
  if (won) p.wins++;
  p.bestAnte = Math.max(p.bestAnte, state.ante);
  p.bestHandScore = Math.max(p.bestHandScore, state.stats.bestHand);
  p.handsPlayed += state.stats.handsPlayed;
  const discovered = new Set(p.discoveredHands);
  for (const [key, v] of Object.entries(state.handLevels)) if (v.played > 0) discovered.add(key);
  p.discoveredHands = [...discovered];
  saveProfile(p);
  return p;
}

return { DEFAULT_SETTINGS, saveRun, loadRun, clearRun, hasRun, loadSettings, saveSettings, loadProfile, saveProfile, recordRunEnd };
});
