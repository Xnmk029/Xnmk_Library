<script>
const DB=__DATA__;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={'mimo-x-flash':'MiMo X Flash','pangu-2.0-flash':'Pangu 2.0 Flash','mimo-x-pro':'MiMo X Pro','pangu-2.0-pro':'Pangu 2.0 Pro','astra':'Astra','v4-pro-0902-gray':'V4 Pro · 0902 灰度','original':'参考原文'};
const fileChoices={};
let state={q:DB.questions[0].slug,view:'preview',ids:[],count:2,lock:false,sync:true},urls=[];
const original={id:'original',model:'original',file:'续写网文.md',content:DB.original,bytes:new TextEncoder().encode(DB.original).length,url:'../暂存/续写网文.md',path:'暂存/续写网文.md',source:'暂存/续写网文.md',verdict:'ORIGINAL',reference:true};
function candidates(){return [...DB.items.filter(x=>x.slug===state.q),...(state.q==='StyleContinuation'?[original]:[])];}
function defaults(){const xs=candidates();return [xs.find(x=>x.reference)?.id||xs[0].id,...xs.filter(x=>!x.reference).map(x=>x.id)];}
function normalize(){if(!DB.questions.some(q=>q.slug===state.q))state.q=DB.questions[0].slug;if(!['preview','source','diff'].includes(state.view))state.view='preview';state.count=[2,3,4].includes(+state.count)?+state.count:2;const xs=candidates(),used=new Set();state.ids=Array.from({length:state.count},(_,i)=>{let id=state.ids[i];if(!xs.some(x=>x.id===id)||used.has(id))id=defaults().find(x=>!used.has(x));used.add(id);return id;});}
function save(){const p=new URLSearchParams({q:state.q,view:state.view,ids:state.ids.join('|'),n:state.count,lock:state.lock?'1':'0',sync:state.sync?'1':'0',files:JSON.stringify(Object.fromEntries(state.ids.filter(id=>fileChoices[id]).map(id=>[id,fileChoices[id]])))});history.replaceState(null,'','#'+p);}

function preparedContent(x){
 let content=x.content;

 if(!version)return content;

 content=content.replace(/https:\/\/cdnjs\.cloudflare\.com\/ajax\/libs\/three\.js\/(0\.\d+\.\d+)\/(three\.min\.js)/g,(url,v,name)=>DB.vendor[v+'/'+name]||url);

}
function previewDoc(x){if(x.file.endsWith('.svg'))return '<!doctype html><html><head><style>html,body{margin:0;height:100%;display:grid;place-items:center;background:#ecebe5}svg{width:100%;height:100%;max-height:100vh}</style></head><body>'+x.content+'</body></html>';const content=preparedContent(x);const base='<base href="'+esc(absolute(x))+'">';return /<head[^>]*>/i.test(content)?content.replace(/<head[^>]*>/i,m=>m+base):base+content;}
function render(){document.body.style.overflow="";normalize();release();save();const q=DB.questions.find(x=>x.slug===state.q),n=DB.questions.indexOf(q)+1,xs=candidates();$('#nav').innerHTML=DB.questions.map((x,i)=>`<button class="question ${x.slug===state.q?'active':''}" data-q="${x.slug}" ${x.slug===state.q?'aria-current="page"':''}><small>0${i+1} / ${x.level} · ${x.slug==='StyleContinuation'?'TEXT':'VISUAL'}</small><strong>${esc(x.name)}</strong></button>`).join('');$('#category').textContent=q.level+' / '+q.domain+' / COMPARATIVE STUDY';$('#title').textContent=q.name;$('#number').textContent='0'+n;$('#description').textContent=state.q==='StyleContinuation'?'以原作剧情与文风为参照，阅读四个模型的续写。':'固定一个参照，在同一视窗尺度下观察不同模型的作品。';$('#count').value=state.count;$('#lock').textContent=state.lock?'基准已固定':'固定基准';$('#lock').setAttribute('aria-pressed',state.lock);$('#lock').classList.toggle('active',state.lock);$('#sync').textContent='同步滚动 · '+(state.sync?'开':'关');$('#sync').setAttribute('aria-pressed',state.sync);document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));$('#hint').textContent=state.view==='diff'?'差异以第一栏为基准 · 绿色新增 / 红色删除':state.q==='StyleContinuation'?'原文为题面断点之后的原作剧情 · 支持同步阅读':state.q==='VoxelLujiazui'?'V4 Pro 首次生成城市可能需要 8–15 秒 · 同步滚动不控制 3D 镜头':'每栏可切换模型 · 预览尺寸一致 · 可放大与独立打开';$('#footer-meta').textContent=`${xs.filter(x=>x.id!=='original').length} RESULTS / ${state.count} PANELS`;$('#grid').style.setProperty('--cols',state.count);$('#grid').className='grid'+(state.count===4?' four':'');state.ids.forEach((id,i)=>mount(xs.find(x=>x.id===id),i,xs));}

function mount(raw,i,xs){const x=activeFile(raw);const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="card-head"><div class="card-top"><span class="slot">${i===0?'A / BASELINE':String.fromCharCode(65+i)+' / COMPARE'}</span><span class="tag">${x.id==='original'?'ORIGINAL':x.reference?'SOTA REFERENCE':'MODEL OUTPUT'}</span><button data-action="expand" style="padding:2px 6px;font-size:10px">放大 ⤢</button></div><select class="model-select" aria-label="面板 ${i+1} 模型" ${i===0&&state.lock?'disabled':''}>${xs.map(v=>`<option value="${esc(v.id)}" ${v.id===x.id?'selected':''}>${esc(display(v))}</option>`).join('')}</select><div class="card-meta"><span>${(x.bytes/1024).toFixed(1)} KB</span><span>${esc(status(x))}</span></div><select class="file-select" aria-label="面板 ${i+1} 文件" style="margin-top:10px;width:100%;font:11px Consolas,monospace;padding:5px"><option value="${esc(raw.path)}">${esc(raw.file)}</option>${(raw.files||[]).filter(f=>f.path!==raw.path).map(f=>`<option value="${esc(f.path)}" ${f.path===x.path?'selected':''}>${esc(f.name)}</option>`).join('')}</select></div><div class="surface"></div><div class="card-foot"><button data-action="detail">来源与审阅 ↗</button><div class="foot-actions"><a target="_blank" rel="noopener" href="${esc(x.url)}">打开原文件 ↗</a></div></div>`;$('#grid').append(card);card.querySelector('select').onchange=e=>{const j=state.ids.indexOf(e.target.value);if(j===0&&state.lock&&i!==0){toast('基准已固定，请先解锁以交换面板');e.target.value=x.id;return}if(j>=0)state.ids[j]=x.id;state.ids[i]=e.target.value;render()};card.querySelector('.file-select').onchange=e=>{fileChoices[x.id]=e.target.value;render()};card.querySelector('[data-action=detail]').onclick=()=>details(x);card.querySelector('[data-action=expand]').onclick=e=>{const expanded=card.classList.toggle('expanded');e.target.textContent=expanded?'还原 ↙':'放大 ⤢';document.body.style.overflow=expanded?'hidden':''};const surface=card.querySelector('.surface');if(!x.content){surface.innerHTML='<div class="empty">缺少交付文件</div>';return}if(state.view==='diff'){surface.innerHTML='<div class="diff scrollable"></div>';const d=surface.firstChild;const base=activeFile(candidates().find(v=>v.id===state.ids[0]));d.innerHTML=i===0?`<div class="diff-summary">基准文件 / ${esc(display(x))}</div><pre style="height:auto;padding:0">${esc(x.content)}</pre>`:diffHTML(base.content,x.content);connectScroll(d);return}if(state.view==='source'||!(/\.(html?|svg)$/i.test(x.file))){const pre=document.createElement('pre');pre.className='scrollable'+(state.view==='preview'?' prose':'');pre.textContent=x.content;surface.append(pre);connectScroll(pre);return}const frame=document.createElement('iframe');frame.title=display(x)+' / '+x.file;frame.setAttribute('sandbox','allow-scripts allow-pointer-lock allow-modals');frame.srcdoc=previewDoc(x);surface.append(frame);}
// Myers shortest edit script: bounded work, with an explicit fallback for unrelated large files.
function edits(a,b){const max=a.length+b.length,v=new Map([[1,0]]),trace=[];let work=0;for(let d=0;d<=max;d++){if(d>1400||work>2000000)return null;trace.push(new Map(v));for(let k=-d;k<=d;k+=2){work++;let x=k===-d||(k!==d&&(v.get(k-1)??-Infinity)<(v.get(k+1)??-Infinity))?(v.get(k+1)||0):(v.get(k-1)||0)+1;let y=x-k;while(x<a.length&&y<b.length&&a[x]===b[y]){x++;y++}v.set(k,x);if(x>=a.length&&y>=b.length){const out=[];let ax=a.length,by=b.length;for(let dd=d;dd>=0;dd--){const vv=trace[dd],kk=ax-by,pk=kk===-dd||(kk!==dd&&(vv.get(kk-1)??-Infinity)<(vv.get(kk+1)??-Infinity))?kk+1:kk-1,px=vv.get(pk)||0,py=px-pk;while(ax>px&&by>py){out.push(['eq',a[--ax]]);by--}if(dd>0){if(ax===px)out.push(['add',b[--by]]);else out.push(['del',a[--ax]])}}return out.reverse()}}}return []}
function diffHTML(left,right){const a=left.replace(/\r/g,'').split('\n'),b=right.replace(/\r/g,'').split('\n');let ops=edits(a,b),fallback=false;if(!ops){fallback=true;let start=0;while(start<a.length&&start<b.length&&a[start]===b[start])start++;let end=0;while(end<a.length-start&&end<b.length-start&&a[a.length-1-end]===b[b.length-1-end])end++;ops=[...a.slice(0,start).map(l=>['eq',l]),...a.slice(start,a.length-end).map(l=>['del',l]),...b.slice(start,b.length-end).map(l=>['add',l]),...a.slice(a.length-end).map(l=>['eq',l])];}return `<div class="diff-summary">+ ${ops.filter(o=>o[0]==='add').length} 新增 / − ${ops.filter(o=>o[0]==='del').length} 删除${fallback?' · 大文件使用共同首尾段对齐':''}</div>`+ops.map(([t,l])=>`<div class="diff-row ${t}"><span>${t==='add'?'+':t==='del'?'−':'·'}</span><span>${esc(l)||' '}</span></div>`).join('');}
let scrolling=false;function connectScroll(el){el.addEventListener('scroll',()=>{if(!state.sync||scrolling)return;scrolling=true;const ratio=el.scrollTop/Math.max(1,el.scrollHeight-el.clientHeight);document.querySelectorAll('.scrollable').forEach(other=>{if(other!==el)other.scrollTop=ratio*(other.scrollHeight-other.clientHeight)});requestAnimationFrame(()=>scrolling=false)})}

function details(x){show(display(x)+' / 来源与审阅',`<dl><dt>统一模型 ID</dt><dd>${esc(x.model)}</dd><dt>身份依据</dt><dd>${x.id==='original'?'用户提供原文':'用户确认'}</dd><dt>批次 / 版本</dt><dd>${esc(x.batch||'原文')}</dd><dt>来源</dt><dd>${esc(x.source)}</dd><dt>实际文件</dt><dd><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.path)}</a></dd><dt>审阅结论</dt><dd>${esc(status(x))}（不等同作品质量评分）</dd></dl><button id="copy-path">复制文件路径</button><p style="color:var(--muted);font-size:11px">预览按原文件声明版本使用本地 Three.js 缓存；源码与原文件保持原样。</p><h3>原始自报 · 未覆盖原始记录</h3><pre>${esc(JSON.stringify(x.selfReport||{},null,2))}</pre><h3>检查项 (${(x.checks||[]).length})</h3><table>${(x.checks||[]).map(c=>`<tr><td>${esc(c.id)}</td><td>${esc(c.status)}</td><td>${esc(c.detail)}</td></tr>`).join('')}</table><h3>审阅全文</h3><pre>${esc(x.review||'未提供独立审阅报告')}</pre><h3>运行日志</h3><pre>${esc(x.log||'无日志')}</pre>`);$('#copy-path').onclick=()=>copy(decodeURI(absolute(x)))}
async function copy(value){try{await navigator.clipboard.writeText(value);toast('已复制')}catch(e){const ta=document.createElement('textarea');ta.value=value;document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();toast(ok?'已复制':'复制失败，请从地址栏或来源详情复制')}}
$('#nav').onclick=e=>{const b=e.target.closest('[data-q]');if(b){document.body.style.overflow='';state.q=b.dataset.q;state.ids=[];render()}};$('#views').onclick=e=>{const b=e.target.closest('[data-view]');if(b){state.view=b.dataset.view;render()}};$('#count').onchange=e=>{state.count=+e.target.value;render()};$('#lock').onclick=()=>{state.lock=!state.lock;render()};$('#sync').onclick=()=>{state.sync=!state.sync;render()};$('#reload').onclick=()=>render();$('#prompt').onclick=()=>show('题面 / '+DB.questions.find(q=>q.slug===state.q).name,'<pre>'+esc(DB.questions.find(q=>q.slug===state.q).prompt)+'</pre>');$('#close-dialog').onclick=()=>$('#dialog').close();$('#share').onclick=()=>copy(location.href);document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.expanded').forEach(c=>{c.classList.remove('expanded');c.querySelector('[data-action=expand]').textContent='放大 ⤢'});document.body.style.overflow=''}});window.addEventListener('hashchange',()=>{readHash();render()});window.addEventListener('beforeunload',release);readHash();render();
