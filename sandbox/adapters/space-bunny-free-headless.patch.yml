# Per-run overlay for independent DSH headless benchmark conversations.
# It supplies only the model route and default selection; the base/headless
# filesystem sandbox and one-shot runner remain unchanged.
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: opencode-zen-chat
    model: space-bunny-free
    reasoningEffort: max

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      opencode-zen-chat:
        displayName: OpenCode Zen (Chat)
        apiKeyEnv: OPENCODE_GO_API_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/v1
        defaultInput:
          - text
        models:
          - id: space-bunny-free
            name: Space Bunny Free
            contextWindow: 1048576
            maxTokens: 524288
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
            compat:
              supportsStore: false
              supportsDeveloperRole: false
              supportsReasoningEffort: true
              maxTokensField: max_tokens
              thinkingFormat: deepseek
              requiresReasoningContentOnAssistantMessages: false

# The benchmark contract forbids delegation. Disable both the model-facing
# subagent tools and their host/follow-up services for every one-shot run.
- id: subagent
  disabled: true
- id: subagent-spawn-in-process
  disabled: true
- id: subagent-fork-in-process
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: workflow-ptc
  disabled: true
- id: tool-workflow
  disabled: true
# Prevent benchmark transcripts from importing unrelated host skill paths.
- id: tool-skill
  disabled: true

