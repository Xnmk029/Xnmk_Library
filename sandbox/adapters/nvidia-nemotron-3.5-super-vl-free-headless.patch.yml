# Process-local benchmark overlay for independent NVIDIA Nemotron runs via
# OpenRouter. Pins the model route for this process only; no persistent DSH
# profile is modified. Shell, filesystem and web tools stay under the stock
# sandbox policy.
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: or
    model: nvidia/nemotron-3.5-super-vl:free
    # Without this line DSH omits reasoning_effort from the wire request and the
    # server default applies. Verified by packet capture, not by declaration:
    # absent -> no reasoning_effort field; present -> "reasoning_effort": "max".
    reasoningEffort: max

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      or:
        displayName: openrouter
        apiKeyEnv: OR_API_KEY
        api: openai-completions
        baseURL: https://openrouter.ai/api/v1
        defaultInput:
          - text
          - image
        models:
          - id: nvidia/nemotron-3.5-super-vl:free
            name: "NVIDIA: Nemotron 3.5 Super VL (free)"
            contextWindow: 1000000
            maxTokens: 131072
            input:
              - text
              - image
            reasoningEfforts:
              off: none
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
            compat:
              thinkingFormat: openrouter

# No delegation: the tested session is a single independent conversation.
- id: subagent
  disabled: true
- id: subagent-spawn-in-process
  disabled: true
- id: subagent-fork-in-process
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: workflow-ptc
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-skill
  disabled: true
