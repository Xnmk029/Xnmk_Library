# Process-local benchmark overlay for one DeepSeek V4.1 Flash (opendes) run.
# It pins the model route for this process only and disables delegation,
# workflow, skill and goal rows. No persistent DSH profile is modified.
# Shell, filesystem and web tools stay available under the stock sandbox policy.
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: opendes
    model: deepseek-v4.1-flash

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      opendes:
        displayName: OpenDesign
        apiKeyEnv: OPENDES_API_KEY
        api: openai-completions
        baseURL: https://amr-link.open-design.ai/v1
        models:
          - id: deepseek-v4.1-flash
            name: deepseek-v4.1-flash
            contextWindow: 1048000
            maxTokens: 232000
            input:
              - text
              - image
            reasoningEfforts:
              off: none
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
            compat:
              supportsReasoningEffort: true

# No delegation: the tested session is a single independent conversation.
- id: subagent
  disabled: true
- id: subagent-spawn-in-process
  disabled: true
- id: subagent-fork-in-process
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: workflow-ptc
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-skill
  disabled: true
