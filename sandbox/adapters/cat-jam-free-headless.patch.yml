# Process-local benchmark overlay for independent cat-jam-free (opencode-go) runs.
# It pins the model route for this process only; no persistent DSH profile is
# modified. Shell, filesystem and web tools stay under the stock sandbox policy.
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: opencode-go
    model: cat-jam-free
    # Without this line DSH omits reasoning_effort from the wire request and the
    # server default applies. Verified by packet capture, not by declaration:
    # absent -> no reasoning_effort field; present -> "reasoning_effort": "max".
    reasoningEffort: max

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      opencode-go:
        displayName: OpenCode Go
        apiKeyEnv: OPENCODE_GO_API_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/go/v1
        # Required by the Go routing layer: without it the API answers
        # 400 MissingSessionID ("cannot be routed efficiently"). The web
        # profile likewise pins one session id per provider block.
        headers:
          x-opencode-session: bench-cat-jam-free
        models:
          - id: cat-jam-free
            name: Cat Jam Free
            contextWindow: 262144
            maxTokens: 131072
            input:
              - text
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
            compat:
              supportsReasoningEffort: true
              requiresReasoningContentOnAssistantMessages: true

# No delegation: the tested session is a single independent conversation.
- id: subagent
  disabled: true
- id: subagent-spawn-in-process
  disabled: true
- id: subagent-fork-in-process
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: workflow-ptc
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-skill
  disabled: true
